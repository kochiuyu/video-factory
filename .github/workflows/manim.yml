name: Animated scenes

on:
  pull_request:
    paths:
      - factory/anim.py
      - factory/scene_registry.py
      - factory/test_anim.py
      - factory/build.py
      - factory/validate.py
      - factory/slides.py
      - requirements-manim.txt
      - examples/demo-ten-and-ones.yaml
      - .github/workflows/manim.yml
  push:
    branches: [main]
    paths:
      - factory/anim.py
      - factory/scene_registry.py
      - factory/test_anim.py
      - factory/build.py
      - factory/validate.py
      - factory/slides.py
      - requirements-manim.txt
      - examples/demo-ten-and-ones.yaml
      - .github/workflows/manim.yml

permissions:
  contents: read

jobs:
  manim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-manim.txt
      - name: Cairo, Pango, and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev python3-dev ffmpeg fonts-noto-cjk
      - name: Install factory and optional Manim
        run: python -m pip install -r requirements.txt -r requirements-manim.txt
      - name: Animated-scene tests
        run: python -m unittest discover -s factory -p test_anim.py
