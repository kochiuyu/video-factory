# Shape fixture for the dev_bars visual. Not a lesson and not in lessons/.
id: DEV-BARS-FIXTURE
title_en: Deviation bars fixture
title_zh: 偏差条示例
title_zh_hk: 偏差棒示例
duration_target_s: 48
beats:
- id: distance
  visual: dev_bars
  seconds: 12
  kicker_en: Distances
  kicker_zh: 距离
  kicker_zh_hk: 距離
  title_en: Each day minus 365
  title_zh: 每天减去365
  title_zh_hk: 每日減365
  values: 300;330;365;400;430
  mean: 365
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  footer_en: 'Minus: below 365. Plus: above 365.'
  footer_zh: 负号：低于365；正号：高于365
  footer_zh_hk: 負號：低過365；正號：高過365
  s1_en: Each day is a dot above or below the mean line.
  s1_zh: 每天是一个点，在平均线的上面或下面。
  s1_zh_hk: 每日係一個點，喺平均線上面或者下面。
  s2_en: Bars show each signed distance.
  s2_zh: 每根条显示带正负号的距离。
  s2_zh_hk: 每條棒顯示帶正負號嘅距離。
  s3_en: The far days light up.
  s3_zh: 离得最远的两天亮起来。
  s3_zh_hk: 離得最遠嗰兩日亮起嚟。
- id: squares
  visual: dev_bars
  seconds: 12
  title_en: Times itself
  title_zh: 自己乘自己
  title_zh_hk: 自己乘自己
  values: 300;330;365;400;430
  mean: 365
  power: 2
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  footer_en: Sum of squares = 10,900
  footer_zh: 平方之和 = 10,900
  footer_zh_hk: 平方之和 = 10,900
  s1_en: Each distance times itself; every bar points up.
  s1_zh: 每个距离乘以自己，每根条都朝上。
  s1_zh_hk: 每個距離乘自己，每條棒都向上。
  s2_en: Read the squares; the far days tower.
  s2_zh: 读出平方，远的两天变得很高。
  s2_zh_hk: 讀出平方，遠嗰兩日變到好高。
  s3_en: Add them.
  s3_zh: 加起来。
  s3_zh_hk: 加埋佢哋。
- id: two_shops
  visual: dev_bars
  seconds: 12
  title_en: Shop A beside Shop B
  title_zh: A店和B店并排
  title_zh_hk: A店同B店並排
  values: 300;330;365;400;430
  values_b: 350;360;365;370;380
  mean: 365
  power: 2
  mark: none
  name_a_en: Shop A
  name_a_zh: A店
  name_a_zh_hk: A店
  name_b_en: Shop B
  name_b_zh: B店
  name_b_zh_hk: B店
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  footer_en: 'B: 500 / 5 = 100'
  footer_zh: B店：500 / 5 = 100
  footer_zh_hk: B店：500 / 5 = 100
  s1_en: Two shops, signed distances.
  s1_zh: 两家店，带正负号的距离。
  s1_zh_hk: 兩間店，帶正負號嘅距離。
  s2_en: Squares for both shops.
  s2_zh: 两家店的平方。
  s2_zh_hk: 兩間店嘅平方。
  s3_en: B's sum shared over five days.
  s3_zh: B店的和平均分给五天。
  s3_zh_hk: B店嘅和平均分畀五日。
- id: cubes
  visual: dev_bars
  seconds: 12
  title_en: Cubes keep the sign
  title_zh: 立方保留正负号
  title_zh_hk: 立方保留正負號
  values: 90;95;100;105;140
  mean: 106
  power: 3
  s1_en: Uneven distances, no labels.
  s1_zh: 不对称的距离，没有标签。
  s1_zh_hk: 唔對稱嘅距離，冇標籤。
  s2_en: Cubes keep the sign; the long side wins.
  s2_zh: 立方保留正负号，长的一边胜出。
  s2_zh_hk: 立方保留正負號，長嗰邊贏。
  s3_en: The far day lights up.
  s3_zh: 最远的一天亮起来。
  s3_zh_hk: 最遠嗰日亮起嚟。
- id: fourths_std
  visual: dev_bars
  seconds: 12
  title_en: Fourth powers against the spread
  title_zh: 四次方，和分散比
  title_zh_hk: 四次方，同分散比
  values: 52;64;100;136;148
  values_b: 40;100;100;100;160
  mean: 100
  power: 4
  standardize: true
  mark: none
  name_a_en: Shop A
  name_a_zh: A店
  name_a_zh_hk: A店
  name_b_en: Shop B
  name_b_zh: B店
  name_b_zh_hk: B店
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  tag_en: FOURTH POWER / σ⁴
  tag_zh: 四次方 / σ⁴
  tag_zh_hk: 四次方 / σ⁴
  footer_en: A 6.74 / 5 ≈ 1.3 · B 12.5 / 5 = 2.5
  footer_zh: A 6.74 / 5 ≈ 1.3 · B 12.5 / 5 = 2.5
  footer_zh_hk: A 6.74 / 5 ≈ 1.3 · B 12.5 / 5 = 2.5
  s1_en: Muted bars, both shops.
  s1_zh: 两家店，淡色的条。
  s1_zh_hk: 兩間店，淡色嘅棒。
  s2_en: Each fourth power divided by sigma to the fourth; small plain numbers.
  s2_zh: 每个四次方除以西格玛的四次方，得到小的普通数。
  s2_zh_hk: 每個四次方除以西格瑪嘅四次方，得到細嘅普通數。
  s3_en: The average of each row is the kurtosis.
  s3_zh: 每一行的平均就是峰度。
  s3_zh_hk: 每一行嘅平均就係峰度。
