  title_en: The last tray of egg tarts
  title_zh: 最后一盘蛋挞
  title_zh_hk: 最後一盤蛋撻
  image: art/tarts-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: You run a Hong Kong bakery. Twelve egg tarts sit on the counter as you turn the sign to Closed. The café next door offers to take the whole tray. You have no other buyer or use for it tonight.
  zh: 你在香港开一家面包店。你把“打烊”的牌子翻过去的时候，柜台上还放着十二个蛋挞。隔壁咖啡店要把整盘都拿走。今晚没有别的买家，这盘挞也没有别的用处。
  zh_hk: 你喺香港開住一間麵包店。你將「打烊」個牌翻轉嗰陣，櫃面上仲擺住十二個蛋撻。隔籬間咖啡店想將成盤都拿走。今晚冇第二個買家，呢盤撻都冇第二樣用途。

