  s1_en: Here are tonight's closing figures, in Hong Kong dollars per tart.
  s1_zh: 先看今晚打烊的资料，单位是每个蛋挞多少港元。
  s1_zh_hk: 先睇今晚打烊嘅資料，單位係每個蛋撻幾多港元。
  s2_en: The baking cost of eight dollars per tart has already been incurred. The café offers six dollars per tart. The incremental cost of selling the tray is zero.
  s2_zh: 每个挞的烘焙成本已经发生，是八港元。咖啡店每个出价六港元。卖掉整盘，出售的增量成本是零。
  s2_zh_hk: 每個撻嘅烘焙成本已經發生，係八港元。咖啡店出價每個六港元。賣走成盤，出售嘅增量成本係零。
  s3_en: There are twelve tarts on the tray.
  s3_zh: 盘上一共十二个蛋挞。
  s3_zh_hk: 盤上面一共有十二個蛋撻。

- id: pause1
  visual: title_card
  seconds: 18
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决定
  kicker_zh_hk: 決定
  title_en: Would you sell all twelve?
  title_zh: 这十二个，你卖不卖？
  title_zh_hk: 呢十二個，你賣唔賣？
  en: Would you sell all twelve? Show the difference tonight's choice makes to cash. Pause here, vote, and compare your reasons.
  zh: 这十二个，你卖不卖？算清楚今晚这个选择，会让现金差多少。先停一停，投个票，再比较各自的理由。
  zh_hk: 呢十二個，你賣唔賣？計清楚今晚呢個選擇，會令現金差幾多。喺度停一停，投個票，再比較大家嘅理由。

