  s1_en: Sell in round one.
  s1_zh: 第一轮，卖掉。
  s1_zh_hk: 第一輪，賣掉。
  s2_en: "Under both choices, the ninety-six dollar baking cost has already been incurred: that is twelve tarts times eight dollars. That cost is a sunk cost."
  s2_zh: 两个方案下，九十六港元的烘焙成本都已经发生了：十二个挞乘以八港元。这笔成本是沉没成本。
  s2_zh_hk: 兩個方案之下，九十六港元嘅烘焙成本都已經發生咗：十二個撻乘以八港元。呢筆成本係沉沒成本。
  s3_en: "Selling brings in seventy-two dollars more cash than discarding: twelve times the six-dollar offer, and the incremental cost of selling is zero."
  s3_zh: 卖掉比丢弃多流入七十二港元现金：十二乘以六港元的出价，而且出售的增量成本是零。
  s3_zh_hk: 賣掉比丟棄多流入七十二港元現金：十二乘以六港元嘅出價，而且出售嘅增量成本係零。

- id: reveal
  visual: title_card
  seconds: 22
  kicker: New fact
  kicker_en: New fact
  kicker_zh: 新事实
  kicker_zh_hk: 新事實
  title_en: One fact changes
  title_zh: 一个事实变了
  title_zh_hk: 一個事實變了
  en: Your pastry chef checks tomorrow's orders. Keeping the tray for bread pudding would give a cost saving of seven dollars per tart in other ingredients, after extra preparation costs. Demand for pudding is already confirmed.
  zh: 糕点师傅看了明天的订单。如果把这盘留下来做面包布丁，扣掉额外的准备成本以后，每个挞能节省七港元的其他材料成本。布丁的需求已经确定了。
  zh_hk: 糕點師傅睇過聽日嘅訂單。如果留低呢盤嚟做麵包布甸，扣走額外準備成本之後，每個撻可以慳到七港元嘅其他材料成本。布甸嘅需求已經確定咗。

- id: pause2
  visual: title_card
  seconds: 18
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决定
  kicker_zh_hk: 決定
  title_en: Does the café get the tray now?
  title_zh: 现在还会卖给咖啡店吗？
  title_zh_hk: 而家仲會唔會賣俾咖啡店？
  en: Does the café get the tray now? What offer would leave you indifferent? Pause here and vote again.
  zh: 现在还会把这盘卖给咖啡店吗？怎样的出价会让你无差异？先停一停，再投一次票。
  zh_hk: 而家仲會唔會將呢盤賣俾咖啡店？咩出價會令你無差異？喺度停一停，再投多一次票。

