  footer_en: "Indifference offer: HK$7 per tart"
  footer_zh: 无差异出价：每挞 7 港元
  footer_zh_hk: 無差異出價：每撻 7 港元
  s1_en: "Keeping the tray now saves eighty-four dollars of cost: twelve tarts times seven dollars."
  s1_zh: 现在把这盘留下来，能节省八十四港元的成本：十二个挞乘以七港元。
  s1_zh_hk: 而家留低呢盤，可以慳到八十四港元嘅成本：十二個撻乘以七港元。
  s2_en: That cost saving is the opportunity cost of selling. Selling for seventy-two dollars would leave you twelve dollars worse off.
  s2_zh: 这笔可节省的成本，就是出售的机会成本。如果按七十二港元卖掉，你会少得十二港元。
  s2_zh_hk: 呢筆可節省嘅成本，就係出售嘅機會成本。如果按七十二港元賣掉，你會少得十二港元。
  s3_en: The offer that leaves you indifferent is seven dollars per tart.
  s3_zh: 让你无差异的出价，是每个挞七港元。
  s3_zh_hk: 令你無差異嘅出價，係每個撻七港元。

- id: check
  visual: title_card
  seconds: 24
  kicker: Check
  kicker_en: Check
  kicker_zh: 追问
  kicker_zh_hk: 追問
  title_en: What would change the answer?
  title_zh: 什么会改变这个答案？
  title_zh_hk: 咩會改變呢個答案？
  en: If you chose eight dollars as the indifference offer, what changes in cash when yesterday's baking cost is included in both alternatives? If you chose seven, how would an uncertain pudding order change the cost saving?
  zh: 如果你把无差异出价定成八港元，那么把昨天已发生的烘焙成本计入两个方案时，现金会有什么变化？如果你选的是七港元，万一布丁的订单还不确定，可节省的成本又会怎么变？
  zh_hk: 如果你將無差異出價定成八港元，咁將昨日已發生嘅烘焙成本記入兩個方案嗰陣，現金會有咩變化？如果你揀嘅係七港元，萬一布甸訂單仲未確定，可節省嘅成本又會點變？

- id: takeaway
  visual: takeaway
  seconds: 26
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Tonight's choice
  title_zh: 今晚的选择
  title_zh_hk: 今晚的選擇
  q1_en: The difference in cash from here
  q1_zh: 从现在起的现金差额
  q1_zh_hk: 從現在起的現金差額
  q2_en: Sunk cost; compare the next-best use
  q2_zh: 烘焙成本已是沉没成本；比较次佳用途
  q2_zh_hk: 烘焙成本已是沉沒成本；比較次佳用途
  s1_en: Tonight's choice is the difference it makes to cash from here. Look only at relevant cash flows.
  s1_zh: 今晚要做的选择，就是从现在起，现金会差多少。只看相关的现金流量。
  s1_zh_hk: 今晚要做嘅選擇，就係由而家計起，現金會差幾多。只睇相關嘅現金流量。
  s2_en: The baking cost has already been incurred, whether you sell or keep the tray. It is a sunk cost.
  s2_zh: 烘焙成本已经发生，不管你是卖掉还是留下这盘。这是沉没成本。
  s2_zh_hk: 烘焙成本已經發生，無論你賣走定留低呢盤。呢筆係沉沒成本。
  s3_en: "Compare the café's offer with the next-best use you actually have: that is the opportunity cost."
  s3_zh: 要把咖啡店的出价，跟你实际拥有的次佳用途比一比，也就是机会成本。
  s3_zh_hk: 要把咖啡店嘅出價，同你實際擁有嘅次佳用途比一比，即係機會成本。
