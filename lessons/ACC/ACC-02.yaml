  s1_en: Here is the same next-quarter forecast, under two allocation rules, in Hong Kong dollars.
  s1_zh: 这是同一份下季度预测，按两种分摊方法列出，单位是港元。
  s1_zh_hk: 呢張係同一份下季預測，用兩種分攤方法列出，單位係港元。
  s2_en: Sales stay at HK$600,000. Branch operating costs stay at HK$450,000, and rent stays at HK$100,000.
  s2_zh: 销售额仍然是60万港元。门店运营成本仍然是45万港元，租金仍然是10万港元。
  s2_zh_hk: 銷售額依然係60萬港元。分店營運成本依然係45萬港元，租金依然係10萬港元。
  s3_en: Allocated head-office costs rise from HK$40,000 to HK$80,000. The reported result falls from a HK$10,000 profit to a HK$30,000 loss. The table does not yet tell you which payments would stop if East closes.
  s3_zh: 分摊的总部成本从4万加到8万港元。于是门店报告的业绩，就从盈利1万港元，变成亏损3万港元。光看这张表，还不能判断：关掉东区门店以后，哪些钱真的不用付了。
  s3_zh_hk: 分攤嘅總部成本由4萬加到8萬港元。於是分店呈報嘅業績，就由盈利1萬港元，變成虧損3萬港元。單係睇呢張表，你仲未知道：東區分店結業之後，邊啲錢真係唔使付。

- id: pause1
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: Close East or keep it?
  title_zh: 东区门店，下季度关还是留？
  title_zh_hk: 東區分店，結業定留？
  en: Close East, or keep it for next quarter? Give a provisional recommendation, and name the cost information you still need before acting. Pause here, vote, and compare your reasons.
  zh: 东区门店下季度是关掉，还是继续开？请先给一个初步建议，再说你行动前还要核实哪些成本信息。先在这里停一下，投个票，再跟旁边的同学比较理由。
  zh_hk: 東區分店下季繼續開，定係結業？你先畀個初步建議，再講清楚仲要查邊啲成本資料。喺度停一停，投個票，再同隔籬比較你嘅理由。

- id: reveal
  visual: title_card
  seconds: 28
  kicker: New fact
  kicker_en: New fact
  kicker_zh: 新事实
  kicker_zh_hk: 新事實
  title_en: One fact changes
  title_zh: 补充信息
  title_zh_hk: 補充資料
  en: >-
    The finance team confirms that total head-office expenditure will remain HK$200,000 next quarter, whether East stays open or closes. East's HK$80,000 allocation would simply be reassigned to the remaining branches. This is future expenditure still to be paid, not a sunk cost. If East closes now, the HK$450,000 of branch operating costs and the HK$100,000 rent will be avoided next quarter. The lease expires this quarter and can end without penalty. There are no other closure costs, no sales transferred to another branch, no other effects on the chain, and no feasible alternative use generating income next quarter. Those simplifying assumptions are given for this fictional decision.
  zh: >-
    财务部门确认，东区门店开不开，下季度总部支出都还是20万港元。原先分给东区的8万港元，只会改由其他门店承担。这笔钱下季度才要付，不是沉没成本。如果现在关店，下季度就可以省下门店运营成本45万港元，还有租金10万港元。租约本季度到期，终止不用付违约金。题设还包括：没有其他关店成本，销售不会转到别的门店，连锁店不受其他影响，下季度也没有能带来收入的可行替代用途。这些都是这个虚构案例给定的假设。
  zh_hk: >-
    財務部確認，無論東區分店開定關，總部下季開支依然係20萬港元。原先分到東區嘅8萬港元，只會改由其他分店承擔。呢筆錢下季先要付，並非沉沒成本。若東區分店而家結業，下季就可以省回全部營運成本45萬港元，同埋10萬港元租金。租約本季屆滿，終止唔使付罰款。題設仲包括：冇其他結業成本，冇銷售轉去其他分店，連鎖店唔受其他影響，下季亦冇能帶來收入嘅可行替代用途。呢啲都係呢個虛構案例已經寫明嘅假設。

- id: pause2
  visual: title_card
  seconds: 18
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: What changes for the company?
  title_zh: 整个公司的业绩有什么变化？
  title_zh_hk: 全公司究竟有甚麼改變？
  en: Does closing East improve the whole company's next-quarter result? Calculate the change. Then say whether East's manager became a worse performer merely because the allocation changed. Pause here and vote again.
  zh: 关掉东区门店，能不能让公司下季度的整体业绩变好？请先算一算差额。接着再判断：只是分摊方法改了，能不能说店长的表现就变差了？先在这里停一下，再投一次票。
  zh_hk: 關咗東區分店，全公司下季業績會唔會好啲？你計一計差額。跟住再講：純粹因為分攤方法改咗，分店經理嘅表現係咪就變差？喺度停一停，再投一次票。

