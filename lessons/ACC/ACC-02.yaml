  s1_en: Compare the whole company with and without East.
  s1_zh: 我们比一比，全公司保留和关掉东区门店，分别会怎么样。
  s1_zh_hk: 我哋比較一下，全公司保留同結業東區分店，分別會點。
  s2_en: >-
    Keeping East brings HK$600,000 of sales, and HK$550,000 of avoidable branch costs that disappear if it closes. East therefore adds HK$50,000 toward common costs. Closing saves HK$550,000 but loses HK$600,000, so the company's result is HK$50,000 worse next quarter.
  s2_zh: >-
    保留它，能带来60万港元销售额，也会发生关店就能省掉的55万港元可避免的门店成本。所以它对共同成本的贡献是5万港元。关店能省下55万，却要失去60万的销售额，公司下季度业绩反而少5万港元。
  s2_zh_hk: >-
    保留佢，可以帶來60萬港元銷售額，又要支付55萬港元可避免嘅分店成本，結業後就可以免掉。即係對共同成本嘅貢獻有5萬港元。結業雖然省55萬，卻失去60萬銷售額，全公司下季業績反而差5萬港元。
  s3_en: The unchanged HK$200,000 head-office total is present in both alternatives, and it cancels in the comparison.
  s3_zh: 两个方案都有20万港元的总部支出，比差额的时候，这笔钱互相抵消。
  s3_zh_hk: 兩個方案都一樣有20萬港元總部開支，比較嘅時候可以互相抵銷。

- id: debrief_why
  visual: title_card
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A charge moved, not a cost saved
  title_zh: 成本换了门店承担，却一分没省
  title_zh_hk: 改分攤不等於省開支
  en: >-
    Moving a charge is not removing an expense. The new allocation lowers East's reported result by HK$40,000, from a HK$10,000 profit to a HK$30,000 loss, without changing the forecast of its activity or the group's head-office bill. If East closes, the remaining branches receive larger charges. Treating that reassignment as a cash saving would confuse the reporting system with the operating decision. The allocation change alone is not evidence of weaker managerial performance.
  zh: >-
    换个门店来承担，不等于省了钱。分摊方法一换，东区门店报告的业绩就少4万港元，从盈利1万变成亏损3万。但门店运营预测没变，集团的总部支出也没变。关店以后，其他门店反而要分摊更多。把这种账面上的转移，当成现金节省，就把成本报告和经营决策搞混了。仅仅分摊方法变了，也不能说明店长的工作变差了。
  zh_hk: >-
    改由別人入帳，唔等於省咗開支。換咗分攤方法，東區分店嘅呈報業績少咗4萬港元，由盈利1萬變成虧損3萬。但分店營運預測無變，集團總部開支亦無變。東區若結業，其他分店只會多分一啲成本。將帳面上嘅轉移當成現金節省，就混淆咗成本呈報同實際經營決定。單係分攤方法改變，唔能夠證明經理表現退步。

- id: check
  visual: title_card
  seconds: 24
  kicker: Check
  kicker_en: Check
  kicker_zh: 检查
  kicker_zh_hk: 檢查
  title_en: What would change the answer?
  title_zh: 什么情况会改变答案？
  title_zh_hk: 甚麼情況會改變答案？
  en: >-
    Under these next-quarter assumptions, keep East rather than close it. That does not prove East should operate forever. A feasible alternative use, different demand, genuinely avoidable central resources, or further costs could change a later decision. Do not assume a cost is avoidable just because it is labelled direct, or unavoidable just because it is labelled fixed. If you thought closing saved HK$80,000, who pays the head-office bill afterward?
  zh: >-
    按照题里给的下季度假定，应该保留东区门店，而不是关掉它。但这并不说明，它永远都该开下去。万一有了可行的替代用途、需求变了、部分总部资源确实能省掉，或者出现额外支出，以后的决定可能就不一样。不要一看到「直接成本」就认定它是可避免成本，也不要一看到「固定成本」就认定省不了。如果你刚才觉得关店能省下8万港元，那以后总部的账单，又由谁来付？
  zh_hk: >-
    按題設嘅下季假設，東區分店應該繼續經營，而唔係結業。但呢個唔代表佢永遠都應該開落去。若有可行嘅替代用途、需求有變、部分總部資源確實可以省掉，或者另有開支，日後嘅決定可能不同。別以為「直接成本」一定可避免，亦別以為「固定成本」一定不可避免。如果你以為結業可以省起8萬港元，咁之後又係邊個嚟付總部嘅帳單？

- id: takeaway
  visual: takeaway
  seconds: 22
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Two reporting questions
  title_zh: 两个不同的业绩问题
  title_zh_hk: 兩個不同的業績問題
  q1_en: Which revenues and costs actually change
  q1_zh: 哪些收入和成本真的会变
  q1_zh_hk: 哪些收入同成本真係會變
  q2_en: What the manager controls, not reassigned charges
  q2_zh: 店长能控制的，不是重新分摊的支出
  q2_zh_hk: 經理能控制的，不是重新分攤的費用
  s1_en: For this closure decision, ask which revenues and costs actually change.
  s1_zh: 决定要不要关店，要看哪些收入和成本真的会变。
  s1_zh_hk: 要決定是否結業，應該看哪些收入同成本真係會變。
  s2_en: For assessing the manager, distinguish what the manager controls from charges reassigned by head office.
  s2_zh: 评价店长时，要把店长能控制的事项，和总部重新分摊的支出区分开。
  s2_zh_hk: 評核經理嘅時候，要區分佢可以控制嘅項目，與總部重新分攤嘅費用。
  s3_en: Tsui Wah's report is a real example of network changes, not evidence that any real closure arose from an allocation error. The figures in this case are fictional classroom assumptions.
  s3_zh: 翠华的年报，是门店布局调整的真实例子，并不能说明某次真实关店，是因为分摊出了错。这个案例里的数字，都是虚构的课堂假设。
  s3_zh_hk: 翠華嘅年報，係真實嘅店舖網絡調整例子，亦唔能夠證明某次真實結業，係因為分攤出錯。呢個案例入面嘅數字，都係虛構嘅課堂假設。
