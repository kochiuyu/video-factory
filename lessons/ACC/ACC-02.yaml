  title_en: Close the loss-making branch?
  title_zh: 亏损的门店，要不要关？
  title_zh_hk: 虧損的分店，應該結業嗎？
  image: art/branch-loss-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In July 2025, Tsui Wah reported closing two Hong Kong restaurants and opening four after a network review. That is background only. You manage a fictional stationery-and-printing chain in Hong Kong. After a change in how head-office costs are shared, East Branch's next-quarter forecast now shows a HK$30,000 loss. Sales and branch-level costs have not changed. The chief executive asks whether to close East at the end of this quarter.
  zh: >-
    2025年7月，翠华的年报写到，集团检视香港门店布局以后，关了两家餐厅，又开了四家。这只是背景。你管理的是一家虚构的香港连锁文印店。总部改了成本分摊方法以后，东区门店下季度的预测变成亏损3万港元。销售额和门店自己的成本并没有变。总经理问你：本季度末，要不要关掉东区门店？
  zh_hk: >-
    2025年7月，翠華年報提到，集團檢視香港店舖網絡之後，關咗兩間餐廳，又開咗四間。呢個只係背景。你而家管理嘅，係一間虛構嘅香港連鎖文具印務店。總部改咗成本分攤方法之後，東區分店下季嘅預測變成虧損3萬港元。分店銷售同埋自身成本都無變。行政總裁問你：本季末，應唔應該將東區分店結業？

