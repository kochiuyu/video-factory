  kicker: ACC-03
  kicker_en: ACC-03
  kicker_zh: ACC-03
  kicker_zh_hk: ACC-03
  title_en: Target reached. Returns still coming?
  title_zh: 销售达标了？退货期还没结束
  title_zh_hk: 銷售達標了？退貨期還未完
  image: art/returns-target-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Would you certify a team bonus while customers can still return their purchases? This is a fictional Hong Kong homewares shop. One thousand organizers have been delivered, and the return window is still open. Finance has to review the evidence. Gross sales alone do not qualify.
  zh: >-
    顾客还可以退货，团队奖金现在就能确认吗？这是一家虚构的香港家品网店。一千件收纳用品已经交付，退货期还没结束。财务要独立复核证据。只看销售总额，不能确认奖金。
  zh_hk: >-
    顧客仲可以退貨，團隊獎金而家就確認得未？呢間係虛構嘅香港網上家品店。一千件收納用品已經交付，退貨期仲未完。財務要獨立覆核證據。只睇銷售總額，唔可以確認獎金。

