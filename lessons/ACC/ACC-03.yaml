  c11: '1,000 × 200'
  c12: '200,000'
  c21_en: 5% of gross sales
  c21_zh: 总额的 5%
  c21_zh_hk: 總額的 5%
  c22: '10,000'
  c31: '200,000 − 10,000'
  c32: '190,000'
