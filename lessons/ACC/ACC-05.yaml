beats:
- id: hook
  visual: still_image
  seconds: 20
  kicker: ACC-05
  kicker_en: ACC-05
  kicker_zh: ACC-05
  kicker_zh_hk: ACC-05
  title_en: Over budget. Out of control?
  title_zh: 支出超预算，就说明成本失控吗？
  title_zh_hk: 成本超支，是否已經失控？
  image: art/over-budget-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Would you tighten next month's ingredient cap because this month went over plan? This fictional Hong Kong kitchen makes one kind of lunch box. Only ingredients are in view. Labour, rent and packaging are outside this decision.
  zh: >-
    食材开支比原预算高，就要收紧下月的上限吗？这是一家虚构的香港午餐厨房，只做一种盒饭。本题只看食材，不包括人工、租金和包装。
  zh_hk: >-
    食材開支比原預算高，就要收緊下月嘅上限嗎？呢間係虛構嘅香港午餐廚房，只做一種盒飯。呢題只睇食材，不包括人工、租金同包裝。

