title_en: Paid today. Earned today?
title_zh: 今天收到钱，就能确认收入吗？
title_zh_hk: 今日收款，就算今日賺取收入？
beats:
- id: hook
  visual: still_image
  seconds: 20
  kicker: ACC-06
  kicker_en: ACC-06
  kicker_zh: ACC-06
  kicker_zh_hk: ACC-06
  title_en: Paid today. Earned today?
  title_zh: 今天收到钱，就能确认收入吗？
  title_zh_hk: 今日收款，就算今日賺取收入？
  image: art/paid-earned-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A launch brought cash into a fictional Hong Kong pottery studio. Can the owner call all of it this month's revenue? Each prepaid package promises four distinct, identical sessions, and each session has the same standalone price. The bank receipts are reconciled. Attendance has not been checked.
  zh: >-
    一家虚构的香港陶艺工作室推出预付课程包，现金已经进来了。老板能把全部收款列作本月收入吗？每包含四节可区分、内容相同的课，每节单独售价也一样。银行收款核对过了，出席记录还没有核对。
  zh_hk: >-
    一間虛構嘅香港陶藝工作室推出預付套票，現金已經入咗嚟。老闆可唔可以將全部收款列作本月收入？每套有四節獨立、內容相同嘅課，每節單獨售價都一樣。銀行收款核對過，出席紀錄仲未核對。

