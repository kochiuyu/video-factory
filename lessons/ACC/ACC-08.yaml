title_en: A quiet year. Less machine used?
title_zh: 首年业务淡，机器的消耗就一定更少吗？
title_zh_hk: 淡季少開工，機器就耗用得少嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-08
  kicker_en: ACC-08
  kicker_zh: ACC-08
  kicker_zh_hk: ACC-08
  title_en: A quiet year. Less machine used?
  title_zh: 首年业务淡，机器的消耗就一定更少吗？
  title_zh_hk: 淡季少開工，機器就耗用得少嗎？
  image: art/machine-hours-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A quiet first year used fewer machine hours. Should depreciation be lower? This fictional embroidery workshop has agreed the machine's initial cost. The machine was paid for and ready on day one. This is its first full-year report, and no earlier report is being revised.
  zh: >-
    首年生意淡，机器开得少，折旧就一定更少吗？这家虚构刺绣作坊已经确定机器的初始成本。机器已付款，年初第一天就达到预定可使用状态。这是首份完整年度报告，没有更早的报告需要修订。
  zh_hk: >-
    首年生意淡，機器開得少，折舊就一定更少嗎？呢間虛構刺繡工場已經確定機器嘅初始成本。機器已付款，年初第一日就達到預定用途。呢份係首個完整年度報告，冇更早嘅報告需要修訂。

