  kicker_zh_hk: ACC-09
  title_en: Two balances. One payment.
  title_zh: 两个余额，一笔付款
  title_zh_hk: 兩個結餘，一筆付款
  image: art/two-balances-one-payment-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Would you release an approved forty-thousand-dollar equipment payment when two records disagree? Fictional Harbour Repair has already checked the supplier and the invoice. Paying today secures next-day dispatch. Waiting means the next opportunity. No real transfer is made in this case.
  zh: >-
    两份记录对不上，已批准的四万港元设备款，现在能放行吗？虚构的海港维修已经核对供应商和发票。今天付款，可以按约定次日发货。再等，就要等到下一次机会。本题不执行真实转账。
  zh_hk: >-
    兩份紀錄對唔上，已批准嘅四萬港元設備款，而家可唔可以放行？虛構嘅海港維修已經核對供應商同發票。今日付款，可以按約定翌日付運。再等，就要等到下一次機會。呢題唔執行真實轉帳。

