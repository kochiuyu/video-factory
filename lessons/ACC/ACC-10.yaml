- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-10
  kicker_en: ACC-10
  kicker_zh: ACC-10
  kicker_zh_hk: ACC-10
  title_en: Through our till. All our revenue?
  title_zh: 钱都从我们这里收，都是我们的收入吗？
  title_zh_hk: 經我們收款，全數都是我們的收入？
  image: art/through-our-till-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Two draft reports show the same profit. Can both revenue figures be right? Fictional HarbourPrints helped customers order prints from an independent maker. Every print this month has been delivered and accepted. The desk still has to finish the arranging work it actually promised.
  zh: >-
    两份草稿的利润一样。两种收入列法就都可以吗？虚构的 HarbourPrints 帮顾客向独立制作商订购印刷品。本月的画都已经交付并被接收。柜台仍要完成它真正承诺的代办工作。
  zh_hk: >-
    兩份草稿嘅利潤一樣。兩種收入列法就都可以嗎？虛構嘅 HarbourPrints 幫顧客向獨立製作者訂購印刷品。本月嘅畫都已經交付並被接收。銷售處仍要完成佢真正承諾嘅代辦工作。

