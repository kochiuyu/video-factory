  s1_en: One hundred prints at four hundred dollars have all been collected. Customer receipts are forty thousand.
  s1_zh: 一百幅，每幅四百港元，款项已经收齐。向顾客的收款是四万。
  s1_zh_hk: 一百幅，每幅四百港元，款項已經收齊。向顧客嘅收款係四萬。
  s2_en: Thirty-two thousand is still payable to the maker. Eight thousand is the desk's share, one hundred completed orders at eighty dollars each.
  s2_zh: 三万二千仍应付给制作商。八千是柜台的份额，一百张已完成的订单，每张八十港元。
  s2_zh_hk: 三萬二千仍應付俾製作者。八千係銷售處嘅份額，一百張已完成嘅訂單，每張八十港元。
