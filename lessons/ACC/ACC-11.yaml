  visual: still_image
  seconds: 24
  kicker: ACC-11
  kicker_en: ACC-11
  kicker_zh: ACC-11
  kicker_zh_hk: ACC-11
  title_en: Same units. Same overhead?
  title_zh: 件数一样，间接成本也一样吗？
  title_zh_hk: 數量相同，間接成本也一樣？
  image: art/same-units-different-setups-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Two customers each want 1,200 badges. Should they carry the same setup-support cost? This is a fictional Hong Kong badge workshop. You are choosing cost evidence for repeat quotations, not approving a sale.
  zh: >-
    两位客户各要一千二百枚徽章。准备支持成本就该一样吗？这是虚构的香港徽章工场。你要为翻单报价选择成本依据，不是批准一笔成交。
  zh_hk: >-
    兩位客戶各要一千二百枚襟章。準備支援成本就應該一樣嗎？呢個係虛構嘅香港襟章工場。你而家揀嘅係翻單報價嘅成本依據，唔係批准一筆成交。

