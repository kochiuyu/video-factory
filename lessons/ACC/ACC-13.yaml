  s1_en: >-
    The studio completed 500 acceptable mugs of one unchanged design. The current attainable clay standard
    allows 1 kilogram per acceptable mug, including normal waste, at 10 dollars a kilogram.
  s1_zh: 工作室完成了五百只同一设计的合格马克杯。现行可达到的陶泥标准是，每只合格杯含正常损耗一共一公斤，标准单价每公斤十港元。
  s1_zh_hk: 工作室完成咗五百隻同一設計嘅合格陶杯。現行可達到嘅陶泥標準係，每隻合格杯連正常損耗一共一公斤，標準單價每公斤十港元。
  s2_en: >-
    The purchaser tried an approved alternative clay at 9 dollars a kilogram, with the same delivery and
    payment terms. The first report highlights the 10 percent lower price. It has not yet shown how much
    clay the batch consumed.
  s2_zh: 采购试购了获批的替代陶泥，每公斤九港元，交付和付款条件不变。首份报告强调单价下降了百分之十，还没有列出本批实际用了多少陶泥。
  s2_zh_hk: 採購試購咗獲批嘅替代陶泥，每公斤九港元，交付同付款條件不變。首份報告強調單價跌咗百分之十，仲未列出呢批實際用咗幾多陶泥。
