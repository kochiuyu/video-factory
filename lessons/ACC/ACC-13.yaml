  en: >-
    Clay is one dollar cheaper a kilogram. Did this batch of mugs cost less? This is a fictional Hong
    Kong ceramics studio. Five hundred acceptable mugs are already finished. No repeat order has been
    placed.
  zh: 陶泥每公斤便宜了一港元。这一批合格杯子就更便宜了吗？这是虚构的香港陶艺工作室。五百只合格马克杯已经做完。续订还没有下单。
  zh_hk: 陶泥每公斤平咗一港元。呢一批合格陶杯就真係更平嗎？呢個係虛構嘅香港陶藝工作室。五百隻合格陶杯已經做完。續訂仲未落單。
