title_en: An invoice issued. Cash likely?
title_zh: 发票开出了，款项能收回吗？
title_zh_hk: 發票已開，貨款收得回嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-14
  kicker_en: ACC-14
  kicker_zh: ACC-14
  kicker_zh_hk: ACC-14
  title_en: An invoice issued. Cash likely?
  title_zh: 发票开出了，款项能收回吗？
  title_zh_hk: 發票已開，貨款收得回嗎？
  image: art/an-invoice-not-a-receipt-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The customer still owes the whole invoice, and promises to pay in three instalments. Should the studio
    keep its 10,000 loss allowance? This is a fictional Hong Kong design studio. No cash has arrived,
    and the invoice itself is not in dispute.
  zh: 客户仍欠整张发票，并承诺分三期付款。工作室该维持这一万的损失准备吗？这是虚构的香港设计工作室。现在还没有收回现金，发票金额本身也没有争议。
  zh_hk: 客戶仍然欠整張發票，並承諾分三期付款。工作室該維持呢一萬嘅虧損撥備嗎？呢個係虛構嘅香港設計工作室。而家仲未收回現金，發票金額本身亦冇爭議。
