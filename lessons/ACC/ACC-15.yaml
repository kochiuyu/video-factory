  title_en: A profit. Where did the cash go?
  title_zh: 账上有利润，现金去了哪里？
  title_zh_hk: 有利潤，現金去了哪裏？
  image: art/profit-not-cash-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The month made a profit of 30,000, yet the bank balance fell by 35,000. Should the owner cut next
    month's expenses first? This is a fictional Hong Kong packaging studio. All figures in the case are
    in thousands of Hong Kong dollars.
  zh: 这个月利润是三万，银行存款却少了三万五。业主该先削减下月费用吗？这是虚构的香港包装工作室。本题金额一律以千港元列示。
  zh_hk: 呢個月溢利係三萬，銀行現金卻少咗三萬五。業主該唔該先削減下月開支？呢個係虛構嘅香港包裝工作室。呢題金額一律以千港元列示。
