  s1_en: >-
    Revenue is 150, cost of goods sold 80, other operating expenses 30, and depreciation 10. Reported
    profit is 30. Opening unrestricted bank cash was 100, and closing cash is 65.
  s1_zh: 营业收入一百五十，销售成本八十，其他经营费用三十，折旧十。账面利润三十。期初不受限制的银行存款是一百，期末是六十五。
  s1_zh_hk: 收入一百五十，銷售成本八十，其他經營開支三十，折舊十。賬面溢利三十。期初不受限制嘅銀行現金係一百，期末係六十五。
  s2_en: >-
    The first dashboard does not show cash collected, purchases paid, stock movements, unpaid invoices,
    or capital purchases. The cash balance still covers currently due obligations, so there is time for
    a review. No waste, fraud, or error has yet been found.
  s2_zh: >-
    第一份仪表板没有列出客户回款、已付采购、存货变动、未付账款或资本开支。现金余额仍够支付目前到期义务，所以来得及先核对。目前还没有发现浪费、舞弊或错账。
  s2_zh_hk: >-
    第一份儀表板冇列出客戶回款、已付採購、存貨變動、未付賬款或資本開支。現金餘額仍然夠支付目前到期義務，所以嚟得切先核對。目前仲未發現浪費、舞弊或錯賬。
