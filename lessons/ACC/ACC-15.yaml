  title_en: Cut costs, or reconcile first?
  title_zh: 先砍费用，还是先核对？
  title_zh_hk: 先砍開支，定係先核對？
  en: >-
    Would you first impose a blanket operating-expense cut, or request a profit-to-cash reconciliation
    before targeting action? What can this dashboard tell you, and what can it not tell you, about the
    35,000 cash decline? Pause and vote.
  zh: >-
    你会先全面削减下月经营费用，还是先要一份利润到现金的核对，再决定行动？现有仪表板对这三万五的现金减少，能说明什么，又不能说明什么？请暂停，投个票。
  zh_hk: >-
    你會先全面削減下月經營開支，定係先要一份溢利到現金嘅核對，再決定行動？現有儀表板對呢三萬五嘅現金減少，能夠說明咩，又唔能夠說明咩？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: The missing movements
  title_zh: 先前缺少的变动
  title_zh_hk: 先前缺少嘅變動
  step1_en: Receivables 20 to 55; stock 40 to 65
  step1_zh: 应收 20→55，存货 40→65
  step1_zh_hk: 應收 20→55，存貨 40→65
  step2_en: Payables 15 to 20; expenses all paid
  step2_zh: 应付 15→20；费用已全部支付
  step2_zh_hk: 應付 15→20；開支已全部支付
  step3_en: Machine paid 20, not yet in use
  step3_zh: 新机器付款20，尚未投入使用
  step3_zh_hk: 新機器付款20，尚未投入使用
  s1_en: >-
    Trade receivables increased from 20 to 55, inventories from 40 to 65, and trade payables for stock
    from 15 to 20. Other operating expenses of 30 were all paid this month. Depreciation of 10 is a non-cash
    expense on existing equipment.
  s1_zh: >-
    应收款项由二十增至五十五，存货由四十增至六十五，存货采购应付款由十五增至二十。其他经营费用三十已在本月全部付现。折旧十是现有设备的非现金费用。
  s1_zh_hk: >-
    應收款項由二十增至五十五，存貨由四十增至六十五，存貨採購應付款由十五增至二十。其他經營開支三十已喺呢個月全部付現。折舊十係現有設備嘅非現金開支。
  s2_en: >-
    Separately, a new machine cost 20 and was paid in full. It is not part of cost of sales or the 30
    of other expenses, and it was not yet available for use, so no depreciation on it is included this
    month. There are no other cash movements in this exercise.
  s2_zh: 另外，新机器花费二十并已全额付清。它不属于销售成本，也不在那三十的其他费用里。月末尚未投入使用，所以本题不含它的折旧。本练习没有其他现金流。
  s2_zh_hk: 另外，新機器花費二十並已全額付清。佢唔屬於銷售成本，亦不喺嗰三十嘅其他開支入面。月末尚未投入使用，所以呢題唔含佢嘅折舊。本練習冇其他現金流。
  s3_en: >-
    Closing receivables of 55 include 50 within terms and 5 overdue. Closing stock of 65 includes 50 allocated
    to orders and 15 not yet allocated. These are closing balances, not extra cash outflows to add again.
  s3_zh: >-
    期末应收五十五里，五十仍在账期内，五已经逾期。期末存货六十五里，五十已分配给既定订单，十五尚未分配。这些是期末余额，不要再当成一笔新的现金流出。
  s3_zh_hk: >-
    期末應收五十五入面，五十仍然喺賬期內，五已經逾期。期末存貨六十五入面，五十已分配俾既定訂單，十五尚未分配。呢啲係期末餘額，唔好再當成一筆新嘅現金流出。
- id: pause2
  visual: title_card
