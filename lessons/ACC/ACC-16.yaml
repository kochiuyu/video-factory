  title_en: A small payment. An important correction?
  title_zh: 付款金额不大，还需要更正吗？
  title_zh_hk: 款項小，更正也不重要嗎？
  image: art/small-but-in-the-note-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A 2,400 payment was booked as printing, but it paid for room hire. The surplus does not change. Should
    the treasurer still correct the draft before it is issued? This is a fictional Hong Kong adult arts
    club. The accounts have not been approved or circulated.
  zh: >-
    一笔两千四百港元的付款记在了印刷费，实际支付的却是活动室租金。结余不会因此改变。司库还要在发出前更正草案吗？这是虚构的香港成人艺术会。账目尚未批准，也尚未传阅。
  zh_hk: >-
    一筆二千四百港元嘅付款記咗喺印刷費，實際支付嘅卻係活動室租金。盈餘唔會因此改變。司庫仲要唔要喺發出前更正草案？呢個係虛構嘅香港成人藝術會。賬目尚未批准，亦尚未傳閱。
