title_en: Most of the value. Enough of the evidence?
title_zh: 账面金额查了大半，审计证据够吗？
title_zh_hk: 查到大部分金額，證據就夠了嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-17
  kicker_en: ACC-17
  kicker_zh: ACC-17
  kicker_zh_hk: ACC-17
  title_en: Most of the value. Enough of the evidence?
  title_zh: 账面金额查了大半，审计证据够吗？
  title_zh_hk: 查到大部分金額，證據就夠了嗎？
  image: art/coverage-is-not-a-population-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Plan A would test 80 percent of the recorded receivables value. Plan B would cover only 44 percent,
    but it also looks at smaller balances. Which initial batch would you prioritise? This is a fictional
    Hong Kong distributor, and the work is an initial evidence batch, not a finished audit.
  zh: >-
    方案A会测试账面应收金额的百分之八十。方案B只覆盖百分之四十四，但也会抽查小额余额。你会优先做哪一批？这是虚构的香港分销商。现在安排的是首批取证，不是已经完成的审计。
  zh_hk: >-
    方案A會測試賬面應收金額嘅百分之八十。方案B只覆蓋百分之四十四，但也會抽查小額餘額。你會優先做邊一批？呢個係虛構嘅香港分銷商。而家安排嘅係首批取證，唔係已經完成嘅審計。
