  title_en: Keep the budget. Update the forecast?
  title_zh: 预算不变，要不要更新预测？
  title_zh_hk: 預算不改，預測要更新嗎？
  image: art/one-target-two-views-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Harbour Studio's first-quarter jobs were 270, not 300. The approved annual target stays 1,200. Should
    finance keep the original budget alone, or also keep a three-month rolling forecast? This is a fictional
    Hong Kong business-support service.
  zh: >-
    Harbour Studio第一季度完成了二百七十项服务任务，不是三百项。已批准的全年目标仍是一千二百项。财务是只用原来的预算，还是另做一份三个月滚动预测？这是虚构的香港企业支持服务商。
  zh_hk: >-
    Harbour Studio第一季度完成咗二百七十宗服務工作，唔係三百宗。已批准嘅全年目標仍然係一千二百宗。財務係只用原來嘅預算，定係另做一份三個月滾動預測？呢個係虛構嘅香港企業支援服務公司。
