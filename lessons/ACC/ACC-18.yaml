  kicker_zh_hk: 第二輪
  title_en: A new contract for 100 jobs
  title_zh: 新合同新增 100 项任务
  title_zh_hk: 新合約新增 100 宗工作
  step1_en: April 30, May 40, June 30 more
  step1_zh: 四月多 30，五月多 40，六月多 30
  step1_zh_hk: 四月多 30，五月多 40，六月多 30
  step2_en: Base stays 100 a month
  step2_zh: 每月 100 项的基本预期不变
  step2_zh_hk: 每月 100 宗嘅基本預期不變
  step3_en: Contingency fund is 30,000
  step3_zh: 预备金为 30,000
  step3_zh_hk: 應急預算為 30,000
  s1_en: >-
    An authorised new customer contract adds 30 jobs in April, 40 in May and 30 in June, on top of the
    unchanged base of 100 a month. The same 1,000 receipt and 200 cover cost apply. Delivery slots, qualified
    cover and payment timing have been checked.
  s1_zh: >-
    经授权的新客户合同，在每月一百项基本预期之上，四月新增三十项、五月四十项、六月三十项。每项回款仍是一千，补充人员成本仍是二百。交付时段、合格人员和付款安排均已核实。
  s1_zh_hk: >-
    已按授權簽妥嘅新客戶合約，喺每月一百宗基本預期之上，四月新增三十宗、五月四十宗、六月三十宗。每宗收款仍然係一千，額外人手成本仍然係二百。服務時段、合資格人手同付款時間均已核實。
  s2_en: >-
    July to December stay at 100 jobs a month; the temporary contract is not extended. The controller
    can approve required cover from a funded 30,000 contingency before bookings are made. Updating a spreadsheet
    does not itself release spending authority. No extra cover has yet been booked.
  s2_zh: >-
    七月到十二月仍按每月一百项预计，没有依据把临时合同延展到下半年。安排补充人员前，财务主管可从已有资金支持的三万预备金中另行批准人员支出。更新电子表格不等于授予支出权限。目前还未预订补充人手。
  s2_zh_hk: >-
    七月到十二月仍然按每月一百宗預計，未有證據把短期合約延至下半年。預約額外人手前，財務主管可從已有撥款嘅三萬應急預算另行批出所需開支。更新試算表唔等於批准開支。而家尚未安排額外人手。
  s3_en: >-
    A manager wants to replace the annual target with the latest expected year-end total. The board instead
    wants a truthful planning view and an unchanged, clearly labelled original-target comparison.
  s3_zh: 经理建议用最新的全年预计任务量取代原年度目标。董事会要求如实展示最新计划，同时清晰保留与原目标的对比。
  s3_zh_hk: 經理建議用最新嘅全年預計工作量取代原年度目標。董事會要求如實展示最新計劃，同時清晰保留同原目標嘅對比。
