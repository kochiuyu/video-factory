  title_zh_hk: 只用原預算，定係另做滾動預測？
  en: >-
    Would you use the original budget alone, or also keep a separate rolling forecast beside it? Explain
    what each number would be used to decide. Pause and vote.
  zh: 你会只用原来的预算，还是另编一份滚动预测、与原预算并用？请说明每个数字分别服务于什么决策。请暂停，投个票。
  zh_hk: 你會只用原來嘅預算，定係另編一份滾動預測、同原預算一齊用？請說明每個數字分別服務於甚麼決策。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
