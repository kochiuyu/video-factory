  s1_en: >-
    The approved target is 100 completed service jobs each month, or 1,200 for the year. No one has authorised
    changing that target, or any employee's pay or appraisal terms. Existing paid capacity safely delivers
    100 jobs a month.
  s1_zh: >-
    已批准的目标是每月完成一百项服务任务，全年一千二百项。无人获准改动这个目标，也无人获准改动员工薪酬或考核条款。现有有薪人员可以安全完成每月一百项。
  s1_zh_hk: >-
    已批准嘅目標係每月完成一百宗服務工作，全年一千二百宗。未有人獲授權改動呢個目標，亦未有人獲授權改動員工薪酬或考核條款。現有有薪人手可以安全完成每月一百宗。
  s2_en: >-
    Each completed job brings in 1,000 Hong Kong dollars in the same month. Core operating cash payments
    are 80,000 a month. Any additional job needs trained, available cover costing 200, fully inclusive.
    Updating a rolling forecast uses two funded finance hours each month.
  s2_zh: >-
    每完成一项，当月即收一千港元。核心经营现金支出每月八万。每新增一项，须安排有空且受过培训的补充人员，每项全包成本二百港元。更新滚动预测，每月要用两小时已列预算的财务工时。
  s2_zh_hk: >-
    每完成一宗，當月即收一千港元。核心經營付款每月八萬。每宗額外工作須有合資格並可調配嘅人手，全包成本二百港元。更新滾動預測，每月要用兩小時已預留嘅財務工時。
