- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-19
  kicker_en: ACC-19
  kicker_zh: ACC-19
  kicker_zh_hk: ACC-19
  title_en: A lower return. A better investment?
  title_zh: 回报率下降，这项投资反而值得做？
  title_zh_hk: 回報率跌了，投資反而更值得做？
  image: art/lower-return-better-investment-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A safe upgrade would add 60,000 of profit on 400,000 of investment. The division already earns 20
    percent. Should you recommend the upgrade, or protect the existing percentage? This is a fictional
    Hong Kong workshop group.
  zh: >-
    一项符合安全要求的升级，会在四十万投资上增加六万利润。部门现有投资报酬率已经是百分之二十。你是建议升级，还是保住现有的比率？这是虚构的香港工场集团。
  zh_hk: >-
    一項符合安全要求嘅升級，會喺四十萬投資上增加六萬溢利。部門現有投資回報率已經係百分之二十。你係建議升級，定係保住現有嘅比率？呢個係虛構嘅香港工場集團。
