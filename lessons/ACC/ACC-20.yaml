title_en: An internal price. Two sensible refusals?
title_zh: 一个内部价格，双方拒绝都可能有道理？
title_zh_hk: 同一個內部價，兩邊都可以有理由拒絕？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-20
  kicker_en: ACC-20
  kicker_zh: ACC-20
  kicker_zh_hk: ACC-20
  title_en: An internal price. Two sensible refusals?
  title_zh: 一个内部价格，双方拒绝都可能有道理？
  title_zh_hk: 同一個內部價，兩邊都可以有理由拒絕？
  image: art/internal-price-two-refusals-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Assembly needs 300 components. The component unit has spare capacity, and an outside supplier will
    sell the same parts at 70. What internal price range would both managers consider? This is a fictional
    manufacturer, and the prices are management-accounting charges, not tax advice.
  zh: >-
    装配部门需要三百件零部件。零部件部门当时有闲余产能，外部合格供应商也可以七十港元供货。两位经理会在哪个内部价格区间都愿意考虑？这是虚构的制造企业。这里的价格是管理会计计价，不是税务建议。
  zh_hk: >-
    裝配部需要三百件零件。零件部當時有閒置產能，外部合資格供應商亦可以七十港元供貨。兩位經理會喺邊個內部價格區間都願意考慮？呢個係虛構嘅製造公司。呢度嘅價格係管理會計計價，唔係稅務建議。
