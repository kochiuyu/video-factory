  title_en: Keep, or change your choice?
  title_zh: 保持原选择，还是改？
  title_zh_hk: 維持原選擇，定係改？
  en: >-
    Would you keep or change your decision after the new fresh-peel offer? Calculate the difference, and
    the fresh-peel offer at which the two options are equally attractive. Pause and vote.
  zh: 拿到新的鲜果皮报价后，你会保持还是改变选择？请算出两种方案的差额，再找出使两者净额相同的鲜果皮报价。请暂停，投个票。
  zh_hk: 收到新嘅鮮果皮報價之後，你會維持定係改變選擇？計兩個方案相差幾多，再搵出使兩者淨額相同嘅鮮果皮報價。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
