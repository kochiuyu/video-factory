  step1_zh_hk: 鮮果皮新報價一千九百
  step2_en: Dried output still 2,600
  step2_zh: 干果皮仍报价二千六百
  step2_zh_hk: 乾果皮報價仍係二千六百
  step3_en: Additional processing still 900
  step3_zh: 额外加工仍是九百
