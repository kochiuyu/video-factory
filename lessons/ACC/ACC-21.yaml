  s1_en: >-
    Before you accept either offer, a second qualified buyer makes a firm 1,900 offer for the entire fresh-peel
    lot, on the same collection terms.
  s1_zh: 在接受任何报价前，另一名合格买家愿意以一千九百港元买下整批鲜果皮，提货条件相同。
  s1_zh_hk: 喺接受任何報價前，另一個合格買家願意以一千九百港元買走成批鮮果皮，提貨條件相同。
  s2_en: >-
    The original fresh offer can be declined without penalty. The dried-output buyer still offers 2,600,
    and the additional processing cost remains 900.
  s2_zh: 拒绝原来的鲜果皮报价没有罚金。干果皮仍报价二千六百，额外加工费用仍是九百。
  s2_zh_hk: 拒絕原來嘅鮮售報價唔使罰。乾果皮報價仍係二千六百，額外加工費用仍係九百。
  s3_en: >-
    Nothing else changes. The common extraction cost is already incurred, and the juice sale remains unaffected.
    This is new information before commitment.
  s3_zh: 其余情况照旧。共同榨汁成本早已发生，果汁销售不受影响。这是作出承诺前的新资料。
  s3_zh_hk: 其餘情況照舊。共同榨汁成本早已發生，果汁銷售唔受影響。呢個係作出承諾前嘅新資料。
