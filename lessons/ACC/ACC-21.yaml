  title_en: Two products. Which cost changes?
  title_zh: 同一道工序、两种产品：决策会改变哪些成本？
  title_zh_hk: 同一工序，兩種產品：哪筆成本會改變？
  image: art/two-products-which-cost-changes-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    After the juice is sold, 100 kilograms of peel remains. The report assigns 2,000 of a 12,000 common
    extraction cost to the peel. Would you sell the peel fresh, or process it further? This is a fictional
    Hong Kong citrus processor. No offer has been accepted.
  zh: >-
    果汁已经卖掉，还剩一百公斤果皮。报表把一万二千港元共同榨汁成本中的二千分配给果皮。你会直接出售鲜果皮，还是进一步加工？这是虚构的香港柑橘加工厂。报价还没有接受。
  zh_hk: >-
    果汁已經賣咗，仲剩一百公斤果皮。報表把一萬二千港元共同榨汁成本入面嘅二千分攤畀果皮。你會鮮售，定係再加工？呢個係虛構嘅香港柑橘加工廠。報價仲未接受。
