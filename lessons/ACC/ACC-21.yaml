  s1_en: >-
    The 100 kilogram peel lot can be sold fresh for 1,200, or dried for 2,600 after an additional processing
    payment of 900. Both buyers collect the whole lot.
  s1_zh: 这一百公斤鲜果皮可以直接出售，收款一千二百港元；也可以干燥后再卖，收款二千六百，但要再付九百港元加工费。两名买家都提走整批产出。
  s1_zh_hk: 呢一百公斤鮮果皮可以鮮售，收款一千二百港元；亦可以烘乾再賣，收款二千六百，但要再付九百港元加工費。兩個買家都會提走整批產出。
  s2_en: >-
    The common extraction run has already cost 12,000. The report assigns 10,000 to juice and 2,000 to
    peel. None of that common cost can be recovered by changing the peel decision.
  s2_zh: 共同榨汁已经花去一万二千港元。报表给果汁分配一万，给果皮分配二千。无论怎样处理果皮，都不能收回这笔已经发生的共同成本。
  s2_zh_hk: 共同榨汁已經用去一萬二千港元。報表畀果汁分攤一萬，畀果皮分攤二千。無論點樣處理果皮，都收唔返呢筆已經發生嘅共同成本。
  s3_en: >-
    Juice receipts are unaffected. Capacity has no other paid use today. You must choose one whole-lot
    offer, not a mix.
  s3_zh: 果汁的收入不受影响。当天的加工产能没有其他可带来收入的用途。必须整批二选一，不能拆单。
  s3_zh_hk: 果汁嘅收入唔受影響。當天嘅加工產能冇其他可帶來收入嘅用途。必須整批二揀一，唔可以拆單。
