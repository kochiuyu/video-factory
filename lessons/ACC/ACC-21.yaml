  title_en: Sell fresh, or process further?
  title_zh: 直接出售，还是再加工？
  title_zh_hk: 鮮售，定係再加工？
  en: >-
    Would you sell the peel now, or process the whole lot further? Show which receipts and costs change,
    and explain whether the allocated loss should determine your choice. Pause and vote. No offer has
    been accepted.
  zh: 整批果皮是直接出售，还是进一步加工？请指出哪些收支会随方案变化，并说明是否应该按分摊后的账面亏损来决策。请暂停，投个票。报价还没有接受。
  zh_hk: 整批果皮係鮮售，定係再加工？列出邊啲收支會隨方案改變，並說明應唔應該按分攤後嘅賬面虧損嚟決策。暫停，投個票。報價仲未接受。
