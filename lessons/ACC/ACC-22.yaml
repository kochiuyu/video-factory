title_en: More production. More profit?
title_zh: 产量提高，就真的多赚了吗？
title_zh_hk: 多生產，就多賺了嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-22
  kicker_en: ACC-22
  kicker_zh: ACC-22
  kicker_zh_hk: ACC-22
  title_en: More production. More profit?
  title_zh: 产量提高，就真的多赚了吗？
  title_zh_hk: 多生產，就多賺了嗎？
  image: art/more-production-more-profit-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Reported operating profit rose from 18,000 to 22,000, but units sold and the selling price did not
    change. Does that support keeping a higher production pace? You are controller of a fictional Hong
    Kong maker of one standard desk organiser.
  zh: >-
    呈报的营业利润从一万八千上升到二万二千，但销量和售价都没有变。这是否支持维持更高的产量？你是一家虚构的香港制造商的财务主管，公司只生产一种标准桌面收纳盒。
  zh_hk: >-
    呈報嘅營運溢利由一萬八千升到二萬二千，但銷量同售價都冇變。呢個係咪支持維持更高產量？你係一間虛構香港製造商嘅財務主管，公司只生產一種標準桌面收納盒。
