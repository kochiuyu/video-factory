  en: >-
    Would you approve the dispatch-based draft, approve only the physical count as the inventory balance,
    or keep the close provisional? Identify the evidence needed for each shipment. Pause and vote.
  zh: 你会批准按发运编制的草案、只把盘点金额作为存货余额，还是把年结暂作未定？请指出每批货还需要什么证据。请暂停，投个票。
  zh_hk: 你會批准按付運編製嘅草案、只把盤點金額作為存貨餘額，定係把年結暫作未定？指出每批貨仲需要咩證據。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 28
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Verified control at midnight
  title_zh: 核实午夜时的控制权
  title_zh_hk: 核實午夜時嘅控制權
  step1_en: >-
    A: control passed on 30 Dec
  step1_zh: 甲：30日已取得控制权
  step1_zh_hk: 甲：30日已取得控制權
  step2_en: >-
    B: control passes on 2 Jan
  step2_zh: 乙：控制权1月2日才转移
  step2_zh_hk: 乙：控制權1月2日先轉移
  step3_en: C sold; D rejected 31 Dec
  step3_zh: 丙已售出；丁已于31日拒收
  step3_zh_hk: 丙已售出；丁已於31日拒收
  s1_en: >-
    For lot A, the contract and carrier receipt show that control passed to the wholesaler when the supplier
    handed the identified goods to the carrier on 30 December. The purchase is unpaid, so the payable
    also arises then.
  s1_zh: 甲批：合同和承运人收据表明，供应商在十二月三十日把已识别货物交给承运人时，控制权已转给本批发商。货款未付，应付款也在当时确认。
  s1_zh_hk: 甲批：合約同承運人收據表明，供應商喺十二月三十日把已識別貨物交給承運人時，控制權已轉畀本批發商。貨款未付，應付款亦喺當時確認。
  s2_en: >-
    For lot B, control passed to the customer only on arrival on 2 January. The wholesaler retained control
    throughout the journey. For lot C, control passed on carrier collection on 31 December, and no remaining
    promise exists.
  s2_zh: 乙批：控制权要到一月二日货物到达时才转给客户，在途期间仍由本企业控制。丙批：十二月三十一日客户承运人提货时控制权已转移，没有剩余承诺。
  s2_zh_hk: 乙批：控制權要到一月二日貨物到達時先轉畀客戶，在途期間仍由本企業控制。丙批：十二月三十一日客戶承運人提貨時控制權已轉移，冇剩餘承諾。
  s3_en: >-
    Lot D was a genuine trial. A dated customer message confirms rejection on 31 December, before any
    acceptance. Control never left the wholesaler; the goods remain undamaged and recoverable at cost.
  s3_zh: 丁批是真正的试用。客户在十二月三十一日、尚未验收前发来注明日期的拒收信息。控制权从未离开本企业；货物无损，可按成本收回。
  s3_zh_hk: 丁批係真正嘅試用。客戶喺十二月三十一日、尚未驗收前發嚟註明日期嘅拒收信息。控制權從未離開本企業；貨物無損，可按成本收回。
- id: pause2
  visual: title_card
