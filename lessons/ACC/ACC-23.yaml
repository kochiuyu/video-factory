- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-23
  kicker_en: ACC-23
  kicker_zh: ACC-23
  kicker_zh_hk: ACC-23
  title_en: On the truck. In whose year-end stock?
  title_zh: 货在途中，年末算谁的存货？
  title_zh_hk: 貨在車上，算誰的年末存貨？
  image: art/on-the-truck-in-whose-stock-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A verified midnight warehouse count shows 60,000 of company-controlled goods, but lots A to D are
    not in that count. Would you approve a dispatch-based draft, approve only the count, or keep the close
    provisional? You are controller of a fictional Hong Kong stationery wholesaler, closing on 31 December.
  zh: >-
    核实过的午夜仓库盘点显示，企业控制的存货是六万港元，但甲到丁四批货都不在盘点里。你会批准按发运编制的草案、只按盘点入账，还是把年结暂作未定？你是一家虚构的香港文具批发商的财务主管，年结日是十二月三十一日。
  zh_hk: >-
    核實過嘅午夜倉庫盤點顯示，企業控制嘅存貨係六萬港元，但甲到丁四批貨都唔喺盤點入面。你會批准按付運編製嘅草案、只按盤點入賬，定係把年結暫作未定？你係一間虛構香港文具批發商嘅財務主管，年結日係十二月三十一日。
