  s1_en: >-
    Apart from lots A to D, reviewed current-year revenue is 200,000 and cost of sales is 120,000. The
    draft uses the 60,000 count, treats all three outbound lots as sales, and omits A’s purchase because
    it has not arrived.
  s1_zh: 除甲到丁以外，已复核的本年收入是二十万，销售成本十二万。草案按六万盘点入账，把三批出库都当成销售，又因为甲还没运到，漏记了甲的购货和应付款。
  s1_zh_hk: 除甲到丁以外，已覆核嘅本年收入係二十萬，銷貨成本十二萬。草案按六萬盤點入賬，把三批出庫都當成銷售，又因為甲仲未運到，漏記咗甲嘅購貨同應付款。
  s2_en: >-
    That draft shows revenue of 239,000 and cost of sales of 143,000. Only movement records are currently
    available. Contract and acceptance evidence can be checked tomorrow, before approval.
  s2_zh: 这份草案列示收入二十三万九千，销售成本十四万三千。目前只有货物移动记录。合同和验收证据明天、也就是批准前可以核对。
  s2_zh_hk: 呢份草案列示收入二十三萬九千，銷貨成本十四萬三千。目前只有貨物移動紀錄。合約同驗收證據明天、亦即批准前可以核對。
  s3_en: >-
    The business recognises a sale when the customer obtains control, and includes goods it controls in
    inventory even when held elsewhere. An invoice, dispatch or arrival alone does not settle control.
  s3_zh: 企业在客户取得控制权时确认销售，并且把本企业控制的货物计入存货，即使货物不在本仓库。单凭发票、发运或到货，判断不了控制权。
  s3_zh_hk: 企業喺客戶取得控制權時確認銷售，並且把本企業控制嘅貨物計入存貨，即使貨物唔喺本倉庫。單憑發票、付運或者到貨，判斷唔到控制權。
