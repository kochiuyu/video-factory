  footer_en: Owner has earmarked cash of 20,000.
  footer_zh: 业主另预留现金二万港元。
  footer_zh_hk: 東主另預留現金二萬港元。
  s1_en: >-
    The three outcomes are mutually exclusive and exhaustive. Expected minor repairs are 8 percent, at
    120 each. Expected major repairs are 2 percent, at 500 each. These are estimates, not completed claims.
  s1_zh: 三种结果互斥而且已经穷尽。预计需要小修的占百分之八，每盏一百二十港元；需要大修的占百分之二，每盏五百港元。这些是估计，不是已经完成的索赔。
  s1_zh_hk: 三種結果互斥而且已經窮盡。預計需要小修嘅佔百分之八，每盞一百二十港元；需要大修嘅佔百分之二，每盞五百港元。呢啲係估計，唔係已經完成嘅索償。
  s2_en: >-
    Finance confirms a present obligation from the completed sales, a probable outflow for the batch as
    a whole, and a sufficiently reliable estimate. The policy is to record an expense and a provision
    for the weighted remaining repair costs.
  s2_zh: >-
    财务部门确认：已完成的销售形成了现时义务；从整批看很可能发生现金流出；并且有足够可靠的估计。题设政策是按加权剩余维修支出确认费用和质量保证预计负债。
  s2_zh_hk: 財務部確認：已完成嘅銷售形成咗現時義務；就整批而言很可能發生現金流出；並且有足夠可靠嘅估計。題設政策係按加權剩餘維修支出確認費用同保用撥備。
  s3_en: >-
    The owner has separately earmarked 20,000 of existing bank cash. That internal designation neither
    transfers money to customers nor legally restricts the bank account. It is not an expense entry.
  s3_zh: 业主另外从现有银行存款中预留了二万港元。这项内部指定既没有把钱转给客户，也没有在法律上限制银行账户。它不是费用分录。
  s3_zh_hk: 東主另外從現有銀行存款入面預留咗二萬港元。呢項內部指定既冇把錢轉畀客戶，亦冇喺法律上限制銀行戶口。佢唔係費用分錄。
