title_en: Expected repairs. Already a liability?
title_zh: 预计要维修，现在就应确认负债吗？
title_zh_hk: 預計會有維修，現在已有負債嗎？
beats:
- id: hook
  visual: still_image
  seconds: 24
  kicker: ACC-24
  kicker_en: ACC-24
  kicker_zh: ACC-24
  kicker_zh_hk: ACC-24
  title_en: Expected repairs. Already a liability?
  title_zh: 预计要维修，现在就应确认负债吗？
  title_zh_hk: 預計會有維修，現在已有負債嗎？
  image: art/expected-repairs-already-liability-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A retailer has sold 2,000 identical desk lamps with a six-month manufacturing-defect promise. No repair
    has occurred yet. What warranty provision would you propose, and how does it relate to 20,000 of earmarked
    cash? This is a fictional Hong Kong retailer. The promise is included assurance, not a separately
    sold service.
  zh: >-
    一家零售商已经售出二千盏相同的台灯，并承诺六个月内修理制造缺陷。目前还没有发生维修。你建议确认多少质量保证预计负债？它与预留的二万港元现金有何关系？这是虚构的香港零售商。这项承诺是随附保证，不是单独出售的维护服务。
  zh_hk: >-
    一間零售商已經售出二千盞相同嘅檯燈，並承諾六個月內修理製造缺陷。目前仲未發生維修。你建議確認多少保用撥備？佢同預留嘅二萬港元現金有何關係？呢個係虛構嘅香港零售商。呢項承諾係隨附保證，唔係單獨出售嘅維護服務。
