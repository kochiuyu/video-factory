  kicker_zh_hk: 暫停
  title_en: What adjustment is supported?
  title_zh: 现在应做哪项调整？
  title_zh_hk: 而家應做邊項調整？
  en: >-
    What provision and accounting adjustment are supported by the revised fault evidence? Reconcile liability,
    expense and earmarked cash, and explain what the retailer must still plan to fulfil its promises.
    Pause and vote.
  zh: 修订后的故障证据支持确认多少预计负债、如何调整账目？请分别说明负债、费用及预留现金，并指出零售商仍须怎样准备才能履行承诺。请暂停，投个票。
  zh_hk: 修訂後嘅故障證據支持確認多少撥備、點樣調整賬目？請分別說明負債、費用及預留現金，並指出零售商仍須點樣準備先可以履行承諾。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Estimate the whole population
  title_zh: 估计的是整批，不是一盏灯
  title_zh_hk: 估計嘅係整批，唔係一盞燈
  step1_en: >-
    Minor: 160 units, 19,200
  step1_zh: 小修一百六十盏，一万九千二
  step1_zh_hk: 小修一百六十盞，一萬九千二
  step2_en: >-
    Major: 40 units, 20,000
  step2_zh: 大修四十盏，二万
  step2_zh_hk: 大修四十盞，二萬
  step3_en: Initial provision 39,200
  step3_zh: 初始预计负债三万九千二
  step3_zh_hk: 初始撥備三萬九千二
  s1_en: >-
    Initially, expected minor repairs are 2,000 times 8 percent, or 160, costing 19,200. Expected major
    repairs are 2,000 times 2 percent, or 40, costing 20,000. The initial provision is 39,200.
  s1_zh: >-
    起初，预计小修是二千乘以百分之八，即一百六十盏，成本一万九千二百。预计大修是二千乘以百分之二，即四十盏，成本二万。初始质量保证预计负债是三万九千二百。
  s1_zh_hk: >-
    起初，預計小修係二千乘以百分之八，即一百六十盞，成本一萬九千二百。預計大修係二千乘以百分之二，即四十盞，成本二萬。初始保用撥備係三萬九千二百。
  s2_en: >-
    Equivalently, expected cost per sold lamp is 90 percent times zero, plus 8 percent times 120, plus
    2 percent times 500, which is 19.60; multiply by 2,000. These counts are estimates, not a list of
    identified customers.
  s2_zh: >-
    也可以先算每盏已售灯的期望成本：百分之九十乘以零，加上百分之八乘以一百二十，再加上百分之二乘以五百，等于十九点六港元；再乘以二千。这些件数是估计，不是已点名的客户名单。
  s2_zh_hk: >-
    亦可以先計每盞已售燈嘅期望成本：百分之九十乘以零，加上百分之八乘以一百二十，再加上百分之二乘以五百，等於十九點六港元；再乘以二千。呢啲件數係估計，唔係已點名嘅客戶名單。
  s3_en: >-
    No repair is the most common outcome for one lamp, but the policy measures the whole population. The
    20,000 cash earmark is an internal funding designation, not a cost estimate. Charging every lamp the
    major-repair cost would assume a different mix, unsupported by the evidence.
  s3_zh: >-
    对单盏灯来说，无需维修最常见，但题设政策衡量的是整批。预留的二万港元是内部资金安排，不是成本估计。如果每盏都按大修计，就等于采用了证据并不支持的另一种组合。
  s3_zh_hk: >-
    對單盞燈嚟講，無需維修最常見，但題設政策衡量嘅係整批。預留嘅二萬港元係內部資金安排，唔係成本估計。如果每盞都按大修計，就等於採用咗證據並唔支持嘅另一種組合。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Replace the mix, do not double
  title_zh: 替换组合，不要重复叠加
  title_zh_hk: 替換組合，唔好重複疊加
  step1_en: Revised provision 73,600
  step1_zh: 修订后预计负债七万三千六
  step1_zh_hk: 修訂後撥備七萬三千六
  step2_en: Additional expense 34,400
  step2_zh: 追加费用三万四千四
  step2_zh_hk: 追加費用三萬四千四
  step3_en: Earmark still 20,000
  step3_zh: 预留现金仍是二万
  step3_zh_hk: 預留現金仍係二萬
  s1_en: >-
    Updated minor cost is 2,000 times 14 percent times 120, or 33,600. Updated major cost is 2,000 times
    4 percent times 500, or 40,000. The revised provision is 73,600.
  s1_zh: >-
    更新后的小修成本是二千乘以百分之十四再乘以一百二十，即三万三千六百。大修成本是二千乘以百分之四再乘以五百，即四万。修订后的预计负债是七万三千六百。
  s1_zh_hk: >-
    更新後嘅小修成本係二千乘以百分之十四再乘以一百二十，即三萬三千六百。大修成本係二千乘以百分之四再乘以五百，即四萬。修訂後嘅撥備係七萬三千六百。
  s2_en: >-
    Additional expense and liability are 73,600 minus 39,200, or 34,400. Do not add the full revised estimate
    to the old provision. No settlement occurred, so no utilisation deduction is needed.
  s2_zh: 追加费用和负债是七万三千六百减三万九千二百，即三万四千四百。不要把修订后的全额再加到原预计负债上。期间没有结算，因此不必扣减已使用额。
  s2_zh_hk: 追加費用同負債係七萬三千六百減三萬九千二百，即三萬四千四百。唔好把修訂後嘅全額再加到原撥備度。期間冇結算，因此唔使扣減已使用額。
  s3_en: >-
    The liability is now 73,600, and cumulative warranty expense for this batch is also 73,600. Cash paid
    on claims remains zero. The earmark remains 20,000, which is 53,600 below the current estimate, but
    that does not prove total available cash is insufficient.
  s3_zh: >-
    负债现为七万三千六百，本批累计质量保证费用也是七万三千六百。已付维修现金仍是零。预留现金仍是二万，比当前估计少五万三千六百，但这并不能证明零售商的全部可用现金不足。
  s3_zh_hk: >-
    負債現為七萬三千六百，本批累計保用費用亦係七萬三千六百。已付維修現金仍係零。預留現金仍係二萬，比當前估計少五萬三千六百，但呢個並唔能證明零售商嘅全部可用現金不足。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: What would change the answer?
  title_zh: 什么会改变这个答案？
  title_zh_hk: 咩會改變呢個答案？
  en: >-
    Uncertainty does not erase a supported present obligation, and it does not justify inventing extra
    liabilities for possible future sales. If claims had already been settled, a utilisation deduction
    would be needed. Separate service warranties would require a different assessment.
  zh: >-
    存在不确定性，并不能抹掉有证据支持的现时义务，也不能为尚未发生的未来销售凭空多计负债。如果索赔已经结算，就要扣减已使用额。单独出售的维护服务需要另一套评估。
  zh_hk: >-
    存在不確定性，並唔能抹掉有證據支持嘅現時義務，亦唔能為尚未發生嘅未來銷售憑空多計負債。如果索償已經結算，就要扣減已使用額。單獨出售嘅維護服務需要另一套評估。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: An earmark is not the estimate
  title_zh: 预留现金不是估计金额
  title_zh_hk: 預留現金唔係估計金額
  q1_en: Initial provision 39,200
  q1_zh: 初始预计负债三万九千二
  q1_zh_hk: 初始撥備三萬九千二
  q2_en: Updated provision 73,600
  q2_zh: 更新后预计负债七万三千六
  q2_zh_hk: 更新後撥備七萬三千六
  s1_en: >-
    Measure the whole sold population, not the most common outcome for one lamp. The weighted estimate
    is 39,200 at first, then 73,600 when the mix is replaced.
  s1_zh: 估计的是整批已售产品，不是单盏灯最常见的结果。按加权计算，起初是三万九千二百，替换组合后是七万三千六百。
  s1_zh_hk: 估計嘅係整批已售產品，唔係單盞燈最常見嘅結果。按加權計算，起初係三萬九千二百，替換組合後係七萬三千六百。
  s2_en: >-
    Keep the liability, the expense and the cash earmark as three separate records. Changing the accounting
    estimate to fit a cash preference does not fulfil the promise.
  s2_zh: 负债、费用和预留现金要分开看。不能为了迁就现金安排去改会计估计，那样并不能履行承诺。
  s2_zh_hk: 負債、費用同預留現金要分開睇。唔能為咗遷就現金安排去改會計估計，咁樣並唔能履行承諾。
  s3_en: >-
    The firm, the offers and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、报价和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、報價同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
duration_target_s: 198
