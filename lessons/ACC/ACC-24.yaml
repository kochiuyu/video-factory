  row2_zh: 仅需小修
  row2_zh_hk: 只需小修
  row3_en: Major repair only
  row3_zh: 仅需大修
  row3_zh_hk: 只需大修
  col1_en: Share
  col1_zh: 估计比重
  col1_zh_hk: 估計比重
  col2_en: Cost each
  col2_zh: 每盏受影响成本
  col2_zh_hk: 每盞受影響成本
  c11: 90%
  c12: '0'
