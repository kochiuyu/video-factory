  title_en: What provision do you propose?
  title_zh: 你建议确认多少预计负债？
  title_zh_hk: 你建議確認多少撥備？
  en: >-
    What warranty provision would you propose from the initial evidence, and how would you explain its
    relationship to the 20,000 cash earmark? Show the weighted calculation rather than choosing only the
    most common outcome. Pause and vote.
  zh: 按初步资料，你建议确认多少质量保证预计负债？它与预留的二万港元有何关系？请列出加权计算，不能只采用最常见的那一种结果。请暂停，投个票。
  zh_hk: 按初步證據，你建議確認多少保用撥備？佢同預留嘅二萬港元有何關係？請列出加權計算，唔可以只用最常見嗰一種結果。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: A revised fault mix
  title_zh: 修订后的故障组合
  title_zh_hk: 修訂後嘅故障組合
  step1_en: No repair now 82 percent
  step1_zh: 无需维修现为百分之八十二
  step1_zh_hk: 無需維修現為百分之八十二
  step2_en: Minor repair now 14 percent
  step2_zh: 小修现为百分之十四
  step2_zh_hk: 小修現為百分之十四
  step3_en: Major repair now 4 percent
  step3_zh: 大修现为百分之四
  step3_zh_hk: 大修現為百分之四
  s1_en: >-
    At a later internal measurement date, before any claims are settled or further lamps sold, a technical
    review identifies a higher incidence of faults. The revised mix replaces the earlier mix; it is not
    a second batch.
  s1_zh: 在后来的内部计量日，索赔尚未结算，也没有再售出台灯。技术复核显示故障率更高。新的组合取代原来的组合，不是第二批产品，也不是额外索赔。
  s1_zh_hk: 喺後來嘅內部計量日，索償尚未結算，亦冇再售出檯燈。技術覆核顯示故障率更高。新嘅組合取代原來嘅組合，唔係第二批產品，亦唔係額外索償。
  s2_en: >-
    The 2,000 units, repair costs, warranty terms and remaining coverage are unchanged. No cash repair
    payments have occurred. The internally earmarked cash is still 20,000.
  s2_zh: 二千盏灯、维修成本、保修条款和剩余保障范围都没有变。期间没有支付维修费。内部预留现金仍是二万港元。
  s2_zh_hk: 二千盞燈、維修成本、保用條款同剩餘保障範圍都冇變。期間冇支付維修費。內部預留現金仍係二萬港元。
  s3_en: >-
    Update the existing provision to the revised weighted estimate and record only the increase as additional
    expense. The retailer cannot cap customer remedies at the earmarked amount.
  s3_zh: 把现有预计负债更新为修订后的加权估计，只把增加额记为追加费用。零售商不能用预留金额来限制对客户的救济。
  s3_zh_hk: 把現有撥備更新為修訂後嘅加權估計，只把增加額記為追加費用。零售商唔能用預留金額嚟限制對客戶嘅救濟。
