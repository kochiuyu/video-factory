  s1_en: >-
    The enclosed cutter still works safely. A sustained fall in demand has reduced expected future work,
    so the controller has identified an impairment indicator.
  s1_zh: 这台封闭式裁纸机仍能安全运行。印刷装订需求持续下降，预期工作量减少，财务主管已发现减值迹象。
  s1_zh_hk: 呢部封閉式裁紙機仍能安全運行。印刷裝訂需求持續下降，預期工作量減少，財務主管已發現減值跡象。
  s2_en: >-
    Correct scheduled depreciation of 24,000 has already been recorded, leaving a carrying amount of 120,000.
    A reviewed estimate puts fair value less all disposal costs at 80,000. There is no decision to sell
    or abandon it.
  s2_zh: 本年已正确计提折旧二万四千，账面价值为十二万。经复核，公允价值减去全部处置费用后的净额估计为八万。工厂并未决定出售或弃用。
  s2_zh_hk: 本年已正確計提折舊二萬四千，賬面值係十二萬。經覆核，公平值減去全部出售成本估計為八萬。工場並未決定出售或棄用。
  s3_en: >-
    At present you do not know whether the cutter generates largely independent customer cash inflows.
    You have time to obtain the cash-inflow map and reviewed use-value estimates before finalising the
    report.
  s3_zh: 目前还不知道裁纸机是否带来大致独立的客户现金流入。报表未定稿，仍有时间取得现金流量图和经复核的使用价值估计。
  s3_zh_hk: 目前仲未知裁紙機係咪帶來大致獨立嘅客戶現金流入。報表未定稿，仍有時間取得現金流量圖同經覆核嘅使用價值估計。
