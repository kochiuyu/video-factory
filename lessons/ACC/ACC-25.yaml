title_en: Depreciated on schedule. Still worth carrying?
title_zh: 折旧按计划计提了，账面价值还能收回吗？
title_zh_hk: 折舊已照表入賬，賬面值還收得回嗎？
beats:
- id: hook
  visual: still_image
  seconds: 24
  kicker: ACC-25
  kicker_en: ACC-25
  kicker_zh: ACC-25
  kicker_zh_hk: ACC-25
  title_en: Depreciated on schedule. Still worth carrying?
  title_zh: 折旧按计划计提了，账面价值还能收回吗？
  title_zh_hk: 折舊已照表入賬，賬面值還收得回嗎？
  image: art/depreciated-schedule-worth-carrying-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Scheduled depreciation of 24,000 has already been recorded, leaving a cutter at 120,000. Its fair
    value less disposal costs is 80,000, and demand has fallen. Would you close with depreciation only,
    write it down to 80,000, or complete a recoverability review first? This is a fictional Hong Kong
    bookbinding workshop.
  zh: >-
    本年已按计划计提折旧二万四千，裁纸机账面价值为十二万。经复核，公允价值减去处置费用后的净额是八万，而需求已经下降。你会只按折旧结账、立即减记至八万，还是先完成可收回性复核？这是虚构的香港装订工场。
  zh_hk: >-
    本年已照表計提折舊二萬四千，裁紙機賬面值係十二萬。經覆核，公平值減出售成本係八萬，而需求已經下降。你會只按折舊結賬、立即減記至八萬，定係先完成可收回性覆核？呢個係虛構嘅香港裝訂工場。
