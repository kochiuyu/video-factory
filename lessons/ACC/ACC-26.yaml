  s1_en: >-
    Supply bought 1,000 identical kits from an outside supplier for 80 each, then completed a valid sale
    of the entire batch to Shop for 100 each. Delivery and acceptance are complete.
  s1_zh: 供应公司从外部供应商以每套八十港元购入一千套相同配件，再以每套一百把整批有效出售给商店公司。交货和验收均已完成。
  s1_zh_hk: 供應公司從外部供應商以每套八十港元購入一千套相同配件，再以每套一百把整批有效出售畀商店公司。交貨同驗收均已完成。
  s2_en: >-
    At the first snapshot, Shop still holds all 1,000 kits. Supply reports revenue 100,000, cost of sales
    80,000 and gross profit 20,000. Shop reports closing inventory of 100,000 and no sale.
  s2_zh: 在第一个时点，商店公司仍持有全部一千套。供应公司列示收入十万、销售成本八万、毛利二万。商店公司列示期末存货十万，尚未对外销售。
  s2_zh_hk: 喺第一個時點，商店公司仍持有全部一千套。供應公司列示收入十萬、銷貨成本八萬、毛利二萬。商店公司列示期末存貨十萬，尚未對外銷售。
  s3_en: >-
    Your job is not to change the agreed transfer price, reverse the legal sale or move stock. Show group
    inventory and batch gross profit, plus the adjustment from the entity totals.
  s3_zh: 你的工作不是去改已经约定的转让价格，也不是去撤销合法销售或搬动存货。请列出集团存货和该批毛利，并说明如何从两家公司的合计数调节过来。
  s3_zh_hk: 你嘅工作唔係去改已經約定嘅轉讓價格，亦唔係去撤銷合法銷售或搬動存貨。請列出集團存貨同該批毛利，並說明點樣從兩間公司嘅合計數調節過嚟。
