- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: No outside sale at first
  title_zh: 起初还没有对外销售
  title_zh_hk: 起初仲未有對外銷售
  step1_en: Group inventory 80,000
  step1_zh: 集团存货八万
  step1_zh_hk: 集團存貨八萬
  step2_en: Group revenue and profit nil
  step2_zh: 集团收入和毛利为零
  step2_zh_hk: 集團收入同毛利為零
  step3_en: Remove the 20,000 in stock
  step3_zh: 抵销存货中的二万利润
  step3_zh_hk: 抵銷存貨入面嘅二萬利潤
  s1_en: >-
    At the first snapshot the group still holds all 1,000 kits at its outside acquisition cost: 1,000
    times 80, which is 80,000. It has no external revenue or cost of sales, and no batch gross profit.
  s1_zh: 在第一个时点，集团仍按对外购入成本持有全部一千套：一千乘以八十，即八万。集团还没有对外收入或销售成本，该批毛利为零。
  s1_zh_hk: 喺第一個時點，集團仍按對外購入成本持有全部一千套：一千乘以八十，即八萬。集團仲未有對外收入或銷貨成本，該批毛利為零。
  s2_en: >-
    The 100,000 internal sale is removed from group revenue and cost of sales. The 20,000 profit embedded
    in stock is removed from inventory and added to cost of sales. Together these give revenue nil, cost
    of sales nil and gross profit nil.
  s2_zh: 要从集团收入和销售成本中抵销十万内部销售，并把存货中包含的二万利润从存货转出、加入销售成本。合起来，收入、销售成本和毛利都是零。
  s2_zh_hk: 要從集團收入同銷貨成本入面抵銷十萬內部銷售，並把存貨入面包含嘅二萬利潤從存貨轉出、加入銷貨成本。合起嚟，收入、銷貨成本同毛利都係零。
  s3_en: >-
    Consolidation entries are worksheet adjustments. They do not deny that the companies traded, and they
    do not automatically cancel a valid invoice or undo the entity ledgers.
  s3_zh: 合并抵销是工作底稿上的调整，并不是否认两家公司做过交易，也不会自动取消有效发票，或改写单体账簿。
  s3_zh_hk: 合併抵銷係工作底稿上嘅調整，並唔係否認兩間公司做過交易，亦唔會自動取消有效發票，或改寫單體賬簿。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Eliminate only what remains
  title_zh: 只抵销尚未售出的部分
  title_zh_hk: 只抵銷尚未售出嘅部分
  step1_en: Unrealised profit 8,000
  step1_zh: 未实现利润八千
  step1_zh_hk: 未實現利潤八千
  step2_en: Group inventory 32,000
  step2_zh: 集团存货三万二千
  step2_zh_hk: 集團存貨三萬二千
  step3_en: Group gross profit 42,000
  step3_zh: 集团毛利四万二千
  step3_zh_hk: 集團毛利四萬二千
  s1_en: >-
    The internal uplift is 100 minus 80, or 20 per kit. Only 400 kits remain, so unrealised profit is
    400 times 20, or 8,000. Group closing inventory is 40,000 minus 8,000, which is 32,000.
  s1_zh: 内部加价是一百减八十，即每套二十港元。只剩四百套，未实现利润是四百乘以二十，即八千。集团期末存货是四万减八千，即三万二千。
  s1_zh_hk: 內部加價係一百減八十，即每套二十港元。只剩四百套，未實現利潤係四百乘以二十，即八千。集團期末存貨係四萬減八千，即三萬二千。
  s2_en: >-
    The 600 kits sold outside carry group cost of 600 times 80, or 48,000. External revenue is 90,000,
    so group gross profit is 42,000.
  s2_zh: 对外售出的六百套，按集团成本每套八十计算，销售成本是四万八千。对外收入九万，因此集团毛利是四万二千。
  s2_zh_hk: 對外售出嘅六百套，按集團成本每套八十計算，銷貨成本係四萬八千。對外收入九萬，因此集團毛利係四萬二千。
  s3_en: >-
    Combined revenue is 190,000 and cost of sales 140,000. Remove the full internal sale of 100,000 from
    both, then add 8,000 to cost of sales. Combined gross profit of 50,000 less 8,000 equals 42,000.
  s3_zh: 两家合计收入十九万、销售成本十四万。先全额抵销十万内部销售，再在销售成本中加入八千未实现利润。合计毛利五万减去八千，等于四万二千。
  s3_zh_hk: 兩間合計收入十九萬、銷貨成本十四萬。先全額抵銷十萬內部銷售，再喺銷貨成本加入八千未實現利潤。合計毛利五萬減八千，等於四萬二千。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: What would change the answer?
  title_zh: 什么会改变这个答案？
  title_zh_hk: 咩會改變呢個答案？
  en: >-
    The correct elimination depends on how much of this batch remains, not on whether any external sale
    occurred. Collecting an internal invoice does not create an external group sale. Income tax is ignored
    in this gross-profit exercise; real consolidated accounts can require deferred-tax adjustments.
  zh: >-
    正确的抵销取决于这批货还剩多少，而不是有没有做过任何对外销售。收回内部账款，并不等于集团已对外销售。本题计算毛利时不考虑所得税；实际合并报表可能需要调整递延所得税。
  zh_hk: >-
    正確嘅抵銷取決於呢批貨仲剩多少，而唔係有冇做過任何對外銷售。收回內部賬款，並唔等於集團已對外銷售。呢題計算毛利時唔考慮所得稅；實際合併報表可能需要調整遞延所得稅。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Only unsold profit is unrealised
  title_zh: 未售出的利润才未实现
  title_zh_hk: 未售出嘅利潤先至未實現
  q1_en: >-
    First snapshot: group profit nil
  q1_zh: 第一时点：集团毛利为零
  q1_zh_hk: 第一時點：集團毛利為零
  q2_en: Then eliminate remaining 8,000
  q2_zh: 随后只抵销剩余的八千
  q2_zh_hk: 其後只抵銷剩餘嘅八千
  s1_en: >-
    From the group’s point of view, a completed internal sale is not an outside sale. While all kits remain
    inside the group, inventory is held at the 80,000 outside cost and batch gross profit is nil.
  s1_zh: 站在集团角度看，已经完成的内部销售还不是对外销售。只要这批货全部留在集团，存货就按对外购入成本八万计量，该批毛利为零。
  s1_zh_hk: 站喺集團角度睇，已經完成嘅內部銷售仲唔係對外銷售。只要呢批貨全部留喺集團，存貨就按對外購入成本八萬計量，該批毛利為零。
  s2_en: >-
    After 600 kits are sold outside, only the 8,000 unrealised profit on the remaining 400 kits is eliminated.
    Full internal revenue elimination and partial remaining-profit elimination are different steps.
  s2_zh: 对外售出六百套之后，只需抵销余下四百套中的八千未实现利润。全额抵销内部收入，与只抵销剩余内部利润，是两个不同步骤。
  s2_zh_hk: 對外售出六百套之後，只需抵銷餘下四百套入面嘅八千未實現利潤。全額抵銷內部收入，同只抵銷剩餘內部利潤，係兩個唔同步驟。
  s3_en: >-
    The firm, the offers and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、报价和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、報價同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
