  en: >-
    Supply Co sold 1,000 kits to Shop Co for 100 each, after buying them for 80 each. No kits have yet
    left the group. What inventory and batch gross profit should the group report? You prepare a consolidation
    worksheet for a fictional Hong Kong group. The parent wholly owns both companies.
  zh: >-
    供应公司以每套八十港元购入一千套配件，再以每套一百全部卖给商店公司。这批货还没有离开集团。集团应列示多少存货和该批毛利？你为一家虚构的香港集团编制合并抵销工作底稿。母公司全程全资拥有这两家公司。
  zh_hk: >-
    供應公司以每套八十港元購入一千套配件，再以每套一百全部賣畀商店公司。呢批貨仲未離開集團。集團應列示多少存貨同該批毛利？你為一間虛構嘅香港集團編製合併抵銷工作底稿。母公司全程全資擁有呢兩間公司。
