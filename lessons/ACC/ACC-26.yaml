  s1_en: >-
    Later in the same period, Shop has sold and delivered 600 kits to unrelated customers for 150 each.
    All revenue-recognition conditions for those sales are met. The other 400 kits remain in Shop.
  s1_zh: 同一期间稍后，商店公司已按每套一百五十港元，向无关客户出售并交付六百套，收入确认条件均已满足。其余四百套仍留在商店公司。
  s1_zh_hk: 同一期間稍後，商店公司已按每套一百五十港元，向無關客戶出售並交付六百套，收入確認條件均已滿足。其餘四百套仍留喺商店公司。
  s2_en: >-
    Shop now reports external revenue of 90,000, cost of sales of 60,000, gross profit of 30,000 and closing
    inventory of 40,000. These are updated cumulative figures for the same batch, not amounts to add to
    the first snapshot.
  s2_zh: 商店公司现列示对外收入九万、销售成本六万、毛利三万、期末存货四万。这些是同一批次的累计更新数，不是要加在第一个时点之上的新数。
  s2_zh_hk: 商店公司現列示對外收入九萬、銷貨成本六萬、毛利三萬、期末存貨四萬。呢啲係同一批次嘅累計更新數，唔係要加喺第一個時點之上嘅新數。
  s3_en: >-
    Supply’s completed internal sale and its 20,000 entity gross profit are unchanged. One colleague wants
    to eliminate the original 20,000 again in full; another says the external sale means no profit adjustment
    is needed.
  s3_zh: 供应公司已完成的内部销售及其单体毛利二万没有变。有同事建议仍全额抵销原来的二万内部利润；也有人认为，既然已经对外销售，就不必再调整利润。
  s3_zh_hk: 供應公司已完成嘅內部銷售及其單體毛利二萬冇變。有同事建議仍全額抵銷原來嘅二萬內部利潤；亦有人認為，既然已經對外銷售，就唔使再調整利潤。
