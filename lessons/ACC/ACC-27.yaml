  row2_zh: 可避免的二次上门
  row2_zh_hk: 可避免嘅再次上門
  row3_en: >-
    E: service escalations
  row3_zh: E：服务个案升级
  row3_zh_hk: E：服務個案升級
  row4_en: >-
    K: kit exceptions, 500 jobs
  row4_zh: K：五百项预约中的备件包异常
  row4_zh_hk: K：五百項預約中嘅零件包異常
