title_en: The result improved. Which warning was missed?
title_zh: 业绩好转，哪项预警被忽略了？
title_zh_hk: 業績好轉，漏看了哪個警號？
beats:
- id: hook
  visual: still_image
  seconds: 24
  kicker: ACC-27
  kicker_en: ACC-27
  kicker_zh: ACC-27
  kicker_zh_hk: ACC-27
  title_en: The result improved. Which warning was missed?
  title_zh: 业绩好转，哪项预警被忽略了？
  title_zh_hk: 業績好轉，漏看了哪個警號？
  image: art/result-improved-warning-missed-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Operating profit rose from 120,000 to 150,000, but avoidable repeat visits also rose. You may add
    only one more scorecard measure: escalation count E, or kit-readiness exception rate K. Which would
    you choose, and what sequence would you check first? This is a fictional Hong Kong office-equipment
    repair network.
  zh: >-
    营业利润从十二万升到十五万，但可避免的二次上门也增加了。计分卡只能再加一项指标：服务升级工单数 E，或备件包异常率 K。你会选哪一项，又会先核对该指标背后的事件顺序？这是虚构的香港办公设备维修网络。
  zh_hk: >-
    營運溢利由十二萬升到十五萬，但可避免嘅再次上門亦增加咗。計分卡只能再加一項指標：客戶個案升級數 E，或零件包異常率 K。你會選邊一項，又會先核對該指標背後嘅事件順序？呢個係虛構嘅香港辦公設備維修網絡。
