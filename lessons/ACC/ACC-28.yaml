  step1_en: C removes repositionable dividers
  step1_zh: 零件 C 改为固定隔板，失去可调隔层
  step1_zh_hk: 零件 C 改為固定隔板，失去可調隔層
  step2_en: A keeps every specified function
  step2_zh: 装配 A 保留全部规定功能
  step2_zh_hk: 裝配 A 保留全部規定功能
  step3_en: The 8 saving is validated
  step3_zh: 装配 A 节省八港元已获验证
  step3_zh_hk: 裝配 A 節省八港元已獲驗證
  s1_en: >-
    The customer requirement identifies repositionable internal dividers as essential. The original design
    meets it. C uses a fixed divider moulding, so it removes that essential function. The feasible price
    range applies only to products meeting the full requirement.
  s1_zh: >-
    顾客要求把可重新摆放的内部隔板列为必要功能。原设计符合要求。零件 C改用固定隔板模具，因而取消了这项必要功能。可行售价区间只适用于满足全部要求的产品。
  s1_zh_hk: >-
    顧客要求把可重新擺放嘅內部隔板列為必要功能。原設計符合要求。零件 C改用固定隔板模具，因而取消咗呢項必要功能。可行售價區間只適用於滿足全部要求嘅產品。
  s2_en: >-
    A eliminates a separate alignment-and-fastening operation through an integrated guide. The review
    confirms that it preserves repositionability, strength, safety, appearance, durability and all other
    specified requirements.
  s2_zh: 装配 A用一体化导轨取消了一道单独的对准和紧固作业。评审确认，它保留了可重新摆放、强度、安全、外观、耐用及所有其他规定要求。
  s2_zh_hk: 裝配 A用一體化導軌取消咗一道單獨嘅對準同緊固作業。評審確認，佢保留咗可重新擺放、強度、安全、外觀、耐用及所有其他規定要求。
  s3_en: >-
    The net 8 saving on A is validated after all variable consequences, including expected warranty work.
    Neither the contribution requirement nor the essential feature can be waived in this exercise.
  s3_zh: 装配 A净节省八港元，已计入全部变动后果，包括预计质量保证支出，并已获验证。本题不可放宽边际贡献下限，也不可放弃这项必要功能。
  s3_zh_hk: 裝配 A淨節省八港元，已計入全部變動後果，包括預計保用支出，並已獲驗證。呢題唔可以放寬邊際貢獻下限，亦唔可以放棄呢項必要功能。
