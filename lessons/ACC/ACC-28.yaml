  title_en: Which design and price work?
  title_zh: 哪项设计和售价同时符合？
  title_zh_hk: 邊項設計同售價同時符合？
  en: >-
    Which design and feasible price meet both the essential requirement and the contribution target, and
    why is the largest nominal saving not the answer? Pause and vote.
  zh: 哪项设计和哪个可行售价能同时满足必要功能与边际贡献目标？为什么名义节省最大的方案不是答案？请暂停，投个票。
  zh_hk: 邊項設計同邊個可行售價能同時滿足必要功能同邊際貢獻目標？點解名義節省最大嘅方案唔係答案？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Work backward from price
  title_zh: 由售价倒推
  title_zh_hk: 由售價倒推
  step1_en: At 95, allowable cost is 65
  step1_zh: 售价九十五，允许成本六十五
  step1_zh_hk: 售價九十五，可容許成本六十五
  step2_en: At 100, allowable cost is 70
  step2_zh: 售价一百，允许成本七十
  step2_zh_hk: 售價一百，可容許成本七十
  step3_en: Current gap is 13 to 8
  step3_zh: 现设计缺口十三至八
  step3_zh_hk: 現設計差額十三至八
  s1_en: >-
    At 95, allowable variable cost is 95 minus 30, or 65, and the current cost gap is 78 minus 65, or
    13. At 100, allowable cost is 70 and the gap is 8. Across the range, the gap falls from 13 to 8.
  s1_zh: >-
    售价九十五时，允许变动成本是九十五减三十，即六十五，当前成本缺口是七十八减六十五，即十三。售价一百时，允许成本是七十，缺口是八。在整个区间内，缺口从十三降到八。
  s1_zh_hk: >-
    售價九十五時，可容許變動成本係九十五減三十，即六十五，當前成本差額係七十八減六十五，即十三。售價一百時，可容許成本係七十，差額係八。喺整個區間內，差額由十三降到八。
  s2_en: >-
    C is a reasonable first investigation because its larger saving could close the gap at a lower price:
    cost 68 needs a price of at least 98 for 30 contribution. A requires 100. Choosing A first to investigate
    process simplification is also defensible.
  s2_zh: >-
    先研究零件 C 是合理的，因为它节省更多，可能在较低售价下补上缺口：成本六十八至少要卖到九十八，才有三十的边际贡献。装配 A 则需要售价一百。先研究装配 A 的简化工序，也可以说得通。
  s2_zh_hk: >-
    先研究零件 C 係合理嘅，因為佢節省更多，可能喺較低售價下補上差額：成本六十八至少要賣到九十八，先至有三十嘅邊際貢獻。裝配 A 則需要售價一百。先研究裝配 A 嘅簡化工序，亦可以說得通。
  s3_en: >-
    Neither candidate can be selected on arithmetic alone before checking functions, quality and all affected
    costs.
  s3_zh: 在核对功能、质量和全部受影响成本之前，不能单凭算术就选定方案。
  s3_zh_hk: 喺核對功能、質素同全部受影響成本之前，唔能單憑算術就選定方案。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: The smaller valid saving wins
  title_zh: 较小但有效的节省才管用
  title_zh_hk: 較小但有效嘅節省先至管用
  step1_en: C fails the essential function
  step1_zh: 零件 C 不符合必要功能
  step1_zh_hk: 零件 C 唔符合必要功能
  step2_en: Choose A at a price of 100
  step2_zh: 选择装配 A，售价一百
  step2_zh_hk: 選擇裝配 A，售價一百
  step3_en: At 95, A misses the target by 5
  step3_zh: 售价九十五时装配 A 还差五
  step3_zh_hk: 售價九十五時裝配 A 仲差五
  s1_en: >-
    C fails the essential repositionable-divider requirement. Its 68 cost would give 32 contribution at
    100, but that calculation uses a selling-price assumption that does not apply to the changed product.
  s1_zh: 零件 C 不符合可重新摆放隔板这项必要要求。若按一百港元售价，成本六十八似乎有三十二的边际贡献，但这个售价假定并不适用于已经改动功能的产品。
  s1_zh_hk: 零件 C 唔符合可重新擺放隔板呢項必要要求。若按一百港元售價，成本六十八似乎有三十二嘅邊際貢獻，但呢個售價假定並唔適用於已經改動功能嘅產品。
  s2_en: >-
    Choose A at 100: variable cost 70 leaves the required 30 contribution and preserves every specified
    function. At 95, A leaves only 25, missing the target by 5. Within the supplied range, only 100 works
    for A.
  s2_zh: >-
    应选择装配 A，售价一百：变动成本七十，刚好留下要求的三十边际贡献，并保留全部规定功能。售价九十五时，装配 A 只剩二十五，还差五港元。在题设区间内，装配 A 只有一百港元这一档可行。
  s2_zh_hk: >-
    應選擇裝配 A，售價一百：變動成本七十，剛好留下要求嘅三十邊際貢獻，並保留全部規定功能。售價九十五時，裝配 A 只剩二十五，仲差五港元。喺題設區間內，裝配 A 只有一百港元呢一檔可行。
  s3_en: >-
    The current design yields at most 22 and fails throughout. The validated assembly change removes avoidable
    work rather than customer-valued capability. That does not by itself establish total product profit
    or a real-world sales forecast.
  s3_zh: >-
    现设计最多只能得到二十二的边际贡献，在整个区间都不达标。获验证的装配改动去掉的是可避免的作业，不是顾客看重的功能。但这并不能单独证明产品整体盈利。
  s3_zh_hk: >-
    現設計最多只能得到二十二嘅邊際貢獻，喺整個區間都唔達標。獲驗證嘅裝配改動去掉嘅係可避免嘅作業，唔係顧客看重嘅功能。但呢個並唔能單獨證明產品整體盈利。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: What would change the answer?
  title_zh: 什么会改变这个答案？
  title_zh_hk: 咩會改變呢個答案？
  en: >-
    A different fixed-divider offer would need new requirements and market evidence. Do not silently redefine
    the customer or call the lost function unnecessary. Fixed costs are outside this variable-cost screen;
    they are funded and unchanged, but they are not a full life-cycle profit test.
  zh: >-
    如果要改推固定隔板的另一种产品，就必须重新确定要求和市场证据。不能悄悄改写顾客，或把失去的功能说成不必要。固定成本不在这道变动成本筛选之内；它们已有拨款且不变，但也不能代替完整的生命周期盈利测试。
  zh_hk: >-
    如果要改推固定隔板嘅另一種產品，就必須重新確定要求同市場證據。唔能悄悄改寫顧客，或把失去嘅功能說成唔必要。固定成本唔喺呢道變動成本篩選之內；它們已有撥款且不變，但亦唔能代替完整嘅生命周期盈利測試。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Keep what the price assumes
  title_zh: 售价假定的功能必须保留
  title_zh_hk: 售價假定嘅功能必須保留
  q1_en: Allowable cost 65 to 70
  q1_zh: 允许变动成本六十五至七十
  q1_zh_hk: 可容許變動成本六十五至七十
  q2_en: Choose Assembly A at 100
  q2_zh: 选择装配 A，售价一百
  q2_zh_hk: 選擇裝配 A，售價一百
  s1_en: >-
    Work backward from the feasible price and the required contribution. Here the allowable variable cost
    rises from 65 to 70, and the current design’s gap falls from 13 to 8.
  s1_zh: 要从可行售价和边际贡献目标倒推。本题允许变动成本从六十五升到七十，现设计的成本缺口从十三降到八。
  s1_zh_hk: 要由可行售價同邊際貢獻目標倒推。呢題可容許變動成本由六十五升到七十，現設計嘅成本差額由十三降到八。
  s2_en: >-
    The largest nominal saving is not the answer if it removes a function that the price range assumes.
    Assembly A at 100 closes the valid gap and preserves the essential dividers.
  s2_zh: 如果节省最大的方案取消了售价区间所假定的功能，它就不是答案。装配 A在售价一百时补上了有效缺口，并保留了必要的可调隔板。
  s2_zh_hk: 如果節省最大嘅方案取消咗售價區間所假定嘅功能，佢就唔係答案。裝配 A喺售價一百時補上咗有效差額，並保留咗必要嘅可調隔板。
  s3_en: >-
    The firm, the offers and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、报价和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、報價同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
duration_target_s: 192
