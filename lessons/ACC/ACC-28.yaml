  s1_en: >-
    Any net selling price from 95 to 100 is feasible for the specified product at the same planned volume.
    Prices outside that range are not feasible. Management requires at least 30 contribution per unit:
    net selling price minus all variable costs.
  s1_zh: >-
    就这款规定产品、在同一计划销量下，九十五到一百港元的净售价都可行；区间以外则不可行。管理层要求单位边际贡献至少三十港元，也就是净售价减去全部变动成本。
  s1_zh_hk: >-
    就呢款規定產品、喺同一計劃銷量下，九十五到一百港元嘅淨售價都可行；區間以外則不可行。管理層要求單位邊際貢獻至少三十港元，亦即淨售價減全部變動成本。
  s2_en: >-
    The current design costs 78 per unit. Component C is estimated to save 10, bringing cost to 68. Assembly
    A is estimated to save 8, bringing cost to 70. The options are alternatives, not additive. Neither
    saving is yet a release authorisation.
  s2_zh: >-
    现设计每件成本七十八。零件 C估计可节省十港元，成本降至六十八。装配 A估计可节省八港元，成本降至七十。两案只能二选一，节省不能相加。任何一项节省都还不是投产批准。
  s2_zh_hk: >-
    現設計每件成本七十八。零件 C估計可節省十港元，成本降至六十八。裝配 A估計可節省八港元，成本降至七十。兩案只能二選一，節省唔能相加。任何一項節省都仲未係投產批准。
  s3_en: >-
    Fixed design and capacity costs are already separately funded and unchanged. Calculate the allowable
    variable cost and gap across the feasible price range, then name the evidence you require before treating
    either saving as acceptable.
  s3_zh: 固定的设计和产能成本已另行拨款，并且不会因任一方案而改变。请计算整段价格范围的允许变动成本及缺口，再说凭什么证据才接纳节省。
  s3_zh_hk: 固定嘅設計同產能成本已另行撥款，並且唔會因任一方案而改變。請計算整段價格範圍嘅可容許變動成本及差額，再說憑乜證據先接納節省。
