  title_en: Which redesign first?
  title_zh: 你会先研究哪项改进？
  title_zh_hk: 你會先研究邊項改進？
  en: >-
    Which redesign would you examine first, and what allowable cost and cost gap follow from the price
    range and required contribution? Pause and vote. Production has not begun, and no customer orders
    have been accepted.
  zh: >-
    你准备优先研究哪项改进？根据可行售价区间和边际贡献目标，允许变动成本及当前设计的成本缺口是多少？请暂停，投个票。生产尚未开始，也尚未接受客户订单。
  zh_hk: >-
    你準備優先研究邊項改進？根據可行售價區間同邊際貢獻目標，可容許變動成本及現設計嘅成本差額係多少？暫停，投個票。生產尚未開始，亦尚未接受客戶訂單。
