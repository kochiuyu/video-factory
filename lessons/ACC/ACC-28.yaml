  title_en: A market price. A design cost gap?
  title_zh: 售价区间已定，设计成本还要降多少？
  title_zh_hk: 市價定了，設計成本還差多少？
  image: art/market-price-design-cost-gap-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A desktop storage box can sell for 95 to 100, and management requires at least 30 of contribution
    per unit. The current design costs 78. Which redesign would you examine first, Component C or Assembly
    A? This is a fictional Hong Kong maker. Production has not begun.
  zh: >-
    一款桌面收纳盒的可行净售价是九十五到一百港元，管理层要求单位边际贡献至少三十港元。现设计每件成本七十八。你会先研究零件 C，还是装配 A？这是虚构的香港制造商。生产尚未开始。
  zh_hk: >-
    一款桌面收納盒嘅可行淨售價係九十五到一百港元，管理層要求單位邊際貢獻至少三十港元。現設計每件成本七十八。你會先研究零件 C，定係裝配 A？呢個係虛構嘅香港製造商。生產尚未開始。
