  step1_en: Installation standalone is 1,000
  step1_zh: 安装的单独售价实为一千
  step1_zh_hk: 安裝嘅單獨售價實為一千
  step2_en: Support standalone is 4,000
  step2_zh: 支持的单独售价实为四千
  step2_zh_hk: 支援嘅單獨售價實為四千
  step3_en: Total standalone still 15,000
