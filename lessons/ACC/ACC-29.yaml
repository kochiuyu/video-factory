  s1_en: >-
    Before the initial allocation is finalised or any revenue is recorded, the controller finds that the
    2,000 installation figure included an unrelated training service that this contract does not promise.
    Verified comparable sales support 1,000 for the basic installation actually promised.
  s1_zh: >-
    在最终确定初始分摊、也尚未确认任何收入之前，财务主管发现，二千的安装数字包含了本合同并未承诺的无关培训。经核验的可比单独销售支持，实际承诺的基础安装单独售价是一千。
  s1_zh_hk: >-
    喺最終確定初始分攤、亦尚未確認任何收入之前，財務主管發現，二千嘅安裝數字包含咗本合同並未承諾嘅無關培訓。經核實嘅可比單獨銷售支持，實際承諾嘅基礎安裝單獨售價係一千。
  s2_en: >-
    Equipment remains 10,000. Support was entered from the wrong service tier: the purchased twelve-month
    tier has a validated inception standalone price of 4,000, not 3,000. Total standalone prices still
    sum to 15,000; the contract price stays 12,000.
  s2_zh: >-
    设备仍是一万。支持也用错了服务档次：客户购买的十二个月档，在合同开始时经核验的单独售价是四千，不是三千。单独售价合计仍是一万五千；合同价仍是一万二千。
  s2_zh_hk: >-
    設備仍係一萬。支援亦用錯咗服務檔次：客戶購買嘅十二個月檔，喺合約開始時經核實嘅單獨售價係四千，唔係三千。單獨售價合計仍係一萬五千；合約價仍係一萬二千。
  s3_en: >-
    At the later reporting snapshot, control of the printer has transferred, installation is complete
    and exactly three of twelve support months have been provided evenly. All cash was already collected.
  s3_zh: 在后来的报告时点，打印机的控制权已经转移，安装已经完成，十二个月支持中刚好均匀提供了三个月。全部款项先前已经收齐。
  s3_zh_hk: 喺後來嘅報告時點，打印機嘅控制權已經轉移，安裝已經完成，十二個月支援入面剛好均勻提供咗三個月。全部款項先前已經收齊。
