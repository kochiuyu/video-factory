  kicker: ACC-29
  kicker_en: ACC-29
  kicker_zh: ACC-29
  kicker_zh_hk: ACC-29
  title_en: One package price. Three promises?
  title_zh: 一个套餐价，三项履约义务？
  title_zh_hk: 一個套裝價，三項履約責任？
  image: art/one-package-three-promises-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A supplier signs a 12,000 package for a printer, basic installation and twelve months of already-selected
    support. All cash is collected at signing, but nothing has transferred yet. How would you allocate
    the 12,000, and how much revenue can be recognised at signing? This is a fictional Hong Kong supplier.
  zh: >-
    一家供应商签订一万二千港元的套餐，包括一台标签打印机、基础安装，以及客户已在本合同中选定的十二个月支持。签约时已收齐款项，但尚未交付任何商品或服务。你怎样分摊这一万二千，签约时又能确认多少收入？这是虚构的香港供应商。
  zh_hk: >-
    一間供應商簽訂一萬二千港元嘅套裝，包括一部標籤打印機、基礎安裝，以及客戶已喺本合同中選定嘅十二個月支援。簽約時已收齊款項，但尚未交付任何商品或服務。你點樣分攤呢一萬二千，簽約時又可以確認多少收入？呢個係虛構嘅香港供應商。
