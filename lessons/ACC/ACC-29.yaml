  s1_en: >-
    All three promises are distinct for this exercise. Allocate the fixed 12,000 in proportion to validated
    standalone selling prices at contract inception. Spread the bundle discount across all three promises.
  s1_zh: 本题假定三项承诺都可以明确区分。按合同开始时经核验的相对单独售价，分摊固定的一万二千港元。套餐折扣按比例分到全部三项。
  s1_zh_hk: 呢題假定三項承諾都可以明確區分。按合約開始時經核實嘅相對單獨售價，分攤固定嘅一萬二千港元。套裝折扣按比例分到全部三項。
  s2_en: >-
    The draft standalone prices are 10,000 for equipment, 2,000 for installation and 3,000 for twelve-month
    support. These figures still need final evidence checking.
  s2_zh: 草案中的单独售价是设备一万、安装二千、十二个月支持三千。这些数字还需要最后核验证据。
  s2_zh_hk: 草案中嘅單獨售價係設備一萬、安裝二千、十二個月支援三千。呢啲數字仲需要最後核實證據。
  s3_en: >-
    Recognise the equipment allocation when control transfers on delivery, installation when that distinct
    task is complete, and support evenly over twelve months from its start. Neither cash collection nor
    price allocation fulfils a promise.
  s3_zh: >-
    设备部分在交货、控制权转移时确认，安装在该项明确任务完成时确认，支持则在开始后的十二个月内均匀确认。收款本身或完成价格分摊，都不等于已经履行承诺。
  s3_zh_hk: >-
    設備部分喺交貨、控制權轉移時確認，安裝喺該項明確任務完成時確認，支援則喺開始後嘅十二個月內均勻確認。收款本身或完成價格分攤，都不等於已經履行承諾。
