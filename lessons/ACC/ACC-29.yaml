  zh: 用草案中的单独售价，你怎样分摊一万二千港元，签约时又能确认多少收入？请暂停，投个票。尚未交付任何商品或服务。
  zh_hk: 用草案中嘅單獨售價，你點樣分攤一萬二千港元，簽約時又可以確認多少收入？暫停，投個票。尚未交付任何商品或服務。
