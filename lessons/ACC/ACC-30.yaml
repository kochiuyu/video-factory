  s1_en: >-
    The controller checks a second subsidiary, Cove, under the same payment terms. Its projected 31 December
    balances before a separate 20,000 supplier payment are current assets 80,000, including unrestricted
    cash 30,000, and current liabilities 100,000.
  s1_zh: >-
    财务主管按相同付款条件复核另一家子公司 Cove。在另行支付二万港元供应商款项前，其预计十二月三十一日流动资产是八万，其中不受限现金三万，流动负债十万。
  s1_zh_hk: >-
    財務主管按相同付款條件覆核另一間附屬公司 Cove。喺另行支付二萬港元供應商款項前，其預計十二月三十一日流動資產係八萬，其中不受限現金三萬，流動負債十萬。
  s2_en: >-
    Cove’s established payment date is also 2 January; either permitted date meets its cash forecast and
    operating minimum. No balances are transferred between subsidiaries.
  s2_zh: Cove 既定的付款日同样是一月二日；两个允许的日期都能满足其现金预测和营运最低现金。两家子公司之间不会划转余额。
  s2_zh_hk: Cove 既定嘅付款日同樣係一月二日；兩個允許嘅日期都能滿足其現金預測同營運最低現金。兩間附屬公司之間唔會劃轉餘額。
  s3_en: >-
    The board now asks whether reducing current liabilities necessarily improves the current ratio, and
    whether the ratio’s direction establishes a gain or loss in economic health. Report both entities
    without netting or withholding the less flattering result.
  s3_zh: >-
    董事会现在问：减少流动负债是否必然提高流动比率，以及比率升降是否就能证明经济状况变好或变差。两家都要列报，不能互相抵销，也不能隐瞒较差的那一组。
  s3_zh_hk: >-
    董事局而家問：減少流動負債係咪必然提高流動比率，以及比率升跌係咪就能證明經濟狀況變好或變差。兩間都要列報，唔可以互相抵銷，亦唔可以隱瞞較差嗰一組。
