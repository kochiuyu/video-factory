  title_en: A healthier ratio. A healthier business?
  title_zh: 流动比率提高，公司的财务就更健康吗？
  title_zh_hk: 流動比率較高，公司的財務就更穩健？
  image: art/ratio-rises-cash-falls-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Harbour can pay a 20,000 supplier bill on 30 December or 2 January, at the same amount. A colleague
    wants the earlier date to make the year-end current ratio healthier. Does the ratio alone justify
    bringing payment forward? You are a group controller reviewing a fictional Hong Kong subsidiary.
  zh: >-
    Harbour 可以在十二月三十日或一月二日支付已经入账的二万港元供应商款项，金额相同。有同事主张提前到十二月三十日，好让年末流动比率看起来更健康。单凭比率，是否就应提前付款？你是虚构香港集团的财务主管，正在复核这家子公司。
  zh_hk: >-
    Harbour 可以喺十二月三十日或一月二日支付已經入賬嘅二萬港元供應商款項，金額相同。有同事主張提前到十二月三十日，好讓年末流動比率睇起嚟更健康。單憑比率，係咪就應提前付款？你係虛構香港集團嘅財務主管，正在覆核呢間附屬公司。
