  s1_en: >-
    The 20,000 payable is already recognised within current liabilities. The written contract expressly
    permits settlement on either 30 December or 2 January at the same amount. The established treasury
    schedule is 2 January.
  s1_zh: 这笔二万港元应付款已经计入流动负债。书面合同明确允许在十二月三十日或一月二日支付同一金额。既定的资金安排是一月二日付款。
  s1_zh_hk: 呢筆二萬港元應付款已經計入流動負債。書面合約明確允許喺十二月三十日或一月二日支付同一金額。既定嘅資金安排係一月二日付款。
  s2_en: >-
    If payment remains on 2 January, projected 31 December balances are current assets 150,000, including
    unrestricted cash 50,000, and current liabilities 100,000. Paying 20,000 reduces cash and the recognised
    payable by exactly that amount; it is not a new expense.
  s2_zh: >-
    若仍在一月二日支付，预计十二月三十一日的流动资产是十五万，其中不受限现金五万，流动负债十万。支付二万会等额减少现金和已确认应付款，不会产生新的费用。
  s2_zh_hk: >-
    若仍喺一月二日支付，預計十二月三十一日嘅流動資產係十五萬，其中不受限現金五萬，流動負債十萬。支付二萬會等額減少現金同已確認應付款，唔會產生新嘅費用。
  s3_en: >-
    The current ratio is current assets divided by current liabilities. Net working capital is current
    assets minus current liabilities. There is no covenant, bonus or legal threshold tied to the ratio.
    Do not execute a payment in this exercise.
  s3_zh: 流动比率是流动资产除以流动负债。营运资金净额是流动资产减去流动负债。没有与该比率挂钩的契诺、奖金或法定门槛。本题不要实际付款。
  s3_zh_hk: 流動比率係流動資產除以流動負債。營運資金淨額係流動資產減流動負債。沒有與該比率掛鈎嘅契諾、獎金或法定門檻。呢題唔好實際付款。
