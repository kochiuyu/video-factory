  en: >-
    How do Harbour’s 31 December current ratio, cash and net working capital differ between the two dates,
    and does the ratio alone justify bringing payment forward? Pause and vote. Either date is permitted
    and meets the cash forecast.
  zh: >-
    Harbour 在十二月三十一日的流动比率、现金和营运资金净额，在两个日期下有何不同？单凭比率，是否就应提前付款？请暂停，投个票。两个日期都允许，也都能满足现金预测。
  zh_hk: >-
    Harbour 喺十二月三十一日嘅流動比率、現金同營運資金淨額，喺兩個日期下有何不同？單憑比率，係咪就應提前付款？暫停，投個票。兩個日期都允許，亦都能滿足現金預測。
