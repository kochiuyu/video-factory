title_en: Half finished. How many units of work?
title_zh: 在产品完成了多少工作量？
title_zh_hk: 未做完的產品，應當作多少產量？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-31
  kicker_en: ACC-31
  kicker_zh: ACC-31
  kicker_zh_hk: ACC-31
  title_en: Half finished. How many units of work?
  title_zh: 在产品完成了多少工作量？
  title_zh_hk: 未做完的產品，應當作多少產量？
  image: art/half-finished-units-of-work-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    One thousand identical bottles entered a production stage this month. Eight hundred are complete;
    two hundred are unfinished. A draft report divides the 19,400 total cost equally across all 1,000
    bottles and gives unfinished stock 3,880. Would you sign it? You are the controller of fictional Harbour
    Skin, a small Hong Kong skincare producer.
  zh: >-
    本月有一千瓶同款产品投入同一道工序，八百瓶已完工转出，两百瓶尚未完工。草稿把一万九千四百港元总成本平摊到一千瓶，给期末在产品分配三千八百八十。你会签字吗？你是香港小型护肤品企业“海湾护肤”的财务负责人。
  zh_hk: >-
    今個月有一千樽同款產品投入同一道工序，八百樽已完工轉出，兩百樽仲未做完。草稿把一萬九千四百港元總成本平均攤到一千樽，畀期末在製品分配三千八百八十。你會唔會簽？你係香港小型護膚品企業「海灣護膚」嘅財務負責人。
