  s1_en: >-
    All 1,000 units received the full production process before final inspection. The 19,000 is the complete
    production cost pool, including all necessary disposal costs.
  s1_zh: 全部一千个产品都完成整套工序后才进行最终检验。一万九千是完整的本批生产成本，已包括所有必要的处置费用。
  s1_zh_hk: 全部一千件都做完成套工序先至做最終檢驗。一萬九千係今批完整嘅生產成本，已經包括所有必要嘅處置費用。
  s2_en: >-
    Classroom policy: normal loss is expected loss under usual conditions, absorbed in the process rate.
    Abnormal loss is the excess, expensed now.
  s2_zh: 本例政策：正常损失是正常生产条件下预计发生的损失，由工序单位成本吸收；超过标准的异常损失当期费用化。
  s2_zh_hk: 本例規則：正常損耗係一般情況下預計會發生嘅損耗，由工序單位成本吸收；超出限額嘅異常損耗即期列支。
  s3_en: >-
    Divide total cost by input units minus normal-loss units, and apply that rate to good output and abnormal
    loss. The approved allowance and inspection report have not yet arrived; do not invent a loss percentage.
  s3_zh: 总成本除以投入量减正常损失量，所得单位成本同时用于合格品和异常损失。核准的损失标准和验收报告都还没收到，不能自行设定损失比例。
  s3_zh_hk: 總成本除以投入量減正常損耗量，所得單位成本同時用於合格品同異常損耗。核准嘅損耗限額同檢驗報告都未收到，唔可以自己定損耗比例。
- id: pause1
