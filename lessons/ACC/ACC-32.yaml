  kicker: ACC-32
  kicker_en: ACC-32
  kicker_zh: ACC-32
  kicker_zh_hk: ACC-32
  title_en: Rejects. Which loss belongs in stock?
  title_zh: 不合格品的成本，哪些应留在存货中？
  title_zh_hk: 不合格品的損耗，哪些應計入存貨？
  image: art/rejects-which-loss-belongs-in-stock-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    One run of 1,000 identical clips has finished: 900 are good and unsold; 100 are valueless rejects.
    The draft report puts all 19,000 of production cost into the 900 good units. Would you sign it before
    seeing the normal-loss allowance? You are the controller of fictional Harbour Clips, a Hong Kong stationery
    maker.
  zh: >-
    一批一千个同规格文具夹已经完工：九百个合格品尚未销售，另有一百个没有残值的不合格品。草稿把一万九千港元生产成本全部分配给九百个合格品。还没看到正常损失标准，你会签字吗？你是香港文具夹生产企业“海湾文具夹”的财务负责人。
  zh_hk: >-
    一批一千個同規格文具夾已經做好：九百個合格品未賣，另外一百個係冇殘值嘅不合格品。草稿把一萬九千港元生產成本全部分配畀九百個合格品。未睇到正常損耗限額，你會唔會簽？你係香港文具夾生產企業「海灣文具夾」嘅財務負責人。
