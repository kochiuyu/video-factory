  title_en: Weight the revenue shares
  title_zh: 按收入占比加权
  title_zh_hk: 按收入比例加權
  step1_en: A 50%, B 20% of revenue
  step1_zh: A 50%，B 20%
  step1_zh_hk: A 50%，B 20%
  step2_en: >-
    Opening 44%: profit 8,800
  step2_zh: 初步44%：利润8,800
  step2_zh_hk: 初步44%：利潤8,800
  step3_en: >-
    Revised 32%: loss 3,200
  step3_zh: 修订32%：亏损3,200
  step3_zh_hk: 修訂32%：虧損3,200
  s1_en: >-
    A contributes 40 minus 20, or 20 per notebook: 50 percent of its revenue. B contributes 20 minus 16,
    or 4 per pack: 20 percent.
  s1_zh: A 每本的边际贡献是四十减二十，即二十，占 A 收入的百分之五十。B 每套是二十减十六，即四，占 B 收入的百分之二十。
  s1_zh_hk: A 每本嘅邊際貢獻係四十減二十，即係二十，佔 A 收入百分之五十。B 每套係二十減十六，即係四，佔 B 收入百分之二十。
  s2_en: >-
    Opening weighted ratio is 80 percent times 50 plus 20 percent times 20, or 44 percent. At 100,000,
    contribution is 44,000 and operating profit is 8,800. Break-even revenue is 35,200 divided by 44 percent,
    or 80,000.
  s2_zh: >-
    初步加权比率是百分之八十乘五十，加百分之二十乘二十，即百分之四十四。收入十万时，边际贡献四万四千，经营利润八千八百。盈亏平衡收入是三万五千二百除以百分之四十四，即八万。
  s2_zh_hk: >-
    初步加權比率係百分之八十乘五十，加百分之二十乘二十，即百分之四十四。收入十萬，邊際貢獻四萬四千，營運利潤八千八百。收支平衡收入係三萬五千二百除以百分之四十四，即係八萬。
  s3_en: >-
    Revised ratio is 40 percent times 50 plus 60 percent times 20, or 32 percent. At the same 100,000,
    contribution is 32,000: a 3,200 operating loss.
  s3_zh: 修订后比率是百分之四十乘五十，加百分之六十乘二十，即百分之三十二。收入同样十万，边际贡献只有三万二千，经营亏损三千二百。
  s3_zh_hk: 修訂後比率係百分之四十乘五十，加百分之六十乘二十，即係百分之三十二。收入同樣十萬，邊際貢獻得三萬二千，營運虧損三千二百。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Calculate
  kicker_en: Calculate
  kicker_zh: 计算
  kicker_zh_hk: 計算
  title_en: The new break-even point
  title_zh: 新的盈亏平衡点
  title_zh_hk: 新嘅收支平衡點
  step1_en: Break-even 35,200 ÷ 32% = 110,000
  step1_zh: 平衡点35,200 ÷ 32% = 110,000
  step1_zh_hk: 平衡點35,200 ÷ 32% = 110,000
  step2_en: 1,100 notebooks; 3,300 packs
  step2_zh: 1,100本；3,300套
  step2_zh_hk: 1,100本；3,300套
  step3_en: >-
    Unit mix is 25:75, not 40:60
  step3_zh: >-
    件数比25:75，不是40:60
  step3_zh_hk: >-
    件數比25:75，唔係40:60
  s1_en: >-
    At the revised mix, break-even revenue is 35,200 divided by 32 percent, or 110,000: 30,000 above the
    old break-even point and 10,000 above the current forecast.
  s1_zh: 新组合下，盈亏平衡收入是三万五千二百除以百分之三十二，即十一万，比旧平衡点高三万，比现时预测高一万。
  s1_zh_hk: 新組合之下，收支平衡收入係三萬五千二百除以百分之三十二，即係十一萬，比舊平衡點高三萬，比現時預測高一萬。
  s2_en: >-
    Check with units. A revenue of 44,000 is 1,100 notebooks; B revenue of 66,000 is 3,300 packs. Contribution
    is 22,000 plus 13,200, exactly 35,200.
  s2_zh: 用件数复核：A 收入四万四千，即一千一百本；B 收入六万六千，即三千三百套。边际贡献二万二千加一万三千二百，刚好三万五千二百。
  s2_zh_hk: 用件數核對：A 收入四萬四千，即係一千一百本；B 收入六萬六千，即係三千三百套。邊際貢獻二萬二千加一萬三千二百，啱啱三萬五千二百。
  s3_en: >-
    That unit mix is 25 to 75, not 40 to 60. Use revenue weights with contribution percentages, or unit
    weights with unit contributions, never a mixture.
  s3_zh: 这时件数之比是二十五比七十五，不是四十比六十。收入占比要配边际贡献率，件数占比要配单位边际贡献，不能混用。
  s3_zh_hk: 呢個時候件數比例係二十五比七十五，唔係四十比六十。收入比例要配邊際貢獻率，件數比例要配單位邊際貢獻，唔可以混用。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Repair the dashboard rule
  title_zh: 改进仪表盘规则
  title_zh_hk: 改善儀表板規則
  en: >-
    Show forecast revenue by product, total contribution, common fixed costs and the operating result,
    with break-even revenue labelled by its mix. The revised 100,000 forecast should not be green. B still
    adds 4 per pack before fixed costs, so do not reject the school order blindly; the case does not show
    that rejecting it restores A demand.
  zh: >-
    仪表盘应显示分产品销售预测、总边际贡献、共同固定成本和经营结果，盈亏平衡销售额旁要标注组合前提。按新预测，十万不能亮绿灯。B 每套仍带来四港元边际贡献，所以不要盲目拒绝学校订单；本例不表示拒绝它能令
    A 的需求回升。
  zh_hk: >-
    儀表板應該顯示分產品銷售預測、總邊際貢獻、共同固定成本同營運結果，收支平衡收入旁邊要註明組合前提。按新預測，十萬唔應該亮綠燈。B 每套仍然帶來四港元邊際貢獻，所以唔好盲目拒絕學校訂單；本例冇顯示拒絕咗就會令
    A 嘅需求回升。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Revenue is not contribution
  title_zh: 销售收入不等于边际贡献
  title_zh_hk: 銷售收入不等於邊際貢獻
  q1_en: >-
    80:20 mix: break-even 80,000
  q1_zh: >-
    80:20：平衡点80,000
  q1_zh_hk: >-
    80:20：平衡點80,000
  q2_en: >-
    40:60 mix: break-even 110,000
  q2_zh: >-
    40:60：平衡点110,000
  q2_zh_hk: >-
    40:60：平衡點110,000
  s1_en: >-
    The same revenue can cover fixed costs or miss them, depending on how much of it comes from the higher-contribution
    product.
  s1_zh: 同样的收入，能否覆盖固定成本，取决于其中有多少来自边际贡献较高的产品。
  s1_zh_hk: 同樣嘅收入夠唔夠支付固定成本，要睇入面有幾多來自邊際貢獻較高嘅產品。
  s2_en: >-
    A revenue-only green light cannot protect a contribution target when the mix changes. Show the mix
    assumption beside every break-even figure.
  s2_zh: 只看收入的绿灯，在组合变化时保不住边际贡献目标。每个盈亏平衡数字旁都要注明组合假设。
  s2_zh_hk: 淨係睇收入嘅綠燈，組合一變就保唔住邊際貢獻目標。每個收支平衡數字旁邊都要註明組合假設。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
