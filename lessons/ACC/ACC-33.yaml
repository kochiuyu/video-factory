  step1_en: A 40,000; B 60,000
  step1_zh: A 40,000；B 60,000
  step1_zh_hk: A 40,000；B 60,000
  step2_en: A replacement forecast, not extra sales
  step2_zh: 取代原预测，不是额外销售
  step2_zh_hk: 取代原預測，唔係額外銷售
  step3_en: School order not accepted
  step3_zh: 学校订单尚未接受
  step3_zh_hk: 學校訂單仲未接受
  s1_en: >-
    The revised forecast includes a proposed school order for B, alongside weaker separately forecast
    demand for A. It now shows 40,000 from A and 60,000 from B, still 100,000 in total.
  s1_zh: 学校拟购买 B，销售团队另行调低了 A 的需求预测。修订后 A、B 收入分别为四万和六万，总收入仍是十万。
  s1_zh_hk: 學校打算買 B，銷售團隊另外調低咗 A 嘅需求預測。修訂後 A、B 收入分別係四萬同六萬，總收入仍然係十萬。
  s2_en: >-
    This replaces the opening forecast. The school proposal has not been shown to cause A's decline, and
    the order is not accepted.
  s2_zh: 这份预测取代原预测，不是在原有 A 销售上再加六万的 B 收入。没有证据显示 A 的下跌由学校提案造成，学校订单也尚未接受。
  s2_zh_hk: 呢份預測取代原預測，唔係喺原有 A 銷售上面再加六萬 B 收入。冇證據顯示 A 下跌係學校提案造成，學校訂單亦未接受。
  s3_en: >-
    Prices, variable unit costs and the 35,200 fixed costs are unchanged. For the revised break-even,
    hold the 40 to 60 revenue mix constant.
  s3_zh: 售价、单位变动成本和三万五千二百固定成本不变。计算修订后的盈亏平衡收入时，假设四十比六十的收入比例保持不变。
  s3_zh_hk: 售價、單位變動成本同三萬五千二百固定成本不變。計修訂後嘅收支平衡收入時，假設四十比六十嘅收入比例維持不變。
