  title_en: The sales target is met. Are the costs covered?
  title_zh: 销售额达标，就一定能覆盖成本吗？
  title_zh_hk: 銷售達標，為甚麼仍未必回本？
  image: art/same-revenue-different-break-even-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The owner of a kiosk wants the monthly dashboard to show green whenever revenue reaches 100,000. Is
    that rule reliable? You manage Paper Corner, a fictional Kowloon stationery kiosk selling only premium
    notebooks A and basic exercise-book packs B. You are not accepting a contract or setting a price.
  zh: >-
    店主拟把月销售收入达到十万港元设为仪表盘亮绿灯的条件。这个信号可靠吗？你管理九龙一家虚构文具摊“纸角”，只经营两类商品：A 是高档笔记本，B 是基础练习本套装。你的任务是判断信号，不是接单或定价。
  zh_hk: >-
    老闆想每月收入一到十萬港元，儀表板就亮綠燈。呢個訊號可唔可靠？你管理九龍一間虛構文具檔「紙角」，只賣兩類貨品：A 係高級筆記簿，B 係基本練習簿套裝。你要判斷訊號，唔係接單或者定價。
