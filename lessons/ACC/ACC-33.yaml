  footer_zh_hk: >-
    80:20是收入比例，不是件數
  s1_en: >-
    A sells for 40 per notebook with 20 variable cost. B sells for 20 per pack with 16 variable cost.
    Prices and unit costs stay constant.
  s1_zh: A 每本售四十港元，变动成本二十；B 每套售二十港元，变动成本十六。售价和单位成本保持不变。
  s1_zh_hk: A 每本賣四十港元，變動成本二十；B 每套賣二十港元，變動成本十六。售價同單位成本維持不變。
  s2_en: >-
    Monthly fixed operating costs are 35,200, including paid staffing and rent. Do not allocate them to
    products before calculating contribution.
  s2_zh: 每月固定经营成本三万五千二百，包括有薪人手和租金。计算边际贡献前，不要把固定成本分摊到个别产品。
  s2_zh_hk: 每月固定營運成本三萬五千二百，包括有薪人手同租金。計邊際貢獻之前，唔好把固定成本分攤到個別產品。
  s3_en: >-
    The opening forecast is 80,000 from A and 20,000 from B. Those are sales dollars, not units. Capacity
    can support either mix; supply does not guarantee customers will buy.
  s3_zh: 初步预计 A 收入八万、B 收入二万。八十比二十是收入占比，不是件数之比。产能足以应付两种组合，但供应得来不等于一定有人买。
  s3_zh_hk: 初步預計 A 收入八萬、B 收入二萬。八十比二十係收入比例，唔係件數比例。產能應付到兩種組合，但供應得到唔等於一定有人買。
