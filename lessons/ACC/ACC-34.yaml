  s1_en: >-
    The asset assessed is the identifiable design and software the company controls and can license separately,
    not the physical prototype or staff knowledge.
  s1_zh: 要评估的是公司控制、能单独许可的可辨认设计及相关软件，而不是实物原型或员工掌握的知识。
  s1_zh_hk: 要評估嘅係公司控制、可以單獨授權嘅可識別設計同相關軟件，唔係實物原型或者員工嘅知識。
  s2_en: >-
    Policy: research is expensed. Development becomes an asset only from the date all six conditions can
    be demonstrated together, including technical feasibility. Costs properly expensed before that date
    are not later restored.
  s2_zh: >-
    政策规定：研究支出计入费用；开发支出只能从六项条件首次同时有据可查之日起资本化，其中包括技术可行性。此前已按规定费用化的支出，不能事后计入资产。
  s2_zh_hk: >-
    政策規定：研究支出列作費用；開發支出要由六項條件首次同時有證據證明嗰日起先可以資本化，當中包括技術可行性。之前已按規定列支嘅支出，唔可以事後撥返入資產。
  s3_en: >-
    From 1 March, intention, ability, resources, reliable costing and probable economic benefits are all
    documented. The open question is when technical feasibility was first demonstrated.
  s3_zh: 自三月一日起，意图、能力、资源、可靠的成本核算和很可能产生的经济利益都有文件支持。仍待厘清的是首次证明技术可行性的日期。
  s3_zh_hk: 由三月一日起，意圖、能力、資源、可靠嘅成本計算同很可能帶來嘅經濟利益都有文件支持。仲未釐清嘅係幾時首次證明到技術可行性。
