  title_en: Accept the 260,000 asset?
  title_zh: 接受二十六万资产吗？
  title_zh_hk: 接受二十六萬資產？
  en: >-
    Would you accept the proposed 260,000 asset? Separate research from development, and say what dated
    evidence you need before deciding which development costs qualify. Pause and vote.
  zh: 你会接受把二十六万确认为资产的建议吗？先区分研究和开发，再指出判定哪些开发成本合资格所需的、附有日期的证据。请暂停，投个票。
  zh_hk: 你會唔會接受把二十六萬確認做資產？先分開研究同開發，再講出要決定邊啲開發成本合資格，需要咩有日期嘅證據。暫停，投個票。
