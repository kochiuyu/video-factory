  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    By the 30 June reporting date, a design team has incurred and paid 260,000 yuan. The prototype now
    works and customers are interested, so the project manager wants to capitalise all of it. Would you
    accept that asset? You are the controller of Pearl Signal, a fictional Shenzhen design business.
  zh: >-
    截至六月三十日报告日，团队已发生并支付二十六万元人民币。项目经理因原型能运作、有客户感兴趣，主张全数资本化。你会接受这项资产吗？你是深圳虚构设计公司“珠江信号”的财务负责人。
  zh_hk: >-
    截至六月三十日報告日，團隊已經發生並支付二十六萬人民幣。項目經理見原型運作到、又有客戶有興趣，主張全數資本化。你會唔會接受呢項資產？你係深圳虛構設計公司「珠江信號」嘅財務負責人。
