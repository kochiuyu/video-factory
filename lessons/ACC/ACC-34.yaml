  title_en: Feasibility came on 15 May
  title_zh: 技术可行性在5月15日确立
  title_zh_hk: 技術可行性喺5月15日確立
  step1_en: >-
    March demo: lab conditions only
  step1_zh: 3月示范只在实验室条件下运作
  step1_zh_hk: 3月示範只喺實驗室條件下運作
  step2_en: Feasibility documented 15 May
  step2_zh: 5月15日完成可行性验证
  step2_zh_hk: 5月15日完成可行性驗證
  step3_en: >-
    30 June: not yet available for use
  step3_zh: 6月30日尚未可供使用
  step3_zh_hk: 6月30日仍未可供使用
  s1_en: >-
    The March demonstration worked only under narrow laboratory conditions. Test logs showed unresolved
    failures; the manager's 'technically ready' was optimism, not a supported conclusion.
  s1_zh: 三月的示范只能在特定实验室条件下运作。测试记录显示仍有未解决的故障；经理所谓“技术就绪”只是乐观说法，不是有依据的结论。
  s1_zh_hk: 三月嘅示範只係喺特定實驗室條件下行到。測試記錄顯示仲有未解決嘅故障；經理講嘅「技術就緒」只係樂觀講法，唔係有根據嘅結論。
  s2_en: >-
    At the start of 15 May, engineers completed and documented the feasibility work. All six conditions
    first coincide then. The ledger shows 30,000 before that point and 90,000 after.
  s2_zh: 到五月十五日一开始，工程团队完成了必要的技术可行性验证并留存记录。六项条件首次同时满足就在这时。账簿分开记录此前的三万和此后的九万。
  s2_zh_hk: 到五月十五日一開始，工程團隊完成咗必要嘅技術可行性驗證並留低記錄。六項條件首次同時滿足就喺呢個時候。賬簿分開記錄之前嘅三萬同之後嘅九萬。
  s3_en: >-
    At 30 June, routine integration continues, so the design is not yet available for use. The manager
    asks to transfer earlier expensed costs into the asset.
  s3_zh: 六月三十日仍在进行例行整合，设计尚未达到预定可使用状态。经理建议把此前已列作费用的成本转列为资产。
  s3_zh_hk: 六月三十日仲做緊例行整合，設計未達到預定可使用狀態。經理建議把之前已經列支嘅成本轉做資產。
