  title_en: New information. Or an old mistake?
  title_zh: 是会计估计变更，还是前期差错？
  title_zh_hk: 是新資料，還是舊錯誤？
  image: art/new-information-old-mistake-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A diagnostic machine has 60,000 left on the books. The manager says new information at the start of
    Year 3 shortened its life to two more years, and wants to spread the 60,000 over Years 3 and 4 without
    changing Year 2. Is that a new estimate, or an old mistake? You are the controller of fictional Harbour
    Repair Tools in Hong Kong.
  zh: >-
    一台诊断设备的账面余额还有六万港元。经理称第三年初才有新信息，显示机器只能再用两年，建议把六万在第三、四年分摊，不改第二年。这是会计估计变更，还是前期差错？你是香港虚构企业“海湾维修工具”的财务负责人。
  zh_hk: >-
    一部診斷設備賬面仲有六萬港元。經理話第三年初先有新資料，顯示部機只可以再用兩年，建議把六萬喺第三、四年攤分，唔改第二年。呢個係新資料，定係舊錯誤？你係香港虛構企業「海灣維修工具」嘅財務負責人。
