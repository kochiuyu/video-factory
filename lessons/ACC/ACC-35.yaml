  s1_en: >-
    The machine cost 90,000 and was available for use at the start of Year 1. Its supported original life
    was six years, so 15,000 was recorded in each of Years 1 and 2. Year 2 statements are already issued.
  s1_zh: 机器成本九万，第一年初可供使用。原有证据支持六年使用年期，所以第一年和第二年各入账折旧一万五千。第二年报表已经批准报出。
  s1_zh_hk: 部機成本九萬，第一年初已經可以用。原本有證據支持六年使用年期，所以第一年同第二年各入賬折舊一萬五千。第二年報表已經刊發。
  s2_en: >-
    Apply a genuine estimate change from its effective date to the current and future periods.
  s2_zh: 如果估计确实更新，从生效日起按未来适用法计入当期及以后期间。
  s2_zh_hk: 如果真係估計變更，就由生效日起按未來適用法計入今期同以後期間。
  s3_en: >-
    A material prior-period error arises from failing to use reliable information that was available,
    and reasonably obtainable, when earlier statements were prepared. Correct it retrospectively when
    its effects can be determined.
  s3_zh: 反之，编制前期报表时本可合理取得、且当时已有的可靠信息未被使用，可能形成重大前期差错；其影响可确定时，应追溯重述。
  s3_zh_hk: 相反，編製前期報表時本來可以合理取得、而且當時已經有嘅可靠資料冇用到，就可能構成重大前期錯誤；影響可以確定時，要追溯更正。
