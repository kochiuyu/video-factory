  title_zh: 情境 B：1月发生全新灾害
  title_zh_hk: 情境 B：1月發生全新災害
  step1_en: No distress at 31 December
  step1_zh: 12月31日没有财务困难
  step1_zh_hk: 12月31日沒有財政困難
  step2_en: 12 January disaster causes insolvency
  step2_zh: 1月12日灾害导致无力偿债
  step2_zh_hk: 1月12日災害導致無力償債
  step3_en: Recovery falls by 84,000
  step3_zh: 收回金额减少84,000
  step3_zh_hk: 收回金額減少84,000
  s1_en: >-
    Start again with an alternative history, not a correction to A. The receivable, allowance, dates and
    25 January announcement are the same.
  s1_zh: 从同一起点另做一遍，不是在情境 A 后面加一个事件。应收款项、损失准备、各个日期和一月二十五日的公告都不变。
  s1_zh_hk: 由同一個起點再做一次，唔係喺情境 A 後面加多件事。應收款項、撥備、各個日期同一月二十五日嘅公告都不變。
  s2_en: >-
    In History B the customer had no financial distress at 31 December, and the 6,000 allowance was appropriate.
    An unprecedented, uninsured disaster on 12 January alone causes the insolvency.
  s2_zh: 情境 B 的客户在十二月三十一日没有财务困难，六千准备恰当。一月十二日发生未投保且前所未有的灾害，是其后无力偿债的唯一原因。
  s2_zh_hk: 情境 B 嘅客戶喺十二月三十一日冇財政困難，六千撥備恰當。一月十二日發生一場冇保險、前所未有嘅災害，係之後無力償債嘅唯一原因。
  s3_en: >-
    After the disaster, expected recovery is 30,000: a reduction of 84,000 from the supported 114,000.
    The effect is material and reasonably estimable.
  s3_zh: 灾后预期收回总额为三万，相对先前有依据的十一万四千，估计减少八万四千。影响重大，并可合理估计。
  s3_zh_hk: 災後預期收回總額係三萬，比之前有根據嘅十一萬四千，估計減少八萬四千。影響重大，亦可以合理估計。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
