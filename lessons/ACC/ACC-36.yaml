  title_en: After year-end. Evidence about which year?
  title_zh: 年末后的公告，究竟反映哪一年的情况？
  title_zh_hk: 年結後的新消息，說的是哪一年的事？
  image: art/after-year-end-which-condition-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Accounts close on 31 December and go to the board on 20 February. On 25 January, a customer owing
    120,000 enters insolvency. Does that news change Year 1, or only need disclosure? You report for Harbour
    Paper, a fictional Hong Kong wholesaler.
  zh: >-
    账目在十二月三十一日结账，二月二十日交董事会批准。一月二十五日，一名欠款十二万港元的客户进入无力偿债程序。这个消息要调整第一年金额，还是只需披露？你负责香港虚构纸品批发商“海湾纸业”的报表。
  zh_hk: >-
    賬目喺十二月三十一日結賬，二月二十日交董事會批准。一月二十五日，一個欠十二萬港元嘅客戶進入無力償債程序。呢個消息要調整第一年金額，定係只需要披露？你負責香港虛構紙品批發商「海灣紙業」嘅報表。
