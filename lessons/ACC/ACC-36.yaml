  s1_en: >-
    An accepted delivery before year-end created an undisputed 120,000 receivable. The preliminary 31
    December allowance is 6,000, leaving 114,000 net.
  s1_zh: 年结前，客户验收货物，形成无争议的十二万应收款项。十二月三十一日初步损失准备为六千，应收款项净额十一万四千。
  s1_zh_hk: 年結前客戶驗收貨物，形成冇爭議嘅十二萬應收款項。十二月三十一日初步虧損撥備係六千，應收款項淨額十一萬四千。
  s2_en: >-
    Before authorisation, adjust for later evidence about conditions that already existed at year-end.
    Do not adjust for conditions arising only afterwards; disclose material ones instead.
  s2_zh: 在批准报出前，如果后来取得的证据反映年末已有的情况，就调整年末金额。仅在期后新出现的情况不调整；影响重大的要披露。
  s2_zh_hk: 喺批准刊發之前，如果後來嘅證據反映年底已經存在嘅情況，就調整年底金額。只係期後先出現嘅情況唔調整；影響重大就要披露。
  s3_en: >-
    History A: the administrator's records show the customer had stopped paying creditors by 15 December
    and exhausted its funding by 28 December. Expected recovery at 31 December is 30,000.
  s3_zh: >-
    情境 A：管理人的可靠记录显示，客户在十二月十五日或之前已停止向多名债权人付款，到十二月二十八日资金已用尽。按十二月三十一日的状况，预期收回总额为三万。
  s3_zh_hk: >-
    情境 A：管理人嘅可靠記錄顯示，客戶喺十二月十五日或之前已經停止向多個債權人付款，到十二月二十八日資金已經用晒。按十二月三十一日嘅狀況，預期收回總額係三萬。
- id: pause1
  visual: title_card
