  title_en: >-
    History A: adjust or disclose?
  title_zh: 情境 A 要调整吗？
  title_zh_hk: 情境 A 要調整嗎？
  en: >-
    Under History A, adjust the Year 1 amounts or only disclose the January announcement? Calculate the
    required allowance, the additional expense and the net receivable. Which fact matters more than the
    announcement date? Pause and vote.
  zh: 情境 A 下，应调整第一年金额，还是只披露一月的公告？计算所需准备、额外费用和应收款项净额。哪一项事实比公告日期更重要？请暂停，投个票。
  zh_hk: 情境 A 之下，應該調整第一年金額，定係只披露一月嘅公告？計出所需撥備、額外費用同應收款項淨額。邊項事實比公告日期更重要？暫停，投個票。
