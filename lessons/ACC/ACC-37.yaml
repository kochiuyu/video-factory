  s1_en: >-
    At the start of year one the company buys and uses a machine costing 90. Accounting depreciation is
    30 a year for three years, with no residual value.
  s1_zh: 机器在第一年一开始购入并投入使用，成本九十。按三年直线计提会计折旧，每年三十，净残值为零。
  s1_zh_hk: 部機喺第一年一開始買入並投入使用，成本九十。會計折舊分三年直線計，每年三十，冇剩餘價值。
  s2_en: >-
    Permitted tax depreciation is 60, then 15, then 15. The enacted rate is 20 percent throughout. Profit
    before this depreciation and tax is 100 each year.
  s2_zh: 获准税务扣减为第一年六十、第二年十五、第三年十五。已颁布税率一直是百分之二十。三年每年扣除机器折旧及所得税前的利润均为一百。
  s2_zh_hk: 准許嘅稅務扣減係第一年六十、第二年十五、第三年十五。已頒布稅率一直係百分之二十。三年每年未扣機器折舊同稅之前嘅利潤都係一百。
  s3_en: >-
    Tax base is the machine's remaining deductible cost. Closing deferred-tax liability is 20 percent
    of carrying amount minus tax base. Total tax expense is current tax plus the liability's movement.
  s3_zh: 计税基础是尚可扣除的机器成本。期末递延所得税负债等于百分之二十乘以账面价值减计税基础。所得税费用总额等于当期所得税加上这项负债的变动。
  s3_zh_hk: 稅基係部機仲可以扣除嘅成本。期末遞延稅項負債等於百分之二十乘賬面值減稅基。稅項費用總額等於當期稅項加呢項負債嘅變動。
