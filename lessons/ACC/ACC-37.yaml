  image: art/cash-tax-tax-expense-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A draft report treats total tax expense as the current tax paid this year. The accountant proposes
    current tax plus the change in the deferred-tax liability. Which report would you approve? You review
    the year-one accounts of Harbour Parts, a fictional manufacturer, in thousands of invented currency
    units.
  zh: >-
    第一年报告草稿把所得税费用总额当作本年已付的当期税款。会计师建议计入当期所得税加递延所得税负债的变动。你会采纳哪一份？你负责复核虚构制造企业“海湾零件”的第一年账目，金额按虚构货币千元表示。
  zh_hk: >-
    第一年報告草稿把稅項費用總額當作今年已交嘅當期稅款。會計師建議用當期稅項加遞延稅項負債嘅變動。你會採納邊一份？你負責覆核虛構製造企業「海灣零件」嘅第一年賬目，金額以虛構貨幣千元計。
