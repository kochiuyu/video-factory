  en: >-
    For year one, calculate accounting profit before tax, taxable profit and current tax paid. Compare
    the closing carrying amount with remaining tax deductions. Which report would you approve, and what
    deferred tax and total tax expense should it show? Pause and vote.
  zh: >-
    第一年的会计税前利润、应纳税所得额和已缴当期所得税分别是多少？把期末账面价值与剩余可扣除金额对照后，你会采纳哪份报告？递延所得税和所得税费用总额各是多少？请暂停，投个票。
  zh_hk: >-
    第一年嘅會計稅前利潤、應課稅利潤同已交當期稅項各係幾多？對照期末賬面值同剩餘可扣減金額之後，你會採納邊份報告？遞延稅項同稅項費用總額各係幾多？暫停，投個票。
