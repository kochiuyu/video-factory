  step1_en: Year two goes exactly as planned
  step1_zh: 第2年完全按计划
  step1_zh_hk: 第2年完全按計劃
  step2_en: Current tax paid is higher
  step2_zh: 已付当期税款更高
  step2_zh_hk: 已交當期稅款更高
  step3_en: >-
    Manager: add the closing liability
  step3_zh: 经理：加上期末负债
  step3_zh_hk: 經理：加埋期末負債
  s1_en: >-
    Year two ends exactly as planned: profit before depreciation and tax 100, accounting depreciation
    30, tax deduction 15, at the same 20 percent rate.
  s1_zh: 第二年的结果与预计完全相同：折旧及税前利润一百、会计折旧三十、准予税务扣减十五，税率仍是百分之二十。
  s1_zh_hk: 第二年嘅結果同預計完全一樣：折舊及稅前利潤一百、會計折舊三十、准許稅務扣減十五，稅率仍然係百分之二十。
  s2_en: >-
    The finance manager notices that current tax paid is higher than in year one, despite identical accounting
    profit. He proposes adding the closing deferred-tax liability to current tax.
  s2_zh: 财务经理发现第二年已付当期税款高于第一年，虽然两年的会计税前利润相同。他建议把期末递延所得税负债加在当期所得税上。
  s2_zh_hk: 財務經理發現第二年已交嘅當期稅款高過第一年，雖然兩年會計稅前利潤一樣。佢建議把期末遞延稅項負債加落當期稅項度。
  s3_en: >-
    The accountant says to use the movement in the liability, including its direction. Year three also
    runs exactly as scheduled, ending with no carrying amount and no remaining deduction.
  s3_zh: 会计师认为应加的是负债的变动，连同其正负方向。第三年也完全按计划进行，年底账面价值和余下税务扣减都是零。
  s3_zh_hk: 會計師認為應該加嘅係負債嘅變動，連埋佢嘅正負方向。第三年都完全按計劃進行，年底賬面值同剩低嘅稅務扣減都係零。
