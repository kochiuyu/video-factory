  en: >-
    Which reporting proposal follows the supplied rule? Calculate the initial liability under the provisional
    two-year assumption. What evidence must be completed before deciding whether the third payment belongs
    in it? Pause and vote.
  zh: 哪个报告建议符合案例规则？按暂定两年租期计算初始负债。决定是否把第三笔付款计入前，需要补齐哪些证据？请暂停，投个票。
  zh_hk: 邊個報告建議符合案例規則？按暫定兩年租期計初始負債。決定第三筆付款計唔計入之前，要補齊咩證據？暫停，投個票。
