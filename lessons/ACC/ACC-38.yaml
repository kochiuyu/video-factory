  step1_en: >-
    Two years: 17,355.37
  step1_zh: 两年：17,355.37
  step1_zh_hk: 兩年：17,355.37
  step2_en: >-
    Three years: 24,868.52
  step2_zh: 三年：24,868.52
  step2_zh_hk: 三年：24,868.52
  step3_en: Third payment adds 7,513.15
  step3_zh: 第三笔增加7,513.15
  step3_zh_hk: 第三筆增加7,513.15
  s1_en: >-
    Choose the controller's proposal. At commencement the tenant gets a right to use the warehouse and
    recognises a lease liability. Neither balance means it owns the building.
  s1_zh: 采纳财务主管的建议。租赁开始时，承租人取得使用仓库的权利，同时确认租赁负债，两者都不表示承租人拥有楼宇。
  s1_zh_hk: 採納財務主管嘅建議。租賃開始時，承租人攞到使用貨倉嘅權利，同時確認租賃負債，兩樣都唔代表承租人擁有物業。
  s2_en: >-
    Under the provisional two years, the liability is 10,000 over 1.10 plus 10,000 over 1.10 squared:
    17,355.37, below the 20,000 undiscounted because payments are in the future.
  s2_zh: 暂按两年计，负债是一万除以一点一，加一万除以一点一的平方，即一万七千三百五十五点三七。因为日后才付，现值低于未折现的二万。
  s2_zh_hk: 暫時按兩年計，負債係一萬除以一點一，加一萬除以一點一嘅平方，即係一萬七千三百五十五點三七。因為日後先付，現值低過未折現嘅兩萬。
  s3_en: >-
    With renewal reasonably certain, include year three. The liability becomes 24,868.52, and the right-of-use
    asset is also 24,868.52. The discounted third payment adds 7,513.15.
  s3_zh: >-
    完整评估支持合理确定会续租，所以计入第三年。初始负债变为二万四千八百六十八点五二，使用权资产也是二万四千八百六十八点五二。第三笔付款的折现额是七千五百一十三点一五。
  s3_zh_hk: >-
    完整評估支持可以合理確定續租，所以計埋第三年。初始負債變成二萬四千八百六十八點五二，使用權資產都係二萬四千八百六十八點五二。第三筆付款嘅折現額係七千五百一十三點一五。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Calculate
  kicker_en: Calculate
  kicker_zh: 计算
  kicker_zh_hk: 計算
  title_en: Interest and cash are different
  title_zh: 分清利息和现金
  title_zh_hk: 分清利息和現金
  step1_en: Interest 2,486.85; liability 17,355.37
  step1_zh: 利息2,486.85；负债17,355.37
  step1_zh_hk: 利息2,486.85；負債17,355.37
  step2_en: Depreciation 8,289.51; asset 16,579.01
  step2_zh: 折旧8,289.51；资产16,579.01
  step2_zh_hk: 折舊8,289.51；資產16,579.01
  step3_en: Expense 10,776.36 vs cash 10,000
  step3_zh: 费用10,776.36对现金10,000
  step3_zh_hk: 費用10,776.36對現金10,000
  s1_en: >-
    Year-one interest is 10 percent of 24,868.52, or 2,486.85. After the 10,000 payment, the liability
    is 17,355.37. The payment reduces principal by 7,513.15.
  s1_zh: >-
    首年利息是二万四千八百六十八点五二的百分之十，即二千四百八十六点八五。付一万后，负债为一万七千三百五十五点三七，付款偿还本金七千五百一十三点一五。
  s1_zh_hk: >-
    首年利息係二萬四千八百六十八點五二嘅百分之十，即係二千四百八十六點八五。付咗一萬之後，負債係一萬七千三百五十五點三七，付款還咗本金七千五百一十三點一五。
  s2_en: >-
    Annual depreciation is 24,868.52 divided by three, or 8,289.51, leaving the asset at 16,579.01. It
    differs from the liability because the two schedules follow different patterns.
  s2_zh: >-
    每年折旧是二万四千八百六十八点五二除以三，即八千二百八十九点五一，首年末资产余额一万六千五百七十九点零一。它与负债不同，因为两种摊还节奏不同。
  s2_zh_hk: >-
    每年折舊係二萬四千八百六十八點五二除以三，即係八千二百八十九點五一，首年底資產剩一萬六千五百七十九點零一。佢同負債唔同，因為兩種攤還節奏唔一樣。
  s3_en: >-
    First-year lease expense is depreciation plus interest: 10,776.36, which is 776.36 more than the 10,000
    cash paid. Do not also charge the cash as rent; that would double count.
  s3_zh: 首年租赁相关费用是折旧加利息，即一万零七百七十六点三六，比现金付款一万多七百七十六点三六。不要再把现金付款列作租金费用，否则会重复入账。
  s3_zh_hk: 首年租賃相關費用係折舊加利息，即係一萬零七百七十六點三六，比現金付款一萬多七百七十六點三六。唔好再把現金付款列做租金費用，否則會重複入賬。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Check the whole commitment
  title_zh: 核对全租期的承担
  title_zh_hk: 核對全租期的承擔
  en: >-
    Across three years, payments total 30,000. Depreciation totals the 24,868.52 asset, and interest totals
    about 5,131.48. Both balances reach zero after year three. Including renewal does not make the contract
    compulsory; do not infer reasonable certainty from optional wording or a probability cutoff. The model
    changes timing and presentation, not the contractual cash.
  zh: >-
    三年付款合计三万；折旧合计等于初始资产二万四千八百六十八点五二，利息合计约五千一百三十一点四八。第三年结束后，两项余额都是零。计入续租不使合约变成强制三年；不能单凭“可选”字眼或概率门槛推断合理确定。这个模式改变的是时点和列报，不是合约现金。
  zh_hk: >-
    三年付款合共三萬；折舊合計等於初始資產二萬四千八百六十八點五二，利息合計大約五千一百三十一點四八。第三年完咗之後，兩項結餘都係零。計埋續租唔會令合約變成強制三年；唔可以單憑「可選」字眼或者概率門檻推斷合理確定。呢個模式改變嘅係時間同列報，唔係合約現金。
