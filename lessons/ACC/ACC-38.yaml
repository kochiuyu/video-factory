  en: >-
    Calculate the final opening liability and right-of-use asset. Then reconcile first-year cash paid,
    interest, depreciation, total lease expense and both closing balances. Why does recognising year three
    not buy the warehouse or add a cash payment today? Pause and vote.
  zh: >-
    先计算开始日的租赁负债和使用权资产，再核对首年的现金支付、利息、折旧、费用合计及两项期末余额。为什么把第三年纳入计量，不等于买下仓库，也不意味着今天要多付租金？请暂停，投个票。
  zh_hk: >-
    先計開始日嘅租賃負債同使用權資產，再核對首年嘅現金支付、利息、折舊、費用合計同兩項期末結餘。點解計埋第三年，唔等於買咗個貨倉，亦唔代表今日要多交租？暫停，投個票。
