  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Rent paid is not the whole story
  title_zh: 现金租金只是一环
  title_zh_hk: 現金租金只是一環
  q1_en: Liability and asset 24,868.52
  q1_zh: 负债及资产24,868.52
  q1_zh_hk: 負債及資產24,868.52
  q2_en: Year-one expense 10,776.36
  q2_zh: 首年费用10,776.36
  q2_zh_hk: 首年費用10,776.36
  s1_en: >-
    Under the lessee model, recognise a right-of-use asset and lease liability at commencement, then depreciation
    and interest, not just annual rent.
  s1_zh: 按承租人模型，开始日要确认使用权资产和租赁负债，其后计折旧和利息，而不只是记每年租金。
  s1_zh_hk: 按承租人模式，開始日要確認使用權資產同租賃負債，之後計折舊同利息，唔係淨係記每年租金。
  s2_en: >-
    An option year belongs in the measurement when exercise is reasonably certain on the evidence available
    at commencement.
  s2_zh: 按开始日已有证据，能合理确定会行使续租权时，续租年度就应计入计量。
  s2_zh_hk: 按開始日已有嘅證據，可以合理確定會行使續租權，續租年度就要計入計量。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
