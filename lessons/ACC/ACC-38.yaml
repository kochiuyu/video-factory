  title_en: Rent paid. No obligation on the statement?
  title_zh: 租金已经付了，还要确认租赁负债吗？
  title_zh_hk: 租金已付，報表上就沒有負債？
  image: art/rent-paid-obligation-recognised-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A warehouse lease runs two non-cancellable years, with a tenant option for a third. Each year costs
    10,000, paid at year-end. The bookkeeper wants to record only 10,000 of rent expense when the first
    payment is made. Is that enough? You review the accounts of Harbour Store, a fictional Hong Kong tenant.
  zh: >-
    仓库租约有两年不可撤销期，承租人另有续租一年的权利。每年租金一万港元，年末支付。簿记员建议首次付年租时只记一万租金费用。这样够吗？你负责复核香港虚构承租人“海湾仓储”的账目。
  zh_hk: >-
    貨倉租約有兩年不可取消期，承租人另外有續租一年嘅權利。每年租金一萬港元，年底支付。簿記員建議第一次交年租嗰陣只記一萬租金費用。咁樣夠唔夠？你負責覆核香港虛構承租人「海灣倉儲」嘅賬目。
