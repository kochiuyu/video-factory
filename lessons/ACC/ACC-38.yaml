  s1_en: >-
    Before the opening entries are finalised, the complete file arrives: an existing three-year customer
    storage commitment, and an assessment that relocating after year two would impose significant cost
    and disruption.
  s1_zh: 编完期初分录前，财务负责人拿到了完整资料：客户已经承诺存储三年，书面评估也表明第二年结束时搬迁会增加显著且可避免的成本并中断运营。
  s1_zh_hk: 做完期初分錄之前，完整資料送到：客戶已經承諾存放三年，書面評估亦顯示第二年完咗搬遷會帶來重大而可以避免嘅成本同營運中斷。
  s2_en: >-
    The assessor concludes that exercising the renewal option is reasonably certain. These facts existed
    when the warehouse became available; the first paper was simply incomplete.
  s2_zh: 评估结论是可合理确定承租人会行使续租权。仓库可开始使用时，这些事实已经存在；第一份底稿只是资料不全。
  s2_zh_hk: 評估結論係可以合理確定承租人會行使續租權。貨倉可以開始用嗰陣，呢啲事實已經存在；第一份底稿只係資料唔齊。
  s3_en: >-
    Use three payments of 10,000, the same 10 percent rate and three years of straight-line depreciation.
    The option is still legally an option, and the landlord receives nothing extra today.
  s3_zh: 用三笔每年一万的付款、原定百分之十利率和三年直线折旧。法律上续租权仍是选择权，业主今天也不会多收款。
  s3_zh_hk: 用三筆每年一萬嘅付款、原定百分之十利率同三年直線折舊。法律上續租權仍然係選擇權，業主今日亦唔會多收錢。
