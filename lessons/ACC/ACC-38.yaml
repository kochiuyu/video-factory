  s1_en: >-
    The controller proposes a right-of-use asset and lease liability at commencement, then depreciation
    and interest. Neither proposal changes the contract, the cash due or ownership.
  s1_zh: 财务主管认为应在租赁开始日确认使用权资产和租赁负债，之后计折旧和利息。两种建议都不会改变合约、应付现金或楼宇所有权。
  s1_zh_hk: 財務主管認為應該喺租賃開始日確認使用權資產同租賃負債，之後計折舊同利息。兩個建議都唔會改變合約、應付現金或者物業業權。
  s2_en: >-
    The accounting term includes the two compulsory years, plus the option year if exercise is reasonably
    certain. The first working paper provisionally excludes renewal.
  s2_zh: 两年不可撤销期必然计入；如能合理确定会行使续租选择权，还应计入可续租的一年。首份工作底稿暂不计续租期。
  s2_zh_hk: 兩年不可取消期一定計入；如果可以合理確定會行使續租選擇權，就要計埋續租嗰一年。第一份工作底稿暫時唔計續租期。
  s3_en: >-
    Use the 10 percent incremental borrowing rate. Initial liability is each included payment divided
    by 1.10 raised to its year. Depreciate the asset evenly; interest is opening liability times 10 percent.
  s3_zh: 使用百分之十的增量借款利率。初始负债是各笔计入的付款除以一点一的付款年度次方后相加。资产按直线法折旧；每年利息等于期初负债乘百分之十。
  s3_zh_hk: 用百分之十嘅增量借款利率。初始負債係每筆計入嘅付款除以一點一嘅付款年度次方再加埋。資產按直線法折舊；每年利息等於期初負債乘百分之十。
