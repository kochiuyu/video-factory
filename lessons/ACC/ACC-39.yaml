  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Quantity, mix and price?
  title_zh: 总销量、组合与售价？
  title_zh_hk: 總銷量、組合同售價？
  en: >-
    Calculate the hypothetical basket and its revenue, then reconcile quantity, mix and price effects
    to the unchanged 800 shortfall. Why would adding the volume effect again double count? What should
    the owner be told? Pause and vote.
  zh: 算出假设组合的销量和收入，再把总销量、组合和售价影响与八百的收入缺口核对。为什么不能再加一遍销量影响？向店主应怎样汇报？请暂停，投个票。
  zh_hk: 計出假設組合嘅銷量同收入，再把總銷量、組合同售價影響同八百嘅收入差額核對。點解唔可以再加多次銷量影響？應該點樣向老闆匯報？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Two effects, then three
  title_zh: 先分两种，再分三种
  title_zh_hk: 先分兩種，再分三種
  step1_en: Gap −800; volume +1,600; price −2,400
  step1_zh: 差额−800；销量+1,600；售价−2,400
  step1_zh_hk: 差額−800；銷量+1,600；售價−2,400
  step2_en: >-
    Fixed-mix basket: 720 and 480 = 16,800
  step2_zh: 固定组合：720与480 = 16,800
  step2_zh_hk: 固定組合：720同480 = 16,800
  step3_en: Quantity +2,800; mix −1,200
  step3_zh: 总销量+2,800；组合−1,200
  step3_zh_hk: 總銷量+2,800；組合−1,200
  s1_en: >-
    Budget revenue is 14,000, so the gap is minus 800. The volume effect is 15,600 minus 14,000, plus
    1,600; the price effect is 13,200 minus 15,600, minus 2,400.
  s1_zh: 预算收入一万四千，差额是负八百。销量影响是一万五千六百减一万四千，即正一千六百；售价影响是一万三千二百减一万五千六百，即负二千四百。
  s1_zh_hk: 預算收入一萬四千，差額係負八百。銷量影響係一萬五千六百減一萬四千，即係正一千六百；售價影響係一萬三千二百減一萬五千六百，即係負二千四百。
  s2_en: >-
    At 1,200 packs and the budget mix, the basket is 720 Plain and 480 Filled, worth 16,800 at budget
    prices. The total-quantity effect is 16,800 minus 14,000: plus 2,800.
  s2_zh: 按一千二百包和预算组合，假设售出原味七百二十包、有馅四百八十包，按预算售价计一万六千八百。总销量影响是一万六千八百减一万四千，即正二千八百。
  s2_zh_hk: >-
    按一千二百包同預算組合，假設賣出原味七百二十包、有餡四百八十包，按預算售價計一萬六千八百。總銷量影響係一萬六千八百減一萬四千，即係正二千八百。
  s3_en: >-
    The mix effect is 15,600 minus 16,800: minus 1,200. Quantity plus mix equals the original volume effect
    of plus 1,600.
  s3_zh: 组合影响是一万五千六百减一万六千八百，即负一千二百。总销量加组合，等于原先的销量影响正一千六百。
  s3_zh_hk: 組合影響係一萬五千六百減一萬六千八百，即係負一千二百。總銷量加組合，等於原先嘅銷量影響正一千六百。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Calculate
  kicker_en: Calculate
  kicker_zh: 计算
  kicker_zh_hk: 計算
  title_en: Price the actual packs
  title_zh: 按实际包数计售价影响
  title_zh_hk: 按實際包數計售價影響
  step1_en: Plain −1,680; Filled −720
  step1_zh: 原味−1,680；有馅−720
  step1_zh_hk: 原味−1,680；有餡−720
  step2_en: 14,000 + 2,800 − 1,200 − 2,400
  step2_zh: 14,000 + 2,800 − 1,200 − 2,400
  step2_zh_hk: 14,000 + 2,800 − 1,200 − 2,400
  step3_en: Average price 14 → 11
  step3_zh: 平均售价14 → 11
  step3_zh_hk: 平均售價14 → 11
  s1_en: >-
    Plain's price effect is 840 times minus 2, or minus 1,680. Filled's is 360 times minus 2, or minus
    720. Together, minus 2,400.
  s1_zh: 原味售价影响是八百四十乘负二，即负一千六百八十；有馅是三百六十乘负二，即负七百二十，合计负二千四百。
  s1_zh_hk: 原味售價影響係八百四十乘負二，即係負一千六百八十；有餡係三百六十乘負二，即係負七百二十，合共負二千四百。
  s2_en: >-
    Final reconciliation: 14,000 plus 2,800, minus 1,200, minus 2,400 equals 13,200. Do not add the plus
    1,600 again; it is already quantity plus mix.
  s2_zh: 最终核对：一万四千加二千八百，减一千二百，再减二千四百，等于一万三千二百。不可再加正一千六百，因为这已是总销量与组合的合计。
  s2_zh_hk: 最終核對：一萬四千加二千八百，減一千二百，再減二千四百，等於一萬三千二百。唔可以再加正一千六百，因為呢個已經係總銷量同組合嘅合計。
  s3_en: >-
    The average price per pack fell from 14 to 11. At the actual mix, budget prices average 13: mix explains
    1 of the 3 difference and product price changes explain 2.
  s3_zh: 平均每包售价由十四降到十一。按实际组合套用预算单价，平均是十三：三元差额中，组合占一元，产品自身的售价变化占二元。
  s3_zh_hk: 平均每包售價由十四跌到十一。按實際組合套用預算單價，平均係十三：三蚊差額入面，組合佔一蚊，產品本身售價變化佔兩蚊。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Report without assigning blame
  title_zh: 陈述结果，不归咎个人
  title_zh_hk: 陳述結果，唔歸咎個人
  en: >-
    Tell the owner: we sold more packs, but the mix shifted toward the lower-priced product and realised
    prices fell; together these offset the positive quantity effect, leaving an 800 shortfall. Favourable
    and adverse describe revenue, not an employee's merit. Request price approvals, promotion terms, availability,
    demand and the budget's basis, then examine margins separately.
  zh: >-
    可以这样汇报：实际售出的包数更多，但低价款所占比例提高，两种产品的实际售价也下跌；这两方面抵销了总销量增长的正向影响，最终收入低于预算八百。有利与不利描述的是收入差异，不是对员工的评价。应索取订价审批、促销条款、供应情况、顾客需求和预算依据，另查成本和利润率。
  zh_hk: >-
    可以咁樣匯報：實際賣出嘅包數多咗，但低價款嘅比例提高，兩款產品嘅實際售價亦下跌；兩方面抵銷咗總銷量增長嘅正面影響，最後收入比預算少八百。有利同不利講嘅係收入差異，唔係對員工嘅評價。要索取定價審批、推廣條款、供應情況、顧客需求同預算依據，再另外查成本同利潤率。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: One gap, offsetting effects
  title_zh: 同一差额，相反影响抵销
  title_zh_hk: 同一差額，相反影響抵銷
  q1_en: Quantity +2,800; mix −1,200
  q1_zh: 总销量+2,800；组合−1,200
  q1_zh_hk: 總銷量+2,800；組合−1,200
  q2_en: Price −2,400; total −800
  q2_zh: 售价−2,400；合计−800
  q2_zh_hk: 售價−2,400；合計−800
  s1_en: >-
    A revenue shortfall can hide a positive quantity effect offset by mix and price. Split the bridge
    in a stated order and reconcile it exactly.
  s1_zh: 收入缺口可能掩盖了正向的总销量影响，被组合和售价抵销。按明确次序拆解，并准确核对。
  s1_zh_hk: 收入差額可能掩蓋咗正面嘅總銷量影響，被組合同售價抵銷。按明確次序拆解，並準確核對。
  s2_en: Arithmetic alone supports no causal, profit or performance conclusion.
  s2_zh: 单凭计算，不能作因果、利润或绩效判断。
  s2_zh_hk: 單憑計算，唔可以作因果、利潤或者表現判斷。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
