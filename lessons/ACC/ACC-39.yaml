  title_zh_hk: 各產品的完整記錄
  step1_en: >-
    Plain: 840 packs at HK$8
  step1_zh: 原味：840包，每包8元
  step1_zh_hk: 原味：840包，每包8元
  step2_en: >-
    Filled: 360 packs at HK$18
  step2_zh: 有馅：360包，每包18元
  step2_zh_hk: 有餡：360包，每包18元
  step3_en: Plain share 70% vs 60% budget
  step3_zh: 原味占70%，预算60%
  step3_zh_hk: 原味佔70%，預算60%
  s1_en: >-
    The completed record shows 840 Plain packs at 8 and 360 Filled packs at 18. These are the same 1,200
    packs and 13,200 revenue, not extra sales.
  s1_zh: 完整记录显示原味八百四十包，每包八港元；有馅三百六十包，每包十八港元。这就是先前的一千二百包、一万三千二百收入，不是额外销售。
  s1_zh_hk: 完整記錄顯示原味八百四十包，每包八港元；有餡三百六十包，每包十八港元。即係之前嗰一千二百包、一萬三千二百收入，唔係額外銷售。
  s2_en: >-
    Actual Plain share is 70 percent of packs, against 60 percent in the budget. No record shows why customers
    bought this mix.
  s2_zh: 实际包数中原味占百分之七十，预算占百分之六十。没有记录证明顾客为何选择这个组合。
  s2_zh_hk: 實際包數入面原味佔百分之七十，預算係百分之六十。冇記錄證明顧客點解揀呢個組合。
  s3_en: >-
    Now split the volume effect. Scale budget quantities to 1,200 at the budget 60 to 40 mix and value
    them at budget prices. That gives the total-quantity effect; the rest is the mix effect.
  s3_zh: 现在把销量影响拆为两步：先把一千二百包按预算六比四的组合分配，以预算售价计算，得到总销量影响；其余是组合影响。
  s3_zh_hk: 而家把銷量影響拆做兩步：先把一千二百包按預算六比四嘅組合分配，用預算售價計，得出總銷量影響；其餘係組合影響。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
