  title_en: More packs sold. Why less revenue?
  title_zh: 卖得更多，为什么收入反而下降？
  title_zh_hk: 賣多了，為甚麼收入反而少了？
  image: art/more-packs-less-revenue-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Revenue missed budget by 800 this month. The owner wants to say the team sold too little. The controller
    proposes a bridge separating price from quantity and mix. Which explanation do the records support?
    You are the controller of Harbour Bakery, a fictional Hong Kong bakery selling Plain and Filled six-bun
    packs.
  zh: >-
    本月收入比预算少八百港元。店主想说团队卖得太少；财务主管则建议把价格影响与销量和组合的影响分开。记录支持哪个说法？你是香港虚构商户“海湾面包店”的财务主管，店里卖原味和有馅两款六个装面包。
  zh_hk: >-
    今個月收入比預算少八百港元。老闆想話團隊賣得太少；財務主管就建議把價格影響同銷量及組合嘅影響分開。記錄支持邊個講法？你係香港虛構商戶「海灣麵包店」嘅財務主管，店舖賣原味同有餡兩款六個裝麵包。
