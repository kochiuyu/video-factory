  title_en: Too few packs sold?
  title_zh: 是卖得太少吗？
  title_zh_hk: 係咪賣得太少？
  en: >-
    Calculate the total revenue gap, the sales-volume effect and the sales-price effect. Does the shortfall
    show that too few packs were sold, that prices alone explain everything, or that someone performed
    poorly? Pause and vote.
  zh: 请计算收入总差额，并把它分为销量影响和售价影响。收入不达标，能否证明销量不足、只有单价影响，或者某个人表现不好？请暂停，投个票。
  zh_hk: 請計出收入總差額，再分成銷量影響同售價影響。收入唔達標，可唔可以證明銷量不足、淨係單價影響，或者有人表現差？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: The product-level record
