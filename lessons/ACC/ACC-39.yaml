  c22: 15,600
  c31: 1,200
  c32: 13,200
  footer_en: >-
    Actual: 1,200 packs vs 1,000 budget
  footer_zh: 实际1,200包，预算1,000包
  footer_zh_hk: 實際1,200包，預算1,000包
  s1_en: >-
    Budget sales are 600 Plain packs at 10 and 400 Filled packs at 20. Actual sales total 1,200 packs
    and 13,200 of revenue.
  s1_zh: 预算售出六百包原味，每包十港元；四百包有馅，每包二十港元。实际总销量一千二百包，收入一万三千二百。
  s1_zh_hk: 預算賣六百包原味，每包十港元；四百包有餡，每包二十港元。實際總銷量一千二百包，收入一萬三千二百。
  s2_en: >-
    The checked subtotal, pricing actual product quantities at budget prices, is 15,600. Product-level
    actuals come in round two.
  s2_zh: 财务主管已核对：各产品实际件数按各自预算售价计算，小计一万五千六百。各产品实际记录第二轮才公布。
  s2_zh_hk: 財務主管已經核對：各產品實際件數按各自預算售價計，小計一萬五千六百。各產品實際記錄第二輪先公布。
  s3_en: >-
    Increases are positive, decreases negative. The sales-volume effect moves budget quantities to actual
    at budget prices; the sales-price effect then moves to actual prices. Together they equal actual minus
    budget.
  s3_zh: >-
    使收入增加的差异记正数，减少的记负数。销量影响是按预算售价，把预算销量改为实际销量；售价影响是再把预算售价改为实际售价。两者合计等于实际收入减预算收入。
  s3_zh_hk: >-
    令收入增加嘅差異記正數，減少嘅記負數。銷量影響係按預算售價，把預算銷量改做實際銷量；售價影響係再把預算售價改做實際售價。兩者加埋等於實際收入減預算收入。
