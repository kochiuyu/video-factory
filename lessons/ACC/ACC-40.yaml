  title_en: A direct reply with an exception
  title_zh: 直接回函提出异议
  title_zh_hk: 直接回覆提出異議
  step1_en: Authenticated reply from the officer
  step1_zh: 授权财务人员直接回函
  step1_zh_hk: 授權財務人員直接回覆
  step2_en: Accepts B; disputes A
  step2_zh: 认可 B；对 A 提出异议
  step2_zh_hk: 認可 B；對 A 提出異議
  step3_en: 60,000 allocated to B
  step3_zh: 60,000 指定支付 B
  step3_zh_hk: 60,000 指定支付 B
  s1_en: >-
    The auditor receives an authenticated written reply directly from the customer's authorised accounts
    officer. The customer accepts invoice B but disputes invoice A, saying its goods were not received.
  s1_zh: 审计人员直接收到客户授权财务人员发来的书面回函，并核实了真伪。客户认可发票 B，却表示没有收到 A 所列货物，因而对 A 提出异议。
  s1_zh_hk: 核數師直接收到客戶授權財務人員嘅書面回覆，並核實咗真偽。客戶認可發票 B，但話冇收到 A 嘅貨物，所以對 A 提出異議。
  s2_en: >-
    The customer's remittance advice allocates the January 60,000 to B; amount, payer and bank entry match.
  s2_zh: 客户的汇款通知明确将一月的六万用于支付 B；金额、付款人和银行流水都吻合。
  s2_zh_hk: 客戶嘅匯款通知明確將一月嗰六萬用嚟支付 B；金額、付款人同銀行記錄都吻合。
  s3_en: >-
    Management says A's goods were delivered before year-end, but the delivery evidence and contract terms
    are not yet examined. The manager argues that receiving 60 percent proves the whole account sound.
  s3_zh: 管理层说 A 的货物已在年结前交付，但尚未检视交付证据和合约条款。经理称收回六成余额便能证明整笔账项无误。
  s3_zh_hk: 管理層話 A 嘅貨物已經喺年結前交付，但仲未檢視交付證據同合約條款。經理話收返六成結餘就證明成筆賬冇問題。
