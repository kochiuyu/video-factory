  s1_en: >-
    The balance consists only of invoice A for 40,000 and invoice B for 60,000. The team has not authenticated
    the forwarded email's sender, authority or complete contents.
  s1_zh: 这笔余额只包括发票 A 的四万和发票 B 的六万。审计团队还没有核实转发邮件的原发件人、其权限或内容是否完整。
  s1_zh_hk: 呢筆結餘只包括發票 A 嘅四萬同發票 B 嘅六萬。審計團隊仲未核實轉發電郵嘅原寄件人、佢嘅權限或者內容係咪完整。
  s2_en: >-
    A genuine 60,000 receipt on 15 January has been checked against the bank record, but its invoice allocation
    has not been supplied.
  s2_zh: 一月十五日确实收到六万，并已与银行记录独立核对；但这笔收款对应哪张发票，暂未得到说明。
  s2_zh_hk: 一月十五日確實收到六萬，亦已經同銀行記錄獨立核對；但呢筆收款對應邊張發票，暫時未有說明。
  s3_en: >-
    A controlled confirmation means the auditor picks the respondent, verifies contact details independently,
    sends the request and receives the reply directly. Direct receipt improves provenance; it does not
    make every statement correct.
  s3_zh: 受控函证是指审计人员选定被询证者，独立验证联系方式，发出询证函并直接接收回复。直接收函更便于确认来源，但不能据此认定所有陈述正确。
  s3_zh_hk: 受控函證係指核數師揀選回覆人、獨立核實聯絡方法、寄出函證，再直接收回覆。直接收回覆有助確認來源，但唔代表所有陳述都正確。
