  title_en: Which invoice did the cash pay?
  title_zh: 收款支持哪一张发票？
  title_zh_hk: 收款支持邊張發票？
  en: >-
    Reconcile the 100,000 balance to the direct reply and the January receipt. Which invoice does the
    payment support, what amount remains disputed, and what work would distinguish a valid claim from
    an accounting error? Pause and vote.
  zh: 请把年末十万与直接回函和一月收款逐项核对。收款支持哪一张发票？争议金额还有多少？还要做什么，才能区分年末确有债权与会计差错？请暂停，投个票。
  zh_hk: >-
    請把年底十萬同直接回覆同一月收款逐項核對。收款支持邊張發票？仲有幾多金額有爭議？仲要做乜，先可以分清年底真係有債權定係會計錯誤？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Provenance is not agreement
  title_zh: 来源可信不等于认可余额
  title_zh_hk: 來源可信不等於確認賬項
  step1_en: >-
    Forwarded email: source unresolved
  step1_zh: 转发邮件：来源未确定
  step1_zh_hk: 轉發電郵：來源未確定
  step2_en: Verify the respondent independently
  step2_zh: 独立核实回复者
  step2_zh_hk: 獨立核實回覆人
  step3_en: An exception is useful evidence
  step3_zh: 不符事项是有用证据
  step3_zh_hk: 不符事項是有用證據
  s1_en: >-
    Keep the initial conclusion open. The forwarded message may be genuine, but its route leaves source,
    authority and completeness unresolved.
  s1_zh: 先不作结论。管理层转发的邮件可能是真的，但原始来源、权限和完整性仍未确定。
  s1_zh_hk: 先唔好落結論。管理層轉發嘅電郵可能係真嘅，但原始來源、權限同完整性仍然未確定。
  s2_en: >-
    Independently verify the respondent and obtain the written response directly. Do not resend to an
    address copied from the unverified message and call that independent.
  s2_zh: 要独立核实回复者，并直接收取书面回复。不可把未经核实邮件中的地址照抄重寄，就当作独立核实。
  s2_zh_hk: 要獨立核實回覆人，再直接收取書面回覆。唔可以照抄未核實電郵入面嘅地址再寄，就當作獨立核實。
  s3_en: >-
    The direct reply is less reassuring but more useful: its exception pinpoints what to investigate.
    Record it with its provenance rather than replacing it with management's positive summary.
  s3_zh: 直接回复虽然不如转发的消息乐观，却更有证据价值，因为它指出了要查的具体不符事项。应保留回复及其来源，不用管理层的正面摘要取代。
  s3_zh_hk: 直接回覆雖然冇轉發訊息咁樂觀，但更有證據價值，因為佢指出要查嘅具體不符事項。要保留回覆同佢嘅來源，唔好用管理層嘅正面摘要取代。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Match cash to the item paid
  title_zh: 将收款配对至相关发票
  title_zh_hk: 將收款配對至相關發票
  step1_en: 40,000 + 60,000 = 100,000
  step1_zh: 40,000 + 60,000 = 100,000
  step1_zh_hk: 40,000 + 60,000 = 100,000
  step2_en: Receipt supports B, not A
  step2_zh: 收款支持 B，不支持 A
  step2_zh_hk: 收款支持 B，不支持 A
  step3_en: 40,000 remains disputed
  step3_zh: 40,000 仍有争议
  step3_zh_hk: 40,000 仍有爭議
  s1_en: >-
    The year-end balance is 40,000 plus 60,000, or 100,000. The authenticated reply accepts B, and the
    verified 60,000 receipt specifically pays B.
  s1_zh: 年末余额是四万加六万，即十万。经核实的直接回函认可 B，其后核实的六万收款也指定支付 B。
  s1_zh_hk: 年底結餘係四萬加六萬，即係十萬。已核實嘅直接回覆認可 B，之後核實嘅六萬收款亦指定支付 B。
  s2_en: >-
    The same receipt cannot be counted again as settling the disputed 40,000. Sixty percent has payment
    corroboration and forty percent is disputed; those are arithmetic, not confidence levels.
  s2_zh: 不能把同一笔收款再算成有争议的四万已清还。六成有收款佐证，四成仍有争议；这些百分比只是数字比例，不是可信程度。
  s2_zh_hk: 唔可以把同一筆收款再當成有爭議嗰四萬已經還清。六成有收款佐證，四成仍有爭議；呢啲百分比只係數字比例，唔係可信程度。
  s3_en: >-
    For A, inspect the purchase order, contract terms, invoice, dispatch and carrier records and acceptance
    correspondence. A supplier's own invoice alone cannot settle whether the year-end claim is valid.
  s3_zh: 对 A 应检查采购订单、合同、发票、发运凭据、承运商记录及客户验收往来。仅有供应商自行开出的发票，无法确定年末债权是否成立。
  s3_zh_hk: 對 A 要檢查採購訂單、合約條款、發票、發貨同承運商記錄，以及客戶驗收往來。淨係得供應商自己開嘅發票，確定唔到年底債權係咪成立。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Keep the conclusion within scope
  title_zh: 结论不能超出证据范围
  title_zh_hk: 結論不能超出證據範圍
  en: >-
    B has direct acknowledgement and a matched payment; A remains unresolved. Neither automatic clearance
    nor an automatic 40,000 write-off is justified. The denial might reflect a delivery or timing difference,
    a contract dispute or an error; do not choose a cause first. No evidence shows dishonesty, and the
    case supports no final audit opinion.
  zh: >-
    目前能确认的范围有限：B 有直接回函认可，并与期后收款匹配；A 仍待核实。既不能直接结案，也不能自动核销四万。客户否认收货，可能源于交付或时间差异、合同争议，也可能是账目有误；不要预设原因。没有证据显示有人不诚实，本例也不支持最终审计意见。
  zh_hk: >-
    目前確認到嘅範圍有限：B 有直接回覆認可，亦同期後收款配對到；A 仍然有待核實。既唔可以直接結案，亦唔可以自動撇賬四萬。客戶否認收貨，可能係交付或時間差異、合約爭議，亦可能係賬目出錯；唔好預設原因。冇證據顯示有人唔誠實，本例亦唔支持最終審計意見。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Provenance and item, both matter
  title_zh: 看来源，也要看对应项目
  title_zh_hk: 睇來源，亦要睇對應項目
  q1_en: >-
    B: confirmed and paid, 60,000
  q1_zh: B：已认可并收款60,000
  q1_zh_hk: B：已認可並收款60,000
  q2_en: >-
    A: disputed, 40,000
  q2_zh: A：有争议，40,000
  q2_zh_hk: A：有爭議，40,000
  s1_en: >-
    A forwarded reassurance is not a controlled confirmation. Obtain the reply directly from a verified,
    authorised respondent.
  s1_zh: 转发的安心说法不是受控函证。应从经核实、获授权的回复者直接取得回复。
  s1_zh_hk: 轉發嘅安心講法唔係受控函證。要由已核實、獲授權嘅回覆人直接攞回覆。
  s2_en: >-
    Match each receipt to the invoice it pays, and investigate the exception rather than clearing or writing
    off the balance automatically.
  s2_zh: 把每笔收款配对至它支付的发票，调查不符事项，不要自动结案或核销。
  s2_zh_hk: 把每筆收款配對到佢支付嘅發票，調查不符事項，唔好自動結案或者撇賬。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
