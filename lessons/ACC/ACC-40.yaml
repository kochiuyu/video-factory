  title_en: A reassuring reply. Evidence from whom?
  title_zh: 回函看似让人放心，证据究竟来自谁？
  title_zh_hk: 回覆令人安心，但證據來自誰？
  image: art/reassuring-reply-evidence-from-whom-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A customer owes a fictional Hong Kong distributor 100,000 at 31 December. The finance manager forwards
    an email, apparently from the customer, saying the balance looks right, and a 60,000 receipt has arrived.
    Can the audit team mark the whole balance confirmed? You are on that audit team.
  zh: >-
    香港一家虚构经销商于十二月三十一日有一名客户的应收款项十万港元。财务经理转发一封看似来自客户的邮件，称余额大致相符，另外也收到六万港元的款项。审计团队能把整笔余额标记为已确认吗？你是团队的一员。
  zh_hk: >-
    香港一間虛構經銷商喺十二月三十一日有一個客戶欠款十萬港元。財務經理轉發一封似係客戶寄嚟嘅電郵，話結餘大致啱，另外亦收到六萬港元款項。審計團隊可唔可以把成筆結餘標記為已確認？你係團隊嘅一員。
