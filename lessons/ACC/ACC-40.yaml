  title_en: Mark the balance confirmed?
  title_zh: 能标记为已确认吗？
  title_zh_hk: 可以標記為已確認嗎？
  en: >-
    Can the full year-end balance be marked confirmed? Explain what the forwarded reply and verified receipt
    establish, what remains unknown, and the next controlled evidence step. Pause and vote.
  zh: 可否把整笔年末余额标记为已确认？说明转发回复和经核实的收款能证明什么、还欠什么，以及下一步应如何在受控渠道下取证。请暂停，投个票。
  zh_hk: 可唔可以把成筆年底結餘標記為已確認？講清楚轉發回覆同已核實收款證明到乜嘢、仲欠乜嘢，同埋下一步點樣喺受控渠道取證。暫停，投個票。
