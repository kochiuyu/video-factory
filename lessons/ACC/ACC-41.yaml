  s1_en: >-
    Management uses the adjusted subtotal to track depot operations before a defined group of restructuring
    costs. It covers the whole group, it is not a subtotal specified by HKFRS, and the slides will be
    posted publicly.
  s1_zh: 管理层想借这个小计，看看不计特定重组成本时配送站经营得怎么样。它覆盖整个集团，不是准则规定的小计，而且演示稿会公开发布。
  s1_zh_hk: 管理層用呢個小計，睇吓未計指定重組成本之前，配送站嘅營運表現點樣。佢涵蓋成個集團，唔係準則指定嘅小計，而且簡報會公開俾投資者睇。
  s2_en: >-
    The parent's 2 million restructuring expense brings no income tax benefit. The subsidiary's 6 million
    is deductible at a hypothetical 20 percent rate. Assume no deferred tax effects.
  s2_zh: 母公司的两百万重组支出不产生所得税利益。子公司的六百万可以在税前扣除，假定税率是百分之二十，不考虑递延所得税。
  s2_zh_hk: 母公司嗰兩百萬重組支出冇所得稅利益。附屬公司嗰六百萬可以扣稅，假設稅率係百分之二十，唔考慮遞延稅項。
  s3_en: >-
    Outside shareholders own 20 percent of the subsidiary and share in its after-tax result. All figures
    and tax assumptions are fictional.
  s3_zh: 外部股东持有子公司百分之二十的股权，按比例分享它的税后损益。所有数字和税务假设都是虚构的。
  s3_zh_hk: 外部股東持有附屬公司百分之二十股權，按比例分享佢嘅除稅後業績。所有數字同稅務假設都係虛構嘅。
