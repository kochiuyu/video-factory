- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: A management-defined measure
  title_zh: 这是管理层界定的业绩指标
  title_zh_hk: 這是管理層界定的績效計量
  step1_en: >-
    Not cleared: it is an MPM
  step1_zh: 不批准：属于MPM
  step1_zh_hk: 不批准：屬於MPM
  step2_en: Keep 30; bridge 30 + 2 + 6 = 38
  step2_zh: 仍列30；调节30 + 2 + 6 = 38
  step2_zh_hk: 仍列30；調節30 + 2 + 6 = 38
  step3_en: >-
    Subsidiary item: tax +1.20; NCI +0.96
  step3_zh: 子公司项目：税+1.20；少数股东+0.96
  step3_zh_hk: 附屬公司項目：稅+1.20；非控股+0.96
  s1_en: >-
    Do not clear the draft as written. The slides use a subtotal that no standard specifies to show management's
    view of group performance. That makes it a management-defined performance measure, or MPM.
  s1_zh: 不应按原稿批准。演示稿用一个准则没有规定的小计，来表达管理层眼中的集团业绩，所以它属于管理层界定的业绩指标，也就是 MPM。
  s1_zh_hk: 唔應該照原稿批准。簡報用一個準則冇指定嘅小計，表達管理層點睇集團表現，所以佢屬於管理層界定的績效計量，即係 MPM。
  s2_en: >-
    Keep 30 million as HKFRS operating profit. The separate bridge is 30 plus 2 plus 6, which is 38 million,
    before tax.
  s2_zh: 按准则列报的经营利润仍然是三千万。另外单独列示税前调节：三十加二加六，等于三千八百万。
  s2_zh_hk: 按準則列示嘅經營溢利仍然係三千萬。另外單獨列出除稅前調節：三十加二加六，等於三千八百萬。
  s3_en: >-
    The parent's 2 million has no tax or outside-shareholder effect. Adding back the subsidiary's deductible
    6 million raises hypothetical tax expense by 1.20 million and the non-controlling interests' share
    by 0.96 million.
  s3_zh: >-
    母公司那两百万对所得税和外部股东都没有影响。子公司那六百万原本可以税前扣除，加回后，假设的所得税费用增加一百二十万，少数股东份额增加九十六万。
  s3_zh_hk: >-
    母公司嗰兩百萬對稅項同外部股東都冇影響。附屬公司嗰六百萬本來可以扣稅，加回之後，假設所得稅開支增加一百二十萬，非控股權益所佔份額增加九十六萬。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Compare both years on one basis
  title_zh: 两年用同一口径比较
  title_zh_hk: 兩年按同一基準比較
  step1_en: 2026 bridge 34 + 0.5 + 1.5 = 36
  step1_zh: 2026年：34 + 0.5 + 1.5 = 36
  step1_zh_hk: 2026年：34 + 0.5 + 1.5 = 36
  step2_en: Reported −11.8%; adjusted +5.6%
  step2_zh: 列报约−11.8%；调整后约+5.6%
  step2_zh_hk: 已呈報約−11.8%；調整後約+5.6%
  step3_en: Drop 'one-off'; show both trends
  step3_zh: 删去“一次性”；两项趋势都列
  step3_zh_hk: 刪去「一次性」；兩項走勢都列
  s1_en: >-
    In 2026 the bridge is 34 plus 0.5 plus 1.5, or 36 million. The subsidiary item adds 0.30 million of
    tax expense and 0.24 million to the outside shareholders' share.
  s1_zh: 二零二六年的调节是三十四加零点五加一点五，等于三千六百万。子公司项目使所得税费用增加三十万，少数股东份额增加二十四万。
  s1_zh_hk: 二零二六年嘅調節係三十四加零點五加一點五，等於三千六百萬。附屬公司項目令所得稅開支增加三十萬，非控股權益所佔份額增加二十四萬。
  s2_en: >-
    Reported operating profit fell from 34 to 30 million, about 11.8 percent; adjusted profit rose from
    36 to 38 million, about 5.6 percent. The excluded expenses rose from 2 to 8 million.
  s2_zh: >-
    列报的经营利润从三千四百万降到三千万，约降百分之十一点八；调整后的从三千六百万升到三千八百万，约升百分之五点六。原因是剔除的费用从两百万增加到八百万。
  s2_zh_hk: >-
    已呈報經營溢利由三千四百萬跌到三千萬，跌咗大約百分之十一點八；調整後就由三千六百萬升到三千八百萬，升咗大約百分之五點六。原因係剔除咗嘅開支由兩百萬加到八百萬。
  s3_en: >-
    Reject 'one-off': these costs occurred in both years. If the measure is useful, call it 'operating
    profit before depot restructuring costs', explain what qualifies and why it helps, and show both trends.
  s3_zh: >-
    “一次性”这个说法要否决，因为这些成本两年都发生了。如果指标确实有用，可以改称“扣除配送站重组成本前的经营利润”，说明哪些支出算在里面、指标有什么用，并同时列出两项趋势。
  s3_zh_hk: >-
    「一次性」呢個講法要否決，因為兩年都有呢啲成本。如果呢個計量真係有用，可以改稱「未計配送站重組成本的經營溢利」，講清楚邊啲支出計入、有乜用，同時展示兩項走勢。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: One MPM note, both trends
  title_zh: 一项MPM附注，两项趋势
  title_zh_hk: 一項MPM附註，兩項走勢
  en: >-
    Show tax and non-controlling interest effects beside each adjustment, not as deductions from the 38.
    Put the measure in the single MPM note: its calculation, the reconciliation to operating profit, the
    tax method, per-item tax and non-controlling interest effects, and comparable prior-year figures.
    Say it reflects management's view and that similarly named measures elsewhere may not be comparable.
    An add-back does not remove an expense from the financial statements.
  zh: >-
    所得税和少数股东权益的影响要列在每个调整项目旁边，不能从三千八百万里扣。把指标放进集中披露 MPM 的那项附注：写明计算方法、与经营利润的调节、所得税影响的算法、逐项的所得税和少数股东权益影响，以及上年可比数字。还要说明它代表管理层的观点，其他公司名称相近的指标不一定可比。加回不等于把费用从财务报表里删掉。
  zh_hk: >-
    稅項同非控股權益嘅影響要列喺每個調整項目隔籬，唔可以喺三千八百萬入面扣。將計量放入同一項 MPM 附註：列明計算方法、同經營溢利嘅調節、稅項影響嘅計法、逐項所得稅同非控股權益影響，仲有上年度比較資料。亦要講明佢反映管理層觀點，其他企業名稱相近嘅計量未必可以比較。加回唔等於將開支喺財務報表刪走。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Reconcile it, name it honestly
  title_zh: 能对回报表，名称要如实
  title_zh_hk: 要對得回報表，名稱要如實
  q1_en: Bridge 30 + 2 + 6 = 38
  q1_zh: 调节30 + 2 + 6 = 38
  q1_zh_hk: 調節30 + 2 + 6 = 38
  q2_en: Reported −11.8%; adjusted +5.6%
  q2_zh: 列报−11.8%；调整后+5.6%
  q2_zh_hk: 已呈報−11.8%；調整後+5.6%
  s1_en: >-
    An adjusted profit figure must lead readers back to the accounts, with its tax and outside-shareholder
    effects shown item by item.
  s1_zh: 调整后利润必须能让读者对回财务报表，所得税和外部股东的影响要逐项列明。
  s1_zh_hk: 調整後溢利一定要令讀者對得返財務報表，稅項同外部股東嘅影響要逐項列明。
  s2_en: >-
    Recurring costs are not automatically barred from an adjustment, but the label must not suggest they
    will never happen again. This is not reporting or tax advice.
  s2_zh: 反复发生的成本不是一概不能调整，但名称不能暗示它们不会再发生。本案不构成财务报告或税务建议。
  s2_zh_hk: 反覆出現嘅成本唔係一律唔可以調整，但名稱唔可以暗示佢哋唔會再出現。本案唔構成財務報告或稅務意見。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
duration_target_s: 198
