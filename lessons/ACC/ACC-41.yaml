  step1_en: >-
    2026: 34m; costs 0.5m + 1.5m
  step1_zh: 2026年：34百万；成本0.5 + 1.5
  step1_zh_hk: 2026年：34百萬；成本0.5 + 1.5
  step2_en: Same tax and ownership; data complete
  step2_zh: 税务和持股不变；数据完整
  step2_zh_hk: 稅務及持股不變；資料齊全
  step3_en: >-
    Proposal: call them 'one-off'
  step3_zh: 建议称为“一次性成本”
  step3_zh_hk: 建議稱為「一次性成本」
  s1_en: >-
    Ivy finds the 2026 records. On the same HKFRS 18 basis, group operating profit was 34 million. It
    included comparable depot restructuring costs: 0.5 million at the parent and 1.5 million at the same
    subsidiary.
  s1_zh: Ivy 调出二零二六年的记录。按同一口径，集团经营利润是三千四百万，里面包括同类的配送站重组成本：母公司五十万，同一家子公司一百五十万。
  s1_zh_hk: Ivy 搵到二零二六年嘅紀錄。按同一個基準，集團經營溢利係三千四百萬，入面包括同類嘅配送站重組成本：母公司五十萬，同一間附屬公司一百五十萬。
  s2_en: >-
    The tax treatment and ownership shares were identical, and the comparative data are complete and can
    be checked.
  s2_zh: 税务处理和持股比例都一样，可比数据完整，也可以核实。
  s2_zh_hk: 稅務處理同持股比例都一樣，比較資料齊全，亦都可以核實。
  s3_en: >-
    The communications lead proposes calling the exclusions 'one-off costs' and publishing just the percentage
    increase in adjusted profit.
  s3_zh: 负责对外沟通的主管建议，把剔除的费用叫作“一次性成本”，而且只公布调整后利润的增幅。
  s3_zh_hk: 企業傳訊主管建議，將剔除咗嘅開支叫做「一次性成本」，淨係公布調整後溢利嘅升幅。
