  title_en: Adjusted profit. Can readers get back to the accounts?
  title_zh: 调整后利润，如何与财务报表对上？
  title_zh_hk: 調整後溢利，能對回財務報表嗎？
  image: art/adjusted-profit-back-to-accounts-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The accounts show 30 million Hong Kong dollars of operating profit. The draft investor slides call
    38 million 'underlying operating profit'. Would you clear that for publication? You are Ivy, preparing
    the slides for a fictional Hong Kong-listed parcel group in its first full year under HKFRS 18.
  zh: >-
    财务报表上的经营利润是三千万港元，投资者演示稿却写着三千八百万港元的“基础经营利润”。你会批准公开发布吗？你是 Ivy，正为一家虚构的香港上市快递集团准备演示材料。今年是集团首个全年采用 HKFRS
    18 的年度。
  zh_hk: >-
    財務報表列示嘅經營溢利係三千萬港元，投資者簡報初稿就寫住三千八百萬港元嘅「基礎經營溢利」。你會唔會批准公開刊出？你係 Ivy，幫一間虛構嘅香港上市包裹配送集團準備簡報，今年係集團首個全年採用 HKFRS
    18 嘅年度。
