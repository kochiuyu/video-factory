  s1_en: >-
    Both lenders require interest cover of at least 3.0. Each can demand its principal immediately if
    its own covenant is breached, and the loans do not trigger each other.
  s1_zh: 两家贷款方都要求利息保障倍数不低于三点零。哪笔贷款违反自己的契约条款，那家贷款方就可以要求立即偿还本金，两笔贷款互不触发。
  s1_zh_hk: 兩個貸款人都要求利息保障倍數最少三點零。邊筆貸款違反自己嘅契約條款，嗰個貸款人就可以要求即時還本金，兩筆貸款唔會互相觸發。
  s2_en: >-
    A's test date was 30 November. Its lender checks only in January, but the evidence confirms A's ratio
    was 2.9, so the lender could demand repayment from that date.
  s2_zh: A 的考核日是十一月三十日。贷款方到一月才检查，但证据确认 A 当时的倍数只有二点九，所以从那天起贷款方已经有权要求还款。
  s2_zh_hk: A 嘅遵約日係十一月三十日。貸款人一月先核查，但證據證實 A 當時嘅倍數得二點九，所以由嗰日起貸款人已經有權要求還款。
  s3_en: >-
    B is first tested on June 2026 figures; on year-end figures it would also be 2.9. On 20 January, A's
    lender signs a binding grace period to 31 March 2027.
  s3_zh: >-
    B 第一次考核用二零二六年六月的数据；如果用年末数据试算，也是二点九。一月二十日，A 的贷款方签署了有约束力的宽限期，到二零二七年三月三十一日为止。
  s3_zh_hk: >-
    B 第一次測試用二零二六年六月嘅數據；如果用年結數字試算，都係二點九。一月二十日，A 嘅貸款人簽咗具約束力嘅寬限安排，直至二零二七年三月三十一日。
