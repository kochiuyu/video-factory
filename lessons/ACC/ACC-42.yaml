  s1_en: >-
    Replay the decision. In this alternative history, A's signed grace period was binding on 29 December
    2025, not first granted in January.
  s1_zh: 现在换一个情境：A 的宽限安排不是一月才批下来，而是二零二五年十二月二十九日已经签署并生效。
  s1_zh_hk: 而家換個情境：A 嘅寬限安排唔係一月先批出，而係二零二五年十二月二十九日已經簽署、具約束力。
  s2_en: Its scope and the 31 March 2027 end date are unchanged.
  s2_zh: 适用范围不变，仍然在二零二七年三月三十一日结束。
  s2_zh_hk: 寬限範圍不變，仍然喺二零二七年三月三十一日屆滿。
  s3_en: >-
    A still failed the November test, and the figures, B's agreement and the authorisation date stay the
    same.
  s3_zh: A 仍然没通过十一月的考核；数字、B 的合同和批准报出日也都不变。
  s3_zh_hk: A 依然冇通過十一月測試；數字、B 嘅合約同批准日期都不變。
