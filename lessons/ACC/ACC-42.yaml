- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-42
  kicker_en: ACC-42
  kicker_zh: ACC-42
  kicker_zh_hk: ACC-42
  title_en: The lender granted more time. When did the right change?
  title_zh: 贷款方给了宽限期，延期偿还权何时发生变化？
  title_zh_hk: 貸款人給了寬限期。延期還款權何時改變？
  image: art/when-did-the-lender-grant-time-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Two equipment loans are not due until 2029, so the draft balance sheet calls both non-current. But
    one lender could already demand its money at year-end. You are Mei, the controller of a fictional
    Hong Kong packaging supplier, reviewing the loans before the accounts are authorised on 20 February
    2026.
  zh: >-
    两笔设备贷款要到二零二九年才到期，所以资产负债表草稿把它们都列为非流动。可是，其中一家贷款方在年末已经有权要求还款。你是 Mei，一家虚构的香港包装用品供应商的财务主管，要在二零二六年二月二十日报表获准报出前复核这两笔贷款。
  zh_hk: >-
    兩筆設備貸款要到二零二九年先到期，所以草擬嘅資產負債表將佢哋都列為非流動。但係，其中一個貸款人喺年結時已經有權要求還款。你係 Mei，一間虛構香港包裝用品供應商嘅財務主管，要喺二零二六年二月二十日報表獲批准之前覆核呢兩筆貸款。
