title_en: The clinic paid for setup. What does it own?
title_zh: 诊所付了配置费，取得了什么？
title_zh_hk: 診所付了設定費，究竟取得了甚麼？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-43
  kicker_en: ACC-43
  kicker_zh: ACC-43
  kicker_zh_hk: ACC-43
  title_en: The clinic paid for setup. What does it own?
  title_zh: 诊所付了配置费，取得了什么？
  title_zh_hk: 診所付了設定費，究竟取得了甚麼？
  image: art/configured-but-not-owned-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 1 January a Hong Kong clinic group pays a cloud vendor 96,000 Hong Kong dollars for a configured
    scheduling app. The bookkeeper wants to capitalise the whole payment as software. But what does the
    clinic actually control? Close the books on 30 June.
  zh: >-
    一月一日，香港一家诊所集团向云服务商付了九万六千港元，用来使用一款配置好的排程应用。记账人员想把整笔付款作为软件资本化。可是，诊所实际控制了什么？请在六月三十日结账。
  zh_hk: >-
    一月一日，香港一間診所集團俾咗九萬六千港元雲端供應商，用一個設定好嘅預約排程應用程式。簿記員想將成筆付款資本化做軟件。但係，診所實際上控制咗乜嘢？請喺六月三十日結賬。
