  kicker: ACC-44
  kicker_en: ACC-44
  kicker_zh: ACC-44
  kicker_zh_hk: ACC-44
  title_en: >-
    The subsidiary earned a profit. Why did its net assets rise less in HKD?
  title_zh: 子公司赚了钱，为什么折成港元后净资产增幅较小？
  title_zh_hk: 附屬公司有溢利，為何換算成港元後淨資產升得較少？
  image: art/the-subsidiary-earned-where-did-equity-go-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A Singapore subsidiary earns a profit, and its local net assets rise. Yet in Hong Kong dollars, its
    net assets rise by less than its translated profit. A manager wants to put the shortfall through group
    operating profit. You prepare the Hong Kong parent's consolidated accounts.
  zh: >-
    新加坡子公司赚了钱，当地货币的净资产也增加了。可是折成港元后，净资产的增幅却小于折算后的利润。有经理想把这个差额计入集团经营利润。你负责编制香港母公司的合并财务报表。
  zh_hk: >-
    新加坡附屬公司賺到錢，當地貨幣嘅淨資產都增加咗。但係換算成港元之後，淨資產升幅竟然少過換算後嘅溢利。有經理想將差額計入集團經營溢利。你負責編製香港母公司嘅綜合財務報表。
