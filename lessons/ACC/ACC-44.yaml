  step1_en: SGD100,000 service invoice at 5.60
  step1_zh: 按5.60入账100,000新加坡元发票
  step1_zh_hk: 按5.60入賬100,000新加坡元發票
  step2_en: Still unpaid at 5.20
  step2_zh: 期末5.20时仍未支付
  step2_zh_hk: 年結5.20時仍未支付
  step3_en: No hedge; no tax effect
  step3_zh: 无套期；无所得税影响
  step3_zh_hk: 沒有對沖；沒有稅項影響
  s1_en: >-
    Now add a transaction in the Hong Kong parent, not the subsidiary. When the rate was 5.60, the parent
    received an outside vendor's services and recorded a 100,000 Singapore dollar invoice.
  s1_zh: 再加一笔发生在香港母公司、而不是子公司的交易。汇率五点六零那天，母公司接受外部供应商的服务，按十万新加坡元的发票入账。
  s1_zh_hk: 再加一宗發生喺香港母公司、唔係附屬公司嘅交易。匯率五點六零嗰日，母公司收到外部供應商嘅服務，按十萬新加坡元嘅發票入賬。
  s2_en: The full amount is still payable at year-end, when the rate is 5.20.
  s2_zh: 到期末汇率五点二零时，发票金额仍然全数未付。
  s2_zh_hk: 到年結匯率五點二零嗰陣，發票金額仍然全數未付。
  s3_en: There is no hedge and no tax effect.
  s3_zh: 这里不涉及套期，也没有所得税影响。
  s3_zh_hk: 呢度唔涉及對沖，亦冇稅項影響。
