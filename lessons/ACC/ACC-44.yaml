title_en: >-
  The subsidiary earned a profit. Why did its net assets rise less in HKD?
title_zh: 子公司赚了钱，为什么折成港元后净资产增幅较小？
title_zh_hk: 附屬公司有溢利，為何換算成港元後淨資產升得較少？
