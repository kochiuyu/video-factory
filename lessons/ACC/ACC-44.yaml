  s1_en: >-
    The parent owns 100 percent of the subsidiary. The subsidiary's functional currency is the Singapore
    dollar; the parent's functional currency and the group's presentation currency are the Hong Kong dollar.
  s1_zh: 母公司持有子公司百分之百股权。子公司的记账本位币是新加坡元；母公司的记账本位币和集团的列报货币都是港元。
  s1_zh_hk: 母公司持有附屬公司百分之百股權。附屬公司嘅功能貨幣係新加坡元；母公司嘅功能貨幣同集團嘅列報貨幣都係港元。
  s2_en: >-
    Net assets start at 1.0 million Singapore dollars, profit is 0.2 million, and they end at 1.2 million.
    No dividends, capital changes, goodwill or other adjustments are involved.
  s2_zh: 子公司期初净资产一百万新加坡元，本年利润二十万，期末一百二十万。不涉及股利、资本变动、商誉或其他调整。
  s2_zh_hk: 附屬公司期初淨資產一百萬新加坡元，本年溢利二十萬，年結一百二十萬。唔涉及股息、資本變動、商譽或者其他調整。
  s3_en: >-
    Rates are Hong Kong dollars for one Singapore dollar: 5.80 at the previous year-end, 5.60 on the date
    of the income and expense transactions, and 5.20 at this year-end.
  s3_zh: 汇率都是一新加坡元折合多少港元：上年期末五点八零，收入和费用交易日五点六零，本年期末五点二零。
  s3_zh_hk: 匯率都係每一新加坡元兌幾多港元：上年年結五點八零，收入同開支嘅交易日五點六零，本年年結五點二零。
