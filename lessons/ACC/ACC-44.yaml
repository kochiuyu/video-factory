  en: >-
    What Hong Kong dollar profit, and what opening and closing net assets, come from the subsidiary? What
    is the residual, and where should it be reported? Pause and vote.
  zh: 子公司的利润、期初和期末净资产各折合多少港元？剩下的差额是多少，应该列在哪里？请暂停，投个票。
  zh_hk: 附屬公司嘅溢利、期初同期末淨資產，各自折合幾多港元？剩低嘅差額係幾多，應該喺邊度列報？暫停，投個票。
