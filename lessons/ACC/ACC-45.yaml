  s1_en: >-
    Last year 100 million ordinary shares were outstanding throughout. This year began with 100 million,
    and 40 million new shares were issued on 1 July. Treat the two halves as equally long.
  s1_zh: 上年全年发行在外的普通股是一亿股。本年年初也是一亿股，七月一日增发四千万股。上下半年当作一样长。
  s1_zh_hk: 上年全年都有一億股普通股喺外流通。本年年初都係一億股，七月一日新發行四千萬股。上下半年當佢一樣長。
  s2_en: >-
    A convertible note was outstanding all year but not converted. Converting at the start would add 10
    million shares and avoid 3 million of after-tax interest.
  s2_zh: 一项可转换票据全年存续，但没有实际转股。如果假定年初转股，会增加一千万股，同时节省三百万港元税后利息。
  s2_zh_hk: 有一項可換股票據全年流通，但實際冇換股。假設年初換股，會多一千萬股，同時慳返三百萬港元除稅後利息。
  s3_en: >-
    All profit is from continuing operations. There were no buybacks, bonus issues or preference shares,
    and no potential ordinary shares last year.
  s3_zh: 全部利润来自持续经营业务。没有股份回购、送股或优先股，上年也没有潜在普通股。
  s3_zh_hk: 全部溢利都來自持續經營業務。冇股份回購、紅股或者優先股，上年亦冇潛在普通股。
