  en: >-
    Should assumed conversion still be included in diluted earnings per share? How much after-tax interest
    saving would make conversion exactly neutral? Pause and vote.
  zh: 计算稀释每股收益时，还应该纳入假定转股吗？税后利息节省多少，转股才刚好不影响每股收益？请暂停，投个票。
