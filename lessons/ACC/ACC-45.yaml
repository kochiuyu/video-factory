  title_zh: 基本每股收益上升了吗？
  title_zh_hk: 每股基本盈利有上升嗎？
  en: >-
    What basic and diluted earnings per share should the distributor report? Is the claim that basic earnings
    per share rose supported? Pause and vote.
  zh: 经销商应该列报多少基本每股收益和稀释每股收益？“基本每股收益上升”这个说法站得住吗？请暂停，投个票。
  zh_hk: 分銷商應該列報幾多每股基本盈利同每股攤薄盈利？「每股基本盈利上升」呢個講法有冇數據支持？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
