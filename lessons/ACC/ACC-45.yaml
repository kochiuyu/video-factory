- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Weight the shares, then dilute
  title_zh: 先加权股数，再算稀释
  title_zh_hk: 先加權股數，再計攤薄
  step1_en: 100 × ½ + 140 × ½ = 120m shares
  step1_zh: 100 × ½ + 140 × ½ = 120百万股
  step1_zh_hk: 100 × ½ + 140 × ½ = 120百萬股
  step2_en: Basic 60 ÷ 120 = HK$0.50 (was 0.58)
  step2_zh: 基本60 ÷ 120 = 0.50（上年0.58）
  step2_zh_hk: 基本60 ÷ 120 = 0.50（上年0.58）
  step3_en: Diluted 63 ÷ 130 ≈ HK$0.4846
  step3_zh: 稀释63 ÷ 130 ≈ 0.4846
  step3_zh_hk: 攤薄63 ÷ 130 ≈ 0.4846
  s1_en: >-
    Basic earnings per share uses the time-weighted shares: 100 million times one half plus 140 million
    times one half, or 120 million. The year-end 140 million alone is not the annual denominator.
  s1_zh: 基本每股收益要用时间加权的股数：一亿乘二分之一，加一亿四千万乘二分之一，等于一亿二千万股。不能直接拿期末的一亿四千万股当全年分母。
  s1_zh_hk: 每股基本盈利要用按時間加權嘅股數：一億乘二分之一，加一億四千萬乘二分之一，即係一億二千萬股。唔可以直接用年結嗰一億四千萬股做全年分母。
  s2_en: >-
    Basic earnings per share is 60 million divided by 120 million, or 50 cents, down from 58 cents. Profit
    rose while basic earnings per share fell, so the draft claim is not supported.
  s2_zh: 基本每股收益是六千万除以一亿二千万，即零点五港元，比上年的零点五八港元低。利润增加了，基本每股收益却下降，所以草稿的说法站不住。
  s2_zh_hk: 每股基本盈利係六千萬除一億二千萬，即係零點五港元，低過上年嘅零點五八港元。溢利升咗，每股基本盈利反而跌咗，所以稿件嘅講法冇數據支持。
  s3_en: >-
    With assumed conversion, earnings would be 63 million over 130 million shares, about 0.4846, below
    0.50. So include the note: diluted earnings per share is about 0.4846. It is not what noteholders
    actually earned or received.
  s3_zh: >-
    假定转股后，分子是六千三百万，分母是一亿三千万股，约零点四八四六，低于零点五，所以要纳入票据，稀释每股收益约零点四八四六。这不是票据持有人实际获得的收益或分配。
  s3_zh_hk: >-
    假設換股之後，盈利係六千三百萬，分母係一億三千萬股，大約零點四八四六，低過零點五，所以要計入票據，每股攤薄盈利大約零點四八四六。呢個唔係票據持有人實際賺到或者收到嘅數。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Test before including the note
  title_zh: 先检验，再决定是否纳入
  title_zh_hk: 先測試，再決定是否計入
  step1_en: >-
    66 ÷ 130 ≈ 0.5077: anti-dilutive
  step1_zh: 66 ÷ 130 ≈ 0.5077：反稀释
  step1_zh_hk: 66 ÷ 130 ≈ 0.5077：反攤薄
  step2_en: Diluted = basic = HK$0.50
  step2_zh: 稀释 = 基本 = 0.50
  step2_zh_hk: 攤薄 = 基本 = 0.50
  step3_en: (60 + x) ÷ 130 = 0.50 → x = 5
  step3_zh: (60 + x) ÷ 130 = 0.50 → x = 5
  step3_zh_hk: (60 + x) ÷ 130 = 0.50 → x = 5
  s1_en: >-
    With the corrected 6 million saving, the hypothetical result is 66 million over 130 million, about
    0.5077. Including the note would raise earnings per share, so it is anti-dilutive and excluded.
  s1_zh: 节省额改为六百万后，假定转股的结果是六千六百万除以一亿三千万，约零点五零七七。纳入票据反而提高每股收益，属于反稀释，应予排除。
  s1_zh_hk: 利息節省額改為六百萬之後，假設換股嘅結果係六千六百萬除一億三千萬，大約零點五零七七。計入票據反而令每股盈利上升，屬於反攤薄，要剔除。
  s2_en: >-
    With no other instrument, diluted earnings per share equals basic, 50 cents.
  s2_zh: 没有其他工具，稀释每股收益就等于基本每股收益，零点五港元。
  s2_zh_hk: 冇其他工具，每股攤薄盈利就等於每股基本盈利，零點五港元。
  s3_en: >-
    Let x be the after-tax interest avoided, in millions. 60 plus x, divided by 130, equals 0.50 when
    x is 5. Conversion reduces earnings per share only when x is below 5. Reattributing interest did not
    change actual profit.
  s3_zh: >-
    设 x 为节省的税后利息，单位百万港元。六十加 x 再除以一百三十，等于零点五时，x 是五。只有 x 低于五，假定转股才会降低每股收益。重新归属利息并没有改变实际利润。
  s3_zh_hk: >-
    設 x 係慳返嘅除稅後利息，單位係百萬港元。六十加 x 再除一百三十，等於零點五嘅時候，x 係五。只有 x 低過五，假設換股先會降低每股盈利。重新歸類利息，冇改變實際溢利。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Both figures, one rule
  title_zh: 两个数字，同一套口径
  title_zh_hk: 兩個數字，同一套規則
  en: >-
    Report both basic and diluted earnings per share, and apply the time-weighting rule consistently.
    A higher profit does not guarantee a higher earnings per share when the share count grows. The exercise
    uses one convertible and one continuing business, and is not valuation or accounting advice.
  zh: >-
    基本每股收益和稀释每股收益都要列报，时间加权的口径要前后一致。股数增加时，利润增加不代表每股收益一定提高。本练习只设一项可转换工具和一项持续经营业务，不构成估值或会计建议。
  zh_hk: >-
    每股基本盈利同每股攤薄盈利都要列報，按時間加權嘅規則要前後一致。股數增加嘅時候，溢利上升唔代表每股盈利一定上升。本練習只涉及一項可換股工具同一項持續經營業務，唔構成估值或會計意見。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Weight shares; test dilution
  title_zh: 股数要加权，稀释要检验
  title_zh_hk: 股數要加權，攤薄要測試
  q1_en: Basic HK$0.50, down from 0.58
  q1_zh: 基本0.50，低于上年0.58
  q1_zh_hk: 基本0.50，低於上年0.58
  q2_en: >-
    Corrected note: anti-dilutive, excluded
  q2_zh: 更正后票据：反稀释，排除
  q2_zh_hk: 修正後票據：反攤薄，剔除
  s1_en: >-
    Basic earnings per share divides profit by the weighted shares actually outstanding, not the year-end
    count.
  s1_zh: 基本每股收益用利润除以实际发行在外股数的加权平均数，而不是期末股数。
  s1_zh_hk: 每股基本盈利係用溢利除實際喺外流通股份嘅加權平均數，唔係年結股數。
  s2_en: >-
    A potential share is included in diluted earnings per share only if it reduces it. Test the numerator
    and denominator together.
  s2_zh: 潜在普通股只有在会降低每股收益时，才纳入稀释每股收益。分子和分母要一起检验。
  s2_zh_hk: 潛在普通股只係會降低每股盈利嘅時候，先計入每股攤薄盈利。分子同分母要一齊測試。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
