  title_en: Profit rose. Did each share earn more?
  title_zh: 利润增加了，每股收益也提高了吗？
  title_zh_hk: 溢利增加，每股盈利也有上升嗎？
  image: art/profit-rose-did-each-share-earn-more-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Profit attributable to ordinary holders rose from 58 to 60 million Hong Kong dollars. The communications
    draft says earnings per share rose too. Is that supported? You review the annual results of a fictional
    Hong Kong-listed equipment distributor.
  zh: >-
    归属于普通股股东的利润从五千八百万港元增加到六千万港元。对外披露草稿说，每股收益也提高了。数据支持这个说法吗？你负责复核一家虚构的香港上市设备经销商的年度业绩。
  zh_hk: 普通股股東應佔溢利由五千八百萬港元升到六千萬港元。對外稿件話每股盈利都有上升。有冇數據支持？你負責覆核一間虛構香港上市設備分銷商嘅全年業績。
