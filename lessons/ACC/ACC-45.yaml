  kicker_zh_hk: 第二輪
  title_en: >-
    Review: more note interest
  title_zh: 工作底稿复核改变了利息
  title_zh_hk: 覆核工作表後利息改變
  step1_en: >-
    Note interest: HK$6m, not 3m
  step1_zh: 票据利息：6百万，而非3百万
  step1_zh_hk: 票據利息：6百萬，而非3百萬
  step2_en: Same total profit and shares
  step2_zh: 利润总额和股数不变
  step2_zh_hk: 溢利總額及股數不變
  step3_en: Same conversion terms
  step3_zh: 转股条款不变
  step3_zh_hk: 換股條款不變
  s1_en: >-
    Before the results are final, an independent worksheet review finds that 6 million of the after-tax
    interest already recorded relates to the convertible, not 3 million. Some interest had been attributed
    to another loan.
  s1_zh: 业绩定稿前，独立复核工作底稿发现：已经入账的税后利息里，属于可转换票据的是六百万港元，不是三百万。有部分利息原先错归到另一笔贷款。
  s1_zh_hk: 業績定稿之前，獨立覆核工作表發現：已經入賬嘅除稅後利息入面，屬於可換股票據嘅係六百萬港元，唔係三百萬。有部分利息之前歸咗落另一筆貸款度。
  s2_en: Total recognised profit and the actual shares do not change.
  s2_zh: 已确认的利润总额和实际股数都没有变化。
  s2_zh_hk: 已確認嘅溢利總額同實際股數都冇變。
  s3_en: The note's conversion terms stay the same as well.
  s3_zh: 票据的转股条款也保持不变。
  s3_zh_hk: 票據嘅換股條款亦都唔變。
