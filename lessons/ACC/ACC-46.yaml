  title_en: >-
    Revised file: bought on 1 July
  title_zh: 更正：7月1日才取得
  title_zh_hk: 修訂：7月1日才收購
  step1_en: >-
    Before purchase: 250,000
  step1_zh: 取得前利润：250,000
  step1_zh_hk: 收購前溢利：250,000
  step2_en: >-
    After purchase: 350,000
  step2_zh: 取得后利润：350,000
  step2_zh_hk: 收購後溢利：350,000
  step3_en: Dividend 200,000 paid after July
