  en: >-
    A Hong Kong-listed control-systems group pays 1.8 million Hong Kong dollars for 18 percent of a fictional
    Foshan assembly company. Below 20 percent, is it just an ordinary investment, or an associate? You
    review it in the investor's consolidated accounts.
  zh: >-
    一家香港上市控制系统集团花一百八十万港元，买入一家虚构佛山装配企业百分之十八的股权。持股不到百分之二十，它只是普通投资，还是联营企业？请在投资方的合并财务报表里作出判断。
  zh_hk: >-
    一間香港上市控制系統集團用一百八十萬港元，買入一間虛構佛山裝配企業百分之十八嘅股權。持股唔夠百分之二十，佢只係一般投資，定係聯營公司？請喺投資方嘅綜合財務報表層面判斷。
