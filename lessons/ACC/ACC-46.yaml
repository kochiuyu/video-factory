  s1_en: >-
    On 1 January the group pays 1.8 million for 18 percent of both the ordinary equity and the votes.
    It can appoint a voting director who takes a real part in the budget, operating plan and distribution
    policy.
  s1_zh: >-
    一月一日，集团付一百八十万，取得百分之十八的普通股权和百分之十八的表决权。它可以委派一名有表决权的董事，实质参与年度预算、经营计划和分配政策。
  s1_zh_hk: 一月一日，集團俾一百八十萬，取得百分之十八普通股股權同百分之十八表決權。佢可以委任一名有表決權嘅董事，實質參與年度預算、營運計劃同分派政策。
  s2_en: >-
    An unrelated shareholder controls the investee. The investor cannot direct policy on its own, and
    nothing requires its joint consent.
  s2_zh: 被投资方由一名非关联股东控制。投资方不能单独主导政策，也没有任何安排必须取得它的共同同意。
  s2_zh_hk: 被投資方由一名無關連股東控制。投資方唔可以自己決定政策，亦冇任何安排規定要佢共同同意。
  s3_en: >-
    The investee earns 600,000 after tax and pays a 200,000 year-end cash dividend, pro rata. Ignore tax,
    impairment and fair-value adjustments.
  s3_zh: 被投资方全年税后利润六十万，年末按比例派发二十万现金股利。不考虑税费、减值和公允价值调整。
  s3_zh_hk: 被投資方全年除稅後溢利六十萬，年結按比例派二十萬現金股息。唔考慮稅項、減值同公平值調整。
