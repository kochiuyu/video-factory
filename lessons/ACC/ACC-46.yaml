  zh: 你会把这百分之十八的持股列为联营企业投资吗？投资方应该列报多少应占利润、收到多少现金股利、期末投资余额是多少？请暂停，投个票。
  zh_hk: 你會唔會將呢百分之十八持股列為聯營公司投資？投資方應該列報幾多應佔溢利、收到幾多現金股息、期末投資結餘係幾多？暫停，投個票。
