- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Influence is the policy right
  title_zh: 重大影响取决于政策参与权
  title_zh_hk: 重大影響取決於參與政策
  step1_en: Presumption below 20% is rebutted
  step1_zh: 低于20%的推定被推翻
  step1_zh_hk: 低於20%的推定被推翻
  step2_en: Share of profit 18% × 600,000 = 108,000
  step2_zh: 应占利润18% × 600,000 = 108,000
  step2_zh_hk: 應佔溢利18% × 600,000 = 108,000
  step3_en: Dividend 36,000 reduces the investment
  step3_zh: 股利36,000冲减投资余额
  step3_zh_hk: 股息36,000扣減投資結餘
  s1_en: >-
    Below 20 percent of votes there is a presumption against significant influence, not a ban. The voting
    board seat and real participation in budget, operating and distribution policy rebut it. There is
    no control or joint control, so use the equity method.
  s1_zh: >-
    表决权低于百分之二十，只是推定没有重大影响，不是禁止。有表决权的董事席位，加上实质参与预算、经营和分配政策，就能推翻这个推定。没有控制或共同控制，所以用权益法。
  s1_zh_hk: >-
    表決權低過百分之二十，只係推定冇重大影響，唔係禁止。有表決權嘅董事席位，加埋實質參與預算、營運同分派政策，足以推翻呢個推定。既冇控制，亦冇共同控制，所以用權益法。
  s2_en: >-
    Include 18 percent of 600,000, or 108,000, in profit or loss. The dividend brings cash of 18 percent
    of 200,000, or 36,000.
  s2_zh: 按百分之十八乘六十万，确认投资收益十万八千，计入损益。收到的股利是百分之十八乘二十万，即三万六千。
  s2_zh_hk: 按百分之十八乘六十萬，確認十萬八千計入損益。股息帶嚟嘅現金係百分之十八乘二十萬，即係三萬六千。
  s3_en: >-
    Under the equity method that dividend reduces the investment balance; it is not a second line of income.
    The closing balance is 1,800,000 plus 108,000 minus 36,000, or 1,872,000.
  s3_zh: 在权益法下，这笔股利冲减投资账面价值，不能再确认一次收益。期末余额是一百八十万加十万八千减三万六千，等于一百八十七万二千。
  s3_zh_hk: 按權益法，呢筆股息要扣減投資結餘，唔可以再列一筆收益。期末結餘係一百八十萬加十萬八千減三萬六千，即係一百八十七萬二千。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Start when influence begins
  title_zh: 从取得重大影响之日算起
  title_zh_hk: 從取得重大影響之日起計
  step1_en: 18% × 350,000 = 63,000
  step1_zh: 18% × 350,000 = 63,000
  step1_zh_hk: 18% × 350,000 = 63,000
  step2_en: Cash 36,000; closing 1,827,000
  step2_zh: 现金36,000；期末余额1,827,000
  step2_zh_hk: 現金36,000；期末結餘1,827,000
  step3_en: No share of pre-influence profit
  step3_zh: 不确认影响开始前的利润份额
  step3_zh_hk: 不確認影響力開始前的溢利份額
  s1_en: >-
    For the July acquisition, use the documented post-acquisition profit of 350,000, not half of 600,000.
    The equity-method profit is 18 percent of 350,000, or 63,000.
  s1_zh: 如果七月才取得投资，要用有记录支持的取得后利润三十五万，不是全年六十万的一半。权益法投资收益是百分之十八乘三十五万，即六万三千。
  s1_zh_hk: 如果七月先收購，就要用有資料佐證嘅收購後溢利三十五萬，唔係全年六十萬嘅一半。按權益法確認嘅溢利係百分之十八乘三十五萬，即係六萬三千。
  s2_en: >-
    Cash received is still 36,000, and the closing balance is 1,827,000. Share of profit and the investment
    balance need not move by the same amount.
  s2_zh: 收到的股利仍然是三万六千，期末余额是一百八十二万七千。应占利润和投资账面价值的变动不一定相等。
  s2_zh_hk: 收到嘅現金仍然係三萬六千，期末結餘係一百八十二萬七千。應佔溢利同投資賬面值嘅變動唔一定相同。
  s3_en: >-
    Recognising a share of the profit earned before influence began would overstate the investor's current-year
    result.
  s3_zh: 如果把取得投资前的利润份额也计进去，就会高估投资方本年的业绩。
  s3_zh_hk: 如果將收購前溢利嘅份額都計埋，就會高估投資方本年嘅業績。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A title alone is not influence
  title_zh: 单凭董事头衔不足以判断
  title_zh_hk: 單憑董事職銜不足以判斷
  en: >-
    The director's title alone should not settle the influence test. If the investor had only an observer
    seat and no policy participation, what evidence would you need? No alternative measurement is assumed,
    and this is the investor's consolidated accounts, not its separate accounts.
  zh: >-
    单凭董事头衔不能判断是否有重大影响。如果投资方只有观察员席位，也不参与政策决定，还需要什么证据？本案不假设其他计量方法，讨论的是投资方的合并财务报表，不是单独财务报表。
  zh_hk: >-
    單憑董事職銜唔可以判定有冇重大影響。如果投資方只得觀察員席位，又唔參與制定政策，仲要搵乜嘢證據？本案唔設其他計量方法，講嘅係投資方嘅綜合財務報表，唔係獨立財務報表。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Policy rights, then equity
  title_zh: 看政策参与权，再用权益法
  title_zh_hk: 看參與政策，再用權益法
  q1_en: >-
    January: 108,000 profit; 1,872,000
  q1_zh: 1月取得：收益108,000；余额1,872,000
  q1_zh_hk: 1月收購：溢利108,000；結餘1,872,000
  q2_en: >-
    July: 63,000 profit; 1,827,000
  q2_zh: 7月取得：收益63,000；余额1,827,000
  q2_zh_hk: 7月收購：溢利63,000；結餘1,827,000
  s1_en: >-
    A holding below 20 percent can still be an associate when the investor participates in policy decisions.
    A dividend reduces the investment; it is not extra income.
  s1_zh: 持股低于百分之二十，如果能参与政策决策，仍然可能是联营企业。股利冲减投资余额，不是额外收益。
  s1_zh_hk: 持股低過百分之二十，如果參與到政策決定，仍然可以係聯營公司。股息扣減投資結餘，唔係額外收益。
  s2_en: >-
    Equity accounting starts when significant influence begins, using profit earned after that date.
  s2_zh: 权益法从取得重大影响之日开始，只计这之后实现的利润。
  s2_zh_hk: 權益法由取得重大影響嗰日開始，只計之後賺到嘅溢利。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
