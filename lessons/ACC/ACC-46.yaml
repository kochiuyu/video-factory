  step3_zh_hk: 200,000股息在7月後支付
  s1_en: >-
    In a revised file, the same purchase and rights actually began on 1 July, not 1 January. The investee
    still earned 600,000 for the whole year, 250,000 of it before the acquisition.
  s1_zh: 更正后的文件显示，同一笔投资和相关权利其实从七月一日才开始，不是一月一日。被投资方全年利润仍然是六十万，其中二十五万在取得投资之前。
  s1_zh_hk: 修訂資料顯示，同一宗收購同實質權利，其實由七月一日先生效，唔係一月一日。被投資方全年溢利仍然係六十萬，其中二十五萬喺收購之前賺到。
  s2_en: >-
    The other 350,000 was earned after the acquisition, according to the reviewed split.
  s2_zh: 按复核后的分期金额，其余三十五万是在取得投资之后实现的。
  s2_zh_hk: 按覆核後嘅分期金額，其餘三十五萬係收購之後先賺到。
  s3_en: >-
    The 200,000 dividend was declared and paid after the July purchase, shared pro rata by all ordinary
    shareholders, including this investor.
  s3_zh: 那二十万股利全部在七月取得投资后宣告并支付，包括投资方在内的普通股股东按比例分配。
  s3_zh_hk: 嗰二十萬股息全數喺七月收購之後宣派同支付，包括投資方在內嘅普通股股東按比例分配。
