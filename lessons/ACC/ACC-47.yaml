  s1_en: >-
    A segment qualifies if it reaches 10 percent of combined segment revenue including internal sales,
    of combined segment assets, or of the larger of total profits and absolute total losses.
  s1_zh: >-
    分部只要达到以下任一项的百分之十就算达标：全部分部收入合计，包括内部销售；全部分部资产合计；或者盈利分部利润合计和亏损分部亏损绝对值两者中较大的那个。
  s1_zh_hk: >-
    分部只要達到以下任何一項嘅百分之十就達標：分部收入合計，包括內部銷售；分部資產合計；或者溢利分部溢利合計同虧損分部虧損絕對值，兩者之中較高嗰個。
  s2_en: >-
    Then the separately reported segments must cover at least 75 percent of consolidated external revenue.
    If not, management adds the largest remaining external contributor first.
  s2_zh: 然后看单独列报的分部，能不能覆盖合并对外收入的至少百分之七十五。不够的话，管理层先加入剩下分部中对外收入最多的那个。
  s2_zh_hk: 然後睇單獨披露嘅分部，係咪覆蓋到綜合外部收入最少百分之七十五。唔夠嘅話，管理層先加入餘下分部之中外部收入最高嗰個。
  s3_en: >-
    This is the group's first year in scope, with no prior-year reportable segments, and their economics
    differ, so no aggregation is justified.
  s3_zh: 这是集团第一年适用分部报告要求，上年没有报告分部。五项业务的经济特征不同，没有归并的依据。
  s3_zh_hk: 呢個係集團第一年受呢項規定規管，上年冇須報告分部。五項業務嘅經濟特徵唔同，冇理據合併。
