  s1_en: >-
    The decision maker's corrected inspection report shows a 5 million loss instead of a 1 million profit.
  s1_zh: 决策者拿到更正后的检验业务报告：原先盈利一百万港元，现在改为亏损五百万。
  s1_zh_hk: 決策人手上嘅檢查業務報告修正咗：原本溢利一百萬港元，而家變成虧損五百萬。
  s2_en: No other figures or business characteristics change.
  s2_zh: 其他数字和业务特征都不变。
  s2_zh_hk: 其他數字同業務特徵都唔變。
  s3_en: >-
    These are two drafts for the same year; no earlier disclosure is being withdrawn.
  s3_zh: 这是同一年的两份草稿，不涉及撤回以前的披露。
  s3_zh_hk: 呢個係同一年度嘅兩份草稿，冇撤回任何以往披露。
