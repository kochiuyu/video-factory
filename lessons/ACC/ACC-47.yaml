  en: >-
    Which units must be separate on this draft? Calculate the three thresholds, then check the external-revenue
    coverage. Pause and vote.
  zh: 按这份草稿，哪些业务必须单独列报？先算出三项门槛，再检查对外收入覆盖率。请暂停，投个票。
  zh_hk: 按呢份草稿，邊啲業務一定要單獨披露？先計三項門檻，再檢查外部收入覆蓋率。暫停，投個票。
