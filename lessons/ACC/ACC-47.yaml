  title_en: Which business needs its own line?
  title_zh: 哪些业务需要单独列报？
  title_zh_hk: 哪些業務須單獨披露？
  image: art/which-business-needs-its-own-line-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Marketing calls all five businesses 'Integrated Marine'. But the decision maker reviews each one separately,
    so all five are operating segments. Which of them need their own line in the segment note? You test
    the thresholds for a fictional Hong Kong marine-services group.
  zh: >-
    市场部门把五项业务统称为“综合海事服务”。可是决策者分别审阅每项业务的成果，所以五项都是经营分部。分部附注里，哪些必须单独列报？请为一家虚构的香港海事服务集团测试门槛。
  zh_hk: >-
    市場推廣部將五項業務統稱「綜合海事服務」。但係決策人逐項審閱佢哋嘅業績，所以五項都係經營分部。分部附註入面，邊啲要單獨披露？請為一間虛構香港海事服務集團測試門檻。
