  title_en: The branches agree. Do the records?
  title_zh: 各站做法一致，记录就一定一致吗？
  title_zh_hk: 各站的做法一致，賬目也對得上嗎？
  image: art/the-branches-agree-but-do-the-records-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Three depots sell replacement kits, and all three post year-end sales early under the same rule. Revenue
    counts only when the customer receives the kit. You are the group auditor of a fictional Hong Kong
    appliance repair group. The conclusion on the group is yours.
  zh: >-
    三个配送站都卖替换套件，而且都按同一规则在年末提前入账。按本案设定，客户收到套件才能确认收入。你是一家虚构的香港家电维修集团的集团审计师，集团审计的结论由你负责。
  zh_hk: >-
    三個配送站都賣替換套件，而且都按同一套規則喺年結提前入賬。本案以顧客實際收到套件為收入確認時點。你係一間虛構香港家電維修集團嘅集團核數師，集團審計嘅結論由你負責。
