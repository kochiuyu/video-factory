  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: How much, and what next?
  title_zh: 高估多少？下一步做什么？
  title_zh_hk: 高估多少？下一步做甚麼？
  en: >-
    How much identified overstatement affects consolidated revenue? Which corrections and follow-up work
    would you request before clearing the group audit? Pause and vote.
  zh: 已识别的合并收入高估有多少？集团审计结束前，你会要求做哪些更正和后续工作？请暂停，投个票。
  zh_hk: 已識別嘅綜合收入高估係幾多？集團審計結案之前，你會要求做邊啲更正同跟進工作？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Do not average shared errors
  title_zh: 不能把共同错报平均掉
  title_zh_hk: 共同出錯，不能用平均數掩蓋
  step1_en: 270,000 known; up to 450,000 > 400,000
  step1_zh: 已知270,000；最高450,000 > 400,000
  step1_zh_hk: 已知270,000；最多450,000 > 400,000
  step2_en: >-
    South: direct receipt evidence
  step2_zh: 南站：直接收货证据
  step2_zh_hk: 南站：直接收貨證據
  step3_en: >-
    Centre: trace journals, test process
  step3_zh: 集团：追查分录，测试流程
  step3_zh_hk: 集團：追查分錄，測試流程
  s1_en: >-
    In the first scenario, exposure is 270,000 known and up to 450,000 in total. The upper end exceeds
    planning performance materiality.
  s1_zh: 第一种情境下，已知高估二十七万，合计最高可能四十五万。上限超过计划时用的实际执行的重要性。
  s1_zh_hk: 第一個情境已知高估二十七萬，合計最多可以去到四十五萬。上限超出規劃採用嘅實際執行的重要性。
  s2_en: >-
    At South, request direct receipt evidence, or independently corroborated alternatives, around year
    end. Review the component work's scope, sample or complete population, dates, exceptions and conclusions.
  s2_zh: 在南站，要求提供年末前后的直接收货证据，或者经独立佐证的替代证据。复核组成部分工作的范围、样本或完整总体、日期、例外事项和结论。
  s2_zh_hk: 喺南站，要求取得年結前後嘅直接收貨證據，或者經獨立印證嘅替代證據。覆核組成部分工作嘅範圍、樣本或完整總體、日期、例外事項同結論。
  s3_en: >-
    Centrally, trace local journals into the group ledger and test the booking rule and consolidation.
    Look across all components for the same risk. If access stays limited, escalate the gap; do not decide
    the opinion from the range alone.
  s3_zh: >-
    在集团层面，把各站分录追查到集团总账，测试入账规则和合并流程，并在所有组成部分检查同一风险。如果取证仍受限，要上报证据缺口，不能只凭金额区间决定意见。
  s3_zh_hk: >-
    喺集團層面，將各站分錄追查到集團總賬，測試入賬規則同綜合入賬，並喺所有組成部分檢查同一風險。如果取證仍然受限，要向上反映證據缺口，唔可以單憑金額範圍決定意見。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: >-
    Identified: 520,000
  title_zh: 已识别高估：520,000
  title_zh_hk: 已識別高估：520,000
  step1_en: 430,000 + 90,000 = 520,000
  step1_zh: 430,000 + 90,000 = 520,000
  step1_zh_hk: 430,000 + 90,000 = 520,000
  step2_en: Correct it; assess other balances
  step2_zh: 更正；另评估其他余额
  step2_zh_hk: 更正；另評估其他結餘
  step3_en: Below 600,000; above 400,000
  step3_zh: 低于600,000；高于400,000
  step3_zh_hk: 低於600,000；高於400,000
  s1_en: >-
    The cutoff error is 140 plus 130 plus 160, or 430,000. Add the separate 90,000 group revenue elimination
    for 520,000 of consolidated revenue overstatement.
  s1_zh: 截止错报是十四万加十三万加十六万，合计四十三万。加上单独的九万应抵销未抵销收入，合并收入共高估五十二万。
  s1_zh_hk: 截止錯報係十四萬加十三萬加十六萬，合計四十三萬。再加獨立嘅九萬應抵銷未抵銷收入，綜合收入合共高估五十二萬。
  s2_en: >-
    Request corrections and verify they reach group reporting. Assess receivables, inventory, cost of
    sales and tax separately; do not assume a 520,000 profit effect.
  s2_zh: 要求更正，并核实已经反映到集团报表。应收款项、存货、销售成本和税费要另外评估，不能认定利润也高估了五十二万。
  s2_zh_hk: 要求更正，並核實集團報告已經反映。應收款項、存貨、銷售成本同稅項要另行評估，唔可以假設溢利都高估咗五十二萬。
  s3_en: >-
    520,000 is below overall materiality yet above performance materiality. Neither comparison is an automatic
    clearance rule.
  s3_zh: 五十二万低于整体重要性，却高于实际执行的重要性。两种比较都不是自动结案的标准。
  s3_zh_hk: 五十二萬低過整體重要性，但高過實際執行的重要性。兩個比較都唔係自動結案嘅準則。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: The group auditor concludes
  title_zh: 结论由集团审计师负责
  title_zh_hk: 結論由集團核數師負責
  en: >-
    Review the remaining population and all other misstatements, evaluate qualitative significance, corroborate
    the adjustments, and document whether group evidence is sufficient. Component performance materiality,
    when needed, is set separately by the group auditor; it is not group materiality divided across the
    three depots.
  zh: >-
    复核剩余总体和所有其他错报，评价定性影响，验证调整，并记录集团审计证据是否充分。组成部分实际执行的重要性在需要时由集团审计师另行确定，不是把集团重要性分摊给三个站点。
  zh_hk: >-
    覆核餘下總體同其他所有錯報，評估質性上嘅重要性，印證調整，並記錄集團審計證據是否充足。組成部分實際執行的重要性有需要時由集團核數師另行釐定，唔係將集團重要性分落三個站。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Same rule, shared risk
  title_zh: 同一规则，共同风险
  title_zh_hk: 同一規則，共同風險
  q1_en: >-
    First view: 270,000 to 450,000
  q1_zh: 第一种情境：270,000至450,000
  q1_zh_hk: 第一個情境：270,000至450,000
  q2_en: >-
    Identified: 430,000 + 90,000 = 520,000
  q2_zh: 已识别：430,000 + 90,000 = 520,000
  q2_zh_hk: 已識別：430,000 + 90,000 = 520,000
  s1_en: >-
    When components share one posting rule, add their errors and test the central process; do not average
    them away.
  s1_zh: 各组成部分用同一入账规则时，要把错报加总，并测试集团流程，不能平均掉。
  s1_zh_hk: 各組成部分用同一套入賬規則，就要將錯報加埋，並測試集團流程，唔可以平均咗佢。
  s2_en: >-
    Materiality levels guide planning and evaluation, but they do not decide the opinion on their own.
  s2_zh: 重要性水平用于计划和评价，但不能单独决定审计意见。
  s2_zh_hk: 重要性水平用嚟規劃同評估，但唔可以單獨決定審計意見。
  s3_en: >-
    The firm, the records and the figures are classroom assumptions, not a report about a real company.
    Official scene art is a teaching illustration only.
  s3_zh: 企业、记录和数字都是课堂假设，不是关于某家真实企业的报道。官方场景图只是教学插图。
  s3_zh_hk: 企業、記錄同數字都係課堂假設，唔係關於某間真實企業嘅報道。官方場景圖只係教學插圖。
duration_target_s: 198
