  s1_en: >-
    East and West have confirmed that customers received kits after year end: 140,000 and 130,000. At
    South, year-end dispatches lack receipt evidence, so 0 to 180,000 may be overstated.
  s1_zh: 东站和西站已确认客户在年末后才收货，分别是十四万和十三万。南站的年末发货没有收货证据，可能高估零到十八万。
  s1_zh_hk: 東站同西站已確認顧客喺年結後先收貨，分別係十四萬同十三萬。南站年結發貨欠缺收貨證據，可能高估零至十八萬。
  s2_en: >-
    An internal workbook cannot establish the customer's receipt date. These are separate, same-direction
    possible overstatements in one population, not alternative estimates.
  s2_zh: 内部工作表证明不了客户的收货日期。这些是同一总体中互不重合、方向相同的潜在高估，不是几种替代估计。
  s2_zh_hk: 內部試算表證明唔到顧客幾時收貨。呢啲係同一總體入面唔同項目、同一方向嘅可能高估，唔係互相替代嘅估計。
  s3_en: >-
    Overall group materiality is 600,000. Group performance materiality is 400,000, used in planning to
    allow for undetected and uncorrected errors.
  s3_zh: 集团整体重要性是六十万，集团实际执行的重要性是四十万。后者在计划时使用，用来给未发现和未更正的错报留出余量。
  s3_zh_hk: 集團整體重要性係六十萬，集團實際執行的重要性係四十萬。後者喺規劃時用，預留未被發現同未更正錯報嘅空間。
