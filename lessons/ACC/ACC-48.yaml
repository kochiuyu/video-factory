  title_en: What range, and what tests?
  title_zh: 区间多少？测试什么？
  title_zh_hk: 範圍多少？測試甚麼？
  en: >-
    Compute the lower and upper group cutoff exposure. What would you test at South, and centrally, before
    accepting the current group audit coverage? Pause and vote.
  zh: 算出集团收入截止错报的下限和上限。在认可目前的集团审计覆盖范围之前，你会在南站和集团层面分别测试什么？请暂停，投个票。
  zh_hk: 計出集團收入截止錯報嘅下限同上限。認定而家嘅集團審計範圍足夠之前，你會喺南站同集團層面各自測試乜嘢？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: >-
    New evidence: South and centre
  title_zh: 南站和集团层面的新证据
  title_zh_hk: 南站與集團層面的新證據
  step1_en: >-
    South: dated acknowledgements
  step1_zh: 南站：注明日期的签收记录
  step1_zh_hk: 南站：附日期的收貨確認
  step2_en: 160,000 late; 20,000 on time
  step2_zh: 160,000年末后；20,000按期
  step2_zh_hk: 160,000年結後；20,000準時
  step3_en: >-
    Inter-depot sales: 90,000
  step3_zh: 站点之间销售：90,000
  step3_zh_hk: 站與站之間銷售：90,000
  s1_en: >-
    A component auditor retrieves dated customer acknowledgements for all South dispatches at issue.
  s1_zh: 组成部分审计师取得了南站全部涉事发货的客户签收记录，都注明了日期。
  s1_zh_hk: 組成部分核數師為南站所有涉事出貨，取得附日期嘅顧客收貨確認。
  s2_en: >-
    Subject to the group auditor reviewing that work, 160,000 was received after year end and 20,000 on
    time.
  s2_zh: 待集团审计师复核这项工作后，可以确认其中十六万的货物在年末后收到，二万按期收到。
  s2_zh_hk: 待集團核數師覆核呢項工作：其中十六萬嘅貨物喺年結後送達，二萬準時送達。
  s3_en: >-
    The central team also finds 90,000 of inter-depot kit sales still in group revenue: a separate population
    with no overlap.
  s3_zh: 集团审计团队还发现，站点之间九万的套件销售仍然留在集团收入里。这是另一个不重合的总体。
  s3_zh_hk: 集團審計團隊另外發現，九萬站與站之間嘅套件銷售仲計喺集團收入入面。呢個係另一個唔重疊嘅總體。
