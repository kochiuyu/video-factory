title_en: Ready to sell, or still in use?
title_zh: 已经可以出售，还是仍在使用？
title_zh_hk: 已可出售，還是仍在使用？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: ACC-49
  kicker_en: ACC-49
  kicker_zh: ACC-49
  kicker_zh_hk: ACC-49
  title_en: Ready to sell, or still in use?
  title_zh: 已经可以出售，还是仍在使用？
  title_zh_hk: 已可出售，還是仍在使用？
  image: art/ready-to-sell-or-still-in-use-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 1 October a Hong Kong carton-finishing business commits to sell one machine and starts marketing
    it. The manager wants to classify it as held for sale at once and stop depreciation. But no buyer
    can take the machine until its replacement is installed. Which position should the controller take?
  zh: >-
    十月一日，香港一家纸箱加工企业决定出售一台设备，并开始积极寻找买方。经理想马上把它划分为持有待售，停止计提折旧。可是在替换设备安装好之前，买方不能把它提走。财务主管应该怎样处理？
  zh_hk: >-
    十月一日，香港一間紙箱加工企業決定出售一部機器，開始積極搵買家。經理想即刻將佢分類為持作出售，停止計提折舊。但係替代機器未裝好之前，買家唔可以攞走佢。財務主管應該點處理？
