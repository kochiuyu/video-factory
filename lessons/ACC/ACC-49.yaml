  footer_en: No handover before the replacement
  footer_zh: 替换设备到位前买方不能提走
  footer_zh_hk: 替代機器到位前買家不能取走
  s1_en: >-
    The business expects to close in February, at a reasonable price, with little prospect of reversing
    the plan. But the restriction on handing over the machine is not usual or customary in such sales.
  s1_zh: 企业预计二月完成交易，价格合理，反悔的可能性很小。不过，替换设备到位前不交付旧设备，这并不是这类出售通常或惯常的限制。
  s1_zh_hk: 企業預計二月交割，價錢合理，撤回計劃嘅機會好細。但係未有替代機器就唔交機，呢個並唔係同類交易一般或慣常嘅限制。
  s2_en: >-
    The controller says it stays as plant and equipment until it is both available for immediate sale
    on normal terms and highly probable to sell.
  s2_zh: 财务主管认为，设备必须同时满足两个条件：能按正常条款立即出售，而且出售极可能发生。在那之前，仍应列为厂房及设备。
  s2_zh_hk: 財務主管認為，機器要同時符合兩個條件：可以按正常條件即時出售，同埋出售極有可能發生。喺嗰之前，仍然應該列作廠房及設備。
  s3_en: >-
    The carrying amount at 30 September is 480,000, with 12,000 of monthly depreciation. Fair value on
    1 October is 450,000, and direct costs to sell are 15,000.
  s3_zh: 九月三十日的账面价值是四十八万，每月折旧一万二千。十月一日的公允价值是四十五万，出售直接费用一万五千。
  s3_zh_hk: 九月三十日嘅賬面值係四十八萬，每月折舊一萬二千。十月一日公平值係四十五萬，出售嘅直接成本一萬五千。
