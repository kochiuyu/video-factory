  kicker: ACC-50
  kicker_en: ACC-50
  kicker_zh: ACC-50
  kicker_zh_hk: ACC-50
  title_en: When the lease loses a floor
  title_zh: 租赁少了一层楼
  title_zh_hk: 租賃少了一層樓
  image: art/when-the-lease-loses-a-room-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A Hong Kong training studio leases two equal floors under one contract. On 1 July, staff move upstairs
    and one floor sits empty. The controller wants to book a partial lease termination and a gain. Nothing
    has been agreed with the lessor. Would you approve the journal?
  zh: >-
    香港一家培训工作室用一份合同租了两个条件相同的楼层。七月一日，员工搬到楼上，一层楼空了出来。财务主管想按部分终止租赁入账，并确认一笔利得。可是出租人还没有同意任何变更。你会批准这笔分录吗？
  zh_hk: >-
    香港一間培訓工作室用同一份合約租咗兩層條件一樣嘅樓。七月一日，員工搬咗去樓上，一層空咗出嚟。財務主管想當部分終止租賃入賬，再確認一筆收益。但係出租人乜都未同意。你會唔會批准呢筆分錄？
