  c42_en: On vacancy
  c42_zh: 因腾空楼层
  c42_zh_hk: 因樓層空置
  footer_en: One floor is 50% of the lease scope
  footer_zh: 一层占租赁范围的50%
  footer_zh_hk: 一層佔租賃範圍的50%
  s1_en: >-
    Staff move upstairs on 1 July, but the tenant still controls both floors. Payments, term and rights
    are unchanged, and the lessor has agreed nothing. There is no early exit option and no separate impairment.
  s1_zh: 员工七月一日搬到楼上，但承租人仍然控制两层楼。付款、租期和权利都没变，出租人也没有同意任何变更。合同没有提前退出选择权，也不存在单独的减值。
  s1_zh_hk: 員工七月一日搬咗去樓上，但承租人依然控制兩層。租金、租期同權利都冇變，出租人亦冇同意任何改動。合約冇提前解約選擇權，亦冇獨立嘅減值。
  s2_en: >-
    After normal accounting to that date, the lease liability is 840,000 and the right-of-use asset is
    760,000. The two floors confer equal rights, so one floor is 50 percent of the scope.
  s2_zh: 做完截至当天的常规会计处理后，租赁负债是八十四万，使用权资产是七十六万。两层楼的权利相同，所以一层占租赁范围的百分之五十。
  s2_zh_hk: 做完截至嗰日嘅一般會計處理之後，租賃負債係八十四萬，使用權資產係七十六萬。兩層樓權利相等，所以一層佔租賃範圍百分之五十。
  s3_en: >-
    The controller proposes reducing the asset by 380,000 and the liability by 420,000, and recognising
    a 40,000 gain.
  s3_zh: 财务主管拟减少使用权资产三十八万、减少租赁负债四十二万，并确认四万利得。
  s3_zh_hk: 財務主管提議減少使用權資產三十八萬、減少租賃負債四十二萬，再確認四萬收益。
- id: pause1
