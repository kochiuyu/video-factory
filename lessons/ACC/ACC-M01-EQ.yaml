id: ACC-M01-EQ
course: accounting
course_en: Introductory Accounting
course_zh: 会计入门
course_zh_hk: 會計入門
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 64
title_en: Accounting Equation
title_zh: 会计等式
title_zh_hk: 會計等式
objective_en: 'Open the books unit: every resource has a claim, so assets equal liabilities plus equity.'
objective_zh: 打开记账单元：每项资源都有对应的要求权，所以资产等于负债加所有者权益。
objective_zh_hk: 打開記賬單元：每項資源都有對應的要求權，所以資產等於負債加所有者權益。
glossary:
- en: accounting equation
  zh: 会计等式
  zh_hk: 會計等式
  lock: true
- en: assets
  zh: 资产
  zh_hk: 資產
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: The accounting equation says assets equal what?
  zh: 会计等式说资产等于什么？
  zh_hk: 會計等式說資產等於什麼？
  answer_en: Liabilities plus equity.
  answer_zh: 负债加权益。
  answer_zh_hk: 負債加權益。
- id: Q2
  type: transfer
  en: Owners put in cash. Which two parts of the equation rise?
  zh: 所有者投入现金。等式的哪两部分增加？
  zh_hk: 所有者投入現金。等式的哪兩部分增加？
  answer_en: Assets and equity. No new liability.
  answer_zh: 资产和权益。没有新增负债。
  answer_zh_hk: 資產和權益。沒有新增負債。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Accounting Equation
  title_zh: 会计等式
  title_zh_hk: 會計等式
  en: This sitting starts with the books. Every resource the firm controls has a claim on it. The
    equation is the test that those two sides still match.
  zh: 这一讲从账本讲起。企业控制的每项资源，都有人对它提出要求。等式是在检查这两边是否还对得上。
  zh_hk: 這一講從賬本講起。企業控制的每項資源，都有人對它提出要求。等式是在檢查這兩邊是否還對得上。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Always in balance
  title_zh: 永远平衡
  title_zh_hk: 永遠平衡
  formula: Assets = Liabilities + Equity
  formula_tex: A = L + E
  formula_en: Assets = Liabilities + Equity
  formula_zh: 资产 = 负债 + 权益
  formula_zh_hk: 資產 = 負債 + 權益
  gloss_en: What we have equals who has a claim.
  gloss_zh: 我们拥有的，等于谁有权主张。
  gloss_zh_hk: 我們擁有的，等於誰有權主張。
  en: Assets are resources the business controls. Liabilities are claims by outsiders. Equity is the
    owners’ residual claim. The two sides must be equal after every event.
  zh: 资产是企业控制的资源。负债是外人的主张。权益是所有者的剩余主张。每笔业务之后，两边必须相等。
  zh_hk: 資產是企業控制的資源。負債是外人的主張。權益是所有者的剩餘主張。每筆業務之後，兩邊必須相等。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Borrow cash
  title_zh: 借入现金
  title_zh_hk: 借入現金
  left_en: Cash rises
  left_zh: 现金增加
  left_zh_hk: 現金增加
  right_en: Bank loan rises
  right_zh: 银行借款增加
  right_zh_hk: 銀行借款增加
  en: The firm borrows cash from a bank. Cash, an asset, rises. The bank loan, a liability, rises
    by the same amount. Equity does not move. The equation still holds.
  zh: 企业向银行借入现金。资产中的现金增加。负债中的银行借款增加同样金额。权益不动。等式仍然成立。
  zh_hk: 企業向銀行借入現金。資產中的現金增加。負債中的銀行借款增加同樣金額。權益不動。等式仍然成立。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Check both sides
  title_zh: 两边都要核对
  title_zh_hk: 兩邊都要核對
  q1_en: Which asset changed?
  q1_zh: 哪一项资产变了？
  q1_zh_hk: 哪一項資產變了？
  q2_en: Which claim changed by the same amount?
  q2_zh: 哪一项主张按同样金额变了？
  q2_zh_hk: 哪一項主張按同樣金額變了？
  en: After each event, name the asset that moved and the claim that moved with it. Next we write
    that same event as a debit and a credit.
  zh: 每发生一笔事项，先说出哪项资产动了、哪项要求权跟着动。下一讲把同一件事写成借和贷。
  zh_hk: 每發生一筆事項，先說出哪項資產動了、哪項要求權跟著動。下一講把同一件事寫成借和貸。
