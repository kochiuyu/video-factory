id: ACC-M01-OUT
course: accounting
course_en: Introductory Accounting
course_zh: 会计入门
course_zh_hk: 會計入門
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 28
title_en: The books, closed
title_zh: 账本，先说到这里
title_zh_hk: 賬本，先說到這裏
objective_en: 'Close the sitting: an event can be written and dated. Next sitting asks which period
  the amount belongs to.'
objective_zh: 收住这一讲：事项能入账、能落日期。下一讲问数字属于哪一期。
objective_zh_hk: 收住這一講：事項能入賬、能落日期。下一講問數字屬於哪一期。
glossary:
- en: Close
  zh: 收束
  zh_hk: 收束
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: After this sitting, what can you do with one event?
  zh: 一件事项你现在能做什么？
  zh_hk: 一件事項你現在能做什麼？
  answer_en: Keep both sides equal, write the line, and date it to the work.
  answer_zh: 两边对齐，写出那一行，并按完工落日期。
  answer_zh_hk: 兩邊對齊，寫出那一行，並按完工落日期。
beats:
- id: hook
  visual: module_close
  seconds: 14
  kicker: Close
  kicker_en: Close
  kicker_zh: 收束
  kicker_zh_hk: 收束
  title_en: The books, closed
  title_zh: 账本，先说到这里
  title_zh_hk: 賬本，先說到這裏
  en: You can state the equation, place a debit and a credit, and choose the work clock over the cash
    clock.
  zh: 你能说出等式，放下借和贷，并选用完工的钟而不是只看收付款的钟。
  zh_hk: 你能說出等式，放下借和貸，並選用完工的鐘而不是只看收付款的鐘。
  claim_en: You can state the equation, place a debit and a credit, and choose the work clock over
    the cash clock.
  claim_zh: 你能说出等式，放下借和贷，并选用完工的钟而不是只看收付款的钟。
  claim_zh_hk: 你能說出等式，放下借和貸，並選用完工的鐘而不是只看收付款的鐘。
  next_en: 'That is the books unit. Next sitting: which period gets the sale, the matching cost, and
    the machine.'
  next_zh: 记账单元到此。下一讲：销售、配比的成本、机器，各记在哪一期。
  next_zh_hk: 記賬單元到此。下一講：銷售、配比的成本、機器，各記在哪一期。
