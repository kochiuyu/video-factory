quiz:
- id: Q1
  type: comprehension
  en: What three amounts does this sitting place in time?
  zh: 哪三笔金额要放进时间？
  zh_hk: 哪三筆金額要放進時間？
  answer_en: The sale, the matching cost, and the machine.
  answer_zh: 销售、配比的成本、机器。
  answer_zh_hk: 銷售、配比的成本、機器。
