  title_en: 'This sitting: which period'
  title_zh: 这一讲：哪一期
  title_zh_hk: 這一講：哪一期
  en: The books can already hold a line. This sitting asks which year that line belongs to. Delivery,
    matching, then a machine used for years.
  zh: 账已经能放下一行。这一讲问那一行属于哪一年。先交货，再配比，再谈用很多年的机器。
  zh_hk: 賬已經能放下一行。這一講問那一行屬於哪一年。先交貨，再配比，再談用很多年的機器。
  item1_en: Revenue recognition
  item1_zh: 收入确认
  item1_zh_hk: 收入確認
  item2_en: Matching principle
  item2_zh: 配比原则
  item2_zh_hk: 配比原則
  item3_en: Depreciation
  item3_zh: 折旧
  item3_zh_hk: 折舊
- id: takeaway
  visual: title_card
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: which period'
  title_zh: 这一讲：哪一期
  title_zh_hk: 這一講：哪一期
  en: Three shorts. Revenue when delivered. Cost beside that revenue. Machine cost spread across the
    years of use.
  zh: 三条短片。交货才确认收入。成本和那笔收入放一起。机器成本按使用的年份摊开。
  zh_hk: 三條短片。交貨才確認收入。成本和那筆收入放一起。機器成本按使用的年份攤開。
