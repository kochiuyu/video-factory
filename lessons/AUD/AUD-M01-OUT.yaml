  title_en: The process, closed
  title_zh: 过程，先说到这里
  title_zh_hk: 過程，先說到這裏
  en: Independence, a split of duties, and original evidence — that is the path into the file.
  zh: 独立、职责分开、原始证据——这就是进档案的路。
  zh_hk: 獨立、職責分開、原始證據——這就是進檔案的路。
  claim_en: Independence, a split of duties, and original evidence — that is the path into the file.
  claim_zh: 独立、职责分开、原始证据——这就是进档案的路。
  claim_zh_hk: 獨立、職責分開、原始證據——這就是進檔案的路。
  next_en: 'Process unit done. Next: materiality and skepticism — how large, and how sure.'
  next_zh: 过程单元到此。下一讲：重要性和职业怀疑——有多大，有多敢信。
  next_zh_hk: 過程單元到此。下一講：重要性和職業懷疑——有多大，有多敢信。
