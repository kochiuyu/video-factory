id: ECON-EL-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 160
title_en: Price Elasticity
title_zh: 价格弹性
title_zh_hk: 價格彈性
objective_en: 'Close the trade unit: whether a price rise raises revenue depends on how many buyers
  walk away.'
objective_zh: 收住交易单元：涨价会不会增加收入，取决于有多少买家走开。
objective_zh_hk: 收住交易單元：漲價會不會增加收入，取決於有多少買家走開。
glossary:
- en: price elasticity of demand
  zh: 需求价格弹性
  zh_hk: 需求價格彈性
  lock: true
- en: revenue
  zh: 收入
  zh_hk: 收入
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: If |Ed| is greater than one, what happens to revenue when price rises?
  zh: 若弹性绝对值大于一，涨价时收入会怎样？
  zh_hk: 若彈性絕對值大於一，漲價時收入會怎樣？
  answer_en: Revenue falls. Quantity drops by more than the price rises.
  answer_zh: 收入下降。数量下降的比例大于价格上升的比例。
  answer_zh_hk: 收入下降。數量下降的比例大於價格上升的比例。
- id: Q2
  type: transfer
  en: A unique required textbook has almost no substitute. Should a small price rise raise revenue?
  zh: 一本必修且几乎无替代的教材小幅涨价，收入会不会增加？
  zh_hk: 一本必修且幾乎無替代的教材小幅漲價，收入會不會增加？
  answer_en: Yes, if demand is inelastic. Few students can drop the book.
  answer_zh: 会，若需求缺乏弹性。很少学生能不用这本书。
  answer_zh_hk: 會，若需求缺乏彈性。很少學生能不用這本書。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Price Elasticity
  title_zh: 价格弹性
  title_zh_hk: 價格彈性
  en: We assigned the task by opportunity cost. Now attach a price. Raising the price does not always
    raise the cash in the till. It depends how many buyers walk away — the elasticity of demand.
  zh: 任务已按机会成本分好。现在标上价格。涨价并不总是让抽屉里的现金变多。要看有多少买家走开——也就是需求弹性。
  zh_hk: 任務已按機會成本分好。現在標上價格。漲價並不總是讓抽屜裏的現金變多。要看有多少買家走開——也就是需求彈性。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Response over price
  title_zh: 数量变化相对价格
  title_zh_hk: 數量變化相對價格
  formula: '|Ed| = percent change in Qd / percent change in P'
  formula_tex: '|E_d| = \frac{\Delta Q_d}{\Delta P}'
  formula_en: '|Ed| = percent change in Qd / percent change in P'
  formula_zh: '|Ed| = 需求量变动百分比 / 价格变动百分比'
  formula_zh_hk: '|Ed| = 需求量變動百分比 / 價格變動百分比'
  gloss_en: Elastic means buyers leave quickly. Inelastic means they stay.
  gloss_zh: 有弹性表示买家很快离开。缺乏弹性表示他们留下。
  gloss_zh_hk: 有彈性表示買家很快離開。缺乏彈性表示他們留下。
  en: Price elasticity of demand is the percent change in quantity demanded divided by the percent
    change in price. If that ratio is above one, demand is elastic.
  zh: 需求价格弹性是需求量的百分比变化除以价格的百分比变化。若这个比值大于一，需求就是有弹性的。
  zh_hk: 需求價格彈性是需求量的百分比變化除以價格的百分比變化。若這個比值大於一，需求就是有彈性的。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Canteen rice vs late-night snack
  title_zh: 食堂米饭和宵夜
  title_zh_hk: 食堂米飯和宵夜
  left_en: Staple rice — inelastic
  left_zh: 主食米饭，缺乏弹性
  left_zh_hk: 主食米飯，缺乏彈性
  right_en: Optional snack — elastic
  right_zh: 可有可无的宵夜，有弹性
  right_zh_hk: 可有可無的宵夜，有彈性
  en: A small rise in the rice price barely cuts bowls sold, so revenue can rise. The same rise on
    a snack people can skip empties the queue and can cut revenue.
  zh: 米饭小幅涨价，卖掉的份数几乎不减，收入可能上升。同样涨在可放弃的宵夜上，队伍会散，收入可能下降。
  zh_hk: 米飯小幅漲價，賣掉的份數幾乎不減，收入可能上升。同樣漲在可放棄的宵夜上，隊伍會散，收入可能下降。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: A ratio of percentages
  title_zh: 百分比之比
  title_zh_hk: 百分比之比
  formula: '|Ed| = percent change in Qd / percent change in P'
  formula_tex: '|E_d| = \frac{\Delta Q_d}{\Delta P}'
  formula_en: '|Ed| = percent change in Qd / percent change in P'
  formula_zh: '|Ed| = 需求量变动百分比 / 价格变动百分比'
  formula_zh_hk: '|Ed| = 需求量變動百分比 / 價格變動百分比'
  gloss_en: Above one is elastic.
  gloss_zh: 大于一就是有弹性。
  gloss_zh_hk: 大於一就是有彈性。
  en: Elasticity is not the slope of the curve. It is how much quantity moves when price moves by
    one percent. Units cancel. The ratio stays.
  zh: 弹性不是曲线的斜率。它是价格变动百分之一时，数量变动多少。单位消掉。比值留下。
  zh_hk: 彈性不是曲線的斜率。它是價格變動百分之一時，數量變動多少。單位消掉。比值留下。
- id: split
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Elastic versus not
  title_zh: 有弹性对无弹性
  title_zh_hk: 有彈性對無彈性
  left_en: '|Ed| > 1 buyers leave'
  left_zh: '|Ed| > 1 买家离开'
  left_zh_hk: '|Ed| > 1 買家離開'
  right_en: '|Ed| < 1 buyers stay'
  right_zh: '|Ed| < 1 买家留下'
  right_zh_hk: '|Ed| < 1 買家留下'
  en: If quantity jumps more than price, demand is elastic and a higher price can shrink revenue.
    If quantity barely moves, a higher price can raise revenue.
  zh: 若数量跳得比价格多，需求有弹性，提价可能减少收入。若数量几乎不动，提价可能增加收入。
  zh_hk: 若數量跳得比價格多，需求有彈性，提價可能減少收入。若數量幾乎不動，提價可能增加收入。
- id: mtr
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A fare rise
  title_zh: 票价上调
  title_zh_hk: 票價上調
  setup_en: Price up 10 percent
  setup_zh: 价格升10%
  setup_zh_hk: 價格升10%
  result_en: Rides down 3 percent
  result_zh: 乘次降3%
  result_zh_hk: 乘次降3%
  en: A ten percent fare rise cuts rides by three percent. |Ed| is 0.3. Demand here is inelastic,
    so revenue rises even as some riders leave.
  zh: 票价升百分之十，乘次降百分之三。|Ed|是0.3。这里需求缺乏弹性，所以即使有人离开，收入仍上升。
  zh_hk: 票價升百分之十，乘次降百分之三。|Ed|是0.3。這裏需求缺乏彈性，所以即使有人離開，收入仍上升。
- id: drivers
  visual: three_column
  seconds: 16
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: What bends |Ed|
  title_zh: 什么改变|Ed|
  title_zh_hk: 什麼改變|Ed|
  col1_en: Substitutes
  col1_zh: 替代品
  col1_zh_hk: 替代品
  col2_en: Budget share
  col2_zh: 预算份额
  col2_zh_hk: 預算份額
  col3_en: Time to adjust
  col3_zh: 调整时间
  col3_zh_hk: 調整時間
  en: More substitutes, a larger share of income, and a longer month all raise elasticity. A morning
    commute with one line is less elastic than a weekend lunch.
  zh: 替代越多、占收入越大、可调整的时间越长，弹性越大。只有一条线的早高峰，比周末午餐更缺乏弹性。
  zh_hk: 替代越多、佔收入越大、可調整的時間越長，彈性越大。只有一條線的早高峰，比週末午餐更缺乏彈性。
- id: use
  visual: steps
  seconds: 18
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Before you raise price
  title_zh: 提价之前
  title_zh_hk: 提價之前
  step1_en: Estimate |Ed|
  step1_zh: 估计|Ed|
  step1_zh_hk: 估計|Ed|
  step2_en: Check revenue direction
  step2_zh: 看收入方向
  step2_zh_hk: 看收入方向
  step3_en: Name the leftover riders
  step3_zh: 说出留下的乘客
  step3_zh_hk: 說出留下的乘客
  en: 'Write a guess for |Ed|. If it is below one, revenue may rise. Still ask who remains: students,
    tourists, or people with no other line.'
  zh: 先写下|Ed|的猜测。若小于一，收入可能上升。仍要问留下的是谁：学生、游客，还是没有其他线路的人。
  zh_hk: 先寫下|Ed|的猜測。若小於一，收入可能上升。仍要問留下的是誰：學生、遊客，還是沒有其他線路的人。
- id: cut
  visual: big_number
  seconds: 14
  kicker: Number
  kicker_en: Number
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: The threshold
  title_zh: 那条界
  title_zh_hk: 那條界
  unit_en: unitless
  unit_zh: 无单位
  unit_zh_hk: 無單位
  caption_en: Cross one and the story flips.
  caption_zh: 越过一，故事就翻转。
  caption_zh_hk: 越過一，故事就翻轉。
  number: 1
  en: One is the hinge. Above it, quantity dominates the revenue story. Below it, price does. Do not
    quote a slope and call it elasticity.
  zh: 一是铰链。高于一，数量主导收入故事。低于一，价格主导。不要引用斜率却把它叫做弹性。
  zh_hk: 一是鉸鏈。高於一，數量主導收入故事。低於一，價格主導。不要引用斜率卻把它叫做彈性。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Check substitutes first
  title_zh: 先看替代品
  title_zh_hk: 先看替代品
  q1_en: Can buyers switch easily?
  q1_zh: 买家能否轻易换别的？
  q1_zh_hk: 買家能否輕易換別的？
  q2_en: Will revenue rise or fall?
  q2_zh: 收入会升还是会降？
  q2_zh_hk: 收入會升還是會降？
  en: Many substitutes mean elastic demand. A price rise then loses quantity faster than it gains
    on each unit. Next sitting asks what one price does to buyers and sellers together — surplus,
    shortage, and a price that clears.
  zh: 替代品多，需求就有弹性。这时涨价，数量掉得比每件多收的钱更快。下一单元问一个价格如何同时作用于买卖双方——过剩、短缺，以及出清的价格。
  zh_hk: 替代品多，需求就有彈性。這時漲價，數量掉得比每件多收的錢更快。下一單元問一個價格如何同時作用於買賣雙方——過剩、短缺，以及出清的價格。
