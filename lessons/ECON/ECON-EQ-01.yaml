id: ECON-EQ-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 192
title_en: Market Equilibrium
title_zh: 市场均衡
title_zh_hk: 市場均衡
objective_en: 'Open the market-failure unit from a working market: surplus and shortage push price
  to the clearing level.'
objective_zh: 从还能运转的市场打开失灵单元：过剩和短缺把价格推向出清。
objective_zh_hk: 從還能運轉的市場打開失靈單元：過剩和短缺把價格推向出清。
glossary:
- en: equilibrium
  zh: 均衡
  zh_hk: 均衡
  lock: true
- en: surplus
  zh: 过剩
  zh_hk: 過剩
  lock: true
- en: shortage
  zh: 短缺
  zh_hk: 短缺
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: At equilibrium, what is true of quantity demanded and quantity supplied?
  zh: 在均衡时，需求量与供给量是什么关系？
  zh_hk: 在均衡時，需求量與供給量是什麼關係？
  answer_en: They are equal. No surplus and no shortage.
  answer_zh: 二者相等。没有过剩，也没有短缺。
  answer_zh_hk: 二者相等。沒有過剩，也沒有短缺。
- id: Q2
  type: transfer
  en: A canteen bun sells out every day before noon. Is the posted price above or below equilibrium?
  zh: 食堂包子每天中午前卖光。标价是高于还是低于均衡？
  zh_hk: 食堂包子每天中午前賣光。標價是高於還是低於均衡？
  answer_en: Below. A shortage means price is too low.
  answer_zh: 低于均衡。短缺说明价格太低。
  answer_zh_hk: 低於均衡。短缺說明價格太低。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Market Equilibrium
  title_zh: 市场均衡
  title_zh_hk: 市場均衡
  en: Last sitting asked how many buyers leave when price rises. Now both sides stand in one market.
    A price too high leaves goods unsold. A price too low leaves buyers waiting. Both signals push
    the price.
  zh: 上一讲问涨价时有多少买家离开。现在买卖双方站在同一个市场里。价格太高，货卖不掉。价格太低，买家排队。两个信号都在推价格。
  zh_hk: 上一講問漲價時有多少買家離開。現在買賣雙方站在同一個市場裏。價格太高，貨賣不掉。價格太低，買家排隊。兩個信號都在推價格。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Quantity matches
  title_zh: 数量对得上
  title_zh_hk: 數量對得上
  formula: Qd = Qs at P*
  formula_en: Qd = Qs at P*
  formula_zh: 在 P* 处 Qd = Qs
  formula_zh_hk: 在 P* 處 Qd = Qs
  gloss_en: P* is the equilibrium price. Neither side is rationed.
  gloss_zh: P*是均衡价格。买卖双方都不必被配给。
  gloss_zh_hk: P*是均衡價格。買賣雙方都不必被配給。
  en: Equilibrium is the price where the quantity buyers want equals the quantity sellers offer. At
    that price there is no leftover pile and no unmet queue.
  zh: 均衡是买家想买的数量等于卖家想卖的数量时的价格。这个价格下既没有剩货，也没有买不到的队伍。
  zh_hk: 均衡是買家想買的數量等於賣家想賣的數量時的價格。這個價格下既沒有剩貨，也沒有買不到的隊伍。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Campus printer credits
  title_zh: 校园打印额度
  title_zh_hk: 校園打印額度
  left_en: Price above P* — surplus
  left_zh: 价格高于P*，过剩
  left_zh_hk: 價格高於P*，過剩
  right_en: Price below P* — shortage
  right_zh: 价格低于P*，短缺
  right_zh_hk: 價格低於P*，短缺
  en: If print credits are expensive, machines sit idle. If they are almost free, queues form. The
    unused credits and the queues are the signals that price should move.
  zh: 打印额度太贵，机器会闲着。几乎免费，就会排队。闲置额度和队伍，就是价格该动的信号。
  zh_hk: 打印額度太貴，機器會閒著。幾乎免費，就會排隊。閒置額度和隊伍，就是價格該動的信號。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: One price clears
  title_zh: 一个价格出清
  title_zh_hk: 一個價格出清
  formula: Qd = Qs at P*
  formula_en: Qd = Qs at P*
  formula_zh: 在 P* 处 Qd = Qs
  formula_zh_hk: 在 P* 處 Qd = Qs
  gloss_en: No leftover queue, no leftover stock.
  gloss_zh: 没有剩下的队，也没有剩下的货。
  gloss_zh_hk: 沒有剩下的隊，也沒有剩下的貨。
  en: Equilibrium is a price where the amount buyers want equals the amount sellers offer. It is not
    a moral prize. It is a clearing condition.
  zh: 均衡是买家想要的数量等于卖家愿意供给的数量时的价格。它不是道德奖杯。它是出清条件。
  zh_hk: 均衡是買家想要的數量等於賣家願意供給的數量時的價格。它不是道德獎杯。它是出清條件。
- id: gap
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Off the clearing price
  title_zh: 偏离出清价
  title_zh_hk: 偏離出清價
  left_en: 'Price too high: surplus'
  left_zh: 价格过高：过剩
  left_zh_hk: 價格過高：過剩
  right_en: 'Price too low: shortage'
  right_zh: 价格过低：短缺
  right_zh_hk: 價格過低：短缺
  en: Above P*, goods sit. Below P*, people queue. Both are signs that the posted price is not doing
    the matching job.
  zh: 高于P*，货物会坐着。低于P*，人们会排队。两者都说明牌价没有完成配对工作。
  zh_hk: 高於P*，貨物會坐著。低於P*，人們會排隊。兩者都說明牌價沒有完成配對工作。
- id: fish
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Morning fish stall
  title_zh: 早市鱼档
  title_zh_hk: 早市魚檔
  setup_en: Price starts high
  setup_zh: 开价偏高
  setup_zh_hk: 開價偏高
  result_en: Price falls as ice melts
  result_zh: 冰化了价格就下降
  result_zh_hk: 冰化了價格就下降
  en: The stall opens dear. Fish remain. By late morning the price drops and the ice is not wasted.
    That walk toward P* is equilibrium as a process.
  zh: 档口开价偏贵。鱼还在。临近中午价格下降，冰也不浪费。走向P*的过程就是均衡。
  zh_hk: 檔口開價偏貴。魚還在。臨近中午價格下降，冰也不浪費。走向P*的過程就是均衡。
- id: find
  visual: steps
  seconds: 18
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Find P* on a sketch
  title_zh: 在草图上找P*
  title_zh_hk: 在草圖上找P*
  step1_en: Draw demand down
  step1_zh: 向下画出需求
  step1_zh_hk: 向下畫出需求
  step2_en: Draw supply up
  step2_zh: 向上画出供给
  step2_zh_hk: 向上畫出供給
  step3_en: Read the crossing
  step3_zh: 读出交点
  step3_zh_hk: 讀出交點
  en: Demand slopes down. Supply slopes up. The crossing is P* and Q*. If a rule pins the price elsewhere,
    mark the gap as shortage or surplus.
  zh: 需求向下。供给向上。交点是P*和Q*。若规则把价格钉在别处，就把缺口标成短缺或过剩。
  zh_hk: 需求向下。供給向上。交點是P*和Q*。若規則把價格釘在別處，就把缺口標成短缺或過剩。
- id: shocks
  visual: three_column
  seconds: 16
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: What moves the cross
  title_zh: 什么移动交点
  title_zh_hk: 什麼移動交點
  col1_en: Income, tastes
  col1_zh: 收入、口味
  col1_zh_hk: 收入、口味
  col2_en: Input costs
  col2_zh: 投入成本
  col2_zh_hk: 投入成本
  col3_en: A new rule
  col3_zh: 一条新规则
  col3_zh_hk: 一條新規則
  en: Demand shocks slide the down line. Cost shocks slide the up line. A cap or a floor stops the
    price from following. Say which line moved.
  zh: 需求冲击滑动向下的线。成本冲击滑动向上的线。上限或下限阻止价格跟随。先说哪一条线动了。
  zh_hk: 需求衝擊滑動向下的線。成本衝擊滑動向上的線。上限或下限阻止價格跟隨。先說哪一條線動了。
- id: star
  visual: big_number
  seconds: 14
  kicker: Number
  kicker_en: Number
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: The posted price
  title_zh: 牌价
  title_zh_hk: 牌價
  unit_en: clears
  unit_zh: 出清
  unit_zh_hk: 出清
  caption_en: A label, not a virtue.
  caption_zh: 一个标签，不是美德。
  caption_zh_hk: 一個標籤，不是美德。
  number: P*
  en: Call it P* so you can talk about gaps. Do not call it fair until you say for whom. Clearing
    and fairness are different sentences.
  zh: 叫它P*，方便谈缺口。在你说出对谁公平之前，不要叫它公平。出清和公平是两句话。
  zh_hk: 叫它P*，方便談缺口。在你說出對誰公平之前，不要叫它公平。出清和公平是兩句話。
- id: cap
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A rent cap
  title_zh: 租金上限
  title_zh_hk: 租金上限
  setup_en: Price fixed below P*
  setup_zh: 价格钉在P*之下
  setup_zh_hk: 價格釘在P*之下
  result_en: Queue and side deals
  result_zh: 排队和场外交易
  result_zh_hk: 排隊和場外交易
  en: A cap below P* makes more tenants want flats than landlords offer. The shortage shows up as
    queues, waiting lists, and payments that are not on the lease.
  zh: 低于P*的上限让想租的人多于肯租的房东。短缺表现为排队、轮候，以及租约上看不见的付款。
  zh_hk: 低於P*的上限讓想租的人多於肯租的房東。短缺表現為排隊、輪候，以及租約上看不見的付款。
- id: policy
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Fix the price or the line
  title_zh: 改价格还是改线
  title_zh_hk: 改價格還是改線
  left_en: A cap fights the cross
  left_zh: 上限对抗交点
  left_zh_hk: 上限對抗交點
  right_en: A housing supply shift moves it
  right_zh: 住房供给移动交点
  right_zh_hk: 住房供給移動交點
  en: If the problem is too few flats, moving supply is the direct tool. Pinning a price below P*
    hides the shortage instead of building through it.
  zh: 若问题是房子太少，移动供给才是直接工具。把价格钉在P*之下，是把短缺藏起来，而不是盖过去。
  zh_hk: 若問題是房子太少，移動供給才是直接工具。把價格釘在P*之下，是把短缺藏起來，而不是蓋過去。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Read the leftover
  title_zh: 看剩下的是货还是人
  title_zh_hk: 看剩下的是貨還是人
  q1_en: Are units left unsold?
  q1_zh: 是否有单位卖不掉？
  q1_zh_hk: 是否有單位賣不掉？
  q2_en: Are buyers still waiting?
  q2_zh: 是否还有买家在等？
  q2_zh_hk: 是否還有買家在等？
  en: 'Surplus pushes price down. Shortage pushes price up. Equilibrium is the price that clears both
    signals. Next we break the clock after the deal: when someone else covers the loss, care often
    falls.'
  zh: 过剩把价格往下推。短缺把价格往上推。均衡就是让两个信号都停住的那个价格。下一讲把成交之后的钟拆开：损失改由别人承担时，小心程度往往会下降。
  zh_hk: 過剩把價格往下推。短缺把價格往上推。均衡就是讓兩個信號都停住的那個價格。下一講把成交之後的鐘拆開：損失改由別人承擔時，小心程度往往會下降。
