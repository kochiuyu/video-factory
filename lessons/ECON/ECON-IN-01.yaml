id: ECON-IN-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 80
title_en: Incentives
title_zh: 激励
title_zh_hk: 激勵
objective_en: 'Open the trade unit: change the payoff, and behaviour usually moves — including in
  ways you did not want.'
objective_zh: 打开交易单元：报酬一变，行为通常跟着变——也包括你不想要的那种变。
objective_zh_hk: 打開交易單元：報酬一變，行為通常跟著變——也包括你不想要的那種變。
glossary:
- en: incentive
  zh: 激励
  zh_hk: 激勵
  lock: true
- en: unintended consequence
  zh: 意外后果
  zh_hk: 意外後果
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What is an incentive in this lesson?
  zh: 本课中的激励指什么？
  zh_hk: 本課中的激勵指什麼？
  answer_en: A reward or penalty that changes how attractive an action is.
  answer_zh: 使某一行动更有利或更不利的奖励或惩罚。
  answer_zh_hk: 使某一行動更有利或更不利的獎勵或懲罰。
- id: Q2
  type: transfer
  en: A city fines drivers who block a bike lane. What intended change and what unintended consequence
    should you look for?
  zh: 城市对占用自行车道的司机罚款。你应寻找怎样的预期变化和意外后果？
  zh_hk: 城市對佔用單車徑的司機罰款。你應尋找怎樣的預期變化和意外後果？
  answer_en: Intended, less blocking. Unintended, perhaps faster illegal U-turns or displaced parking
    on sidewalks.
  answer_zh: 预期是更少占用车道。意外后果可能是更危险的掉头，或把车停到人行道上。
  answer_zh_hk: 預期是更少佔用車道。意外後果可能是更危險的掉頭，或把車停到行人路上。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Incentives
  title_zh: 激励
  title_zh_hk: 激勵
  en: Last sitting chose the next unit by extra cost and extra benefit. This sitting asks what happens
    when you change those payoffs. Change the incentive, and behaviour usually moves.
  zh: 上一单元用额外成本和额外好处选择下一单位。这一讲问：你去改这些报酬，会发生什么。激励一变，行为通常跟着变。
  zh_hk: 上一單元用額外成本和額外好處選擇下一單位。這一講問：你去改這些報酬，會發生什麼。激勵一變，行為通常跟著變。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Incentive
  title_zh: 激励
  title_zh_hk: 激勵
  formula: incentive = a reason to act differently
  formula_en: incentive = a reason to act differently
  formula_zh: 激励 = 让人改变行为的理由
  formula_zh_hk: 激勵 = 讓人改變行為的理由
  gloss_en: Prices, grades, bonuses, and fines
  gloss_zh: 价格、成绩、奖金、罚款
  gloss_zh_hk: 價格、成績、獎金、罰款
  en: An incentive is a reward or a penalty that makes one action more or less attractive. Prices,
    grades, bonuses, and fines are all incentives.
  zh: 激励是使某一行动变得更有利或更不利的奖励或惩罚。价格、成绩、奖金和罚款都是激励。
  zh_hk: 激勵是使某一行動變得更有利或更不利的獎勵或懲罰。價格、成績、獎金和罰款都是激勵。
- id: predict
  visual: two_column
  seconds: 16
  kicker: Predict
  kicker_en: Predict
  kicker_zh: 预测
  kicker_zh_hk: 預測
  title_en: Raise the reward
  title_zh: 提高回报
  title_zh_hk: 提高回報
  left_en: Stronger incentive
  left_zh: 更强激励
  left_zh_hk: 更強激勵
  right_en: More of that action
  right_zh: 更多该行动
  right_zh_hk: 更多該行動
  en: If you pay more for a result, people usually supply more of it. Before you change a rule, write
    down which behaviour you expect to rise or fall.
  zh: 若你为某一结果支付更多，人们通常会提供更多。改规则之前，先写下你预期会增加或减少的行为。
  zh_hk: 若你為某一結果支付更多，人們通常會提供更多。改規則之前，先寫下你預期會增加或減少的行為。
- id: example
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Night bonus
  title_zh: 夜间奖金
  title_zh_hk: 夜間獎金
  setup_en: Late-night bonus per completed drop
  setup_zh: 夜间每单完成支付奖金
  setup_zh_hk: 夜間每單完成支付獎金
  result_en: Faster deliveries / more accidents
  result_zh: 更快送达 / 更多事故
  result_zh_hk: 更快送達 / 更多事故
  en: A platform pays a late-night bonus for each completed drop. Riders finish more orders. They
    also take riskier routes. The extra accidents are an unintended consequence.
  zh: 平台为夜间每单完成支付奖金。骑手完成更多订单，但也走更险的路线。多出的事故，就是意外后果。
  zh_hk: 平台為夜間每單完成支付獎金。騎手完成更多訂單，但也走更險的路線。多出的事故，就是意外後果。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Name the side effect
  title_zh: 说出副作用
  title_zh_hk: 說出副作用
  q1_en: What behaviour will this incentive increase?
  q1_zh: 这个激励会增加什么行为？
  q1_zh_hk: 這個激勵會增加什麼行為？
  q2_en: What else might it increase that you do not want?
  q2_zh: 它还可能增加什么你并不想要的东西？
  q2_zh_hk: 它還可能增加什麼你並不想要的東西？
  en: 'Ask two questions. What behaviour will this incentive increase? What else might it increase
    that you do not want? Next we use opportunity cost again: who should do which job when two people
    can both do both.'
  zh: 问两句。这个激励会增加哪种行为？它还会增加哪些你并不想要的行为？下一讲再次用到机会成本：两个人都会两件事时，谁该做哪一件。
  zh_hk: 問兩句。這個激勵會增加哪種行為？它還會增加哪些你並不想要的行為？下一講再次用到機會成本：兩個人都會兩件事時，誰該做哪一件。
