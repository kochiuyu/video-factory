  title_en: 'This sitting: payoffs and trade'
  title_zh: 这一讲：报酬与分工
  title_zh_hk: 這一講：報酬與分工
  en: Last sitting chose the next unit. This sitting changes the payoff. People move. Tasks move.
    Then a price rise either raises revenue or sends buyers away.
  zh: 上一讲选了下一单位。这一讲改报酬。人会动。任务会动。然后涨价要么增加收入，要么把买家送走。
  zh_hk: 上一講選了下一單位。這一講改報酬。人會動。任務會動。然後漲價要麼增加收入，要麼把買家送走。
  item1_en: Incentives
  item1_zh: 激励
  item1_zh_hk: 激勵
  item2_en: Comparative advantage
  item2_zh: 比较优势
  item2_zh_hk: 比較優勢
  item3_en: Price elasticity
  item3_zh: 价格弹性
  item3_zh_hk: 價格彈性
