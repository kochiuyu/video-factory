- en: Open
  zh: 开场
  zh_hk: 開場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What three changes does this sitting follow?
  zh: 这一讲跟哪三种变化？
  zh_hk: 這一講跟哪三種變化？
  answer_en: A changed payoff, a reassigned task, then a price rise.
  answer_zh: 报酬变了、任务重分、然后涨价。
  answer_zh_hk: 報酬變了、任務重分、然後漲價。
beats:
- id: hook
  visual: module_open
