title_en: 'This sitting: payoffs and trade'
title_zh: 这一讲：报酬与分工
title_zh_hk: 這一講：報酬與分工
objective_en: Change a payoff, assign a task by opportunity cost, then see whether a price rise fills
  the till.
objective_zh: 改一改报酬，按机会成本分工，再看涨价是进账还是把店清空。
objective_zh_hk: 改一改報酬，按機會成本分工，再看漲價是進賬還是把店清空。
