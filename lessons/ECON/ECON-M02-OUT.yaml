  title_en: Trade, closed
  title_zh: 分工，先说到这里
  title_zh_hk: 分工，先說到這裏
  en: You can predict an unintended incentive, assign the lower-cost task, and say when a price rise
    loses the till.
  zh: 你能预见到不想要的激励，把任务交给机会成本更低的人，并说明何时涨价会少进账。
  zh_hk: 你能預見到不想要的激勵，把任務交給機會成本更低的人，並說明何時漲價會少進賬。
