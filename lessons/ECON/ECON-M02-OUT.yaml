title_en: Trade, closed
title_zh: 分工，先说到这里
title_zh_hk: 分工，先說到這裏
objective_en: Close the trade sitting. Next sitting puts both sides in one market, then breaks the
  deal after the signature.
objective_zh: 收住分工这一讲。下一讲把买卖双方放进同一个市场，再把签字之后的交易拆开。
objective_zh_hk: 收住分工這一講。下一講把買賣雙方放進同一個市場，再把簽字之後的交易拆開。
glossary:
- en: Close
  zh: 收束
  zh_hk: 收束
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: When does a price rise fail to raise revenue?
  zh: 何时涨价不能增加收入？
  zh_hk: 何時漲價不能增加收入？
  answer_en: When demand is elastic — buyers leave faster than the extra per unit comes in.
  answer_zh: 需求有弹性时——买家走开的速度，快过每件多收的钱。
  answer_zh_hk: 需求有彈性時——買家走開的速度，快過每件多收的錢。
