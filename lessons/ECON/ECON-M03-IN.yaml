id: ECON-M03-IN
course: economics
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 28
title_en: 'This sitting: a price that clears'
title_zh: 这一讲：出清的价格
title_zh_hk: 這一講：出清的價格
objective_en: 'Watch a working price, then two ways the deal still fails: hidden action, and a cost
  dumped on a third party.'
objective_zh: 先看出清的价格，再看交易仍可能失败的两种方式：隐藏行动，以及甩给第三者的成本。
objective_zh_hk: 先看出清的價格，再看交易仍可能失敗的兩種方式：隱藏行動，以及甩給第三者的成本。
glossary:
- en: Open
  zh: 开场
  zh_hk: 開場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: After a clearing price, which two failures remain?
  zh: 价格出清之后，还剩哪两种失灵？
  zh_hk: 價格出清之後，還剩哪兩種失靈？
  answer_en: Moral hazard inside the contract, and an externality outside it.
  answer_zh: 合同里的道德风险，以及合同外的外部性。
  answer_zh_hk: 合同裏的道德風險，以及合同外的外部性。
beats:
- id: hook
  visual: module_open
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: a price that clears'
  title_zh: 这一讲：出清的价格
  title_zh_hk: 這一講：出清的價格
  en: A price too high leaves goods unsold. A price too low leaves buyers waiting. That is the working
    market. Then we break it twice.
  zh: 价格太高，货卖不掉。价格太低，买家排队。这是还能运转的市场。然后我们把它拆两次。
  zh_hk: 價格太高，貨賣不掉。價格太低，買家排隊。這是還能運轉的市場。然後我們把它拆兩次。
  item1_en: Market equilibrium
  item1_zh: 市场均衡
  item1_zh_hk: 市場均衡
  item2_en: Moral hazard
  item2_zh: 道德风险
  item2_zh_hk: 道德風險
  item3_en: Externalities
  item3_zh: 外部性
  item3_zh_hk: 外部性
- id: takeaway
  visual: title_card
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: a price that clears'
  title_zh: 这一讲：出清的价格
  title_zh_hk: 這一講：出清的價格
  en: Three shorts. Equilibrium first. Then care that falls after someone else covers the loss. Then
    a bill the price never wrote.
  zh: 三条短片。先均衡。然后是别人承担损失之后下降的小心。然后是价格从未写下的账单。
  zh_hk: 三條短片。先均衡。然後是別人承擔損失之後下降的小心。然後是價格從未寫下的賬單。
