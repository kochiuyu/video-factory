id: ECON-M03-OUT
course: economics
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 28
title_en: The market, closed
title_zh: 市场，先说到这里
title_zh_hk: 市場，先說到這裏
objective_en: 'Close the sitting: a price can clear and still miss hidden effort or a third party.'
objective_zh: 收住这一讲：价格可以出清，却仍可能漏掉隐藏的努力或第三者。
objective_zh_hk: 收住這一講：價格可以出清，卻仍可能漏掉隱藏的努力或第三者。
glossary:
- en: Close
  zh: 收束
  zh_hk: 收束
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Why can a clearing price still be the wrong story?
  zh: 为什么出清的价格仍可能不是完整故事？
  zh_hk: 為什麼出清的價格仍可能不是完整故事？
  answer_en: It can miss hidden action after the deal, or a cost paid by someone who never signed.
  answer_zh: 它可能漏掉成交后的隐藏行动，或从未签字的人付的成本。
  answer_zh_hk: 它可能漏掉成交後的隱藏行動，或從未簽字的人付的成本。
beats:
- id: hook
  visual: module_close
  seconds: 14
  kicker: Close
  kicker_en: Close
  kicker_zh: 收束
  kicker_zh_hk: 收束
  title_en: The market, closed
  title_zh: 市场，先说到这里
  title_zh_hk: 市場，先說到這裏
  en: Surplus and shortage move the price. Deductibles put some loss back. Private cost and social
    cost must be two lines.
  zh: 过剩和短缺推动价格。免赔额把一部分损失还回去。私人成本和社会成本必须写成两行。
  zh_hk: 過剩和短缺推動價格。免賠額把一部分損失還回去。私人成本和社會成本必須寫成兩行。
  claim_en: Surplus and shortage move the price. Deductibles put some loss back. Private cost and
    social cost must be two lines.
  claim_zh: 过剩和短缺推动价格。免赔额把一部分损失还回去。私人成本和社会成本必须写成两行。
  claim_zh_hk: 過剩和短缺推動價格。免賠額把一部分損失還回去。私人成本和社會成本必須寫成兩行。
  next_en: That is the market unit. A clearing price is the start of the story, not the end.
  next_zh: 市场单元到此。出清的价格是故事的开头，不是结尾。
  next_zh_hk: 市場單元到此。出清的價格是故事的開頭，不是結尾。
