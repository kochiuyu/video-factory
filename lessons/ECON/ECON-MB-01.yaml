id: ECON-MB-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 96
title_en: Marginal Thinking
title_zh: 边际思维
title_zh_hk: 邊際思維
objective_en: 'Close the choice unit: decide with the extra benefit and extra cost of one more unit,
  not the average so far.'
objective_zh: 收住选择单元：用再一单位的额外好处和额外成本做决定，不用到目前为止的平均数。
objective_zh_hk: 收住選擇單元：用再一單位的額外好處和額外成本做決定，不用到目前為止的平均數。
glossary:
- en: marginal benefit
  zh: 边际收益
  zh_hk: 邊際收益
  lock: true
- en: marginal cost
  zh: 边际成本
  zh_hk: 邊際成本
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: You keep going while which comparison holds?
  zh: 在哪一种比较成立时，你应该继续？
  zh_hk: 在哪一種比較成立時，你應該繼續？
  answer_en: Marginal benefit is at least marginal cost.
  answer_zh: 边际收益至少等于边际成本。
  answer_zh_hk: 邊際收益至少等於邊際成本。
- id: Q2
  type: transfer
  en: The first three coffees were useful. The fourth costs more than it helps. What should you do?
  zh: 前三杯咖啡有用。第四杯的成本高于好处。你该怎样？
  zh_hk: 前三杯咖啡有用。第四杯的成本高於好處。你該怎樣？
  answer_en: Stop at three. Past average benefit does not justify the fourth.
  answer_zh: 停在三杯。过去的平均收益不能为第四杯辩护。
  answer_zh_hk: 停在三杯。過去的平均收益不能為第四杯辯護。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Marginal Thinking
  title_zh: 边际思维
  title_zh_hk: 邊際思維
  en: We have named the trade-off, the forward cost, and the cost that is already gone. The last tool
    is the margin. The useful question is not “is this activity good.” It is “is one more unit still
    worth it.”
  zh: 权衡、向前看的成本、已经花掉的成本都有了名字。最后一件工具是边际。有用的问题不是“这件事好不好”，而是“再做一单位还值不值”。
  zh_hk: 權衡、向前看的成本、已經花掉的成本都有了名字。最後一件工具是邊際。有用的問題不是「這件事好不好」，而是「再做一單位還值不值」。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Compare the next unit
  title_zh: 比较下一单位
  title_zh_hk: 比較下一單位
  formula: Do more if MB ≥ MC
  formula_en: Do more if MB ≥ MC
  formula_zh: 若 MB ≥ MC 就多做
  formula_zh_hk: 若 MB ≥ MC 就多做
  gloss_en: MB and MC are for the next unit, not the average.
  gloss_zh: 边际收益和边际成本针对下一单位，不是平均。
  gloss_zh_hk: 邊際收益和邊際成本針對下一單位，不是平均。
  en: Marginal benefit is what you gain from one more unit. Marginal cost is what you give up for
    that unit. Do more only while the extra benefit covers the extra cost.
  zh: 边际收益是再多一单位带来的好处。边际成本是为这一单位放弃的东西。只有额外好处盖住额外成本时，才继续做。
  zh_hk: 邊際收益是再多一單位帶來的好處。邊際成本是為這一單位放棄的東西。只有額外好處蓋住額外成本時，才繼續做。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: One more hour of study
  title_zh: 再读一小时
  title_zh_hk: 再讀一小時
  left_en: Extra marks from one hour
  left_zh: 多一小时多得的分数
  left_zh_hk: 多一小時多得的分數
  right_en: Sleep or paid shift forgone
  right_zh: 放弃的睡眠或工时
  right_zh_hk: 放棄的睡眠或工時
  en: A late hour of study may raise the quiz score a little. If that gain is smaller than the sleep
    or wage you give up, stop. The first hours can still have been worth it.
  zh: 再读一小时也许只多一点点分数。若这一点低于你放弃的睡眠或工资，就该停。前面几小时仍然可以是值得的。
  zh_hk: 再讀一小時也許只多一點點分數。若這一點低於你放棄的睡眠或工資，就該停。前面幾小時仍然可以是值得的。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: One more unit
  title_zh: 再多一单位
  title_zh_hk: 再多一單位
  formula: Do more if MB ≥ MC
  formula_en: Do more if MB ≥ MC
  formula_zh: 若 MB ≥ MC 就多做
  formula_zh_hk: 若 MB ≥ MC 就多做
  gloss_en: Stop when the next unit fails.
  gloss_zh: 下一单位失败就停止。
  gloss_zh_hk: 下一單位失敗就停止。
  en: Marginal thinking ignores the pile already done. Compare the extra benefit of one more hour
    with the extra cost of that hour.
  zh: 边际思考不管已经完成的堆。比较再多一小时的额外好处，和这一小时的额外成本。
  zh_hk: 邊際思考不管已經完成的堆。比較再多一小時的額外好處，和這一小時的額外成本。
- id: study
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: The fourth hour
  title_zh: 第四个小时
  title_zh_hk: 第四個小時
  setup_en: MB of hour four is small
  setup_zh: 第四小时的MB很小
  setup_zh_hk: 第四小時的MB很小
  result_en: MC is sleep you lose
  result_zh: MC是失去的睡眠
  result_zh_hk: MC是失去的睡眠
  en: The first hour of revision pays. The fourth hour adds little and costs a night. Stop where MB
    falls below MC, even if the exam is tomorrow.
  zh: 第一小时复习很值。第四小时增加很少，却赔上一夜。即使明天考试，也在MB低于MC处停。
  zh_hk: 第一小時複習很值。第四小時增加很少，卻賠上一夜。即使明天考試，也在MB低於MC處停。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Ignore sunk averages
  title_zh: 不要看已沉没的平均
  title_zh_hk: 不要看已沉沒的平均
  q1_en: What does one more unit add?
  q1_zh: 再多一单位增加什么？
  q1_zh_hk: 再多一單位增加什麼？
  q2_en: What does that unit cost now?
  q2_zh: 这一单位现在要付出什么？
  q2_zh_hk: 這一單位現在要付出什麼？
  en: 'Averages describe the past. The next choice uses only the extra benefit and the extra cost
    from here. That closes the sitting on how to choose. Next sitting: people respond when those payoffs
    change.'
  zh: 平均数描述过去。下一步只用从这里起的额外好处和额外成本。选择这一单元到此结束。下一单元：这些报酬一变，人的行为通常跟着变。
  zh_hk: 平均數描述過去。下一步只用從這裏起的額外好處和額外成本。選擇這一單元到此結束。下一單元：這些報酬一變，人的行為通常跟著變。
