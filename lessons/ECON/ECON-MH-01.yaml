id: ECON-MH-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 64
title_en: Moral Hazard
title_zh: 道德风险
title_zh_hk: 道德風險
objective_en: 'Second step after a clearing price: hidden action after a contract, when one side no
  longer bears the loss.'
objective_zh: 出清价格之后的第二步：签约后的隐藏行动——损失不再由行动的那一方承担。
objective_zh_hk: 出清價格之後的第二步：簽約後的隱藏行動——損失不再由行動的那一方承擔。
glossary:
- en: moral hazard
  zh: 道德风险
  zh_hk: 道德風險
  lock: true
- en: hidden action
  zh: 隐藏行动
  zh_hk: 隱藏行動
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Moral hazard happens at which moment in a contract?
  zh: 道德风险出现在合同的哪一时刻？
  zh_hk: 道德風險出現在合同的哪一時刻？
  answer_en: After the deal, when action is hidden and downside is shifted.
  answer_zh: 成交之后，当行动被隐藏、下行风险被转移时。
  answer_zh_hk: 成交之後，當行動被隱藏、下行風險被轉移時。
- id: Q2
  type: transfer
  en: Bike insurance that pays a full replacement with no excess. What hidden action do you expect?
  zh: 单车保险全额赔新车且无免赔。你会预期怎样的隐藏行动？
  zh_hk: 單車保險全額賠新車且無免賠。你會預期怎樣的隱藏行動？
  answer_en: Less locking and less care. The insurer bears the loss.
  answer_zh: 更少上锁、更少小心。损失由保险公司承担。
  answer_zh_hk: 更少上鎖、更少小心。損失由保險公司承擔。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Moral Hazard
  title_zh: 道德风险
  title_zh_hk: 道德風險
  en: A clearing price assumes the effort you paid for is the effort you get. After someone else agrees
    to cover the loss, care often falls. That change in hidden action is moral hazard.
  zh: 出清价格假定：你付钱买到的努力，就是你真正得到的努力。一旦损失改由别人承担，小心程度往往会下降。这种看不见的行动变化，就是道德风险。
  zh_hk: 出清價格假定：你付錢買到的努力，就是你真正得到的努力。一旦損失改由別人承擔，小心程度往往會下降。這種看不見的行動變化，就是道德風險。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Hidden action after the deal
  title_zh: 成交后的隐藏行动
  title_zh_hk: 成交後的隱藏行動
  formula: Cover the loss → effort drops
  formula_en: Cover the loss → effort drops
  formula_zh: 损失被兜底 → 努力下降
  formula_zh_hk: 損失被兜底 → 努力下降
  gloss_en: The action is hidden. The contract cannot see every choice.
  gloss_zh: 行动是隐藏的。合同看不见每一个选择。
  gloss_zh_hk: 行動是隱藏的。合同看不見每一個選擇。
  en: Moral hazard is hidden action after a contract. One side is protected from the downside, so
    that side takes less care than the other side wanted.
  zh: 道德风险是签约之后的隐藏行动。一方已不受下行风险影响，于是不如另一方希望的那样小心。
  zh_hk: 道德風險是簽約之後的隱藏行動。一方已不受下行風險影響，於是不如另一方希望的那樣小心。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Group project and a free rider
  title_zh: 小组作业与搭便车
  title_zh_hk: 小組作業與搭便車
  left_en: Shared grade covers slacking
  left_zh: 共同分数掩盖偷懒
  left_zh_hk: 共同分數掩蓋偷懶
  right_en: Effort is hard to watch
  right_zh: 努力很难被看见
  right_zh_hk: 努力很難被看見
  en: If the group grade is shared and nobody logs who wrote which slide, one member can hide low
    effort. The others bear the mark. That is moral hazard inside the team.
  zh: 若小组分数共享，又没有记录谁写了哪一页，有人就可以把低努力藏起来。分数由别人承担。这就是组内的道德风险。
  zh_hk: 若小組分數共享，又沒有記錄誰寫了哪一頁，有人就可以把低努力藏起來。分數由別人承擔。這就是組內的道德風險。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Align the leftover risk
  title_zh: 把剩下的风险对齐
  title_zh_hk: 把剩下的風險對齊
  q1_en: Who pays if effort falls?
  q1_zh: 努力下降时谁来买单？
  q1_zh_hk: 努力下降時誰來買單？
  q2_en: Can the action be observed?
  q2_zh: 这个行动能否被观察到？
  q2_zh_hk: 這個行動能否被觀察到？
  en: Deductibles, logs, and spot checks put some loss back on the person who chooses the effort.
    Next, the cost is not hidden inside the contract — it lands on a third party who never signed.
  zh: 免赔额、记录和抽查，是把一部分损失还给那个选择努力程度的人。下一讲的成本不藏在合同里——它落在从未签字的第三者身上。
  zh_hk: 免賠額、記錄和抽查，是把一部分損失還給那個選擇努力程度的人。下一講的成本不藏在合同裏——它落在從未簽字的第三者身上。
