id: ECON-MH
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 86
title_en: Moral Hazard
title_zh: 道德风险
title_zh_hk: 道德風險
objective_en: 'Second step after a clearing price: hidden action after a contract, when one side
  no longer bears the loss.'
objective_zh: 出清价格之后的第二步：签约后的隐藏行动——损失不再由行动的那一方承担。
objective_zh_hk: 出清價格之後的第二步：簽約後的隱藏行動——損失不再由行動的那一方承擔。
glossary:
- en: moral hazard
  zh: 道德风险
  zh_hk: 道德風險
  lock: true
- en: hidden action
  zh: 隐藏行动
  zh_hk: 隱藏行動
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Moral hazard happens at which moment in a contract?
  zh: 道德风险出现在合同的哪一时刻？
  zh_hk: 道德風險出現在合同的哪一時刻？
  answer_en: After the deal, when action is hidden and downside is shifted.
  answer_zh: 成交之后，当行动被隐藏、下行风险被转移时。
  answer_zh_hk: 成交之後，當行動被隱藏、下行風險被轉移時。
- id: Q2
  type: transfer
  en: Bike insurance that pays a full replacement with no excess. What hidden action do you expect?
  zh: 单车保险全额赔新车且无免赔。你会预期怎样的隐藏行动？
  zh_hk: 單車保險全額賠新車且無免賠。你會預期怎樣的隱藏行動？
  answer_en: Less locking and less care. The insurer bears the loss.
  answer_zh: 更少上锁、更少小心。损失由保险公司承担。
  answer_zh_hk: 更少上鎖、更少小心。損失由保險公司承擔。
beats:
- id: hook
  visual: title_card
  seconds: 20
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Moral Hazard
  title_zh: 道德风险
  title_zh_hk: 道德風險
  en: A clearing price assumes the effort you paid for is the effort you get. After someone else
    agrees to cover the loss, care often falls. That change in hidden action is moral hazard.
  zh: 出清价格假定你付钱买到的努力，就是你真正得到的努力。一旦别人答应承担损失，谨慎往往会下降。这种隐藏行动的变化，叫道德风险。
  zh_hk: 出清價格假定你俾錢買到嘅努力，就係你真正得到嘅努力。一旦第二人答應承擔損失，謹慎往往會下降。呢種隱藏行動嘅變化，叫道德風險。
- id: define
  visual: definition_card
  seconds: 22
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Hidden action after the deal
  title_zh: 成交后的隐藏行动
  title_zh_hk: 成交後的隱藏行動
  formula: Cover the loss → effort drops
  formula_en: Cover the loss → effort drops
  formula_zh: 损失被兜底 → 努力下降
  formula_zh_hk: 損失被兜底 → 努力下降
  gloss_en: The action is hidden. The contract cannot see every choice.
  gloss_zh: 行动是隐藏的。合同看不见每一个选择。
  gloss_zh_hk: 行動是隱藏的。合同看不見每一個選擇。
  s1_en: Moral hazard is hidden action after a contract.
  s1_zh: 道德风险是签约之后的隐藏行动。
  s1_zh_hk: 道德風險係簽約之後嘅隱藏行動。
  s2_en: One side is protected from the downside, so that side takes less care than the other
    side wanted.
  s2_zh: 一边被保护、不用承担下行，于是比另一方希望的更不小心。
  s2_zh_hk: 一邊被保護、唔使承擔下行，於是比另一方希望嘅更唔小心。
- id: example
  visual: two_column
  seconds: 24
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Group project and a free rider
  title_zh: 小组作业与搭便车
  title_zh_hk: 小組作業與搭便車
  left_en: Shared grade covers slacking
  left_zh: 共同分数掩盖偷懒
  left_zh_hk: 共同分數掩蓋偷懶
  right_en: Effort is hard to watch
  right_zh: 努力很难被看见
  right_zh_hk: 努力很難被看見
  s1_en: A group project with one shared mark.
  s1_zh: 一个共享分数的小组作业。
  s1_zh_hk: 一個共享分數嘅小組功課。
  s2_en: If nobody logs who wrote which slide, one member can hide low effort.
  s2_zh: 若没有人记录谁写了哪一页，就有人可以把低努力藏起来。
  s2_zh_hk: 若冇人記錄邊個寫咗邊一頁，就有人可以將低努力匿埋。
  s3_en: The others bear the mark. That is moral hazard inside the team.
  s3_zh: 其他人扛着分数。这就是团队里的道德风险。
  s3_zh_hk: 其他人孭住分數。呢個就係團隊入面嘅道德風險。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Align the leftover risk
  title_zh: 把剩下的风险对齐
  title_zh_hk: 把剩下的風險對齊
  q1_en: Who pays if effort falls?
  q1_zh: 努力下降时谁来买单？
  q1_zh_hk: 努力下降時誰來買單？
  q2_en: Can the action be observed?
  q2_zh: 这个行动能否被观察到？
  q2_zh_hk: 這個行動能否被觀察到？
  s1_en: Put some loss back on the person who chooses the effort.
  s1_zh: 把一部分损失放回选择努力程度的那个人身上。
  s1_zh_hk: 將一部分損失放返選擇努力程度嗰個人身上。
  s2_en: Deductibles, logs, and spot checks do that job.
  s2_zh: 免赔额、记录和抽查，就是做这件事。
  s2_zh_hk: 免賠額、記錄同抽查，就係做呢件事。
  s3_en: Next, the cost is not hidden inside the contract. It lands on a third party. That sitting
    is externality if you take them as a pair.
  s3_zh: 下一讲，成本不是藏在合约里，而是落在第三方。若两讲成对看，那一讲就是外部性。
  s3_zh_hk: 下一講，成本唔係藏喺合約入面，而係落喺第三方。若兩講成對睇，嗰一講就係外部性。
