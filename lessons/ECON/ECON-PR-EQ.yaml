id: ECON-PR-EQ
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 260
title_en: Market Equilibrium
title_zh: 市场均衡
title_zh_hk: 市場均衡
objective_en: 'Open the market-failure unit from a working market: surplus and shortage push price
  to the clearing level.'
objective_zh: 从还能运转的市场打开失灵单元：过剩和短缺把价格推向出清。
objective_zh_hk: 從還能運轉的市場打開失靈單元：過剩和短缺把價格推向出清。
glossary:
- en: equilibrium
  zh: 均衡
  zh_hk: 均衡
  lock: true
- en: surplus
  zh: 过剩
  zh_hk: 過剩
  lock: true
- en: shortage
  zh: 短缺
  zh_hk: 短缺
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: At equilibrium, what is true of quantity demanded and quantity supplied?
  zh: 在均衡时，需求量与供给量是什么关系？
  zh_hk: 在均衡時，需求量與供給量是什麼關係？
  answer_en: They are equal. No surplus and no shortage.
  answer_zh: 二者相等。没有过剩，也没有短缺。
  answer_zh_hk: 二者相等。沒有過剩，也沒有短缺。
- id: Q2
  type: transfer
  en: A canteen bun sells out every day before noon. Is the posted price above or below equilibrium?
  zh: 食堂包子每天中午前卖光。标价是高于还是低于均衡？
  zh_hk: 食堂包子每天中午前賣光。標價是高於還是低於均衡？
  answer_en: Below. A shortage means price is too low.
  answer_zh: 低于均衡。短缺说明价格太低。
  answer_zh_hk: 低於均衡。短缺說明價格太低。
beats:
- id: hook
  visual: title_card
  seconds: 20
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Market Equilibrium
  title_zh: 市场均衡
  title_zh_hk: 市場均衡
  en: Last sitting wrote supply. Now both lists stand on one street. A price too high leaves goods
    unsold. A price too low leaves buyers waiting. Both signals push the price.
  zh: 上一讲写了供给。现在两张清单站在同一条街上。价格太高，货卖不掉。价格太低，买家排队。两个信号都在推价格。
  zh_hk: 上一講寫咗供給。而家兩張清單企喺同一條街。價格太高，貨賣唔出。價格太低，買家排隊。兩個信號都喺度推價格。
- id: define
  visual: definition_card
  seconds: 22
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Quantity matches
  title_zh: 数量对得上
  title_zh_hk: 數量對得上
  formula: Qd = Qs at P*
  formula_en: Qd = Qs at P*
  formula_zh: 在 P* 处 Qd = Qs
  formula_zh_hk: 在 P* 處 Qd = Qs
  gloss_en: P* is the equilibrium price. Neither side is rationed.
  gloss_zh: P*是均衡价格。买卖双方都不必被配给。
  gloss_zh_hk: P*是均衡價格。買賣雙方都不必被配給。
  s1_en: Equilibrium is the price where the quantity buyers want equals the quantity sellers offer.
  s1_zh: 均衡是买家想买的数量等于卖家想卖的数量时的价格。
  s1_zh_hk: 均衡係買家想買嘅數量等於賣家想賣嘅數量時嘅價格。
  s2_en: At that price there is no leftover pile and no unmet queue. Call that price P star so
    we can talk about gaps.
  s2_zh: 这个价格下既没有剩货，也没有买不到的队伍。把这个价叫作 P 星，方便谈缺口。
  s2_zh_hk: 呢個價格下既冇剩貨，亦冇買唔到嘅隊。將呢個價叫 P 星，方便談缺口。
- id: example
  visual: two_column
  seconds: 24
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Campus printer credits
  title_zh: 校园打印额度
  title_zh_hk: 校園打印額度
  left_en: Price above P* — surplus
  left_zh: 价格高于P*，过剩
  left_zh_hk: 價格高於P*，過剩
  right_en: Price below P* — shortage
  right_zh: 价格低于P*，短缺
  right_zh_hk: 價格低於P*，短缺
  s1_en: Campus print credits. Same machines, two posted prices.
  s1_zh: 校园打印额度。同一批机器，两个牌价。
  s1_zh_hk: 校園打印額度。同一批機，兩個牌價。
  s2_en: If credits are expensive, machines sit idle. That unused capacity is a surplus signal.
  s2_zh: 额度太贵，机器会闲着。闲置就是过剩的信号。
  s2_zh_hk: 額度太貴，機就會閒住。閒置就係過剩嘅信號。
  s3_en: If credits are almost free, queues form. The unused credits and the queues both say the
    price should move.
  s3_zh: 几乎免费，就会排队。闲置额度和队伍，都在说价格该动。
  s3_zh_hk: 幾乎免費，就會排隊。閒置額度同隊伍，都喺度話價格該郁。
- id: formula
  visual: formula
  seconds: 20
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: One price clears
  title_zh: 一个价格出清
  title_zh_hk: 一個價格出清
  formula: Qd = Qs at P*
  formula_en: Qd = Qs at P*
  formula_zh: 在 P* 处 Qd = Qs
  formula_zh_hk: 在 P* 處 Qd = Qs
  gloss_en: No leftover queue, no leftover stock.
  gloss_zh: 没有剩下的队，也没有剩下的货。
  gloss_zh_hk: 沒有剩下的隊，也沒有剩下的貨。
  s1_en: 'Write equilibrium as a clearing condition: quantity demanded equals quantity supplied.'
  s1_zh: 把均衡写成出清条件：需求量等于供给量。
  s1_zh_hk: 將均衡寫成出清條件：需求量等於供給量。
  s2_en: It is not a moral prize. Clearing and fairness are different sentences.
  s2_zh: 它不是道德奖杯。出清和公平是两句话。
  s2_zh_hk: 佢唔係道德獎盃。出清同公平係兩句說話。
- id: gap
  visual: two_column
  seconds: 22
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Off the clearing price
  title_zh: 偏离出清价
  title_zh_hk: 偏離出清價
  left_en: 'Price too high: surplus'
  left_zh: 价格过高：过剩
  left_zh_hk: 價格過高：過剩
  right_en: 'Price too low: shortage'
  right_zh: 价格过低：短缺
  right_zh_hk: 價格過低：短缺
  s1_en: Two boxes around P star.
  s1_zh: P 星上下两栏。
  s1_zh_hk: P 星上下兩欄。
  s2_en: Above P star, goods sit. That gap is a surplus.
  s2_zh: 高于 P 星，货物会坐着。这个缺口叫过剩。
  s2_zh_hk: 高過 P 星，貨物會坐住。呢個缺口叫過剩。
  s3_en: Below P star, people queue. That gap is a shortage. Both say the posted price is not
    matching the two lists.
  s3_zh: 低于 P 星，人们会排队。这个缺口叫短缺。两者都说明牌价没有把两张清单配上。
  s3_zh_hk: 低過 P 星，人就會排隊。呢個缺口叫短缺。兩者都說明牌價冇將兩張清單配上。
- id: fish
  visual: example
  seconds: 22
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Morning fish stall
  title_zh: 早市鱼档
  title_zh_hk: 早市魚檔
  setup_en: Price starts high
  setup_zh: 开价偏高
  setup_zh_hk: 開價偏高
  result_en: Price falls as ice melts
  result_zh: 冰化了价格就下降
  result_zh_hk: 冰化了價格就下降
  s1_en: A fish stall at opening. Watch the price walk during the morning.
  s1_zh: 早市鱼档。看上午价格怎么走。
  s1_zh_hk: 早市魚檔。睇上晝價格點行。
  s2_en: The stall opens dear. Fish remain on the ice.
  s2_zh: 开价偏贵。鱼还在冰上。
  s2_zh_hk: 開價偏貴。魚仲喺冰上面。
  s3_en: By late morning the price drops and the ice is not wasted. That walk toward P star is
    equilibrium as a process, not a statue.
  s3_zh: 临近中午价格下降，冰也不浪费。走向 P 星的过程就是均衡，不是一座雕像。
  s3_zh_hk: 臨近中午價格下降，冰都唔浪費。行向 P 星嘅過程就係均衡，唔係一座雕像。
- id: find
  visual: steps
  seconds: 24
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Find P* on a sketch
  title_zh: 在草图上找P*
  title_zh_hk: 在草圖上找P*
  step1_en: Draw demand down
  step1_zh: 向下画出需求
  step1_zh_hk: 向下畫出需求
  step2_en: Draw supply up
  step2_zh: 向上画出供给
  step2_zh_hk: 向上畫出供給
  step3_en: Read the crossing
  step3_zh: 读出交点
  step3_zh_hk: 讀出交點
  s1_en: Demand slopes down. At a higher price, buyers take fewer units.
  s1_zh: 需求向下倾斜。价格更高，买家拿得更少。
  s1_zh_hk: 需求向下傾斜。價格更高，買家攞得更少。
  s2_en: Supply slopes up. At a higher price, sellers offer more.
  s2_zh: 供给向上倾斜。价格更高，卖家愿意供得更多。
  s2_zh_hk: 供給向上傾斜。價格更高，賣家願意供得更多。
  s3_en: The crossing is P star and Q star. If a rule pins the price elsewhere, mark the gap as
    shortage or surplus.
  s3_zh: 交点就是 P 星和 Q 星。若规则把价格钉在别处，就把缺口标成短缺或过剩。
  s3_zh_hk: 交點就係 P 星同 Q 星。若規則將價格釘喺第二度，就將缺口標成短缺或過剩。
- id: shocks
  visual: three_column
  seconds: 24
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: What moves the cross
  title_zh: 什么移动交点
  title_zh_hk: 什麼移動交點
  col1_en: Income, tastes
  col1_zh: 收入、口味
  col1_zh_hk: 收入、口味
  col2_en: Input costs
  col2_zh: 投入成本
  col2_zh_hk: 投入成本
  col3_en: A new rule
  col3_zh: 一条新规则
  col3_zh_hk: 一條新規則
  s1_en: A demand shock slides the down line. More buyers at every price, or fewer.
  s1_zh: 需求冲击滑动向下的线。每个价格下买家变多，或变少。
  s1_zh_hk: 需求衝擊滑向下嘅線。每個價格下買家變多，或者變少。
  s2_en: A cost shock slides the up line. It is more expensive, or cheaper, to offer the same
    unit.
  s2_zh: 成本冲击滑动向上的线。提供同一单位变得更贵，或更便宜。
  s2_zh_hk: 成本衝擊滑向上嘅線。提供同一單位變得更貴，或者更平。
  s3_en: A cap or a floor stops the price from following. Before you talk policy, say which line
    moved.
  s3_zh: 上限或下限阻止价格跟随。谈政策之前，先说哪一条线动了。
  s3_zh_hk: 上限或下限阻止價格跟隨。談政策之前，先講邊一條線郁咗。
- id: star
  visual: big_number
  seconds: 18
  kicker: Number
  kicker_en: Number
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: The posted price
  title_zh: 牌价
  title_zh_hk: 牌價
  unit_en: clears
  unit_zh: 出清
  unit_zh_hk: 出清
  caption_en: A label, not a virtue.
  caption_zh: 一个标签，不是美德。
  caption_zh_hk: 一個標籤，不是美德。
  number: P*
  en: Call it P star so you can talk about gaps. Do not call it fair until you say for whom. Clearing
    and fairness are different sentences.
  zh: 叫它 P 星，方便谈缺口。在你说出对谁公平之前，不要叫它公平。出清和公平是两句话。
  zh_hk: 叫佢 P 星，方便談缺口。喺你講出對邊個公平之前，唔好叫佢公平。出清同公平係兩句說話。
- id: cap
  visual: example
  seconds: 22
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A rent cap
  title_zh: 租金上限
  title_zh_hk: 租金上限
  setup_en: Price fixed below P*
  setup_zh: 价格钉在P*之下
  setup_zh_hk: 價格釘在P*之下
  result_en: Queue and side deals
  result_zh: 排队和场外交易
  result_zh_hk: 排隊和場外交易
  s1_en: A rent cap set below P star.
  s1_zh: 把租金上限钉在 P 星下面。
  s1_zh_hk: 將租金上限釘喺 P 星下面。
  s2_en: More tenants want flats than landlords offer at that posted rent.
  s2_zh: 这个牌价下，想租的人多于肯租的房东。
  s2_zh_hk: 呢個牌價下，想租嘅人多過肯租嘅房東。
  s3_en: The shortage shows up as queues, waiting lists, and payments that are not on the lease.
  s3_zh: 短缺表现为排队、轮候，以及租约上看不见的付款。
  s3_zh_hk: 短缺表現為排隊、輪候，以及租約上看唔見嘅付款。
- id: policy
  visual: two_column
  seconds: 22
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Fix the price or the line
  title_zh: 改价格还是改线
  title_zh_hk: 改價格還是改線
  left_en: A cap fights the cross
  left_zh: 上限对抗交点
  left_zh_hk: 上限對抗交點
  right_en: A housing supply shift moves it
  right_zh: 住房供给移动交点
  right_zh_hk: 住房供給移動交點
  s1_en: Name the problem before you pick the tool.
  s1_zh: 选工具之前，先说出问题。
  s1_zh_hk: 揀工具之前，先講出問題。
  s2_en: If the problem is too few flats, moving supply is the direct tool.
  s2_zh: 若问题是房子太少，移动供给才是直接工具。
  s2_zh_hk: 若問題係屋太少，郁供給先係直接工具。
  s3_en: Pinning a price below P star hides the shortage instead of building through it.
  s3_zh: 把价格钉在 P 星之下，是把短缺藏起来，而不是把房子盖出来。
  s3_zh_hk: 將價格釘喺 P 星之下，係將短缺匿埋，而唔係將屋起出嚟。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Read the leftover
  title_zh: 看剩下的是货还是人
  title_zh_hk: 看剩下的是貨還是人
  q1_en: Are units left unsold?
  q1_zh: 是否有单位卖不掉？
  q1_zh_hk: 是否有單位賣不掉？
  q2_en: Are buyers still waiting?
  q2_zh: 是否还有买家在等？
  q2_zh_hk: 是否還有買家在等？
  s1_en: Two signals, one price.
  s1_zh: 两个信号，一个价格。
  s1_zh_hk: 兩個信號，一個價格。
  s2_en: Surplus pushes price down. Shortage pushes price up.
  s2_zh: 过剩把价格往下推。短缺把价格往上推。
  s2_zh_hk: 過剩將價格往下推。短缺將價格往上推。
  s3_en: Equilibrium is the price that clears both signals. Next we ask what a rise does to the
    till.
  s3_zh: 均衡就是让两个信号都停住的那个价格。接下来问涨价之后柜上是多还是少。
  s3_zh_hk: 均衡就係等兩個信號都停住嗰個價格。跟住問加價之後櫃上係多定少。
