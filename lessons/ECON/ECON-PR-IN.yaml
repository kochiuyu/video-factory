course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 42
title_en: Price
title_zh: 价格
title_zh_hk: 價格
objective_en: Open. Last module chose for one person. This module writes two lists and lets a
  price move.
objective_zh: 开场。上一单元是一个人的选择。这一单元写两张清单，让价格动。
objective_zh_hk: 開場。上一單元係一個人嘅選擇。呢一單元寫兩張清單，等價格郁。
glossary:
- en: demand
  zh: 需求
  zh_hk: 需求
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What four steps does this module use?
  zh: 这一单元用哪四步？
  zh_hk: 呢一單元用邊四步？
  answer_en: Demand, supply, equilibrium, elasticity.
  answer_zh: 需求、供给、均衡、弹性。
  answer_zh_hk: 需求、供給、均衡、彈性。
- id: Q2
  type: comprehension
  en: What does this mini-course not cover?
  zh: 这门小课不讲什么？
  zh_hk: 呢門小課唔講咩？
  answer_en: Trade and market failure. Those are later sittings.
  answer_zh: 分工和市场失灵。那是以后的课。
  answer_zh_hk: 分工同市場失靈。嗰啲係以後嘅課。
