  en: Last module chose for one person. This module writes the buyers' list, then the sellers'
    list, then lets one price clear the street, then asks what a rise does to the till.
  zh: 上一单元是一个人在选。这一单元先写买家的清单，再写卖家的清单，再让一个价出清这条街，再问涨价之后柜上是多还是少。
  zh_hk: 上一單元係一個人喺度揀。呢一單元先寫買家清單，再寫賣家清單，再讓一個價出清呢條街，再問加價之後櫃上係多定少。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: This module
  kicker_en: This module
  kicker_zh: 这一单元
  kicker_zh_hk: 呢一單元
  title_en: Two lists, then a price
  title_zh: 两张清单，然后一个价
  title_zh_hk: 兩張清單，然後一個價
  q1_en: Demand first. Then supply.
  q1_zh: 先需求。再供给。
  q1_zh_hk: 先需求。再供給。
  q2_en: A rise does not always fill the till.
  q2_zh: 涨价不一定多进账。
  q2_zh_hk: 加價唔一定多進賬。
  s1_en: That is the map. Four sittings on one street.
  s1_zh: 这就是地图。同一条街上四节课。
  s1_zh_hk: 呢個就係地圖。同一條街上四節課。
  s2_en: We start with the buyers' list.
  s2_zh: 从买家的清单开始。
  s2_zh_hk: 由買家清單開始。
  s3_en: That list is demand.
  s3_zh: 那张清单叫需求。
  s3_zh_hk: 嗰張清單叫需求。
