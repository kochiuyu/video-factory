id: ECON-SC-01
course: principles
course_en: Principles of Economics
course_zh: 经济学原理
course_zh_hk: 經濟學原理
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 96
title_en: Sunk Cost
title_zh: 沉没成本
title_zh_hk: 沉沒成本
objective_en: 'Third step of the choice unit: ignore costs that cannot change, whatever you do next.'
objective_zh: 选择单元的第三步：下一步无论怎么选都无法改变的成本，不要再算进去。
objective_zh_hk: 選擇單元的第三步：下一步無論怎麼選都無法改變的成本，不要再算進去。
glossary:
- en: sunk cost
  zh: 沉没成本
  zh_hk: 沉沒成本
  lock: true
- en: sunk cost fallacy
  zh: 沉没成本谬误
  zh_hk: 沉沒成本謬誤
  lock: true
- en: opportunity cost
  zh: 机会成本
  zh_hk: 機會成本
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Which costs should enter the next decision?
  zh: 下一步决策应纳入哪些成本？
  zh_hk: 下一步決策應納入哪些成本？
  answer_en: Future costs and opportunity costs, not sunk costs.
  answer_zh: 未来成本与机会成本，而不是沉没成本。
  answer_zh_hk: 未來成本與機會成本，而不是沉沒成本。
- id: Q2
  type: transfer
  en: A firm has already spent money building a feature customers ignore. What error is it if that
    past spending is used to justify continuing?
  zh: 公司已在顾客不用的功能上花了钱。若用这笔已花的钱来为继续投入辩护，这是什么错误？
  zh_hk: 公司已在顧客不用的功能上花了錢。若用這筆已花的錢來為繼續投入辯護，這是什麼錯誤？
  answer_en: The sunk cost fallacy.
  answer_zh: 沉没成本谬误。
  answer_zh_hk: 沉沒成本謬誤。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Sunk Cost
  title_zh: 沉没成本
  title_zh_hk: 沉沒成本
  en: Opportunity cost looks forward. The ticket already paid does not. Stay or leave, that money
    is gone. A sunk cost is not an opportunity cost.
  zh: 机会成本朝前看。已经付掉的票款不朝前看。留或走，那笔钱都回不来。沉没成本不是机会成本。
  zh_hk: 機會成本朝前看。已經付掉的票款不朝前看。留或走，那筆錢都回不來。沉沒成本不是機會成本。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Sunk cost
  title_zh: 沉没成本
  title_zh_hk: 沉沒成本
  formula: sunk cost = paid and unrecoverable
  formula_en: sunk cost = paid and unrecoverable
  formula_zh: 沉没成本 = 已付且无法收回
  formula_zh_hk: 沉沒成本 = 已付且無法收回
  gloss_en: Tuition already paid / a non-refundable deposit
  gloss_zh: 已交学费 / 不可退订金
  gloss_zh_hk: 已交學費 / 不可退訂金
  en: A sunk cost is a cost you have already paid and cannot get back. Last month's tuition, a non-refundable
    deposit, hours already spent — none of these change with your next move.
  zh: 沉没成本是已经支付、无法收回的成本。上月学费、不可退订金、已花掉的时间，都不会因下一步而改变。
  zh_hk: 沉沒成本是已經支付、無法收回的成本。上月學費、不可退訂金、已花掉的時間，都不會因下一步而改變。
- id: rule
  visual: steps
  seconds: 16
  kicker: Rule
  kicker_en: Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Ignore it going forward
  title_zh: 向前看时忽略它
  title_zh_hk: 向前看時忽略它
  step1_en: Name future benefits
  step1_zh: 列出未来收益
  step1_zh_hk: 列出未來收益
  step2_en: Name future costs
  step2_zh: 列出未来成本
  step2_zh_hk: 列出未來成本
  step3_en: Leave the sunk cost out
  step3_zh: 把沉没成本排除
  step3_zh_hk: 把沉沒成本排除
  en: When you choose what to do next, compare only future benefits with future costs. A sunk cost
    sits on both sides of the ledger, so it cannot tell you which option is better.
  zh: 选择下一步时，只比较未来收益与未来成本。沉没成本在两边都一样，因此不能告诉你哪边更好。
  zh_hk: 選擇下一步時，只比較未來收益與未來成本。沉沒成本在兩邊都一樣，因此不能告訴你哪邊更好。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Stay or leave
  title_zh: 留下还是离场
  title_zh_hk: 留下還是離場
  left_en: Stay to the end
  left_zh: 看到终场
  left_zh_hk: 看到終場
  right_en: Leave and use the time
  right_zh: 离场做别的事
  right_zh_hk: 離場做別的事
  en: Staying does not recover the ticket price. The relevant cost of staying is the opportunity cost
    of those two hours — the best other use of the same time.
  zh: 留下并不能把票款赚回来。留下的相关代价，是这两小时的机会成本，也就是同一时间的最佳其他用途。
  zh_hk: 留下並不能把票款賺回來。留下的相關代價，是這兩小時的機會成本，也就是同一時間的最佳其他用途。
- id: business
  visual: example
  seconds: 16
  kicker: Business
  kicker_en: Business
  kicker_zh: 企业
  kicker_zh_hk: 企業
  title_en: Kill or continue
  title_zh: 停还是继续
  title_zh_hk: 停還是繼續
  setup_en: $500,000 already spent on an unused feature
  setup_zh: 已在无人使用的功能上投入五十万
  setup_zh_hk: 已在無人使用的功能上投入五十萬
  result_en: Past spending is not a reason to continue
  result_zh: 已花的钱不是继续投入的理由
  result_zh_hk: 已花的錢不是繼續投入的理由
  en: A team has already spent five hundred thousand on a feature nobody uses. Spending more only
    because the money is gone is the sunk cost fallacy.
  zh: 团队已在无人使用的功能上投入五十万。只因为钱已经花了就继续投入，就是沉没成本谬误。
  zh_hk: 團隊已在無人使用的功能上投入五十萬。只因為錢已經花了就繼續投入，就是沉沒成本謬誤。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Would you start today
  title_zh: 若尚未开始，今天还会选吗
  title_zh_hk: 若尚未開始，今天還會選嗎
  q1_en: If that money were not yet spent, would you choose this path today?
  q1_zh: 若那笔钱还没花，今天还会选这条路吗？
  q1_zh_hk: 若那筆錢還沒花，今天還會選這條路嗎？
  q2_en: If not, do not let a sunk cost trap the next choice.
  q2_zh: 若不会，就不要让沉没成本绑架下一步。
  q2_zh_hk: 若不會，就不要讓沉沒成本綁架下一步。
  en: Ask one question. If that money were not yet spent, would you choose this path today? If not,
    do not let a sunk cost trap the next choice. Next we look at one more unit from here — not the
    average of what is already done.
  zh: 只问一句。若那笔钱还没花，你今天还会选这条路吗？若不会，就别让沉没成本绑住下一步。下一讲只看从现在起的再一单位，不看已经做完的平均数。
  zh_hk: 只問一句。若那筆錢還沒花，你今天還會選這條路嗎？若不會，就別讓沉沒成本綁住下一步。下一講只看從現在起的再一單位，不看已經做完的平均數。
