  image: 'art/match-scene.jpg'
  kicker_en: 'FIN-01'
  kicker_zh: 'FIN-01'
  kicker_zh_hk: 'FIN-01'
  title_en: 'When the star sits out'
  title_zh: '球星没有上场，由谁承担？'
  title_zh_hk: '球星沒有上場，由誰承擔？'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Would you pay extra for a ticket that refunds you if the star never plays? On 4 February 2024, fans came to Hong Kong Stadium hoping to see Lionel Messi play for Inter Miami. The match went ahead. Messi stayed on the bench. That event is background. The ticket offers that follow are fictional classroom assumptions, not a news report and not the later historical refund.'
  zh: '球星整场都没上，你会多花一点钱买退款保障吗？2024年2月4日，观众到香港大球场，希望看到梅西代表国际迈阿密比赛。比赛照常踢完，梅西一直坐在替补席。这只是背景。接下来的两种门票，是虚构的课堂假设，不是当时的售票方案，也不是后来实际公布的退款。'
  zh_hk: '球星成場都冇上陣，你會唔會多畀少少錢，買一張有退款保障嘅票？2024年2月4日，球迷去香港大球場，想睇美斯代表國際邁阿密上陣。比賽照常踢完，美斯就一直坐喺後備席。呢件事只係背景。跟住講嘅兩種門票，係虛構嘅課堂假設，唔係當日嘅售票安排，亦唔係賽後公布嘅退款。'
