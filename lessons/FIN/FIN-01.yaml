  stage: false
  en: 'Imagine you are selling tickets for the next exhibition, and the headline player may miss the match. Before sales open, you must decide what to promise. A standard ticket costs eight hundred Hong Kong dollars and pays no refund if the star sits out.'
  zh: '假设你在销售下一场表演赛的门票，而主角有可能缺席。开售之前，你要先决定向观众承诺什么。普通票八百港元，球星不上场也不退款。'
  zh_hk: '假設下一場表演賽由你賣飛，但首席球星可能成場都唔上。開售之前，你要先決定承諾啲乜。普通票八百港元，球星唔上都冇退款。'
- id: 'b2twooffersb2'
  visual: 'table_grid'
  seconds: 13
  title_en: 'Same seat, HK$ each'
  title_zh: '同一座位，两种票'
  title_zh_hk: '同一座位，兩種門票'
  kicker_en: 'FIN-01'
  kicker_zh: 'FIN-01'
  kicker_zh_hk: 'FIN-01'
  rows: 2
  cols: 2
  row1_en: 'Standard'
  row1_zh: '普通票'
  row1_zh_hk: '普通票'
  row2_en: 'Protected'
  row2_zh: '保障票'
  row2_zh_hk: '保障票'
  col1_en: 'Pay today'
  col1_zh: '今天付款'
  col1_zh_hk: '今天付款'
  col2_en: 'Refund if star sits out'
  col2_zh: '球星未上场可退'
  col2_zh_hk: '球星未上場可退'
  c11: '800'
  c12: '0'
  c21: '850'
  c22: '400'
  footer_en: 'Same seat for both tickets'
  footer_zh: '两张票进同一场'
  footer_zh_hk: '兩種票睇同一場'
  stage: false
  en: 'A protected ticket costs eight hundred and fifty, and pays a four-hundred-dollar refund automatically if the star misses the entire match. Both tickets admit the fan to the same game.'
  zh: '保障票八百五十港元，如果球星整场都没有上场，就自动退回四百港元。两张票进的是同一场比赛。'
  zh_hk: '保障票八百五十港元；如果球星成場都冇上，就按約定自動退四百港元。兩種票睇嘅係同一場比賽。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Which ticket would you buy?'
  sentence_zh: '你会买哪一种？'
  sentence_zh_hk: '你會買哪一種？'
  en: 'Which ticket would you buy? And if you are the organizer, what would you need to know before asking people to pay that extra fifty dollars? Choose a provisional position, then pause here before the medical update.'
  zh: '你会买哪一种票？如果你是主办方，在向观众多收这五十港元之前，还需要知道什么？先给出暂定判断，然后在这里暂停，再看医务评估。'
  zh_hk: '你會買邊種票？如果你係主辦單位，向觀眾多收五十港元之前，仲要知道啲乜？先揀一個暫時嘅答案。喺度暫停，投完票先睇傷病估計。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 24
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Medical update'
  sentence_zh: '第二轮 · 伤病有了估计'
  sentence_zh_hk: '第二輪 · 傷病有了估計'
  en: 'Your team now estimates a one-in-five chance that the star will miss the entire match. Both tickets still admit the fan to the same game, and a protected ticket pays its refund automatically. The question is no longer only which ticket feels safer. At that probability, will the extra fifty dollars cover the expected refunds?'
  zh: '你的团队现在估计，球星整场都不上场的机会是五分之一。两种票仍然进入同一场比赛，保障票的退款会自动支付。问题不再只是哪张票让人更安心。按这个概率，多收的五十港元，够不够覆盖预期退款？'
  zh_hk: '球隊而家估計，球星成場缺席嘅機會係五分之一。兩種票仍然睇同一場比賽，保障票亦會自動退款。問題唔再只係邊張票令人安心。按呢個概率，五十港元保障費，夠唔夠應付預期退款？'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Will the extra HK$50 cover expected refunds?'
  sentence_zh: '按这个概率，每张保障票多收的50港元，能不能盖住预期退款？'
  sentence_zh_hk: '按這個概率，每張保障票多收的50港元，夠不夠應付預期退款？'
  en: 'Take a second position before the numbers are laid out. Will fifty dollars cover the expected refund, or is the promise underpriced? Pause here, then we will calculate it from both sides of the sale.'
  zh: '先不要急着看答案，再表一次态。五十港元够不够覆盖预期退款？这个承诺是不是定价偏低？请在这里暂停，然后我们从买卖两边一起算。'
  zh_hk: '先唔好睇答案，再投一次。五十港元夠唔夠應付預期退款？定係呢項承諾收得太平？暫停諗一諗，跟住我哋從買賣雙方嘅角度計。'
- id: 'b6calculation'
  visual: 'steps'
  seconds: 12
  layout: 'rows'
  title_en: '100 protected seats'
  title_zh: '一百张保障票'
  title_zh_hk: '一百張保障票'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: '100 x 50 = 5,000 premiums'
  step1_zh: '保障费 100 x 50 = 5,000'
  step1_zh_hk: '保障費 100 x 50 = 5,000'
  step2_en: 'If out: 100 x 400 = 40,000'
  step2_zh: '缺席则 100 x 400 = 40,000'
  step2_zh_hk: '缺席就 100 x 400 = 40,000'
  step3_en: 'At 20%: 0.2 x 40,000 = 8,000'
  step3_zh: '20%时预期赔付 8,000'
  step3_zh_hk: '20%時預期賠償 8,000'
  s1_en: 'For every one hundred protected seats, the organizer collects five thousand dollars in premiums.'
  s1_zh: '每售出一百张保障票，主办方收到五千港元保障费。'
  s1_zh_hk: '每賣出一百張保障票，主辦單位收五千港元保障費。'
  s2_en: 'If the player sits out, all one hundred buyers receive four hundred dollars: a forty-thousand-dollar payout on the same day.'
  s2_zh: '一旦球星不上场，这一百位买家都会得到四百港元，同一天要赔付四万港元。'
  s2_zh_hk: '球星一缺席，一百個人就各退四百港元，同一日要付四萬港元。'
  s3_en: 'At a twenty-percent chance, the expected payout is eight thousand.'
  s3_zh: '按百分之二十的机会，预期赔付是八千港元。'
  s3_zh_hk: '缺席概率係兩成，預期賠償就係八千港元。'
- id: 'b6calculationp2'
  visual: 'definition_card'
  seconds: 10
  title_en: '100 protected seats'
  title_zh: '一百张保障票'
  title_zh_hk: '一百張保障票'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  formula_en: '8,000 - 5,000 = 3,000 gap'
  formula_zh: '差额 8,000 - 5,000 = 3,000'
  formula_zh_hk: '差額 8,000 - 5,000 = 3,000'
  gloss_en: 'Per ticket: 0.2 x 400 = 80'
  gloss_zh: '每张预期退款 0.2 x 400 = 80'
  gloss_zh_hk: '每張預期退款 0.2 x 400 = 80'
  s1_en: 'The expected shortfall is three thousand, or thirty dollars per ticket.'
  s1_zh: '预期缺口是三千港元，也就是每张票三十港元。'
  s1_zh_hk: '保障費唔夠嘅差額係三千，即係每張票三十港元。'
  s2_en: 'The extra fifty dollars does not cover the expected refund of eighty dollars: one fifth of four hundred.'
  s2_zh: '多收的五十港元，覆盖不了八十港元的预期退款，也就是四百港元的五分之一。'
  s2_zh_hk: '五十港元保障費，應付唔到八十港元預期退款；八十就係四百嘅五分之一。'
- id: 'b7pricethepromise'
  visual: 'whatis_definition'
  seconds: 31
  kicker_en: 'FIN-01'
  kicker_zh: 'FIN-01'
  kicker_zh_hk: 'FIN-01'
  sentence_en: 'Break-even premium: HK$80'
  sentence_zh: '销量不变、办理退款又不另花钱时，保障费要收到80港元才刚好打平。'
  sentence_zh_hk: '若銷量不變，而辦理退款又不另計成本，保障費要收到80港元才剛剛打和。'
  en: 'Eighty dollars is the break-even premium if sales volume stays fixed and administering refunds is free. A lower premium could still make sense if the guarantee attracts enough extra buyers. A risk-averse buyer might pay more than the expected refund for protection. But selling more protected tickets does not diversify this risk: one player’s absence triggers every refund, so a larger crowd increases the payout due on the same day.'
  zh: '如果销量不变，办理退款又不另花钱，保障费要收到八十港元才刚好打平。收得更低也可能有道理，但要靠这项保证吸引足够多的额外买家。厌恶风险的观众，也可能愿意付得比预期退款更高。不过，多卖保障票不能分散这种风险。'
  zh_hk: '如果銷量不變，辦理退款又唔另計成本，保障費要收八十港元先打和。收少啲都可能有道理，但要靠呢項保證帶嚟足夠嘅額外觀眾。厭惡風險嘅買家，亦可能肯畀多過預期退款嘅價錢。不過，多賣保障票唔會分散呢種風險。'
- id: 'b7pricethepromise2'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'FIN-01'
  kicker_zh: 'FIN-01'
  kicker_zh_hk: 'FIN-01'
  sentence_en: 'If volume is fixed and refunds cost nothing to administer'
  sentence_zh: '定得更低仍可能说得通，前提是这项保证能多带来足够的买票人。'
  sentence_zh_hk: '定得較低仍然可以成立，條件是這項保證能帶來足夠的額外觀眾。'
  en: 'The organizer still needs enough cash to pay all claims together. Would you raise the premium to eighty, keep it at fifty, or drop the guarantee?'
  zh: '同一名球星缺席，会同时触发全部退款；人越多，同一天要付的钱越多。主办方仍得备好现金，一起支付这些退款。你会提到八十、维持五十，还是取消保证？'
  zh_hk: '同一名球星缺席，會同時觸發全部退款；人愈多，同一日要付嘅錢就愈多。主辦單位仍然要準備足夠現金，一次過退款。你會加到八十、維持五十，定取消保證？'
- id: 'b8transferandcaveat'
  visual: 'whatis_definition'
  seconds: 18
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'What happened in Hong Kong?'
  sentence_zh: '2024年2月9日，Tatler Asia宣布：经官方销售渠道购买的门票，可退一半票款。'
  sentence_zh_hk: '2024年2月9日，Tatler Asia宣布，經官方銷售渠道購買的門票可退回一半票款。'
  en: 'On 9 February 2024, Tatler Asia announced a fifty-percent refund for match tickets bought through official sales channels. Fans learned of that offer after the game. In this exercise, buyers know the refund terms before they decide whether to purchase.'
  zh: '2024年2月9日，Tatler Asia 宣布，经官方销售渠道购买的比赛门票可获五成退款。观众是在比赛之后才知道这个安排。但在本练习里，买家在决定买不买之前，就已经知道退款条款。'
  zh_hk: '2024年2月9日，Tatler Asia公布，經官方銷售渠道買嘅門票可以退一半票款。球迷係賽後先知道。今次練習唔同：買唔買之前，退款條件已經寫明。'
- id: 'b8transferandcaveat2'
  visual: 'whatis_definition'
  seconds: 15
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: '9 February 2024: Tatler Asia announced a 50% refund'
  sentence_zh: '观众是赛后才知道的。'
  sentence_zh_hk: '球迷是賽後才得悉。'
  en: 'How might announcing the same refund before kickoff change who buys a ticket? The classroom prices and the one-in-five chance remain invented assumptions, not a forecast of any future match.'
  zh: '如果同样的退款在开赛前就公布，谁会来买票，可能会有什么不同？课堂里的票价和五分之一机会，仍然是虚构假设，不是对未来任何一场比赛的预测。'
  zh_hk: '如果開賽前就公布同樣退款，會唔會吸引咗唔同嘅人買票？練習嘅票價同五分之一機會，都係虛構假設，唔係對下一場比賽嘅預測。'
