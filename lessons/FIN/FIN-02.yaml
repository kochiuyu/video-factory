  en: 'Treat that forecast as certain for this first round. Would you take the lease at one hundred and ten thousand? What is the most you could pay and still do as well as walking away?'
  zh: '第一轮先把这个预测当作确定。你会不会按十一万港元接下这个租约？你最多能出多少，仍然不差过今天放弃？'
  zh_hk: '十一萬港元嘅租約，接唔接？你最多可以付幾多，結果都唔會差過而家放棄？'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 8
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Take the lease at HK$110,000?'
  sentence_zh: '110,000港元的租约，你接不接？'
  sentence_zh_hk: '110,000港元的租約，你接不接？'
  en: 'Take a provisional vote and name your ceiling. Pause here before a competing service is announced.'
  zh: '先做暂定表决，并说出你的出价上限。请在这里暂停，再听竞争对手的消息。'
  zh_hk: '先投一次票，再講你嘅出價上限。喺度暫停，跟住先公布競爭路線。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 20
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'A parallel service starts halfway through the lease'
  sentence_zh: '第二轮 · 来了平行线路'
  sentence_zh_hk: '第二輪 · 來了平行路線'
  en: 'Before you sign, a competing bus operator announces a parallel service starting halfway through your lease. For the final one hundred and twenty-five days, you expect daily fares to fall to one thousand eight hundred dollars. Your costs, and the first-half forecast, stay the same.'
  zh: '在你签字之前，一家竞争巴士营运商宣布，会在你租期过半时开办一条平行路线。后一百二十五天，你预计每天车费会降到一千八百港元。成本不变，前半段的预测也不变。'
  zh_hk: '簽約之前，另一間巴士公司宣布，租約過咗一半就開平行路線。後面一百二十五日，你預計每日車費跌到一千八百港元。成本同前半段預測都不變。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 13
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Sign at HK$110,000, lower the offer, or walk away?'
  sentence_zh: '你按原价签约、压低出价，还是不接手？'
  sentence_zh_hk: '你按原價簽約、壓低出價，還是不接手？'
  en: 'Do you sign at the original price, make a lower offer, or walk away? Give the owner your revised ceiling, then pause before we compare the two bids.'
  zh: '你会按原价签字、降低出价，还是放弃？先向车主给出修订后的上限，然后暂停，再比较两次出价。'
  zh_hk: '你會照原價簽、壓低出價，定唔接手？先向車主報一個新嘅出價上限。暫停計一計，再比較。'
- id: 'b6twoceilings'
  visual: 'steps'
  seconds: 12
  layout: 'rows'
  title_en: 'Two bid ceilings'
  title_zh: '两个出价上限'
  title_zh_hk: '兩個出價上限'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: '(2,000 - 1,500) x 250 = 125,000'
  step1_zh: '(2,000 - 1,500) x 250 = 125,000'
  step1_zh_hk: '(2,000 - 1,500) x 250 = 125,000'
  step2_en: '125,000 - 110,000 = 15,000 ahead'
  step2_zh: '比放弃多 15,000'
  step2_zh_hk: '比放棄多 15,000'
  step3_en: '125 x 500 + 125 x 300 = 100,000'
  step3_zh: '新上限 = 100,000'
  step3_zh_hk: '新上限 = 100,000'
  s1_en: 'At first, five hundred dollars a day for two hundred and fifty days leaves one hundred and twenty-five thousand for the lease.'
  s1_zh: '起初，每天剩下五百港元，乘以二百五十天，租约最多值十二万五千港元。'
  s1_zh_hk: '起初每日淨得五百港元，乘二百五十日，留畀租約嘅就係十二萬五千港元。'
  s2_en: 'Paying one hundred and ten thousand leaves you fifteen thousand ahead of walking away.'
  s2_zh: '付出十一万，仍比放弃多一万五千。'
  s2_zh_hk: '付十一萬，仍然比放棄多一萬五千。'
  s3_en: 'With competition, the second half earns only three hundred a day.'
  s3_zh: '出现竞争后，后半段每天只剩三百港元。'
  s3_zh_hk: '有競爭之後，後半段每日只淨得三百。'
- id: 'b6twoceilingsp2'
  visual: 'definition_card'
  seconds: 12
  title_en: 'Two bid ceilings'
  title_zh: '两个出价上限'
  title_zh_hk: '兩個出價上限'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  formula_en: '110,000 is 10,000 worse'
  formula_zh: '按要价比放弃差 10,000'
  formula_zh_hk: '按要價比放棄差 10,000'
  gloss_en: 'Cut: 200 x 125 = 25,000'
  gloss_zh: '少收 200 x 125 = 25,000'
  gloss_zh_hk: '少收 200 x 125 = 25,000'
  s1_en: 'The new ceiling is one hundred and twenty-five days at five hundred, plus one hundred and twenty-five days at three hundred, which is one hundred thousand.'
  s1_zh: '新的上限是一百二十五天乘五百，再加一百二十五天乘三百，等于十万港元。'
  s1_zh_hk: '新上限係一百二十五日乘五百，加一百二十五日乘三百，合共十萬港元。'
  s2_en: 'At the asking price you would lose ten thousand relative to walking away.'
  s2_zh: '若仍按要价支付，你会比放弃差一万港元。'
  s2_zh_hk: '如果仍然付十一萬，就比放棄蝕一萬。'
- id: 'b7whythebidchangesto'
  visual: 'whatis_definition'
  seconds: 24
  kicker_en: 'FIN-02'
  kicker_zh: 'FIN-02'
  kicker_zh_hk: 'FIN-02'
  sentence_en: 'The bus can still be full today'
  sentence_zh: '今天车上仍然坐满，出价为什么可以先跌？'
  sentence_zh_hk: '今天車上仍然滿座，出價為何可以先跌？'
  en: 'Why can the bid fall while the bus is still full today? A buyer values the earnings ahead. A two-hundred-dollar daily fare loss over one hundred and twenty-five future days cuts the bid by twenty-five thousand today. In this exercise we ignore within-year interest, and the lease payment itself is due at year end.'
  zh: '为什么今天车子仍可能坐满，出价却已经要下调？因为买家看的是未来还能赚多少。后面一百二十五天，每天少收二百港元车费，就会把今天的出价上限下调二万五千港元。本练习忽略年内利息，而租约款项本身是年底才支付。'
  zh_hk: '今日架車仲坐滿人，點解出價已經可以跌？因為買家買緊往後嘅收入。未來一百二十五日，每日少收二百港元，出價上限就要少二萬五千。呢個練習唔計年內利息，租約本身亦係年底先付款。'
- id: 'b8transferandcaveat'
  visual: 'whatis_definition'
  seconds: 18
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'If the competitor started after this lease, this year’s cash flows would not change'
  sentence_zh: '0–3分钟：投票，并请学生报出最高出价。'
  sentence_zh_hk: '0–3分鐘：投票，並請學生報出最高出價。'
  en: 'Would the same announcement change your bid if the competitor started the day after this lease expired? For this one-year lease, it would have no direct effect. A licence that can earn income for many years could still lose value.'
  zh: '如果竞争对手是在这份一年租约结束后的第二天才开线，同样的消息会不会改变出价？就这份租约本身，它没有直接影响。但如果牌照还能多年营运，它的价值仍可能下降。'
  zh_hk: '如果競爭路線喺租約屆滿後第二日先開，今次消息仲會唔會影響出價？對呢份一年租約，冇直接影響。但一張可以賺好多年嘅牌照，價值仍然可能跌。'
- id: 'b8transferandcaveat2'
  visual: 'whatis_definition'
  seconds: 13
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'A longer-lived licence could still lose value'
  sentence_zh: '3–7分钟：公布竞争线路何时开始，两人一组重新议价。'
  sentence_zh_hk: '3–7分鐘：公布競爭路線何時開始，二人一組重新議價。'
  en: 'Buyers would then also consider how long the loss lasts, alternative routes, and the present value of future earnings. The lease, the fares and the competing route remain classroom assumptions.'
  zh: '那时买家还要考虑损失会持续多久、有没有替代路线，以及未来收入的现值。这份租约、车费和竞争路线，仍然是课堂假设。'
  zh_hk: '到時仲要睇損失持續幾耐、有冇其他路線，同未來收入嘅現值。租約、收入同競爭路線，都係課堂假設。'
