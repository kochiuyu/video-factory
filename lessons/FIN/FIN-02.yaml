youtube:
  description_en: 'Classroom assumptions, not a news report. This lesson follows the official Micro Cases page “The red minibus bid”. Slide figures are the published case figures. Mandarin and Cantonese narration use those facts in classroom speech. Source: https://kochiuyu.github.io/micro-cases/minibus.html'
  description_zh: '课堂假设，不是新闻报道。本课跟随正式微案例《这辆红色小巴，你出多少？》。幻灯片上的数字来自已发布的案例。普通话讲授用课堂口语说明这些事实，专业名词用正式译名。来源：https://kochiuyu.github.io/micro-cases/minibus.html'
  description_zh_hk: '課堂假設，不是新聞報道。本課跟隨正式微案例《這輛紅色小巴，你出多少？》。投影片上的數字來自已發布的案例。粵語講授用課堂口語說明這些事實，專業名詞用正式寫法。來源：https://kochiuyu.github.io/micro-cases/minibus.html'
