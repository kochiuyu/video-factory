  en: 'Your forecast for two hundred and fifty operating days is two thousand dollars a day in fares and one thousand five hundred a day in costs, including what your own working time is worth.'
  zh: '你的预测是：营运二百五十天，每天车费两千港元，每天成本一千五百港元，其中已经包括你自己劳动时间的价值。'
  zh_hk: '你預計做二百五十日，每日收兩千港元車費，成本一千五百港元，已經計埋你自己時間嘅價值。第一輪先當預測確定。'
