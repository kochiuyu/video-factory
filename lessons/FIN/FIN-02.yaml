  kicker_en: 'FIN-02'
  kicker_zh: 'FIN-02'
  kicker_zh_hk: 'FIN-02'
  title_en: 'The red minibus bid'
  title_zh: '这辆红色小巴，你出多少？'
  title_zh_hk: '這輛紅色小巴，你出多少？'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'What would you bid for a red minibus? An owner offers you the vehicle and the right to operate it for one year. The asking price is one hundred and ten thousand Hong Kong dollars, payable at year end.'
  zh: '这辆红色小巴，你会出多少？车主把车和一年营运权交给你，要价十一万港元，年底才付。车费归你，营运开支由你承担，年终交还车辆。'
  zh_hk: '一輛紅色小巴，你會出幾多？車主畀你架車同一年營運權，要價十一萬港元，年底先畀。車費歸你，營運開支由你負責，年終交還架車。'
- id: 'hookb2'
  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'FIN-02'
  kicker_zh: 'FIN-02'
  kicker_zh_hk: 'FIN-02'
  sentence_en: 'Vehicle and one-year operating right'
  sentence_zh: '车主把一辆红色小巴连同一年营运权出让给你。'
  sentence_zh_hk: '車主把一輛紅色小巴連同一年營運權出讓給你。'
  en: 'You keep the fares, cover the running costs, and return the bus at the end. You can walk away today. This is a fictional classroom lease, not a real licence sale.'
  zh: '今天不接手也完全可以。这是虚构的课堂租约，不是真实的牌照买卖。'
  zh_hk: '你今日唔接手亦得。呢份係虛構嘅課堂租約，唔係真實牌照買賣。'
