  visual: 'steps'
  seconds: 16
  layout: 'rows'
  title_en: 'Same margin, new timing'
  title_zh: '同样的贡献，时点变了'
  title_zh_hk: '同樣的貢獻，時點變了'
  kicker_en: 'FIN-03'
  kicker_zh: 'FIN-03'
  kicker_zh_hk: 'FIN-03'
  step1_en: '120,000 - 50,000 - 30,000 = 40,000'
  step1_zh: '增量贡献 = 40,000'
  step1_zh_hk: '增量貢獻 = 40,000'
  step2_en: 'Round 1 low, with start: 40,000'
  step2_zh: '第一轮最低含起点 40,000'
  step2_zh_hk: '第一輪最低連起點 40,000'
  step3_en: 'Day 90: 40,000 - 50,000 = -10,000'
  step3_zh: '第90天材料后 -10,000'
  step3_zh_hk: '第90天材料後 -10,000'
  s1_en: 'The order still adds forty thousand before tax and financing costs: one hundred and twenty thousand minus fifty thousand minus thirty thousand.'
  s1_zh: '税和融资成本之前，这张单仍然带来四万港元增量贡献，就是十二万减五万再减三万。'
  s1_zh_hk: '呢張單喺稅項同融資成本之前，仍然增添四萬港元，即十二萬減五萬再減三萬。'
  s2_en: 'In round one, cash rises from forty thousand to one hundred and sixty thousand when the customer pays, falls to one hundred and ten thousand after materials, and ends at eighty thousand after staff are paid.'
  s2_zh: '第一轮，客户付款后现金从四万升到十六万，付材料后剩十一万，付人工后剩八万。'
  s2_zh_hk: '第一輪，收錢後由四萬升到十六萬；買材料後剩十一萬；付人工後剩八萬。'
  s3_en: 'The lowest balance after acceptance, including the starting point, is forty thousand.'
  s3_zh: '把起点也算进去，最低是四万，安全缓冲一直守得住。'
  s3_zh_hk: '計埋起點，最低係四萬，安全緩衝一直守得住。'
- id: 'b6samemarginunfundedp2'
  visual: 'steps'
  seconds: 23
  layout: 'rows'
  stage: false
  title_en: 'Same margin, new timing'
  title_zh: '同样的贡献，时点变了'
  title_zh_hk: '同樣的貢獻，時點變了'
  kicker_en: 'FIN-03'
  kicker_zh: 'FIN-03'
  kicker_zh_hk: 'FIN-03'
  step1_en: 'After staff: -40,000'
  step1_zh: '付人工后 -40,000'
  step1_zh_hk: '付人工後 -40,000'
  step2_en: 'Negative means unfunded, no overdraft'
  step2_zh: '负数是缺口，不是透支额度'
  step2_zh_hk: '負數係缺口，唔係透支額'
  en: 'The buffer is never threatened. In round two, paying for materials today would take cash to minus ten thousand, and after staff to minus forty thousand. Those negative figures show an unfunded requirement, not an overdraft you already have. A positive day-ninety ending balance of eighty thousand cannot pay today’s supplier.'
  zh: '第二轮，今天付材料会降到负一万，再付人工就负四万。这两个负数表示资金还没落实，不是说你已经有透支。第九十天最后能剩八万，也付不了今天的供应商。'
  zh_hk: '第二輪就唔同。今日付材料會跌到負一萬，再付人工就負四萬。負數表示資金未落實，唔係話你已經有透支。第九十日就算結餘有八萬，都畀唔到今日嘅供應商。'
- id: 'b7thedepositthatkeep'
  visual: 'steps'
  seconds: 31
  layout: 'rows'
  stage: false
  title_en: 'Deposit that keeps 20,000'
  title_zh: '守住两万的订金'
  title_zh_hk: '守住兩萬的訂金'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'Low = 40,000 + D - 50,000 - 30,000'
  step1_zh: '最低 = 40,000 + D - 80,000'
  step1_zh_hk: '最低 = 40,000 + D - 80,000'
  step2_en: 'Low >= 20,000 needs D >= 60,000'
  step2_zh: '要守住 20,000，D 至少 60,000'
  step2_zh_hk: '要守住 20,000，D 至少 60,000'
  step3_en: '50% deposit: 50,000 then 20,000'
  step3_zh: '五成订金：材料后 50,000，人工后 20,000'
  step3_zh_hk: '五成訂金：材料後 50,000，人工後 20,000'
  en: 'Negotiate the timing, not just the price. With a deposit D, the lowest balance before day ninety is forty thousand plus D, minus fifty thousand, minus thirty thousand. Keeping this at or above twenty thousand requires a deposit of at least sixty thousand: a fifty-percent deposit. With that deposit, cash is fifty thousand after materials, twenty thousand after staff, and eighty thousand after the remaining sixty thousand arrives on day ninety.'
  zh: '所以不只要谈价格，还要谈付款时点。订金是D，第九十天之前的最低余额就是四万加D，减五万再减三万。要守住两万，订金至少要六万，也就是五成。这样，付完材料剩五万，付完人工剩两万，第九十天收到余下六万后回到八万。'
  zh_hk: '所以要傾付款時點，唔只係傾價錢。訂金係D，第九十日之前嘅最低餘額就係四萬加D，減五萬再減三萬。要守住兩萬，D至少要六萬，即五成訂金。咁樣，畀完材料剩五萬，畀完人工剩兩萬，第九十日收到餘款六萬後就有八萬。'
- id: 'b7thedepositthatkeepp2'
  visual: 'steps'
  seconds: 20
  layout: 'rows'
  stage: false
  title_en: 'Deposit that keeps 20,000'
  title_zh: '守住两万的订金'
  title_zh_hk: '守住兩萬的訂金'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'Day 90 remainder 60,000; end 80,000'
  step1_zh: '第90天余款 60,000，期末 80,000'
  step1_zh_hk: '第90日餘款 60,000，期末 80,000'
  step2_en: 'D = 40,000 only avoids a negative'
  step2_zh: '四万订金只是避免负数'
  step2_zh_hk: '四萬訂金只係避免負數'
  en: 'A forty-thousand deposit merely avoids a negative balance; it does not preserve the safety buffer. Do not commit until the agreed deposit is received or suitable finance is confirmed. If neither is available and the buffer is binding, declining is defensible despite the attractive margin.'
  zh: '四万订金只能让余额不变负，保不住安全缓冲。约定订金到账，或者合适融资落实之前，不要承诺接单。两样都没有，又必须守住缓冲，即使增量贡献很吸引人，拒单也说得通。'
  zh_hk: '四萬訂金只係令餘額唔變負，守唔住安全緩衝。訂金到帳，或者合適融資落實之前，唔好承諾接單。兩樣都冇，又一定要留兩萬，張單有錢賺都可以拒絕。'
- id: 'b8transfercheckpause'
  visual: 'whatis_definition'
  seconds: 10
  kicker_en: 'Facilitator'
  kicker_zh: '引导提问'
  kicker_zh_hk: '引導提問'
