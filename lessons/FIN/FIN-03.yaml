  en: 'You run a fictional Hong Kong promotional-gift packing workshop. A new customer offers your biggest order yet: one hundred and twenty thousand dollars. You have spare capacity, so it will not displace other work. The initial quote requires full payment today, before materials are bought. You have forty thousand in available cash and must keep at least twenty thousand as a safety buffer.'
  zh: '你经营一家虚构的香港礼品包装工场。新客户带来迄今最大的订单，十二万港元。工场有剩余产能，不会挤掉其他工作。最初说好今天先收齐货款，再买材料。你有四万港元可用现金，至少要留下两万作安全缓冲。'
  zh_hk: '你經營一間虛構嘅香港禮品包裝工場。新客戶落咗至今最大一張單，十二萬港元。工場有剩餘產能，唔會擠走其他工作。原本講好今日收齊錢，先買材料。你有四萬港元可用現金，至少要留兩萬作安全緩衝。'
