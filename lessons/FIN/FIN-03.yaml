  title_en: 'The biggest order, the smallest cash balance'
  title_zh: '最大的订单，最紧的现金'
  title_zh_hk: '最大的訂單，最緊的現金'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Would you accept a profitable order if the money arrives after the bills? On 18 July 2025, Atradius published a survey of Hong Kong business-to-business payment practices. It described cash-flow pressure from overdue invoices, even while firms still offered credit to keep sales. That survey is background, not a forecast for the fictional workshop that follows.'
  zh: '一张赚钱的订单，如果要先付完账单才收到货款，你还接吗？2025年7月18日，Atradius公布香港企业对企业付款习惯调查。企业为了保住销售和客户关系，继续给客户赊账，但逾期发票已经压着现金流。调查只是背景，不是对接下来这家虚构工场的预测。'
  zh_hk: '一張有錢賺嘅單，如果要付晒帳先收到錢，你仲接唔接？2025年7月18日，Atradius公布香港企業對企業付款習慣調查。企業想留住生意，繼續畀客賒帳，但逾期發票同時壓住現金流。呢份調查只係背景，唔係對跟住呢間虛構工場嘅預測。'
