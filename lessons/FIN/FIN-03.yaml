- id: 'b9transferandcaveat'
  visual: 'whatis_definition'
  seconds: 33
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'The low point, not just the ending balance, sets the funding need'
  sentence_zh: '要多少资金，看的是余额的低点，不是最后剩下多少。'
  sentence_zh_hk: '需要多少資金，看的是餘額的低點，不是最後剩下多少。'
  en: 'The low point, not just the ending balance, determines how much funding is needed. If we relax the certainty assumption, a late payment, a rejected delivery or an extra production cost could deepen or extend the gap. Borrowing can bridge timing, but fees reduce the margin, and a loan is not available merely because the order is profitable. Receivables finance has eligibility, timing and recourse conditions: an unpaid invoice is not automatically cash today.'
  zh: '决定需要多少资金的，是现金最低点，而不只是期末余额。如果不再假定收款确定，客户晚付、拒收货物，或生产成本增加，都可能让缺口更深、更长。借款可以弥补时点差异，但费用会吃掉利润；订单赚钱，并不等于一定借得到钱。应收账款融资还有资格、时点和追索权条件：未收回的发票，不会自动变成今天的现金。'
  zh_hk: '要幾多資金，睇嘅係現金低點，唔只係最後結餘。如果唔再假定準時收錢，遲付、拒收貨或者成本超支，都會令缺口更深或者更長。借款補到時間差，但費用會食咗一部分增量貢獻；有錢賺唔等於貸款已批。應收帳款融資亦要睇資格、時點同追索權，未收妥嘅發票唔會自動變成今日嘅現金。'
