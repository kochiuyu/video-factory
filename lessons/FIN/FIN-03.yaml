  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'The customer will now pay HK$120,000 on day 90'
  sentence_zh: '第二轮 · 改了一个事实'
  sentence_zh_hk: '第二輪 · 改了一個事實'
  en: 'The customer now requests one change: pay the one hundred and twenty thousand on day ninety instead of today. The price, the delivery date and the cost schedule stay the same. For this calculation, assume the customer will pay exactly on day ninety.'
  zh: '客户现在只改一项：十二万港元改到第90天才付，而不是今天付。价格、交货日和成本时间表都不变。在这一轮计算里，假定客户会在第90天准时全额付款。'
  zh_hk: '客戶而家只改一樣：十二萬港元唔係今日畀，改到第九十日先畀。價格、交貨日同成本時間表都不變。呢輪計算先假定佢喺第九十日準時付清。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Still accept?'
  sentence_zh: '按客户的要求接受、谈一笔订金，还是拒单？'
  sentence_zh_hk: '按客戶的要求接受、商議訂金，還是拒單？'
  en: 'Would you still accept? Without a deposit or finance, can you pay the supplier and the staff on schedule? Name the lowest cash balance before day ninety, then pause for the calculation.'
  zh: '你还会接吗？如果没有订金，也没有融资，你还能按期支付材料和人手吗？请先说出第90天前的最低现金余额，然后暂停，再看计算。'
  zh_hk: '你仲接唔接？冇訂金、冇融資，材料同人工可唔可以準時畀？先講第九十日之前最低現金餘額會係幾多。暫停計一計。'
