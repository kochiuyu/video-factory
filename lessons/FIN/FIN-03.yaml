  en: 'Other receipts and payments are separately funded. No costs have yet been committed, and declining leaves your forty thousand unchanged. After the customer pays today, you buy materials for fifty thousand, and on day seven you pay thirty thousand for additional packing staff and delivery. Ignore taxes, interest and default risk for the first vote.'
  zh: '其他业务收支另有资金安排，成本也都还没承诺。拒单的话，四万保持不变。今天收到货款后，花五万买材料；第七天再付三万额外包装人工并交货。第一次投票先不计税、利息和违约风险。'
  zh_hk: '其他業務收支另有資金，成本亦全部未承諾。唔接單，四萬就維持不變。今日收到客戶嘅錢之後，畀五萬買材料；第七日再畀三萬額外包裝人工並交貨。第一次投票先唔計稅項、利息同違約風險。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Accept the order on these terms?'
  sentence_zh: '按这些条件接不接？'
  sentence_zh_hk: '按這些條件接不接？'
  en: 'Accept the order on these terms? Calculate what it adds to earnings, and the lowest cash balance after acceptance, including the starting point. Pause here before one fact changes.'
  zh: '按这些条件，你会接单吗？请算出它能增加多少盈利，以及接单后的最低现金余额，起点也要算进去。请在这里暂停，再看一项事实的变化。'
  zh_hk: '照呢啲條件，接唔接？先計呢張單增添幾多收益，再搵接單後現金餘額嘅最低點，記得計埋起點。喺度暫停，跟住先改一個事實。'
