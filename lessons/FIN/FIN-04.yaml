  en: 'These are invented comparison rates, not current quotes or forecasts. No probabilities are supplied, and we ignore conversion fees. No financial product has been priced or purchased.'
  zh: '把发票金额全部买下，两种汇率相差五千港元。这些是虚构的比较汇率，不是当前报价，也不是预测。题目没有概率，也不计兑换费用，没有金融产品已经报价或买下。'
  zh_hk: '整張發票買足，兩種匯率就差五千。呢啲係虛構比較匯率，唔係即時報價或者預測。題目冇概率，亦唔計兌換費用，冇任何金融產品已經報價或者買咗。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 13
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Seek certainty for the full invoice, leave it uncertain, or check other yen cash flows first?'
  sentence_zh: '你会为整张发票锁死预算、让金额继续不确定，还是先去核对其他日元收付？'
  sentence_zh_hk: '你會為整張發票鎖定預算、讓金額繼續不確定，還是先核對其他日元收付？'
  en: 'Would you seek budget certainty for the full invoice, leave the amount uncertain, or check other yen cash flows first? What information could change your answer? Pause here.'
  zh: '你会为整张发票锁定预算，自己承担金额不确定，还是先核对其他日元收付？什么信息会让你改主意？请在这里暂停。'
  zh_hk: '你會為成張發票鎖定預算、自己承擔不確定性，定先核對其他日元收付？咩資料會令你改答案？喺度暫停。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 23
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'A customer receipt of JPY600,000 is due the same day, before the supplier cutoff'
  sentence_zh: '第二轮 · 改了一个事实'
  sentence_zh_hk: '第二輪 · 改了一個事實'
  en: 'Your accounts colleague finds a separate customer receipt of six hundred thousand yen, due before the supplier settlement cutoff on the same day. For this classroom base case, assume that receipt is certain, unrestricted and available in time, so those yen can be used directly to pay the supplier, with no currency conversion.'
  zh: '会计同事发现，另有一笔六十万日元的客户收款，会在同一天、供应商结算截止前到账。在这个课堂基础情形里，假定这笔收款是确定的、没有限制、并且及时可用，因此可以直接用来支付供应商，不必兑换。'
  zh_hk: '會計搵到另一筆六十萬日元客戶收款，同一日、供應商結算截止之前到期。課堂基準先假定，呢筆錢確定會到、不受限制，而且來得及動用，可以直接畀供應商，唔使兌換。'
- id: 'b4reveal2'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Assumed certain, unrestricted and on time for this base case'
  sentence_zh: '会计同事找到另一笔客户收款： JPY600,000 。'
  sentence_zh_hk: '會計同事找到另一筆客戶收款： JPY600,000 。'
  en: 'There are no other yen payments. The supplier still receives the full one million yen. Real receipts are not automatically certain; we temporarily remove default and timing risk only to isolate the matching decision.'
  zh: '没有其他日元付款。供应商仍然收到完整的一百万日元。现实中的客户收款并不自动确定；我们只是暂时去掉违约和时点风险，以便单独讨论货币匹配。'
  zh_hk: '冇其他日元付款。供應商仍然收足一百萬日元。真實收款唔會自動咁確定；我哋只係暫時抽走違約同時點風險，單獨睇貨幣配對。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'How many yen must you now buy with Hong Kong dollars?'
  sentence_zh: '现在还要用港元买进多少日元？'
  sentence_zh_hk: '現在還要用港元買入多少日元？'
  en: 'How many yen must you now buy with Hong Kong dollars? Would you seek certainty for that amount, and what must be true for your plan to work? Pause, then calculate.'
  zh: '现在还要用港元买入多少日元？要不要为这个金额寻求确定？计划要成立，必须满足什么条件？请暂停，再计算。'
  zh_hk: '而家仲要用港元買幾多日元？你會唔會為呢個金額尋求確定性？個計劃要行得通，有乜條件一定要成立？暫停再計。'
- id: 'b6theunmatchedamount'
  visual: 'steps'
  seconds: 26
  layout: 'rows'
  stage: false
  title_en: 'Yen still to buy'
  title_zh: '仍要买入的日元'
  title_zh_hk: '仍要買入的日元'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: '1,000,000 - 600,000 = 400,000 yen'
  step1_zh: '仍须买入 400,000 日元'
  step1_zh_hk: '仍須買入 400,000 日元'
  step2_en: '400,000 x 0.050 = HK$20,000'
  step2_zh: '0.050 时额外 20,000 港元'
  step2_zh_hk: '0.050 時額外 20,000 港元'
  step3_en: '400,000 x 0.055 = HK$22,000'
  step3_zh: '0.055 时额外 22,000 港元'
  step3_zh_hk: '0.055 時額外 22,000 港元'
  en: 'Start with the supplier payment of one million yen. Use the available customer receipt of six hundred thousand. The remaining yen to buy are four hundred thousand. At five cents per yen that costs twenty thousand Hong Kong dollars; at five and a half cents, twenty-two thousand. The difference in additional Hong Kong-dollar funding is two thousand, not five thousand.'
  zh: '先看供应商这一百万日元付款，再用上可用的六十万日元客户收款。仍须买入的日元是四十万。按每日元五港仙，需要两万港元；按五点五港仙，需要两万二千港元。额外港元资金的差额是两千，不是五千。'
  zh_hk: '由一百萬日元供應商付款開始，扣返可用嘅六十萬收款，仲要買四十萬日元。每一日元五港仙，就要兩萬港元；五點五港仙，就要兩萬二千。額外港元資金相差兩千，唔係五千。'
- id: 'b6theunmatchedamountp2'
  visual: 'steps'
  seconds: 21
  layout: 'rows'
  stage: false
  title_en: 'Yen still to buy'
  title_zh: '仍要买入的日元'
  title_zh_hk: '仍要買入的日元'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'Gap is 2,000, not gross 5,000'
  step1_zh: '差额是 2,000，不是 5,000'
  step1_zh_hk: '差額係 2,000，唔係 5,000'
  step2_en: 'Invoice stays JPY 1,000,000'
  step2_zh: '发票仍是 1,000,000 日元'
  step2_zh_hk: '發票仍係 1,000,000 日元'
  en: 'This matching is often called a natural hedge: an operating receipt offsets an operating payment in the same currency. It does not cancel either contract, and the supplier still receives its full million yen. Do not say the invoice fell to four hundred thousand. It did not.'
  zh: '这种匹配常被称为自然对冲：同一货币的经营收款，去抵同一货币的经营付款。它并没有取消任何一份合同，供应商仍然收到完整的一百万日元。不要说发票降到了四十万。并没有。'
  zh_hk: '呢種配對叫自然對沖：同一貨幣嘅經營收款，抵銷同一貨幣嘅經營付款。兩份合約都冇取消，供應商仍然收足一百萬。唔好話發票跌到四十萬，張發票冇變。'
- id: 'b7whatcertaintydoesa'
  visual: 'whatis_definition'
  seconds: 27
  kicker_en: 'FIN-04'
  kicker_zh: 'FIN-04'
  kicker_zh_hk: 'FIN-04'
  sentence_en: 'Seeking certainty for JPY400,000 can make sense if the swing would strain cash'
  sentence_zh: '为 余下的400,000日元 寻求预算上的确定性，在港元支出不确定会把生意压紧时，可以说得通。'
  sentence_zh_hk: '為 餘下的400,000日元 尋求預算上的確定性，在港元支出不確定會把生意抽緊時，可以說得通。'
  en: 'Seeking budget certainty for the remaining four hundred thousand yen can make sense if an uncertain Hong Kong-dollar outlay would strain the business. Accepting that uncertainty can also be defensible if the cash buffer and risk policy allow it. The case supplies no instrument price, fees or probabilities, so it cannot show that a hedge is cheaper, free, or always better.'
  zh: '如果港元支出不确定会让企业周转紧张，为剩下四十万日元寻求预算确定性，可以说得通。如果现金缓冲和风险政策允许，自己承担也有道理。题目没有工具价格、费用或概率，不能说对冲更便宜、免费，或永远更好。'
  zh_hk: '如果港元支出不確定會令生意周轉緊張，為餘下四十萬日元鎖定預算，可以有道理。如果現金緩衝同風險政策容許，自己承擔亦講得通。題目冇工具價格、費用或者概率，唔能夠話對沖更平、免費，或者永遠更好。'
- id: 'b7whatcertaintydoesa2'
  visual: 'whatis_definition'
  seconds: 25
  kicker_en: 'FIN-04'
  kicker_zh: 'FIN-04'
  kicker_zh_hk: 'FIN-04'
  sentence_en: 'No hedge price or probabilities are given'
  sentence_zh: '若现金缓冲和风险政策容得下，把不确定性留下，也同样站得住。'
  sentence_zh_hk: '若現金緩衝和風險政策容得下，把不確定性留下，同樣站得住。'
  en: 'Hedging aims to manage uncertainty, not to prove that you can predict the yen. If you arrange to buy the full million as well as receiving six hundred thousand, the incoming yen are left to hold or convert. That creates another currency position. Gross-invoice protection is not automatically the right size for the net funding need.'
  zh: '对冲是管理不确定性，不是证明你能预测日元。收到六十万日元，又买足一百万，进来的日元还得持有或兑换，形成另一个货币头寸。按发票总额做保护，不一定符合净资金需要。'
  zh_hk: '對沖係管理不確定性，唔係證明你識預測日元。收到六十萬日元，又另外買足一百萬，入嚟嗰筆錢就仲要持有或者兌換，變成另一個貨幣持倉。按發票總額做保護，唔一定配合淨資金需要。'
- id: 'b8transfercheckpause'
  visual: 'whatis_definition'
  seconds: 10
  kicker_en: 'Facilitator'
  kicker_zh: '引导提问'
  kicker_zh_hk: '引導提問'
  sentence_en: 'If the customer receipt is late, can you still rely on buying only JPY400,000? Pause and explain which matching condition has failed.'
  sentence_zh: '如果客户收款迟到，还能只安排买四十万日元吗？暂停一下，说明哪一个匹配条件不再成立。'
  sentence_zh_hk: '客戶筆錢遲到，仲可唔可以只安排買四十萬日元？暫停，講清楚邊個配對條件唔成立。'
  en: 'If the customer receipt is late, can you still rely on buying only JPY400,000? Pause and explain which matching condition has failed.'
  zh: '如果客户收款迟到，还能只安排买四十万日元吗？暂停一下，说明哪一个匹配条件不再成立。'
  zh_hk: '客戶筆錢遲到，仲可唔可以只安排買四十萬日元？暫停，講清楚邊個配對條件唔成立。'
- id: 'b9transferandcaveat'
  visual: 'whatis_definition'
  seconds: 27
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'Before protecting a payment, check what already pays for it'
  sentence_zh: '真要靠一笔收款之前，先核对它的 币种、可用金额、到账时间和动用限制 。'
  sentence_zh_hk: '真要依靠一筆收款之前，先核對它的 幣種、可用金額、到帳時間和動用限制 。'
  en: 'Before relying on a real receipt, verify its currency, usable amount, arrival time and access restrictions, and check other commitments that may already need those yen. If the customer pays late or defaults, you may need to fund more than four hundred thousand yen by the supplier deadline. Currency matching does not remove credit risk or ensure cash arrives on time.'
  zh: '在把一笔真实收款纳入计划之前，要核实币种、可用金额、到账时间和使用限制，并检查是否已有其他承诺要用这些日元。如果客户晚付或违约，到供应商截止日期，你可能要筹措超过四十万日元。货币匹配消除不了信用风险，也不能保证现金准时到达。'
  zh_hk: '真係要靠客戶收款之前，先核對幣種、可用金額、到帳時間同動用限制，再睇有冇其他承諾要用呢筆錢。客戶遲付或者違約，到截止日可能要籌多過四十萬日元。自然對沖唔會消除信貸風險，亦唔保證準時收錢；呢啲風險只係喺基準計算排除咗。'
- id: 'b9transferandcaveat2'
  visual: 'whatis_definition'
  seconds: 24
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'Verify currency, amount, timing, access and other yen commitments'
  sentence_zh: '再看有没有其他承诺已经要用这些日元。'
  sentence_zh_hk: '再看有沒有其他承諾已經要用這些日元。'
  en: 'Those risks were excluded only for our base calculation. The twenty thousand versus twenty-two thousand comparison measures additional cash needed for this supplier payment. It is not the company’s total foreign-exchange profit, accounting valuation, or overall business exposure. The key idea: before protecting a payment, check what already pays for it.'
  zh: '这些风险只是在基础计算里被暂时排除。两万对两万二千的比较，衡量的是这笔供应商付款还需要多少额外现金，不是公司全部外汇利润、会计估值，或整体经营风险敞口。关键想法是：保护一笔付款之前，先看什么已经能够支付它。'
  zh_hk: '兩萬同兩萬二千比較緊嘅，係今次供應商付款額外要用嘅現金，唔係全公司外匯損益、會計估值或者整體外匯風險。記住：保護付款之前，先睇有乜已經喺度替佢付款。'
