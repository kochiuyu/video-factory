  row2_en: 'HK$0.055 per yen'
  row2_zh: '每日元 0.055 港元'
  row2_zh_hk: '每1日元 0.055 港元'
  col1_en: 'Yen bought'
  col1_zh: '买入日元'
  col1_zh_hk: '買入日元'
  col2_en: 'HK$ cost'
  col2_zh: '所需港元'
  col2_zh_hk: '所需港元'
  c11: '1,000,000'
  c12: '50,000'
  c21: '1,000,000'
  c22: '55,000'
  footer_en: 'Invented rates, not a forecast'
  footer_zh: '假设汇率，不是预测'
  footer_zh_hk: '假設匯率，不是預測'
  stage: false
  en: 'You own a Hong Kong stationery wholesaler. A Japanese supplier must receive one million yen in thirty days. Your first budget assumes you will buy all those yen with Hong Kong dollars on the payment date. At five Hong Kong cents per yen, that would cost fifty thousand dollars. At five and a half cents, it would cost fifty-five thousand: five thousand more if you bought the entire invoice.'
  zh: '你拥有一家香港文具批发店。三十天后，供应商必须收到一百万日元。第一份预算假定，付款当天全部用港元买。每一日元五分港元，就要五万港元；五点五分港元，就要五万五千。'
  zh_hk: '你擁有一間香港文具批發店。三十日後，供應商要收到一百萬日元。第一份預算假定，付款當日全部用港元買。每一日元值五港仙，就要五萬港元；值五點五港仙，就要五萬五千。'
