youtube:
  description_en: 'Classroom assumptions, not a news report. This lesson follows the official Micro Cases page “The invoice is not the exposure”. Slide figures are the published case figures. Mandarin and Cantonese narration use those facts in classroom speech. Source: https://kochiuyu.github.io/micro-cases/invoice-exposure.html'
  description_zh: '课堂假设，不是新闻报道。本课跟随正式微案例《发票金额，不是风险敞口》。幻灯片上的数字来自已发布的案例。普通话讲授用课堂口语说明这些事实，专业名词用正式译名。来源：https://kochiuyu.github.io/micro-cases/invoice-exposure.html'
  description_zh_hk: '課堂假設，不是新聞報道。本課跟隨正式微案例《發票金額，並非外匯風險》。投影片上的數字來自已發布的案例。粵語講授用課堂口語說明這些事實，專業名詞用正式寫法。來源：https://kochiuyu.github.io/micro-cases/invoice-exposure.html'
beats:
- id: 'hook'
  visual: 'still_image'
  seconds: 29
  image: 'art/invoice-exposure-scene.jpg'
  kicker_en: 'FIN-04'
  kicker_zh: 'FIN-04'
  kicker_zh_hk: 'FIN-04'
  title_en: 'The invoice is not the exposure'
  title_zh: '发票金额，不是风险敞口'
  title_zh_hk: '發票金額，並非外匯風險'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Must you buy every yen on a supplier invoice with Hong Kong dollars? In November 2025, Hong Kong-listed VTech described using foreign-exchange forwards for operating currency risks, and excluding speculative trades. In May 2025, Japanese distributor Marubun described matching dollar purchases with dollar sales. Neither company is the fictional stationery wholesaler below, and their policies do not tell this shop which product to buy.'
  zh: '发票上有多少日元，就一定要用港元买足多少吗？2025年11月，香港上市公司伟易达说明，会用外汇远期管理经营中的货币风险，不做投机交易。同年五月，日本流通商丸文说明，会把美元销售和美元采购相互匹配。两家都不是下面这家虚构文具批发店，它们的政策也不能决定这家店该买哪种产品。'
  zh_hk: '供應商發票有幾多日元，就一定要用港元買足咁多？2025年11月，香港上市公司偉易達講到，會用外匯遠期管理經營上嘅貨幣風險，唔做投機交易。同年五月，日本分銷商丸文講到，用美元銷售配對美元採購。兩間都唔係下面呢間虛構文具批發店，佢哋嘅政策亦唔代表呢間店應該買邊種產品。'
- id: 'b2thefirstbudget'
  visual: 'table_grid'
  seconds: 30
