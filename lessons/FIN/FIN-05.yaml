  en: 'A Hong Kong craft-workshop studio reviews its weather protection before the next storm season. The owner remembers losing business when customers could not attend. Its current interruption policy pays verified covered interruption loss only following insured physical damage at its own premises, up to one hundred thousand dollars. For this exercise there are no non-damage, access-denial, utility or supplier extensions, and we ignore deductibles and waiting periods solely to isolate the issue.'
  zh: '香港一家手作工坊，在风暴季之前检视天气保障。店主记得，客人来不了，当天的课就开不成。现行中断保单，只赔经核实、属于保障范围的中断损失，而且自己场所必须先发生承保的物质损失，上限十万港元。'
  zh_hk: '一間香港手作工作室喺風暴季之前檢視保障。負責人記得，客人嚟唔到，堂就開唔成。現有中斷保單，只賠經核實、屬保障範圍嘅中斷損失，而且自己處所要先發生受保嘅實質損毀，上限十萬港元。今次冇非損、不能到達、公用事業或者供應商嘅延伸保障。'
