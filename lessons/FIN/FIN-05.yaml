  en: 'For an additional two thousand dollars a year, the studio can increase that limit to two hundred thousand. Nothing else changes. The owner says: “Twice the protection should make us ready.”'
  zh: '练习没有非损、无法进入、公用事业或供应商的延伸保障。免赔额和等待期也先放下，只为看清这一条件。每年多付两千港元保费，就能把上限提到二十万，其他不变。店主说，保障变成两倍，我们就准备好了。'
  zh_hk: '自負額同等候期亦先放低，只為集中睇條件。每年多畀兩千港元保費，上限就加到二十萬，其他不變。負責人話，保障變兩倍，我哋就準備好。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 12
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Approve the higher limit now, keep the current limit, or investigate first?'
  sentence_zh: '你现在会批准更高的上限、维持现行上限，还是先查清楚？'
  sentence_zh_hk: '你現在會批准較高的上限、維持現有上限，還是先查清楚？'
  en: 'Would you approve the higher limit now, keep the current limit, or investigate first? What must you know before calling it twice the protection? Pause here.'
  zh: '你会现在批准提高保额、维持现行上限，还是先调查？在把它称为双倍保障之前，必须知道什么？请在这里暂停。'
  zh_hk: '你會而家批較高上限、維持現有上限，定先查清楚？叫佢兩倍保障之前，一定要知道啲乜？喺度暫停。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 27
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Planning scenario: a storm warning stops that day’s booked workshops'
  sentence_zh: '第二轮 · 改了一个事实'
  sentence_zh_hk: '第二輪 · 改了一個事實'
  en: 'The owner identifies the planning scenario: a storm warning prevents that day’s booked workshops from operating. No physical damage occurs at the studio. The studio incurs thirty thousand dollars of net interruption loss, after deducting expenses it does not incur. No other stated coverage trigger applies. This is a hypothetical scenario, not a forecast of its probability or an actual claim.'
  zh: '店主提出的规划情景是：因为风暴警告，当天已预订的工作坊无法开办。工作室本身没有发生物质损失。扣除那些不会再支出的费用后，净中断损失是三万港元。没有其他已列明的赔付触发条件适用。这只是假设情景，不是在预测它发生的机会，也不是真实索偿。'
  zh_hk: '負責人講清楚想應付嘅情景：風暴警告令當日預約咗嘅工作坊停開，但工作室冇實質損毀。扣咗冇發生嘅開支，中斷淨損失係三萬港元，亦冇其他觸發條件適用。呢個係假設情景，唔係概率預測，更唔係真實索償。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 12
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Does the higher limit address this scenario?'
  sentence_zh: '更高的上限覆盖这个情景吗？'
  sentence_zh_hk: '較高的上限是否涵蓋這個情景？'
  en: 'Does the higher limit address this scenario? Explain the payment under each limit, then identify what the owner should investigate next. Pause before the answer.'
  zh: '更高的保额能应对这个情景吗？请说明两种上限下各会赔付多少，然后指出店主下一步该查什么。先暂停，再看答案。'
  zh_hk: '較高上限幫唔幫到呢個情景？兩種上限分別賠幾多？負責人下一步應該查乜？暫停諗完先睇答案。'
- id: 'b6sameunmetcondition'
  visual: 'steps'
  seconds: 22
  layout: 'rows'
  stage: false
  title_en: 'This warning, no damage'
  title_zh: '这次警告，没有物质损失'
  title_zh_hk: '今次警告，沒有實質損毀'
  kicker_en: 'FIN-05'
  kicker_zh: 'FIN-05'
  kicker_zh_hk: 'FIN-05'
  step1_en: 'No insured damage: both pay 0'
  step1_zh: '未发生承保物质损失：两案都赔 0'
  step1_zh_hk: '未發生受保實質損毀：兩案都賠 0'
  step2_en: 'HK$30,000 net loss stays here'
  step2_zh: '30,000 净损失仍留在工坊'
  step2_zh_hk: '30,000 淨損失仍留喺工作室'
  en: 'Under the supplied terms, both options pay zero in this scenario. The required physical damage has not occurred. Raising the maximum payment does not change that condition. The thirty-thousand-dollar loss remains with the studio under either option, and the higher-limit option also costs two thousand more in annual premium.'
  zh: '按给定条款，这个情景下两种方案都赔零。所需的物质损失并没有发生。提高赔付上限，并不会改变这个条件。无论选哪一种，三万港元损失仍由工作室承担；选择更高上限，每年还要多付两千港元保费。'
  zh_hk: '照題目條款，兩種方案今次都賠零。必須有嘅實質損毀冇發生，加高最高賠償，改變唔到呢個條件。無論揀邊個，三萬港元損失都留喺工作室；加高上限仲要每年多畀兩千港元保費。'
- id: 'b6sameunmetconditionp2'
  visual: 'whatis_definition'
  seconds: 10
  kicker_en: 'FIN-05'
  kicker_zh: 'FIN-05'
  kicker_zh_hk: 'FIN-05'
  sentence_en: 'Higher limit costs 2,000 more'
  sentence_zh: '更高上限每年多 2,000'
  sentence_zh_hk: '較高上限每年多 2,000'
  en: 'Do not confuse a coverage limit with a promise to pay every business loss. A larger ceiling does not open a closed door.'
  zh: '不要把保额上限，当成对每一项经营损失的赔付承诺。天花板加高，打不开一扇还没有触发的门。'
  zh_hk: '賠償上限唔代表每一筆經營損失都會賠。門未開，加高天花板都冇用。'
- id: 'b7donotovergeneralis'
  visual: 'whatis_definition'
  seconds: 33
  kicker_en: 'FIN-05'
  kicker_zh: 'FIN-05'
  kicker_zh_hk: 'FIN-05'
  sentence_en: 'A different insured-damage loss above HK$100,000 could make the higher ceiling matter'
  sentence_zh: '不是。'
  sentence_zh_hk: '不是。'
  en: 'That does not make the higher limit useless. A different scenario involving insured physical damage could produce a covered interruption loss above one hundred thousand dollars, and a higher ceiling could then matter, subject to all terms. One uncovered scenario is not enough to decide the best policy. Consider also a separate fictional warning-trigger arrangement.'
  zh: '这并不表示更高保额没有用。如果另一情景涉及承保的物质损失，而且承保中断损失超过十万港元，在符合全部条款的前提下，更高上限仍然可能重要。一个未能获赔的情景，并不足以决定最佳保单。也可以看一个分开的、虚构的警告触发安排：如果指定的官方警告在既定营业时段内持续，无需物质损失，就定额赔付两万港元。'
  zh_hk: '但唔代表高上限完全冇用。另一個情景如果有受保實質損毀，中斷損失又超過十萬，符合全部條款時，高上限就可能重要。單憑一個唔賠嘅情景，揀唔到最好保單。再睇另一個虛構警告觸發安排：指定官方警告喺界定營業時段一直生效，就定額賠兩萬港元，唔要求實質損毀。'
- id: 'b7donotovergeneralis2'
  visual: 'whatis_definition'
  seconds: 30
  kicker_en: 'FIN-05'
  kicker_zh: 'FIN-05'
  kicker_zh_hk: 'FIN-05'
  sentence_en: 'Optional warning-trigger example: pays HK$20,000 if a stated official warning is met'
  sentence_zh: '另一个情景里，如果发生了承保的物质损失，中断损失可能超过100,000港元。'
  sentence_zh_hk: '另一個情景裏，若發生了受保的實質損毀，中斷損失可能超過100,000港元。'
  en: 'It pays a fixed twenty thousand dollars if a specified official warning persists throughout a defined operating-time window, without requiring physical damage. If that precise condition is met while the studio loses thirty thousand, the stated payment is twenty thousand, and ten thousand of the loss remains, before premiums. If the condition is not met, the payment is zero even if the studio still loses thirty thousand.'
  zh: '若该条件成立，而工作室损失三万，则赔付两万，尚未计入保费，仍剩一万缺口；若条件不成立，即使仍然损失三万，赔付也是零。这种可测量触发条件与实际损失之间的错配，称为基差风险。'
  zh_hk: '如果條件成立而損失三萬，賠兩萬後仲有一萬損失，未計保費。條件唔成立，就算損失仍然三萬，都係賠零。可量度觸發條件同實際損失對唔上，叫基礎風險。'
- id: 'b7donotovergeneralis3'
  visual: 'whatis_definition'
  seconds: 18
  kicker_en: 'FIN-05'
  kicker_zh: 'FIN-05'
  kicker_zh_hk: 'FIN-05'
  sentence_en: 'Then HK$10,000 of the HK$30,000 remains'
  sentence_zh: '那时更高的天花板才可能有用，而且仍受全部条款约束。'
  sentence_zh_hk: '那時較高的上限才可能用得上，而且仍受全部條款約束。'
  en: 'This mismatch between a measurable trigger and actual loss is called basis risk. It changes the gap rather than eliminating every gap. Do not treat this arrangement as a replacement for all existing property protection. Its premium is not supplied.'
  zh: '它改变缺口，而不是消除所有缺口。不要把这种安排当成现有财产保障的全面替代。案例也没有给出它的保费。'
  zh_hk: '佢改變缺口，唔係消除晒缺口。唔好當佢全面取代原有財產保障，佢嘅保費亦冇提供。'
- id: 'b8transfercheckpause'
  visual: 'whatis_definition'
  seconds: 11
  kicker_en: 'Facilitator'
  kicker_zh: '引导提问'
  kicker_zh_hk: '引導提問'
  sentence_en: 'Does one uncovered scenario make the higher limit useless in every other scenario? Pause and explain the condition you must check before comparing the ceiling.'
  sentence_zh: '一个不赔的情景，就说明更高上限在所有情景里都没用吗？暂停一下，先说比较上限之前必须查哪项条件。'
  sentence_zh_hk: '今次唔賠，就代表高上限其他情景都冇用？暫停，先講比較上限前要查乜條件。'
  en: 'Does one uncovered scenario make the higher limit useless in every other scenario? Pause and explain the condition you must check before comparing the ceiling.'
  zh: '一个不赔的情景，就说明更高上限在所有情景里都没用吗？暂停一下，先说比较上限之前必须查哪项条件。'
  zh_hk: '今次唔賠，就代表高上限其他情景都冇用？暫停，先講比較上限前要查乜條件。'
- id: 'b9nextreviewandcavea'
  visual: 'whatis_definition'
  seconds: 24
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'Match loss mechanisms to actual triggers, terms, limits and premiums'
  sentence_zh: '请合资格的顾问，把真实合同的承保事件、地点、延伸、除外、限额、等待期、免赔额和损失定义，与工作室面对的风险对照。'
  sentence_zh_hk: '請合資格的顧問，把真實合約的受保事件、地點、延伸、除外、限額、等候期、自負額和損失定義，與工作室面對的風險對照。'
  en: 'Ask a qualified adviser to compare the actual contract’s insured events, locations, extensions, exclusions, limits, waiting periods, deductibles and loss definitions with the studio’s exposures. Real policies differ from our simplified terms. Consider affordable reserves and safe continuity measures alongside insurance.'
  zh: '请合资格顾问对照真实合同里的承保事件、地点、延伸保障、除外、限额、等待期、免赔额和损失定义，与工作室的风险是否匹配。真实保单与我们的简化条款不同。除了保险，也要考虑可负担的储备，以及安全的持续经营措施。'
  zh_hk: '下一步，請合資格顧問逐項對照真實合約嘅受保事件、地點、延伸、除外、限額、等候期、自負額同損失定義。真實保單唔同我哋嘅簡化條款。保險以外，仲要諗負擔得起嘅儲備，同安全嘅持續經營措施。'
- id: 'b9nextreviewandcavea2'
  visual: 'whatis_definition'
  seconds: 20
  kicker_en: 'Caveat'
  kicker_zh: '课堂边界'
  kicker_zh_hk: '課堂邊界'
  sentence_en: 'Consider reserves and safe continuity measures'
  sentence_zh: '真实保单和我们的简化条款不一样。'
  sentence_zh_hk: '真實保單和我們的簡化條款並不相同。'
  en: 'Never operate during unsafe weather merely to reduce a loss. No probabilities or complete alternatives are supplied, so an optimal insurance purchase cannot be calculated here. The question is how to finance and reduce disruption, not whether to ignore safety guidance.'
  zh: '绝不可以只为减少损失，在不安全的天气下继续营业。案例没有给出概率或完整替代方案，因此无法在这里算出最优投保选择。问题是如何为中断筹资并降低影响，而不是要不要忽略安全指引。'
  zh_hk: '唔可以為咗減少損失，喺危險天氣繼續開門。題目冇概率同完整替代方案，計唔到最優投保選擇。問題係點樣為中斷安排資金、減少影響，唔係可唔可以唔理安全指引。'
