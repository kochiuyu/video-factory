  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'B: 48 monthly payments of HK$2,500'
  sentence_zh: '完整还款表显示 A要连续24个月、每月还4,500港元；B要连续48个月、每月还2,500港元 。'
  sentence_zh_hk: '完整還款表顯示 A要連續24個月、每月供4,500港元；B要連續48個月、每月供2,500港元 。'
  en: 'There are no deposits, balloon payments, extra fees or variable rates. Assume scheduled repayment throughout, with no early settlement or refinancing. Both loans still advance the same one hundred thousand dollars.'
  zh: '全程按表偿还，没有提前还款或再融资。两笔实际拨付的现金，都还是十万港元。'
  zh_hk: '全程照表還，冇提早清還，亦冇再融資。兩筆實際借出的現金，都係十萬港元。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'What is each loan’s total repayment?'
  sentence_zh: '每笔贷款一共要还多少？'
  sentence_zh_hk: '每筆貸款一共要供多少？'
  en: 'How much would each loan require in total, and what would financing cost above the one hundred thousand advanced? Which benefit does B really offer, and what business evidence would justify paying for it? Pause, then calculate.'
  zh: '两笔贷款总共要还多少？高出贷出的十万港元，融资成本各是多少？B真正提供的好处是什么？要有什么经营证据，才值得为它多付？请暂停，再计算。'
  zh_hk: '兩筆各共供幾多？高出借出十萬港元嘅融資成本，各係幾多？B真正畀到你嘅好處係乜？有乜經營證據，先值得為呢種好處畀錢？暫停再計。'
- id: 'b6totalsarenotthemon'
  visual: 'steps'
  seconds: 24
  layout: 'rows'
  stage: false
  title_en: 'Total is not the instalment'
  title_zh: '总额不是月供'
  title_zh_hk: '總額唔係供款'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'A: 4,500 x 24 = 108,000'
  step1_zh: 'A：4,500 x 24 = 108,000'
  step1_zh_hk: 'A：4,500 x 24 = 108,000'
  step2_en: 'A finance cost: 108,000 - 100,000 = 8,000'
  step2_zh: 'A 融资成本 8,000'
  step2_zh_hk: 'A 融資成本 8,000'
  step3_en: 'B: 2,500 x 48 = 120,000'
  step3_zh: 'B：2,500 x 48 = 120,000'
  step3_zh_hk: 'B：2,500 x 48 = 120,000'
  en: 'A requires one hundred and eight thousand dollars: four thousand five hundred times twenty-four. Its financing cost above the cash advanced is eight thousand. B requires one hundred and twenty thousand: two thousand five hundred times forty-eight. Its financing cost is twenty thousand. Over the complete schedules, B requires twelve thousand more than A.'
  zh: 'A总共还十万八千港元，就是四千五百乘二十四；高出拨付现金的融资成本是八千。B是二千五百乘四十八，共十二万，融资成本两万。完整还款表相比，B多付一万二千。'
  zh_hk: 'A總共供十萬八千港元，即四千五百乘二十四；高出借出現金嘅融資成本係八千。B就係二千五百乘四十八，總共十二萬，融資成本兩萬。完整還款表比較，B多一萬二千。'
- id: 'b6totalsarenotthemonp2'
  visual: 'steps'
  seconds: 18
  layout: 'rows'
  stage: false
  title_en: 'Total is not the instalment'
  title_zh: '总额不是月供'
  title_zh_hk: '總額唔係供款'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'B finance cost 20,000; extra 12,000'
  step1_zh: 'B 多 12,000 融资成本'
  step1_zh_hk: 'B 多 12,000 融資成本'
  step2_en: 'Undiscounted total, not an APR'
  step2_zh: '未折现总额，不是实际年利率'
  step2_zh_hk: '未折現總額，唔係實際年利率'
  en: 'These are undiscounted totals under the stated all-in assumptions. They are not annual percentage rates, and they are not a present-value ranking. Do not divide the total financing cost by the number of years and call the result an APR.'
  zh: '这些是在全部费用已包含的假设下、未经折现的总额，不是实际年利率，也不是现值排序。不要把融资总成本除以年数，就叫作实际年利率。'
  zh_hk: '呢啲係全部費用已包含、未經折現嘅總額，唔係實際年利率，亦唔係現值排序。唔好將融資總成本除年數，就叫佢實際年利率。'
- id: 'b7reliefnowpaymentsl'
  visual: 'whatis_definition'
  seconds: 23
  kicker_en: 'FIN-06'
  kicker_zh: 'FIN-06'
  kicker_zh_hk: 'FIN-06'
  sentence_en: 'Months 1–24: B requires HK$2,000 less each month'
  sentence_zh: '第1至24个月，B每月少还2,000港元。'
  sentence_zh_hk: '第1至24個月，B每月少供2,000港元。'
  en: 'During months one to twenty-four, B requires two thousand dollars less each month. That is genuine near-term cash-flow relief. It may matter when wages and parts must be paid before customers settle invoices. During months twenty-five to forty-eight, A has finished, while B still requires two thousand five hundred each month.'
  zh: '在第1到第24个月，B每月少付两千港元。这是真实的近期现金流缓解，当工资和零件要在客户付款前支付时，这可能很重要。到了第25到第48个月，A已经还清，B却仍要每月支付二千五百港元。'
  zh_hk: '第一至二十四個月，B每月少供兩千，真係幫到近期現金流。工資同零件要早過客戶付款先畀，呢點可能好重要。但第二十五至四十八個月，A供完，B仲要每月供二千五百。'
- id: 'b7reliefnowpaymentsl2'
  visual: 'whatis_definition'
  seconds: 20
  kicker_en: 'FIN-06'
  kicker_zh: 'FIN-06'
  kicker_zh_hk: 'FIN-06'
  sentence_en: 'Months 25–48: A has finished; B still requires HK$2,500 a month'
  sentence_zh: '这是真实的近期现金流缓解。'
  sentence_zh_hk: '這是真實的近期現金流舒緩。'
  en: '“Two thousand saved every month” is therefore not a description of the whole borrowing period. Smaller instalments do not make B the lower-total-cost loan. Nor does the lower total make A automatically the better business decision if its earlier payments create an unacceptable cash shortfall.'
  zh: '所以，“每月节省两千”并不是整段借款期的描述。月供较低，并不能让B成为总成本更低的贷款。反过来，总成本较低，也不表示A一定是更好的经营选择——如果前期付款会造成无法接受的现金缺口。'
  zh_hk: '所以話每個月慳兩千，唔適用於成段借貸期。月供少，唔等於B總成本低；A總成本低，亦唔等於一定適合，如果頭段供款會造成接受唔到嘅現金缺口。'
