  en: 'That must be the cheaper loan.” The bookkeeper has the monthly figures but has not yet checked the full payment schedules. Future monthly cash flows have not been supplied, and no return on retained cash is assumed. This is a provisional recommendation, not approval to sign an incomplete contract.'
  zh: '簿记员已有月供数字，但还没有核对完整还款表。未来每月现金流尚未提供，也不假设留存现金有回报。现在只做暂定建议，不是批准签署一份尚未完整的合同。'
