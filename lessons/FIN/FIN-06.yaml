- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 12
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Provisionally favour B for its smaller payments?'
  sentence_zh: '你会因为B每月少还，就暂时偏向B吗？'
  sentence_zh_hk: '你會否因為B每月供得少，就暫時偏向B？'
  en: 'Would you provisionally favour B for its smaller payments? What must you check before calling it cheaper, or deciding the workshop can afford either loan? Pause here.'
  zh: '你会不会因为月供较低，就暂选B？在称它更便宜，或判断工场负担得起任何一笔贷款之前，还要核对什么？请在这里暂停。'
  zh_hk: '你會因為B月供少，就暫時揀B？話佢更平，或者判斷維修店供唔供得起之前，仲要核對乜？喺度暫停。'
- id: 'b4reveal'
  visual: 'whatis_definition'
