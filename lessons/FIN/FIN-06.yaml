  title_en: 'Smaller payments. Cheaper loan?'
  title_zh: '月供更少，贷款就更便宜吗？'
  title_zh_hk: '供款少了，這筆貸款就更平嗎？'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Is the loan with the smaller monthly payment the cheaper loan? On 29 April 2026, the Hong Kong Monetary Authority announced further measures supporting small and medium-sized enterprises, including more flexible repayment arrangements and tenor extensions.'
  zh: '月供少一点，就是更便宜的贷款吗？2026年4月29日，香港金融管理局公布进一步支持中小企业的措施，包括更灵活的还款安排和延长还款期。'
  zh_hk: '每月供少啲，就一定係更平嘅貸款？2026年4月29日，金管局宣布進一步支持中小企嘅措施，包括更靈活嘅還款安排同延長還款期。'
