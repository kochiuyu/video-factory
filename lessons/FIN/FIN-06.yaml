  sentence_zh: '如果现金预测支持选B，怎样建议才不会把它说成更便宜？暂停一下，同时说出它的好处和多付的总成本。'
  sentence_zh_hk: '現金預測如果支持B，你會點建議，又唔會話佢更平？暫停，講清楚好處同多付嘅總成本。'
  en: 'If a cash forecast favours B, how would you recommend it without calling it cheaper? Pause and state both the benefit and the extra total cost.'
  zh: '如果现金预测支持选B，怎样建议才不会把它说成更便宜？暂停一下，同时说出它的好处和多付的总成本。'
  zh_hk: '現金預測如果支持B，你會點建議，又唔會話佢更平？暫停，講清楚好處同多付嘅總成本。'
- id: 'b9chooseagainsttheca'
  visual: 'whatis_definition'
  seconds: 26
  kicker_en: 'FIN-06'
  kicker_zh: 'FIN-06'
  kicker_zh_hk: 'FIN-06'
  sentence_en: 'Test both schedules against a month-by-month cash forecast and a buffer'
  sentence_zh: '做一份逐月现金预测，包括设备安装、客户回款、工资、零件，以及一份审慎的缓冲。'
  sentence_zh_hk: '做一份逐月現金預測，包括設備安裝、客戶收款、工資、零件，以及一份審慎的緩衝。'
  en: 'Prepare a month-by-month cash forecast, including installation, collections, wages, parts and a prudent buffer, and stress-test slower collections or weak trading. If both loans are safely affordable and other terms are equivalent, A has the lower total financing cost in this example. If early cash pressure is serious, B may be worth its higher total cost.'
  zh: '请做一份逐月现金流预测，包括设备安装、客户收款、工资、零件和审慎储备，并测试收款变慢或生意转弱的情况。如果两笔贷款都安全可负担，而且其他条款相当，在这个例子里，A的总融资成本较低。如果前期现金压力很大，B虽然总成本更高，仍可能值得。'
  zh_hk: '做份逐月現金預測，計埋安裝、收款、工資、零件同審慎緩衝，再壓測收款慢咗或者生意差咗。如果兩筆都安全地供得起，其他條款又相當，呢個例子A嘅融資總成本較低。如果前期真係周轉緊，B可能值得多畀。'
