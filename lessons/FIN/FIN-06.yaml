  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'A: 24 monthly payments of HK$4,500'
  sentence_zh: '第二轮 · 改了一个事实'
  sentence_zh_hk: '第二輪 · 改了一個事實'
  en: 'The full schedules show that A requires twenty-four monthly payments of four thousand five hundred dollars, and B requires forty-eight monthly payments of two thousand five hundred. Both begin next month. For this simplified comparison, these payments include all financing charges.'
  zh: '完整还款表出来了。A连续二十四个月，每月还四千五百港元；B连续四十八个月，每月还二千五百。两笔都下个月开始。简化比较假定，还款已经包含全部融资费用，没有订金、期末大额还款、额外费用或浮动利率。'
  zh_hk: '完整還款表出咗：A連續二十四個月，每月四千五百；B連續四十八個月，每月二千五百。兩筆都下個月開始。簡化比較假定供款已包晒融資費用，冇訂金、期末大額還款、額外費用或者浮動利率。'
