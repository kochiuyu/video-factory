  sentence_en: 'HKMA, 29 April 2026: more flexible SME repayment'
  sentence_zh: '2026年4月29日，香港金融管理局宣布进一步支持中小企业的措施，包括更灵活的贷款偿还安排和延长还款期，以及支持企业转型。'
  sentence_zh_hk: '2026年4月29日，香港金融管理局宣布進一步支持中小企的措施，包括更有彈性的還款安排和延長還款期，以及支持企業轉型。'
  en: 'Flexibility can help a business manage cash, but flexibility and a lower total financing cost are different benefits. The repair workshop and quotes below are fictional. They are not offers under that programme.'
  zh: '灵活还款能帮助调度现金，但灵活和融资总成本更低，是两种不同的好处。下面的维修店和报价都是虚构的，不是这个计划的产品。'
