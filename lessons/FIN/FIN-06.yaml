  en: 'A Hong Kong appliance-repair workshop needs one hundred thousand dollars for replacement equipment. Two lenders have sent financing quotes. Each would advance exactly one hundred thousand. Quote A asks for four thousand five hundred a month; Quote B asks for two thousand five hundred a month. The owner favours B: “We keep two thousand more each month for wages and parts.'
  zh: '一家香港电器维修店，需要十万港元更换设备。两家贷款人都愿意正好贷出十万港元。报价A每月四千五百港元，报价B每月二千五百港元。店主倾向B，说：“我们每月多留两千支付工资和零件，那一定是更便宜的贷款。”'
