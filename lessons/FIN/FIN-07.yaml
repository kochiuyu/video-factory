  en: 'The accounts team supplies the payment-run schedule. Without the discount, five already-early customers pay one hundred thousand each on day ten, and five later customers pay one hundred thousand each on day sixty. With the blanket offer, all ten still take the discount and pay ninety-eight thousand on day ten.'
  zh: '会计团队提供了付款时间表。没有折扣时，五家本来就会提早的客户，各在第10天支付十万港元；另外五家较晚的客户，各在第60天支付十万港元。推出一揽子折扣后，十家仍会接受折扣，并在第10天支付九万八千。'
  zh_hk: '會計交出付款時間表。冇折扣，五個本來就早付嘅客戶，第十日各畀十萬；其餘五個第六十日各畀十萬。有劃一折扣，十個都接受，第十日各畀九萬八千。'
