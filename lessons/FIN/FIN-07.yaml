  title_en: 'A discount for paying sooner. Sooner than what?'
  title_zh: '提早付款有折扣。比什么更早？'
  title_zh_hk: '提早付款有折扣。早過甚麼？'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'A discount for paying sooner — sooner than what? On 7 May 2026, the Hong Kong Monetary Authority launched the CargoX Pilot Programme to explore cargo and trade data in SME trade finance. That is context for examining real payment information, not evidence that a particular discount improves financing. The supplier, invoices and costs below are fictional and unrelated to that pilot.'
  zh: '提早付款有折扣，但到底比什么更早？2026年5月7日，香港金融管理局推出CargoX试点计划，探索把货物和贸易数据用于中小企业贸易融资。这只是审视真实付款信息的背景，不能证明某项折扣改善了融资。下面的供应商、发票和成本都是虚构的，与试点无关。'
  zh_hk: '提早付款有折扣，但係早過乜？2026年5月7日，金管局推出CargoX試點計劃，探索用貨物同貿易數據做中小企貿易融資。呢個背景提醒我哋要睇真實付款資料，唔代表某項折扣一定改善融資。下面供應商、發票同成本全部虛構，同呢個試點無關。'
