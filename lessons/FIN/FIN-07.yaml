- id: 'b6payfortenaccelerat'
  visual: 'steps'
  seconds: 24
  layout: 'rows'
  stage: false
  title_en: 'Ten takers, five accelerations'
  title_zh: '十人接受，五笔加速'
  title_zh_hk: '十人接受，五筆加速'
  kicker_en: 'FIN-07'
  kicker_zh: 'FIN-07'
  kicker_zh_hk: 'FIN-07'
  step1_en: 'Early five: discount 10,000, save 0'
  step1_zh: '早付五人：折扣 10,000，融资节省 0'
  step1_zh_hk: '早付五人：折扣 10,000，融資節省 0'
  step2_en: 'Later five: save 5 x 3,000 = 15,000'
  step2_zh: '较晚五人节省 15,000'
  step2_zh_hk: '較遲五人節省 15,000'
  en: 'Five customers already pay on day ten. Their discount reduces receipts by ten thousand dollars without changing timing or avoiding any of the specified financing cost. The other five really move from day sixty to day ten. Their ten thousand of discounts avoids fifteen thousand in financing cost, a five-thousand benefit for that group.'
  zh: '五家客户本来就会在第10天付款。给他们折扣，收款少了一万港元，时点却没有改变，也避免不了任何既定的融资成本。另外五家才真正从第60天提前到第10天：一万港元折扣，避免了一万五千融资成本，这个组别净好处五千。'
  zh_hk: '五個本來第十日就畀。畀折扣佢哋，少收一萬，時間冇變，題目嘅融資成本一毫都避唔開。其餘五個先真係由第六十日提早到第十日。畀佢哋一萬折扣，避開一萬五千成本，嗰組淨好處五千。'
- id: 'b6payfortenacceleratp2'
  visual: 'steps'
  seconds: 30
  layout: 'rows'
  stage: false
  title_en: 'Ten takers, five accelerations'
  title_zh: '十人接受，五笔加速'
  title_zh_hk: '十人接受，五筆加速'
  kicker_en: 'FIN-07'
  kicker_zh: 'FIN-07'
  kicker_zh_hk: 'FIN-07'
  step1_en: '15,000 - 20,000 = -5,000 net'
  step1_zh: '净成本 5,000'
  step1_zh_hk: '淨成本 5,000'
  step2_en: '985,000 versus receipts 980,000'
  step2_zh: '比较 985,000 与 980,000'
  step2_zh_hk: '比較 985,000 同 980,000'
  en: 'The blanket offer therefore avoids fifteen thousand and costs twenty thousand: a five-thousand net cost, rather than the opening ten-thousand benefit. Ten takers do not mean ten accelerated payments. Equivalently, without the offer the supplier collects one million and incurs fifteen thousand of relevant financing cost, leaving nine hundred and eighty-five thousand in this comparison.'
  zh: '因此，一揽子折扣避免了一万五千，却付出两万折扣，净成本是五千港元，而不是开头那种一万净好处。十家接受折扣，并不等于十笔收款都被提前。换一个算法：没有优惠时，供应商收到一百万，并承担一万五千相关融资成本，这个比较下剩下九十八万五千；有优惠时，收款九十八万，也没有相关过渡成本。'
  zh_hk: '所以劃一折扣一共避開一萬五千，代價兩萬，係淨成本五千，唔係開頭嘅好處一萬。十個接受，唔等於十筆提早。換個計法，冇折扣收一百萬，扣一萬五千相關融資成本，比較裏剩九十八萬五千；有折扣收九十八萬，冇相關過渡成本。'
- id: 'b6payfortenacceleratp3'
  visual: 'whatis_definition'
  seconds: 13
  kicker_en: 'FIN-07'
  kicker_zh: 'FIN-07'
  kicker_zh_hk: 'FIN-07'
  sentence_en: '3,000 is a supplied marginal cost'
  sentence_zh: '3,000 是给定的边际成本'
  sentence_zh_hk: '3,000 係给定的邊際成本'
  en: 'With the offer, receipts are nine hundred and eighty thousand with no relevant bridge cost. These are receipt-and-financing comparisons after cancelling loan principals, not end-of-day bank balances or whole-company profit.'
  zh: '这些是在本金相互抵销后的收款与融资比较，不是当天银行余额，也不是全公司利润。'
  zh_hk: '呢個係抵銷貸款本金後嘅收款同融資比較，唔係日終銀行結餘，更唔係全公司利潤。'
- id: 'b7rejectthisoffernot'
  visual: 'whatis_definition'
  seconds: 28
  kicker_en: 'FIN-07'
  kicker_zh: 'FIN-07'
  kicker_zh_hk: 'FIN-07'
  sentence_en: 'On these cost-only facts, keep existing terms'
  sentence_zh: '更小的折扣、不同的时间，或一组说得通的适用客户，也许值得评估。'
  sentence_zh_hk: '較小的折扣、不同的時間，或一組說得通的適用客戶，也許值得評估。'
  en: 'On the stated cost-only facts, retain existing terms rather than make that blanket offer. A smaller discount or different terms could still be evaluated. Targeting later payers would require relationship, fairness, contract, administration and future-incentive checks. Do not assume that rewarding later payers is automatically appropriate, and do not assume the remaining problems away.'
  zh: '按既定的、只计算成本的事实，不应推出这项一揽子折扣，而应维持现行条款。更小的折扣，或不同的条款，仍可以另行评估。若只针对较晚付款的客户，还要检查客户关系、公平性、合同、行政成本和日后诱因。不要假定奖励较晚付款的客户一定合适，也不要把其余问题假设掉。'
  zh_hk: '只睇題目寫明嘅成本，應該維持現有條款，唔好提出呢份劃一折扣。細啲折扣或者其他條款，仍然可以評估。但只針對較遲付款嗰組，要先查客戶關係、公平、合約、行政成本同之後嘅誘因。唔好當獎勵較遲付款一定合適，亦唔好假定其餘問題已經解決。'
- id: 'b8transfercheckpause'
  visual: 'whatis_definition'
  seconds: 9
  kicker_en: 'Facilitator'
  kicker_zh: '引导提问'
