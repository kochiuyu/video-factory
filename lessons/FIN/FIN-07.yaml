  footer_en: 'Assumes all ten move day 60 to day 10'
  footer_zh: '假定十张都从第60天到第10天'
  footer_zh_hk: '假定十張都由第60天到第10天'
  s1_en: 'An exhibition-display supplier has ten existing, undisputed invoices of one hundred thousand dollars each, issued on day zero and formally due on day sixty. It is considering a one-off two-percent discount for payment on day ten. If offered, all ten customers would pay ninety-eight thousand on day ten; that is an explicit classroom assumption.'
  s1_zh: '一家展览展示供应商，现有十张无争议发票，每张十万港元，在第0天开出，正式到期日是第60天。它考虑一次性给出百分之二折扣，鼓励第10天付款。若推出这项优惠，十家客户都会在第10天支付九万八千港元，这是明确的课堂假定。'
  s1_zh_hk: '一間展覽展示供應商，有十張既有、冇爭議嘅發票，每張十萬港元，第零日開，第六十日到期。佢諗住一次過畀百分之二折扣，條件係第十日付款。題目先假定，一提出，十個客戶都會第十日畀九萬八千。'
  s2_en: 'The sales manager assumes that, without the offer, all ten would pay on day sixty. Under that baseline, each accelerated invoice avoids three thousand dollars of all-in bridging-finance cost between days ten and sixty, and the ninety-eight thousand receipt is enough to avoid that bridge. The first calculation then looks attractive: twenty thousand of discounts against thirty thousand of assumed finance savings, a net benefit of ten thousand.'
  s2_zh: '销售经理则假定，没有优惠时，十家都会在第60天才付款。按这个基准，每张真正提前的发票，可以避免第10天到第60天之间三千港元的全部过渡融资成本；收到九万八千也足以避免这笔成本。'
  s2_zh_hk: '經理又假定，冇折扣就十個都第六十日先畀。按呢個基準，每張真正提早嘅發票，可以避開第十至六十日三千港元全部過渡融資成本；九萬八千收款足夠避開嗰筆過渡資金。'
  s3_en: 'The three thousand is a supplied, fully avoidable marginal cost, not an interest rate or a bank quote. No financing charge has yet been incurred.'
  s3_zh: '于是第一笔计算看起来很吸引：折扣成本两万，假定节省融资三万，净好处一万。这三千港元是给定的、可完全避免的边际成本，不是利率，也不是银行报价。目前还没有发生任何融资费用。'
  s3_zh_hk: '初步計，折扣兩萬，避開成本三萬，淨好處一萬。三千港元係給定、可以完全避開嘅邊際成本，唔係利率，唔係銀行報價，費用亦未發生。'
