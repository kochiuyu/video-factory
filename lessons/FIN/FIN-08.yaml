  en: 'Both NPVs are positive, and B’s is higher. Only one plan can occupy the room. Funding and four-year use are available, so A’s earlier recovery alone does not settle the choice. Recommend B on these supplied facts. NPV is neither cash already received nor accounting profit.'
  zh: '两个方案的净现值都是正数，而B更高。房间只能容纳一个方案。资金和四年使用期都具备，因此单凭A更快回本，并不能定案。按既定事实，应选择B。净现值既不是已经到手的现金，也不是会计利润。'
