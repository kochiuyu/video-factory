  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'If one fit-out pays back sooner, is it worth more? On 8 July 2026, InvestHK announced a works contract for an HKUST building retrofit. Schneider Electric and Veolia would finance the upfront investment and recover it through verified energy savings over fifteen years.'
  zh: '装修方案回本更快，就一定更值钱吗？2026年7月8日，投资推广署公布香港科技大学楼宇改造工程合约。施耐德电气和威立雅会垫付前期投资，再用十五年通过经核实的节能收回。'
  zh_hk: '裝修方案回本早啲，就一定更有價值？2026年7月8日，投資推廣署公布科大樓宇改造工程合約，施耐德電氣同威立雅會墊付前期投資，再用十五年，透過經核實節能收回。'
