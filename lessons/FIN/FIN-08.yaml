youtube:
  description_en: 'Classroom assumptions, not a news report. This lesson follows the official Micro Cases page “Back sooner. Worth more?”. Slide figures are the published case figures. Mandarin and Cantonese narration use those facts in classroom speech. Source: https://kochiuyu.github.io/micro-cases/back-sooner.html'
  description_zh: '课堂假设，不是新闻报道。本课跟随正式微案例《回来得更早，就更值钱吗？》。幻灯片上的数字来自已发布的案例。普通话讲授用课堂口语说明这些事实，专业名词用正式译名。来源：https://kochiuyu.github.io/micro-cases/back-sooner.html'
