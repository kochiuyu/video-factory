  title_zh: '回收期问一件事'
  title_zh_hk: '回本期問一件事'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'A back at end year 2; B at end year 3'
  step1_zh: 'A 第2年年末收回；B 第3年年末'
  step1_zh_hk: 'A 第2年年末收回；B 第3年年末'
  step2_en: 'Undiscounted 20,000 and 80,000 are not NPV'
  step2_zh: '未折现 20,000 与 80,000 不是净现值'
  step2_zh_hk: '未折現 20,000 同 80,000 唔係淨現值'
  en: 'A’s first two receipts total one hundred thousand, recovering the initial outlay at the end of year two. B has recovered sixty thousand by then; its year-three receipt takes the total to one hundred and twenty thousand, so its payback is at the end of year three. Payback asks when the investment is recovered.'
  zh: 'A前两年收款合计十万，恰好在第2年末收回初始投入。B到那时只收回六万；加上第3年收款后累计十二万，所以回收期在第3年末。回收期问的是投资何时收回，它不计算回本之后的全部收款价值，简单回收期也不调整时间价值。'
  zh_hk: 'A頭兩年收十萬，第二年年末收回支出。B嗰時只收六萬，加第三年收款先累計十二萬，所以第三年年末回本。回本期問幾時收回投資，唔計之後收款嘅全部價值；簡單回本期亦唔調整貨幣時間價值。'
- id: 'b6twomeasuresdifferep2'
  visual: 'steps'
  seconds: 30
  layout: 'rows'
  stage: false
  title_en: 'Payback asks; NPV asks'
  title_zh: '回收期问一件事'
  title_zh_hk: '回本期問一件事'
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  step1_en: 'PV of receipts: A 101,947; B 137,299'
  step1_zh: '收款现值 A 101,947；B 137,299'
  step1_zh_hk: '收款現值 A 101,947；B 137,299'
  step2_en: 'NPV: A 1,947; B 37,299'
  step2_zh: '净现值 A 1,947；B 37,299'
  step2_zh_hk: '淨現值 A 1,947；B 37,299'
  en: 'It does not count the full value of receipts after that point, and simple payback does not adjust for time value. At a ten-percent required return, one thousand one hundred dollars received one year from now has a present value of one thousand today. To compare plans today, divide a year-one receipt by one point one, a year-two receipt by one point one squared, and so on.'
  zh: '按百分之十的要求回报率，一年后收到的一千一百港元，今天值一千港元。要把方案放到今天比较，就把第1年收款除以一点一，第2年除以一点一的平方，依此类推。'
  zh_hk: '要求回報率一成，一年後收一千一百，現值就係今日一千。要放喺今日比，第一年除一點一，第二年除一點一嘅平方，如此類推。'
- id: 'b6twomeasuresdifferep3'
  visual: 'whatis_definition'
  seconds: 15
  kicker_en: 'Figures'
  kicker_zh: '数字'
  kicker_zh_hk: '數字'
  sentence_en: 'At 10%, 1,100 next year is 1,000 today'
  sentence_zh: '10%下，明年 1,100 今天值 1,000'
  sentence_zh_hk: '10%下，明年 1,100 今日值 1,000'
  en: 'Adding the four discounted receipts gives those present-value totals, and after the equal initial outlays the NPVs follow. The undiscounted surpluses of twenty thousand and eighty thousand are different measures; they are not NPV.'
  zh: '把四年折现收款加总，再减去相同的初始投入，就得到净现值。未折现的盈余是两万和八万，那是另一种指标，不是净现值。'
  zh_hk: '四年折現收款加埋，減相同起始支出，就有淨現值。未折現剩低嘅兩萬同八萬，係另一種指標，唔係淨現值。'
