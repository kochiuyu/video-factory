  s1_en: 'A Hong Kong training studio has one spare room and two alternative fit-out plans. A supports an established short-course format with stronger early demand. B supports a programme expected to build over time. Either costs one hundred thousand dollars today and runs for the same four-year remaining lease.'
  s1_zh: '一家香港培训室有一个空房间，和两个备选装修方案。A支持已有的短期课程，前期需求较强；B支持一个预期会逐步打开的课程。两个方案今天都要投入十万港元，使用期都是剩余四年租约。房间只能给其中一个，也可以两个都不选。'
  s1_zh_hk: '一間香港培訓室有一間空房，兩套裝修只能揀一套。A配合成熟短期課程，前期需求較強；B配合預期慢慢做起嘅課程。今日都要十萬港元，用同樣餘下四年租約。'
  s2_en: 'Only one can occupy the room, and doing neither is also possible. Cash and reserves are sufficient for either plan, and existing classes remain funded. The owner’s summary says A pays back at the end of year two, B at the end of year three. “Why wait an extra year?” she asks. The full four-year estimates have not yet been compared.'
  s2_zh: '现金和营运储备足够支持任何一个，现有课程仍然有资金。店主的摘要说，A在第2年末回本，B在第3年末回本。她问：“为什么要再等一年？”完整的四年估计还没有拿来比较。这里的净收款，是扣除相关经营成本、维修、营运资金变动和税项后的增量现金，不是销售额，也不是会计利润。'
  s2_zh_hk: '房間只容納一套，兩套唔做亦得。資金同營運儲備夠，現有課程亦有資金。負責人話，A第二年年末回本，B第三年年末，點解要多等一年？但完整四年估計仲未比過。'
  s3_en: 'Net receipts mean incremental cash after all relevant operating costs, maintenance, working-capital movements and tax, not sales or accounting profit. Model all receipts at year-end. There are no disposal proceeds or cash flows after year four.'
  s3_zh: '所有收款都按年末收到来算。第4年之后没有处置收入，也没有后续现金流。'
  s3_zh_hk: '淨收款係扣咗所有相關營運成本、維修保養、營運資金變動同稅項嘅增量現金，唔係銷售額或者會計利潤。全部當年末收，第4年之後冇處置收入同現金流。'
