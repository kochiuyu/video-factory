  en: 'The accountant completes the full-life review. A is forecast to bring in ten thousand dollars in year three and ten thousand in year four. B is forecast to bring in sixty thousand in each of those years. The earlier figures are unchanged. The review also confirms that the studio can use the room for all four years and fund either timing profile.'
