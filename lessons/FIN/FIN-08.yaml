  en: 'The plans have comparable forecast risk, and the supplied required return is ten percent a year. Converting every year’s net receipt to its value today gives about one hundred and one thousand nine hundred and forty-seven for A, and one hundred and thirty-seven thousand two hundred and ninety-nine for B, rounded. Subtracting each one-hundred-thousand outlay gives net present value, or NPV, of one thousand nine hundred and forty-seven, and thirty-seven thousand two hundred and ninety-nine.'
  zh: '把每年净收款折成今天的价值，A约十万一千九百四十七港元，B约十三万七千二百九十九港元，已四舍五入。再减去各十万的初始投入，净现值分别约为一千九百四十七，和三万七千二百九十九港元。'
  zh_hk: '將各年淨收款換成今日價值，四捨五入，A十萬一千九百四十七港元，B十三萬七千二百九十九。各減十萬支出，淨現值，即NPV，就係一千九百四十七，同三萬七千二百九十九。'
