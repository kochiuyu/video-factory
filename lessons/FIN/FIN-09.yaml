  footer_en: 'Foregone interest 1,200 + admin 1,800 = 3,000'
  footer_zh: '少得利息 1,200，加行政 1,800，共 3,000'
  footer_zh_hk: '少得利息 1,200，加行政 1,800，共 3,000'
  stage: false
  en: 'Accrued interest counts within the protection limit, not on top of it. The six-hundred-thousand allocations leave headroom. Keeping four hundred thousand above one bank’s ceiling does not mean it is automatically lost if that bank fails; recovery would be uncertain. No failure probability is supplied.'
  zh: '应计利息在保障上限之内，不是额外再加。各六十万还留有余地。集中时超出上限的四十万，不等于银行倒闭就自动损失，能否收回并不确定。题目没有倒闭概率。'
  zh_hk: '應計利息計喺保障額之內，唔係額外再加。各六十萬仲有餘地。集中超額四十萬，唔代表銀行一倒閉就全部蝕晒；能否收回未知道，題目亦冇倒閉概率。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 13
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Keep the reserve together, or divide it?'
  sentence_zh: '储备放在一起，还是分开？'
  sentence_zh_hk: '儲備放在一起，還是分開？'
  en: 'Keep the reserve together or divide it? What would justify the extra three thousand annual comparison cost, and what evidence could reverse your choice? Pause here.'
  zh: '你会把储备集中存放，还是分开？什么理由值得每年多付这三千港元的比较成本？又有什么证据可能让你改变选择？请在这里暂停。'
  zh_hk: '儲備集中定分開？有乜理由值得每年多付今次比較嘅三千港元？咩證據會令你改主意？喺度暫停。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 23
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Bank B can pay suppliers directly on an already-authorised mandate'
  sentence_zh: '第二轮 · 改了一个事实'
  sentence_zh_hk: '第二輪 · 改了一個事實'
  en: 'A treasury review confirms that Bank B can pay the company’s suppliers directly using its already-authorised mandate, documented beneficiary details and available signatories. It need not send money back through Bank A. Now assess this hypothetical interruption at the starting balances: payments from Bank A are unavailable until the next business day.'
  zh: '司库复核确认，B银行可以用已经授权的委托、已记录的收款人资料和在任签署人，直接付给供应商，不用经过A。现在按起始余额，审视一个假设中断：A的付款要下一个营业日才能用。'
  zh_hk: '庫務覆核確認，B可以用已授權委託、記錄好嘅收款人資料，同在任簽署人，直接畀供應商，唔使經A。依家用起始結餘，諗一個假設中斷：A要下一個營業日先付到款。'
- id: 'b4reveal2'
  visual: 'whatis_definition'
  seconds: 24
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Hypothetical interruption at starting balances'
  sentence_zh: '司库复核确认：B银行可以凭已经授权的委托、已记录的收款人资料和在任的签署人，直接付给公司的供应商。'
  sentence_zh_hk: '庫務覆核確認：B銀行可以憑已經授權的委託、已記錄的收款人資料和在任的簽署人，直接付給公司的供應商。'
  en: 'Bank B, the relevant settlement routes, company access and signatories, and recipient banks remain operational. An essential two-hundred-thousand-dollar supplier payment must arrive today. No borrowing, other cash pool or third-party funding is available. Under the split arrangement, Bank B’s six hundred thousand was deposited before the interruption; it cannot be moved out of A afterwards.'
  zh: 'B、相关结算路径、公司访问、签署人和收款银行都正常。一笔必要的二十万港元供应商付款，今天必须到账。没有借款、其他现金池或第三方资金。'
  zh_hk: 'B、相關結算路徑、公司存取、簽署人同收款銀行全部正常。一筆必要嘅二十萬港元供應商付款，今日一定要到帳。冇借款、其他現金池或者第三方資金。'
- id: 'b4reveal3'
  visual: 'whatis_definition'
  seconds: 14
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Payments from Bank A unavailable until the next business day'
  sentence_zh: '不必先把钱转回A银行。'
  sentence_zh_hk: '不必先把錢轉回A銀行。'
  en: 'Bank A’s money still exists, and neither bank is assumed to have failed. This is a scenario to examine, not an allegation or forecast about any bank.'
  zh: '分开安排中，B的六十万是中断前存入的，事后不能再从A转出。A的钱仍然在，也不假定银行倒闭。这是审视情景，不是指控或预测。'
  zh_hk: '分開安排下，B嘅六十萬係中斷前已存入，事後唔可以由A再轉出。A嘅錢仍然喺度，亦冇假定銀行倒閉。呢個係檢視情景，唔係指控或者預測。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 15
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Which arrangement can fund today’s HK$200,000 payment?'
  sentence_zh: '在这个情景里，哪种安排付得出今天这20万港元？'
  sentence_zh_hk: '在這個情景裏，哪種安排付得出今天這20萬港元？'
  en: 'Which arrangement can fund today’s two-hundred-thousand-dollar payment in this scenario? Does deposit protection itself solve the access problem, and does this change what you would pay for the reserve arrangement? Pause, then explain.'
  zh: '在这个情景里，哪种安排能支付今天这二十万港元？存款保障本身能解决付款渠道问题吗？这会不会改变你愿意为储备安排付出的成本？请暂停，再说明。'
  zh_hk: '今次邊個安排付到今日嘅二十萬？存款保障本身解唔解決用唔到錢？你願意為儲備安排畀嘅成本，會唔會因此改變？暫停先講理由。'
- id: 'b6locatethemoneythat'
  visual: 'steps'
  seconds: 26
  layout: 'rows'
  stage: false
  title_en: 'Who can pay today?'
  title_zh: '今天谁付得出'
  title_zh_hk: '今日邊度付得出'
  kicker_en: 'FIN-09'
  kicker_zh: 'FIN-09'
  kicker_zh_hk: 'FIN-09'
  step1_en: 'Split: B pays 200,000 and keeps 400,000'
  step1_zh: '分开：B 付出 20万，仍留 40万'
  step1_zh_hk: '分開：B 付出 20萬，仍留 40萬'
  step2_en: 'A still holds 600,000'
  step2_zh: 'A 仍有 60万'
  step2_zh_hk: 'A 仍有 60萬'
  en: 'Keep the return comparison separate from the protection question. The three-thousand-dollar figure is a visible cost of the alternative arrangement, not a guaranteed loss of profit, and no supplied probability lets us calculate an expected loss that proves one policy optimal. Under the split policy, Bank B can send two hundred thousand directly and retain four hundred thousand.'
  zh: '要把回报比较，和保障问题分开看。这三千港元是替代安排里看得见的成本，不是必定损失的利润；案例也没有给出概率，不能据此算出期望损失，去证明哪一种政策最优。在分开存放下，银行B可以直接付出二十万，并保留四十万。'
  zh_hk: '回報比較同保障要分開。三千港元係另一個安排睇得見嘅成本，唔係保證少賺嘅利潤。冇概率，就計唔到期望損失去證明邊項最優。分開政策下，B直接付二十萬，剩四十萬；A仲有六十萬，只係按題目路徑暫時用唔到。'
- id: 'b6locatethemoneythatp2'
  visual: 'steps'
  seconds: 21
  layout: 'rows'
  stage: false
  title_en: 'Who can pay today?'
  title_zh: '今天谁付得出'
  title_zh_hk: '今日邊度付得出'
  kicker_en: 'FIN-09'
  kicker_zh: 'FIN-09'
  kicker_zh_hk: 'FIN-09'
  step1_en: 'Cash after that payment: 1,000,000'
  step1_zh: '付款后现金合计 100万'
  step1_zh_hk: '付款後現金合計 100萬'
  step2_en: 'Together: 1.2m exists, but not for this deadline'
  step2_zh: '放一起：120万还在，但赶不上今天'
  step2_zh_hk: '放一起：120萬仲喺度，但趕唔上今日'
  en: 'Six hundred thousand remains at A, temporarily unavailable through the stated payment route. Total cash after paying the supplier is one million. Under the together policy, the full one point two million remains at A but cannot fund the deadline through the available arrangements in this scenario.'
  zh: '六十万仍在银行A，只是暂时不能经所述付款渠道使用。付给供应商后，现金合计一百万。若集中存放，一百二十万仍然在银行A，但在这个情景里，无法用现有安排赶上今天的截止。'
  zh_hk: '付完合共仲有一百萬。集中政策下，一百二十萬全喺A，但現有安排趕唔到今日限期。呢個係用唔到錢，唔係成筆錢冇咗。'
- id: 'b6locatethemoneythatp3'
  visual: 'whatis_definition'
  seconds: 16
  kicker_en: 'FIN-09'
  kicker_zh: 'FIN-09'
  kicker_zh_hk: 'FIN-09'
  sentence_en: 'Two accounts at A are not a second limit'
  sentence_zh: 'A 的两个户口不是第二个上限'
  sentence_zh_hk: 'A 嘅兩個戶口唔係第二個上限'
  en: 'That is an access problem, not a loss of the whole balance. Deposit protection is not an outage-payment service. Do not subtract the payment twice, and do not count the temporarily inaccessible A balance as lost.'
  zh: '这是通道问题，不是整笔结余消失。存款保障并不是中断时的付款服务。不要把这二十万重复扣除，也不要把暂时不能从A付出的结余算成已经损失。'
  zh_hk: '存款保障唔係停機付款服務。唔好扣兩次二十萬，亦唔好當A暫時用唔到嗰筆已經損失。'
