  description_en: 'Classroom assumptions, not a news report. This lesson follows the official Micro Cases page “One bank. Two kinds of safety.”. Slide figures are the published case figures. Mandarin and Cantonese narration use those facts in classroom speech. Source: https://kochiuyu.github.io/micro-cases/protected-and-available.html'
  description_zh: '课堂假设，不是新闻报道。本课跟随正式微案例《同一家银行，两种安全》。幻灯片上的数字来自已发布的案例。普通话讲授用课堂口语说明这些事实，专业名词用正式译名。来源：https://kochiuyu.github.io/micro-cases/protected-and-available.html'
