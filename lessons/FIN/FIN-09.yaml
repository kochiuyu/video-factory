  en: 'Keeping the reserve together offers more illustrated interest and less administration. Dividing it reduces concentration. Interest assumes unchanged balances for a year, not actual receipts after withdrawals. Dividing sacrifices one thousand two hundred of illustrated interest and adds one thousand eight hundred of administration cost: three thousand annually in this comparison.'
  zh: '集中，示意利息更高，行政更少；分开，集中度更低。利息只按余额一年不变示意，不是提款后的实际到账。分开少一千二百利息，再加一千八百行政成本，这项比较每年差三千。'
  zh_hk: '集中利息較高、行政較少，分開就減少集中。利息只係結餘一年不變嘅示意，唔係提款後嘅實收。分開少一千二百利息，加一千八百行政成本，今次比較每年差三千。'
- id: 'b2thereservechoicep2'
