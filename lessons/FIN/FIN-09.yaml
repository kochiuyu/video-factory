  kicker_en: 'FIN-09'
  kicker_zh: 'FIN-09'
  kicker_zh_hk: 'FIN-09'
  sentence_en: 'The split meets this payment need and raises starting principal inside separate ceilings'
  sentence_zh: '分开的政策满足这次特定的付款需要，也让更多起始本金落在各自的保障上限之内。'
  sentence_zh_hk: '分開的政策滿足這次特定的付款需要，也令更多起始本金落在各自的保障額之內。'
  en: 'The split policy meets this particular payment requirement while increasing the starting principal inside separate protection ceilings. Its value depends on the business’s need for reliable payment access and its willingness to incur the stated ongoing cost. Keeping funds together retains the better illustrated return and simpler administration, but also the described exposure.'
  zh: '分开存放能够应付这一笔付款，同时也把起始本金放进分开的保障上限。它值不值得，取决于企业是否需要可靠的付款渠道，以及是否愿意承担既定的持续成本。集中存放保留较高的示例回报和较简单的行政安排，但也保留刚才描述的风险。'
  zh_hk: '分開政策應付到今次付款需要，亦令更多起始本金喺各自保障額之內。值唔值得，要睇企業幾需要可靠付款渠道，同肯唔肯承擔持續成本。集中有較好示意回報同較簡單行政，但風險亦留低。'
