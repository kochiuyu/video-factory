  footer_zh_hk: '利率係虛構示意'
  stage: false
  en: 'Harbour Print Limited is deciding where to keep one point two million dollars of its own operating reserve. It can keep everything at Bank A, or divide it equally between Bank A and Bank B. Both relationships and permissions can be arranged in advance, and no covenant requires a single bank. The company is an eligible depositor. These are conventional on-demand Hong Kong-dollar deposits at Hong Kong offices of two confirmed, separate scheme member banks, with no other company balances there.'
  zh: '海港印刷有限公司要决定，把一百二十万港元自有经营储备放在哪里。可以全放A银行，也可以A、B各一半。关系和权限可以提前办好，没有契约要求只用一家。公司是合资格的存款人；这些是两家已确认、彼此独立的存款保障计划成员银行香港办事处的常规港元活期存款，公司在那里没有其他余额。'
  zh_hk: '海港印刷有限公司要決定，一百二十萬港元自有營運儲備放邊度。可以全放A，或者A、B各一半。兩邊關係同權限可以預先辦妥，亦冇契諾要求只用一間。公司係合資格存戶；存款係兩間已確認、彼此獨立嘅計劃成員銀行香港辦事處嘅常規港元活期存款，公司喺嗰度冇其他結餘。'
