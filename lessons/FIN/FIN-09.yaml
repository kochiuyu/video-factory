  title_en: 'One bank. Two kinds of safety.'
  title_zh: '同一家银行，两种安全'
  title_zh_hk: '同一間銀行，兩種安全'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Is one bank safer, or are there two different kinds of safety? On 1 October 2024, Hong Kong raised its Deposit Protection Scheme limit to eight hundred thousand dollars per depositor per member bank. That is not a separate allowance for each account, and it is not a promise of immediate spending access. The company, banks and rates below are fictional.'
  zh: '把钱放在一家银行更安全，还是其实有两种不同的安全？2024年10月1日，香港把存款保障计划上限调高至每家成员银行、每名存款人八十万港元。这不是按每个账户另行计算的额度，也不等于保证资金马上可以用来付款。下面的公司、银行和利率都是虚构的。'
  zh_hk: '放同一間銀行就安全，定其實有兩種安全？2024年10月1日，香港將存款保障計劃保障額提高至每名存戶、每間成員銀行八十萬港元。唔係每個戶口各有八十萬，亦唔係保證即刻攞到錢付款。下面公司、銀行同利率全部虛構。'
