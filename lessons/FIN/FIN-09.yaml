  en: 'A policy recommendation must address whether management can accept that interruption risk within its obligations; it is not permission to disregard a due payment. A shared-network interruption, unavailable signatories or a changed balance could defeat the second route too. Two banks do not guarantee continuity in every situation.'
  zh: '政策建议必须说明，管理层在其责任范围内能否接受这种中断风险；这不是允许忽略一笔到期付款。如果共享网络中断、签署人不在，或余额已经改变，第二条通道同样可能失效。两家银行并不能保证在所有情况下都能持续付款。'
