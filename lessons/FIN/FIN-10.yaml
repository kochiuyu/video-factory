  col2_zh: '怎么来的'
  col2_zh_hk: '點計出嚟'
  c11: '64%'
  c12_en: '80% x 80%'
  c12_zh: '80% x 80%'
  c12_zh_hk: '80% x 80%'
  c21: '16%'
  c22_en: '20% x 80%'
  c22_zh: '20% x 80%'
  c22_zh_hk: '20% x 80%'
  c31: '20%'
  c32_en: 'New issue'
  c32_zh: '新发行的两成'
  c32_zh_hk: '新發行的兩成'
  footer_en: 'Sum 100%. Dilution is 36%, not 40%. B leaves 70%.'
  footer_zh: '合计100%。稀释36%不是40%。B留下70%。'
  footer_zh_hk: '合計100%。攤薄36%唔係40%。B留下70%。'
  s1_en: 'After A’s first issue, original owners hold eighty percent and the first investor twenty percent. The second investor then receives twenty percent of the enlarged company, leaving all earlier shareholders with eighty percent together. Original owners retain eighty percent of eighty percent, which is sixty-four percent. The first investor retains twenty percent of eighty percent, which is sixteen percent.'
  s1_zh: 'A第一轮发行后，原股东八成，第一位投资者两成。第二位投资者再取得扩大后公司的两成，原有股东合计剩八成。原股东是八成乘八成，也就是百分之六十四；第一位投资者是两成乘八成，也就是百分之十六；第二位两成，合计百分之百。'
  s1_zh_hk: 'A第一輪後，原股東八成，第一位投資者兩成。第二位再攞擴大後公司兩成，之前股東合共剩八成。原股東係八成乘八成，即百分之六十四；第一位投資者係兩成乘八成，即百分之十六；第二位兩成，加埋百分之百。'
  s2_en: 'The second investor holds twenty percent. Together they hold one hundred percent. Cumulative original-owner dilution is thirty-six percent, not forty percent, because the two twenty-percent stakes were measured against different totals. If both A rounds occur, the company raises four hundred thousand plus six hundred thousand, which is one million, and original owners retain sixty-four percent. B raises one million now and leaves them with seventy percent, six percentage points more.'
  s2_zh: '原股东累计股权稀释百分之三十六，不是四十，因为两次两成用的分母不同。两轮都发生，四十万加六十万，累计筹一百万，原股东剩六十四。B现在就筹一百万，原股东留七十，多六个百分点。'
  s2_zh_hk: '原股東累計股權攤薄百分之三十六，唔係四十，因為兩個兩成用唔同分母。如果兩輪都做，四十萬加六十萬，累計籌一百萬，原股東剩六十四。B而家籌一百萬，原股東七十，多六個百分點。'
  s3_en: 'On the supplied full-expansion scenario, B therefore requires less cumulative dilution and provides the funding earlier. This is a conditional ownership comparison, not proof that B creates more value. The one million raised along A is cumulative funding, not closing cash: money may be spent between rounds.'
  s3_zh: '这个全额扩张情景下，B累计稀释更少，钱也更早到位。这只是有条件的所有权比较，不能证明B创造更多价值。A的一百万是累计融资，不是期末还剩一百万现金，两轮之间可能已经花掉。'
  s3_zh_hk: '呢個全額擴張情景下，B累計攤薄較少，資金亦早啲到。只係有條件擁有權比較，唔代表B創造更多價值。A嘅一百萬係累計融資，唔係期末有一百萬現金，兩輪之間可能已經用咗。'
- id: 'b7apauseisnotarevers'
  visual: 'whatis_definition'
  seconds: 27
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'A can stop after Phase 1 at 80%, having raised only HK$400,000'
  sentence_zh: 'A可以在有用的第一期之后停下来，原股东仍持有80%，筹得的是40万港元。'
  sentence_zh_hk: 'A可以在有用的第一期之後停下來，原股東仍持有80%，籌得的是40萬港元。'
  en: 'A can stop after its useful first phase with original owners at eighty percent, having raised four hundred thousand. That is a smaller funded scope than B, so the percentages alone are not a like-for-like value comparison. B also allows the team to pause phase two. Unspent funds remain company assets; they are not a personal windfall or freely withdrawable owner money.'
  zh: 'A可以在有用的第一期之后停止，原股东仍持有八成，但只筹集了四十万。那是比B更小的已融资范围，所以单看持股百分比，并不能直接比较价值。B也允许团队暂停第二期。未用的资金仍然是公司资产，不是股东的私人收益，也不能随便提取。'
  zh_hk: 'A可以喺有用嘅第一期之後停，原股東留八成，只籌四十萬。融資範圍比B細，唔可以淨睇百分比就當價值相同。B亦可以暫停第二期。未用資金仍屬公司，唔係私人橫財，股東唔可以隨意提走。'
- id: 'b7apauseisnotarevers2'
  visual: 'whatis_definition'
  seconds: 22
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'That is a smaller funded scope, not automatically more value'
  sentence_zh: '这比B的融资范围小，所以单看百分比，不是同等价值的比较。'
  sentence_zh_hk: '這比B的融資範圍小，所以單看百分比，不是同等價值的比較。'
  en: 'Its thirty-percent investor stake is not automatically cancelled because spending pauses. A can be defended when limiting today’s equity commitment matters, or when credible later terms would differ. B can be defended when securing both budgets now is the priority. Neither forces unwanted or unsafe expansion spending.'
  zh: '不会因为暂停开支，就自动取消投资者那三成股权。如果今天要限制股权承诺，或后续条款可能明显不同，A仍然说得通。如果优先要现在锁定两期预算，B也说得通。两者都不会强迫进行不想要或不安全的扩张开支。'
  zh_hk: '停支唔會自動取消投資者三成。如果限制今日讓出股權重要，或者可信嘅後期條款會唔同，A有道理。優先要今日鎖定兩筆預算，B亦有道理。兩條路都唔會迫你做唔想做或者唔安全嘅擴張支出。'
- id: 'b8transfercheckpause'
  visual: 'whatis_definition'
  seconds: 10
  kicker_en: 'Facilitator'
  kicker_zh: '引导提问'
  kicker_zh_hk: '引導提問'
  sentence_en: 'What can the ownership percentage not tell you? Pause and name the missing evidence before treating one financing route as more valuable.'
  sentence_zh: '持股百分比说明不了什么？暂停一下，在认定哪条融资路径更有价值之前，说出还缺什么证据。'
