  footer_en: 'Same share rights; costs funded on each path'
  footer_zh: '股权权利相同；发行成本按路径各自安排'
  footer_zh_hk: '股權權利相同；發行成本按路徑各自安排'
  s1_en: 'LightBench, a Hong Kong product-photography studio, is considering an expansion. Current owners collectively hold one hundred percent. Existing services, wages, rent and required reserves remain funded without expanding, so the owners can decline both offers. Phase one needs four hundred thousand dollars for a complete tabletop-product service that is useful on its own. Optional phase two adds a larger-object service for another six hundred thousand.'
  s1_zh: 'LightBench是一家香港产品摄影工作室，现有股东合计持有百分之百。不扩张，现有服务、工资、租金和所需储备仍有资金，所以两份提议都可以拒绝。第一期四十万港元，做完整的台面产品拍摄服务，单独就有用。'
  s1_zh_hk: 'LightBench係香港一間產品攝影工作室，現有股東合共持有百分之百。唔擴張，服務、工資、租金同所需儲備仍有資金，所以兩份都可以唔要。第一期四十萬港元，做完整嘅檯面產品拍攝服務，單獨都用得。'
  s2_en: 'Offer A funds phase one only: four hundred thousand now, after which the new investor holds twenty percent and the original owners eighty percent. Offer B funds both budgets: one million now, after which the investor holds thirty percent and the original owners seventy percent. Funds enter the company, not the owners’ pockets. The shares have the same ordinary economic and voting rights.'
  s2_zh: '可选第二期再花六十万，增加大件拍摄。A现在筹四十万，新投资者发行后占两成，原股东八成。B现在筹一百万，投资者三成，原股东七成，两期都有资金。钱进公司，不进股东口袋。股份普通经济权利和投票权相同，没有特别保护；发行费用在两条路径下都另行、对等地备好。'
  s2_zh_hk: '可選第二期再用六十萬，增加大件拍攝。A而家籌四十萬，新投資者發行後佔兩成，原股東八成。B而家籌一百萬，投資者三成，原股東七成，兩期都有資金。錢入公司，唔入股東袋。股份普通經濟權利同投票權相同，冇特別保護；發行費用喺兩條路徑都另外對等備妥。'
  s3_en: 'There are no special protections, and issuance costs are separately funded equally. A would need a later financing decision if phase two is chosen. B permits pausing phase two and keeping unused funds in the company, but pausing spending does not reverse shares already issued. No profit or future company-value forecast is supplied.'
  s3_zh: 'A要做第二期，还得另作融资决定。B可以暂停第二期，把未用资金留在公司，但停支不会收回已经发行的股份。没有利润或未来公司价值预测。'
  s3_zh_hk: 'A想做第二期，就要再決定融資。B可以暫停第二期、留錢喺公司，但停支唔會收回已發股份。冇利潤或者未來公司價值預測。'
- id: 'b3firstvote'
  visual: 'whatis_definition'
  seconds: 15
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'Which route would you provisionally prefer, and why?'
  sentence_zh: '你会暂时偏向哪一条路径，为什么？'
  sentence_zh_hk: '你會暫時偏向哪一條路徑，為甚麼？'
  en: 'Which route would you provisionally prefer, and why? Does twenty percent now establish that A preserves more ownership through the whole expansion? Name future-funding evidence that could change your answer. Pause here.'
  zh: '你会暂选哪一条路径？为什么？现在只让出两成，是否就能证明，A在整项扩张中能保留更多股权？请指出可能改变答案的后续融资证据。请在这里暂停。'
  zh_hk: '你暫時揀邊條路？點解？而家只讓兩成，就證明A成段擴張都保住更多擁有權？講一類會令你改答案嘅未來融資證據。喺度暫停。'
- id: 'b4reveal'
  visual: 'whatis_definition'
  seconds: 34
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'Conditional scenario only, not a promise'
  sentence_zh: '第二轮 · 多了一项信息'
  sentence_zh_hk: '第二輪 · 多了一項資料'
  en: 'The team adds a conditional financing scenario to today’s planning sheet. If it chooses A, completes phase one and then elects phase two, a second investor would supply six hundred thousand dollars for twenty percent of the whole company immediately after that second share issue. Use those terms for this classroom comparison only. They do not guarantee that a future investor, valuation or agreement will be available, and no successful first phase has occurred in the story.'
  zh: '团队在今天的规划表上，加了一个有条件的融资情景。如果选择A，完成第一期，再决定进行第二期，第二位投资者会投入六十万港元，并在这次发行后立即占整间公司的两成。这些条款只供课堂比较，并不保证未来一定有投资者、估值或协议，故事里也还没有成功完成第一期。'
  zh_hk: '團隊加咗一個有條件融資情景。如果揀A、做完第一期，再揀第二期，第二位投資者會出六十萬，換第二次發行後整間公司兩成。呢啲條款只用嚟課堂比較，唔保證將來有投資者、估值或者協議，故事亦未有第一期成功咗。'
- id: 'b4reveal2'
  visual: 'whatis_definition'
  seconds: 19
  kicker_en: 'New fact'
  kicker_zh: '新事实'
  kicker_zh_hk: '新事實'
  sentence_en: 'If A is chosen, Phase 1 is completed and Phase 2 is elected'
  sentence_zh: '团队在今天的规划表上加了一个 有条件的融资情景 。'
  sentence_zh_hk: '團隊在今天的規劃表上加了一個 有條件的融資情景 。'
  en: 'The original owners and first investor receive no special protection and make no extra investment. Both existing holdings are diluted by the new shares. They can instead stop after phase one; B also permits pausing operations, but its issued ownership stakes remain.'
  zh: '原股东和第一位投资者没有特别保障，也不再追加投资。他们现有的持股，都会被新股稀释。他们也可以在第一期之后停止；B同样允许暂停营运，但其已经发行的股权仍然有效。'
  zh_hk: '原股東同第一位投資者冇特別保護，唔再加錢，現有持股都會被新股攤薄。佢哋可以做完第一期就停；B亦可以暫停經營，但已發行持股比例唔會變。'
- id: 'b5secondvote'
  visual: 'whatis_definition'
  seconds: 20
  kicker_en: 'Decision'
  kicker_zh: '决定'
  kicker_zh_hk: '決定'
  sentence_en: 'If both A rounds occur, what do the owners, first investor and second investor each own?'
  sentence_zh: '若两轮都按这些条款发生，原股东、第一位投资者和第二位投资者各持有多少？'
  sentence_zh_hk: '若兩輪都按這些條款發生，原股東、第一位投資者和第二位投資者各持有多少？'
  en: 'If both rounds occur on those terms, what do the original owners, first investor and second investor each own? Compare A’s completed funding path with B. Would you revise your choice, and what remains unknown? Pause, then calculate a three-holder table, not just an original-owner answer.'
  zh: '若按这些条款两轮都发生，原股东、第一位投资者和第二位投资者各占多少？把A的完整融资路径与B比较。你会修订选择吗？还有什么是未知的？请暂停，然后列出三方持股表，不要只回答原股东的比例。'
  zh_hk: '兩輪如果照呢啲條款發生，原股東、第一位同第二位投資者各佔幾多？比A走完嘅融資路徑同B，你會改選擇？仲有乜未知？暫停，做一張三方持股表，唔好只答原股東。'
- id: 'b6thesecond20usesane'
  visual: 'table_grid'
  seconds: 31
  title_en: 'After A''s second 20%'
  title_zh: 'A 的第二个两成之后'
  title_zh_hk: 'A 的第二個兩成之後'
  kicker_en: 'FIN-10'
  kicker_zh: 'FIN-10'
  kicker_zh_hk: 'FIN-10'
  rows: 3
  cols: 2
  row1_en: 'Original owners'
  row1_zh: '原股东'
