  title_en: 'Twenty per cent. Only once?'
  title_zh: '百分之二十，只发生一次吗？'
  title_zh_hk: '百分之二十，只發生一次嗎？'
  caption_en: 'Classroom assumptions, not a news report'
  caption_zh: '课堂假设，不是新闻报道'
  caption_zh_hk: '課堂假設，不是新聞報道'
  en: 'Does giving away twenty percent now mean you keep more ownership through a whole expansion? On 14 July 2025, Hong Kong-listed Ascentage Pharma announced a conditional placing linked to a subscription of new shares, describing intended uses of funding and the enlarged share capital. That was an announcement, not evidence of completion or returns. The product-photography studio below is unrelated and fictional.'
  zh: '现在让出两成股权，是否就表示在整项扩张里能保留更多所有权？2025年7月14日，香港上市的亚盛医药公布一项有条件配售，并与认购新股相连，说明了资金用途和扩大后的股本。那是公告，不是完成或回报的证据。下面的产品摄影工作室与它无关，而且是虚构的。'
  zh_hk: '而家讓兩成股權，就代表成段擴張都保留更多擁有權？2025年7月14日，香港上市公司亞盛醫藥宣布一項同認購新股相聯嘅有條件配售，講到擬定資金用途同擴大後股本。呢份係公布，唔係已完成或者有回報嘅證據。下面產品攝影工作室係虛構，同佢無關。'
