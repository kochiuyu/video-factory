  title_en: Does V survive months 1–3?
  title_zh: V 撑得过前三个月吗？
  title_zh_hk: V 頂得住頭三個月嗎？
  en: >-
    Does your choice pass the first three months under the rising path, even after keeping earlier savings?
    Recommend F, or state the confirmed change V would need to meet the owners' rule. Pause and vote.
  zh: >-
    在上升路径下，就算把前期省下的钱留着，你的选择能撑过前三个月吗？你可以建议选F，也可以说明V需要先落实什么改变，才符合业主的规则。请暂停，投个票。
  zh_hk: 喺上升路徑下，就算留住前期慳落嘅錢，你揀嗰份頂唔頂得住頭三個月？你可以建議揀F，或者講吓V要先落實咩改變，先符合東主嘅規則。暫停，投個票。
