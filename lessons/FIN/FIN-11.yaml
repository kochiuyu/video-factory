  title_en: Fixed or floating?
  title_zh: 固定还是浮动？
  title_zh_hk: 固定定浮動？
  en: >-
    Which quote would you provisionally favour, and why? Compare financing costs across the three supplied
    paths. What cash evidence would you need before choosing? Pause and vote.
  zh: 你会暂时倾向哪一份报价？为什么？把三条路径下的融资成本比较一下。做决定之前，你还需要哪些现金方面的证据？请暂停，投个票。
  zh_hk: 你暫時會揀邊份報價？點解？比較吓三條路徑下嘅融資成本。決定之前，你仲需要啲咩現金方面嘅證據？暫停，投個票。
