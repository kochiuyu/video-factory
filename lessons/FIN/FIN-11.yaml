  title_en: A lower rate. A less certain payment?
  title_zh: 更低的利率，更不确定的还款？
  title_zh_hk: 更低的利率，更不確定的還款？
  image: art/lower-rate-less-certainty-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 9 June 2025, Reuters reported abrupt movements in Hong Kong interest rates after capital inflows
    and currency-market interventions. A low rate today does not guarantee low costs for the whole loan.
    Now you advise a fictional Hong Kong furniture-repair workshop.
  zh: >-
    2025年6月9日，路透社报道，资本流入和外汇市场干预之后，香港利率出现急剧变动。今天利率低，并不保证整笔贷款期间的成本都低。现在，你要为香港一家虚构的家具维修工场提供建议。
  zh_hk: >-
    2025年6月9號，路透社報道，資金流入同外匯市場干預之後，香港利率急升急跌。今日利率低，唔代表成筆貸款期間成本都低。而家，你要幫香港一間虛構嘅傢俬維修工場出主意。
