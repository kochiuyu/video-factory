  title_en: Same loan, different interest
  title_zh: 本金相同，利息不同
  title_zh_hk: 本金相同，利息不同
  step1_en: >-
    F interest: HK$7,800 on every path
  step1_zh: F 利息：每条路径 HK$7,800
  step1_zh_hk: F 利息：每條路徑 HK$7,800
  step2_en: >-
    V: HK$3,000 · 5,200 · 9,600
  step2_zh: V：HK$3,000 · 5,200 · 9,600
  step2_zh_hk: V：HK$3,000 · 5,200 · 9,600
  step3_en: >-
    Rising V by month 3: HK$200 short
  step3_zh: 上升路径 V 第 3 个月：缺 HK$200
  step3_zh_hk: 上升路徑 V 第 3 個月：差 HK$200
  s1_en: >-
    F costs 1,560,000 times 6 percent over twelve, which is 7,800 dollars of interest on every path.
  s1_zh: F的利息是一百五十六万乘以百分之六，再除以十二，即七千八百港元，每条路径都一样。
  s1_zh_hk: F嘅利息係一百五十六萬乘百分之六，再除十二，即係七千八百港元，每條路徑都一樣。
  s2_en: >-
    V starts with 800 dollars, then uses the 1,320,000 sum: 3,000 falling, 5,200 unchanged, and 9,600
    under rising stress.
  s2_zh: V第一个月是八百港元，之后用一百三十二万这个总和来算：下降路径三千，不变路径五千二百，上升压力下九千六百港元。
  s2_zh_hk: V第一個月係八百港元，之後用一百三十二萬呢個總和計：下降路徑三千，不變路徑五千二，上升壓力下九千六百港元。
  s3_en: >-
    Under rising stress, V's first three bills are 800, about 1,466.67 and 1,333.33. The pot holds 400,
    then about 33.33, and month 3 is 200 dollars short. F's pot ends at 0, 0 and 100.
  s3_zh: >-
    上升压力下，V前三个月利息约为八百、一千四百六十七和一千三百三十三港元。资金池先剩四百，再剩约三十三，第三个月差两百港元。F依次剩零、零和一百。
  s3_zh_hk: >-
    上升壓力下，V頭三個月利息大約係八百、一千四百六十七同一千三百三十三港元。資金池先剩四百，再剩大約三十三，第三個月差兩百港元。F就剩零、零同一百。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Resilience, not a rate forecast
  title_zh: 看承受力，不是预测利率
  title_zh_hk: 睇承受力，唔係預測利率
  step1_en: F passes; V needs HK$200 more, confirmed
  step1_zh: F 过关；V 需另落实 HK$200
  step1_zh_hk: F 過關；V 要另外落實 HK$200
  step2_en: >-
    F: +2,600, +4,800 or −1,800
  step2_zh: F 多付 2,600 或 4,800，或少付 1,800
  step2_zh_hk: F 多付 2,600 或 4,800，或少付 1,800
  step3_en: Certain payments ≠ equal payments
  step3_zh: 确定性是已知还款，不是等额
  step3_zh_hk: 確定性是已知還款，不是等額
  s1_en: >-
    F passes the owners' test; V does not yet. V needs at least 200 dollars of extra usable cash confirmed
    by month 3, without weakening the buffer or creating another unfunded obligation. Hoped-for income
    or credit does not count.
  s1_zh: >-
    F通过了业主的测试，V暂时还没有。V需要在第三个月之前，落实至少两百港元额外的可用现金，而且不能削弱现金缓冲，也不能再产生一笔没有资金来源的支付义务。预期的收入或信贷都不算。
  s1_zh_hk: >-
    F過咗東主嘅測試，V暫時未過。V要喺第三個月之前，落實最少兩百港元額外可用現金，而且唔可以削弱現金緩衝，亦唔可以再搞出一筆冇資金來源嘅支付責任。指望嘅收入或者信貸都唔計。
  s2_en: >-
    Certainty has a scenario-dependent cost. F costs 2,600 dollars more if rates are unchanged, 4,800
    more if they fall, and 1,800 less if they rise.
  s2_zh: 确定性的成本要看情景。利率不变，F多付两千六百港元；利率下降，多付四千八百；利率上升，反而少付一千八百。
  s2_zh_hk: 確定性嘅成本要睇情景。利率不變，F多俾兩千六百港元；利率跌，多俾四千八；利率升，反而少俾一千八。
  s3_en: >-
    Certainty means knowing the scheduled payments, not paying the same each month. Fixing the rate does
    not protect against weak sales, losses or default.
  s3_zh: 确定性是指预先知道要还多少，不是每个月还一样多。固定利率也挡不住销售转弱、经营亏损或违约。
  s3_zh_hk: 確定性係指預先知道要還幾多，唔係每個月還一樣多。固定利率亦擋唔住生意轉差、經營虧損或者違約。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Read the whole quote
  title_zh: 看清完整报价条款
  title_zh_hk: 睇清完整報價條款
  en: >-
    For actual quotes, check the benchmark, reset dates, margin, fees, calculation method, security, covenants
    and early-repayment conditions. With more verified cash capacity, V may be defensible without claiming
    to forecast rates.
  zh: >-
    面对真实报价，要核对基准利率、重设日期、利差、费用、计息方法、抵押、贷款契约和提前还款条件。如果核实过的现金能力更强，选V也说得通，而不需要声称自己能预测利率。
  zh_hk: >-
    面對真實報價，要核對基準利率、重設日期、息差、費用、計息方法、抵押、契諾同提早還款條件。如果核實過嘅現金能力更強，揀V都講得通，唔使話自己識預測利率。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Test cash, not forecasts
  title_zh: 检验现金，而非预测
  title_zh_hk: 檢驗現金，而非預測
  q1_en: A lower start can still miss a payment
  q1_zh: 起步利率低，也可能付不出
  q1_zh_hk: 起步利率低，也可能付不出
  q2_en: Count only confirmed cash
  q2_zh: 只计已落实的现金
  q2_zh_hk: 只計已落實的現金
  s1_en: >-
    Today's attractive rate need not settle the financing decision. The sources do not establish this
    workshop's rates or cash capacity.
  s1_zh: 今天看起来便宜的利率，不必就此决定融资选择。这些来源也说明不了这家工场的利率或现金能力。
  s1_zh_hk: 今日睇落平嘅利率，唔使就咁決定融資選擇。呢啲來源亦講唔到呢間工場嘅利率或者現金能力。
  s2_en: >-
    This is not a recommendation to take a real loan or use a particular lender.
  s2_zh: 这不是建议你借某笔真实贷款，也不是推荐某家贷款机构。
  s2_zh_hk: 呢個唔係建議你借某筆真實貸款，亦唔係推介某間貸款機構。
  s3_en: >-
    The workshop, quotes, rate paths and cash plan are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 工场、报价、利率路径和现金计划都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 工場、報價、利率路徑同現金計劃都係虛構嘅。官方場景圖只係教學插圖。
