  title_en: Cash for interest, months 1–3
  title_zh: 前 3 个月可付息现金
  title_zh_hk: 頭 3 個月可付息現金
  step1_en: >-
    New cash: HK$1,200 · 1,100 · 1,100
  step1_zh: 新拨入：HK$1,200 · 1,100 · 1,100
  step1_zh_hk: 新撥入：HK$1,200 · 1,100 · 1,100
  step2_en: No starting pot; savings carry forward
  step2_zh: 初始为零，结余可留用
  step2_zh_hk: 起初為零，結餘可留用
  step3_en: >-
    Owners: pass all three paths
  step3_zh: 业主：三条路径都要过
  step3_zh_hk: 東主：三條路徑都要過
  s1_en: >-
    The bookkeeper now supplies new cash for interest in the first three months, after operating bills,
    principal and the minimum buffer: 1,200, 1,100 and 1,100 dollars.
  s1_zh: 簿记员现在给出前三个月可以用来付利息的新增现金，已经扣除经营开支、本金和最低现金缓冲，分别是一千二百、一千一百和一千一百港元。
  s1_zh_hk: 簿記員而家畀出頭三個月可以用嚟俾利息嘅新增現金，已經扣除營運開支、本金同最低現金緩衝，分別係一千二、一千一同一千一百港元。
  s2_en: >-
    There is no starting pot, but every unused dollar carries forward, including V's early savings. No
    extra credit is approved.
  s2_zh: 一开始没有多余的资金，但每一笔没用完的钱都可以留到后面，包括V前期省下的利息。没有另外批出的信贷。
  s2_zh_hk: 一開始冇多餘資金，但每一蚊冇用晒嘅錢都可以留到後面，包括V前期慳落嘅利息。冇另外批出嘅信貸。
  s3_en: >-
    Months 4 to 12 are fundable on every path if this early bottleneck is crossed. The owners require
    the choice to pass all three paths without breaching the buffer.
  s3_zh: 只要渡过这个前期的瓶颈，第四到第十二个月在每条路径下都付得起。业主要求所选的报价在三条路径下都能过关，而且不能跌破现金缓冲。
  s3_zh_hk: 只要過到呢個前期樽頸，第四至第十二個月喺每條路徑都俾得起。東主要求揀嘅報價喺三條路徑都要過關，而且唔可以跌穿現金緩衝。
