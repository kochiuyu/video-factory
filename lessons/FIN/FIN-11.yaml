  s1_en: >-
    The workshop needs 240,000 Hong Kong dollars for approved equipment. Quote F fixes the annual rate
    at 6 percent. Quote V starts at 4 percent in month one, then resets monthly. The floating rates already
    include the lender's margin.
  s1_zh: >-
    工场已经批准购买设备，需要二十四万港元。F报价把年利率固定在百分之六。V报价第一个月是百分之四，之后每月重新设定。表里的浮动利率已经包含贷款人的利差，不用再加。
  s1_zh_hk: >-
    工場已經批准買設備，要二十四萬港元。F報價將年利率固定喺百分之六。V報價第一個月係百分之四，之後每個月重新設定。表入面嘅浮動利率已經包埋貸款人嘅息差，唔使再加。
  s2_en: >-
    Both repay 20,000 dollars of principal each month-end, plus interest on that month's opening principal:
    opening principal times the annual rate, divided by twelve. There are no fees, caps, floors, early
    repayment or refinancing.
  s2_zh: >-
    两份报价都在每个月底偿还本金两万港元，再加上当月期初本金的利息，也就是期初本金乘以年利率，再除以十二。这里没有手续费、利率上限、利率下限、提前还款或再融资。
  s2_zh_hk: >-
    兩份報價都喺每個月尾還本金兩萬港元，再加當月期初本金嘅利息，即係期初本金乘年利率，再除十二。呢度冇手續費、利率上限、利率下限、提早還款或者再融資。
  s3_en: >-
    The opening balances add up to 1,560,000 dollars over all 12 months, and 1,320,000 dollars for months
    2 to 12. These paths are illustrations, not forecasts, and no probabilities are supplied.
  s3_zh: 十二个月的期初余额加起来是一百五十六万港元，第二到第十二个月加起来是一百三十二万港元。这些路径只是示意，不是预测，也没有给出概率。
  s3_zh_hk: 十二個月嘅期初餘額加埋係一百五十六萬港元，第二至第十二個月加埋係一百三十二萬港元。呢啲路徑只係示意，唔係預測，亦冇畀機率。
