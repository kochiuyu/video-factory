  title_en: Rent the equipment. Keep the exit?
  title_zh: 租下这台设备，退路还留得住吗？
  title_zh_hk: 租下這台設備，退路還留得住嗎？
  image: art/rent-and-exit-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 17 September 2025, Hong Kong extended the application period for the 80 per cent Guarantee Product
    under the SME Financing Guarantee Scheme. That concerned access to financing, not which assets to
    acquire. Now you advise a fictional surveying firm that already has the funds.
  zh: >-
    2025年9月17日，香港宣布延长中小企融资担保计划下八成信贷担保产品的申请期。这关乎企业能否获得融资，而不是该购置哪项资产。现在，你要为一家虚构的测量公司出主意，它两条路的钱都已经准备好了。
  zh_hk: >-
    2025年9月17號，香港宣布延長中小企融資擔保計劃下八成信貸擔保產品嘅申請期。呢個關乎企業攞唔攞到融資，唔係應該買邊樣資產。而家，你要幫一間虛構嘅測量公司出主意，佢兩條路嘅錢都已經準備好。
