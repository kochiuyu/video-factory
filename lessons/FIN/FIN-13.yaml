  s1_en: >-
    The wholesaler has delivered an order and issued an undisputed 100,000-dollar invoice, due on day
    60. It needs 90,000 dollars today for separately approved working capital. The goods' costs are already
    incurred and unchanged.
  s1_zh: >-
    批发商已经交货，开出一张十万港元的发票，第六十天到期，目前没有争议。它今天需要九万港元，用作另外批准的营运资金。货物成本已经发生，不受这个决定影响。
  s1_zh_hk: >-
    批發商已經交咗貨，開咗一張十萬港元嘅發票，第六十日到期，暫時冇爭議。佢今日要九萬港元，用嚟做另外批咗嘅營運資金。貨品成本已經發生咗，唔受呢個決定影響。
  s2_en: >-
    A factor offers 98,000 dollars today for the whole invoice, with no reserve held back. The 2,000-dollar
    difference is the entire non-refundable charge. The headline says invoice purchase and collection
    service, but the repayment clauses have not yet been read.
  s2_zh: >-
    保理商今天出九万八千港元，买下整张发票，不预留保留款。中间差的两千港元就是全部费用，不退还。标题写的是购买发票加代收服务，但详细的还款条款还没看。
  s2_zh_hk: >-
    保理商今日出九萬八千港元，買起成張發票，唔預留保留款。中間差嘅兩千港元就係全部費用，唔退。標題寫住購買發票加代收服務，但係詳細還款條款仲未睇。
  s3_en: >-
    Alternatively, it keeps the invoice and draws an approved 90,000-dollar bridge, repaying 93,000 dollars
    on day 60, even if the customer does not pay. Other funded resources could cover repayment if the
    customer fails to pay.
  s3_zh: 另一条路是保留发票，提取已获批的九万港元过渡融资，第六十天还九万三千港元；就算客户不付款，也一样要还。如果客户不付，公司另有资金足以还款。
  s3_zh_hk: 另一條路係留住發票，提取已經批咗嘅九萬港元過渡融資，第六十日還九萬三千港元；就算客戶唔俾錢，都一樣要還。如果客戶唔俾，公司另外有錢夠還。
