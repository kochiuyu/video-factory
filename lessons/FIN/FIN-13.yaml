  title_en: The invoice is sold. Is the risk gone?
  title_zh: 发票卖出去了，风险就没了吗？
  title_zh_hk: 發票賣出去了，風險就沒了嗎？
  image: art/cash-before-risk-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 29 April 2026, the Hong Kong Monetary Authority and the banking sector announced extra SME support,
    including trade-finance arrangements. Access to finance does not settle who bears an unpaid invoice.
    Now you advise a fictional Hong Kong stationery wholesaler.
  zh: >-
    2026年4月29日，香港金融管理局和银行业宣布了更多支持中小企业的措施，包括贸易融资安排。能拿到融资，并不说明发票收不回来时由谁承担。现在，你要为香港一家虚构的文具批发商出主意。
  zh_hk: >-
    2026年4月29號，香港金融管理局同銀行業宣布咗更多支援中小企嘅措施，包括貿易融資安排。攞到融資，唔代表發票收唔到錢嗰陣由邊個承擔。而家，你要幫香港一間虛構嘅文具批發商出主意。
