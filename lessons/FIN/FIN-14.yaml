  en: >-
    On 22 October 2026, Hong Kong's Census and Statistics Department released September consumer-price
    figures. A price index measures a basket over a period; it is not automatically a forecast for an
    equipment project. Now you check a fictional packaging workshop's spreadsheets.
  zh: >-
    2026年10月22日，香港政府统计处公布了九月份的消费物价数据。物价指数衡量的是某一篮子商品在某段时期的价格，不会自动变成某个设备项目的预测。现在，你要核对香港一家虚构包装工场的两张表格。
  zh_hk: >-
    2026年10月22號，香港政府統計處公布咗九月嘅消費物價數字。物價指數量度嘅係某一籃子貨品喺某段時間嘅價格，唔會自動變成某個設備項目嘅預測。而家，你要幫香港一間虛構包裝工場核對兩張表。
