  s1_en: >-
    A packaging workshop is considering a cutting machine costing 110,000 dollars today, including installation,
    to run for three years. Two spreadsheets describe the same project, but give opposite signs for its
    net present value: the value today of future net cash flows, less today's outlay.
  s1_zh: >-
    包装工场考虑买一台切割机，连安装今天要十一万港元，用三年。两张表说的是同一个项目，净现值却一正一负。净现值就是未来净现金流在今天的价值，减去今天的投入。
  s1_zh_hk: >-
    包裝工場諗緊買部切割機，連安裝今日要十一萬港元，用三年。兩張表講同一個項目，淨現值就一正一負。淨現值即係將來淨現金流喺今日嘅價值，減今日嘅投入。
  s2_en: >-
    Sheet A calls its flows today's purchasing power: 42,000 dollars each year-end. Sheet B calls them
    future money: 43,680, 45,427.20, and 47,244.288. Both discount at 9.2 percent a year.
  s2_zh: >-
    A表把现金流称为今天的购买力，每年年末四万二千港元。B表称为将来的钱，分别是43,680、45,427.2和47,244.288港元。两张表都用每年百分之九点二折现。
  s2_zh_hk: >-
    A表將現金流叫做今日嘅購買力，每年年尾四萬二千港元。B表叫做將來嘅錢，分別係43,680、45,427.2同47,244.288港元。兩張表都用每年百分之九點二折現。
  s3_en: >-
    A reports NPV of about minus 4,063; B about plus 4,376. A negative NPV fails this screen; a positive
    one supports further consideration, not a purchase. No order has been placed.
  s3_zh: A表算出净现值约负四千零六十三，B表约正四千三百七十六。净现值为负就过不了这次财务筛选；为正也只是值得继续考虑，不是一定要买。现在还没下单。
  s3_zh_hk: >-
    A表計出淨現值大約負四千零六十三，B表大約正四千三百七十六。淨現值係負就過唔到今次財務篩選；係正都只係值得繼續考慮，唔係一定要買。而家仲未落單。
