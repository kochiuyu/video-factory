  s1_en: >-
    The company is considering two one-year projects. A expands its familiar document-support service.
    B launches a new discretionary event-design service. Each needs 100,000 dollars now and forecasts
    112,000 dollars of net cash in one year.
  s1_zh: >-
    公司在考虑两个为期一年的项目。A扩大它熟悉的文件支持服务；B新开一项非必需的活动设计服务。两个项目现在都要投入十万港元，预计一年后净现金十一万二千港元。
  s1_zh_hk: >-
    公司諗緊兩個為期一年嘅項目。A擴大佢熟悉嘅文件支援服務；B新開一項非必需嘅活動設計服務。兩個項目而家都要投十萬港元，預計一年後淨現金十一萬二千港元。
  s2_en: >-
    The company normally screens projects at an 8 percent annual cost of capital, estimated for its established
    activities and current financing mix. One analyst proposes that rate for both. A second analyst wants
    a project-risk review first.
  s2_zh: >-
    公司平时用每年百分之八的资本成本筛选项目，这个数是按现有业务和目前的融资结构估算的。一位分析师建议两个项目都用这个利率；另一位则想先做项目风险复核。
  s2_zh_hk: >-
    公司平時用每年百分之八嘅資本成本篩選項目，呢個數係按現有業務同而家嘅融資結構估出嚟。一位分析師建議兩個項目都用呢個利率；另一位就想先做項目風險覆核。
  s3_en: >-
    Amounts are nominal Hong Kong dollars, after operating costs, taxes and working capital. Financing
    flows are excluded because the discount rate covers capital providers' required return. Neither project
    is approved yet.
  s3_zh: 金额都是名义港元，已经扣除经营成本、税和营运资金变动。融资现金流不计在内，因为折现率已经反映了资本提供者要求的回报。两个项目都还没批。
  s3_zh_hk: 金額都係名義港元，已經扣除經營成本、稅同營運資金變動。融資現金流唔計，因為折現率已經反映咗資本提供者要求嘅回報。兩個項目都未批。
- id: pause1
