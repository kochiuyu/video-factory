  title_en: One company. One hurdle rate?
  title_zh: 一家公司，一个门槛回报率？
  title_zh_hk: 一家公司，一個門檻回報率？
  image: art/one-company-one-hurdle-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 17 September 2026, the Hong Kong Monetary Authority announced a Base Rate of 4.25 percent, which
    applies to its Discount Window. That monetary-policy rate is not an appraisal rate for every business.
    Now you brief a fictional Hong Kong business-services company.
  zh: >-
    2026年9月17日，香港金融管理局宣布基本利率为百分之四点二五，这个利率用于贴现窗。货币政策利率并不是每家企业都能直接拿来用的投资评估利率。现在，你要为香港一家虚构的商业服务公司准备汇报。
  zh_hk: >-
    2026年9月17號，香港金融管理局宣布基本利率係百分之四點二五，呢個利率用喺貼現窗。貨幣政策利率唔係每間企業都可以直接攞嚟用嘅投資評估利率。而家，你要幫香港一間虛構嘅商業服務公司準備匯報。
