  footer_zh_hk: 每行權重 1/4 · 同一行相加
  s1_en: >-
    The business can add one contract portfolio with funded capacity. A adds event-display preparation;
    B adds document digitisation. Both need the same setup outlay and management time, and neither changes
    cash from the existing line.
  s1_zh: >-
    这家企业可以用现有、已备资金的产能，再加一个合约组合。A是活动展示筹备，B是文件数字化。两者的启动支出和管理时间相同，选哪个都不影响现有业务的现金。
  s1_zh_hk: >-
    呢間公司可以用現有、已經預咗錢嘅產能，再加一個合約組合。A係活動展示籌備，B係文件數碼化。兩個嘅開辦支出同管理時間一樣，揀邊個都唔影響現有業務嘅現金。
  s2_en: >-
    The owner wants steadier total monthly operating cash, not the biggest good month. Four ordinary scenarios
    are weighted one quarter each. A common 100,000-dollar monthly commitment must be paid from the combined
    total.
  s2_zh: 老板想要的是每月经营现金总额更稳定，而不是某个月特别好。四个普通情景各占四分之一的权重。每月还有十万港元的共同支出，要从合计现金里支付。
  s2_zh_hk: 老闆想要嘅係每月經營現金總數穩定啲，唔係某個月特別好。四個普通情景各佔四分之一權重。每個月仲有十萬港元嘅共同支出，要喺合計現金度俾。
  s3_en: >-
    Each row is one shared operating environment, so combine within a row. A and B each average 35,000
    dollars, with the same standalone values: 20, 30, 40 and 50 thousand. Only their order against the
    existing line differs.
  s3_zh: >-
    每一行代表同一个经营环境，所以要在同一行里相加。A和B平均都是三万五千港元，单独看的数值也一样：两万、三万、四万和五万。不同的只是它们跟现有业务的排列次序。
  s3_zh_hk: >-
    每一行代表同一個經營環境，所以要喺同一行入面相加。A同B平均都係三萬五千港元，單獨睇嘅數值都一樣：兩萬、三萬、四萬同五萬。唔同嘅只係佢哋同現有業務嘅排列次序。
