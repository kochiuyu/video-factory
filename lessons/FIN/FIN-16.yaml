  title_en: Two income streams. One bad month?
  title_zh: 两路收入，一个糟糕的月份？
  title_zh_hk: 兩路收入，一個糟糕的月份？
  image: art/cash-moves-together-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 27 September 2024, Hong Kong's Investor and Financial Education Council explained that diversification
    depends on how investments move together, not only on holding different names. This case applies that
    idea to operating cash, not securities. Now you advise a fictional event-preparation business.
  zh: >-
    2024年9月27日，香港的投资者及理财教育委员会解释说，分散风险要看各项投资怎样一起变动，不只是持有不同的投资。这个案例把这个道理用在经营现金流上，而不是买证券。现在，你要为一家虚构的活动筹备企业出主意。
  zh_hk: >-
    2024年9月27號，香港嘅投資者及理財教育委員會解釋，分散風險要睇各項投資點樣一齊郁，唔只係揸住唔同嘅投資。呢個案例將呢個道理用喺經營現金流，唔係買證券。而家，你要幫一間虛構嘅活動籌備公司出主意。
