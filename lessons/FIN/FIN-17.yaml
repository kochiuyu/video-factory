  title_en: More credit. A tighter promise?
  title_zh: 信贷更多，承诺就更紧吗？
  title_zh_hk: 信貸更多，承諾就更緊嗎？
  image: art/cheaper-credit-tighter-promise-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    FIT Hon Teng's 2025 interim report, filed on Hong Kong's exchange on 30 September 2025, disclosed
    financial covenants on certain borrowings and reported compliance. Financing terms can include financial
    ratios; that is not a suggested breach. Now you advise a fictional Hong Kong distributor.
  zh: >-
    FIT Hon Teng在2025年9月30日向香港交易所提交的2025年中期报告，披露了部分借款附带财务契约，并报告期内一直符合要求。融资条款可以包含财务比率，这并不表示该公司违约。现在，你要为香港一家虚构的分销商出主意。
  zh_hk: >-
    FIT Hon Teng喺2025年9月30號向香港交易所提交嘅2025年中期報告，披露咗部分借款附帶契諾，並報告期內一直符合。融資條款可以包括財務比率，呢個唔代表嗰間公司違約。而家，你要幫香港一間虛構嘅分銷商出主意。
