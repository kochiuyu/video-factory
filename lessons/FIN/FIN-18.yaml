  title_en: Ladder or liquid first?
  title_zh: 到期阶梯还是先留活期？
  title_zh_hk: 到期階梯定先留活期？
  en: >-
    Which policy would you choose for the known payment schedule? And how much interest would you give
    up to keep the first payment liquid? Pause and vote.
  zh: 按已知的付款日程，你会选哪一种做法？为了让第一笔付款随时可用，你要放弃多少利息？请暂停，投个票。
  zh_hk: 按已知嘅付款日程，你會揀邊種做法？為咗第一筆付款隨時用得，你要放棄幾多利息？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: >-
    Day 15: an early-delivery offer
  title_zh: 第 15 天：提早交货的提议
  title_zh_hk: 第 15 天：提早交貨的提議
  step1_en: Pay HK$59,700 today instead of 60,000
  step1_zh: 今天付 HK$59,700，代替 60,000
  step1_zh_hk: 今天付 HK$59,700，代替 60,000
  step2_en: >-
    A: break deposit, no interest, −HK$200
  step2_zh: A：提前支取，无利息，扣 HK$200
  step2_zh_hk: A：提早提取，無利息，扣 HK$200
  step3_en: >-
    B: cash on demand, 15 days' interest
  step3_zh: B：活期随时可用，有 15 天利息
  step3_zh_hk: B：活期隨時可用，有 15 天利息
  s1_en: >-
    Treat each policy as already in place on day 0. On day 15, the first supplier offers optional early
    delivery for 59,700 dollars that day, instead of 60,000 on day 30. Quality is unchanged, and declining
    carries no penalty.
  s1_zh: >-
    把两种做法都当成第零天已经定好。到了第十五天，第一家供应商提出可以提早交货，当天付五万九千七百港元，代替第三十天的六万。质量不变，拒绝也不会被罚。
  s1_zh_hk: 將兩種做法都當成第零日已經定咗。到第十五日，第一間供應商話可以提早交貨，當日俾五萬九千七百港元，代替第三十日嘅六萬。質素唔變，拒絕都唔會罰。
  s2_en: >-
    Under A, the bank will allow early withdrawal of the whole 60,000-dollar 30-day deposit, paying no
    interest and deducting a 200-dollar fee from principal. Partial withdrawal is not allowed.
  s2_zh: 在A之下，银行同意让那笔六万港元的三十天定期整笔提前支取，但不付利息，还要从本金扣两百港元手续费，不能只取一部分。
  s2_zh_hk: 喺A之下，銀行同意嗰筆六萬港元三十日定期成筆提早提取，但唔俾利息，仲要喺本金扣兩百港元手續費，唔可以淨係攞一部分。
  s3_en: >-
    Under B, the 60,000 on-demand balance is available with no fee, and earns 15 days of interest. Leftover
    money is parked without further interest through day 90.
  s3_zh: 在B之下，六万港元活期余额随时可以用，不收手续费，还有十五天的利息。剩下的钱放到第九十天，不再计息。
  s3_zh_hk: 喺B之下，六萬港元活期餘額隨時用得，唔收手續費，仲有十五日利息。剩低嘅錢放到第九十日，唔再計息。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Accept the early delivery?
  title_zh: 接受提早交货吗？
  title_zh_hk: 接受提早交貨嗎？
  en: >-
    Under each policy, would you accept the early-delivery offer? Reconcile the discount with lost interest
    and fees, then explain what this one opportunity says about liquidity. Pause and vote.
  zh: 两种做法之下，你会不会接受提早交货？把折扣、损失的利息和手续费对一对，再说说这次机会说明了流动性的什么。请暂停，投个票。
  zh_hk: 兩種做法之下，你會唔會接受提早交貨？將折扣、損失嘅利息同手續費對一對，再講吓今次機會話咗流動性啲咩。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Fund the dates first
  title_zh: 先按日期备好资金
  title_zh_hk: 先按日期備好資金
  step1_en: >-
    A interest: 120 + 450 + 1,350 = 1,920
  step1_zh: A 利息：120 + 450 + 1,350 = 1,920
  step1_zh_hk: A 利息：120 + 450 + 1,350 = 1,920
  step2_en: >-
    B: first 60,000 earns 30 → 1,830
  step2_zh: B：首笔 60,000 赚 30 → 1,830
  step2_zh_hk: B：首筆 60,000 賺 30 → 1,830
  step3_en: Liquidity costs HK$90 at the start
  step3_zh: 保持流动的起始代价：HK$90
  step3_zh_hk: 保持流動的起始代價：HK$90
  s1_en: >-
    For the ladder, 60,000 times 2.4 percent times 30 over 360 is 120 dollars. The 90,000 earns 450, and
    the 150,000 earns 1,350.
  s1_zh: 到期阶梯下，六万乘百分之二点四，再乘三十除以三百六十，是一百二十港元。九万赚四百五十，十五万赚一千三百五十。
  s1_zh_hk: 到期階梯之下，六萬乘百分之二點四，再乘三十除三百六十，係一百二十港元。九萬賺四百五十，十五萬賺一千三百五十。
  s2_en: >-
    The ladder's total is 1,920 dollars. B earns 30 on its first cash balance instead of 120, so its total
    is 1,830.
  s2_zh: 阶梯合计一千九百二十港元。B的第一笔活期只赚三十，不是一百二十，所以合计一千八百三十。
  s2_zh_hk: 階梯合共一千九百二十港元。B第一筆活期只賺三十，唔係一百二十，所以合共一千八百三十。
  s3_en: >-
    So the initial price of keeping 60,000 liquid is 90 dollars, not the whole interest on the reserve.
  s3_zh: 所以，让六万港元保持流动，一开始的代价是九十港元，而不是整笔储备的利息。
  s3_zh_hk: 所以，等六萬港元保持流動，一開始嘅代價係九十港元，唔係成筆儲備嘅利息。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Price the actual exit branch
  title_zh: 给实际退出算价
  title_zh_hk: 為實際退出計價
  step1_en: >-
    A: +300 − 120 − 200 = −20 → decline
  step1_zh: A：+300 − 120 − 200 = −20 → 拒绝
  step1_zh_hk: A：+300 − 120 − 200 = −20 → 拒絕
  step2_en: >-
    B: +300 − 15 = +285 → accept
  step2_zh: B：+300 − 15 = +285 → 接受
  step2_zh_hk: B：+300 − 15 = +285 → 接受
  step3_en: >-
    Best branches: A 1,920 · B 2,115
  step3_zh: 各取最佳：A 1,920 · B 2,115
  step3_zh_hk: 各取最佳：A 1,920 · B 2,115
  s1_en: >-
    The discount is 300 dollars. A gives up 120 of interest and pays a 200 fee, so paying early is 20
    dollars worse. A should decline this optional offer.
  s1_zh: 折扣是三百港元。A要放弃一百二十的利息，还要付两百手续费，提早付款反而差二十港元，所以A应该拒绝。
  s1_zh_hk: 折扣係三百港元。A要放棄一百二十利息，仲要俾兩百手續費，提早俾錢反而差二十港元，所以A應該拒絕。
  s2_en: >-
    B earns 15 dollars over 15 days instead of 30 over 30 days. It gives up 15 but saves 300, a net gain
    of 285. B should accept if the facts stay as stated.
  s2_zh: B在十五天里赚十五港元，而不是三十天赚三十，少了十五，却省下三百，净赚二百八十五。只要条件不变，B应该接受。
  s2_zh_hk: B喺十五日賺十五港元，唔係三十日賺三十，少咗十五，但慳咗三百，淨賺二百八十五。只要條件唔變，B應該接受。
  s3_en: >-
    With the best choice in each branch, A keeps 1,920, and B has 1,830 plus 285, which is 2,115, or 195
    more. One good event does not prove B was always best on day 0.
  s3_zh: >-
    各自选最好的做法，A保住一千九百二十，B是一千八百三十加二百八十五，等于二千一百一十五，多一百九十五。但一次好机会，不能证明B在第零天一定最好。
  s3_zh_hk: >-
    各自揀最好嘅做法，A保住一千九百二十，B係一千八百三十加二百八十五，即係二千一百一十五，多一百九十五。但一次好機會，唔證明B喺第零日一定最好。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Liquidity has a price and a use
  title_zh: 流动性有价格，也有用处
  title_zh_hk: 流動性有價格，也有用處
  en: >-
    No frequency or probability of such offers was supplied. Keep a maturity calendar and a deliberate
    liquidity buffer, rather than infer a universal rule from one favourable event. Never assume another
    bank's early-exit policy.
  zh: >-
    题目没有给出这类提议出现的频率或概率。要做好存款到期日历，并有意识地留出流动性缓冲，不要从一次有利的事件推出普遍规则。也不要假定别家银行的提前支取政策都一样。
  zh_hk: >-
    題目冇畀呢類提議出現嘅頻率或者機率。要做好存款到期日曆，刻意留一個流動性緩衝，唔好因為一次有利嘅事就推出普遍規則。亦唔好假設第二間銀行嘅提早提取安排都一樣。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Match deposits to payment dates
  title_zh: 存款期限要对准付款日
  title_zh_hk: 存款期限要對準付款日
  q1_en: Know what early exit really costs
  q1_zh: 弄清提前支取的真实代价
  q1_zh_hk: 弄清提早提取的真實代價
  q2_en: One good event is not a rule
  q2_zh: 一次好结果不是规律
  q2_zh_hk: 一次好結果不是規律
  s1_en: >-
    Time deposits are not always withdrawable; check the fees and the permission before a payment date
    changes.
  s1_zh: 定期存款不一定能提前支取；付款日有变之前，要先核对手续费和银行是否允许。
  s1_zh_hk: 定期存款唔一定可以提早提取；付款日有變之前，要先核對手續費同銀行准唔准。
  s2_en: >-
    Compare policies; this exercise opens no accounts and moves no real money.
  s2_zh: 这里只比较做法，不开户，也不动用真实的钱。
  s2_zh_hk: 呢度只係比較做法，唔開戶，亦唔郁真錢。
  s3_en: >-
    The studio, rates, terms, payment dates and charges are fictional, not bank quotations. Official scene
    art is a teaching illustration only.
  s3_zh: 工作室、利率、条款、付款日和收费都是虚构的，不是银行报价。官方场景图只是教学插图。
  s3_zh_hk: 工作室、利率、條款、付款日同收費都係虛構嘅，唔係銀行報價。官方場景圖只係教學插圖。
