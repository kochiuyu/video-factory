  title_en: Earn more interest. Available on which day?
  title_zh: 利息赚得更多，哪一天拿得到？
  title_zh_hk: 利息賺得更多，哪一天拿得到？
  image: art/cash-on-the-day-it-is-needed-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The Hong Kong Monetary Authority's September 2025 stability report described lower retail Hong Kong-dollar
    time-deposit rates in the first half of 2025, as liquidity eased. That is historical context, not
    an offer or a forecast. Now you plan a fictional design studio's reserve.
  zh: >-
    香港金融管理局2025年9月的稳定报告提到，2025年上半年流动性有所缓和，零售港元定期存款利率随之下降。这是过去的银行业背景，不是现在的报价，也不是预测。现在，你要为一家虚构设计工作室安排一笔储备。
  zh_hk: >-
    香港金融管理局2025年9月嘅穩定報告提到，2025年上半年流動性放鬆咗，零售港元定期存款利率跟住跌。呢個係過去嘅銀行業背景，唔係而家嘅報價，亦唔係預測。而家，你要幫一間虛構設計工作室安排一筆儲備。
