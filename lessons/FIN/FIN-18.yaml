  s1_en: >-
    The studio has 300,000 dollars reserved for three supplier payments: 60,000 on day 30, 90,000 on day
    60, and 150,000 on day 90. Other needs are funded separately, and no borrowing is available within
    this reserve.
  s1_zh: 工作室留出三十万港元，专门用来付三笔供应商货款：第三十天六万，第六十天九万，第九十天十五万。其他开支另有资金，这笔储备里也不能借钱。
  s1_zh_hk: 工作室預留咗三十萬港元，專門俾三筆供應商貨款：第三十日六萬，第六十日九萬，第九十日十五萬。其他開支另外有錢，呢筆儲備入面亦唔可以借錢。
  s2_en: >-
    The maturity ladder puts each payment in a deposit maturing on its due day. The liquid-first plan
    keeps the first 60,000 on demand, and uses the same deposits for the later two. Keeping everything
    until day 90 is not allowed: it would miss earlier payments.
  s2_zh: >-
    到期阶梯是把每笔付款放进刚好在付款日到期的定期存款。先留活期的做法，是把第一笔六万放在活期，后面两笔照样做定期。把全部钱存到第九十天不可行，因为会错过前面的付款。
  s2_zh_hk: >-
    到期階梯即係將每筆付款放入啱啱喺付款日到期嘅定期存款。先留活期嘅做法，就係將第一筆六萬擺喺活期，後面兩筆照做定期。將全部錢存到第九十日唔得，因為會錯過前面嘅付款。
  s3_en: >-
    Fictional simple annual rates are 2.4 percent for 30 days, 3.0 for 60, and 3.6 for 90; on-demand cash
    earns 0.6. Interest is principal times rate times days over 360, with no compounding or tax.
  s3_zh: >-
    虚构的单利年利率是：三十天百分之二点四，六十天百分之三，九十天百分之三点六，活期百分之零点六。利息等于本金乘年利率，再乘天数除以三百六十，不计复利，也不计税。
  s3_zh_hk: >-
    虛構嘅單利年利率係：三十日百分之二點四，六十日百分之三，九十日百分之三點六，活期百分之零點六。利息等於本金乘年利率，再乘日數除三百六十，唔計複利，亦唔計稅。
