  row1_en: >-
    A: order processing
  row1_zh: A：订单处理升级
  row1_zh_hk: A：訂單處理升級
  row2_en: >-
    B: picking workflow
  row2_zh: B：拣货流程升级
  row2_zh_hk: B：揀貨流程升級
  row3_en: >-
