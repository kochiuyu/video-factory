  title_en: The best project. The best set of projects?
  title_zh: 最好的项目。最好的一组项目？
  title_zh_hk: 最好的項目。最好的一組項目？
  image: art/best-project-best-package-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 13 December 2024, Hong Kong announced that the Technology Voucher Programme would stop accepting
    applications after 31 December 2024. That is context for reviewing investment funding, not proof that
    any firm lost an award. Now you advise a fictional stationery wholesaler, with no subsidy assumed.
  zh: >-
    2024年12月13日，香港宣布科技券计划在2024年12月31日之后停止接受申请。这只是审视投资资金时的背景，不能证明哪家公司失去了已承诺的资助。现在，你要为一家虚构的文具批发商出主意，这里不假设有任何补贴。
  zh_hk: >-
    2024年12月13號，香港宣布科技券計劃喺2024年12月31號之後停止接受申請。呢個只係檢視投資資金嘅背景，唔證明有邊間公司冇咗已承諾嘅資助。而家，你要幫一間虛構文具批發商出主意，呢度唔假設有任何資助。
