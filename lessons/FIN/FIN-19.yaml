  row3_zh: C：发货流程升级
  row3_zh_hk: C：發貨流程升級
  col1_en: Outlay now
  col1_zh: 现在支出
  col1_zh_hk: 現在支出
  col2_en: Supplied NPV
  col2_zh: 所给净现值
  col2_zh_hk: 所給淨現值
  c11: '70'
  c12: '35'
