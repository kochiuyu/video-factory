  title_en: A good year. A distributable surplus?
  title_zh: 好的一年。就有可分派盈余吗？
  title_zh_hk: 好的一年。就有可分派盈餘嗎？
  image: art/good-year-distributable-surplus-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 12 March 2025, Cathay's annual-results announcement discussed ordinary dividends alongside investment
    commitments and other uses of funds. It shows several claims on corporate cash, not a model payout
    ratio for a small business. Now you advise the owners of a fictional seasonal business.
  zh: >-
    2025年3月12日，国泰航空的全年业绩公告，把普通股股息、投资承诺和其他资金用途放在一起讨论。这说明公司的现金同时有好几项用途要照顾，并不是给小企业参考的派息比率。现在，你要为一家虚构季节性企业的老板出主意。
  zh_hk: >-
    2025年3月12號，國泰航空嘅全年業績公告，將普通股股息、投資承擔同其他資金用途擺埋一齊講。呢個說明公司嘅現金同時有好幾樣用途要顧，唔係俾細企業參考嘅派息比率。而家，你要幫一間虛構季節性企業嘅老闆出主意。
