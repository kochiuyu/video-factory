  s1_en: >-
    Advance exactly one year. A newly approved, non-deferrable payment of 200,000 dollars must now come
    from this reserve, with no other funds or borrowing before the deadline.
  s1_zh: 时间正好往前走一年。一笔新批准、不能推迟的二十万港元付款，现在必须从这笔储备里出，期限前不能用其他资金，也不能借钱。
  s1_zh_hk: 時間啱啱向前行一年。一筆新批准、唔可以押後嘅二十萬港元付款，而家要由呢筆儲備出，期限之前唔可以用其他錢，亦唔可以借錢。
  s2_en: >-
    The market yield used to value both holdings is now 6 percent, up two percentage points, with no change
    in promised payments or credit. S has one year left, and L has four.
  s2_zh: 用来给两笔持仓估值的市场收益率现在是百分之六，上升了两个百分点，承诺的付款和信用都没有变。S还剩一年，L还剩四年。
  s2_zh_hk: 用嚟為兩筆持倉估值嘅市場孳息率而家係百分之六，升咗兩個百分點，承諾嘅付款同信用都冇變。S仲有一年，L仲有四年。
  s3_en: >-
    Selling either whole position costs a flat 500-dollar fee. At 6 percent, S is priced at about 204,075
    dollars, and L at about 192,741. At an unchanged 4 percent, both would be 208,000.
  s3_zh: >-
    卖掉整笔持仓都要付五百港元的固定费用。按百分之六，S的价格约二十万四千零七十五港元，L约十九万二千七百四十一。如果收益率仍是百分之四，两笔都会是二十万八千。
  s3_zh_hk: >-
    賣晒成筆持倉都要俾五百港元固定費用。按百分之六，S嘅價大約係二十萬四千零七十五港元，L大約十九萬二千七百四十一。如果孳息率仲係百分之四，兩筆都會係二十萬八千。
