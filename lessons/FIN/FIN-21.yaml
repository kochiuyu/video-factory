  step1_en: >-
    S: 204,075.47 − 500 = 203,575.47
  step1_zh: S：204,075.47 − 500 = 203,575.47
  step1_zh_hk: S：204,075.47 − 500 = 203,575.47
  step2_en: S pays and keeps HK$3,575.47
  step2_zh: S 付完还剩 HK$3,575.47
  step2_zh_hk: S 付款後尚餘 HK$3,575.47
  step3_en: >-
    L: 192,240.61 → short HK$7,759.39
  step3_zh: L：192,240.61 → 差 HK$7,759.39
  step3_zh_hk: L：192,240.61 → 差 HK$7,759.39
  s1_en: >-
    Under S, sale proceeds after the fee are 204,075.47 minus 500, or 203,575.47 dollars.
  s1_zh: 按S，扣掉费用后的出售所得是二十万四千零七十五点四七减五百，即二十万三千五百七十五点四七港元。
  s1_zh_hk: 按S，扣咗費用之後嘅出售所得係二十萬四千零七十五點四七減五百，即係二十萬三千五百七十五點四七港元。
  s2_en: The company can pay 200,000 dollars and keep 3,575.47.
  s2_zh: 公司可以付出二十万港元，还剩三千五百七十五点四七。
  s2_zh_hk: 公司可以俾二十萬港元，仲剩三千五百七十五點四七。
  s3_en: >-
    Under L, proceeds are 192,240.61 dollars, a shortfall of 7,759.39. That gap is an unfunded payment,
    not permission to overdraw. S has one discounting period left, and L has four.
  s3_zh: >-
    按L，所得是十九万二千二百四十点六一港元，差七千七百五十九点三九。这个缺口是一笔没有资金来源的付款，不是允许透支。S只剩一个折现期，L还有四个。
  s3_zh_hk: >-
    按L，所得係十九萬二千二百四十點六一港元，差七千七百五十九點三九。呢個缺口係一筆冇資金來源嘅付款，唔係准你透支。S得返一個折現期，L仲有四個。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Why the later payment moves more
  title_zh: 为什么较晚的付款变动更大
  title_zh_hk: 為甚麼較晚的付款變動更大
  step1_en: >-
    vs 208,000: S −3,924.53 · L −15,259.39
  step1_zh: 对比 208,000：S −3,924.53 · L −15,259.39
  step1_zh_hk: 對比 208,000：S −3,924.53 · L −15,259.39
  step2_en: Later payment, greater duration
  step2_zh: 付款越晚，久期越大
  step2_zh_hk: 付款越遲，存續期越大
  step3_en: >-
    At 2%: S 212,078.43 · L 224,799.84
  step3_zh: 收益率 2%：S 212,078.43 · L 224,799.84
  step3_zh_hk: 孳息率 2%：S 212,078.43 · L 224,799.84
  s1_en: >-
    Against the same-date value of 208,000 at an unchanged yield, the rise cuts S by about 3,925 dollars
    and L by about 15,259, before the fee. S is still above its cost, but it did carry interest-rate exposure.
  s1_zh: >-
    和收益率不变时同一天的二十万八千相比，收益率上升让S少了约三千九百二十五港元，L少了约一万五千二百五十九，这还没扣费用。S仍高于成本，但它同样有利率风险。
  s1_zh_hk: >-
    同孳息率冇變時同一日嘅二十萬八千比，孳息率上升令S少咗大約三千九百二十五港元，L少咗大約一萬五千二百五十九，仲未計費用。S仲係高過成本，但佢一樣有利率風險。
  s2_en: >-
    Duration describes price sensitivity to yield changes. For these zero-coupon holdings, a later payment
    means greater duration. Equal yields are not equal durations, and equal credit does not remove market-price
    exposure.
  s2_zh: 久期描述的是价格对收益率变动的敏感程度。对这两笔零息持仓来说，付款越晚，久期越大。收益率相同不等于久期相同，信用相同也去不掉市场价格风险。
  s2_zh_hk: 存續期描述價格對孳息率變動有幾敏感。對呢兩筆零息持倉嚟講，付款越遲，存續期越大。孳息率一樣唔等於存續期一樣，信用一樣亦除唔走市場價格風險。
  s3_en: >-
    The sensitivity runs both ways. In a separate illustration with a 2 percent yield at year one, S would
    be worth about 212,078 dollars and L about 224,800, before fees. That is a scenario, not a prediction.
  s3_zh: 这种敏感是双向的。另举一例：如果第一年收益率是百分之二，扣费前S约值二十一万二千零七十八港元，L约值二十二万四千八百。这只是情景，不是预测。
  s3_zh_hk: >-
    呢種敏感係雙向嘅。另外舉個例：如果第一年孳息率係百分之二，未扣費之前S大約值二十一萬二千零七十八港元，L大約值二十二萬四千八百。呢個只係情景，唔係預測。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Plan for an early call
  title_zh: 为提前动用做准备
  title_zh_hk: 為提早動用做準備
  en: >-
    L was not irrational simply because this early-sale scenario hurts it. It fixes the year-five payment,
    while S must be reinvested at an unknown rate. No probabilities were given, so the outcome does not
    prove the better choice. A safeguard is to separate money that may be called early, and stress-test
    sale value first.
  zh: >-
    不能因为这个提前出售的情景伤到L，就说当初选L不理性。L锁定了第五年的付款，S则要按未知的利率再投资。题目没给概率，结果并不能证明哪个选择更好。一条防护措施，是把可能提前动用的钱分开管理，配置之前先对出售价值做压力测试。
  zh_hk: >-
    唔可以因為呢個提早賣出嘅情景傷到L，就話當初揀L唔理性。L鎖定咗第五年嘅付款，S就要用未知嘅利率再投資。題目冇俾機率，結果證明唔到邊個選擇好啲。一項保障，係將可能提早要用嘅錢分開處理，配置之前先為出售價值做壓力測試。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Same yield, different duration
  title_zh: 收益率相同，久期不同
  title_zh_hk: 孳息率相同，存續期不同
  q1_en: A yield quote is only a starting point
  q1_zh: 收益率报价只是起点
  q1_zh_hk: 孳息率報價只是起點
  q2_en: Size liquidity to a stated payment
  q2_zh: 按写明的付款来定流动性
  q2_zh_hk: 按寫明的付款釐定流動性
  s1_en: >-
    S passes this stated 6 percent scenario, not every shock. A maturity label or credit rating does not
    guarantee liquidity in real markets.
  s1_zh: S过得了这个写明的百分之六情景，但不是每一种冲击都过得了。到期日标签或信用评级，在真实市场上都不能保证流动性。
  s1_zh_hk: S過得到呢個寫明嘅百分之六情景，但唔係每一種衝擊都過得到。到期日標籤或者信用評級，喺真實市場都保證唔到流動性。
  s2_en: >-
    This is not a current bond offer, a forecast or advice to buy a security.
  s2_zh: 这不是当前的债券发行，不是预测，也不是买入证券的建议。
  s2_zh_hk: 呢個唔係而家嘅債券發售，唔係預測，亦唔係買入證券嘅建議。
  s3_en: >-
    The company, holdings, yields, fee and sale prices are fictional. Official scene art is a teaching
    illustration only.
  s3_zh: 公司、持仓、收益率、费用和卖价都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 公司、持倉、孳息率、費用同賣價都係虛構嘅。官方場景圖只係教學插圖。
