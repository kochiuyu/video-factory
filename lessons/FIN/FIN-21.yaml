  s1_en: >-
    The board has set aside 200,000 dollars for a refurbishment expected in five years. Operating bills
    and emergency needs are funded separately, and the plan needs none of this reserve before year five.
  s1_zh: 董事会留出二十万港元，用于预计五年后的一次翻新。经营账单和应急需要另有资金，按计划，第五年之前都用不到这笔储备。
  s1_zh_hk: 董事會撥咗二十萬港元，預備五年後嘅一次翻新。經營賬單同應急需要另外有錢，按計劃，第五年之前都唔使用呢筆儲備。
  s2_en: >-
    S pays once in two years, and L pays once in five years. Each costs 200,000 dollars today with a 4
    percent annual yield to maturity. Both are zero-coupon bonds, so neither pays interest along the way.
  s2_zh: S两年后付一次，L五年后付一次。两笔今天都要二十万港元，年到期收益率都是百分之四。两笔都是零息债券，中途都不付息。
  s2_zh_hk: S兩年後俾一次，L五年後俾一次。兩筆今日都係二十萬港元，年到期孳息率都係百分之四。兩筆都係零息債券，中途唔派息。
  s3_en: >-
    Credit exposure is identical, payment is in full, and there are no call rights or fees to buy. S would
    need reinvesting after year two at an unknown rate. L fixes its year-five payment if held and paid
    as promised.
  s3_zh: >-
    两笔的发行人信用风险相同，到期足额支付，没有提前赎回权，买入也不收费。S在第二年之后要再投资，利率未知；L如果持有到期并按承诺支付，第五年那笔付款就锁定了。
  s3_zh_hk: >-
    兩筆嘅發行人信用風險一樣，到期足額支付，冇提早贖回權，買入亦唔收費。S第二年之後要再投資，利率未知；L如果持有到期，又按承諾支付，第五年嗰筆付款就鎖定咗。
