  en: >-
    FINRA, the US SEC and Hong Kong investor-education guidance explain that fixed-income prices can fall
    when market yields rise, even if the promised payments do not change. Now you are the treasurer of
    a fictional Hong Kong design company.
  zh: >-
    美国金融业监管局、美国证券交易委员会和香港的投资者教育资料都解释过：即使承诺的付款不变，市场收益率上升时，固定收益产品的价格也可能下跌。现在，你是香港一家虚构设计公司的司库。
  zh_hk: >-
    美國金融業監管局、美國證監會同香港嘅投資者教育資料都解釋過：就算承諾嘅付款冇變，市場孳息率一升，固定收益產品嘅價格都可能跌。而家，你係香港一間虛構設計公司嘅司庫。
