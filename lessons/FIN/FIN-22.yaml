  s1_en: >-
    The workshop is considering a specialist finishing unit for one seasonal contract. It can afford either
    route without borrowing, or it can decline and earn zero extra cash.
  s1_zh: 这家工场在考虑为一份季节性合同添置一台专用后期加工设备。两条路它都付得起，不用借钱；也可以放弃，增量现金就是零。
  s1_zh_hk: 呢間工場考慮為一份季節性合約添置一部專門後期加工設備。兩條路佢都俾得起，唔使借錢；亦可以放棄，增量現金就係零。
  s2_en: >-
    Today, on day zero, it can commit 100,000 dollars to the unit, or pay a 10,000-dollar non-refundable
    reservation fee. The fee gives the right, but not the obligation, to pay a further 100,000 by day
    30. The fee is not credited against that payment.
  s2_zh: >-
    今天是第零天，可以投入十万港元买下设备，也可以付一万港元不可退还的预留费。这笔费用给你权利而不是义务：在第三十天之前再付十万港元。预留费不能抵扣这笔付款。
  s2_zh_hk: >-
    今日係第零日，可以落十萬港元買部設備，亦可以俾一萬港元唔退嘅預留費。呢筆費用俾你權利，唔係義務：喺第三十日之前再俾十萬港元。預留費唔可以抵嗰筆付款。
  s3_en: >-
    A perfectly informative demand signal arrives on day 20, with high and low demand each 50 percent
    likely. Day-180 cash is 160,000 if demand is high and 60,000 if low, before equipment and fee payments.
    Ignore interest; rank routes by expected incremental net cash.
  s3_zh: >-
    完全揭示需求的信号在第二十天到达，高、低需求的概率各占一半。第一百八十天的收款，高需求十六万，低需求六万，未扣设备款和预留费。不计利息，按期望增量净现金排序。
  s3_zh_hk: >-
    完全揭示需求嘅信號喺第二十日到，高、低需求嘅機率一半半。第一百八十日嘅收款，高需求十六萬，低需求六萬，未扣設備款同預留費。唔計利息，按期望增量淨現金排先後。
