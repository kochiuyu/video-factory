  title_en: Commit now. Pay for the option to wait?
  title_zh: 现在就投入。还是花钱买等待的选择权？
  title_zh_hk: 現在就投入。還是花錢買等待的選擇權？
  image: art/pay-for-time-to-decide-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Investment research distinguishes committing money now from keeping the right to invest after learning
    more. That flexibility is not free: a reservation can cost money and expire before uncertainty is
    resolved. Now you manage a fictional display-making workshop.
  zh: >-
    投资研究会区分两件事：现在就把钱投进去，和保留一份等了解更多再投资的权利。这种弹性不是免费的：预留要花钱，而且可能在不确定性消除之前就到期。现在，你管理一家虚构的展示制作工场。
  zh_hk: >-
    投資研究會分開兩件事：而家就落錢，同保留一個等知多啲先投資嘅權利。呢種彈性唔係免費嘅：預留要使錢，仲可能喺不確定性解決之前就到期。而家，你管理一間虛構嘅展覽製作工場。
