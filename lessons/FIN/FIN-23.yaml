  title_en: A next-round scenario
  title_zh: 下一轮融资的情景
  title_zh_hk: 下一輪融資的情景
  step1_en: >-
    Later investor: HK$1,000,000 at HK$5
  step1_zh: 后来的投资者：HK$5 投 HK$1,000,000
  step1_zh_hk: 後來的投資者：HK$5 投 HK$1,000,000
  step2_en: C converts just before the new shares
  step2_zh: C 在新股发行前一刻转换
  step2_zh_hk: C 在新股發行前一刻轉換
  step3_en: A scenario, not a committed investor
  step3_zh: 只是情景，不是已承诺的投资者
  step3_zh_hk: 只是情景，不是已承諾的投資者
  s1_en: >-
    Before choosing, the founders add a scenario: in either route, a later investor would put in one million
    dollars at 5 dollars per new share.
  s1_zh: 做决定之前，创始人加了一个情景：无论走哪条路，后来都会有一位投资者按每股五港元投入一百万港元。
  s1_zh_hk: 揀之前，創辦人加多一個情景：無論行邊條路，之後都會有一位投資者按每股五港元投一百萬港元。
  s2_en: >-
    Under C, conversion happens immediately before that new share issue. Under P, the first investor's
    shares were already issued. The next investor gets the shares bought at 5 dollars in either route.
  s2_zh: 在C之下，转换紧接在这次发行新股之前；在P之下，第一位投资者的股份早已发行。两条路下，新投资者都按每股五港元拿到相应的股数。
  s2_zh_hk: 喺C之下，轉換緊貼喺今次發新股之前；喺P之下，第一位投資者嘅股份早就發咗。兩條路下，新投資者都係按每股五港元攞返相應嘅股數。
  s3_en: >-
    This is a scenario, not a committed investor or a guaranteed valuation. All other terms and the pilot
    deadline are unchanged; calculate the two routes separately.
  s3_zh: 这只是一个情景，不是已承诺的投资者，也不是有保证的估值。其他条款和试点截止日期都不变，两条路要分开算。
  s3_zh_hk: 呢個只係一個情景，唔係已承諾嘅投資者，亦唔係有保證嘅估值。其他條款同試點截止日期都冇變，兩條路要分開計。
