  title_en: No price today. No dilution tomorrow?
  title_zh: 今天没有定价。明天就没有股权稀释吗？
  title_zh_hk: 今天沒有定價。明天就沒有股權攤薄嗎？
  image: art/unpriced-not-ownership-free-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Startup funding can buy shares now, or create a contractual right to shares later. Regulator education
    separates a future-equity agreement from current stock, and the contract's share-base definition matters.
    Now you advise two founders of a fictional Hong Kong software business.
  zh: >-
    初创企业融资，可以现在就买股份，也可以签合同、换取将来获得股份的权利。监管机构的投资者教育会把未来股权协议和现有股票分开，合同里怎样定义股份基数也很关键。现在，你要为香港一家虚构软件企业的两位创始人出主意。
  zh_hk: >-
    初創企業融資，可以而家就買股份，亦可以簽合約，換將來攞股份嘅權利。監管機構嘅投資者教育會將未來股權協議同現有股票分開，合約點樣定義股份基數都好關鍵。而家，你要幫香港一間虛構軟件企業嘅兩位創辦人出主意。
