  title_en: P, C, or postpone?
  title_zh: 选 P、C，还是推迟？
  title_zh_hk: 選 P、C，還是推遲？
  en: >-
    Would you provisionally choose P or C, or postpone the pilot? Explain the timing trade-off, and why
    no shares issued today does not mean no future dilution. Pause and vote.
  zh: 你会暂时选P还是C，或者推迟试点？请说明时间上的取舍，以及为什么今天不发股，不等于将来没有股权稀释。请暂停，投个票。
  zh_hk: 你暫時會揀P定C，定係押後試點？講吓時間上嘅取捨，同埋點解今日唔發股，唔等於將來冇股權攤薄。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
