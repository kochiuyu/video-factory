  title_en: Which price, and who owns what?
  title_zh: 用哪个价？各占多少？
  title_zh_hk: 用哪個價？各佔多少？
  en: >-
    Under the scenario, which conversion price applies to C, and what do the founders own after the new
    round under each route? Would the faster funding justify the difference for you, given what remains
    unknown? Pause and vote.
  zh: 在这个情景下，C适用哪个转换价？新一轮之后，每条路下创始人各持有多少？考虑到还有哪些未知，更快到账值不值得这个差别？请暂停，投个票。
  zh_hk: 喺呢個情景下，C用邊個轉換價？新一輪之後，每條路下創辦人各持有幾多？諗埋仲有咩未知，快啲到賬值唔值得呢個差別？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: First find the conversion price
  title_zh: 先找出转换价
  title_zh_hk: 先找出轉換價
  step1_en: >-
    Discount: 0.80 × HK$5 = HK$4
  step1_zh: 折扣价：0.80 × HK$5 = HK$4
  step1_zh_hk: 折扣價：0.80 × HK$5 = HK$4
  step2_en: >-
    Cap: 2,000,000 ÷ 1,000,000 = HK$2
  step2_zh: 上限价：2,000,000 ÷ 1,000,000 = HK$2
  step2_zh_hk: 上限價：2,000,000 ÷ 1,000,000 = HK$2
  step3_en: C gets 500,000 ÷ 2 = 250,000 shares
  step3_zh: C 得 500,000 ÷ 2 = 250,000 股
  step3_zh_hk: C 得 500,000 ÷ 2 = 250,000 股
  s1_en: The discount price is 0.8 times 5 dollars, or 4 dollars.
  s1_zh: 折扣价是零点八乘五港元，即四港元。
  s1_zh_hk: 折扣價係零點八乘五港元，即係四港元。
  s2_en: >-
    The cap price is two million divided by one million, or 2 dollars. The lower price, 2 dollars, applies.
    Do not apply the 20 percent discount again to the cap price.
  s2_zh: 上限价是两百万除以一百万，即两港元。取较低的两港元。不要把百分之二十的折扣再套到上限价上。
  s2_zh_hk: 上限價係兩百萬除一百萬，即係兩港元。揀低嗰個，兩港元。唔好將百分之二十嘅折扣再套落上限價度。
  s3_en: >-
    So C receives 500,000 divided by 2, or 250,000 shares. The cap limits the conversion price in this
    contract; it is not a promise of value, nor a cap on the founders' total dilution.
  s3_zh: 所以C得到五十万除以二，即二十五万股。在这份合同里，上限限制的是转换价，不是对企业价值的承诺，也不是创始人总稀释的上限。
  s3_zh_hk: 所以C攞到五十萬除二，即係二十五萬股。喺呢份合約入面，上限限制嘅係轉換價，唔係對企業價值嘅承諾，亦唔係創辦人總攤薄嘅上限。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Then build each share table
  title_zh: 再列出各自的股权表
  title_zh_hk: 再列出各自的股權表
  step1_en: >-
    P: 200,000 now → founders 83.33%
  step1_zh: P：现在发 200,000 股 → 创始人 83.33%
  step1_zh_hk: P：現在發 200,000 股 → 創辦人 83.33%
  step2_en: >-
    After round: P 71.43% · C 68.97%
  step2_zh: 新一轮后：P 71.43% · C 68.97%
  step2_zh_hk: 新一輪後：P 71.43% · C 68.97%
  step3_en: Gap about 2.46 points
  step3_zh: 相差约 2.46 个百分点
  step3_zh_hk: 相差約 2.46 個百分點
  s1_en: >-
    P issues 500,000 divided by 2.50, or 200,000 shares now, leaving the founders 83.33 percent before
    the new round. C's 250,000 conversion shares leave them 80 percent just before new money.
  s1_zh: P现在发行五十万除以二点五，即二十万股，新一轮之前创始人占百分之八十三点三三。C转换出二十五万股，新资金进来之前，创始人占百分之八十。
  s1_zh_hk: P而家發五十萬除二點五，即係二十萬股，新一輪之前創辦人佔百分之八十三點三三。C轉換出二十五萬股，新資金入嚟之前，創辦人佔百分之八十。
  s2_en: >-
    The later investor gets 200,000 shares either way. P totals 1,400,000 shares, with founders at 71.43
    percent. C totals 1,450,000, with founders at 68.97 percent.
  s2_zh: 两条路下，新投资者都拿到二十万股。P的总股数是一百四十万，创始人占百分之七十一点四三；C的总股数是一百四十五万，创始人占百分之六十八点九七。
  s2_zh_hk: 兩條路下，新投資者都係攞二十萬股。P總共一百四十萬股，創辦人佔百分之七十一點四三；C總共一百四十五萬股，創辦人佔百分之六十八點九七。
  s3_en: >-
    The founder difference is about 2.46 percentage points. Equal cash at an equal price buys equal shares,
    not an equal percentage of different share totals.
  s3_zh: 创始人的持股差了约二点四六个百分点。同样的钱、同样的价格，买到的是同样的股数，而不是在不同总股数里的同样比例。
  s3_zh_hk: 創辦人嘅持股差咗大約二點四六個百分點。同樣嘅錢、同樣嘅價，買到嘅係同樣嘅股數，唔係喺唔同總股數入面嘅同樣比例。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Real trade-off, not free money
  title_zh: 真实的取舍，不是免费融资
  title_zh_hk: 真實的取捨，不是免費融資
  en: >-
    P fixes the price and leaves the founders more ownership here, but misses the pilot. C funds the pilot
    on time at the cost of more shares. No pilot value or round probability is given, so the case cannot
    prove the extra dilution is worth it. A C answer should name the missing pilot evidence.
  zh: >-
    P锁定了价格，在这个情景下给创始人留下更多股权，但赶不上试点。C能按时为试点出资，代价是多发股份。题目没给试点的价值，也没给下一轮的概率，所以无法证明多出来的稀释值不值得。选C的人，要说清还缺哪些试点证据。
  zh_hk: >-
    P鎖定咗價錢，喺呢個情景下幫創辦人留多啲股權，但趕唔切試點。C可以準時為試點出資，代價係多發股份。題目冇俾試點嘅價值，亦冇俾下一輪嘅機率，所以證明唔到多咗嘅攤薄值唔值。揀C嘅人，要講清楚仲欠邊啲試點證據。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Unpriced is not ownership-free
  title_zh: 没有定价，不等于没有稀释
  title_zh_hk: 沒有定價，不等於沒有攤薄
  q1_en: Read the conversion formula and share base
  q1_zh: 看清转换公式和股份基数
  q1_zh_hk: 看清轉換公式和股份基數
  q2_en: Faster cash can cost more shares
  q2_zh: 更快的钱，可能要多付股份
  q2_zh_hk: 更快的錢，可能要多付股份
  s1_en: >-
    The cap binds when the next price exceeds 2.50 dollars. At a lower price such as 2 dollars, the discount
    price of 1.60 applies, and C would issue 312,500 shares.
  s1_zh: 下一轮价格高于二点五港元时，上限才起作用。如果价格更低，例如两港元，就用一点六港元的折扣价，C会转换出三十一万二千五百股。
  s1_zh_hk: 下一輪價高過二點五港元，上限先會起作用。如果價錢低啲，例如兩港元，就用一點六港元嘅折扣價，C會轉換出三十一萬二千五百股。
  s2_en: >-
    This simplified agreement is not a standard SAFE, a loan document or a recommendation to invest; real
    terms need professional review.
  s2_zh: 这份简化的协议不是标准的SAFE，不是贷款文件，也不是投资建议；真实条款需要专业人士审阅。
  s2_zh_hk: 呢份簡化咗嘅協議唔係標準SAFE，唔係貸款文件，亦唔係投資建議；真實條款要專業人士睇過。
  s3_en: >-
    The business, founders, investors and prices are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 企业、创始人、投资者和价格都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 企業、創辦人、投資者同價錢都係虛構嘅。官方場景圖只係教學插圖。
duration_target_s: 196
