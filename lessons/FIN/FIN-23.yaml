  footer_zh_hk: 創辦人持有全部 1,000,000 股
  s1_en: >-
    The founders jointly own all one million shares and want 500,000 dollars for an optional customer
    pilot. Operations stay funded without it, so declining or delaying the pilot is feasible.
  s1_zh: 两位创始人共同持有全部一百万股，想筹五十万港元做一次可选的客户试点。没有这笔钱，现有经营照样有资金，所以放弃或推迟试点都可以。
  s1_zh_hk: 兩位創辦人一齊持有全部一百萬股，想籌五十萬港元做一次可選嘅客戶試點。冇呢筆錢，現有業務照樣有資金，所以放棄或者押後試點都得。
  s2_en: >-
    P buys new shares at 2.50 dollars each but takes ten working days. C pays in two days; no shares are
    issued now, and it converts at the next qualifying priced round. The pilot booking expires in five
    days, so only C meets it.
  s2_zh: >-
    P按每股二点五港元认购新股，但要十个工作日才交割。C两个工作日就到账，现在不发股，等下一轮合格的定价融资时自动转换。试点档期五个工作日后到期，只有C赶得上。
  s2_zh_hk: >-
    P按每股二點五港元認購新股，但要十個工作日先完成交割。C兩個工作日就到賬，而家唔發股，等下一輪合資格嘅定價融資先自動轉換。試點檔期五個工作日後到期，得C趕得切。
  s3_en: >-
    C converts at the lower of two prices: 80 percent of the next round's price, or a cap price of two
    million dollars divided by the one million founder shares. The cap and discount are alternatives,
    not cumulative. No value for meeting the deadline is supplied.
  s3_zh: >-
    C按两个价格中较低的一个转换：下一轮价格的百分之八十，或者两百万港元除以一百万股创始人股份的上限价。上限和折扣二选一，不会叠加。题目没有给出赶上截止日期的价值。
  s3_zh_hk: >-
    C按兩個價入面低嗰個轉換：下一輪價格嘅百分之八十，或者兩百萬港元除一百萬股創辦人股份嘅上限價。上限同折扣二揀一，唔會疊加。題目冇講趕上截止日期值幾多。
