  title_en: A lower premium. How much risk stays here?
  title_zh: 保费更低。留下多少风险？
  title_zh_hk: 保費更低。留下多少風險？
  image: art/lower-premium-repeated-deductible-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Hong Kong insurance-education guidance separates the part of a covered loss the policyholder keeps
    from the insurer's benefit limit. Commercial wording may apply a deductible to each occurrence. Now
    you manage a fictional Hong Kong display-material workshop.
  zh: >-
    香港的保险教育资料，会把投保人自己承担的那部分受保损失，和保险人的赔付限额分开。商业保单的条款，可能对每一次事故分别扣除免赔额。现在，你管理香港一家虚构的展示材料工场。
  zh_hk: >-
    香港嘅保險教育資料，會將投保人自己承擔嗰部分受保損失，同保險人嘅賠付限額分開。商業保單嘅條款，可能每一次事故都分開扣自負額。而家，你管理香港一間虛構嘅展示材料工場。
