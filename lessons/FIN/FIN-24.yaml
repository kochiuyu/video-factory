  s1_en: >-
    The workshop is choosing next year's optional stock-and-equipment cover. Both fictional quotes cover
    the same events and property, with identical insurer reliability and service.
  s1_zh: 工场正在为明年可选的存货与设备保险做选择。两份虚构报价保障的事故和财产完全相同，保险人的可靠程度和服务也一样。
  s1_zh_hk: 工場揀緊明年可選嘅存貨同設備保險。兩份虛構報價保障嘅事故同財產完全一樣，保險人有幾可靠、服務點樣都一樣。
  s2_en: >-
    For each separate incident, subtract the deductible, never below zero, and the insurer pays the result
    up to its per-incident limit. The workshop keeps the rest. There is no annual cap on deductibles.
  s2_zh: 每一次事故，先从损失里减去免赔额，最少是零，保险人按结果赔付，但不超过每次事故的上限，其余由工场自己承担。免赔额没有全年上限。
  s2_zh_hk: 每一次事故，先由損失減自負額，最少係零，保險人按結果賠，但唔超過每次事故嘅上限，其餘由工場自己承擔。自負額冇全年上限。
  s3_en: >-
    Compare premium plus retained loss in three scenarios: no loss, one 24,000-dollar incident, and one
    60,000-dollar incident. No probabilities are given. Last year's 24,000-dollar total has not been checked
    incident by incident.
  s3_zh: >-
    比较三个情景下的保费加自留损失：没有损失、一次两万四千港元的事故、一次六万港元的事故。题目没给概率。上一年合计两万四千港元的损失，还没有逐次核对。
  s3_zh_hk: >-
    比較三個情景下嘅保費加自留損失：冇損失、一次兩萬四千港元嘅事故、一次六萬港元嘅事故。題目冇俾機率。上一年合共兩萬四千港元嘅損失，仲未逐次核對。
