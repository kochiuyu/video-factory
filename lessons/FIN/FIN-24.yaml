  title_en: Recommend A or B?
  title_zh: 推荐 A 还是 B？
  title_zh_hk: 推薦 A 還是 B？
  en: >-
    Which quote would you provisionally recommend, A or B? Compare premium plus retained loss in the supplied
    scenarios, and state the uncertainty your recommendation depends on. Pause and vote.
  zh: 你会暂时推荐哪一份报价，A还是B？请在给出的情景里比较保费加自留损失，并说明你的建议取决于哪一项不确定因素。请暂停，投个票。
  zh_hk: 你暫時會推薦邊份報價，A定B？喺題目俾嘅情景入面比較保費加自留損失，再講吓你嘅建議取決於邊一項不確定因素。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: The incident log arrives
  title_zh: 事故记录到了
  title_zh_hk: 事故記錄到了
  step1_en: Four separate incidents, HK$6,000 each
  step1_zh: 四次独立事故，每次 HK$6,000
  step1_zh_hk: 四次獨立事故，每次 HK$6,000
  step2_en: The deductible applies four times
  step2_zh: 免赔额要扣四次
  step2_zh_hk: 自負額要扣四次
  step3_en: No frequency forecast for next year
  step3_zh: 没有明年的发生频率预测
  step3_zh_hk: 沒有明年的發生頻率預測
  s1_en: >-
    The prior-year log arrives. Its 24,000-dollar total came from four unrelated covered incidents on
    separate dates, each costing 6,000 dollars.
  s1_zh: 上一年的事故记录到了。那两万四千港元的合计，来自四次互不相关、日期不同的受保事故，每次六千港元。
  s1_zh_hk: 上一年嘅事故記錄到咗。嗰兩萬四千港元嘅合計，嚟自四次互不相關、日子唔同嘅受保事故，每次六千港元。
  s2_en: >-
    Both insurers confirm that the deductible would apply four times, not once to the annual total. Use
    the log to back-test both quotes on the same losses.
  s2_zh: 两家保险人都确认，免赔额要扣四次，而不是对全年合计只扣一次。请用这份记录，拿同样的损失回测两份报价。
  s2_zh_hk: 兩間保險人都確認，自負額要扣四次，唔係對全年合計淨係扣一次。用呢份記錄，攞同樣嘅損失回測兩份報價。
  s3_en: >-
    This informs next year's choice; it does not change insurance retrospectively. The record gives no
    reliable frequency forecast, so one large loss, several small ones or none all remain possible.
  s3_zh: 这是为明年的选择提供信息，不能倒回去改保险。这份记录也不能可靠地预测发生频率：一次大损失、几次小损失，或者完全没有损失，都还有可能。
  s3_zh_hk: 呢個係為明年嘅選擇提供資料，唔可以倒返轉頭改保險。呢份記錄亦唔可以可靠咁預測發生頻率：一次大損失、幾次細損失，或者完全冇損失，都仲有可能。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Does the log change your choice?
  title_zh: 记录会改变选择吗？
  title_zh_hk: 記錄會改變選擇嗎？
  en: >-
    Would the incident-level record change your recommendation? Recalculate both quotes for the four losses,
    explain why the annual total was not enough, and state what you still need before choosing. Pause
    and vote.
  zh: 看了逐次事故的记录，你的建议会改变吗？请按四次损失重算两份报价，说明为什么只看全年合计不够，以及做决定前你还需要什么。请暂停，投个票。
  zh_hk: 睇完逐次事故嘅記錄，你嘅建議會唔會變？按四次損失重新計兩份報價，講吓點解淨係睇全年合計唔夠，同埋揀之前你仲需要啲乜。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Three opening scenarios
  title_zh: 三个起始情景
  title_zh_hk: 三個起始情景
  step1_en: >-
    No loss: A 9,000 · B 4,000
  step1_zh: 无损失：A 9,000 · B 4,000
  step1_zh_hk: 無損失：A 9,000 · B 4,000
  step2_en: >-
    One 24,000 loss: A 11,000 · B 10,000
  step2_zh: 一次 24,000：A 11,000 · B 10,000
  step2_zh_hk: 一次 24,000：A 11,000 · B 10,000
  step3_en: >-
    One 60,000 loss: A 39,000 · B 14,000
  step3_zh: 一次 60,000：A 39,000 · B 14,000
  step3_zh_hk: 一次 60,000：A 39,000 · B 14,000
  s1_en: >-
    For each incident, the insurer pays the loss minus the deductible, capped at the limit; the workshop
    keeps the rest. With no loss, annual cost is 9,000 for A and 4,000 for B.
  s1_zh: 每次事故，保险人赔付损失减免赔额，但不超过上限，其余由工场承担。没有损失时，全年成本A是九千，B是四千。
  s1_zh_hk: 每次事故，保險人賠損失減自負額，但唔超過上限，其餘由工場承擔。冇損失嘅話，全年成本A係九千，B係四千。
  s2_en: >-
    For one 24,000 loss, A keeps 2,000, for a total of 11,000. B keeps 6,000, for 10,000, so B is 1,000
    cheaper.
  s2_zh: 一次两万四千的损失，A自留两千，总成本一万一千；B自留六千，总成本一万，B便宜一千。
  s2_zh_hk: 一次兩萬四千嘅損失，A自留兩千，總成本一萬一千；B自留六千，總成本一萬，B平一千。
  s3_en: >-
    For one 60,000 loss, A's payout stops at 30,000, so it keeps 30,000 and costs 39,000. B pays its 50,000
    limit, keeps 10,000, and costs 14,000. Retention can exceed the deductible when the limit binds.
  s3_zh: >-
    一次六万的损失，A最多赔三万，自留三万，总成本三万九千。B赔到五万的上限，自留一万，总成本一万四千。上限一旦起作用，自留部分就可能超过免赔额。
  s3_zh_hk: 一次六萬嘅損失，A最多賠三萬，自留三萬，總成本三萬九千。B賠到五萬嘅上限，自留一萬，總成本一萬四千。上限一起作用，自留部分就可能多過自負額。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: The same total, four deductibles
  title_zh: 同样的合计，四次免赔额
  title_zh_hk: 同樣的合計，四次自負額
  step1_en: >-
    A: keeps 4 × 2,000 = 8,000 → 17,000
  step1_zh: A：自留 4 × 2,000 = 8,000 → 17,000
  step1_zh_hk: A：自留 4 × 2,000 = 8,000 → 17,000
  step2_en: >-
    B: keeps all 24,000 → 28,000
  step2_zh: B：全部 24,000 自留 → 28,000
  step2_zh_hk: B：全部 24,000 自留 → 28,000
  step3_en: A is 11,000 cheaper in this replay
  step3_zh: 按这次回测，A 便宜 11,000
  step3_zh_hk: 按這次回測，A 便宜 11,000
  s1_en: >-
    For each 6,000 incident, A pays 4,000 and the workshop keeps 2,000. Four incidents mean 8,000 retained,
    plus the 9,000 premium, for 17,000 in total.
  s1_zh: 每次六千的事故，A赔四千，工场自留两千。四次就是自留八千，加上九千保费，总成本一万七千。
  s1_zh_hk: 每次六千嘅事故，A賠四千，工場自留兩千。四次就係自留八千，加九千保費，總成本一萬七千。
  s2_en: >-
    B pays nothing, because each loss equals its deductible. The workshop keeps all 24,000, plus the 4,000
    premium, for 28,000.
  s2_zh: B一分不赔，因为每次损失刚好等于免赔额。工场自留全部两万四千，加上四千保费，总成本两万八千。
  s2_zh_hk: B一蚊都唔賠，因為每次損失啱啱等於自負額。工場自留晒兩萬四千，加四千保費，總成本兩萬八千。
  s3_en: >-
    A is 11,000 cheaper in this replay. Applying B's deductible once to the annual total would wrongly
    give 10,000. The number and size of incidents decide how much stays with the firm.
  s3_zh: 在这次回测里，A便宜一万一千。如果把B的免赔额只对全年合计扣一次，就会错算成一万。事故的次数和大小，决定了多少风险留在公司身上。
  s3_zh_hk: 喺今次回測入面，A平一萬一千。如果將B嘅自負額淨係對全年合計扣一次，就會錯計成一萬。事故嘅次數同大細，決定幾多風險留喺公司身上。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Argue without made-up odds
  title_zh: 不靠编造概率来论证
  title_zh_hk: 不靠編造機率來論證
  en: >-
    A can be defended if repeated medium-sized incidents worry you more than its higher premium and lower
    limit. B can be defended if the saving and better protection against one large loss matter more, and
    the firm accepts repeated deductibles. Neither wins every scenario, and no expected cost can be calculated
    without probabilities.
  zh: >-
    如果你更担心反复出现的中等事故，多于A较高的保费和较低的上限，选A说得通。如果更看重省下的保费和对单次大损失的保障，又接受免赔额会反复扣，选B也说得通。没有哪一份在每个情景都更好；没有概率，也算不出期望成本。
  zh_hk: >-
    如果你擔心一次又一次嘅中型事故，多過A較高嘅保費同較低嘅上限，揀A講得通。如果你更睇重慳到嘅保費同對單次大損失嘅保障，又接受自負額會重複扣，揀B都講得通。冇一份喺每個情景都贏；冇機率，亦計唔到期望成本。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: A deductible is no annual cap
  title_zh: 免赔额不是全年上限
  title_zh_hk: 自負額不是全年上限
  q1_en: Apply the contract to each incident
  q1_zh: 把合同用到每一次事故
  q1_zh_hk: 把合約用到每一次事故
  q2_en: An annual total can hide repeated deductibles
  q2_zh: 全年合计可能藏着多次免赔额
  q2_zh_hk: 全年合計可能藏着多次自負額
  s1_en: >-
    Before signing, seek a longer incident history, plausible loss sizes and frequencies, and the firm's
    tolerance for retained losses. Confirm the actual wording with a qualified adviser.
  s1_zh: 签约之前，要找更长的事故记录、合理的损失大小和频率，并弄清公司能承受多少自留损失。实际条款要请合资格的顾问确认。
  s1_zh_hk: 簽約之前，要搵更長嘅事故記錄、合理嘅損失大細同頻率，仲要弄清楚公司頂得順幾多自留損失。實際條款要請合資格嘅顧問確認。
  s2_en: >-
    The largest scenario is not a worst-case bound. Do not weaken prevention, or combine unrelated incidents
    into one claim.
  s2_zh: 最大的那个情景不是最坏情况的上限。不要放松预防措施，也不要把不相关的事故并成一次索赔。
  s2_zh_hk: 最大嗰個情景唔係最壞情況嘅上限。唔好放鬆預防措施，亦唔好將唔相關嘅事故併埋做一次索償。
  s3_en: >-
    The workshop, quotes and losses are fictional; this is not advice on any actual policy. Official scene
    art is a teaching illustration only.
  s3_zh: 工场、报价和损失都是虚构的，并非针对任何真实保单的建议。官方场景图只是教学插图。
  s3_zh_hk: 工場、報價同損失都係虛構嘅，唔係針對任何真實保單嘅建議。官方場景圖只係教學插圖。
