  s1_en: >-
    An exporter has a 200,000-dollar order from an established overseas buyer who has paid on time before,
    though no default probability or guarantee is given. Both sides accept either route, and payment is
    due on day 30 after shipment.
  s1_zh: >-
    一家出口商接到一位海外老客户二十万港元的订单。这位买方以往都按时付款，但题目没有给违约概率，也没有担保。双方两种方式都接受，付款日都是装运后第三十天。
  s1_zh_hk: >-
    一間出口商接咗一位海外熟客二十萬港元嘅訂單。呢位買方以往都準時俾錢，但題目冇俾違約機率，亦冇擔保。雙方兩種方式都接受，付款日都係裝運後第三十日。
  s2_en: >-
    Open account costs 1,000 dollars in financing and administration. The documentary credit costs 3,000.
    The fictional issuing bank's irrevocable undertaking pays on day 30, only after a complying presentation
    by day 10.
  s2_zh: 赊账的融资和管理成本是一千港元，跟单信用证是三千港元。虚构开证行不可撤销的承诺，只有在第十天前相符交单，才会在第三十天付款。
  s2_zh_hk: 記帳嘅融資同行政成本係一千港元，跟單信用證係三千港元。虛構開證行不可撤銷嘅承諾，要第十日之前相符交單，先會喺第三十日付款。
  s3_en: >-
    The required documents are the commercial invoice, packing list and transport document. The bank examines
    documents, not whether the goods satisfy the buyer, and the sale rights stay separate.
  s3_zh: 需要的单据是商业发票、装箱单和运输单据。银行审的是单据，不是货物能不能让买方满意；买卖合同上的权利是另外一回事。
  s3_zh_hk: 要交嘅單據係商業發票、裝箱單同運輸單據。銀行審嘅係單據，唔係貨物啱唔啱買方心水；買賣合約上嘅權利係另一回事。
