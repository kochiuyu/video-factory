  step1_en: Invoice says USD200,000, not HK$200,000
  step1_zh: 发票写成美元 200,000，不是港元
  step1_zh_hk: 發票寫成美元 200,000，不是港元
  step2_en: >-
    A: correct for HK$600, arrives day 9
  step2_zh: A：花 HK$600 更正，第 9 天送达
  step2_zh_hk: A：花 HK$600 更正，第 9 天送達
  step3_en: >-
    B: HK$200 waiver request, reply unknown
  step3_zh: B：花 HK$200 申请豁免，结果未知
  step3_zh_hk: B：花 HK$200 申請豁免，結果未知
  s1_en: >-
    Suppose the exporter chose the documentary credit and shipped as agreed. On day 8, the bank finds
    one discrepancy: the invoice says 200,000 US dollars instead of the required 200,000 Hong Kong dollars.
    Everything else complies.
  s1_zh: 假设出口商选了跟单信用证，也按约定装运了。第八天，银行发现一个不符点：商业发票误写成二十万美元，而规定的是二十万港元。其他单据和条件都相符。
  s1_zh_hk: 假設出口商揀咗跟單信用證，亦按約定裝咗貨。第八日，銀行發現一個不符點：商業發票寫錯咗做二十萬美元，規定嘅係二十萬港元。其他單據同條件都相符。
  s2_en: >-
    Option A spends 600 dollars on an authorised, truthful correction that is assured to reach the bank
    on day 9.
  s2_zh: 方案A花六百港元，按授权如实更正，保证第九天送到银行。
  s2_zh_hk: 方案A使六百港元，按授權如實更正，保證第九日送到銀行。
  s3_en: >-
    Option B pays 200 dollars to request a waiver, which needs both the buyer and the issuing bank to
    accept by day 10. Otherwise a correction arrives on day 11, too late. Unresolved, the bank undertaking
    is not payable, though the buyer still owes payment.
  s3_zh: >-
    方案B付两百港元申请豁免不符点，但要买方和开证行在第十天前都接受才行。不然再更正也要第十一天才送到，已经太迟。不符点没解决，银行的承诺就不付款，不过买方仍然欠这笔货款。
  s3_zh_hk: >-
    方案B俾兩百港元申請豁免不符點，要買方同開證行第十日前都接受先得。唔係嘅話，更正要第十一日先到，太遲。不符點冇解決，銀行承諾就唔付款，但買方仍然欠款。
