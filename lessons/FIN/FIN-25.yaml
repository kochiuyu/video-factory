  title_en: Credit or open account?
  title_zh: 跟单信用证还是赊账？
  title_zh_hk: 跟單信用證還是記帳？
  en: >-
    Would you use the documentary credit or keep open-account terms for this order? Explain what the extra
    cost buys, which payment condition remains, and why shipment alone does not settle the choice. Pause
    and vote.
  zh: >-
    这笔订单，你会用跟单信用证，还是继续赊账？请说明多出来的成本买到了什么、还剩下哪一项付款条件，以及为什么光是装运并不能决定这个选择。请暂停，投个票。
  zh_hk: 呢張訂單，你會用跟單信用證，定係繼續記帳？講吓多咗嘅成本買到啲乜、仲有邊一項付款條件，同埋點解淨係裝咗貨決定唔到點揀。暫停，投個票。
