  en: >-
    A documentary credit is a bank undertaking tied to a complying presentation of specified documents,
    separate from the underlying sale. Open-account trade relies instead on the buyer's promise to pay
    after shipment. Now you advise a fictional exporter.
  zh: >-
    跟单信用证是银行的付款承诺，前提是按规定提交相符的单据，它和底层的买卖合同是分开的。赊账贸易则依靠买方在装运后付款的义务。现在，你要为一家虚构的出口商出主意。
  zh_hk: >-
    跟單信用證係銀行嘅付款承諾，前提係按規定交齊相符嘅單據，佢同底層嘅買賣合約係分開嘅。記帳貿易就靠買方喺裝運之後付款嘅義務。而家，你要幫一間虛構嘅出口商出主意。
