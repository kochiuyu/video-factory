  zh: 按现在的数字，哪一份评估得出的项目价值更高？批准之前，你会要求团队证明第三年之后的哪一项假设？请暂停，投个票。
  zh_hk: 按而家嘅數，邊份評估得出嘅項目價值高啲？批准之前，你會要團隊證明第三年之後邊一項假設？暫停，投個票。
