  step1_en: >-
    Missed: HK$50,000 a year to sustain it
  step1_zh: 漏了：每年 HK$50,000 维持性支出
  step1_zh_hk: 漏了：每年 HK$50,000 維持性支出
  step2_en: From year 4, flat, forever
  step2_zh: 从第 4 年起，金额不变，永续
  step2_zh_hk: 從第 4 年起，金額不變，永續
  step3_en: >-
    Rule: approve only if NPV is positive
  step3_zh: 规则：净现值为正才批准
  step3_zh_hk: 規則：淨現值為正才批准
  s1_en: >-
    The reconciled engineering schedule finds that Continue omitted 50,000 dollars of sustaining expenditure
    every year from year 4 onward.
  s1_zh: 核对后的工程成本表发现，“延续”漏掉了从第四年起每年五万港元的维持性支出。
  s1_zh_hk: 核對過嘅工程成本表發現，「延續」漏咗由第四年起每年五萬港元嘅維持性支出。
  s2_en: >-
    This is real recurring cash spending needed to keep capacity and receipts, not depreciation or optional
    expansion. The first payment falls at the end of year 4, and it stays flat.
  s2_zh: 这是维持产能和收款所必需的、真实的经常性现金支出，不是折旧，也不是可选的扩张。第一笔在第四年年末支付，金额一直不变。
  s2_zh_hk: 呢個係要維持產能同收款嘅真實經常性現金支出，唔係折舊，亦唔係可做可唔做嘅擴張。第一筆喺第四年年尾俾，金額一直唔變。
  s3_en: >-
    Exit's 800,000 is unchanged, and the buyer bears later spending. The business accepts only projects
    with a positive net present value, and can decline today without penalty.
  s3_zh: “退出”的八十万不变，以后的支出由买方承担。公司只接受净现值为正的项目，今天放弃也不会受罚。
  s3_zh_hk: 「退出」嘅八十萬冇變，以後嘅支出由買方承擔。公司只接受淨現值係正數嘅項目，今日放棄亦唔會罰。
