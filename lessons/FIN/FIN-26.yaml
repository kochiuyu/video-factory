  title_en: Cash flows continue. How much is the ending worth?
  title_zh: 现金流还在继续。结尾值多少？
  title_zh_hk: 現金流還在繼續。結尾值多少？
  image: art/cash-flows-continue-ending-worth-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 29 April 2026, HKICPA published teaching guidance explaining that a terminal value represents cash
    flows beyond an explicit forecast, and must be discounted from its own date. The assumed cash flow
    must also be sustainable. Now you review a fictional workshop project.
  zh: >-
    2026年4月29日，香港会计师公会发布教学指引，说明终值代表明确预测期之后的现金流，而且必须从它自己的日期折现，假设的现金流也必须可持续。现在，你要复核一个虚构的工场项目。
  zh_hk: >-
    2026年4月29號，香港會計師公會發表教學指引，講明終值代表明確預測期之後嘅現金流，而且一定要由佢自己嘅日期折現，假設嘅現金流亦一定要持續得到。而家，你要覆核一個虛構嘅工場項目。
