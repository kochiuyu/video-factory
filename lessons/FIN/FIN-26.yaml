  s1_en: >-
    The project costs 900,000 dollars today and produces net free cash flow of 100,000 at each of the
    next three year-ends, after all costs, taxes and required investment. Both appraisals use a 10 percent
    discount rate and zero growth.
  s1_zh: >-
    项目今天投入九十万港元，接下来三年每年年末产生十万港元的净自由现金流，已经扣除全部成本、税和必要投资。两份评估都用百分之十的折现率，增长率为零。
  s1_zh_hk: >-
    項目今日投入九十萬港元，之後三年每年年尾產生十萬港元嘅淨自由現金流，已經扣晒所有成本、稅同必要投資。兩份評估都用百分之十嘅折現率，增長率係零。
  s2_en: >-
    Continue values the operation after year 3 as a flat stream starting at the end of year 4. Its analyst
    labels 120,000 a year as free cash flow, but the cost schedule has not been reconciled.
  s2_zh: “延续”把第三年之后的经营，估成从第四年年末开始的一笔平稳现金流。分析师把每年十二万港元标为自由现金流，但成本表还没有核对。
  s2_zh_hk: 「延續」將第三年之後嘅業務，估成由第四年年尾開始嘅一筆平穩現金流。分析師將每年十二萬港元當係自由現金流，但成本表仲未核對。
  s3_en: >-
    Exit uses a secured option to sell the whole operation at the end of year 3 for a net 800,000 dollars.
    Selling passes all later receipts and obligations to the buyer, so do not add a perpetuity to it.
  s3_zh: >-
    “退出”用的是一项有保障的选择权：在第三年年末把整个业务卖掉，净得八十万港元。卖掉之后，以后的收款和义务都归买方，所以不能再加上一笔永续价值。
  s3_zh_hk: >-
    「退出」用嘅係一個有保障嘅選擇權：喺第三年年尾將成盤生意賣走，淨收八十萬港元。賣咗之後，以後嘅收款同義務都歸買方，所以唔可以再加一筆永續價值。
