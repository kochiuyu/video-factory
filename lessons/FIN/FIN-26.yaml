  step1_en: >-
    Year-3 TV: 120,000 ÷ 0.10 = 1,200,000
  step1_zh: 延续：120,000 ÷ 0.10 = 1,200,000（第 3 年）
  step1_zh_hk: 延續：120,000 ÷ 0.10 = 1,200,000（第 3 年）
  step2_en: >-
    Continue NPV: +250,263
  step2_zh: 延续净现值：+250,263
  step2_zh_hk: 延續淨現值：+250,263
  step3_en: >-
    Exit NPV: −50,263
  step3_zh: 退出净现值：−50,263
  step3_zh_hk: 退出淨現值：−50,263
  s1_en: >-
    For the flat stream, terminal value at the end of year 3 is the year-4 cash flow divided by 10 percent:
    120,000 divided by 0.1, or 1.2 million dollars.
  s1_zh: 对平稳的现金流，第三年年末的终值，等于第四年的现金流除以百分之十：十二万除以零点一，即一百二十万港元。
  s1_zh_hk: 對平穩嘅現金流，第三年年尾嘅終值，等於第四年嘅現金流除百分之十：十二萬除零點一，即係一百二十萬港元。
  s2_en: >-
    Discounted three years, that is about 901,578 today. Add the 248,685 from years 1 to 3 and subtract
    the 900,000 outlay: Continue's initial NPV is about 250,263 dollars.
  s2_zh: >-
    再折现三年，今天约值九十万一千五百七十八。加上第一到第三年的二十四万八千六百八十五，减去九十万投入，“延续”起初的净现值约二十五万零二百六十三港元。
  s2_zh_hk: >-
    再折現三年，今日大約值九十萬一千五百七十八。加第一至第三年嘅二十四萬八千六百八十五，減九十萬投入，「延續」起初嘅淨現值大約二十五萬零二百六十三港元。
  s3_en: >-
    Exit's 800,000 is worth about 601,052 today, so its NPV is minus 50,263. Exit is an alternative, not
    an extra: never add it to continuation value.
  s3_zh: “退出”的八十万，今天约值六十万一千零五十二，所以净现值是负五万零二百六十三。“退出”是另一个选择，不是额外的资产，不能加到延续价值上。
  s3_zh_hk: 「退出」嘅八十萬，今日大約值六十萬一千零五十二，所以淨現值係負五萬零二百六十三。「退出」係另一個選擇，唔係額外嘅資產，唔可以加落延續價值度。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Fix the sustainable cash flow
  title_zh: 更正可持续的现金流
  title_zh_hk: 更正可持續的現金流
  step1_en: 120,000 − 50,000 = 70,000 a year
  step1_zh: 120,000 − 50,000 = 每年 70,000
  step1_zh_hk: 120,000 − 50,000 = 每年 70,000
  step2_en: >-
    Continue NPV: −125,394
  step2_zh: 延续净现值：−125,394
  step2_zh_hk: 延續淨現值：−125,394
  step3_en: Exit is better by 75,131, still negative
  step3_zh: 退出高 75,131，但仍为负
  step3_zh_hk: 退出高 75,131，但仍為負
  s1_en: Continuation cash falls to 120,000 minus 50,000, or 70,000 a year.
  s1_zh: 延续的年度现金流降到十二万减五万，即每年七万。
  s1_zh_hk: 延續嘅年度現金流跌到十二萬減五萬，即係每年七萬。
  s2_en: >-
    Terminal value becomes 700,000 at year 3, about 525,920 today. Continue's NPV is now about minus 125,394.
    The missing expense cut present value by about 375,657 dollars.
  s2_zh: >-
    终值变成第三年的七十万，今天约值五十二万五千九百二十。“延续”的净现值现在约为负十二万五千三百九十四。漏掉的支出，让现值少了约三十七万五千六百五十七港元。
  s2_zh_hk: >-
    終值變成第三年嘅七十萬，今日大約值五十二萬五千九百二十。「延續」嘅淨現值而家大約係負十二萬五千三百九十四。漏咗嘅支出，令現值少咗大約三十七萬五千六百五十七港元。
  s3_en: >-
    Exit is now worth about 75,131 more than Continue, but both NPVs are negative. Under the positive-NPV
    rule, decline the project. A less costly ending does not make it a good project.
  s3_zh: >-
    现在“退出”比“延续”多值约七万五千一百三十一，但两者的净现值都是负的。按净现值为正的规则，应该放弃这个项目。结尾亏得少一点，不等于项目值得做。
  s3_zh_hk: >-
    而家「退出」比「延續」多值大約七萬五千一百三十一，但兩者嘅淨現值都係負數。按淨現值要正數嘅規則，應該放棄呢個項目。結尾蝕少啲，唔等於項目值得做。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Better route, bad project
  title_zh: 更好的路径，也可能是坏项目
  title_zh_hk: 更好的路徑，也可能是壞項目
  en: >-
    The break-even outlay using the better route is about 849,737 dollars; a positive NPV would need a
    lower outlay, all else unchanged. Before approval, the Continue team had to prove its post-forecast
    cash was really available after sustaining the operation.
  zh: >-
    按较好的路径，打平的初始投入约为八十四万九千七百三十七港元；其他不变的话，投入要更低，净现值才会为正。批准之前，“延续”团队本来就要证明：预测期之后的现金，在扣除维持经营的支出后真的拿得到。
  zh_hk: >-
    按較好嘅路徑，打和嘅初始投入大約係八十四萬九千七百三十七港元；其他唔變嘅話，投入要再低啲，淨現值先會係正數。批准之前，「延續」團隊本來就要證明：預測期之後嘅現金，扣咗維持業務嘅支出之後真係攞得到。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: The ending must be sustainable
  title_zh: 结尾的现金流要可持续
  title_zh_hk: 結尾的現金流要可持續
  q1_en: Discount terminal value from its own date
  q1_zh: 终值要从它自己的日期折现
  q1_zh_hk: 終值要從它自己的日期折現
  q2_en: Sustaining spending belongs in the stream
  q2_zh: 维持性支出要计入现金流
  q2_zh_hk: 維持性支出要計入現金流
  s1_en: >-
    A terminal value is compact arithmetic, but its cash flow must be genuinely available after the spending
    that keeps the business running.
  s1_zh: 终值的算法很简单，但它用的现金流，必须是扣除维持业务运转的支出之后，真正拿得到的钱。
  s1_zh_hk: 終值條數好簡單，但佢用嘅現金流，一定要係扣咗維持業務運作嘅支出之後，真係攞得到嘅錢。
  s2_en: >-
    The discount rate, tax basis and growth assumption were supplied, not estimated from markets; this
    is not an investment recommendation.
  s2_zh: 折现率、税务基础和增长假设都是给定的，不是从市场估算出来的；这也不是投资建议。
  s2_zh_hk: 折現率、稅務基礎同增長假設都係俾定嘅，唔係由市場估出嚟；呢個亦唔係投資建議。
  s3_en: >-
    The workshop, project and exit offer are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 工场、项目和退出报价都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 工場、項目同退出報價都係虛構嘅。官方場景圖只係教學插圖。
