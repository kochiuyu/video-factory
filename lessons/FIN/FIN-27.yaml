  title_zh: Fixed 还是 Asset？
  title_zh_hk: Fixed 還是 Asset？
  en: >-
    On the preliminary certificate, which facility would you prefer, and how much additional cash and
    90-day total financing cost would each provide at the required borrowing? Pause and vote.
  zh: 按初步的证明，你会选哪一项信贷？按所需的借款额，每一项能提供多少新增现金，九十天的融资总成本又是多少？请暂停，投个票。
  zh_hk: 按初步嘅證明，你會揀邊一項信貸？按所需嘅借款額，每一項可以提供幾多新增現金，九十日嘅融資總成本又係幾多？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: The draw-date certificate
  title_zh: 支取日的最终证明
  title_zh_hk: 支取日的最終證明
  step1_en: HK$300,000 of receivables now 91 days
  step1_zh: HK$300,000 应收账款已到 91 天
  step1_zh_hk: HK$300,000 應收賬款已到 91 天
  step2_en: >-
    Eligible receivables: 800,000 → 500,000
  step2_zh: 合格应收：800,000 → 500,000
  step2_zh_hk: 合資格應收：800,000 → 500,000
  step3_en: No waiver, extra collateral or delay
  step3_zh: 没有豁免、额外抵押或延期
  step3_zh_hk: 沒有豁免、額外抵押或延期
  s1_en: >-
    The final draw-date certificate arrives before either offer is accepted. 300,000 dollars of receivables
    has moved from 89 to 91 days old without being paid, so it is now ineligible.
  s1_zh: 两项要约都还没接受，支取日的最终证明就到了：有三十万港元的应收账款还没收回，账龄从八十九天变成九十一天，现在已经不合格。
  s1_zh_hk: 兩項要約都未接受，支取日嘅最終證明就到咗：有三十萬港元嘅應收賬款仲未收到，賬齡由八十九日變咗九十一日，而家已經唔合資格。
  s2_en: >-
    Book receivables stay at one million, but eligible receivables fall to 500,000. Inventory and the
    other tests are unchanged.
  s2_zh: 账面应收账款仍是一百万，但合格应收账款降到五十万。存货和其他条件都不变。
  s2_zh_hk: 賬面應收賬款仍然係一百萬，但合資格應收賬款跌到五十萬。存貨同其他條件都冇變。
  s3_en: >-
    No waiver, overadvance, extra collateral, second lender or delayed payment is available. This is not
    a write-off or a covenant breach; it simply follows Asset's stated formula.
  s3_zh: 这次支取没有豁免、超额放款、额外抵押、第二家贷款人，也不能延期付款。这不是坏账核销，也不是违反契约，只是按Asset写明的公式计算的结果。
  s3_zh_hk: >-
    今次支取冇豁免、超額放款、額外抵押、第二間貸款人，亦唔可以延遲付款。呢個唔係壞賬撇銷，亦唔係違反契諾，只係按Asset寫明嘅公式計出嚟嘅結果。
