  title_en: A credit limit. How much can we draw?
  title_zh: 信贷额度。我们能支取多少？
  title_zh_hk: 信貸額。我們能支取多少？
  image: art/credit-limit-available-draw-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A March 2024 credit-agreement amendment filed by Universal Electronics shows that a revolving commitment
    can be limited by a separate borrowing-base formula and eligibility rules. Now you are finance manager
    of a fictional Hong Kong distributor.
  zh: >-
    Universal Electronics在2024年3月备案的一份信贷协议修订显示：循环信贷承诺，还可能受另一套借款基础公式和合格标准的限制。现在，你是香港一家虚构分销商的财务经理。
  zh_hk: >-
    Universal Electronics喺2024年3月存檔嘅一份信貸協議修訂顯示：循環信貸承諾，仲可能受另一套借款基礎公式同合資格準則限制。而家，你係香港一間虛構分銷商嘅財務經理。
