  zh: 账龄变化之后，每一项信贷各能支取多少新现金？Asset会留下多少缺口？哪一项能拨出所需的付款？请暂停，投个票。
  zh_hk: 賬齡變咗之後，每一項信貸各可以支取幾多新現金？Asset會留低幾多缺口？邊一項可以撥出所需嘅付款？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Base first, then subtract usage
  title_zh: 先算基础，再减已用
  title_zh_hk: 先算基礎，再減已用
  step1_en: >-
    Asset: 640,000 + 200,000 = 840,000 base
  step1_zh: Asset：640,000 + 200,000 = 840,000
  step1_zh_hk: Asset：640,000 + 200,000 = 840,000
  step2_en: >-
    New cash: Asset 640,000 · Fixed 600,000
  step2_zh: 新现金：Asset 640,000 · Fixed 600,000
  step2_zh_hk: 新現金：Asset 640,000 · Fixed 600,000
  step3_en: >-
    Cost: Fixed 18,875 · Asset 16,125
  step3_zh: 成本：Fixed 18,875 · Asset 16,125
  step3_zh_hk: 成本：Fixed 18,875 · Asset 16,125
  s1_en: >-
    At first, Asset's borrowing base is 80 percent of 800,000, which is 640,000, plus 50 percent of 400,000,
    which is 200,000: 840,000 in total, below its 900,000 ceiling.
  s1_zh: 起初，Asset的借款基础是八十万的百分之八十，即六十四万，加上四十万的百分之五十，即二十万，合计八十四万，低于九十万的上限。
  s1_zh_hk: 起初，Asset嘅借款基礎係八十萬嘅百分之八十，即係六十四萬，加四十萬嘅百分之五十，即係二十萬，合共八十四萬，低過九十萬嘅上限。
  s2_en: >-
    After refinancing 200,000, Asset offers 640,000 of new cash, and Fixed offers 600,000. Both cover
    the 550,000 need, but neither makes its headline limit available as new cash.
  s2_zh: 扣掉再融资的二十万，Asset能提供六十四万新现金，Fixed能提供六十万。两项都够五十五万的需要，但都不能把名义上限全部当新现金用。
  s2_zh_hk: 扣咗再融資嘅二十萬，Asset可以提供六十四萬新現金，Fixed可以提供六十萬。兩項都夠五十五萬嘅需要，但都唔可以將名義上限全部當新現金用。
  s3_en: >-
    On 750,000 for 90 days, Fixed costs 16,875 interest plus its fee, 18,875 in total. Asset costs 13,125
    plus its fee, 16,125. Asset is 2,750 cheaper, but only if eligibility holds on the draw date.
  s3_zh: >-
    七十五万借九十天，Fixed利息加费用共一万八千八百七十五，Asset共一万六千一百二十五。Asset便宜两千七百五十，前提是支取当天仍然合格。
  s3_zh_hk: >-
    七十五萬借九十日，Fixed利息加費用共一萬八千八百七十五，Asset共一萬六千一百二十五。Asset平兩千七百五十，前提係支取當日仍然合資格。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: The balance sheet did not shrink
  title_zh: 资产负债表并没有缩小
  title_zh_hk: 資產負債表並沒有縮小
  step1_en: >-
    Asset base: 400,000 + 200,000 = 600,000
  step1_zh: Asset 基础：400,000 + 200,000 = 600,000
  step1_zh_hk: Asset 基礎：400,000 + 200,000 = 600,000
  step2_en: New cash 400,000 → short 150,000
  step2_zh: 新现金 400,000 → 缺 150,000
  step2_zh_hk: 新現金 400,000 → 缺 150,000
  step3_en: >-
    Fixed: draw 550,000, 50,000 unused
  step3_zh: Fixed：支取 550,000，余 50,000
  step3_zh_hk: Fixed：支取 550,000，餘 50,000
  s1_en: >-
    On the draw date, Asset's base becomes 80 percent of 500,000, which is 400,000, plus 200,000 from
    inventory: 600,000.
  s1_zh: 到了支取日，Asset的基础变成五十万的百分之八十，即四十万，加上存货的二十万，共六十万。
  s1_zh_hk: 到支取日，Asset嘅基礎變成五十萬嘅百分之八十，即係四十萬，加存貨嘅二十萬，共六十萬。
  s2_en: >-
    Subtract the existing 200,000 and only 400,000 of new cash is available, a 150,000 shortfall. The
    300,000 eligibility loss cut the base by 240,000, though book assets did not change.
  s2_zh: 减去现有的二十万，只剩四十万新现金，缺口十五万。三十万应收账款失去合格资格，让基础少了二十四万，可是账面资产一点没变。
  s2_zh_hk: 減咗現有嘅二十萬，得返四十萬新現金，缺口十五萬。三十萬應收賬款唔再合資格，令基礎少咗二十四萬，但賬面資產一啲都冇變。
  s3_en: >-
    Fixed still provides up to 600,000. Draw only the 550,000 needed, bringing total debt to 750,000 and
    leaving 50,000 unused.
  s3_zh: Fixed仍然最多能提供六十万。只支取需要的五十五万，总借款七十五万，还有五万没用。
  s3_zh_hk: Fixed仍然最多可以提供六十萬。淨係支取需要嘅五十五萬，總借款七十五萬，仲有五萬未用。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Choose funding you can draw
  title_zh: 选能真正支取的资金
  title_zh_hk: 選能真正支取的資金
  en: >-
    Choose Fixed under the supplied constraints. Asset's lower rate cannot fund the full payment, and
    no authorised substitute exists. Do not fabricate eligibility, extend invoice dates, or treat the
    advertised ceiling as a waiver.
  zh: >-
    在给定的条件下，应该选Fixed。Asset利率较低，却拨不出全部所需的钱，而且没有获授权的替代办法。不能虚报合格资产、改动发票日期，也不能把宣传的上限当成豁免。
  zh_hk: >-
    喺題目嘅條件下，應該揀Fixed。Asset利率低啲，但撥唔出全部所需嘅錢，又冇獲授權嘅替代辦法。唔可以虛報合資格資產、改發票日期，亦唔可以將宣傳嘅上限當成豁免。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: A ceiling is not drawable cash
  title_zh: 名义上限不等于可支取现金
  title_zh_hk: 名義上限不等於可支取現金
  q1_en: Check the borrowing base on the draw date
  q1_zh: 按支取日核对借款基础
  q1_zh_hk: 按支取日核對借款基礎
  q2_en: Compare prices only for feasible draws
  q2_zh: 只在可行的支取之间比价
  q2_zh_hk: 只在可行的支取之間比價
  s1_en: >-
    Asset-based borrowing is tied to eligible collateral, not simply total assets on the balance sheet.
  s1_zh: 以资产为基础的借款，看的是合格的抵押资产，而不只是资产负债表上的总资产。
  s1_zh_hk: 以資產為基礎嘅借款，睇嘅係合資格嘅抵押資產，唔只係資產負債表上面嘅總資產。
  s2_en: >-
    The public filing illustrates contract structure only; it is not the contract or pricing used here.
  s2_zh: 那份公开备案只用来说明合同结构，不是这里用到的合同或价格。
  s2_zh_hk: 嗰份公開存檔只係用嚟說明合約結構，唔係呢度用到嘅合約或者價錢。
  s3_en: >-
    Every facility, rate and collateral amount here is fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 这里的每一项信贷、利率和抵押金额都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 呢度每一項信貸、利率同抵押金額都係虛構嘅。官方場景圖只係教學插圖。
duration_target_s: 196
