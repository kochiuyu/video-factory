  s1_en: >-
    Two days before a planned draw, you compare two approved offers and must pick one. Either would refinance
    200,000 dollars of existing borrowing, and the distributor needs exactly 550,000 of new cash, for
    750,000 in total over 90 days.
  s1_zh: >-
    计划支取前两天，你在比较两项已获批的要约，只能选一项。两项都会把现有的二十万借款再融资，而分销商还需要正好五十五万的新现金，总借款七十五万，为期九十天。
  s1_zh_hk: >-
    計劃支取之前兩日，你比較緊兩項已獲批嘅要約，只可以揀一項。兩項都會將現有嘅二十萬借款再融資，而分銷商仲要啱啱好五十五萬嘅新現金，總借款七十五萬，為期九十日。
  s2_en: >-
    Fixed is a committed 800,000-dollar limit. Asset has a 900,000 ceiling, but total borrowing is capped
    at 80 percent of eligible receivables plus 50 percent of eligible inventory. Receivables are eligible
    only under 90 days from invoice.
  s2_zh: >-
    Fixed是已承诺的八十万港元额度。Asset名义上限九十万，但借款总额不能超过合格应收账款的百分之八十，加上合格存货的百分之五十。应收账款只有在发票开出后未满九十天才算合格。
  s2_zh_hk: >-
    Fixed係已承諾嘅八十萬港元額度。Asset名義上限九十萬，但借款總額唔可以超過合資格應收賬款嘅百分之八十，加合資格存貨嘅百分之五十。應收賬款要發票開出後未夠九十日先算合資格。
  s3_en: >-
    Eligible receivables are now 800,000 of a 1-million book total, and eligible inventory is 400,000.
    Fixed charges 9 percent plus a 2,000 fee; Asset charges 7 percent plus 3,000. The final certificate
    must use eligibility on the draw date.
  s3_zh: >-
    目前合格应收账款是八十万，账面总额一百万；合格存货四十万。Fixed年利率百分之九，另收两千费用；Asset年利率百分之七，另收三千。最终证明要按支取当天的合格情况计算。
  s3_zh_hk: >-
    而家合資格應收賬款係八十萬，賬面總數一百萬；合資格存貨四十萬。Fixed年利率百分之九，另收兩千費用；Asset年利率百分之七，另收三千。最後嘅證明要按支取當日嘅合資格情況計。
