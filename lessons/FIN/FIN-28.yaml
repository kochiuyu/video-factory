  title_en: The hedge moves. Does it move with our cost?
  title_zh: 对冲在动。它会随我们的成本一起动吗？
  title_zh_hk: 對沖在動。它會隨我們的成本一起動嗎？
  image: art/hedge-moves-delivered-cost-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    CME explains that local cash prices can differ from a reference futures price because of freight,
    quality and local supply. LME material also separates a base reference price from physical premiums.
    Now you advise a fictional Hong Kong processor.
  zh: >-
    芝加哥商品交易所解释过：因为运费、质量和本地供应情况，本地现货价格可能和参考期货价格不同。伦敦金属交易所的资料也把基准参考价和实物溢价分开。现在，你要为香港一家虚构的加工商出主意。
  zh_hk: >-
    芝加哥商品交易所解釋過：因為運費、質素同本地供應情況，本地現貨價可能同參考期貨價唔同。倫敦金屬交易所嘅資料亦將基準參考價同實物溢價分開。而家，你要幫香港一間虛構嘅加工商出主意。
