  title_en: A premium stress test
  title_zh: 溢价压力测试
  title_zh_hk: 溢價壓力測試
  step1_en: Local premium P = HK$25 per kg
  step1_zh: 本地溢价 P = 每公斤 HK$25
  step1_zh_hk: 本地溢價 P = 每公斤 HK$25
  step2_en: Hedge formula, fee and date unchanged
  step2_zh: 对冲公式、费用和日期不变
  step2_zh_hk: 對沖公式、費用和日期不變
  step3_en: No fixed-premium offer or premium hedge
  step3_zh: 没有固定溢价报价或溢价对冲
  step3_zh_hk: 沒有固定溢價報價或溢價對沖
  s1_en: >-
    Before any commitment, a local handling disruption makes a 25-dollar premium per kilogram a credible
    stress scenario, independent of the index.
  s1_zh: 还没做任何承诺之前，本地装卸能力出了问题，每公斤二十五港元的溢价成了一个可信的压力情景，而且和指数无关。
  s1_zh_hk: 仲未做任何承諾之前，本地裝卸能力出咗問題，每公斤二十五港元嘅溢價成為一個可信嘅壓力情景，而且同指數無關。
  s2_en: >-
    The supplier formula is still I plus P, and the hedge formula, quantity, fee and date do not change.
    This is a stress test, not a forecast.
  s2_zh: 供应商的定价公式仍是I加P；对冲公式、数量、费用和日期都不变。这是压力测试，不是预测。
  s2_zh_hk: 供應商嘅定價公式仍然係I加P；對沖公式、數量、費用同日子都冇變。呢個係壓力測試，唔係預測。
  s3_en: >-
    No fixed-premium supplier offer or premium hedge is available. Management may keep the index hedge
    as partial protection, but must report any breach of the 115,000 ceiling.
  s3_zh: 没有固定溢价的供应商报价，也没有针对溢价的对冲。管理层可以保留指数对冲作为部分保护，但只要超出十一万五千的上限，就必须报告。
  s3_zh_hk: 冇固定溢價嘅供應商報價，亦冇針對溢價嘅對沖。管理層可以保留指數對沖做部分保障，但只要超出十一萬五千嘅上限，就一定要報告。
