  footer_en: >-
    Hedge: 1,000 × (I − 100) · fee 2,000
  footer_zh: 对冲收付 1,000 × (I − 100) · 费用 2,000
  footer_zh_hk: 對沖收付 1,000 × (I − 100) · 費用 2,000
  s1_en: >-
    The processor must buy exactly 1,000 kilograms of an industrial input in one month. The delivered
    price per kilogram will be index I on that date plus a local premium P. The planning premium is 10
    dollars, not fixed by contract.
  s1_zh: >-
    加工商一个月后必须正好买入一千公斤工业原料。供应商每公斤的到货价，等于当天的参考指数I，加上本地溢价P。计划用的溢价是每公斤十港元，但合同并没有把它定死。
  s1_zh_hk: >-
    加工商一個月後要啱啱好買一千公斤工業原料。供應商每公斤嘅到貨價，等於當日嘅參考指數I，加本地溢價P。計劃用嘅溢價係每公斤十港元，但合約冇鎖死佢。
  s2_en: >-
    The permitted hedge covers the same 1,000 kilograms and date. It pays the processor 1,000 times I
    minus 100 dollars; a negative result means the processor pays. The all-in fee is 2,000 dollars.
  s2_zh: 允许使用的对冲，覆盖同样的一千公斤和同一个日期。它付给加工商一千乘以I减一百港元；结果是负数，就由加工商付钱。全部费用是两千港元。
  s2_zh_hk: 容許用嘅對沖，覆蓋同樣嘅一千公斤同同一個日子。佢俾加工商一千乘I減一百港元；結果係負數，就由加工商俾錢。全部費用係兩千港元。
  s3_en: >-
    Management wants to remove index-driven variation, not to beat every unhedged outcome. It also asks
    whether the plan guarantees an all-in ceiling of 115,000 dollars. No probabilities are given.
  s3_zh: >-
    管理层的目标是消除由指数带来的成本波动，而不是在每一种情况下都比不对冲便宜。它还想知道，这个方案能不能保证总采购成本不超过十一万五千港元。题目没给概率。
  s3_zh_hk: >-
    管理層嘅目標係消除由指數帶嚟嘅成本波動，唔係每一種情況都要平過唔對沖。佢仲想知，呢個方案可唔可以保證總採購成本唔超過十一萬五千港元。題目冇俾機率。
