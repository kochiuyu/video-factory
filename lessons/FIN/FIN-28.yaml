  title_en: Hedge? Is 115,000 guaranteed?
  title_zh: 要对冲吗？115,000 有保证吗？
  title_zh_hk: 要對沖嗎？115,000 有保證嗎？
  en: >-
    Would the supplied hedge serve the index-risk objective, and what are the cash costs in both scenarios?
    Can the 115,000-dollar all-in ceiling be called guaranteed? Pause and vote.
  zh: 这项对冲能达到控制指数风险的目标吗？两个情景下的现金成本各是多少？能不能说十一万五千港元的总成本上限有保证？请暂停，投个票。
  zh_hk: 呢項對沖做唔做到控制指數風險嘅目標？兩個情景下嘅現金成本各係幾多？可唔可以話十一萬五千港元嘅總成本上限有保證？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
