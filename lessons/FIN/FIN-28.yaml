- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: What the hedge offsets
  title_zh: 对冲抵消的是什么
  title_zh_hk: 對沖抵消的是甚麼
  step1_en: >-
    I = 120: 130k − 20k + 2k = 112,000
  step1_zh: I = 120：130,000 − 20,000 + 2,000 = 112,000
  step1_zh_hk: I = 120：130,000 − 20,000 + 2,000 = 112,000
  step2_en: >-
    I = 80: 90k + 20k + 2k = 112,000
  step2_zh: I = 80：90,000 + 20,000 + 2,000 = 112,000
  step2_zh_hk: I = 80：90,000 + 20,000 + 2,000 = 112,000
  step3_en: Index risk gone; no ceiling guarantee
  step3_zh: 指数风险消除，上限没保证
  step3_zh_hk: 指數風險消除，上限沒保證
  s1_en: >-
    At an index of 120 and premium of 10, the purchase costs 130,000. The hedge receives 20,000, so the
    net cost is 130,000 minus 20,000 plus the 2,000 fee: 112,000 dollars.
  s1_zh: 指数一百二十、溢价十的时候，采购成本是十三万。对冲收到两万，所以净成本是十三万减两万，再加两千费用，即十一万二千港元。
  s1_zh_hk: 指數一百二十、溢價十嘅時候，採購成本係十三萬。對沖收到兩萬，所以淨成本係十三萬減兩萬，再加兩千費用，即係十一萬二千港元。
  s2_en: >-
    At an index of 80, the purchase costs 90,000, and the hedge pays out 20,000, so the net cost is 90,000
    plus 20,000 plus 2,000: again 112,000.
  s2_zh: 指数八十的时候，采购成本是九万，对冲要付出两万，所以净成本是九万加两万再加两千，同样是十一万二千。
  s2_zh_hk: 指數八十嘅時候，採購成本係九萬，對沖要俾出兩萬，所以淨成本係九萬加兩萬再加兩千，一樣係十一萬二千。
  s3_en: >-
    The hedge removes index-driven variation. It costs more than not hedging when the index is low, which
    is not a failure of that objective. Both results are under 115,000, but the premium was only assumed,
    so no ceiling guarantee follows.
  s3_zh: >-
    对冲消除了指数带来的波动。指数低的时候，它比不对冲更贵，但这并不代表没达到目标。两个结果都低于十一万五千，可是溢价只是假设的，所以推不出上限有保证。
  s3_zh_hk: >-
    對沖消除咗指數帶嚟嘅波動。指數低嘅時候，佢貴過唔對沖，但咁唔代表冇達到目標。兩個結果都低過十一萬五千，不過溢價只係假設，所以推唔出上限有保證。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: The premium moves separately
  title_zh: 溢价单独变动
  title_zh_hk: 溢價單獨變動
  step1_en: >-
    P = 25: hedged cost 127,000 in both
  step1_zh: P = 25：对冲后两种情景都是 127,000
  step1_zh_hk: P = 25：對沖後兩種情景都是 127,000
  step2_en: Hedged cost = 102,000 + 1,000 × P
  step2_zh: 对冲后成本 = 102,000 + 1,000 × P
  step2_zh_hk: 對沖後成本 = 102,000 + 1,000 × P
  step3_en: 12,000 over the cap · P must be ≤ 13
  step3_zh: 超出上限 12,000 · P 须 ≤ 13
  step3_zh_hk: 超出上限 12,000 · P 須 ≤ 13
  s1_en: >-
    With a premium of 25, the unhedged cost is 145,000 or 105,000. Hedged, it is 127,000 in both index
    scenarios, which is 12,000 dollars over the 115,000 ceiling.
  s1_zh: 溢价二十五时，不对冲的成本是十四万五千或十万五千。对冲之后，两个指数情景都是十二万七千，比十一万五千的上限多出一万二千港元。
  s1_zh_hk: 溢價二十五嘅時候，唔對沖嘅成本係十四萬五千或者十萬五千。對沖之後，兩個指數情景都係十二萬七千，超出十一萬五千嘅上限一萬二千港元。
  s2_en: >-
    Substituting, hedged cost equals 102,000 plus 1,000 times P. The index cancels; the premium does not.
    To stay within 115,000, the premium must be no more than 13 dollars per kilogram.
  s2_zh: 代入公式，对冲后成本等于十万二千加一千乘P。指数抵消掉了，溢价却没有。要守住十一万五千，溢价每公斤不能超过十三港元。
  s2_zh_hk: 代入公式，對沖後成本等於十萬二千加一千乘P。指數抵銷咗，溢價就冇。要守住十一萬五千，溢價每公斤唔可以超過十三港元。
  s3_en: >-
    This mismatch between the reference exposure and the delivered cost is basis risk. Real hedges can
    also mismatch on date, grade, quantity and funding.
  s3_zh: 参考价格的风险敞口和实际到货成本之间的错配，就是基差风险。真实的对冲还可能在日期、等级、数量和资金上出现错配。
  s3_zh_hk: 參考價格嘅風險同實際到貨成本之間嘅錯配，就係基差風險。真實嘅對沖仲可能喺日期、等級、數量同資金上面錯配。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A precise claim, not a guarantee
  title_zh: 说法要精确，不能说成保证
  title_zh_hk: 說法要精確，不能說成保證
  en: >-
    Keeping the hedge as index-only protection remains defensible: it holds the stressed cost constant
    across both index scenarios, but cannot meet the separate all-in ceiling. Declining keeps both exposures.
    Report the residual premium and the 12,000 shortfall, and seek a revised procurement plan.
  zh: >-
    把这项对冲当作只针对指数的保护而保留，仍然说得通：压力情景下，它让两个指数情景的成本保持一样，却满足不了另外那个总成本上限。不对冲，就两种风险都留着。要报告剩下的溢价风险和一万二千的缺口，并另订采购方案。
  zh_hk: >-
    將呢項對沖當做淨係針對指數嘅保障而保留，仍然講得通：壓力情景下，佢令兩個指數情景嘅成本保持一樣，但滿足唔到另外嗰個總成本上限。唔對沖，就兩種風險都留低。要報告剩低嘅溢價風險同一萬二千嘅缺口，再另外訂採購方案。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Hedge the index, report basis
  title_zh: 对冲指数，报告基差
  title_zh_hk: 對沖指數，報告基差
  q1_en: The index cancels; the premium does not
  q1_zh: 指数抵消了，溢价没有
  q1_zh_hk: 指數抵銷了，溢價沒有
  q2_en: Index protection is not an all-in ceiling
  q2_zh: 指数保护不等于总成本上限
  q2_zh_hk: 指數保障不等於總成本上限
  s1_en: >-
    Do not assume the reference price and local premium always move together, or always in opposite directions.
  s1_zh: 不要假设参考价格和本地溢价总是同向变动，或者总是反向变动。
  s1_zh_hk: 唔好假設參考價同本地溢價一定一齊郁，或者一定反方向郁。
  s2_en: >-
    This hedge payoff is for arithmetic only; it is not an instruction to trade, choose a real instrument
    or apply hedge accounting.
  s2_zh: 这里的对冲收益只用来练习计算，不是叫你去交易、挑选真实的金融工具，或者采用对冲会计。
  s2_zh_hk: 呢度嘅對沖回報淨係用嚟練習計數，唔係叫你去交易、揀真實嘅金融工具，或者用對沖會計。
  s3_en: >-
    The processor, input, supplier and hedge are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 加工商、原料、供应商和对冲都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 加工商、原料、供應商同對沖都係虛構嘅。官方場景圖只係教學插圖。
