  c11_zh_hk: 投資者先得最多 200 萬
  c12_en: All to founders
  c12_zh: 全归创始人
  c12_zh_hk: 全歸創辦人
  c21_en: Up to HK$2m to investor
  c21_zh: 投资者先得最多 200 万
  c21_zh_hk: 投資者先得最多 200 萬
  c22_en: 20% investor · 80% founders
  c22_zh: 投资者 20% · 创始人 80%
  c22_zh_hk: 投資者 20% · 創辦人 80%
  footer_en: >-
    Exits V: HK$1m, 6m, 15m
  footer_zh: 退出 V：100 万、600 万、1500 万
  footer_zh_hk: 退出 V：100 萬、600 萬、1500 萬
  s1_en: >-
    Each offer supplies 2 million dollars now and gives its investor 20 percent on an as-converted basis:
    if all shares became ordinary, the investor would own 20 percent and the founders 80. Only one offer
    is accepted, and all other terms are identical.
  s1_zh: >-
    两份要约现在都投入两百万港元，按转换后计算，投资者持股百分之二十：如果全部股份都转成普通股，投资者占百分之二十，创始人占百分之八十。只能接受一份，其他条款完全相同。
  s1_zh_hk: >-
    兩份要約而家都投兩百萬港元，按轉換後計，投資者持股百分之二十：如果全部股份都轉做普通股，投資者佔百分之二十，創辦人佔百分之八十。只可以接受一份，其他條款完全一樣。
  s2_en: >-
    At a cash exit, V is the total available to these shareholders after debts, costs and prior claims.
    Consider V of 1, 6 and 15 million dollars, with no probabilities. The original investment is not added
    to V again.
  s2_zh: >-
    现金退出时，V是还清债务、交易成本和其他优先请求之后，这些股东可以分的总额。看V为一百万、六百万和一千五百万港元三种情况，没有概率。原来的投资不再另外加到V上。
  s2_zh_hk: >-
    現金退出嗰陣，V係還清債務、交易成本同其他優先申索之後，呢啲股東可以分嘅總數。睇V係一百萬、六百萬同一千五百萬港元三個情況，冇機率。原本嘅投資唔會再加落V度。
  s3_en: >-
    While preferred, A pays its investor up to 2 million first and gives the founders all the rest. B
    also pays up to 2 million first, then splits any remainder 20 to 80, with no cap. Investor receipts
    can never exceed V.
  s3_zh: >-
    在仍是优先股的情况下，A先付给投资者最多两百万，剩下的全归创始人。B也先付最多两百万，剩余部分再按二八分，没有上限。投资者拿到的钱，永远不会超过V。
  s3_zh_hk: >-
    仲係優先股嘅情況下，A先俾投資者最多兩百萬，剩低嘅全部歸創辦人。B都係先俾最多兩百萬，剩餘再按二八分，冇上限。投資者攞到嘅錢，永遠唔會超過V。
