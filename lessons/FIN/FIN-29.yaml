  kicker: FIN-29
  kicker_en: FIN-29
  kicker_zh: FIN-29
  kicker_zh_hk: FIN-29
  title_en: The same ownership. The same exit proceeds?
  title_zh: 同样的持股。退出所得也一样吗？
  title_zh_hk: 同樣的持股。退出所得也一樣嗎？
  image: art/same-ownership-different-exit-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Public model venture terms distinguish priority payments, participation in remaining proceeds, and
    conversion to ordinary shares. So equal headline ownership need not mean equal exit distributions.
    Now you advise two founders of a fictional Hong Kong startup.
  zh: >-
    公开的风险投资范本条款，会把优先支付、参与分配剩余所得、转换成普通股这几件事分开。所以，名义上持股相同，退出时分到的钱不一定相同。现在，你要为香港一家虚构初创企业的两位创始人出主意。
  zh_hk: >-
    公開嘅風險投資範本條款，會將優先支付、參與分配剩餘所得、轉換做普通股呢幾樣嘢分開。所以，名義上持股一樣，退出嗰陣分到嘅錢唔一定一樣。而家，你要幫香港一間虛構初創企業嘅兩位創辦人出主意。
