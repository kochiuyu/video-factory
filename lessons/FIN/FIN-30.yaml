  title_en: Same interest, different timing
  title_zh: 两种还款安排，利息合计相同
  title_zh_hk: 兩種還款安排，利息合計相同
  step1_en: A pays 236,000 · 224,000 · 212,000
  step1_zh: A 还 236,000 · 224,000 · 212,000
  step1_zh_hk: A 還 236,000 · 224,000 · 212,000
  step2_en: B pays 24,000 · 24,000 · 624,000
  step2_zh: B 还 24,000 · 24,000 · 624,000
  step2_zh_hk: B 還 24,000 · 24,000 · 624,000
  step3_en: B reserve 450,000 → short 150,000
  step3_zh: B 储备 450,000 → 缺 150,000
  step3_zh_hk: B 儲備 450,000 → 缺 150,000
  s1_en: >-
    A's interest is 36,000, 24,000 and 12,000. With 200,000 of principal each year, its payments are 236,000,
    224,000 and 212,000, all within 240,000, and the debt reaches zero.
  s1_zh: >-
    A的利息分别是三万六千、两万四千和一万二千。加上每年二十万本金，还款是二十三万六千、二十二万四千和二十一万二千，都在二十四万以内，债务最后还清。
  s1_zh_hk: >-
    A嘅利息分別係三萬六千、兩萬四千同一萬二千。加埋每年二十萬本金，還款係二十三萬六千、二十二萬四千同二十一萬二千，全部喺二十四萬以內，債務最後還清。
  s2_en: >-
    B pays 24,000, 24,000 and then 624,000. Both offers pay 72,000 in interest, but equal totals do not
    make the timing equal.
  s2_zh: B的还款是两万四千、两万四千，然后是六十二万四千。两份要约的利息都是七万二千，但总额相同，不等于时间安排相同。
  s2_zh_hk: B嘅還款係兩萬四千、兩萬四千，跟住係六十二萬四千。兩份要約嘅利息都係七萬二千，但總數一樣，唔等於時間安排一樣。
  s3_en: >-
    B's initial reserve reaches 450,000 after three transfers, 150,000 short of the principal. The 66,000
    promotions use the rest, so no spare cash can close the gap.
  s3_zh: B起初的储备，三次转入后达到四十五万，比本金少十五万。每年六万六千的推广把余下的钱用光了，没有闲钱能补这个缺口。
  s3_zh_hk: B起初嘅儲備，三次轉入之後有四十五萬，比本金少十五萬。每年六萬六千嘅推廣用晒剩低嘅錢，冇閒錢補到呢個缺口。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Fund B's maturity payment
  title_zh: 为 B 的到期还款筹足钱
  title_zh_hk: 為 B 的到期還款籌足錢
  step1_en: Reserve 600,000 ÷ 3 = 200,000 a year
  step1_zh: 储备 600,000 ÷ 3 = 每年 200,000
  step1_zh_hk: 儲備 600,000 ÷ 3 = 每年 200,000
  step2_en: >-
    B promotions: 16,000 each year
  step2_zh: B 推广：每年 16,000
  step2_zh_hk: B 推廣：每年 16,000
  step3_en: >-
    A promotions: 4,000 · 16,000 · 28,000
  step3_zh: A 推广：4,000 · 16,000 · 28,000
  step3_zh_hk: A 推廣：4,000 · 16,000 · 28,000
  s1_en: >-
    To repay B without refinancing, reserve 600,000 divided by 3, or 200,000 each year. After 24,000 of
    interest, that leaves 16,000 a year for promotions, 50,000 less than the initial plan.
  s1_zh: 要不靠再融资还清B，每年要储备六十万除以三，即二十万。付完两万四千利息，每年只剩一万六千做推广，比原计划少五万。
  s1_zh_hk: 要唔靠再融資還清B，每年要儲六十萬除三，即係二十萬。俾完兩萬四千利息，每年淨係剩一萬六千做推廣，比原本計劃少五萬。
  s2_en: >-
    In year 3, the earlier 400,000 reserve plus that year's 240,000 gives 640,000. Pay 24,000 interest
    and 600,000 principal, and 16,000 is left. The third transfer is internal earmarking, not an extra
    expense.
  s2_zh: 第三年，之前储备的四十万，加上当年的二十四万，共六十四万。付两万四千利息和六十万本金，剩下一万六千。第三次转入只是内部划拨，不是额外开支。
  s2_zh_hk: 第三年，之前儲落嘅四十萬，加當年嘅二十四萬，共六十四萬。俾兩萬四千利息同六十萬本金，剩一萬六千。第三次轉入只係內部撥款，唔係額外開支。
  s3_en: >-
    A leaves 4,000, 16,000 and 28,000 for promotions, a total of 48,000, the same as fully reserved B.
    Both satisfy the repayment condition.
  s3_zh: A每年剩给推广的钱是四千、一万六千和两万八千，合计四万八千，和储足钱的B一样。两个方案都符合还款条件。
  s3_zh_hk: A每年剩俾推廣嘅錢係四千、一萬六千同兩萬八千，合共四萬八千，同儲夠錢嘅B一樣。兩個方案都符合還款條件。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Both self-funded plans work
  title_zh: 两个自筹方案都行得通
  title_zh_hk: 兩個自籌方案都行得通
  en: >-
    Choose fully reserved B if smoother promotion spending is valuable and the reserve discipline is credible.
    Choose A if gradual contractual principal reduction is preferred. Reject B's original plan, which
    relied on refinancing that is not assured.
  zh: >-
    如果更看重每年推广开支平稳，而且相信公司能守住储备纪律，就选储足钱的B。如果更想按合同逐步减少本金，就选A。B原来那个依赖不确定再融资的方案，应该否决。
  zh_hk: >-
    如果你更睇重每年推廣開支平穩，又相信公司守得住儲備紀律，就揀儲夠錢嘅B。如果想按合約逐步減本金，就揀A。B原本嗰個靠唔確定再融資嘅方案，應該否決。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Interest is not the whole debt
  title_zh: 利息不是债务的全部
  title_zh_hk: 利息不是債務的全部
  q1_en: Show principal due at maturity
  q1_zh: 列出到期应还的本金
  q1_zh_hk: 列出到期應還的本金
  q2_en: Uncommitted refinancing is not assured cash
  q2_zh: 未承诺的再融资不是确定现金
  q2_zh_hk: 未承諾的再融資不是確定現金
  s1_en: >-
    Affordable annual interest does not supply the missing principal. A reserve is a separate asset until
    it is actually used to repay debt.
  s1_zh: 每年付得起利息，并不会把缺的本金补上。储备在真正用来还债之前，只是另外一笔资产。
  s1_zh_hk: 每年俾得起利息，唔會幫你補返欠嘅本金。儲備喺真係用嚟還債之前，只係另外一筆資產。
  s2_en: >-
    This is not a loan application, legal recommendation, or forecast that any lender will refinance a
    business.
  s2_zh: 这不是贷款申请，不是法律建议，也不是预测任何贷款人会给企业再融资。
  s2_zh_hk: 呢個唔係貸款申請，唔係法律建議，亦唔係預測任何貸款人會幫企業再融資。
  s3_en: >-
    The studio, offers and cash amounts are fictional. Official scene art is a teaching illustration only.
  s3_zh: 工作室、要约和现金数额都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 工作室、要約同現金數額都係虛構嘅。官方場景圖只係教學插圖。
