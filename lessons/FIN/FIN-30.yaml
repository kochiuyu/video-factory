  title_en: Affordable interest. A repayable principal?
  title_zh: 付得起的利息。本金还得起吗？
  title_zh_hk: 付得起的利息。本金還得起嗎？
  image: art/interest-paid-principal-due-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The US Office of the Comptroller of the Currency describes refinance risk as the chance that debt
    cannot be replaced on reasonable terms when needed. So a loan schedule must show principal due at
    maturity, not only affordable interest. Now you advise a fictional Hong Kong printing studio.
  zh: >-
    美国货币监理署把再融资风险描述为：需要时，现有债务未必能按合理条件续上。所以，还款计划不能只列付得起的利息，还要列出到期应还的本金。现在，你要为香港一家虚构的印刷工作室出主意。
  zh_hk: >-
    美國貨幣監理署將再融資風險形容為：要用嗰陣，現有債務未必可以按合理條件續落去。所以，還款計劃唔可以淨係列出俾得起嘅利息，仲要列出到期要還嘅本金。而家，你要幫香港一間虛構嘅印刷工作室出主意。
