  title_zh_hk: 再融資並沒有承諾
  step1_en: Only an informal expression of interest
  step1_zh: 只有一份非正式的意向
  step1_zh_hk: 只有一份非正式的意向
  step2_en: Count zero assured cash from it
  step2_zh: 按零确定现金计算
  step2_zh_hk: 按零確定現金計算
  step3_en: Promotions can be cut now
  step3_zh: 推广开支现在就能削减
  step3_zh_hk: 推廣開支現在就能削減
  s1_en: >-
    The funding check finds only an informal expression of interest from a lender, subject to fresh credit
    approval and future terms. There is no committed refinancing.
  s1_zh: 资金核对只找到一家贷款人的非正式意向，还要重新做信贷审批，条款也要以后才定。并没有已承诺的再融资安排。
  s1_zh_hk: 資金核對淨係搵到一間貸款人嘅非正式意向，仲要重新做信貸審批，條款亦要遲啲先定。並冇已承諾嘅再融資安排。
  s2_en: >-
    Count it as zero assured cash, not as certain rejection. The board will approve only a plan that repays
    the loan from the stated cash, without relying on that funding.
  s2_zh: 把它算作零确定现金，但不等于一定被拒绝。董事会只批准不靠这笔资金、用既定现金还清原贷款的方案。
  s2_zh_hk: 將佢當做零確定現金，但唔等於一定俾人拒絕。董事會淨係批准唔靠呢筆資金、用既定現金還清原本貸款嘅方案。
  s3_en: >-
    The promotions are discretionary and can be cut now without charges. Management may put more into
    B's reserve, or choose A and spend what is left after each payment.
  s3_zh: 推广开支完全可以自主决定，现在削减也不收费。管理层可以把更多钱放进B的储备，也可以选A，把每次还款后剩下的钱拿来推广。
  s3_zh_hk: 推廣開支完全可以自己話事，而家減都唔使俾錢。管理層可以將多啲錢放入B嘅儲備，亦可以揀A，用每次還款之後剩低嘅錢做推廣。
