  s1_en: >-
    The studio needs 600,000 dollars for equipment now. Exactly 240,000 becomes available just before
    each year-end debt payment, with no other usable cash, reserves or owner injections.
  s1_zh: 工作室现在需要六十万港元买设备。每年年末还款之前，正好有二十四万港元可用，此外没有其他可用的现金、储备，股东也不会注资。
  s1_zh_hk: 工作室而家要六十萬港元買設備。每年年尾還款之前，啱啱有二十四萬港元可以用，除此之外冇其他可用嘅現金、儲備，老闆亦唔會注資。
  s2_en: >-
    Offer A repays principal in three equal 200,000-dollar instalments, with 6 percent interest on the
    opening balance. Offer B pays only 4 percent interest each year, with all 600,000 due at the end of
    year 3. Both total 72,000 dollars of interest.
  s2_zh: >-
    要约A分三次等额还本，每次二十万港元，利息按年初未还本金的百分之六计算。要约B每年只付百分之四的利息，六十万本金在第三年年末一次还清。两笔的利息合计都是七万二千港元。
  s2_zh_hk: >-
    要約A分三次等額還本，每次二十萬港元，利息按年初未還本金嘅百分之六計。要約B每年淨係俾百分之四嘅利息，六十萬本金喺第三年年尾一次過還。兩筆利息合共都係七萬二千港元。
  s3_en: >-
    Under B, the initial plan pays interest, puts 150,000 a year into a zero-return reserve, and spends
    66,000 on cancellable promotions. It assumes a new loan will cover any principal the reserve cannot
    meet.
  s3_zh: >-
    按B，管理层起初的计划是：付完利息，每年把十五万放进零回报的储备，剩下的六万六千花在可以取消的推广上。计划假设储备不够还的本金，会由一笔新贷款补上。
  s3_zh_hk: >-
    按B，管理層起初嘅計劃係：俾完利息，每年將十五萬放入零回報嘅儲備，剩低嘅六萬六千用喺可以取消嘅推廣。計劃假設儲備還唔晒嘅本金，會由一筆新貸款補上。
