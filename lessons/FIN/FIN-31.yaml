  title_en: A higher percentage. More value created?
  title_zh: 更高的百分比。创造的价值也更多吗？
  title_zh_hk: 更高的百分比。創造的價值也更多嗎？
  image: art/higher-percentage-more-value-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Investment-appraisal teaching separates the rate that makes a project's net present value zero from
    the value it adds at the required return. When projects differ in scale, the two measures can rank
    them differently. Now you advise a fictional Hong Kong exhibition workshop.
  zh: >-
    投资评估的教学把两件事分开：一个是让项目净现值等于零的那个比率，另一个是按要求回报率算，项目增加了多少价值。项目规模不同时，这两个尺度的排序可能不一样。现在，你要为香港一家虚构的展览工场出主意。
  zh_hk: >-
    投資評估嘅教學會分開兩樣嘢：一樣係令項目淨現值等於零嘅嗰個比率，另一樣係按要求回報率計，項目增加咗幾多價值。項目規模唔同嘅時候，兩把尺排出嚟嘅次序可以唔一樣。而家，你要幫香港一間虛構嘅展覽工場出主意。
