  footer_en: Budget HK$100,000 · required 10%
  footer_zh: 可用 HK$100,000 · 要求回报率 10%
  footer_zh_hk: 可用 HK$100,000 · 要求回報率 10%
  s1_en: >-
    The workshop can take a small display-module project S or a large project L for the coming year, or
    decline both. Both need its only assembly bay, and the customer accepts only one specification.
  s1_zh: 这家工场来年可以接小型展示模块项目S，或者大型项目L，也可以两个都不做。两个项目都要用工场唯一的装配工位，客户也只接受一种规格。
  s1_zh_hk: 呢間工場下年可以接小型展示模組項目S，或者大型項目L，亦可以兩個都唔做。兩個項目都要用工場唯一嘅裝配工位，客戶亦只接受一種規格。
  s2_en: >-
    S costs 40,000 dollars today and returns 52,000 a year later. L costs 100,000 and returns 124,000.
    The receipts already include all costs, taxes and disposal proceeds.
  s2_zh: S今天付四万港元，一年后收回五万二千。L今天付十万，一年后收回十二万四千。这些收款已经包括全部成本、税和处置所得。
  s2_zh_hk: S今日俾四萬港元，一年後收返五萬二千。L今日俾十萬，一年後收返十二萬四千。呢啲收款已經包埋所有成本、稅同處置所得。
  s3_en: >-
    Management wants the most present value among feasible choices. It has 100,000 dollars available today,
    both projects carry a 10 percent required return, and unused money simply goes back to the owner.
  s3_zh: 管理层的目标，是在做得到的选择里增加最多的现值。今天有十万港元可用，两个项目的要求回报率都是百分之十，用不完的钱就还给业主。
  s3_zh_hk: 管理層嘅目標，係喺做得到嘅選擇入面增加最多現值。今日有十萬港元可以用，兩個項目嘅要求回報率都係百分之十，用唔晒嘅錢就還返俾老闆。
