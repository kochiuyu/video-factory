  en: >-
    Calculate each project's internal rate of return and net present value. Which project do you choose,
    and which measure answers the stated objective? Pause and vote.
  zh: 算出每个项目的内部收益率和净现值。你选哪一个？哪一个尺度才回答了所述的目标？请暂停，投个票。
  zh_hk: 計出每個項目嘅內部收益率同淨現值。你揀邊個？邊把尺先答到講明咗嘅目標？暫停，投個票。
