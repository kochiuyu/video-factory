  title_en: Endorse D for its percentage?
  title_zh: 因为百分比高就选 D？
  title_zh_hk: 因為百分比高就選 D？
  en: >-
    Calculate each plan's cash returned to the owner and its return on initial equity. Would you endorse
    D just because its percentage is higher, and what remains unknown? Pause and vote.
  zh: 算出每个方案交还给业主的现金，以及初始权益的回报率。你会只因为D的百分比更高，就支持D吗？还有什么是不知道的？请暂停，投个票。
  zh_hk: 計出每個方案交返俾老闆嘅現金，同初始權益嘅回報率。你會唔會淨係因為D嘅百分比高啲，就支持D？仲有咩係唔知道嘅？暫停，投個票。
