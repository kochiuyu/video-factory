  s1_en: >-
    A one-year display-equipment project needs 1,000,000 dollars today. The owner can fund it all with
    equity, plan E, or put in 400,000 and borrow 600,000, plan D. Operations are identical either way.
  s1_zh: >-
    一个为期一年的展示器材项目，今天需要一百万港元。业主可以全部用自有资金，也就是E方案；也可以自己出四十万、借六十万，也就是D方案。两种方案下，经营完全一样。
  s1_zh_hk: >-
    一個為期一年嘅展示器材項目，今日要一百萬港元。老闆可以全部用自己嘅錢，即係E方案；亦可以自己出四十萬、借六十萬，即係D方案。兩個方案之下，經營完全一樣。
  s2_en: >-
    The loan has a fixed 5 percent rate, with all principal and one year's interest due at year-end. The
    equipment is then sold, recovering exactly 1,000,000 dollars before the debt is repaid.
  s2_zh: 贷款是固定年利率百分之五，本金和一年利息都在年末到期。到时设备卖掉，在还债之前正好收回一百万港元。
  s2_zh_hk: 貸款係固定年利率百分之五，本金同一年利息都喺年尾到期。到時設備賣咗，喺還債之前啱啱收返一百萬港元。
  s3_en: >-
    The opening scenario produces 120,000 dollars of operating profit. Compare the one-year return on
    the owner's initial project equity. No probabilities or risk preference are given.
  s3_zh: 起初情景的经营利润是十二万港元。请比较业主投入项目的初始权益，一年下来的回报率。题目没有给概率，也没有给风险偏好。
  s3_zh_hk: 起初情景嘅經營利潤係十二萬港元。請比較老闆投入項目嘅初始權益，一年落嚟嘅回報率。題目冇俾機率，亦冇俾風險偏好。
- id: pause1
