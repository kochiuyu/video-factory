  title_en: Positive profit, safe equity?
  title_zh: 利润为正，权益就安全吗？
  title_zh_hk: 利潤為正，權益就安全嗎？
  en: >-
    In the downturn, calculate both equity returns and check that D repays its debt. Does positive operating
    profit protect the owner from an equity loss? Pause and vote.
  zh: 在下行情景里，算出两种权益回报，并核对D能不能还清债务。经营利润为正，就能让业主避免权益亏损吗？请暂停，投个票。
  zh_hk: 喺下行情景入面，計出兩種權益回報，再核對D還唔還得清債。經營利潤係正數，就可以令老闆避開權益虧損嗎？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: The opening percentages
  title_zh: 起初情景的百分比
  title_zh_hk: 起初情景的百分比
  step1_en: >-
    E: 1,120,000 back → 12%
  step1_zh: E：交还 1,120,000 → 12%
  step1_zh_hk: E：交還 1,120,000 → 12%
  step2_en: D owes 600,000 + 30,000
  step2_zh: D 欠 600,000 + 30,000
  step2_zh_hk: D 欠 600,000 + 30,000
  step3_en: >-
    D: 490,000 back → 22.5%
  step3_zh: D：交还 490,000 → 22.5%
  step3_zh_hk: D：交還 490,000 → 22.5%
  s1_en: >-
    E returns 1,120,000 dollars: the 1,000,000 recovery plus 120,000 of profit. The gain is 120,000 on
    1,000,000, or 12 percent.
  s1_zh: E交还业主一百一十二万：一百万的资产收回，加上十二万利润。盈利十二万，除以一百万，就是百分之十二。
  s1_zh_hk: E交返俾老闆一百一十二萬：一百萬資產收返，加十二萬利潤。賺十二萬，除一百萬，即係百分之十二。
  s2_en: >-
    D owes 5 percent of 600,000, or 30,000 dollars of interest, plus the 600,000 principal, so 630,000
    in total.
  s2_zh: D要付六十万的百分之五，即三万港元利息，再加六十万本金，一共六十三万。
  s2_zh_hk: D要俾六十萬嘅百分之五，即係三萬港元利息，再加六十萬本金，總共六十三萬。
  s3_en: >-
    D returns 490,000 dollars. On 400,000 of equity, the gain is 90,000, or 22.5 percent. The higher percentage
    comes with a smaller equity base and a smaller dollar gain.
  s3_zh: D交还四十九万港元。按四十万的权益计算，盈利九万，回报率百分之二十二点五。更高的百分比，背后是更小的权益基数，以及更少的盈利金额。
  s3_zh_hk: D交返四十九萬港元。按四十萬權益計，賺九萬，回報率百分之二十二點五。百分比高啲，背後係細啲嘅權益基數，同埋少啲嘅盈利金額。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Positive operations, equity loss
  title_zh: 经营为正，权益亏损
  title_zh_hk: 經營為正，權益虧損
  step1_en: >-
    Downturn: E +2% · D −2.5%
  step1_zh: 下行：E +2% · D −2.5%
  step1_zh_hk: 下行：E +2% · D −2.5%
  step2_en: D still repays 630,000 in full
  step2_zh: D 仍全数偿还 630,000
  step2_zh_hk: D 仍全數償還 630,000
  step3_en: Return falls 10 points vs 25
  step3_zh: 回报率跌 10 对 25 个百分点
  step3_zh_hk: 回報率跌 10 對 25 個百分點
  s1_en: >-
    In the downturn, total project cash is 1,020,000 dollars. E gains 20,000, or 2 percent. D pays 630,000
    and gets back 390,000, a 10,000 loss, or minus 2.5 percent. Profit is positive but below the interest.
  s1_zh: >-
    下行情景里，项目现金总共一百零二万。E盈利两万，回报率百分之二。D付六十三万，拿回三十九万，亏损一万，回报率是负百分之二点五。经营利润为正，但低于利息。
  s1_zh_hk: >-
    下行情景入面，項目現金總共一百零二萬。E賺兩萬，回報率百分之二。D俾六十三萬，拎返三十九萬，蝕一萬，回報率係負百分之二點五。經營利潤係正，但係低過利息。
  s2_en: >-
    D still repays the lender in full, because 1,020,000 exceeds 630,000. The owner's loss is less equity
    returned, not an unpaid loan or a cash call.
  s2_zh: D仍然能全数还给贷款人，因为一百零二万大于六十三万。业主的亏损，是拿回的权益变少了，不是欠下贷款，也不用额外补钱。
  s2_zh_hk: D仍然還得晒俾貸款人，因為一百零二萬大過六十三萬。老闆嘅虧損，係拎返嘅權益少咗，唔係欠落貸款，亦唔使額外補錢。
  s3_en: >-
    Operating profit falls 100,000 under either plan. But the equity return falls 10 points for E and
    25 points for D. The same change is larger against D's smaller equity base. That is financial leverage.
  s3_zh: 两种方案下，经营利润都少了十万。但E的权益回报率跌十个百分点，D跌二十五个百分点。同样的变化，放在D较小的权益基数上就更大。这就是财务杠杆。
  s3_zh_hk: >-
    兩個方案之下，經營利潤都少咗十萬。但E嘅權益回報率跌十個百分點，D跌二十五個百分點。同一個變化，放喺D細啲嘅權益基數上面就大啲。呢個就係財務槓桿。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A conditional choice
  title_zh: 有条件的选择
  title_zh_hk: 有條件的選擇
  en: >-
    D gives the higher equity return in the opening scenario but a loss in the downturn, while E stays
    positive in both. A recommendation needs the owner's tolerance for loss, credible probabilities and
    the use of the outside capital.
  zh: >-
    起初情景里D的权益回报更高，但下行时会亏损；E在两种情景下都为正。要给建议，还需要知道业主能承受多少亏损、可信的概率，以及那笔外部资金的用途。
  zh_hk: >-
    起初情景入面D嘅權益回報高啲，但下行嘅時候會蝕；E喺兩個情景都係正數。要俾建議，仲要知道老闆可以承受幾多虧損、可信嘅機率，同埋嗰筆外面資金點用。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Leverage magnifies equity risk
  title_zh: 杠杆放大权益风险
  title_zh_hk: 槓桿放大權益風險
  q1_en: Compare dollar gains and equity bases
  q1_zh: 比较盈利金额和权益基数
  q1_zh_hk: 比較盈利金額和權益基數
  q2_en: Test a downside before borrowing
  q2_zh: 借钱之前先测试下行情景
  q2_zh_hk: 借錢之前先測試下行情景
  s1_en: >-
    Borrowing does not improve operations. It changes how a given operating result is shared, so equity
    returns swing more in both directions.
  s1_zh: 借钱不会让经营变好。它改变的是同一份经营成果怎样分配，所以权益回报在上下两个方向都会摆动得更大。
  s1_zh_hk: 借錢唔會令經營變好。佢改變嘅係同一份經營成果點分，所以權益回報喺上落兩個方向都會擺得大啲。
  s2_en: >-
    These two illustrations show sensitivity, not expected returns or optimal borrowing.
  s2_zh: 这两个例子显示的是敏感度，不是预期回报，也不是最佳借款水平。
  s2_zh_hk: 呢兩個例子顯示嘅係敏感度，唔係預期回報，亦唔係最佳借款水平。
  s3_en: >-
    The business, project and amounts are fictional, not real loan offers. Official scene art is a teaching
    illustration only.
  s3_zh: 企业、项目和金额都是虚构的，不是真实的贷款报价。官方场景图只是教学插图。
  s3_zh_hk: 企業、項目同金額都係虛構嘅，唔係真實嘅貸款報價。官方場景圖只係教學插圖。
