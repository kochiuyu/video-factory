  title_en: More return on equity. More risk to equity?
  title_zh: 权益回报更高。权益的风险也更高吗？
  title_zh_hk: 權益回報更高。權益的風險也更高嗎？
  image: art/more-return-more-equity-risk-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Finance education separates the return a business generates from the return left for its owners after
    financing. Borrowing changes the claims on the same operating result. It does not improve that result.
    Now you advise a fictional Hong Kong display-hire business.
  zh: >-
    金融教学把两种回报分开：一种是企业本身赚到的回报，另一种是付完融资之后留给业主的回报。借钱改变的，是谁对同一份经营成果有多少请求权，并不会让经营成果变好。现在，你要为香港一家虚构的展示器材租赁公司出主意。
  zh_hk: >-
    金融教學會分開兩種回報：一種係企業本身賺到嘅回報，另一種係俾完融資之後留返俾老闆嘅回報。借錢改變嘅，係邊個對同一份經營成果有幾多請求權，唔會令經營成果變好。而家，你要幫香港一間虛構嘅展示器材租賃公司出主意。
