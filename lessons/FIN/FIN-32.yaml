  step1_en: Operating profit only HK$20,000
  step1_zh: 经营利润只有 HK$20,000
  step1_zh_hk: 經營利潤只有 HK$20,000
  step2_en: Same recovery, same 5% rate
  step2_zh: 资产收回和 5% 利率不变
  step2_zh_hk: 資產收回和 5% 利率不變
  step3_en: An alternative outcome, no odds
  step3_zh: 另一种结果，没有概率
  step3_zh_hk: 另一種結果，沒有機率
  s1_en: >-
    Before choosing, assess a downturn. Operating profit is only 20,000 dollars, still positive before
    financing.
  s1_zh: 选择之前，先评估一个下行情景。经营利润只有两万港元，付融资之前仍然是正的。
  s1_zh_hk: 揀之前，先評估一個下行情景。經營利潤得兩萬港元，未俾融資之前仍然係正數。
  s2_en: >-
    Everything else is unchanged, including the 1,000,000-dollar asset recovery before debt repayment
    and the fixed 5 percent rate.
  s2_zh: 其他假设都不变，包括还债之前收回一百万港元的资产，以及固定的百分之五利率。
  s2_zh_hk: 其他假設全部唔變，包括還債之前收返一百萬港元資產，同固定百分之五嘅利率。
  s3_en: >-
    This is an alternative outcome for the same year, not a second year. Both plans are still available,
    and no probabilities are added.
  s3_zh: 这是同一年的另一种可能结果，不是第二年。两个方案都还可以选，题目也没有补充概率。
  s3_zh_hk: 呢個係同一年嘅另一個可能結果，唔係第二年。兩個方案都仲揀得，題目亦冇補充機率。
