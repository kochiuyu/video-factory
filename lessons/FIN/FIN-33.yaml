  s1_en: >-
    The sole founder of an equipment-maintenance business has a buyer proposing 10 million dollars of
    enterprise value for all the shares. Nothing is signed.
  s1_zh: 一家设备维修企业的唯一创始人，收到买方的报价：按一千万港元的企业价值，买下全部股份。目前什么都还没签。
  s1_zh_hk: 一間設備維修企業嘅唯一創辦人，收到買家報價：按一千萬港元企業價值，買晒全部股份。而家乜都未簽。
  s2_en: >-
    The cash for the shares equals enterprise value, plus eligible surplus cash, minus the debt payoff.
    The worksheet shows a 3 million payoff and 1.4 million in company bank balances, provisionally all
    treated as eligible.
  s2_zh: >-
    股份的价款，等于企业价值，加上合格的富余现金，再减去债务清偿额。工作表显示，债务清偿额是三百万，公司银行存款一百四十万，暂时全部当成合格现金。
  s2_zh_hk: >-
    股份嘅價錢，等於企業價值，加合資格嘅剩餘現金，再減債務清償額。工作表顯示，債務清償額係三百萬，公司銀行存款一百四十萬，暫時全部當係合資格現金。
  s3_en: >-
    The buyer pays the lender separately, and the bank balances stay in the company. The founder wants
    at least 8 million dollars in immediate cash for the shares.
  s3_zh: 买方另外付钱给贷款人，银行存款留在公司里。创始人要求卖股份即时拿到至少八百万港元现金。
  s3_zh_hk: 買家另外俾錢貸款人，銀行存款留喺公司入面。創辦人要求賣股份即時收到最少八百萬港元現金。
