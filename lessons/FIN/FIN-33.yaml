  title_en: Now, does it meet the minimum?
  title_zh: 现在还够最低要求吗？
  title_zh_hk: 現在還夠最低要求嗎？
  en: >-
    What does the founder now receive, and does the proposal meet the minimum? Reconcile the payments
    without counting cash or debt twice, then find the headline needed for 8 million. Pause and vote.
  zh: 创始人现在能拿到多少？这个报价还符合最低要求吗？核对各笔付款时，不要把现金或债务算两次，再算出要拿到八百万需要多高的报价。请暂停，投个票。
  zh_hk: 創辦人而家收到幾多？呢個報價仲符唔符合最低要求？對數嘅時候唔好將現金或者債務計兩次，再計出要收到八百萬，報價要幾高。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Classify before adding
  title_zh: 先分类，再加总
  title_zh_hk: 先分類，再加總
  step1_en: >-
    Provisional: 10.0 + 1.4 − 3.0 = 8.4
  step1_zh: 暂定：10.0 + 1.4 − 3.0 = 8.4
  step1_zh_hk: 暫定：10.0 + 1.4 − 3.0 = 8.4
  step2_en: >-
    Reviewed: 10.0 + 0.9 − 3.0 = 7.9
  step2_zh: 核实后：10.0 + 0.9 − 3.0 = 7.9
  step2_zh_hk: 核實後：10.0 + 0.9 − 3.0 = 7.9
  step3_en: Short of the minimum by 0.1
  step3_zh: 比最低要求少 0.1
  step3_zh_hk: 比最低要求少 0.1
  s1_en: >-
    The first worksheet gives 10 million, plus 1.4, minus 3, or 8.4 million for the shares. That is above
    the minimum, but only if all the cash qualifies.
  s1_zh: 第一版工作表算出：一千万，加一百四十万，减三百万，股份价款是八百四十万。这高于最低要求，但前提是全部现金都合格。
  s1_zh_hk: 第一版工作表計出：一千萬，加一百四十萬，減三百萬，股份價錢係八百四十萬。呢個高過最低要求，但前提係所有現金都合資格。
  s2_en: >-
    After review, eligible cash is 900,000. The share price becomes 10 million, plus 0.9, minus 3, or
    7.9 million.
  s2_zh: 复核之后，合格现金是九十万。股份价款变成一千万，加九十万，减三百万，也就是七百九十万。
  s2_zh_hk: 覆核之後，合資格現金係九十萬。股份價錢變成一千萬，加九十萬，減三百萬，即係七百九十萬。
  s3_en: >-
    That misses the 8 million minimum by 100,000 dollars. The deposit has not vanished, so do not subtract
    500,000 again from 7.9 million.
  s3_zh: 这比八百万的最低要求少了十万港元。那笔存款并没有消失，所以不要再从七百九十万里减一次五十万。
  s3_zh_hk: 咁樣比八百萬嘅最低要求少十萬港元。嗰筆存款冇消失，所以唔好再喺七百九十萬入面減多一次五十萬。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Follow the two recipients
  title_zh: 分清两个收款人
  title_zh_hk: 分清兩個收款人
  step1_en: Founder 7.9 + lender 3.0 = 10.9
  step1_zh: 创始人 7.9 + 贷款人 3.0 = 10.9
  step1_zh_hk: 創辦人 7.9 + 貸款人 3.0 = 10.9
  step2_en: = headline 10.0 + cash 0.9
  step2_zh: = 报价 10.0 + 现金 0.9
  step2_zh_hk: = 報價 10.0 + 現金 0.9
  step3_en: Needed headline H = 10.1
  step3_zh: 所需报价 H = 10.1
  step3_zh_hk: 所需報價 H = 10.1
  s1_en: >-
    The buyer pays the founder 7.9 million and the lender 3 million, so 10.9 million in total.
  s1_zh: 买方付给创始人七百九十万，付给贷款人三百万，合计一千零九十万。
  s1_zh_hk: 買家俾創辦人七百九十萬，俾貸款人三百萬，合共一千零九十萬。
  s2_en: >-
    That equals the 10 million headline plus the 900,000 of eligible cash kept in the company. The bank
    balance is not a third payment to the founder, and the loan is not subtracted twice.
  s2_zh: 这正好等于一千万的报价，加上留在公司里的九十万合格现金。银行存款不是付给创始人的第三笔钱，贷款也不能减两次。
  s2_zh_hk: 呢個啱啱等於一千萬報價，加留喺公司嘅九十萬合資格現金。銀行存款唔係俾創辦人嘅第三筆錢，貸款亦唔可以減兩次。
  s3_en: >-
    For 8 million, H plus 0.9 minus 3 must equal 8, so H is 10.1 million. A 100,000 increase would just
    meet the minimum, but no buyer has agreed to it.
  s3_zh: 要拿到八百万，H加九十万减三百万必须等于八百万，所以H是一千零一十万。报价再高十万就刚好达标，但买方并没有同意。
  s3_zh_hk: 要收到八百萬，H加九十萬減三百萬一定要等於八百萬，所以H係一千零一十萬。報價高多十萬就啱啱達標，但買家冇答應過。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Report the shortfall
  title_zh: 如实报告差额
  title_zh_hk: 如實報告差額
  en: >-
    Report that the current proposal fails the founder's minimum. Do not accept it on the old 8.4 million
    worksheet. The founder could seek a changed proposal or decline it. Releasing the deposit is not an
    available shortcut.
  zh: >-
    应该如实报告：现在的报价达不到创始人的最低要求，不能按旧的八百四十万工作表接受。创始人可以要求改报价，也可以拒绝。动用那笔受限存款，不是可行的捷径。
  zh_hk: >-
    應該如實報告：而家嘅報價達唔到創辦人嘅最低要求，唔可以按舊嘅八百四十萬工作表接受。創辦人可以要求改報價，亦可以拒絕。動用嗰筆受限存款，唔係可行嘅捷徑。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Business value is not share cash
  title_zh: 企业价格不等于股份价格
  title_zh_hk: 企業價格不等於股份價格
  q1_en: Check which cash is eligible
  q1_zh: 核对哪些现金合格
  q1_zh_hk: 核對哪些現金合資格
  q2_en: Count cash and debt only once
  q2_zh: 现金和债务只算一次
  q2_zh_hk: 現金和債務只算一次
  s1_en: >-
    The founder's receipt depends on the contract's cash and debt definitions, not on the enterprise-value
    headline or the bank statement alone.
  s1_zh: 创始人能拿到多少，取决于合同里现金和债务的定义，不是只看企业价值报价，也不是只看银行结单。
  s1_zh_hk: 創辦人收到幾多，要睇合約入面現金同債務嘅定義，唔係淨係睇企業價值報價，亦唔係淨係睇銀行月結單。
  s2_en: >-
    This does not value the business from forecasts, confirm legal enforceability or estimate after-tax
    wealth.
  s2_zh: 这里不根据预测为企业估值，不确认法律上的可执行性，也不估算税后财富。
  s2_zh_hk: 呢度唔係根據預測幫企業估值，唔確認法律上嘅執行力，亦唔估算稅後財富。
  s3_en: >-
    The business, buyer and amounts are fictional; no transaction is arranged. Official scene art is a
    teaching illustration only.
  s3_zh: 企业、买方和金额都是虚构的，并未安排任何交易。官方场景图只是教学插图。
  s3_zh_hk: 企業、買家同金額都係虛構嘅，冇安排任何交易。官方場景圖只係教學插圖。
