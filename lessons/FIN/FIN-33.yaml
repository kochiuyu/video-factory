  title_zh: 部分现金受限制
  title_zh_hk: 部分現金受限制
  step1_en: HK$500,000 restricted deposit
  step1_zh: HK$500,000 受限存款
  step1_zh_hk: HK$500,000 受限存款
  step2_en: Excluded from the cash add-back
  step2_zh: 不计入现金加回
  step2_zh_hk: 不計入現金加回
  step3_en: HK$900,000 verified eligible
  step3_zh: HK$900,000 核实合格
  step3_zh_hk: HK$900,000 核實合資格
  s1_en: >-
    The closing review finds 500,000 dollars in a restricted deposit backing a premises agreement. It
    cannot be withdrawn, distributed or used to repay debt, and it stays with the company.
  s1_zh: 交割复核发现，有五十万港元是一笔受限存款，用来支持一份场地协议。这笔钱不能提取、不能分配，也不能用来还债，交割后留在公司里。
  s1_zh_hk: 完成交易前嘅覆核發現，有五十萬港元係一筆受限存款，用嚟支持一份場地協議。呢筆錢唔可以提、唔可以分，亦唔可以用嚟還債，完成交易之後留喺公司。
  s2_en: >-
    The contract expressly excludes that deposit from the cash add-back. Its benefit is already inside
    the unchanged 10 million headline, with no later payment to the seller.
  s2_zh: 合同明确把这笔存款排除在现金加回之外。它的好处已经包含在不变的一千万企业价值报价里，以后也不会再付给卖方。
  s2_zh_hk: 合約講明將呢筆存款排除喺現金加回之外。佢嘅好處已經包喺冇變嘅一千萬企業價值報價入面，之後亦唔會再俾賣方。
  s3_en: >-
    The remaining 900,000 dollars is verified eligible surplus cash. These are fictional bargain terms,
    not a rule for every restricted deposit.
  s3_zh: 其余九十万港元，核实为合格的富余现金。这些是虚构的交易条款，不是所有受限存款都适用的规则。
  s3_zh_hk: 其餘九十萬港元，核實係合資格嘅剩餘現金。呢啲係虛構嘅交易條款，唔係所有受限存款都適用嘅規則。
