  title_en: A business price. A price for the shares?
  title_zh: 企业的价格。股份另有价格吗？
  title_zh_hk: 企業的價格。股份另有價格嗎？
  image: art/business-price-share-price-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Valuation teaching separates the value of an operating business from the value of its equity, and
    purchase agreements define which cash and debt enter the price. Check those definitions before treating
    a bank balance as extra sale proceeds. Now you advise a fictional Hong Kong founder.
  zh: >-
    估值教学把经营业务的价值和股权的价值分开；收购协议则规定，哪些现金和债务会计入价格调整。把银行存款当成额外的出售所得之前，要先核对这些定义。现在，你要为香港一位虚构的创始人出主意。
  zh_hk: >-
    估值教學會分開經營業務嘅價值同股權嘅價值；收購協議就會講明，邊啲現金同債務計入價格調整。將銀行存款當做額外出售所得之前，要先核對呢啲定義。而家，你要幫香港一位虛構嘅創辦人出主意。
