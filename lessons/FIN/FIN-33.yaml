  title_en: Does it meet HK$8 million?
  title_zh: 够不够八百万？
  title_zh_hk: 夠不夠八百萬？
  en: >-
    Under the provisional cash assumption, what would the founder receive for the shares? Does it meet
    the 8 million minimum, and which classification must be checked first? Pause and vote.
  zh: 按暂定的现金假设，创始人卖股份能拿到多少？够不够八百万的最低要求？在依赖这个答案之前，哪一项分类必须先核对？请暂停，投个票。
  zh_hk: 按暫定嘅現金假設，創辦人賣股份收到幾多？夠唔夠八百萬嘅最低要求？靠呢個答案之前，邊一項分類一定要先核對？暫停，投個票。
