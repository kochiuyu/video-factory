  s1_en: >-
    A supplier asks the business to guarantee a loan. Nothing is signed. The board can keep it under review,
    option A, or decline it, option B. Your task is the liquidity screen, not contract approval.
  s1_zh: >-
    一家供应商请这家企业为一笔贷款做担保，目前什么都还没签。董事会可以继续研究，也就是A；也可以拒绝，也就是B。你的任务是做流动性筛选，不是批准合同。
  s1_zh_hk: 一間供應商請呢間企業幫一筆貸款做擔保，而家乜都未簽。董事會可以繼續研究，即係A；亦可以拒絕，即係B。你嘅任務係做流動性篩選，唔係批准合約。
  s2_en: >-
    The loan goes to the supplier, and there is no fee. If the supplier cannot pay at the end of month
    three, the business must pay exactly 100,000 dollars that day, all in. Otherwise it pays nothing.
  s2_zh: 贷款是给供应商的，也没有担保费。如果供应商在第三个月月末还不了款，企业当天就要付正好十万港元，所有费用都包括在内；否则一分钱都不用付。
  s2_zh_hk: 貸款係俾供應商嘅，亦冇擔保費。如果供應商喺第三個月月尾還唔到錢，企業當日就要俾足十萬港元，所有費用都計埋；否則一蚊都唔使俾。
  s3_en: >-
    Cash just before any call is 180,000 dollars with strong sales or 60,000 with weak sales. The board
    needs at least 40,000 left in every outcome. This first forecast assumes weak sales and a call never
    coincide.
  s3_zh: >-
    担保被触发之前，销售强时有十八万港元可用，销售弱时只有六万。董事会要求每一种结果都至少留下四万。这份初步预测假设，销售弱和担保被触发不会同时发生。
  s3_zh_hk: >-
    擔保觸發之前，銷售強嗰陣有十八萬港元可以用，銷售弱就得六萬。董事會要求每一個結果都最少留低四萬。呢份初步預測假設，銷售弱同擔保觸發唔會同時發生。
