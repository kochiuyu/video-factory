  title_en: A guaranteed loan. Whose future cash?
  title_zh: 一笔担保贷款。未来的现金是谁的？
  title_zh_hk: 一筆擔保貸款。未來的現金是誰的？
  image: art/guaranteed-loan-future-cash-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A loan guarantee can require a future payment even when no cash leaves the guarantor today. Financial
    education stresses the scope and affordability of that promise, and liquidity guidance looks at demands
    that arrive together. Now you advise a fictional Hong Kong packaging business.
  zh: >-
    贷款担保即使今天不用付钱，将来也可能要求担保人付款。金融教育强调要看清这项承诺的范围，以及付不付得起；流动性指引则关注几笔付款同时到来的情况。现在，你要为香港一家虚构的包装企业出主意。
  zh_hk: >-
    貸款擔保就算今日唔使俾錢，將來都可能要擔保人俾錢。金融教育強調要睇清楚呢個承諾嘅範圍，同埋俾唔俾得起；流動性指引就會留意幾筆要付嘅錢同時嚟嘅情況。而家，你要幫香港一間虛構嘅包裝企業出主意。
