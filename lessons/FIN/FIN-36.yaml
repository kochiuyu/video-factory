  title_en: A or B for continuing service?
  title_zh: 长期服务选 A 还是 B？
  title_zh_hk: 長期服務選 A 還是 B？
  en: >-
    For continuing, repeatable service, which machine has the lower equivalent annual cost? Why would
    choosing the smaller purchase price, or the smaller one-cycle cost, mislead you? Pause and vote.
  zh: 如果服务一直持续、可以重复更换，哪台机器的等额年成本更低？为什么只挑购买价更低、或者单个周期成本更低的，会误导你？请暂停，投个票。
  zh_hk: 如果服務一直持續、可以重複換新，邊部機器嘅等額年成本低啲？點解淨係揀買價平啲、或者一個周期成本低啲嘅，會誤導你？暫停，投個票。
