  title_en: A cheaper machine. Over how many service years?
  title_zh: 更便宜的机器。服务年限要算多少年？
  title_zh_hk: 更便宜的機器。服務年期要算多少年？
  image: art/cheaper-machine-service-years-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Equivalent annual cost turns a discounted ownership cycle into a comparable yearly amount. It helps
    compare assets with different lives when they give the same service and can be replaced on unchanged
    terms. A fixed service deadline needs a common end date instead. Now you advise a fictional Hong Kong
    scanning bureau.
  zh: >-
    等额年成本，是把一个折现后的持有周期，换算成可以比较的每年金额。如果两项资产提供同样的服务，而且能按不变的条件更换，它可以用来比较寿命不同的资产。如果服务有固定的截止日期，就要改用同一个结束日。现在，你要为香港一家虚构的文件扫描公司出主意。
  zh_hk: >-
    等額年成本，係將一個折現咗嘅持有周期，換算成可以比較嘅每年金額。如果兩件資產提供一樣嘅服務，又可以按唔變嘅條件更換，佢就可以用嚟比較壽命唔同嘅資產。如果服務有固定嘅截止日期，就要改用同一個結束日。而家，你要幫香港一間虛構嘅文件掃描公司出主意。
