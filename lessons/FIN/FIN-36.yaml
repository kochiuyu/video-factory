  title_en: Service ends after three years
  title_zh: 服务三年后结束
  title_zh_hk: 服務三年後結束
  step1_en: Contract ends after year 3
  step1_zh: 合同第 3 年后结束
  step1_zh_hk: 合約第 3 年後結束
  step2_en: No renewal, no other use
  step2_zh: 不续约，也没有其他用途
  step2_zh_hk: 不續約，也沒有其他用途
  step3_en: B sells for net HK$20,000
  step3_zh: B 可卖得净额 HK$20,000
  step3_zh_hk: B 可賣得淨額 HK$20,000
  s1_en: >-
    Before purchase, the client confirms the service contract ends after exactly three years, with no
    renewal and no other use for either machine.
  s1_zh: 购买之前，客户确认服务合同正好在三年后结束，不能续约，两台机器之后也没有别的用途。
  s1_zh_hk: 買之前，客戶確認服務合約啱啱三年後完，唔可以續，兩部機器之後亦冇其他用途。
  s2_en: >-
    At the end of year three, after that year's work, A is worth nothing, but B can be sold for a net
    20,000 dollars. Treat both as certain.
  s2_zh: 第三年年末，做完当年的工作之后，A不值钱，B可以卖得净额两万港元。两者都当作确定。
  s2_zh_hk: 第三年年尾，做完嗰年嘅工作之後，A唔值錢，B可以賣到淨額兩萬港元。兩樣都當係確定。
  s3_en: >-
    No replacement is bought. Selling B passes all later use and costs to its buyer. The year-three discount
    factor is 0.751314801.
  s3_zh: 之后不再购买替换机器。卖掉B，以后的使用和费用都转给买方。第三年的折现系数是零点七五一三一四八零一。
  s3_zh_hk: 之後唔再買替換機器。賣咗B，之後嘅使用同費用都轉俾買家。第三年嘅折現係數係零點七五一三一四八零一。
