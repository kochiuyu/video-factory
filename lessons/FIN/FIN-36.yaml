  s1_en: >-
    The bureau must buy one of two machines for the same annual workload. Both meet identical quality,
    capacity, safety and privacy requirements.
  s1_zh: 这家公司要为同样的年工作量，在两台机器中买一台。两台的质量、产能、安全和隐私要求都完全一样。
  s1_zh_hk: 呢間公司要為同樣嘅每年工作量，喺兩部機器之間買一部。兩部嘅質素、產能、安全同私隱要求都完全一樣。
  s2_en: >-
    A costs 60,000 dollars and lasts three years. B costs 80,000 and lasts five. Each costs 10,000 at
    every year-end to run, and is worth nothing at the end of its life.
  s2_zh: A要六万港元，可以用三年。B要八万，可以用五年。两台每年年末的运行费用都是一万，寿命结束时都不值钱。
  s2_zh_hk: A要六萬港元，用得三年。B要八萬，用得五年。兩部每年年尾嘅營運費用都係一萬，壽命完嗰陣都唔值錢。
  s3_en: >-
    At first, assume the service is needed indefinitely, and each machine can be replaced at life-end
    on identical terms. Use a 10 percent discount rate. Lower cost is better.
  s3_zh: 先假设这项服务无限期需要，每台机器到寿命结束时，都能按同样条件更换。折现率用百分之十。成本越低越好。
  s3_zh_hk: 先假設呢項服務無限期都要，每部機器壽命完嗰陣，都可以按同樣條件換新。折現率用百分之十。成本越低越好。
