  title_en: What monthly deposit works?
  title_zh: 每月要存多少？
  title_zh_hk: 每月要存多少？
  en: >-
    What equal monthly contribution funds the target with deposits at months 1 to 12? Compare it with
    120,000 divided by 12. Which deposit earns eleven months of interest, and which earns none? Pause
    and vote.
  zh: >-
    第一到第十二个月每月末存一次，每次要存多少才够目标？和十二万除以十二比较一下。哪一笔存款能赚十一个月利息，哪一笔一点利息都没有？请暂停，投个票。
  zh_hk: 第一到第十二個月每月尾存一次，每次要存幾多先夠目標？同十二萬除十二比較吓。邊一筆存款賺到十一個月利息，邊一筆一啲利息都冇？暫停，投個票。
