  s1_en: >-
    The wholesaler needs 120,000 dollars for a replacement packing machine at the end of month 12. The
    price and date are fixed, and there is no loan or opening reserve.
  s1_zh: 这家批发商要在第十二个月月末，拿出十二万港元更换一台包装机。价格和日期都已固定，没有贷款，也没有现成的储备。
  s1_zh_hk: 呢間批發商要喺第十二個月月尾，拎出十二萬港元換一部包裝機。價錢同日子都已經定咗，冇貸款，亦冇現成嘅儲備。
  s2_en: >-
    Starting from zero, it deposits the same amount at the end of each month, months 1 to 12. Each month-end,
    the fund earns 0.5 percent on its opening balance, and then that month's deposit is added.
  s2_zh: 从零开始，每个月月末存入相同金额，从第一个月存到第十二个月。每到月末，储备先按月初余额赚百分之零点五的利息，然后再加上当月的存款。
  s2_zh_hk: 由零開始，每個月月尾存入相同金額，由第一個月存到第十二個月。每到月尾，儲備先按月初餘額賺百分之零點五利息，然後再加埋當月嘅存款。
  s3_en: >-
    Up to 14,000 dollars is available each month-end. The goal is the smallest equal whole-dollar monthly
    deposit that reaches 120,000 on time.
  s3_zh: 每个月末最多有一万四千港元可用。目标是找出最小的、每月相同的整数存款额，按时存够十二万。
  s3_zh_hk: 每個月尾最多有一萬四千港元可以用。目標係搵出最細、每月一樣嘅整數存款額，準時儲夠十二萬。
