  title_en: One large payment. A predictable monthly reserve?
  title_zh: 一笔大额付款。每月储备就好预测吗？
  title_zh_hk: 一筆大額付款。每月儲備就好預測嗎？
  image: art/monthly-reserve-later-start-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A replacement reserve grows through new contributions and through interest already earned. The date
    of each contribution matters: a payment made just before the purchase has no time to grow. So a savings
    target needs a calendar as well as an amount. Now you advise a fictional Hong Kong wholesaler.
  zh: >-
    更换设备的储备金，靠新存进去的钱增长，也靠已经赚到的利息增长。每一笔存款的日期都很重要：采购前一刻才存进去的钱，根本没有时间增长。所以储蓄目标除了金额，还要有时间表。现在，你要为香港一家虚构的批发商出主意。
  zh_hk: >-
    換設備嘅儲備金，靠新存入去嘅錢增長，亦靠已經賺到嘅利息增長。每一筆存款嘅日子都好重要：採購前一刻先存入去嘅錢，根本冇時間增長。所以儲蓄目標除咗金額，仲要有時間表。而家，你要幫香港一間虛構嘅批發商出主意。
