  s1_en: >-
    Before any transfer, a cash review finds that months 1, 2 and 3 have no surplus for this reserve.
  s1_zh: 还没开始存款，一次现金复核就发现，第一、二、三个月都没有余钱可以放进这笔储备。
  s1_zh_hk: 未開始存錢，一次現金覆核就發現，第一、二、三個月都冇餘錢可以放入呢筆儲備。
  s2_en: >-
    The first possible deposit is now at the end of month 4. Months 4 to 12 still allow up to 14,000 dollars
    each.
  s2_zh: 现在最早的一笔存款，要到第四个月月末。第四到第十二个月，每个月仍然最多可存一万四千港元。
  s2_zh_hk: 而家最早嘅一筆存款，要等到第四個月月尾。第四到第十二個月，每個月仍然最多可以存一萬四千港元。
  s3_en: >-
    The machine still costs 120,000 at the end of month 12. There is no catch-up lump sum, and the deadline
    cannot be extended.
  s3_zh: 机器在第十二个月月末仍然要十二万。没有一次性补存的钱，期限也不能延后。
  s3_zh_hk: 部機喺第十二個月月尾仍然要十二萬。冇一次過補存嘅錢，期限亦唔可以延後。
