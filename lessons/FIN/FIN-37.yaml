- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Accumulate each payment
  title_zh: 把每一笔存款累积起来
  title_zh_hk: 把每一筆存款累積起來
  step1_en: >-
    12 deposits: factor 12.33556237
  step1_zh: 12 笔存款：系数 12.33556237
  step1_zh_hk: 12 筆存款：係數 12.33556237
  step2_en: D = 9,728, rounded up
  step2_zh: D = 9,728，向上取整
  step2_zh_hk: D = 9,728，向上取整
  step3_en: Not 120,000 ÷ 12 = 10,000
  step3_zh: 不是 120,000 ÷ 12 = 10,000
  step3_zh_hk: 不是 120,000 ÷ 12 = 10,000
  s1_en: >-
    Twelve deposits give an accumulation factor of 12.33556237. So 120,000 divided by that factor is 9,727.97,
    rounded up to 9,728 dollars, which reaches about 120,000.35.
  s1_zh: >-
    十二笔存款的累积系数是十二点三三五五六二三七。十二万除以这个系数，是九千七百二十七点九七，向上取整就是九千七百二十八港元，最后大约有十二万点三五。
  s1_zh_hk: >-
    十二筆存款嘅累積係數係十二點三三五五六二三七。十二萬除呢個係數，係九千七百二十七點九七，向上取整就係九千七百二十八港元，最後大約有十二萬點三五。
  s2_en: >-
    The month-1 deposit earns eleven months of interest, and the month-12 deposit earns none. Don't give
    every deposit twelve months of interest.
  s2_zh: 第一个月存的钱，可以赚十一个月利息；第十二个月存的钱，一点利息都没有。不要让每一笔存款都赚十二个月利息。
  s2_zh_hk: 第一個月存嘅錢，賺到十一個月利息；第十二個月存嘅錢，一啲利息都冇。唔好當每一筆存款都賺十二個月利息。
  s3_en: >-
    Saving 10,000 a month would also work, but dividing by twelve ignores interest. It does not find the
    smallest transfer.
  s3_zh: 每月存一万也够，但除以十二的做法忽略了利息，找不到最小的存款额。
  s3_zh_hk: 每月存一萬都夠，但除十二嘅做法冇計利息，搵唔到最細嘅存款額。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Count the dates after the delay
  title_zh: 推迟之后重新数日期
  title_zh_hk: 推遲之後重新數日期
  step1_en: >-
    Months 4–12: nine deposits
  step1_zh: 第 4–12 个月：九笔存款
  step1_zh_hk: 第 4–12 個月：九筆存款
  step2_en: New D = 13,069, under 14,000
  step2_zh: 新 D = 13,069，低于 14,000
  step2_zh_hk: 新 D = 13,069，低於 14,000
  step3_en: Old 9,728 leaves 30,676.38 short
  step3_zh: 照旧存 9,728 缺 30,676.38
  step3_zh_hk: 照舊存 9,728 缺 30,676.38
  s1_en: >-
    Months 4 to 12 inclusive give nine deposits, not eight. Their factor is 9.182115829, so the revised
    deposit is 13,068.88, rounded up to 13,069 dollars.
  s1_zh: >-
    第四到第十二个月，包括头尾，一共九笔存款，不是八笔。它们的累积系数是九点一八二一一五八二九，所以新的存款额是一万三千零六十八点八八，向上取整是一万三千零六十九港元。
  s1_zh_hk: >-
    第四到第十二個月，包頭包尾，一共九筆存款，唔係八筆。佢哋嘅累積係數係九點一八二一一五八二九，所以新嘅存款額係一萬三千零六十八點八八，向上取整係一萬三千零六十九港元。
  s2_en: >-
    That is 3,341 more each month than before, but still 931 below the 14,000 limit, so the plan fits.
  s2_zh: 这比原来每个月多三千三百四十一，但仍比一万四千的上限少九百三十一，所以方案可行。
  s2_zh_hk: 咁樣比原本每個月多三千三百四十一，但仍然比一萬四千嘅上限少九百三十一，所以方案行得通。
  s3_en: >-
    Keeping 9,728 for nine deposits gives only about 89,323.62, a shortfall of 30,676.38. That exceeds
    three missed deposits, because those early deposits would also have earned interest.
  s3_zh: >-
    如果九笔都照旧存九千七百二十八，只得到大约八万九千三百二十三点六二，缺三万零六百七十六点三八。这比少存的三笔还多，因为那三笔早期存款本来也能赚利息。
  s3_zh_hk: >-
    如果九筆都照舊存九千七百二十八，淨係得大約八萬九千三百二十三點六二，差三萬零六百七十六點三八。呢個多過少存咗嘅三筆，因為嗰三筆早期存款本來都賺到利息。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A later start needs a new plan
  title_zh: 起步晚，就要重新规划
  title_zh_hk: 起步晚，就要重新規劃
  en: >-
    Approve 13,069 dollars a month for months 4 to 12 in this fictional model, and check actual transfers
    against the calendar. An unchanged standing instruction does not keep an unchanged target, and rounding
    down is not harmless.
  zh: >-
    在这个虚构模型里，批准第四到第十二个月每月存一万三千零六十九港元，并按时间表核对实际存款。转账指令不变，不等于目标还能达到；向下取整也不是无伤大雅。
  zh_hk: >-
    喺呢個虛構模型入面，批准第四到第十二個月每月存一萬三千零六十九港元，再按時間表核對實際存款。轉賬指示唔變，唔等於目標仲達到；向下取整亦唔係無傷大雅。
