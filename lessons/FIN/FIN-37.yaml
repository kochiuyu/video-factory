  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Savings targets need a calendar
  title_zh: 储蓄目标要有时间表
  title_zh_hk: 儲蓄目標要有時間表
  q1_en: Each deposit grows for different months
  q1_zh: 每笔存款增长的月数不同
  q1_zh_hk: 每筆存款增長的月數不同
  q2_en: Recalculate after a late start
  q2_zh: 起步晚了就要重新计算
  q2_zh_hk: 起步晚了就要重新計算
  s1_en: >-
    Missed early deposits cost more than their face value, because they also lose the interest they would
    have earned.
  s1_zh: 错过的早期存款，损失的不只是本金，因为它们本来能赚到的利息也没有了。
  s1_zh_hk: 錯過咗嘅早期存款，損失嘅唔止係本金，因為佢哋本來賺到嘅利息都冇埋。
  s2_en: >-
    The monthly rate here is a classroom assumption, not a real bank offer or investment product.
  s2_zh: 这里的月利率是课堂假设，不是真实的银行报价，也不是投资产品。
  s2_zh_hk: 呢度嘅月利率係課堂假設，唔係真實嘅銀行報價，亦唔係投資產品。
  s3_en: >-
    The wholesaler, machine, rate and amounts are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 批发商、机器、利率和金额都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 批發商、機器、利率同金額都係虛構嘅。官方場景圖只係教學插圖。
