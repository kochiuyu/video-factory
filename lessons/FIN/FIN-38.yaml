  title_en: Is HK$210,000 enough?
  title_zh: 二十一万够吗？
  title_zh_hk: 二十一萬夠嗎？
  en: >-
    Calculate the existing requirement and the additional requirement under the initial assumptions. Does
    the 210,000-dollar allowance cover the increase? Show inventory, receivables and payables separately.
    Pause and vote.
  zh: 按起初的假设，算出现有业务所需的营运资金，以及新渠道增加的部分。二十一万港元的拨款够不够？请把存货、应收和应付分开列出。请暂停，投个票。
  zh_hk: 按起初嘅假設，計出現有業務要嘅營運資金，同新渠道增加嘅部分。二十一萬港元嘅撥款夠唔夠？請將存貨、應收同應付分開列出。暫停，投個票。
