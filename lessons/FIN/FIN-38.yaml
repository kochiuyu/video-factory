  footer_en: Cost 60% · allowance HK$210,000
  footer_zh: 成本占销售 60% · 拨款 HK$210,000
  footer_zh_hk: 成本佔銷售 60% · 撥款 HK$210,000
  s1_en: >-
    The distributor sells 3,650,000 dollars a year on credit. A new channel would add 1,825,000 a year.
    Purchases and cost of goods sold are 60 percent of sales.
  s1_zh: 这家分销商每年赊销三百六十五万港元。新渠道每年会再增加一百八十二万五千。采购和销货成本都是销售额的百分之六十。
  s1_zh_hk: 呢間分銷商每年記帳銷售三百六十五萬港元。新渠道每年會再加一百八十二萬五千。採購同銷貨成本都係銷售額嘅百分之六十。
  s2_en: >-
    Initially, both hold 30 days of inventory, collect after 40 days and pay suppliers after 20. Stock
    is valued at cost, receivables at sales value.
  s2_zh: 起初假设两者都持有三十天存货，四十天后收款，二十天后付款给供应商。存货按成本计算，应收账款按销售额计算。
  s2_zh_hk: 起初假設兩樣都持有三十日存貨，四十日後收錢，二十日後俾錢供應商。存貨按成本計，應收賬款按銷售額計。
  s3_en: >-
    Operating working capital is inventory plus receivables minus payables. The existing need is already
    funded, and the board has earmarked 210,000 dollars for the growth.
  s3_zh: 营运资金，等于存货加应收账款，再减应付账款。现有业务所需的资金已经有着落，董事会另外为这次增长预留了二十一万港元。
  s3_zh_hk: 營運資金，等於存貨加應收賬款，再減應付賬款。現有業務要嘅資金已經有着落，董事會另外為今次增長預留咗二十一萬港元。
- id: pause1
