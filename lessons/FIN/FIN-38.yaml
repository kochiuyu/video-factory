  title_en: A sales forecast. How much working capital?
  title_zh: 有了销售预测。营运资金要多少？
  title_zh_hk: 有了銷售預測。營運資金要多少？
  image: art/faster-payment-more-stock-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Growth can tie up money in stock and unpaid customer invoices, even when sales have a positive margin.
    Supplier credit offsets part of that investment. Faster collection may help, but it must be weighed
    against inventory needs and the different money bases behind each measure. Now you advise a fictional
    Hong Kong distributor.
  zh: >-
    就算销售有正的毛利，增长也可能把钱压在存货和客户未付的发票上。供应商给的赊账期，可以抵消一部分投入。收款更快也许有帮助，但要同时考虑存货需要，以及每个指标背后不同的金额基础。现在，你要为香港一家虚构的分销商出主意。
  zh_hk: >-
    就算銷售有正嘅毛利，增長都可能將錢壓喺存貨同客戶未俾嘅發票度。供應商俾嘅數期，可以抵銷一部分投入。收錢快啲可能有幫助，但要同時考慮存貨需要，同埋每個指標背後唔同嘅金額基礎。而家，你要幫香港一間虛構嘅分銷商出主意。
