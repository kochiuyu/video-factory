  s1_en: >-
    Early repayment can be worse or better depending on the dated fee schedule, so check the contract,
    not a slogan.
  s1_zh: 提前还款是好是坏，要看按日期的收费安排，所以要核对合同，而不是靠一句口号。
  s1_zh_hk: 提早還款係好係壞，要睇按日期嘅收費安排，所以要核對合約，唔係靠一句口號。
  s2_en: >-
    This is not a real bank quotation, a legal determination or advice to use protected reserves.
  s2_zh: 这不是真实的银行报价，不是法律判断，也不是建议动用受保护的储备。
  s2_zh_hk: 呢個唔係真實嘅銀行報價，唔係法律判斷，亦唔係建議動用受保護嘅儲備。
  s3_en: >-
    The business, loan and fees are fictional. Official scene art is a teaching illustration only.
  s3_zh: 企业、贷款和费用都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 企業、貸款同費用都係虛構嘅。官方場景圖只係教學插圖。
