  title_en: Settle now or wait?
  title_zh: 现在结清，还是等一等？
  title_zh_hk: 現在清還，還是等一等？
  en: >-
    If the fee is 3,000 on either date, which choice leaves more cash right after day 30? Include the
    return on cash left after repaying today. What detail must be verified before acting? Pause and vote.
  zh: >-
    如果两个日期的结清费都是三千，哪个选择在第三十日之后剩下的现金更多？今天还款后剩下的现金也有回报，要算进去。行动之前必须核对哪一项细节？请暂停，投个票。
  zh_hk: >-
    如果兩個日子嘅清還費都係三千，邊個選擇喺第三十日之後剩低嘅現金多啲？今日還完錢剩低嘅現金都有回報，要計埋。行動之前一定要核對邊一項細節？暫停，投個票。
