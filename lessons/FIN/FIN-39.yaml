  title_en: A reward for early repayment. After which fee?
  title_zh: 提前还款有奖励。要看哪一笔费用？
  title_zh_hk: 提早還款有獎勵。要看哪一筆費用？
  image: art/early-repayment-after-which-fee-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Repaying a loan early can avoid interest, but a settlement fee and the return given up on cash also
    matter. Compare complete cash flows on a common date. Repaying borrowed principal settles an existing
    obligation; it is not a saving in itself. Now you advise a fictional Hong Kong business.
  zh: >-
    提前还贷可以省下利息，但结清费用和现金本来能赚的回报也要算进去。要在同一个日期比较完整的现金流。归还借来的本金，是清偿已有的债务，本身并不是节省。现在，你要为香港一家虚构的企业出主意。
  zh_hk: >-
    提早還貸可以慳返利息，但清還費用同現金本來賺到嘅回報都要計埋。要喺同一個日子比較完整嘅現金流。還返借咗嘅本金，係清還已經有嘅債，本身唔係慳錢。而家，你要幫香港一間虛構嘅企業出主意。
