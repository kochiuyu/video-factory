  en: >-
    Recalculate both day-30 balances and the advantage of waiting. Separate the fee cut, the extra loan
    interest and the extra deposit interest. What day-30 fee would make them tie? Pause and vote.
  zh: >-
    重新算出两种做法在第三十日的余额，以及等待的好处。把费用减少、多付的贷款利息和多赚的存款利息分开。第三十日的费用是多少时，两者打平？请暂停，投个票。
  zh_hk: >-
    重新計出兩種做法喺第三十日嘅餘額，同等嘅好處。將費用減少、多俾嘅貸款利息同多賺嘅存款利息分開。第三十日嘅費用係幾多，兩樣先打和？暫停，投個票。
