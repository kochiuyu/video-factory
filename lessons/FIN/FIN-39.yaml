  s1_en: >-
    The business owes 100,000 dollars on a fixed-rate loan. Interest of 1,000 is due every thirty days,
    and the last payment has just cleared.
  s1_zh: 这家企业有一笔固定利率贷款，还欠十万港元。每三十天要付一千利息，上一期刚刚付清。
  s1_zh_hk: 呢間企業有一筆定息貸款，仲欠十萬港元。每三十日要俾一千利息，上一期啱啱俾清。
  s2_en: >-
    It can settle fully today, option N, or pay the next 1,000 of interest and settle on day 30, option
    W. It has exactly 104,000 dollars available, and any cash kept earns 0.2 percent over thirty days.
  s2_zh: >-
    它可以今天就全部结清，这是N；也可以先付下一期一千利息，到第三十日才结清，这是W。现在正好有十万四千港元可用，留着的现金三十天可以赚百分之零点二。
  s2_zh_hk: >-
    佢可以今日就全部清還，即係N；亦可以先俾下一期一千利息，到第三十日先清還，即係W。而家啱啱有十萬四千港元可以用，留住嘅現金三十日賺到百分之零點二。
  s3_en: >-
    Today's settlement fee is confirmed at 3,000 dollars. The manager assumes the same fee on day 30,
    but has not checked the dated schedule.
  s3_zh: 今天结清的费用确定是三千港元。财务经理假设第三十日也是同样的费用，但还没核对按日期列出的收费表。
  s3_zh_hk: 今日清還嘅費用確定係三千港元。財務經理假設第三十日都係同樣嘅費用，但未核對按日期列出嘅收費表。
