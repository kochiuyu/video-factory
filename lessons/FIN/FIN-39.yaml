  step1_en: >-
    N: 1,000 left → 1,002
  step1_zh: N：剩 1,000 → 1,002
  step1_zh_hk: N：剩 1,000 → 1,002
  step2_en: >-
    W at 3,000 fee: 208 left
  step2_zh: W（费用 3,000）：剩 208
  step2_zh_hk: W（費用 3,000）：剩 208
  step3_en: >-
    W at 500 fee: 2,708 left
  step3_zh: W（费用 500）：剩 2,708
  step3_zh_hk: W（費用 500）：剩 2,708
  s1_en: >-
    N pays 100,000 plus the 3,000 fee today, leaving 1,000. That earns 2 dollars, so N has 1,002 after
    day 30. Always compare both choices on the same date.
  s1_zh: N今天付十万本金加三千费用，剩下一千。这一千赚两港元，所以N在第三十日后有一千零二。两个选择一定要放在同一个日期比较。
  s1_zh_hk: N今日俾十萬本金加三千費用，剩一千。呢一千賺兩蚊，所以N喺第三十日後有一千零二。兩個選擇一定要放喺同一個日子比較。
  s2_en: >-
    Under the first assumption, W keeps 104,000, earns 208, then pays 104,000 in total. It is left with
    208, so N is 794 dollars ahead.
  s2_zh: 按起初的假设，W留着十万四千，赚两百零八，然后一共付十万四千，只剩两百零八，所以N多七百九十四港元。
  s2_zh_hk: 按起初嘅假設，W留住十萬四千，賺二百零八，之後總共俾十萬四千，淨係剩二百零八，所以N多七百九十四港元。
  s3_en: >-
    With the verified 500-dollar fee, W pays 101,500 and keeps 2,708. Now waiting leaves 1,706 dollars
    more, so choose W.
  s3_zh: 按核实后的五百港元费用，W一共付十万一千五百，剩下两千七百零八。现在等待能多留一千七百零六港元，所以应该选W。
  s3_zh_hk: 按核實後五百港元嘅費用，W總共俾十萬一千五百，剩兩千七百零八。而家等多陣可以多留一千七百零六港元，所以應該揀W。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Reconcile and find the boundary
  title_zh: 对账，再找临界点
  title_zh_hk: 對賬，再找臨界點
  step1_en: 2,500 − 1,000 + 206 = 1,706
  step1_zh: 2,500 − 1,000 + 206 = 1,706
  step1_zh_hk: 2,500 − 1,000 + 206 = 1,706
  step2_en: Principal is 100,000 either way
  step2_zh: 两种做法本金都是 100,000
  step2_zh_hk: 兩種做法本金都是 100,000
  step3_en: Tie when the day-30 fee is 2,206
  step3_zh: 第 30 日费用 2,206 时打平
  step3_zh_hk: 第 30 日費用 2,206 時打平
  s1_en: >-
    Waiting cuts the fee by 2,500, adds 1,000 of loan interest and earns 206 more deposit interest. That
    gives the 1,706 advantage.
  s1_zh: 等待让费用少了两千五，多付一千贷款利息，多赚两百零六存款利息。合起来就是一千七百零六的好处。
  s1_zh_hk: 等嘅話費用少咗兩千五，多俾一千貸款利息，多賺二百零六存款利息。加埋就係一千七百零六嘅好處。
  s2_en: >-
    The principal is 100,000 in both choices. Early payment does not save 100,000, and adding a principal
    saving would double-count it.
  s2_zh: 两种选择的本金都是十万。提前还款并没有省下十万，再另外加一笔本金节省，就会重复计算。
  s2_zh_hk: 兩個選擇嘅本金都係十萬。提早還款冇慳到十萬，再另外加一筆本金慳錢，就會重複計算。
  s3_en: >-
    Let F be the day-30 fee. Waiting leaves 3,208 minus F, which equals 1,002 when F is 2,206. Waiting
    wins below that fee and loses above it.
  s3_zh: 设第三十日的费用为F。等待剩下三千二百零八减F，当F是两千二百零六时，就等于一千零二。费用低于这个数，等待更好；高于它，就更差。
  s3_zh_hk: 設第三十日嘅費用係F。等嘅話剩三千二百零八減F，F係兩千二百零六嘅時候，就等於一千零二。費用低過呢個數，等就好啲；高過佢，就差啲。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Verify dated quotes first
  title_zh: 先核对报价日期
  title_zh_hk: 先核對報價日期
  en: >-
    On the supplied comparison, choose W. That does not mean waiting always helps. Obtain dated settlement
    quotes, and confirm principal, accrued interest, notice deadlines and fee bands. A quote for one date
    is not valid for another.
  zh: >-
    按题目给的比较，应该选W。但这不代表等一等总是更好。要拿到按日期的结清报价，核对本金、应计利息、通知期限和收费档次。某一天的报价，不能直接用在另一天。
  zh_hk: >-
    按題目俾嘅比較，應該揀W。但咁唔代表等一等一定好啲。要攞到按日期嘅清還報價，核對本金、應計利息、通知期限同收費級別。某一日嘅報價，唔可以直接用喺另一日。
