  step1_zh_hk: 第 30 日的費用：HK$500
  step2_en: >-
    Today's fee: still HK$3,000
  step2_zh: 今天的费用：仍是 HK$3,000
  step2_zh_hk: 今天的費用：仍是 HK$3,000
  step3_en: Waiting still costs HK$1,000 interest
  step3_zh: 等待仍要付 HK$1,000 利息
  step3_zh_hk: 等待仍要付 HK$1,000 利息
  s1_en: >-
    The lender's verified schedule shows a contractual fee reset. Full settlement on day 30 costs only
    500 dollars.
  s1_zh: 贷款人核实过的收费表显示，合同约定费用会重设。第三十日全部结清，只要五百港元。
  s1_zh_hk: 貸款人核實過嘅收費表顯示，合約講明費用會重設。第三十日全部清還，只要五百港元。
  s2_en: >-
    Today's fee is still 3,000. This is a fee reset, not an interest-rate reset.
  s2_zh: 今天结清的费用仍然是三千。这是费用重设，不是利率重设。
  s2_zh_hk: 今日清還嘅費用仍然係三千。呢個係費用重設，唔係利率重設。
  s3_en: >-
    Waiting still requires the next 1,000 dollars of interest. Everything else, including the 0.2 percent
    return, is unchanged.
  s3_zh: 等到第三十日，仍然要付下一期一千港元利息。其他条件，包括百分之零点二的回报，都不变。
  s3_zh_hk: 等到第三十日，仍然要俾下一期一千港元利息。其他條件，包括百分之零點二嘅回報，都冇變。
