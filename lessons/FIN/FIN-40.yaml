  title_en: Is anyone richer?
  title_zh: 有人更富有吗？
  title_zh_hk: 有人更富有嗎？
  en: >-
    At 10 dollars a share, calculate the dividend per share, shares cancelled, remaining shares and value
    per share under each route. Does either make Asha, or all original shareholders, richer? Pause and
    vote.
  zh: 按每股十港元，算出每股股息、注销的股数、剩下的股数，以及两种方式下每股的价值。哪一种能让Asha或者全体原有股东更富有？请暂停，投个票。
  zh_hk: 按每股十港元，計出每股股息、註銷嘅股數、剩低嘅股數，同兩種方式之下每股嘅價值。邊種可以令Asha或者全部原有股東更富有？暫停，投個票。
