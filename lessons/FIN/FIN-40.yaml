  title_en: The same payout. The same value for whom?
  title_zh: 同样的分配。对谁的价值一样？
  title_zh_hk: 同樣的分派。對誰的價值一樣？
  image: art/same-payout-different-shareholders-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A cash dividend and a share repurchase both move cash from a company to its shareholders. Neither
    automatically creates operating value. The payout form changes who receives cash and how many shares
    remain, and paying above fair value can shift wealth between shareholders. Now you advise a fictional
    Hong Kong company.
  zh: >-
    现金股息和股份回购，都是把公司的现金交给股东，两者都不会自动创造经营价值。分配方式改变的，是谁拿到现金、还剩多少股份；如果回购价高于公允价值，还会把财富从一部分股东转给另一部分股东。现在，你要为香港一家虚构的公司出主意。
  zh_hk: >-
    現金股息同股份回購，都係將公司嘅現金交俾股東，兩樣都唔會自動創造經營價值。分派方式改變嘅，係邊個攞到現金、仲剩幾多股；如果回購價高過公允價值，仲會將財富由一部分股東轉去另一部分股東。而家，你要幫香港一間虛構嘅公司出主意。
