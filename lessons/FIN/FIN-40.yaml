  c31_zh_hk: 1,200 股
  c32_en: Never sells
  c32_zh: 始终不卖
  c32_zh_hk: 始終不賣
  footer_en: >-
    D: dividend · R: buy back at HK$10
  footer_zh: D：股息 · R：按 HK$10 回购
  footer_zh_hk: D：股息 · R：按 HK$10 回購
  s1_en: >-
    The company has 120,000 shares and no debt. Its equity is worth 1,200,000 dollars: 960,000 of operating
    value plus 240,000 of surplus cash. So each share is worth 10 dollars.
  s1_zh: 这家公司有十二万股，没有负债。股权价值一百二十万港元：九十六万是经营价值，二十四万是富余现金。所以每股值十港元。
  s1_zh_hk: 呢間公司有十二萬股，冇負債。股權價值一百二十萬港元：九十六萬係經營價值，二十四萬係多出嚟嘅現金。所以每股值十港元。
  s2_en: >-
    Option D pays all 240,000 as an equal cash dividend. Option R uses exactly 240,000 to buy back and
    cancel shares at 10 dollars each. Operations are unchanged either way.
  s2_zh: D方案把二十四万全部作为现金股息，平均派给所有股份。R方案正好用二十四万，按每股十港元回购并注销股份。两种方案下，经营都不变。
  s2_zh_hk: D方案將二十四萬全部當現金股息，平均派俾所有股份。R方案啱啱用二十四萬，按每股十港元回購同註銷股份。兩個方案之下，經營都唔變。
  s3_en: >-
    Shareholder Asha owns 1,200 shares and never sells. Compare her cash plus remaining share value, and
    the combined wealth of all the original shareholders. There are no taxes or costs.
  s3_zh: 股东Asha持有一千二百股，始终不卖。请比较她拿到的现金加上剩余股份的价值，以及全体原有股东的财富总和。不考虑税和交易成本。
  s3_zh_hk: 股東Asha持有一千二百股，一直唔賣。請比較佢攞到嘅現金加剩低股份嘅價值，同埋所有原有股東嘅財富總和。唔計稅同交易成本。
