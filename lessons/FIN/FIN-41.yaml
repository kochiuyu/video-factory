  s1_en: >-
    A traded note pays 100 in either state and costs 95. A traded fund pays 80 if the index falls and
    120 if it rises, and costs 92. Both can be bought or sold short in fractions.
  s1_zh: >-
    已交易的票据，两种状态都支付一百，现价九十五。已交易的基金，指数下跌时支付八十，上升时支付一百二十，现价九十二。两者都可以按分数单位买入或卖空。
  s1_zh_hk: >-
    已交易嘅票據，兩種狀態都支付一百，現價九十五。已交易嘅基金，指數跌就支付八十，升就支付一百二十，現價九十二。兩樣都可以按分數單位買入或者沽空。
  s2_en: >-
    Down pays 50 if the index falls and costs 25. Up pays 50 if the index rises and costs 23. The foundation
    can buy at most one.
  s2_zh: Down合约在指数下跌时支付五十，价格二十五。Up合约在指数上升时支付五十，价格二十三。基金会最多只能买其中一份。
  s2_zh_hk: Down合約喺指數跌嘅時候支付五十，價錢二十五。Up合約喺指數升嘅時候支付五十，價錢二十三。基金會最多只可以買其中一份。
  s3_en: >-
    Both states are equally likely in the forecast. The goal is to meet the scholarship in the bad state,
    and to see which offer is cheap against its benchmark.
  s3_zh: 在预测里，两种状态的可能性相同。目标是在不利状态下付得出奖学金，同时看清哪一份报价相对基准更便宜。
  s3_zh_hk: 喺預測入面，兩種狀態嘅機會一樣。目標係喺唔利嘅狀態下都俾得出獎學金，同時睇清楚邊份報價對比基準比較平。
