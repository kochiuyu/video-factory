  zh: Down和Up的基准价格相同吗？为了这笔奖学金，你会建议哪一份？请暂停，投个票。
  zh_hk: Down同Up嘅基準價格一樣嗎？為咗呢筆獎學金，你會建議邊一份？暫停，投個票。
