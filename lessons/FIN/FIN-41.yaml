  kicker_zh_hk: 第二輪
  title_en: A gap when the index rises
  title_zh: 指数上升也有缺口
  title_zh_hk: 指數上升也有缺口
  step1_en: Own portfolio can miss HK$50 too
  step1_zh: 自身组合也可能缺 HK$50
  step1_zh_hk: 自身組合也可能缺 HK$50
  step2_en: Contracts still track the index only
  step2_zh: 合约仍只看指数
  step2_zh_hk: 合約仍只看指數
  step3_en: Both may be bought; safe note available
  step3_zh: 可两份都买；有安全票据
  step3_zh_hk: 可兩份都買；有安全票據
  s1_en: >-
    Before signing, the forecast turns out too strong. The foundation can also be fifty dollars short
    when the index rises, for example if a large holding moves away from the index.
  s1_zh: 签约之前，发现预测太乐观了。指数上升时，基金会也可能差五十港元，比如某一大笔持仓走势偏离了指数。
  s1_zh_hk: 簽約之前，發現預測太樂觀。指數升嘅時候，基金會都可能差五十蚊，例如有一大筆持倉嘅走勢同指數唔同。
  s2_en: >-
    The contracts and benchmark securities still pay only according to the two index states.
  s2_zh: 合约和基准证券的支付，仍然只取决于两种指数状态。
  s2_zh_hk: 合約同基準證券嘅支付，仍然只係睇兩種指數狀態。
  s3_en: >-
    Now both contracts may be bought at their original prices, and a safe note is available at its benchmark
    price.
  s3_zh: 现在两份合约可以按原价一起买，也可以按基准价格买安全票据。
  s3_zh_hk: 而家兩份合約可以按原價一齊買，亦可以按基準價格買安全票據。
