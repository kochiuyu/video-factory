  en: >-
    Weekly Hang Seng Index options began trading in 2019, giving markets a short-dated way to manage exposure.
    Here, two fictional contracts pay a fixed amount in one of two index states. You advise a fictional
    Hong Kong foundation that is fifty dollars short of a scholarship payment if the index falls.
  zh: >-
    恒生指数每周期权在二零一九年开始交易，让市场可以用短期合约管理风险。这里有两份虚构的合约，分别在两种指数状态之一支付固定金额。你要为香港一家虚构的基金会出主意：如果指数下跌，它付奖学金还差五十港元。
  zh_hk: >-
    恒生指數每週期權喺二零一九年開始交易，等市場可以用短期合約管理風險。呢度有兩份虛構嘅合約，分別喺兩種指數狀態其中一種支付固定金額。你要幫香港一間虛構嘅基金會出主意：如果指數跌，佢俾獎學金仲差五十蚊。
