- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Price each state by benchmark
  title_zh: 用基准为每种状态定价
  title_zh_hk: 用基準為每種狀態定價
  step1_en: 1.5 notes − 1.25 funds = 27.50
  step1_zh: 1.5 份票据 − 1.25 份基金 = 27.50
  step1_zh_hk: 1.5 份票據 − 1.25 份基金 = 27.50
  step2_en: >-
    Up state: 47.50 − 27.50 = 20
  step2_zh: 上升状态：47.50 − 27.50 = 20
  step2_zh_hk: 上升狀態：47.50 − 27.50 = 20
  step3_en: Down cheap at 25 · Up dear at 23
  step3_zh: Down 25 偏便宜 · Up 23 偏贵
  step3_zh_hk: Down 25 偏便宜 · Up 23 偏貴
  s1_en: >-
    Buy one and a half notes and short one and a quarter funds. That pays fifty if the index falls and
    zero if it rises, and costs twenty-seven fifty.
  s1_zh: 买入一点五份票据，卖空一点二五份基金。指数下跌时支付五十，上升时支付零，成本是二十七点五。
  s1_zh_hk: 買入一點五份票據，沽空一點二五份基金。指數跌就支付五十，升就支付零，成本係二十七點五。
  s2_en: >-
    Half a note pays fifty in both states and costs forty-seven fifty. Subtract the down-state portfolio,
    and the up-state payout is worth twenty.
  s2_zh: 半份票据在两种状态都支付五十，成本四十七点五。减去下跌状态的组合，上升状态的支付就值二十。
  s2_zh_hk: 半份票據兩種狀態都支付五十，成本四十七點五。減走下跌狀態嗰個組合，上升狀態嘅支付就值二十。
  s3_en: >-
    So the prices differ. Down at twenty-five is cheap against twenty-seven fifty; Up at twenty-three
    is dear against twenty. Both have an expected value of twenty-five, but that is not the benchmark
    price.
  s3_zh: 所以两者价格不同。Down卖二十五，比基准二十七点五便宜；Up卖二十三，比基准二十贵。两份的期望值都是二十五，但期望值不是基准价格。
  s3_zh_hk: 所以兩份價格唔同。Down賣二十五，比基準二十七點五平；Up賣二十三，比基準二十貴。兩份嘅期望值都係二十五，但期望值唔係基準價格。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Hedge what actually falls short
  title_zh: 对冲真正的缺口
  title_zh_hk: 對沖真正的缺口
  step1_en: >-
    Round 1: Down fits the shortfall
  step1_zh: 第一轮：Down 对应缺口
  step1_zh_hk: 第一輪：Down 對應缺口
  step2_en: >-
    Down + Up: certain 50 for 48
  step2_zh: Down + Up：48 换确定的 50
  step2_zh_hk: Down + Up：48 換確定的 50
  step3_en: >-
    Half a safe note: 50 for 47.50
  step3_zh: 半份安全票据：47.50 换 50
  step3_zh_hk: 半份安全票據：47.50 換 50
  s1_en: >-
    In the first round, Down is both cheap and pays exactly when the shortfall occurs. The recommendation
    follows the objective, not a view on the index.
  s1_zh: 第一轮里，Down既便宜，又正好在出现缺口时支付。这个建议跟随的是目标，而不是对指数走势的判断。
  s1_zh_hk: 第一輪入面，Down又平，又啱啱喺出現缺口嘅時候支付。呢個建議跟嘅係目標，唔係對指數走勢嘅判斷。
  s2_en: >-
    Once the foundation can also fall short when the index rises, Down alone pays nothing then. Buying
    both contracts gives fifty in every state for forty-eight.
  s2_zh: 一旦指数上升时基金会也可能有缺口，单靠Down，那时就一分钱都拿不到。两份合约都买，每种状态都有五十，花费四十八。
  s2_zh_hk: 一旦指數升嘅時候基金會都可能有缺口，淨係靠Down，嗰陣就一蚊都收唔到。兩份合約都買，每種狀態都有五十，使四十八。
  s3_en: >-
    Half a safe note delivers the same certain fifty for forty-seven fifty, so it is the cheaper way to
    get certain cash.
  s3_zh: 半份安全票据同样确定给出五十，只要四十七点五，所以它是更便宜的确定现金办法。
  s3_zh_hk: 半份安全票據一樣一定俾到五十，只要四十七點五，所以佢係平啲嘅確定現金辦法。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Match the hedge to the gap
  title_zh: 对冲要对准缺口
  title_zh_hk: 對沖要對準缺口
  en: >-
    Index contracts cannot tell apart two outcomes with the same index state but different shortfalls.
    The safe note covers both, by paying even when the cash is not needed.
  zh: 指数合约分不清指数状态相同、但缺口不同的两种结果。安全票据之所以能覆盖两者，是因为不管怎样都会支付，包括不需要这笔现金的时候。
  zh_hk: 指數合約分唔到指數狀態一樣、但缺口唔同嘅兩種結果。安全票據之所以覆蓋到兩者，係因為無論點都會支付，包括唔需要呢筆現金嘅時候。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Replicate prices; hedge the gap
  title_zh: 用复制定价，对准缺口对冲
  title_zh_hk: 用複製定價，對準缺口對沖
  q1_en: Compare offers with benchmark prices
  q1_zh: 用基准价格比较报价
  q1_zh_hk: 用基準價格比較報價
  q2_en: Check which risk the hedge tracks
  q2_zh: 看清对冲跟的是哪种风险
  q2_zh_hk: 看清對沖跟的是哪種風險
  s1_en: >-
    Expected value is not a price. Replicate the payout with traded securities, and check that the hedge
    pays when your own shortfall happens.
  s1_zh: 期望值不是价格。用已交易的证券复制支付，再确认对冲会在你自己出现缺口时支付。
  s1_zh_hk: 期望值唔係價格。用已交易嘅證券複製支付，再確認對沖會喺你自己出現缺口嘅時候支付。
  s2_en: This is a simplified two-state model, not a trading recommendation.
  s2_zh: 这是简化的两状态模型，不是交易建议。
  s2_zh_hk: 呢個係簡化嘅兩狀態模型，唔係交易建議。
  s3_en: >-
    The foundation, contracts and prices are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 基金会、合约和价格都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 基金會、合約同價格都係虛構嘅。官方場景圖只係教學插圖。
