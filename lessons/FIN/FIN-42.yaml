  title_en: A buy order. A higher quote?
  title_zh: 一笔买单。报价反而更高？
  title_zh_hk: 一筆買單。報價反而更高？
  image: art/a-buy-order-a-higher-quote-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In 2020 HKEX introduced new market-making requirements and smaller tick sizes to improve ETF liquidity.
    Real spreads reflect many factors. This fictional dealing desk isolates one: what an incoming order
    says about the value of what is being traded.
  zh: >-
    二零二零年，香港交易所为了改善ETF的流动性，推出新的做市要求，并缩小了最小价格变动单位。现实中的买卖价差受很多因素影响。这个虚构的交易台只看其中一个：一笔进来的订单，透露了多少关于资产价值的信息。
  zh_hk: >-
    二零二零年，香港交易所為咗改善ETF嘅流動性，推出新嘅莊家要求，又收窄咗最小價格變動單位。現實嘅買賣差價受好多因素影響。呢個虛構嘅交易枱只睇其中一個：一張入嚟嘅買賣盤，透露咗幾多關於資產價值嘅資訊。
