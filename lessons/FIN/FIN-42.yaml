  title_en: What bid and ask?
  title_zh: 怎样定买卖报价？
  title_zh_hk: 怎樣定買賣報價？
  en: >-
    Before you know the order's direction, what bid and ask should the desk post? And why is one single
    price not enough? Pause and vote.
  zh: 在知道订单方向之前，交易台应该挂出什么买入价和卖出价？为什么只报一个价格不够？请暂停，投个票。
  zh_hk: 喺知道買賣方向之前，交易枱應該掛出咩買入價同賣出價？點解淨係報一個價唔夠？暫停，投個票。
