  s1_en: >-
    You quote one unit of a simple fund. At today's close it will be worth either 120 or 80 dollars, and
    your desk gives the higher value a 40 percent chance.
  s1_zh: 你要为一只简单基金的一个单位报价。今天收盘时，它的价值要么是一百二十港元，要么是八十港元；交易台认为较高价值的机会是百分之四十。
  s1_zh_hk: 你要為一隻簡單基金嘅一個單位報價。今日收市嗰陣，佢嘅價值唔係一百二十蚊，就係八十蚊；交易枱認為較高價值嘅機會係百分之四十。
  s2_en: >-
    One market order arrives. It buys at your ask or sells at your bid. If the value will be high, a buy
    is 80 percent likely; if low, only 30 percent.
  s2_zh: 接下来会有一笔市价单。对方要么按你的卖出价买入，要么按你的买入价卖出。如果价值会高，买入的可能性是百分之八十；如果价值会低，只有百分之三十。
  s2_zh_hk: 跟住會有一張市價盤。對方唔係按你嘅賣出價買入，就係按你嘅買入價賣出。如果價值會高，買入嘅機會係百分之八十；如果價值會低，就只有百分之三十。
  s3_en: >-
    Set each price so that you break even on average if a trade happens on that side. There are no fees,
    inventory concerns or other information.
  s3_zh: 每个价格都要定成：一旦在那一侧成交，你平均刚好不赚不赔。没有费用，不考虑存货，也没有其他信息。
  s3_zh_hk: 每個價都要定到：一旦喺嗰邊成交，你平均啱啱好唔賺唔蝕。冇費用，唔考慮存貨，亦冇其他資料。
