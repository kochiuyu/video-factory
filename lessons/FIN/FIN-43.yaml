  kicker_zh_hk: 含意
  title_en: Late cash brings back the draw
  title_zh: 款项迟到，又要提取
  title_zh_hk: 款項遲到，又要提取
  step1_en: >-
    By 5 pm: 18,810 → 38,810 total
  step1_zh: 下午 5 时前：18,810 → 共 38,810
  step1_zh_hk: 下午 5 時前：18,810 → 共 38,810
  step2_en: Draw 1,190 still costs 800
  step2_zh: 提取 1,190 仍收 800
  step2_zh_hk: 提取 1,190 仍收 800
  step3_en: QR 2,650 vs cards 2,000
  step3_zh: 二维码 2,650 对 银行卡 2,000
  step3_zh_hk: 二維碼 2,650 對 銀行卡 2,000
  s1_en: >-
    By payroll only 19,000 of QR sales have credited. After the fee that is 18,810, so the shop has 38,810.
  s1_zh: 到发工资时，只有一万九千的二维码销售入账，扣费后是一万八千八百一十，店里一共有三万八千八百一十。
  s1_zh_hk: 到出糧嗰陣，得一萬九千嘅二維碼銷售入咗賬，扣費之後係一萬八千八百一十，舖頭總共有三萬八千八百一十。
  s2_en: It must draw 1,190, and any draw triggers the whole 800 dollar charge.
  s2_zh: 它必须提取一千一百九十，而只要提取，就要付足八百港元。
  s2_zh_hk: 佢要提取一千一百九十，而只要提取，就要俾足八百蚊。
  s3_en: >-
    The QR route now costs 2,650 against 2,000 for cards with the bridge. Choose cards this weekend, saving
    650.
  s3_zh: 这样二维码路径成本是二千六百五十，银行卡加过渡融资是两千。这个周末应选银行卡，省下六百五十。
  s3_zh_hk: 咁二維碼路線成本係二千六百五十，信用卡加過渡融資係兩千。呢個週末應該揀信用卡，慳六百五十。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Money counts when usable
  title_zh: 能用的钱才算数
  title_zh_hk: 能用的錢才算數
  en: >-
    A later credit does not close a 5 pm payroll gap or avoid the draw fee. Compare the fees and the cash
    timing separately, and count money only when it reaches the spendable balance.
  zh: 晚到的款项，补不上下午五点的工资缺口，也免不了提取费。费用和现金到账时间要分开比较，钱只有进了可动用的余额才算数。
  zh_hk: 遲到嘅款項，補唔到下晝五點出糧嘅缺口，亦免唔到提取費。費用同現金到賬時間要分開比較，錢一定要入咗可以用嘅結餘先計數。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Approval is not cash in the bank
  title_zh: 批准不等于钱已到账
  title_zh_hk: 批核不等於錢已到賬
  q1_en: Compare total fees for the weekend
  q1_zh: 比较整个周末的总费用
  q1_zh_hk: 比較整個週末的總費用
  q2_en: Check what is usable by the deadline
  q2_zh: 核对截止前能用多少钱
  q2_zh_hk: 核對截止前能用多少錢
  s1_en: >-
    A cheaper payment rail helps only if the money arrives before the bill is due. Fixed fees, such as
    a bridge charge, can reverse the ranking.
  s1_zh: 更便宜的收款渠道，只有在账单到期前把钱送到，才帮得上忙。像过渡融资这样的固定费用，可能会让排名反过来。
  s1_zh_hk: 平啲嘅收款渠道，要喺賬單到期之前將錢送到先幫到手。好似過渡融資咁嘅固定費用，可能會令排名調轉。
  s2_en: >-
    This is a classroom exercise, not a description of any real payment link's settlement terms.
  s2_zh: 这是课堂练习，不是对任何真实支付互联结算条款的描述。
  s2_zh_hk: 呢個係課堂練習，唔係描述任何真實支付互聯嘅結算條款。
  s3_en: >-
    The shop, contracts and fees are fictional. Official scene art is a teaching illustration only.
  s3_zh: 商店、合同和费用都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 商店、合約同費用都係虛構嘅。官方場景圖只係教學插圖。
