  s1_en: >-
    The shop must pay 40,000 dollars of payroll from its bank account by 5 pm on Saturday. It starts the
    day with 20,000.
  s1_zh: 这家店星期六下午五点前，要从银行账户发出四万港元工资。当天一开始，账上只有两万。
  s1_zh_hk: 呢間舖頭星期六下晝五點前，要由銀行戶口出四萬蚊糧。當日一開始，戶口得兩萬。
  s2_en: >-
    It expects 60,000 of sales. Up to 25,000 can move from cards to an instant bank QR channel. Cards
    cost 2 percent and pay out on Tuesday. QR costs 1 percent and is usable once credited, plus a 900
    dollar setup fee.
  s2_zh: >-
    预计销售六万港元，其中最多两万五千可以从银行卡改走即时的银行二维码。银行卡收费百分之二，星期二才到账。二维码收费百分之一，入账就能用，但要另付九百港元开通费。
  s2_zh_hk: >-
    預計銷售六萬蚊，其中最多兩萬五千可以由信用卡轉用即時嘅銀行二維碼。信用卡收百分之二，星期二先到賬。二維碼收百分之一，入咗賬就用得，但要另外俾九百蚊開通費。
  s3_en: >-
    A bridge of up to 20,000 can be drawn before payroll. Any draw at all costs 800 dollars. Money counts
    only when it reaches the spendable bank balance.
  s3_zh: 发工资前，可以动用最多两万港元的过渡融资。只要提取，不论多少，都收八百港元。钱只有进了可动用的银行余额，才算数。
  s3_zh_hk: 出糧之前，可以動用最多兩萬蚊嘅過渡融資。只要提取，唔理幾多，都收八百蚊。錢一定要入咗可以用嘅銀行結餘，先計數。
