  step1_zh_hk: 下午 5 時仍有 HK$6,000 未到
  step2_en: It credits that evening, same 1%
  step2_zh: 当晚入账，费用仍是 1%
  step2_zh_hk: 當晚入賬，費用仍是 1%
  step3_en: Everything else unchanged
  step3_zh: 其他条件不变
  step3_zh_hk: 其他條件不變
  s1_en: >-
    Before committing, you learn that 6,000 of the 25,000 QR sales would still be pending at 5 pm under
    the shop's provider arrangement.
  s1_zh: 决定之前，你得知按这家店和服务商的安排，两万五千的二维码销售里，有六千到下午五点还在等待确认。
  s1_zh_hk: 決定之前，你知道按呢間舖同服務商嘅安排，兩萬五千嘅二維碼銷售入面，有六千到下晝五點仲等緊確認。
  s2_en: >-
    That 6,000 credits later the same evening, at the same 1 percent fee. The full amount arrives; the
    question is whether it arrives in time.
  s2_zh: 这六千当晚稍后入账，费用同样是百分之一。钱最终都会到，问题是能不能赶在截止前到。
  s2_zh_hk: 呢六千當晚遲啲入賬，費用一樣係百分之一。錢最後都會到，問題係趕唔趕得切。
  s3_en: All the other assumptions and choices stay the same.
  s3_zh: 其余假设和选择都不变。
  s3_zh_hk: 其他假設同選擇都唔變。
