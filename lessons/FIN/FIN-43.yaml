  title_zh_hk: 只用銀行卡，還是加二維碼？
  en: >-
    If all 25,000 of QR sales credit before payroll, which route should the shop choose this weekend,
    and what is its fee advantage? Pause and vote.
  zh: 如果两万五千的二维码销售，全部在发工资前入账，这个周末应该选哪条路径？费用上能省多少？请暂停，投个票。
  zh_hk: 如果兩萬五千嘅二維碼銷售，全部喺出糧之前入賬，呢個週末應該揀邊條路？費用上慳到幾多？暫停，投個票。
