  title_en: The customer paid. Can we make payroll?
  title_zh: 顾客付了款。工资发得出吗？
  title_zh_hk: 顧客付了款。出得起糧嗎？
  image: art/customer-paid-can-we-make-payroll-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In December 2023, Hong Kong and Thailand linked FPS and PromptPay, so travellers can pay by scanning
    a merchant's QR code, and merchants can receive funds immediately. A card approval, by contrast, is
    not yet money in the bank. You advise a fictional gift shop in Tsim Sha Tsui.
  zh: >-
    二零二三年十二月，香港的转数快和泰国的PromptPay实现互联，旅客扫描商户的二维码就能付款，商户可以即时收到款项。相比之下，银行卡交易获批，并不等于钱已经进了银行账户。你要为尖沙咀一家虚构的礼品店出主意。
  zh_hk: >-
    二零二三年十二月，香港嘅轉數快同泰國嘅PromptPay互聯，旅客掃商戶嘅二維碼就可以俾錢，商戶可以即時收到款項。相反，信用卡交易批核咗，唔等於錢已經入咗銀行戶口。你要幫尖沙咀一間虛構嘅禮品店出主意。
