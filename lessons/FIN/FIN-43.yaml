- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: When all QR cash arrives in time
  title_zh: 二维码款项全部准时到
  title_zh_hk: 二維碼款項全部準時到
  step1_en: >-
    Cards: 1,200 + bridge 800 = 2,000
  step1_zh: 银行卡：1,200 + 过渡 800 = 2,000
  step1_zh_hk: 銀行卡：1,200 + 過渡 800 = 2,000
  step2_en: >-
    QR: 24,750 arrives; no bridge
  step2_zh: 二维码：到账 24,750，不用过渡
  step2_zh_hk: 二維碼：到賬 24,750，不用過渡
  step3_en: 700 + 250 + 900 = 1,850; saves 150
  step3_zh: 700 + 250 + 900 = 1,850；省 150
  step3_zh_hk: 700 + 250 + 900 = 1,850；省 150
  s1_en: >-
    Cards can approve 60,000 of sales but add nothing to Saturday's bank cash. The shop is 20,000 short,
    so it must draw the bridge. Cost: 1,200 in card fees plus 800, or 2,000.
  s1_zh: 银行卡可以批准六万的销售，却不会让星期六的银行现金多一分。店里差两万，只能提取过渡融资。成本是一千二百的刷卡费，加八百，共两千。
  s1_zh_hk: 信用卡可以批核六萬嘅銷售，但星期六銀行嘅現金一蚊都唔會多。舖頭差兩萬，一定要提取過渡融資。成本係一千二百嘅碌卡費，加八百，總共兩千。
  s2_en: >-
    With QR, 25,000 less 1 percent is 24,750 of Saturday cash. With the 20,000 already there, payroll
    is covered with 4,750 to spare. No bridge fee.
  s2_zh: 加上二维码，两万五千扣掉百分之一，就是星期六到账的两万四千七百五十。加上原有的两万，足够发工资，还多出四千七百五十，不用付过渡融资费。
  s2_zh_hk: 加埋二維碼，兩萬五千扣咗百分之一，就係星期六到賬嘅兩萬四千七百五十。加埋原本嘅兩萬，夠出糧，仲多四千七百五十，唔使俾過渡融資費。
  s3_en: >-
    Fees are 700 on the remaining cards, 250 on QR and the 900 setup: 1,850. That is 150 cheaper than
    cards with the bridge.
  s3_zh: 费用是剩下银行卡的七百，二维码的二百五十，加九百开通费，共一千八百五十，比银行卡加过渡融资便宜一百五十。
  s3_zh_hk: 費用係其餘信用卡嘅七百，二維碼嘅二百五十，加九百開通費，總共一千八百五十，比信用卡加過渡融資平一百五十。
