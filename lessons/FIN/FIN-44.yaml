  s1_en: >-
    A manager says that while the currency stays inside its band, the 68,000 dollar interest reserve cannot
    come up short.
  s1_zh: 一位经理说，只要汇率还在区间里，那笔六万八千港元的利息储备就不可能不够。
  s1_zh_hk: 有個經理話，只要匯率仲喺區間入面，嗰筆六萬八千蚊嘅利息儲備就冇可能唔夠。
  s2_en: >-
    Loan A is 6 million. It resets today at a 2 percent HIBOR fixing plus 1 point, and again on day 30.
    The forecast for that next fixing is 4 percent.
  s2_zh: A贷款六百万。今天按百分之二的HIBOR定价，加一个百分点重设，第三十天再重设一次。对下一次定价的预测是百分之四。
  s2_zh_hk: A貸款六百萬。今日按百分之二嘅HIBOR定價，加一個百分點重設，第三十日再重設一次。對下一次定價嘅預測係百分之四。
  s3_en: >-
    Loan B is 4 million at 3.5 percent all-in, with no reset before day 60. Interest is paid on day 60.
    Up to 8,000 extra can be requested, but only by day 40.
  s3_zh: B贷款四百万，全包利率百分之三点五，第六十天之前不重设。两笔利息都在第六十天支付。最多可以申请补充八千港元，但必须在第四十天前提出。
  s3_zh_hk: B貸款四百萬，全包利率百分之三點五，第六十日之前唔重設。兩筆利息都喺第六十日俾。最多可以申請補多八千蚊，但一定要喺第四十日之前提出。
