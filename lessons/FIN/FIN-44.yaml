  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Find the exposed cash flow
  title_zh: 找出受影响的现金流
  title_zh_hk: 找出受影響的現金流
  step1_en: >-
    Only A's second month reprices: 7%
  step1_zh: 只有 A 第二个月重新定价：7%
  step1_zh_hk: 只有 A 第二個月重新定價：7%
  step2_en: 25,000 → 35,000 · total 73,333.33
  step2_zh: 25,000 → 35,000 · 合计 73,333.33
  step2_zh_hk: 25,000 → 35,000 · 合計 73,333.33
  step3_en: Request HK$5,334 by day 40
  step3_zh: 第 40 天前申请 HK$5,334
  step3_zh_hk: 第 40 天前申請 HK$5,334
  s1_en: >-
    At 6 percent HIBOR, only A's second month reprices, to 7 percent. It costs 35,000 instead of 25,000.
  s1_zh: HIBOR到百分之六时，只有A的第二个月重新定价，变成百分之七，利息从两万五千变成三万五千。
  s1_zh_hk: HIBOR去到百分之六，淨係A嘅第二個月重新定價，變成百分之七，利息由兩萬五千變三萬五千。
  s2_en: >-
    Total interest becomes about 73,333.33, so the reserve is short by about 5,333.33.
  s2_zh: 利息总额变成大约七万三千三百三十三点三三，储备大约差五千三百三十三点三三。
  s2_zh_hk: 利息總額變成大約七萬三千三百三十三點三三，儲備大約差五千三百三十三點三三。
  s3_en: >-
    Request at least 5,334 dollars, rounded up, by day 40. It fits under the 8,000 cap. Waiting until
    payment day would miss the window.
  s3_zh: 在第四十天前，至少申请五千三百三十四港元，向上取整，在八千的上限之内。等到付款日才申请，就错过了窗口。
  s3_zh_hk: 喺第四十日之前，最少申請五千三百三十四蚊，向上取整，喺八千嘅上限之內。等到俾錢嗰日先申請，就錯過咗窗口。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: The band does not fix your rate
  title_zh: 汇率区间锁不住利率
  title_zh_hk: 匯率區間鎖不住利率
  en: >-
    The peg can hold while local funding rates rise. Your loan feels that change only where and when its
    contract allows a new fixing.
  zh: 联系汇率守得住的同时，本地融资利率仍然可以上升。你的贷款只会在合同允许重新定价的地方和时间，受到这种变化影响。
  zh_hk: 聯繫匯率守得住嘅同時，本地融資利率仍然可以上升。你嘅貸款只會喺合約容許重新定價嘅地方同時間，先受呢個變化影響。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Map each reset to its cash flow
  title_zh: 把每次重设对应到现金流
  title_zh_hk: 把每次重設對應到現金流
  q1_en: Find the break-even fixing
  q1_zh: 找出临界的定价
  q1_zh_hk: 找出臨界的定價
  q2_en: Ask for funding before the deadline
  q2_zh: 在期限前申请资金
  q2_zh_hk: 在期限前申請資金
  s1_en: >-
    A stable exchange rate is not a stable interest rate. Reprice only the periods that reset, and request
    any top-up while the window is open.
  s1_zh: 汇率稳定，不等于利率稳定。只为会重设的那几期重新定价，并在窗口关闭前申请补充。
  s1_zh_hk: 匯率穩定，唔等於利率穩定。淨係為會重設嗰幾期重新定價，仲要喺窗口關之前申請補錢。
  s2_en: >-
    This is a classroom scenario, not a forecast of HIBOR or of any intervention.
  s2_zh: 这是课堂情景，不是对HIBOR或任何干预的预测。
  s2_zh_hk: 呢個係課堂情景，唔係對HIBOR或者任何干預嘅預測。
  s3_en: >-
    The business, loans and rates are fictional. Official scene art is a teaching illustration only.
  s3_zh: 企业、贷款和利率都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 企業、貸款同利率都係虛構嘅。官方場景圖只係教學插圖。
