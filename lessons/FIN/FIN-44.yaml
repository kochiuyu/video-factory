  s1_en: >-
    In a fictional tighter funding scenario, the day-30 fixing comes in at 6 percent, not 4.
  s1_zh: 在一个虚构的资金收紧情景里，第三十天的定价是百分之六，不是百分之四。
  s1_zh_hk: 喺一個虛構嘅資金收緊情景入面，第三十日嘅定價係百分之六，唔係百分之四。
  s2_en: >-
    The first month's interest on A is already locked, and loan B's contract is unchanged.
  s2_zh: A贷款第一个月的利息已经锁定，B贷款的合同也没有变。
  s2_zh_hk: A貸款第一個月嘅利息已經鎖定，B貸款嘅合約亦冇變。
  s3_en: >-
    You can still request a top-up until day 40. Interest is still paid on day 60.
  s3_zh: 到第四十天之前，仍然可以申请补充。利息仍在第六十天支付。
  s3_zh_hk: 第四十日之前，仍然可以申請補錢。利息仍然喺第六十日俾。
