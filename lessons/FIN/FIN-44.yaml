  en: >-
    On 26 June 2025 the weak-side undertaking was triggered, and the HKMA bought 9.42 billion Hong Kong
    dollars from banks. A smaller Aggregate Balance can push up local funding rates, but it does not mechanically
    reset every loan. You are treasurer of a fictional Kowloon East furniture maker.
  zh: >-
    二零二五年六月二十六日，弱方兑换保证被触发，香港金融管理局向银行买入九十四点二亿港元。总结余减少，可能推高本地融资利率，但不会自动重设每一笔贷款。你是九龙东一家虚构家具厂的司库。
  zh_hk: >-
    二零二五年六月二十六號，弱方兌換保證被觸發，金管局向銀行買入九十四點二億港元。總結餘減少，可能推高本地融資利率，但唔會自動重設每一筆貸款。你係九龍東一間虛構傢俬廠嘅司庫。
