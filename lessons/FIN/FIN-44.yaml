  step1_en: >-
    A: 15,000 + 25,000 = 40,000
  step1_zh: A：15,000 + 25,000 = 40,000
  step1_zh_hk: A：15,000 + 25,000 = 40,000
  step2_en: >-
    B: 23,333.33 · total 63,333.33
  step2_zh: B：23,333.33 · 合计 63,333.33
  step2_zh_hk: B：23,333.33 · 合計 63,333.33
  step3_en: Reserve holds up to HIBOR 4.9333%
  step3_zh: HIBOR 不超过 4.9333% 都够
  step3_zh_hk: HIBOR 不超過 4.9333% 都夠
  s1_en: >-
    Loan A costs 3 percent for the first month, 15,000, and 5 percent for the second, 25,000. That is
    40,000.
  s1_zh: A贷款第一个月按百分之三计，一万五千；第二个月按百分之五计，两万五千，合计四万。
  s1_zh_hk: A貸款第一個月按百分之三計，一萬五千；第二個月按百分之五計，兩萬五千，加埋四萬。
  s2_en: >-
    Loan B adds 23,333.33 for two months, so the forecast is 63,333.33, leaving about 4,667 in the reserve.
  s2_zh: B贷款两个月是两万三千三百三十三点三三，所以预测总额是六万三千三百三十三点三三，储备还剩大约四千六百六十七。
  s2_zh_hk: B貸款兩個月係兩萬三千三百三十三點三三，所以預測總額係六萬三千三百三十三點三三，儲備仲剩大約四千六百六十七。
  s3_en: >-
    B and A's first month use 38,333.33, leaving 29,666.67 for A's second month. That allows a rate of
    5.9333 percent, so HIBOR can reach about 4.9333 percent.
  s3_zh: >-
    B加上A的第一个月，用掉三万八千三百三十三点三三，A的第二个月还剩两万九千六百六十六点六七可用。折合年利率百分之五点九三三三，所以HIBOR最高大约可以到百分之四点九三三三。
  s3_zh_hk: >-
    B加A嘅第一個月，用咗三萬八千三百三十三點三三，A嘅第二個月仲剩兩萬九千六百六十六點六七。折合年利率百分之五點九三三三，所以HIBOR最高大約去到百分之四點九三三三。
- id: meaning
  visual: steps
  layout: rows
