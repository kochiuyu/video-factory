  zh: 要持有多少股票、借多少钱，才能复制一份看涨期权？四点五的报价比这个成本高还是低？请暂停，投个票。
  zh_hk: 要持有幾多股票、借幾多錢，先可以複製一份認購期權？四點五嘅報價比呢個成本高定低？暫停，投個票。
