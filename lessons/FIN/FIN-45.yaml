  s1_en: >-
    A share costs 100 dollars today. Mei models two equally likely prices at expiry: 90 or 110. There
    are no dividends.
  s1_zh: 一股股票今天值一百港元。Mei假设到期时有两种可能性相同的价格：九十或者一百一十。股票不派息。
  s1_zh_hk: 一股股票今日值一百蚊。Mei假設到期有兩個機會一樣嘅價：九十或者一百一十。股票唔派息。
  s2_en: >-
    The call pays the amount by which the expiry price exceeds 105, and nothing below that. It can only
    be exercised at expiry. The quote is 4.50.
  s2_zh: 这份看涨期权，到期时支付股价高出行权价一百零五的部分，低于一百零五就什么都不付。只能到期行权。报价是四点五。
  s2_zh_hk: 呢份認購期權，到期支付股價高過行使價一百零五嘅部分，低過一百零五就乜都唔俾。只可以到期行使。報價係四點五。
  s3_en: >-
    Fractional shares are allowed, and borrowing or lending is at zero interest, with no fees. Replicate
    one call with shares and a loan chosen today.
  s3_zh: 可以持有零碎股，借款和放款都是零利率，没有费用。请用今天选定的股票和借款，复制一份看涨期权。
  s3_zh_hk: 可以持有碎股，借錢同借出都係零利率，冇費用。請用今日揀定嘅股票同借款，複製一份認購期權。
