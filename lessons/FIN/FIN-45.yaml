  title_en: Match the payoff difference
  title_zh: 对准支付的差额
  title_zh_hk: 對準支付的差額
  step1_en: >-
    Call +5 when stock +20: hold 0.25
  step1_zh: 股价差 20，期权差 5：持 0.25 股
  step1_zh_hk: 股價差 20，期權差 5：持 0.25 股
  step2_en: Borrow 22.50 · cost 25 − 22.50 = 2.50
  step2_zh: 借 22.50 · 成本 25 − 22.50 = 2.50
  step2_zh_hk: 借 22.50 · 成本 25 − 22.50 = 2.50
  step3_en: >-
    Quote 4.50 is 2 above: rich
  step3_zh: 报价 4.50 高出 2：偏贵
  step3_zh_hk: 報價 4.50 高出 2：偏貴
  s1_en: >-
    Between the two states the stock moves by 20 and the call by 5, so a quarter of a share matches the
    change.
  s1_zh: 两种状态之间，股价相差二十，期权支付相差五，所以持有四分之一股，就能对上这个差额。
  s1_zh_hk: 兩種狀態之間，股價差二十，期權支付差五，所以持有四分之一股，就對得上呢個差額。
  s2_en: >-
    A quarter share is worth 22.50 in the down state, so borrow 22.50 today. Then the portfolio pays zero
    or 5, exactly like the call.
  s2_zh: 四分之一股在下跌状态值二十二点五，所以今天借二十二点五。这样组合在两种状态下支付零或者五，和期权完全一样。
  s2_zh_hk: 四分之一股喺下跌狀態值二十二點五，所以今日借二十二點五。咁個組合喺兩種狀態支付零或者五，同期權一模一樣。
  s3_en: >-
    It costs 25 minus 22.50, or 2.50. The 4.50 quote is 2 dollars above that benchmark, so it is rich.
  s3_zh: 成本是二十五减二十二点五，等于二点五。四点五的报价比这个基准高两港元，所以偏贵。
  s3_zh_hk: 成本係二十五減二十二點五，等於二點五。四點五嘅報價比呢個基準高兩蚊，所以偏貴。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Wider outcomes flip the verdict
  title_zh: 结果更分散，结论反转
  title_zh_hk: 結果更分散，結論反轉
  step1_en: >-
    Call +15 when stock +40: hold 0.375
  step1_zh: 股价差 40，期权差 15：持 0.375 股
  step1_zh_hk: 股價差 40，期權差 15：持 0.375 股
  step2_en: Borrow 30 · cost 37.50 − 30 = 7.50
  step2_zh: 借 30 · 成本 37.50 − 30 = 7.50
  step2_zh_hk: 借 30 · 成本 37.50 − 30 = 7.50
  step3_en: >-
    Quote 4.50 is 3 below: cheap
  step3_zh: 报价 4.50 低 3：偏便宜
  step3_zh_hk: 報價 4.50 低 3：偏便宜
  s1_en: >-
    Now the call changes by 15 across a 40 dollar range, so hold 0.375 of a share.
  s1_zh: 现在股价相差四十，期权支付相差十五，所以要持有零点三七五股。
  s1_zh_hk: 而家股價差四十，期權支付差十五，所以要持有零點三七五股。
  s2_en: >-
    Borrow 30 to cancel the down-state value of 0.375 times 80. In the up state the stock pays 45, and
    15 after repaying.
  s2_zh: 借三十，抵消下跌状态时零点三七五股乘八十的价值。上升状态时股票值四十五，还款后剩十五。
  s2_zh_hk: 借三十，抵銷下跌狀態零點三七五股乘八十嘅價值。上升狀態股票值四十五，還錢之後剩十五。
  s3_en: >-
    The portfolio costs 37.50 minus 30, or 7.50. The 4.50 quote is now 3 dollars below, so it is cheap.
    The average price did not change, but wider outcomes give the call more upside.
  s3_zh: 组合成本是三十七点五减三十，等于七点五。四点五的报价现在低了三港元，所以偏便宜。平均股价没有变，但结果更分散，期权的上行空间就更大。
  s3_zh_hk: 組合成本係三十七點五減三十，等於七點五。四點五嘅報價而家低咗三蚊，所以偏平。平均股價冇變，但結果更分散，期權嘅上升空間就更大。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A forecast is not a price
  title_zh: 预测不是价格
  title_zh_hk: 預測不是價格
  en: >-
    The costs come from matched payoffs, funding and today's stock price, not from discounting the 50-50
    forecast. Here they happen to equal the forecast mean payoff, but that does not hold in general.
  zh: 成本来自对准的支付、融资条件和今天的股价，而不是把那个各半的预测拿来折现。这里刚好等于预测的平均支付，但一般情况下并不成立。
  zh_hk: 成本嚟自對準嘅支付、融資條件同今日嘅股價，唔係將嗰個各半嘅預測拎嚟折現。呢度啱啱等於預測嘅平均支付，但一般情況唔成立。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Spread raises option value
  title_zh: 波动更大，期权更值钱
  title_zh_hk: 波幅更大，期權更值錢
  q1_en: Replicate with shares and a loan
  q1_zh: 用股票和借款复制
  q1_zh_hk: 用股票和借款複製
  q2_en: Recheck when outcomes widen
  q2_zh: 结果变分散就要重算
  q2_zh_hk: 結果變分散就要重算
  s1_en: >-
    Two models with the same average can value the same call very differently. Wider outcomes raise its
    value because the down side stops at zero.
  s1_zh: 两个平均值相同的模型，可以给同一份期权很不同的价值。结果越分散，期权越值钱，因为下行最多只到零。
  s1_zh_hk: 兩個平均值一樣嘅模型，可以俾同一份期權好唔同嘅價值。結果越分散，期權越值錢，因為下跌最多只係到零。
  s2_en: >-
    This is a two-outcome teaching model, not a valuation of any listed option or a trading recommendation.
  s2_zh: 这是两种结果的教学模型，不是任何上市期权的估值，也不是交易建议。
  s2_zh_hk: 呢個係兩種結果嘅教學模型，唔係任何上市期權嘅估值，亦唔係交易建議。
  s3_en: >-
    The brokerage, stock and quotes are fictional. Official scene art is a teaching illustration only.
  s3_zh: 券商、股票和报价都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 證券行、股票同報價都係虛構嘅。官方場景圖只係教學插圖。
