  title_en: The same forecast. A dearer option?
  title_zh: 预测没变。期权却更贵了吗？
  title_zh_hk: 預測沒變。期權卻更貴了嗎？
  image: art/same-forecast-dearer-option-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In November 2024 HKEX introduced weekly options on ten stocks, describing them as a way to manage
    exposure around specific events. Volatility is one input in its pricing calculator. At a fictional
    Hong Kong brokerage, analyst Mei must decide whether a call quote is rich or cheap.
  zh: >-
    二零二四年十一月，香港交易所推出十只股票的周期权，说这是在特定事件前后管理风险的办法。在它的定价计算器里，波动率是其中一项输入。在香港一家虚构的券商，分析员Mei要判断一个看涨期权报价是偏贵还是偏便宜。
  zh_hk: >-
    二零二四年十一月，港交所推出十隻股票嘅週期權，話係喺特定事件前後管理風險嘅方法。喺佢嘅定價計算機入面，波幅係其中一項輸入。喺香港一間虛構嘅證券行，分析員Mei要判斷一個認購期權報價係偏貴定偏平。
