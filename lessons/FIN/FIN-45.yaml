  step1_zh: 股价到期为 80 或 120
  step1_zh_hk: 股價到期為 80 或 120
  step2_en: Average still HK$100
  step2_zh: 平均仍是 HK$100
  step2_zh_hk: 平均仍是 HK$100
  step3_en: Call pays 0 or 15
  step3_zh: 期权支付 0 或 15
  step3_zh_hk: 期權支付 0 或 15
  s1_en: >-
    A colleague offers another model. There are still two equally likely outcomes, but the share might
    end at 80 or 120.
  s1_zh: 同事提出另一个模型：仍然是两种可能性相同的结果，但股价到期可能是八十或者一百二十。
  s1_zh_hk: 同事提出另一個模型：仍然係兩個機會一樣嘅結果，但股價到期可能係八十或者一百二十。
  s2_en: >-
    The spot price, strike, quote, funding and time to expiry are all unchanged. The average expiry price
    is still 100.
  s2_zh: 现价、行权价、报价、融资条件和到期时间都不变。到期股价的平均值仍然是一百。
  s2_zh_hk: 現價、行使價、報價、融資條件同到期時間都唔變。到期股價嘅平均值仍然係一百。
  s3_en: The call now pays zero in the down state and 15 in the up state.
  s3_zh: 现在看涨期权在下跌状态支付零，在上升状态支付十五。
  s3_zh_hk: 而家認購期權喺下跌狀態支付零，喺上升狀態支付十五。
