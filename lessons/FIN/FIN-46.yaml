  title_en: Sell A or B?
  title_zh: 卖 A 还是卖 B？
  title_zh_hk: 賣 A 還是賣 B？
  en: >-
    In Statement 1, which lot should Yan sell? Note your answer, then compare it with Statement 2. Would
    anything make you change the sale? Pause and vote.
  zh: 按对账单1，Yan应该卖哪一手？先记下答案，再和对账单2比较。有什么会让你改变决定吗？请暂停，投个票。
  zh_hk: 按結單1，Yan應該賣邊一手？先記低答案，再同結單2比較。有冇嘢會令你改變決定？暫停，投個票。
