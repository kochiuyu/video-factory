  image: art/which-share-would-you-sell-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In November 2023 Hong Kong cut stamp duty on stock trades from 0.13 to 0.1 percent per side. That
    changed a transaction cost, not the price any investor had originally paid. Now Yan, in a fictional
    Kwun Tong flat, must sell one lot of shares to pay a repair bill.
  zh: >-
    二零二三年十一月，香港把股票买卖的印花税从每边百分之零点一三降到百分之零点一。这改变的是交易成本，而不是投资者当初买入的价格。现在，虚构人物Yan住在观塘，她要卖出一手股票，去付一笔维修账单。
  zh_hk: >-
    二零二三年十一月，香港將股票買賣嘅印花稅由每邊百分之零點一三減到百分之零點一。改變嘅係交易成本，唔係投資者當初買入嘅價錢。而家，虛構人物Yan住喺觀塘，佢要賣一手股票，去俾一張維修單。
