  s1_en: >-
    Yan needs 9,900 dollars in cleared cash for a building repair bill. She must sell one whole lot, A
    or B, and keep the other until month end.
  s1_zh: Yan要付大厦维修费，需要九千九百港元的到账现金。她只能卖出一整手，A或者B，另一手要留到月底。
  s1_zh_hk: Yan要俾大廈維修費，需要九千九百蚊嘅到賬現金。佢只可以賣一整手，A或者B，另一手要留到月尾。
  s2_en: >-
    Both lots can be sold now for 10,000, with the same 40 dollar all-in cost. The two statements show
    alternative purchase histories.
  s2_zh: 两手现在都能卖一万港元，全部成本同样是四十港元。两张对账单，是两种不同的买入经历。
  s2_zh_hk: 兩手而家都可以賣一萬蚊，全部成本一樣係四十蚊。兩張結單，係兩種唔同嘅買入經歷。
  s3_en: >-
    At month end, each state is equally likely. Compare cash left over plus the value of the lot she keeps.
    Ignore tax, interest and dividends.
  s3_zh: 月底时，两种状态的可能性相同。请比较剩下的现金，加上留着那一手的价值。不考虑税、利息和股息。
  s3_zh_hk: 月尾嘅時候，兩種狀態嘅機會一樣。請比較剩低嘅現金，加埋留住嗰手嘅價值。唔計稅、利息同股息。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
