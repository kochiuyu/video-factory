  en: >-
    Which campaign now earns more? And what is the smallest number of ready short-term slots that would
    make the lender campaign better? Pause and vote.
  zh: 现在哪项推广赚得更多？短期名额最少要有多少个准备好，出借人推广才会更好？请暂停，投个票。
  zh_hk: 而家邊項推廣賺得多啲？短期名額最少要有幾多個準備好，放款人推廣先會更好？暫停，投個票。
