  title_en: Who gets the lending subsidy?
  title_zh: 谁拿到这笔贷款补贴？
  title_zh_hk: 誰拿到這筆借貸補貼？
  image: art/who-gets-the-lending-subsidy-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Lending platforms in Singapore connect small businesses with individual and institutional investors.
    A platform can spend money to attract more lenders or more borrowers, but extra growth helps only
    where it removes a real constraint. Priya runs growth at a fictional Singapore small-business loan
    marketplace.
  zh: >-
    新加坡的借贷平台，把小企业和个人及机构投资者连接起来。平台可以花钱吸引更多出借人或者更多借款人，但新增的增长，只有在解除真正的约束时才有用。Priya在新加坡一家虚构的小企业贷款平台负责增长。
  zh_hk: >-
    新加坡嘅借貸平台，將小企業同個人及機構投資者連繫埋一齊。平台可以使錢吸引多啲放款人或者多啲借款人，但新增嘅增長，要解除到真正嘅限制先有用。Priya喺新加坡一間虛構嘅小企業貸款平台負責增長。
