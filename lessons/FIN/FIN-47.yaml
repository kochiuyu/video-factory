  title_zh: 找出每个池的约束
  title_zh_hk: 找出每個池的限制
  step1_en: >-
    Now: 45 + 20 = 65 loans
  step1_zh: 现在：45 + 20 = 65 笔
  step1_zh_hk: 現在：45 + 20 = 65 筆
  step2_en: >-
    Lender: +18 → 3,240 − 1,250 = 1,990
  step2_zh: 出借人：+18 → 3,240 − 1,250 = 1,990
  step2_zh_hk: 放款人：+18 → 3,240 − 1,250 = 1,990
  step3_en: >-
    Borrower: +16 → 1,440 after costs
  step3_zh: 借款人：+16 → 2,880 − 900 − 540 = 1,440
  step3_zh_hk: 借款人：+16 → 2,880 − 900 − 540 = 1,440
  s1_en: >-
    Without a campaign, 45 short-term and 20 longer-term loans are funded, 65 in all. Short-term is short
    of lenders; longer-term is short of qualified firms.
  s1_zh: 不做推广，短期放出四十五笔，较长期放出二十笔，共六十五笔。短期缺的是出借人，较长期缺的是合格企业。
  s1_zh_hk: 唔做推廣，短期批出四十五筆，較長期批出二十筆，總共六十五筆。短期缺嘅係放款人，較長期缺嘅係合格企業。
  s2_en: >-
    The lender campaign funds 18 more short-term loans. That is 18 times 180, minus 1,250, or 1,990 more
    contribution.
  s2_zh: 出借人推广让短期多放十八笔。十八乘一百八十，减一千二百五十，多出一千九百九十的贡献。
  s2_zh_hk: 放款人推廣令短期多批十八筆。十八乘一百八十，減一千二百五十，多咗一千九百九十嘅貢獻。
  s3_en: >-
    The borrower campaign funds 16 more longer-term loans. After 900 of screening and 540 of campaign
    cost, it adds 1,440. On this forecast, recruit lenders.
  s3_zh: 借款人推广让较长期多放十六笔。扣掉九百的审查费和五百四十的推广费，多出一千四百四十。按这个预测，应该招募出借人。
  s3_zh_hk: 借款人推廣令較長期多批十六筆。扣咗九百審查費同五百四十推廣費，多咗一千四百四十。按呢個預測，應該招放款人。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Count slots ready this month
  title_zh: 只算本月能用的名额
  title_zh_hk: 只算本月能用的名額
  step1_en: >-
    Lender: +12 → 2,160 − 1,250 = 910
  step1_zh: 出借人：+12 → 2,160 − 1,250 = 910
  step1_zh_hk: 放款人：+12 → 2,160 − 1,250 = 910
  step2_en: >-
    Borrower still 1,440: switch
  step2_zh: 借款人仍是 1,440：改选
  step2_zh_hk: 借款人仍是 1,440：改選
  step3_en: >-
    Lender wins from 15 slots: 1,450
  step3_zh: 15 个名额起出借人胜：1,450
  step3_zh_hk: 15 個名額起放款人勝：1,450
  s1_en: >-
    With 12 ready slots, the lender campaign funds 12 more loans: 2,160 minus 1,250, or 910. The extra
    longer-term slots fund nothing, because that pool lacks firms.
  s1_zh: 只有十二个名额能用时，出借人推广多放十二笔：二千一百六十减一千二百五十，等于九百一十。新增的较长期名额放不出贷款，因为那个池缺的是企业。
  s1_zh_hk: 得十二個名額用得，放款人推廣多批十二筆：二千一百六十減一千二百五十，等於九百一十。新增嘅較長期名額批唔到貸款，因為嗰個池缺嘅係企業。
  s2_en: The borrower campaign still adds 1,440, so Priya should switch.
  s2_zh: 借款人推广仍然多出一千四百四十，所以Priya应该改选借款人推广。
  s2_zh_hk: 借款人推廣仍然多咗一千四百四十，所以Priya應該改揀借款人推廣。
  s3_en: >-
    With 14 ready slots the lender campaign adds 1,270; with 15 it adds 1,450, just 10 more. Fifteen is
    the threshold, and such a small lead is a reason to verify commitments first.
  s3_zh: >-
    有十四个名额时，出借人推广多出一千二百七十；有十五个时多出一千四百五十，只比借款人推广多十元。十五个就是临界点，领先这么少，花钱前更应该先核实承诺。
  s3_zh_hk: >-
    有十四個名額，放款人推廣多咗一千二百七十；有十五個就多咗一千四百五十，只比借款人推廣多十蚊。十五個就係臨界點，領先咁少，使錢之前更應該先核實承諾。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Fix the binding constraint
  title_zh: 解决真正卡住的约束
  title_zh_hk: 解決真正卡住的限制
  en: >-
    Spend where the constraint binds. Slots in a pool that lacks borrowers fund nothing, and a slot counts
    only when the lender is ready this month.
  zh: 钱要花在真正卡住的地方。缺借款人的池，多了名额也放不出贷款；而名额只有在出借人这个月准备好时才算数。
  zh_hk: 錢要使喺真正卡住嘅地方。缺借款人嘅池，多咗名額都批唔出貸款；而名額要放款人呢個月準備好先計數。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Subsidise the side that binds
  title_zh: 补贴卡住的那一边
  title_zh_hk: 補貼卡住的那一邊
  q1_en: Compare extra contribution after costs
  q1_zh: 比较扣除成本后多出的贡献
  q1_zh_hk: 比較扣除成本後多出的貢獻
  q2_en: Count only ready capacity
  q2_zh: 只算真正能用的容量
  q2_zh_hk: 只算真正能用的容量
  s1_en: >-
    In a two-sided marketplace, adding supply where demand is missing earns nothing. Find the bottleneck
    in each segment before choosing whom to subsidise.
  s1_zh: 在双边市场里，在没有需求的地方增加供给，赚不到钱。先找出每个细分市场的瓶颈，再决定补贴谁。
  s1_zh_hk: 喺雙邊市場入面，喺冇需求嘅地方增加供應，賺唔到錢。先搵出每個細分市場嘅樽頸，再決定補貼邊個。
  s2_en: >-
    This is a fictional platform, not a description of any provider's practices or terms.
  s2_zh: 这是虚构的平台，不代表任何服务商的做法或条款。
  s2_zh_hk: 呢個係虛構嘅平台，唔代表任何服務商嘅做法或者條款。
  s3_en: >-
    The platform, campaigns and figures are fictional. Official scene art is a teaching illustration only.
  s3_zh: 平台、推广和数字都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 平台、推廣同數字都係虛構嘅。官方場景圖只係教學插圖。
