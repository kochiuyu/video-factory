  s1_en: >-
    The platform earns 180 Singapore dollars per funded loan. Priya can run one campaign this month, or
    neither.
  s1_zh: 平台每放出一笔贷款，赚一百八十新加坡元。这个月Priya可以做一项推广，也可以都不做。
  s1_zh_hk: 平台每批出一筆貸款，賺一百八十新加坡元。呢個月Priya可以做一項推廣，或者乜都唔做。
  s2_en: >-
    There are two separate pools, short-term and longer-term. Lenders' mandates fix which pool they fund,
    so spare slots cannot move between pools.
  s2_zh: 平台有两个分开的放款池：短期和较长期。出借人的委托决定了他们只能给哪个池放款，所以空着的名额不能在池之间挪用。
  s2_zh_hk: 平台有兩個分開嘅放款池：短期同較長期。放款人嘅委託決定咗佢哋只可以放款俾邊個池，所以空出嚟嘅名額唔可以喺池之間調動。
  s3_en: >-
    The lender campaign costs 1,250 and adds slots in both pools. The borrower campaign costs 540 and
    recruits 30 longer-term applicants, 16 of whom qualify, with screening at 30 dollars each.
  s3_zh: 出借人推广花一千二百五十，两个池都会增加名额。借款人推广花五百四十，招来三十名较长期申请人，其中十六名合格，每审查一人要三十元。
  s3_zh_hk: 放款人推廣使一千二百五十，兩個池都會多咗名額。借款人推廣使五百四十，招到三十個較長期申請人，其中十六個合格，每審查一個要三十蚊。
