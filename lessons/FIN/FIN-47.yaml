  s1_en: >-
    A pilot suggests that only 12 of the 18 extra short-term slots would be ready to fund this month.
  s1_zh: 试点显示，新增的十八个短期名额里，这个月只有十二个真的能放款。
  s1_zh_hk: 試點顯示，新增嘅十八個短期名額入面，呢個月得十二個真係可以放款。
  s2_en: >-
    The 12 extra longer-term slots would still be available. The campaign costs and the borrower forecast
    are unchanged.
  s2_zh: 新增的十二个较长期名额仍然可用。推广成本和借款人预测都不变。
  s2_zh_hk: 新增嘅十二個較長期名額仍然用得。推廣成本同借款人預測都唔變。
  s3_en: >-
    A slot counts only if the lender is ready to fund within the month. An expression of interest is not
    a slot.
  s3_zh: 只有出借人在这个月内准备好放款，名额才算数。表示有兴趣，不等于名额。
  s3_zh_hk: 一定要放款人喺呢個月內準備好放款，名額先計數。表示有興趣，唔等於名額。
