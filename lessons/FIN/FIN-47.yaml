  en: >-
    Which campaign should Priya choose? Compare funded loans in each pool, and the extra contribution
    after all new costs, against doing nothing. Pause and vote.
  zh: Priya应该选哪项推广？请按每个池比较放出的贷款，以及扣除所有新增成本之后，相比什么都不做多出的贡献。请暂停，投个票。
  zh_hk: Priya應該揀邊項推廣？請按每個池比較批出嘅貸款，同埋扣除所有新增成本之後，比起乜都唔做多出嘅貢獻。暫停，投個票。
