  s1_en: >-
    Old refrigeration controls are failing, and the firm is losing orders. A retrofit could cut spoilage
    and win customers back.
  s1_zh: 旧的制冷控制系统老出故障，公司在流失订单。改造可以减少损耗，把客户拉回来。
  s1_zh_hk: 舊嘅製冷控制系統成日壞，公司失咗啲訂單。改造可以減少損耗，將客拉返嚟。
  s2_en: >-
    Finance manager Ada asks the owners to put in 22 million dollars today. The firm has no spare cash
    and owes the bank 100 million at year end.
  s2_zh: 财务经理Ada请股东今天投入两千二百万港元。公司没有闲钱，年末还欠银行一亿港元。
  s2_zh_hk: 財務經理Ada請股東今日投入兩千二百萬港元。公司冇閒錢，年尾仲欠銀行一億港元。
  s3_en: >-
    At year end the bank gets the lower of the cash available and the amount due, and the owners get the
    rest. Use expected cash, with no discounting or taxes.
  s3_zh: 年末，银行拿走可用现金和欠款之中较低的那个，余下的归股东。按期望现金计算，不折现，不计税。
  s3_zh_hk: 年尾，銀行攞走可用現金同欠款之中較低嗰個，其餘歸股東。按期望現金計，唔折現，唔計稅。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Would the owners pay?
  title_zh: 股东会出这笔钱吗？
  title_zh_hk: 股東會出這筆錢嗎？
  en: >-
    Who gets the cash in each demand state? How much value does the retrofit create, and would the owners
    fund it on the old terms? Pause and vote.
  zh: 每一种需求状态下，现金归谁？改造创造多少价值？按原来的条件，股东会出钱吗？请暂停，投个票。
  zh_hk: 每一種需求狀態之下，現金歸邊個？改造創造幾多價值？按原本嘅條件，股東會唔會出錢？暫停，投個票。
