  title_en: Who funds the rescue investment?
  title_zh: 这笔挽救投资，谁来出钱？
  title_zh_hk: 這筆挽救投資，誰來出錢？
  image: art/who-funds-the-rescue-investment-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In October 2024 the HKMA and Hong Kong banks announced measures to help smaller businesses upgrade,
    including financing for low-carbon equipment and more flexible repayment. The announcement did not
    promise bank co-funding. Here, a fictional cold-storage operator in Kwai Chung needs a rescue investment.
  zh: >-
    二零二四年十月，香港金融管理局和银行业公布措施，帮助中小企业升级，包括为低碳设备提供融资，以及更灵活的还款安排。公告并没有承诺银行会共同出资。这里，葵涌一家虚构的冷库运营商，需要一笔挽救投资。
  zh_hk: >-
    二零二四年十月，金管局同銀行業公布措施，幫中小企升級，包括為低碳設備提供融資，同埋更靈活嘅還款安排。公告冇承諾銀行會一齊出資。呢度，葵涌一間虛構嘅凍倉營運商，需要一筆挽救投資。
