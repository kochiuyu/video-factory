  s1_en: >-
    From here, all figures are in thousands of dollars. The loan is 126 today and is settled at the end
    of the season.
  s1_zh: 以下金额的单位都是千港元。贷款今天放出一百二十六，到季末结清。
  s1_zh_hk: 以下金額嘅單位都係千港元。貸款今日批出一百二十六，到季尾清還。
  s2_en: >-
    If the owner puts in extra planning work, success is 80 percent likely; without it, 50 percent. The
    work costs the owner the equivalent of 18. Mina cannot verify it.
  s2_zh: 如果老板多花功夫做规划，成功的概率是百分之八十；不做，就是百分之五十。这份功夫对老板来说相当于十八的成本，而Mina没法核实他有没有做。
  s2_zh_hk: 如果老闆落多啲功夫做規劃，成功機會係百分之八十；唔做，就係百分之五十。呢份功夫對老闆嚟講，成本相當於十八，而Mina冇辦法核實佢有冇做。
  s3_en: >-
    Both quotes collect 20 after a weak season. After success, quote A collects 155 and quote B collects
    175. Mina needs expected collections of at least 126.
  s3_zh: 两个报价在淡季都收回二十。成功的话，报价A收一百五十五，报价B收一百七十五。Mina要求期望回收至少一百二十六。
  s3_zh_hk: 兩個報價喺淡季都收返二十。成功嘅話，報價A收一百五十五，報價B收一百七十五。Mina要求期望回收最少一百二十六。
