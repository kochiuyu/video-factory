  title_en: When does a tougher loan collect less?
  title_zh: 更苛刻的贷款，什么时候反而收得更少？
  title_zh_hk: 更苛刻的貸款，甚麼時候反而收得更少？
  image: art/tougher-loan-collect-less-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In November 2024, Hong Kong extended guarantee periods and added partial principal repayment options
    in its SME Financing Guarantee Scheme. This fictional loan has no public guarantee. A small Kwun Tong
    delivery firm asks credit officer Mina for 126,000 dollars to start a chilled-grocery route.
  zh: >-
    二零二四年十一月，香港的中小企融资担保计划延长了担保期，并为新贷款加入部分还本的选择。这笔虚构的贷款没有政府担保。观塘一家小型送货公司，向信贷员Mina申请十二万六千港元，开一条冷链杂货线路。
  zh_hk: >-
    二零二四年十一月，香港嘅中小企融資擔保計劃延長咗擔保期，仲為新貸款加入部分還本嘅選擇。呢筆虛構嘅貸款冇政府擔保。觀塘一間細嘅送貨公司，向信貸主任Mina申請十二萬六千蚊，開一條凍鏈雜貨路線。
