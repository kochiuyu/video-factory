  title_zh: 批准 A 还是 B？
  title_zh_hk: 批准 A 還是 B？
  en: >-
    Which quote should Mina approve? Once the owner decides whether to do the extra work, how much does
    the lender expect to collect under each? Pause and vote.
  zh: Mina应该批准哪个报价？在老板决定做不做额外功夫之后，每个报价下贷款方期望收回多少？请暂停，投个票。
  zh_hk: Mina應該批准邊個報價？老闆決定做唔做額外功夫之後，每個報價之下，貸款方期望收返幾多？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
