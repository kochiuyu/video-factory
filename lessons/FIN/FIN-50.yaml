  s1_en: >-
    A colleague notices a flat 25 dollar platform charge on each application.
  s1_zh: 一位同事发现，每次申购都要付二十五港元的平台费。
  s1_zh_hk: 有個同事發現，每次認購都要俾二十五蚊平台費。
  s2_en: It is payable even if no shares are allotted.
  s2_zh: 即使一股都没分到，也要付。
  s2_zh_hk: 就算一股都分唔到，都要俾。
  s3_en: The share price and all the outcomes in the table stay the same.
  s3_zh: 股价和表里的所有结果都不变。
  s3_zh_hk: 股價同表入面嘅所有結果都唔變。
