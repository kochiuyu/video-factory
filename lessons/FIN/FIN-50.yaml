  title_en: Is a big IPO allocation good news?
  title_zh: 首次公开招股（IPO）获配很多，是好消息吗？
  title_zh_hk: 首次公開招股（IPO）獲配很多，是好消息嗎？
  image: art/big-ipo-allocation-good-news-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In August 2025 the Hong Kong exchange introduced two mechanisms issuers can choose for allocating
    shares to the public subscription tranche. But the size of that pool is not the number of shares one
    applicant receives. At a Kowloon training session, analyst Jan assesses a simulated IPO application.
  zh: >-
    二零二五年八月，香港交易所推出两种机制，让发行人选择如何把股份分配给公开认购部分。但这部分的规模，并不等于单个申请人能分到多少股。在九龙的一次培训课上，分析员Jan要评估一份模拟的新股申购。
  zh_hk: >-
    二零二五年八月，港交所推出兩種機制，等發行人揀點樣將股份分配俾公開認購部分。但呢部分嘅規模，唔等於單一申請人分到幾多股。喺九龍一次培訓入面，分析員Jan要評估一份模擬嘅新股認購。
