  title_zh: 按 HK$16 申购吗？
  title_zh_hk: 按 HK$16 認購嗎？
  en: >-
    What is Jan's expected profit at 16 dollars? And what offer price would just break even, once you
    count how many shares she gets in each state? Pause and vote.
  zh: 按十六港元，Jan的期望利润是多少？把每种状态下分到多少股算进去之后，招股价定在多少才刚好打平？请暂停，投个票。
  zh_hk: 按十六蚊，Jan嘅期望利潤係幾多？將每種狀態分到幾多股計埋之後，招股價定喺幾多先啱啱打平？暫停，投個票。
