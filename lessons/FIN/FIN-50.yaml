  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: A full allotment can be bad news
  title_zh: 全数获配可能是坏消息
  title_zh_hk: 全數獲配可能是壞消息
  step1_en: Average value 20.50, yet profit is small
  step1_zh: 平均每股 20.50，利润却不大
  step1_zh_hk: 平均每股 20.50，利潤卻不大
  step2_en: >-
    States: −480 · +200 · +140
  step2_zh: 各状态：−480 · +200 · +140
  step2_zh_hk: 各狀態：−480 · +200 · +140
  step3_en: >-
    Expected profit: HK$15
  step3_zh: 期望利润：HK$15
  step3_zh_hk: 期望利潤：HK$15
  s1_en: >-
    The probability-weighted value per share is 20.50, well above 16. But the most shares arrive in the
    weak state, where each is worth 4 dollars less than Jan pays.
  s1_zh: 按概率加权，每股价值二十点五，远高于十六。但分到最多股份的，正是疲弱状态，那时每股比Jan付的价钱少四港元。
  s1_zh_hk: 按概率加權，每股價值二十點五，遠高過十六。但分到最多股份嘅，正正係疲弱狀態，嗰陣每股比Jan俾嘅價錢少四蚊。
  s2_en: >-
    At 16, the profits are minus 480 in the weak state, plus 200 in the middle and plus 140 in the strong
    state.
  s2_zh: 按十六港元，疲弱状态亏四百八十，中等赚二百，强劲赚一百四十。
  s2_zh_hk: 按十六蚊，疲弱狀態蝕四百八十，中等賺二百，強勁賺一百四十。
  s3_en: >-
    Expected profit is just 15 dollars. Jan would apply, but the margin is far smaller than the 4.50 gap
    between average value and price suggests.
  s3_zh: 期望利润只有十五港元。Jan会申购，但这个利润，远比平均价值和招股价相差的四点五看起来要小。
  s3_zh_hk: 期望利潤得十五蚊。Jan會認購，但呢個利潤，遠比平均價值同招股價相差嘅四點五睇落細。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Weight by shares, not states
  title_zh: 按股数加权，不只按状态
  title_zh_hk: 按股數加權，不只按狀態
  step1_en: 935 ÷ 57.5 shares ≈ HK$16.26
  step1_zh: 935 ÷ 57.5 股 ≈ HK$16.26
  step1_zh_hk: 935 ÷ 57.5 股 ≈ HK$16.26
  step2_en: >-
    With fee: 15 − 25 = −10, skip
  step2_zh: 加费用：15 − 25 = −10，不申购
  step2_zh_hk: 加費用：15 − 25 = −10，不認購
  step3_en: New break-even ≈ 15.83 · max fee 15
  step3_zh: 新打平价 ≈ 15.83 · 最多费用 15
  step3_zh_hk: 新打平價 ≈ 15.83 · 最多費用 15
  s1_en: >-
    Expected allotment is 57.5 shares, with an expected debut value of 935 dollars. Break-even is 935
    divided by 57.5, about 16.26 per share.
  s1_zh: 期望获配五十七点五股，首日期望价值九百三十五港元。打平价格是九百三十五除以五十七点五，大约每股十六点二六。
  s1_zh_hk: 期望獲配五十七點五股，首日期望價值九百三十五蚊。打平價係九百三十五除五十七點五，大約每股十六點二六。
  s2_en: >-
    The 25 dollar fee turns the expected profit of 15 into a loss of 10, so Jan skips the application.
  s2_zh: 二十五港元的费用，把十五的期望利润变成亏损十，所以Jan不申购。
  s2_zh_hk: 二十五蚊收費，將十五嘅期望利潤變成蝕十，所以Jan唔認購。
  s3_en: >-
    With the fee, the break-even price falls to about 15.83. At 16, a flat charge of 15 would leave her
    indifferent; anything higher makes skipping better.
  s3_zh: 有了费用，打平价格降到大约十五点八三。按十六港元，固定费用十五时她申不申购都一样；再高，就不申购更好。
  s3_zh_hk: 有咗收費，打平價跌到大約十五點八三。按十六蚊，固定收費十五嘅時候佢認唔認購都一樣；再高，就唔認購好啲。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A model, not a trading rule
  title_zh: 这是模型，不是交易规则
  title_zh_hk: 這是模型，不是交易規則
  en: >-
    Here the winner's curse is an allocation effect: you get more of the weak issues and less of the strong
    ones. A large real allotment can have other causes, including the offer terms.
  zh: 这里的赢家诅咒，是分配造成的：弱的新股你分得多，强的分得少。现实中获配很多，也可能有别的原因，包括发行条款。
  zh_hk: 呢度嘅贏家詛咒，係分配造成嘅：弱嘅新股你分得多，強嘅分得少。現實獲配好多，都可能有其他原因，包括招股條款。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Allotment size is information
  title_zh: 获配多少本身带有信息
  title_zh_hk: 獲配多少本身帶有資訊
  q1_en: Weight value by shares received
  q1_zh: 按获配股数加权价值
  q1_zh_hk: 按獲配股數加權價值
  q2_en: Include fixed costs per application
  q2_zh: 计入每次申购的固定费用
  q2_zh_hk: 計入每次認購的固定費用
  s1_en: >-
    An average value above the offer price does not guarantee a profit, because you receive the most shares
    when they are worth the least.
  s1_zh: 平均价值高于招股价，并不保证赚钱，因为你分到最多股份的时候，正是股份最不值钱的时候。
  s1_zh_hk: 平均價值高過招股價，唔保證賺錢，因為你分到最多股份嘅時候，正正係股份最唔值錢嘅時候。
  s2_en: >-
    The fee, probabilities and allotments are not estimates for any actual IPO.
  s2_zh: 这里的费用、概率和获配数，都不是对任何真实新股的估计。
  s2_zh_hk: 呢度嘅收費、概率同獲配數，都唔係對任何真實新股嘅估計。
  s3_en: >-
    The issuer, applicant and figures are fictional. Official scene art is a teaching illustration only.
  s3_zh: 发行人、申购人和数字都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 發行人、認購人同數字都係虛構嘅。官方場景圖只係教學插圖。
