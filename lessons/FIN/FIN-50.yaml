  en: >-
    With the 25 dollar charge, would Jan still apply at 16? What is the new break-even price, and the
    largest flat charge she could bear at 16? Pause and vote.
  zh: 有了二十五港元的费用，Jan按十六港元还会申购吗？新的打平价格是多少？按十六港元，她最多能承受多少固定费用？请暂停，投个票。
  zh_hk: 有咗二十五蚊收費，Jan按十六蚊仲會唔會認購？新嘅打平價係幾多？按十六蚊，佢最多頂得順幾多固定收費？暫停，投個票。
- id: bridge
  visual: steps
