  s1_en: >-
    Jan applies for 120 shares at an offer price of 16 dollars. She pays only for the shares she is allotted.
    If she skips, her payoff is zero.
  s1_zh: Jan按每股十六港元的招股价，申购一百二十股。她只为实际获配的股份付款。如果不申购，收益就是零。
  s1_zh_hk: Jan按每股十六蚊嘅招股價，認購一百二十股。佢只係為真正獲配嘅股份俾錢。如果唔認購，收益就係零。
  s2_en: >-
    Better-informed applicants compete hardest when a strong debut is likely, so Jan gets fewer shares
    in that state.
  s2_zh: 掌握更多信息的申购人，在预期首日表现强劲时争得最凶，所以那种情况下Jan分到的股份更少。
  s2_zh_hk: 掌握多啲資訊嘅認購人，喺預期首日表現強勁嗰陣搶得最勁，所以嗰種情況Jan分到嘅股份更少。
  s3_en: >-
    In a weak debut a share is worth 12 and she gets all 120. In the middle state, 20 and 50 shares. In
    a strong debut, 30, but only 10 shares.
  s3_zh: 首日表现疲弱时，每股值十二，她获配全部一百二十股。中等时每股值二十，获配五十股。强劲时每股值三十，却只获配十股。
  s3_zh_hk: 首日表現疲弱，每股值十二，佢獲配晒一百二十股。中等嘅時候每股值二十，獲配五十股。強勁嘅時候每股值三十，但淨係獲配十股。
