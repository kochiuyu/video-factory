  col2_zh_hk: 佔住
  c11: "(3, 3)"
  c12: "(2, 5)"
  c21: "(5, 2)"
  c22: "(0, 0)"
  highlight: c21
  note_en: First number is A. Both Hold is zero. The Nash cells are the off ones.
  note_zh: 头一个数字是甲。都占住是零。纳什在对角那两格。
  note_zh_hk: 第一個數字係甲。都佔住係零。納什喺對角嗰兩格。
  en: Both Yield, each takes three in the back. A Holds and B Yields, A takes five and B takes two. Both Hold, they block the gate and take zero. The Nash cells are five-two and two-five.
  zh: 都让开，在后面各带走三。甲占乙让，甲带走五，乙带走二。都占住，堵住门口，各带走零。纳什是五和二、二和五。
  zh_hk: 都讓開，喺後面各袋走三。甲佔乙讓，甲袋走五，乙袋走二。都佔住，堵住門口，各袋走零。納什係五同二、二同五。
- id: example
  visual: example
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Why both Hold is not Nash
  title_zh: 为什么都占住不是纳什
  title_zh_hk: 點解都佔住唔係納什
  setup_en: Both carts Hold. Each takes zero.
  setup_zh: 两车都占住。各带走零。
  setup_zh_hk: 兩架都佔住。各袋走零。
  result_en: If the other Holds, Yield pays two. So both would move.
  result_zh: 对面占住时，让开能带走二。所以两车都会动。
  result_zh_hk: 對面佔住嗰陣，讓開可以袋走二。所以兩架都會郁。
  en: Both Hold is the crash. Each takes zero. If the other cart Holds, Yield pays two. Zero is worse, so both would move. A Nash cell is one Hold and one Yield.
  zh: 都占住就是撞上。各带走零。对面占住时，让开能带走二。零更差，所以两车都会动。纳什是一辆占、一辆让。
  zh_hk: 都佔住就係撞埋。各袋走零。對面佔住嗰陣，讓開可以袋走二。零更差，所以兩架都會郁。納什係一架佔、一架讓。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Nash is not match
  title_zh: 纳什不等于停在一起
  title_zh_hk: 納什唔等於停一齊
  q1_en: Two Nash cells, opposite actions.
  q1_zh: 两格纳什，动作相反。
  q1_zh_hk: 兩格納什，動作相反。
  q2_en: Both Hold is not Nash.
  q2_zh: 都占住不是纳什。
  q2_zh_hk: 都佔住唔係納什。
  en: Keep both lines. Nash can be opposite actions. Both Hold is not Nash. Next we close. We still have not said which cart gets the gate.
  zh: 两句都留下。纳什可以是相反的动作。都占住不是纳什。接下来收住。我们还没说谁占到门口。
  zh_hk: 兩句都留低。納什可以係相反嘅動作。都佔住唔係納什。跟住收住。我哋都未講邊個佔到門口。
