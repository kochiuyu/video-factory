  col1_zh_hk: 左
  col2_en: Right
  col2_zh: 右
  col2_zh_hk: 右
  c11: "(3, 3)"
  c12: "(0, 0)"
  c21: "(0, 0)"
  c22: "(3, 3)"
  highlight: c11
  note_en: Both Left is Nash. Both Right is Nash too.
  note_zh: 都在左是纳什。都在右也是纳什。
  note_zh_hk: 都喺左係納什。都喺右都係納什。
  en: Both Left. A's best response to Left is Left. B's best response to Left is Left. That cell is Nash. Both Right is Nash the same way. The split cells are not. Each would rather match.
  zh: 都在左。甲对左的最优反应是左。乙对左的最优反应也是左。这一格是纳什。都在右，同样是纳什。分开的两格不是。每辆都更想停在一起。
  zh_hk: 都喺左。甲對左嘅最佳回應係左。乙對左嘅最佳回應都係左。呢一格係納什。都喺右，同樣係納什。分開嗰兩格唔係。每架都更想停一齊。
- id: example
  visual: example
  seconds: 22
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Two Nash, no winner yet
  title_zh: 两个纳什，还没有赢家
  title_zh_hk: 兩個納什，都未有贏家
  setup_en: The table has two Nash cells.
  setup_zh: 表上有两格纳什。
  setup_zh_hk: 表上面有兩格納什。
  result_en: We have not said which morning happens.
  result_zh: 我们还没说会停在哪一个早晨。
  result_zh_hk: 我哋都未講會停邊一個朝早。
  en: The table has two Nash cells. We have not said which morning happens. Nash does not pick between them. It only marks the cells where neither cart wants to move alone.
  zh: 表上有两格纳什。我们还没说会停在哪一个早晨。纳什不会在这两格里再选一次。它只标出谁也不想自己先动的格子。
  zh_hk: 表上面有兩格納什。我哋都未講會停邊一個朝早。納什唔會喺呢兩格再揀一次。佢淨係標出邊個都唔想自己先郁嘅格仔。
- id: takeaway
  visual: takeaway
  seconds: 22
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Mutual best response
  title_zh: 彼此都是最优反应
  title_zh_hk: 彼此都係最佳回應
  q1_en: Nash is mutual best response.
  q1_zh: 纳什就是彼此都是最优反应。
  q1_zh_hk: 納什就係彼此都係最佳回應。
  q2_en: This table has two Nash cells.
  q2_zh: 这张表有两格纳什。
  q2_zh_hk: 呢張表有兩格納什。
  en: Keep that sentence. Nash is mutual best response. This table has two. Next the path narrows. They cannot both take the gate, and Nash will not mean match.
  zh: 留下这一句。纳什就是彼此都是最优反应。这张表有两格。接下来路窄了。两车不能一起占住门口，纳什也不再等于停在一起。
  zh_hk: 留低呢一句。納什就係彼此都係最佳回應。呢張表有兩格。跟住路窄咗。兩架唔可以一齊佔住門口，納什都唔再等於停一齊。
