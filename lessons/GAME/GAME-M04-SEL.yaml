id: GAME-M04-SEL
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 120
title_en: The gate is harder
title_zh: 门口更难
title_zh_hk: 門口更難
objective_en: At the gate the two Nash disagree on who yields. I will Hold is not cheap talk.
objective_zh: 门口那两格纳什，在谁让开上意见相反。“我占住”不是便宜的话。
objective_zh_hk: 門口嗰兩格納什，喺邊個讓開上面意見相反。「我佔住」唔係平嘅說話。
glossary:
- en: cheap talk
  zh: 便宜的话
  zh_hk: 平嘅說話
  lock: true
- en: chicken
  zh: 斗鸡
  zh_hk: 鬥雞
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Why is I will Hold not cheap at the gate?
  zh: 门口上，为什么“我占住”不便宜？
  zh_hk: 門口上面，點解「我佔住」唔平？
  answer_en: Each cart prefers the Nash where it Holds. The sentence tries to grab the better cell.
  answer_zh: 每辆车都更想自己占住的那一格纳什。这句话是在抢更好的那一格。
  answer_zh_hk: 每架車都更想自己佔住嗰一格納什。呢句係喺度搶更好嗰一格。
- id: Q2
  type: transfer
  en: Does a shady sign pick who Holds?
  zh: 有荫的牌子能选出谁占住吗？
  zh_hk: 有蔭嘅牌揀唔揀得邊個佔住？
  answer_en: Not the same way. Shade does not say who yields.
  answer_zh: 不能同样用。荫不会告诉谁该让。
  answer_zh_hk: 唔可以同樣用。蔭唔會話邊個該讓。
beats:
- id: hook
  visual: title_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Take the sentence to the gate
  title_zh: 把这句话带到门口
  title_zh_hk: 將呢句帶去門口
  en: Same two carts. The path narrows again. A says I will Hold. Last part that kind of sentence helped. Ask whether it still helps when they cannot both take the gate.
  zh: 还是这两辆车。路又窄了。甲说，我占住。上一节这种话有用。问两车不能一起占门口时，它还有没有用。
  zh_hk: 都係呢兩架車。路又窄咗。甲講，我佔住。上一截呢種話有用。問兩架唔可以一齊佔門口嗰陣，佢仲有冇用。
- id: define
  visual: definition_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: The two Nash disagree
  title_zh: 两格纳什意见相反
  title_zh_hk: 兩格納什意見相反
  formula: Each cart likes a different Nash cell
  formula_en: Each cart likes a different Nash cell
  formula_zh: 每辆车喜欢的纳什格不一样
  formula_zh_hk: 每架車鍾意嘅納什格唔一樣
  gloss_en: Talk now tries to grab the gate.
  gloss_zh: 这时说话是在抢门口。
  gloss_zh_hk: 呢陣說話係喺度搶門口。
  en: Here is the idea. On the wide path both Nash cells paid the same. At the gate one Nash gives A five, the other gives A two. Each cart likes a different cell. A sentence that says I will Hold is an attempt to grab the better one.
  zh: 核心就这一句。宽路上两格纳什一样赚。门口这一格甲得五，那一格甲得二。每辆喜欢的格子不同。说我占住，就是在抢更好的那一格。
  zh_hk: 核心就呢一句。闊路兩格納什一樣賺。門口呢一格甲得五，嗰一格甲得二。每架鍾意嘅格仔唔同。講我佔住，就係喺度搶更好嗰一格。
