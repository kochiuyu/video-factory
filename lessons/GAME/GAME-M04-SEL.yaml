  c21: "(5, 2)"
  c22: "(0, 0)"
  highlight: c21
  note_en: A wants five-two. B wants two-five. Same table as last unit.
  note_zh: 甲想要五和二。乙想要二和五。还是上一单元那张表。
  note_zh_hk: 甲想要五同二。乙想要二同五。都係上一單元嗰張表。
  en: Same gate table. A wants the cell that pays five and two. B wants two and five. Shade does not say who yields. I will Hold from both mouths is two claims on one pitch.
  zh: 还是门口那张表。甲想要五和二那一格。乙想要二和五。荫不会告诉谁该让。两张嘴都说我占住，就是在抢同一个摊位。
  zh_hk: 都係門口嗰張表。甲想要五同二嗰一格。乙想要二同五。蔭唔會話邊個該讓。兩張嘴都講我佔住，就係喺度搶同一個攤位。
- id: example
  visual: example
  seconds: 22
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Lying can pay here
  title_zh: 这里说谎可能有好处
  title_zh_hk: 呢度講大话可能有好處
  setup_en: B believes I will Hold and Yields.
  setup_zh: 乙相信“我占住”，于是让开。
  setup_zh_hk: 乙相信「我佔住」，於是讓開。
  result_en: A gets five. So A may want B to believe, even if A is not sure.
  result_zh: 甲得到五。所以甲可能希望乙信，哪怕自己还没定。
  result_zh_hk: 甲得到五。所以甲可能想乙信，就算自己都未定。
  en: If B believes I will Hold and Yields, A gets five. Then A may want the sentence believed even when A is unsure. That is why the talk is no longer cheap in the useful sense.
  zh: 乙一信并让开，甲就得到五。于是甲可能希望这句话被信，哪怕自己还没定。所以在有用的意义上，这话不再便宜。
  zh_hk: 乙一信並讓開，甲就得到五。於是甲可能想呢句被信，就算自己都未定。所以喺有用嘅意義上面，呢句唔再平。
- id: takeaway
  visual: takeaway
  seconds: 22
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Same tool, harder table
  title_zh: 同一工具，更难的表
  title_zh_hk: 同一工具，更難嘅表
  q1_en: Coordination talk can tip a cell.
  q1_zh: 协调里，话可以推向一格。
  q1_zh_hk: 協調入面，話可以推去一格。
  q2_en: At the gate, I will Hold is a grab.
  q2_zh: 门口上，“我占住”是在抢。
  q2_zh_hk: 門口上面，「我佔住」係喺度搶。
  en: Keep the contrast. A landmark or a sentence can tip the wide path. At the gate the two Nash disagree, so the same sentence is a grab. Next we close. The unit after that is a table with no Nash cell.
  zh: 把这一对比留下。地标或一句话，推得动宽路。门口两格纳什意见相反，同一句话就是在抢。接下来收住。再下一单元才是一格纳什都没有的表。
  zh_hk: 將呢一對比留低。地標定一句，推得動闊路。門口兩格納什意見相反，同一句就係喺度搶。跟住收住。再下一單元先至係一格納什都冇嘅表。
