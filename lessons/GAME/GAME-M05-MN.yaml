  c11: "(0, 3)"
  c12: "(3, 0)"
  c21: "(3, 0)"
  c22: "(0, 3)"
  highlight: c12
  note_en: Against half, 0 and 3 average to the same number.
  note_zh: 对着一半，0 和 3 平均下来一样。
  note_zh_hk: 對住一半，0 同 3 平均落嚟一樣。
  en: Against a half-and-half copycat, half your mornings you meet them and take 0, half you miss them and take 3. Left and Right both average the same. So you are willing to mix. The copycat faces the same arithmetic.
  zh: 仿摊一半一半时，你有一半早晨碰上得 0，一半错开得 3。停左和停右平均一样。所以你愿意混合。仿摊面对的是同一笔账。
  zh_hk: 仿攤一半一半嗰陣，你有一半朝早碰上得 0，一半錯開得 3。停左同停右平均一樣。所以你愿意混合。仿攤面對嘅係同一筆賬。
- id: example
  visual: example
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Three out of four is exploitable
  title_zh: 四个里三个会被钻空子
  title_zh_hk: 四個入面三個會被鑽空位
  setup_en: You sit Left three mornings out of four.
  setup_zh: 你四个早晨里三个停左。
  setup_zh_hk: 你四個朝早入面三個停左。
  result_en: The copycat sits Left every morning and steals those three.
  result_zh: 仿摊天天停左，把那三个早晨抢走。
  result_zh_hk: 仿攤日日停左，將嗰三個朝早搶走。
  en: Sit Left three mornings out of four. The copycat sits Left every morning and steals those three. Your mix was not a best response to theirs. Half and half is the mix they cannot lock onto.
  zh: 四个早晨里三个停左。仿摊天天停左，把那三个抢走。你的混合不是对他们混合的最优反应。一半一半，才是他们对不准的混合。
  zh_hk: 四個朝早入面三個停左。仿攤日日停左，將嗰三個搶走。你嘅混合唔係對佢哋混合嘅最佳回應。一半一半，先至係佢哋對唔準嘅混合。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Mutual best response, as mixes
  title_zh: 还是彼此的最优反应
  title_zh_hk: 都係彼此嘅最佳回應
  q1_en: Mixed Nash is mutual best response.
  q1_zh: 混合纳什仍是彼此的最优反应。
  q1_zh_hk: 混合納什都仲係彼此嘅最佳回應。
  q2_en: On this path, that mix is half and half.
  q2_zh: 这条路上，那个混合是一半一半。
  q2_zh_hk: 呢條路上面，嗰個混合係一半一半。
  en: Keep the old sentence. Nash is mutual best response. Here the answers are mixes. Next we close. The table picked a share when it could not pick a cell.
  zh: 留下那句老话。纳什就是彼此的最优反应。这里的答案是混合。接下来收住。表选不出一格时，选出了一个份额。
  zh_hk: 留低嗰句舊話。納什就係彼此嘅最佳回應。呢度嘅答案係混合。跟住收住。張表揀唔出一格嗰陣，揀咗一個份額。
