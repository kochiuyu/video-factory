id: GAME-M05-MN
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 128
title_en: A mix the copycat cannot exploit
title_zh: 仿摊钻不到空子的混合
title_zh_hk: 仿攤鑽唔到空位嘅混合
objective_en: Half and half on both sides is mixed Nash. Each mix makes the other willing to mix.
objective_zh: 两边都一半一半，就是混合纳什。各自的混合让对方也愿意混合。
objective_zh_hk: 兩邊都一半一半，就係混合納什。各自嘅混合等對方都愿意混合。
glossary:
- en: mixed strategy Nash
  zh: 混合策略纳什均衡
  zh_hk: 混合策略納什均衡
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Why is half and half Nash here?
  zh: 为什么这里一半一半是纳什？
  zh_hk: 點解呢度一半一半係納什？
  answer_en: Against half, Left and Right pay the same, so neither wants a pure side.
  answer_zh: 对着一半，停左和停右一样赚，谁也不想改成纯的一侧。
  answer_zh_hk: 對住一半，停左同停右一樣賺，邊個都唔想改成純嘅一側。
- id: Q2
  type: transfer
  en: You sit Left three mornings out of four. Can that be Nash?
  zh: 你四个早晨里三个停左。这能是纳什吗？
  zh_hk: 你四個朝早入面三個停左。呢樣可唔可以係納什？
  answer_en: No. The copycat would sit Left every morning and steal those three.
  answer_zh: 不能。仿摊会天天停左，把那三个早晨抢走。
  answer_zh_hk: 唔得。仿攤會日日停左，將嗰三個朝早搶走。
beats:
- id: hook
  visual: title_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Make the copycat willing to mix
  title_zh: 让仿摊也愿意混合
  title_zh_hk: 等仿攤都愿意混合
  en: You already know how to answer one mix. Now both of you mix. Ask whether either of you still wants a pure side. If neither does, the pair of mixes is Nash.
  zh: 你已经会回答一个混合。现在两边都混合。问还有没有人想改成纯的一侧。如果都没有，这一对混合就是纳什。
  zh_hk: 你已經會回答一個混合。而家兩邊都混合。問仲有冇人想改成純嘅一側。若都冇，呢一對混合就係納什。
- id: define
  visual: definition_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Mixed Nash
  title_zh: 混合纳什
  title_zh_hk: 混合納什
  formula: Each mix is a best response to the other mix
  formula_en: Each mix is a best response to the other mix
  formula_zh: 彼此的混合都是对方混合的最优反应
  formula_zh_hk: 彼此嘅混合都係對方混合嘅最佳回應
  gloss_en: Same sentence as before. The objects are mixes.
  gloss_zh: 还是上一单元那一句。对象换成了混合。
  gloss_zh_hk: 都係上一單元嗰一句。對象換咗做混合。
  en: Here is the idea. A pair of mixes is Nash when each is a best response to the other. On this path that happens when both use half and half. Then neither side pays more, so neither wants a pure side.
  zh: 核心就这一句。一对混合彼此都是对方的最优反应，就是纳什。这条路上，两边都一半一半时就是。两侧一样赚，谁也不想改成纯的一侧。
  zh_hk: 核心就呢一句。一對混合彼此都係對方嘅最佳回應，就係納什。呢條路，兩邊都一半一半嗰陣就係。兩側一樣賺，邊個都唔想改成純嘅一側。
