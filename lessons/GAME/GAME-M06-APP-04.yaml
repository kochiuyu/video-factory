id: GAME-M06-APP-04
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 120
title_en: An audit that cannot sit still
title_zh: 坐不住的抽查
title_zh_hk: 坐唔住嘅抽查
objective_en: Audit versus skip is the copycat table. No cell is Nash. Mix the mornings.
objective_zh: 抽查对偷懒，就是仿摊那张表。没有一格是纳什。把早晨混起来。
objective_zh_hk: 抽查對偷懶，就係仿攤嗰張表。冇一格係納什。將朝早撈埋。
glossary:
- en: mixed strategy
  zh: 混合策略
  zh_hk: 混合策略
  lock: true
quiz:
- id: Q1
  type: transfer
  en: A shop can clean or skip. An inspector can visit or stay. What tool first?
  zh: 店可以洗或偷懒。检查员可以来或留在办公室。先用哪样工具？
  zh_hk: 店可以洗定偷懶。檢查員可以嚟定留喺辦公室。先用邊樣工具？
  answer_en: Check every cell. If someone always wants to move, mix.
  answer_zh: 先逐格看。每一格都有人想动，就混合。
  answer_zh_hk: 先逐格睇。每一格都有人想郁，就混合。
- id: Q2
  type: transfer
  en: Why is visit every morning a bad mix?
  zh: 为什么天天来抽查是坏的混合？
  zh_hk: 點解日日嚟抽查係壞嘅混合？
  answer_en: The shop will clean every morning. The inspector's time is wasted.
  answer_zh: 店会天天洗。检查员的时间被耗掉。
  answer_zh_hk: 店會日日洗。檢查員嘅時間被耗掉。
beats:
- id: hook
  visual: title_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Visit, or skip
  title_zh: 来，还是不来
  title_zh_hk: 嚟，定唔嚟
  en: A shop can Clean or Skip the wash. An inspector can Visit or Stay in. If the inspector sits still on one side, the shop locks onto the other. That is the copycat table.
  zh: 店可以认真洗，也可以偷懒。检查员可以来，也可以留在办公室。检查员天天停在一侧，店就对准另一侧。这就是仿摊那张表。
  zh_hk: 店可以認真洗，亦可以偷懶。檢查員可以嚟，亦可以留喺辦公室。檢查員日日停一側，店就對準另一側。呢個就係仿攤嗰張表。
- id: define
  visual: definition_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: No cell sits still
  title_zh: 没有一格坐得住
  title_zh_hk: 冇一格坐得住
  formula: If they visit every day, the shop cleans. If they never visit, the shop skips.
  formula_en: If they visit every day, the shop cleans. If they never visit, the shop skips.
  formula_zh: 天天来，店就洗。永不来，店就偷懒。
  formula_zh_hk: 日日嚟，店就洗。永不嚟，店就偷懶。
  gloss_en: Someone wants to move from every cell.
  gloss_zh: 每一格都有人想动。
  gloss_zh_hk: 每一格都有人想郁。
  en: Here is the idea. Visit every day, and the shop cleans, so the visit was wasted. Never visit, and the shop skips. Clean when they stay, skip when they visit. No cell is mutual best response.
  zh: 核心就这一句。天天来，店就洗，这一趟就浪费了。永不来，店就偷懒。他们留着，你洗；他们来了，你偷懒。没有一格是彼此的最优反应。
  zh_hk: 核心就呢一句。日日嚟，店就洗，呢一轉就浪費咗。永不嚟，店就偷懶。佢哋留住，你洗；佢哋嚟咗，你偷懶。冇一格係彼此嘅最佳回應。
- id: example
  visual: example
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Mix the visits
  title_zh: 把抽查混起来
  title_zh_hk: 將抽查撈埋
  setup_en: Visit some mornings. Stay in the rest.
  setup_zh: 有些早晨来。其余留在办公室。
  setup_zh_hk: 有啲朝早嚟。其餘留喺辦公室。
  result_en: The shop cannot lock onto Stay. That is the mix.
  result_zh: 店对不准“不来”。这就是混合。
  result_zh_hk: 店對唔準「唔嚟」。呢個就係混合。
  en: Visit some mornings and stay the rest. The shop cannot lock onto Stay. A random sale, or a random tax check, uses the same share of mornings. Not a third policy.
  zh: 有些早晨来，其余不来。店对不准“不来”。随机促销，或随机税检，用的是同一份早晨的份额。不是第三种政策。
  zh_hk: 有啲朝早嚟，其餘唔嚟。店對唔準「唔嚟」。隨機促銷，或隨機稅檢，用嘅係同一份朝早嘅份額。唔係第三種政策。
- id: compare
  visual: two_column
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Security, and promo
  title_zh: 安保，和促销
  title_zh_hk: 安保，同促銷
  left_en: A guard who walks the same aisle every hour is the copycat's gift.
  left_zh: 保安每个小时走同一条通道，就是仿摊的礼物。
  left_zh_hk: 保安每個鐘行同一條通道，就係仿攤嘅禮物。
  right_en: A shop that discounts every Friday trains customers to wait.
  right_zh: 店每周五都打折，是在教客人等。
  right_zh_hk: 店每個禮拜五都減價，係喺度教客人等。
  en: A guard on one aisle every hour, or a discount every Friday, is Left every morning. The other side locks on. Mix the aisle. Mix the Friday. That is half and half at work.
  zh: 每个小时同一条通道的保安，或每个周五的折扣，就是天天停左。对面会对准。把通道混起来。把周五混起来。这就是上班时的一半一半。
  zh_hk: 每個鐘同一條通道嘅保安，或每個禮拜五嘅折扣，就係日日停左。對面會對準。將通道撈埋。將禮拜五撈埋。呢個就係返工嗰陣嘅一半一半。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Mix when no cell sits
  title_zh: 没有一格坐得住，就混合
  title_zh_hk: 冇一格坐得住，就混合
  q1_en: Audit versus skip has no pure Nash.
  q1_zh: 抽查对偷懒，没有纯策略纳什。
  q1_zh_hk: 抽查對偷懶，冇純策略納什。
  q2_en: A share of mornings is the tool.
  q2_zh: 工具是早晨的份额。
  q2_zh_hk: 工具係朝早嘅份額。
  en: If every cell moves, do not look for shade. Mix the mornings. Next we close the mini-course on one checklist.
  zh: 每一格都在动，就不要找荫。把早晨混起来。接下来用一张清单收住这门小课。
  zh_hk: 每一格都喺度郁，就唔好搵蔭。將朝早撈埋。跟住用一張清單收住呢門小課。
