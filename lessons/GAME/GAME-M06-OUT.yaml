id: GAME-M06-OUT
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 48
title_en: Which tool first
title_zh: 先拿哪样工具
title_zh_hk: 先攞邊樣工具
objective_en: Close the mini-course. Write the table. Delete, or mark Nash, or look for a label, or mix.
objective_zh: 收住这门小课。先写表。能删就删，否则标纳什，再找标签，再混合。
objective_zh_hk: 收住呢門小課。先寫表。能刪就刪，否則標納什，再搵標籤，再混合。
glossary:
- en: payoff table
  zh: 报酬表
  zh_hk: 報酬表
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What is the first move at work?
  zh: 上班时第一步是什么？
  zh_hk: 返工嗰陣第一步係咩？
  answer_en: Write players, strategies, and payoffs on one page.
  answer_zh: 把参与人、策略和报酬写在一页上。
  answer_zh_hk: 將參與人、策略同報酬寫喺一頁上面。
- id: Q2
  type: comprehension
  en: In what order do you reach for tools?
  zh: 按什么顺序伸手拿工具？
  zh_hk: 按咩順序伸手攞工具？
  answer_en: Delete if you can. Then Nash. Then a label. Then a mix.
  answer_zh: 能删就删。然后纳什。然后标签。然后混合。
  answer_zh_hk: 能刪就刪。然後納什。然後標籤。然後混合。
beats:
- id: hook
  visual: module_close
  seconds: 24
  kicker: This unit
  kicker_en: This unit
  kicker_zh: 这一单元
  kicker_zh_hk: 呢一單元
  title_en: Which tool first
  title_zh: 先拿哪样工具
  title_zh_hk: 先攞邊樣工具
  claim_en: Write the table. Delete. Mark. Tip. Mix.
  claim_zh: 写表。删。标。推。混。
  claim_zh_hk: 寫表。刪。標。推。撈。
  next_en: The one-shot path is done. Tomorrow is another course.
  next_zh: 只玩一次的路走到这里。明天是另一门课。
  next_zh_hk: 淨玩一次嘅路行到呢度。聽日係另一門課。
  en: Look back. Two shops cutting price. Two plugs. One slot. An audit that cannot sit still. Same tools as the path. Write the table first. Then ask which tool.
  zh: 再看一遍。两家店降价。两只插头。一个名额。一次坐不住的抽查。和路上同一套工具。先写表。再问用哪样。
  zh_hk: 再睇一遍。兩間店減價。兩隻插頭。一個名額。一次坐唔住嘅抽查。同路上同一套工具。先寫表。再問用邊樣。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This unit
  kicker_en: This unit
  kicker_zh: 这一单元
  kicker_zh_hk: 呢一單元
  title_en: One page, then a tool
  title_zh: 一页纸，再一样工具
  title_zh_hk: 一頁紙，再一樣工具
  q1_en: Both sides see the table. Neither sees the other board first.
  q1_zh: 两边看见同一张表。谁也没先看见对面的牌。
  q1_zh_hk: 兩邊見到同一張表。邊個都未先見到對面嘅牌。
  q2_en: Delete, mark, tip, mix.
  q2_zh: 删，标，推，混。
  q2_zh_hk: 刪，標，推，撈。
  en: That is all I need you to take from this mini-course. One page. Then a tool. The carts were only how we learned to read.
  zh: 这门小课我只要你带走这一点。一页纸。再一样工具。咖啡车只是我们用来读表的那一页。
  zh_hk: 呢門小課我淨要你帶走呢樣。一頁紙。再一樣工具。咖啡車淨係我哋用嚟讀表嗰一頁。
