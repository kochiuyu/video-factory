id: GAME-PD-01
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 120
title_en: The prisoner's dilemma
title_zh: 囚徒困境
title_zh_hk: 囚徒困境
objective_en: Name this cart table. Both want High and High. Each is tempted to cut. That is the prisoner's dilemma.
objective_zh: 给这张咖啡车表取名。两车都想高对高。每辆又想降价。这就叫囚徒困境。
objective_zh_hk: 俾呢張咖啡車表改名。兩架都想貴對貴。每架又想減價。呢個就叫囚徒困境。
glossary:
- en: prisoner's dilemma
  zh: 囚徒困境
  zh_hk: 囚徒困境
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What cell do both carts prefer together?
  zh: 两辆车一起更想停在哪一格？
  zh_hk: 兩架車一齊更想停邊一格？
  answer_en: High and High. Each takes three.
  answer_zh: 高价对高价。各带走三。
  answer_zh_hk: 貴對貴。各袋走三。
- id: Q2
  type: comprehension
  en: Why is the path already a prisoner's dilemma?
  zh: 为什么这条路已经是囚徒困境？
  zh_hk: 點解呢條路已經係囚徒困境？
  answer_en: Both want High and High, and each is tempted to undercut.
  answer_zh: 两车都想高对高，每辆又想抢先降价。
  answer_zh_hk: 兩架都想貴對貴，每架又想搶先減價。
beats:
- id: hook
  visual: title_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: This table already has a name
  title_zh: 这张表已经有名字
  title_zh_hk: 呢張表已經有名
  en: Stay on the path. Same two carts. Same High and Low. Same numbers. This table already has a name in the book. We are not starting a new game. We are naming the one we have.
  zh: 还站在这条路上。还是两辆车。还是高价和低价。还是那些数字。这张表在书里已经有名字。我们不是新开一局。是给眼前这一局取名。
  zh_hk: 仲企喺呢條路。都係兩架車。都係貴同平。都係嗰啲數字。呢張表喺書度已經有名。我哋唔係新開一局。係俾眼前呢一局改名。
- id: define
  visual: definition_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Both want High, each wants to cut
  title_zh: 都想标高价，又都想降
  title_zh_hk: 都想標貴，又都想減
  formula: Both prefer High and High. Each is tempted to undercut.
  formula_en: Both prefer High and High. Each is tempted to undercut.
  formula_zh: 两车都更想高对高。每辆又想抢先降价。
  formula_zh_hk: 兩架都更想貴對貴。每架又想搶先減價。
  gloss_en: That pattern is the prisoner's dilemma.
  gloss_zh: 这种形状就叫囚徒困境。
  gloss_zh_hk: 呢種形狀就叫囚徒困境。
  en: Here is the idea. Both carts take home more at High and High than at Low and Low. Each cart still wants to cut if the other stays High. That tug is the prisoner's dilemma. The two rooms in the book are the same shape.
  zh: 核心就这一句。高对高，两车带走的都比低对低多。可是对面一标高价，自己就想降。这种拉扯就叫囚徒困境。书里那两间房，只是同一形状。
  zh_hk: 核心就呢一句。貴對貴，兩架袋走嘅都比平對平多。但對面一標貴，自己就想減。呢種拉扯就叫囚徒困境。書裏面嗰兩間房，淨係同一形狀。
- id: compare
  visual: two_column
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Together, or alone
  title_zh: 一起，还是自己
  title_zh_hk: 一齊，定自己
  left_en: Both High. Each takes three.
  left_zh: 都卖高价。各带走三。
  left_zh_hk: 都賣貴。各袋走三。
  right_en: You cut, they stay High. You take five. They take zero.
  right_zh: 你降、对面仍卖高价。你带走五。对面带走零。
  right_zh_hk: 你減、對面仲賣貴。你袋走五。對面袋走零。
  en: Together they want High and High. Alone, each is tempted to cut and take five while the other takes zero. Customers walk to the cheaper board. That is the same morning we already wrote down.
  zh: 一起，两车都想高对高。单独看，每辆都想降价拿走五，让对面拿零。客人走向更便宜的牌子。还是我们已经写过的那个早晨。
  zh_hk: 一齊，兩架都想貴對貴。單獨睇，每架都想減價攞走五，等對面攞零。客人行去平啲嗰塊牌。都係我哋已經寫過嗰個朝早。
- id: example
  visual: example
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Two rooms, same table
  title_zh: 两间房，同一张表
  title_zh_hk: 兩間房，同一張表
  setup_en: The book puts two partners in two rooms. Silent or Talk.
  setup_zh: 书里把两个同伙分开关着。沉默或招供。
  setup_zh_hk: 書度將兩個同夥分開關住。沉默定招供。
  result_en: High is Silent. Low is Talk. Same numbers.
  result_zh: 高价就是沉默。低价就是招供。数字一样。
  result_zh_hk: 貴就係沉默。平就係招供。數字一樣。
  en: The book puts two partners in two rooms. Silent or Talk. Map it once. High is Silent. Low is Talk. We will not switch numbers. Next we solve this same table and say why both end on Low.
  zh: 书里把两个同伙分开关着。沉默或招供。对照一次就够。高价就是沉默。低价就是招供。我们不换数字。接下来解同一张表，说明为什么都停在低价。
  zh_hk: 書度將兩個同夥分開關住。沉默定招供。對一次就夠。貴就係沉默。平就係招供。我哋唔換數字。跟住解同一張表，講明點解都停喺平。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: One table, one name
  title_zh: 一张表，一个名字
  title_zh_hk: 一張表，一個名
  q1_en: Both carts prefer High and High.
  q1_zh: 两车都更想高对高。
  q1_zh_hk: 兩架都更想貴對貴。
  q2_en: Each is tempted to undercut.
  q2_zh: 每辆又想抢先降价。
  q2_zh_hk: 每架又想搶先減價。
  en: Keep one table. Both prefer High and High. Each is tempted to cut. That is all the name prisoner's dilemma means here. Next we solve it with the dominance we already have.
  zh: 只留一张表。两车都更想高对高。每辆又想降。这里说的囚徒困境，就这一个意思。接下来用已经有的占优解它。
  zh_hk: 淨留一張表。兩架都更想貴對貴。每架又想減。呢度講嘅囚徒困境，就呢一個意思。跟住用已經有嘅佔優解佢。
