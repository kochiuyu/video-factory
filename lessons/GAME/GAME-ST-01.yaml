id: GAME-ST-01
course: game
course_en: Game Theory
course_zh: 博弈论
course_zh_hk: 博弈論
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 96
title_en: High or Low on the board
title_zh: 牌子上是高价还是低价
title_zh_hk: 牌上面係貴定平
objective_en: A strategy is High or Low. That is what this game allows you to post. Be aggressive is not a strategy here.
objective_zh: 策略就是高价或低价。那是这局允许你标上去的东西。再凶一点，这里不算策略。
objective_zh_hk: 策略就係貴定平。嗰啲係呢一局准你標上去嘅嘢。再惡少少，呢度唔算策略。
glossary:
- en: strategy
  zh: 策略
  zh_hk: 策略
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What is a strategy in this game?
  zh: 这一局里，策略是什么？
  zh_hk: 呢一局，策略係咩？
  answer_en: High or Low. What this game allows you to post. Not a mood.
  answer_zh: 高价或低价。这局允许你标上去的东西。不是一种脾气。
  answer_zh_hk: 貴定平。呢一局准你標上去嘅嘢。唔係一種脾氣。
- id: Q2
  type: transfer
  en: A vendor says I will match whatever they do. Is that a strategy here?
  zh: 摊主说他们怎样我怎样。这里算策略吗？
  zh_hk: 檔主話佢點我點。呢度算唔算策略？
  answer_en: No. Each cart posts High or Low without seeing the other board.
  answer_zh: 不算。每辆车要在看不见对面牌子时就标高价或低价。
  answer_zh_hk: 唔算。每架車要喺睇唔到對面牌嗰陣就標貴定平。
beats:
- id: hook
  visual: title_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: A strategy, not a personality
  title_zh: 是策略，不是性格
  title_zh_hk: 係策略，唔係性格
  en: We know the players. Cart A and Cart B. Now name the strategies. Be aggressive does not tell a customer which number is written there. High does. Low does. A strategy has to be something you can actually post.
  zh: 参与人我们已经知道了。甲和乙。现在点出策略。再凶一点，客人看不出牌子上是哪个数。高价能看出来。低价也能看出来。策略必须是你真正能标上去的东西。
  zh_hk: 參與人我哋已經知。甲同乙。而家點出策略。再惡少少，客人睇唔出牌上面係邊個數。貴睇得出。平都睇得出。策略一定要係你真正標得上去嘅嘢。
- id: define
  visual: definition_card
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: A strategy this morning allows
  title_zh: 今天早上允许的策略
  title_zh_hk: 今朝准用嘅策略
  formula: A strategy is what this game allows you to post
  formula_en: A strategy is what this game allows you to post
  formula_zh: 策略是这局允许你标上去的东西
  formula_zh_hk: 策略係呢一局准你標上去嘅嘢
  gloss_en: If it is not on the list, it is not a strategy here.
  gloss_zh: 清单上没有的，这里就不算策略。
  gloss_zh_hk: 清單冇嘅，呢度就唔算策略。
  en: Here is the idea. A strategy is what this morning already allows you to post. No peeking at the other board. No third price at the last second. No speech to the queue instead of a number. If it is not on the list, it is not a strategy here.
  zh: 核心就这一句。策略是今天早上这局已经允许你标上去的东西。不能偷看对面的牌子。不能最后一秒再标一个价。也不能靠对队伍讲话代替数字。清单上没有的，这里就不算策略。
  zh_hk: 核心就呢一句。策略係今朝呢一局已經准你標上去嘅嘢。唔可以偷睇對面塊牌。唔可以最後一秒再標多一個價。亦唔可以靠同隊講話代替數字。清單冇嘅，呢度就唔算策略。
- id: steps
  visual: steps
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: Write the list
  title_zh: 先把清单写下来
  title_zh_hk: 先將清單寫低
  step1_en: List every legal move.
  step1_zh: 能做的都写上。
  step1_zh_hk: 做得嘅全部寫上。
  step2_en: Keep only what this game allows.
  step2_zh: 只留这局允许的。
  step2_zh_hk: 淨留呢一局准用嘅。
  step3_en: Cross out slogans that are not on the list.
  step3_zh: 清单上没有的口号，划掉。
  step3_zh_hk: 清單冇嘅口號，劃走。
  en: Write the list before the customers arrive. Keep only what this morning allows, and cross out the slogans. For each cart that list is High or Low. Nothing else is on the board. That gives four pairs.
  zh: 客人还没到，先把清单写下来。只留今天早上允许的，口号划掉。每辆车的清单都是高价或低价。牌子上没有别的。这样一共四对。
  zh_hk: 客人都未到，先將清單寫低。淨留今朝准用嘅，口號劃走。每架車張清單都係貴定平。牌上面冇第樣。噉樣合共四對。
- id: takeaway
  visual: takeaway
  seconds: 24
  kicker: This part
  kicker_en: This part
  kicker_zh: 这一部分
  kicker_zh_hk: 呢一部分
  title_en: High or Low, or just talk
  title_zh: 高价或低价，还是说说而已
  title_zh_hk: 貴定平，定講吓就算
  q1_en: Is this phrase High or Low?
  q1_zh: 这句话是高价还是低价？
  q1_zh_hk: 呢句係貴定平？
  q2_en: If not, did I change the game?
  q2_zh: 如果都不是，我是不是换局了？
  q2_zh_hk: 若都唔係，我係咪換咗局？
  en: Before you keep a phrase, ask whether it is High or Low. If it is not, you changed the game. Keep the list short on purpose. Next we put those four pairs on the payoff table.
  zh: 留下一句话之前，先问它是高价还是低价。都不是，你就换局了。清单短，是故意的。接下来把这四对放进报酬表。
  zh_hk: 留低一句之前，先問佢係貴定平。都唔係，你就換咗局。清單短，係特登。跟住將呢四對放入報酬表。
