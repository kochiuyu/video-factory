course_zh: 粤港澳大湾区
course_zh_hk: 粵港澳大灣區
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 146
title_en: Financial Services
title_zh: 金融服务
title_zh_hk: 金融服務
objective_en: 'Second step of the crossing unit: listing, banking, and payments sit under different
  GBA doors.'
objective_zh: 过关单元的第二步：上市、银行、支付，走的是大湾区不同的门。
objective_zh_hk: 過關單元的第二步：上市、銀行、支付，走的是大灣區不同的門。
glossary:
- en: financial services
  zh: 金融服务
  zh_hk: 金融服務
  lock: true
