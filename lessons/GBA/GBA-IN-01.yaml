id: GBA-IN-01
course: gba
course_en: Greater Bay Area
course_zh: 粤港澳大湾区
course_zh_hk: 粵港澳大灣區
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 160
title_en: Innovation Cluster
title_zh: 创新集群
title_zh_hk: 創新集群
objective_en: 'Close the production unit: a cluster is shared people and suppliers, not two labs on
  the same map.'
objective_zh: 收住生产单元：集群是共用的人和配套，不是地图上的两间实验室。
objective_zh_hk: 收住生產單元：集群是共用的人和配套，不是地圖上的兩間實驗室。
glossary:
- en: cluster
  zh: 集群
  zh_hk: 集群
  lock: true
- en: spillover
  zh: 外溢
  zh_hk: 外溢
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: What makes nearby firms a cluster?
  zh: 是什么让邻近的企业成为集群？
  zh_hk: 是什麼讓鄰近的企業成為集群？
  answer_en: Shared specialised people, parts, or ideas that they actually use.
  answer_zh: 他们真正共用的专业化人才、零件或想法。
  answer_zh_hk: 他們真正共用的專業化人才、零件或想法。
- id: Q2
  type: transfer
  en: Two GBA cities both host start-up fairs once a year. Is that enough to call them one cluster?
  zh: 两座大湾区城市每年各办一次创业展。这足以称它们为同一个集群吗？
  zh_hk: 兩座大灣區城市每年各辦一次創業展。這足以稱它們為同一個集群嗎？
  answer_en: No. Look for routine sharing of people and suppliers between fairs.
  answer_zh: 不足够。要看展会之间是否日常共享人才和配套。
  answer_zh_hk: 不足夠。要看展會之間是否日常共享人才和配套。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Innovation Cluster
  title_zh: 创新集群
  title_zh_hk: 創新集群
  en: A chain of steps is not yet a cluster. Putting two labs on the same map does not make them one.
    They have to use the same people, parts, or ideas.
  zh: 一串步骤还不是集群。把两间实验室放在同一张地图上，也不会自动变成一个集群。它们得共用同一批人、零件或想法。
  zh_hk: 一串步驟還不是集群。把兩間實驗室放在同一張地圖上，也不會自動變成一個集群。它們得共用同一批人、零件或想法。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Shared thick market
  title_zh: 共享的厚市场
  title_zh_hk: 共享的厚市場
  formula: Cluster = nearby firms + shared inputs
  formula_en: Cluster = nearby firms + shared inputs
  formula_zh: 集群 = 邻近企业 + 共用投入
  formula_zh_hk: 集群 = 鄰近企業 + 共用投入
  gloss_en: A spillover is an idea that travels without a invoice.
  gloss_zh: 外溢是没有发票也能传走的想法。
  gloss_zh_hk: 外溢是沒有發票也能傳走的想法。
  en: An innovation cluster is a thick local market for specialised people, parts, and ideas. Firms
    locate near each other so a spare engineer or a spare component is easier to find.
  zh: 创新集群是专业化人才、零件和想法的厚本地市场。企业靠近，是为了更容易找到多余的工程师或多余的零件。
  zh_hk: 創新集群是專業化人才、零件和想法的厚本地市場。企業靠近，是為了更容易找到多餘的工程師或多餘的零件。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Campus and factory
  title_zh: 校园与工厂
  title_zh_hk: 校園與工廠
  left_en: Lab on a Hong Kong campus
  left_zh: 香港校园里的实验室
  left_zh_hk: 香港校園裏的實驗室
  right_en: Prototype shop across the river
  right_zh: 河对岸的样品车间
  right_zh_hk: 河對岸的樣品車間
  en: A student team can design a device on campus and send the drawing to a nearby prototype shop.
    The cluster works if that trip is routine. A one-off visit is not a cluster.
  zh: 学生团队可以在校园里设计装置，再把图纸送到附近的样品车间。若这一趟已成日常，集群才算在工作。一次性拜访不是集群。
  zh_hk: 學生團隊可以在校園裏設計裝置，再把圖紙送到附近的樣品車間。若這一趟已成日常，集群才算在工作。一次性拜訪不是集群。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: Near and shared
  title_zh: 靠近并且共用
  title_zh_hk: 靠近並且共用
  formula: Cluster = nearby firms + shared inputs
  formula_en: Cluster = nearby firms + shared inputs
  formula_zh: 集群 = 邻近企业 + 共用投入
  formula_zh_hk: 集群 = 鄰近企業 + 共用投入
  gloss_en: A logo wall is not a cluster.
  gloss_zh: 一面标志墙不是集群。
  gloss_zh_hk: 一面標誌牆不是集群。
  en: An innovation cluster is firms close enough to share people, labs, and suppliers. If they only
    share a postcode on a brochure, it is marketing.
  zh: 创新集群是近到可以共用人员、实验室和供应商的企业。若它们只在册子上共用邮编，那就是营销。
  zh_hk: 創新集群是近到可以共用人員、實驗室和供應商的企業。若它們只在冊子上共用郵編，那就是營銷。
- id: shares
  visual: three_column
  seconds: 16
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: What they actually share
  title_zh: 他们真正共用什么
  title_zh_hk: 他們真正共用什麼
  col1_en: People
  col1_zh: 人员
  col1_zh_hk: 人員
  col2_en: Labs and tools
  col2_zh: 实验室和工具
  col2_zh_hk: 實驗室和工具
  col3_en: A specialised supplier
  col3_zh: 专门供应商
  col3_zh_hk: 專門供應商
  en: 'People moving jobs, a machine that several firms book, and a supplier who only exists because
    the cluster exists: those are the tests.'
  zh: 人员换工作、几家企业预约的机器、以及因为集群才存在的供应商：这些才是检验。
  zh_hk: 人員換工作、幾家企業預約的機器、以及因為集群才存在的供應商：這些才是檢驗。
- id: lab
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A booked instrument
  title_zh: 一台被预约的仪器
  title_zh_hk: 一台被預約的儀器
  setup_en: No single firm owns the hours
  setup_zh: 没有一家独占机时
  setup_zh_hk: 沒有一家獨占機時
  result_en: Three firms live off the queue
  result_zh: 三家靠这队列活
  result_zh_hk: 三家靠這隊列活
  en: The spectrometer is booked solid. That queue is the cluster working. A neighbouring empty tower
    with a slogan is not the same object.
  zh: 光谱仪被订满。那条队列就是集群在工作。隔壁空楼加一句口号，不是同一个东西。
  zh_hk: 光譜儀被訂滿。那條隊列就是集群在工作。隔壁空樓加一句口號，不是同一個東西。
- id: policy
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Build versus label
  title_zh: 建设对贴牌
  title_zh_hk: 建設對貼牌
  left_en: Fund the shared tool
  left_zh: 资助共用工具
  left_zh_hk: 資助共用工具
  right_en: Print a district name
  right_zh: 印一个区名
  right_zh_hk: 印一個區名
  en: Money on a shared tool can create the input. Money on a gate sign cannot. Ask what a new firm
    could borrow on week one.
  zh: 钱投在共用工具上，可以造出投入。钱投在大门招牌上，不能。问新企业第一周能借到什么。
  zh_hk: 錢投在共用工具上，可以造出投入。錢投在大門招牌上，不能。問新企業第一週能借到什麼。
- id: audit
  visual: steps
  seconds: 18
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Audit a cluster claim
  title_zh: 审计一则集群说法
  title_zh_hk: 審計一則集群說法
  step1_en: List firms within a short trip
  step1_zh: 列出短途内的企业
  step1_zh_hk: 列出短途內的企業
  step2_en: Name one shared input
  step2_zh: 说出一项共用投入
  step2_zh_hk: 說出一項共用投入
  step3_en: See if a newcomer can use it
  step3_zh: 看新来者能否使用
  step3_zh_hk: 看新來者能否使用
  en: If you cannot name the shared input, you do not have a cluster yet. You have neighbours. Neighbours
    are cheaper to photograph than to build.
  zh: 若你说不出共用投入，你还没有集群。你只有邻居。邻居比建设更便宜，也更好拍照。
  zh_hk: 若你說不出共用投入，你還沒有集群。你只有鄰居。鄰居比建設更便宜，也更好拍照。
- id: near
  visual: big_number
  seconds: 14
  kicker: Number
  kicker_en: Number
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: Close enough to walk
  title_zh: 近到可以走过去
  title_zh_hk: 近到可以走過去
  unit_en: minutes
  unit_zh: 分钟
  unit_zh_hk: 分鐘
  caption_en: Beyond that, sharing thins out.
  caption_zh: 再远，共用就会变薄。
  caption_zh_hk: 再遠，共用就會變薄。
  number: 15
  en: Fifteen minutes is a working test, not magic. When the trip exceeds a coffee, people stop dropping
    by the lab. Distance is the tax on a cluster.
  zh: 十五分钟是工作检验，不是魔法。路程超过一杯咖啡，人们就不再顺路去实验室。距离是集群上的税。
  zh_hk: 十五分鐘是工作檢驗，不是魔法。路程超過一杯咖啡，人們就不再順路去實驗室。距離是集群上的稅。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Count the shared inputs
  title_zh: 数一数共享的投入
  title_zh_hk: 數一數共享的投入
  q1_en: Which people or parts do both sides use?
  q1_zh: 两边共同使用哪些人或零件？
  q1_zh_hk: 兩邊共同使用哪些人或零件？
  q2_en: How often do they actually meet?
  q2_zh: 他们实际多久见一次？
  q2_zh_hk: 他們實際多久見一次？
  en: 'A cluster is a habit of reuse. If the only link is a press release, the map is ahead of the
    work. Next sitting prices the crossing: paperwork, finance doors, and a second rule book.'
  zh: 集群是一种重复使用的习惯。若唯一的联系是新闻稿，地图就走在工作前面。下一单元给“跨过去”标价：文件、金融门槛，以及第二套规则。
  zh_hk: 集群是一種重複使用的習慣。若唯一的聯繫是新聞稿，地圖就走在工作前面。下一單元給「跨過去」標價：文件、金融門檻，以及第二套規則。
