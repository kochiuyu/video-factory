objective_en: Name the GBA, put a clock on a crossing, then say which factor — and which person —
  can actually move.
objective_zh: 给大湾区起名，给通道加上钟，再说哪种要素、哪个人真正过得去。
objective_zh_hk: 給大灣區起名，給通道加上鐘，再說哪種要素、哪個人真正過得去。
