- id: Q1
  type: comprehension
  en: Which four layers does this sitting put on the GBA?
  zh: 这一讲给大湾区叠哪四层？
  zh_hk: 這一講給大灣區疊哪四層？
  answer_en: The city list, the clock on a crossing, the factor, then the person.
  answer_zh: 城市名单、通道上的钟、要素，然后是人。
  answer_zh_hk: 城市名單、通道上的鐘、要素，然後是人。
