  en: You can name the cities, count door-to-door time, separate the factors, and treat a job move
    as a permit plus a wage.
  zh: 你能说出城市，数门到门的时间，分开要素，并把换工作看成许可加工资。
  zh_hk: 你能說出城市，數門到門的時間，分開要素，並把換工作看成許可加工資。
