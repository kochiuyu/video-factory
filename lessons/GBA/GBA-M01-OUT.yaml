quiz:
- id: Q1
  type: comprehension
  en: Why is a short commute not one labour market?
  zh: 为什么通勤短不等于一个劳动力市场？
  zh_hk: 為什麼通勤短不等於一個勞動力市場？
  answer_en: A licence and a contract still have to travel.
  answer_zh: 牌照和合同还是要过关。
  answer_zh_hk: 牌照和合同還是要過關。
