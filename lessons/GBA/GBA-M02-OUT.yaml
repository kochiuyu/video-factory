- id: hook
  visual: module_close
  seconds: 14
  kicker: Close
  kicker_en: Close
  kicker_zh: 收束
  kicker_zh_hk: 收束
  title_en: The work, closed
  title_zh: 活，先说到这里
  title_zh_hk: 活，先說到這裏
  en: You can assign the lower-cost city, mark the step that can stop the chain, and refuse a cluster
    that exists only on a press release.
  zh: 你能把任务交给机会成本更低的城，标出能让链条停住的那一步，并拒绝只存在于新闻稿上的集群。
  zh_hk: 你能把任務交給機會成本更低的城，標出能讓鏈條停住的那一步，並拒絕只存在於新聞稿上的集群。
  claim_en: You can assign the lower-cost city, mark the step that can stop the chain, and refuse
    a cluster that exists only on a press release.
  claim_zh: 你能把任务交给机会成本更低的城，标出能让链条停住的那一步，并拒绝只存在于新闻稿上的集群。
  claim_zh_hk: 你能把任務交給機會成本更低的城，標出能讓鏈條停住的那一步，並拒絕只存在於新聞稿上的集群。
  next_en: 'That is the work. Next sitting: what it costs to cross.'
  next_zh: 生产单元到此。下一讲：跨过去要付的账。
  next_zh_hk: 生產單元到此。下一講：跨過去要付的賬。
