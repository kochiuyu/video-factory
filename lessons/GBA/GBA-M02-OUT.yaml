objective_en: 'Close the production sitting. Next sitting prices the crossing: paperwork, finance
  doors, two rule books.'
objective_zh: 收住生产这一讲。下一讲给过关标价：文件、金融门槛、两套规则。
objective_zh_hk: 收住生產這一講。下一講給過關標價：文件、金融門檻、兩套規則。
glossary:
- en: Close
  zh: 收束
  zh_hk: 收束
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: When is a cluster not a cluster?
  zh: 何时集群还不算集群？
  zh_hk: 何時集群還不算集群？
  answer_en: When the only link is a press release — no shared people, parts, or ideas.
  answer_zh: 若唯一联系是新闻稿——没有共用的人、零件或想法。
  answer_zh_hk: 若唯一聯繫是新聞稿——沒有共用的人、零件或想法。
