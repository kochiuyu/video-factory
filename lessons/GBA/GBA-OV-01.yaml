id: GBA-OV-01
course: gba
course_en: Greater Bay Area
course_zh: 粤港澳大湾区
course_zh_hk: 粵港澳大灣區
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 64
title_en: What Is the GBA
title_zh: 大湾区是什么
title_zh_hk: 大灣區是什麼
objective_en: 'Open the map unit: the GBA is nine Guangdong cities plus Hong Kong and Macao — proximity
  is not one policy.'
objective_zh: 打开地图单元：大湾区是广东九市加香港、澳门——邻近不等于一套政策。
objective_zh_hk: 打開地圖單元：大灣區是廣東九市加香港、澳門——鄰近不等於一套政策。
glossary:
- en: Greater Bay Area
  zh: 粤港澳大湾区
  zh_hk: 粵港澳大灣區
  lock: true
- en: two systems
  zh: 两制
  zh_hk: 兩制
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: The GBA is made of which parts?
  zh: 大湾区由哪几部分组成？
  zh_hk: 大灣區由哪幾部分組成？
  answer_en: Nine Guangdong cities plus Hong Kong and Macao.
  answer_zh: 广东九市加上香港和澳门。
  answer_zh_hk: 廣東九市加上香港和澳門。
- id: Q2
  type: transfer
  en: Why is a weekend trip from Hong Kong to Guangzhou not the same as a trip inside one city?
  zh: 为何从香港到广州的周末行程，不同于同一座城市内部的行程？
  zh_hk: 為何從香港到廣州的週末行程，不同於同一座城市內部的行程？
  answer_en: It crosses a legal and monetary boundary, even though the distance is short.
  answer_zh: 虽然距离短，但要越过法律和货币边界。
  answer_zh_hk: 雖然距離短，但要越過法律和貨幣邊界。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: What Is the GBA
  title_zh: 大湾区是什么
  title_zh_hk: 大灣區是什麼
  en: This sitting starts with the map. The Greater Bay Area is not one city with a new name. It is
    nine Guangdong cities plus Hong Kong and Macao, already trading, commuting, and competing.
  zh: 这一单元从地图讲起。大湾区不是一座改了名的城市。它是广东九市加上香港、澳门，彼此已经在贸易、通勤、竞争。
  zh_hk: 這一單元從地圖講起。大灣區不是一座改了名的城市。它是廣東九市加上香港、澳門，彼此已經在貿易、通勤、競爭。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Nine plus two
  title_zh: 九加二
  title_zh_hk: 九加二
  formula: 9 Guangdong cities + Hong Kong + Macao
  formula_en: 9 Guangdong cities + Hong Kong + Macao
  formula_zh: 广东九市 + 香港 + 澳门
  formula_zh_hk: 廣東九市 + 香港 + 澳門
  gloss_en: One cluster, three jurisdictions.
  gloss_zh: 一个集群，三种制度安排。
  gloss_zh_hk: 一個集群，三種制度安排。
  en: The GBA joins nine cities in Guangdong with Hong Kong and Macao. They sit close together but
    run under different legal and monetary systems. That mix is the point of the cluster, not a footnote.
  zh: 大湾区把广东九座城市与香港、澳门连在一起。彼此很近，但法律和货币制度不同。这种组合本身就是这个集群的要点，不是脚注。
  zh_hk: 大灣區把廣東九座城市與香港、澳門連在一起。彼此很近，但法律和貨幣制度不同。這種組合本身就是這個集群的要點，不是腳註。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A student weekend
  title_zh: 学生的周末
  title_zh_hk: 學生的週末
  left_en: Class in Hong Kong
  left_zh: 在香港上课
  left_zh_hk: 在香港上課
  right_en: Family in Guangzhou
  right_zh: 家人在广州
  right_zh_hk: 家人在廣州
  en: A student can attend class in Hong Kong and visit family in Guangzhou in the same week. The
    trip crosses a boundary. The cluster is close in space and still not one market.
  zh: 学生可以在香港上课，同一周再去广州看家人。这一趟要过关。空间上很近，仍然不是同一个市场。
  zh_hk: 學生可以在香港上課，同一週再去廣州看家人。這一趟要過關。空間上很近，仍然不是同一個市場。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Name the mix
  title_zh: 说出这一组合
  title_zh_hk: 說出這一組合
  q1_en: Which cities sit in the cluster?
  q1_zh: 集群里有哪些城市？
  q1_zh_hk: 集群裏有哪些城市？
  q2_en: Which rules still differ across the boundary?
  q2_zh: 边界两边还有哪些规则不同？
  q2_zh_hk: 邊界兩邊還有哪些規則不同？
  en: 'When you hear “GBA,” ask which cities and which systems you are mixing. Proximity is not one
    policy. Next we put a clock on that map: a bridge cuts travel time; it does not, by itself, cut
    a visa.'
  zh: 听到“大湾区”，先问你在混合哪些城市、哪套制度。邻近不是一套政策。下一讲给这张地图加上钟：一座桥能缩短路上的时间，它本身缩短不了签证。
  zh_hk: 聽到「大灣區」，先問你在混合哪些城市、哪套制度。鄰近不是一套政策。下一講給這張地圖加上鐘：一座橋能縮短路上的時間，它本身縮短不了簽證。
