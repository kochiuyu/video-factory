id: GBA-RG-01
course: gba
course_en: Greater Bay Area
course_zh: 粤港澳大湾区
course_zh_hk: 粵港澳大灣區
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 160
title_en: Regulatory Difference
title_zh: 监管差异
title_zh_hk: 監管差異
objective_en: 'Close the crossing unit: two rule books are why a firm keeps desks in more than one
  GBA city.'
objective_zh: 收住过关单元：两套规则，正是企业在多于一座大湾区城市留办公桌的原因。
objective_zh_hk: 收住過關單元：兩套規則，正是企業在多於一座大灣區城市留辦公桌的原因。
glossary:
- en: regulation
  zh: 监管
  zh_hk: 監管
  lock: true
- en: jurisdiction
  zh: 法域
  zh_hk: 法域
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Regulatory difference in the GBA means what?
  zh: 大湾区的监管差异指什么？
  zh_hk: 大灣區的監管差異指什麼？
  answer_en: The same act can fall under different enforceable rules in different cities.
  answer_zh: 同一行为在不同城市可能适用不同的可执行规则。
  answer_zh_hk: 同一行為在不同城市可能適用不同的可執行規則。
- id: Q2
  type: transfer
  en: A contract is valid in one GBA city. Can you assume it is valid in the next city without a check?
  zh: 一份合同在大湾区一座城市有效。能否不经检查就假定它在下一座城市也有效？
  zh_hk: 一份合同在大灣區一座城市有效。能否不經檢查就假定它在下一座城市也有效？
  answer_en: No. Check the next jurisdiction’s rule book.
  answer_zh: 不能。要查下一法域的规则书。
  answer_zh_hk: 不能。要查下一法域的規則書。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Regulatory Difference
  title_zh: 监管差异
  title_zh_hk: 監管差異
  en: Trade cost and finance already assumed more than one gate. Three rule books in one cluster can
    be a cost. They can also be the reason a firm locates a desk in more than one city.
  zh: 贸易成本和金融已经假定闸口不止一道。一个集群里三本规则可以是成本，也可以是企业在多于一座城市留办公桌的理由。
  zh_hk: 貿易成本和金融已經假定閘口不止一道。一個集群裏三本規則可以是成本，也可以是企業在多於一座城市留辦公桌的理由。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Different books, same map
  title_zh: 同一张地图，不同的书
  title_zh_hk: 同一張地圖，不同的書
  formula: One cluster, several jurisdictions
  formula_en: One cluster, several jurisdictions
  formula_zh: 一个集群，多套规则
  formula_zh_hk: 一個集群，多套規則
  gloss_en: A jurisdiction is the set of rules that can be enforced there.
  gloss_zh: 法域是那里能够被执行的那套规则。
  gloss_zh_hk: 法域是那裏能夠被執行的那套規則。
  en: Regulatory difference means the same act is judged by different enforceable rules depending
    on the city. In the GBA that is built in. It is not a temporary glitch.
  zh: 监管差异是指同一行为会因城市不同，而由不同的可执行规则来判断。在大湾区，这是内置的，不是暂时故障。
  zh_hk: 監管差異是指同一行為會因城市不同，而由不同的可執行規則來判斷。在大灣區，這是內置的，不是暫時故障。
- id: example
  visual: two_column
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: Data on a laptop
  title_zh: 笔记本里的数据
  title_zh_hk: 筆記型電腦裏的數據
  left_en: Legal to store here
  left_zh: 在这里存储合法
  left_zh_hk: 在這裏儲存合法
  right_en: Need a review to take it across
  right_zh: 带过关需要审查
  right_zh_hk: 帶過關需要審查
  en: A research file can sit legally on a campus laptop. Carrying the same file across the boundary
    may trigger another review. The student did not change the file. The student changed the jurisdiction.
  zh: 一份研究文件可以合法地放在校园笔记本里。带着同一份文件过关，可能触发另一道审查。学生没有改文件。学生改的是法域。
  zh_hk: 一份研究文件可以合法地放在校園筆記型電腦裏。帶著同一份文件過關，可能觸發另一道審查。學生沒有改文件。學生改的是法域。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: One cluster, many rulebooks
  title_zh: 一个集群，多本规则
  title_zh_hk: 一個集群，多本規則
  formula: One cluster, several jurisdictions
  formula_en: One cluster, several jurisdictions
  formula_zh: 一个集群，多套规则
  formula_zh_hk: 一個集群，多套規則
  gloss_en: The map is economic. The stamps are legal.
  gloss_zh: 地图是经济的。印章是法律的。
  gloss_zh_hk: 地圖是經濟的。印章是法律的。
  en: The GBA is sold as one economy. It is administered as several jurisdictions. A truck can finish
    a journey and still meet a new stamp.
  zh: 大湾区被说成一个经济体。它按多个法域来管理。卡车可以走完路程，仍会遇到新的印章。
  zh_hk: 大灣區被說成一個經濟體。它按多個法域來管理。卡車可以走完路程，仍會遇到新的印章。
- id: two
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: Economy versus stamp
  title_zh: 经济对印章
  title_zh_hk: 經濟對印章
  left_en: Shared suppliers
  left_zh: 共用供应商
  left_zh_hk: 共用供應商
  right_en: Separate filings
  right_zh: 分开的申报
  right_zh_hk: 分開的申報
  en: Firms share parts and people across the cluster. They still file under different books. Policy
    that forgets the second fact will over-promise the first.
  zh: 企业在集群里共用零件和人员。它们仍在不同的账套下申报。忘记第二点的政策，会把第一点许诺过头。
  zh_hk: 企業在集群裏共用零件和人員。它們仍在不同的賬套下申報。忘記第二點的政策，會把第一點許諾過頭。
- id: data
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A server and a clinic
  title_zh: 服务器和诊所
  title_zh_hk: 伺服器和診所
  setup_en: The machine is one hour away
  setup_zh: 机器一小时可达
  setup_zh_hk: 機器一小時可達
  result_en: The record cannot follow
  result_zh: 记录不能跟着走
  result_zh_hk: 記錄不能跟著走
  en: A hospital can send a patient faster than it can send the file. Regulatory difference shows
    up as a pause between two buildings that already share a road.
  zh: 医院送病人可以比送档案更快。规则差异表现为两栋已共享道路的楼之间的停顿。
  zh_hk: 醫院送病人可以比送檔案更快。規則差異表現為兩棟已共享道路的樓之間的停頓。
- id: layers
  visual: three_column
  seconds: 16
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: Three rule layers
  title_zh: 三层规则
  title_zh_hk: 三層規則
  col1_en: Who may work
  col1_zh: 谁可以工作
  col1_zh_hk: 誰可以工作
  col2_en: What may cross
  col2_zh: 什么可以过关
  col2_zh_hk: 什麼可以過關
  col3_en: How disputes end
  col3_zh: 争议如何结束
  col3_zh_hk: 爭議如何結束
  en: Labour, goods, and courts are separate stacks. Harmonising one stack does not open the other
    two. Say which stack your reform actually touches.
  zh: 劳动、货物和法庭是分开的栈。协调其中一栈不会打开另外两栈。说出你的改革真正碰到哪一栈。
  zh_hk: 勞動、貨物和法庭是分開的棧。協調其中一棧不會打開另外兩棧。說出你的改革真正碰到哪一棧。
- id: read
  visual: steps
  seconds: 18
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Read a deal twice
  title_zh: 把交易读两遍
  title_zh_hk: 把交易讀兩遍
  step1_en: Once as a supply chain
  step1_zh: 一次当成供应链
  step1_zh_hk: 一次當成供應鏈
  step2_en: Once as a filing list
  step2_zh: 一次当成申报清单
  step2_zh_hk: 一次當成申報清單
  step3_en: Circle where they disagree
  step3_zh: 圈出两者不一致处
  step3_zh_hk: 圈出兩者不一致處
  en: Write the physical path. Write the legal path. The project lives in the gaps. Those gaps are
    the GBA’s regulatory difference, not a rounding error.
  zh: 写下物理路径。写下法律路径。项目活在缺口里。那些缺口就是大湾区的规则差异，不是四舍五入。
  zh_hk: 寫下物理路徑。寫下法律路徑。項目活在缺口裏。那些缺口就是大灣區的規則差異，不是四捨五入。
- id: stamps
  visual: big_number
  seconds: 14
  kicker: Number
  kicker_en: Number
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: More than one chop
  title_zh: 不止一个章
  title_zh_hk: 不止一個章
  unit_en: books
  unit_zh: 账套
  unit_zh_hk: 賬套
  caption_en: Count the books, not the bridges.
  caption_zh: 数账套，不要数桥。
  caption_zh_hk: 數賬套，不要數橋。
  number: 2+
  en: Bridges photograph well. Books decide whether the truck’s cargo can be a loan, a sample, or
    a finished sale. Start the slide with the books.
  zh: 桥很上镜。账套决定货车上的东西是贷款、样品还是成品销售。幻灯片从账套开始。
  zh_hk: 橋很上鏡。賬套決定貨車上的東西是貸款、樣品還是成品銷售。幻燈片從賬套開始。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Write the rule book
  title_zh: 写出规则书
  title_zh_hk: 寫出規則書
  q1_en: Which city will enforce this act?
  q1_zh: 哪一座城市会执行这一行为？
  q1_zh_hk: 哪一座城市會執行這一行為？
  q2_en: Does the next city use the same test?
  q2_zh: 下一座城市是否用同一套检验？
  q2_zh_hk: 下一座城市是否用同一套檢驗？
  en: 'A GBA plan that ignores the second rule book will fail at the gate, even if the train is on
    time. That closes the sitting: we mapped the place, assigned the work, and priced the crossing.'
  zh: 大湾区方案若不理第二本规则，会在闸口失败，哪怕火车准点。这一单元到此结束：地方画过了，活分过了，过关的账也算过了。
  zh_hk: 大灣區方案若不理第二本規則，會在閘口失敗，哪怕火車準點。這一單元到此結束：地方畫過了，活分過了，過關的賬也算過了。
