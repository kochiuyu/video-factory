id: GBA-SC-01
course: gba
course_en: Greater Bay Area
course_zh: 粤港澳大湾区
course_zh_hk: 粵港澳大灣區
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 146
title_en: Supply Chains
title_zh: 供应链
title_zh_hk: 供應鏈
objective_en: 'Second step of the production unit: see a GBA product as an ordered chain of steps
  across cities.'
objective_zh: 生产单元的第二步：把大湾区的产品看成跨城的一串有顺序的步骤。
objective_zh_hk: 生產單元的第二步：把大灣區的產品看成跨城的一串有順序的步驟。
glossary:
- en: supply chain
  zh: 供应链
  zh_hk: 供應鏈
  lock: true
- en: lead time
  zh: 交期
  zh_hk: 交期
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: A supply chain is best described as what?
  zh: 供应链最好被描述成什么？
  zh_hk: 供應鏈最好被描述成什麼？
  answer_en: An ordered set of steps across places, not one building.
  answer_zh: 跨地点的一串有序步骤，而不是一栋楼。
  answer_zh_hk: 跨地點的一串有序步驟，而不是一棟樓。
- id: Q2
  type: transfer
  en: Customs at the port slows by two days. What happens to a just-in-time assembly line inland?
  zh: 港口海关慢了两天。内陆的即时装配线会怎样？
  zh_hk: 港口海關慢了兩天。內陸的即時裝配線會怎樣？
  answer_en: It waits. The chain moves at the speed of that gate.
  answer_zh: 它会等待。整条链按那道关的速度走。
  answer_zh_hk: 它會等待。整條鏈按那道關的速度走。
beats:
- id: hook
  visual: title_card
  seconds: 16
  kicker: Concept
  kicker_en: Concept
  kicker_zh: 概念
  kicker_zh_hk: 概念
  title_en: Supply Chains
  title_zh: 供应链
  title_zh_hk: 供應鏈
  en: We assigned tasks by opportunity cost. The name on the box is still one city. The steps behind
    the box usually are not. Draw the order.
  zh: 任务已按机会成本分好。盒子上的地名仍是一座城。盒子背后的步骤通常不是。把顺序画出来。
  zh_hk: 任務已按機會成本分好。盒子上的地名仍是一座城。盒子背後的步驟通常不是。把順序畫出來。
- id: define
  visual: definition_card
  seconds: 16
  kicker: Definition
  kicker_en: Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Steps, not a building
  title_zh: 是步骤，不是一栋楼
  title_zh_hk: 是步驟，不是一棟樓
  formula: Design → parts → assemble → ship
  formula_en: Design → parts → assemble → ship
  formula_zh: 设计 → 零件 → 组装 → 出货
  formula_zh_hk: 設計 → 零件 → 組裝 → 出貨
  gloss_en: A delay in one step holds the whole chain.
  gloss_zh: 一步延误，整条链都会停。
  gloss_zh_hk: 一步延誤，整條鏈都會停。
  en: A supply chain is the ordered set of steps that turn inputs into a good in the buyer’s hands.
    In the GBA those steps often sit in different cities on purpose.
  zh: 供应链是把投入变成买家手中商品的一串有序步骤。在大湾区，这些步骤常常有意放在不同城市。
  zh_hk: 供應鏈是把投入變成買家手中商品的一串有序步驟。在大灣區，這些步驟常常有意放在不同城市。
- id: example
  visual: steps
  seconds: 16
  kicker: Rule
  kicker_en: Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: A simple handset chain
  title_zh: 一条简单的手机链
  title_zh_hk: 一條簡單的手機鏈
  step1_en: Design the board
  step1_zh: 设计主板
  step1_zh_hk: 設計主板
  step2_en: Make the case nearby
  step2_zh: 在附近做外壳
  step2_zh_hk: 在附近做外殼
  step3_en: Ship through a port
  step3_zh: 经港口运出
  step3_zh_hk: 經港口運出
  en: Design can sit in one GBA city, the case in another, and the export desk at the port. If the
    case plant stops, the port has nothing to load. The chain is only as fast as its slowest step.
  zh: 设计可以在大湾区一座城市，外壳在另一座，出口台在港口。外壳厂一停，港口就没有货可装。整条链只和最慢的那一步一样快。
  zh_hk: 設計可以在大灣區一座城市，外殼在另一座，出口台在港口。外殼廠一停，港口就沒有貨可裝。整條鏈只和最慢的那一步一樣快。
- id: formula
  visual: formula
  seconds: 16
  kicker: Formula
  kicker_en: Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: A line of tasks
  title_zh: 一条任务线
  title_zh_hk: 一條任務線
  formula: Design → parts → assemble → ship
  formula_en: Design → parts → assemble → ship
  formula_zh: 设计 → 零件 → 组装 → 出货
  formula_zh_hk: 設計 → 零件 → 組裝 → 出貨
  gloss_en: Each city can take one slice.
  gloss_zh: 每座城市可以切一片。
  gloss_zh_hk: 每座城市可以切一片。
  en: A GBA supply chain is a sequence. Design can sit in one city, parts in another, assembly in
    a third, and the ship at the mouth of the river.
  zh: 大湾区供应链是一个序列。设计可以在一座城市，零件在另一座，组装在第三座，船在河口。
  zh_hk: 大灣區供應鏈是一個序列。設計可以在一座城市，零件在另一座，組裝在第三座，船在河口。
- id: flow
  visual: steps
  seconds: 18
  kicker: Steps
  kicker_en: Steps
  kicker_zh: 步骤
  kicker_zh_hk: 步驟
  title_en: Follow one gadget
  title_zh: 跟着一件产品
  title_zh_hk: 跟著一件產品
  step1_en: Where is the drawing?
  step1_zh: 图纸在哪？
  step1_zh_hk: 圖紙在哪？
  step2_en: Where is the part made?
  step2_zh: 零件在哪做？
  step2_zh_hk: 零件在哪做？
  step3_en: Where does it leave?
  step3_zh: 从哪离开？
  step3_zh_hk: 從哪離開？
  en: Pick one gadget. Write the city for the drawing, the part, the assembly, and the berth. If two
    steps share a city, say why that slice did not move.
  zh: 选一件产品。写下图纸、零件、组装和泊位所在的城市。若两步共用一座城市，说明这一片为什么没走。
  zh_hk: 選一件產品。寫下圖紙、零件、組裝和泊位所在的城市。若兩步共用一座城市，說明這一片為什麼沒走。
- id: shock
  visual: two_column
  seconds: 16
  kicker: Compare
  kicker_en: Compare
  kicker_zh: 对照
  kicker_zh_hk: 對照
  title_en: When one city stops
  title_zh: 当一座城市停下
  title_zh_hk: 當一座城市停下
  left_en: A part city shuts
  left_zh: 零件城市停工
  left_zh_hk: 零件城市停工
  right_en: The ship waits
  right_zh: 船在等
  right_zh_hk: 船在等
  en: A chain is only as open as its tightest slice. If the part city closes, design talent and empty
    berths do not load the vessel.
  zh: 链条只和最紧的那一片一样通。零件城市关闭时，设计人才和空泊位也装不了船。
  zh_hk: 鏈條只和最緊的那一片一樣通。零件城市關閉時，設計人才和空泊位也裝不了船。
- id: risk
  visual: three_column
  seconds: 16
  kicker: Three parts
  kicker_en: Three parts
  kicker_zh: 三部分
  kicker_zh_hk: 三部分
  title_en: Three chain risks
  title_zh: 三种链条风险
  title_zh_hk: 三種鏈條風險
  col1_en: One-city parts
  col1_zh: 零件只在一城
  col1_zh_hk: 零件只在一城
  col2_en: Slow papers
  col2_zh: 文件慢
  col2_zh_hk: 文件慢
  col3_en: No spare berth
  col3_zh: 没有备用泊位
  col3_zh_hk: 沒有備用泊位
  en: Concentration, paperwork, and ports are different failures. Name which one you are buying insurance
    against. A second mould is not a second customs lane.
  zh: 集中、文件和港口是不同的失败。说出你在为哪一种买保险。第二套模具不是第二条海关通道。
  zh_hk: 集中、文件和港口是不同的失敗。說出你在為哪一種買保險。第二套模具不是第二條海關通道。
- id: mask
  visual: example
  seconds: 16
  kicker: Example
  kicker_en: Example
  kicker_zh: 例子
  kicker_zh_hk: 例子
  title_en: A rush order
  title_zh: 一笔加急订单
  title_zh_hk: 一筆加急訂單
  setup_en: Design is ready
  setup_zh: 设计已好
  setup_zh_hk: 設計已好
  result_en: The binding step is sewing
  result_zh: 绷紧的是缝制
  result_zh_hk: 繃緊的是縫製
  en: The drawing exists on Monday. Sewing capacity exists on Thursday. The ship is booked for Friday.
    The chain’s clock is the sewing floor, not the slide deck.
  zh: 图纸星期一就有。缝制能力星期四才有。船订在星期五。链条的时钟是缝制车间，不是幻灯片。
  zh_hk: 圖紙星期一就有。縫製能力星期四才有。船訂在星期五。鏈條的時鐘是縫製車間，不是幻燈片。
- id: takeaway
  visual: takeaway
  seconds: 16
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Map the slow step
  title_zh: 标出最慢的一步
  title_zh_hk: 標出最慢的一步
  q1_en: Which city does each step?
  q1_zh: 每一步在哪座城市？
  q1_zh_hk: 每一步在哪座城市？
  q2_en: Which step can halt the rest?
  q2_zh: 哪一步能让其余步骤停住？
  q2_zh_hk: 哪一步能讓其餘步驟停住？
  en: 'Do not praise a cluster only for having many plants. Draw the order of steps and mark the one
    that can stop the rest. Next: those plants only become a cluster if they reuse the same people,
    parts, or ideas.'
  zh: 不要只因为工厂多为集群叫好。画出步骤顺序，标出能让整条链停住的那一步。下一讲：这些厂要共用同一批人、零件或想法，才叫集群。
  zh_hk: 不要只因為工廠多為集群叫好。畫出步驟順序，標出能讓整條鏈停住的那一步。下一講：這些廠要共用同一批人、零件或想法，才叫集群。
