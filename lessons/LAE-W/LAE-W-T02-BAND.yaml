id: LAE-W-T02-BAND
course_en: DOTE5891 Low-Altitude Economy
course_zh: DOTE5891 低空经济
course_zh_hk: DOTE5891 低空經濟
duration_target_s: 92
title_en: What is the 1,000-metre band?
title_zh: 什么是一千米这一层？
title_zh_hk: 咩係一千米呢一層？
source_en: 'Primer, Week 1, and Key numbers — LegCo CB(3)933/2024; CAD G.N. 1276 of 2022'
source_zh: 入门、第1周与关键数字——立法会 CB(3)933/2024；民航处 G.N. 1276 of 2022
source_zh_hk: 入門、第1週同關鍵數字——立法會 CB(3)933/2024；民航處 G.N. 1276 of 2022
beats:
- id: hook
  visual: whatis_title
  seconds: 14
  title_en: What is the 1,000-metre band?
  title_zh: 什么是一千米这一层？
  title_zh_hk: 咩係一千米呢一層？
  en: 'In Hong Kong policy language, the low-altitude economy is often described as using airspace generally below about 1,000 metres.'
  zh: '在香港的政策用语里，低空经济常常被说成是使用大约一千米以下的空域。'
  zh_hk: '喺香港嘅政策用語入面，低空經濟好多時會被講成係使用大約一千米以下嘅空域。'
- id: define
  visual: whatis_definition
  seconds: 18
  sentence_en: 'A Hong Kong policy working description of the LAE field — generally below about 1,000 metres. It is not a Cap. 448G flying-height limit.'
  sentence_zh: 香港对 LAE 领域的政策工作描述——大体在约1,000米以下。它不是《第448G章》的飞行高度限制。
  sentence_zh_hk: 香港對 LAE 範疇嘅政策工作描述——一般係大約1,000米以下。佢唔係《第448G章》嘅飛行高度限制。
  en: 'That 1,000-metre figure is a policy working description — a way officials and analysts talk about the field. It is not a flying-height limit in Hong Kong’s main small-unmanned-aircraft law, Cap. 448G.'
  zh: '这一千米的数字，是政策上的工作描述，是官员和分析人员讨论这个领域时的说法。它并不是香港主要小型无人机法例《第448G章》里的飞行高度限制。'
  zh_hk: '呢個一千米嘅數字，係政策上嘅工作描述，係官員同分析人員討論呢個範疇嗰陣用嘅講法。佢唔係香港主要小型無人機法例《第448G章》入面嘅飛行高度限制。'
- id: contrast
  visual: whatis_contrast
  seconds: 38
  what_en: 'A policy working description — generally below about 1,000 metres.'
  what_zh: 政策工作描述——大体在约1,000米以下。
  what_zh_hk: 政策工作描述——一般係大約1,000米以下。
  not_en: 'A Cap. 448G flying-height limit. Ordinary bands: Category A1, 100 ft AGL, about 30 m; Category A2, 300 ft AGL, about 91 m. Higher flight needs CAD permission.'
  not_zh: 《第448G章》的飞行高度限制。普通高度带：A1类，离地100英尺，约30米；A2类，离地300英尺，约91米。更高的飞行需要民航处许可。
  not_zh_hk: 《第448G章》嘅飛行高度限制。普通高度帶：A1類，離地100英尺，約30米；A2類，離地300英尺，約91米。飛得更高要民航處許可。
  en: 'Cap. 448G sets ordinary operating height bands much lower: Category A1 at 100 feet above ground level, about 30 metres; and Category A2 at 300 feet above ground level, about 91 metres. Higher flight needs permission from the Civil Aviation Department. So there are two different rulers in the same sky. The 1,000-metre band frames the economic field. The 100-foot and 300-foot bands are legal operating limits for ordinary small unmanned aircraft.'
  zh: '《第448G章》规定的普通运行高度要低得多：A1类是离地100英尺，大约30米；A2类是离地300英尺，大约91米。飞得再高，就需要民航处许可。所以同一片天空里，其实有两把不同的尺子。一千米这一层，框的是经济领域；100英尺和300英尺这两档，才是普通小型无人机的法定运行限制。'
  zh_hk: '《第448G章》訂明嘅普通運作高度低好多：A1類係離地100英尺，大約30米；A2類係離地300英尺，大約91米。飛得再高，就要有民航處許可。所以同一片天空入面，其實有兩把唔同嘅尺。一千米呢一層，框住嘅係經濟範疇；100英尺同300英尺呢兩檔，先至係普通小型無人機嘅法定運作限制。'
- id: rule
  visual: whatis_takeaway
  seconds: 22
  rule_en: 'Two rulers in the same sky. Do not treat “LAE below 1,000 metres” as permission to fly a small unmanned aircraft to 1,000 metres.'
  rule_zh: 同一片天空，两把尺子。不要把「LAE在1,000米以下」当成可以把小型无人机飞到1,000米的许可。
  rule_zh_hk: 同一片天空，兩把尺。唔好將「LAE喺1,000米以下」當成可以將小型無人機飛到1,000米嘅許可。
  en: 'If you treat “LAE below 1,000 metres” as permission to fly a small unmanned aircraft to 1,000 metres, you have mixed those two layers. They are not the same thing.'
  zh: '如果把「低空经济在一千米以下」当成可以把小型无人机飞到一千米的许可，就是把这两层搞混了。它们不是同一回事。'
  zh_hk: '如果你將「低空經濟喺一千米以下」當成可以將小型無人機飛到一千米嘅許可，就係將呢兩層撈亂咗。佢哋唔係同一件事。'
