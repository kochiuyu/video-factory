duration_target_s: 70
title_en: What is a drone?
title_zh: 什么是 drone？
title_zh_hk: 咩係 drone？
source_en: Primer, FAQ, and glossary, lae-companion
source_zh: 入门、常见问题与词汇表，lae-companion
source_zh_hk: 入門、常見問題同詞彙表，lae-companion
beats:
- id: hook
  visual: whatis_title
  seconds: 14
  title_en: What is a drone?
  title_zh: 什么是 drone？
  title_zh_hk: 咩係 drone？
  en: 'When people talk about the low-altitude economy, they often say “drone.” That everyday word is useful, but it is not a name in the law.'
  zh: '一提到低空经济，大家常常会说「drone」。这个日常说法很方便，但它并不是法律里的名称。'
  zh_hk: '一講到低空經濟，好多人都會講「drone」。呢個日常講法好方便，但佢唔係法律入面嘅名稱。'
- id: define
  visual: whatis_definition
  seconds: 22
  sentence_en: 'An everyday name for a small unmanned aircraft, not the legal name in Cap. 448G.'
  sentence_zh: '小型无人飞行器的日常叫法，不是《第448G章》里的法定名称。'
  sentence_zh_hk: '小型無人飛行器嘅日常叫法，唔係《第448G章》入面嘅法定名稱。'
  en: 'In everyday speech, a drone is a small unmanned aircraft — a craft flown without a person on board. In Hong Kong, “drone” is an everyday name. It is not the legal name in the city’s main small-unmanned-aircraft law, Cap. 448G.'
  zh: '在日常用语里，drone 指的是小型无人飞行器，也就是机上没有人驾驶的飞行器。在香港，「drone」是一个日常叫法。它不是本港主要小型无人机法例《第448G章》里的法定名称。'
  zh_hk: '喺日常用語入面，drone 係指小型無人飛行器，即係機上冇人駕駛嘅飛行器。喺香港，「drone」係一個日常叫法。佢唔係本港主要小型無人機法例《第448G章》入面嘅法定名稱。'
- id: contrast
  visual: whatis_contrast
  seconds: 18
  what_en: 'An everyday name.'
  what_zh: '日常叫法。'
  what_zh_hk: '日常叫法。'
  not_en: 'The legal name for SUA.'
  not_zh: 'SUA 的法定名称。'
  not_zh_hk: 'SUA 嘅法定名稱。'
  en: '“Drone” is an everyday name for a light unmanned craft. It is not the legal name used in Cap. 448G. That law’s main name is small unmanned aircraft, or SUA.'
  zh: '「Drone」是对轻型无人飞行器的日常叫法，不是《第448G章》使用的法定名称。那条法例的主要名称是小型无人飞机，也就是 SUA。'
  zh_hk: '「Drone」係對輕型無人飛行器嘅日常叫法，唔係《第448G章》用嘅法定名稱。嗰條法例嘅主要名稱係小型無人飛機，即係 SUA。'
- id: rule
  visual: whatis_takeaway
  seconds: 16
  rule_en: 'Do not treat “drone” as the legal name in Cap. 448G.'
  rule_zh: '不要把「drone」当成《第448G章》的法定名称。'
  rule_zh_hk: '唔好將「drone」當成《第448G章》嘅法定名稱。'
  en: 'If you treat “drone” as if it were the legal name, you have mixed everyday speech with the law. They are not the same thing.'
  zh: '如果把「drone」当成法定名称来用，就是把日常用语和法律混在一起了。它们不是同一回事。'
  zh_hk: '如果你將「drone」當成法定名稱嚟用，就係將日常用語同法律撈亂咗。佢哋唔係同一件事。'
