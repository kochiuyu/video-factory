  title_en: 'This sitting: the band'
  title_zh: 这一讲：这一层空域
  title_zh_hk: 這一講：呢一層空域
  item1_en: The layer
  item1_zh: 这一层
  item1_zh_hk: 呢一層
  item2_en: A crowded band
  item2_zh: 挤在同一层
  item2_zh_hk: 擠喺同一層
  en: Two shorts. First we name the air just above the ground. Then we ask what a further flight does to the flights already there.
  zh: 两条短片。先给紧贴地面的那一层空气起名，再看多一班飞行，会对已经在飞的班次造成什么影响。
  zh_hk: 兩條短片。先畀貼住地面嗰一層空氣起個名，再睇下每多一班飛行，會對已經喺度飛緊嘅班次帶嚟咩影響。
- id: takeaway
  visual: title_card
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: the band'
  title_zh: 这一讲：这一层空域
  title_zh_hk: 這一講：呢一層空域
  en: By the end, “low altitude” should mean a real band of physical room, not weather and not a poster about the future.
  zh: 学完这一讲，“低空”应该是一层实实在在的物理空间，不是天气，也不是一张关于未来的海报。
  zh_hk: 學完呢一講，「低空」應該係一層實實在在嘅物理空間，唔係天氣，亦都唔係一張講未來嘅海報。
