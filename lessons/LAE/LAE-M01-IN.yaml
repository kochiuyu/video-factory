id: LAE-M01-IN
course: lae
course_en: Low-Altitude Economy
course_zh: 低空经济
course_zh_hk: 低空經濟
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 28
title_en: 'This sitting: the band'
title_zh: 这一讲：这一层空域
title_zh_hk: 這一講：呢一層空域
objective_en: Open the band unit. Name the layer below about 1,000 metres, then treat extra flights as delay on others.
objective_zh: 打开空域这一讲。先给大约一千米以下这一层起名，再把多出来的飞行看成加在别人身上的延误。
objective_zh_hk: 打開空域呢一講。先畀大約一千米以下呢一層起名，再將多出嚟嘅飛行看成加喺其他人身上嘅延誤。
glossary:
- en: Open
  zh: 开场
  zh_hk: 開場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Which two pictures does this sitting draw?
  zh: 这一讲画哪两张图？
  zh_hk: 呢一講畫邊兩張圖？
  answer_en: The layer below about 1,000 metres, then delay when that layer fills.
  answer_zh: 大约一千米以下这一层，然后这一层变挤时的延误。
  answer_zh_hk: 大約一千米以下呢一層，然後呢一層變擠嗰陣嘅延誤。
