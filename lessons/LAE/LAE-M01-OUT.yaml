- id: hook
  visual: module_close
  seconds: 14
  kicker: Close
  kicker_en: Close
  kicker_zh: 收束
  kicker_zh_hk: 收束
  title_en: The band, closed
  title_zh: 这一层，先说到这里
  title_zh_hk: 呢一層，先講到呢度
  claim_en: You can point at the room below about 1,000 metres, and treat an extra line as delay on the first.
  claim_zh: 你能指大约一千米以下那一层，并把多一条线看成加在第一条上的延误。
  claim_zh_hk: 你能夠指大約一千米以下嗰一層，並將多一條線看成加喺第一條上嘅延誤。
  next_en: 'That is the band. Next sitting: what flies — two machines, one new noun each.'
  next_zh: 空域这一讲到此。下一讲：什么在飞——两种机器，一种一个新词。
  next_zh_hk: 空域呢一講到此。下一講：有咩喺度飛——兩種機器，一種一個新詞。
  en: You can now point at the room below about one thousand metres, and you can treat an extra flight in the same hour as minutes taken from the first.
  zh: 现在，你能指出大约一千米以下的那一层空间，也能把同一小时多出来的飞行，看成从第一班身上拿走的时间。
  zh_hk: 而家，你能夠指大約一千米以下嗰一層空間，亦都能夠將同一個鐘多出嚟嘅飛行，看成由第一班身上攞走嘅時間。
