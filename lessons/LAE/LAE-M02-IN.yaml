  en: The band already has a name. Two shorts name what uses it. First the drone. Then the eVTOL. We do not mix the two claims on the first card.
  zh: 这一层已经有名字。两条短片给占用它的东西起名。先是无人机。然后是 eVTOL。第一张卡片上不要把两种判断混在一起。
  zh_hk: 呢一層已經有名。兩條短片畀佔用佢嘅嘢起名。先係無人機。然後係 eVTOL。第一張卡上面唔好將兩種判斷撈埋一齊。
