  en: Two machines have names. Neither is a business in mid-air. Two shorts. First we name the pad. Then we ask what minutes on that pad cost.
  zh: 两种机器已经有名字。停在半空都不是生意。两条短片。先给垫子起名。再问垫子上的分钟值什么。
  zh_hk: 兩種機器已經有名。停喺半空都唔係生意。兩條短片。先畀墊起名。再問墊上面嘅分鐘值咩。
- id: takeaway
  visual: title_card
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: the pad'
  title_zh: 这一讲：这块垫子
  title_zh_hk: 這一講：呢塊墊
  en: By the end, a roof in Shenzhen and a locker in Sha Tin should mean two pads. Minutes on those pads cap how many trips the line can sell — not two pretty views.
  zh: 结束时，深圳的一个屋顶和沙田的一个储物柜，应是两块垫子。垫子上的分钟限制这条线能卖出多少趟——不是两处风景。
  zh_hk: 結束時，深圳一個屋頂同沙田一個儲物櫃，應該係兩塊墊。墊上面嘅分鐘限制呢條線能賣出幾多轉——唔係兩處風景。
