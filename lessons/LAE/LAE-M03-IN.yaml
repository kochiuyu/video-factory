objective_en: Open the pad unit. Name the vertiport, then treat minutes on the pad as the scarce unit.
objective_zh: 打开垫子这一讲。先给起降场起名，再把垫子上的分钟看成稀缺单位。
objective_zh_hk: 打開墊呢一講。先畀起降場起名，再將墊上面嘅分鐘看成稀缺單位。
