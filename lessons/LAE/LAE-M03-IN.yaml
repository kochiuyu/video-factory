quiz:
- id: Q1
  type: comprehension
  en: Which two pictures does this sitting draw?
  zh: 这一讲画哪两张图？
  zh_hk: 呢一講畫邊兩張圖？
  answer_en: The pad where a flight begins and ends, then the minutes spent sitting on it.
  answer_zh: 飞行开始和结束的垫子，然后垫子上坐着的那些分钟。
  answer_zh_hk: 飛行開始同結束嘅墊，然後墊上面坐住嘅嗰啲分鐘。
