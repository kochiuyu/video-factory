  title_zh_hk: 呢塊墊，先講到呢度
  claim_en: You can name a vertiport as a pad, not a runway, and treat sitting time as minutes the node cannot sell.
  claim_zh: 你能把起降场说成垫子而不是跑道，并把坐着的时间看成这个点卖不掉的分钟。
  claim_zh_hk: 你能將起降場講成墊而唔係跑道，並將坐住嘅時間看成呢個點賣唔掉嘅分鐘。
  next_en: 'That is the pad. Next sitting: the moving reservation that keeps two machines off the same point.'
  next_zh: 垫子到此。下一讲：不让两台机器占同一个点的那段预约。
  next_zh_hk: 墊到此。下一講：唔讓兩部機器佔同一個點嗰段預約。
  en: 'Ground pads hold the two ends. Flights still meet in the air. Next sitting: the moving reservation that keeps two machines off the same point.'
  zh: 地面的垫子按住两端。空中的线仍会碰上。下一讲：不让两台机器占同一个点的那段预约。
  zh_hk: 地面嘅墊按住兩端。空中嘅線仍然會碰上。下一講：唔讓兩部機器佔同一個點嗰段預約。
