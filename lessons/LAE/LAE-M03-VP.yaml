id: LAE-M03-VP
course: lae
course_en: Low-Altitude Economy
course_zh: 低空经济
course_zh_hk: 低空經濟
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 92
title_en: Vertiport
title_zh: 起降场
title_zh_hk: 起降場
objective_en: 'Name the vertiport: the flight starts and ends on a pad, not on a runway. Urban pads do not stack without limit.'
objective_zh: 给起降场起名：飞行在垫子上开始和结束，不是在跑道上。城里的垫子不能无限制往上叠。
objective_zh_hk: 畀起降場起名：飛行喺墊上面開始同結束，唔係喺跑道上面。城入面嘅墊唔可以無限往上疊。
glossary:
- en: vertiport
  zh: 起降场
  zh_hk: 起降場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Where does a low-altitude flight begin and end?
  zh: 低空飞行在哪里开始、在哪里结束？
  zh_hk: 低空飛行喺邊度開始、喺邊度結束？
  answer_en: On a pad. Not on a runway.
  answer_zh: 在垫子上。不是在跑道上。
  answer_zh_hk: 喺墊上面。唔係喺跑道上面。
- id: Q2
  type: transfer
  en: Why can a Shenzhen roof and a Sha Tin locker not host an unlimited number of pads?
  zh: 为什么深圳的屋顶和沙田的储物柜，不能无限制地摆满垫子？
  zh_hk: 點解深圳嘅屋頂同沙田嘅儲物櫃，唔可以無限擺滿墊？
  answer_en: Urban pads do not stack without limit. Roof and locker space is scarce too.
  answer_zh: 城里的垫子不能无限制往上叠。屋顶和储物柜的空间也稀缺。
  answer_zh_hk: 城入面嘅墊唔可以無限往上疊。屋頂同儲物櫃嘅空間都稀缺。
