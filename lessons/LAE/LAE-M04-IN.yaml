objective_en: Open the traffic unit. Name the moving reservation, then treat vehicle, pad, energy, and slot as complements.
objective_zh: 打开交通这一讲。先给空中的预约起名，再把机器、垫子、能量和时段看成互补品。
objective_zh_hk: 打開交通呢一講。先畀空中嘅預約起名，再將機器、墊、能量同時段看成互補品。
glossary:
- en: Open
  zh: 开场
  zh_hk: 開場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Which two pictures does this sitting draw?
  zh: 这一讲画哪两张图？
  zh_hk: 呢一講畫邊兩張圖？
  answer_en: A moving reservation that keeps two machines off one point, then the four pieces that must all be present.
  answer_zh: 不让两台机器占同一个点的预约，然后四件必须同时在的东西。
  answer_zh_hk: 唔讓兩部機器佔同一個點嘅預約，然後四件必須同時喺度嘅嘢。
