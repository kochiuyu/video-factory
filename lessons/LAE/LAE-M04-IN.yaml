  title_en: 'This sitting: the slot'
  title_zh: 这一讲：这段预约
  title_zh_hk: 這一講：呢段預約
  en: By the end, a slot should mean a held path in time, not a radio catalogue and not a crash film.
  zh: 结束时，时段应是一条被占住的路径加时间，不是一份无线电清单，也不是一部事故片。
  zh_hk: 結束時，時段應該係一條被佔住嘅路徑加時間，唔係一份無線電清單，亦都唔係一部意外片。
