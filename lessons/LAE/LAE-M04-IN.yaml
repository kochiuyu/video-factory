  en: Two pads hold the ends. Flights still meet in the air. Two shorts. First we name the reservation. Then we ask what happens if any one piece is missing.
  zh: 两块垫子按住两端。空中的线仍会碰上。两条短片。先给预约起名。再问缺了一件会怎样。
  zh_hk: 兩塊墊按住兩端。空中嘅線仍然會碰上。兩條短片。先畀預約起名。再問缺咗一件會點。
- id: takeaway
  visual: title_card
