quiz:
- id: Q1
  type: comprehension
  en: Which three payments does this sitting name?
  zh: 这一讲给哪三笔付款起名？
  zh_hk: 呢一講畀邊三筆付款起名？
  answer_en: The parcel, the AED, then the inspection.
  answer_zh: 包裹，然后是 AED，然后是巡检。
  answer_zh_hk: 包裹，然後係 AED，然後係巡檢。
