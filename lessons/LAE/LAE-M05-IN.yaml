  en: By the end, “use case” should mean who pays and why, not a catalogue of hobbies in the air.
  zh: 结束时，“应用”应是谁付钱、为什么付，不是一份空中爱好清单。
  zh_hk: 結束時，「應用」應該係邊個畀錢、點解付，唔係一份空中嗜好清單。
