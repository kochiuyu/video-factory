  en: A slot is only a path. Three shorts ask who pays to use it. A parcel. An AED. Then one inspection. We do not mix the three prices on the first card.
  zh: 时段只是一条路径。三条短片问谁付钱来用它。一个包裹。一台 AED。然后一次巡检。第一张卡片上不要把三笔价钱混在一起。
  zh_hk: 時段只係一條路徑。三條短片問邊個畀錢嚟用佢。一個包裹。一部 AED。然後一次巡檢。第一張卡上面唔好將三筆價錢撈埋一齊。
