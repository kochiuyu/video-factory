  item3_zh_hk: 打開呢一層
  en: Three buyers already have names. This sitting asks who may enter. Three shorts. A permit. Two books at the line. Then whether opening the band invents a fourth buyer.
  zh: 三个买方已经有名字。这一讲问谁可以进。三条短片。一张许可。线上的两本书。然后打开这一层，会不会造出第四个买方。
  zh_hk: 三個買方已經有名。但有買方唔代表想飛就飛。三條短片。一張許可。線上嘅兩本書。然後問：打開呢一層，會唔會憑空變出第四個買方。
- id: takeaway
  visual: title_card
  seconds: 14
  kicker: Open
  kicker_en: Open
  kicker_zh: 开场
  kicker_zh_hk: 開場
  title_en: 'This sitting: who may enter'
  title_zh: 这一讲：谁可以进
  title_zh_hk: 這一講：邊個可以入
  en: By the end, a closed band should mean exclusion, not delay, and an open band should still need a buyer.
  zh: 结束时，关着的一层应是排除，不是延误；打开的一层，仍要有买方。
  zh_hk: 結束時，冇許可係直接踢出門外，同塞車延誤係兩回事；打開咗嘅一層，仍然要有買方。
