title_en: 'This sitting: who may enter'
title_zh: 这一讲：谁可以进
title_zh_hk: 這一講：邊個可以入
objective_en: Open the policy unit. Three shorts. Who may fly, how the corridor crosses two books, then whether opening the band invents a buyer.
objective_zh: 打开政策这一讲。三条短片。谁可以飞，这条线怎样跨过两本书，然后打开这一层会不会造出买方。
objective_zh_hk: 打開政策呢一講。三條短片。邊個可以飛，呢條線點樣跨過兩本書，然後打開呢一層會唔會造出買方。
glossary:
- en: Open
  zh: 开场
  zh_hk: 開場
  lock: true
quiz:
- id: Q1
  type: comprehension
  en: Which three pictures does this sitting draw?
  zh: 这一讲画哪三张图？
  zh_hk: 呢一講畫邊三張圖？
  answer_en: The permit, the two books at the crossing, then opening without a buyer.
  answer_zh: 许可，过境时的两本书，然后打开却没有买方。
  answer_zh_hk: 許可，過境嗰陣嘅兩本書，然後打開但冇買方。
