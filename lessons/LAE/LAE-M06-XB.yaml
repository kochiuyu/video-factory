  q1_en: Who writes the two aviation books?
  q1_zh: 两本航空规则是谁写的？
  q1_zh_hk: 兩本航空規則係邊個寫嘅？
  q2_en: What extra gate does a parcel face?
  q2_zh: 包裹多面对哪一闸？
  q2_zh_hk: 包裹多面對邊一閘？
  s1_en: The hop is CAAC and the Hong Kong Civil Aviation Department.
  s1_zh: 这一跳是中国民航局和香港民航处。
  s1_zh_hk: 呢一跳係中國民航局同香港民航處。
  s2_en: A parcel adds a customs gate. Two legal books can still leave the parcel at the gate.
  s2_zh: 包裹再加一闸海关。两本合法的书，仍可能把包裹留在闸口。
  s2_zh_hk: 包裹再加一閘海關。兩本合法嘅書，仍然可能將包裹留喺閘口。
  s3_en: Both books can open. Next short asks whether that opening invents a buyer.
  s3_zh: 两本书都可以打开。下一支短片问：打开会不会造出买方。
  s3_zh_hk: 兩本書都可以打開。下一條短片問：打開會唔會造出買方。
