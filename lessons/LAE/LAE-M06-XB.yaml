  title_zh: 同一跳，两种载荷
  title_zh_hk: 同一跳，兩種載荷
  left_en: Parcel
  left_zh: 包裹
  left_zh_hk: 包裹
  right_en: Inspection
  right_zh: 巡检
  right_zh_hk: 巡檢
  s1_en: The parcel from the Shenzhen roof to the Sha Tin locker crosses. Two books, then customs.
  s1_zh: 从深圳屋顶到沙田储物柜的包裹要过境。两本书，然后是海关。
  s1_zh_hk: 由深圳屋頂到沙田儲物櫃嘅包裹要過境。兩本書，然後係海關。
  s2_en: A GBA bridge inspection may stay on one side. It still needs a permit. It may not need the second book, or the gate.
  s2_zh: 巡检大湾区一座桥，可以留在一侧。仍要许可。未必要第二本书，也未必要那一闸。
  s2_zh_hk: 巡檢大灣區一座橋，可以留喺一側。仍然要許可。未必要第二本書，亦都未必要嗰一閘。
  s3_en: Do not add visas, listings, or capital flows. The claim is aircraft, parcels, and two aviation books.
  s3_zh: 不要再加人的签证、上市或资金流动。要记住的是飞行器、包裹，和两本航空规则。
  s3_zh_hk: 唔好再加人嘅簽證、上市或者資金流動。要記住嘅係飛行器、包裹，同兩本航空規則。
