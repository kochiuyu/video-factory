  title_en: Would you share a ten-trip ferry pass?
  title_zh: 十程渡轮票，你会跟别人合用吗？
  title_zh_hk: 十程渡輪票，你會跟別人合用嗎？
  image: art/ferry-pass-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In March 2026, during Hong Kong's outlying-island ferry fare review, the Transport Department said
    multi-ride tickets and monthly passes would rise less than single fares. Why give frequent travellers
    a different price per trip? You set fares for a fictional harbour crossing. A single costs 12 Hong
    Kong dollars, and you are considering a ten-trip pass, valid for one week.
  zh: >-
    二零二六年三月，离岛渡轮检讨票价时，运输署表示，多程票和月票的加幅会低于单程票。为什么常客每程可以付得少一点？现在由你为一条虚构的过海渡轮航线定价。单程票十二港元，你正考虑推出一周有效的十程票。
  zh_hk: >-
    二零二六年三月，離島渡輪檢討票價嘅時候，運輸署話多程票同月票嘅加幅會低過單程票。點解常客每程可以俾少啲？而家由你幫一條虛構嘅過海渡輪航線定價。單程票十二蚊，你考慮緊推出一星期有效嘅十程票。
