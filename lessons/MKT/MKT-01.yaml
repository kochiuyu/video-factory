  s1_en: >-
    One commuter crosses ten times a week. Ten occasional riders cross once each.
  s1_zh: 一名通勤乘客每周坐十程；另外十名偶尔乘坐的乘客，每人只坐一程。
  s1_zh_hk: 一個通勤乘客每星期搭十程；另外十個偶爾乘搭嘅乘客，每人淨係搭一程。
  s2_en: >-
    A single costs 12 dollars. The pass would cost either 90 or 110 dollars, and at first only one passenger
    may use it.
  s2_zh: 单程票十二元。十程票打算定价九十元或者一百一十元，起初限一人使用。
  s2_zh_hk: 單程票十二蚊。十程票打算定價九十蚊或者一百一十蚊，起初限一人使用。
  s3_en: >-
    Travellers take the same trips whatever the price, and anyone can still buy singles.
  s3_zh: 不管票价怎么定，大家坐船的次数都不变，而且随时可以照买单程票。
  s3_zh_hk: 無論票價點定，大家搭船嘅次數都唔變，而且隨時可以照買單程票。
