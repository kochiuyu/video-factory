  title_en: >-
    One fact changes: sharing
  title_zh: 条件有变：可以合用
  title_zh_hk: 條件有變：可以合用
  step1_en: The pass can be shared at no cost
  step1_zh: 十程票可免费合用
  step1_zh_hk: 十程票可免費合用
  step2_en: Ten riders split one pass
  step2_zh: 10 名乘客一起出发，合买一张
  step2_zh_hk: 10 名乘客一起出發，合買一張
  step3_en: Trip demand stays fixed
  step3_zh: 乘坐需求维持不变
  step3_zh_hk: 乘搭需求維持不變
  s1_en: >-
    One rule changes. The pass can now be shared, and sharing costs nothing.
  s1_zh: 有一个条件变了：十程票现在可以合用，而且合用不用另外付钱。
  s1_zh_hk: 有一個條件變咗：十程票而家可以合用，而且合用唔使另外俾錢。
  s2_en: >-
    The ten occasional riders travel together, so they can buy one pass and split the price equally.
  s2_zh: 十名偶尔乘坐的乘客一起出发，可以合买一张十程票，平分票价。
  s2_zh_hk: 十個偶爾乘搭嘅乘客一齊出發，可以夾錢買一張十程票，平分票價。
  s3_en: >-
    Nobody takes more or fewer trips than before. Only the tickets people buy can change.
  s3_zh: 乘坐需求维持不变，没有人多坐或少坐，变的只是大家买哪种票。
  s3_zh_hk: 乘搭需求維持不變，冇人多搭或者少搭，變嘅只係大家買邊種票。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
