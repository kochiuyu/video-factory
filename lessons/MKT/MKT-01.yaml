  title_en: Which pass price?
  title_zh: 十程票定价多少？
  title_zh_hk: 十程票定價多少？
  en: >-
    Which pass price earns more while still giving the commuter a discount? And what will the occasional
    riders buy? Pause and vote.
  zh: 哪个十程票价既能给通勤乘客折扣，又能带来较多收入？偶尔乘坐的乘客又会买哪种票？请暂停，投个票。
  zh_hk: 邊個十程票價既可以俾通勤乘客折扣，又可以帶來較多收入？偶爾乘搭嘅乘客又會買邊種票？暫停，投個票。
