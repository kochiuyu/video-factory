- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Compare two worlds
  title_zh: 比较「办」与「不办」
  title_zh_hk: 比較「辦」與「不辦」
  step1_en: >-
    With the campaign: HK$18,000
  step1_zh: 办活动：HK$18,000
  step1_zh_hk: 辦活動：HK$18,000
  step2_en: >-
    Without it: 700 × (60 − 30) = HK$21,000
  step2_zh: 不办：700 × (60 − 30) = HK$21,000
  step2_zh_hk: 不辦：700 × (60 − 30) = HK$21,000
  step3_en: >-
    Change: −HK$3,000
  step3_zh: 贡献少了 HK$3,000
  step3_zh_hk: 貢獻少了 HK$3,000
  s1_en: >-
    Count purchases caused by the offer, not purchases using it. A redeemed coupon proves a discount was
    used, not that it changed the decision. With the campaign, contribution after its running cost is
    18,000.
  s1_zh: >-
    要算的是优惠带来多少额外购买，不是有多少购买用了优惠。用券只证明顾客享用了折扣，不能证明是折扣让他决定购买。办活动，扣除活动费后的贡献是一万八千元。
  s1_zh_hk: >-
    要計嘅係優惠帶來幾多額外購買，唔係有幾多購買用咗優惠。用券只係證明顧客享用咗折扣，唔證明係折扣令佢決定買。辦活動，扣除活動費之後嘅貢獻係一萬八千蚊。
  s2_en: >-
    Without it, the 700 full-price meals contribute 700 times 60 minus 30, or 21,000.
  s2_zh: 不办的话，那七百份原价餐点的贡献是七百乘以六十减三十，即两万一千元。
  s2_zh_hk: 唔辦嘅話，嗰七百份原價餐點嘅貢獻係七百乘六十減三十，即係兩萬一千蚊。
  s3_en: >-
    So under the supplied estimate the campaign reduces contribution by 3,000. That compares the affected
    meals, not the café's total profit.
  s3_zh: 所以按题目的估算，办活动令贡献少了三千元。这里只比较受影响的餐点，不是咖啡店的整体盈利。
  s3_zh_hk: 所以按題目嘅估算，辦活動令貢獻少咗三千蚊。呢度只係比較受影響嘅餐點，唔係咖啡店嘅整體盈利。
