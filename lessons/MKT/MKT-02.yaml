  s1_en: >-
    The café funds the whole 10-dollar discount. Each meal has 30 dollars of variable cost, and running
    the campaign costs 2,000.
  s1_zh: 这次十元折扣全部由咖啡店承担。每份餐点的变动成本是三十元，推行活动另需两千元。
  s1_zh_hk: 今次十蚊折扣全部由咖啡店承擔。每份餐點嘅變動成本係三十蚊，推行活動另外要兩千蚊。
  s2_en: >-
    There is spare capacity, no extra staffing, no displaced sales and no other purchases. Each coupon
    buys one meal.
  s2_zh: 店里有闲置产能，不用增聘人手，也不会挤走其他销售；顾客没有加购，每张券只用于一份餐点。
  s2_zh_hk: 店入面有閒置產能，唔使請多人，亦唔會擠走其他生意；顧客冇加購，每張券只用喺一份餐點。
  s3_en: >-
    The discounted meals contribute 1,000 times 60 minus 10 minus 30, which is 20,000, or 18,000 after
    the running cost. That is not yet the gain compared with doing nothing.
  s3_zh: 折扣餐点的边际贡献是一千乘以六十减十再减三十，即两万元；扣除活动费后剩一万八千元。但这还不是办活动相对于不办活动的变化。
  s3_zh_hk: 折扣餐點嘅邊際貢獻係一千乘六十減十再減三十，即係兩萬蚊；扣除活動費之後剩一萬八千蚊。但呢個仲未係辦活動同唔辦活動比較嘅變化。
