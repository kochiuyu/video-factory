  visual: steps
  layout: rows
  seconds: 24
  kicker: Calculate
  kicker_en: Calculate
  kicker_zh: 计算
  kicker_zh_hk: 計算
  title_en: Another way to count
  title_zh: 另一种算法
  title_zh_hk: 另一種算法
  step1_en: >-
    300 additional meals: +HK$6,000
  step1_zh: 新增 300 份：+HK$6,000
  step1_zh_hk: 新增 300 份：+HK$6,000
  step2_en: >-
    700 meals discounted anyway: −HK$7,000
  step2_zh: 原本会卖出的 700 份：−HK$7,000
  step2_zh_hk: 原本會賣出的 700 份：−HK$7,000
  step3_en: Running cost −2,000; net −HK$3,000
  step3_zh: 活动费 −2,000；净变动 −HK$3,000
  step3_zh_hk: 活動費 −2,000；淨變動 −HK$3,000
  s1_en: >-
    Another way to see it: the 300 additional meals each contribute 20 dollars, which is 6,000.
  s1_zh: 也可以这样算：新增的三百份，每份贡献二十元，共六千元。
  s1_zh_hk: 亦可以咁計：新增嘅三百份，每份貢獻二十蚊，總共六千蚊。
  s2_en: >-
    Discounting 700 meals that would have happened anyway gives up 10 dollars each, or 7,000.
  s2_zh: 原本就会卖出的七百份，每份让出十元，共七千元。
  s2_zh_hk: 本來都會賣出嘅七百份，每份讓出十蚊，總共七千蚊。
  s3_en: >-
    Running the campaign costs another 2,000. Six thousand minus seven thousand minus two thousand is
    minus 3,000.
  s3_zh: 活动另外花两千元。六千减七千再减两千，净变动是负三千元。
  s3_zh_hk: 活動另外使兩千蚊。六千減七千再減兩千，淨變動係負三千蚊。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: When would the offer pay?
  title_zh: 优惠何时才划算？
  title_zh_hk: 優惠何時才划算？
  en: >-
    Hold redemptions at 1,000 and let x be the additional purchases. The change is 30x minus 12,000, so
    it breaks even at 400 additional meals, or 40 percent. At 300, covering the 3,000 shortfall needs
    exactly 100 later full-price meals caused by the campaign, before timing or risk. Repeat visits that
    would have happened anyway do not count.
  zh: >-
    把用券总数固定在一千，设 x 为新增购买量。贡献变动是三十 x 减一万二千，新增四百份，也就是百分之四十，才刚好达到盈亏平衡。如果只新增三百份，要弥补三千元缺口，活动还要额外带来刚好一百份原价餐点，这还没计时间和风险。本来就会再来的光顾不能算进去。
  zh_hk: >-
    將用券總數固定喺一千，設 x 做新增購買量。貢獻變動係三十 x 減一萬二千，新增四百份，即係百分之四十，先啱啱打和。如果只係新增三百份，要填補三千蚊缺口，活動仲要額外帶來啱啱一百份原價餐點，呢個仲未計時間同風險。本來都會再嚟嘅光顧唔計得。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Count what the offer caused
  title_zh: 要算优惠带来的额外购买
  title_zh_hk: 要計算優惠帶來的額外購買
  q1_en: Redemptions ≠ additional purchases
  q1_zh: 用券数 ≠ 新增购买
  q1_zh_hk: 用券數 ≠ 新增購買
  q2_en: >-
    Here: −HK$3,000; break-even at 400
  q2_zh: 本例：−HK$3,000；400 份才盈亏平衡
  q2_zh_hk: 本例：−HK$3,000；400 份才打和
  s1_en: >-
    If the goal is next week's contribution, do not repeat the unchanged campaign under these assumptions.
    A redemption total shows who used the discount, not what it changed.
  s1_zh: 如果目标是增加下周的贡献，在这些假设下就不应该原样重办。用券总数只说明谁用了折扣，不说明折扣改变了什么。
  s1_zh_hk: 如果目標係增加下星期嘅貢獻，喺呢啲假設之下就唔應該原樣重辦。用券總數只係講到邊個用咗折扣，講唔到折扣改變咗乜。
  s2_en: >-
    A better test targets a different group or time slot, keeps a comparable no-offer group, and measures
    contribution, not redemptions alone. 'They might return' is a hypothesis to measure.
  s2_zh: 下一轮可以试另一类顾客或时段，保留一组条件相近但没有优惠的顾客，衡量销售贡献，而不只看用券数。“他们可能再来”只是有待验证的假说。
  s2_zh_hk: 下一輪可以試另一類顧客或者時段，保留一組條件相近但冇優惠嘅顧客，量度銷售貢獻，唔好淨係睇用券數。「佢哋可能再嚟」只係有待驗證嘅假說。
  s3_en: >-
    The café, its costs and the 700/300 split are classroom assumptions. They cannot evaluate the real
    public voucher programme. Official scene art is a teaching illustration only.
  s3_zh: 咖啡店、成本和七百比三百的分拆都是课堂假设，不能用来评价真实的公共消费券计划。官方场景图只是教学插图。
  s3_zh_hk: 咖啡店、成本同七百比三百嘅分拆都係課堂假設，唔可以用嚟評價真實嘅公共消費券計劃。官方場景圖只係教學插圖。
