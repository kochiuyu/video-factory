- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: A small randomized pilot
  title_zh: 小型随机试验的结果
  title_zh_hk: 小型隨機試驗的結果
  step1_en: 700 meals would have sold at full price
  step1_zh: 700 份没有优惠也会按原价卖出
  step1_zh_hk: 700 份沒有優惠也會按原價賣出
  step2_en: Only 300 were additional purchases
  step2_zh: 真正新增的只有 300 份
  step2_zh_hk: 真正新增的只有 300 份
  step3_en: >-
    Repeat visits: possible, unmeasured
  step3_zh: 日后再光顾：有可能，但未衡量
  step3_zh_hk: 日後再光顧：有可能，但未量度
  s1_en: >-
    An analyst brings a small randomized pilot comparing similar eligible customers who did and did not
    get the offer. Accept its estimate: 700 of the 1,000 meals would have been bought at full price anyway.
  s1_zh: >-
    分析员带来一项小型随机试验，把条件相近的顾客分成有优惠和没有优惠两组来比较。请接受它的估算：一千份餐点中，有七百份就算没有优惠券，也会按原价卖出。
  s1_zh_hk: >-
    分析員帶嚟一個小型隨機試驗，將條件相近嘅顧客分成有優惠同冇優惠兩組嚟比較。請接受佢嘅估算：一千份餐點入面，有七百份就算冇優惠券，都會照原價賣出。
  s2_en: >-
    Only 300 were additional purchases, and many of the 700 were regular customers. Assume the same mix
    and costs next week.
  s2_zh: 真正新增的只有三百份，而那七百份当中有不少是熟客。假设下周重办时，比例和成本都不变。
  s2_zh_hk: 真正新增嘅只有三百份，嗰七百份入面有唔少係熟客。假設下星期重辦嘅時候，比例同成本都唔變。
  s3_en: >-
    Future full-price repeat visits are possible but unmeasured. The estimate is invented for the case,
    not a finding about the Tourism Board programme.
  s3_zh: 部分顾客日后可能会按原价再来，但这一点还没有衡量。这个估算是案例设定，不是对旅发局计划的研究结果。
  s3_zh_hk: 部分顧客日後可能會用原價再嚟，但呢點仲未量度。呢個估算係個案設定，唔係對旅發局計劃嘅研究結果。
