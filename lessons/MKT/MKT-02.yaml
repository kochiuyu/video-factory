  kicker_zh_hk: MKT-02
  title_en: A thousand coupons. A better business?
  title_zh: 用了千张优惠券，生意真的多了吗？
  title_zh_hk: 用了千張優惠券，生意真的多了嗎？
  image: art/coupon-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In December 2023, the Hong Kong Tourism Board announced 200,000 dining vouchers of 100 dollars for
    residents. A popular offer can bring people in. Last week, 1,000 customers used your 10-dollar coupon
    on a 60-dollar meal at your fictional Hong Kong café. Your team wants to repeat it next week, and
    you must approve it today. But a busy counter does not, by itself, tell you how much business the
    offer added.
  zh: >-
    二零二三年十二月，香港旅游发展局宣布向市民发放二十万张一百元的餐饮消费券。优惠受欢迎，店里自然热闹。上周，你经营的虚构香港咖啡店里，有一千名顾客用十元优惠券买了原价六十元的餐点。团队想下周再做一次，今天就要由你拍板。可是柜台前很忙，并不能告诉你优惠究竟带来了多少额外生意。
  zh_hk: >-
    二零二三年十二月，香港旅遊發展局宣布向市民派二十萬張一百蚊嘅餐飲消費券。優惠受歡迎，店入面自然好熱鬧。上星期，你經營嘅虛構香港咖啡店，有一千個顧客用十蚊優惠券買咗原價六十蚊嘅餐。團隊想下星期再做一次，今日就要你拍板。但係櫃枱前面好忙，並唔可以話俾你知優惠究竟帶來咗幾多額外生意。
