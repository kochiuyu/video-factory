  title_zh_hk: 70%、20%，還是另作分配？
  en: >-
    Would you give the collaboration 70 percent of the display, keep it at 20, or choose another balance?
    Beyond a launch sellout, what would count as success for the shop's objective? Pause and vote.
  zh: 你会把百分之七十的陈列空间给联名款、维持百分之二十，还是另作分配？按店铺的目标，除了首批售罄，还有什么才算成功？请暂停，投个票。
  zh_hk: 你會將百分之七十嘅陳列空間俾聯乘款、維持百分之二十，定係另作分配？按間舖訂落嘅目標，除咗首批賣晒，仲有咩先算成功？暫停，投個票。
