  title_en: Expand, redesign, or stop?
  title_zh: 扩大、重新设计，还是结束？
  title_zh_hk: 擴大、重新設計，還是結束？
  en: >-
    Would you expand the character-first display unchanged, redesign it, or stop the collaboration? How
    does your choice connect new attention to the shop's own product, and what evidence would make you
    reconsider? Pause and vote.
  zh: >-
    你会照原来以角色为主的方式扩大陈列、重新设计陈列，还是结束联名合作？你的选择怎样把新吸引来的目光引向店铺自己的产品？哪些证据会令你重新考虑？请暂停，投个票。
  zh_hk: >-
    你會照原本以角色為主嘅方式擴大陳列、重新設計陳列，定係結束聯乘？你嘅選擇點樣將新吸引到嘅目光帶去間舖自己嘅產品？有咩證據會令你重新考慮？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Attention to whose brand?
  title_zh: 顾客留意到的是谁的品牌？
  title_zh_hk: 顧客留意到的是誰的品牌？
  step1_en: Sales and attention are real outcomes
  step1_zh: 卖出产品、吸引目光都是实在成果
  step1_zh_hk: 賣出產品、吸引目光都是實在成果
  step2_en: Partner recall ≠ maker recall
  step2_zh: 认得合作角色 ≠ 记得制作者
  step2_zh_hk: 認得合作角色 ≠ 記得製作者
  step3_en: Collector demand may still be valuable
  step3_zh: 收藏需求本身也可能有商业价值
  step3_zh_hk: 收藏需求本身也可能有商業價值
  s1_en: >-
    The collaboration sold products and attracted attention. Those are genuine outcomes.
  s1_zh: 联名合作卖出了产品，也吸引了目光，这些都是实在的成果。
  s1_zh_hk: 聯乘賣出咗產品，亦吸引到目光，呢啲都係實在嘅成果。
  s2_en: >-
    But the objective also needs customers to connect the character with this shop and its refillable
    notebook. Remembering the partner is not remembering the maker, or understanding the benefit.
  s2_zh: 但店铺的目标还包括让顾客把角色和这家店、这款可换内页的笔记本联系起来。认得合作角色，不等于记得制作者，也不等于了解产品有什么好处。
  s2_zh_hk: 但間舖嘅目標仲包括等顧客將角色同呢間舖、呢款可以換內頁嘅筆記簿連埋一齊。認得合作角色，唔等於記得製作者，亦唔等於了解產品有咩好處。
  s3_en: >-
    Collector demand may be commercially valuable in its own right. If selling collectibles becomes the
    main goal, say so, and judge margins and displaced sales rather than launch excitement.
  s3_zh: 收藏需求本身也可能有商业价值。如果管理层改为以卖收藏品为主要目标，就应该说清楚，并评估利润率和被分薄的原有销售，而不是把推出时的热潮当证据。
  s3_zh_hk: >-
    收藏需求本身都可能有商業價值。如果管理層改為以賣收藏品做主要目標，就應該講清楚，並且評估利潤率同被分薄嘅原有銷售，唔好將推出時嘅熱潮當做證據。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Redesign
  kicker_en: Redesign
  kicker_zh: 重新设计
  kicker_zh_hk: 重新設計
  title_en: Build a bridge to the product
  title_zh: 从角色带到产品本身
  title_zh_hk: 從角色帶到產品本身
  step1_en: Make the shop's identity visible
  step1_zh: 突出店铺自身的特色
  step1_zh_hk: 突出店舖自身的特色
  step2_en: Show the binding and refill mechanism
  step2_zh: 示范装订工艺及更换内页
  step2_zh_hk: 示範裝訂工藝及更換內頁
  step3_en: Link the owl to writing or journaling
  step3_zh: 用猫头鹰插画带出书写用途
  step3_zh_hk: 用貓頭鷹插畫帶出書寫用途
  s1_en: >-
    A defensible response keeps a bounded collaboration but redesigns the presentation, starting by making
    the shop's own identity visible.
  s1_zh: 一个有理据的做法，是保留一定规模的联名合作，但重新设计陈列，首先要突出店铺自身的特色。
  s1_zh_hk: 一個有理據嘅做法，係保留一定規模嘅聯乘，但重新設計陳列，首先要突出間舖自己嘅特色。
  s2_en: >-
    Show the binding and the refill mechanism, and keep core notebooks and refills easy to find.
  s2_zh: 示范装订工艺和更换内页的方法，常设笔记本和替换内页也要容易找到。
  s2_zh_hk: 示範裝訂工藝同換內頁嘅方法，常設筆記簿同替換內頁都要容易搵到。
  s3_en: >-
    Connect the owl's artwork to writing or keeping a journal. This is a hypothesis to test, not a guaranteed
    fix, and in practice the scope of authorized use must be checked.
  s3_zh: 再用猫头鹰插画带出书写或写日志的用途。这只是有待验证的想法，不保证奏效；现实中还要先查清授权用途的范围。
  s3_zh_hk: 再用貓頭鷹插畫帶出書寫或者寫日誌嘅用途。呢個只係有待驗證嘅想法，唔保證有效；現實中仲要先查清楚授權用途嘅範圍。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Measure the intended result
  title_zh: 衡量原本想达到的成效
  title_zh_hk: 量度原本想達到的成效
  en: >-
    Test the revised display against the current one in comparable periods or locations. Track sales,
    contribution after relevant costs, unprompted shop recall, understanding of refills and observed use
    separately, then measure actual repeat purchases with consent. Decide in advance what evidence would
    support 70, 20 or another share. And do not add the interview counts together.
  zh: >-
    在条件相若的时段或地点，比较新陈列和现行陈列。分别记录销量、扣除相关成本后的贡献、无提示下能否想起店名、对更换内页的理解，以及实际使用情况；之后在取得同意的前提下，衡量实际回购。先订明什么证据支持百分之七十、二十或其他比例。还有，不要把访问中的几个人数加起来。
  zh_hk: >-
    喺條件相若嘅時段或者地點，比較新陳列同現行陳列。分開記錄銷量、扣除相關成本之後嘅貢獻、冇提示之下記唔記得店名、對換內頁嘅理解，同埋實際使用情況；之後喺取得同意嘅前提下，量度實際回購。事先講明咩證據支持百分之七十、二十或者其他比例。仲有，唔好將訪問入面幾個人數加埋一齊。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: From attention to understanding
  title_zh: 把目光引向自家产品
  title_zh_hk: 把目光引向自家產品
  q1_en: Sellout ≠ shop recall or understanding
  q1_zh: 售罄 ≠ 记得店名或了解产品
  q1_zh_hk: 售罄 ≠ 記得店名或了解產品
  q2_en: >-
    18 · 4 · 3: overlapping, not additive
  q2_zh: 18 · 4 · 3：可重叠，不可相加
  q2_zh_hk: 18 · 4 · 3：可重疊，不可相加
  s1_en: >-
    A collaboration that sells out has earned attention. Whether it served this shop's objective depends
    on whether buyers connect the character to the maker and the refill system.
  s1_zh: 联名款卖光，说明赢得了关注；但是否达到店铺的目标，要看买家能不能把角色和制作者、和更换内页的方式联系起来。
  s1_zh_hk: 聯乘款賣晒，代表贏到關注；但係有冇達到間舖嘅目標，要睇買家識唔識將角色同製作者、同換內頁嘅方式連埋一齊。
  s2_en: >-
    Keep a bounded collaboration, redesign it to show the product, and test it against the current display
    before moving space to 70 percent.
  s2_zh: 可以保留一定规模的联名合作，重新设计陈列来展示产品，先跟现行陈列比较测试，再决定要不要把空间增加到百分之七十。
  s2_zh_hk: 可以保留一定規模嘅聯乘，重新設計陳列嚟展示產品，先同現行陳列比較測試，再決定要唔要將空間加到百分之七十。
  s3_en: >-
    The stationery shop, the owl character and the interview results are fictional. No claim is made that
    the real collaboration damaged any company's identity. Official scene art is a teaching illustration
    only.
  s3_zh: 文具店、猫头鹰角色和访问结果都是虚构的，并不指称真实的联名合作损害了任何企业的品牌形象。官方场景图只是教学插图。
  s3_zh_hk: 文具舖、貓頭鷹角色同訪問結果都係虛構嘅，並唔指稱真實嘅聯乘損害咗任何企業嘅品牌形象。官方場景圖只係教學插圖。
duration_target_s: 198
