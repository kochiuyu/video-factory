  title_en: They remember the character. Do they remember us?
  title_zh: 角色记得住，品牌又记得住吗？
  title_zh_hk: 角色記得住，品牌又記得住嗎？
  image: art/character-collaboration-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 23 March 2025, Chow Tai Fook launched a Chiikawa jewellery collection in Hong Kong and Macau, and
    trade reports said the first batch sold out quickly. A fast launch shows attention, not automatically
    brand understanding. Now you manage a fictional heritage stationery shop known for refillable notebooks.
    A collaboration sleeve with an invented owl character sold out its first 100 notebooks in one weekend.
  zh: >-
    二零二五年三月二十三日，周大福在香港和澳门推出 Chiikawa 珠宝系列，有业界报道指首批产品很快售罄。卖得快说明有人关注，却不等于顾客更了解品牌。现在，你经营一家虚构的香港老字号文具店，以可更换内页的笔记本闻名。印有虚构猫头鹰角色封套的联名款，首批一百本一个周末就卖完了。
  zh_hk: >-
    二零二五年三月二十三號，周大福喺香港同澳門推出 Chiikawa 珠寶系列，有業界報道話首批產品好快賣晒。賣得快代表有人留意，但唔等於顧客更加了解個品牌。而家，你經營一間虛構嘅香港老字號文具舖，出名做可以換內頁嘅筆記簿。印住虛構貓頭鷹角色封套嘅聯乘款，首批一百本一個週末就賣晒。
