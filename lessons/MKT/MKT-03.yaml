  s1_en: >-
    Your objective is to introduce new notebook users to the shop's craftsmanship and refill system, while
    earning sales.
  s1_zh: 你的目标是在带动销售的同时，让初次使用这款笔记本的顾客认识店铺的工艺，以及怎样更换内页。
  s1_zh_hk: 你嘅目標係喺帶動銷售嘅同時，等第一次用呢款筆記簿嘅顧客認識間舖嘅工藝，同埋點樣換內頁。
  s2_en: >-
    The merchandising team proposes raising the collaboration from 20 to 70 percent of next quarter's
    display. Space is fixed, so core notebooks and refills fall from 80 to 30 percent.
  s2_zh: 商品陈列团队建议，下季把联名款的陈列空间从百分之二十增加到百分之七十。总空间不变，常设笔记本和替换内页就会从百分之八十减到百分之三十。
  s2_zh_hk: 商品陳列團隊建議，下季將聯乘款嘅陳列空間由百分之二十加到百分之七十。總空間唔變，常設筆記簿同替換內頁就會由百分之八十減到百分之三十。
  s3_en: >-
    Prices and quality do not change, and the partner permits either approach. Launch sell-through is
    known, but later use, repeat purchases, margins and displaced core sales are not yet measured.
  s3_zh: 价格和品质不变，合作方两种做法都同意。首批卖了多少已经知道，但顾客怎样使用、会不会再买、利润率，以及分薄了多少常设系列的销售，都还没有衡量。
  s3_zh_hk: 價錢同品質唔變，合作方兩種做法都接受。首批賣咗幾多已經知道，但顧客點樣用、會唔會再買、利潤率，同埋分薄咗幾多常設系列嘅銷售，都仲未量度。
