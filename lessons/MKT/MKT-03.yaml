  s1_en: >-
    Twenty launch buyers volunteer for a short follow-up interview. Without prompts, 18 can name the character.
  s1_zh: 二十名首批买家自愿参加简短的跟进访问。在没有提示的情况下，十八人说得出角色的名字。
  s1_zh_hk: 二十個首批買家自願參加簡短嘅跟進訪問。喺冇提示嘅情況下，十八個人講得出角色個名。
  s2_en: >-
    Only four can name the stationery shop. The answers overlap; they are not separate groups.
  s2_zh: 只有四人记得文具店的名称。同一个人可以答中好几项，这些并不是互不重叠的几组人。
  s2_zh_hk: 只有四個人記得文具舖個名。同一個人可以答中幾項，呢啲唔係互不重疊嘅幾組人。
  s3_en: >-
    Three can explain the refill system, and several say the sleeve was their main reason for buying.
    It is a small volunteer group: diagnostic, not representative, and no one has been tracked long enough
    to show repeat buying.
  s3_zh: >-
    三人能解释怎样更换内页，有几位说封套是他们购买的主要原因。这是一小组自愿受访者，有助找出问题，却不能代表所有买家，跟进时间也不足以看出有没有人再买。
  s3_zh_hk: >-
    三個人識解釋點樣換內頁，有幾位話封套係佢哋買嘅主要原因。呢個係一小組自願受訪者，幫到手搵出問題，但代表唔到所有買家，跟進時間亦唔夠長，睇唔到有冇人再買。
