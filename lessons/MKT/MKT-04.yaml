  title_en: More days to return it, or less trouble?
  title_zh: 退货期限长一点，还是手续简单一点？
  title_zh_hk: 退貨期限長一點，還是手續簡單一點？
  image: art/return-friction-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In September 2025, Taobao described returns and exchanges as part of its localised shopping experience
    for Hong Kong. That was the company's own promotional statement. Now you run a fictional Hong Kong
    online homewares shop selling cushion covers. First-time buyers cannot see the fabric colour or feel
    the texture before delivery. Your change-of-mind policy allows 30 days, but customers must print a
    form, arrange postage and pay the return charge.
  zh: >-
    二零二五年九月，淘宝把退换货说成本地化购物体验的一环，包括香港的跨境退货。这是公司自己的宣传说法。现在，你在香港经营一家虚构的线上家居用品店，卖抱枕套。第一次光顾的顾客，收货前看不到布料颜色，也摸不到质感。店里的无理由退货期是三十天，但顾客要自己打印表格、安排邮寄，还要付退货运费。
  zh_hk: >-
    二零二五年九月，淘寶將退換貨講成本地化購物體驗嘅一部分，包括香港嘅跨境退貨。呢個係公司自己嘅宣傳講法。而家，你喺香港經營一間虛構嘅網上家品店，賣抱枕套。第一次幫襯嘅顧客，收貨之前睇唔到布料顏色，亦摸唔到質感。店舖嘅改變主意退貨期係三十日，但顧客要自己列印表格、安排郵寄，仲要俾退貨運費。
