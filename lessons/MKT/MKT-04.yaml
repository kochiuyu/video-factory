  footer_en: Same eligibility, refund, inspection
  footer_zh: 退货资格、退款和检查标准不变
  footer_zh_hk: 退貨資格、退款和檢查標準不變
  s1_en: >-
    All three keep the same item eligibility, full refund after inspection, and inspection standards.
    Option A doubles the window to 60 days, with the same postal process and customer-paid postage.
  s1_zh: 三个方案的退货资格、检查后全数退款和检查标准都一样。方案 A 把期限延长到六十天，邮寄流程不变，运费仍由顾客付。
  s1_zh_hk: 三個方案嘅退貨資格、檢查後全數退款同檢查標準都一樣。方案 A 將期限延長到六十日，郵寄流程不變，運費仍然由顧客俾。
  s2_en: >-
    Option B keeps 30 days but adds a staffed local drop-off, with no printing and no return-delivery
    charge. The customer still makes a trip, and the shop pays handling and transport.
  s2_zh: 方案 B 维持三十天，但加设有工作人员的本地退货点，顾客不用打印，也不用付退货运费。不过顾客仍然要出门一趟，处理和运输费用由店铺承担。
  s2_zh_hk: 方案 B 維持三十日，但加設有職員嘅本地退貨點，顧客唔使列印，亦唔使俾退貨運費。不過顧客仍然要出門一趟，處理同運輸費用由店舖負責。
  s3_en: >-
    Option C keeps returns as they are and improves colour photos, texture close-ups and descriptions.
    You can fund only one for the next pilot, and there is no reliable estimate yet of extra purchases
    or return costs.
  s3_zh: 方案 C 维持现有的退货安排，改善色彩照片、质感特写和商品描述。下一轮试点只能选一项，而新增购买量和退货总成本，目前都没有可靠估算。
  s3_zh_hk: 方案 C 維持現行嘅退貨安排，改善色彩相片、質感特寫同商品描述。下一輪試點只可以揀一項，而新增購買量同退貨總成本，暫時都冇可靠估算。
