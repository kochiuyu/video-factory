  title_en: Which improvement first?
  title_zh: 先试哪一项？
  title_zh_hk: 先試哪一項？
  en: >-
    Which would you test first: more return days, an easier return process, or better product information?
    What customer concern does your choice address? Pause and vote.
  zh: 你会先试哪一项：延长期限、简化退货手续，还是改善商品资讯？这个选择针对的是顾客哪项顾虑？请暂停，投个票。
  zh_hk: 你會先試邊一項：延長期限、簡化退貨手續，定係改善商品資訊？呢個選擇針對顧客邊一樣顧慮？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Two small samples
  title_zh: 两组小样本
  title_zh_hk: 兩組小樣本
  step1_en: 18 of 20 returns began within 7 days
  step1_zh: 20 笔退货中 18 笔在 7 天内申请
  step1_zh_hk: 20 宗退貨中 18 宗在 7 天內申請
  step2_en: >-
    14 prospects: postage, printing or trip
  step2_zh: 20 名准顾客中 14 人提运费、打印或出门
  step2_zh_hk: 20 名準顧客中 14 人提運費、列印或出門
  step3_en: 3 name the deadline; 3 other concerns
  step3_zh: 3 人在意期限；3 人另有顾虑
  step3_zh_hk: 3 人在意期限；3 人另有顧慮
  s1_en: >-
    A review of the last 20 completed change-of-mind returns finds that 18 were started within seven days
    of delivery. Those customers could judge colour and texture quickly.
  s1_zh: 店铺查了最近二十笔已完成的无理由退货，发现其中十八笔在收货后七天内就申请了。这些顾客很快就能判断颜色和质感合不合适。
  s1_zh_hk: 店舖查咗最近二十宗已完成嘅改變主意退貨，發現當中十八宗喺收貨後七日內就申請。呢啲顧客好快就判斷到顏色同質感啱唔啱。
  s2_en: >-
    Staff also interview 20 hesitant prospective buyers who have not ordered. Asked for one main concern,
    14 name the postage cost, the printing, or the trip needed to return an item.
  s2_zh: 店员另外访问了二十名还在犹豫、没有下单的准顾客。问到最主要的顾虑，十四人提到运费、打印，或者要出门退货。
  s2_zh_hk: 店員另外訪問咗二十個仲喺度猶豫、未落單嘅準顧客。問到最主要嘅顧慮，十四個人提到運費、列印，或者要出門退貨。
  s3_en: >-
    Three name the deadline and three name other concerns. Both are small convenience samples: completed
    returns miss people deterred from buying or returning, and stated concerns are not purchases.
  s3_zh: 三人在意期限，另外三人提到其他顾虑。两组都是小规模的便利样本：已完成的退货不包括却步而没买或没退的人，受访者说的顾虑也不是实际订单。
  s3_zh_hk: >-
    三個人在意期限，另外三個人提到其他顧慮。兩組都係小規模嘅便利樣本：已完成嘅退貨唔包括因為卻步而冇買或者冇退嘅人，受訪者講嘅顧慮亦唔係實際訂單。
