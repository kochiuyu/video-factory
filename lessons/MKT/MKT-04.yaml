- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Match the promise to the concern
  title_zh: 承诺要对准顾客的顾虑
  title_zh_hk: 承諾要對準顧客的顧慮
  step1_en: >-
    A: doubles the stated window
  step1_zh: A：名义期限加倍
  step1_zh_hk: A：名義期限加倍
  step2_en: >-
    B: a reasonable first hypothesis
  step2_zh: B：合理的优先测试假设
  step2_zh_hk: B：合理的優先測試假設
  step3_en: >-
    C: less uncertainty, but no touch
  step3_zh: C：减少不确定性，难呈现手感
  step3_zh_hk: C：減少不確定性，難呈現手感
  s1_en: >-
    Option A doubles the stated window, but the evidence points more strongly to return cost and effort
    than to a lack of days. Some customers may still need more time; small samples do not show they never
    exist.
  s1_zh: >-
    方案 A 把名义期限加倍，但现有资料显示，退货运费和麻烦程度比天数不够更值得关注。当然，有些顾客可能真的需要多点时间，小样本不能证明没有这类人。
  s1_zh_hk: 方案 A 將名義期限加倍，但現有資料顯示，退貨運費同麻煩程度比日數唔夠更值得關注。當然，有啲顧客可能真係要多啲時間，小樣本證明唔到冇呢類人。
  s2_en: >-
    So B is a reasonable first hypothesis to test, not a proven winner. A distant or inconvenient drop-off
    could still be unattractive, so test whether it really shortens the journey for the customers you
    want.
  s2_zh: >-
    所以 B 是合理的优先测试假设，但还没证实是最佳方案。如果退货点太远或者营业时间不方便，吸引力仍然有限，要测试它能不能真正为目标顾客缩短路程。
  s2_zh_hk: >-
    所以 B 係合理嘅優先測試假設，但仲未證實係最好嘅方案。如果退貨點太遠或者營業時間唔方便，吸引力仍然有限，要測試佢係咪真係幫目標顧客縮短路程。
  s3_en: >-
    Option C could reduce uncertainty before purchase, though photos cannot fully reproduce touch or every
    screen's colour.
  s3_zh: 方案 C 有望减少购买前的不确定性，但照片不能完全呈现手感，也控制不了每部屏幕的色差。
  s3_zh_hk: 方案 C 有望減少購買前嘅不確定性，但相片唔可以完全呈現手感，亦控制唔到每部屏幕嘅色差。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Measure
  kicker_en: Measure
  kicker_zh: 衡量
  kicker_zh_hk: 量度
  title_en: Reassurance is not profit
  title_zh: 让顾客安心，不等于提高盈利
  title_zh_hk: 讓顧客安心，不等於提高盈利
  step1_en: More sales, and maybe more returns
  step1_zh: 可能多了购买，也多了退货
  step1_zh_hk: 可能多了購買，也多了退貨
  step2_en: Judge contribution after return costs
  step2_zh: 看扣除退货成本后的总贡献
  step2_zh_hk: 看扣除退貨成本後的總貢獻
  step3_en: Let the window run; honour promises
  step3_zh: 等退货期届满；履行承诺
  step3_zh_hk: 等退貨期屆滿；履行承諾
  s1_en: >-
    Easier returns may encourage purchases, and may also create more returns, transport, inspection and
    resale costs. A policy that sounds more generous is not automatically more profitable.
  s1_zh: 退货方便了，可能带来更多购买，也可能增加退货，以及运输、检查和再售的成本。听起来更宽松的政策，不一定更赚钱。
  s1_zh_hk: 退貨方便咗，可能帶來更多購買，亦可能多咗退貨，同埋運輸、檢查同再售嘅成本。聽落更寬鬆嘅政策，唔一定更賺錢。
  s2_en: >-
    Measure completed purchases, reasons for hesitation, return uptake, customer experience, returned-item
    condition, and total contribution after return-related costs. Do not judge on gross sales or the lowest
    return rate alone.
  s2_zh: 要衡量实际购买、犹豫的原因、退货情况、顾客体验、退回商品的状态，以及扣除退货相关成本后的总贡献。不要只看销售总额，也不要只追求最低退货率。
  s2_zh_hk: >-
    要量度實際購買、猶豫嘅原因、退貨情況、顧客體驗、退回商品嘅狀態，同埋扣除退貨相關成本之後嘅總貢獻。唔好淨係睇銷售總額，亦唔好淨係追求最低退貨率。
  s3_en: >-
    Keep prices, product mix and promotion comparable, let the promised return window run before reading
    final costs, and honour promises made to pilot customers even if future offers change.
  s3_zh: 评估时，价格、商品组合和宣传曝光要尽量相近；等承诺的退货期满了，再解读最终成本。就算以后改变优惠，也要履行对试点顾客的承诺。
  s3_zh_hk: 評估嘅時候，價錢、商品組合同宣傳曝光要盡量相若；等承諾嘅退貨期屆滿，先解讀最終成本。就算之後改變優惠，都要履行對試點顧客嘅承諾。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Read the samples honestly
  title_zh: 如实解读样本
  title_zh_hk: 如實解讀樣本
  en: >-
    Eighteen of twenty completed returns tells you about people who successfully used the current process,
    not every buyer or those who gave up. Fourteen stated concerns do not mean fourteen guaranteed purchases
    under B. And keep existing rights separate: this is a voluntary change-of-mind offer, not a remedy
    for defective goods.
  zh: >-
    二十笔已完成退货中有十八笔在七天内申请，这只说明了成功用过现行程序的人，不能反映所有买家或中途放弃的人。十四人说有顾虑，也不等于采用 B 后就会多十四笔订单。还要把顾客原有的权利分开看：这是店铺自愿提供的无理由退货安排，不涉及瑕疵商品的补救。
  zh_hk: >-
    二十宗已完成嘅退貨入面有十八宗喺七日內申請，呢個只係講到成功用過現行程序嘅人，反映唔到所有買家或者中途放棄嘅人。十四個人話有顧慮，亦唔等於用 B 之後就會多十四張訂單。仲要將顧客原有嘅權利分開嚟睇：呢個係店舖自願提供嘅改變主意退貨安排，唔涉及瑕疵商品嘅補救。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Cut friction, not just add days
  title_zh: 减少麻烦，而非只加天数
  title_zh_hk: 減少麻煩，而非只加天數
  q1_en: >-
    Returns: 18 of 20 within 7 days
  q1_zh: 退货：20 笔中 18 笔在 7 天内
  q1_zh_hk: 退貨：20 宗中 18 宗在 7 天內
  q2_en: >-
    Prospects: 14 of 20 cite cost or effort
  q2_zh: 准顾客：20 人中 14 人提运费或麻烦
  q2_zh_hk: 準顧客：20 人中 14 人提運費或麻煩
  s1_en: >-
    A better return promise may remove friction, not simply add days. On this evidence, test the easier,
    cheaper return process first.
  s1_zh: 改善退货体验，有时靠的是减少麻烦，而不是增加天数。按现有资料，可以先测试更省时省力的退货安排。
  s1_zh_hk: 改善退貨體驗，有時靠嘅係減少麻煩，而唔係增加日數。按現有資料，可以先測試更省時省力嘅退貨安排。
  s2_en: >-
    Judge the pilot on completed purchases and total contribution after return-related costs, not on gross
    sales or the lowest return rate alone.
  s2_zh: 评估试点要看实际购买和扣除退货相关成本后的总贡献，不能只看销售总额或最低退货率。
  s2_zh_hk: 評估試點要睇實際購買同扣除退貨相關成本之後嘅總貢獻，唔可以淨係睇銷售總額或者最低退貨率。
  s3_en: >-
    The shop, the samples and the options are classroom assumptions. This is not legal advice about consumer
    rights. Official scene art is a teaching illustration only.
  s3_zh: 店铺、样本和方案都是课堂假设，本案不构成有关消费者权利的法律意见。官方场景图只是教学插图。
  s3_zh_hk: 店舖、樣本同方案都係課堂假設，本案唔構成有關消費者權利嘅法律意見。官方場景圖只係教學插圖。
duration_target_s: 198
