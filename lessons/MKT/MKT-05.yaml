  s1_en: >-
    Both lines take the same display space, were in stock all month, and have comparable handling costs.
    The refills sold 20 packs at 5 dollars of contribution each: 100 dollars.
  s1_zh: 两款商品占用的空间一样，整个月都有货，处理成本也相近。笔芯卖了二十包，每包贡献五元，共一百元。
  s1_zh_hk: 兩款商品佔用嘅空間一樣，成個月都有貨，處理成本亦相若。筆替賣咗二十包，每包貢獻五蚊，總共一百蚊。
  s2_en: >-
    The notebook colour sold 60 at the same 5 dollars each: 300 dollars. Contribution means selling price
    less the costs that vary with each unit sold.
  s2_zh: 那款颜色的笔记本卖了六十本，每本同样贡献五元，共三百元。贡献是指售价减去随销量变动的成本。
  s2_zh_hk: 嗰款顏色嘅筆記簿賣咗六十本，每本一樣貢獻五蚊，總共三百蚊。貢獻即係售價減去隨銷量變動嘅成本。
  s3_en: >-
    These are past own-item amounts, not forecasts of total shop profit, and not the effect of removing
    a line.
  s3_zh: 这些只是各款商品过往的贡献，既不是全店盈利的预测，也不是下架影响的估算。
  s3_zh_hk: 呢啲只係各款商品過往嘅貢獻，唔係全店盈利嘅預測，亦唔係撤貨影響嘅估算。
