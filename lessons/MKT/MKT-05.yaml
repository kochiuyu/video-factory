  title_en: A slow seller. An important basket?
  title_zh: 卖得慢的商品，可能是整篮购物的关键吗？
  title_zh_hk: 賣得慢的商品，可能是整籃購物的關鍵嗎？
  image: art/small-basket-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In March 2026, DFI Retail Group said it had trimmed slow-selling products in its IKEA operations.
    What should occupy limited shelf space? In a fictional Hong Kong art-supplies shop, one display slot
    is committed to a new product trial, so one existing line must go: specialist drawing-pen refills,
    or one notebook colour. The owner wants to remove the refills because they sell less.
  zh: >-
    二零二六年三月，DFI 零售集团表示，旗下 IKEA 业务精简了卖得较慢的商品。有限的货架应该留给什么商品？在一家虚构的香港美术用品店，一个陈列位已经预留给新货试卖，所以现有商品要撤走一款：专用绘图笔笔芯，或者某种颜色的笔记本。店主想撤走笔芯，因为它卖得比较少。
  zh_hk: >-
    二零二六年三月，DFI 零售集團表示，旗下 IKEA 業務精簡咗賣得比較慢嘅商品。有限嘅貨架應該留俾咩商品？喺一間虛構嘅香港美術用品店，一個陳列位已經預留咗俾新貨試賣，所以現有商品要撤走一款：專用繪圖筆嘅筆替，或者某一種顏色嘅筆記簿。店主想撤走筆替，因為佢賣得比較少。
