title_en: More contacts. More customers?
title_zh: 联络名单更长，客户就会更多吗？
title_zh_hk: 聯絡名單更長，客戶就會更多嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-06
  kicker_en: MKT-06
  kicker_zh: MKT-06
  kicker_zh_hk: MKT-06
  title_en: More contacts. More customers?
  title_zh: 联络名单更长，客户就会更多吗？
  title_zh_hk: 聯絡名單更長，客戶就會更多嗎？
  image: art/qualified-contacts-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In September 2026, the Hong Kong Trade Development Council reported more than 17,000 trade buyers
    at the Hong Kong Watch and Clock Fair, with online business matching continuing after the fair. Attendance
    creates opportunities, but which conversations fit? A fictional Hong Kong presentation-box supplier
    returns from a trade exhibition with 160 business contacts. Its sales team can prepare only 36 tailored
    proposals next week.
  zh: >-
    二零二六年九月，香港贸易发展局表示，香港钟表展吸引了超过一万七千名业内买家，展会结束后，线上商贸配对还在继续。展会带来接触机会，但哪些洽谈真正合适？一家虚构的香港礼盒供应商刚参加完商贸展，带回一百六十个企业联络。可是销售团队下周只能拟定三十六份量身定制的建议书。
  zh_hk: >-
    二零二六年九月，香港貿易發展局表示，香港鐘錶展吸引咗超過一萬七千個業內買家，展會完咗之後，網上商貿配對仲繼續。展會帶來接觸機會，但係邊啲洽談先真正合適？一間虛構嘅香港禮盒供應商啱啱參加完商貿展，帶返一百六十個企業聯絡。不過銷售團隊下星期只可以擬備三十六份度身訂造嘅建議書。
- id: ledger
