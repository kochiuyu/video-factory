  layout: rows
  seconds: 24
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Who was reacting?
  title_zh: 意见来自谁？
  title_zh_hk: 意見來自誰？
  step1_en: >-
    Gift buyer: age cue helps spot a gift
  step1_zh: 买礼物的人：年龄提示便于挑礼物
  step1_zh_hk: 買禮物的人：年齡提示便於挑禮物
  step2_en: >-
    User: the easy zip matters; I choose
  step2_zh: 使用者：拉链好拉，颜色自己挑
  step2_zh_hk: 使用者：拉鏈好拉，顏色自己挑
  step3_en: >-
    User: show me what is different
  step3_zh: 另一位使用者：说明有何不同
  step3_zh_hk: 另一位使用者：說明有何不同
  s1_en: >-
    The owner realises the first informal reactions came mainly from adult children shopping for parents.
    One gift buyer says the age heading helps spot a possible gift, but still needs to know whether Mum
    wants it.
  s1_zh: 店主发现，最初的非正式意见主要来自替父母买礼物的成年子女。有一位说，有年龄提示，一眼就知道这款包或许适合送给妈妈，不过还是得问她想不想要。
  s1_zh_hk: 店主發現，最初嘅非正式意見主要嚟自幫父母買禮物嘅成年子女。有一位話，有年齡提示，一眼就知道呢個袋或者啱送俾媽媽，不過都要問吓佢想唔想要。
  s2_en: >-
    A second conversation includes intended users. One says the easy zip matters, wants to choose the
    colour personally, and would not search for an age label.
  s2_zh: 第二次交流请来了预期使用者。一位说，拉链好不好拉对她很重要；颜色想自己挑，也不会特地去找有年龄标示的袋子。
  s2_zh_hk: 第二次交流請咗預期使用者。一位話，拉鏈好唔好拉對佢好重要；顏色想自己揀，亦唔會特登去搵有年齡標示嘅袋。
  s3_en: >-
    Another likes knowing the designer considered people of that age, but wants to see what is different
    about the bag. These are illustrative conversations, not a representative survey, and no sales result
    is supplied.
  s3_zh: 另一位觉得设计时想到同龄人是好事，但想知道这款包跟别的有什么不同。这些对话只是示例，不是具代表性的调查，题目也没有提供销售结果。
  s3_zh_hk: 另一位覺得設計時諗到同齡人係好事，但想知道呢個袋同其他有咩唔同。呢啲對話只係示例，唔係有代表性嘅調查，題目亦冇提供銷售結果。
