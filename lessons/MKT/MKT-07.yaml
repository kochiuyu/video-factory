  footer_zh_hk: 只有主標題不同
  s1_en: >-
    The owner can run one small launch-message pilot and has two equally feasible mock-ups. Message A's
    headline names an age group: a daybag for 60 plus. Message B describes practical benefits: light to
    carry, easy to open.
  s1_zh: >-
    店主可以先小规模试行一则上市讯息，手上有两款同样可行的设计稿。讯息 A 的主标题点明年龄层：六十岁以上人士的日常背包。讯息 B 直接说实用好处：轻巧好背，拉链易开。
  s1_zh_hk: >-
    店主可以先小規模試行一則上市訊息，手上有兩款同樣可行嘅設計稿。訊息 A 嘅主標題點明年齡層：六十歲以上人士嘅日用袋。訊息 B 直接講實用好處：輕巧好背，拉鏈易開。
  s2_en: >-
    A may make relevance easy for some buyers to recognise. B may make the use benefits clear without
    defining the customer by age.
  s2_zh: A 可能让一些购买者一眼看出产品适不适合；B 可能让人看清使用上的好处，又不用先拿年龄来界定顾客。
  s2_zh_hk: A 可能令一啲購買者一眼睇出產品啱唔啱；B 可能令人睇清楚用起嚟嘅好處，又唔使先用年齡界定顧客。
  s3_en: >-
    Everything else is the same: bag, price, readable type, photographs and placement, and both naturally
    feature older people. Neither is deliberately patronising, and neither is guaranteed to work. The
    claims are checked, and it is not a medical product.
  s3_zh: >-
    其他都一样：袋子、价格、易读字体、照片和投放位置，两款都自然呈现年长人士。两款都没有刻意居高临下，也都不保证奏效。功能说法已经核实，产品也不是医疗用品。
  s3_zh_hk: >-
    其他全部一樣：袋、價錢、易讀字體、相片同投放位置，兩款都自然呈現年長人士。兩款都冇刻意居高臨下，亦都唔保證有效。功能講法已經核實，產品亦唔係醫療用品。
