  title_en: Keep or change your choice?
  title_zh: 维持还是更改选择？
  title_zh_hk: 維持還是更改選擇？
  en: >-
    Keep or change your first choice? Specify one result from intended users that would justify it, rather
    than relying only on gift buyers' reactions. Pause and vote.
  zh: 你会维持还是更改原来的选择？说出预期使用者的哪一种反应足以支持你的选择，不要只凭买礼物的人的意见。请暂停，投个票。
  zh_hk: 你會維持定係更改原本嘅選擇？講出預期使用者邊一種反應足以支持你嘅選擇，唔好淨係靠買禮物嘅人嘅意見。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Who buys, and who uses?
  title_zh: 分清谁买，谁用
  title_zh_hk: 分清誰買，誰用
  step1_en: Buyer and user may differ
  step1_zh: 购买者和使用者未必是同一人
  step1_zh_hk: 購買者和使用者未必是同一人
  step2_en: Gift buyers alone cannot settle it
  step2_zh: 单靠送礼的人的意见不能判断
  step2_zh_hk: 單靠送禮的人的意見不能判斷
  step3_en: One age group, many motivations
  step3_zh: 同一年龄层，选购理由也不同
  step3_zh_hk: 同一年齡層，選購理由也不同
  s1_en: >-
    A gift buyer may welcome a quick relevance cue, while the intended user may care more about features,
    appearance or having a choice. Sometimes they are the same person; sometimes not.
  s1_zh: >-
    买礼物的人或许喜欢一眼就能判断合不合适的提示；真正使用的人，却可能更在意功能、外观，或者自己有没有选择的空间。购买者和使用者有时是同一个人，有时不是。
  s1_zh_hk: >-
    買禮物嘅人或者鍾意一眼就判斷到啱唔啱嘅提示；真正用嘅人，就可能更在意功能、外觀，或者自己有冇揀嘅空間。購買者同使用者有時係同一個人，有時唔係。
  s2_en: >-
    The new evidence does not show that gift buyers are wrong. It shows that their reactions alone cannot
    tell you whether the message resonates with intended users.
  s2_zh: 新资料没有证明送礼的人想错了，只说明单靠他们的反应，判断不了讯息能不能打动预期使用者。
  s2_zh_hk: 新資料冇證明送禮嘅人諗錯，只係話俾你知，單靠佢哋嘅反應，判斷唔到訊息打唔打動到預期使用者。
  s3_en: >-
    The two user comments point in different directions, and neither speaks for every older customer.
    Do not infer that older people always dislike age labels, always want them, or share one level of
    independence or need.
  s3_zh: 两位使用者的意见方向不同，谁也代表不了所有年长顾客。不能因此推论年长人士一概反感年龄标示、一概欢迎，或者自主程度和需要都一样。
  s3_zh_hk: 兩位使用者嘅意見方向唔同，邊個都代表唔到所有年長顧客。唔可以因此推論年長人士一律反感年齡標示、一律歡迎，或者自主程度同需要都一樣。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: A choice evidence can change
  title_zh: 可用证据修正的决定
  title_zh_hk: 可用證據修正的決定
  step1_en: >-
    A: users welcome its relevance
  step1_zh: 选 A：使用者乐见与自己相关
  step1_zh_hk: 選 A：使用者樂見與自己相關
  step2_en: >-
    B: clear benefits explain the bag
  step2_zh: 选 B：清楚说出好处
  step2_zh_hk: 選 B：清楚說出好處
  step3_en: Set an observable result first
  step3_zh: 试点前先订可观察的结果
  step3_zh_hk: 試點前先訂可觀察的結果
  s1_en: >-
    Choose A if your hypothesis is that intended users recognise and welcome its relevance, not merely
    that adult children notice it.
  s1_zh: 如果你推测预期使用者会看出 A 跟自己相关，而且乐见这样的描述，可以选 A；不能只因为成年子女容易留意到就选它。
  s1_zh_hk: 如果你推測預期使用者會睇出 A 同自己有關，而且樂見咁樣嘅描述，可以揀 A；唔可以淨係因為成年子女容易留意到就揀佢。
  s2_en: >-
    Choose B if your hypothesis is that clearly stated benefits better explain why users would consider
    the bag. These comments establish neither hypothesis.
  s2_zh: 如果你推测 B 清楚说出好处，更能让使用者明白为什么值得考虑，可以选 B。这几则意见还不足以证实任何一个假设。
  s2_zh_hk: 如果你推測 B 清楚講出好處，更加令使用者明白點解值得考慮，可以揀 B。呢幾則意見仲未足以證實任何一個假設。
  s3_en: >-
    Before the pilot, set an observable result: whether intended users correctly explain the offer, find
    the wording relevant and want to try the bag. If the message repeatedly confuses users, reconsider
    it. Do not invent a success rate the case has not measured.
  s3_zh: >-
    试点前先订好可观察的结果：预期使用者能否准确说出产品特点、觉得文字跟自己相关、愿意试用。讯息一再让人困惑，就要重新考虑。不要自编案例没衡量过的成功率。
  s3_zh_hk: >-
    試點前先訂好可觀察嘅結果：預期使用者講唔講得準產品特點、覺唔覺得啲字同自己有關、想唔想試用。訊息一再令人混淆，就要重新考慮。唔好自己作個案冇量度過嘅成功率。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Keep the comparison focused
  title_zh: 让比较只聚焦于讯息
  title_zh_hk: 讓比較只聚焦於訊息
  en: >-
    Include intended users as well as gift purchasers, and keep their responses separate. Keep the product,
    claims, price, presentation and placement comparable, and if people see both mock-ups, vary which
    comes first. Later purchases, returns and user feedback will give stronger evidence than a few convenient
    conversations.
  zh: >-
    要同时纳入预期使用者和买礼物的人，分开看两组反应。产品、功能说法、价格、呈现方式和投放位置要保持相近；如果同一个人看两款设计稿，要调换先后次序。之后的购买、退货和使用者意见，会比几次方便的访谈更有说服力。
  zh_hk: >-
    要同時納入預期使用者同買禮物嘅人，分開睇兩組反應。產品、功能講法、價錢、呈現方式同投放位置要保持相若；如果同一個人睇兩款設計稿，要調換先後次序。之後嘅購買、退貨同使用者意見，會比幾次方便嘅訪談更有說服力。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Win the user, not just the buyer
  title_zh: 打动使用者，不只是购买者
  title_zh_hk: 打動使用者，不只是購買者
  q1_en: Buyer and user can differ
  q1_zh: 购买者和使用者可能不同
  q1_zh_hk: 購買者和使用者可能不同
  q2_en: Commit to A or B; state reversal evidence
  q2_zh: 暂选 A 或 B，订明改判证据
  q2_zh_hk: 暫選 A 或 B，訂明改判證據
  s1_en: >-
    When the person buying may not be the person using, a message has to work for the user too. Gift buyers'
    reactions alone cannot settle that.
  s1_zh: 买的人未必是用的人，讯息也要打动使用者。单凭买礼物的人的反应，下不了结论。
  s1_zh_hk: 買嘅人未必係用嘅人，訊息都要打動使用者。單靠買禮物嘅人嘅反應，落唔到結論。
  s2_en: >-
    Either mock-up is a legitimate starting point. Commit provisionally, hear from intended users, and
    say in advance what result would change your mind.
  s2_zh: 两款设计稿都是合理的起点。先作暂定选择，听取预期使用者的意见，并事先说明什么结果会让你改变主意。
  s2_zh_hk: 兩款設計稿都係合理嘅起點。先作暫定選擇，聽取預期使用者嘅意見，並且事先講明咩結果會令你改變主意。
  s3_en: >-
    The brand, the bag, the messages and the comments are invented. No medical benefit, consumer stereotype
    or sales forecast is implied. Official scene art is a teaching illustration only.
  s3_zh: 品牌、背包、宣传讯息和意见都是虚构的，不暗示医疗功效、消费者刻板印象或销售预测。官方场景图只是教学插图。
  s3_zh_hk: 品牌、袋、宣傳訊息同意見都係虛構嘅，唔暗示醫療功效、消費者刻板印象或者銷售預測。官方場景圖只係教學插圖。
duration_target_s: 198
