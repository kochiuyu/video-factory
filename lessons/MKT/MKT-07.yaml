  title_en: Pilot A or B first?
  title_zh: 先测试 A 还是 B？
  title_zh_hk: 先測試 A 還是 B？
  en: >-
    Which message would you pilot first, A or B? Name whose response you are trying to win, and a specific
    response that would make you change your mind. Pause and vote.
  zh: 你会先测试 A 还是 B？说明你希望打动谁，以及哪种具体反应会让你改变主意。请暂停，投个票。
  zh_hk: 你會先測試 A 定係 B？講明你想打動邊個，同埋邊種具體反應會令你改變主意。暫停，投個票。
- id: reveal
