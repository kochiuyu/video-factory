  title_en: Designed for an age group. Chosen by whom?
  title_zh: 为某个年龄层设计，谁来挑选？
  title_zh_hk: 為某個年齡層設計，誰來挑選？
  image: art/chosen-by-whom-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 27 May 2025, Hong Kong's government announced 30 silver-economy measures. That gives a fictional
    Hong Kong bag brand a reason to consider older consumers, but it does not prove demand for its product.
    The brand is launching a light daybag with easy-grip zipper pulls and wide straps. An older adult
    might choose it personally, or an adult child might buy it as a gift.
  zh: >-
    二零二五年五月二十七日，香港政府公布了三十项银发经济措施。这让一家虚构的香港箱包品牌有理由留意年长消费者，但不能证明这款产品有需求。品牌准备推出一款轻便的日常背包，拉链片容易握住，肩带也比较宽。年长顾客可能自己挑选，也可能由成年子女买来送礼。
  zh_hk: >-
    二零二五年五月二十七號，香港政府公布咗三十項銀髮經濟措施。咁令一個虛構嘅香港袋具品牌有理由留意年長消費者，但證明唔到呢款產品有需求。品牌準備推出一個輕便嘅日用袋，拉鏈頭容易揸，膊帶亦比較闊。年長顧客可能自己揀，亦可能由成年子女買嚟送禮。
