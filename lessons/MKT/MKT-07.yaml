  c11_zh: “60 岁以上人士的日常背包”
  c11_zh_hk: 「60 歲以上人士的日用袋」
  c12_en: “Light to carry. Easy to open.”
  c12_zh: “轻巧好背，拉链易开。”
  c12_zh_hk: 「輕巧好背，拉鏈易開。」
  c21_en: Some buyers spot relevance
  c21_zh: 有些购买者一眼看出是否适合
  c21_zh_hk: 有些購買者一眼看出是否適合
  c22_en: Benefits clear, no age label
  c22_zh: 看清好处，不必用年龄界定
  c22_zh_hk: 看清好處，不必用年齡界定
  c31_en: Bag, price, type, photos
  c31_zh: 袋、价格、字体、照片
  c31_zh_hk: 袋、價格、字體、照片
  c32_en: Placement; older people shown
  c32_zh: 投放位置；呈现年长人士
  c32_zh_hk: 投放位置；呈現年長人士
  footer_en: Only the headline differs
