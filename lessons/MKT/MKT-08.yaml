  s1_en: >-
    Finding the brand within ten seconds: 36 of 40 for A, 26 for B, and 35 for C.
  s1_zh: 十秒内找到品牌：A 组四十人中有三十六人，B 组二十六人，C 组三十五人。
  s1_zh_hk: 十秒內搵到品牌：A 組四十人入面有三十六人，B 組二十六人，C 組三十五人。
  s2_en: >-
    Identifying the flavour with the pack shown alone: 22 of 40 for A, 34 for B, and 32 for C.
  s2_zh: 单看包装辨认口味：A 组二十二人，B 组三十四人，C 组三十二人。
  s2_zh_hk: 單睇包裝辨認口味：A 組二十二人，B 組三十四人，C 組三十二人。
  s3_en: >-
    Nobody bought anything. These fictional counts describe one small session, not population rates or
    sales forecasts.
  s3_zh: 没有人实际购买。这些虚构人数只描述一次小型测试，不是整体顾客的成功率，也不能用来预测销售。
  s3_zh_hk: 冇人真係買嘢。呢啲虛構人數只係描述一次小型測試，唔係整體顧客嘅成功率，亦唔可以用嚟預測銷售。
