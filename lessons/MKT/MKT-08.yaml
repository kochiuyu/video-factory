  s1_en: >-
    Pack A keeps the existing design: a familiar band and name position, but a busy front where the flavour
    description is less prominent.
  s1_zh: A 沿用旧设计：条纹和品牌名的位置都是顾客熟悉的，但正面比较繁复，口味说明不太显眼。
  s1_zh_hk: A 沿用舊設計：條紋同品牌名嘅位置都係顧客熟悉嘅，但正面比較繁複，口味說明唔太突出。
  s2_en: >-
    Pack B gives the flavour more space and a clearer hierarchy, but removes the teal band and moves the
    brand name. The owner wants both easier flavour identification and a brand existing customers can
    still find.
  s2_zh: 新版 B 给口味说明更多空间，主次更清楚，却拿掉了蓝绿色条纹，品牌名也换了位置。店主既想让口味更容易辨认，也希望熟客仍然找得到品牌。
  s2_zh_hk: 新版 B 俾口味說明更多空間，主次更清楚，但拎走咗藍綠色條紋，品牌名亦移咗位。店主既想口味更容易辨認，亦希望熟客仍然搵到個品牌。
  s3_en: >-
    Biscuits, quantity, price, materials, print cost and availability are unchanged, and both designs
    meet the required-information rules and the deadline. There are no customer-test results yet.
  s3_zh: 饼干、分量、售价、材料、印刷成本和供货都不变，两款都符合必要资讯的要求，也赶得上期限。目前还没有任何顾客测试结果。
  s3_zh_hk: 餅乾、份量、售價、材料、印刷成本同供貨都唔變，兩款都符合必要資訊嘅要求，亦趕得切期限。暫時仲未有任何顧客測試結果。
