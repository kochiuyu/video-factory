  title_en: Pack C and a prototype test
  title_zh: C 款与样品测试
  title_zh_hk: C 款與樣品測試
  step1_en: C keeps A's cues, uses B's layout
  step1_zh: C：A 的识别线索 + B 的口味层次
  step1_zh_hk: C：A 的辨識線索 + B 的口味層次
  step2_en: 120 volunteers, 40 per design, random
  step2_zh: 120 名志愿者，随机每组 40 人
  step2_zh_hk: 120 名志願者，隨機每組 40 人
  step3_en: Find the brand in 10 s, then the flavour
  step3_zh: 10 秒内找品牌，再辨认口味
  step3_zh_hk: 10 秒內找品牌，再辨認口味
  s1_en: >-
    The designer offers a feasible pack C. It keeps A's teal band and brand-name position, while using
    B's clearer flavour hierarchy. Cost, materials, required information and timing stay the same.
  s1_zh: 设计师提出一款可行的 C：保留 A 的蓝绿色条纹和品牌名位置，同时采用 B 较清楚的口味资讯层次。成本、物料、必要资讯和时间安排都不变。
  s1_zh_hk: 設計師提出一款可行嘅 C：保留 A 嘅藍綠色條紋同品牌名位置，同時採用 B 較清楚嘅口味資訊層次。成本、物料、必要資訊同時間安排都唔變。
  s2_en: >-
    A small prototype session recruits 120 adult volunteers who know the brand, and randomly assigns 40
    to each design. Each person sees only one design, on the same mock shelf, with positions rotated evenly
    and neutral instructions.
  s2_zh: >-
    一场小型样品测试招募了一百二十名熟悉品牌的成年志愿者，随机分成三组，每组四十人，各自只看一款包装。模拟货架一样，目标商品的位置均衡轮换，指示也保持中性。
  s2_zh_hk: >-
    一場小型樣品測試招募咗一百二十個熟悉品牌嘅成年志願者，隨機分成三組，每組四十人，各自只睇一款包裝。模擬貨架一樣，目標商品嘅位置平均輪換，指示亦保持中性。
  s3_en: >-
    First, each person tries to find the named brand within ten seconds. Then all 40 in each group see
    their pack on its own and identify the flavour, including anyone who failed the shelf task.
  s3_zh: 每人先试着在十秒内找到指定品牌。接着，每组全部四十人都单独看自己那款包装，辨认口味，包括刚才在货架上找不到品牌的人。
  s3_zh_hk: 每人先試吓喺十秒內搵到指定品牌。跟住，每組全部四十人都單獨睇自己嗰款包裝，辨認口味，包括頭先喺貨架搵唔到品牌嘅人。
