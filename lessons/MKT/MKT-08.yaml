  seconds: 22
  kicker: MKT-08
  kicker_en: MKT-08
  kicker_zh: MKT-08
  kicker_zh_hk: MKT-08
  title_en: A fresher pack. Still easy to find?
  title_zh: 换了新包装，老顾客还找得到吗？
  title_zh_hk: 換了新包裝，老顧客還找得到嗎？
  image: art/familiar-pack-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In November 2025, a design studio described refreshing a UK hot-sauce range for Lee Kum Kee while
    keeping familiar gold-plaque branding. That is the designer's account, not evidence of higher sales.
    Now a fictional, independent Hong Kong biscuit brand is choosing the pack for its next printing batch.
    Customers know its diagonal teal band and where its name sits, but the front is busy and the flavour
    is hard to see.
  zh: >-
    二零二五年十一月，一家设计公司介绍了为李锦记英国辣酱系列更新包装的项目，保留了熟悉的金色品牌标牌。这是设计公司自己的说法，不能证明销售增加。现在，一家虚构的香港独立饼干品牌，要决定下一批印哪款包装。顾客早就认得那道斜向的蓝绿色条纹和品牌名的位置，可是包装正面资讯太多，口味说明不够显眼。
  zh_hk: >-
    二零二五年十一月，一間設計公司介紹咗幫李錦記英國辣醬系列更新包裝嘅項目，保留咗熟悉嘅金色品牌牌匾。呢個係設計公司自己嘅講法，證明唔到銷售增加。而家，一個虛構嘅香港獨立餅乾品牌，要決定下一批印邊款包裝。顧客早就認得嗰條斜嘅藍綠色條紋同品牌名嘅位置，但係包裝正面資訊太多，口味說明唔夠突出。
