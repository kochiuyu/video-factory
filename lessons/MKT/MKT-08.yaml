  zh: 下一批你会保留 A，还是印 B？哪项顾客任务最重要？有什么证据会让你推翻暂定的选择？请暂停，投个票。
  zh_hk: 下一批你會保留 A，定係印 B？邊項顧客任務最重要？有咩證據會令你推翻暫定嘅選擇？暫停，投個票。
