  s1_zh: 改版可能让顾客的一件事变容易，另一件事变难。评估包装要两样都看：找不找得到品牌，认不认得出口味。
  s1_zh_hk: 改版可能令顧客一樣嘢容易咗，另一樣嘢難咗。評估包裝要兩樣都睇：搵唔搵到品牌，認唔認得出口味。
  s2_en: >-
    Pack C is a constructive compromise, not a perfect winner. Print it as a choice to test in shops,
    not as proof of sales growth.
  s2_zh: C 是可行的折衷，并不是样样领先。可以把它当作要在店铺里继续测试的选择，而不是销售会增加的证据。
  s2_zh_hk: C 係可行嘅折衷，唔係樣樣領先。可以將佢當作要喺店舖繼續測試嘅選擇，而唔係銷售會增加嘅證據。
