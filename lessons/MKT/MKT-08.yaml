- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Separate the two customer jobs
  title_zh: 分清顾客要做的两件事
  title_zh_hk: 分清顧客要做的兩件事
  step1_en: Find a known brand ≠ read the flavour
  step1_zh: 找到品牌 ≠ 看出口味
  step1_zh_hk: 找到品牌 ≠ 看出口味
  step2_en: >-
    C vs A: +10 flavour, −1 brand find
  step2_zh: C 对 A：口味多 10 人，品牌少 1 人
  step2_zh_hk: C 對 A：口味多 10 人，品牌少 1 人
  step3_en: >-
    C vs B: +9 brand finds, −2 flavour
  step3_zh: C 对 B：品牌多 9 人，口味少 2 人
  step3_zh_hk: C 對 B：品牌多 9 人，口味少 2 人
  s1_en: >-
    Finding a known brand among alternatives is a different task from identifying the flavour on a pack
    in your hand. A redesign can ease the second while disrupting the first: A has more brand finds than
    B, and B has more correct flavours.
  s1_zh: >-
    在一排商品里找到熟悉的品牌，和拿着包装看出是什么口味，是两项不同的任务。新设计可以让第二项更容易，却让第一项更难：A 组找到品牌的人比 B 组多，B 组答对口味的人则比较多。
  s1_zh_hk: >-
    喺一排商品入面搵到熟悉嘅品牌，同揸住包裝睇出係咩口味，係兩項唔同嘅任務。新設計可以令第二項容易啲，但令第一項難咗：A 組搵到品牌嘅人多過 B 組，B 組答啱口味嘅人就比較多。
  s2_en: >-
    C combines familiar recognition cues with clearer information. Compared with A, it has ten more correct
    flavour answers and one fewer brand find.
  s2_zh: C 保留了熟悉的识别线索，口味资讯也比较清楚。跟 A 组比，C 组多十人答对口味，少一人找到品牌。
  s2_zh_hk: C 保留咗熟悉嘅辨識線索，口味資訊亦比較清楚。同 A 組比，C 組多十個人答啱口味，少一個人搵到品牌。
  s3_en: >-
    Compared with B, it has nine more brand finds and two fewer correct flavour answers. So C is a reasonable
    recommendation for the two-part objective, though it is not highest on both tasks.
  s3_zh: 跟 B 组比，C 组多九人找到品牌，少两人答对口味。所以兼顾店主的两个目标，C 是合理的选择，虽然它不是两项都录得最高人数。
  s3_zh_hk: 同 B 組比，C 組多九個人搵到品牌，少兩個人答啱口味。所以要兼顧店主兩個目標，C 係合理嘅選擇，雖然佢唔係兩項都錄得最高人數。
- id: meaning
  visual: steps
  layout: rows
  seconds: 28
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Not a sales forecast
  title_zh: 任务结果不是销售预测
  title_zh_hk: 任務結果不是銷售預測
  step1_en: >-
    36 vs 35, 34 vs 32: small gaps
  step1_zh: 36 对 35、34 对 32：差距很小
  step1_zh_hk: 36 對 35、34 對 32：差距很小
  step2_en: Same 40 people per row; not 80
  step2_zh: 两行同一批 40 人，不能加成 80
  step2_zh_hk: 兩行同一批 40 人，不能加成 80
  step3_en: The band's effect is not isolated
  step3_zh: 未能分开条纹的影响
  step3_zh_hk: 未能分開條紋的影響
  s1_en: >-
    Gaps such as 35 against 36, or 32 against 34, are small. They are not established population differences
    just because the counts differ. Keeping A is still defensible if recognition risk comes first.
  s1_zh: 三十五对三十六、三十二对三十四，差距都很小，不能只凭人数不同，就认定整体顾客也有差别。如果最重视品牌识别的风险，保留 A 仍然说得通。
  s1_zh_hk: 三十五對三十六、三十二對三十四，差距都好細，唔可以淨係因為人數唔同，就認定整體顧客都有分別。如果最重視品牌辨識嘅風險，保留 A 仍然講得通。
  s2_en: >-
    Both rows use the same 40 people per design, so do not add them as if there were 80, or call a missed
    find a lost sale. The volunteers already know the brand, the shelf is artificial and nobody spends
    money.
  s2_zh: 每款的两行数据来自同一批四十人，不能加成八十人；找不到品牌，也不等于少了一笔销售。志愿者本来就熟悉品牌，货架是模拟的，也没有人花钱。
  s2_zh_hk: 每款嘅兩行數據嚟自同一批四十人，唔可以加埋當八十人；搵唔到品牌，亦唔等於少咗一宗生意。志願者本身已經熟悉品牌，貨架係模擬嘅，亦冇人使錢。
  s3_en: >-
    The session also cannot separate the teal band's effect from the name position and other layout changes.
    It supports a design decision to test in use, not a guarantee of sales.
  s3_zh: 这场测试也分不开蓝绿色条纹的影响，和品牌名位置及其他版面改动的影响。它可以作为选定设计、再在实际环境测试的依据，但不保证销售增加。
  s3_zh_hk: 呢場測試亦分唔開藍綠色條紋嘅影響，同品牌名位置同其他版面改動嘅影響。佢可以作為揀定設計、再喺實際環境測試嘅依據，但唔保證銷售增加。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Carry the choice into shops
  title_zh: 在实际店铺继续观察
  title_zh_hk: 在實際店舖繼續觀察
  en: >-
    For the next batch, keep both goals visible: can customers find the brand, and can they identify the
    flavour they want? Watch for requests for help, wrong-flavour confusion and differences across real
    shop displays. Keep the old mockup for comparison, and read purchases alongside price, promotion,
    stock and display changes.
  zh: >-
    下一批要继续盯住两个目标：顾客能不能找到品牌，又能不能认出想买的口味。记录顾客求助、拿错口味的情况，以及不同实体店货架陈列下的表现。保留旧包装样稿作比较，并把实际购买和售价、促销、存货及陈列的改动一起检视。
  zh_hk: >-
    下一批要繼續留意兩個目標：顧客搵唔搵到品牌，又認唔認得出想買嘅口味。記錄顧客求助、拎錯口味嘅情況，同埋唔同實體店貨架陳列下嘅表現。保留舊包裝樣稿嚟比較，並將實際購買同售價、推廣、存貨同陳列嘅改動一齊檢視。
