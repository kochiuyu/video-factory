  kicker: MKT-09
  kicker_en: MKT-09
  kicker_zh: MKT-09
  kicker_zh_hk: MKT-09
  title_en: A smaller audience. More new people?
  title_zh: 受众较少，反而能接触更多新面孔？
  title_zh_hk: 受眾較少，反而能接觸更多新面孔？
  image: art/more-new-people-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In July 2025, JCDecaux Transport announced a Hong Kong promotion combining MTR station displays with
    interactive livestreaming. That is a company announcement, not evidence of reach. Now a fictional
    Hong Kong kitchenware shop is launching a compact steaming basket. A base online video campaign is
    booked for two weeks, projected to reach 30,000 distinct adults in its target audience. The shop has
    a final 6,000 dollars for one more package.
  zh: >-
    二零二五年七月，JCDecaux Transport 宣布在香港推出推广活动，结合港铁站内展示和互动直播。这是企业公告，不是触达人数的证据。现在，一家虚构的香港厨具店准备推出小巧的蒸笼。店方已经预订了两个星期的线上视频广告，预计可以触达三万名不同的目标成年人。店里还剩最后六千元，可以再加购一个广告组合。
  zh_hk: >-
    二零二五年七月，JCDecaux Transport 宣布喺香港推出推廣活動，結合港鐵站內展示同互動直播。呢個係企業公告，唔係觸及人數嘅證據。而家，一間虛構嘅香港廚具店準備推出細細個嘅蒸籠。店方已經預訂咗兩個星期嘅網上影片廣告，預計觸及到三萬個唔同嘅目標成年人。店舖仲剩最後六千蚊，可以再加購一個廣告組合。
- id: ledger
  visual: table_grid
  seconds: 26
  rows: 3
  cols: 2
  kicker: Figures
  kicker_en: Figures
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: One more fixed package
  title_zh: 加购一个广告组合
  title_zh_hk: 加購一個廣告組合
  row1_en: Base campaign (booked)
  row1_zh: 基本投放（已预订）
  row1_zh_hk: 基本投放（已預訂）
  row2_en: A · Lifestyle video placement
  row2_zh: A · 生活类视频广告
