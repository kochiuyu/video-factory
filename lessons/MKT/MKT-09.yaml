  row3_en: B · Local cooking content
  row3_zh: B · 本地烹饪内容广告
  row3_zh_hk: B · 本地烹飪內容廣告
  col1_en: Distinct target people on its own
  col1_zh: 单独投放预计触达人数
  col1_zh_hk: 單獨投放預計觸及人數
