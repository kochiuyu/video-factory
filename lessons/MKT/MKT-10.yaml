  c21_zh_hk: 6 款建議，保留搜尋
  c22_en: >-
    “View all 18 pens”: one click
  c22_zh: 「查看全部 18 款笔」：按一下
  c22_zh_hk: 「查看全部 18 款筆」：按一下
  footer_en: Same stock, prices, pages, checkout
  footer_zh: 库存、价格、商品页及结账相同
  footer_zh_hk: 庫存、價格、商品頁及結帳相同
  s1_en: >-
    Entrance A shows all 18 models with consistent comparison fields and visible search, so the full range
    is there immediately.
  s1_zh: 入口 A 一开始就列出全部十八款，比较栏位统一，搜寻功能也清楚可见，不用多按一步。
  s1_zh_hk: 入口 A 一開始就列出全部十八款，比較欄位統一，搜尋功能亦清楚見到，唔使多撳一步。
  s2_en: >-
    Entrance B shows six clearly described suggestions covering contrasting preferences, plus search,
    with a prominent View all 18 pens control one click away. B's full catalogue is identical to A's.
  s2_zh: >-
    入口 B 先展示六款各有特色的建议，照顾不同偏好，也保留搜寻功能；显眼位置有“查看全部十八款笔”的按钮，按一下就能打开。打开后的完整目录和 A 完全一样。
  s2_zh_hk: >-
    入口 B 先展示六款各有特色嘅建議，照顧唔同偏好，亦保留搜尋功能；顯眼位置有「查看全部十八款筆」嘅按鈕，撳一下就打開到。打開之後嘅完整目錄同 A 一模一樣。
  s3_en: >-
    Both cost the same and neither adds profiling, paid rankings or a recommendation engine. Some customers
    know the model they want; others are still working out what suits their writing. The mix is unknown,
    and neither entrance is known to raise sales.
  s3_zh: >-
    两个入口成本相同，都不加入用户画像、付费排名或推荐引擎。有些顾客已锁定某一款，有些还在摸索。两种人各占多少不知道，也没有证据显示哪个入口更能促进销售。
  s3_zh_hk: >-
    兩個入口成本一樣，都唔加入用戶畫像、付費排名或者推薦引擎。有啲顧客已經揀定某一款，有啲仲喺度摸索。兩種人各佔幾多唔知道，亦冇證據顯示邊個入口更能促進銷售。
