  title_en: A prototype session
  title_zh: 原型测试
  title_zh_hk: 原型測試
  step1_en: 80 volunteers; 20 per entrance per task
  step1_zh: 80 名志愿者，每组随机分 20 人
  step1_zh_hk: 80 名義工，每組隨機分 20 人
  step2_en: >-
    Undecided: A 8 of 20, B 15 of 20
  step2_zh: 尚未决定：A 8 人，B 15 人
  step2_zh_hk: 尚未決定：A 8 人，B 15 人
  step3_en: >-
    Named model: A 18 of 20, B 13 of 20
  step3_zh: 找指定款式：A 18 人，B 13 人
  step3_zh_hk: 找指定款式：A 18 人，B 13 人
  s1_en: >-
    A fictional prototype session recruits 80 adult volunteers: 40 undecided about what suits a writing
    task, and 40 seeking a named model. Within each group, 20 are randomly assigned to each entrance,
    and each person uses only one.
  s1_zh: >-
    本题虚构了一次原型测试，招募八十名成年志愿者：四十人还没确定书写任务需要哪些属性，另外四十人要找指定的款式。每组随机分二十人用 A、二十人用 B，每人只试一个入口。
  s1_zh_hk: >-
    本題虛構咗一次原型測試，招募八十個成年義工：四十人仲未確定書寫任務需要邊啲屬性，另外四十人要搵指定款式。每組隨機分二十人用 A、二十人用 B，每人只試一個入口。
  s2_en: >-
    For the undecided task, completion means choosing a candidate within 90 seconds and accurately explaining
    two relevant attributes, scored on the same checklist. A: 8 of 20. B: 15 of 20.
  s2_zh: 还没决定的一组，完成是指在九十秒内选出一款候选产品，并准确解释两项相关属性，用同一份核对表评分。A 组二十人中有八人完成，B 组有十五人。
  s2_zh_hk: 未決定嗰組，完成即係喺九十秒內揀出一款候選產品，並準確解釋兩項相關屬性，用同一份核對表評分。A 組二十人入面有八人完成，B 組有十五人。
  s3_en: >-
    For the named-model task, completion means finding the product page within 90 seconds. A: 18 of 20.
    B: 13 of 20. This is a convenience sample comparing two complete prototypes, with no purchases or
    conversion estimates.
  s3_zh: >-
    找指定款式的一组，完成是指在九十秒内找到那款的商品页。A 组二十人中有十八人完成，B 组十三人。这是便利样本，比较的是两套完整原型，测试不涉及实际购买，也没有转化率估算。
  s3_zh_hk: >-
    搵指定款式嗰組，完成即係喺九十秒內搵到嗰款嘅商品頁。A 組二十人入面有十八人完成，B 組十三人。呢個係便利樣本，比較嘅係兩套完整原型，測試唔涉及實際購買，亦冇轉化率估算。
