  title_en: More to choose. Easier to choose?
  title_zh: 选择多了，就更容易选吗？
  title_zh_hk: 選擇多了，就更容易選嗎？
  image: art/easier-to-choose-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In August 2021, Hong Kong's Consumer Council launched a revamped website with a Product Picker for
    comparing test ratings and prices. Now a fictional Hong Kong pen retailer, InkLane, sells 18 refillable
    models that differ in grip, nib width, weight and price. All 18 stay in stock. The owner is choosing
    the catalogue's default entrance for next month, not which pens to remove.
  zh: >-
    二零二一年八月，香港消费者委员会推出新版网站，加入产品搜寻器，方便比较测试评分和价格。现在，一家虚构的香港笔具店 InkLane，有十八款可以换笔芯的笔，握感、笔尖粗细、重量和价格各不相同。十八款都会继续有货。店主要决定的是下个月目录预设显示哪个入口，而不是哪几款要下架。
  zh_hk: >-
    二零二一年八月，香港消費者委員會推出新版網站，加入產品搜尋器，方便比較測試評分同價錢。而家，一間虛構嘅香港筆具店 InkLane，有十八款可以換筆芯嘅筆，握感、筆嘴粗幼、重量同價錢各有唔同。十八款都會繼續有貨。店主要決定嘅係下個月目錄預設顯示邊個入口，而唔係邊幾款要落架。
