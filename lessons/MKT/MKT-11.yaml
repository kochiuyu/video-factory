  c12_zh: 范例：由观察到下一步
  c12_zh_hk: 範例：由觀察到下一步
  c21_en: Approachable, quick introduction
  c21_zh: 团队亲切，一看就明白
  c21_zh_hk: 團隊親切，一看就明白
