title_en: A promise of expertise. What can buyers see?
title_zh: 声称够专业，顾客看得到什么？
title_zh_hk: 聲稱夠專業，顧客看得到甚麼？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-11
  kicker_en: MKT-11
  kicker_zh: MKT-11
  kicker_zh_hk: MKT-11
  title_en: A promise of expertise. What can buyers see?
  title_zh: 声称够专业，顾客看得到什么？
  title_zh_hk: 聲稱夠專業，顧客看得到甚麼？
  image: art/see-the-advice-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In February 2024, Hong Kong's Consumer Council said home-renovation customers find offers hard to
    understand and compare. Now you run Plainview Advice, a fictional Hong Kong home-repair assessment
    consultancy. A paid visit records visible, non-urgent problems and explains next steps in plain language.
    You have 12,000 dollars for one main promotional asset, shown for four weeks.
  zh: >-
    二零二四年二月，香港消费者委员会指出，家居装修服务的报价，消费者不容易看懂，也很难比较。现在，你经营一家虚构的香港家居维修评估公司，叫 Plainview Advice。顾客付费请你上门，你记录肉眼看得到、不用紧急处理的问题，再用浅白的话说明下一步。你有一万二千元，可以制作一项主打宣传素材，展示四个星期。
  zh_hk: >-
    二零二四年二月，香港消費者委員會指出，家居裝修服務嘅報價，消費者唔容易睇得明，亦好難比較。而家，你經營一間虛構嘅香港家居維修評估公司，叫 Plainview Advice。顧客俾錢請你上門，你記錄肉眼睇到、唔使急住處理嘅問題，再用淺白嘅說話講清楚下一步。你有一萬二千蚊，可以製作一項主打宣傳素材，展示四個星期。
