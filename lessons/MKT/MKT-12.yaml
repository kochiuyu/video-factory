- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-12
  kicker_en: MKT-12
  kicker_zh: MKT-12
  kicker_zh_hk: MKT-12
  title_en: Many visits. Where does the journey break?
  title_zh: 浏览人数不少，顾客在哪一步停下来？
  title_zh_hk: 瀏覽人數不少，顧客在哪一步停下來？
  image: art/where-journey-breaks-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In January 2026, Hong Kong's Census and Statistics Department reported that over 60 percent of people
    aged 15 and over used mobile payments for shopping in 2024. That says nothing about one shop's checkout.
    Paper Path, a fictional online seller of paper-craft kits, has 12,000 dollars for one improvement
    this month.
  zh: >-
    二零二六年一月，香港政府统计处指出，二零二四年有超过六成十五岁及以上的人用移动支付购物。不过，这说明不了某一家店的结账表现。Paper Path 是一家虚构的网店，卖成人纸艺材料套装。这个月，它有一万二千元，只能做一项主要改进。
  zh_hk: >-
    二零二六年一月，香港政府統計處指出，二零二四年有超過六成十五歲或以上嘅人用流動支付購物。不過，呢個講唔到某一間店嘅結帳表現。Paper Path 係一間虛構嘅網店，賣成人紙藝材料套裝。呢個月，佢有一萬二千蚊，只可以做一項主要改進。
