title_en: Our biggest customer. Our most valuable relationship?
title_zh: 销售额最高的客户，就最有长远价值吗？
title_zh_hk: 銷售額最高的客戶，就最有長遠價值嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-13
  kicker_en: MKT-13
  kicker_zh: MKT-13
  kicker_zh_hk: MKT-13
  title_en: Our biggest customer. Our most valuable relationship?
  title_zh: 销售额最高的客户，就最有长远价值吗？
  title_zh_hk: 銷售額最高的客戶，就最有長遠價值嗎？
  image: art/valuable-relationship-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In March 2026, Hong Kong-listed Vobile reported growth in subscription-service revenue. Subscriptions
    make ongoing relationships visible, but revenue alone does not value each one. Now a fictional Hong
    Kong stationery subscription supplier has 4,000 dollars for one account-planning-call pilot, in one
    of two groups of 20 business accounts.
  zh: >-
    二零二六年三月，香港上市公司 Vobile 公布，订阅服务收入有所增长。订阅让持续的客户关系看得见，但单看收入，并不能算出每段关系值多少。现在，一家虚构的香港文具订阅供应商有四千元，可以试行一项客户规划电话会议，但只能在两组各二十个企业客户中选一组。
  zh_hk: >-
    二零二六年三月，香港上市公司 Vobile 公布，訂閱服務收入有增長。訂閱令持續嘅客戶關係睇得見，但淨係睇收入，計唔到每段關係值幾多。而家，一間虛構嘅香港文具訂閱供應商有四千蚊，可以試行一項客戶規劃電話會議，但只可以喺兩組、每組二十個企業客戶之中揀一組。
