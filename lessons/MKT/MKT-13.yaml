  s1_en: >-
    Custom-pack accounts buy 6,000 dollars each per active year; standard-pack accounts buy 3,600. Both
    groups have already renewed for the coming year, and existing service stays the same for everyone.
  s1_zh: 定制套装客户每户每年买六千元，标准套装客户每户买三千六百元。两组都已经续订了未来第一年，大家现有的服务也都不变。
  s1_zh_hk: 訂製組合客戶每戶每年買六千蚊，標準組合客戶每戶買三千六百蚊。兩組都已經續訂咗未來第一年，大家現有嘅服務亦都唔變。
  s2_en: >-
    The pilot costs 4,000 dollars in either group. Within the chosen group, ten accounts are randomly
    offered an extra voluntary planning call, and ten keep normal service for comparison.
  s2_zh: 不管选哪一组，试行成本都是四千元。在选中的一组里，随机邀请十户自愿参加额外的规划电话，另外十户维持正常服务，用来对照。
  s2_zh_hk: 無論揀邊組，試行成本都係四千蚊。喺揀中嗰組入面，隨機邀請十戶自願參加額外嘅規劃電話，另外十戶維持正常服務，用嚟做對照。
  s3_en: >-
    Nobody has promised the call raises renewal. The choice is where to learn first, not whom to abandon.
  s3_zh: 没有人保证这个电话能提高续订率。要决定的是先在哪一组了解效果，不是放弃哪一组。
  s3_zh_hk: 冇人保證呢個電話可以提高續訂率。要決定嘅係先喺邊組了解效果，唔係放棄邊組。
