  image: art/same-price-two-comparisons-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In September 2026, Hong Kong's Consumer Council said promotions and pack sizes do not always reveal
    the best value, and encouraged shoppers to check historical and unit prices. Now a fictional Hong
    Kong homewares shop sells its Everyday kettle for 300 dollars in a planned promotion. It wants to
    be known for dependable essentials at a sensible price.
  zh: >-
    二零二六年九月，香港消费者委员会指出，促销方式和包装大小不一定能显示哪样最划算，提醒大家留意过往价格和单位价格。现在，一家虚构的香港家居用品店，在计划好的促销中，以三百元出售 Everyday 电热水壶。店家想以可靠、价钱合理的日用品建立口碑。
  zh_hk: >-
    二零二六年九月，香港消費者委員會指出，推廣方式同包裝大細唔一定顯示到邊樣最抵，提醒大家留意過往價錢同單位價錢。而家，一間虛構嘅香港家品店，喺計劃好嘅推廣入面，用三百蚊賣 Everyday 電熱水煲。店舖想用可靠、價錢合理嘅日用品建立口碑。
