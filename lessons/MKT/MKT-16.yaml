  zh: 按初版电子表格，增量贡献是多少？你会据此批准上市吗？在这之前，你需要查明哪些顾客来源和产能资料？请暂停，投个票。
  zh_hk: 按初版試算表，增量貢獻係幾多？你會唔會照呢個批准上市？喺之前，你需要查清楚邊啲顧客來源同產能資料？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Buyer sources and capacity
  title_zh: 顾客来源与产能
  title_zh_hk: 顧客來源與產能
  step1_en: 150 switch from standard · 250 new
  step1_zh: 150 包转买 · 250 包新增
  step1_zh_hk: 150 包轉買 · 250 包新增
  step2_en: Only 1,150 sealing slots
  step2_zh: 封装产能只有 1,150 个
  step2_zh_hk: 封裝產能只有 1,150 個
  step3_en: 400 small → only 750 standard
  step3_zh: 400 小包 → 只剩 750 标准装
  step3_zh_hk: 400 小包 → 只剩 750 標準裝
  s1_en: >-
    A revised estimate splits the 400 small packs: 150 replace a standard pack that would otherwise have
    been bought, and 250 are genuinely additional. Standard demand falls to 850.
  s1_zh: 修订后的估算把四百小包拆开：其中一百五十包是顾客原本会买的标准装，现在改买小包；另外两百五十包才是真正新增的。标准装需求因此降到八百五十包。
  s1_zh_hk: 修訂後嘅估算將四百細包拆開：當中一百五十包係顧客本來會買嘅標準裝，而家改買細包；另外二百五十包先係真正新增。標準裝需求因此跌到八百五十包。
  s2_en: >-
    Production confirms only 1,150 pack-sealing slots this month, and each pack of either size uses one.
  s2_zh: 生产部门确认，本月只有一千一百五十个封装时段，不管哪种包装，每包都占一个。
  s2_zh_hk: 生產部門確認，今個月得一千一百五十個封裝時段，無論邊種包裝，每包都佔一個。
  s3_en: >-
    The full launch supplies all 400 small packs, leaving 750 slots for standard. The other 100 standard
    purchases are lost that month, not delayed or turned into small-pack sales.
  s3_zh: 完整上市方案会生产全部四百小包，剩下七百五十个时段给标准装。其余一百包标准装的生意，本月就失去了，不会延后，也不会变成小包装的销售。
  s3_zh_hk: 完整上市方案會生產晒四百細包，剩低七百五十個時段俾標準裝。其餘一百包標準裝嘅生意，今個月就冇咗，唔會延後，亦唔會變成細包裝嘅銷售。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
