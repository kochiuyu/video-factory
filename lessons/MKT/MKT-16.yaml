  title_en: Launch or standard-only?
  title_zh: 上市，还是只卖标准装？
  title_zh_hk: 上市，還是只賣標準裝？
  en: >-
    Would you approve the prepared launch, or keep the standard-only plan? Reconcile small-pack contribution,
    switching losses and capacity losses. Pause and vote.
  zh: 你会批准这个上市方案，还是维持只卖标准装？请把小包装的贡献、顾客转买的损失和产能挤占的损失分开算清楚。请暂停，投个票。
  zh_hk: 你會批准呢個上市方案，定係維持淨係賣標準裝？請將細包裝嘅貢獻、顧客轉買嘅損失同產能擠佔嘅損失分開計清楚。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 28
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Split switching from additions
  title_zh: 分清转买与新增购买
  title_zh_hk: 分清轉買與新增購買
  step1_en: >-
    Worksheet: 400 × 8 − 600 = +2,600
  step1_zh: 初版：400 × 8 − 600 = +2,600
  step1_zh_hk: 初版：400 × 8 − 600 = +2,600
  step2_en: >-
    Switching: −150 × 12 → 12,800 (+800)
  step2_zh: 转买：−150 × 12 → 12,800（+800）
  step2_zh_hk: 轉買：−150 × 12 → 12,800（+800）
  step3_en: >-
    Capacity: 1,250 needed, 1,150 slots
  step3_zh: 产能：需要 1,250，只有 1,150
  step3_zh_hk: 產能：需要 1,250，只有 1,150
  s1_en: >-
    The first worksheet predicts 400 times 8, minus 600: 2,600 dollars extra. Standard-only contribution
    is 1,000 times 12: 12,000 dollars.
  s1_zh: 初版表格预计：四百乘八，减六百，增加二千六百元。只卖标准装的贡献是一千乘十二，一万二千元。
  s1_zh_hk: 初版表格預計：四百乘八，減六百，多二千六百蚊。淨係賣標準裝嘅貢獻係一千乘十二，一萬二千蚊。
  s2_en: >-
    Switching removes 150 times 12: 1,800 dollars of standard contribution. Before capacity, the range
    gives 12,800 dollars, still 800 more. Cannibalisation shrinks the gain but does not by itself kill
    it.
  s2_zh: >-
    顾客转买，让标准装少了一百五十乘十二，即一千八百元贡献。如果不考虑产能，两款合计是一万二千八百元，仍然多八百元。蚕食令得益缩小，但单凭这点还不至于不划算。
  s2_zh_hk: >-
    顧客轉買，令標準裝少咗一百五十乘十二，即係一千八百蚊貢獻。如果唔考慮產能，兩款合計係一萬二千八百蚊，仍然多八百蚊。蠶食令得益縮細，但單憑呢點未至於唔划算。
  s3_en: >-
    But demand needs 850 plus 400: 1,250 slots, 100 more than the 1,150 available. Those 100 lost standard
    purchases are on top of the 150 that switch.
  s3_zh: 但需求要八百五十加四百，即一千二百五十个时段，比现有的一千一百五十个多出一百个。这一百包标准装的损失，是在一百五十包转买以外再加上去的。
  s3_zh_hk: 但需求要八百五十加四百，即係一千二百五十個時段，比現有嘅一千一百五十個多出一百個。呢一百包標準裝嘅損失，係喺一百五十包轉買以外再加上去嘅。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Reconcile the prepared launch
  title_zh: 算清完整上市方案
  title_zh_hk: 算清完整上市方案
  step1_en: 750 × 12 + 400 × 8 − 600 = 11,600
  step1_zh: 750 × 12 + 400 × 8 − 600 = 11,600
  step1_zh_hk: 750 × 12 + 400 × 8 − 600 = 11,600
  step2_en: +3,200 − 1,800 − 1,200 − 600 = −400
  step2_zh: +3,200 − 1,800 − 1,200 − 600 = −400
  step2_zh_hk: +3,200 − 1,800 − 1,200 − 600 = −400
  step3_en: Keep standard-only this month
  step3_zh: 本月维持只卖标准装
  step3_zh_hk: 本月維持只賣標準裝
  s1_en: >-
    With capacity, the launch gives 750 times 12, plus 400 times 8, minus 600: 11,600 dollars, which is
    400 below standard-only.
  s1_zh: 算上产能，上市方案是七百五十乘十二，加四百乘八，减六百，一万一千六百元，比只卖标准装少四百元。
  s1_zh_hk: 計埋產能，上市方案係七百五十乘十二，加四百乘八，減六百，一萬一千六百蚊，比淨係賣標準裝少四百蚊。
  s2_en: >-
    Item by item: plus 3,200 from small packs, minus 1,800 from switching, minus 1,200 from capacity displacement,
    minus 600 launch cost. This is contribution before fixed costs, not company profit.
  s2_zh: 逐项来看：小包装加三千二百元，转买扣一千八百元，产能挤占再扣一千二百元，最后扣上市成本六百元。这是扣除固定成本前的贡献，不是公司总利润。
  s2_zh_hk: 逐項睇：細包裝加三千二百蚊，轉買扣一千八百蚊，產能擠佔再扣一千二百蚊，最後扣上市成本六百蚊。呢個係未扣固定成本嘅貢獻，唔係公司總利潤。
  s3_en: >-
    Under these figures and a contribution objective, keep standard-only this month. That is not a permanent
    ban on smaller packs.
  s3_zh: 按这些数字，以贡献为目标，本月应该维持只卖标准装。但这不等于永远不能推出小包装。
  s3_zh_hk: 按呢啲數字，以貢獻做目標，今個月應該維持淨係賣標準裝。但呢個唔等於永遠唔可以推出細包裝。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Redesign is not a free fix
  title_zh: 改方案并非零成本
  title_zh_hk: 改方案並非零成本
  en: >-
    A later offer could change quantity, positioning or channel, but it needs a new costed proposal and
    demand estimate. It cannot assume it reaches only new buyers at the same cost. Test what purchasers
    would otherwise buy and which output is displaced. Some switching can coexist with a profitable extension.
  zh: >-
    日后可以改变数量、定位或渠道，但要有新的成本方案和需求估算，不能假定成本不变，就只吸引新买家。要先验证小包装的买家本来会买什么，以及新增产量会挤掉哪些产品。有一些转买，产品线延伸仍然可以赚钱。
  zh_hk: >-
    日後可以改變數量、定位或者渠道，但要有新嘅成本方案同需求估算，唔可以假設成本唔變，就淨係吸引到新買家。要先驗證細包裝嘅買家本來會買乜，同埋新增產量會擠走邊啲產品。有啲轉買，產品線延伸仍然可以賺錢。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: New pack ≠ new business
  title_zh: 新包装 ≠ 新生意
  title_zh_hk: 新包裝 ≠ 新生意
  q1_en: >-
    Worksheet: +2,600 · reality: −400
  q1_zh: 初版：+2,600 · 实际：−400
  q1_zh_hk: 初版：+2,600 · 實際：−400
  q2_en: Switching −1,800 · capacity −1,200
  q2_zh: 转买 −1,800 · 产能 −1,200
  q2_zh_hk: 轉買 −1,800 · 產能 −1,200
  s1_en: >-
    A new label is not necessarily new business. Ask what each buyer would otherwise purchase, then check
    what the launch displaces in production.
  s1_zh: 新包装不一定是新生意。先问每个买家本来会买什么，再查新品在生产上挤掉了什么。
  s1_zh_hk: 新包裝唔一定係新生意。先問每個買家本來會買乜，再查新產品喺生產上擠走咗乜。
  s2_en: >-
    Switching and capacity are two separate losses: count both.
  s2_zh: 转买和产能挤占是两笔不同的损失，两笔都要算。
  s2_zh_hk: 轉買同產能擠佔係兩筆唔同嘅損失，兩筆都要計。
  s3_en: >-
    The biscuit maker, costs, demand and capacity are fictional, not Swire Coca-Cola data. Official scene
    art is a teaching illustration only.
  s3_zh: 饼干制造商、成本、需求和产能都是虚构的，不是太古可口可乐的数据。官方场景图只是教学插图。
  s3_zh_hk: 餅乾廠、成本、需求同產能都係虛構嘅，唔係太古可口可樂嘅數據。官方場景圖只係教學插圖。
