  s1_en: >-
    Without a launch, the maker expects 1,000 standard-pack purchases at 30 dollars. Variable cost is
    18 dollars, leaving 12 dollars of contribution per pack before unchanged fixed costs.
  s1_zh: 如果不推出新品，预计卖出一千包标准装，每包三十元。变动成本十八元，所以每包贡献十二元，固定成本不变。
  s1_zh_hk: 如果唔推出新產品，預計賣一千包標準裝，每包三十蚊。變動成本十八蚊，所以每包貢獻十二蚊，固定成本唔變。
  s2_en: >-
    A smaller pack would sell for 20 dollars with 12 dollars of variable cost: 8 dollars of contribution.
    The full launch forecasts 400 small packs and needs 600 dollars of avoidable design and promotion
    cost.
  s2_zh: 小包装每包卖二十元，变动成本十二元，贡献八元。完整的上市方案预计卖出四百小包，另外要六百元设计和推广费用，不推出就可以省下。
  s2_zh_hk: 細包裝每包賣二十蚊，變動成本十二蚊，貢獻八蚊。完整嘅上市方案預計賣四百細包，另外要六百蚊設計同推廣費用，唔推出就可以慳返。
  s3_en: >-
    The first worksheet simply adds 400 times 8, minus 600, to existing contribution. It has not checked
    where small-pack buyers come from, or whether production fits.
  s3_zh: 初版电子表格直接把四百乘八、再减六百，加到原有贡献上。它没有核实小包装的顾客从哪里来，也没确认产能够不够。
  s3_zh_hk: 初版試算表直接將四百乘八、再減六百，加落原有貢獻度。佢冇核實細包裝嘅顧客由邊度嚟，亦冇確認產能夠唔夠。
