- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-16
  kicker_en: MKT-16
  kicker_zh: MKT-16
  kicker_zh_hk: MKT-16
  title_en: A new pack. New sales?
  title_zh: 推出新包装，就有新生意吗？
  title_zh_hk: 推出新包裝，就有新生意嗎？
  image: art/new-pack-new-sales-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Swire Coca-Cola's 2019 sustainability report describes introducing mini cans in Hong Kong after investing
    in a production line. That shows another pack size, not whether it displaced existing sales. Now a
    fictional Hong Kong biscuit maker is planning one month's production, and wonders whether a smaller
    pack would bring new business.
  zh: >-
    太古可口可乐在二零一九年的可持续发展报告中提到，它投资了生产线，在香港推出迷你罐。这说明它多了一种包装容量，但说明不了新包装有没有抢走原有的销售。现在，一家虚构的香港饼干制造商在规划一个月的产量，想知道推出小包装能不能带来新生意。
  zh_hk: >-
    太古可口可樂喺二零一九年嘅可持續發展報告提到，佢投資咗生產線，喺香港推出迷你罐。呢個說明佢多咗一種包裝容量，但講唔到新包裝有冇搶走原有嘅銷售。而家，一間虛構嘅香港餅乾廠喺度規劃一個月嘅產量，想知推出細包裝可唔可以帶來新生意。
