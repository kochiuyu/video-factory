  title_en: Which bundle to test?
  title_zh: 先试哪一个套餐？
  title_zh_hk: 先試哪一個套餐？
  en: >-
    Which feasible bundle would you take forward, and why? What trade-off must the customer accept, and
    why do the separate importance ratings not settle the choice? Pause and vote.
  zh: 你会先拿哪一个可行套餐去试行？为什么？顾客要接受什么取舍？为什么逐项评出来的重要程度，决定不了这个选择？请暂停，投个票。
  zh_hk: 你會先攞邊個可行套餐去試？點解？顧客要接受乜嘢取捨？點解逐項評出嚟嘅重要程度，決定唔到呢個選擇？暫停，投個票。
