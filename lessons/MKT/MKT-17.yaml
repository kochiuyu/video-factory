  en: >-
    Would you keep your bundle or change it after these choices? State the customer trade-off you would
    test next, and one claim these results cannot support. Pause and vote.
  zh: 看过这些选择后，你会维持原来的套餐，还是改选？请说出下一步想验证的顾客取舍，以及这些结果不能支持的一个说法。请暂停，投个票。
  zh_hk: 睇完呢啲選擇之後，你會維持原本嘅套餐，定係改選？請講出下一步想驗證嘅顧客取捨，同埋呢啲結果唔支持得到嘅一個講法。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: A wish list is not an offer
  title_zh: 愿望清单不等于方案
  title_zh_hk: 願望清單不等於方案
  step1_en: Ratings hide price and cost
  step1_zh: 逐项评分看不到价格和成本
  step1_zh_hk: 逐項評分看不到價格和成本
  step2_en: Bundles make the sacrifice explicit
  step2_zh: 完整方案让取舍变得明确
  step2_zh_hk: 完整方案讓取捨變得明確
  step3_en: >-
    All three: HK$40 contribution
  step3_zh: 三款贡献都是 HK$40
  step3_zh_hk: 三款貢獻都是 HK$40
  s1_en: >-
    Separate importance ratings let every improvement sound desirable, without its price or operating
    consequence.
  s1_zh: 逐项评分时，每一项改进听起来都很好，因为看不到价格，也看不到营运上的代价。
  s1_zh_hk: 逐項評分嘅時候，每一項改進聽落都好好，因為睇唔到價錢，亦睇唔到營運上嘅代價。
  s2_en: >-
    Complete bundles make the sacrifice explicit. A offers a lower price; B adds variety at a higher price;
    C adds a narrower window at that same higher price. None offers everything at the lowest price.
  s2_zh: 完整方案就把取舍摆了出来。A 价格较低；B 价格较高，但菜式多；C 同样价格较高，但送达时段短。没有一个方案能用最低价格提供所有好处。
  s2_zh_hk: 完整方案就將取捨擺咗出嚟。A 平啲；B 貴啲，但菜式多；C 一樣貴啲，但送達時段短。冇一個方案可以用最平嘅價錢俾晒所有好處。
  s3_en: >-
    Each bundle contributes 40 dollars per order, so the counts cannot justify claiming the higher-priced
    bundle earns more.
  s3_zh: 三个方案每张订单都贡献四十元，所以单看人数，不能说价格较高的方案赚得更多。
  s3_zh_hk: 三個方案每張訂單都貢獻四十蚊，所以淨睇人數，唔可以話貴啲嘅方案賺得多啲。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Read choices within alternatives
  title_zh: 连同备选方案解读选择
  title_zh_hk: 連同備選方案解讀選擇
  step1_en: A most chosen here, not 40% share
  step1_zh: A 最多人选，不是 40% 市场占有率
  step1_zh_hk: A 最多人選，不是 40% 市場佔有率
  step2_en: HK$40 gap ≠ willingness to pay
  step2_zh: HK$40 差价 ≠ 支付意愿
  step2_zh_hk: HK$40 差價 ≠ 支付意願
  step3_en: Pick a learning priority
  step3_zh: 先决定最想验证什么
  step3_zh_hk: 先決定最想驗證甚麼
  s1_en: >-
    Eight, six, four and two make 20. A is the most selected card in this invited group, not a majority
    of all buyers or a 40 percent market-share forecast. The opt-out matters: a favourite bundle may still
    lose to a person's existing arrangement.
  s1_zh: >-
    八、六、四、二，合共二十人。A 是这批受邀者最常选的一款，但不代表过半顾客支持，更不是四成市场占有率的预测。“都不选”也很重要：最喜欢的套餐，未必胜过原有安排。
  s1_zh_hk: >-
    八、六、四、二，合共二十人。A 係呢批受邀者最多人揀嘅一款，但唔代表過半顧客支持，更加唔係四成市場佔有率嘅預測。「都唔揀」都好重要：最鍾意嘅套餐，未必好過原本安排。
  s2_en: >-
    Do not divide the 40-dollar price gap by the extra menus and call it willingness to pay, or assume
    every C chooser values the narrower window at exactly 40 dollars. One task estimates no utilities.
  s2_zh: 不要把四十元的差价，除以多出来的菜式，就当成支付意愿；也不能认为每个选 C 的人，正好愿意为短时段多付四十元。一次练习估计不了效用。
  s2_zh_hk: 唔好將四十蚊嘅差價，除以多出嚟嘅菜式，就當係支付意願；亦唔可以話每個揀 C 嘅人，啱啱好願意為短時段多俾四十蚊。一次練習估算唔到效用。
  s3_en: >-
    A suits testing an accessible price, B variety, and C delivery predictability. State which customer
    need the funded test addresses.
  s3_zh: 想测试亲民价格，可以选 A；想测试菜式多样，选 B；想测试准时送达，选 C。关键是说清楚这次试行要验证哪一种顾客需要。
  s3_zh_hk: 想測試親民價錢，可以揀 A；想測試菜式多樣，揀 B；想測試準時送達，揀 C。關鍵係講清楚今次試行要驗證邊種顧客需要。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Count purchases, not selections
  title_zh: 算购买，不算选择
  title_zh_hk: 算購買，不算選擇
  en: >-
    Do not count these 18 hypothetical selections as sales. Collect actual opt-in purchases and repeat
    use on clear terms, verify fulfilled-order costs and delivery performance, and find out why people
    decline. Changing profiles, prices or recruitment could change the result.
  zh: >-
    别把这十八个假设性的选择当成销量。要在条款清楚的前提下，收集顾客自愿下单和重复使用的实际数据，核实完成订单的成本和送达表现，也要了解有人为什么不买。换了方案组合、价格或招募对象，结果都可能不同。
  zh_hk: >-
    唔好將呢十八個假設性嘅選擇當成銷量。要喺條款清楚嘅前提下，收集顧客自願落單同重複使用嘅實際數據，核實完成訂單嘅成本同送達表現，亦要了解有人點解唔買。換咗方案組合、價錢或者招募對象，結果都可能唔同。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Make the trade-off visible
  title_zh: 让取舍看得见
  title_zh_hk: 讓取捨看得見
  q1_en: A 8 · B 6 · C 4 · none 2 = 20
  q1_zh: A 8 · B 6 · C 4 · 不选 2 = 20
  q1_zh_hk: A 8 · B 6 · C 4 · 不選 2 = 20
  q2_en: >-
    Every bundle: HK$40 per order
  q2_zh: 每款每单贡献 HK$40
  q2_zh_hk: 每款每單貢獻 HK$40
  s1_en: >-
    Customers can rate everything as important. Show complete, feasible offers to learn what they will
    give up.
  s1_zh: 顾客可以说每一项都重要。要拿出完整、可行的方案，才知道他们愿意放弃什么。
  s1_zh_hk: 顧客可以話每一項都重要。要攞出完整、可行嘅方案，先知佢哋願意放棄乜嘢。
  s2_en: >-
    A stated choice is not a market share, a willingness-to-pay estimate or a sale.
  s2_zh: 表达出来的选择，不是市场占有率，不是支付意愿的估计，也不是销量。
  s2_zh_hk: 講出嚟嘅選擇，唔係市場佔有率，唔係支付意願嘅估算，亦唔係銷量。
  s3_en: >-
    The meal service, bundles, costs and responses are original fiction. Official scene art is a teaching
    illustration only.
  s3_zh: 送餐服务、套餐、成本和顾客反应都是原创虚构的。官方场景图只是教学插图。
  s3_zh_hk: 送餐服務、套餐、成本同顧客反應都係原創虛構嘅。官方場景圖只係教學插圖。
