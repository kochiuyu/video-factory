  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Choosing among complete cards
  title_zh: 在完整方案之间选择
  title_zh_hk: 在完整方案之間選擇
  step1_en: A 8 · B 6 · C 4 · none 2
  step1_zh: A 8 人 · B 6 人 · C 4 人 · 不选 2 人
  step1_zh_hk: A 8 人 · B 6 人 · C 4 人 · 不選 2 人
  step2_en: Each states the trade-off accepted
  step2_zh: 每人说明接受了什么取舍
  step2_zh_hk: 每人說明接受了甚麼取捨
  step3_en: No money paid; one illustrative task
  step3_zh: 没有付款；只是一次示范
  step3_zh_hk: 沒有付款；只是一次示範
  s1_en: >-
    The same 20 prospects now see all three cards together, plus an equally visible none-of-these option,
    with positions rotated. Eight choose A, six B, four C, and two choose none.
  s1_zh: >-
    同一批二十人，现在同时看三张完整的方案卡，还有同样显眼的“三款都不选”，卡片位置也会轮换。结果八人选 A，六人选 B，四人选 C，两人都不选。
  s1_zh_hk: >-
    同一批二十人，而家同時睇三張完整嘅方案卡，仲有一樣咁顯眼嘅「三款都唔揀」，卡嘅位置亦會輪換。結果八個揀 A，六個揀 B，四個揀 C，兩個都唔揀。
  s2_en: >-
    A choosers accept fewer menus and a wider window to keep the lower price. B choosers accept the wider
    window for more menus. C choosers accept fewer menus for the narrower window. The two who chose none
    prefer their existing arrangements.
  s2_zh: >-
    选 A 的人，为了较低的价格，接受菜式少、时段长。选 B 的人，为了菜式多，接受时段长。选 C 的人，为了时段短，接受菜式少。两个都不选的人，宁愿维持原来的安排。
  s2_zh_hk: >-
    揀 A 嘅人，為咗平啲，接受菜式少、時段長。揀 B 嘅人，為咗多菜式，接受時段長。揀 C 嘅人，為咗時段短，接受菜式少。兩個都唔揀嘅，寧願維持原本嘅安排。
  s3_en: >-
    No money is paid and no order is placed. This is one illustrative choice task, not a fitted conjoint
    model or a representative survey.
  s3_zh: 没有人付款，也没有人下单。这只是一次示范性的选择练习，不是已经估计参数的联合分析模型，也不是有代表性的调查。
  s3_zh_hk: 冇人俾錢，亦冇人落單。呢個只係一次示範性嘅選擇練習，唔係已經估算參數嘅聯合分析模型，亦唔係有代表性嘅調查。
