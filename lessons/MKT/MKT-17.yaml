  s1_en: >-
    Bundle A costs 200 dollars a week, with two daily menu options and a two-hour window. B costs 240,
    with six options and two hours. C costs 240, with two options and a 30-minute window.
  s1_zh: >-
    A 方案每周二百元，每天可选两款菜式，送达时段两小时。B 方案二百四十元，可选六款，两小时。C 方案也是二百四十元，可选两款，送达时段缩短到三十分钟。
  s1_zh_hk: >-
    A 方案每星期二百蚊，每日揀兩款菜式，送達時段兩個鐘。B 方案二百四十蚊，揀六款，兩個鐘。C 方案都係二百四十蚊，揀兩款，送達時段縮短到三十分鐘。
  s2_en: >-
    Incremental costs are 160 dollars for A and 200 for B and C, so each contributes 40 dollars per order.
    Six options plus 30 minutes at 200 dollars would cost 240: a 40-dollar loss, with no subsidy.
  s2_zh: >-
    A 的增量成本是一百六十元，B 和 C 都是二百元，所以每张订单都贡献四十元。如果要六款菜式加三十分钟，只收二百元，成本就是二百四十元，每单亏四十元，而且没有补贴。
  s2_zh_hk: >-
    A 嘅增量成本係一百六十蚊，B 同 C 都係二百蚊，所以每張訂單都貢獻四十蚊。如果要六款菜式加三十分鐘，只收二百蚊，成本就係二百四十蚊，每單蝕四十蚊，而且冇補貼。
  s3_en: >-
    Portions, food safety and safe working schedules are identical. A shorter window comes from extra
    routing capacity, not from pressure to drive faster.
  s3_zh: 三个方案的份量、食物安全和安全的工作安排都一样。送达时段较短，是因为增加了路线安排的人手，不是要司机开快车。
  s3_zh_hk: 三個方案嘅份量、食物安全同安全嘅工作安排都一樣。送達時段短啲，係因為加咗路線安排嘅人手，唔係要司機揸快車。
