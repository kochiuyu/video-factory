  title_en: They want everything. What will they trade?
  title_zh: 每样都想要，哪一样肯放弃？
  title_zh_hk: 每樣都想要，哪一樣肯放棄？
  image: art/which-improvement-would-you-give-up-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In March 2026, the Hong Kong Federation of Youth Groups' Youth IDEAS think tank released research
    on prepared dishes, discussing taste, price and transparency. Food choices have several dimensions.
    Now a fictional Hong Kong meal service is choosing one weekly bundle of five meals for a small, funded
    test. Twenty prospects rated lower price, more menu choice and a narrower delivery window all as important.
  zh: >-
    二零二六年三月，香港青年协会青年创研库发表了预制菜研究，谈到味道、价格和信息透明度。可见选择食物要考虑好几方面。现在，一家虚构的香港送餐服务，要从几个每周五餐的套餐中选一个，做小规模试行。二十位潜在顾客分别评分时，认为减价、多些菜式、缩短送餐时段都很重要。
  zh_hk: >-
    二零二六年三月，香港青年協會青年創研庫發表咗預製菜研究，講到味道、價錢同資訊透明度。可見揀食物要諗好多方面。而家，一間虛構嘅香港送餐服務，要喺幾個每星期五餐嘅套餐入面揀一個，做小規模試行。二十個潛在顧客分開評分嘅時候，覺得平啲、多啲菜式、送餐時段短啲都好重要。
