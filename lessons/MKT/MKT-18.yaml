  col1_zh_hk: 希望取得的好處
  col2_en: Trade-off
  col2_zh: 要接受的取舍
  col2_zh_hk: 要接受的取捨
  c11_en: Timely product news; familiar
  c11_zh: 及早得知产品消息；做法熟悉
  c11_zh_hk: 及早得知產品消息；做法熟悉
  c12_en: Repeated contact may feel irrelevant
  c12_zh: 反复联络或令人觉得无关
  c12_zh_hk: 反覆聯絡或令人覺得無關
  c21_en: Members choose their rhythm
  c21_zh: 会员自选联络频率
  c21_zh_hk: 會員自選聯絡頻率
  c22_en: Digest can miss items; refresh delayed
  c22_zh: 月报或赶不上；首页更新延后
  c22_zh_hk: 月報或趕不上；首頁更新延後
  footer_en: Opt-out stays immediate
  footer_zh: 退订仍即时生效
  footer_zh_hk: 退訂仍即時生效
  s1_en: >-
    Policy A keeps the familiar weekly email and still honours every individual request for less contact
    or none. It brings new items to attention sooner, but repeated contact may feel irrelevant.
  s1_zh: 方案 A 维持熟悉的每周一封，同时照样尊重每一个减少联络或停止联络的要求。它能让会员更早知道新货，但反复联络，也可能让人觉得与自己无关。
  s1_zh_hk: >-
    方案 A 維持熟悉嘅每星期一封，同時照樣尊重每一個減少聯絡或者停止聯絡嘅要求。佢可以令會員早啲知道新貨，但反覆聯絡，亦可能令人覺得同自己無關。
  s2_en: >-
    Policy B adds a simple choice: weekly, a monthly digest, or no marketing. No reply leaves the weekly
    default; it is not new consent. But a digest can arrive after an item sells out, and it delays a homepage
    refresh.
  s2_zh: >-
    方案 B 加一个简单选项：每周一封、每月一封汇总，或者不收促销邮件。会员不回应，就维持原来的每周一封，但这不算新的同意。不过，月报送到时货品可能已经卖完，而且首页更新要延后。
  s2_zh_hk: >-
    方案 B 加一個簡單選項：每星期一封、每月一封匯總，或者唔收促銷電郵。唔回應就維持每星期一封，但唔算新嘅同意。不過月報寄到時貨品可能賣晒，首頁更新亦要延後。
  s3_en: >-
    Both fit the same budget, opting out stays immediate, and neither is promised to increase sales.
  s3_zh: 两个方案都在同一预算内，退订都即时生效，也都不保证能增加销售。
  s3_zh_hk: 兩個方案都喺同一預算之內，退訂都即時生效，亦都唔保證可以增加銷售。
