  zh: 看过记录后，你会维持还是改变政策？请说说还剩多少受众、证据有什么局限，以及在不违背任何人选择的前提下，怎样评估下个月的结果。请暂停，投个票。
  zh_hk: 睇完記錄之後，你會維持定係改變政策？請講吓仲剩幾多受眾、證據有乜局限，同埋喺唔違背任何人選擇嘅前提下，點樣評估下個月嘅結果。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Deliveries are not relationships
  title_zh: 送达不等于建立关系
  title_zh_hk: 送達不等於建立關係
  step1_en: 800 emails, but 200 people
  step1_zh: 800 封邮件，只有 200 人
  step1_zh_hk: 800 封電郵，只有 200 人
  step2_en: 80 clicked = 40%; opt-outs 2% vs 12%
  step2_zh: 80 人点击 = 40%；退订 2% 对 12%
  step2_zh_hk: 80 人點擊 = 40%；退訂 2% 對 12%
  step3_en: 186 remain; 744 sends only if no change
  step3_zh: 剩 186 人；没变动才是 744 封
  step3_zh_hk: 剩 186 人；沒變動才是 744 封
  s1_en: The log shows 800 delivered emails, but only 200 people received them.
  s1_zh: 记录显示送达了八百封邮件，但收件人只有两百位。
  s1_zh_hk: 記錄顯示寄到咗八百封電郵，但收件人得二百個。
  s2_en: >-
    80 different members clicked a product, 40 percent of the starting audience; 120 never did. Group
    click shares were 60 and 20 percent, and opt-outs were 2 and 12 percent of each group.
  s2_zh: >-
    全月有八十位不同的会员点击过产品，占期初人数的百分之四十；另外一百二十人从没点击。两组的点击比例分别是百分之六十和二十，退订率分别是百分之二和十二。
  s2_zh_hk: >-
    成個月有八十個唔同嘅會員撳過產品，佔期初人數百分之四十；另外一百二十人從來冇撳過。兩組嘅點擊比例分別係百分之六十同二十，退訂率分別係百分之二同十二。
  s3_en: >-
    The remaining audience is 98 plus 88: 186, not 200. Four emails each would be 744 sends only if nobody
    changed preferences or opted out next month.
  s3_zh: 还在订阅的是九十八加八十八，一百八十六人，不是两百人。每人寄四封，要在下个月没有人改变偏好或退订的前提下，才会是七百四十四封。
  s3_zh_hk: 仲訂緊嘅係九十八加八十八，一百八十六人，唔係二百人。每人寄四封，要下個月冇人改變偏好或者退訂，先會係七百四十四封。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: A reason to offer choice
  title_zh: 有理由让顾客选择
  title_zh_hk: 有理由讓顧客選擇
  step1_en: >-
    B: members set their own cadence
  step1_zh: B：会员自己定频率
  step1_zh_hk: B：會員自己定頻率
  step2_en: Logs don't prove B keeps all 186
  step2_zh: 记录不能证明 B 留住 186 人
  step2_zh_hk: 記錄不能證明 B 留住 186 人
  step3_en: >-
    A: timely news, accept the burden
  step3_zh: A：消息及时，但要承担负担
  step3_zh_hk: A：消息及時，但要承擔負擔
  s1_en: >-
    B is defensible because the groups show different engagement and opt-out patterns, and members can
    choose their own rhythm instead of being assigned one from a shopping label.
  s1_zh: B 有它的理据：两组的互动和退订情况不同，而 B 让会员自己选频率，不是按购物类别替他们决定。
  s1_zh_hk: B 有佢嘅理據：兩組嘅互動同退訂情況唔同，而 B 俾會員自己揀頻率，唔係按購物類別幫佢哋決定。
  s2_en: >-
    But this descriptive evidence does not show that B will retain all 186 people, or recover lost sales.
    It also says nothing about the cause of opting out.
  s2_zh: 不过，这些描述性的记录，不能证明 B 会留住全部一百八十六人，也不能证明能补回流失的销售，更说明不了退订的原因。
  s2_zh_hk: 不過，呢啲描述性嘅記錄，證明唔到 B 會留住晒一百八十六人，亦證明唔到可以補返流失嘅銷售，更加講唔到退訂嘅原因。
  s3_en: >-
    A stays defensible if timely product news matters and the manager accepts the observed contact burden
    while honouring individual limits. B's delayed refresh and missed updates are real trade-offs too.
  s3_zh: >-
    如果及早通知新货很重要，而经理愿意承担目前看到的联络负担，同时遵守个别会员的限额，A 也说得通。B 延后首页更新、可能错过限时消息，这些也是实际的取舍。
  s3_zh_hk: >-
    如果及早通知新貨好重要，而經理願意承擔而家睇到嘅聯絡負擔，同時遵守個別會員嘅限額，A 都講得通。B 延後首頁更新、可能錯過限時消息，呢啲亦係實際嘅取捨。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Track honest denominators
  title_zh: 用合适的分母衡量
  title_zh_hk: 用合適的分母量度
  en: >-
    Count active authorised subscribers, delivered messages, unique product clickers, frequency choices
    and opt-outs separately, and report by starting cohort as well as current recipients. A higher click
    rate after disengaged people leave is not necessarily improvement. Stop sending when permission ends,
    and never contact opted-out people to ask why.
  zh: >-
    要分开统计：有效订阅人数、送达邮件、点击产品的不同会员、频率选择和退订人数，并且既按期初的会员群，也按目前的收件人来报告。不活跃的人走了以后，点击率变高，不一定是进步。同意一旦结束，就要停止发送，也不能再联络退订的人去问原因。
  zh_hk: >-
    要分開統計：有效訂閱人數、寄到嘅電郵、撳過產品嘅唔同會員、頻率選擇同退訂人數，而且要按期初嘅會員群，亦要按而家嘅收件人嚟報告。唔活躍嘅人走咗之後，點擊率高咗，唔一定係進步。同意一結束，就要停止發送，亦唔可以再聯絡退訂嘅人問原因。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Permission is not a quota
  title_zh: 同意不等于发送配额
  title_zh_hk: 同意不等於發送配額
  q1_en: 800 emails · 200 people · 80 clicked
  q1_zh: 800 封 · 200 人 · 80 人点击
  q1_zh_hk: 800 封 · 200 人 · 80 人點擊
  q2_en: Opt-outs 2% vs 12% · 186 remain
  q2_zh: 退订 2% 对 12% · 剩 186 人
  q2_zh_hk: 退訂 2% 對 12% · 剩 186 人
  s1_en: >-
    More emails delivered do not mean more relationships. Count people, not sends, and let members choose
    their own cadence.
  s1_zh: 邮件送达得多，不代表关系更好。要数的是人，不是发送次数，也可以让会员自己选择频率。
  s1_zh_hk: 電郵寄得多，唔代表關係更好。要數嘅係人，唔係發送次數，亦可以俾會員自己揀頻率。
  s2_en: >-
    Descriptive logs cannot tell you why people left, or what a new cadence will cause.
  s2_zh: 描述性的记录，说明不了会员为什么离开，也预测不了新频率会带来什么结果。
  s2_zh_hk: 描述性嘅記錄，講唔到會員點解離開，亦預測唔到新頻率會帶嚟乜嘢結果。
  s3_en: >-
    The shop, its policies and activity logs are invented. Official scene art is a teaching illustration
    only.
  s3_zh: 店铺、政策和活动记录都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 店舖、政策同活動記錄都係虛構嘅。官方場景圖只係教學插圖。
