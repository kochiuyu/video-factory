  title_en: Four weeks of aggregate logs
  title_zh: 过去四周的汇总记录
  title_zh_hk: 過去四週的匯總記錄
  step1_en: >-
    Clicked: replenish 60 · gifts 20
  step1_zh: 曾点击：补充家用品 60 · 买礼物 20
  step1_zh_hk: 曾點擊：補充家用品 60 · 買禮物 20
  step2_en: >-
    Opted out: replenish 2 · gifts 12
  step2_zh: 退订：补充家用品 2 · 买礼物 12
  step2_zh_hk: 退訂：補充家用品 2 · 買禮物 12
  step3_en: >-
    Next month: 98 + 88 still subscribed
  step3_zh: 下月仍订阅：98 + 88
  step3_zh_hk: 下月仍訂閱：98 + 88
  s1_en: >-
    Members had said their main interest: 100 mostly replenish household supplies, and 100 mostly buy
    occasional gifts. Each received four emails. In the replenishment group, 60 clicked a product at least
    once; in the gift group, 20 did.
  s1_zh: >-
    会员之前说过主要用途：一百人多是补充家居用品，一百人主要偶尔买礼物。每人收到四封邮件。补充家用品的一组，有六十人至少点击过一次产品；买礼物的一组，有二十人。
  s1_zh_hk: >-
    會員之前自己講過主要購物用途：一百人多數係補充家居用品，一百人主要係間中買禮物。每人都收到四封電郵。補充家用品嗰組，有六十人至少撳過一次產品；買禮物嗰組，有二十人。
  s2_en: >-
    After the fourth email, 2 replenishment members and 12 gift members opted out, and were suppressed
    immediately. Clicks and opt-outs may overlap, and the groups were not randomly assigned.
  s2_zh: 第四封送达后，补充家用品组有两人退订，买礼物组有十二人退订，店家立即停止向他们发送。点击和退订的人可能重叠，两组也不是随机分配的。
  s2_zh_hk: 第四封寄到之後，補充家用品組有兩個退訂，買禮物組有十二個退訂，店舖即刻停止向佢哋發送。撳過同退訂嘅人可能重疊，兩組亦唔係隨機分配。
  s3_en: >-
    Next month starts with 98 and 88 members still subscribed. Under B, people pick their own cadence;
    nobody has tried the digest yet.
  s3_zh: 下个月仍有九十八人和八十八人订阅。如果选 B，频率由会员自己选；目前还没有人试过月报。
  s3_zh_hk: 下個月仲有九十八人同八十八人訂閱。如果揀 B，頻率由會員自己揀；暫時仲未有人試過月報。
