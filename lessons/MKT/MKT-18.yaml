  title_en: More reminders. More relationships?
  title_zh: 多寄几封电子邮件，关系就会更好吗？
  title_zh_hk: 多寄幾封電郵，關係就會更好嗎？
  image: art/permission-is-not-a-message-quota-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In April 2023, Hong Kong's Privacy Commissioner revised its Guidance on Direct Marketing, covering
    consent, permitted use of data and people's ability to stop marketing. It sets no universal email
    frequency. Now a fictional Hong Kong homeware shop emails one product update a week to members who
    validly consented, and must set next month's policy.
  zh: >-
    二零二三年四月，香港个人资料隐私专员公署修订了《直接促销指引》，内容包括同意、资料的准许用途，以及怎样停止接收促销信息。指引没有规定一个人人适用的邮件频率。现在，一家虚构的香港家居用品店，每周给已经有效同意的会员发一封产品邮件，要定下个月的沟通政策。
  zh_hk: >-
    二零二三年四月，香港個人資料私隱專員公署修訂咗《直接促銷指引》，內容包括同意、資料嘅准許用途，同埋點樣停止接收促銷訊息。指引冇規定一個人人適用嘅電郵頻率。而家，一間虛構嘅香港家品店，每星期向已經有效同意嘅會員寄一封產品電郵，要定落下個月嘅溝通政策。
