  title_en: Two communication policies
  title_zh: 两个沟通政策
  title_zh_hk: 兩個溝通政策
  row1_en: A · weekly default
  row1_zh: A · 预设每周一封
  row1_zh_hk: A · 預設每週一封
  row2_en: B · visible cadence choice
  row2_zh: B · 清楚列出频率选项
  row2_zh_hk: B · 清楚列出頻率選項
