  title_zh_hk: 一個名字，能承載兩種承諾嗎？
  image: art/one-name-two-promises-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Ryohin Keikaku's archived 2018 announcement describes MUJI HOTEL in Shenzhen and Beijing, meant to
    express the MUJI philosophy. That is the company's stated approach, not evidence that brand extensions
    raise sales. Now Everyday Table, a fictional Hong Kong kitchenware shop known for useful everyday
    products, plans a premium kitchen-organisation service.
  zh: >-
    良品计划在二零一八年修订的公告中，介绍了深圳和北京的 MUJI HOTEL，说酒店体验是要体现无印良品的理念。这是公司自己的说法，不能证明品牌延伸会带来更多销售。现在，Everyday Table
    是一家虚构的香港厨具店，以实用的日常用品出名，打算推出一项高端的厨房收纳规划服务。
  zh_hk: >-
    良品計畫喺二零一八年修訂嘅公告入面，介紹咗深圳同北京嘅 MUJI HOTEL，話酒店體驗係要體現無印良品嘅理念。呢個係公司自己嘅講法，證明唔到品牌延伸會帶嚟更多銷售。而家，Everyday Table
    係一間虛構嘅香港廚具店，以實用嘅日常用品出名，打算推出一項高端嘅廚房收納規劃服務。
