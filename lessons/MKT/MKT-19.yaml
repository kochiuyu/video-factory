  title_zh: 母品牌为主，还是独立名称？
  title_zh_hk: 母品牌為主，還是獨立名稱？
  en: >-
    Would you launch with the parent name leading, or a distinct name with clear endorsement? Which associations
    do you want to carry over, and which expectations may need to change? Pause and vote.
  zh: 你会用母品牌为主的名称推出，还是用独立名称，再清楚标示母品牌背书？你希望延续哪些品牌联想？又有哪些期望可能需要改变？请暂停，投个票。
  zh_hk: 你會用母品牌為主嘅名稱推出，定係用獨立名稱，再清楚標示母品牌背書？你想延續邊啲品牌聯想？又有邊啲期望可能要改？暫停，投個票。
- id: reveal
