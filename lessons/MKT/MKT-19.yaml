  c12_zh: 以原有母品牌为主
  c12_zh_hk: 以原有母品牌為主
  c21: Roomwise, by Everyday Table
  c22_en: Own name; clear endorsement
  c22_zh: 突出服务名称，清楚背书
  c22_zh_hk: 突出服務名稱，清楚背書
  footer_en: HK$1,500 · 2 weeks · same budget
  footer_zh: HK$1,500 · 两周交付
  footer_zh_hk: HK$1,500 · 兩週交付
  s1_en: >-
    The service is one consultation and a tailored written storage plan within two weeks, for 1,500 dollars
    all in. It excludes products, fitting, electrical work and installation.
  s1_zh: 服务内容是一次咨询，再在两周内交付一份量身定制的书面收纳方案，全包一千五百元，不包括货品、装配、电工和安装。
  s1_zh_hk: 服務內容係一次諮詢，再喺兩個星期內交一份度身訂造嘅書面收納方案，全包一千五百蚊，唔包貨品、裝配、電力工程同安裝。
  s2_en: >-
    Route A is called Everyday Table Planning, with the parent name dominant. Route B is called Roomwise,
    by Everyday Table: a distinct service name leads, with a clear parent endorsement.
  s2_zh: >-
    方案 A 叫 Everyday Table Planning，突出母品牌。方案 B 叫 Roomwise, by Everyday Table，以独立的服务名称为主，同时清楚显示母品牌背书。
  s2_zh_hk: >-
    方案 A 叫 Everyday Table Planning，突出母品牌。方案 B 叫 Roomwise, by Everyday Table，以獨立嘅服務名稱為主，同時清楚顯示母品牌背書。
  s3_en: >-
    Both state the same company, scope, fee, timing and terms, and both cost the same 20,000-dollar launch
    budget. The aim is an understandable specialist offer that benefits from the parent's reputation without
    being confused with a shop purchase.
  s3_zh: >-
    两个方案列明的公司、服务范围、收费、交付时间和条款都一样，推出预算也都是两万元。目标是让顾客看懂这是专门服务，借助母品牌的声誉，又不会误以为跟平常到店买东西一样。
  s3_zh_hk: >-
    兩個方案列明嘅公司、服務範圍、收費、交付時間同條款都一樣，推出預算亦都係兩萬蚊。目標係令顧客睇得明呢個係專門服務，借助母品牌嘅聲譽，又唔會誤會同平時去店舖買嘢一樣。
