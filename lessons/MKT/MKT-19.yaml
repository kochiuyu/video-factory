  title_en: 24 exploratory interviews
  title_zh: 24 位顾客的探索性访谈
  title_zh_hk: 24 位顧客的探索性訪談
  step1_en: >-
    Before: reliable 18 · cheap 16 · now 14
  step1_zh: 先提到：可靠 18 · 平价 16 · 即买 14
  step1_zh_hk: 先提到：可靠 18 · 平價 16 · 即買 14
  step2_en: >-
    After both: A 10 · B 8 · no preference 6
  step2_zh: 看两版后：A 10 · B 8 · 无偏好 6
  step2_zh_hk: 看兩版後：A 10 · B 8 · 無偏好 6
  step3_en: All 24 repeat fee, timing and owner
  step3_zh: 24 人都说得出收费、时间和所属公司
  step3_zh_hk: 24 人都說得出收費、時間和所屬公司
  s1_en: >-
    Twenty-four customers who know the shop join exploratory interviews. Before seeing either name, 18
    mention reliability, 16 affordable everyday prices, and 14 being able to buy immediately. These mentions
    overlap, so they cannot be added up.
  s1_zh: >-
    二十四位熟悉这家店的顾客自愿参加探索性访谈。还没看名称前，有十八人提到可靠，十六人提到日常价格实惠，十四人提到可以马上买到。这些说法会重叠，不能加起来。
  s1_zh_hk: >-
    二十四個熟悉呢間店嘅顧客自願參加探索性訪談。未睇名稱之前，有十八個提到可靠，十六個提到日常價錢抵，十四個提到即刻買得到。呢啲講法會重疊，唔可以加埋一齊。
  s2_en: >-
    After seeing both presentations, ten say A best connects the service to trusted practical knowledge.
    Eight prefer B because it marks a different kind of purchase. Six have no strong preference.
  s2_zh: 看过两版介绍后，十人认为 A 最能把服务和可信的实用知识联系起来；八人偏好 B，因为它表明这是另一类消费；六人没有明显偏好。
  s2_zh_hk: 睇完兩版介紹之後，十個認為 A 最能夠將服務同可信嘅實用知識連埋一齊；八個鍾意 B，因為佢表明呢個係另一類消費；六個冇明顯偏好。
  s3_en: >-
    Some say the parent-led name first makes them think of a cheap, immediate shop purchase, though they
    understand once they read. All 24 correctly repeat the fee, timing and ownership.
  s3_zh: >-
    有些人说，以母品牌为主的名称，起初让他们想到便宜、即买即走的店内购物，不过读完条款后就明白了。二十四人全部都能正确说出收费、交付时间和公司归属。
  s3_zh_hk: 有啲人話，以母品牌為主嘅名稱，起初令佢哋諗到平、即買即走嘅店舖購物，不過讀完條款之後就明白。二十四個人全部都講得啱收費、交付時間同公司歸屬。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Which route now?
  title_zh: 现在选哪个方案？
  title_zh_hk: 現在選哪個方案？
  en: >-
    Which identity route would you choose now? Explain how it can borrow trust without promising the shop's
    price or speed, and what evidence you still need before claiming commercial success. Pause and vote.
  zh: 看过访谈后，你会选哪个方案？请说明它怎样借用信任，又不让人以为价格和速度跟门店一样，以及在声称商业成功前，还需要什么证据。请暂停，投个票。
  zh_hk: >-
    睇完訪談之後，你會揀邊個方案？請講吓佢點樣借用信任，又唔會令人以為價錢同速度同門市一樣，同埋喺聲稱商業成功之前，仲需要乜嘢證據。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Trust brings other associations
  title_zh: 信任会连同其他联想转移
  title_zh_hk: 信任會連同其他聯想轉移
  step1_en: >-
    Carries: reliability, practical know-how
  step1_zh: 带过去：可靠、实用知识
  step1_zh_hk: 帶過去：可靠、實用知識
  step2_en: >-
    Also: low price, instant purchase
  step2_zh: 也带过去：平价、即买
  step2_zh_hk: 也帶過去：平價、即買
  step3_en: A name can't replace the description
  step3_zh: 名声代替不了服务说明
  step3_zh_hk: 名聲代替不了服務說明
  s1_en: >-
    The parent name can carry reassuring associations about practical knowledge and reliability.
  s1_zh: 母品牌可以带来令人安心的联想，例如实用知识和可靠。
  s1_zh_hk: 母品牌可以帶嚟令人安心嘅聯想，例如實用知識同可靠。
  s2_en: >-
    It can also suggest a price level and purchase speed that do not fit a tailored service. Those associations
    help the normal shop; the question is whether they help explain this different offer.
  s2_zh: >-
    但它也可能让人联想到某种价格水平和购买速度，而这跟量身定制的服务并不相符。这些联想对平常的门店有帮助，问题是它们能不能帮助说明这项不同的服务。
  s2_zh_hk: 但佢亦可能令人聯想到某個價錢水平同購買速度，而呢啲同度身訂造嘅服務唔夾。呢啲聯想對平時嘅門市有幫助，問題係佢哋幫唔幫到解釋呢項唔同嘅服務。
  s3_en: >-
    A respected name is not a substitute for describing what customers actually receive.
  s3_zh: 名声再好，也不能代替清楚说明顾客实际会得到什么。
  s3_zh_hk: 名聲幾好，都代替唔到清楚講明顧客實際會得到乜嘢。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Two legitimate choices
  title_zh: 两种品牌架构都有道理
  title_zh_hk: 兩種品牌架構都有道理
  step1_en: >-
    A: familiar trust, explicit terms
  step1_zh: A：熟悉的信任，加清楚条款
  step1_zh_hk: A：熟悉的信任，加清楚條款
  step2_en: >-
    B: room for its own associations
  step2_zh: B：让服务建立自己的联想
  step2_zh_hk: B：讓服務建立自己的聯想
  step3_en: 10 vs 8 of 24 is not a forecast
  step3_zh: 24 人中 10 对 8，不是预测
  step3_zh_hk: 24 人中 10 對 8，不是預測
  s1_en: >-
    A makes the relationship immediate, and can use a precise descriptor, visible fee and timing to separate
    the service from shelf products.
  s1_zh: A 让顾客一看就知道和母品牌的关系，同时可以用清楚的服务说明、显眼的收费和交付时间，把服务和货架上的商品区分开来。
  s1_zh_hk: A 令顧客一睇就知同母品牌嘅關係，同時可以用清楚嘅服務說明、顯眼嘅收費同交付時間，將服務同貨架上嘅貨品分開。
  s2_en: >-
    B gives the service room to build its own associations while keeping a clear endorsement. It does
    not make ownership disappear, or automatically protect the parent from service problems.
  s2_zh: B 让服务有空间建立自己的联想，同时保留清楚的母品牌背书。但它不会让公司归属消失，也不会自动保护母品牌免受服务问题的影响。
  s2_zh_hk: B 俾服務有空間建立自己嘅聯想，同時保留清楚嘅母品牌背書。但佢唔會令公司歸屬消失，亦唔會自動保護母品牌唔受服務問題影響。
  s3_en: >-
    Ten, eight and six of 24 is not a market-share forecast, nor a significant two-person advantage. Either
    route is defensible if its communication addresses the specific expectation risk.
  s3_zh: 二十四人中十、八、六的分布，不是市场占有率预测，两人的差距也不算显著优势。只要沟通内容能处理具体的期望风险，两个方案都说得通。
  s3_zh_hk: 二十四人入面十、八、六嘅分布，唔係市場佔有率預測，兩個人嘅差距亦唔算顯著優勢。只要溝通內容處理到具體嘅期望風險，兩個方案都講得通。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Test before claiming success
  title_zh: 先验证，再谈成功
  title_zh_hk: 先驗證，再談成功
  en: >-
    Choose a provisional hypothesis: B emphasises clearer separation; A emphasises familiar trust with
    explicit service terms. Then test comprehension and qualified enquiries, followed by paid uptake and
    delivery satisfaction, without treating interview preference as demand.
  zh: >-
    先选定一个暂定的假设：选 B，重点是区分得更清楚；选 A，重点是借用熟悉的信任，再把服务条款讲明白。然后先测试顾客是否看懂、有多少合资格的查询，再看实际付费购买和交付后的满意度，不能把访谈中的偏好当成需求。
  zh_hk: >-
    先揀定一個暫定嘅假設：揀 B，重點係分得更清楚；揀 A，重點係借用熟悉嘅信任，再將服務條款講清楚。之後先測試顧客睇唔睇得明、有幾多合資格嘅查詢，再睇實際俾錢購買同交付之後嘅滿意度，唔可以將訪談入面嘅偏好當成需求。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Borrow trust, state the promise
  title_zh: 借用信任，讲明承诺
  title_zh_hk: 借用信任，講明承諾
  q1_en: >-
    A: parent name leads
  q1_zh: A：以母品牌为主
  q1_zh_hk: A：以母品牌為主
  q2_en: >-
    B: own name, clear endorsement
  q2_zh: B：独立名称，清楚背书
  q2_zh_hk: B：獨立名稱，清楚背書
  s1_en: >-
    A familiar name carries trust, but it can also carry price and speed expectations that a tailored
    service does not meet.
  s1_zh: 熟悉的名字能带来信任，也可能带来价格和速度上的期望，而量身定制的服务未必做得到。
  s1_zh_hk: 熟悉嘅名可以帶嚟信任，亦可能帶嚟價錢同速度上嘅期望，而度身訂造嘅服務未必做得到。
  s2_en: >-
    Either route works only if the fee, timing and scope are explained clearly.
  s2_zh: 无论选哪个方案，都要把收费、交付时间和服务范围讲清楚。
  s2_zh_hk: 無論揀邊個方案，都要將收費、交付時間同服務範圍講清楚。
  s3_en: >-
    Everyday Table, Roomwise and the interviews are entirely fictional and unrelated to MUJI. Official
    scene art is a teaching illustration only.
  s3_zh: Everyday Table、Roomwise 和访谈都是虚构的，与无印良品无关。官方场景图只是教学插图。
  s3_zh_hk: Everyday Table、Roomwise 同訪談都係虛構嘅，同無印良品無關。官方場景圖只係教學插圖。
