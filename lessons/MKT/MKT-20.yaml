  title_en: Visits or points first?
  title_zh: 先试集章还是积分？
  title_zh_hk: 先試集印還是積分？
  en: >-
    Would you pilot the visit-based reward or the spend-based points first? Which purchasing behaviour
    do you want to recognise, and how would you make the remaining steps and expiry clear? Pause and vote.
  zh: 你会先试行按到店次数的集章，还是按消费金额的积分？你想奖励哪一种购买行为？又会怎样让顾客看清还差多少、什么时候到期？请暂停，投个票。
  zh_hk: 你會先試行按到店次數嘅集印花，定係按消費金額嘅積分？你想獎勵邊種購買行為？又會點樣令顧客睇清楚仲差幾多、幾時到期？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: A comprehension check
  title_zh: 理解程度测试
  title_zh_hk: 理解程度測試
  step1_en: >-
    Both questions right: A 18 · B 11 of 20
  step1_zh: 两题都对：A 18 人 · B 11 人
  step1_zh_hk: 兩題都對：A 18 人 · B 11 人
  step2_en: >-
    +HK$2,000: a clear receipt panel for B
  step2_zh: 加 HK$2,000：B 收据显示栏
  step2_zh_hk: 加 HK$2,000：B 收據顯示欄
  step3_en: >-
    Repeat task: B 18 of 20
  step3_zh: 再做一次：B 有 18 人答对
  step3_zh_hk: 再做一次：B 有 18 人答對
  s1_en: >-
    Twenty consenting customers try hypothetical tasks with both draft explanations. Eighteen correctly
    identify the next reward requirement and the expiry under A, compared with eleven under B.
  s1_zh: 二十位同意参与的顾客，看过两份解说稿后做假设性的任务。方案 A 有十八人能同时答对下一份奖赏的门槛和到期日，方案 B 只有十一人。
  s1_zh_hk: 二十個同意參與嘅顧客，睇完兩份解說稿之後做假設性嘅任務。方案 A 有十八個可以同時答啱下一份獎賞嘅門檻同到期日，方案 B 得十一個。
  s2_en: >-
    B's mistakes mostly concern the 240-point threshold, and mixing up point expiry with the 30-day voucher.
    For another 2,000 dollars, B's receipt can show points remaining, points still needed and the earliest
    expiry.
  s2_zh: >-
    B 的错误，主要是搞不清二百四十分的门槛，以及把积分到期和三十天的饮品券有效期混在一起。再加二千元，B 可以在收据上显示剩余积分、还差多少分，以及最早的到期日。
  s2_zh_hk: >-
    B 嘅錯誤，主要係搞唔清二百四十分嘅門檻，同埋將積分到期同三十日嘅飲品券有效期撈亂咗。再加二千蚊，B 可以喺收據上面顯示剩低幾多分、仲差幾多分，同埋最早嘅到期日。
  s3_en: >-
    In a repeat task, eighteen of the same twenty answer B correctly. Practice may contribute; this is
    not a controlled estimate. Clarified B costs 4,000 to set up, against A's 2,000.
  s3_zh: 同一批二十人再做一次 B 的任务，有十八人答对。练习本身也可能有影响，这不是受控的估计。改良后的 B 设置费合计四千元，A 是二千元。
  s3_zh_hk: 同一批二十人再做一次 B 嘅任務，有十八個答啱。練習本身都可能有影響，呢個唔係受控嘅估算。改良之後嘅 B 設置費合共四千蚊，A 係二千蚊。
