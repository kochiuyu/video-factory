  title_en: Two ways to earn a HK$40 drink
  title_zh: 两种方法换一杯 HK$40 饮品
  title_zh_hk: 兩種方法換一杯 HK$40 飲品
  row1_en: A · visit card
  row1_zh: A · 到店集章
  row1_zh_hk: A · 到店集印
  row2_en: B · points
  row2_zh: B · 消费储分
  row2_zh_hk: B · 消費儲分
  col1_en: Earn one standard drink
  col1_zh: 换一杯标准饮品
  col1_zh_hk: 換一杯標準飲品
  col2_en: Progress validity
  col2_zh: 累积奖赏的有效期
  col2_zh_hk: 累積獎賞的有效期
  c11_en: 6 qualifying visits of HK$40+
  c11_zh: 6 次满 HK$40 的到店消费
  c11_zh_hk: 6 次滿 HK$40 的到店消費
  c12_en: >-
    Card: 180 days from first stamp
  c12_zh: 由首个印章起计 180 日
  c12_zh_hk: 由首個印花起計 180 日
  c21_en: 240 points; HK$1 = 1 point
  c21_zh: 240 分；每 HK$1 赚 1 分
  c21_zh_hk: 240 分；每 HK$1 賺 1 分
  c22_en: >-
    Each point: 180 days
  c22_zh: 每笔积分有效 180 日
  c22_zh_hk: 每筆積分有效 180 日
  footer_en: Voucher then valid 30 days
  footer_zh: 饮品券有效期 30 日
  footer_zh_hk: 飲品券有效期 30 日
  s1_en: >-
    Under A, a visit with at least 40 dollars of eligible food or drink earns one stamp, at most one a
    day. Six stamps earn a standard drink normally priced at 40 dollars. The card expires 180 days after
    its first stamp.
  s1_zh: >-
    方案 A：每次到店买满四十元合资格的食品或饮品，就盖一个章，每天最多一个。集满六个，可以换一杯原价四十元的标准饮品。集章卡从第一个章起计，一百八十天到期。
  s1_zh_hk: >-
    方案 A：每次到店買滿四十蚊合資格嘅食物或者飲品，就印一個印花，每日最多一個。儲夠六個，可以換一杯原價四十蚊嘅標準飲品。印花卡由第一個印花起計，一百八十日到期。
  s2_en: >-
    Under B, each dollar of eligible spending earns one point, with no daily limit, and 240 points earn
    the same drink. Each point expires 180 days after it is earned, oldest first.
  s2_zh: 方案 B：合资格消费每一元赚一分，没有每日上限，二百四十分可以换同一款饮品。每笔积分从赚到那天起计，一百八十天到期，较早的先扣。
  s2_zh_hk: 方案 B：合資格消費每一蚊賺一分，冇每日上限，二百四十分可以換同一款飲品。每筆積分由賺到嗰日起計，一百八十日到期，舊嘅先扣。
  s3_en: >-
    Either way, the drink voucher is issued at once, usable from the next visit and valid for 30 days.
    A costs 2,000 dollars to set up, and so does B.
  s3_zh: 无论哪个方案，达标后马上发饮品券，下次到店就能用，有效期三十天。两个方案的设置费都是二千元。
  s3_zh_hk: 無論邊個方案，達標之後即刻發飲品券，下次到店就用得，有效期三十日。兩個方案嘅設置費都係二千蚊。
