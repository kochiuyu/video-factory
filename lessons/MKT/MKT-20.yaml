  title_en: Points earned. Benefits understood?
  title_zh: 积了分，顾客知道怎样换奖赏吗？
  title_zh_hk: 積了分，顧客知道怎樣換獎賞嗎？
  image: art/points-earned-benefits-understood-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In February 2024, Hong Kong's Consumer Council discussed complaints about reward redemption and changing
    scheme terms, calling for clearer information. Now a fictional café is choosing a new, optional, free
    reward scheme for future members. Existing balances and rights will be honoured. Each design forecasts
    the same 6,000 dollars in actual reward cost.
  zh: >-
    二零二四年二月，香港消费者委员会谈到有关奖赏兑换和计划条款变动的投诉，呼吁提供更清楚的信息。现在，一家虚构的咖啡店，要为日后新加入的顾客选一个免费、自愿参加的奖赏计划。现有会员的结余和权利都会保留。两个方案预计的实际奖赏成本都是六千元。
  zh_hk: >-
    二零二四年二月，香港消費者委員會講到有關獎賞換領同計劃條款改動嘅投訴，呼籲提供更清楚嘅資訊。而家，一間虛構嘅咖啡店，要為日後新加入嘅顧客揀一個免費、自願參加嘅獎賞計劃。現有會員嘅結餘同權利都會保留。兩個方案預計嘅實際獎賞成本都係六千蚊。
