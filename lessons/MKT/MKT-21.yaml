  en: >-
    Would you pilot checkout-only or logged assistance? Allocate the 200 dollars for journeys A and B,
    and name one behaviour your rule might encourage or discourage. Pause and vote.
  zh: 你会试行只看结账，还是计入有记录的协助？请把 A 和 B 各自的二百元分好，再说出这个规则可能鼓励或抑制的一种行为。请暂停，投个票。
  zh_hk: 你會試行淨係睇結帳，定係計埋有紀錄嘅協助？請將 A 同 B 各自嘅二百蚊分好，再講一種呢個規則可能鼓勵或者壓抑嘅行為。暫停，投個票。
