  s1_en: >-
    The four-week pilot has a fixed 800-dollar budget across four completed, equal-price orders: 200 dollars
    per order, shared between the store team and the online team. Existing pay and agreed commissions
    stay protected.
  s1_zh: >-
    这个为期四周的试点有八百元固定预算，分给四张已完成、价格相同的订单，每张二百元，由门店团队和线上团队来分。现有薪酬和已经约定的佣金都不受影响。
  s1_zh_hk: >-
    呢個四個星期嘅試行有八百蚊固定預算，分俾四張已經完成、價錢一樣嘅訂單，每張二百蚊，由門市團隊同網上團隊去分。現有薪酬同已經講好嘅佣金都受保障。
  s2_en: >-
    Checkout-only gives the whole pot to the payment channel: simple and verifiable. Logged assistance
    splits it half and half when a verified selection consultation happened before online payment; otherwise
    it is checkout-only.
  s2_zh: >-
    第一个规则只看结账：整笔钱给付款渠道，简单，也容易核实。第二个规则看有记录的协助：如果线上付款前，门店确实提供过选购建议，两队各分一半；否则就按结账渠道分。
  s2_zh_hk: >-
    第一個規則只睇結帳：成筆錢俾付款嘅渠道，簡單，亦容易核實。第二個規則睇有紀錄嘅協助：如果網上俾錢之前，門市真係俾過選購意見，兩隊一人一半；唔係就照結帳渠道分。
  s3_en: >-
    In A, a store adviser compared chair sizes, and the customer then ordered from home. In B, the customer
    chose using website information alone. Both paid online for home delivery.
  s3_zh: A 是门店顾问帮顾客比较椅子尺寸，顾客之后回家下单。B 是顾客只看网站信息自己选。两位都是线上付款、送货上门。
  s3_zh_hk: A 係門市顧問幫顧客比較椅嘅尺寸，顧客之後返屋企落單。B 係顧客淨係睇網站資料自己揀。兩位都係網上俾錢、上門送貨。
