- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Payment is one step
  title_zh: 付款只是其中一环
  title_zh_hk: 付款只是其中一環
  step1_en: >-
    Checkout-only: A, B online HK$200 each
  step1_zh: 只看结账：A、B 都给线上 HK$200
  step1_zh_hk: 只看結帳：A、B 都給網上 HK$200
  step2_en: >-
    Assisted: A HK$100 each; B online HK$200
  step2_zh: 看协助：A 各 HK$100；B 线上 HK$200
  step2_zh_hk: 看協助：A 各 HK$100；B 網上 HK$200
  step3_en: Both rules give C and D wholly to online
  step3_zh: 两个规则都把 C、D 全给线上
  step3_zh_hk: 兩個規則都把 C、D 全給網上
  s1_en: >-
    Under checkout-only, A and B each give online 200 dollars and the store nothing. Under the assistance
    rule, A gives 100 dollars to each team, and B still gives online 200. Either way, these two orders
    total 400 dollars.
  s1_zh: >-
    只看结账的话，A 和 B 都是线上团队拿二百元，门店一分没有。按协助规则，A 两队各拿一百元，B 仍然是线上拿二百元。无论哪个规则，这两张单合计都是四百元。
  s1_zh_hk: >-
    淨係睇結帳嘅話，A 同 B 都係網上團隊攞二百蚊，門市一蚊都冇。按協助規則，A 兩隊各攞一百蚊，B 仍然係網上攞二百蚊。無論邊個規則，呢兩張單加埋都係四百蚊。
  s2_en: >-
    Checkout-only is easy to audit, but can make useful store advice invisible. Sharing recognises that
    work, but can invite claims for minor interactions. These are incentive risks, not observed misconduct.
  s2_zh: >-
    只看结账容易核查，但有价值的门店建议可能完全体现不出来。分佣能肯定这份工作，却可能引来为很小的互动申请佣金。这些只是激励上的风险，不是已经观察到的不当行为。
  s2_zh_hk: >-
    淨係睇結帳容易核查，但有價值嘅門市意見可能完全反映唔到。分佣可以肯定呢份工作，但可能令人為咗好細嘅互動申請佣金。呢啲只係激勵上嘅風險，唔係已經見到嘅不當行為。
  s3_en: >-
    Both original rules give C and D entirely to online, because both were paid online and C's advice
    came after payment. Yet C combined online ordering with real store advice and store fulfilment.
  s3_zh: >-
    两个原来的规则，都把 C 和 D 的佣金全给线上，因为都是线上付款，而 C 的建议是付款之后才给的。可是 C 其实结合了线上下单、实质的门店建议和门店履约。
  s3_zh_hk: >-
    兩個原本嘅規則，都將 C 同 D 嘅佣金全部俾網上，因為都係網上俾錢，而 C 嘅意見係俾完錢先有。但係 C 其實結合咗網上落單、實質嘅門市意見同門市履約。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Selection, checkout, fulfilment
  title_zh: 拆开选购、结账、履约
  title_zh_hk: 拆開選購、結帳、履約
  step1_en: >-
    Points: select 40 · pay 40 · fulfil 20
  step1_zh: 100 点：选购 40 · 结账 40 · 履约 20
  step1_zh_hk: 100 點：選購 40 · 結帳 40 · 履約 20
  step2_en: A 80/120 · B 0/200 · C 120/80 · D 40/160
  step2_zh: A 80/120 · B 0/200 · C 120/80 · D 40/160
  step2_zh_hk: A 80/120 · B 0/200 · C 120/80 · D 40/160
  step3_en: Store HK$240 · online HK$560 = HK$800
  step3_zh: 门店 HK$240 · 线上 HK$560 · 合计 HK$800
  step3_zh_hk: 門市 HK$240 · 網上 HK$560 · 合計 HK$800
  s1_en: >-
    One defensible pilot gives each order 100 points: 40 for selection support, 40 for checkout, 20 for
    fulfilment. The store earns selection points only for a verified, order-linked consultation, before
    or after payment.
  s1_zh: >-
    一个说得通的试点做法，是每张订单分一百点：选购协助四十点，结账四十点，履约二十点。只有经过核实、和订单挂钩的咨询，门店才拿选购点，付款前后都算。
  s1_zh_hk: >-
    一個講得通嘅試行做法，係每張訂單分一百點：選購協助四十點，結帳四十點，履約二十點。只有核實過、同訂單掛鈎嘅諮詢，門市先攞選購點，俾錢之前之後都計。
  s2_en: >-
    Each point is worth 2 dollars. Store and online receive 80 and 120 dollars for A, nothing and 200
    for B, 120 and 80 for C, and 40 and 160 for D.
  s2_zh: 每点值二元。门店和线上分别拿：A 八十元和一百二十元，B 零元和二百元，C 一百二十元和八十元，D 四十元和一百六十元。
  s2_zh_hk: 每點值兩蚊。門市同網上分別攞：A 八十蚊同一百二十蚊，B 零蚊同二百蚊，C 一百二十蚊同八十蚊，D 四十蚊同一百六十蚊。
  s3_en: >-
    In total, the store gets 240 dollars and online 560, which is still 800. These are chosen policy weights,
    not measured causal shares; another coherent set can be defended.
  s3_zh: 合计门店二百四十元，线上五百六十元，加起来仍是八百元。这些是政策上选定的权重，不是量出来的因果份额；其他有道理的比例也说得通。
  s3_zh_hk: 合共門市二百四十蚊，網上五百六十蚊，加埋仍然係八百蚊。呢啲係政策上揀嘅權重，唔係量度出嚟嘅因果份額；其他有道理嘅比例都講得通。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Cooperation over credit claims
  title_zh: 让合作比争功容易
  title_zh_hk: 讓合作比爭功容易
  en: >-
    Use one order ID and at most one selection-support claim, backed by a short record of the customer's
    question and the comparison given. Cancelling and repurchasing creates no new pot. Moving commission
    between teams creates no customer value by itself, so also watch redirection, waiting time and total
    retailer contribution.
  zh: >-
    每张单只用一个订单编号，最多申请一次选购协助，并用简短记录写明顾客问了什么、门店给了什么比较。取消再下单，不会多出一笔佣金。佣金在两队之间挪来挪去，本身不会增加顾客价值，所以还要留意渠道被改变、等候时间和零售商的整体贡献。
  zh_hk: >-
    每張單只用一個訂單編號，最多申請一次選購協助，仲要有簡短紀錄，寫低顧客問咗乜、門市俾咗乜嘢比較。取消再落單，唔會多一筆佣金。佣金喺兩隊之間搬嚟搬去，本身唔會增加顧客價值，所以仲要留意渠道有冇被改、等候時間同零售商嘅整體貢獻。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Reward the work, not the till
  title_zh: 按工作分，不只看结账
  title_zh_hk: 按工作分，不只看結帳
  q1_en: >-
    Checkout-only: all four orders to online
  q1_zh: 只看结账：四张单全给线上
  q1_zh_hk: 只看結帳：四張單全給網上
  q2_en: >-
    40/40/20: store HK$240 · online HK$560
  q2_zh: 40/40/20：门店 HK$240 · 线上 HK$560
  q2_zh_hk: 40/40/20：門市 HK$240 · 網上 HK$560
  s1_en: >-
    Where the customer pays does not show where the work was done. Separate selection help, checkout and
    fulfilment, and verify each claim.
  s1_zh: 顾客在哪里付款，不代表工作在哪里完成。把选购协助、结账和履约分开，每次申请都要核实。
  s1_zh_hk: 顧客喺邊度俾錢，唔代表工作喺邊度做。將選購協助、結帳同履約分開，每次申請都要核實。
  s2_en: >-
    Four constructed records test consistency; they do not show how many sales the store caused.
  s2_zh: 这四张模拟记录只是测试规则是否一致，不能证明门店带来了多少笔交易。
  s2_zh_hk: 呢四張模擬紀錄只係測試規則係咪一致，證明唔到門市帶嚟咗幾多宗生意。
  s3_en: >-
    Desk Corner, its four orders and every commission rule are fictional, not IKEA's practices. Official
    scene art is a teaching illustration only.
  s3_zh: Desk Corner、四张订单和所有佣金规则都是虚构的，不代表宜家家居的做法。官方场景图只是教学插图。
  s3_zh_hk: Desk Corner、四張訂單同所有佣金規則都係虛構嘅，唔代表宜家家居嘅做法。官方場景圖只係教學插圖。
duration_target_s: 196
