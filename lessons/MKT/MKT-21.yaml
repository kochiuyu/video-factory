  title_zh_hk: 同一位顧客，這宗生意算誰的？
  image: art/one-customer-which-channel-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    IKEA's US service page describes ordering and paying online, then collecting at a physical location.
    The customer sees one retailer, but the journey crosses teams. Now Desk Corner, a fictional Hong Kong
    retailer, sells home-office chairs through one shop and its own website, and must design a team commission
    pilot.
  zh: >-
    宜家家居的美国服务网页介绍过，顾客可以先在网上下单付款，再到实体门店取货。顾客看到的是同一家零售商，背后却跨了不同团队。现在，一家虚构的香港零售商 Desk Corner，通过一家门店和自家网站卖家用办公椅，要设计一个团队佣金试点方案。
  zh_hk: >-
    宜家家居美國嘅服務網頁介紹過，顧客可以先喺網上落單俾錢，再去實體地點攞貨。顧客見到嘅係同一間零售商，背後就跨咗唔同團隊。而家，一間虛構嘅香港零售商 Desk Corner，經一間門市同自己個網站賣家用辦公椅，要設計一個團隊佣金試行方案。
