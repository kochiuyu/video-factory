  step1_en: >-
    C: online; advice at pickup, new size
  step1_zh: C：线上付款，取货时帮忙换尺寸
  step1_zh_hk: C：網上付款，取貨時協助換尺寸
  step2_en: >-
    D: online; collection only, no advice
  step2_zh: D：线上付款，只取货，没建议
  step2_zh_hk: D：網上付款，只取貨，沒有建議
  step3_en: >-
    Pre-payment rule: C and D don't qualify
  step3_zh: 原规则只算付款前：C、D 都不算
  step3_zh_hk: 原規則只計付款前：C、D 都不計
  s1_en: >-
    The other two orders run the other way. In C, the customer paid online for collection. At pickup,
    a store adviser compared sizes and helped choose a different size at the same price. It is still one
    order, with no extra sale.
  s1_zh: 另外两张订单方向相反。C 的顾客线上付款、到店自取。取货时，门店顾问帮他比较尺寸，换成另一个同价的尺寸。这仍然是一张订单，没有额外销售。
  s1_zh_hk: 另外兩張訂單方向相反。C 嘅顧客網上俾錢、到店自取。攞貨嗰陣，門市顧問幫佢比較尺寸，換咗另一個同價嘅尺寸。呢張仍然係一張訂單，冇額外銷售。
  s2_en: >-
    In D, the customer also paid online for collection. Store staff prepared and handed over the chosen
    chair, with no selection advice. The collection work is real, but it is not advice.
  s2_zh: D 的顾客同样线上付款、到店自取。门店员工把选好的椅子准备好交给他，没有提供选购建议。取货的工作是真的，但不算建议。
  s2_zh_hk: D 嘅顧客一樣係網上俾錢、到店自取。門市員工將揀好嘅椅準備好交俾佢，冇俾選購意見。攞貨嘅工作係真嘅，但唔算意見。
  s3_en: >-
    The initial logged-assistance rule recognises advice only before payment, so neither C nor D qualifies
    for its split.
  s3_zh: 原来那个按协助分佣的规则，只算付款前的建议，所以 C 和 D 都不符合分佣条件。
  s3_zh_hk: 原本嗰個按協助分佣嘅規則，淨係計俾錢之前嘅意見，所以 C 同 D 都唔符合分佣條件。
