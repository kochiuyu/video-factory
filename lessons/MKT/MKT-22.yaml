  kicker_zh_hk: MKT-22
  title_en: The last click. The whole contribution?
  title_zh: 最后一次点击，就代表全部贡献吗？
  title_zh_hk: 最後一次點擊，就代表全部貢獻嗎？
  image: art/last-click-whole-contribution-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Google's Analytics documentation describes attribution as assigning credit along a recorded customer
    path, and separately describes conversion lift as additional conversions estimated through a controlled
    comparison. Now you manage campaign reporting for a fictional Hong Kong online shop selling plant
    pots.
  zh: >-
    Google 的分析工具文档把归因说成：沿着顾客有记录的路径分配功劳；另外又把转化提升说成：通过对照比较估算出来的额外转化。这是两种不同的衡量。现在，你负责一家虚构的香港网店的广告报表，这家店卖花盆。
  zh_hk: >-
    Google 嘅分析工具文件將歸因講成：沿住顧客有紀錄嘅路徑分功勞；另外又將轉換提升講成：用對照比較估計出嚟嘅額外轉換。呢個係兩種唔同嘅量度。而家，你負責一間虛構嘅香港網店嘅廣告報表，間舖賣花盆。
