  kicker: MKT-23
  kicker_en: MKT-23
  kicker_zh: MKT-23
  kicker_zh_hk: MKT-23
  title_en: Better taste. Or a different expectation?
  title_zh: 是真的更好喝，还是期望不同？
  title_zh_hk: 是真的更好喝，還是期望不同？
  image: art/better-taste-different-expectation-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Published experiments have asked whether information given before tasting can change reported preference:
    Lee, Frederick and Ariely with beer, and Plassmann and colleagues with wine prices. Now you lead positioning
    for a fictional Hong Kong maker of a non-alcoholic sparkling drink, A, against a competing drink,
    B.
  zh: >-
    已发表的实验研究过，品尝前知道的信息，会不会改变人们说出来的偏好：Lee、Frederick 和 Ariely 用的是啤酒，Plassmann 等人研究的是葡萄酒的价格。现在，你负责一家虚构的香港饮品商的市场定位，A
    是自家的无酒精气泡饮品，B 是同类的竞争产品。
  zh_hk: >-
    已經發表嘅實驗研究過，試飲之前知道嘅資料，會唔會改變人哋講出嚟嘅偏好：Lee、Frederick 同 Ariely 用嘅係啤酒，Plassmann 等人研究嘅係葡萄酒價錢。而家，你負責一間虛構嘅香港飲品商嘅市場定位，A
    係自家嘅無酒精有氣飲品，B 係同類嘅競爭產品。
- id: ledger
  visual: table_grid
  seconds: 26
  rows: 2
  cols: 2
  kicker: Figures
  kicker_en: Figures
  kicker_zh: 数字
  kicker_zh_hk: 數字
  title_en: Two tasting sessions
  title_zh: 两场试饮
  title_zh_hk: 兩場試飲
  row1_en: Codes only, 60 people
  row1_zh: 只显示编码，60 人
  row1_zh_hk: 只顯示編碼，60 人
  row2_en: Brands shown, 60 people
  row2_zh: 显示品牌，60 人
  row2_zh_hk: 顯示品牌，60 人
  col1_en: Prefer A
  col1_zh: 较喜欢 A
  col1_zh_hk: 較喜歡 A
  col2_en: Prefer B
  col2_zh: 较喜欢 B
  col2_zh_hk: 較喜歡 B
  c11: '36'
  c12: '24'
  c21: '24'
  c22: '36'
  footer_en: Same recipes in both sessions
  footer_zh: 两场配方都没改
  footer_zh_hk: 兩場配方都沒改
  s1_en: >-
    Neither recipe changed between two small sessions. In each, 60 people tasted both drinks and picked
    the one they preferred. The first session hid brands behind codes; the second showed the actual brands.
  s1_zh: 两场小型试饮之间，两款配方都没有改。每场有六十人两款都试，选出自己比较喜欢的一款。第一场用编码遮住品牌，第二场显示真实品牌。
  s1_zh_hk: 兩場小型試飲之間，兩款配方都冇改過。每場有六十人兩款都試，揀出自己較鍾意嗰款。第一場用編碼遮住品牌，第二場就顯示真實品牌。
  s2_en: >-
    With codes, 36 preferred A and 24 B. With brands shown, it was 24 for A and 36 for B. The summaries
    do not yet say how people were recruited or how samples were served.
  s2_zh: >-
    只看编码时，三十六人较喜欢 A，二十四人较喜欢 B。显示品牌后，变成 A 二十四人、B 三十六人。摘要还没说明参加者怎么招募，样本又是怎么提供的。
  s2_zh_hk: >-
    淨係睇編碼嗰陣，三十六人較鍾意 A，二十四人較鍾意 B。顯示品牌之後，變成 A 二十四人、B 三十六人。摘要仲未講參加者點樣招募，樣本又係點樣提供。
  s3_en: >-
    Someone suggests that A's brand is holding back a better-tasting product. You are choosing a provisional
    brief: a taste-discovery sampling route, or a factual product-story route, or deferring for one more
    test.
  s3_zh: >-
    有人推测 A 本来更好喝，只是现在的品牌拖累了它。你要定的是初步的宣传方向：邀请顾客亲身试饮，或者如实讲产品的风味和成分，也可以再测试一次才决定。
  s3_zh_hk: >-
    有人估 A 本身好飲啲，只係而家個品牌拖累咗佢。你要定嘅係初步宣傳方向：邀請顧客親身試飲，或者如實講產品嘅風味同成分，又或者再測試多一次先決定。
