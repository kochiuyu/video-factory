  title_en: Which message now?
  title_zh: 现在优先哪个信息？
  title_zh_hk: 現在優先哪個訊息？
  en: >-
    After the interviews, which message would you prioritise? Separate people who knew but did not consider
    the model from those who considered and rejected it, and name a measure that tests your diagnosis
    without forecasting sales. Pause and vote.
  zh: >-
    听完访谈，你会优先哪一个宣传信息？请把知道却没考虑这款的人，和考虑过却没选它的人分开，再提出一个能检验你判断的指标，而不是用这些人数去预测销量。请暂停，投个票。
  zh_hk: >-
    聽完訪談，你會優先邊個宣傳訊息？請將知道但冇考慮呢款嘅人，同考慮過但冇揀佢嘅人分開，再提出一個可以檢驗你判斷嘅指標，而唔係用呢啲人數去預測銷量。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Keep the denominator attached
  title_zh: 别丢掉分母
  title_zh_hk: 別丟掉分母
  step1_en: 30 ÷ 40 = 75%, with everyone shown it
  step1_zh: 30 ÷ 40 = 75%：人人都看到了
  step1_zh_hk: 30 ÷ 40 = 75%：人人都看到了
  step2_en: >-
    Knew it: 60 + 20 = 80 of 100
  step2_zh: 知道这款：60 + 20 = 80 人
  step2_zh_hk: 知道這款：60 + 20 = 80 人
  step3_en: >-
    8 of 20 considerers = 40%: no forecast
  step3_zh: 考虑过的 20 人中 8 人 = 40%，不是预测
  step3_zh_hk: 考慮過的 20 人中 8 人 = 40%，不是預測
  s1_en: >-
    Thirty of 40 is 75 percent in a task where everyone was shown all three models. It describes prompted
    preference, not spontaneous recall, market share or purchase conversion.
  s1_zh: 四十人里三十人，是百分之七十五，但那是人人都看到三款的情况下。它说的是被提示后的偏好，不是自己想起、不是市场份额，也不是购买转化率。
  s1_zh_hk: 四十人入面三十人，係百分之七十五，但嗰個係個個都睇到三款嘅情況。佢講嘅係有提示之後嘅偏好，唔係自己諗起、唔係市場佔有率，亦唔係購買轉換率。
  s2_en: >-
    In the interviews, 80 of 100 already knew the model: 60 did not think of it, and 20 considered it.
    Do not add the 80 and the 20 as different people, or join this sample to the 40.
  s2_zh: 访谈里，一百人中有八十人本来知道这款：六十人没想起，二十人考虑过。不要把八十和二十当成不同的人加起来，也不要把这批人和那四十人拼在一起。
  s2_zh_hk: 訪談入面，一百人有八十人本身知道呢款：六十人冇諗起，二十人考慮過。唔好將八十同二十當係唔同嘅人加埋，亦唔好將呢批人同嗰四十人砌埋一齊。
  s3_en: >-
    Eight of the twenty considerers is 40 percent. That is not a causal conversion rate or a stable forecast.
  s3_zh: 考虑过的二十人中有八人买了，是百分之四十。这不是因果上的转化率，也不是稳定的预测。
  s3_zh_hk: 考慮過嘅二十人入面有八個買咗，係百分之四十。呢個唔係因果上嘅轉換率，亦唔係穩定嘅預測。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Target the missing step
  title_zh: 针对没走到的那一步
  title_zh_hk: 針對沒走到的那一步
  step1_en: >-
    Occasion: 60 knew it but did not recall
  step1_zh: 情境：60 人知道却没想起
  step1_zh_hk: 情境：60 人知道卻沒想起
  step2_en: >-
    Features: helps comparison, not entry
  step2_zh: 特点：帮比较，不帮入围
  step2_zh_hk: 特點：幫比較，不幫入圍
  step3_en: Some simply prefer another umbrella
  step3_zh: 有人确实更喜欢别款
  step3_zh_hk: 有人確實更喜歡別款
  s1_en: >-
    Occasion is a defensible first priority, because the largest group knew the model without recalling
    it for the relevant trip. Linking the model, the shop and that occasion addresses this hypothesis.
  s1_zh: 购买情境可以说是站得住的第一优先，因为人数最多的一组本来知道这款，那次却没想起它。把伞款、店铺和那个情境连起来，正好针对这个假设。
  s1_zh_hk: 購買情境可以話係企得住腳嘅第一優先，因為人數最多嗰組本身知道呢款，嗰次就冇諗起佢。將遮款、間舖同嗰個情境連埋，啱啱針對呢個假設。
  s2_en: >-
    Features addresses understanding and appeal during comparison. It may be sensible if that is the chosen
    priority, but on its own it does not show that absent options will enter shortlists.
  s2_zh: 产品特点处理的是比较时的理解和吸引力。如果把它定为优先也说得通，但单靠它，证明不了原本没入围的选项会进入考虑名单。
  s2_zh_hk: 產品特點處理嘅係比較時嘅理解同吸引力。如果定佢做優先都講得通，但單靠佢，證明唔到原本冇入圍嘅選項會入到考慮名單。
  s3_en: >-
    This does not mean people forgot because the brand was bad, or that every non-buyer should be persuaded.
    The 20 unfamiliar people may need basic awareness.
  s3_zh: 这不代表大家没想起是因为品牌不好，也不代表每个没买的人都该被说服。那二十个没听过的人，可能先要知道有这个品牌。
  s3_zh_hk: 咁唔代表大家冇諗起係因為個牌唔好，亦唔代表每個冇買嘅人都應該被說服。嗰二十個冇聽過嘅人，可能要先知道有呢個牌子。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Measure without prompting
  title_zh: 评估时别先提示答案
  title_zh_hk: 評估時別先提示答案
  en: >-
    For an occasion-focused evaluation, ask a fresh consenting sample the same unprompted question before
    showing model names, and record spontaneous recall and serious consideration separately from aided
    recognition. A comparison group would strengthen causal reading, and actual wanted purchases and costs
    must be tracked separately.
  zh: >-
    如果评估购买情境方案，就找一批新的、同意参与的人，先问同一个不带提示的问题，之后才出示款式名称。自己想起、认真考虑和被提示后认得，要分开记录。有对照组，因果解读会更可靠；实际自愿的购买和成本，也要另外追踪。
  zh_hk: >-
    如果評估購買情境方案，就搵一批新嘅、同意參與嘅人，先問同一條冇提示嘅問題，之後先俾佢哋睇款式名。自己諗起、認真考慮同提示後認得，要分開記錄。有對照組，因果解讀會可靠啲；實際自願嘅購買同成本，都要另外追蹤。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Liked is not shortlisted
  title_zh: 喜欢不等于入围
  title_zh_hk: 喜歡不等於入圍
  q1_en: >-
    Prompted favourite: 30 of 40 = 75%
  q1_zh: 提示下最喜欢：30/40 = 75%
  q1_zh_hk: 提示下最喜歡：30/40 = 75%
  q2_en: >-
    Knew but did not recall it: 60 of 100
  q2_zh: 知道却没想起：100 人中 60 人
  q2_zh_hk: 知道卻沒想起：100 人中 60 人
  s1_en: >-
    A product can win a prompted comparison and still be missing when buyers make their own shortlist.
    Find the missing step before choosing the message.
  s1_zh: 一款产品在提示下能胜出，顾客自己列考虑名单时却可能想不起它。先找出缺了哪一步，再决定宣传什么。
  s1_zh_hk: 一款產品喺有提示嘅比較可以贏，但顧客自己列考慮名單嗰陣就可能諗唔起佢。先搵出缺咗邊一步，再決定宣傳乜。
  s2_en: Neither count forecasts sales; both describe convenience samples.
  s2_zh: 两组人数都不能预测销量，它们都来自便利样本。
  s2_zh_hk: 兩組人數都唔可以預測銷量，佢哋都係嚟自方便樣本。
  s3_en: >-
    The specialist umbrella retailer and all results are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 雨伞专卖店和所有结果都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 雨遮專門店同所有結果都係虛構嘅。官方場景圖只係教學插圖。
