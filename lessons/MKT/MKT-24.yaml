  s1_en: >-
    In a paid prototype comparison, 40 adult volunteers saw this model and two alternatives, with names,
    accurate prices and features visible. Thirty chose the retailer's model as their favourite. No one
    purchased, and the sample was recruited for convenience.
  s1_zh: >-
    在一次有报酬的原型比较中，四十位成年志愿者看了这款伞和另外两款，名称、真实价格和特点都看得到。三十人把店里这款选为最喜欢。没有人真的购买，参加者也只是便利抽样找来的。
  s1_zh_hk: >-
    喺一次有酬勞嘅原型比較入面，四十個成年義工睇咗呢款遮同另外兩款，名、真實價錢同特點都睇得到。三十人揀咗店舖呢款做最鍾意。冇人真係買，參加者都只係方便招募返嚟。
  s2_en: >-
    The retailer has 12,000 dollars for one complete four-week pilot. Features emphasises verified comparisons
    of folded size and the opening mechanism.
  s2_zh: 店方有一万二千元，可以做一个完整的四周宣传试验。产品特点方案强调经过查证的比较：折叠后的尺寸，以及开伞的结构。
  s2_zh_hk: 店舖有一萬二千蚊，可以做一個完整嘅四星期宣傳試驗。產品特點方案著重經查證嘅比較：摺埋之後嘅尺寸，同開遮嘅結構。
  s3_en: >-
    Occasion connects the model and the shop with packing a bag for a rainy commute, showing the same
    truthful product and price. Neither invents weather urgency, and neither supplier promises extra purchases.
  s3_zh: >-
    购买情境方案，把这款伞和店铺，跟雨天通勤前收拾随身包连在一起，展示的是同一款商品和真实价格。两个方案都不制造天气的紧迫感，供应商也都不保证会多卖。
  s3_zh_hk: 購買情境方案，將呢款遮同間舖，同落雨天返工前執袋連埋一齊，展示嘅係同一款貨同真實價錢。兩個方案都唔會扮天氣好急，供應商亦都唔保證會多賣。
