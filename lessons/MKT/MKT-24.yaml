  title_en: Preferred when compared. Never on the shortlist?
  title_zh: 比过才知道喜欢，却从未列入考虑？
  title_zh_hk: 比過才知道喜歡，卻從未列入考慮？
  image: art/preferred-compared-never-shortlist-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Consumer-choice research separates the options people seriously consider from the one they prefer
    within that set, and brand tracking separates having heard of a brand, considering it and intending
    to buy. Now a fictional Hong Kong specialist retailer sells its own-label folding umbrella for everyday
    commuting.
  zh: >-
    消费者选择的研究，会把顾客认真考虑的选项，和他们在其中最喜欢的那个分开来看；品牌追踪也会分开看：有没有听过、有没有考虑、有没有购买意向。现在，一家虚构的香港雨伞专卖店，卖自有品牌的折叠伞，适合日常通勤。
  zh_hk: >-
    消費者選擇嘅研究，會將顧客認真考慮過嘅選項，同佢哋喺入面最鍾意嗰個分開嚟睇；品牌追蹤亦會分開睇：有冇聽過、有冇考慮、有冇打算買。而家，一間虛構嘅香港雨遮專門店，賣自家牌子嘅摺遮，啱日常返工放工用。
