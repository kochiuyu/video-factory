  en: >-
    Would you fund the feature-comparison message or the purchase-occasion message first? Explain what
    the 30-of-40 result tells you, and what you still need to know about getting onto buyers' shortlists.
    Pause and vote.
  zh: 你会先拨款做产品特点比较，还是购买情境？四十人里有三十人最喜欢这款，这说明了什么？要进入顾客的考虑名单，你还需要知道什么？请暂停，投个票。
  zh_hk: 你會先撥款做產品特點比較，定係購買情境？四十人入面有三十人最鍾意呢款，咁講明咗啲乜？要入到顧客嘅考慮名單，你仲需要知道乜嘢？暫停，投個票。
