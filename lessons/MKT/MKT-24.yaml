  title_en: 100 recent buyers, unprompted
  title_zh: 100 位近期买家的自述
  title_zh_hk: 100 位近期買家的自述
  step1_en: >-
    Had not heard of the model: 20
  step1_zh: 之前没听过这款：20 人
  step1_zh_hk: 之前沒聽過這款：20 人
  step2_en: >-
    Knew it, but it did not come to mind: 60
  step2_zh: 知道这款，当时没想起：60 人
  step2_zh_hk: 知道這款，當時沒想起：60 人
  step3_en: >-
    Considered: 8 bought · 12 chose another
  step3_zh: 考虑过：8 人买了 · 12 人选别款
  step3_zh_hk: 考慮過：8 人買了 · 12 人選別款
  s1_en: >-
    A separate interview recruits 100 adults who recently bought a folding umbrella for commuting. Before
    any brand names are shown, they describe the occasion, the models that came to mind and those seriously
    considered. Twenty had not heard of the model before that trip.
  s1_zh: >-
    另一项访谈找了一百位最近为通勤买过折叠伞的成年人。在出示任何品牌之前，先请他们讲当时的购买情境、想起了哪些款式、认真考虑过哪些。其中二十人，那次之前根本没听过这款。
  s1_zh_hk: >-
    另一項訪談搵咗一百個最近為返工買過摺遮嘅成年人。喺俾佢哋睇任何牌子之前，先請佢哋講當時嘅購買情況、諗起邊幾款、認真考慮過邊幾款。其中二十人，嗰次之前根本冇聽過呢款。
  s2_en: >-
    Sixty knew the model, but it did not come to mind for that trip, and they did not compare it. Their
    later recognition does not show they would have preferred or bought it if reminded.
  s2_zh: 六十人本来知道这款，但那次购物没想起来，也没拿它来比较。他们后来认得出，不代表有人提醒，就会更喜欢或者买下。
  s2_zh_hk: 六十人本身知道呢款，但嗰次買嘢冇諗起，亦冇攞佢嚟比較。佢哋後尾認得，唔代表有人提醒，就會更鍾意或者買。
  s3_en: >-
    Twenty considered it: eight bought it, and twelve chose another model that suited their preferred
    folded size or opening feel. These are retrospective self-reports from a convenience sample.
  s3_zh: 二十人考虑过：八人买了；十二人选了别款，因为别款的折叠尺寸或开伞手感更合心意。这些都是便利样本事后的自述。
  s3_zh_hk: 二十人考慮過：八個買咗；十二個揀咗第二款，因為嗰款摺埋嘅尺寸或者開遮手感更啱心水。呢啲都係方便樣本事後嘅自述。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
