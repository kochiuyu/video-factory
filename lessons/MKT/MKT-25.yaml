  title_en: Which schedule now?
  title_zh: 现在选哪个排期？
  title_zh_hk: 現在選哪個排期？
  en: >-
    With the booking-window evidence, which schedule would you choose under the supplied model? Calculate
    visibility at decision time, and explain why that score is neither a count of new customers nor a
    sales forecast. Pause and vote.
  zh: >-
    有了顾客考虑预订的时间，按题目给的模型，你会选哪个排期？请算出做决定时的可见度，再解释为什么这个分数既不是新增顾客人数，也不是销售预测。请暂停，投个票。
  zh_hk: >-
    有咗顧客考慮預訂嘅時間，按題目俾嘅模型，你會揀邊個排期？請計出作決定嗰陣嘅可見度，再解釋點解呢個分數唔係新增顧客人數，亦唔係銷售預測。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Build the profiles first
  title_zh: 先算出四周分数
  title_zh_hk: 先算出四周分數
  step1_en: >-
    Steady: 20 · 30 · 35 · 37.5
  step1_zh: 均匀：20 · 30 · 35 · 37.5
  step1_zh_hk: 均勻：20 · 30 · 35 · 37.5
  step2_en: >-
    Bursts: 40 · 20 · 50 · 25
  step2_zh: 集中：40 · 20 · 50 · 25
  step2_zh_hk: 集中：40 · 20 · 50 · 25
  step3_en: >-
    Equal weights: 30.625 vs 33.75
  step3_zh: 等权平均：30.625 对 33.75
  step3_zh_hk: 等權平均：30.625 對 33.75
  s1_en: >-
    Steady scores 20, 30, 35 and 37.5. For example, week 3 is half of 30, plus 20.
  s1_zh: 均匀投放的分数是二十、三十、三十五和三十七点五。比如第三周，就是三十的一半，再加二十。
  s1_zh_hk: 均勻投放嘅分數係二十、三十、三十五同三十七點五。例如第三個星期，就係三十嘅一半，再加二十。
  s2_en: >-
    Bursts scores 40, 20, 50 and 25. Week 3 is half of 20, plus 40. Both buy eight blocks; only timing
    and the assumed carryover differ.
  s2_zh: 集中投放是四十、二十、五十和二十五。第三周是二十的一半，再加四十。两个方案都买八个单位，差别只在时机和假设的延续效果。
  s2_zh_hk: 集中投放係四十、二十、五十同二十五。第三個星期係二十嘅一半，再加四十。兩個方案都買八個單位，分別只喺時機同假設嘅延續效果。
  s3_en: >-
    With equal weights, Steady averages 30.625 and Bursts 33.75. That favours Bursts for an equally weighted
    calendar, but not automatically for the studio's real objective.
  s3_zh: 如果四周等权，均匀投放平均三十点六二五，集中投放三十三点七五。等权的话是集中投放占优，但这不一定符合工作室真正的目标。
  s3_zh_hk: 如果四個星期同等計，均勻投放平均三十點六二五，集中投放三十三點七五。同等計嘅話係集中投放佔優，但唔一定符合工作室真正嘅目標。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Weight the moments that matter
  title_zh: 按决定时机加权
  title_zh_hk: 按決定時機加權
  step1_en: >-
    Steady: (200+1,200+350+1,500)÷100 = 32.5
  step1_zh: 均匀：(200 + 1,200 + 350 + 1,500) ÷ 100 = 32.5
  step1_zh_hk: 均勻：(200 + 1,200 + 350 + 1,500) ÷ 100 = 32.5
  step2_en: >-
    Bursts: (400+800+500+1,000)÷100 = 27
  step2_zh: 集中：(400 + 800 + 500 + 1,000) ÷ 100 = 27
  step2_zh_hk: 集中：(400 + 800 + 500 + 1,000) ÷ 100 = 27
  step3_en: 32.5 is not 32.5 people, % or bookings
  step3_zh: 32.5 不是人数、百分比或预订
  step3_zh_hk: 32.5 不是人數、百分比或預訂
  s1_en: >-
    Weighted by decisions, Steady is 10 times 20, plus 40 times 30, plus 10 times 35, plus 40 times 37.5,
    all divided by 100: 32.5.
  s1_zh: 按做决定的组数加权，均匀投放是十乘二十，加四十乘三十，加十乘三十五，加四十乘三十七点五，再除以一百，等于三十二点五。
  s1_zh_hk: 按作決定嘅組數加權，均勻投放係十乘二十，加四十乘三十，加十乘三十五，加四十乘三十七點五，再除一百，等於三十二點五。
  s2_en: >-
    Bursts gives 10 times 40, plus 40 times 20, plus 10 times 50, plus 40 times 25, over 100: 27. Its
    big peaks fall in weeks with only ten groups, so Steady leads by 5.5 points.
  s2_zh: >-
    集中投放是十乘四十，加四十乘二十，加十乘五十，加四十乘二十五，再除以一百，等于二十七。它的高峰正好落在只有十组的那两周，所以均匀投放领先五点五点。
  s2_zh_hk: >-
    集中投放係十乘四十，加四十乘二十，加十乘五十，加四十乘二十五，再除一百，等於二十七。佢嘅高峰啱啱落喺得十組嗰兩個星期，所以均勻投放領先五點五點。
  s3_en: >-
    A score of 32.5 is not 32.5 people, a 32.5 percent awareness rate or 32.5 bookings. With no link to
    purchase, revenue, profit and acquisition cost cannot be calculated.
  s3_zh: >-
    三十二点五分，不是三十二点五人、不是百分之三十二点五的知名度，也不是三十二点五个预订。分数和购买没有关联，所以收入、利润和获客成本都算不出来。
  s3_zh_hk: 三十二點五分，唔係三十二點五個人、唔係百分之三十二點五嘅知名度，亦唔係三十二點五個預訂。分數同購買冇關聯，所以收入、利潤同搵客成本都計唔到。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Test the assumption
  title_zh: 验证假设，别迷信排期
  title_zh_hk: 驗證假設，別迷信排期
  en: >-
    As a sensitivity check only: if all prior score carried over instead of half, Steady would score 20,
    40, 60 and 80, Bursts 40, 40, 80 and 80. With the same weights that gives 56 against 60, reversing
    the ranking. So the carryover assumption needs evidence, and the objective must be named before comparing
    packages.
  zh: >-
    只是做个敏感度测试：如果上周的分数全部留下来，而不是一半，均匀投放会是二十、四十、六十、八十；集中投放是四十、四十、八十、八十。用同样的权重，就是五十六对六十，排名倒过来了。所以延续效果的假设需要证据，比较方案之前也要先讲清楚目标。
  zh_hk: >-
    只係做個敏感度測試：如果上個星期嘅分數全部留低，而唔係一半，均勻投放會係二十、四十、六十、八十；集中投放係四十、四十、八十、八十。用同樣嘅權重，就係五十六對六十，排名倒轉咗。所以延續效果嘅假設需要證據，比較方案之前亦要先講清楚目標。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Be present when they decide
  title_zh: 在顾客做决定时出现
  title_zh_hk: 在顧客作決定時出現
  q1_en: >-
    Decision-weighted: Steady 32.5 · Bursts 27
  q1_zh: 按决定加权：均匀 32.5 · 集中 27
  q1_zh_hk: 按決定加權：均勻 32.5 · 集中 27
  q2_en: >-
    Full carryover: 56 vs 60, reversed
  q2_zh: 全数延续：56 对 60，排名倒转
  q2_zh_hk: 全數延續：56 對 60，排名倒轉
  s1_en: >-
    Equal spend does not mean equal timing. Match the schedule to when customers decide, under a model
    you have stated and can test.
  s1_zh: 预算一样，时机不一定一样。排期要配合顾客做决定的时间，而且用的模型要讲清楚、能验证。
  s1_zh_hk: 預算一樣，時機唔一定一樣。排期要配合顧客作決定嘅時間，而且用嘅模型要講清楚、可以驗證。
  s2_en: >-
    Do not silently switch between the highest peak, the equal-week average and the decision-weighted
    score.
  s2_zh: 不要在最高峰值、等权平均和按决定加权的分数之间悄悄换来换去。
  s2_zh_hk: 唔好喺最高峰值、同等平均同按決定加權嘅分數之間靜靜雞換嚟換去。
  s3_en: >-
    The studio, its packages and the visibility model are invented for this exercise. Official scene art
    is a teaching illustration only.
  s3_zh: 摄影工作室、投放方案和可见度模型都是为这道题虚构的。官方场景图只是教学插图。
  s3_zh_hk: 攝影工作室、投放方案同可見度模型都係為呢條題目虛構嘅。官方場景圖只係教學插圖。
