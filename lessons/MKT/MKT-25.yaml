title_en: Advertise every week. Or be present at the moment?
title_zh: 每周都投放广告，还是等顾客要预订时才出现？
title_zh_hk: 每周都投放廣告，還是等顧客要預訂時才出現？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-25
  kicker_en: MKT-25
  kicker_zh: MKT-25
  kicker_zh_hk: MKT-25
  title_en: Advertise every week. Or be present at the moment?
  title_zh: 每周都投放广告，还是等顾客要预订时才出现？
  title_zh_hk: 每周都投放廣告，還是等顧客要預訂時才出現？
  image: art/every-week-present-moment-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Media-scheduling research treats advertising effects as something that can persist and change over
    time, so a large peak need not fit the moments when customers choose. Now a fictional Hong Kong event-photography
    studio is buying a four-week campaign before its seasonal booking period.
  zh: >-
    媒体排期的研究认为，广告的影响会延续一段时间，也会随时间变化。所以，广告一时特别显眼，未必正好碰上顾客做选择的时候。现在，一家虚构的香港活动摄影工作室，要在预订旺季前，买一个为期四周的广告宣传。
  zh_hk: >-
    媒體排期嘅研究認為，廣告嘅影響會延續一段時間，亦會隨時間變。所以，廣告一時特別搶眼，未必啱啱撞正顧客揀嘅時候。而家，一間虛構嘅香港活動攝影工作室，要喺預訂旺季之前，買一個四個星期嘅廣告宣傳。
