  title_en: Steady or two bursts?
  title_zh: 均匀还是集中？
  title_zh_hk: 均勻還是集中？
  en: >-
    Would you provisionally choose steady advertising or two bursts? Compare their four-week visibility
    profiles, and say what you still need to know about when customers decide. Pause and vote.
  zh: 你暂时会选均匀投放，还是分两次集中投放？比较一下两者四周的可见度变化，再说说你还需要知道顾客什么时候做决定。请暂停，投个票。
  zh_hk: 你暫時會揀均勻投放，定係分兩次集中投放？比較吓兩個方案四個星期嘅可見度變化，再講吓你仲要知道顧客幾時決定。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: When 100 groups decide
  title_zh: 100 组顾客何时决定
  title_zh_hk: 100 組顧客何時決定
  step1_en: >-
    Week 1: 10 · week 2: 40
  step1_zh: 第 1 周：10 组 · 第 2 周：40 组
  step1_zh_hk: 第 1 周：10 組 · 第 2 周：40 組
  step2_en: >-
    Week 3: 10 · week 4: 40
  step2_zh: 第 3 周：10 组 · 第 4 周：40 组
  step2_zh_hk: 第 3 周：10 組 · 第 4 周：40 組
  step3_en: >-
    Goal: average score at decision time
  step3_zh: 目标：做决定时的平均分
  step3_zh_hk: 目標：作決定時的平均分
  s1_en: >-
    The planning team checks the decision calendar for 100 distinct prospective client groups. Ten will
    consider booking at the end of week 1, and 40 at the end of week 2.
  s1_zh: 策划团队查清了一百组互不重复的潜在顾客，各自什么时候考虑预订：第一周末有十组，第二周末有四十组。
  s1_zh_hk: 策劃團隊查清咗一百組唔重複嘅潛在顧客，各自幾時考慮預訂：第一個星期尾有十組，第二個星期尾有四十組。
  s2_en: >-
    Ten more decide at the end of week 3, and 40 at the end of week 4. Each group appears once. These
    are timing inputs, not 100 confirmed customers.
  s2_zh: 第三周末再有十组，第四周末有四十组。每组只算一次。这些只是时间上的资料，不代表已经有一百组顾客。
  s2_zh_hk: 第三個星期尾再有十組，第四個星期尾有四十組。每組只計一次。呢啲只係時間上嘅資料，唔代表已經有一百組顧客。
  s3_en: >-
    The agreed objective is now the average visibility at these windows: multiply each weekly score by
    the groups deciding then, add, and divide by 100. There is no conversion rate, margin or causal response.
  s3_zh: 现在大家同意的目标，是顾客做决定时的平均可见度：每周分数乘以那周做决定的组数，加起来再除以一百。题目没有提供转化率、利润率或因果效果。
  s3_zh_hk: 而家大家同意嘅目標，係顧客作決定嗰陣嘅平均可見度：每個星期嘅分數乘嗰個星期作決定嘅組數，加埋再除一百。題目冇提供轉換率、利潤率或者因果效果。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
