  s1_en: >-
    The studio has 8,000 dollars for eight identical media blocks at 1,000 dollars each. Steady buys two
    blocks every week. Bursts buys four in week 1 and four in week 3. Price, capacity, creative and audience
    stay fixed.
  s1_zh: >-
    工作室有八千元，可以买八个相同的投放单位，每个一千元。均匀投放是每周买两个；集中投放是第一周和第三周各买四个。价格、接单能力、广告创意和受众都不变。
  s1_zh_hk: >-
    工作室有八千蚊，可以買八個一樣嘅投放單位，每個一千蚊。均勻投放係每個星期買兩個；集中投放係第一同第三個星期各買四個。價錢、接單能力、廣告創意同受眾都唔變。
  s2_en: >-
    For this exercise only, a visibility index starts at zero. Each block adds 10 points in its week,
    and half of last week's score carries over. So this week's score is half of last week's, plus 10 times
    this week's blocks.
  s2_zh: >-
    只就这道题来说，有一个可见度指数，从零开始。每买一个单位，当周加十点；上周末的分数有一半会留到本周。所以本周分数，等于上周分数的一半，加上本周单位数乘以十。
  s2_zh_hk: >-
    只就呢條題目嚟講，可見度指數由零開始。每買一個單位，當個星期加十點；上星期尾嘅分數有一半留到今個星期。即係今星期分數，等於上星期一半，加單位數乘十。
  s3_en: >-
    The index is an assumed proxy, not a percentage, reach or probability of purchase. The agency suggests
    weighting the four weeks equally, but no one has yet checked when clients actually decide.
  s3_zh: 这个指数只是假设的传播指标，不是百分比、不是触达人数，也不是购买概率。代理商建议四周等权比较，但还没人查过顾客到底什么时候做决定。
  s3_zh_hk: 呢個指數只係假設嘅傳播指標，唔係百分比、唔係接觸人數，亦唔係購買機會率。代理商建議四個星期同等比較，但仲未有人查過顧客究竟幾時決定。
