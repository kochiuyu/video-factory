  title_zh_hk: 功能為主，還是顧客應用？
  en: >-
    Would you lead with the feature comparison or the quantified customer-use case? And how would you
    label the 1,200 hours before payroll and redeployment are confirmed? Pause and vote.
  zh: 你会以功能比较开头，还是用量化的顾客应用？在薪酬和人手调配还没确认之前，这一千二百小时又该怎样表述？请暂停，投个票。
  zh_hk: 你會用功能比較做開頭，定係用量化嘅顧客應用？喺薪酬同人手調配未確認之前，呢一千二百個鐘又應該點樣講？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Payroll will not fall
  title_zh: 薪酬支出不会减少
  title_zh_hk: 薪酬支出不會減少
  step1_en: >-
    Staff and roster kept: payroll unchanged
  step1_zh: 人手和排班不变：薪酬不变
  step1_zh_hk: 人手和排班不變：薪酬不變
  step2_en: >-
    800 hours: record work, 0.4 h each
  step2_zh: 800 小时：完善记录，每份 0.4 小时
  step2_zh_hk: 800 小時：完善紀錄，每份 0.4 小時
  step3_en: >-
    400 hours: no identified use this year
  step3_zh: 400 小时：本年未有用途
  step3_zh_hk: 400 小時：本年未有用途
  s1_en: >-
    The buyer must keep its salaried staff and roster for the full year, with no overtime, agency or vacancy
    cost to avoid. So the nominal 240,000 dollars, from 1,200 hours times 200, cannot be presented as
    a cash saving.
  s1_zh: >-
    买方确认，全年都要保留现有的受薪人手和排班，没有加班、临时人手或空缺的开支可以省。所以，一千二百小时乘二百元得出的二十四万元，不能说成节省的现金。
  s1_zh_hk: >-
    買方確認，全年都要保留現有嘅受薪人手同更表，冇加班、臨時人手或者空缺嘅開支可以慳。所以，一千二百個鐘乘二百蚊得出嘅二十四萬蚊，唔可以講成慳到嘅現金。
  s2_en: >-
    Managers can put 800 of the hours into authorised member-record enrichment. Each record takes 0.4
    of a staff hour, and the backlog exceeds 2,000 records.
  s2_zh: 管理层可以把其中八百小时，集中用在已经批准的会员记录完善工作上。每份记录需要零点四个工时，积压的记录超过两千份。
  s2_zh_hk: 管理層可以將其中八百個鐘，集中用喺已經批准嘅會員紀錄完善工作。每份紀錄要零點四個工時，積壓嘅紀錄超過二千份。
  s3_en: >-
    The other 400 hours are fragmented across the roster, with no productive use this year. The 36,000-dollar
    reduction still stands, and enriched records have no agreed money value.
  s3_zh: 其余四百小时分散在不同班次，本年度找不到有效的用途。三万六千元的外部开支节省仍然成立；完善后的记录，双方没有约定任何金钱价值。
  s3_zh_hk: 其餘四百個鐘分散喺唔同更次，今年搵唔到有效用途。三萬六千蚊嘅外部開支節省仍然成立；完善咗嘅紀錄，雙方冇約定任何金錢價值。
