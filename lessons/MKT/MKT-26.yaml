  title_en: A lower price. A clearer customer business case?
  title_zh: 降价后，买方就更容易判断值不值吗？
  title_zh_hk: 降價了，買方就看得出值不值嗎？
  image: art/same-price-clearer-customer-value-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The UK Government Efficiency Framework distinguishes a cut in spending from staff time released for
    other work, and customer-value research asks suppliers to understand how the buyer actually uses a
    product. Now you lead the bid team of a fictional Hong Kong document-workflow service, tendering for
    a one-year contract with a private trade association.
  zh: >-
    英国政府的效率框架，把实际减少开支，和腾出人手去做别的工作分开来看；顾客价值的研究也提醒供应商，要了解买方实际怎样使用产品。现在，你带领一家虚构的香港文件流程服务商的投标团队，争取一个私人行业协会的一年期合同。
  zh_hk: >-
    英國政府嘅效率框架，將實際減少開支，同騰出人手做其他工作分開嚟睇；顧客價值嘅研究亦提醒供應商，要了解買方實際點樣用個產品。而家，你帶領一間虛構嘅香港文件流程服務商嘅投標團隊，爭取一個私人行業協會嘅一年合約。
