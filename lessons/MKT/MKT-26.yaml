  s1_en: >-
    Your fixed all-in price is 60,000 dollars, including implementation, training, support and exit help.
    The service meets every mandatory requirement, and neither presentation changes the product, price
    or terms.
  s1_zh: >-
    你方的总价固定为六万元，已经包括实施、培训、技术支持，以及合同结束时的交接协助。服务符合所有强制要求；两种写法都不会改变产品、价格或合同条款。
  s1_zh_hk: 你哋嘅總價固定係六萬蚊，已經包埋實施、培訓、支援，同合約完結時嘅交接協助。服務符合所有強制要求；兩種寫法都唔會改變產品、價錢或者合約條款。
  s2_en: >-
    You can submit one of two compliant summaries. Feature-led compares searchable records, routing and
    templates with the current process. Use-case-led connects the same functions to the buyer's own workload
    and costs.
  s2_zh: >-
    你只能递交两种合规摘要的其中一种。以功能为主的版本，比较可搜索记录、工作分配和模板与现有流程的分别；以顾客应用为主的版本，则把同样的功能和买方自己的工作量、成本连起来。
  s2_zh_hk: >-
    你只可以遞交兩種合規摘要嘅其中一種。以功能為主嘅版本，比較可搜尋紀錄、工作分派同範本同現有流程嘅分別；以顧客應用為主嘅版本，就將同樣嘅功能同買方自己嘅工作量、成本連埋。
  s3_en: >-
    A jointly checked sample forecasts 1,200 staff hours released, at the buyer's planning rate of 200
    dollars an hour. A separate review confirms 36,000 dollars of printing and courier spend would disappear.
    Payroll effects are not yet confirmed.
  s3_zh: >-
    双方核查的样本推算，全年可腾出一千二百个工时，买方的规划成本是每小时二百元。另一项审查确认，印刷和快递费可以省下三万六千元。薪酬会不会减少，还没确认。
  s3_zh_hk: >-
    雙方一齊核查嘅樣本推算，全年可以騰出一千二百個員工工時，買方用嚟規劃嘅成本係每個鐘二百蚊。另一項審查確認，印刷同速遞開支可以慳三萬六千蚊。至於薪酬會唔會減，仲未確認。
