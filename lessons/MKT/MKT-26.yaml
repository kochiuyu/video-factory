  title_en: What will the bid lead with?
  title_zh: 最终摘要怎样开头？
  title_zh_hk: 最終摘要怎樣開頭？
  en: >-
    What would your final lead message say about cash, usable capacity and cost? And would you keep the
    customer-use summary, or switch to the feature-led version? Pause and vote.
  zh: 最终摘要的开头，你会怎样讲现金、可用工时和成本？你会保留以顾客应用为主的写法，还是改用功能为主的版本？请暂停，投个票。
  zh_hk: 最終摘要嘅開頭，你會點樣講現金、可用工時同成本？你會保留以顧客應用為主嘅寫法，定係改用功能為主嘅版本？暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: A cash bridge, not a big return
  title_zh: 现金对照，不夸大回报
  title_zh_hk: 現金對照，不誇大回報
  step1_en: >-
    Cash avoided: HK$36,000 · labour: HK$0
  step1_zh: 省下现金：HK$36,000 · 人工：HK$0
  step1_zh_hk: 省下現金：HK$36,000 · 人工：HK$0
  step2_en: HK$60,000 − HK$36,000 = HK$24,000 extra
  step2_zh: HK$60,000 − HK$36,000 = 净多付 HK$24,000
  step2_zh_hk: HK$60,000 − HK$36,000 = 淨多付 HK$24,000
  step3_en: Not HK$240,000 + HK$36,000 in savings
  step3_zh: 不是节省 HK$240,000 + HK$36,000
  step3_zh_hk: 不是節省 HK$240,000 + HK$36,000
  s1_en: >-
    In round one, a feature comparison is easy to inspect, while a customer-use case is more relevant,
    if the hours are labelled as capacity potentially released, not a payroll saving.
  s1_zh: 第一轮时，功能比较容易核对；顾客应用的写法更贴近买方，前提是把那些工时写成可能腾出的人手，而不是薪酬节省。
  s1_zh_hk: 第一輪嗰陣，功能比較容易核對；顧客應用嘅寫法更貼近買方，前提係將嗰啲工時寫成可能騰出嘅人手，而唔係薪酬節省。
  s2_en: >-
    Annual external cash avoided is 36,000 dollars, and labour cash saving is zero. Against the 60,000-dollar
    fee, the buyer spends 24,000 dollars more over the year.
  s2_zh: 全年能省下的外部现金开支是三万六千元，人工方面的现金节省是零。跟六万元的服务费相比，买方全年要多花二万四千元。
  s2_zh_hk: 全年可以慳到嘅外部現金開支係三萬六千蚊，人工方面嘅現金節省係零。同六萬蚊嘅服務費比，買方全年要多使二萬四千蚊。
  s3_en: >-
    Claiming 240,000 plus 36,000 dollars as cash benefits, or 216,000 dollars as net cash savings, would
    be wrong.
  s3_zh: 如果说现金好处有二十四万加三万六千元，或者说净省现金二十一万六千元，都是错的。
  s3_zh_hk: 如果話現金好處有二十四萬加三萬六千蚊，或者話淨慳現金二十一萬六千蚊，都係錯嘅。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Make the capacity concrete
  title_zh: 把可用工时说具体
  title_zh_hk: 把可用工時說具體
  step1_en: 800 ÷ 0.4 = 2,000 enriched records
  step1_zh: 800 ÷ 0.4 = 2,000 份完善记录
  step1_zh_hk: 800 ÷ 0.4 = 2,000 份完善紀錄
  step2_en: >-
    Hours and records: one benefit, not two
  step2_zh: 工时和记录是同一项效益
  step2_zh_hk: 工時和紀錄是同一項效益
  step3_en: >-
    Lead: HK$36,000 saved · HK$24,000 extra
  step3_zh: 开头：省 HK$36,000 · 净多付 HK$24,000
  step3_zh_hk: 開頭：省 HK$36,000 · 淨多付 HK$24,000
  s1_en: >-
    The usable 800 hours support 800 divided by 0.4, or 2,000 enriched records. The other 400 hours have
    no shown use this year.
  s1_zh: 可用的八百小时，除以零点四，可以完善两千份记录。其余四百小时，本年度看不到有什么用途。
  s1_zh_hk: 可用嘅八百個鐘，除零點四，可以完善二千份紀錄。其餘四百個鐘，今年睇唔到有乜用途。
  s2_en: >-
    Neither the 2,000 records nor the 800 hours should be turned into cash without an agreed mechanism,
    and because they describe the same benefit, do not add them together.
  s2_zh: 没有双方同意的计算方法，两千份记录和八百小时都不应换算成现金；而且它们讲的是同一项效益，不能加在一起。
  s2_zh_hk: 冇雙方同意嘅計法，二千份紀錄同八百個鐘都唔應該換算成現金；而且佢哋講緊同一項效益，唔可以加埋一齊。
  s3_en: >-
    A defensible lead says: for 60,000 dollars a year, the service removes 36,000 of printing and courier
    costs and frees capacity for 2,000 record enrichments, without cutting payroll. Net extra cash is
    24,000.
  s3_zh: >-
    一个站得住的开头可以这样说：全年六万元，服务能省下三万六千元的印刷和快递费用，并腾出人手完善两千份记录，但不会减少薪酬。净多付的现金是二万四千元。
  s3_zh_hk: 一個企得住嘅開頭可以咁講：全年六萬蚊，服務可以慳三萬六千蚊嘅印刷同速遞費，仲騰出人手完善二千份紀錄，但唔會減薪酬。淨多俾嘅現金係二萬四千蚊。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Keep the trade-off visible
  title_zh: 取舍要讲清楚
  title_zh_hk: 取捨要講清楚
  en: >-
    Also state that a further 400 released hours have no identified use this year, and that benefits depend
    on the stated workload and redeployment plan. The use-case summary stays strong if it leads with this
    transparent trade-off; feature-led is also defensible, as long as the same cash limits stay explicit.
  zh: >-
    还要写明，另外四百个腾出的工时本年度没有找到用途，而且这些效益取决于说明了的工作量和人手调配计划。只要以这个清楚的取舍开头，顾客应用的写法依然有力；以功能为主也说得通，但同样要把现金上的限制讲清楚。
  zh_hk: >-
    仲要寫明，另外四百個騰出嘅工時今年冇搵到用途，而且呢啲效益取決於講明咗嘅工作量同人手調配計劃。只要用呢個清楚嘅取捨做開頭，顧客應用嘅寫法依然有力；以功能為主都講得通，但一樣要將現金上嘅限制講清楚。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Time released ≠ cash released
  title_zh: 省下工时，不等于省下现金
  title_zh_hk: 省下工時，不等於省下現金
  q1_en: >-
    Cash: HK$36,000 saved · HK$24,000 net extra
  q1_zh: 现金：省 HK$36,000 · 净多付 HK$24,000
  q1_zh_hk: 現金：省 HK$36,000 · 淨多付 HK$24,000
  q2_en: >-
    Capacity: 800 hours = 2,000 records
  q2_zh: 人手：800 小时 = 2,000 份记录
  q2_zh_hk: 人手：800 小時 = 2,000 份紀錄
  s1_en: >-
    A customer business case is clearer when cash, usable capacity and cost are stated separately and
    honestly.
  s1_zh: 把现金、可用人手和成本分开、如实地讲，顾客的效益评估才会更清楚。
  s1_zh_hk: 將現金、可用人手同成本分開、如實咁講，顧客嘅效益評估先會更清楚。
  s2_en: >-
    The evidence supports a customer decision, not a guaranteed tender win.
  s2_zh: 这些证据是帮顾客做决定，不保证一定中标。
  s2_zh_hk: 呢啲證據係幫顧客做決定，唔保證一定中標。
  s3_en: >-
    The supplier, the trade association, the tender and all figures are fictional. Official scene art
    is a teaching illustration only.
  s3_zh: 服务商、行业协会、招标和所有数字都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 服務商、行業協會、招標同所有數字都係虛構嘅。官方場景圖只係教學插圖。
duration_target_s: 196
