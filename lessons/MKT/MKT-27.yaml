  title_zh: 选哪种版面？标哪些价格？
  title_zh_hk: 揀哪款版面？標哪些價格？
  en: >-
    Calculate both prices per 100 grams. Which label layout would you choose, and what total price, quantity
    and unit price should each pack clearly show? Pause and vote.
  zh: 先算出两种包装每一百克的价格。你会选哪种标签版面？每种包装上应该清楚列出什么总价、分量和单位价格？请暂停，投个票。
  zh_hk: 先計出兩款包裝每一百克嘅價錢。你會揀邊款標籤版面？每款包裝應該清楚列出咩總價、分量同單位價錢？暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Two shoppers, two exact needs
  title_zh: 两位顾客，两种确切需要
  title_zh_hk: 兩位顧客，兩種確切需要
  step1_en: >-
    Shopper A: exactly 250 g tonight
  step1_zh: 甲：今晚刚好要 250 克
  step1_zh_hk: 甲：今晚剛好要 250 克
  step2_en: >-
    Shopper B: exactly 600 g tonight
  step2_zh: 乙：今晚刚好要 600 克
  step2_zh_hk: 乙：今晚剛好要 600 克
  step3_en: Surplus has no usable value
  step3_zh: 多买的没有可用价值
  step3_zh_hk: 多買的沒有可用價值
  s1_en: >-
    Two shoppers explain their needs for tonight. Shopper A needs exactly 250 grams. Each wants the lowest
    total outlay that supplies the amount.
  s1_zh: 两位顾客说明今晚的需要。甲要刚好二百五十克。两人都想用最低的总开支，买够所需的分量。
  s1_zh_hk: 兩位顧客講咗今晚嘅需要。甲要啱啱好二百五十克。兩個人都想用最少嘅總開支，買夠需要嘅分量。
  s2_en: >-
    Shopper B needs exactly 600 grams. Neither has sauce at home, and both can afford any relevant combination
    of packs.
  s2_zh: 乙要刚好六百克。两人家里都没有酱汁，也负担得起任何相关的包装组合。
  s2_zh_hk: 乙要啱啱好六百克。兩個人屋企都冇醬汁，亦負擔得起任何相關嘅包裝組合。
  s3_en: >-
    Any surplus has no further usable value: they cannot share, freeze or use it before its safe-use deadline,
    and they will not eat extra to avoid leftovers. Prices stay at 12 and 24 dollars.
  s3_zh: 多买的酱汁没有可用价值：不能送人、不能冷冻，也无法在安全食用期限前用完，他们也不会为了不浪费而多吃。价格仍然是十二元和二十四元。
  s3_zh_hk: 多買嘅醬汁冇可用價值：唔可以送人、唔可以凍起，亦用唔晒喺安全食用期限之前，佢哋亦唔會為咗唔浪費而食多咗。價錢仍然係十二蚊同二十四蚊。
