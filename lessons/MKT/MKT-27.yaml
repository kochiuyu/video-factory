  title_zh: 甲和乙该怎样买？
  title_zh_hk: 甲和乙該怎樣買？
  en: >-
    What should A and B each buy at the lowest outlay for their stated needs? And how would you keep the
    label helpful, without treating the lowest unit price as the cheapest purchase for everyone? Pause
    and vote.
  zh: 按各自的需要，甲和乙各应该怎样买才最省钱？标签又怎样才能帮到顾客，而不会让人以为单位价格最低，就一定对每个人都最便宜？请暂停，投个票。
  zh_hk: 按各自嘅需要，甲同乙應該點買先最慳錢？標籤又點樣先幫到顧客，而唔會令人以為單位價錢最低，就一定對個個都最平？暫停，投個票。
- id: bridge
