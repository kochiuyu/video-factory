  en: >-
    On 15 March 2021, Hong Kong's Consumer Council reported that inconsistent quantity units made supermarket
    price comparisons harder, and that larger packs were not always cheaper per unit. Now you manage shelf
    information for a fictional Hong Kong grocery shop.
  zh: >-
    二零二一年三月十五日，香港消费者委员会指出，超市商品的计量单位不统一，让比价变得困难；调查也发现，大包装的单位价格不一定更低。现在，你负责一家虚构的香港食品杂货店的货架标签。
  zh_hk: >-
    二零二一年三月十五號，香港消費者委員會指出，超市貨品嘅計量單位唔統一，令格價好難；調查亦發現，大包裝嘅單位價錢唔一定平啲。而家，你負責一間虛構嘅香港食品雜貨舖嘅貨架標示。
