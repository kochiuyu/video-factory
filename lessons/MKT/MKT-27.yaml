  s1_en: B buys one large pack for 24 dollars and uses all 600 grams.
  s1_zh: 乙花二十四元买一大包，六百克全部用完。
  s1_zh_hk: 乙使二十四蚊買一大包，六百克全部用晒。
  s2_en: >-
    Two small packs also cost 24 dollars, but supply only 500 grams, so they do not meet the need.
  s2_zh: 两小包同样要二十四元，但总共只有五百克，分量不够。
  s2_zh_hk: 兩小包一樣要二十四蚊，但總共得五百克，分量唔夠。
  s3_en: >-
    Three small packs cost 36 dollars, supply 750 grams and leave 150 grams unusable. The lowest ticket
    price per pack does not give B the lowest relevant outlay.
  s3_zh: 三小包要三十六元，共七百五十克，会剩下一百五十克用不了。所以，单包标价最低的选择，并不能让乙用最低的总开支买够酱汁。
  s3_zh_hk: 三小包要三十六蚊，總共七百五十克，會剩低一百五十克用唔到。所以，單包標價最平嘅揀法，唔能夠令乙用最少嘅總開支買夠醬汁。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Clarity, not a universal winner
  title_zh: 讲清楚，不宣称谁最划算
  title_zh_hk: 講清楚，不宣稱誰最划算
  en: >-
    Paired is a strong choice, because immediate outlay and comparable unit price are visible together.
    Ticket-led can still serve a shopper managing cash, if the unit price stays clear. Add a neutral reminder:
    compare price per 100 grams, then buy the quantity you can use.
  zh: >-
    并列版是个好选择，因为顾客可以同时看清当下的开支和可比较的单位价格。只要单位价格也清楚，总价优先版对留意手头开支的顾客仍然有用。可以加一句中性的提示：先比较每一百克价格，再按用量购买。
  zh_hk: >-
    並列版係個好選擇，因為顧客可以同時睇清即刻要使幾多同可以比較嘅單位價錢。只要單位價錢都清楚，總價優先版對睇實荷包嘅顧客仍然有用。可以加一句中性嘅提示：先比較每一百克價錢，再按用量買。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Unit price ≠ cheapest purchase
  title_zh: 单位价最低 ≠ 最省钱
  title_zh_hk: 單位價最低 ≠ 最省錢
  q1_en: >-
    Shelf unit price: based on net quantity
  q1_zh: 货架单位价格：按净重计算
  q1_zh_hk: 貨架單位價格：按淨重計算
  q2_en: >-
    Shopper: whole packs and surplus
  q2_zh: 顾客：比较整包组合和剩余
  q2_zh_hk: 顧客：比較整包組合和剩餘
  s1_en: >-
    Keep the shelf unit price based on purchased net quantity; each shopper separately compares feasible
    whole packs and unusable surplus.
  s1_zh: 货架单位价格仍然按购买的净重计算；顾客再自己比较可行的整包组合，以及会剩下多少用不了。
  s1_zh_hk: 貨架單位價錢仍然按買嘅淨重計；顧客再自己比較可行嘅成包組合，同會剩低幾多用唔到。
  s2_en: >-
    No evidence here shows which layout increases sales, or how often either need occurs.
  s2_zh: 这里没有证据显示哪种版面能提高销量，也不知道这两种需要各有多常见。
  s2_zh_hk: 呢度冇證據顯示邊款版面可以提高銷量，亦唔知道呢兩種需要各有幾常見。
  s3_en: >-
    The shop, the packs and the shopping requirements are fictional. Official scene art is a teaching
    illustration only.
  s3_zh: 商店、包装和购物需要都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 商店、包裝同購物需要都係虛構嘅。官方場景圖只係教學插圖。
