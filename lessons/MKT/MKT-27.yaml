  title_en: Two kinds of price
  title_zh: 两种价格
  title_zh_hk: 兩種價格
  step1_en: >-
    Small: HK$4.80 per 100 g
  step1_zh: 小包：每 100 克 HK$4.80
  step1_zh_hk: 小包：每 100 克 HK$4.80
  step2_en: >-
    Large: HK$4.00 per 100 g
  step2_zh: 大包：每 100 克 HK$4.00
  step2_zh_hk: 大包：每 100 克 HK$4.00
  step3_en: >-
    A: one small pack, saves HK$12
  step3_zh: 甲：买一小包，省 HK$12
  step3_zh_hk: 甲：買一小包，省 HK$12
  s1_en: >-
    The small pack costs 12 dollars for 250 grams, or 4 dollars 80 per 100 grams. It has the lower ticket
    price.
  s1_zh: 小包二百五十克卖十二元，等于每一百克四块八。它的整包标价比较低。
  s1_zh_hk: 小包二百五十克賣十二蚊，即係每一百克四蚊八。佢嘅成包標價比較低。
  s2_en: >-
    The large pack costs 24 dollars for 600 grams, or 4 dollars per 100 grams. It has the lower unit price.
    Neither fact settles every shopper's total cost.
  s2_zh: 大包六百克卖二十四元，等于每一百克四块钱，单位价格比较低。但单看其中一项，都不能判断每位顾客的总开支。
  s2_zh_hk: 大包六百克賣二十四蚊，即係每一百克四蚊，單位價錢比較低。但淨係睇其中一樣，都判斷唔到每位顧客嘅總開支。
  s3_en: >-
    A buys one small pack for 12 dollars and uses all 250 grams. A large pack, or two small packs, would
    cost 24 dollars and leave sauce unusable. A saves 12 dollars despite the higher unit price.
  s3_zh: 甲花十二元买一小包，二百五十克全部用完。买一大包或两小包，都要花二十四元，还会剩下用不了的酱汁。小包单位价格虽然较高，甲反而省了十二元。
  s3_zh_hk: 甲使十二蚊買一小包，二百五十克全部用晒。買一大包或者兩小包，都要使二十四蚊，仲會剩低用唔到嘅醬汁。小包單位價錢雖然貴啲，甲反而慳咗十二蚊。
