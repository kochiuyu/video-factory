  s1_en: >-
    The same chilled fresh sauce comes in two sealed packs: 250 grams for 12 dollars, and 600 grams for
    24 dollars. Ingredients, quality and storage are identical, with no promotions, and customers can
    only buy whole packs.
  s1_zh: 同一种冷藏鲜酱汁有两种密封包装：二百五十克卖十二元，六百克卖二十四元。成分、质量和保存方法完全一样，没有任何优惠，顾客只能整包购买。
  s1_zh_hk: 同一款冷藏鮮醬汁有兩種密封包裝：二百五十克賣十二蚊，六百克賣二十四蚊。成分、品質同保存方法完全一樣，冇任何優惠，顧客只可以買成包。
  s2_en: >-
    You must choose one truthful label layout. Ticket-led makes the total pack price the strongest element,
    with weight and price per 100 grams readable beside it. Paired makes total price and price per 100
    grams equally prominent.
  s2_zh: 你要选一种如实的标签版面。总价优先版最突出整包的总价，旁边清楚列出净重和每一百克价格；并列版则让总价和每一百克价格同样醒目。
  s2_zh_hk: 你要揀一款如實嘅標籤版面。總價優先版最突出成包嘅總價，旁邊清楚列出淨重同每一百克價錢；並列版就令總價同每一百克價錢一樣咁醒目。
  s3_en: >-
    Both layouts meet every requirement and hide nothing. The goal is quick comparison of immediate spend
    and quantity, not steering everyone into one pack. Each layout has room for the same short optional
    reminder.
  s3_zh: >-
    两种版面都符合所有要求，也不隐藏任何信息。目标是让顾客迅速比较当下的开支和分量，而不是引导所有人买同一种包装。两种版面都可以加上同一句简短提示。
  s3_zh_hk: >-
    兩款版面都符合所有要求，亦冇收埋任何資料。目標係等顧客快啲比較即刻要使幾多錢同分量，而唔係引導所有人買同一款包裝。兩款版面都可以加同一句簡短提示。
