  title_en: They understand the benefit. Can they picture doing it?
  title_zh: 知道产品有用，但有信心自己装好吗？
  title_zh_hk: 知道產品有用，但有信心自己裝好嗎？
  image: art/understand-benefit-picture-setup-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Bandura's self-efficacy account separates believing an action produces a useful outcome from believing
    you can perform it yourself. Now a fictional Hong Kong home-organisation brand is introducing a modular
    desktop organiser to twenty adult volunteers.
  zh: >-
    班杜拉的自我效能理论区分了两种想法：相信某个做法会有好结果，以及相信自己有能力做到。现在，一个虚构的香港家居收纳品牌，要向二十位自愿参加的成年人介绍一款组合式桌面收纳架。
  zh_hk: >-
    班杜拉嘅自我效能理論分開咗兩種諗法：相信某個做法會有好結果，同相信自己有能力做到。而家，一個虛構嘅香港家居收納品牌，要向二十位自願參加嘅成年人介紹一款組合式枱面收納架。
