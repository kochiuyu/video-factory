  en: >-
    Which communication would you provisionally fund? And what would you ask, to tell a lack of benefit
    understanding apart from doubt about doing the setup? Pause and vote.
  zh: 你会暂时把预算给哪一项？你又会问什么问题，来分辨顾客是不明白产品的好处，还是怀疑自己装不好？请暂停，投个票。
  zh_hk: 你會暫時將預算畀邊一項？你又會問咩問題，嚟分辨顧客係唔明產品嘅好處，定係怕自己砌唔好？暫停，投個票。
