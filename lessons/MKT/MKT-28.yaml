  footer_en: Needs 40 × 30 × 25 cm, front facing
  footer_zh: 需 40 × 30 × 25 厘米，正面朝前
  footer_zh_hk: 需 40 × 30 × 25 厘米，正面朝前
  s1_en: >-
    The organiser holds ordinary stationery and assembles in three tool-free steps: align the base, slide
    in the dividers and secure the supplied clips. It is not wall-mounted, powered or safety-critical.
  s1_zh: 收纳架用来放普通文具，组装不用工具，只有三步：对准底座、插入隔板，再用随附的卡扣固定。它不用上墙，也不用通电，不涉及安全风险。
  s1_zh_hk: 收納架用嚟放普通文具，砌嘅時候唔使工具，得三步：對準底座、插入隔板，再用附送嘅扣固定。佢唔使上牆，又唔使插電，唔涉及安全風險。
  s2_en: >-
    It needs a level space at least 40 centimetres wide, 30 deep and 25 high, with the front facing the
    user. It cannot be rotated, cut or reduced, and no other size or home installation is available.
  s2_zh: >-
    它需要一块平整的位置，至少宽四十厘米、深三十厘米、高二十五厘米，正面必须朝向使用者。不能转向、不能裁剪，也不能缩小；没有其他尺寸，也不提供上门安装。
  s2_zh_hk: >-
    佢要一個平整嘅位，最少闊四十厘米、深三十厘米、高二十五厘米，正面一定要對住用嘅人。唔可以轉向、唔可以裁細，亦唔可以縮細；冇其他尺寸，亦冇上門安裝。
  s3_en: >-
    One 4,000-dollar allowance funds either A, a polished benefit advert, or D, a five-minute one-to-one
    demonstration with a chance to practise. The goal is informed, suitable adoption, not maximum purchases.
  s3_zh: >-
    一笔四千元的预算，只能做其中一项：A 是制作精美的产品好处广告，D 是五分钟一对一示范，并让顾客亲手练习。目标是让顾客了解产品，在合适时才选用，而不是追求最多销量。
  s3_zh_hk: >-
    一筆四千蚊嘅預算，只可以做其中一樣：A 係製作精美嘅效益廣告，D 係五分鐘一對一示範，再畀顧客親手試。目標係等顧客了解產品，啱用先買，而唔係追求最多銷量。
