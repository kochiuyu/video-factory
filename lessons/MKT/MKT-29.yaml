  footer_en: >-
    G: generic · S: specific
  footer_zh: G：一般回复 · S：具体回复
  footer_zh_hk: G：一般回覆 · S：具體回覆
  s1_en: >-
    The review says: the pickup message said ready, I travelled to the shop, but the order was not there,
    and I wasted a trip. Staff have privately apologised and offered a fair remedy, not conditional on
    changing the review.
  s1_zh: 评价写道：通知说可以取货，我专程赶到店里，却发现订单还没准备好，白跑了一趟。店员已经私下道歉，并提出公平的补救，不以删除或修改评价为条件。
  s1_zh_hk: 評價寫住：通知話可以取貨，我專登去到舖頭，先發現張單未準備好，白行一趟。店員已經私下道歉，提出咗公平嘅補救，唔使刪除或者改評價都可以攞到。
  s2_en: >-
    The public reply must not disclose names, order details, private correspondence, remedy terms or whether
    the customer accepted. The manager knows the message was premature, but has not checked whether other
    orders are affected.
  s2_zh: 公开回复不能透露姓名、订单细节、私下往来、补救条款，或顾客是否接受。经理知道通知发得太早，但还没查明其他订单是否也受影响。
  s2_zh_hk: 公開回覆唔可以透露姓名、訂單細節、私下往來、補救條款，或者顧客有冇接受。經理知道通知發得太早，但未查清其他訂單有冇受影響。
  s3_en: >-
    G says: thank you for your feedback, we are sorry for the inconvenience, please contact our service
    team. S says: we are sorry the pickup message sent you on a wasted trip, and we are checking why it
    was sent early.
  s3_zh: >-
    G 写的是：谢谢你的反馈，很抱歉给你带来不便，请联系我们的客服团队。S 写的是：取货通知让你白跑一趟，我们很抱歉，我们正在查明为什么提早发出了通知。
  s3_zh_hk: G 寫嘅係：多謝你嘅意見，好抱歉造成不便，請聯絡客服團隊。S 寫嘅係：取貨通知令你白行一趟，我哋好抱歉，我哋正查清點解咁早發出通知。
