  title_en: Resolve one complaint. Reassure which audience?
  title_zh: 投诉解决了，还需要让谁放心？
  title_zh_hk: 投訴解決了，還要讓誰安心？
  image: art/private-remedy-public-reassurance-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Research on public management responses treats a review page as more than a private exchange: other
    readers see what a business acknowledges and plans to do. Now a fictional Hong Kong stationery retailer
    has received a genuine, visible complaint.
  zh: >-
    研究企业如何公开回复评价时发现，评价页不只是商家和顾客的私下对话，其他读者也看得到商家承认了什么、打算怎样做。现在，一家虚构的香港文具店收到了一则属实的公开投诉。
  zh_hk: >-
    研究企業點樣公開回覆評價嘅時候發現，評價頁唔只係商戶同顧客私下傾偈，其他讀者都睇到商戶承認咗咩、打算點做。而家，一間虛構嘅香港文具舖收到一則屬實嘅公開投訴。
