- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: A repeatable process problem
  title_zh: 一个会重复出现的流程问题
  title_zh_hk: 一個會重複出現的流程問題
  step1_en: Batch message sent before shelving
  step1_zh: 货品未上架，系统已批量通知
  step1_zh_hk: 貨品未上架，系統已批量通知
  step2_en: Auto trigger off · staff shelf check on
  step2_zh: 停用自动通知 · 改由店员核查
  step2_zh_hk: 停用自動通知 · 改由店員查核
  step3_en: >-
    Reply: verified facts, at most 55 words
  step3_zh: 回复：只写已核实事实，限字数
  step3_zh_hk: 回覆：只寫已核實事實，限字數
  s1_en: >-
    The check finds a repeatable problem: a batch message can mark orders ready before staff place them
    on the collection shelf. It is not confined to this customer.
  s1_zh: 核查发现一个会重复出现的问题：系统批量发通知时，货品还没放上取货架，订单就可能已经标成可取货。受影响的不只这位顾客。
  s1_zh_hk: 查核發現一個會重複出現嘅問題：系統批量發通知嗰陣，貨品未放上取貨架，張單就可能已經標咗可以取貨。受影響嘅唔只呢位顧客。
  s2_en: >-
    The store has switched off the automatic trigger and added a staff shelf check before any ready message.
    The change operates today, its long-run effect is unknown, and the manager will review the next week
    of messages.
  s2_zh: 店里已经停用自动触发的取货通知，改由店员先核查货架再发通知。新做法今天已经实行，长期效果还不知道，经理会核对未来一周的通知。
  s2_zh_hk: 店舖已經停用自動發出嘅取貨通知，改由店員先查核貨架再發通知。新做法今日已經實行，長遠效果仲未知，經理會核對未來一個星期嘅通知。
  s3_en: >-
    Several prospective buyers ask whether they can rely on a pickup message, and the complainant asks
    that private details stay private. The final reply must use only verified facts, in at most 55 English
    words.
  s3_zh: 有几位潜在顾客留言，问收到取货通知是否就能放心出门；投诉人也要求私下往来和个人信息保密。最终回复只能写已核实的事实，中文不超过一百字。
  s3_zh_hk: 有幾位潛在顧客留言，問收到取貨通知係咪就可以放心出門；投訴人亦要求私下往來同個人資料保密。最終回覆只可以寫已核實嘅事實，中文唔超過一百字。
