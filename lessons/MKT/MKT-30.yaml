  kicker: MKT-30
  kicker_en: MKT-30
  kicker_zh: MKT-30
  kicker_zh_hk: MKT-30
  title_en: One customer profile. Two shopping missions?
  title_zh: 同一类顾客，来买东西的目的也一样吗？
  title_zh_hk: 同一類顧客，來買東西的目的也一樣嗎？
  image: art/same-shoppers-different-missions-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Marketing research separates shopping circumstances from enduring person characteristics. At the fictional
    Hong Kong grocer Lane Basket, Mei must brief two equally sized communication panels for adult shoppers
    aged 30 to 49 in the same neighbourhood.
  zh: >-
    市场营销研究会把当下的购物情境，和一个人较持久的特征分开来看。在虚构的香港杂货店 Lane Basket，Mei 要为同一街区三十到四十九岁的成年顾客，策划两块同样大小的宣传版面。
  zh_hk: >-
    市場營銷研究會將當下嘅購物情境，同一個人比較持久嘅特徵分開嚟睇。喺虛構嘅香港雜貨店 Lane Basket，Mei 要為同一區三十至四十九歲嘅成年顧客，策劃兩塊一樣大嘅宣傳版面。
