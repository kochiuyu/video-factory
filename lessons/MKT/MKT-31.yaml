  s1_en: >-
    Your brief must choose R, understanding why category-buying households do not buy Bay Jar, or F, creating
    another useful purchase occasion for current buyers. This is a research priority, not a campaign budget.
  s1_zh: >-
    你的简报要在两项中选一项：R，了解买这类产品的家庭为什么不买 Bay Jar；F，为现有买家创造另一次合适的购买机会。这只是决定研究重点，不是批准推广预算。
  s1_zh_hk: >-
    你份簡報要喺兩樣之中揀一樣：R，了解買呢類產品嘅住戶點解唔買 Bay Jar；F，為現有買家創造多一次啱用嘅購買機會。呢個只係決定研究重點，唔係批推廣預算。
  s2_en: >-
    The dashboard compares the same calendar weeks one year apart, in the same 10,000 monitored households.
    In both periods, 8,000 households bought the category, and Bay Jar sold 8,000 packs at 30 dollars.
  s2_zh: 仪表盘比较相隔一年的同样日历周，观察对象都是同一批一万户家庭。两期都有八千户买过这个品类，Bay Jar 都卖出八千包，每包三十元。
  s2_zh_hk: 儀表板比較相隔一年嘅同樣日曆周，觀察對象都係同一批一萬個住戶。兩期都有八千戶買過呢個品類，Bay Jar 都賣咗八千包，每包三十蚊。
  s3_en: >-
    So sales value is 240,000 dollars in both periods. Management argues that stable sales mean stable
    buyer reach, so F is the obvious priority.
  s3_zh: 所以两期的销售额都是二十四万元。管理层认为销售稳定，就说明买家覆盖也没变，所以 F 理所当然是重点。
  s3_zh_hk: 所以兩期嘅銷售額都係二十四萬蚊。管理層覺得銷售穩定，就代表買家覆蓋都冇變，所以 F 理所當然係重點。
- id: pause1
