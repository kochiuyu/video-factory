  kicker_zh_hk: MKT-31
  title_en: The same sales. A smaller buyer base?
  title_zh: 销量一样，买的人反而少了？
  title_zh_hk: 銷量一樣，買的人反而少了？
  image: art/same-sales-smaller-buyer-base-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In a May 2026 article, Worldpanel by Numerator reported that buyer growth accompanied growth for most
    growing consumer-goods brands in China. Now you manage Bay Jar, a fictional Hong Kong pantry brand,
    and must choose the next research priority.
  zh: >-
    Worldpanel by Numerator 在二零二六年五月的文章中提到，在中国消费品市场，大部分增长的品牌，买家数量也在增加。现在，你管理一个虚构的香港常备食品品牌 Bay Jar，要决定下一步优先研究什么。
  zh_hk: >-
    Worldpanel by Numerator 喺二零二六年五月嘅文章提到，喺中國消費品市場，大部分有增長嘅品牌，買家數目都有增加。而家，你管理一個虛構嘅香港常備食品品牌 Bay Jar，要決定下一步優先研究乜嘢。
