  title_en: A generous referral. A trustworthy recommendation?
  title_zh: 推荐奖励越慷慨，朋友就越信你吗？
  title_zh_hk: 推薦獎勵越慷慨，朋友就越信你嗎？
  image: art/same-reward-different-recipient-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Dropbox's help page describes referral benefits for both an existing user and a qualifying new user,
    and separates invitations from completed referrals. Now you manage Harbour Shelf, a fictional Hong
    Kong homeware shop, choosing a four-week referral pilot.
  zh: >-
    Dropbox 的帮助页面列出了现有用户和符合条件的新用户各自能获得的推荐奖励，也把发出邀请和完成推荐分开。现在，你管理虚构的香港家居用品店 Harbour Shelf，要选一个为期四周的推荐试行计划。
  zh_hk: >-
    Dropbox 嘅說明頁列出現有用戶同符合資格嘅新用戶各自攞到咩推薦獎勵，亦將發出邀請同完成推薦分開。而家，你管理虛構嘅香港家居用品店 Harbour Shelf，要揀一個四星期嘅推薦試行計劃。
