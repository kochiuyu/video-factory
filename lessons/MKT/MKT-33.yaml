  kicker_zh_hk: 暫停
  title_en: Which design aids evaluation?
  title_zh: 哪个方案更能让人评估？
  title_zh_hk: 哪個方案更能讓人評估？
  en: >-
    Which design better supports evaluation under this timetable? Count who could finish all three sessions
    under each, explain the uncertainty, and propose measures for opportunity, actual experience and a
    voluntary purchase. Pause and vote.
  zh: >-
    按这个时间表，哪个方案更能让人评估服务？算一算两个方案各有多少人能上完三节课，说明还有哪些不确定的地方，再建议怎样分开衡量体验机会、实际体验和自愿购买。请暂停，投个票。
  zh_hk: >-
    按呢個時間表，邊個方案比較可以等人評估服務？計吓兩個方案各有幾多人上得晒三節課，講吓仲有咩唔肯定，再建議點樣分開量度體驗機會、實際體驗同自願購買。暫停，投個票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Trace A's opportunities
  title_zh: 逐组计算 A 的机会
  title_zh_hk: 逐組計算 A 的機會
  step1_en: >-
    Group 1: finishes before day 7 ends
  step1_zh: 第一组：第 7 日前完成
  step1_zh_hk: 第一組：第 7 日前完成
  step2_en: >-
    Group 2: only day 6 · group 3: none
  step2_zh: 第二组只上第 6 日 · 第三组 0 节
  step2_zh_hk: 第二組只上第 6 日 · 第三組 0 節
  step3_en: 40 × 3 + 40 × 1 + 20 × 0 = 160
  step3_zh: 40 × 3 + 40 × 1 + 20 × 0 = 160
  step3_zh_hk: 40 × 3 + 40 × 1 + 20 × 0 = 160
  s1_en: >-
    Seven calendar days of access are not seven days of meaningful use. Under A, the first 40 can attend
    on days 2, 4 and 6, and finish before day 7 ends.
  s1_zh: 七个自然日的使用权，不等于七天有效的练习。选 A 的话，前四十人可以在第二、四、六天上课，赶在第七天结束前完成。
  s1_zh_hk: 七個日曆日嘅使用權，唔等於七日有效練習。揀 A 嘅話，首四十人可以喺第二、四、六日上堂，趕得切喺第七日完結前完成。
  s2_en: >-
    The next 40 can attend only day 6; days 8 and 10 fall outside the trial. The final 20 cannot reach
    even their first feasible session.
  s2_zh: 第二组四十人只能上第六天那一节，第八和第十天已经超过期限。最后二十人到期前连第一节都上不了。
  s2_zh_hk: 第二組四十人只可以上第六日嗰堂，第八同第十日已經過咗期。最後二十人到期前連第一堂都上唔到。
  s3_en: >-
    So A permits 40 complete cycles out of 100, or 40 percent, and 160 session opportunities in total.
    Sixty people lack enough time to sample the whole cycle.
  s3_zh: 所以 A 让一百人中只有四十人有机会体验全程，也就是百分之四十，可上的课时合计一百六十节。其余六十人没有足够时间体验整个流程。
  s3_zh_hk: 所以 A 令一百人入面得四十人有機會體驗全程，即係百分之四十，可以上嘅課時加埋一百六十節。其餘六十人冇足夠時間體驗成個流程。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Trace B's opportunities
  title_zh: 逐组计算 B 的机会
  title_zh_hk: 逐組計算 B 的機會
  step1_en: Finish on days 6, 10 and 19
  step1_zh: 分别在第 6、10、19 日完成
  step1_zh_hk: 分別在第 6、10、19 日完成
  step2_en: 100 full cycles · 300 sessions
  step2_zh: 100 人可体验全程 · 300 节
  step2_zh_hk: 100 人可體驗全程 · 300 節
  step3_en: Opportunities, not 60 extra customers
  step3_zh: 是机会，不是多 60 位顾客
  step3_zh_hk: 是機會，不是多 60 位顧客
  s1_en: >-
    Under B, the three groups can finish on days 6, 10 and 19, all before the day-21 cap.
  s1_zh: 选 B 的话，三组分别可以在第六、十、十九天完成，都早于第二十一天的截止日。
  s1_zh_hk: 揀 B 嘅話，三組分別可以喺第六、十、十九日完成，全部早過第二十一日嘅截止日。
  s2_en: >-
    That permits 100 complete cycles and 300 session opportunities: 60 more people with a full-cycle chance,
    and 140 more usable slots than A.
  s2_zh: 这样一百人都有机会体验全程，共有三百个可上课时；比 A 多了六十人有机会体验全程，也多了一百四十个可用课时。
  s2_zh_hk: 咁樣一百人都有機會體驗全程，總共有三百個可以上嘅課時；比 A 多咗六十人有機會體驗全程，亦多咗一百四十個可用課時。
  s3_en: >-
    These are conditional opportunity counts, not 100 completed trials or 60 extra customers. Absent or
    very late users may still not finish, so do not advertise three guaranteed sessions.
  s3_zh: >-
    这些只是题设条件下的机会数，不是已有一百人完成试用，也不是多了六十位顾客。缺席或太晚开始的人仍可能完成不了，所以宣传时不能承诺人人都能上完三节。
  s3_zh_hk: >-
    呢啲只係題設條件下嘅機會數，唔係已經有一百人完成試用，亦唔係多咗六十位顧客。缺席或者太遲開始嘅人仍然可能完成唔到，所以宣傳嗰陣唔可以承諾個個都上得晒三節。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Choose an evaluation opportunity
  title_zh: 为顾客创造评估机会
  title_zh_hk: 為顧客創造評估機會
  en: >-
    Choose B for this cohort: it removes A's timing barrier without changing content, cost or payment
    protections. It does not establish better teaching, higher conversion or greater profit. A is simpler,
    and could suit a cohort able to finish in the first week.
  zh: >-
    对这批用户来说，应该选 B：它消除了 A 的时间限制，又不改变课程、成本或付款保障。但这不能证明教学更好、转化率更高或利润更多。A 比较简单，对能在第一周完成流程的另一批用户，可能更合适。
  zh_hk: >-
    對呢批用戶嚟講，應該揀 B：佢消除咗 A 嘅時間限制，又唔改變課程、成本或者付款保障。但呢個證明唔到教學好啲、轉化率高啲或者利潤多啲。A 比較簡單，對可以喺第一個星期完成流程嘅另一批用戶，可能更啱。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Access ≠ experience ≠ purchase
  title_zh: 开通 ≠ 体验 ≠ 购买
  title_zh_hk: 開通 ≠ 體驗 ≠ 購買
  q1_en: Track setup, sessions and full cycles
  q1_zh: 分开记录设置、上课、完成全程
  q1_zh_hk: 分開記錄設定、上課、完成全程
  q2_en: Compare cohorts at a common day 28
  q2_zh: 统一以第 28 日比较各组
  q2_zh_hk: 統一以第 28 日比較各組
  s1_en: >-
    Track signup, setup, session dates, full-cycle completion, dropouts, later paid opt-ins and refunds
    separately. Do not compare A's day-7 purchases with B's day-21 purchases as if exposure were equal.
  s1_zh: >-
    要分开记录登记、完成设置、上课日期、体验全程、自行退出，以及之后的主动付费和退款。不能拿 A 到第七天的购买数，和 B 到第二十一天的数字直接比较，当作观察时间一样。
  s1_zh_hk: >-
    要分開記錄登記、完成設定、上堂日子、體驗全程、自行退出，同埋之後主動付費同退款。唔可以攞 A 到第七日嘅購買數，同 B 到第二十一日嘅數字直接比，當兩組觀察時間一樣。
  s2_en: >-
    This timetable calculation is not an experiment, and noncompletion is not simply lack of interest.
  s2_zh: 这个时间表计算不是实验，没有完成也不一定是因为没兴趣。
  s2_zh_hk: 呢個時間表計算唔係實驗，冇完成亦唔一定係因為冇興趣。
  s3_en: >-
    Clear Phrase, the timetable and the costs are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: Clear Phrase、时间表和成本都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: Clear Phrase、時間表同成本都係虛構嘅。官方場景圖只係教學插圖。
