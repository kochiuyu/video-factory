  title_en: A free trial. Enough time to experience the benefit?
  title_zh: 免费试用：有足够时间体验成效吗？
  title_zh_hk: 免費試用：有足夠時間體驗成效嗎？
  image: art/free-trial-time-to-experience-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Free-trial research examines learning through use, not merely receiving access, and software studies
    do not establish one universally best duration. Now you manage Clear Phrase, a fictional Singapore
    language-practice service, choosing a trial for 100 consenting adult newcomers.
  zh: >-
    免费试用的研究关注顾客怎样在实际使用中了解产品，而不只是有没有开通服务；软件研究也没有找到一个普遍适用的最佳试用期。现在，你管理新加坡的虚构语言练习服务 Clear Phrase，要为一百位同意参与的成年新用户选择试用方案。
  zh_hk: >-
    免費試用嘅研究關注顧客點樣喺實際使用中了解產品，而唔只係有冇開通服務；軟件研究亦冇搵到一個普遍適用嘅最佳試用期。而家，你管理新加坡嘅虛構語言練習服務 Clear Phrase，要為一百位同意參與嘅成年新用戶揀試用方案。
