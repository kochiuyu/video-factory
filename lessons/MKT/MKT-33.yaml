  s1_en: >-
    The trial has three 20-minute sessions on separate days: attempt a short dialogue, practise with feedback,
    then retry and compare. The goal is an informed assessment of that cycle, not maximum registrations
    or pressured subscriptions.
  s1_zh: 试用有三节二十分钟的课，分三天上：先试一段对话，再按反馈练习，最后重做并比较。目标是让用户能评估这个流程，不是追求登记人数，更不是催人订阅。
  s1_zh_hk: 試用有三節二十分鐘嘅課，分三日上：先試一段對話，再按回饋練習，最後重做再比較。目標係等用戶評估成個流程，唔係追求登記人數，更唔係催人訂閱。
  s2_en: >-
    A expires at the end of day 7. B ends after the third completed session, or at the end of day 21,
    whichever comes first. A fixed 2,000 Singapore-dollar quote covers either design, with no card, billing
    or automatic renewal.
  s2_zh: >-
    A 方案在第七天结束时到期；B 方案在完成第三节课后，或第二十一天结束时终止，以较早者为准。固定报价两千新加坡元足够支付任一方案，不用信用卡，不收费，也不会自动续订。
  s2_zh_hk: >-
    A 方案喺第七日完結嗰陣到期；B 方案喺完成第三節課之後，或者第二十一日完結嗰陣終止，以較早者為準。固定報價兩千新加坡元夠支付任何一個方案，唔使信用卡，唔收費，亦唔會自動續訂。
  s3_en: >-
    The manager favours A, because a seven-day message is simple. The onboarding team has not yet supplied
    setup and availability checks. Do not assume all 100 start practising on signup day.
  s3_zh: >-
    经理倾向 A，因为七天的说法简单易懂。负责新用户入门的团队，还没提供完成设置所需的时间和用户可上课的日期。不要假定一百人都会在登记当天开始练习。
  s3_zh_hk: 經理傾向 A，因為七日嘅講法簡單易明。負責新用戶入門嘅團隊，仲未交代完成設定要幾耐同用戶幾時得閒上堂。唔好假定一百人都會喺登記當日開始練習。
