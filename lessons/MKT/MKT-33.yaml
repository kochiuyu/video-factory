  title_en: A or B, and what evidence?
  title_zh: 选 A 还是 B？要什么证据？
  title_zh_hk: 選 A 還是 B？要甚麼證據？
  en: >-
    Which trial would you provisionally choose, and what timing evidence would you request before calling
    seven days enough? Distinguish account access from an opportunity to experience all three sessions.
    Pause and vote.
  zh: 你初步会选哪个方案？在认定七天足够之前，你会要哪些时间方面的信息？请区分开通账户，和有机会体验完整的三节课。请暂停，投个票。
  zh_hk: 你初步會揀邊個方案？喺認定七日夠之前，你會要啲咩時間資料？請分清開通帳戶，同有機會體驗完整三節課。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: When can the newcomers attend?
  title_zh: 新用户哪天能上课？
  title_zh_hk: 新用戶哪天能上課？
  step1_en: >-
    40 people: days 2, 4 and 6
  step1_zh: 40 人：第 2、4、6 日
  step1_zh_hk: 40 人：第 2、4、6 日
  step2_en: >-
    40 people: days 6, 8 and 10
  step2_zh: 40 人：第 6、8、10 日
  step2_zh_hk: 40 人：第 6、8、10 日
  step3_en: >-
    20 people: days 15, 17 and 19
  step3_zh: 20 人：第 15、17、19 日
  step3_zh_hk: 20 人：第 15、17、19 日
  s1_en: >-
    A pre-launch walkthrough records setup needs and stated availability. Forty newcomers can attend on
    days 2, 4 and 6.
  s1_zh: 推出前的流程检查，记录了用户的设置要求和可上课日期。四十人可以在第二、四、六天上课。
  s1_zh_hk: 推出前嘅流程檢查，記錄咗用戶嘅設定要求同得閒上堂嘅日子。四十人可以喺第二、四、六日上堂。
  s2_en: >-
    Forty more can attend on days 6, 8 and 10. Later starts reflect account setup and their own schedules,
    not teaching or support quality.
  s2_zh: 另外四十人可以在第六、八、十天上课。有人较晚开始，是因为账户设置和自己的日程，和教学或支持质量无关。
  s2_zh_hk: 另外四十人可以喺第六、八、十日上堂。有人遲啲先開始，係因為帳戶設定同自己嘅時間表，同教學或者支援質素無關。
  s3_en: >-
    The last twenty can attend only on days 15, 17 and 19. This is a feasibility scenario, not observed
    attendance; assume people attend every feasible session, though real people may skip or leave.
  s3_zh: 最后二十人只能在第十五、十七、十九天上课。这只是可行性情境，不是实际出席记录；计算时假设每人都参加所有可行课时，但现实中有人可能缺席或退出。
  s3_zh_hk: >-
    最後二十人只可以喺第十五、十七、十九日上堂。呢個只係可行性情境，唔係實際出席紀錄；計嘅時候假設個個都上晒所有可行嘅堂，但現實中可能有人缺席或者退出。
