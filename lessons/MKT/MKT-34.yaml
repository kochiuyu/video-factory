  title_en: The same message. Who must agree?
  title_zh: 同一份提案，谁要点头？
  title_zh_hk: 同一份提案，誰要點頭？
  image: art/same-message-who-must-agree-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Organisational purchases can need agreement from people with different responsibilities: technical
    enthusiasm, financial approval and authority to order need not sit with one person. Now you lead account
    sales for LoopCrate, a fictional packaging supplier in Foshan.
  zh: >-
    企业采购往往需要职责不同的几个人都同意：认同技术方案的人，不一定有预算审批权，也不一定有权下单。现在，你带领佛山一家虚构包装供应商 LoopCrate 的客户销售团队。
  zh_hk: >-
    企業採購往往要職責唔同嘅幾個人都同意：認同技術方案嘅人，唔一定有預算審批權，亦唔一定有權落單。而家，你帶領佛山一間虛構包裝供應商 LoopCrate 嘅客戶銷售團隊。
