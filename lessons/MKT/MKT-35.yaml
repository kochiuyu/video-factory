  kicker: MKT-35
  kicker_en: MKT-35
  kicker_zh: MKT-35
  kicker_zh_hk: MKT-35
  title_en: A new product. Added sales or moved sales?
  title_zh: 推出新产品，带来新生意还是转移旧生意？
  title_zh_hk: 推出新產品，帶來新生意還是轉移舊生意？
  image: art/added-sales-or-moved-sales-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Sales of a new variant may come from the brand's existing product, from competitors, or from occasions
    that produced no category purchase before. Now you manage Harbour Crunch, a fictional Hong Kong snack
    brand, deciding whether to launch a premium flavour.
  zh: >-
    新产品的销量，可能来自自家原有产品，可能来自竞争品牌，也可能来自原本不会买这类产品的场合。现在，你管理香港的虚构零食品牌 Harbour Crunch，要决定是否推出一款高端新口味。
  zh_hk: >-
    新產品嘅銷量，可能來自自家原有產品，可能來自競爭品牌，亦可能來自本來唔會買呢類產品嘅場合。而家，你管理香港嘅虛構零食品牌 Harbour Crunch，要決定推唔推出一款高端新口味。
