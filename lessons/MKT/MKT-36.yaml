title_en: Recognised here. Understood there?
title_zh: 香港认得的名字，曼谷也看得懂吗？
title_zh_hk: 香港認得的名字，曼谷也看得懂嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: MKT-36
  kicker_en: MKT-36
  kicker_zh: MKT-36
  kicker_zh_hk: MKT-36
  title_en: Recognised here. Understood there?
  title_zh: 香港认得的名字，曼谷也看得懂吗？
  title_zh_hk: 香港認得的名字，曼谷也看得懂嗎？
  image: art/recognised-here-understood-there-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A name can keep a brand's sound without keeping its meaning for a new audience. Now you manage a fictional
    Hong Kong skincare brand preparing its first Bangkok retail launch of an ordinary moisturiser. Only
    the customer-facing name is still to be decided.
  zh: >-
    品牌名即使保留了读音，到了新市场也不一定能传达同样的含义。现在，你管理一个虚构的香港护肤品牌，正准备首次在曼谷零售一款普通保湿霜。还没决定的，只有顾客看到的产品名称。
  zh_hk: >-
    品牌名就算保留咗讀音，去到新市場都唔一定傳達到同樣嘅意思。而家，你管理一個虛構嘅香港護膚品牌，準備第一次喺曼谷零售一款普通保濕霜。未決定嘅，只係顧客見到嘅產品名稱。
