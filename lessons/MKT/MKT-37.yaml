  kicker_zh_hk: MKT-37
  title_en: A true success story. A typical result?
  title_zh: 成功故事是真的，结果普遍吗？
  title_zh_hk: 成功故事是真的，結果普遍嗎？
  image: art/true-story-typical-result-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    An authentic success story can still invite an unsupported inference about what most buyers should
    expect. Official advertising guidance separates a testimonial's truth from the impression of the whole
    advertisement. Now you manage a campaign for ClearSteps, a fictional Hong Kong tutoring service.
  zh: >-
    成功故事即使是真的，也可能让顾客对一般结果产生没有根据的期望。官方广告指引会区分推荐内容是否真实，以及整份广告给人什么印象。现在，你负责香港虚构补习机构 ClearSteps 的一项宣传。
  zh_hk: >-
    成功故事就算係真嘅，都可能令顧客對一般結果有冇根據嘅期望。官方廣告指引會分開見證內容係咪真確，同成份廣告畀人咩印象。而家，你負責香港虛構補習社 ClearSteps 嘅一個宣傳。
