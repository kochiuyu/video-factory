  c11_en: Same 20% discount for all
  c11_zh: 所有人同一个八折优惠
  c11_zh_hk: 所有人同一個八折優惠
  c12: HK$1,500
  c21_en: Remedy matched to reason
  c21_zh: 按原因提供对应方案
