  s1_en: >-
    120 adults ended their monthly membership in the last four weeks, each recording one main non-medical
    reason. Twenty have opted out of all marketing and must receive nothing; the other hundred permit
    one studio email this month.
  s1_zh: >-
    过去四周，有一百二十名成年人结束了月费会籍，每人都填了一项与医疗无关的主要原因。其中二十人选择不接收任何营销信息，绝对不能联系；其余一百人同意本月接收一封健身房的邮件。
  s1_zh_hk: >-
    過去四個星期，有一百二十個成年人停咗月費會籍，每人都填咗一個同醫療無關嘅主要原因。當中二十人揀咗唔收任何推廣，絕對唔可以聯絡；其餘一百人同意今個月收一封健身室嘅電郵。
  s2_en: >-
    D sends one identical email offering 20 percent off the first returning month, 480 instead of 600
    dollars. M sends reason-matched versions, and no email when no relevant remedy exists.
  s2_zh: D 方案给所有人发同一封邮件，重新入会首月八折，从六百元减到四百八十元。M 方案按退会原因准备不同版本；如果没有对应的解决办法，就不发。
  s2_zh_hk: D 方案畀所有人發同一封電郵，重新入會第一個月八折，由六百蚊減到四百八十蚊。M 方案按退會原因準備唔同版本；如果冇對應嘅解決辦法，就唔發。
  s3_en: >-
    Each discount costs 120 dollars per redemption, and no return rate is known. Staff have not yet reconciled
    the reasons with permissions or the approved timetable, and no plan may claim an unapproved service
    change.
  s3_zh: >-
    每兑现一次折扣，就少收一百二十元，而且回流率还不知道。职员还没把退会原因、联系许可和已批准的时间表逐项核对；任何方案都不能宣称尚未批准的服务改变。
  s3_zh_hk: >-
    每兌現一次折扣，就少收一百二十蚊，而且回流率仲未知。職員仲未將退會原因、聯絡許可同已批准嘅時間表逐項核對；任何方案都唔可以話有未批准嘅服務改變。
