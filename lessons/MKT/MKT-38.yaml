  title_en: The customer left. Which offer deserves a return?
  title_zh: 顾客离开了，什么才值得他们回来？
  title_zh_hk: 顧客離開了，甚麼才值得他們回來？
  image: art/why-the-member-left-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Customer win-back research separates the reason a relationship ended from the offer used to restart
    it: a discount and a repaired service barrier are not interchangeable. Now you manage Harbour Step,
    a fictional Hong Kong fitness studio.
  zh: >-
    顾客挽回的研究，把关系中断的原因，和重新建立关系的邀请分开来看：折扣并不能代替修复服务上的障碍。现在，你管理香港一家虚构的健身房 Harbour Step。
  zh_hk: >-
    顧客挽回嘅研究，將關係斷咗嘅原因，同重新建立關係嘅邀請分開嚟睇：折扣代替唔到修補服務上嘅障礙。而家，你管理香港一間虛構嘅健身室 Harbour Step。
