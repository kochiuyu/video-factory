  title_en: D or M provisionally?
  title_zh: 暂选 D 还是 M？
  title_zh_hk: 暫選 D 還是 M？
  en: >-
    Which campaign would you prepare provisionally? What must you learn about why people left, and what
    the studio can genuinely change? Separate permission to contact someone from evidence that a discount
    solves their problem. Pause and vote.
  zh: >-
    你会暂时准备哪个方案？关于大家为什么离开、健身房实际能改变什么，你还需要了解什么？请区分获准联系，和有证据显示折扣能解决对方的问题。请暂停，投个票。
  zh_hk: >-
    你會暫時準備邊個方案？關於大家點解走、健身室實際可以改變啲咩，你仲要知道啲咩？請分清獲准聯絡，同有證據顯示折扣解決到對方嘅問題。暫停，投個票。
