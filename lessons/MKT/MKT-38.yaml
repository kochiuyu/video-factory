- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Start with who can be contacted
  title_zh: 先算清可以联系谁
  title_zh_hk: 先算清可以聯絡誰
  step1_en: 68 timetable · 24 price · 8 moved
  step1_zh: 时间 68 · 价格 24 · 搬迁 8
  step1_zh_hk: 時間 68 · 價格 24 · 搬遷 8
  step2_en: >-
    Timetable leavers: 68%, not 80%
  step2_zh: 时间原因：占 68%，不是 80%
  step2_zh_hk: 時間原因：佔 68%，不是 80%
  step3_en: M sends at most 92 emails
  step3_zh: M 最多发 92 封
  step3_zh_hk: M 最多發 92 封
  s1_en: >-
    Timetable: 80 minus 12 is 68. Price: 30 minus 6 is 24. Relocation: 10 minus 2 is 8. That is one hundred
    authorised contacts, and the twenty opt-outs stay suppressed.
  s1_zh: 时间原因：八十减十二，是六十八人。价格原因：三十减六，是二十四人。搬迁：十减二，是八人。合计一百人获准联系，二十名退订者仍然排除在外。
  s1_zh_hk: 時間原因：八十減十二，係六十八人。價錢原因：三十減六，係二十四人。搬遷：十減二，係八人。加埋一百人獲准聯絡，二十個退訂嘅人仍然排除在外。
  s2_en: >-
    Timetable leavers are 68 percent of that authorised audience, not 80. These counts describe this fictional
    cohort, not the fitness market.
  s2_zh: 时间原因退会者占获准联系者的百分之六十八，不是百分之八十。这些只是虚构组别的数字，不代表健身市场。
  s2_zh_hk: 時間原因退會者佔獲准聯絡者嘅百分之六十八，唔係百分之八十。呢啲只係虛構組別嘅數字，唔代表健身市場。
  s3_en: >-
    M can send one relevant email to each of the 68 and the 24, ninety-two at most, and none to the eight
    who moved. A smaller send total is not itself evidence of higher effectiveness.
  s3_zh: M 可以给六十八人和二十四人各发一封相关的邮件，最多九十二封；搬走的八人不发。发得少，本身并不证明效果更好。
  s3_zh_hk: M 可以畀六十八人同二十四人各發一封相關嘅電郵，最多九十二封；搬走咗嗰八個唔發。發得少，本身唔證明效果好啲。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Match the barrier or send none
  title_zh: 对准障碍，否则不发
  title_zh_hk: 對準障礙，否則不發
  step1_en: >-
    Timetable: 6 pm returns Mon and Wed
  step1_zh: 时间：周一、周三恢复 6 时课
  step1_zh_hk: 時間：周一、周三恢復 6 時課
  step2_en: >-
    Price: HK$480 first month, then HK$600
  step2_zh: 价格：首月 HK$480，之后 HK$600
  step2_zh_hk: 價格：首月 HK$480，之後 HK$600
  step3_en: >-
    Moved: no email, no invented branch
  step3_zh: 搬迁：不发，不编造分店
  step3_zh_hk: 搬遷：不發，不編造分店
  s1_en: >-
    For timetable leavers, lead with the genuine change: 6 pm classes return on Mondays and Wednesdays
    next month. Disclose the 600-dollar price, and do not claim a discount alone creates a feasible class.
  s1_zh: 对时间原因退会者，要突出真正的改变：下个月起，周一和周三恢复下午六点的课程。同时说明月费六百元，不要宣称单靠折扣就能有合适的课。
  s1_zh_hk: 對時間原因退會者，要突出真正嘅改變：下個月起，星期一同星期三恢復晏晝六點嘅堂。同時講明月費六百蚊，唔好話淨係靠折扣就有啱嘅堂。
  s2_en: >-
    For price leavers, offer the approved 480-dollar first month, with the later 600-dollar price and
    fresh-purchase terms clear. A temporary reduction does not establish affordability after it ends.
  s2_zh: 对价格原因退会者，可以提供已批准的首月四百八十元，并清楚列出之后的原价六百元和需要重新购买的条款。短期减价，不代表优惠结束后仍然负担得起。
  s2_zh_hk: 對價錢原因退會者，可以提供已批准嘅第一個月四百八十蚊，再清楚列出之後原價六百蚊同要重新購買嘅條款。短期減價，唔代表優惠完咗之後仲負擔得起。
  s3_en: >-
    For the relocated, no message is the appropriate branch: do not invent an online class or nearby branch.
    Records support a reason-matched hypothesis, not permanent labels.
  s3_zh: 对搬走的人，最合适的做法就是不发：不要凭空编造线上课程或附近分店。这些记录只能支持按原因配对的假设，不应变成永久标签。
  s3_zh_hk: 對搬走咗嘅人，最啱嘅做法就係唔發：唔好作個網上課程或者附近分店出嚟。呢啲紀錄只係支持按原因配對嘅假設，唔應該變成永久標籤。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Compare the campaigns honestly
  title_zh: 如实比较整个方案
  title_zh_hk: 如實比較整個方案
  en: >-
    M fits the supplied reasons better, but D is cheaper and can still link to the same schedule. The
    restored timetable is a real service change under both plans, not a benefit of segmentation. M's extra
    1,500 dollars and any 120-dollar discounts stay visible, and no data support a profit calculation.
  zh: >-
    M 更贴合题目给出的退会原因，但 D 准备成本较低，也可以附上同样的时间表链接。恢复课程是两个方案共有的实际服务改善，不是分组营销带来的好处。M 多花的一千五百元和每次一百二十元的折扣都要列明，现有数据也不足以计算利润。
  zh_hk: >-
    M 比較貼合題目畀嘅退會原因，但 D 準備成本平啲，亦可以附上同一個時間表連結。恢復堂係兩個方案都有嘅實際服務改善，唔係分組推廣帶嚟嘅好處。M 多使嘅一千五百蚊同每次一百二十蚊嘅折扣都要列明，現有數據亦唔夠計利潤。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: A return ≠ an incremental return
  title_zh: 有人回来 ≠ 推广令人回来
  title_zh_hk: 有人回來 ≠ 推廣令人回來
  q1_en: Track returns and redemptions by reason
  q1_zh: 按原因记录回流和兑现
  q1_zh_hk: 按原因記錄回流和兌現
  q2_en: Never multiply 92 by an invented rate
  q2_zh: 别用 92 乘自创转化率
  q2_zh_hk: 別用 92 乘自創轉化率
  s1_en: >-
    A click is not a renewed membership, and a return after an email is not necessarily caused by it:
    the public timetable could attract people who were never contacted.
  s1_zh: 点击不等于续会；收到邮件后回来的人，也不一定是邮件促成的，因为公开的新时间表本身就可能吸引没被联系过的人。
  s1_zh_hk: 撳咗連結唔等於續會；收到電郵之後返嚟嘅人，亦唔一定係電郵促成，因為公開嘅新時間表本身都可能吸引冇被聯絡過嘅人。
  s2_en: >-
    A future authorised test could randomise versions or a no-email comparison within reason groups.
  s2_zh: 日后如获授权，可以在同一原因组内随机比较不同版本，或设不发邮件的对照组。
  s2_zh_hk: 日後如果有授權，可以喺同一原因組入面隨機比較唔同版本，或者設唔發電郵嘅對照組。
  s3_en: >-
    Harbour Step, its records and the campaign are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: Harbour Step、记录和推广方案都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: Harbour Step、紀錄同推廣方案都係虛構嘅。官方場景圖只係教學插圖。
