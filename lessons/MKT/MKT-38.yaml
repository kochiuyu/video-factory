  title_en: Three reasons, three barriers
  title_zh: 三种原因，三种障碍
  title_zh_hk: 三種原因，三種障礙
  step1_en: >-
    6 pm classes removed: 80, 12 opted out
  step1_zh: 取消 6 时课堂：80 人，12 人退订
  step1_zh_hk: 取消 6 時課堂：80 人，12 人退訂
  step2_en: >-
    Monthly price: 30, 6 opted out
  step2_zh: 月费太高：30 人，6 人退订
  step2_zh_hk: 月費太高：30 人，6 人退訂
  step3_en: >-
    Moved away: 10, 2 opted out
  step3_zh: 搬得太远：10 人，2 人退订
  step3_zh_hk: 搬得太遠：10 人，2 人退訂
  s1_en: >-
    Eighty left after the studio removed its 6 pm classes, and twelve of them opted out. Operations has
    now approved and funded 6 pm classes on Mondays and Wednesdays from next month, with capacity for
    all of them.
  s1_zh: >-
    有八十人是在健身房取消下午六点课程后退会的，其中十二人退订。运营部现在已批准并拨款，从下个月起恢复每周一和周三下午六点的课程，名额足够所有人回来。
  s1_zh_hk: >-
    有八十人係喺健身室取消晏晝六點嘅堂之後退會，當中十二人退訂。營運部而家已經批准兼撥款，由下個月起恢復逢星期一同星期三晏晝六點嘅堂，名額夠晒所有人返嚟。
  s2_en: >-
    Thirty cited the monthly price, and six opted out. The contactable price leavers say the current class
    times work for them.
  s2_zh: 有三十人说月费太贵，其中六人退订。可以联系的价格原因退会者表示，现有的上课时间对他们合适。
  s2_zh_hk: 有三十人話月費太貴，當中六人退訂。可以聯絡嘅價錢原因退會者話，現有嘅上堂時間啱佢哋。
  s3_en: >-
    Ten moved beyond practical travelling distance, and two opted out. The studio has no online service,
    nearby partner or planned branch to offer them, and no experimental evidence about either email.
  s3_zh: 有十人搬到了难以往返的地方，其中两人退订。健身房没有线上课程、附近的合作方或计划中的分店可以提供，对两种邮件也没有任何实验证据。
  s3_zh_hk: 有十人搬咗去好難來回嘅地方，當中兩人退訂。健身室冇網上課程、附近合作夥伴或者計劃中嘅分店可以提供，對兩種電郵亦冇任何實驗證據。
