  seconds: 22
  kicker: MKT-39
  kicker_en: MKT-39
  kicker_zh: MKT-39
  kicker_zh_hk: MKT-39
  title_en: More stockists. More of the category market?
  title_zh: 多了零售点，就覆盖更多品类销售吗？
  title_zh_hk: 多了零售點，就覆蓋更多品類銷售嗎？
  image: art/more-stockists-more-category-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Retail distribution can count how many outlets carry a brand, or how much category spending those
    outlets represent. Neither tells us what shoppers will buy. Now you plan distribution for Harbour
    Spoon, a fictional Hong Kong sauce brand.
  zh: >-
    衡量零售分销，可以数有多少零售点在卖某个品牌，也可以看这些零售点占整个品类消费多少。两者都不能告诉我们顾客会买多少。现在，你为香港虚构的酱料品牌 Harbour Spoon 规划分销。
  zh_hk: >-
    量度零售分銷，可以數有幾多個零售點賣某個品牌，亦可以睇呢啲零售點佔成個品類消費幾多。兩樣都講唔到顧客會買幾多。而家，你為香港虛構嘅醬料品牌 Harbour Spoon 規劃分銷。
