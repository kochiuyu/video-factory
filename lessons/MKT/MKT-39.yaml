  s1_en: >-
    The defined market has exactly one hundred physical outlets selling this sauce category, and ten already
    stock Harbour Spoon. The plan keeps those ten and adds package M, thirty small stockists, or package
    L, ten larger ones.
  s1_zh: >-
    题目界定的市场，刚好有一百家出售这类酱料的实体零售点，其中十家已经在卖 Harbour Spoon。计划保留这十家，再选 M 方案，增加三十家较小的零售点，或者 L 方案，增加十家较大的。
  s1_zh_hk: >-
    題目界定嘅市場，啱啱好有一百間賣呢類醬料嘅實體零售點，當中十間已經賣緊 Harbour Spoon。計劃保留呢十間，再揀 M 方案，加三十間細啲嘅零售點，或者 L 方案，加十間大啲嘅。
  s2_en: >-
    The groups do not overlap, and the other fifty outlets are unavailable this quarter. Each indivisible
    package costs 60,000 dollars, the whole incremental budget, with equal shelf support and no out-of-stocks.
  s2_zh: 各组网点互不重叠，其余五十家这个季度无法加入。每个方案不能拆分，都要花六万元，用尽全部新增预算；货架支持相同，也不会缺货。
  s2_zh_hk: 各組網點互不重疊，其餘五十間今季加入唔到。每個方案唔可以拆開，都要使六萬蚊，用晒成筆新增預算；貨架支援一樣，亦唔會缺貨。
  s3_en: >-
    The objective is to maximise access to category spending, using one consistent historical benchmark.
    A colleague proposes M because it adds three times as many outlets. Brand sales, margins and conversion
    in the proposed stores are unknown.
  s3_zh: >-
    目标是按同一个历史基准，尽量覆盖更多品类消费额。同事主张选 M，因为新增的网点是 L 的三倍。至于候选门店里的品牌销量、利润率和购买转化率，目前都不知道。
  s3_zh_hk: >-
    目標係按同一個歷史基準，盡量覆蓋多啲品類消費額。同事主張揀 M，因為新增嘅網點係 L 嘅三倍。至於候選店舖入面嘅品牌銷量、利潤率同購買轉化率，而家都唔知道。
