  title_zh: 暂选 M 还是 L？
  title_zh_hk: 暫選 M 還是 L？
  en: >-
    Which package would you provisionally favour? Calculate each plan's percentage of outlets carrying
    the sauce. What further evidence would you need to judge the category-spending objective, and what
    would still be missing for a profit forecast? Pause and vote.
  zh: >-
    你初步倾向哪个方案？算一算，两个方案各有百分之几的网点会卖这款酱料。要判断是否达到品类消费的覆盖目标，还需要什么数据？要预测利润，又还缺什么？请暂停，投个票。
  zh_hk: >-
    你初步傾向邊個方案？計一計，兩個方案各有百分之幾嘅網點會賣呢款醬料。要判斷係咪達到品類消費嘅覆蓋目標，仲需要啲咩數據？要預測利潤，又仲欠啲咩？暫停，投個票。
- id: reveal
