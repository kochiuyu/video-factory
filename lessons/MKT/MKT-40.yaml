  step1_zh_hk: 4 人提供 120 則中的 96 則
  step2_en: >-
    Next month: 36 + 24 = 60 intended
  step2_zh: 下月意向：36 + 24 = 60 则
  step2_zh_hk: 下月意向：36 + 24 = 60 則
  step3_en: >-
    Threads: A 180, B 120 · 20 min each
  step3_zh: 帖数：A 180、B 120 · 每则 20 分钟
  step3_zh_hk: 帖數：A 180、B 120 · 每則 20 分鐘
  s1_en: >-
    Four members supplied 96 of last month's 120 counted answers, and sixteen others supplied 24. The
    four say the current pace is too demanding.
  s1_zh: 上个月计入的一百二十个回答中，有九十六个来自四位会员，另外二十四个来自十六位会员。那四位觉得现在的节奏太吃力。
  s1_zh_hk: 上個月計入嘅一百二十個回答入面，有九十六個嚟自四位會員，另外二十四個嚟自十六位會員。嗰四位覺得而家嘅節奏太辛苦。
  s2_en: >-
    The four freely indicate capacity for only 36 answers next month, and the sixteen for 24: sixty in
    total. These are intentions, not commitments or diagnoses of burnout.
  s2_zh: 那四位自愿表示，下个月只能答三十六个，其余十六位表示能答二十四个，合计六十个。这些只是意向，不是工作承诺，也不是对职业倦怠的诊断。
  s2_zh_hk: 嗰四位自願表示，下個月淨係答到三十六個，其餘十六位表示答到二十四個，加埋六十個。呢啲只係意向，唔係工作承諾，亦唔係對職業倦怠嘅診斷。
  s3_en: >-
    Each staff answer takes twenty minutes. Under A, recruitment adds sixty threads to the baseline 120,
    giving 180; under B, use 120. Required moderation and customer service are protected either way.
  s3_zh: >-
    每个员工回答要花二十分钟。A 的招募估计会在一百二十个的基础上多带来六十个帖，共一百八十个；B 按一百二十个计算。无论选哪个，必要的内容管理和客户服务都有保障。
  s3_zh_hk: >-
    每個職員回答要用二十分鐘。A 嘅招募估計會喺一百二十個嘅基礎上多帶嚟六十個帖，總共一百八十個；B 就按一百二十個計。無論揀邊個，必要嘅內容管理同客戶服務都有保障。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Pause
