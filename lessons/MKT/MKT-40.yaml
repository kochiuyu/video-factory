  en: >-
    Brand-community research describes relationships among members, not only links to a seller. Participation
    can be concentrated, and newcomers need support. Now you run the community for Paperloop, a fictional
    Hong Kong craft-tool brand.
  zh: >-
    品牌社群研究不只看会员和商家的关系，也看会员之间怎样联系。参与往往集中在少数人身上，新成员也需要支持。现在，你负责香港虚构手作工具品牌 Paperloop 的社群。
  zh_hk: >-
    品牌社群研究唔只睇會員同商家嘅關係，亦睇會員之間點樣聯繫。參與往往集中喺少數人身上，新成員亦需要支援。而家，你負責香港虛構手作工具品牌 Paperloop 嘅社群。
