  s1_en: >-
    Paperloop runs an optional adult community for sharing paper-layout ideas, with 1,000 registered members.
    Safety, warranty and contractual support go to separately funded staff, and ordinary moderation stays
    fully funded.
  s1_zh: >-
    Paperloop 经营一个成年人自愿参加的社群，分享纸艺排版创意，共有一千名注册会员。工具安全、保修和合约规定的客户支持，由另有预算的员工处理；日常内容管理也有足够预算。
  s1_zh_hk: >-
    Paperloop 經營一個成年人自願參加嘅社群，分享紙藝排版創意，有一千個註冊會員。工具安全、保養同合約訂明嘅客戶支援，由另有預算嘅職員處理；日常內容管理亦有足夠預算。
  s2_en: >-
    Next month you have twenty-four extra paid staff hours. A uses sixteen recruiting and eight answering
    creative threads. B uses four improving newcomer guidance and examples, and twenty answering.
  s2_zh: 下个月，你有额外二十四小时的有薪社群人手。A 用十六小时招募会员、八小时回答创作讨论帖；B 用四小时改善新人指引和示例，二十小时回答。
  s2_zh_hk: 下個月，你有額外二十四個鐘嘅有薪社群人手。A 用十六個鐘招募會員、八個鐘回答創作討論帖；B 用四個鐘改善新人指引同示例，二十個鐘回答。
  s3_en: >-
    A estimates 200 additional registrations. Last month, 120 eligible threads each got a helpful first
    answer within seven days. The dashboard shows neither who answered nor their future availability.
  s3_zh: >-
    A 估计会多两百人注册。上个月，一百二十个符合条件的讨论帖，每个都在七天内得到第一个有帮助的回答。但报表既没显示是谁回答的，也没说明他们以后能投入多少时间。
  s3_zh_hk: >-
    A 估計會多兩百人登記。上個月，一百二十個符合條件嘅討論帖，每個都喺七日內得到第一個有幫助嘅回答。但報表冇顯示係邊個答，亦冇講佢哋之後可以投入幾多時間。
