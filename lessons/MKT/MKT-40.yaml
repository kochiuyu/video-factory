  en: >-
    Would you choose A or B provisionally? Before treating 200 new registrations as community success,
    what would you need to know about who supplies helpful answers, and what they freely want to contribute?
    Pause and vote.
  zh: 你会暂时选 A 还是 B？在把新增两百人当成社群的成绩之前，关于是谁在提供有用的回答、他们自愿投入多少，你还需要知道什么？请暂停，投个票。
  zh_hk: 你會暫時揀 A 定 B？喺將新增兩百人當成社群嘅成績之前，關於係邊個提供有用嘅回答、佢哋自願投入幾多，你仲要知道啲咩？暫停，投個票。
