  en: >-
    Hong Kong's Consumer Council and Centre for Food Safety have tested sugars in bottled drinks. These
    dated examples show why shoppers must read the unit next to a number. Now you choose a front panel
    for Harbour Leaf, a fictional green tea brand.
  zh: >-
    香港消费者委员会和食物安全中心都检测过瓶装饮品的糖含量。这些历史例子提醒我们，看数字时也要看清单位。现在，你要为虚构的绿茶品牌 Harbour Leaf 选定包装正面设计。
  zh_hk: >-
    香港消費者委員會同食物安全中心都檢測過樽裝飲品嘅糖含量。呢啲歷史例子提醒我哋，睇數字嗰陣要睇清楚單位。而家，你要為虛構嘅綠茶品牌 Harbour Leaf 揀包裝正面設計。
