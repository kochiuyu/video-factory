- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲解
  kicker_zh_hk: 講解
  title_en: Compare like with like
  title_zh: 用同一基准比较
  title_zh_hk: 用同一基準比較
  step1_en: >-
    Per 100 mL: 13 − 7 = 6 g, about 46% less
  step1_zh: 每 100 毫升：少 6 克，约 46%
  step1_zh_hk: 每 100 毫升：少 6 克，約 46%
  step2_en: >-
    Per bottle: 42.9 g → 45.5 g, +2.6 g
  step2_zh: 每瓶：42.9 克 → 45.5 克，多 2.6 克
  step2_zh_hk: 每瓶：42.9 克 → 45.5 克，多 2.6 克
  step3_en: >-
    Not low in sugars: above 5 g/100 mL
  step3_zh: 不算低糖：高于每 100 毫升 5 克
  step3_zh_hk: 不算低糖：高於每 100 毫升 5 克
  s1_en: >-
    At equal volume the difference is 13 minus 7, which is 6 grams per 100 millilitres, or about 46 percent
    lower than Classic.
  s1_zh: 按相同容量算，十三减七，每一百毫升少了六克，比经典款少大约百分之四十六。
  s1_zh_hk: 按相同容量計，十三減七，每一百毫升少咗六克，比經典款少大約百分之四十六。
  s2_en: >-
    But the old bottle contains 13 times 3.3, which is 42.9 grams; the new one contains 7 times 6.5, which
    is 45.5 grams, 2.6 grams more per bottle. Lower concentration and lower total content are different
    claims.
  s2_zh: >-
    但是旧装整瓶含糖十三乘三点三，等于四十二点九克；新装是七乘六点五，等于四十五点五克，每瓶多了二点六克。浓度较低和整瓶糖量较少，是两种不同的声称。
  s2_zh_hk: >-
    但係舊裝成樽含糖十三乘三點三，即係四十二點九克；新裝係七乘六點五，即係四十五點五克，每樽多咗二點六克。濃度低咗同成樽糖量少咗，係兩種唔同嘅聲稱。
  s3_en: >-
    The concentration meets both numerical difference tests, 25 percent relative and 5 grams absolute,
    but the recipe is not low in sugars under the 5-gram limit. The test does not clear the packaging
    for legal use.
  s3_zh: >-
    按浓度计算，新配方达到了比较声称的两项数值门槛：相对少百分之二十五，绝对少五克。但它每一百毫升超过五克，不能称为低糖。这个测试也不代表包装已获准使用。
  s3_zh_hk: >-
    按濃度計，新配方達到比較聲稱嘅兩項數值門檻：相對少百分之二十五，絕對少五克。但佢每一百毫升超過五克，唔可以叫低糖。呢個測試亦唔代表包裝已經可以合法使用。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Both gates, channel by channel
  title_zh: 两道门槛，逐个渠道看
  title_zh_hk: 兩道門檻，逐個渠道看
  step1_en: >-
    Shelf: A fails (39 wrong); B passes
  step1_zh: 货架：A 不达标（39 人答错）；B 达标
  step1_zh_hk: 貨架：A 不達標（39 人答錯）；B 達標
  step2_en: >-
    Phone: cropped B fails at 16; C passes
  step2_zh: 手机：裁切 B 16 人答错；C 达标
  step2_zh_hk: 手機：裁切 B 16 人答錯；C 達標
  step3_en: >-
    Pooled B: 23/200 = 11.5% hides 16%
  step3_zh: 合并 B：23/200 = 11.5%，掩盖 16%
  step3_zh_hk: 合併 B：23/200 = 11.5%，掩蓋 16%
  s1_en: >-
    On the shelf, A wins on stated interest, 74 against 61, but fails the comprehension gate, because
    39 exceeds 12. B reaches both targets, 61 and 7.
  s1_zh: >-
    在货架上，A 款表示有兴趣的人较多，七十四对六十一，但三十九人答错，超过十二人，没有通过理解门槛。B 款两项都达标，六十一人有兴趣，七人答错。
  s1_zh_hk: 喺貨架上，A 款話有興趣嘅人多啲，七十四對六十一，但有三十九人答錯，超過十二人，過唔到理解門檻。B 款兩項都達標，六十一人有興趣，七人答錯。
  s2_en: >-
    On phones, cropped B misses the comprehension gate with 16 false inferences, while C meets both targets
    at 60 and 9.
  s2_zh: 在手机页面，裁切后的 B 款有十六人判断错误，没有通过理解门槛；C 款以六十人有兴趣、九人答错，两项都达标。
  s2_zh_hk: 喺手機商品頁，裁切後嘅 B 款有十六人判斷錯，過唔到理解門檻；C 款有六十人有興趣、九人答錯，兩項都達標。
  s3_en: >-
    Pooled B shows 23 wrong answers in 200, or 11.5 percent, so it appears to pass. That hides a 16 percent
    error rate on phones, where the team must decide separately.
  s3_zh: >-
    如果把 B 款两组合并，两百人中有二十三人答错，即百分之十一点五，看起来就达标了。但这掩盖了手机渠道百分之十六的错误率，而团队必须为每个渠道分开作决定。
  s3_zh_hk: >-
    如果將 B 款兩組加埋，兩百人入面有二十三人答錯，即係百分之十一點五，睇落就達標。但係咁樣遮住咗手機渠道百分之十六嘅錯誤率，而團隊要為每個渠道分開決定。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A bigger test, not a print run
  title_zh: 先做更大规模测试，不是印刷
  title_zh_hk: 先做更大規模測試，不是印刷
  en: >-
    Advance B on the shelf and C on phones to a larger follow-up, not to a print order. One fewer interested
    phone respondent would put C below the interest cutoff, so report each channel and use a fresh comparable
    sample.
  zh: >-
    让货架版 B 和手机版 C 进入规模更大的后续测试，而不是马上下单印刷。手机测试只要少一个人有兴趣，C 款就会低于门槛，所以要按渠道分开报告，并找一批可比较的新样本。
  zh_hk: >-
    等貨架版 B 同手機版 C 入規模大啲嘅後續測試，而唔係即刻落單印刷。手機測試只要少一個人有興趣，C 款就會跌落門檻以下，所以要按渠道分開報告，再搵一批可以比較嘅新樣本。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Read the unit by every number
  title_zh: 看数字，先看单位
  title_zh_hk: 看數字，先看單位
  q1_en: Per 100 mL ≠ per bottle
  q1_zh: 每 100 毫升 ≠ 每瓶
  q1_zh_hk: 每 100 毫升 ≠ 每瓶
  q2_en: Stated interest ≠ actual purchase
  q2_zh: 自述意向 ≠ 实际购买
  q2_zh_hk: 自述意向 ≠ 實際購買
  s1_en: >-
    Lower sugar per 100 millilitres can still mean more sugar per bottle, so a front panel should show
    both bases clearly.
  s1_zh: 每一百毫升的糖少了，整瓶的糖仍然可能更多，所以包装正面应该把两种基准都清楚列出。
  s1_zh_hk: 每一百毫升嘅糖少咗，成樽嘅糖都可能多咗，所以包裝正面應該將兩種基準都清楚列出。
  s2_en: >-
    A quick stated-interest result does not measure actual purchases or repeat behaviour; capture real
    choices where possible.
  s2_zh: 简短测试只反映受访者自述的意向，不能衡量实际购买或回购；应尽可能记录真实的选择。
  s2_zh_hk: 簡短測試只係反映受訪者自己講嘅意向，量度唔到實際購買或者回購；應該盡量記錄真實嘅選擇。
  s3_en: >-
    Harbour Leaf, its packs and all test results are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: Harbour Leaf、包装和所有测试结果都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: Harbour Leaf、包裝同所有測試結果都係虛構嘅。官方場景圖只係教學插圖。
duration_target_s: 196
