  en: >-
    On the shelf, A got 74 interested and 39 wrong; B got 61 and 7. How much lower is the sugar per 100
    millilitres, and does the whole new bottle contain less sugar? Under the team's two rules, which design
    should go to the next test? Pause and vote.
  zh: >-
    货架测试中，A 款有七十四人有兴趣、三十九人答错；B 款是六十一人和七人。每一百毫升少了多少糖？新装整瓶的糖也比较少吗？按照团队的两条规则，哪款设计应该进入下一轮测试？请暂停，投个票。
  zh_hk: >-
    貨架測試入面，A 款有七十四人有興趣、三十九人答錯；B 款係六十一人同七人。每一百毫升少咗幾多糖？新裝成樽嘅糖又係咪少咗？按團隊嘅兩條規則，邊款設計應該入下一輪測試？暫停，投個票。
