  step1_en: Cropped B hides the whole-bottle line
  step1_zh: 裁切后的 B 看不到整瓶数字
  step1_zh_hk: 裁切後的 B 看不到整瓶數字
  step2_en: >-
    Cropped B: 64 interested, 16 wrong
  step2_zh: 裁切 B：64 人有兴趣，16 人答错
  step2_zh_hk: 裁切 B：64 人有興趣，16 人答錯
  step3_en: >-
    C, both values first: 60 and 9
  step3_zh: C 首屏两个数字：60 人和 9 人
  step3_zh_hk: C 首屏兩個數字：60 人和 9 人
  s1_en: >-
    A mobile retailer trims the image in its product listing. B still shows the 100-millilitre figure,
    but the whole-bottle line is hidden on first view.
  s1_zh: 有零售商在手机端的商品页面裁切了图片。B 款仍然看得到每一百毫升的数字，但顾客第一次打开页面时，看不到整瓶的数字。
  s1_zh_hk: 有零售商喺手機商品頁裁切咗圖片。B 款仲睇到每一百毫升嘅數字，但係顧客第一次打開頁面嗰陣，睇唔到成樽嘅數字。
  s2_en: >-
    In a new fictional phone test with the same targets, applied to each phone design separately, cropped
    B gets 64 interested and 16 wrong whole-bottle answers.
  s2_zh: 在另一项虚构的手机测试中，门槛不变，每款手机设计分开评估。裁切后的 B 款有六十四人有兴趣，十六人对整瓶糖量判断错误。
  s2_zh_hk: 喺另一個虛構嘅手機測試入面，門檻唔變，每款手機設計分開評估。裁切後嘅 B 款有六十四人有興趣，十六人對成樽糖量判斷錯咗。
  s3_en: >-
    Design C puts both values in plain listing text before the image. It gets 60 interested and 9 wrong
    answers.
  s3_zh: C 款直接在图片上方的商品说明里列出两个数字，结果是六十人有兴趣，九人答错。
  s3_zh_hk: C 款直接喺圖片上面嘅商品說明列出兩個數字，結果係六十人有興趣，九人答錯。
