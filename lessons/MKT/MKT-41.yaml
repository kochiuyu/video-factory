  s1_en: >-
    Harbour Leaf plans a reformulated green tea in a larger bottle. Classic has 13 grams of sugar per
    100 millilitres in a 330-millilitre bottle; the new recipe has 7 grams per 100 millilitres in a 650-millilitre
    bottle.
  s1_zh: >-
    Harbour Leaf 打算推出改良配方的绿茶，并改用较大的瓶子。经典款每一百毫升含糖十三克，每瓶三百三十毫升；新款每一百毫升含糖七克，每瓶六百五十毫升。
  s1_zh_hk: >-
    Harbour Leaf 打算推出改良配方嘅綠茶，仲改用大啲嘅樽。經典款每一百毫升含糖十三克，每樽三百三十毫升；新款每一百毫升含糖七克，每樽六百五十毫升。
  s2_en: >-
    Design A leads with a comparison against Classic at equal volume. Design B shows two plain readings
    side by side: grams per 100 millilitres and grams per whole new bottle.
  s2_zh: A 款突出新配方和经典款在相同容量下的比较；B 款并列两个易懂的数字：每一百毫升含多少克糖，和新装整瓶含多少克糖。
  s2_zh_hk: A 款突出新配方同經典款喺相同容量下嘅比較；B 款並列兩個易明嘅數字：每一百毫升有幾多克糖，同新裝成樽有幾多克糖。
  s3_en: >-
    In a fictional shelf test, each group of 100 saw one design for three seconds. A design advances only
    if at least 60 are interested and at most 12 wrongly think the whole new bottle has less sugar.
  s3_zh: 在虚构的模拟货架测试中，每组一百人只看一款设计三秒。要进入下一轮，至少要有六十人有兴趣购买，最多十二人误以为新装整瓶比经典款少糖。
  s3_zh_hk: 喺虛構嘅模擬貨架測試入面，每組一百人淨係睇一款設計三秒。要入下一輪，最少要有六十人有興趣買，最多十二人誤以為新裝成樽比經典款少糖。
