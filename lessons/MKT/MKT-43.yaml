  en: >-
    Hong Kong's Consumer Council reported in 2015 that card costs can differ between paying in a shop's
    currency and a cardholder-currency conversion. Now you design checkout for a fictional Shenzhen cookware
    shop.
  zh: 香港消费者委员会在二零一五年指出，用商家当地币种付款，和换算成持卡人币种付款，成本可能不同。现在，你为深圳一家虚构的厨具店设计结账页面。
  zh_hk: 香港消費者委員會喺二零一五年指出，用商戶當地貨幣俾錢，同換算做持卡人貨幣俾錢，成本可能唔同。而家，你為深圳一間虛構嘅廚具店設計結賬頁面。
