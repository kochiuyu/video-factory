  zh: 你会先测试哪个版面？比较两种付款方式的估计金额，再说明顾客在选择之前需要明白什么。请暂停，投个票。
  zh_hk: 你會先測試邊個版面？比較兩種俾錢方式嘅估計金額，再講吓顧客揀之前要明白啲咩。暫停，投個票。
- id: reveal
  visual: steps
  layout: rows
  seconds: 26
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: A mock checkout, then a new rate
  title_zh: 模拟结账，再换汇率
  title_zh_hk: 模擬結賬，再換匯率
  step1_en: >-
    Completions: A 130/200, B 120/200
  step1_zh: 完成：A 130/200，B 120/200
  step1_zh_hk: 完成：A 130/200，B 120/200
  step2_en: >-
    Knew it was an estimate: 128 vs 168
  step2_zh: 知道是估算：128 对 168
  step2_zh_hk: 知道是估算：128 對 168
  step3_en: >-
    Sensitivity: HK$1.13 per RMB
  step3_zh: 敏感度：每元 HK$1.13
  step3_zh_hk: 敏感度：每元 HK$1.13
  s1_en: >-
    In a fictional randomized mock checkout, 200 adult volunteers saw A and 200 saw B. A had 130 mock
    completions and B had 120. Nobody made a purchase.
  s1_zh: >-
    在一项虚构的随机模拟结账中，两百名成年志愿者看 A 版，另外两百名看 B 版。A 版有一百三十人完成模拟结账，B 版有一百二十人。没有人真的购买。
  s1_zh_hk: >-
    喺一個虛構嘅隨機模擬結賬入面，兩百個成年義工睇 A 版，另外兩百個睇 B 版。A 版有一百三十人完成模擬結賬，B 版有一百二十人。冇人真係買嘢。
  s2_en: >-
    Asked of every assigned volunteer, 128 in A and 168 in B correctly said the 550 was an estimate, not
    a guaranteed Hong Kong dollar charge.
  s2_zh: 另外问了每一位志愿者，A 版有一百二十八人、B 版有一百六十八人，正确指出五百五十港元只是估算，不是保证会扣的港元金额。
  s2_zh_hk: 另外問咗每一位義工，A 版有一百二十八人、B 版有一百六十八人，答啱五百五十港元只係估算，唔係保證會扣嘅港元金額。
  s3_en: >-
    For a sensitivity check, suppose the issuer's rate turns out to be 1.13 rather than 1.10. The 1.5
    percent fee and the 572-dollar quote do not change; round to the nearest cent.
  s3_zh: 另作敏感度分析：假设发卡机构的实际汇率是一点一三，而不是一点一。百分之一点五的收费和五百七十二港元的报价都不变；金额四舍五入到分。
  s3_zh_hk: 另外做敏感度分析：假設發卡機構嘅實際匯率係一點一三，唔係一點一。百分之一點五嘅收費同五百七十二港元嘅報價都唔變；金額四捨五入到仙。
