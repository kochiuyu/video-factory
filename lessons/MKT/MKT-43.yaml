  s1_en: >-
    The shop sells one cookware bundle for 500 renminbi, including all shop charges. A visitor with the
    example Hong Kong card may pay in renminbi, or explicitly accept a merchant conversion quote. The
    shop's revenue is the same either way.
  s1_zh: >-
    这家店以人民币五百元出售一套厨具，已包含商家所有收费。持示例香港信用卡的旅客，可以用人民币付款，也可以明确同意商户的换汇报价。两种方式，商家的收入都一样。
  s1_zh_hk: >-
    呢間店用人民幣五百蚊賣一套廚具，已經包晒商戶所有收費。用示例香港信用卡嘅旅客，可以用人民幣俾錢，亦可以明確接受商戶嘅換匯報價。兩種方式，商戶收入都一樣。
  s2_en: >-
    Layout A shows a large 550 Hong Kong dollar reference estimate above the renminbi price. Layout B
    puts renminbi 500 first, with the estimate beside it. Both label the estimate, offer both currencies
    equally and show terms before consent.
  s2_zh: >-
    A 版在人民币五百元上方，用大字显示五百五十港元的参考估算；B 版先列人民币五百元，估算放在旁边。两版都注明这是估算，平等提供两种币种，并在顾客同意前展示条款。
  s2_zh_hk: >-
    A 版喺人民幣五百蚊上面，用大字顯示五百五十港元嘅參考估算；B 版先列人民幣五百蚊，估算放喺旁邊。兩版都註明係估算，平等提供兩種貨幣，仲會喺顧客同意之前顯示條款。
  s3_en: >-
    The 550 is just renminbi 500 at the example rate of 1.10, before the card issuer's 1.5 percent fee.
    The merchant's fixed quote is 572 dollars, including all its conversion charges, with no further issuer
    charge.
  s3_zh: >-
    这五百五十港元，只是把人民币五百元按示例汇率一点一换算，还没计入发卡机构百分之一点五的收费。商户的固定报价是五百七十二港元，已包含全部换汇收费，发卡机构不再另收。
  s3_zh_hk: >-
    呢五百五十港元，只係將人民幣五百蚊按示例匯率一點一換算，未計發卡機構百分之一點五嘅收費。商戶嘅固定報價係五百七十二港元，已經包晒所有換匯收費，發卡機構唔會再收。
