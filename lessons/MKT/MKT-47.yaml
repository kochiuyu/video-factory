  title_en: A control area. Really out of reach?
  title_zh: 对照区没有投放，广告就影响不到它吗？
  title_zh_hk: 對照區沒有投放，廣告就影響不到它嗎？
  image: art/a-holdout-across-the-street-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Hong Kong's Lands Department shows how connected pedestrian routes shape walkable areas, and geographic
    ad experiments must allow for people moving between areas. Now you manage two lunch markets for a
    fictional Hong Kong bakery chain.
  zh: >-
    香港地政总署的 Walkin’HK 显示，相连的步行路线会塑造可步行的范围；按地区做的广告实验，也要考虑人们在不同地区之间走动。现在，你为香港一家虚构的连锁面包店管理两个午餐市场。
  zh_hk: >-
    香港地政總署嘅資料顯示，相連嘅行人路線會影響行得到嘅範圍；按地區做嘅廣告實驗，亦要考慮人喺唔同地區之間行嚟行去。而家，你為香港一間虛構嘅連鎖麵包舖管理兩個午餐市場。
