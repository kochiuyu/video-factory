  title_en: When 100 Tuesday orders arrived
  title_zh: 100 张周二订单何时送到
  title_zh_hk: 100 張星期二訂單何時送到
  row1_en: By Wednesday
  row1_zh: 周三或之前
  row1_zh_hk: 星期三或之前
  row2_en: On Thursday
  row2_zh: 周四当天
  row2_zh_hk: 星期四當日
  row3_en: After Thursday
  row3_zh: 周四之后
  row3_zh_hk: 星期四之後
  col1_en: Count
  col1_zh: 数量
  col1_zh_hk: 數量
