  title_en: Fast dispatch. Here by which day?
  title_zh: 很快发货，究竟哪天送到？
  title_zh_hk: 很快出貨，究竟哪天送到？
  image: art/fast-enough-for-when-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A Hong Kong Consumer Council trial of food-ordering services compared displayed delivery estimates
    with actual arrivals. Dispatch and delivery are different events. Now you write the delivery message
    for a fictional Hong Kong household-goods shop.
  zh: >-
    香港消费者委员会测试外卖平台时，比较了页面显示的预计送达时间和实际送达时间。发货和送达是两回事。现在，你为香港一家虚构的家居用品店撰写送货信息。
  zh_hk: 香港消費者委員會測試外賣平台嗰陣，比較咗頁面顯示嘅預計送達時間同實際送達時間。出貨同送達係兩回事。而家，你為香港一間虛構嘅家品店寫送貨訊息。
