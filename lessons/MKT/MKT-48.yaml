  c32: 5%
  footer_en: >-
    Rule: ≥90% arrive by the stated day
  footer_zh: 规则：≥90% 在所写日期前送到
  footer_zh_hk: 規則：≥90% 在所寫日期前送到
  s1_en: >-
    The shop sells the same desk lamp from the same stock, carrier and price. For Tuesday morning orders,
    card S says Dispatches by Wednesday; card A says Estimated arrival by Thursday. Neither guarantees
    a date or changes customer rights.
  s1_zh: >-
    这家店卖同一款台灯，库存、快递公司和价格都相同。对周二上午的订单，S 卡写着周三前发货，A 卡写着预计周四前送达。两张卡都不保证送达日期，也不改变顾客的权利。
  s1_zh_hk: >-
    呢間店賣同一款枱燈，存貨、速遞公司同價錢都一樣。對星期二朝早嘅訂單，S 卡寫住星期三前出貨，A 卡寫住預計星期四前送達。兩張卡都唔保證送達日期，亦唔改變顧客嘅權利。
  s2_en: >-
    A matched cohort of 100 comparable recent Tuesday orders was all dispatched by Wednesday. 65 arrived
    by Wednesday, 30 on Thursday and 5 after Thursday.
  s2_zh: 最近一百张可比较的周二订单，全部在周三前发货。其中六十五张在周三或之前送到，三十张在周四送到，五张在周四之后才送到。
  s2_zh_hk: 最近一百張可以比較嘅星期二訂單，全部喺星期三前出貨。當中六十五張喺星期三或之前送到，三十張喺星期四送到，五張喺星期四之後先送到。
  s3_en: >-
    The manager will not publish a date unless at least 90 percent of comparable recent shipments reached
    customers by it. That is the shop's classroom rule, not a legal standard, and the pilot uses fixed
    synthetic records.
  s3_zh: 经理规定，只有至少百分之九十可比较的近期货件在那天前送到，才会公布这个日期。这是店铺在本题中的规则，不是法律标准；试验只用固定的模拟记录。
  s3_zh_hk: >-
    經理規定，最少要有百分之九十可以比較嘅近期貨件喺嗰日之前送到，先會公佈呢個日期。呢個係店舖喺本題嘅規則，唔係法律標準；試驗只係用固定嘅模擬記錄。
- id: pause1
  visual: title_card
