  step1_en: >-
    F week one: 38 × 42 = HK$1,596
  step1_zh: F 第一周：38 × 42 = HK$1,596
  step1_zh_hk: F 第一星期：38 × 42 = HK$1,596
  step2_en: >-
    C week one: 50 × 26 = HK$1,300
  step2_zh: C 第一周：50 × 26 = HK$1,300
  step2_zh_hk: C 第一星期：50 × 26 = HK$1,300
  step3_en: C needs 62 credited sales to match
  step3_zh: C 要卖 62 包才追得上
  step3_zh_hk: C 要賣 62 包才追得上
  s1_en: F earns 38 times 42, which is 1,596 dollars from packs in week one.
  s1_zh: 第一周，F 组正装贡献是三十八乘四十二，等于一千五百九十六元。
  s1_zh_hk: 第一個星期，F 組正裝貢獻係三十八乘四十二，即係一千五百九十六蚊。
  s2_en: C earns 50 times 42 minus 16, which is 26, giving 1,300 dollars.
  s2_zh: C 组是五十乘四十二减十六，即五十乘二十六，等于一千三百元。
  s2_zh_hk: C 組係五十乘四十二減十六，即係五十乘二十六，等於一千三百蚊。
  s3_en: >-
    C would need 62 credited sales to at least match F: 61 times 26 is 1,586, while 62 times 26 is 1,612.
    The identical tasting contribution cancels out.
  s3_zh: >-
    C 组最少要卖六十二包，才不输给 F 组：六十一乘二十六是一千五百八十六，六十二乘二十六是一千六百一十二。两组试饮的贡献相同，比较时互相抵消。
  s3_zh_hk: >-
    C 組最少要賣六十二包，先唔輸畀 F 組：六十一乘二十六係一千五百八十六，六十二乘二十六係一千六百一十二。兩組試飲嘅貢獻一樣，比較嗰陣互相抵銷。
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Meaning
  kicker_en: Meaning
  kicker_zh: 含义
  kicker_zh_hk: 含意
  title_en: Check the time window
  title_zh: 看清时间范围
  title_zh_hk: 看清時間範圍
  step1_en: >-
    Tastings: 100 × (20 − 14) = HK$600 each
  step1_zh: 试饮：100 × (20 − 14) = 各 HK$600
  step1_zh_hk: 試飲：100 × (20 − 14) = 各 HK$600
  step2_en: F HK$2,532 · C HK$2,026
  step2_zh: F HK$2,532 · C HK$2,026
  step2_zh_hk: F HK$2,532 · C HK$2,026
  step3_en: >-
    Pack lead: 12 in week one, 7 overall
  step3_zh: 正装领先：首周 12 包，两周 7 包
  step3_zh_hk: 正裝領先：首星期 12 包，兩星期 7 包
  s1_en: >-
    Each arm earns 100 times 20 minus 14, which is 600 dollars, from tastings.
  s1_zh: 每组的试饮贡献都是一百乘二十减十四，等于六百元。
  s1_zh_hk: 每組嘅試飲貢獻都係一百乘二十減十四，即係六百蚊。
  s2_en: >-
    F earns 1,596 plus 336 plus 600, which is 2,532 dollars. C earns 1,300 plus 126 plus 600, which is
    2,026, or 506 less.
  s2_zh: >-
    F 组合计是一千五百九十六加三百三十六再加六百，等于二千五百三十二元。C 组是一千三百加一百二十六再加六百，等于二千零二十六元，少了五百零六元。
  s2_zh_hk: >-
    F 組加埋係一千五百九十六加三百三十六再加六百，即係二千五百三十二蚊。C 組係一千三百加一百二十六再加六百，即係二千零二十六蚊，少咗五百零六蚊。
  s3_en: >-
    C's first-week advantage of twelve packs becomes seven over two weeks: 53 against 46.
  s3_zh: C 组第一周领先十二包，两周合计只领先七包：五十三包对四十六包。
  s3_zh_hk: C 組第一個星期領先十二包，兩個星期加埋只領先七包：五十三包對四十六包。
- id: check
  visual: title_card
  seconds: 18
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Keep the flight; test the credit
  title_zh: 保留试饮，再测抵扣
  title_zh_hk: 保留試飲，再測折抵
  en: >-
    Prefer F on these figures. Some of the difference may be purchase timing, but aggregate counts cannot
    prove who would have bought without a credit, or what happens after two weeks.
  zh: 按这些数字，应该选 F。部分差别可能只是购买时间不同，但汇总数字不能证明谁在没有抵扣时也会买，也看不出两周之后会怎样。
  zh_hk: 按呢啲數字，應該揀 F。部分差別可能只係購買時間唔同，但匯總數字證明唔到邊個冇折抵都會買，亦睇唔到兩個星期之後會點。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: More packs ≠ more contribution
  title_zh: 卖得多 ≠ 赚得多
  title_zh_hk: 賣得多 ≠ 賺得多
  q1_en: Count the credit on every pack
  q1_zh: 每包抵扣都要计成本
  q1_zh_hk: 每包折抵都要計成本
  q2_en: Measure a long enough window
  q2_zh: 衡量期要够长
  q2_zh_hk: 量度期要夠長
  s1_en: >-
    For a smaller-credit test, count all visitors assigned, purchases in both periods, and contribution
    after credit.
  s1_zh: 如果测试较低的抵扣额，要计算所有分组的顾客、两段时间内的购买，以及扣除抵扣后的贡献。
  s1_zh_hk: 如果測試低啲嘅折抵額，要計晒所有分組嘅顧客、兩段時間內嘅購買，同扣除折抵之後嘅貢獻。
  s2_en: A higher conversion fraction alone is not the objective.
  s2_zh: 单看转化率较高，并不是目标。
  s2_zh_hk: 單係轉化率高啲，唔係目標。
  s3_en: >-
    The tea shop, offers and all results are fictional. Official scene art is a teaching illustration
    only.
  s3_zh: 茶叶店、优惠和所有结果都是虚构的。官方场景图只是教学插图。
  s3_zh_hk: 茶葉舖、優惠同所有結果都係虛構嘅。官方場景圖只係教學插圖。
