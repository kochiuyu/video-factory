  step1_en: >-
    Late buyers: F +8, C +3
  step1_zh: 迟买的人：F +8，C +3
  step1_zh_hk: 遲買的人：F +8，C +3
  step2_en: No credit valid · HK$42 each
  step2_zh: 抵扣已失效 · 每包 HK$42
  step2_zh_hk: 折抵已失效 · 每包 HK$42
  step3_en: New sales or brought forward? Unknown
  step3_zh: 新增还是提前购买？不知道
  step3_zh_hk: 新增還是提前購買？不知道
  s1_en: >-
    During the following week, eight more F visitors and three more C visitors buy their first full pack.
  s1_zh: 接下来一周，F 组又有八位、C 组又有三位顾客第一次买正装。
  s1_zh_hk: 跟住嗰個星期，F 組再有八位、C 組再有三位顧客第一次買正裝。
  s2_en: >-
    No credit is valid then, so each late pack earns 42 dollars. There are no remaining commitments.
  s2_zh: 这时抵扣已经失效，所以每包迟买的正装都带来四十二元。之后也没有其他未完成的承诺。
  s2_zh_hk: 嗰陣折抵已經失效，所以每包遲買嘅正裝都帶嚟四十二蚊。之後亦冇其他未完成嘅承諾。
  s3_en: >-
    The shop still does not know which purchases were newly created and which were brought forward. The
    flight stays at 20 dollars, and the owner can test a lower credit later.
  s3_zh: 店铺仍然不知道，哪些购买是新增的，哪些只是提前了。试饮依然是二十元，店主之后可以测试较低的抵扣额。
  s3_zh_hk: 舖頭仍然唔知道，邊啲購買係新增，邊啲只係提早咗。試飲依然係二十蚊，店主之後可以測試低啲嘅折抵額。
