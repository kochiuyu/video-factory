  title_en: More tea sold. Did the tasting credit pay?
  title_zh: 茶叶卖多了，试饮费抵扣划算吗？
  title_zh_hk: 茶葉賣多了，試飲費折抵划算嗎？
  image: art/a-tasting-flight-for-whom-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    The Hong Kong Trade Development Council described exhibitors offering visitors teas to taste at its
    first Tea Fair. Now you run a fictional Hong Kong tea shop testing a paid tasting flight. The question
    is whether crediting the fee earns enough extra full-pack contribution.
  zh: >-
    香港贸易发展局介绍首届茶展时提到，参展商让参观者试饮多款茶。现在，你经营香港一家虚构的茶叶店，正在测试收费试饮。问题不在于大家最喜欢哪款茶，而在于把试饮费抵扣到正装上，能否带来足够的额外贡献。
  zh_hk: >-
    香港貿易發展局介紹首屆茶展嗰陣提到，參展商畀參觀者試飲唔同嘅茶。而家，你經營香港一間虛構嘅茶葉舖，測試緊收費試飲。問題唔係大家最鍾意邊款茶，而係將試飲費折抵正裝，賺唔賺到足夠嘅額外貢獻。
