  footer_en: Pack HK$42 · tasting HK$20 (cost 14)
  footer_zh: 正装 HK$42 · 试饮 HK$20，成本 14
  footer_zh_hk: 正裝 HK$42 · 試飲 HK$20，成本 14
  s1_en: >-
    A tasting flight is three small pours. Every visitor has already chosen the same 20-dollar tasting,
    which costs 14 dollars to serve.
  s1_zh: 试饮套餐是三小杯茶。每位顾客都已经选了同样二十元的试饮，店铺成本是十四元。
  s1_zh_hk: 試飲套餐係三細杯茶。每位顧客都已經揀咗同樣二十蚊嘅試飲，舖頭成本係十四蚊。
  s2_en: >-
    After serving it, the shop randomly assigns 100 visitors to each offer. F is the standard full-pack
    offer; C gives a clearly disclosed 16-dollar credit, valid for one full pack that week.
  s2_zh: 试饮之后，店铺把顾客随机分成两组，每组一百人。F 是一般的正装优惠；C 会清楚说明，可以把十六元抵扣用于当周购买一包正装。
  s2_zh_hk: 試飲之後，舖頭將顧客隨機分做兩組，每組一百人。F 係一般嘅正裝優惠；C 會清楚講明，可以將十六蚊折抵用喺當星期買一包正裝。
  s3_en: >-
    Each full pack earns 42 dollars before any credit. In week one, F sells 38 full packs and C sells
    50; every C pack that week redeems the credit, and each visitor buys at most one pack.
  s3_zh: 每包正装在抵扣前带来四十二元贡献。第一周，F 组卖出三十八包，C 组卖出五十包；C 组当周买的每一包都用了抵扣，每位顾客最多买一包。
  s3_zh_hk: 每包正裝喺折抵之前帶嚟四十二蚊貢獻。第一個星期，F 組賣出三十八包，C 組賣出五十包；C 組當星期買嘅每一包都用咗折抵，每位顧客最多買一包。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
