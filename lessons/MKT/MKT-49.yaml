  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Which offer goes forward?
  title_zh: 哪个方案继续？
  title_zh_hk: 哪個方案繼續？
  en: >-
    Which offer would you carry forward now? Calculate two-week contribution including the tastings, and
    explain what can and cannot be inferred from the extra seven packs. Pause and vote.
  zh: 你现在会继续采用哪个方案？算出两周合计的贡献，包括试饮在内，并说明从多出的七包可以推断什么，又不能推断什么。请暂停，投个票。
  zh_hk: 你而家會繼續用邊個方案？計出兩個星期加埋嘅貢獻，包括試飲，再講吓由多出嘅七包可以推斷啲咩，又推斷唔到啲咩。暫停，投個票。
