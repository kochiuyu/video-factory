  kicker_zh_hk: 暫停
  title_en: Extend the credit?
  title_zh: 要延续抵扣吗？
  title_zh_hk: 要延續折抵嗎？
  en: >-
    Would you extend the credit on these first-week numbers? Calculate the full-pack contribution for
    each offer, and the minimum C sales needed to match or beat F at the same credit. Pause and vote.
  zh: >-
    根据第一周的数字，你会继续提供抵扣吗？算出两个方案的正装贡献，以及在同样的抵扣下，C 组最少要卖多少包，才能追平或超过 F 组。请暂停，投个票。
  zh_hk: >-
    根據第一個星期嘅數字，你會唔會繼續提供折抵？計出兩個方案嘅正裝貢獻，同埋喺同樣折抵之下，C 組最少要賣幾多包，先追得上或者贏到 F 組。暫停，投個票。
