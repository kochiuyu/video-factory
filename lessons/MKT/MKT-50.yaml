  col2_zh_hk: 已付款
  c11: '18'
  c12: '16'
  c21: '24'
  c22: —
  footer_en: 6 more pickup units not yet arrived
  footer_zh: 另有 6 本在途，未入账
  footer_zh_hk: 另有 6 本在途，未計入
  s1_en: >-
    The stationer sells one notebook at the same price for shop pickup and home delivery. On the product
    page, shoppers have not yet chosen a channel. The manager proposes showing Only two left beside the
    name.
  s1_zh: 这家文具店以同一价格出售一款笔记本，可以到店自取，也可以送货上门。在商品页上，顾客还没有选择取货方式。经理建议在商品名称旁边写上只剩两件。
  s1_zh_hk: 呢間文具店用同一價錢賣一款筆記簿，可以到店自取，亦可以送貨上門。喺商品頁，顧客仲未揀取貨方式。經理建議喺商品名稱旁邊寫只剩兩件。
  s2_en: >-
    A competing draft shows channel-specific availability after the customer picks an option. Neither
    has gone live.
  s2_zh: 另一个方案则等顾客选好方式之后，才显示该渠道的存货。两个版本都还没有上线。
  s2_zh_hk: 另一個方案就等顧客揀好方式之後，先顯示嗰個渠道嘅存貨。兩個版本都未上線。
  s3_en: >-
    At 10am, 18 notebooks are allocated to the early pickup slot, and 16 are already paid and protected.
    A separate pool holds 24 checked units for delivery. Six more units, in neither pool, must arrive
    and pass checks before a later pickup slot can open.
  s3_zh: 上午十点，早段自取预留了十八本，十六本已付款，不能再卖。另一批分开的库存有二十四本可送货。另有六本在途，到货检查后才能开放较晚的自取时段。
  s3_zh_hk: >-
    上午十點，早段自取預留咗十八本，十六本已經俾錢，唔可以再賣。另一批分開嘅存貨有二十四本可以送貨。仲有六本喺途中，到貨檢查完先可以開較遲嘅自取時段。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Pause
  kicker_en: Pause
  kicker_zh: 暂停
  kicker_zh_hk: 暫停
  title_en: Approve Only two left?
  title_zh: 批准只剩两件吗？
  title_zh_hk: 批准只剩兩件嗎？
  en: >-
    Would you approve the proposed headline? Find the number a new buyer could order in the early pickup
    slot and across both channels, then explain the difference a shopper needs to see. Pause and vote.
  zh: 你会批准这个标语吗？算出新顾客在早段自取时段，以及在两个渠道合计，可以订多少本，再说明顾客需要看清的区别。请暂停，投个票。
  zh_hk: 你會唔會批准呢句標語？計出新顧客喺早段自取時段，同兩個渠道加埋，可以訂幾多本，再講吓顧客要睇清楚嘅分別。暫停，投個票。
