  title_en: The 10am stock ledger
  title_zh: 上午 10 时的存货记录
  title_zh_hk: 上午 10 時的存貨紀錄
  row1_en: Early pickup slot
  row1_zh: 早段自取预留
  row1_zh_hk: 早段自取預留
  row2_en: Delivery pool
  row2_zh: 送货独立库存
  row2_zh_hk: 送貨獨立庫存
  col1_en: Units
  col1_zh: 本数
