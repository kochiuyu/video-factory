  title_en: Only two left. Left where?
  title_zh: 「只剩两件」，是哪里只剩两件？
  title_zh_hk: 「只剩兩件」，是哪裏只剩兩件？
  image: art/only-two-in-this-basket-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A Singapore competition authority study noted that a travel site's scarce-looking rooms could reflect
    only its own allotment. Stock can be limited by channel, not by product. Now you manage a fictional
    Hong Kong stationer's notebook listing.
  zh: >-
    新加坡竞争主管机构的一项市场研究指出，旅游网站显示客房所剩无几，有时只反映该平台分到的房间数。存货紧张可能只限于某个渠道，而不是整款产品。现在，你负责香港一家虚构文具店的笔记本商品页。
  zh_hk: >-
    新加坡競爭事務機構有一項市場研究指出，旅遊網站顯示房間所剩無幾，有時只係反映嗰個平台分到嘅房數。存貨緊張可能只係某個渠道，唔係成款產品。而家，你負責香港一間虛構文具店嘅筆記簿商品頁。
