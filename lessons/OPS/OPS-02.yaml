  row1_zh: 全部海运
  row1_zh_hk: 全數海運
  row2_en: 300 by air
  row2_zh: 300套空运
  row2_zh_hk: 300套空運
  row3_en: All air
  row3_zh: 全部空运
  row3_zh_hk: 全部空運
  col1_en: Usable Monday
  col1_zh: 星期一可用
  col1_zh_hk: 星期一可用
  col2_en: Total extra cost
  col2_zh: 总增量成本
  col2_zh_hk: 額外成本總額
  c11: '0'
