  c32: 60,000
  footer_en: Credit 30,000 if Monday usable kits < 300
  footer_zh: 星期一可用不足300套，减免30,000
  footer_zh_hk: 星期一可用不足300套，扣款30,000
  s1_en: >-
    The first event needs three hundred complete kits on Monday; the remaining seven hundred are due on
    Friday. All goods are finished in your warehouse and can be split before booking. An all-sea shipment
    would arrive on Friday.
  s1_zh: 首场活动星期一需要三百套完整礼包，其余七百套星期五才要。货物都已完工，还在仓库里，订舱前可以拆分。如果全部走海运，星期五才会到。
  s1_zh_hk: 首場活動星期一需要三百套完整迎新用品，其餘七百套星期五先至要。貨物都已經製成，仲喺貨倉，訂艙前可以分拆。如果全部走海運，星期五先至會到。
  s2_en: >-
    Under the agreed classroom terms, fewer than three hundred usable kits by Monday triggers a one-off
    thirty-thousand-dollar credit. The customer still accepts and pays for the full order, less that credit.
    Product costs and ordinary sea freight are the same baseline under every plan.
  s2_zh: >-
    按课堂约定，星期一可用礼包不足三百套，就要一次性给客户减免三万港元货款。客户仍会接收并支付整张订单，只是减去这笔减免。各方案的产品成本和普通海运费用都是同一条基线。
  s2_zh_hk: >-
    按課堂協議，星期一可用迎新用品不足三百套，就要一次過俾客戶扣款三萬港元。客戶仍然會收下並支付整張訂單，只係減去呢筆扣款。各方案嘅產品成本同普通海運費都係同一條基線。
  s3_en: >-
    Airfreighting three hundred complete kits costs twenty-four thousand extra and avoids the credit.
    Flying all one thousand costs sixty thousand. Quotes already include split handling, documentation
    and final delivery. Air space alone does not prove Monday delivery.
  s3_zh: >-
    空运三百套完整礼包，额外运费两万四千港元，可以避免货款减免。一千套全部空运，要六万港元。报价已包括拆分、单证和最终派送。有空运舱位，并不等于星期一一定送到。
  s3_zh_hk: >-
    空運三百套完整迎新用品，額外運費兩萬四千港元，可以避免客戶扣款。一千套全部空運，要六萬港元。報價已包括分拆、文件同最終派送。有空運艙位，並唔等於星期一一定送到。
