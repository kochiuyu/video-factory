title_en: Fly the whole order, or just what is missing?
title_zh: 整单空运，还是只运缺的那部分？
title_zh_hk: 整張訂單都空運，還是只空運欠缺的部分？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: OPS-02
  kicker_en: OPS-02
  kicker_zh: OPS-02
  kicker_zh_hk: OPS-02
  title_en: Fly the whole order, or just what is missing?
  title_zh: 整单空运，还是只运缺的那部分？
  title_zh_hk: 整張訂單都空運，還是只空運欠缺的部分？
  image: art/split-shipment-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In April 2024, Hong Kong trade reporting described firms shifting different portions of freight from
    sea to air during Red Sea disruption. A survey found many made no shift, and others moved only a fraction.
    You manage logistics for a fictional Hong Kong supplier. An overseas customer ordered one thousand
    welcome kits, each a cloth bag plus a matching printed insert.
  zh: >-
    二零二四年四月，香港商贸报道提到，红海航运受阻期间，有企业把不同比例的货物从海运改为空运。调查里，不少企业没有改，其余也只转运了部分货物。你负责一家虚构香港供应商的物流。海外客户订了一千套迎宾礼包，每套都要有一个布袋和一张配套的印刷插页。
  zh_hk: >-
    二零二四年四月，香港商貿報道提到，紅海航運受阻期間，有企業把不同比例嘅貨物由海運轉為空運。調查裏面，不少企業冇改，其餘亦都只轉運部分貨物。你負責一間虛構香港供應商嘅物流。海外客戶訂咗一千套迎新用品，每套都要有一個布袋同埋一張配套印刷插頁。
