  title_en: A faster machine. More finished boxes?
  title_zh: 机器更快，成品盒就更多吗？
  title_zh_hk: 機器更快，完成的禮盒會更多嗎？
  image: art/packing-line-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In July 2023, a government report described Hongkong Post's packet-sorting robotics. Parcels were
    scanned, weighed and sorted, then staff sealed mailbags for dispatch. That is a chain of steps, not
    a claim about one bottleneck. You manage a fictional Hong Kong gift-order packing workshop. Every
    identical box goes through pick and check, then wrap, then seal and label.
  zh: >-
    二零二三年七月，政府新闻介绍了香港邮政的包裹分拣机器人：包裹经过扫描、称重和分拣后，再由工作人员把邮袋封好发运。这是一条衔接起来的工序，并没有指出瓶颈在哪里。你管理一家虚构的香港礼品打包工坊。每个同样的礼盒，都要经过拣货与核对、包装、再封盒与贴标。
  zh_hk: >-
    二零二三年七月，政府新聞介紹咗香港郵政嘅郵件分揀機械人：包裹經過掃描、稱重同分揀之後，再由員工封好郵袋付運。呢條係一條銜接起來嘅工序，並冇指出瓶頸喺邊。你管理一間虛構嘅香港禮品裝盒工場。每個同樣嘅禮盒，都要經過揀貨同核對、包裝、再封盒同貼標籤。
