  s1_en: >-
    A representative time study now measures all three stations, including normal interruptions. These
    are sustainable rates of acceptable work for the same box design, with separate staff and adequate
    transfer space.
  s1_zh: 一次有代表性的工时测定，已经量了全部三个工位，也包括正常的中断。这些是同一款礼盒、可持续的合格产出速率。各工位人员分开，中间转运空间也够用。
  s1_zh_hk: 一次有代表性嘅工時研究，已經量度全部三個工位，亦包括正常中斷。呢啲係同一款禮盒、可持續嘅合格產出速率。各工位人手分開，中間轉運空間都夠用。
  s2_en: >-
    Current capacities are one hundred and twenty, eighty, and one hundred boxes an hour. For the same
    twenty thousand dollars, a wrapping redesign can raise wrapping from eighty to one hundred and twenty.
    The proposed pick-and-check setup still raises that station to two hundred.
  s2_zh: >-
    当前产能分别是每小时一百二十、八十和一百盒。同样花两万港元，改造包装工位可以把包装从八十提高到一百二十。原来那套拣货与核对设备，仍然是把该工位提高到两百。
  s2_zh_hk: >-
    現有處理能力分別係每小時一百二十、八十同一百盒。同樣花兩萬港元，改善包裝工位可以把包裝由八十提升到一百二十。原來嗰套揀貨及核對設備，仍然係將該工位提升到兩百。
  s3_en: >-
    Either change leaves the other stations, staffing, quality and recurring costs unchanged. Demand remains
    one hundred and fifty boxes an hour, and the budget still permits only one improvement.
  s3_zh: 无论改哪一项，其他工位、人员、质量和经常性费用都不变。需求仍是每小时一百五十盒，预算也仍然只够改一项。
  s3_zh_hk: 無論改邊一項，其他工位、人手、質素同經常性費用都不變。需求仍然係每小時一百五十盒，預算亦都仍然只夠改一項。
