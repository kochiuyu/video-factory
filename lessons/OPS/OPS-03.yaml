- id: bridge
  visual: steps
  seconds: 26
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Follow one box to the end
  title_zh: 跟着一个礼盒走完整条线
  title_zh_hk: 沿着一盒禮品看完整個流程
  step1_en: The line is limited by min(120, 80, 100) = 80
  step1_zh: 整条线受限于 min(120, 80, 100) = 80
  step1_zh_hk: 成條線受限於 min(120, 80, 100) = 80
  step2_en: Faster pick/check still finishes 80 an hour
  step2_zh: 拣货加快后，成品仍是每小时80盒
  step2_zh_hk: 揀貨加快之後，成品仍是每小時80盒
  step3_en: Better wrapping raises finished output to 100
  step3_zh: 改进包装后，成品提高到每小时100盒
  step3_zh_hk: 改善包裝之後，成品提升到每小時100盒
  s1_en: >-
    In this simplified serial process, the slowest station limits sustainable finished output. Initially
    that is wrapping: the minimum of one hundred and twenty, eighty and one hundred is eighty boxes an
    hour.
  s1_zh: 在这条简化的串联流程里，最慢的工位限制了可持续的成品产出。一开始，这个工位是包装：一百二十、八十和一百里面，最小的是八十盒每小时。
  s1_zh_hk: 喺呢條簡化嘅串聯流程裏面，最慢嘅工位限制咗可持續嘅成品產出。一開始，呢個工位係包裝：一百二十、八十同一百裏面，最小嘅係每小時八十盒。
  s2_en: >-
    Faster pick and check gives a minimum of two hundred, eighty and one hundred: still eighty. It does
    not increase the flow of finished boxes. Extra work sent to wrapping only creates a waiting pile unless
    upstream release is controlled.
  s2_zh: 拣货与核对加快以后，最小值变成两百、八十和一百，仍然是八十。成品盒的流量并没有增加。如果上游还是不停往下送，包装工位只会堆起等待的半成品。
  s2_zh_hk: 揀貨及核對加快之後，最小值變成兩百、八十同一百，仍然係八十。成品盒嘅流量並冇增加。如果上游仲係不停送落去，包裝工位只會堆起等待嘅半成品。
  s3_en: >-
    Improved wrapping gives a minimum of one hundred and twenty, one hundred and twenty, and one hundred:
    one hundred finished boxes an hour. The potential gain is twenty completed boxes an hour, or twenty-five
    percent, not wrapping's forty-box local gain, and not the advertised eighty-box pick-and-check gain.
  s3_zh: >-
    改进包装以后，最小值是一百二十、一百二十和一百，也就是每小时一百个成品盒。可能增加的是每小时二十个完成盒，即百分之二十五，不是包装工位本身多出来的四十盒，更不是宣传里拣货可多出的八十盒。
  s3_zh_hk: >-
    改善包裝之後，最小值係一百二十、一百二十同一百，亦即每小時一百盒成品。可能增加嘅係每小時二十盒完成品，即百分之二十五，唔係包裝工位本身多出嚟嘅四十盒，更加唔係宣傳裏揀貨可多出嘅八十盒。
- id: meaning
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: The bottleneck moves
  title_zh: 瓶颈转移了
  title_zh_hk: 瓶頸轉移了
  step1_en: After wrapping, seal-and-label limits the line
  step1_zh: 包装改进后，封盒贴标成了限制
  step1_zh_hk: 包裝改善後，封盒貼標成咗限制
  step2_en: Demand of 150 an hour is still not met
  step2_zh: 每小时150盒的需求仍未满足
  step2_zh_hk: 每小時150盒嘅需求仍未滿足
  step3_en: This is a capacity comparison, not a payback
  step3_zh: 这是产能比较，不是投资回报计算
  step3_zh_hk: 呢個係處理能力比較，唔係回報計算
  s1_en: >-
    After the wrapping change, sealing and labelling becomes the limiting station. The process still cannot
    meet demand of one hundred and fifty boxes an hour. Do not promise that the entire backlog disappears.
  s1_zh: 包装改完以后，封盒与贴标变成了限制工位。整条线仍然达不到每小时一百五十盒的需求。不要承诺积压的订单会全部消失。
  s1_zh_hk: 包裝改完之後，封盒及貼標變成咗限制工位。成條線仍然達唔到每小時一百五十盒嘅需求。唔好承諾積壓嘅訂單會全部消失。
  s2_en: >-
    Keep enough prepared work so the constraint is not starved, but do not reward upstream staff merely
    for building the largest pile. Recheck end-to-end performance, quality and queues after the change.
  s2_zh: 要让瓶颈工位有足够的待加工件，不要让它闲着等料；但也不要只因为上游堆得最多就奖励上游。改完以后，还要再看端到端的产出、质量和排队。
  s2_zh_hk: 要等瓶頸工位有足夠嘅待加工件，唔好等佢閒住等料；但亦都唔好只因為上游堆得最多就獎勵上游。改完之後，仲要再睇端到端嘅產出、質素同排隊。
  s3_en: >-
    For finished-box capacity, the wrapping redesign is the useful candidate; faster pick and check adds
    none in this model. That is not yet a full investment appraisal. If the economics fail, delaying both
    purchases is defensible.
  s3_zh: >-
    若目标是增加成品盒，改造包装才是有用的选项；在这个模型里，加快拣货并不能增加成品流量。这还不是完整的投资评估。如果经济账算不过来，两笔采购都暂缓，也说得通。
  s3_zh_hk: >-
    若目標係增加成品盒，改善包裝先至係有用嘅選項；喺呢個模型裏面，加快揀貨並唔能夠增加成品流量。呢個仲未係完整嘅投資評估。如果經濟賬算唔過去，兩筆採購都暫緩，都講得通。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Why only 20 more finished boxes?
  title_zh: 为什么成品只多20盒？
  title_zh_hk: 點解成品只多20盒？
  en: >-
    If you chose wrapping, why does a forty-box local improvement yield only twenty more completed boxes?
    If you chose faster pick and check, which downstream rate actually changes? Separate capacity from
    financial return, and note the remaining demand gap.
  zh: >-
    如果你选了改造包装，为什么工位多处理四十盒，成品却只多二十盒？如果你选了加快拣货与核对，下游哪一个工位的产出率会变？要把产能和财务回报分开看，并注意到需求缺口还在。
  zh_hk: >-
    如果你揀咗改善包裝，點解工位可以多做四十盒，成品卻只多二十盒？如果你揀咗加快揀貨及核對，下游邊一個工位嘅產出率會變？要把處理能力同財務回報分開睇，並注意到需求缺口仲喺度。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Improve the limiting activity
  title_zh: 先改进限制整条线的工序
  title_zh_hk: 先改善限制成條線的工序
  q1_en: A station's speed is not the line's output
  q1_zh: 一个工位变快，不等于整条线更快
  q1_zh_hk: 一個工位變快，唔等於成條線更快
  q2_en: >-
    Then look again: the bottleneck can move
  q2_zh: 改完再看，瓶颈可能会转移
  q2_zh_hk: 改完再睇，瓶頸可能會轉移
  s1_en: >-
    Improve the process's limiting activity, then look again. A station's speed is not the same as the
    business's output.
  s1_zh: 先改进限制整条流程的那一步，然后再看一看。一个工位的速度，并不等于企业的产出。
  s1_zh_hk: 先改善限制成個流程嗰一步，然後再睇一睇。一個工位嘅速度，並唔等於企業嘅產出。
  s2_en: >-
    The workshop, equipment offers, station rates and demand are invented teaching assumptions. They are
    not estimates of Hongkong Post or any named operator.
  s2_zh: 这家工坊、设备报价、工位速率和需求，都是虚构的教学假设，不是对香港邮政或任何具名机构的估算。
  s2_zh_hk: 呢間工場、設備報價、工位速率同需求，都係虛構嘅教學假設，唔係對香港郵政或任何具名機構嘅估算。
  s3_en: Official scene art is a teaching illustration only.
  s3_zh: 官方场景图只是教学插图。
  s3_zh_hk: 官方場景圖只係教學插圖。
duration_target_s: 190
