  title_en: Buy now, or measure the line first?
  title_zh: 现在就买，还是先测整条线？
  title_zh_hk: 而家就買，定先量度成條線？
  en: >-
    Would you approve the faster pick-and-check setup now, or measure the full packing line first? What
    output would justify the purchase? Pause and vote.
  zh: 你是现在就批准这套更快的拣货与核对设备，还是先把整条打包线测一遍？什么样的产出，才值得这笔采购？请暂停，投个票。
  zh_hk: 你係而家就批准呢套更快嘅揀貨及核對設備，定先將成條裝盒線量度一次？點樣嘅產出，先值得呢筆採購？暫停，投個票。
