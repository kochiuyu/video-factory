  s1_en: >-
    Customers have enough orders for one hundred and fifty finished boxes per hour in the coming busy
    period. You want more acceptable boxes ready for dispatch.
  s1_zh: 接下来的旺季，客户订单足以支撑每小时一百五十个成品盒。还有订单在等，你希望有更多合格的成品盒可以发运。
  s1_zh_hk: 即將到來嘅旺季，客戶訂單足以消化每小時一百五十盒成品。已有訂單在等，你希望有更多合格禮盒可以付運。
  s2_en: >-
    A supplier offers a twenty-thousand-dollar pick-and-check setup that raises that station from one
    hundred and twenty to two hundred boxes an hour. The tempting headline is eighty more boxes picked
    and checked each hour. A picked box is not yet a completed order.
  s2_zh: >-
    供应商提供一套两万港元的拣货与核对设备，能把该工位从每小时一百二十盒提高到两百盒。最诱人的说法是：每小时可多拣出并核对八十盒。可是拣完的盒子，还不是已经完成的订单。
  s2_zh_hk: >-
    供應商提供一套兩萬港元嘅揀貨及核對設備，可以將該工位由每小時一百二十盒提升到兩百盒。最吸引嘅講法係：每小時可以多揀同核對八十盒。但揀完嘅盒子，仲唔係已經完成嘅訂單。
  s3_en: >-
    You have not measured the other stations. The budget can fund only one improvement, and there is time
    for a short process study before you decide.
  s3_zh: 其他工位你还没有测过。预算只够做一项改进，而且在拍板之前，还来得及做一次简短的流程调查。
  s3_zh_hk: 其他工位你仲未量度過。預算只夠改善一項，而且喺拍板之前，仲嚟得切做一次簡短嘅流程研究。
