title_en: Fewer changeovers. A later customer.
title_zh: 换型少了，客户就要晚点取货？
title_zh_hk: 轉線少了，客戶卻要遲些取貨？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: OPS-04
  kicker_en: OPS-04
  kicker_zh: OPS-04
  kicker_zh_hk: OPS-04
  title_en: Fewer changeovers. A later customer.
  title_zh: 换型少了，客户就要晚点取货？
  title_zh_hk: 轉線少了，客戶卻要遲些取貨？
  image: art/mixed-collection-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A 2024 PolyU visit report described a knitted-garment microfactory that supported small-batch production.
    That illustrates interest in flexibility; it is not an audited performance claim. You supervise a
    fictional Hong Kong gift-label workshop. A confirmed order needs two hundred labels of design A and
    two hundred of design B. There is no finished stock, and one machine has three hundred and sixty minutes
    in the shift.
  zh: >-
    二零二四年，理工大学的一份参访报告介绍了一个支持小批量生产的针织服装微型工厂演示。它说明柔性生产受到关注，并不是经过审计的业绩数字。你管理一家虚构的香港礼品标签工坊。一份已确认的订单要两百张A款、两百张B款。现在没有成品库存，一台机器在本班次里有三百六十分钟可用。
  zh_hk: >-
    二零二四年，理工大學嘅一份參訪報告介紹咗一個支持小批量生產嘅針織成衣微型工廠示範。佢說明彈性生產受到關注，並唔係經過審核嘅業績數字。你主管一間虛構嘅香港禮品標籤工場。一張已確認嘅訂單要兩百張A款、兩百張B款。而家冇成品存貨，一部機器喺呢個更次裏面有三百六十分鐘可用。
