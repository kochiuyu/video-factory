title_en: Two suppliers. One factory?
title_zh: 两家供应商，只有一家工厂？
title_zh_hk: 兩家供應商，同一家工廠？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: OPS-05
  kicker_en: OPS-05
  kicker_zh: OPS-05
  kicker_zh_hk: OPS-05
  title_en: Two suppliers. One factory?
  title_zh: 两家供应商，只有一家工厂？
  title_zh_hk: 兩家供應商，同一家工廠？
  image: art/shared-factory-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In January 2025, HKTDC and UOB Hong Kong released research on Greater Bay Area supply-chain diversification,
    based on a survey of more than six hundred companies. Diversification is not automatically protection.
    A fictional Hong Kong gift shop needs one thousand identical presentation boxes each month. Distributor
    A charges ten dollars per box; distributor B charges eleven. Both meet the quality specification.
  zh: >-
    二零二五年一月，香港贸易发展局与UOB Hong Kong发布了关于大湾区供应链多元化的研究，依据是对六百多家企业的调查。多元化并不自动等于供应得到保障。一家虚构的香港礼品店，每月需要一千个一模一样的礼品包装盒。经销商A每个报价十港元，经销商B每个十一港元。两家都符合质量规格。
  zh_hk: >-
    二零二五年一月，香港貿易發展局同UOB Hong Kong發布咗關於大灣區供應鏈多元化嘅研究，依據係對六百幾家企業嘅調查。多元化並唔等於供應自動得到保障。一間虛構嘅香港禮品店，每月需要一千個一模一樣嘅禮盒。分銷商A每個收十港元，分銷商B每個收十一港元。兩家都符合品質規格。
- id: ledger
