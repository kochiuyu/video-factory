  title_en: Keep the appointment, or postpone it?
  title_zh: 按约保养，还是推迟？
  title_zh_hk: 按約保養，定推遲？
  en: >-
    Would you keep the service appointment or postpone it? What evidence would you need to compare the
    planned interruption with an unexpected failure? Pause and vote.
  zh: 你会按约保养，还是推迟？要把计划停机，跟一次意外故障比较，你还需要哪些证据？请暂停，投个票。
  zh_hk: 你會按約保養，定推遲？要把計劃停機，同一次意外故障比較，你仲需要邊啲證據？暫停，投個票。
- id: reveal
  visual: table_grid
  seconds: 24
  rows: 2
  cols: 2
  kicker: Round 2
  kicker_en: Round 2
  kicker_zh: 第二轮
  kicker_zh_hk: 第二輪
  title_en: Teaching estimates for the coming week
  title_zh: 对未来一周的教学估计
  title_zh_hk: 對未來一星期的教學估計
  row1_en: If postponed
  row1_zh: 若推迟保养
  row1_zh_hk: 若推遲保養
  row2_en: If serviced
  row2_zh: 若按约保养
  row2_zh_hk: 若按約保養
  col1_en: Failure chance
  col1_zh: 故障机会
  col1_zh_hk: 故障機會
  col2_en: Failure loss
  col2_zh: 故障损失
  col2_zh_hk: 故障損失
  c11: 30%
  c12: 10,000
  c21: 5%
  c22: 10,000
  footer_en: Same loss either way; at most one failure
  footer_zh: 两种选择损失相同；最多一次故障
  footer_zh_hk: 兩種選擇損失相同；最多一次故障
  s1_en: >-
    The condition assessment supplies these fictional teaching estimates for the coming week: a thirty
    percent chance of one disruptive failure if service is postponed, compared with five percent if the
    appointment is kept.
  s1_zh: 状态评估给出了未来一周的虚构教学估计：如果推迟保养，发生一次造成中断的故障，机会是百分之三十；如果按约保养，则是百分之五。
  s1_zh_hk: 狀態評估畀出咗未來一星期嘅虛構教學估計：如果推遲保養，發生一次造成中斷嘅故障，機會係百分之三十；如果按約保養，則係百分之五。
  s2_en: >-
    A failure would create ten thousand dollars in total incremental loss, including repair and disruption.
    This same loss applies under either option, and is additional to any planned service cost. At most
    one failure is modelled.
  s2_zh: 一旦发生故障，总的增量损失是一万港元，包括修理和中断。两种选择都是这笔损失，并且要加在任何计划保养成本之上。模型里最多只发生一次故障。
  s2_zh_hk: 一旦發生故障，總嘅增量損失係一萬港元，包括修理同中斷。兩種選擇都係呢筆損失，並且要加喺任何計劃保養成本之上。模型裏面最多只發生一次故障。
  s3_en: >-
    All other costs and outcomes are assumed equal, and effects after the coming week are excluded. These
    figures are not estimates from MTR or the cited studies.
  s3_zh: 其他成本和结果都假设相同，下一周之后的影响也不计入。这些数字不是来自港铁，也不是来自所引研究。
  s3_zh_hk: 其他成本同結果都假設相同，下一星期之後嘅影響亦都不計入。呢啲數字唔係來自港鐵，亦都唔係來自所引研究。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: Which option has the lower expected cost?
  title_zh: 哪个方案的期望成本更低？
  title_zh_hk: 邊個方案嘅期望成本更低？
  en: >-
    Which option has the lower expected incremental cost under these assumptions? Would that calculation
    guarantee a better outcome next week, and which assumptions most need checking? Pause and vote again.
  zh: 在这些假设下，哪个方案的期望增量成本更低？这个计算结果，能保证下周结果一定更好吗？哪些假设最需要核对？请暂停，再投一次票。
  zh_hk: 喺呢啲假設之下，邊個方案嘅期望增量成本更低？呢個計算結果，可唔可以保證下週結果一定更好？邊啲假設最需要核對？暫停，再投一次票。
- id: bridge
  visual: steps
  seconds: 26
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Compare planned cost with remaining risk
  title_zh: 把计划成本与剩余风险比较
  title_zh_hk: 將計劃成本與剩餘風險比較
  step1_en: >-
    Postpone: 30% × 10,000 = HK$3,000
  step1_zh: 推迟：30% × 10,000 = 3,000港元
  step1_zh_hk: 推遲：30% × 10,000 = 3,000港元
  step2_en: >-
    Keep it: 2,000 + 5% × 10,000 = HK$2,500
  step2_zh: 按约：2,000 + 5% × 10,000 = 2,500港元
  step2_zh_hk: 按約：2,000 + 5% × 10,000 = 2,500港元
  step3_en: The appointment is lower by HK$500 in expectation
  step3_zh: 按期望成本，按约保养低500港元
  step3_zh_hk: 按期望成本，按約保養低500港元
  s1_en: >-
    Postponing has expected incremental cost of thirty percent times ten thousand dollars, which is three
    thousand. Keeping the appointment has expected incremental cost of two thousand plus five percent
    times ten thousand, which is two thousand five hundred.
  s1_zh: 推迟保养的期望增量成本，是百分之三十乘以一万港元，等于三千港元。按约保养的期望增量成本，是两千加上百分之五乘以一万，等于两千五百港元。
  s1_zh_hk: 推遲保養嘅期望增量成本，係百分之三十乘以一萬港元，等於三千港元。按約保養嘅期望增量成本，係兩千加百分之五乘以一萬，等於兩千五百港元。
  s2_en: >-
    The model therefore favours keeping the appointment by five hundred dollars in expected cost. Do not
    add the planned interruption again: it is already inside the two thousand. Do not add repair or disruption
    again: both are already inside the ten thousand.
  s2_zh: >-
    因此，按期望成本，模型更支持按约保养，差额是五百港元。不要把计划停机再加一次，它已经包含在两千港元里。也不要再另加修理或中断费用，它们已经包含在一万港元里。
  s2_zh_hk: >-
    因此，按期望成本，模型更支持按約保養，差額係五百港元。唔好將計劃停機再加一次，它已經包含喺兩千港元裏面。亦都唔好再另加修理或中斷費用，佢哋已經包含喺一萬港元裏面。
  s3_en: >-
    An expected cost is a probability-weighted average, not the amount certain to be paid next week. If
    no failure occurs, postponing incurs none of the modelled costs, while service still costs two thousand.
    A failure after service would still total twelve thousand in modelled costs.
  s3_zh: >-
    期望成本是按概率加权的平均数，不是下周一定会付的金额。如果没有故障，推迟保养在模型里是零成本，而保养仍要付两千港元。保养之后若仍发生故障，模型中的总成本会是一万两千港元。
  s3_zh_hk: >-
    期望成本係按概率加權嘅平均數，唔係下週一定會付嘅金額。如果冇故障，推遲保養喺模型裏係零成本，而保養仍然要付兩千港元。保養之後若仍然發生故障，模型中嘅總成本會係一萬兩千港元。
- id: meaning
  visual: steps
  seconds: 26
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A 25-point cut is not a 25% cut
  title_zh: 下降25个百分点，不是下降25%
  title_zh_hk: 下降25個百分點，不是下降25%
  step1_en: Service must cut risk by more than 20 points
  step1_zh: 保养要使故障机会多降超过20个百分点
  step1_zh_hk: 保養要使故障機會多降超過20個百分點
  step2_en: The stated cut is 30% minus 5%, or 25 points
  step2_zh: 这里是30%减5%，即25个百分点
  step2_zh_hk: 呢度係30%減5%，即25個百分點
  step3_en: A 15-point cut would favour postponing
  step3_zh: 若只降15个百分点，推迟反而更便宜
  step3_zh_hk: 若只降15個百分點，推遲反而更平
  s1_en: >-
    Service costs two thousand dollars against a ten-thousand-dollar failure consequence. It must reduce
    failure probability by more than two thousand divided by ten thousand, or twenty percentage points,
    to lower expected cost. Exactly twenty points gives a tie.
  s1_zh: >-
    保养花费两千港元，对应的故障后果是一万港元。它必须把故障概率多降超过两千除以一万，也就是二十个百分点，期望成本才会更低。刚好二十个百分点，两种选择打平。
  s1_zh_hk: >-
    保養花費兩千港元，對應嘅故障後果係一萬港元。它必須將故障概率多降超過兩千除以一萬，亦即二十個百分點，期望成本先會更低。剛剛二十個百分點，兩種選擇打和。
  s2_en: >-
    The stated reduction is thirty percent minus five percent, which is twenty-five percentage points,
    not a twenty-five percent relative reduction. That cut passes the threshold.
  s2_zh: 题目给出的下降，是百分之三十减去百分之五，等于二十五个百分点，不是相对下降百分之二十五。这个降幅超过了临界值。
  s2_zh_hk: 題目畀出嘅下降，係百分之三十減去百分之五，等於二十五個百分點，唔係相對下降百分之二十五。呢個降幅超過咗門檻。
  s3_en: >-
    If the untreated risk were only twenty percent and the serviced risk still five percent, the reduction
    would be fifteen points. Postponing would then cost two thousand in expectation, versus two thousand
    five hundred for service. The threshold depends on the stated costs, time horizon and safety exclusions.
  s3_zh: >-
    如果未保养时的风险只有百分之二十，保养后仍是百分之五，降幅就只有十五个百分点。那时推迟的期望成本是两千港元，保养却是两千五百港元。这个临界值取决于给定的成本、时间范围和安全排除条件。
  s3_zh_hk: >-
    如果未保養時嘅風險只有百分之二十，保養後仍然係百分之五，降幅就只有十五個百分點。嗰陣推遲嘅期望成本係兩千港元，保養卻係兩千五百港元。呢個門檻取決於所定嘅成本、時間範圍同安全排除條件。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Plan reliability, not just uptime today
  title_zh: 要规划可靠性，不只是今天不停机
  title_zh_hk: 要規劃可靠性，唔只係今日不停機
  en: >-
    A planned stop can be scheduled around jobs, staff and materials. An unexpected stop can collide with
    delivery commitments. One good week after postponement would not prove the assessment wrong, and one
    failure after service would not prove the appointment was pointless. Do not apply this classroom threshold
    to railway safety, known faults or required maintenance.
  zh: >-
    计划停机可以避开订单、人员和物料来安排。意外停机却可能撞上交货承诺。推迟之后一周顺利，并不能证明评估错了；保养之后仍出故障，也不能证明这次保养没有意义。不要把课堂上的这个临界值，用到铁路安全、已知故障或强制维护上。
  zh_hk: >-
    計劃停機可以避開訂單、人手同物料嚟安排。意外停機卻可能撞上交貨承諾。推遲之後一星期順利，並唔能夠證明評估錯咗；保養之後仍然出故障，亦都唔能夠證明呢次保養冇意義。唔好將課堂上呢個門檻，用到鐵路安全、已知故障或強制保養上。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: A planned stop can be the cheaper risk
  title_zh: 主动停机，有时是更便宜的风险
  title_zh_hk: 主動停機，有時係更平嘅風險
  q1_en: Compare expected cost, not today's output only
  q1_zh: 要比较期望成本，不能只看今天产量
  q1_zh_hk: 要比較期望成本，唔可以只睇今日產量
  q2_en: Check the size of the risk reduction
  q2_zh: 要核对风险下降了多少个点
  q2_zh_hk: 要核對風險下降咗幾多個點
  s1_en: >-
    Keeping a machine running is not the same as making capacity reliable. Here the simplified one-week
    model favours the appointment, but the estimates still need scrutiny, and safety rules are not part
    of the trade.
  s1_zh: 让机器继续转，并不等于产能可靠。在这个简化的一周模型里，结果支持按约保养，但这些估计仍要审查，安全规则也不在这笔交换里。
  s1_zh_hk: 等機器繼續轉，並唔等於產能可靠。喺呢個簡化嘅一星期模型裏面，結果支持按約保養，但呢啲估計仍然要審查，安全規則亦都唔喺呢筆交換裏面。
  s2_en: >-
    The workshop, probabilities and costs are invented. Official scene art is a teaching illustration
    only.
  s2_zh: 这家工坊、概率和成本都是虚构的。官方场景图只是教学插图。
  s2_zh_hk: 呢間工場、概率同成本都係虛構嘅。官方場景圖只係教學插圖。
  s3_en: No technical repair or inspection procedure is prescribed.
  s3_zh: 本案例不规定任何具体的维修或检查操作流程。
  s3_zh_hk: 本個案冇規定任何具體嘅維修或檢查程序。
duration_target_s: 190
