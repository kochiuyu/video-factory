  s1_en: >-
    The all-in cost of keeping the appointment is two thousand dollars, including the service and the
    economic cost of the planned interruption. This amount is not just the technician's invoice.
  s1_zh: 按约保养的全部成本是两千港元，包括保养本身，以及计划停机带来的经济成本。这不只是技术员的账单。
  s1_zh_hk: 按約保養嘅全部成本係兩千港元，包括保養本身，以及計劃停機帶來嘅經濟成本。呢筆唔只係技術員嘅賬單。
  s2_en: >-
    The manager wants to preserve today's output. The supervisor worries about an unscheduled stoppage
    when customer deadlines are closer. A condition assessment relevant to next week's reliability is
    still being reviewed.
  s2_zh: 经理想保住今天的产量。主管则担心，客户交期更紧的时候出现非计划停机。一份与下周可靠性有关的状态评估，还在审阅之中。
  s2_zh_hk: 經理想保住今日嘅產量。主管則擔心，客戶交期更緊嘅時候出現非計劃停機。一份同下週可靠性有關嘅狀態評估，仲喺審閱之中。
  s3_en: >-
    There is no known safety fault, no overdue mandatory service, and either timing remains within manufacturer
    requirements. The component is not safety-critical. Safety obligations are not traded against money.
  s3_zh: >-
    目前没有已知的安全故障，也没有过期未做的强制保养，两种时间安排都仍在制造商要求之内。所讨论的部件不是安全关键部件。安全责任不能拿来跟金钱交换。
  s3_zh_hk: >-
    目前冇已知嘅安全故障，亦都冇過期未做嘅強制保養，兩種時間安排都仍然喺製造商要求之內。所討論嘅部件唔係安全關鍵部件。安全責任唔可以攞嚟同金錢交換。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
