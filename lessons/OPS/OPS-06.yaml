  title_en: Keep running, or stop on purpose?
  title_zh: 继续开机，还是主动停机？
  title_zh_hk: 繼續運作，還是主動停機？
  image: art/planned-stop-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In June 2025, the Hong Kong Government reported receiving MTR investigation reports and an action
    plan, including faster use of predictive maintenance. Railway safety is outside this classroom comparison.
    You run a fictional Hong Kong print-finishing workshop. Its paper-folding machine is working, and
    a busy week is ahead. An optional preventive service would interrupt production.
  zh: >-
    二零二五年六月，香港政府表示已收到港铁的调查报告和行动计划，其中包括更快应用预测性维护。铁路安全不在这个课堂比较之内。你管理一家虚构的香港印后加工工坊。折纸机现在运转正常，接下来是忙碌的一周。一次可选的预防性保养，会打断生产。
  zh_hk: >-
    二零二五年六月，香港政府表示已收到港鐵嘅調查報告同行動計劃，當中包括更快應用預測性保養。鐵路安全唔喺呢個課堂比較之內。你管理一間虛構嘅香港印後加工工場。摺紙機而家運作正常，接下來係忙碌嘅一星期。一次可選嘅預防性保養，會打斷生產。
