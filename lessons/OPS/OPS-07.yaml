- id: bridge
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Sharing capacity can cut overall waits
  title_zh: 共享能力可以减少总体等待
  title_zh_hk: 共享能力可以減少總體等候
  step1_en: In A, the employee finishing Q1 can take P2
  step1_zh: 在A，做完Q1的员工可以接下P2
  step1_zh_hk: 在A，做完Q1的員工可以接P2
  step2_en: In B, that person must stay on quick work
  step2_zh: 在B，这个人只能继续做快速件
  step2_zh_hk: 在B，呢個人只能繼續做快速件
  step3_en: Q2 still waits longer in the common queue
  step3_zh: 但共用队列里，Q2会等得更久
  step3_zh_hk: 但共用隊列裏面，Q2會等得更耐
  s1_en: >-
    In A, the employee finishing Q one at minute two can take P two. In B, that person must remain on
    quick work, even while paperwork customers wait. The dedicated policy, not laziness or lack of training,
    creates the apparent idle capacity.
  s1_zh: >-
    在A方案里，第二分钟做完Q一的员工可以接下P二。在B方案里，这个人即使看到手续顾客在等，也只能继续守着快速件。看起来的闲置，是分类规则造成的，不是偷懒，也不是不会做。
  s1_zh_hk: >-
    喺A方案裏面，第二分鐘做完Q一嘅員工可以接下P二。喺B方案裏面，呢個人即使見到手續顧客喺度等，都只能繼續守住快速件。睇落嘅閒置，係分類規則造成，唔係偷懶，亦都唔係唔會做。
  s2_en: >-
    Pooling therefore improves overall waiting and last completion in these traces. It also makes Q two
    wait longer: six minutes rather than two. A better overall mean is not a better experience for every
    customer.
  s2_zh: >-
    因此，在这两次推演里，共用队列改善了总体等待和最晚完成时间。可是Q二会等得更久：六分钟而不是两分钟。总体平均更好，并不等于每一位顾客都等得更短。
  s2_zh_hk: >-
    因此，喺呢兩次推演裏面，共用隊列改善咗總體等候同最晚完成時間。但係Q二會等得更耐：六分鐘而唔係兩分鐘。總體平均更好，並唔等於每一位顧客都等得更短。
  s3_en: >-
    When Q three arrives at minute five, B's express employee is available immediately. In A both employees
    are already occupied, so Q three waits. The previously idle express capacity has a use when that arrival
    occurs.
  s3_zh: >-
    当Q三在第五分钟到达时，B方案里做快速件的员工马上有空。在A方案里，两人都已经被占用，所以Q三要等。先前看起来闲着的快速通道，在这位顾客到来时就用上了。
  s3_zh_hk: >-
    當Q三喺第五分鐘到達嗰陣，B方案裏面做快速件嘅員工即刻有空。喺A方案裏面，兩人都已經被佔用，所以Q三要等。先前睇落閒住嘅快速通道，喺呢位顧客到來嗰陣就用得着。
- id: meaning
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: State the service objective first
  title_zh: 先说清楚要改善哪一种等待
  title_zh_hk: 先講清楚要改善邊一種等候
  step1_en: A still has the slightly lower mean wait
  step1_zh: 六人推演里，A的平均等待仍略低
  step1_zh_hk: 六人推演裏，A嘅平均等候仍略低
  step2_en: B still gives quicker service to Q customers
  step2_zh: B仍然让快速顾客等得更短
  step2_zh_hk: B仍然讓快速顧客等得更短
  step3_en: A hybrid rule needs its own complete trace
  step3_zh: 混合规则必须重新完整推演一次
  step3_zh_hk: 混合規則必須重新完整推演一次
  s1_en: >-
    The common queue still has the slightly lower mean waiting time in the six-customer trace, while dedicated
    counters give quick customers shorter waits. The manager must make that service tradeoff explicit,
    rather than silently choosing a metric after seeing the results.
  s1_zh: >-
    在六名顾客的推演里，共用队列的平均等待仍然略低，而分类专柜让快速顾客等得更短。经理必须先说清楚要保障哪一种服务目标，而不能看完结果再偷偷换一个指标。
  s1_zh_hk: >-
    喺六名顧客嘅推演裏面，共用隊列嘅平均等候仍然略低，而專用櫃位讓快速顧客等得更短。經理必須先講清楚要保障邊一種服務目標，而不能睇完結果再偷偷換一個指標。
  s2_en: >-
    Observe arrival timing, category mix, service duration and waiting by category during a pilot. This
    exercise holds employee speeds fixed; a real queue design may also affect behaviour. No result here
    establishes universal superiority, fairness or financial returns.
  s2_zh: >-
    试点时要观察到达时间、业务类型搭配、办理时长，以及各类顾客的等待。这个练习把员工速度固定下来；真实的排队设计，还可能改变行为。这里的结果，并不能证明哪一种方案普遍更优、更公平，或在财务上更好。
  s2_zh_hk: >-
    試點時要觀察到達時間、業務類型搭配、辦理時長，以及各類顧客嘅等候。呢個練習將員工速度固定咗；真實嘅排隊設計，仲可能改變行為。呢度嘅結果，並唔能夠證明邊一種方案普遍更優、更公平，或喺財務上更好。
  s3_en: >-
    A rule allowing the express employee to help paperwork when that queue is empty may be worth evaluating.
    But once that employee starts a six-minute transaction, they cannot interrupt it for a new quick arrival.
    Work through the complete revised sequence before claiming a hybrid achieves both benefits.
  s3_zh: >-
    有人会想：快速通道空着时，让那位员工去帮手续柜台。这个规则值得另做推演。可是一旦这个人开始办理一笔六分钟的手续，按本题规则就不能中途停下来接待新来的快速顾客。在完整重演之前，不能说混合规则一定能兼得两种好处。
  s3_zh_hk: >-
    有人會想：快速通道空置嗰陣，等嗰位員工去幫手續櫃位。呢條規則值得另外推演。但係一旦呢個人開始辦理一筆六分鐘嘅手續，按本題規則就唔可以中途停低去接待新嚟嘅快速顧客。喺完整重演之前，唔可以話混合規則一定能夠兼得兩種好處。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Completion time is not waiting time
  title_zh: 完成时刻，不是等待时间
  title_zh_hk: 完成時刻，唔係等候時間
  en: >-
    Waits and completion times are not interchangeable. With Q three, total waits become nineteen and
    twenty across six customers, and the quick means become three minutes and two thirds of a minute.
    Do not treat one added arrival as a statistically reliable demand forecast.
  zh: >-
    等待时间和完成时刻不能互相代替。加入Q三以后，六人总等待变成十九和二十分钟，快速件人均等待变成三分钟和三分之二分钟。不要把多来的这一位，当成统计上可靠的需求预测。
  zh_hk: >-
    等候時間同完成時刻唔可以互相代替。加入Q三之後，六人總等候變成十九同二十分鐘，快速件人均等候變成三分鐘同三分之二分鐘。唔好將多嚟呢一位，當成統計上可靠嘅需求預測。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Choose the wait you want to improve
  title_zh: 先选定你要改善的那种等待
  title_zh_hk: 先選定你要改善嘅那種等候
  q1_en: Pooling can cut the overall mean
  q1_zh: 共用可以降低总体平均等待
  q1_zh_hk: 共用可以降低總體平均等候
  q2_en: Idle express time can protect a service promise
  q2_zh: 快速通道的空闲，也能保障服务承诺
  q2_zh_hk: 快速通道嘅空閒，都能保障服務承諾
  s1_en: >-
    A common queue and dedicated counters serve different objectives in these traces. Say which wait the
    manager wants to improve before choosing a design, and test the arrival pattern in a pilot.
  s1_zh: 在这些推演里，共用队列和分类专柜对应的是不同目标。先说清楚经理要改善哪一种等待，再选排队设计，并在试点中核对到达规律。
  s1_zh_hk: 喺呢啲推演裏面，共用隊列同專用櫃位對應嘅係唔同目標。先講清楚經理要改善邊一種等候，再揀排隊設計，並喺試點中核對到達規律。
  s2_en: >-
    The shop, transaction times and arrivals are invented. Official scene art is a teaching illustration
    only.
  s2_zh: 这家店、办理时间和到达情况都是虚构的。官方场景图只是教学插图。
  s2_zh_hk: 呢間店、辦理時間同到達情況都係虛構嘅。官方場景圖只係教學插圖。
  s3_en: This collection desk is not an analogy for medical triage.
  s3_zh: 这个取件柜台，不能拿来类比医疗分诊。
  s3_zh_hk: 呢個取件櫃位，唔可以攞嚟類比醫療分流。
