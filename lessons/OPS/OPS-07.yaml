  zh: 你会试点哪个方案：A的共用队列，还是B的分类专柜？关于到达情况或顾客等待，什么样的证据会让你改主意？请暂停，投个票。
  zh_hk: 你會試點邊個方案：A嘅共用隊列，定B嘅專用櫃位？關於到達情況或顧客等候，點樣嘅證據會令你改主意？暫停，投個票。
