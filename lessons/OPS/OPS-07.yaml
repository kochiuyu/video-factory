  s1_en: >-
    Now add one change to that same trace: a third quick customer, Q three, arrives at minute five. Everyone
    else's arrival and service requirement is unchanged.
  s1_zh: 现在只改一件事：第三位快速顾客Q三在第五分钟到达。其他人的到达时间和办理类型都不变。
  s1_zh_hk: 而家只改一件事：第三位快速顧客Q三喺第五分鐘到達。其他人嘅到達時間同辦理類型都不變。
  s2_en: >-
    Under A, both employees are busy until minute six. Q two starts at six. At eight both become free,
    so P three and then Q three can both start. Q three finishes at ten and waits three minutes.
  s2_zh: >-
    在A方案下，两名员工直到第六分钟都在忙。Q二从第六分钟开始办理。到第八分钟两人都空出来，P三和Q三可以一起开始。Q三在第十分钟办完，等了三分钟。
  s2_zh_hk: >-
    喺A方案之下，兩名員工直到第六分鐘都喺度忙。Q二由第六分鐘開始辦理。到第八分鐘兩人都空出嚟，P三同Q三可以一齊開始。Q三喺第十分鐘辦完，等咗三分鐘。
  s3_en: >-
    Under B, the express employee finished Q two at four, so Q three starts at five, finishes at seven
    and waits zero. Earlier customers' waits are unchanged. This extra arrival is a hypothetical comparison,
    not a forecast of tomorrow's demand.
  s3_zh: >-
    在B方案下，专做快速件的员工第四分钟就做完了Q二，所以Q三第五分钟立即开始，第七分钟结束，等待为零。前面几位的等待不变。多出来的这位顾客，是用来比较的假设，不是对明天需求的预测。
  s3_zh_hk: >-
    喺B方案之下，專做快速件嘅員工第四分鐘已經做完Q二，所以Q三第五分鐘即刻開始，第七分鐘結束，等候為零。前面幾位嘅等候不變。多出嚟呢位顧客，係用嚟比較嘅假設，唔係對明天需求嘅預測。
