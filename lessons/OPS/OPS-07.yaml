  s1_en: >-
    Each transaction stays with its employee until completion. Policy A is one first-come-first-served
    queue, and the next customer goes to whichever employee is free. Policy B gives one employee only
    quick collections and the other only paperwork. Under B, an idle employee cannot help the other queue.
  s1_zh: >-
    每笔业务会由同一名员工做到完。方案A是一条先到先得的共用队列，谁空闲就接待下一位。方案B是一人只做快速取件，另一人只做手续件。在B方案下，空着的员工不能去帮另一队。
  s1_zh_hk: >-
    每筆業務會由同一名員工做到完。方案A係一條先到先得嘅共用隊列，邊個空閒就接待下一位。方案B係一人只做快速取件，另一人只做手續件。喺B方案之下，空置嘅員工唔可以去幫另一隊。
  s2_en: >-
    Both employees start free at minute zero. Five customers are already present in recorded order P one,
    Q one, P two, Q two, P three. In this first trace, nobody else arrives. Waiting runs from arrival
    until service starts, not until it ends.
  s2_zh: >-
    两名员工在第零分钟都空闲。五名顾客已经在场，记录顺序是P一、Q一、P二、Q二、P三。在这一次推演里，没有其他顾客再来。等待时间从到达计到开始办理，不是计到办理结束。
  s2_zh_hk: >-
    兩名員工喺第零分鐘都空閒。五名顧客已經在場，記錄次序係P一、Q一、P二、Q二、P三。喺呢一次推演裏面，冇其他顧客再來。等候時間由到達計到開始辦理，唔係計到辦理結束。
  s3_en: >-
    For these five, common-queue waits are zero, zero, two, six and eight minutes, totalling sixteen,
    or three point two on average. Dedicated waits are zero, zero, six, two and twelve, totalling twenty.
    Quick-customer waits average three minutes under A and one under B. Last completion is minute fourteen
    under A and minute eighteen under B.
  s3_zh: >-
    这五人在共用队列里的等待是零、零、二、六和八分钟，一共十六分钟，人均三点二。分类专柜是零、零、六、二和十二，一共二十分钟。快速顾客的平均等待，A是三分钟，B是一分钟。最晚完成时间，A是第十四分钟，B是第十八分钟。
  s3_zh_hk: >-
    呢五人喺共用隊列裏面嘅等候係零、零、二、六同八分鐘，一共十六分鐘，人均三點二。專用櫃位係零、零、六、二同十二，一共二十分鐘。快速顧客嘅平均等候，A係三分鐘，B係一分鐘。最晚完成時間，A係第十四分鐘，B係第十八分鐘。
