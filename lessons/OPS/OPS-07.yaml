  kicker_zh_hk: OPS-07
  title_en: An empty counter. A waiting customer.
  title_zh: 柜台空着，顾客还在等
  title_zh_hk: 櫃位空着，顧客卻在等候
  image: art/empty-counter-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In December 2024, the Hong Kong Government said it would explore queue arrangements at the Hong Kong-Zhuhai-Macao
    Bridge Hong Kong Port, alongside flexible staffing. This classroom case is a repair shop's collection
    desk, not a port and not medical triage. Two equally trained employees can each complete a quick prepaid
    collection in two minutes, or a paperwork collection in six.
  zh: >-
    二零二四年十二月，香港政府表示会探讨港珠澳大桥香港口岸的排队安排，并配合弹性人手。课堂上的是一家维修店的取件柜台，不是口岸，也不是医疗分诊。两名同样受过训练的员工，完成一笔已付款的快速取件要两分钟，完成一笔要办手续的取件要六分钟。
  zh_hk: >-
    二零二四年十二月，香港政府表示會探討港珠澳大橋香港口岸嘅排隊安排，並配合彈性人手。課堂上嘅係一間維修店嘅取件櫃位，唔係口岸，亦都唔係醫療分流。兩名同樣受過訓練嘅員工，完成一筆已付款嘅快速取件要兩分鐘，完成一筆要辦手續嘅取件要六分鐘。
