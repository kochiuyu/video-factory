title_en: Check it again. Or make the mistake harder?
title_zh: 再检查一遍，还是让错误更难发生？
title_zh_hk: 再檢查一次，還是讓人不易出錯？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: OPS-08
  kicker_en: OPS-08
  kicker_zh: OPS-08
  kicker_zh_hk: OPS-08
  title_en: Check it again. Or make the mistake harder?
  title_zh: 再检查一遍，还是让错误更难发生？
  title_zh_hk: 再檢查一次，還是讓人不易出錯？
  image: art/harder-to-miss-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In October 2025, HKPC discussed visual inspection as a smart-manufacturing application. This classroom
    case is a small Hong Kong stationery workshop packing desk kits for adult office gifts. Every kit
    promises one notebook, one pencil, one eraser and one ruler. Last week, the existing pre-dispatch
    inspection found twenty-five of five hundred kits needing correction.
  zh: >-
    二零二五年十月，香港生产力促进局在讨论智能制造时提到了外观检验。课堂上的是一家小型香港文具工坊，为成人办公礼品打包文具套装。每套都承诺有一本笔记本、一支铅笔、一块橡皮和一把尺子。上周，现有的发货前检验发现，五百盒里有二十五盒需要纠正。
  zh_hk: >-
    二零二五年十月，香港生產力促進局喺討論智能製造時提到咗外觀檢驗。課堂上嘅係一間小型香港文具工場，為成人辦公禮品包裝文具套裝。每套都承諾有一本筆記簿、一枝鉛筆、一塊擦膠同埋一把尺。上週，現有嘅出貨前檢驗發現，五百盒裏面有二十五盒需要修正。
