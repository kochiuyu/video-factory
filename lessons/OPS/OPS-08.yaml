  zh: 下周这六个工时，你会用来再加一道最终检查，还是用来上托盘？先做一个初步选择，并说一种会让你改主意的缺陷模式。请暂停，投个票。
  zh_hk: 下週呢六個工時，你會用嚟再加一次最終檢查，定用嚟上托盤？先做一個初步選擇，並講一種會令你改主意嘅缺陷模式。暫停，投個票。
