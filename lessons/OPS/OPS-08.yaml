- id: bridge
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Target the error, not the worker
  title_zh: 针对错误本身，而不是针对人
  title_zh_hk: 針對錯誤本身，而不是針對人
  step1_en: 20 of 25 recorded problems were omissions
  step1_zh: 25盒里有20盒是漏放，占80%
  step1_zh_hk: 25盒裏有20盒是漏放，佔80%
  step2_en: A second check detects, but may not prevent
  step2_zh: 再检查一次，能发现，却未必能防止
  step2_zh_hk: 再檢查一次，能發現，卻未必能防止
  step3_en: The tray makes the four-part set visible
  step3_zh: 托盘让四件套在装箱时看得见
  step3_zh_hk: 托盤讓四件套在裝箱時睇得見
  s1_en: >-
    Most recorded problems were missing parts: twenty of twenty-five kits, or eighty percent. That eighty
    percent is not a universal Pareto law. Count kits, not defect instances: the categories are exclusive.
  s1_zh: >-
    记录到的问题里，大多数是漏放：二十五盒中有二十盒，也就是百分之八十。这个百分之八十，并不是普遍适用的帕累托法则。要按礼盒计数，不要按缺陷次数计数，因为两类并不重叠。
  s1_zh_hk: >-
    記錄到嘅問題裏面，大多數係漏放：二十五盒之中有二十盒，亦即百分之八十。呢個百分之八十，並唔係普遍適用嘅帕累托法則。要按禮盒計數，唔好按缺陷次數計數，因為兩類並唔重疊。
  s2_en: >-
    A second check could detect omissions and other defects, but it does not change how a part gets left
    out during packing. The tray makes the intended four-part set visible at the step where an omission
    can occur.
  s2_zh: 再加一道检查，有可能发现漏放和其他缺陷，但它并没有改变装箱时为什么会少放一件。托盘是在漏放可能发生的那一步，把应有的四件套变得看得见。
  s2_zh_hk: 再加一次檢查，有可能發現漏放同其他缺陷，但它並冇改變裝箱嗰陣點解會少放一件。托盤係喺漏放可能發生嗰一步，將應有嘅四件套變得睇得見。
  s3_en: >-
    Correct loading, transfer and the final empty-tray check still depend on the routine. A visible warning
    is not a physical guarantee, and loose piles or interruptions are process clues, not evidence that
    a particular worker was careless.
  s3_zh: >-
    能不能放对、能不能正确转入，以及最后是否确认托盘已空，仍然取决于这套做法有没有被执行。看得见的提醒，不是物理上的保证。零件散放或工作被打断，是流程上的线索，不能用来证明某一个员工不认真。
  s3_zh_hk: >-
    可唔可以放對、可唔可以正確轉入，以及最後係咪確認托盤已空，仍然取決於呢套做法有冇被執行。睇得見嘅提醒，唔係物理上嘅保證。零件散放或工作被打斷，係流程上嘅線索，唔可以用嚟證明某一個員工唔認真。
- id: meaning
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Choose the tray; keep the existing checks
  title_zh: 可选用托盘，但原有检查要保留
  title_zh_hk: 可選用托盤，但原有檢查要保留
  step1_en: >-
    First-pass results: 95% then 98.2%
  step1_zh: 一次通过率：先是95%，试验为98.2%
  step1_zh_hk: 一次通過率：先是95%，試驗為98.2%
  step2_en: That is 16 fewer kits needing correction
  step2_zh: 需要纠正的礼盒少了16盒
  step2_zh_hk: 需要修正的禮盒少咗16盒
  step3_en: The misprinted-cover count did not change
  step3_zh: 封面印错的数量并没有下降
  step3_zh_hk: 封面印錯的數量並冇下降
  s1_en: >-
    B now has stronger support for this workshop's main recorded problem. The trial suggests a workable
    routine and fewer omissions, so use the six hours to prepare the reusable trays, test their setup
    and teach the method.
  s1_zh: >-
    对这家工坊记录最多的问题来说，现在更支持选B。试验显示这套做法可以运转，漏放也更少，所以这六个工时应用来准备可重复使用的托盘，测试布置，并教会方法。
  s1_zh_hk: >-
    對呢間工場記錄最多嘅問題嚟講，而家更支持揀B。試驗顯示呢套做法可以運轉，漏放亦都更少，所以呢六個工時應用嚟準備可重複使用嘅托盤，測試佈置，並教導方法。
  s2_en: >-
    The earlier release check found four hundred and seventy-five of five hundred kits needing no correction:
    ninety-five percent. In the trial it found four hundred and ninety-one of five hundred: ninety-eight
    point two percent. That is an observed increase of three point two percentage points, with sixteen
    fewer kits requiring correction.
  s2_zh: >-
    先前的放行检验里，五百盒中有四百七十五盒一次通过，也就是百分之九十五。试验里是四百九十一盒，即百分之九十八点二。一次通过率上升了三点二个百分点，需要纠正的礼盒少了十六盒。
  s2_zh_hk: >-
    先前嘅放行檢驗裏面，五百盒之中有四百七十五盒一次通過，亦即百分之九十五。試驗裏面係四百九十一盒，即百分之九十八點二。一次通過率上升咗三點二個百分點，需要修正嘅禮盒少咗十六盒。
  s3_en: >-
    The misprinted-cover count did not change. Keep the original release inspection for print defects,
    remaining omissions and other problems. These figures are not customer satisfaction or guaranteed
    outgoing quality, and the batches were not randomly assigned. Do not promise sixteen fewer defective
    kits every week.
  s3_zh: >-
    封面印错的数量没有变。原来的放行检验仍要保留，用来发现印刷问题、仍然可能出现的漏放，以及其他缺陷。这些数字不是顾客满意度，也不能保证出厂质量。两批并不是随机分配的，不要承诺每周都会少十六盒不良。
  s3_zh_hk: >-
    封面印錯嘅數量冇變。原來嘅放行檢驗仍然要保留，用嚟發現印刷問題、仍然可能出現嘅漏放，以及其他缺陷。呢啲數字唔係顧客滿意度，亦都唔能夠保證出廠品質。兩批並唔係隨機分配，唔好承諾每週都會少十六盒不良。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Process evidence is not permission to drop checks
  title_zh: 流程证据，不是取消检查的许可
  title_zh_hk: 流程證據，唔係取消檢查嘅許可
  en: >-
    A second final check remains defensible if broad immediate detection is the priority, or if the tray
    routine cannot be reliably maintained. Continuing tray use still has handling effort. A rare serious
    safety defect would need attention regardless of frequency; this case is a low-risk office-gift kit.
  zh: >-
    如果当务之急是马上发现各类缺陷，或者托盘这套做法无法可靠执行，再加一道最终检查仍然说得通。托盘一旦日常使用，仍要花操作工夫。如果是罕见但严重的安全缺陷，不论频率高低都要处理；本题是低风险的办公礼品套装。
  zh_hk: >-
    如果當務之急係即刻發現各類缺陷，或者托盤呢套做法無法可靠執行，再加一次最終檢查仍然講得通。托盤一旦日常使用，仍然要花操作工夫。如果係罕見但嚴重嘅安全缺陷，不論頻率高低都要處理；本題係低風險嘅辦公禮品套裝。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Make the omission harder at the source
  title_zh: 在源头让漏放更难发生
  title_zh_hk: 喺源頭讓漏放更難發生
  q1_en: Inspecting again is not the only response
  q1_zh: 再检查一遍，不是唯一的办法
  q1_zh_hk: 再檢查一次，唔係唯一嘅辦法
  q2_en: Keep release checks for what the tray cannot catch
  q2_zh: 托盘抓不到的问题，仍要靠放行检验
  q2_zh_hk: 托盤抓唔到嘅問題，仍要靠放行檢驗
  s1_en: >-
    When omissions are the main recorded problem, it can be better to make the intended set visible at
    the packing step, while keeping the existing release inspection.
  s1_zh: 当记录到的主要问题是漏放时，更好的做法往往是：在装箱这一步把应有的套装变得看得见，同时保留原有的放行检验。
  s1_zh_hk: 當記錄到嘅主要問題係漏放時，更好嘅做法往往係：喺裝箱呢一步將應有嘅套裝變得睇得見，同時保留原有嘅放行檢驗。
  s2_en: >-
    The workshop, kits, allowance, trial and all quantities are fictional. Official scene art is a teaching
    illustration only.
  s2_zh: 这家工坊、礼盒、额度、试验和全部数量都是虚构的。官方场景图只是教学插图。
  s2_zh_hk: 呢間工場、禮盒、額度、試驗同全部數量都係虛構嘅。官方場景圖只係教學插圖。
  s3_en: >-
    These are adult office-gift kits, not food, medical or safety-critical products.
  s3_zh: 这些是成人办公礼品套装，不是食品、医疗或安全关键产品。
  s3_zh_hk: 呢啲係成人辦公禮品套裝，唔係食品、醫療或安全關鍵產品。
