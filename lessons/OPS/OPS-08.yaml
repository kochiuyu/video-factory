  s1_en: >-
    The detailed defect breakdown is not yet at the meeting. Every detected defect was corrected before
    dispatch, but no count of errors missed by inspection is available.
  s1_zh: 各类缺陷的明细还没有带到这次会上。已经查出的问题，发货前都纠正了，但检验有没有漏过的错误，并没有统计。
  s1_zh_hk: 各類缺陷嘅明細仲未帶到呢次會上。已經查出嘅問題，出貨前都修正咗，但檢驗有冇漏過嘅錯誤，並冇統計。
  s2_en: >-
    The supervisor has one separately funded allowance of six paid staff-hours next week. Either proposal
    fits it. Normal production staffing and the target stay unchanged. Existing release inspection, safety
    and legally required checks remain under either choice.
  s2_zh: >-
    主管下周有一笔单独拨付的六个员工工时，用来做改进。两个方案都刚好用得上这笔额度。正常生产人手和产量目标都不变。无论选哪一个，现有的放行检验、安全和法定检查都保留。
  s2_zh_hk: >-
    主管下週有一筆單獨撥付嘅六個員工工時，用嚟做改進。兩個方案都剛剛用得上呢筆額度。正常生產人手同產量目標都不變。無論揀邊一個，現有嘅放行檢驗、安全同法定檢查都保留。
  s3_en: >-
    With the tray, fill all four positions before transferring the set into a box, then check that no
    part remains in the tray before closing. It is a visual aid, not an automatic lock: it can be misloaded
    or bypassed. Its refill and checking effort must be considered.
  s3_zh: >-
    如果用托盘，要先把四个位置都放满，再把一套转入盒子，合盖前还要确认托盘里没有剩下零件。它是视觉辅助，不是自动锁：放错或绕过都有可能。补货和核对所花的工夫，也必须考虑进去。
  s3_zh_hk: >-
    如果用托盤，要先將四個位置都放滿，再將一套轉入盒子，合蓋前仲要確認托盤裏面冇剩低零件。它係視覺輔助，唔係自動鎖：放錯或繞過都有可能。補貨同核對所花嘅工夫，都必須考慮進去。
