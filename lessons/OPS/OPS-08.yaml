  footer_en: Categories do not overlap; trial already finished
  footer_zh: 两类不重叠；试验已完成，不占用下周额度
  footer_zh_hk: 兩類不重疊；試驗已完成，不佔下週額度
  s1_en: >-
    The records show twenty of the twenty-five kits lacked one item, and five had a visibly misprinted
    notebook cover. The categories do not overlap. Observation also found that loose component piles and
    interruptions made it easy to lose count.
  s1_zh: 记录显示，二十五盒里有二十盒少了一件物品，五盒的笔记本封面明显印错。两类并不重叠。观察还发现，零件散放，再加上工作被打断，很容易数错。
  s1_zh_hk: 記錄顯示，二十五盒裏面有二十盒少咗一件物品，五盒嘅筆記簿封面明顯印錯。兩類並唔重疊。觀察仲發現，零件散放，再加上工作被打斷，好容易數錯。
  s2_en: >-
    A preparatory trial, already completed before this decision, used prototype trays for another five
    hundred comparable kits. It did not use next week's six-hour allowance. Ordinary trained operators
    used the same four components and release criteria, including tray refilling and the before-and-after
    transfer checks.
  s2_zh: >-
    在这次决策之前，已经做完一次准备性试验：用原型托盘又做了五百盒同类礼盒。它没有占用下周那六个工时。普通受训员工使用同样的四件套和放行标准，也包括补货，以及转入前后的核对。
  s2_zh_hk: >-
    喺呢次決策之前，已經做完一次準備性試驗：用原型托盤又做咗五百盒同類禮盒。它冇佔用下週嗰六個工時。普通受訓員工使用同樣嘅四件套同放行標準，亦包括補貨，以及轉入前後嘅核對。
  s3_en: >-
    The trial found four kits missing an item and five with a misprinted cover, nine in total. This before-and-after
    comparison is encouraging, not a controlled proof that the tray caused the entire change. The tray
    still cannot guarantee correct loading or replace release inspection.
  s3_zh: >-
    试验里，少一件的有四盒，封面印错的仍是五盒，合计九盒。这个前后对比令人鼓舞，但并不是受控证据，不能证明全部变化都是托盘造成的。托盘仍然不能保证一定放对，也不能取代放行检验。
  s3_zh_hk: >-
    試驗裏面，少一件嘅有四盒，封面印錯嘅仍然係五盒，合計九盒。呢個前後對比令人鼓舞，但並唔係受控證據，唔能夠證明全部變化都係托盤造成。托盤仍然唔能夠保證一定放對，亦都唔能夠取代放行檢驗。
