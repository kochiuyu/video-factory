  kicker: OPS-09
  kicker_en: OPS-09
  kicker_zh: OPS-09
  kicker_zh_hk: OPS-09
  title_en: Print now. Or keep the design open?
  title_zh: 现在就印，还是晚点再定图案？
  title_zh_hk: 現在印花，還是留待稍後決定款式？
  image: art/keep-the-design-open-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In September 2024, HKPC discussed small-volume customisation and manufacturing flexibility. An independent
    Hong Kong maker is preparing one hundred fabric pouches in two original prints: leaf and wave. Construction
    and quality are otherwise identical. Customers want their selected design and will not substitute
    the other. The decision is when to commit the designs, not how many pouches to buy.
  zh: >-
    二零二四年九月，香港生产力促进局讨论了小批量定制和制造柔性。一家独立的香港制作者，要做一百个布袋，有叶纹和波纹两种原创图案。除此之外，结构和质量都一样。顾客要自己选中的图案，不会用另一种代替。要决定的是何时定下图案，不是买多少个布袋。
  zh_hk: >-
    二零二四年九月，香港生產力促進局討論咗小批量定制同製造彈性。一間獨立嘅香港製作者，要做一百個布袋，有葉紋同波浪紋兩種原創款式。除此之外，結構同品質都一樣。顧客要自己選中嘅款式，唔會用另一種代替。要決定嘅係何時敲定款式，唔係買幾多個布袋。
