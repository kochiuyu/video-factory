  step3_zh: A多出的30个波纹，不能改成叶纹
  step3_zh_hk: A多出的30個波浪紋，不能改成葉紋
  s1_en: >-
    The sales coordinator brings the selection tally from a completed comparable pop-up: eighty customers
    chose leaf and twenty chose wave. The same designs and price were offered, with both available throughout
    selection.
  s1_zh: 销售协调员带来一次已结束的类似快闪活动的选款统计：八十位顾客选了叶纹，二十位选了波纹。当时两种图案和价格都在，而且全程都有货。
  s1_zh_hk: 銷售協調員帶嚟一次已結束嘅類似快閃活動嘅選款統計：八十位顧客選咗葉紋，二十位選咗波浪紋。當時兩種款式同價格都喺度，而且全程都有貨。
  s2_en: >-
    One event and a potentially different audience cannot establish the next mix. Add an eighty-twenty
    scenario alongside the initial fifty-fifty scenario before committing. No probabilities are supplied.
  s2_zh: 一次活动和可能不同的受众，并不能确定下一次的搭配。在做承诺之前，要把八十对二十这个情景，和起初的五十对五十放在一起看。题目没有给出概率。
  s2_zh_hk: 一次活動同可能唔同嘅受眾，並唔能夠確定下一次嘅搭配。喺做承諾之前，要把八十對二十呢個情境，同起初嘅五十對五十放喺一齊睇。題目冇畀出概率。
  s3_en: >-
    Under B's existing quote, the one hundred common blanks can become eighty leaf and twenty wave in
    the reserved slot, without extra stock or charges. Under A, the thirty surplus wave pouches cannot
    become the missing leaf pouches. No third or unpriced hybrid offer has appeared.
  s3_zh: >-
    按B现有报价，一百个通用素袋可以在预留时段做成叶纹八十、波纹二十，不用额外备货，也不另加费用。按A，多出来的三十个波纹布袋，不能改成缺少的叶纹。现在也没有第三种、尚未定价的混合方案。
  s3_zh_hk: >-
    按B現有報價，一百個通用素袋可以喺預留時段做成葉紋八十、波浪紋二十，唔使額外備貨，亦都唔另加費用。按A，多出嚟嘅三十個波浪紋布袋，唔可以改成缺少嘅葉紋。而家亦都冇第三種、尚未定價嘅混合方案。
