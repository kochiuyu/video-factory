  title_zh_hk: 多付400港元換彈性，值得嗎？
  en: >-
    Does keeping the design open justify four hundred dollars extra? Compare both design-mix scenarios,
    choose a plan, and identify the evidence that makes your choice defensible. Pause and vote again.
  zh: 为了晚点再定图案，多付四百港元值得吗？请把两种搭配情景都比较一遍，再选一个方案，并指出能支持这个选择的证据。请暂停，再投一次票。
  zh_hk: 為咗稍後先敲定款式，多付四百港元值得嗎？請將兩種搭配情境都比較一次，再揀一個方案，並指出能夠支持呢個選擇嘅證據。暫停，再投一次票。
- id: bridge
  visual: table_grid
  seconds: 26
  rows: 2
  cols: 2
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Surplus in two mix scenarios, HK$
  title_zh: 两种搭配下的盈余，港元
  title_zh_hk: 兩種搭配下的盈餘，港元
  row1_en: A · Early 50/50
  row1_zh: A · 提前50/50
  row1_zh_hk: A · 提早50/50
  row2_en: B · Flexible late
  row2_zh: B · 晚点再定
  row2_zh_hk: B · 稍後再定
  col1_en: If 50/50
  col1_zh: 若是50/50
  col1_zh_hk: 若是50/50
  col2_en: If 80/20
  col2_zh: 若是80/20
  col2_zh_hk: 若是80/20
  c11: 2,000
  c12: '950'
  c21: 1,600
  c22: 1,600
  footer_en: Revenue plus clearance, less the quoted cost
  footer_zh: 销售收入加残值，再减去报价成本
  footer_zh_hk: 銷售收入加殘值，再減去報價成本
  s1_en: >-
    With fifty leaf and fifty wave requests, either plan sells all one hundred pouches for four thousand
    dollars, with no leftovers. A leaves two thousand dollars after its two-thousand-dollar cost. B leaves
    one thousand six hundred after its two-thousand-four-hundred-dollar cost. In that scenario, keeping
    the mix open costs four hundred without adding sales.
  s1_zh: >-
    如果需求是叶纹五十、波纹五十，两个方案都能卖掉一百个，收入四千港元，没有剩余。A扣掉两千成本，剩下两千港元。B扣掉两千四百，剩下一千六百港元。在这个情景里，把搭配留到后面，会多花四百港元，却不能增加销售。
  s1_zh_hk: >-
    如果需求係葉紋五十、波浪紋五十，兩個方案都能賣走一百個，收入四千港元，冇剩餘。A扣咗兩千成本，剩返兩千港元。B扣咗兩千四百，剩返一千六百港元。喺呢個情境裏面，將搭配留到後面，會多花四百港元，卻唔能夠增加銷售。
  s2_en: >-
    With eighty leaf and twenty wave requests, A sells fifty leaf plus twenty wave: seventy pouches. Its
    thirty remaining wave pouches have net clearance value of one hundred and fifty dollars. Surplus is
    seventy times forty, plus thirty times five, minus two thousand, which is nine hundred and fifty.
  s2_zh: >-
    如果需求是叶纹八十、波纹二十，A能卖掉五十个叶纹加二十个波纹，共七十个。剩下三十个波纹，净残值一百五十港元。盈余是七十乘以四十，加上三十乘以五，再减去两千，等于九百五十港元。
  s2_zh_hk: >-
    如果需求係葉紋八十、波浪紋二十，A能夠賣走五十個葉紋加二十個波浪紋，共七十個。剩低三十個波浪紋，淨殘值一百五十港元。盈餘係七十乘以四十，加三十乘以五，再減去兩千，等於九百五十港元。
  s3_en: >-
    B finishes the requested eighty-twenty mix and sells all one hundred. Its surplus remains one thousand
    six hundred, six hundred and fifty above A in this scenario. Total demand and total stock are still
    one hundred. The advantage comes from delaying the irreversible design choice, not from creating more
    units.
  s3_zh: >-
    B能按八十对二十做完，并卖掉全部一百个。盈余仍是一千六百港元，在这个情景里比A多六百五十港元。总需求和总库存还是一百个。优势来自推迟那个不能反悔的图案决定，而不是做出了更多布袋。
  s3_zh_hk: >-
    B能夠按八十對二十做完，並賣走全部一百個。盈餘仍然係一千六百港元，喺呢個情境裏面比A多六百五十港元。總需求同總存貨仲係一百個。優勢來自推遲嗰個唔可以反悔嘅款式決定，而唔係做出咗更多布袋。
- id: meaning
  visual: steps
  seconds: 24
  layout: rows
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A price for flexibility, not an automatic win
  title_zh: 这是柔性的价格，不是必赢的方案
  title_zh_hk: 呢個係彈性嘅價錢，唔係必贏嘅方案
  step1_en: A is ahead by HK$400 if the mix is balanced
  step1_zh: 搭配均衡时，A多出400港元
  step1_zh_hk: 搭配均衡時，A多出400港元
  step2_en: B is ahead by HK$650 if the mix is 80/20
  step2_zh: 若是80/20，B多出650港元
  step2_zh_hk: 若是80/20，B多出650港元
  step3_en: A's fall is HK$1,050, not HK$1,200
  step3_zh: A少收的是1,050港元，不是1,200
  step3_zh_hk: A少收嘅係1,050港元，唔係1,200
  s1_en: >-
    A is ahead by four hundred dollars in the balanced scenario; B is ahead by six hundred and fifty in
    the imbalanced one. Neither wins in both, and one historical tally supplies no probability that determines
    an expected-return ranking.
  s1_zh: 搭配均衡时，A多出四百港元；搭配不均时，B多出六百五十港元。没有一个方案在两种情景里都赢。一次历史统计，并不能给出用来比较期望回报的概率。
  s1_zh_hk: 搭配均衡時，A多出四百港元；搭配不均時，B多出六百五十港元。冇一個方案喺兩種情境裏面都贏。一次歷史統計，並唔能夠畀出用嚟比較期望回報嘅概率。
  s2_en: >-
    Clearance value matters: A's fall from two thousand to nine hundred and fifty is one thousand and
    fifty, not one thousand two hundred, because the thirty leftover wave pouches still have net clearance
    value. The same arithmetic holds for a twenty-eighty reversal, because the two designs have symmetric
    costs and prices.
  s2_zh: >-
    残值很重要：A从两千降到九百五十，少了的是一千零五十，不是一千二百，因为剩下的三十个波纹布袋仍有净残值。如果换成二十对八十，算术一样，因为两种图案的成本和售价是对称的。
  s2_zh_hk: >-
    殘值好重要：A由兩千降至九百五十，少咗嘅係一千零五十，唔係一千二百，因為剩低嘅三十個波浪紋布袋仍然有淨殘值。如果換成二十對八十，算術一樣，因為兩種款式嘅成本同售價係對稱嘅。
  s3_en: >-
    A can be defended by convincing evidence of a balanced mix. B can be defended by material mix uncertainty
    and the value placed on fulfilling customer selections. Common blanks help only if designs, materials,
    printing capacity and checks are ready in time. Those conditions are included in B's quote here, and
    should be verified before a real commitment.
  s3_zh: >-
    如果有有力证据显示搭配会比较均衡，可以支持选A。如果搭配很不确定，又重视按顾客所选交付，可以支持选B。通用素袋要真的有用，前提是图案、材料、印制产能和检查都能及时就绪。这些条件在本题里已经写进B的报价，实际承诺之前仍要核实。
  s3_zh_hk: >-
    如果有有力證據顯示搭配會比較均衡，可以支持揀A。如果搭配好唔確定，又重視按顧客所選交付，可以支持揀B。通用素袋要真係有用，前提係款式、物料、印製產能同檢查都能夠及時就緒。呢啲條件喺本題裏面已經寫入B嘅報價，實際承諾之前仍然要核實。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: What does the extra HK$400 buy?
  title_zh: 多花的400港元买到了什么？
  title_zh_hk: 多付400港元，買到甚麼？
  en: >-
    The four hundred dollars buys the ability to choose variants later, backed by a paid, feasible finishing
    slot. Do not invent a costless hybrid, missing probabilities, or an environmental saving from leftover
    counts. Late finishing is not permission to rush quality checks.
  zh: >-
    这四百港元买到的，是稍后再定图案的能力，而且背后有一个已付费、可行的印制时段。不要虚构一个没有成本的混合方案，也不要补上题目没有的概率，或从剩余数量推断环保收益。晚点印制，不是可以匆忙省略质量检查的许可。
  zh_hk: >-
    呢四百港元買到嘅，係稍後先敲定款式嘅能力，而且背後有一個已付費、可行嘅印製時段。唔好虛構一個冇成本嘅混合方案，亦都唔好補上題目冇有嘅概率，或從剩餘數量推斷環保收益。遲啲印製，唔係可以匆忙省略品質檢查嘅許可。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: The decision is when to commit the design
  title_zh: 要决定的是何时定下图案
  title_zh_hk: 要決定嘅係何時敲定款式
  q1_en: The same stock can give different results
  q1_zh: 同样的库存，结果可以不同
  q1_zh_hk: 同樣嘅存貨，結果可以唔同
  q2_en: Flexibility has a price, and it needs a ready slot
  q2_zh: 柔性有价格，也需要就绪的产能
  q2_zh_hk: 彈性有價錢，亦都需要就緒嘅產能
  s1_en: >-
    Keep the design open only if the later step is paid for and feasible. The key tradeoff is commitment
    timing, distinct from choosing total inventory or sequencing batches.
  s1_zh: 只有在后期步骤已经付费、并且确实可行时，才值得把图案留到后面再定。这里的权衡是何时做出承诺，这和决定总库存、或如何安排批次，不是同一道题。
  s1_zh_hk: >-
    只有喺後期步驟已經付費、並且確實可行嘅時候，先值得將款式留到後面再定。呢度嘅權衡係何時做出承諾，呢個同決定總存貨、或如何安排批次，唔係同一道題。
  s2_en: >-
    The maker, pouches, quotes, prices and historical tally are fictional. Official scene art is a teaching
    illustration only.
  s2_zh: 这家制作者、布袋、报价、价格和历史统计都是虚构的。官方场景图只是教学插图。
  s2_zh_hk: 呢間製作者、布袋、報價、價格同歷史統計都係虛構嘅。官方場景圖只係教學插圖。
  s3_en: The prior pop-up cannot be treated as certain next demand.
  s3_zh: 上次快闪活动，不能当成下一次的确定需求。
  s3_zh_hk: 上次快閃活動，唔可以當成下一次嘅確定需求。
duration_target_s: 188
