  s1_en: >-
    The maker must choose one of two written whole-order quotes this afternoon. No money is committed
    yet. Plan A finishes a standard fifty-fifty mix now. Plan B keeps common plain pouches until customer
    selections close at noon Friday, then prints the selected mix for Saturday collection.
  s1_zh: >-
    今天下午必须在两份书面整单报价里选一份，现在还没有付钱。方案A现在就按标准的五十对五十做完。方案B先做通用的素色布袋，等星期五中午客户选定后再印所需搭配，星期六取货。
  s1_zh_hk: >-
    今日下午必須喺兩份書面整單報價裏面揀一份，而家仲未俾錢。方案A而家就按標準嘅五十對五十做完。方案B先做通用嘅素色布袋，等星期五中午客戶選定後再印所需搭配，星期六取貨。
  s2_en: >-
    Both plans are affordable and can meet the deadline under the supplied capacity conditions. The team's
    initial planning scenario is fifty leaf and fifty wave requests, not a confirmed order or established
    forecast.
  s2_zh: 在给定的产能条件下，两个方案都负担得起，也能赶上期限。团队起初的规划情景是叶纹五十、波纹五十，这不是已确认的订单，也不是已经成立的预测。
  s2_zh_hk: >-
    喺所定嘅產能條件之下，兩個方案都負擔得起，亦都能夠趕上期限。團隊起初嘅規劃情境係葉紋五十、波浪紋五十，呢個唔係已確認嘅訂單，亦都唔係已經成立嘅預測。
  s3_en: >-
    B's fixed quote includes materials, printing, reserved late capacity, packing and required quality
    checks. The slot can complete and check one hundred good pouches of either mix before Saturday. There
    is no extra supply or reprinting before collection. Unchanged overhead is excluded, so the surplus
    is not complete business profit.
  s3_zh: >-
    B的固定报价已包括材料、印花、预留的后期产能、包装和必要的质量检查。这个时段能在星期六前做完并检查一百个合格布袋，不论搭配如何。取货前不能再补货或重印。未变的间接费用不计入，所以这里的盈余不是完整的企业利润。
  s3_zh_hk: >-
    B嘅固定報價已包括物料、印花、預留嘅後期產能、包裝同必要嘅品質檢查。呢個時段能夠喺星期六前做完並檢查一百個合格布袋，不論搭配如何。取貨前唔可以再補貨或重印。未變嘅間接費用唔計入，所以呢度嘅盈餘唔係完整嘅企業利潤。
