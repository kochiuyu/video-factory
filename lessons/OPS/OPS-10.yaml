  title_en: Two responses, and what they use
  title_zh: 两种应对，以及它们动用什么
  title_zh_hk: 兩種應對，以及它們動用甚麼
  row1_en: A · Scheduled review
  row1_zh: A · 按计划检查
  row1_zh_hk: A · 按原定時間檢視
  row2_en: B · Diagnostic pause
  row2_zh: B · 暂停做诊断
  row2_zh_hk: B · 暫停作診斷
