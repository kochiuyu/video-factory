title_en: Within specification. Still the same process?
title_zh: 符合规格。过程还和以前一样吗？
title_zh_hk: 符合規格，生產過程仍跟以往一樣嗎？
beats:
- id: hook
  visual: still_image
  seconds: 22
  kicker: OPS-10
  kicker_en: OPS-10
  kicker_zh: OPS-10
  kicker_zh_hk: OPS-10
  title_en: Within specification. Still the same process?
  title_zh: 符合规格。过程还和以前一样吗？
  title_zh_hk: 符合規格，生產過程仍跟以往一樣嗎？
  image: art/same-process-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    In July 2026, HKPC reported a manufacturing showcase that included tools intended to flag anomalies
    in production-line data. A fictional Hong Kong stationery-finishing workshop cuts decorative paper
    sleeves for adult notebooks. For this order, acceptable individual widths are ninety-eight point zero
    to one hundred and two point zero millimetres inclusive. The latest measured sleeve is one hundred
    point six millimetres, and the current summary records no failed width checks.
  zh: >-
    二零二六年七月，香港生产力促进局报道了一项制造业展览，其中有工具用来整合生产线数据并标示异常。一家虚构的香港文具加工工坊，在为成人笔记本裁切装饰纸套。这张订单规定，单个纸套可接受的宽度是九十八点零到一百零二点零毫米，包括上下限。最近一次量到一百点六毫米，目前的汇总没有记录任何宽度检查不合格。
  zh_hk: >-
    二零二六年七月，香港生產力促進局報道咗一項製造業展覽，當中有工具用嚟整合生產線數據並標示異常。一間虛構嘅香港文具加工工場，喺為成人筆記簿裁切裝飾紙套。呢張訂單規定，單個紙套可接受嘅寬度係九十八點零到一百零二點零毫米，包括上下限。最近一次量到一百點六毫米，目前嘅摘要冇記錄任何寬度檢查不合格。
