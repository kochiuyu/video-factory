  q2_zh_hk: 要調查，唔好自動判定不合格或調機
  s1_en: >-
    Within specification does not, by itself, answer whether the process is still the same. A preselected
    pattern can justify a prompt, bounded investigation without treating every item as defective.
  s1_zh: 仅仅符合规格，并不能说明过程是否还和以前一样。一个事先选定的模式，可以支持及时、有限度的调查，但不必把每件产品都当成不合格。
  s1_zh_hk: 單單符合規格，並唔能夠說明過程係咪仍然同以往一樣。一個預先選定嘅形態，可以支持及時、有限度嘅調查，但不必將每件產品都當成不合格。
  s2_en: >-
    The workshop, measurements, requirements and plan are fictional. Official scene art is a teaching
    illustration only, not copied source artwork.
  s2_zh: 这家工坊、测量值、要求和方案都是虚构的。官方场景图只是教学插图，不是从来源复制的控制图。
  s2_zh_hk: 呢間工場、量度值、要求同方案都係虛構嘅。官方場景圖只係教學插圖，唔係從來源複製嘅管制圖。
  s3_en: >-
    This is an educational response-timing decision, not machine-operation instructions or statistical
    certification.
  s3_zh: 这是一道关于何时应对的教学题，不是机器操作规程，也不是统计认证。
  s3_zh_hk: 呢個係一道關於何時應對嘅教學題，唔係機器操作規程，亦都唔係統計認證。
