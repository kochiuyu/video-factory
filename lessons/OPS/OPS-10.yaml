  c11_en: Review at hour end
  c11_zh: 本小时结束时再检查过程
  c11_zh_hk: 呢一小時結束時再檢視過程
  c12_en: Keep the slack
  c12_zh: 保留生产余量
  c12_zh_hk: 保留生產緩衝時間
  c21_en: Pause 20 minutes
  c21_zh: 暂停20分钟做诊断
  c21_zh_hk: 暫停20分鐘作診斷
  c22_en: Use funded slack
  c22_zh: 动用已安排的余量
  c22_zh_hk: 動用已撥的緩衝時間
  footer_en: Width is a fit characteristic, not safety-critical
  footer_zh: 宽度影响合身，不是安全关键特性
  footer_zh_hk: 寬度影響合身，不是安全關鍵特性
  s1_en: >-
    The supervisor must decide when to examine the process. The time-ordered record and reference chart
    have not yet been shown; no existing mandatory stop rule is being bypassed.
  s1_zh: 主管必须决定何时检视生产过程。按时间排列的记录和参考控制图还没有展示；这并不涉及绕过任何现行的强制停机规则。
  s1_zh_hk: 主管必須決定何時檢視生產過程。按時間排列嘅記錄同參考管制圖仲未展示；呢個並唔涉及繞過任何現行嘅強制停機規則。
  s2_en: >-
    Option A continues with normal release checks and reviews the process at the end of the hour, keeping
    available production slack. Option B pauses for twenty minutes, preserves settings and material, and
    asks a qualified technician to review measurement, setup and time order.
  s2_zh: >-
    方案A照常进行放行检验，到这一小时结束时再检查过程，从而保留可用的生产余量。方案B暂停二十分钟，保留现有设置和物料，请具备资质的技术员检查测量、设备设置和读数的时间顺序。
  s2_zh_hk: >-
    方案A照常進行放行檢查，到呢一小時結束時再檢視過程，從而保留可用嘅生產緩衝時間。方案B暫停二十分鐘，保留原有設定同物料，請合資格技術員檢視量度方法、設定同讀數嘅時間次序。
  s3_en: >-
    Either schedule can meet today's delivery. B funds diagnosis, not a guaranteed repair within twenty
    minutes. Machine guarding, maintenance, safety obligations and customer release checks remain in force
    under either response. No extra worker or quantified prevention benefit is supplied.
  s3_zh: >-
    两种安排都能赶上今天交货。B拨出的是诊断时间，并不保证二十分钟内完成修复。无论选哪一个，机器防护、维护、安全责任和交付前的放行检验都维持不变。题目没有提供额外人手，也没有量化预防效益。
  s3_zh_hk: >-
    兩種安排都能趕上今日交貨。B撥出嘅係診斷時間，並唔保證二十分鐘內完成修復。無論揀邊一個，機器防護、保養、安全責任同交付前嘅放行檢查都維持不變。題目冇提供額外人手，亦都冇量化預防效益。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: Continue now, or pause for diagnosis?
  title_zh: 先照常做，还是暂停做诊断？
  title_zh_hk: 先照常做，定暫停作診斷？
  en: >-
    Continue normal monitoring for now, or use the twenty-minute diagnostic pause? Does “within specification”
    answer whether the process is behaving as before? Name evidence that could reverse your provisional
    choice. Pause and vote.
  zh: 你会暂时照常监察，还是用这二十分钟做诊断？“符合规格”能不能说明过程仍和以前一样？请指出哪些证据可能让你改变初步选择。请暂停，投个票。
  zh_hk: 你會暫時照常監察，定用呢二十分鐘作診斷？「符合規格」可唔可以說明過程仍然同以往一樣？請指出邊啲證據可能令你改變初步選擇。暫停，投個票。
