  title_en: Order now, or wait until 100?
  title_zh: 现在订，还是等到100包？
  title_zh_hk: 而家訂，定等到100包？
  en: >-
    Would you provisionally order the usual 200 packs now, or wait until the shelf reaches 100? Explain
    the trigger, and what you must check before sending the order. Pause and vote.
  zh: 你会初步决定，现在按惯例订两百包，还是等到货架上只剩一百包再订？说明你的订货触发条件，以及发出订单前必须核实什么。请暂停，投个票。
  zh_hk: 你會初步決定，而家按慣例訂兩百包，定等到貨架淨係剩一百包先訂？講清楚你嘅訂貨觸發條件，同埋發出訂單前必須查核啲咩。暫停，投個票。
