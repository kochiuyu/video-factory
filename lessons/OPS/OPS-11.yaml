  s1_en: >-
    At closing, a small stationery wholesaler has 140 usable packs of standard labels. In the worked plan,
    daily use is exactly 20 packs. A new order placed at closing has a recorded lead time of five complete
    business days.
  s1_zh: >-
    打烊时，这家小型文具批发商货架上有一百四十包可用的标准标签。按案例的计算方案，每个工作日恰好用掉二十包。打烊时下单，记录的提前期是五个完整工作日。
  s1_zh_hk: 打烊時，呢間小型文具批發商貨架上有一百四十包可用嘅標準標籤。按個案推算，每個工作天恰好用二十包。打烊時下單，記錄嘅前置時間係五個完整工作天。
  s2_en: >-
    Management wants 40 packs left just before a replenishment arrives. Every new order is the usual 200-pack
    lot. Funding and storage permit it; this discussion is about when to order, not the lot size.
  s2_zh: 管理层希望补货到达前一刻还剩四十包。每次新下单仍按惯例订两百包。资金和库容都允许；这里讨论的是何时下单，不是订货批量。
  s2_zh_hk: 管理層希望補貨到達前一刻仲剩四十包。每次新訂單都按慣例訂兩百包。資金同倉容都夠；呢度討論嘅係幾時下單，唔係訂貨批量。
  s3_en: >-
    Stock is reviewed at each close. Before authorising an order, the manager will confirm supplier dates
    and outstanding purchase orders. The familiar shelf trigger is 100 packs. A colleague asks whether
    that leaves enough while a delivery is on its way.
  s3_zh: >-
    每天打烊时检查库存。批准下单前，经理会核实供应商的交货日期，以及还没到的采购订单。经理通常等到货架上只剩一百包才下单。一位同事问：等货到的这段时间里，库存够用吗？
  s3_zh_hk: >-
    每日打烊都檢視存貨。批准下單前，經理會向供應商核實交貨日期，同埋未到貨嘅採購訂單。經理通常等貨架淨係剩一百包先下單。有同事問：等貨到呢段時間，存貨夠唔夠用？
