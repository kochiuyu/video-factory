  s1_en: >-
    The checks change two entries. An existing 120-pack order will be ready for use tomorrow morning,
    before any consumption. Separately, a new order now takes ten complete business days. The dispatched
    120-pack delivery is unaffected.
  s1_zh: >-
    核实后，有两项信息变了。原先订的一百二十包，明天上午就可以用，早于当天的任何领用。另外，现在的新订单需要十个完整工作日。已经发出的一百二十包不受影响。
  s1_zh_hk: 查核之後，有兩項記錄變咗。原先訂嘅一百二十包，明早未開始耗用前就可以用。另外，而家嘅新訂單需要十個完整工作天。已經發出嘅一百二十包不受影響。
  s2_en: >-
    Keep the same 40-pack buffer and 200-pack lot. The trigger is lead-time demand plus the safety buffer.
    Apply it to inventory position: usable on-hand stock plus confirmed on-order stock.
  s2_zh: >-
    安全库存仍是四十包，订货批量仍是两百包。再订货点等于提前期内的需求量，加上安全库存。用它来判断库存状况：可用的在手库存，加上已确认的在途订货。
  s2_zh_hk: >-
    緩衝量仍然係四十包，訂貨批量仍然係兩百包。再訂貨點等於前置時間內嘅需求量，加上緩衝量。用嚟判斷存貨狀況：可用嘅在手存貨，加上已確認嘅在途訂單。
  s3_en: >-
    Reorder when that position is at or below the trigger, and check that each receipt arrives before
    it is needed. There are no other receipts, backorders or reserved commitments. Use the confirmed dates
    and exactly 20 packs a day. No emergency supply is available.
  s3_zh: >-
    库存状况达到或低于再订货点时再下单，同时还要核实每批货能否在需要之前到达。没有其他到货、欠交订单，也没有预留给客户的库存。按确认的日期和每天恰好二十包来推算。这次决策没有应急供货。
  s3_zh_hk: >-
    存貨狀況等於或低過再訂貨點就下單，同時都要核實每批貨可唔可以喺需要之前到達。冇其他到貨、欠交訂單，亦都冇預留給客戶嘅存貨。按確認嘅日期同每日恰好二十包嚟推算。呢次決定冇應急供貨。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: Order today after the change?
  title_zh: 今天就要下单吗？
  title_zh_hk: 今日就要下單嗎？
  en: >-
    Does the longer lead time mean ordering today? Use the confirmed delivery to set the next order time,
    and show the stock expected just before that new order arrives. Pause and vote again.
  zh: 提前期变长了，是否意味着今天就该下单？根据已确认的到货，确定下次下单时间，并算出这笔新订单到货前一刻，预计还剩多少库存。请暂停，再投一次票。
  zh_hk: 前置時間長咗，係咪即係今日就要下單？根據已確認嘅到貨，定下次下單時間，再計出呢筆新訂單到貨前一刻，預計仲剩幾多存貨。暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A trigger is not a lot size
  title_zh: 再订货点不是订货量
  title_zh_hk: 再訂貨點唔等於訂貨量
  step1_en: >-
    Trigger: 20×5+40 = 140
  step1_zh: 再订货点：20×5+40=140
  step1_zh_hk: 再訂貨點：20×5+40=140
  step2_en: >-
    Wait to 100: 0 left
  step2_zh: 等到100包：到货前为0
  step2_zh_hk: 等到100包：到貨前係0
  s1_en: >-
    With the opening five-day lead time, lead-time demand is 20 times 5, or 100 packs. Add the agreed
    40-pack buffer: the trigger is 140 packs. With no outstanding supply, the opening record would justify
    ordering now.
  s1_zh: >-
    按最初五天的提前期，提前期内的需求量是二十乘以五，等于一百包。加上已商定的四十包安全库存，再订货点就是一百四十包。如果没有在途订货，初始记录就足以支持现在下单。
  s1_zh_hk: >-
    按最初五天嘅前置時間，前置時間內嘅需求量係二十乘五，等於一百包。加上已商定嘅四十包緩衝量，再訂貨點就係一百四十包。如果冇在途訂單，初始記錄就足以支持而家下單。
  s2_en: >-
    Waiting until 100 would leave 100 minus 100, or zero, immediately before replenishment in this exact-demand
    example, rather than management’s intended 40. That is not proof of an inevitable stock-out in practice.
  s2_zh: 在这个用量完全确定的例子里，如果等到只剩一百包再订，补货到达前一刻就会剩下零包，而不是管理层想保留的四十包。这并不证明实际中一定会缺货。
  s2_zh_hk: >-
    喺呢個用量完全確定嘅例子裏面，如果等到淨係剩一百包先訂，補貨到達前一刻就會剩零包，而唔係管理層想保留嘅四十包。呢個並唔能夠證明實際一定會缺貨。
  s3_en: >-
    The 200-pack lot answers a different question: how much arrives after an order is triggered.
  s3_zh: 两百包的批量回答的是另一个问题：触发订货之后，会到多少货。
  s3_zh_hk: 兩百包嘅批量回答嘅係另一個問題：觸發訂貨之後，會到幾多貨。
  step3_en: The 200-pack lot is separate
  step3_zh: 200包批量是另一件事
  step3_zh_hk: 200包批量係另一件事
