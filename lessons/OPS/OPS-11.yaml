  footer_en: Trigger 240; order at tomorrow close
  footer_zh: 再订货点240；明天打烊下单
  footer_zh_hk: 再訂貨點240；明日打烊下單
  s1_en: >-
    The new ten-day lead time raises the trigger to 20 times 10 plus 40, or 240 packs. Current inventory
    position is 140 on hand plus 120 on order, or 260 packs. It is above the trigger, so another order
    today is not yet called for by the stated rule.
  s1_zh: >-
    新的十天提前期，把再订货点提高到二十乘以十再加四十，等于二百四十包。当前库存状况是在手一百四十包，加上在途一百二十包，等于二百六十包。这高于再订货点，按既定规则，今天还不需要再下单。
  s1_zh_hk: >-
    新嘅十天前置時間，把再訂貨點提高到二十乘十再加四十，等於二百四十包。目前存貨狀況係在手一百四十包，加上在途一百二十包，等於二百六十包。呢個高過再訂貨點，按既定規則，今日仲唔需要再下單。
  s2_en: >-
    Tomorrow’s receipt moves 120 packs from on order to on hand. It does not add 120 to inventory position
    a second time. After tomorrow’s 20 packs are used, both on-hand stock and position are 240. Order
    the usual 200 at that closing-time check. Position then rises to 440, while the shelf still holds
    240.
  s2_zh: >-
    明天到货后，一百二十包从在途转为在手，不能在库存状况里再加一次。明天用掉二十包后，在手库存和库存状况都是二百四十包。打烊检查时按惯例订两百包；下单后库存状况升到四百四十包，但货架上仍是二百四十包。
  s2_zh_hk: >-
    明日到貨之後，一百二十包由在途轉為在手，唔可以喺存貨狀況裏面再加多一次。明日用咗二十包之後，在手存貨同存貨狀況都係二百四十包。打烊檢查時按慣例訂兩百包；下單之後存貨狀況升到四百四十包，但貨架上仍然係二百四十包。
  s3_en: >-
    The 140 packs now on the shelf bridge the wait until tomorrow morning. After ten further days’ use
    of 200 packs, 40 remain just before the new receipt. A distant or uncertain inbound order could not
    be treated as immediately usable simply because it raises the position.
  s3_zh: >-
    眼下可用的一百四十包，足以撑到明天上午。随后十天用掉两百包，到货前还剩四十包。如果一笔在途订货要很久才到，或者到货时间不确定，不能仅仅因为它提高了库存状况，就把它当成马上能用的库存。
  s3_zh_hk: >-
    而家可用嘅一百四十包，足夠撐到明日上午。之後十日付掉兩百包，到貨前仲剩四十包。如果一筆在途訂單要好耐先到，或者到貨時間唔確定，唔可以只因為佢提高咗存貨狀況，就當佢即刻用得。
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Check dates, not only totals
  title_zh: 还要核对到货日期
  title_zh_hk: 都要核對到貨日期
  en: >-
    This is a transparent calculation under an agreed policy, not an optimisation of inventory cost or
    customer service. Unexpected demand, rejected goods or a changed delivery date can invalidate the
    trace. A visibility system does not remove that judgement.
  zh: >-
    这是按商定规则做的一笔明白账，并不是对库存成本或客户服务的优化。意外需求、来货被拒收，或者交货日期变动，都可能让这套推算失效。系统能让货物动向看得见，也不能代替这些判断。
  zh_hk: >-
    呢個係按商定規則做嘅一筆明白賬，並唔係對存貨成本或者客戶服務嘅優化。意外需求、來貨被拒收，或者交貨日期有變，都可能令呢套推算失效。系統睇到貨物動向，都代替唔到呢啲判斷。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Order at the position trigger
  title_zh: 按库存状况触发下单
  title_zh_hk: 按存貨狀況觸發下單
  q1_en: The shelf count is not the position
  q1_zh: 货架数量不是库存状况
  q1_zh_hk: 貨架數量唔等於存貨狀況
  q2_en: Check arrival dates as well
  q2_zh: 还要核对到货日期
  q2_zh_hk: 都要核對到貨日期
  s1_en: >-
    The longer lead time raises the trigger; the confirmed inbound order raises the position. Their combined
    effect is to order tomorrow at closing, not to double-order today.
  s1_zh: 提前期变长，会把再订货点推高；已确认的在途订货，会把库存状况推高。两者合在一起，是明天打烊时再下单，而不是今天再订一笔。
  s1_zh_hk: 前置時間變長，會把再訂貨點推高；已確認嘅在途訂單，會把存貨狀況推高。兩者加埋，係明日打烊先下單，而唔係今日再訂多一筆。
  s2_en: >-
    The wholesaler, demand, deliveries and rules are fictional classroom assumptions. Official scene art
    is a teaching illustration only.
  s2_zh: 这家批发商、需求、交货安排和订货规则，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢間批發商、需求、交貨安排同訂貨規則，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    The local announcement supplies context, not evidence for any classroom number.
  s3_zh: 本地公告只提供背景，不能当作课堂上这些数字的证据。
  s3_zh_hk: 本地公告只提供背景，唔可以當作課堂上呢啲數字嘅證據。
