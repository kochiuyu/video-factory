  title_en: Two stores. One safety stock?
  title_zh: 两家门店，共用一份安全库存？
  title_zh_hk: 兩間店，共用一份安全庫存？
  image: art/stock-is-not-ready-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 17 October 2024, Hong Kong’s consumer council reported supermarket shortages of some frozen foods.
    A stock figure is useful only if the unit is ready where the customer is standing. This two-shop trial,
    and every number, is fictional.
  zh: >-
    二零二四年十月十七日，香港消费者委员会报道，超市部分冷冻食品缺货。库存数字有用，前提是货品在顾客所在的地方已经备好。课堂上这两家门店的试算，以及全部数字，都是虚构的。
  zh_hk: >-
    二零二四年十月十七日，香港消費者委員會報道，超市部分冷凍食品缺貨。存貨數字有用，前提係貨品喺顧客所在嘅地方已經備好。課堂上呢兩間門市嘅試算，同埋全部數字，都係虛構嘅。
