  footer_en: Morning 5 and 5; afternoon 1 and 1
  footer_zh: 上午各5个；下午各1个
  footer_zh_hk: 上午各5個；下午各1個
  s1_en: >-
    A confirmed transfer from the stockroom to a shop takes one hour, not two. After a missed 10 a.m.
    request, the next time that can be promised is 3 p.m. The two 4 p.m. requests are unchanged. In the
    worked plan, each shop has five morning requests and one afternoon request.
  s1_zh: >-
    已确认，从库房调到门店需要一小时，不是两小时。错过上午十点的请求后，下一次可以承诺的时间是下午三点。下午四点的两个请求没有变化。按计算方案，每家门店上午五个请求，下午一个。
  s1_zh_hk: >-
    已確認，由貨倉調去門市需要一個鐘，唔係兩個鐘。錯過上午十時嘅請求之後，下一次可以承諾嘅時間係下午三時。下午四時嘅兩個請求冇變。按推算方案，每間門市上午五個請求，下午一個。
  s2_en: >-
    With all stock in the central room, option B cannot serve the 10 a.m. customers on time: a one-hour
    transfer is ready at 11 a.m., and the next promise is 3 p.m. Four morning requests are missed.
  s2_zh: 如果存货全在中央库房，方案B无法准时服务上午十点的顾客：一小时调货要到十一点才备好，下一次可承诺的是下午三点。四个上午请求会错过。
  s2_zh_hk: 如果存貨全部喺中央貨倉，方案B冇辦法準時服務上午十時嘅顧客：一個鐘調貨要到十一時先備好，下一次可承諾嘅係下午三時。四個上午請求會錯過。
  s3_en: >-
    The later 4 p.m. requests can still be met from the stockroom. Recount, under these rules, who is
    served and who is missed under each plan, and at what cost.
  s3_zh: 较晚的下午四点请求，仍可以从库房兑现。请按这些规则重新清点：每个方案能服务谁、会错过谁，以及成本是多少。
  s3_zh_hk: 較後嘅下午四時請求，仍然可以由貨倉兌現。請按呢啲規則重新清點：每個方案能夠服務邊啲人、會錯過邊啲人，同埋成本係幾多。
