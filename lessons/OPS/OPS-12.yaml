  footer_en: 10 same-day requests, two shops
  footer_zh: 两店共10个当日请求
  footer_zh_hk: 兩店合共10個當日請求
  s1_en: >-
    A small chain will trial one shared product across two shops for a single day. Historically there
    are ten same-day requests: eight around 10 a.m., and two around 4 p.m., split evenly between the shops
    in the worked plan.
  s1_zh: >-
    这家小型连锁店，会用同一款商品，在两家门店做一天试算。历史上每天有十个当日请求：大约八个在上午十点，两个在下午四点。按计算方案，两家门店各占一半。
  s1_zh_hk: >-
    呢間小型連鎖店，會用同一款商品，喺兩間門市做一日試算。歷史上每日有十個當日請求：大約八個喺上午十時，兩個喺下午四時。按推算方案，兩間門市各佔一半。
  s2_en: >-
    If a unit is not already on the shop floor, it takes two hours to become ready for the customer under
    the opening assumption. Option A holds eight units in each shop, sixteen in total, at a cost of 1,600
    Hong Kong dollars.
  s2_zh: 如果货品不在门店货架上，按起初的假设，要两个小时才能为顾客备好。方案A每家门店放八件，一共十六件，成本一千六百港元。
  s2_zh_hk: 如果貨品唔喺門市貨架上，按起初嘅假設，要兩個鐘先可以為顧客備好。方案A每間門市放八件，合共十六件，成本一千六百港元。
  s3_en: >-
    Option B holds twelve units only in the central stockroom, at 1,200 dollars. Option C holds two in
    each shop and eight in the stockroom, at 1,400 dollars. Compare which requests can be met on time,
    and at what cost.
  s3_zh: 方案B只在中央库房放十二件，成本一千二百港元。方案C每家门店放两件，库房放八件，成本一千四百港元。比较哪些请求能按时兑现，以及各自的成本。
  s3_zh_hk: >-
    方案B淨係喺中央貨倉放十二件，成本一千二百港元。方案C每間門市放兩件，貨倉放八件，成本一千四百港元。比較邊啲請求能夠準時兌現，同埋各自嘅成本。
