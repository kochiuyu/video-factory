  c21_zh_hk: >-
    下次可約15:00
  c22_en: Too late for 10 a.m.
  c22_zh: 赶不上上午十点
  c22_zh_hk: 趕唔上上午十時
  c31_en: Unchanged at 4 p.m.
  c31_zh: 仍是下午四点
  c31_zh_hk: 仍然係下午四時
