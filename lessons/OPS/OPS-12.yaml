  title_en: Which reserve plan would you trial?
  title_zh: 你会试哪一种储备？
  title_zh_hk: 你會試邊一種儲備？
  en: >-
    Which reserve plan would you trial for this day? Explain which requests you expect to meet on time,
    and what the two-hour ready time implies. Pause and vote.
  zh: 这一天你会试哪一种储备方案？说明你预计能按时兑现哪些请求，以及两个小时的备货时间意味着什么。请暂停，投个票。
  zh_hk: 呢一日你會試邊一種儲備方案？講清楚你預計能夠準時兌現邊啲請求，同埋兩個鐘嘅備貨時間意味住啲咩。暫停，投個票。
