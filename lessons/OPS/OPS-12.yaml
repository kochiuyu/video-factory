  title_en: Who is served, and who is missed?
  title_zh: 谁能被服务，谁会被错过？
  title_zh_hk: 邊啲人得到服務，邊啲人會錯過？
  en: >-
    With the 4 p.m. slot unchanged, who is served and who is missed under each plan? Compare the cost
    of the plan that meets every request with the cheaper alternatives. Pause and vote again.
  zh: 下午四点的请求没有变。每个方案能服务谁、会错过谁？请比较那个能兑现全部请求的方案，和更便宜的方案，成本相差多少。请暂停，再投一次票。
  zh_hk: 下午四時嘅請求冇變。每個方案能夠服務邊啲人、會錯過邊啲人？比較嗰個能夠兌現全部請求嘅方案，同埋更平嘅方案，成本相差幾多。暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Stock must be ready in place
  title_zh: 库存要在所需地点备好
  title_zh_hk: 存貨要喺所需地點備好
  step1_en: A meets all 10; costs HK$1,600
  step1_zh: A兑现全部10个；1,600港元
  step1_zh_hk: A兌現全部10個；1,600港元
  step2_en: B meets 6; misses four mornings
  step2_zh: B兑现6个；错过四个上午
  step2_zh_hk: B兌現6個；錯過四個上午
  s1_en: >-
    Count units where and when they can be used. Option A has eight already in each shop, so it meets
    all ten requests, at 1,600 Hong Kong dollars.
  s1_zh: 要在所需的地点和时间，清点可用库存。方案A每家门店已有八件，因此能兑现全部十个请求，成本是一千六百港元。
  s1_zh_hk: 要喺所需嘅地點同時間，清點可用存貨。方案A每間門市已有八件，所以能夠兌現全部十個請求，成本係一千六百港元。
  s2_en: >-
    Option B is 400 dollars cheaper, at 1,200 dollars, but a one-hour transfer misses the four 10 a.m.
    requests that exceed the later 3 p.m. promise. It still meets the six requests that can wait until
    4 p.m., so six out of ten are served.
  s2_zh: >-
    方案B便宜四百港元，只要一千二百港元，但一小时调货赶不上四个上午十点的请求，而下一次只能约到下午三点。下午四点还能兑现的六个请求可以满足，因此十个里只兑现了六个。
  s2_zh_hk: >-
    方案B平四百港元，只要一千二百港元，但一個鐘調貨趕唔上四個上午十時嘅請求，而下一次只能約到下午三時。下午四時仲可以兌現嘅六個請求可以滿足，所以十個裏面只兌現咗六個。
  s3_en: >-
    Option C costs 1,400 dollars: 200 less than A, and 200 more than B. The two local units in each shop
    cover the morning requests that cannot wait, and the central eight cover the afternoon. It meets all
    ten.
  s3_zh: 方案C成本一千四百港元：比A少二百，比B多二百。每家门店的两件本地存货，覆盖了不能等待的上午请求，库房的八件覆盖下午。它能兑现全部十个。
  s3_zh_hk: 方案C成本一千四百港元：比A少二百，比B多二百。每間門市嘅兩件本地存貨，覆蓋咗唔能夠等待嘅上午請求，貨倉嘅八件覆蓋下午。佢能夠兌現全部十個。
  step3_en: C meets all 10; costs HK$1,400
  step3_zh: C也兑现全部10个；1,400港元
  step3_zh_hk: C都兌現全部10個；1,400港元
- id: meaning
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A small local reserve changes promises
  title_zh: 少量门店储备就能改承诺
  title_zh_hk: 少量門市備貨就能改承諾
  step1_en: Local units change what can be promised
  step1_zh: 本地存货会改变可作承诺
  step1_zh_hk: 本地存貨會改變可作承諾
  step2_en: Do not assume service is the same
  step2_zh: 别假定服务保障相同
  step2_zh_hk: 唔好假定服務保障相同
  s1_en: >-
    A few units already in the shop can change which commitments can be kept, even when total stock is
    lower than a fully local plan. Compare cost against the service that is actually delivered, not against
    an assumed guarantee.
  s1_zh: 即使总量低于全部放在门店的方案，少量已经放在门店的存货，也能改变哪些承诺兑现得了。比较成本时，要对照实际兑现的服务，不要凭空认定服务有保障。
  s1_zh_hk: 即使總量低過全部放喺門市嘅方案，少量已經放喺門市嘅存貨，都能夠改變邊啲承諾兌現得到。比較成本時，要對照實際兌現嘅服務，唔好假定保障相同。
  s2_en: >-
    This is one worked day under stated request times and transfer rules. A day with more morning requests,
    or a slower transfer, could change the comparison. Do not treat a single favourable day as a general
    test.
  s2_zh: 这只是按既定请求时间和调货规则，计算的一天。如果上午请求更多，或者调货更慢，比较结果就可能改变。不要只用顺利的一天，来验证一套规则。
  s2_zh_hk: 呢個只係按既定請求時間同調貨規則，計算嘅一日。如果上午請求更多，或者調貨更慢，比較結果就可能改變。唔好淨係用順利嘅一日，嚟驗證一套規則。
  s3_en: >-
    The trial quantities are classroom reserves, not a statistically calculated safety stock. Opening
    figures, request times and the one-hour transfer are case assumptions, not a field measurement.
  s3_zh: 这些试算数量是课堂里的储备，不是按统计方法算出的安全库存。期初数字、请求时间和一小时调货，都是案例假设，不是实地测量。
  s3_zh_hk: 呢啲試算數量係課堂裏嘅儲備，唔係按統計方法計出嚟嘅安全庫存。期初數字、請求時間同一個鐘調貨，都係個案假設，唔係實地測量。
  step3_en: Do not test only a favourable day
  step3_zh: 别只用顺利的一天来验证
  step3_zh_hk: 唔好淨係用順利嘅一日嚟驗證
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Ready stock is not a total
  title_zh: 可用库存不是一个总数
  title_zh_hk: 可用存貨唔係一個總數
  en: >-
    A pooled stockroom can look cheaper until you ask whether the unit is ready at the shop at 10 a.m.
    A later afternoon slot can still be served from the centre. Before copying the 1,400-dollar plan,
    check whether the request pattern and transfer time still hold.
  zh: >-
    共用库房看起来更便宜，但你要问：上午十点，货品是否已经在门店备好。较晚的下午时段，仍可能由库房兑现。把一千四百港元的方案搬到别处之前，先核对请求分布和调货时间是否仍然成立。
  zh_hk: >-
    共用貨倉睇落更平，但你要問：上午十時，貨品係咪已經喺門市備好。較後嘅下午時段，仍然可能由貨倉兌現。將一千四百港元嘅方案搬去第二度之前，先核對請求分布同調貨時間係咪仍然成立。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Count stock where it can be used
  title_zh: 在能用的地点清点库存
  title_zh_hk: 喺用得著嘅地點清點存貨
  q1_en: A local reserve can keep a morning promise
  q1_zh: 门店少量存货能保住上午承诺
  q1_zh_hk: 門市少量存貨能保住上午承諾
  q2_en: Cheaper stock is not the same service
  q2_zh: 更低成本不等于同样的服务
  q2_zh_hk: 更低成本唔等於同樣嘅服務
  s1_en: >-
    Under these rules, the mixed plan meets all ten requests and costs 200 dollars less than holding eight
    in each shop. The cheapest plan misses four morning requests.
  s1_zh: 按这些规则，混合方案能兑现全部十个请求，而且比每店放八件便宜二百港元。最便宜的方案会错过四个上午请求。
  s1_zh_hk: 按呢啲規則，混合方案能夠兌現全部十個請求，而且比每店放八件平二百港元。最平嘅方案會錯過四個上午請求。
  s2_en: >-
    The shops, requests, transfer times and costs are fictional classroom assumptions. Official scene
    art is a teaching illustration only.
  s2_zh: 这些门店、请求、调货时间和成本，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢啲門市、請求、調貨時間同成本，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    The consumer council report supplies context, not evidence for any classroom number.
  s3_zh: 消委会的报道只提供背景，不能当作课堂上这些数字的证据。
  s3_zh_hk: 消委會嘅報道只提供背景，唔可以當作課堂上呢啲數字嘅證據。
duration_target_s: 192
