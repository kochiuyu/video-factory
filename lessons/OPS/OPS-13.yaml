  s1_en: >-
    A workshop starts the week with ten released kit sets on hand. Eight more arrive after Sunday closing,
    but they are usable only after inspection. Eight kits are already allocated: six must start at 8 a.m.
    on Friday, and two at 8 a.m. on Saturday.
  s1_zh: >-
    这家工场本周期初有十套已经放行的在手组件。周日打烊后再到八套，但只有通过检验放行后才能使用。已经分配了八套：六套必须星期五上午八点开工，两套星期六上午八点开工。
  s1_zh_hk: >-
    呢間工場本周期初有十套已經放行嘅在手組件。周日打烊後再到八套，但只有通過檢驗放行之後先可以用。已經分配咗八套：六套必須星期五上午八時開工，兩套星期六上午八時開工。
  s2_en: >-
    A new customer wants four desks delivered by 2 p.m. on Friday. Each desk needs four hours to assemble
    and two hours to deliver, so work must start at 8 a.m. on Friday. Capacity for assembly and delivery
    is given as sufficient in this case.
  s2_zh: >-
    一位新客户希望星期五下午两点送到四张书桌。每张书桌要四个小时组装、两个小时送货，所以必须星期五上午八点开工。本案例已给定，组装和运输能力足够。
  s2_zh_hk: 一位新客戶希望星期五下午兩時送到四張書桌。每張書桌要四個鐘組裝、兩個鐘送貨，所以必須星期五上午八時開工。本個案已給定，組裝同運輸能力足夠。
  s3_en: >-
    The weekly movement is ten plus eight minus eight, leaving ten kits in total. That closing balance
    is not, by itself, a Friday promise. A Saturday delivery can be offered for an extra 300 Hong Kong
    dollars, if the customer accepts it.
  s3_zh: 一周进出是十加八减八，结余十套。这个期末结余本身，不等于星期五的交付承诺。如果客户接受，也可以提出星期六交货，并加收三百港元。
  s3_zh_hk: 一週進出係十加八減八，結餘十套。呢個期末結餘本身，唔等於星期五嘅交貨承諾。如果客戶接受，亦都可以提出星期六交貨，並加收三百港元。
