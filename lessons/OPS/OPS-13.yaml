  en: >-
    Would you promise all four desks by 2 p.m. on Friday? If not, what alternative would you offer, and
    which stock would support it? Pause and vote.
  zh: 你能否承诺星期五下午两点交齐四张书桌？如果不能，你会提出什么替代方案，又靠哪批库存来支持？请暂停，投个票。
  zh_hk: 你可唔可以承諾星期五下午兩時交齊四張書桌？如果唔得，你會提出咩替代方案，又憑邊批存貨嚟支持？暫停，投個票。
