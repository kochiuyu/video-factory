  title_en: Promise Friday. Based on which stock?
  title_zh: 承诺星期五交货，靠的是哪批库存？
  title_zh_hk: 承諾星期五交貨，憑的是哪批存貨？
  image: art/promise-by-when-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A made-to-order desk is promised only when the kit is released and there is time to assemble and deliver
    it. A weekly stock total can hide a Friday shortage. This workshop, and every figure, is fictional.
  zh: >-
    定制书桌只有在组件放行、并且还有时间组装和送货时，才能承诺交货。一周的库存结余，可能掩盖星期五的缺口。课堂上的这家工场，以及全部数字，都是虚构的。
  zh_hk: >-
    訂製書桌只有喺組件放行、而且仲有時間組裝同送貨時，先可以承諾交貨。一星期嘅存貨結餘，可能掩蓋星期五嘅缺口。課堂上呢間工場，同埋全部數字，都係虛構嘅。
