  title_en: Check each stop against the clock
  title_zh: 逐段核对时间
  title_zh_hk: 逐站核對時間
  step1_en: >-
    Route 1 finishes B at 9:45
  step1_zh: >-
    路线1在9:45完成B站
  step1_zh_hk: >-
    路線1喺9:45完成B站
  step2_en: >-
    Route 2: B 9:30, A 9:50, C 10:20
  step2_zh: >-
    路线2：B 9:30，A 9:50，C 10:20
  step2_zh_hk: >-
    路線2：B 9:30，A 9:50，C 10:20
  s1_en: >-
    Look beyond the map and check each stop against the clock. Route 1 still finishes B at 9:45, so it
    misses the revised 9:35 close and cannot be used.
  s1_zh: 不只看地图上的路线，还要逐段核对时间。路线1仍然在九点四十五完成B站，错过了调整后九点三十五的截止时间，因此不能采用。
  s1_zh_hk: 唔好淨係睇地圖上嘅路線，都要逐站核對時間。路線1仍然喺九時四十五完成B站，錯過咗修訂後九時三十五嘅截止時間，所以唔能夠採用。
  s2_en: >-
    Route 2 is feasible under the confirmed windows: B is finished at 9:30, A at 9:50, which is still
    before 10:10, C at 10:20, and the van returns to D at 10:40.
  s2_zh: 按确认后的时间窗，路线2可行：B站九点三十完成，A站九点五十完成，仍早于十点十分，C站十点二十，货车十点四十回到D。
  s2_zh_hk: 按確認後嘅時間窗，路線2可行：B站九時三十完成，A站九時五十完成，仍然早過十時十分，C站十時二十，貨車十時四十回到D。
  s3_en: >-
    The feasible route adds three kilometres and ten minutes of travel compared with the shorter loop.
    A shorter route that misses a window is not the better choice here.
  s3_zh: 这条可行路线，比更短的回路多出三公里，以及十分钟行驶时间。在这里，错过时间窗的短路线，并不是更好的选择。
  s3_zh_hk: 呢條可行路線，比更短嘅回路多出三公里，以及十分鐘行駛時間。喺呢度，錯過時間窗嘅短路線，並唔係更好嘅選擇。
  step3_en: Extra 3 km and 10 minutes
  step3_zh: 多出3公里和10分钟
  step3_zh_hk: 多出3公里同10分鐘
- id: meaning
  visual: steps
  layout: rows
  seconds: 22
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Feasible is not a traffic guarantee
  title_zh: 可行不是路况保证
  title_zh_hk: 可行唔等於路況保證
  step1_en: Recheck after a window changes
  step1_zh: 时间窗一变就要重核
  step1_zh_hk: 時間窗一變就要重核
  step2_en: Do not invent a third tour here
  step2_zh: 这里不要另设第三条线
  step2_zh_hk: 呢度唔好另設第三條線
  s1_en: >-
    When a window is revised, recheck the same candidates against the new constraints. The shorter loop
    was acceptable only before B’s close was tightened.
  s1_zh: 时间窗调整后，要用新的约束，重新核对同一批候选路线。更短的回路，只在B站截止时间收紧之前才可以接受。
  s1_zh_hk: 時間窗修訂之後，要用新嘅限制，重新核對同一批候選路線。更短嘅回路，只喺B站截止時間收緊之前先可以接受。
  s2_en: >-
    The case compares only these two stated routes. A different sequence, an earlier departure or a split
    visit would be a different plan, and is not supplied here.
  s2_zh: 本案例只比较已经给出的两条路线。如果改顺序、更早出发，或者分开拜访，那就是另一套计划，这里没有提供。
  s2_zh_hk: 本個案只比較已經給出嘅兩條路線。如果改順序、更早出發，或者分開探訪，那就係另一套計劃，呢度冇提供。
  s3_en: >-
    Even the feasible timetable can be delayed by traffic, loading or a blocked kerbside. A feasible plan
    is not a guarantee that the van will be on time on the day.
  s3_zh: 即使是可行的时间表，也可能被路况、装卸或者路边受阻耽误。方案可行，不代表实际路况下一定能准时。
  s3_zh_hk: 即使係可行嘅時間表，都可能被路況、裝卸或者路邊受阻耽誤。方案可行，唔等於路況有保證，當日一定準時。
  step3_en: A paper timetable is not a live-traffic guarantee
  step3_zh: 纸面时间表不是路况保证
  step3_zh_hk: 紙面時間表唔係路況保證
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A short loop can still miss a window
  title_zh: 短路程仍可能错过时间窗
  title_zh_hk: 短路程仍然可能錯過時間窗
  en: >-
    Choose a route only after every stop fits its window, including service time and the return. If a
    key window tightens, a previously attractive short loop can become infeasible, and a longer loop may
    be the one that still works.
  zh: >-
    只有每个站点都落在时间窗内，包括服务时间和返回，才能选定路线。如果关键时间窗收紧，原先更有吸引力的短回路可能变得不可行，更长的回路反而仍然走得通。
  zh_hk: >-
    只有每個站點都落喺時間窗之內，包括服務時間同返回，先可以選定路線。如果關鍵時間窗收緊，原先更有吸引力嘅短路仍可能變得不可行，更長嘅回路反而仍然行得通。
- id: takeaway
  visual: takeaway
