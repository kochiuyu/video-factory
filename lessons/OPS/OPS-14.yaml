  title_en: A shorter route. A missed window?
  title_zh: 路线更短，却错过时间窗？
  title_zh_hk: 路線更短，卻趕不上時間窗？
  image: art/route-and-window-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    A delivery van can choose a shorter loop and still miss a service window. Distance is not the same
    as a feasible timetable. This urban round, and every minute and kilometre, is fictional.
  zh: 送货车可以选一条更短的回路，却仍然错过服务时间窗。路程短，不等于时间表可行。课堂上这条市区线路，以及每一分钟和每一公里，都是虚构的。
  zh_hk: 送貨車可以揀一條更短嘅回路，卻仍然錯過服務時間窗。路程短，唔等於時間表可行。課堂上呢條市區路線，以及每一分鐘同每一公里，都係虛構嘅。
