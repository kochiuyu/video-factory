  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Fit the window, then compare distance
  title_zh: 先符合时间窗，再比路程
  title_zh_hk: 先符合時間窗，再比路程
  q1_en: The short route misses the new close at B
  q1_zh: 短路线赶不上B站新截止时间
  q1_zh_hk: 短路線趕唔上B站新截止時間
  q2_en: The longer route adds 3 km and 10 minutes
  q2_zh: 较长路线多3公里和10分钟
  q2_zh_hk: 較長路線多3公里同10分鐘
  s1_en: >-
    After confirmation, only Route 2 remains feasible among the two candidates. It returns at 10:40 and
    costs three extra kilometres and ten extra minutes.
  s1_zh: 确认之后，两条候选路线里只剩路线2可行。它十点四十返回，多出三公里和十分钟。
  s1_zh_hk: 確認之後，兩條候選路線裏面只剩路線2可行。佢十時四十返回，多出三公里同十分鐘。
  s2_en: >-
    The van, stops, windows and travel times are fictional classroom assumptions. Official scene art is
    a teaching illustration only.
  s2_zh: 这辆货车、站点、时间窗和行驶时间，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢輛貨車、站點、時間窗同行駛時間，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    Local traffic rules supply context, not evidence for any classroom minute or kilometre.
  s3_zh: 本地通行提示只提供背景，不能当作课堂上这些分钟或公里的证据。
  s3_zh_hk: 本地道路使用限制嘅提醒只提供背景，唔可以當作課堂上呢啲分鐘或公里嘅證據。
