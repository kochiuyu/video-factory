  s1_en: >-
    A van leaves depot D and must serve stops A, B and C, each with a time window and a ten-minute service.
    Route 1 goes D, A, B, C, D: 14 kilometres, 60 minutes of travel plus 30 minutes of service, and a
    10:30 return. The planned calls are 9:15 to 9:25 at A, 9:35 to 9:45 at B, and 10:00 to 10:10 at C.
  s1_zh: >-
    一辆货车从车场D出发，必须服务站点A、B、C，每个站点都有时间窗，服务时间十分钟。路线1按D、A、B、C、D走：十四公里，行驶六十分钟，加上三十分钟服务，十点三十分返回。计划到达是A站九点十五到九点二十五，B站九点三十五到九点四十五，C站十点到十点十分。
  s1_zh_hk: >-
    一輛貨車由車場D出發，必須服務站點A、B、C，每個站點都有時間窗，服務時間十分鐘。路線1按D、A、B、C、D走：十四公里，行駛六十分鐘，加上三十分鐘服務，十時三十分返回。計劃到達係A站九時十五至九時二十五，B站九時三十五至九時四十五，C站十時至十時十分。
  s2_en: >-
    Route 2 goes D, B, A, C, D: 17 kilometres and 70 minutes of travel, returning at 10:40. The planned
    calls are 9:20 to 9:30 at B, 9:40 to 9:50 at A, and 10:10 to 10:20 at C.
  s2_zh: >-
    路线2按D、B、A、C、D走：十七公里，行驶七十分钟，十点四十分返回。计划到达是B站九点二十到九点三十，A站九点四十到九点五十，C站十点十分到十点二十。
  s2_zh_hk: >-
    路線2按D、B、A、C、D走：十七公里，行駛七十分鐘，十時四十分返回。計劃到達係B站九時二十至九時三十，A站九時四十至九時五十，C站十時十至十時二十。
  s3_en: >-
    On the opening windows, both routes look feasible. The shorter route also returns ten minutes earlier.
    The question is which route to choose before the windows are reconfirmed.
  s3_zh: 按起初的时间窗，两条路线都看起来可行。更短的路线还早十分钟返回。问题是：在重新确认时间窗之前，该选哪一条。
  s3_zh_hk: 按起初嘅時間窗，兩條路線都睇落可行。更短嘅路線仲早十分鐘返回。問題係：喺重新確認時間窗之前，該揀邊一條。
