  s1_en: >-
    After confirmation, stop A’s window runs until 10:10. Stop B must start no later than 9:20 and finish
    by 9:35. Stop C is unchanged. These are the two candidate routes already drawn; the case does not
    invent a third tour.
  s1_zh: >-
    确认之后，A站的时间窗到十点十分。B站必须不晚于九点二十开始，并在九点三十五前完成。C站没有变化。只比较已经给出的两条候选路线，本案例不另设第三条线路。
  s1_zh_hk: >-
    確認之後，A站嘅時間窗到十時十分。B站必須唔遲於九時二十開始，並喺九時三十五前完成。C站冇變。只比較已經給出嘅兩條候選路線，本個案唔另外設第三條路線。
  s2_en: >-
    On Route 1, service at B still finishes at 9:45, after the revised close. That route is no longer
    feasible. Check Route 2 against the same constraints, including the extra distance and travel time.
  s2_zh: 在路线1上，B站仍然要到九点四十五才完成，已经超过调整后的截止时间。这条路线不再可行。请按同样的约束核路线2，包括多出的路程和行驶时间。
  s2_zh_hk: 喺路線1上面，B站仍然要到九時四十五先完成，已經超過修訂後嘅截止時間。呢條路線不再可行。請按同樣嘅限制核對路線2，包括多出嘅路程同行駛時間。
  s3_en: >-
    A feasible timetable on paper is not a guarantee under live traffic. Reconsider which route, if either,
    you would dispatch.
  s3_zh: 纸面上可行的时间表，并不保证实际路况下一定能准时。请重新考虑，这两条里你会派哪一条，或者都不派。
  s3_zh_hk: 紙面上可行嘅時間表，並唔保證實際路況下一定能夠準時。請重新考慮，呢兩條裏面你會派邊一條，或者兩條都唔派。
