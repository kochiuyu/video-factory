  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Choose the route that meets the aim
  title_zh: 选能实现目标的路线
  title_zh_hk: 揀能夠實現目標嘅路線
  q1_en: Route A can match Friday’s 10 and 70
  q1_zh: 路线A能对上周五的10和70
  q1_zh_hk: 路線A能夠對上周五嘅10同70
  q2_en: Route B matches 20 and saves HK$800
  q2_zh: 路线B对上20件，节省800港元
  q2_zh_hk: 路線B對上20件，慳800港元
  s1_en: >-
    If Friday availability is the aim, the 1,800-dollar route places the cleared units on time. The 1,000-dollar
    route leaves forty cleared units and twenty repaired units until after the promotion.
  s1_zh: >-
    如果目标是星期五就要可用，一千八百港元的路线能让已获准转售的货按时就位。一千港元的路线，会把四十件已获准转售的货和二十件修完的货，留到促销之后。
  s1_zh_hk: 如果目標係星期五就要可用，一千八百港元嘅路線能夠讓已放行嘅貨準時就位。一千港元嘅路線，會把四十件已放行嘅貨同二十件修完嘅貨，留到促銷之後。
  s2_en: >-
    The returns, sites, forecasts and quotes are fictional classroom assumptions. Official scene art is
    a teaching illustration only.
  s2_zh: 这些退货、地点、预估和报价，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢啲退貨、地點、預估同報價，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    The logistics report supplies context, not evidence for any classroom number.
  s3_zh: 物流报道只提供背景，不能当作课堂上这些数字的证据。
  s3_zh_hk: 物流報道只提供背景，唔可以當作課堂上呢啲數字嘅證據。
