  s1_en: >-
    A Friday promotion is now in the plan. Forecast demand that day is ten cleared units in the north
    and seventy in the south. Repair work is not finished before Friday.
  s1_zh: 现在计划里有一次星期五促销。当天预估需求是：北仓十件已获准转售的货，南仓七十件。维修工作星期五前完成不了。
  s1_zh_hk: 而家計劃裏有一次星期五促銷。當日預估需求係：北倉十件已放行嘅貨，南倉七十件。維修工作星期五前完成唔到。
  s2_en: >-
    Route A can place all eighty units, including the sixty cleared units, in position by Friday: ten
    in the north and seventy in the south, matching the forecast exactly.
  s2_zh: 路线A能在星期五前，把全部八十件货就位，包括六十件已获准转售的货：北面十件、南面七十件，正好对上预估。
  s2_zh_hk: 路線A能夠喺星期五前，把全部八十件貨就位，包括六十件已放行嘅貨：北面十件、南面七十件，正好對上預估。
  s3_en: >-
    Route B matches only the units already at each site: ten cleared units that fit the north forecast,
    and ten cleared units against seventy in the south, or twenty in total. Forty cleared units and all
    twenty repaired units would arrive after the promotion.
  s3_zh: >-
    路线B只能用已经在各地的货去匹配：北面对上十件，南面七十件需求里只对上十件，一共二十件。四十件已获准转售的货，以及二十件修完的货，要到促销之后才到达。
  s3_zh_hk: >-
    路線B只能用已經喺各地嘅貨去匹配：北面對上十件，南面七十件需求裏面只對上十件，合共二十件。四十件已放行嘅貨，以及二十件修完嘅貨，要到促銷之後先到達。
