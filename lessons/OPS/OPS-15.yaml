  s1_en: >-
    A retailer has eighty checked returns: sixty are cleared for resale, and twenty need repair first.
    Two recovery routes are quoted for the whole batch.
  s1_zh: 这家零售商有八十件已经检验的退货：六十件已获准转售，二十件要先维修。两条价值回收路线，都按整批报价。
  s1_zh_hk: 呢間零售商有八十件已經檢驗嘅退貨：六十件已放行可以轉售，二十件要先維修。兩條回收路線，都按整批報價。
  s2_en: >-
    Route A sends everything to the north warehouse first, then on to the south, at 1,800 Hong Kong dollars.
    Route B sends each unit to its own site, at 1,000 dollars. The difference is 800 dollars.
  s2_zh: 路线A先把全部货物送到北仓，再到南仓，成本一千八百港元。路线B把每件货送到各自的地点，成本一千港元。相差八百港元。
  s2_zh_hk: 路線A先把全部貨物送到北倉，再到南倉，成本一千八百港元。路線B把每件貨送到各自嘅地點，成本一千港元。相差八百港元。
  s3_en: >-
    Of the sixty cleared units, fifty came from the north and ten from the south. Of the twenty repair
    units, ten came from each site. The question is where the batch should go next.
  s3_zh: 六十件已获准转售的货里，五十件来自北面，十件来自南面。二十件待修货里，南北各十件。问题是：这批货接下来该往哪里送。
  s3_zh_hk: 六十件已放行嘅貨裏面，五十件來自北面，十件來自南面。二十件待修貨裏面，南北各十件。問題係：呢批貨接下來該送到邊度。
