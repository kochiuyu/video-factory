  en: >-
    Would you send the whole batch on the dearer combined route, or on the cheaper route that returns
    each unit to its own site? What recovery aim would decide it? Pause and vote.
  zh: 你会选择更贵的合送路线，把整批货一起送，还是选择更便宜、各回原地点的路线？你的价值回收目标会如何决定？请暂停，投个票。
  zh_hk: 你會揀較貴嘅合送路線，把整批貨一齊送，定係揀較平、各自送返原點嘅路線？你嘅回收目標會點樣決定？暫停，投個票。
