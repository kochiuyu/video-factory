  image: art/returned-checked-where-next-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    On 24 November 2025, reporting on Hong Kong logistics pointed to tighter screening of inbound and
    returned goods. After a return is checked, the next move decides how fast its value comes back. This
    recovered batch, and every figure, is fictional.
  zh: >-
    二零二五年十一月二十四日，有关香港物流的报道提到，对进境和退货物品的筛查更严。退货检验之后，下一步送到哪里，会决定价值回收有多快。课堂上这批回收货，以及全部数字，都是虚构的。
  zh_hk: >-
    二零二五年十一月二十四日，有關香港物流嘅報道提到，對進境同退貨物品嘅篩查更嚴。退貨檢驗之後，下一步送到邊度，會決定價值回收有幾快。課堂上呢批回收貨，同埋全部數字，都係虛構嘅。
