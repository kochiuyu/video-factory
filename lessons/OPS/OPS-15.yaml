  en: >-
    If the aim is to place cleared units for Friday, which route meets the forecast, and what does the
    800-dollar saving on B leave unmatched? Pause and vote again.
  zh: 如果目标是让已获准转售的货赶上星期五，哪条路线能对上预估？路线B节省的八百港元，会留下多少货对不上？请暂停，再投一次票。
  zh_hk: 如果目標係讓已放行嘅貨趕及星期五，邊條路線能夠對上預估？路線B慳到嘅八百港元，會留下幾多貨對唔上？暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Track each category’s next stop
  title_zh: 按类别追踪下一步
  title_zh_hk: 按類別追蹤下一站
  step1_en: A places 10 + 70 by Friday
  step1_zh: A周五就位10加70件
  step1_zh_hk: A周五就位10加70件
  step2_en: B matches only 20 by Friday
  step2_zh: B周五只对上20件
  step2_zh_hk: B周五只對上20件
  s1_en: >-
    Track cleared units and repair units separately. Route A can position ten plus seventy, or eighty
    units, by Friday, matching the promotion forecast.
  s1_zh: 要按类别追踪商品去向。路线A能在星期五前就位十加七十，也就是八十件，对上促销预估。
  s1_zh_hk: 要按類別追蹤貨品去向。路線A能夠喺星期五前就位十加七十，也就是八十件，對上促銷預估。
  s2_en: >-
    Route B’s Friday match is the minimum of fifty and ten in the north, plus the minimum of ten and seventy
    in the south, or twenty units. Forty cleared units and twenty repaired units arrive after the promotion.
  s2_zh: >-
    路线B在星期五能对上的，是北面五十和十的较小值，加上南面十和七十的较小值，等于二十件。四十件已获准转售的货和二十件修完的货，要到促销之后才到。
  s2_zh_hk: 路線B喺星期五能夠對上嘅，係北面五十同十嘅較小值，加上南面十同七十嘅較小值，等於二十件。四十件已放行嘅貨同二十件修完嘅貨，要到促銷之後先到。
  s3_en: >-
    The 800-dollar transport saving is real, but recovery can be slower. About 800 divided by 60 is roughly
    13 dollars per cleared unit as a descriptive figure only, not a decision rule.
  s3_zh: 八百港元的运费节省是实在的，但价值回收可能更慢。八百除以六十，大约是每件已获准转售货十三港元，这只是描述性数字，不是决策规则。
  s3_zh_hk: 八百港元嘅運費節省係實在嘅，但回收進度可能更慢。八百除以六十，大約係每件已放行貨十三港元，呢個只係描述性數字，唔係決策規則。
  step3_en: B leaves 40 and 20 until after
  step3_zh: B有40和20件会迟到
  step3_zh_hk: B有40同20件會遲到
- id: meaning
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Set the recovery aim first
  title_zh: 先明确价值回收目标
  title_zh_hk: 先選定回收目標
  step1_en: Transport cost is not the only score
  step1_zh: 运费不是唯一分数
  step1_zh_hk: 運費唔係唯一分數
  step2_en: A slower cheap route can miss Friday
  step2_zh: 更便宜但更慢会错过周五
  step2_zh_hk: 更平但更慢會錯過周五
  s1_en: >-
    State the recovery aim before choosing a route. If the aim is to place cleared units for Friday, the
    dearer combined route meets the forecast; the cheaper route does not.
  s1_zh: 先明确价值回收目标，再选路线。如果目标是让已获准转售的货赶上星期五，较贵的合送路线能对上预估；较便宜的路线对不上。
  s1_zh_hk: 先選定回收目標，再揀路線。如果目標係讓已放行嘅貨趕及星期五，較貴嘅合送路線能夠對上預估；較平嘅路線對唔上。
  s2_en: >-
    If the aim were only to minimise this batch’s transport cost, Route B would look better, at 1,000
    dollars against 1,800. That comparison ignores when the units become available for sale or after repair.
  s2_zh: 如果目标只是尽量降低这批货的运费，路线B看起来更好，一千港元对一千八百港元。这样比，忽略了货物何时能再出售，或修完后何时可用。
  s2_zh_hk: 如果目標只係盡量降低呢批貨嘅運費，路線B睇落更好，一千港元對一千八百港元。噉樣比，忽略咗貨物幾時能夠再出售，或修完之後幾時可用。
  s3_en: >-
    The Friday forecasts, inspection results and quotes are case assumptions. A different promotion date
    or mix of cleared and repair units would change the comparison.
  s3_zh: 星期五的预估、检验结果和报价，都是案例假设。如果促销日期不同，或者已获准转售和待修的比例不同，比较结果就会改变。
  s3_zh_hk: 星期五嘅預估、檢驗結果同報價，都係個案假設。如果促銷日期唔同，或者已放行同待修嘅比例唔同，比較結果就會改變。
  step3_en: Name the aim before choosing a route
  step3_zh: 选路线之前先说清目标
  step3_zh_hk: 揀路線之前先講清目標
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: A cheaper route can recover value later
  title_zh: 更便宜的路线可能回收更慢
  title_zh_hk: 更平嘅路線可能回收更慢
  en: >-
    After returns are checked, the next stop should follow the recovery aim. A combined route can cost
    more and still be the one that places goods for a dated promotion, while a cheaper point-to-point
    route leaves a large unmatched quantity.
  zh: 退货检验之后，下一站要跟着价值回收目标走。合送路线可能更贵，却能让货物赶上既定日期的促销；更便宜的点对点路线，会留下大量对不上的货。
  zh_hk: 退貨檢驗之後，下一站要跟住回收目標走。合送路線可能更貴，卻能夠讓貨物趕及既定日期嘅促銷；更平嘅點對點路線，會留下大量對唔上嘅貨。
