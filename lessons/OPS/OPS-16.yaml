  title_en: Cap releases, or keep every station busy?
  title_zh: 限制投产，还是让每站都忙？
  title_zh_hk: 限制投產，定讓每站都忙？
  en: >-
    Would you cap new releases so that twelve orders stay on the floor, or keep releasing work to keep
    every station busy? What would you measure before claiming that orders finish sooner? Pause and vote.
  zh: 你会限制新订单投产，让车间保持十二张在制品，还是继续投产，好让每道工序都忙着？要声称订单会更早完工，你先会量什么？请暂停，投个票。
  zh_hk: 你會限制新訂單投產，讓工場保持十二張在製品，定係繼續投產，等每個工序都忙住？要聲稱訂單會更快完成，你會先量啲咩？暫停，投個票。
