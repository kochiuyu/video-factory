  en: >-
    Under the stable averages, what is floor time and what is acceptance-to-completion time under each
    policy? Does the cap cut customer time to three days? Pause and vote again.
  zh: 按这些稳定平均数，两种政策下的车间时间是多少，从接单到完工的时间又是多少？投产上限能把客户时间减到三天吗？请暂停，再投一次票。
  zh_hk: 按呢啲穩定平均數，兩種政策之下嘅工場時間係幾多，由接單到完工嘅時間又係幾多？投產上限能唔能把顧客時間減到三日？暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Start more, finish no more
  title_zh: 开工更多，完工并没有更多
  title_zh_hk: 投產更多，完工量冇增加
  step1_en: >-
    A: 24/4 = 6 days on the floor
  step1_zh: A：24÷4=6天在车间
  step1_zh_hk: A：24÷4=6日喺工場
  step2_en: >-
    B: 12/4 = 3 days on the floor
  step2_zh: B：12÷4=3天在车间
  step2_zh_hk: B：12÷4=3日喺工場
  s1_en: >-
    Releasing more did not increase completions. In the five-day burst, eight went in and four came out
    each day, so the floor grew. A stable comparison has to use the later averages, not that growing period.
  s1_zh: 开工更多，完工并没有更多。那五天里，每天投产八张、完工四张，车间在制品增加。稳定比较要用后来的平均数，不能用这段增加期。
  s1_zh_hk: 投產更多，完工量冇增加。嗰五日裏面，每日投產八張、完工四張，工場在製品增加。穩定比較要用後來嘅平均數，唔可以用呢段增加期。
  s2_en: >-
    Under policy A, floor time is twenty-four divided by four, or six days. Customer time, from acceptance
    to completion, is also six days, because nothing waits off the floor.
  s2_zh: 在方案A下，车间时间是二十四除以四，等于六天。从接单到完工的客户时间也是六天，因为没有订单在车间外等待。
  s2_zh_hk: 喺方案A之下，工場時間係二十四除以四，等於六日。由接單到完工嘅顧客時間都係六日，因為冇訂單喺工場外等待。
  s3_en: >-
    Under policy B, floor time is twelve divided by four, or three days. The twelve unreleased orders
    are another three days. Customer time is still twenty-four divided by four, or six days. The three-day
    customer claim does not hold.
  s3_zh: >-
    在方案B下，车间时间是十二除以四，等于三天。十二张未投产的订单，又是三天。客户时间仍是二十四除以四，等于六天。所谓三天客户时间的说法，不成立。
  s3_zh_hk: >-
    喺方案B之下，工場時間係十二除以四，等於三日。十二張未投產嘅訂單，又係三日。顧客時間仍然係二十四除以四，等於六日。所謂三日顧客時間嘅說法，唔成立。
  step3_en: Customer time stays 6 days
  step3_zh: 客户时间仍是6天
  step3_zh_hk: 顧客時間仍然係6日
- id: meaning
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A tidier floor is not a faster promise
  title_zh: 车间更有序不是更快承诺
  title_zh_hk: 工場更有條理唔等於更快承諾
  step1_en: Draw the boundary first
  step1_zh: 先画清量度范围
  step1_zh_hk: 先劃定量度範圍
  step2_en: The cap does not add capacity
  step2_zh: 管控不会增加产能
  step2_zh_hk: 控制規則唔會增加產能
  s1_en: >-
    A more orderly floor can still leave the customer waiting just as long, if the waiting has only moved
    upstream of the release point. Do not turn a tidier workshop into a faster customer promise.
  s1_zh: 车间更有序，不等于可以对客户作出更快的承诺。如果等待只是移到了投产点之前，客户等待的时间可以仍然一样长。
  s1_zh_hk: 別把工場更有條理，變成誤導顧客嘅承諾。如果等待只係移到投產點之前，顧客等待嘅時間可以仍然一樣長。
  s2_en: >-
    Little’s law applies only to the supplied stable averages, and only inside a clearly drawn boundary.
    The five-day burst was not a stable state, and should not be used as if it were.
  s2_zh: 利特尔法则只适用于给定的稳定平均数，而且要先画清边界。那五天不是稳定状态，不能当成稳定状态来用。
  s2_zh_hk: 利特爾法則只適用於給定嘅穩定平均數，而且要先劃定量度範圍。嗰五日唔係穩定狀態，唔可以當成穩定狀態嚟用。
  s3_en: >-
    A release cap changes where work waits. It does not raise the four-order completion rate in this case.
    Quoting three days to customers would be misleading.
  s3_zh: 投产上限改变的是工作在哪里等待。在本案例里，它不会把每天四张的完工量提高。向客户报价三天，会造成误导。
  s3_zh_hk: 投產上限改變嘅係工作喺邊度等待。喺本個案裏面，佢唔會把每日四張嘅完工量提高。向顧客報價三日，會造成誤導。
  step3_en: Do not quote three days to customers
  step3_zh: 不要向客户报价三天
  step3_zh_hk: 唔好向顧客報價三日
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Floor time is not customer time
  title_zh: 车间时间不是客户时间
  title_zh_hk: 工場時間唔等於顧客時間
  en: >-
    If unreleased work is left outside the floor count, a shorter floor time can hide an unchanged wait
    from acceptance to completion. Before claiming a lead-time cut, say which jobs are inside the boundary,
    and whether completions have actually risen.
  zh: >-
    如果未投产的订单被留在车间计数之外，更短的车间时间，可能掩盖从接单到完工仍然不变的等待。要声称缩短了提前期，先说清边界里包括哪些订单，以及完工量是否真的增加了。
  zh_hk: >-
    如果未投產嘅訂單被留喺工場計數之外，更短嘅工場時間，可能掩蓋由接單到完工仍然不變嘅等待。要聲稱縮短咗前置時間，先講清量度範圍包括邊啲訂單，以及完工量係咪真係增加咗。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Busy stations can still leave long waits
  title_zh: 工序忙碌仍可能等得久
  title_zh_hk: 工序忙碌仍然可能等得耐
  q1_en: The cap cuts floor time, not customer time
  q1_zh: 上限缩短车间时间，不是客户时间
  q1_zh_hk: 上限縮短工場時間，唔係顧客時間
  q2_en: Completions stay at four orders a day
  q2_zh: 每天完工仍然是四张
  q2_zh_hk: 每日完工仍然係四張
  s1_en: >-
    Under the stable averages, policy B halves time on the floor but leaves customer time at six days,
    because twelve orders wait unreleased. The three-day claim should be rejected.
  s1_zh: 按稳定平均数，方案B把车间时间减半，但客户时间仍是六天，因为有十二张订单在未投产处等待。三天的说法应予拒绝。
  s1_zh_hk: 按穩定平均數，方案B把工場時間減半，但顧客時間仍然係六日，因為有十二張訂單喺未投產處等待。三日嘅說法應予拒絕。
  s2_en: >-
    The workshop, releases, caps and averages are fictional classroom assumptions. Official scene art
    is a teaching illustration only.
  s2_zh: 这家工场、投产、上限和平均数，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢間工場、投產、上限同平均數，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    Lean-production history supplies context, not evidence for any classroom number.
  s3_zh: 精益生产的历史背景只提供情境，不能当作课堂上这些数字的证据。
  s3_zh_hk: 精益生產嘅歷史背景只提供情境，唔可以當作課堂上呢啲數字嘅證據。
