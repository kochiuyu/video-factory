  title_en: Keep every station busy. Finish orders sooner?
  title_zh: 每道工序都忙起来，订单就能更早完工？
  title_zh_hk: 讓每個工序都忙起來，訂單就能更快完成？
  image: art/started-is-not-finished-scene.jpg
  caption_en: Classroom assumptions, not a news report
  caption_zh: 课堂假设，不是新闻报道
  caption_zh_hk: 課堂假設，不是新聞報道
  en: >-
    Hong Kong factories have long discussed lean production and work-in-process control. Keeping every
    station busy is not the same as finishing orders sooner. This workshop, and every figure, is fictional.
  zh: 香港工厂很早就在讨论精益生产和在制品控制。每道工序都忙起来，并不等于订单会更早完工。课堂上的这家工场，以及全部数字，都是虚构的。
  zh_hk: 香港工廠好早就喺度討論精益生產同在製品控制。每個工序都忙起來，並唔等於訂單會更快完成。課堂上呢間工場，同埋全部數字，都係虛構嘅。
