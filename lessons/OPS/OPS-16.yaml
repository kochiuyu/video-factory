  s1_en: >-
    A workshop has been releasing eight orders a day, while only four are completed. Work-in-process on
    the floor therefore rises by four orders a day. Over five days, twenty extra orders accumulate on
    the floor. Daily completions stay at four.
  s1_zh: 这家工场每天投产八张订单，但每天只完工四张。因此，车间里的在制品每天增加四张。五天里，车间多积了二十张订单。每天的完工量仍是四张。
  s1_zh_hk: 呢間工場每日投產八張訂單，但每日只完工四張。所以，工場裏嘅在製品每日增加四張。五日裏面，工場多積咗二十張訂單。每日嘅完工量仍然係四張。
  s2_en: >-
    A supervisor proposes a release cap: start a new order only when one is finished, so that the floor
    holds a stable twelve orders. Another colleague wants every station kept busy, and argues that a fuller
    floor means orders will finish sooner.
  s2_zh: >-
    一位主管提议设置投产上限：只有一张订单完工，才开工一张新的，好让车间稳定保持十二张在制品。另一位同事希望每道工序都忙着，并认为车间更满，订单就会更早完工。
  s2_zh_hk: >-
    一位主管提議設定投產上限：只有一張訂單完工，先開工一張新嘅，等工場穩定保持十二張在製品。另一位同事希望每個工序都忙住，並認為工場更滿，訂單就會更快完成。
  s3_en: >-
    The five-day burst is a growing period, not a stable average. Before comparing floor time or customer
    time, the class has to be clear which period is being measured.
  s3_zh: 这五天是在制品增加的阶段，不是稳定的平均数。比较车间时间或客户时间之前，要先说清量的是哪一段时间。
  s3_zh_hk: 呢五日係在製品增加嘅階段，唔係穩定嘅平均數。比較工場時間或顧客時間之前，要先講清量嘅係邊一段時間。
