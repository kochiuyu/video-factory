  footer_zh_hk: 只用呢啲穩定平均數
  s1_en: >-
    After the burst, compare two stable policies. Completions remain four orders a day in both. Policy
    A has no release cap: twenty-four orders sit on the floor, and none wait off the floor.
  s1_zh: 这一轮过后，比较两种稳定政策。两种情况下，每天完工仍是四张。方案A不设投产上限：二十四张订单在车间里，没有订单在车间外等待。
  s1_zh_hk: 呢一輪之後，比較兩種穩定政策。兩種情況下，每日完工仍然係四張。方案A唔設投產上限：二十四張訂單喺工場裏，冇訂單喺工場外等待。
  s2_en: >-
    Policy B caps the floor at twelve. Another twelve accepted orders wait unreleased. The cap does not
    increase capacity; it only changes where work waits. Little’s law is to be used only on these supplied
    stable averages.
  s2_zh: >-
    方案B把车间上限设为十二张。另外十二张已经接受的订单，在未投产的队列里等待。管控规则不会增加产能，只会改变工作在哪里等待。只有这些给定的稳定平均数，才用来应用利特尔法则。
  s2_zh_hk: >-
    方案B把工場上限設為十二張。另外十二張已經接受嘅訂單，喺未投產嘅隊列裏面等待。控制規則唔會增加產能，只會改變工作喺邊度等待。只有呢啲給定嘅穩定平均數，先用來應用利特爾法則。
  s3_en: >-
    A colleague claims that policy B cuts customer time from six days to three, because twelve divided
    by four is three. Check that claim by drawing the boundary first: floor time is not the same as time
    from acceptance to completion.
  s3_zh: 有同事声称，方案B能把客户时间从六天减到三天，因为十二除以四等于三。请先画清边界再核这个说法：车间时间，不等于从接单到完工的时间。
  s3_zh_hk: 有同事聲稱，方案B能夠把顧客時間由六日減到三日，因為十二除以四等於三。請先劃定量度範圍再核呢個說法：工場時間，唔等於由接單到完工嘅時間。
