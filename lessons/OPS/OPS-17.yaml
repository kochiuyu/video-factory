  en: >-
    On 22 September 2026, Hong Kong’s labour authorities published an updated manpower projection. Capacity
    is also a matter of people. This workshop’s boxes, positions and costs are fictional.
  zh: 二零二六年九月二十二日，香港劳工部门发布了更新的人力推算。产能也取决于人。课堂上这家工场的收纳箱、岗位和成本，都是虚构的。
  zh_hk: 二零二六年九月二十二日，香港勞工部門公布咗更新嘅人力推算。產能都取決於人手。課堂上呢間工場嘅收納箱、崗位同成本，都係虛構嘅。
