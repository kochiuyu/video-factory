  footer_en: >-
    One position: 20 boxes, HK$20,000
  footer_zh: 一个岗位：20箱、20,000港元
  footer_zh_hk: 一個崗位：20箱、20,000港元
  s1_en: >-
    A workshop must choose between two prepared six-month plans for a standard storage box. Plan L keeps
    five trained positions and makes 100 boxes every month. Plan C follows monthly orders by changing
    trained positions, with no stock or late delivery.
  s1_zh: >-
    这家工场要在两套已经准备好的六个月方案里做选择，产品是不变的标准收纳箱。方案L保留五个受过培训的生产岗位，每月生产一百个箱子。方案C按每月订单调整岗位，不存货，也不延迟交货。
  s1_zh_hk: >-
    呢間工場要喺兩套已經準備好嘅六個月方案裏面做選擇，產品係不變嘅標準收納箱。方案L保留五個受過培訓嘅生產崗位，每月生產一百個收納箱。方案C按每月訂單調整崗位，唔存貨，亦都唔延遲交貨。
  s2_en: >-
    One filled position provides 20 boxes a month and costs 20,000 Hong Kong dollars that month, whether
    busy or idle. Adding a qualified position costs 3,000 dollars, including paid induction a month ahead.
    Ending an assignment costs 2,000 dollars. Both plans start at five positions and must restore five
    for the next cycle.
  s2_zh: >-
    一个在岗岗位每月可产二十个箱子，当月成本是两万港元，不论忙闲。增设一个合格岗位要三千港元，包括提前一个月完成的带薪岗前培训。结束一个岗位要两千港元。两套方案都从五个岗位起步，并且必须在下个周期开始前恢复到五个岗位。
  s2_zh_hk: >-
    一個在崗崗位每月可產二十個收納箱，當月成本係兩萬港元，不論忙閒。增設一個合格崗位要三千港元，包括提前一個月完成嘅帶薪入職培訓。結束一個崗位要兩千港元。兩套方案都由五個崗位起步，並且必須喺下個周期開始前恢復到五個崗位。
  s3_en: >-
    Opening stock and backlog are zero. Month-end finished stock costs 100 dollars per box per month and
    cannot exceed 40 boxes. A customer has agreed that up to 20 boxes due in month 5 may arrive in month
    6, at 1,000 dollars per delayed box. No other late delivery is allowed. Both plans end at zero stock
    and backlog.
  s3_zh: >-
    期初存货和积压都是零。月末成品库存每个箱子每月一百港元，且不能超过四十个箱子。客户已同意，第五个月到期的箱子，最多二十个可以改到第六个月到，每个延期箱子一千港元。不允许其他延迟交货。两套方案期末存货和积压都为零。
  s3_zh_hk: >-
    期初存貨同積壓都係零。月末成品存貨每個收納箱每月一百港元，而且唔能夠超過四十個收納箱。客戶已同意，第五個月到期嘅收納箱，最多二十個可以改到第六個月到，每個延期收納箱一千港元。唔允許其他延遲交貨。兩套方案期末存貨同積壓都係零。
