  title_en: Choose steady output, or follow the peak?
  title_zh: 选稳定生产，还是跟着高峰？
  title_zh_hk: 揀穩定生產，定跟隨高峰？
  en: >-
    Would you choose L or C for this first calendar? Trace L’s inventory and the agreed delay, include
    C’s starting and ending staffing changes, and explain the cost-versus-service trade-off. Pause and
    vote.
  zh: >-
    按这个最初的订单日历，你会选L还是C？请推算L的库存和约定延期，把C期初和期末的人员调整也算进去，并说明成本与服务之间的取舍。请暂停，投个票。
  zh_hk: 按呢個最初嘅訂單日曆，你會揀L定C？請推算L嘅存貨同約定延期，把C期初同期末嘅人手調整都算進去，並說明成本同服務之間嘅取捨。暫停，投個票。
