  title_zh_hk: 時序成本唔只係合計數
  q1_en: A later peak can remove the need for delay
  q1_zh: 高峰推迟可能不再需要延期
  q1_zh_hk: 高峰推遲可能不再需要延期
  q2_en: Paid retention is not automatically cheaper
  q2_zh: 带薪留岗不一定更便宜
  q2_zh_hk: 帶薪留崗唔一定更平
  s1_en: >-
    After the second peak moves to month 6, steady output is the lowest of the three compared totals,
    at 612,000 dollars. Following the peak costs 630,000, and keeping seven people through the quiet months
    costs 735,000.
  s1_zh: 第二个高峰改到第六个月后，稳定生产在三个比较方案里成本最低，是六十一万二千港元。跟着高峰走是六十三万港元，淡季留下七个人是七十三万五千港元。
  s1_zh_hk: >-
    第二個高峰改到第六個月之後，維持產量喺三個比較方案裏面成本最低，係六十一萬二千港元。跟隨高峰係六十三萬港元，淡季留下七個人係七十三萬五千港元。
  s2_en: >-
    The workshop, orders, positions and cost quotes are fictional classroom assumptions. Official scene
    art is a teaching illustration only.
  s2_zh: 这家工场、订单、岗位和成本报价，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢間工場、訂單、崗位同成本報價，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    The manpower projection supplies context, not evidence for any classroom number.
  s3_zh: 人力推算只提供背景，不能当作课堂上这些数字的证据。
  s3_zh_hk: 人力推算只提供背景，唔可以當作課堂上呢啲數字嘅證據。
duration_target_s: 196
