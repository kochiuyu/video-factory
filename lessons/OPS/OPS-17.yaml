  kicker_zh_hk: 講評
  title_en: Follow the month-end balance
  title_zh: 逐月核算库存余额
  title_zh_hk: 逐月追蹤存貨結餘
  step1_en: Initial L totals HK$628,000
  step1_zh: 最初L合计628,000港元
  step1_zh_hk: 最初L合計628,000港元
  step2_en: Initial C totals HK$635,000
  step2_zh: 最初C合计635,000港元
  step2_zh_hk: 最初C合計635,000港元
  s1_en: >-
    For the first calendar, L’s month-end net stock is 20, 40, 0, 20, minus 20, then 0. The negative entry
    means 20 agreed delayed boxes, not negative physical stock. Holding is 80 box-months, or 8,000 dollars,
    plus 20,000 dollars for the agreed delay.
  s1_zh: >-
    按最初的日历，L的月末净库存是二十、四十、零、二十、负二十，然后是零。负数表示二十个已约定延期的箱子，不是实物库存为负。持有量是八十个箱月，也就是八千港元，再加上约定延期的两万港元。
  s1_zh_hk: >-
    按最初嘅日曆，L嘅月末淨存貨係二十、四十、零、二十、負二十，然後係零。負數表示二十個已約定延期嘅收納箱，唔係實物存貨為負。持有量係八十個箱月，也就是八千港元，再加上約定延期嘅兩萬港元。
  s2_en: >-
    Five positions for six months cost 600,000 dollars, so L’s compared total is 628,000 dollars. The
    40-box storage limit is respected.
  s2_zh: 五个岗位用六个月，成本六十万港元，因此L的比较成本是六十二万八千港元。四十个箱子的库存上限得到遵守。
  s2_zh_hk: 五個崗位用六個月，成本六十萬港元，所以L嘅比較成本係六十二萬八千港元。四十個收納箱嘅存貨上限得到遵守。
  s3_en: >-
    Initial C uses 30 position-months, also 600,000 dollars, but seven additions and seven endings cost
    35,000 dollars, for a total of 635,000, with no stock or delay. L is 7,000 dollars lower, but it uses
    the agreed delivery variation.
  s3_zh: >-
    最初的C使用三十个岗位月，同样是六十万港元，但七次增设和七次结束要三万五千港元，合计六十三万五千港元，没有库存，也没有延期。L低七千港元，但它用了约定的交货调整。
  s3_zh_hk: >-
    最初嘅C使用三十個崗位月，同樣係六十萬港元，但七次增設同七次結束要三萬五千港元，合計六十三萬五千港元，冇存貨，亦都冇延期。L低七千港元，但它用咗約定嘅交貨調整。
  step3_en: L is HK$7,000 lower here
  step3_zh: 这里L低7,000港元
  step3_zh_hk: 呢度L低7,000港元
- id: meaning
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: A later peak changes the path
  title_zh: 高峰推迟，路径也变了
  title_zh_hk: 高峰一推遲，路徑就唔同
  step1_en: Revised L totals HK$612,000
  step1_zh: 调整后L为612,000港元
  step1_zh_hk: 修訂後L係612,000港元
  step2_en: Revised C totals HK$630,000
  step2_zh: 调整后C为630,000港元
  step2_zh_hk: 修訂後C係630,000港元
  s1_en: >-
    After the peak moves, revised L ends months with 20, 40, 0, 20, 40 and 0 boxes. Holding is 120 box-months,
    or 12,000 dollars, with no backlog, for a total of 612,000 dollars.
  s1_zh: 高峰推迟后，调整后的L月末库存是二十、四十、零、二十、四十、零。持有量是一百二十个箱月，也就是一万二千港元，没有积压，合计六十一万二千港元。
  s1_zh_hk: 高峰推遲之後，修訂後嘅L月末存貨係二十、四十、零、二十、四十、零。持有量係一百二十個箱月，也就是一萬二千港元，冇積壓，合計六十一萬二千港元。
  s2_en: >-
    Revised C still uses 30 position-months, but now needs six additions and six endings, including the
    first reduction and the final return to five. Adjustment cost is 30,000 dollars, for a total of 630,000.
  s2_zh: 调整后的C仍然使用三十个岗位月，但现在只需六次增设和六次结束，包括期初减员和期末回到五个岗位。人员调整成本是三万港元，合计六十三万港元。
  s2_zh_hk: 修訂後嘅C仍然使用三十個崗位月，但而家只需六次增設同六次結束，包括期初減員同期末回到五個崗位。人手調整成本係三萬港元，合計六十三萬港元。
  s3_en: >-
    Keeping seven positions in both quiet months adds six paid position-months, or 120,000 dollars, and
    saves 15,000 dollars of avoided changes. Relative to revised C that is 105,000 dollars more, or 735,000
    in total. Continuity may have value beyond these figures, but it is not a cost saving here.
  s3_zh: >-
    在两个淡季月份都保留七个岗位，会多付六个岗位月，也就是十二万港元，同时省下三万五千里的一万五千港元调整费用。相对调整后的C，净增多十万五千港元，合计七十三万五千港元。团队稳定可能有数字以外的价值，但在这里不能说成省了钱。
  s3_zh_hk: >-
    喺兩個淡季月份都保留七個崗位，會多付六個崗位月，也就是十二萬港元，同時慳到一萬五千港元調整費用。相對修訂後嘅C，淨增多十萬五千港元，合計七十三萬五千港元。團隊延續性可能有數字以外嘅價值，但喺呢度唔能夠話成慳咗錢。
  step3_en: Retention adds HK$105,000
  step3_zh: 留岗再多105,000港元
  step3_zh_hk: 留崗再多105,000港元
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Equal totals can hide timing costs
  title_zh: 总量相同仍可能时序成本不同
  title_zh_hk: 總量相同仍然可能時序成本唔同
  en: >-
    Do not average 600 boxes into 100 a month and stop. Follow the month-end balance, mark any agreed
    delay, and count starting and ending staffing changes. On the revised figures, L is lowest of the
    three, but it is not proven to be a global optimum.
  zh: >-
    不要把六百个箱子平均成每月一百个就停下来。要逐月核对余额，标出约定延期，并把期初和期末的人员调整都算进去。按调整后给定的成本，三个方案里L最低，但不能证明它是全局最优。
  zh_hk: >-
    唔好把六百個收納箱平均成每月一百個就停低。要逐月核對結餘，標出約定延期，并把期初同期末嘅人手調整都算進去。按修訂後給定嘅成本，三個方案裏面L最低，但唔能夠證明佢係全局最優。
