  s1_en: >-
    Before any staffing change or production begins, the customer moves 60 boxes from month 5 to month
    6. Orders are now 80, 80, 140, 80, 80 and 140. The total is still 600. The original delayed-delivery
    allowance is no longer needed.
  s1_zh: >-
    在人员還未调整、生产還未开始之前，客户把六十个箱子从第五个月改到第六个月。订单变成八十、八十、一百四十、八十、八十、一百四十。合计仍是六百。原来的可选延期交货，已经不再需要。
  s1_zh_hk: >-
    喺人手還未調整、生產還未開始之前，客戶把六十個收納箱由第五個月改到第六個月。訂單變成八十、八十、一百四十、八十、八十、一百四十。合計仍然係六百。原來可選用嘅延期交貨，已經不再需要。
  s2_en: >-
    L can still make 100 boxes a month. C can revise positions to 4, 4, 7, 4, 4 and 7, then return to
    five. All changes can still be planned with the required training lead time; there are no sunk adjustment
    costs yet.
  s2_zh: >-
    L仍然可以每月生产一百个箱子。C可以把各月岗位数改为四、四、七、四、四、七，然后再回到五个。所有调整仍可按所需培训提前期来安排，目前还没有已经沉没的人员调整成本。
  s2_zh_hk: >-
    L仍然可以每月生產一百個收納箱。C可以把各月崗位數改為四、四、七、四、四、七，然後再回到五個。所有調整仍可按所需培訓前置時間嚟安排，目前仲未有已經沉沒嘅人手調整成本。
  s3_en: >-
    A manager proposes keeping all seven trained positions through months 4 and 5. They remain fully paid
    but make only the 80 boxes due each month. No extra inventory or other assignment is supplied in this
    variant, and no quantified continuity benefit is given.
  s3_zh: >-
    有一位经理提议，第四、第五个月都保留七个岗位。这些人仍然全额付薪，但每月只生产到期的八十个箱子。这个留岗方案没有额外库存，也没有其他生产任务，更没有给出可量化的团队稳定收益。
  s3_zh_hk: >-
    有一位經理提議，第四、第五個月都保留七個崗位。呢啲人仍然全額付薪，但每月只生產到期嘅八十個收納箱。呢個留崗方案冇額外存貨，亦都冇其他生產任務，更冇給出可量化嘅團隊延續收益。
- id: pause2
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: L, revised C, or paid retention?
  title_zh: 选L、调整后的C，还是留岗？
  title_zh_hk: 揀L、修訂後嘅C，定留崗？
  en: >-
    How would you revise the plan now that the second peak is later? Compare L, revised C and the paid-retention
    variant, and explain why equal totals need not mean equal timing costs. Pause and vote again.
  zh: 第二个高峰推迟了，你会怎样调整方案？请比较L、调整后的C，以及带薪留岗方案，并说明为什么总量相同，时序成本却不必相同。请暂停，再投一次票。
  zh_hk: 第二個高峰推遲咗，你會點樣調整方案？請比較L、修訂後嘅C，以及帶薪留崗方案，並說明點解總量相同，時序成本卻唔一定相同。暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
