  s1_en: >-
    A distributor supplies one retailer with a standard reusable storage box. The retailer’s last four
    weekly orders were 0, 200, 0 and 300 boxes. The latest increase has to be interpreted. The decision
    is the future planning routine, not whether to honour a confirmed order.
  s1_zh: >-
    这家分销商向一家零售商供应标准可重复使用的收纳箱。零售商最近四周的订货是零、两百、零和三百箱。最新这次增加，需要解读。要决定的是今后怎么做计划，不是是否履行已经确认的订单。
  s1_zh_hk: >-
    呢間分銷商向一間零售商供應標準可重用收納箱。零售商最近四周嘅訂貨係零、兩百、零同三百箱。最新呢次增加，需要解讀。要決定嘅係今後點樣做計劃，唔係係咪履行已經確認嘅訂單。
  s2_en: >-
    Routine A keeps using incoming order changes as the main signal for the internal capacity forecast.
    It is fast, and it closely reflects the requests the distributor must serve.
  s2_zh: 方案A继续把进来的订单变化，当作内部产能预测的主要信号。这样做快，也能紧贴分销商必须满足的请求。
  s2_zh_hk: 方案A繼續把進來嘅訂單變化，當作內部產能預測嘅主要信號。噉樣做快，亦都能夠直接反映分銷商必須滿足嘅請求。
  s3_en: >-
    Routine B adds a weekly two-hour review of retailer sales, stock, outstanding orders and delivery
    dates before that forecast is changed. The two staff hours are funded and displace a non-urgent catalogue
    refresh. No extra stock or capacity is authorised just by choosing B.
  s3_zh: >-
    方案B在调整预测之前，增加每周两小时的对账，核对零售商的销量、库存、未完成订单和交货日期。这两个工时是有预算的，会挤占一项不紧急的目录更新。选择B本身，并不授权额外备货或预订产能。
  s3_zh_hk: >-
    方案B喺調整預測之前，增加每週兩小時嘅核對，核對零售商嘅銷量、存貨、未完成訂單同交貨日期。呢兩個工時係有預算嘅，會擠佔一項唔緊急嘅目錄更新。選擇B本身，並唔授權額外備貨或預訂產能。
