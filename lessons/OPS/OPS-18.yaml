  footer_en: Start 250; receipts 0, 0, 200, 0
  footer_zh: 期初250；收货0、0、200、0
  footer_zh_hk: 期初250；收貨0、0、200、0
  s1_en: >-
    The retailer began week 1 with 250 boxes on hand and no outstanding orders. Orders placed at the end
    of a week arrive at the start of the next week. Consumer sales were 100, 110, 90 and 100. Closing
    stocks were 150, 40, 150 and 50. Week-3 receipts were 200 boxes; the other weeks received none.
  s1_zh: >-
    零售商第一周开始时，有二百五十箱在手库存，没有未完成订单。周末下的订单，会在下周初到达。顾客销量是一百、一百一十、九十和一百。期末库存是一百五十、四十、一百五十和五十。第三周收货两百箱，其余各周没有收货。
  s1_zh_hk: >-
    零售商第一週開始時，有二百五十箱在手存貨，冇未完成訂單。週末落嘅訂單，會喺下週初到達。顧客銷量係一百、一百一十、九十同一百。期末存貨係一百五十、四十、一百五十同五十。第三週收貨兩百箱，其餘各週冇收貨。
  s2_en: >-
    The retailer normally batches orders every second week. The week-2 order was 200 boxes. In week 4
    a temporary wholesale discount was used: the planned 200 boxes plus 100 for later weeks. The customer-facing
    price did not change. The 300-box order is a genuine commitment, all due in week 5.
  s2_zh: >-
    零售商通常每隔一周合并订货，以节省行政工作。第二周订了两百箱。第四周有一个短期批发折扣，零售商决定利用：除了原计划的两百箱，再加一百箱留给后面几周。面向顾客的价格和促销没有变。这三百箱是真实承诺，全部要在第五周交到。
  s2_zh_hk: >-
    零售商通常隔週合併訂貨，以節省行政工作。第二週訂咗兩百箱。第四週有一個短期批發折扣，零售商決定把握機會：除咗原計劃嘅兩百箱，再加一百箱留給後面幾週。面向顧客嘅價格同促銷冇變。呢三百箱係真實承諾，全部要喺第五週交到。
  s3_en: >-
    At the end of week 4, 50 boxes are on hand and 300 are already inbound. Future consumer demand is
    unknown. Seeing the sales file does not, by itself, remove the two-week batching practice or the discount
    incentive. Do not order another 300 merely because the existing 300 have not arrived yet.
  s3_zh: >-
    第四周末，在手库存五十箱，已有三百箱在途。未来的顾客需求未知。看到销售文件本身，并不能取消隔周订货的做法，也不能取消折扣诱因。不要只因为这三百箱还没到，就再订三百箱。
  s3_zh_hk: >-
    第四週末，在手存貨五十箱，已有三百箱在途。未來嘅顧客需求未知。睇到銷售文件本身，並唔能夠取消隔週訂貨嘅做法，亦都唔能夠取消折扣誘因。唔好只因為呢三百箱仲未到，就再訂三百箱。
