  title_en: What caused the order swings?
  title_zh: 订单大幅波动是什么原因？
  title_zh_hk: 訂單大幅波動係咩原因？
  en: >-
    How would you revise your interpretation and planning routine? Reconcile sales, orders and the pipeline,
    then name one cause of the swings that sharing data alone would not remove. Pause and vote again.
  zh: 你会怎样修正解读和计划方式？请先对销量、订货和在途货物，然后指出一个原因：即使共享数据，也不能单独消除这种波动。请暂停，再投一次票。
  zh_hk: 你會點樣修正解讀同計劃方式？請先核對銷量、訂貨同在途貨物，然後指出一個原因：即使共享數據，都不能夠單獨消除呢種波動。暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Reconcile before reacting
  title_zh: 先对账，再行动
  title_zh_hk: 先核對，再行動
  step1_en: Sales total 400; range 90–110
  step1_zh: 销量合计400；介于90到110
  step1_zh_hk: 銷量合計400；介乎90到110
  step2_en: Orders total 500; range 0–300
  step2_zh: 订货合计500；介于0到300
  step2_zh_hk: 訂貨合計500；介乎0到300
  s1_en: >-
    Consumer sales total 400 boxes and stay in a narrow band, from 90 to 110 a week. Retailer orders total
    500 and swing from 0 to 300. The orders are not a picture of weekly consumption.
  s1_zh: 顾客销量合计四百箱，而且波动很窄，每周介于九十到一百一十。零售商订货合计五百箱，却在零到三百之间大幅波动。订单并不是每周消费量的写真。
  s1_zh_hk: 顧客銷量合計四百箱，而且波動好窄，每週介乎九十到一百一十。零售商訂貨合計五百箱，卻喺零到三百之間大幅波動。訂單並唔係每週消費量嘅寫照。
  s2_en: >-
    Start with 250, add orders of 500, subtract sales of 400, and the ending position is 350 boxes: 50
    on hand plus 300 already inbound. If you count only receipts of 200, on-hand stock is 250 plus 200
    minus 400, or 50. Do not treat the inbound 300 as missing stock.
  s2_zh: >-
    期初二百五十箱，加上订货五百箱，减去销量四百箱，期末状况是三百五十箱：在手五十箱，加上已经在途的三百箱。如果只计算已经收到的两百箱，在手库存是二百五十加二百减四百，等于五十。不要把在途的三百箱当成缺失库存。
  s2_zh_hk: >-
    期初二百五十箱，加上訂貨五百箱，減去銷量四百箱，期末狀況係三百五十箱：在手五十箱，加上已經在途嘅三百箱。如果只計算已經收到嘅兩百箱，在手存貨係二百五十加二百減四百，等於五十。唔好把在途嘅三百箱當成缺失存貨。
  s3_en: >-
    The week-4 order is a real commitment for week 5. It is not a new weekly consumer-demand level of
    300, and it is not a reason to place a second 300-box order.
  s3_zh: 第四周的订单，是第五周的真实承诺。它不是每周三百箱的新顾客需求水平，也不能成为再下一张三百箱订单的理由。
  s3_zh_hk: 第四週嘅訂單，係第五週嘅真實承諾。佢唔係每週三百箱嘅新顧客需求水平，亦都不能夠成為再下一張三百箱訂單嘅理由。
  step3_en: >-
    End: 50 on hand, 300 inbound
  step3_zh: 期末：在手50，在途300
  step3_zh_hk: 期末：在手50，在途300
- id: meaning
  visual: steps
  layout: rows
  seconds: 24
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Visibility helps, but not every policy
  title_zh: 看得见有帮助，不是万能
  title_zh_hk: 睇得清楚有幫助，但唔係萬能
  step1_en: On-hand plus inbound explain the gap
  step1_zh: 在手加在途能解释差额
  step1_zh_hk: 在手加在途能解釋差額
  step2_en: Batching and a discount still remain
  step2_zh: 批量订货和折扣仍然在
  step2_zh_hk: 批量訂貨同折扣仍然在
  s1_en: >-
    A sales file can stop a planner from treating every order swing as a consumption shock. It does not,
    by itself, remove the two-week batching practice or the temporary wholesale discount that enlarged
    the week-4 order.
  s1_zh: 有了销售文件，计划人员可以避免把每一次订单波动，都当成消费冲击。但它本身，并不能取消隔周订货的做法，也不能取消放大第四周订单的短期批发折扣。
  s1_zh_hk: >-
    有咗銷售文件，計劃人員可以避免把每一次訂單波動，都當成消費衝擊。但它本身，並唔能夠取消隔週訂貨嘅做法，亦都唔能夠取消放大第四週訂單嘅短期批發折扣。
  s2_en: >-
    Those remaining causes are one reason sharing data alone would not remove the swings. A bullwhip pattern
    can appear even when consumer demand is fairly steady.
  s2_zh: 这些仍然存在的原因，说明只靠共享数据，并不能消除波动。即使顾客需求相当平稳，也可能出现牛鞭效应。
  s2_zh_hk: 呢啲仍然存在嘅原因，說明淨係靠共享數據，並唔能夠消除波動。即使顧客需求相當平穩，都可能出現牛鞭效應。
  s3_en: >-
    Routine B’s two hours are a real cost. They are spent on reconciliation, not on automatically changing
    contracts, prices or the agreed next-week delivery schedule.
  s3_zh: 方案B的两个小时是实在的成本。这笔时间用在对账上，不会自动改合同、改价格，也不会改已约定的下周交货安排。
  s3_zh_hk: 方案B嘅兩個鐘係實在嘅成本。呢筆時間用喺核對上，唔會自動改合約、改價格，亦都唔會改已約定嘅下週交貨安排。
  step3_en: Shared data does not rewrite incentives
  step3_zh: 共享数据改不了诱因
  step3_zh_hk: 共享數據改唔到誘因
- id: check
  visual: title_card
  seconds: 16
  kicker: Check
  kicker_en: Check
  kicker_zh: 检验
  kicker_zh_hk: 檢驗
  title_en: Orders are not the same as consumption
  title_zh: 订单不等于消费
  title_zh_hk: 訂單唔等於消費
  en: >-
    Before treating a large incoming order as a new demand level, reconcile sales, on-hand stock and inbound
    supply. A genuine large order can still be a batch or a discount, not a jump in weekly consumption.
  zh: 把一张大订单当成新的需求水平之前，先核对销量、在手库存和在途补货。一张真实的大订单，仍然可能只是合并订货或折扣采购，而不是每周消费量跳升。
  zh_hk: 把一張大訂單當成新嘅需求水平之前，先核對銷量、在手存貨同在途補貨。一張真實嘅大訂單，仍然可能只係合併訂貨或折扣採購，而唔係每週消費量跳升。
- id: takeaway
  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Read the pipeline before you react
  title_zh: 行动前先看清在途货物
  title_zh_hk: 行動前先睇清在途貨物
  q1_en: Sales stayed near 100; orders did not
  q1_zh: 销量接近100，订单不是
  q1_zh_hk: 銷量接近100，訂單唔係
  q2_en: Do not order 300 a second time
  q2_zh: 不要再订一次300箱
  q2_zh_hk: 唔好再訂一次300箱
  s1_en: >-
    Consumer sales were about 100 boxes a week. The 300-box order is a week-5 commitment sitting already
    in the pipeline, on top of 50 boxes on hand. It is not missing stock, and it is not a new weekly run-rate.
  s1_zh: 顾客销量大约每周一百箱。三百箱订单是已经在途、第五周要交的承诺，再加上在手的五十箱。它不是缺失库存，也不是新的每周需求水平。
  s1_zh_hk: 顧客銷量大約每週一百箱。三百箱訂單係已經在途、第五週要交嘅承諾，再加上在手嘅五十箱。佢唔係缺失存貨，亦都唔係新嘅每週需求水平。
  s2_en: >-
    The distributor, retailer, sales and orders are fictional classroom assumptions. Official scene art
    is a teaching illustration only.
  s2_zh: 这家分销商、零售商、销量和订单，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢間分銷商、零售商、銷量同訂單，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
