  en: >-
    On 16 January 2026, Hong Kong announced the formal rollout of its Port Community System. Seeing cargo
    move is not the same as knowing final customer demand. This distributor, and every figure, is fictional.
  zh: 二零二六年一月十六日，香港宣布正式推出港口社区系统。看得见货物移动，并不等于掌握最终顾客需求。课堂上的这家分销商，以及全部数字，都是虚构的。
  zh_hk: 二零二六年一月十六日，香港宣布正式推出港口社區系統。睇到貨物移動，並唔等於掌握最終顧客需求。課堂上呢間分銷商，同埋全部數字，都係虛構嘅。
