  s1_en: >-
    Before the inbound truck arrives, one customer validly cancels its entire 30-carton order and noon
    collection. No fee or replacement promise arises. The other three 30-carton loads remain confirmed.
    The distributor owns the 30 released cartons, but they have no assigned recipient or departure time.
  s1_zh: >-
    在到货车到达之前，一位客户按约定条款，取消了整票三十箱订单和中午提货。不产生费用，也没有替代订单或剩余交货承诺。另外三票三十箱仍然确认，发车时间不变。这三十箱归分销商所有，但没有指定收货人，也没有发车时间。
  s1_zh_hk: >-
    喺到貨車到達之前，一位客戶按約定條款，取消咗整票三十箱訂單同中午提貨。唔產生費用，亦都冇替代訂單或剩餘交貨承諾。另外三票三十箱仍然確認，開出時間不變。呢三十箱仍屬分銷商所有，但冇指定收貨人，亦都冇開出時間。
  s2_en: >-
    The inbound quantity remains 120 and cannot be reduced now. The 30 unassigned cartons can be stored
    safely under the seven-day quote while a new allocation is found. No sale within seven days is guaranteed.
  s2_zh: 即将到达的数量仍是一百二十箱，此刻不能减少。这三十箱没有去向的货物，可按七天报价安全存放，同时再寻找新的分配。七天内并不保证能够售出或发出。
  s2_zh_hk: >-
    即將到達嘅數量仍然係一百二十箱，此刻不能減少。呢三十箱沒有去向嘅貨物，可按七天報價安全存放，同時再尋找新嘅編配。七天內並唔保證能夠售出或發出。
  s3_en: >-
    The supervisor can split the receipt into 90 cross-dock cartons and 30 put-away cartons before moving
    either group. If any remaining appointment or check fails, those cartons also take the storage route.
    They must not block a staging lane indefinitely.
  s3_zh: >-
    主管可以在挪动任何一组货物之前，把到货拆成九十箱走越库、三十箱上架入库。如果剩余的出货预约或核验没有通过，受影响的纸箱也要走获准的存储路径，不能无限期占用暂存通道。
  s3_zh_hk: >-
    主管可以喺移動任何一組貨物之前，把到貨拆成九十箱採用越庫作業、三十箱上架存放。如果剩餘嘅出貨預約或核驗冇通過，受影響嘅紙箱也須走獲准嘅存放流程，唔能夠無限期佔用暫存通道。
