  s1_en: >-
    A distributor expects 120 identical sealed cartons of stationery at 8 a.m. tomorrow. Four confirmed
    customer loads each need 30 cartons and leave at noon. Checks can finish by 9 a.m., leaving three
    hours before departure. Both routes can meet the existing noon commitments.
  s1_zh: >-
    这家分销商预计明天上午八点，收到一百二十箱相同的密封文具纸箱。四票已确认的客户出货，各需三十箱，中午发车。核验可在九点前完成，离发车还有三个小时。两条路径都能满足现有的中午出货承诺。
  s1_zh_hk: >-
    呢間分銷商預計明日上午八時，收到一百二十箱相同嘅密封文具紙箱。四票已確認嘅客戶出貨，各需三十箱，中午開出。核驗可喺九時前完成，距離開出仲有三個鐘。兩條路徑都能夠滿足現有嘅中午出貨承諾。
  s2_en: >-
    Cross-docking sends eligible goods from receipt to a named outbound load without routine rack storage.
    The quote is 2 dollars per carton, plus a single 80-dollar coordination charge if any carton in this
    batch is cross-docked. Storing and later picking costs 5 dollars per carton, including up to seven
    days of holding.
  s2_zh: >-
    越库作业是指，符合条件的货物从收货直接转到已指定的出货，不必按常规上架存储。报价是每箱两港元，如果这批货有一箱走越库，还要加收一笔八十港元的协调费。上架再拣货是每箱五港元，已包括最多七天的存储和最终出货拣选。
  s2_zh_hk: >-
    越庫作業是指，符合條件嘅貨物由收貨直接轉到已指定嘅出貨，唔須按常規上架存放。報價係每箱兩港元，如果呢批貨有一箱採用越庫作業，仲要加收一筆八十港元嘅協調費。上架再揀貨係每箱五港元，已包括最多七天嘅存放同最終出貨揀選。
  s3_en: >-
    A split is allowed without another fixed charge. No route is booked yet. Receipt checks, safe vehicle
    separation and release authorisation still apply under both methods.
  s3_zh: 允许拆分，而且不会再收一笔固定费用。目前两条路径都還未预订、還未付费。无论走哪条路径，收货核验、安全分车和放行授权都不能少。
  s3_zh_hk: 允許拆分，而且唔會再收一筆固定費用。目前兩條路徑都還未預訂、還未付費。無論走邊條路徑，收貨核驗、安全分車同放行授權都不能少。
