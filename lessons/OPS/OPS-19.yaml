  title_en: How should the 120 cartons be split?
  title_zh: 这120箱该怎样拆分？
  title_zh_hk: 呢120箱該點樣拆分？
  en: >-
    How would you route the shipment after the cancellation? Calculate the revised handling cost, and
    explain what happens to the cartons with no outbound assignment. Pause and vote again.
  zh: >-
    取消发生后，你会怎样安排这批货的路径？请算出调整后的作业成本，并说明没有出货去向的箱子怎么处理，而不是把越库作业看成全有或全无。请暂停，再投一次票。
  zh_hk: >-
    取消發生之後，你會點樣安排呢批貨嘅路徑？請計出調整後嘅處理成本，並說明沒有出貨去向嘅紙箱會點樣處理，而唔好把越庫作業當成全有或全無。暫停，再投一次票。
- id: bridge
  visual: steps
  layout: rows
  seconds: 26
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Match inbound and outbound first
  title_zh: 先核对进出能否匹配
  title_zh_hk: 先配對進出貨，再計節省
  step1_en: >-
    All 120 stored: HK$600
  step1_zh: 120箱全部上架：600港元
  step1_zh_hk: 120箱全部上架：600港元
  step2_en: >-
    All 120 cross-docked: HK$320
  step2_zh: 120箱全部越库：320港元
  step2_zh_hk: 120箱全部越庫：320港元
  s1_en: >-
    Match the flows before counting a saving. Cross-docking all 120 would cost 2 dollars times 120, plus
    the 80-dollar charge, or 320 dollars. Storing all 120 would cost 5 dollars times 120, or 600 dollars.
    The difference is 280 dollars, but that comparison assumed every carton had a same-day outbound load.
  s1_zh: >-
    先核对进出货能否匹配，再算节省。一百二十箱全部走越库，费用是两港元乘以一百二十，再加上八十港元，等于三百二十港元。全部上架是五港元乘以一百二十，等于六百港元。相差二百八十港元，但这样比，前提是每箱都有当日确认的出货。
  s1_zh_hk: >-
    先配對進出貨，再計算節省。一百二十箱全部採用越庫作業，費用係兩港元乘以一百二十，再加上八十港元，等於三百二十港元。全部上架係五港元乘以一百二十，等於六百港元。相差二百八十港元，但噉樣比，前提係每箱都有當日確認嘅出貨。
  s2_en: >-
    After the cancellation, 90 cartons can still be cross-docked: 2 times 90 plus 80, or 260 dollars.
    The 30 unassigned cartons are stored at 5 dollars each, or 150 dollars. The combined handling cost
    is 410 dollars, which is 190 dollars below storing all 120.
  s2_zh: >-
    取消之后，九十箱仍可走越库：两乘以九十再加八十，等于二百六十港元。三十箱没有去向的货，按每箱五港元存放，等于一百五十港元。合计作业成本是四百一十港元，比一百二十箱全部上架低一百九十港元。
  s2_zh_hk: >-
    取消之後，九十箱仍可採用越庫作業：兩乘以九十再加八十，等於二百六十港元。三十箱沒有去向嘅貨，按每箱五港元存放，等於一百五十港元。合計處理成本係四百一十港元，比一百二十箱全部上架低一百九十港元。
  s3_en: >-
    The 80-dollar coordination charge is paid once if any carton is cross-docked. You cannot cross-dock
    all 120 when 30 cartons have no destination.
  s3_zh: 只要这批货有一箱走越库，八十港元的协调费只收一次。三十箱没有去向时，不能把一百二十箱全部走越库。
  s3_zh_hk: 只要呢批貨有一箱採用越庫作業，八十港元嘅協調費只收一次。三十箱沒有去向時，唔能夠把一百二十箱全部做越庫作業。
  step3_en: >-
    After cancel, 90 plus 30: HK$410
  step3_zh: 取消后90加30：410港元
  step3_zh_hk: 取消後90加30：410港元
- id: meaning
  visual: steps
  layout: rows
  seconds: 22
  kicker: Debrief
  kicker_en: Debrief
  kicker_zh: 讲评
  kicker_zh_hk: 講評
  title_en: Storage can be a planned path
  title_zh: 入库可以是预先安排的路径
  title_zh_hk: 存放可以係預先安排嘅路徑
  step1_en: Reclassify only the exception
  step1_zh: 只调整异常货物的去向
  step1_zh_hk: 只重新分類例外個案
  step2_en: No destination means no cross-dock
  step2_zh: 没有去向就不能越库
  step2_zh_hk: 沒有去向就不能越庫
  s1_en: >-
    Only the exception needs to be reclassified. The ninety cartons with confirmed noon loads can still
    go straight through, provided their checks and appointments still pass.
  s1_zh: 只调整异常货物的去向。九十箱仍有确认中午出货的纸箱，只要核验和预约仍然通过，就可以继续直接发走。
  s1_zh_hk: 只重新分類例外個案。九十箱仍有確認中午出貨嘅紙箱，只要核驗同預約仍然通過，就可以繼續直接出貨。
  s2_en: >-
    Putting the thirty unassigned cartons into reserved racks is a planned path, not a failure of cross-docking.
    Cross-docking is not an all-or-nothing label for the whole truck.
  s2_zh: 把三十箱没有去向的货放上预留货架，是预先安排的路线，不是越库作业失败。不要把越库作业看成整车非此即彼的标签。
  s2_zh_hk: 把三十箱沒有去向嘅貨放到預留貨架，係預先安排嘅路徑，唔係越庫作業失敗。唔好把越庫作業當成整車非此即彼嘅標籤。
  s3_en: >-
    If a later appointment or check fails, those cartons also take the authorised storage route. They
    must not block a staging lane while waiting indefinitely.
  s3_zh: 如果后来的预约或核验没有通过，这些纸箱也要走获准的存储路径，不能无限期占用暂存通道。
  s3_zh_hk: 如果後來嘅預約或核驗冇通過，呢啲紙箱也須走獲准嘅存放流程，唔能夠無限期佔用暫存通道。
  step3_en: Putting goods away is not a failure
  step3_zh: 上架入库不是失败
  step3_zh_hk: 上架存放唔係失敗
