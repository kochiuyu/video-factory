  en: >-
    A cheaper cross-dock quote applies only to cartons with a named, confirmed outbound load. After a
    cancellation, split the receipt, keep the eligible cartons moving, and store the rest under the quoted
    holding path.
  zh: 更便宜的越库报价，只适用于已有指定、已确认出货的纸箱。取消发生后，要把到货拆开：符合条件的继续流转，其余按报价走存储路径。
  zh_hk: 更平嘅越庫報價，只適用於已有指定、已確認出貨嘅紙箱。取消發生之後，要把到貨拆開：符合條件嘅繼續流轉，其餘按報價走存放路徑。
