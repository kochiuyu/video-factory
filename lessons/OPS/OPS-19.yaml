  en: >-
    Would you plan to cross-dock the 120 cartons or put them into storage? Compare the quoted costs, then
    specify the checks that must still pass before goods can bypass the racks. Pause and vote.
  zh: 你会计划把这一百二十箱走越库作业，还是先上架？请比较报价，并说明货物不经过货架之前，还必须通过哪些核验。请暂停，投个票。
  zh_hk: 你會計劃把呢一百二十箱採用越庫作業，定係先上架？請比較報價，並說明貨物唔經貨架之前，仲必須通過邊啲核驗。暫停，投個票。
