  en: >-
    On 14 November 2023, DHL announced the opening of its expanded Central Asia Hub in Hong Kong. A hub
    can connect incoming and outgoing flows, but only eligible goods can skip the shelf. This distributor,
    and every figure, is fictional.
  zh: >-
    二零二三年十一月十四日，DHL宣布其位于香港的Central Asia Hub扩建启用。物流枢纽可以衔接进出货流，但只有符合条件的货物，才能不先上架。课堂上的这家分销商，以及全部数字，都是虚构的。
  zh_hk: >-
    二零二三年十一月十四日，DHL宣布其位於香港嘅Central Asia Hub擴建啟用。物流樞紐可以銜接進出貨流，但只有符合條件嘅貨物，先可以唔使先上架。課堂上呢間分銷商，同埋全部數字，都係虛構嘅。
