  visual: takeaway
  seconds: 20
  kicker: Takeaway
  kicker_en: Takeaway
  kicker_zh: 要点
  kicker_zh_hk: 要點
  title_en: Spend the count budget where risk is
  title_zh: 把盘点预算用在风险上
  title_zh_hk: 把盤點預算用喺風險上
  q1_en: Connectors had more supported corrections
  q1_zh: 连接器获支持的更正更多
  q1_zh_hk: 連接器獲支持嘅更正更多
  q2_en: A recount can confirm 30, or support minus 4
  q2_zh: 复盘可确认30，或支持少4件
  q2_zh_hk: 覆點可確認30，或支持少4件
  s1_en: >-
    Both schedules use 120 counts and ten hours. If a priority group is chosen, connector history is a
    stronger reason than unit value alone. A missed tray left the record at 30; two agreeing counts of
    36 supported a four-unit correction.
  s1_zh: >-
    两种安排都是一百二十次、十小时。如果要选优先组，连接器的历史，比只看单位价值更有理由。漏数托盘后，记录仍是三十；两次一致的三十六，支持更正四件。
  s1_zh_hk: >-
    兩種安排都係一百二十次、十小時。如果要選優先組，連接器嘅歷史，比只睇單位價值更有理由。漏數托盤之後，記錄仍然係三十；兩次一致嘅三十六，支持更正四件。
  s2_en: >-
    The store, counts, histories and recounts are fictional classroom assumptions. Official scene art
    is a teaching illustration only.
  s2_zh: 这家零件仓、盘点、历史和复盘，都是虚构的课堂假设。官方场景图只是教学插图。
  s2_zh_hk: 呢間零件倉、盤點、歷史同覆點，都係虛構嘅課堂假設。官方場景圖只係教學插圖。
  s3_en: >-
    The local announcement supplies context, not evidence for any classroom count.
  s3_zh: 本地公告只提供背景，不能当作课堂上这些盘点结果的证据。
  s3_zh_hk: 本地公告只提供背景，唔可以當作課堂上呢啲盤點結果嘅證據。
duration_target_s: 190
