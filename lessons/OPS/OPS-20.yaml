  s1_en: >-
    A spare-parts store is planning its next twelve-week cycle-count schedule. Cycle counting means checking
    selected item records repeatedly during operations, not only at a year-end event. There are 60 item
    types: 20 high-value motors, 20 inexpensive connectors and 20 inexpensive brackets. Each type occupies
    one identified bin.
  s1_zh: >-
    这家零件仓正在安排未来十二周的循环盘点计划。循环盘点是在日常作业中，反复核对选定品项的记录，而不是只在年终全库盘点一次。共有六十个品项：二十种高价值电机、二十种廉价连接器，以及二十种廉价支架。每个品项占一个已标识的货位。
  s1_zh_hk: >-
    呢間零件倉而家安排未來十二個星期嘅循環盤點計劃。循環盤點係喺日常作業中，反覆核對選定物料嘅記錄，而唔係只喺年終一次過盤點整個貨倉。合共六十種物料：二十種高價值摩打、二十種廉價連接器，以及二十種廉價支架。每種物料佔一個已標識嘅貨位。
  s2_en: >-
    Each scheduled count takes five paid minutes. The routine budget is ten hours, or 120 counts. Schedule
    A counts every item twice, six weeks apart. Schedule B counts one chosen 20-item group four times,
    three weeks apart, and each of the other 40 items once. Both cover every item.
  s2_zh: >-
    每次按计划盘点，需要五分钟有薪工时。常规盘点的工时预算是十小时，也就是一百二十次。方案A对每个品项盘点两次，间隔六周。方案B对选定的二十个优先品项盘点四次，间隔三周，其余四十个品项各盘一次。两种方案都覆盖全部品项。
  s2_zh_hk: >-
    每次按計劃進行嘅盤點，需要五分鐘有薪工時。例行盤點嘅工時預算係十小時，也就是一百二十次。方案A對每種物料盤點兩次，間隔六個星期。方案B對選定嘅二十種優先物料盤點四次，間隔三個星期，其餘四十種物料各盤一次。兩種方案都覆蓋全部物料。
  s3_en: >-
    The manager first proposes motors as B’s priority because their unit values are highest. No comparable
    transaction or verified discrepancy history has yet been presented. An exception team handles urgent
    recounts outside these 120 routine counts. No record is changed merely to match a first count.
  s3_zh: >-
    经理起初建议优先盘点电机，因为它们的单位价值最高。目前还没有提交可比较的交易记录，或已经核实的差异历史。紧急复盘由独立预算的例外小组处理，不占用这一百二十次常规盘点。不能只因为第一次清点不同，就改记录。
  s3_zh_hk: >-
    經理起初建議優先盤點摩打，因為佢哋嘅單位價值最高。目前仲未提交可比較嘅交易記錄，或已經核實嘅差異歷史。緊急覆點由獨立預算嘅例外小組處理，唔佔用呢一百二十次例行盤點。唔能夠只因為第一次清點唔同，就改記錄。
- id: pause1
  visual: title_card
  seconds: 16
  kicker: Decision
  kicker_en: Decision
  kicker_zh: 决策
  kicker_zh_hk: 決定
  title_en: Count all twice, or focus a priority group?
  title_zh: 全部盘两次，还是聚焦一组？
  title_zh_hk: 全部盤兩次，定聚焦一組？
  en: >-
    Would you start with uniform repeated counts, or focus more counts on a priority group? Check the
    effort budget, and explain what evidence should determine priority beyond unit value. Pause and vote.
  zh: >-
    你会先采用均匀的重复盘点，还是把更多次数集中到一组优先品项？请核对工时预算，并说明除了单位价值，还应用什么证据来确定优先对象。请暂停，投个票。
  zh_hk: 你會先採用同頻嘅重複盤點，定係把更多次數集中到一組優先物料？請核對工時預算，並說明除咗單位價值，仲應用咩證據嚟釐定優先對象。暫停，投個票。
