  title_en: History and two recount examples
  title_zh: 历史记录和两次复盘
  title_zh_hk: 歷史記錄同兩次覆點
  row1_en: Motors, 20 items
  row1_zh: 电机，20个品项
  row1_zh_hk: 摩打，20種物料
  row2_en: Connectors, 20 items
