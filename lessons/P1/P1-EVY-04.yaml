# P1-EVY-04. Mirrors MathQuiz path ruler / lesson readcm, "Read centimetres".
# Start at zero. Count the spaces, not the marks. The drawing is not a real ruler.
# https://github.com/kochiuyu/mathquiz learn-ruler.js (readcm).
# Speech is for age 6: one short idea per sentence.
id: P1-EVY-04
title_en: Read centimetres
title_zh: 读厘米
title_zh_hk: 讀厘米
duration_target_s: 55
clock: own
beats:
