  title_en: Make pairs
  title_zh: 两个配成一对
  title_zh_hk: 兩個配成一對
  s1_en: Can every counter find a partner?
  s1_zh: 每个圆片都能找到伙伴吗？
  s1_zh_hk: 每個圓片都搵到伙伴嗎？

- id: eight
  visual: animated
  scene: pair_counters
  n: 8
  seconds: 14
  s1_en: Eight counters. Put them in pairs.
  s1_zh: 八个圆片。两个配成一对。
  s1_zh_hk: 八個圓片。兩個配成一對。
  s2_en: One. Two. Three. Four.
  s2_zh: 一，二，三，四。
  s2_zh_hk: 一，二，三，四。
  s3_en: Four pairs. None is left alone. Eight is even.
  s3_zh: 四对。没有单独留下的。八是双数。
  s3_zh_hk: 四對。冇單獨留低嘅。八係雙數。

- id: nine
  visual: animated
  scene: pair_counters
  n: 9
  seconds: 14
  s1_en: Nine counters. Pair them the same way.
  s1_zh: 九个圆片。同样两个配成一对。
  s1_zh_hk: 九個圓片。同樣兩個配成一對。
  s2_en: One. Two. Three. Four.
  s2_zh: 一，二，三，四。
  s2_zh_hk: 一，二，三，四。
  s3_en: Four pairs, and one left alone. A pair holds two, not three. Nine is odd.
  s3_zh: 四对，单独剩一个。一对只放两个。九是单数。
  s3_zh_hk: 四對，單獨剩一個。一對只放兩個。九係單數。

- id: nineteen
  visual: animated
  scene: pair_counters
  n: 19
  seconds: 16
  s1_en: Nineteen counters. Pair them too.
  s1_zh: 十九个圆片。也是两个配成一对。
  s1_zh_hk: 十九個圓片。都係兩個配成一對。
  s2_en: One, two, three, four, five, six, seven, eight, nine.
  s2_zh: 一，二，三，四，五，六，七，八，九。
  s2_zh_hk: 一，二，三，四，五，六，七，八，九。
  s3_en: Nine pairs, and one left alone. Nineteen is odd.
  s3_zh: 九对，单独剩一个。十九是单数。
  s3_zh_hk: 九對，單獨剩一個。十九係單數。

- id: takeaway
  visual: animated
