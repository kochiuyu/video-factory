# P1-NUM-05. Mirrors MathQuiz path numberstart / lesson pair20, "Make pairs".
# Eight counters make four pairs, and none is left (even). Nine makes four pairs and one left (odd).
# Nineteen makes nine pairs and one left. A pair holds two, not three.
# https://github.com/kochiuyu/mathquiz learn-data.js (path numberstart, lesson pair20).
# Speech is for age 6: one short idea per sentence. Questions are answered on screen.
id: P1-NUM-05
title_en: Make pairs
title_zh: 两个配成一对
title_zh_hk: 兩個配成一對
duration_target_s: 66
clock: own
