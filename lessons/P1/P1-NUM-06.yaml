  title_en: Parts of seven?
  title_zh: 七的两部分？
  title_zh_hk: 七嘅兩部分？
  s1_en: Three and four make seven.
  s1_zh: 三和四合成七。
  s1_zh_hk: 三同四合成七。
  s2_en: Five and two make seven too.
  s2_zh: 五和二也合成七。
  s2_zh_hk: 五同二都合成七。
  s3_en: Seven stays seven.
  s3_zh: 七还是七。
  s3_zh_hk: 七仲係七。
  s4_en: Four and eight make twelve.
  s4_zh: 四和八合成十二。
  s4_zh_hk: 四同八合成十二。
