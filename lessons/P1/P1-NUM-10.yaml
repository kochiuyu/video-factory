# P1-NUM-10. Mirrors MathQuiz path subtract / lesson bonds, "Two parts, one whole".
# Three and four make seven. The same seven is also five and two.
# Twelve is five and seven: 12 − 5 = 7. The minus sign is U+2212.
# https://github.com/kochiuyu/mathquiz learn-subtract.js (path subtract, lesson bonds).
# Speech is for age 6: one short idea per sentence. The heading is answered on screen.
id: P1-NUM-10
title_en: Two parts, one whole
title_zh: 两部分，一个整体
title_zh_hk: 兩部分，一個整體
duration_target_s: 64
clock: own
