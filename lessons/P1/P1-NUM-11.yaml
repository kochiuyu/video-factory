# P1-NUM-11. Mirrors MathQuiz path subtract / lesson takeaway,
# "Take away and count what stays".
# Eight take away three leaves five. Take all six away: 6 − 6 = 0.
# Take zero away from seven: 7 − 0 = 7. The minus sign is U+2212.
# https://github.com/kochiuyu/mathquiz learn-subtract.js (path subtract, lesson takeaway).
# Speech is for age 6: one short idea per sentence. The heading is answered on screen.
