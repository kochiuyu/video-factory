# P1-NUM-12. Mirrors MathQuiz path subtract / lesson partsback,
# "Put the parts back together".
# Five is three and two. Take two away, then put the two back: 3 + 2 = 5.
# Ten is four and six. Take either part away and the other stays.
# Nine take away four leaves five. Put the four back: 5 + 4 = 9.
# The minus sign is U+2212.
# https://github.com/kochiuyu/mathquiz learn-subtract.js (path subtract, lesson partsback).
# Speech is for age 6: one short idea per sentence. The heading is answered on screen.
