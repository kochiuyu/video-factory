  s1_en: Eight tokens, and one star. We will find its place, and we will count how many.
  s1_zh: 八个图案，其中有一颗星星。我们找出它的位置，也数一数有多少个。
  s1_zh_hk: 八個圖案，其中有一粒星星。我哋搵出佢嘅位置，亦都數一數有幾多個。

