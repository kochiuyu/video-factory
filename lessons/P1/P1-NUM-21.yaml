# P1-NUM-21. Mirrors MathQuiz path relations / lesson difference,
# "How many more or fewer?".
# Eight and five leave three with no partner. Fewer names that same three.
# Six and six leave no one over. Comparing does not take the counters away.
# https://github.com/kochiuyu/mathquiz learn-relations.js (path relations, lesson difference).
# Speech is for age 6: one short idea per sentence. The heading is answered on screen.
id: P1-NUM-21
title_en: How many more?
title_zh: 多多少？少多少？
title_zh_hk: 多幾多？少幾多呀？
duration_target_s: 58
clock: own
