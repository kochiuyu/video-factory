  scene: row_match
  part: hold
  a: 8
  b: 5
  seconds: 7
  s1_en: Three have no partner. Eight has three more.
  s1_zh: 三个没有对上。八个比五个多三个。
  s1_zh_hk: 三個冇對上。八個比五個多三個。

