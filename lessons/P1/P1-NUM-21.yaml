  visual: animated
  scene: lesson_hook
  motif: counters
  shown: true
  seconds: 8
  title_en: How many more?
  title_zh: 多多少？少多少？
  title_zh_hk: 多幾多？少幾多呀？
  s1_en: Two rows. We will match them.
  s1_zh: 两行圆片。我们一个对一个。
  s1_zh_hk: 兩行圓片。我哋一個對一個。

