# P1-NUM-23. Mirrors MathQuiz path calculate / lesson addthree,
# "Add three numbers".
# 12 + 4 + 3 is two steps: 16, then 19.
# 6 and 4 make ten, then 24 + 10 = 34.
# 18 + 7 + 5 has twenty ones, which become two tens, so the total is 30.
# https://github.com/kochiuyu/mathquiz learn-calculate.js (path calculate, lesson addthree).
# Speech is for age 6: one short idea per sentence. The heading is answered on screen.
