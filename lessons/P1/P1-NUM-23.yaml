  s1_en: Twelve, four, and three. Use each number once.
  s1_zh: 十二、四和三。每个数只加一次。
  s1_zh_hk: 十二、四同三。每個數只加一次。
  s2_en: Twelve and four make sixteen.
  s2_zh: 十二加四，是十六。
