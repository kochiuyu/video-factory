  s2_en: The ones make twenty. Twenty ones make two tens.
  s2_zh: 个位有二十个一。二十个一换成两个十。
  s2_zh_hk: 個位有二十個一。二十個一換成兩個十。
  s3_en: One ten and two new tens make three tens. Thirty.
  s3_zh: 一个十加两个新的十，是三个十。三十。
  s3_zh_hk: 一個十加兩個新嘅十，係三個十。三十。

