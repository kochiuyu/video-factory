  seconds: 12
  title_en: A ball is a sphere
  title_zh: 皮球是球体
  title_zh_hk: 波係球體
  s1_en: A ball is a sphere.
  s1_zh: 皮球是球体。
  s1_zh_hk: 波係球體。
  s2_en: Turn it.
  s2_zh: 转一转。
  s2_zh_hk: 轉一轉。
  s3_en: Still a sphere.
  s3_zh: 还是球体。
  s3_zh_hk: 仲係球體。

