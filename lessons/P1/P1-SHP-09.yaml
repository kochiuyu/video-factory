# P1-SHP-09. Mirrors MathQuiz path positions / lesson frontbetween, "Front and between".
# The arrow is the child, looking along the floor. Nearer is in front.
# Both objects stay on the floor. In a row of three, the ball is between.
# https://github.com/kochiuyu/mathquiz learn-positions.js (frontbetween).
# Speech is for age 6: one short idea per sentence.
