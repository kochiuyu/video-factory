course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Seeing the business through data
title_zh: 透视商业数据的四维全貌
title_zh_hk: 透視商業數據嘅四維全貌
objective_en: 'Frame a Monday coffee file with four questions: center, spread, shape, and association, and refuse to answer all four with one row.'
objective_zh: 用四个问题框定一份周一咖啡文件：中心、离散、形态和关联，并拒绝用一行回答全部问题。
objective_zh_hk: 用四個問題框定一份星期一咖啡檔案：中心、離散、形態同關聯，並拒絕用一行回答全部問題。
