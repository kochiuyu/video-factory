  break: last
  labels: A;B;C
  span: ends
  span_en: 4,200 − 310 = 3,890 cups
  span_zh: 4,200 − 310 = 3,890 杯
  span_zh_hk: 4,200 − 310 = 3,890 杯
  footer_en: 'One far shop stretches the line'
  footer_zh: 一家很远的店把线拉长
  footer_zh_hk: 一間好遠嘅店將線拉長
  s1_en: >-
    Put the three cup counts on one line as written: 310, 420, and 4,200.
    Already you can see that the shops do not sit in a tight cluster.
  s1_zh: >-
    先把三个杯数按原样排成一行：310、420和4,200。
    一眼就能看出，这三家店并不是挤在一起。
  s1_zh_hk: >-
    先將三個杯數按原樣排成一行：310、420同4,200。
    一眼就睇得出，呢三間店唔係㩒埋一齊。
  s2_en: >-
    Order them from low to high. Shop A, Shop B, then Shop C after a break.
    Center asks where a typical shop sits. Spread asks how wide the line runs.
  s2_zh: >-
    再从低到高排好。A店、B店，然后隔开一段才是C店。
    中心问典型店落在哪里。离散问这条线有多宽。
  s2_zh_hk: >-
    再由低到高排好。A店、B店，然後隔開一段先至係C店。
    中心問典型店落喺邊度。離散問呢條線有幾闊。
  s3_en: >-
    Shape asks which side is long. Here the high end stretches far past the other two.
    End to end is 4,200 minus 310, which is 3,890 cups. One far shop dominates that width.
  s3_zh: >-
    形态问哪一边更长。这里的高端远远超过另外两家。
    从端到端是4,200减310，等于3,890杯。一家很远的店就主导了这条宽度。
  s3_zh_hk: >-
    形態問邊一邊更長。呢度嘅高端遠遠超過另外兩間。
    由端到端係4,200減310，等於3,890杯。一間好遠嘅店就主導咗呢條闊度。
- id: trap
  visual: two_column
  seconds: 62
  kicker: The Trap
  kicker_en: The Trap
  kicker_zh: 陷阱
  kicker_zh_hk: 陷阱
  title_en: One number is not four answers
  title_zh: 一个数不是四个答案
  title_zh_hk: 一個數唔係四個答案
  left_en: One row or one total
  left_zh: 一行或一个总数
  left_zh_hk: 一行或者一個總數
  right_en: Four named dials
  right_zh: 四个点名的刻度
  right_zh_hk: 四個點名嘅刻度
  s1_en: >-
    A total uses every cup. A typical-shop summary ignores the far shop in a different way.
    Both can be useful, but they answer different questions.
  s1_zh: >-
    总数用上每一杯。一家典型店的摘要，会以另一种方式忽略很远的那家。
    两者都可能有用，但它们回答的是不同的问题。
  s1_zh_hk: >-
    總數用上每一杯。一間典型店嘅摘要，會以另一種方式忽略好遠嗰間。
    兩者都可能有用，但佢哋答嘅係唔同嘅問題。
  s2_en: >-
    Spread and shape can disagree with a calm center.
    The three shops can look "fine" on one dial while another dial is already shouting.
  s2_zh: >-
    离散和形态，可以和看起来平稳的中心唱反调。
    三个店在一个刻度上看起来「还好」，另一个刻度可能已经在大声提醒。
  s2_zh_hk: >-
    離散同形態，可以同睇落平穩嘅中心唱反調。
    三間店喺一個刻度上睇落「仲好」，另一個刻度可能已經大聲提醒。
  s3_en: >-
    So do not answer all four dials with one Monday row or one number.
    Name the dial, the shops included, and the unit before you use a summary.
  s3_zh: >-
    所以不要用周一的一行或一个数，回答全部四个刻度。
    使用摘要之前，先写明刻度、纳入的店和单位。
  s3_zh_hk: >-
    所以唔好用星期一嘅一行或者一個數，回答全部四個刻度。
    使用摘要之前，先寫明刻度、納入嘅店同單位。
- id: assoc
  visual: two_column
  seconds: 56
  kicker: Second Measure
  kicker_en: Second Measure
  kicker_zh: 第二个指标
  kicker_zh_hk: 第二個指標
  title_en: Association needs a pair
  title_zh: 关联需要一对指标
  title_zh_hk: 關聯需要一對指標
  left_en: Cups alone
  left_zh: 只有杯数
  left_zh_hk: 淨係杯數
  right_en: Cups with rent
  right_zh: 杯数配上租金
  right_zh_hk: 杯數配上租金
  s1_en: >-
    Center, spread, and shape can speak from one column of cups.
    Association cannot. It asks whether two measures move together.
  s1_zh: >-
    中心、离散和形态，可以靠一列杯数发言。
    关联不行。它问的是两个指标会不会一起动。
  s1_zh_hk: >-
    中心、離散同形態，可以靠一列杯數發言。
    關聯唔得。佢問嘅係兩個指標會唔會一齊郁。
  s2_en: >-
    Add a second measure, such as monthly rent beside each shop's cups.
    Only then can you ask whether higher rent shops also sell more cups.
  s2_zh: >-
    给每家店的杯数旁边，再加上第二个指标，例如月租金。
    那时才能问：租金更高的店，是不是也卖更多杯。
  s2_zh_hk: >-
    畀每間店嘅杯數旁邊，再加第二個指標，例如月租金。
    嗰陣先可以問：租金更高嘅店，係咪都賣更多杯。
  s3_en: >-
    Even then, moving together is not the same as causing.
    Association names a pattern worth checking; it does not finish the business story by itself.
  s3_zh: >-
    即便如此，一起动也不等于谁导致谁。
    关联只是标出值得核对的模式；它本身讲不完整个业务故事。
  s3_zh_hk: >-
    就算係咁，一齊郁亦唔等於邊個導致邊個。
    關聯淨係標出值得核對嘅模式；佢本身講唔完成個業務故事。
- id: limit
  visual: two_column
  seconds: 60
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 边界
  kicker_zh_hk: 邊界
  title_en: What the dials can and cannot do
  title_zh: 这些刻度能做什么，不能做什么
  title_zh_hk: 呢啲刻度做到咩，做唔到咩
  left_en: Condenses the file
  left_zh: 把文件收短
  left_zh_hk: 將檔案收短
  right_en: Not a full plan
  right_zh: 不是完整计划
  right_zh_hk: 唔係完整計劃
  s1_en: >-
    Descriptive statistics helps you see typical level, width, long side, and paired movement.
    Those four dials cut through raw noise so a manager can start a decision.
  s1_zh: >-
    描述性统计帮你看清典型水平、宽度、长边，以及成对的一起动。
    这四个刻度拨开原始噪音，让经理可以开始做决定。
  s1_zh_hk: >-
    描述性統計幫你睇清典型水平、闊度、長邊，以及成對嘅一齊郁。
    呢四個刻度撥開原始噪音，等經理可以開始做決定。
  s2_en: >-
    They do not by themselves set staffing, inventory, or prices.
    A later decision still needs the comparison group, the period, the unit, and the cost of being wrong.
  s2_zh: >-
    它们本身不能规定人手、库存或价格。
    之后的决策仍然需要比较总体、期间、单位，以及算错的代价。
  s2_zh_hk: >-
    佢哋本身唔可以規定人手、庫存或者價錢。
    之後嘅決策仍然需要比較總體、期間、單位，以及計錯嘅代價。
  s3_en: >-
    Use them as a compass on the file you have, not as a promise about tomorrow.
    Name the dial before you trust the number.
  s3_zh: >-
    把它们当作眼前这份文件的罗盘，而不是对明天的承诺。
    相信数字之前，先点名刻度。
  s3_zh_hk: >-
    將佢哋當作眼前呢份檔案嘅羅盤，而唔係對聽日嘅承諾。
    相信數字之前，先點名刻度。
- id: answer
  visual: takeaway
  seconds: 62
  kicker: The Rule
  kicker_en: The Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Ask four dials, then summarize
  title_zh: 先问四个刻度，再做摘要
  title_zh_hk: 先問四個刻度，再做摘要
  q1_en: What does descriptive statistics do?
  q1_zh: 描述性统计做什么？
  q1_zh_hk: 描述性統計做咩？
  q2_en: How do you read one Monday file?
  q2_zh: 怎样读一份周一文件？
  q2_zh_hk: 點樣讀一份星期一檔案？
  s1_en: >-
    Descriptive statistics turns raw shop rows into a few readable summaries.
    On this Monday file, start with center, spread, shape, and association.
  s1_zh: >-
    描述性统计把原始门店行，收成几个读得懂的摘要。
    面对这份周一文件，先从中心、离散、形态和关联问起。
  s1_zh_hk: >-
    描述性統計將原始門店行，收成幾個讀得明嘅摘要。
    面對呢份星期一檔案，先由中心、離散、形態同關聯問起。
  s2_en: >-
    Pair center with spread before you act. Check whether one side is long.
    Bring in a second measure before you talk about association.
  s2_zh: >-
    行动前把中心和离散配在一起。再看是不是有一边特别长。
    谈关联之前，先加上第二个指标。
  s2_zh_hk: >-
    行動前將中心同離散配埋一齊。再睇係咪有一邊特別長。
    傾關聯之前，先加上第二個指標。
  s3_en: >-
    The operating rule: name the dial, the shops, and the unit before you use a summary.
    Do not treat one Monday row as the whole chain.
  s3_zh: >-
    操作规则：使用摘要之前，写明刻度、店铺和单位。
    不要把周一的一行当成整条连锁。
  s3_zh_hk: >-
    操作規則：使用摘要之前，寫明刻度、店舖同單位。
    唔好將星期一嘅一行當成成條連鎖。
