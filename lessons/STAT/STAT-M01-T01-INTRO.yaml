id: STAT-M01-T01-INTRO
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 524
title_en: What is descriptive statistics?
title_zh: 什么是描述性统计？
title_zh_hk: 咩係描述性統計？
objective_en: 'Frame a Monday coffee file with four questions: center, spread, shape, and association, and refuse to answer all four with one row or one number.'
objective_zh: 用四个问题框定一份周一咖啡文件：中心、离散、形态和关联，并拒绝用一行或一个数回答全部问题。
objective_zh_hk: 用四個問題框定一份星期一咖啡檔案：中心、離散、形態同關聯，並拒絕用一行或者一個數回答全部問題。
