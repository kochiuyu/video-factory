quiz:
- id: Q1
  type: multiple_choice
  question_en: Why is a raw, unorganized spreadsheet of store transactions dangerous for an executive?
  question_zh: 为什么一份未经汇总、杂乱无章的门店交易明细流水账对管理层极其危险？
  question_zh_hk: 點解一份未經匯總、亂七八糟嘅門店交易明細流水賬對管理層極其危險？
  options_en:
  - 'A: It floods managers with raw noise and hides the real business patterns.'
  - 'B: Raw rows already answer staffing and inventory without any summary.'
  - 'C: Summaries always hide the busy shop, so raw rows are safer.'
  - 'D: You only need the biggest row; the rest do not matter.'
  options_zh:
  - 'A: 它用原始噪音淹没管理者，并掩盖真实的业务规律。'
  - 'B: 原始行本身已经能回答人手和库存问题，根本不需要任何摘要。'
  - 'C: 摘要总会把忙碌门店藏起来，所以原始行更安全。'
  - 'D: 只要看最大那一行就够了，其余都不重要。'
  options_zh_hk:
  - 'A: 佢用原始噪音淹沒管理者，並掩蓋真實嘅業務規律。'
  - 'B: 原始行本身已經可以回答人手同庫存問題，根本唔使任何摘要。'
  - 'C: 摘要總會將忙碌門店藏起嚟，所以原始行更安全。'
  - 'D: 只要睇最大嗰一行就夠，其餘都唔重要。'
  answer: A
  explanation_en: 'Raw rows bury the pattern in noise. They do not already answer staffing or inventory, summaries do not always hide the busy shop, and the biggest row alone is not enough. The danger is acting on unsummarized noise.'
  explanation_zh: '原始行把规律埋在噪音里。它们本身回答不了人手或库存，摘要也不会总是藏起忙碌门店，只看最大一行也不够。危险在于凭未汇总的噪音行动。'
  explanation_zh_hk: '原始行將規律埋喺噪音入面。佢哋本身答唔到人手或者庫存，摘要亦唔會總係藏起忙碌門店，只睇最大一行都唔夠。危險在於憑未匯總嘅噪音行動。'
- id: Q2
  type: multiple_choice
  question_en: A manager has one Monday column of cup counts for several shops. Which four questions match the dials in this short?
  question_zh: 经理手里有一列星期一的多家门店杯数。哪四个问题对应本短片里的刻度？
  question_zh_hk: 經理手上有一欄星期一嘅多間門店杯數。邊四個問題對應呢條短片入面嘅刻度？
  options_en:
  - 'A: Center, Spread, Shape, and Association.'
  - 'B: Mean, median, mode, and range.'
  - 'C: Cost, price, quantity, and profit.'
  - 'D: Sample size, confidence level, p-value, and power.'
  options_zh:
  - 'A: 中心、离散、形态与关联。'
  - 'B: 平均数、中位数、众数与极差。'
  - 'C: 成本、价格、数量与利润。'
  - 'D: 样本量、置信水平、p值与功效。'
  options_zh_hk:
  - 'A: 中心、離散、形態同關聯。'
  - 'B: 平均數、中位數、眾數同全距。'
  - 'C: 成本、價格、數量同利潤。'
  - 'D: 樣本量、置信水平、p值同功效。'
  answer: A
  explanation_en: The four dials are Center, Spread, Shape, and Association. Mean, median, mode, and range are tools under those dials, not the dials themselves. Cost-price-profit and inference settings answer different questions.
  explanation_zh: 四个刻度是中心、离散、形态与关联。平均数、中位数、众数与极差是刻度下的工具，不是刻度本身。成本价格利润和推断设定回答的是别的问题。
  explanation_zh_hk: 四個刻度係中心、離散、形態同關聯。平均數、中位數、眾數同全距係刻度下面嘅工具，唔係刻度本身。成本價格利潤同推斷設定答嘅係第二啲問題。

beats:
- id: hook
  visual: title_card
  seconds: 52
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is descriptive statistics?
  title_zh: 什么是描述性统计？
  title_zh_hk: 咩係描述性統計？
  en: >-
    Suppose you manage three coffee shops. A Monday file lands on the desk with three cup counts.
    If you treat the busiest row as the chain, you over-order milk and waste stock at the quieter shops.
    If you treat the quietest row as the chain, the busy shop runs out by lunch.
    Raw rows alone do not manage a shop. You need a small set of questions that turn the file into a decision.
    The toolkit that asks those questions is called descriptive statistics. What is descriptive statistics?
  zh: >-
    假设你管着三家咖啡店。星期一，桌上放着一份文件，只有三行杯数。
    要是把最忙的那一行当成整条连锁，你就会多订牛奶，清闲的店反而堆货。
    要是把最清闲的那一行当成整条连锁，忙店中午前就会断货。
    原始行管不了一家店。你需要一小套问题，把这份文件变成决策。
    提出这些问题的工具，叫作描述性统计。什么是描述性统计？
  zh_hk: >-
    假設你管緊三間咖啡店。星期一，檯上放住一份檔案，得三行杯數。
    如果將最忙嗰行當成成條連鎖，你就會多訂牛奶，清閒嘅店反而積貨。
    如果將最清閒嗰行當成成條連鎖，忙店中午前就會斷貨。
    原始行管唔到一間舖。你需要一小套問題，將呢份檔案變成決策。
    提出呢啲問題嘅工具，就叫做描述性統計。咩係描述性統計？
