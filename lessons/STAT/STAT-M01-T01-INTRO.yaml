  footer_en: 'Name the dial before the number'
  footer_zh: 先点名刻度，再谈数字
  footer_zh_hk: 先點名刻度，再講數字
  s1_en: >-
    First dial: center. Where does typical demand sit for these shops?
    Second: spread. How far apart do the shops sit?
  s1_zh: >-
    第一个刻度：中心。这些店的常规需求大概落在哪里？
    第二个：离散。各店彼此相距有多远？
  s1_zh_hk: >-
    第一個刻度：中心。呢啲店嘅常規需求大概落喺邊度？
    第二個：離散。各店彼此相距有幾遠？
  s2_en: >-
    Third dial: shape. Is one side of the picture much longer than the other?
    On this file, 4,200 sits far above 310 and 420.
  s2_zh: >-
    第三个刻度：形态。图的一边是不是比另一边长很多？
    在这份文件上，4,200远高于310和420。
  s2_zh_hk: >-
    第三個刻度：形態。圖嘅一邊係咪比另一邊長好多？
    喺呢份檔案上，4,200遠高過310同420。
  s3_en: >-
    Fourth dial: association. Which paired measures move together?
    Cups alone cannot answer that. You need a second measure, such as rent, before association can speak.
  s3_zh: >-
    第四个刻度：关联。哪些成对的指标会一起动？
    只有杯数答不了。关联发言之前，还需要第二个指标，例如租金。
  s3_zh_hk: >-
    第四個刻度：關聯。邊啲成對嘅指標會一齊郁？
    淨係杯數答唔到。關聯發言之前，仲需要第二個指標，例如租金。
- id: picture
  visual: rank_line
  seconds: 66
  kicker: One Picture
  kicker_en: One Picture
  kicker_zh: 一幅图
  kicker_zh_hk: 一幅圖
  title_en: Middle, width, and a long side
  title_zh: 中间、宽度，还有长的一边
  title_zh_hk: 中間、闊度，仲有長嘅一邊
  values: 310;420;4,200
  order: sorted
