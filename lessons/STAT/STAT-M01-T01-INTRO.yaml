  col2_zh_hk: B店
  col3_en: Shop C
  col3_zh: C店
  col3_zh_hk: C店
  c11: '310'
  c12: '420'
  c13: '4,200'
  footer_en: 'Suppose Monday cups'
  footer_zh: 假设的星期一杯数
  footer_zh_hk: 假設嘅星期一杯數
  tag_en: Three shops
  tag_zh: 三家店
  tag_zh_hk: 三間店
  s1_en: >-
    Suppose these are Monday's cups. Shop A sold 310. Shop B sold 420. Shop C sold 4,200.
    Three shops, three very different numbers. Which row should steer the chain?
  s1_zh: >-
    假设这是星期一的杯数。A店卖了310杯，B店卖了420杯，C店卖了4,200杯。
    三家店，三个差得很远的数。该用哪一行来管整条连锁？
  s1_zh_hk: >-
    假設呢啲係星期一嘅杯數。A店賣咗310杯，B店賣咗420杯，C店賣咗4,200杯。
    三間店，三個差好遠嘅數。應該用邊一行嚟管成條連鎖？
  s2_en: >-
    Copy Shop C and the plan looks enormous. Copy Shop A and the busy shop is starved.
    Copy Shop B and you still have not said how wide the shops sit apart, or whether one side is pulling the picture.
  s2_zh: >-
    照抄C店，计划会大得吓人。照抄A店，忙店又会缺货。
    照抄B店，你还是没说各店相距多远，也没说是不是有一边在拉动整幅图。
  s2_zh_hk: >-
    照抄C店，計劃會大得嚇人。照抄A店，忙店又會缺貨。
    照抄B店，你仲係冇講各店相距幾遠，亦冇講係咪有一邊喺度拉成幅圖。
  s3_en: >-
    So one row is not enough. Before any summary, name the question you are answering.
    Descriptive statistics starts by asking four questions of the same file.
  s3_zh: >-
    所以一行不够。下任何摘要之前，先写明你在回答哪个问题。
    描述性统计，就是先对同一份文件提出四个问题。
  s3_zh_hk: >-
    所以一行唔夠。落任何摘要之前，先寫明你喺度答邊個問題。
    描述性統計，就係先對同一份檔案提出四個問題。
- id: name_desc
  visual: title_card
  seconds: 24
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Descriptive statistics
  title_zh: 描述性统计
  title_zh_hk: 描述性統計
  en: >-
    Descriptive statistics. That is the name.
    It turns observed rows into a few summaries that a manager can read.
    It does not invent the future, and it does not by itself set staffing or inventory.
    Next, the four questions it asks.
  zh: >-
    描述性统计。这就是它的名字。
    它把已经看到的行，收成经理读得懂的几个摘要。
    它不编造未来，本身也不能规定人手或库存。
    接下来，看它会问的四个问题。
  zh_hk: >-
    描述性統計。呢個就係佢個名。
    佢將已經睇到嘅行，收成經理讀得明嘅幾個摘要。
    佢唔會編造未來，本身亦唔可以規定人手或者庫存。
    跟住，睇佢會問嘅四個問題。
