  footer_en: −100 − 50 + 0 + 150 = 0
  footer_zh: −100 − 50 + 0 + 150 = 0
  footer_zh_hk: −100 − 50 + 0 + 150 = 0
  s1_en: 'There is a second way to see 350. Put the four shops on one line: 250, 300, 350, and 500. Each shop sits at its own point. Which point is the fair centre for all four?'
  s1_zh: 350还有第二种看法。把四家店放在同一条线上：250、300、350和500。每家店各占一个点。哪个点才是四家店公平的中心？
  s1_zh_hk: 350仲有第二種睇法。將四間店擺喺同一條線上：250、300、350同500。每間店各自佔一個點。邊個點先係四間店公平嘅中心？
  s2_en: 'Mark 350, the mean we just found, the equal share. Think of the line as a seesaw, with 350 as the pivot. Each shop now sits a signed distance from it: below counts as minus, above as plus. A is 100 below, B is 50 below, C is right on it, and D is 150 above.'
  s2_zh: 标出350，就是刚才算出的平均数，也就是那份平均份额。把这条线想成跷跷板，350就是支点。现在每家店离支点都有一段带符号的距离：低于它记负，高于它记正。A低100，B低50，C正好在支点上，D高150。
  s2_zh_hk: 標出350，即係啱先計出嚟嘅平均數，亦即係嗰份平均份額。將條線諗成一塊蹺蹺板，350就係支點。而家每間店離支點都有一段帶符號嘅距離：低過佢記負，高過佢記正。A低100，B低50，C啱啱喺支點上面，D高150。
  s3_en: Now add the pulls. Below 350, the gaps are 100 and 50, so 150 cups. Above 350, one gap of 150 cups. Left equals right. Written with signs, minus 100, minus 50, zero, and plus 150 add to zero. The seesaw balances, and that is why 350 is the centre.
  s3_zh: 现在把两边的拉力加起来。350以下，差距是100和50，一共150杯。350以上，只有一段150杯。左边等于右边。带上符号写，就是负100、负50、零和正150，加起来等于零。跷跷板平衡了，所以350是中心。
  s3_zh_hk: 而家將兩邊嘅拉力加埋。350以下，差距係100同50，一共150杯。350以上，得一段150杯。左邊等於右邊。帶埋符號寫，就係負100、負50、零同正150，加埋等於零。蹺蹺板平衡咗，所以350係中心。
