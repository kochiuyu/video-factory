  kicker_zh_hk: 回答問題
  title_en: The mean is 350 cups
  title_zh: 平均数是350杯
  title_zh_hk: 平均數係350杯
  q1_en: Why is the mean of these four shops 350?
  q1_zh: 为什么这四家店的平均数是350？
  q1_zh_hk: 點解呢四間店嘅平均數係350？
  q2_en: Is 350 halfway between 250 and 500?
  q2_zh: 350是250和500的正中间吗？
  q2_zh_hk: 350係唔係250同500嘅正中間？
  s1_en: 'Back to head office''s question: what one number fairly stands for the four shops? The mean, 350 cups. It is the total shared equally, and it is the point where the line balances.'
  s1_zh: 回到总部的问题：哪一个数能公平地代表这四家店？平均数，350杯。它是总数的平均份额，也是这条线的平衡点。
  s1_zh_hk: 返到總部嘅問題：邊一個數可以公平噉代表呢四間店？平均數，350杯。佢係總數平分出嚟嘅份額，亦係條線嘅平衡點。
  s2_en: 'Why 350? One angle: add the four counts to get 1,400, and divide by 4 shops. The other angle: the signed distances, minus 100, minus 50, zero, and plus 150, add to zero. The shortfall below 350 balances the surplus above it.'
  s2_zh: 为什么是350？一个角度：四个杯数加起来是1,400，再除以4家店。另一个角度：带符号的距离，负100、负50、零和正150，加起来等于零。350以下差的部分，正好和350以上多出的部分抵消。
  s2_zh_hk: 點解係350？一個角度：四個杯數加埋係1,400，再除以4間店。另一個角度：帶符號嘅距離，負100、負50、零同正150，加埋等於零。350以下差嘅部分，啱啱同350以上多出嘅部分抵銷。
  s3_en: Is 350 halfway between 250 and 500? No, that midpoint is 375. And 350 is not what each shop sold. The mean summarizes the group. To decide how much to deliver to each shop, the manager still needs each shop's own demand, the cost of waste, the cost of running out, and how fast stock can be refilled.
  s3_zh: 350是250和500的正中间吗？不是，那个中点是375。350也不是每家店各自的销量。平均数概括的是整组店。要决定给每家店配多少货，经理还需要每家店自己的需求、浪费的成本、卖光的成本，以及多快能补货。
  s3_zh_hk: 350係唔係250同500嘅正中間？唔係，嗰個中點係375。350亦唔係每間店各自嘅銷量。平均數概括嘅係成組店。要決定畀每間店配幾多貨，經理仲需要每間店自己嘅需求、浪費嘅成本、賣晒嘅成本，同埋幾快可以補貨。
