  title_en: What is the mean?
  title_zh: 什么是平均数？
  title_zh_hk: 咩係平均數？
  en: Imagine you manage four coffee shops. On Monday, each sold a different number of cups. Head office asks for one number that shows how the group is doing overall. So which figure do you give them? If you only use the busiest shop, the group looks stronger than it really is. If you only use the quietest, it looks weaker. What number fairly represents all four shops? Let's look at them.
  zh: 假设你管着四家咖啡店。星期一，每家卖出的杯数都不一样。总部要一个数，想知道整体卖得怎么样。你给他们哪个数呢？如果只用最忙的那家，整体看起来会比实际好。如果只用最清闲的那家，又会看起来更差。到底哪个数才能公平地代表这四家店？我们来看看。
  zh_hk: 假設你管緊四間咖啡店。星期一，每間賣出嚟嘅杯數都唔同。總部要一個數，想知道整體賣得點樣。你畀佢哋邊個數呢？如果只用最忙嗰間，整體睇起嚟會好過實際。如果只用最清閒嗰間，又會睇起嚟更差。到底邊個數先可以公平代表呢四間店？我哋嚟睇吓。
