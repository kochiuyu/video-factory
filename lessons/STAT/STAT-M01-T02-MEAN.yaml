title_en: What is the mean?
title_zh: 什么是平均数？
title_zh_hk: 咩係平均數？
objective_en: Find one number that summarizes four shops, compute it as the total divided by the number of shops, and show that the signed deviations from it add up to zero. It is not generally the midpoint of the smallest and largest values, and it does not describe each shop.
objective_zh: 找出一个概括四家店的数，把它算成总数除以门店数，并说明离它的带符号离差加起来等于零。它一般不是最小值和最大值的中点，也不描述每一家店。
objective_zh_hk: 搵出一個概括四間店嘅數，將佢計成總數除以門店數，並說明離佢嘅帶符號離差加起嚟等於零。佢一般唔係最小值同最大值嘅中點，亦唔描述每一間店。
