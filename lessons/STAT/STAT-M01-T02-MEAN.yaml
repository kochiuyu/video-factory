  q1_en: Why is the mean of these four shops 350?
  q1_zh: 为什么这四家店的平均数是350？
  q1_zh_hk: 點解呢四間店嘅平均數係350？
  q2_en: Is 350 halfway between the smallest and largest values?
  q2_zh: 350是最小值和最大值的中点吗？
  q2_zh_hk: 350係最小值同最大值嘅中點？
  s1_en: "Back to the question: what number should the manager use for the four shops? The mean is 350. It is the equal share of the total, and it is the balance point."
  s1_zh: 回到问题：经理应该用哪个数来代表这四家店？平均数是350。它是总数的平均份额，也是平衡点。
  s1_zh_hk: 返到問題：經理應該用邊個數嚟代表呢四間店？平均數係350。佢係總數嘅平均份額，亦係平衡點。
  s2_en: From one angle, the signed deviations — minus 100, minus 50, zero, and plus 150 — add to zero. The shortfall below 350 balances the surplus above it. From another angle, we simply divided the total of 1,400 by 4.
  s2_zh: 从一种角度看，带符号离差——负100、负50、零和正150——加起来等于零。350以下的缺口与350以上的超出部分互相平衡。从另一种角度看，我们只是把总数1,400除以4。
  s2_zh_hk: 從一種角度睇，帶符號離差——負100、負50、零同正150——加起嚟等於零。350以下嘅缺口同350以上嘅超出部分互相平衡。從另一種角度睇，我哋只係將總數1,400除以4。
  s3_en: Is 350 halfway between the smallest and largest values? No — that midpoint is 375. And it does not tell us what each shop sold. The mean summarizes the four sales figures together. It does not, by itself, tell the manager how much to deliver to each shop. For that, you still need each shop's demand, the cost of waste, the cost of running out, and how quickly you can restock.
  s3_zh: 350是最小值和最大值的正中间吗？不是，那个中点是375。它也不告诉我们每家店各自卖了多少。平均数概括的是这四个销量合在一起的情况。它本身并不能告诉经理该给每家店配送多少。要做到这一点，还需要每家店的需求、浪费的成本、卖完的成本，以及多久可以补货。
  s3_zh_hk: 350係最小值同最大值嘅正中間嗎？唔係，嗰個中點係375。佢亦唔話畀我哋知每間店各自賣咗幾多。平均數概括嘅係呢四個銷量合埋一齊嘅情況。佢本身並唔可以話畀經理知應該畀每間店配送幾多。要做到呢一點，仲需要每間店嘅需求、浪費嘅成本、賣晒嘅成本，以及幾耐可以補貨。
