  s1_en: Suppose these are Monday's cups. Shop A sold 250. Shop B sold 300. Shop C sold 350. And Shop D sold 500. Four shops, four different numbers. Which one should the manager send to head office?
  s1_zh: 假设这是星期一的杯数。A店卖了250杯，B店卖了300杯，C店卖了350杯，D店卖了500杯。四家店，四个不同的数。经理要报哪一个给总部呢？
  s1_zh_hk: 假設呢啲係星期一嘅杯數。A店賣咗250杯，B店賣咗300杯，C店賣咗350杯，D店賣咗500杯。四間店，四個唔同嘅數。經理要報邊一個畀總部呢？
  s2_en: Try copying one shop. If every shop were treated like Shop D, at 500, that is a plan for 2,000 cups. But the four shops sold only 1,400 together. Copy Shop A instead, at 250, and the plan is 1,000, which is 400 short. Either end gets the real total wrong.
  s2_zh: 先试试照抄一家店。要是每家都当成D店，按500杯算，就是2,000杯的计划。可四家店加起来只卖了1,400杯。换成照抄A店，按250杯算，计划只有1,000杯，少了400杯。不管抄哪一端，总数都对不上。
  s2_zh_hk: 先試吓照抄一間店。如果每間都當係D店，按500杯計，就係2,000杯嘅計劃。但係四間店加埋先賣咗1,400杯。轉做照抄A店，按250杯計，計劃得1,000杯，少咗400杯。抄邊一端都好，總數都對唔上。
  s3_en: So which number keeps the total right? Think of four friends splitting one bill evenly. If the four shops had each sold the same amount, and the total stayed 1,400, each share would be 350. Four shares of 350 make 1,400 again. Nothing is lost, and nothing is added.
  s3_zh: 那哪个数能让总数对得上？想想四个朋友平分一张账单。假如四家店卖得一样多，总数还是1,400，每一份就是350。四份350，又凑回1,400。一杯没少，也一杯没多。
  s3_zh_hk: 咁邊個數可以令總數對得上？諗吓四個朋友平分一張單。假如四間店賣得一樣咁多，總數都係1,400，每一份就係350。四份350，又夾返1,400。一杯冇少，亦一杯冇多。
  tag_en: Monday cups
  tag_zh: 星期一杯数
  tag_zh_hk: 星期一杯數
- id: arithmetic
  visual: steps
  seconds: 70
  kicker: The Sum
  kicker_en: The Sum
  kicker_zh: 相加
  kicker_zh_hk: 相加
  title_en: Add the cups, then share them
  title_zh: 先把杯数相加，再平分
  title_zh_hk: 先將杯數相加，再平分
  step1_en: 250 + 300 + 350 + 500 = 1,400
  step1_zh: 250 + 300 + 350 + 500 = 1,400
  step1_zh_hk: 250 + 300 + 350 + 500 = 1,400
  step2_en: Share among 4 shops
  step2_zh: 平分给 4 家店
  step2_zh_hk: 平分畀 4 間店
  step3_en: 1,400 / 4 = 350 cups
  step3_zh: 1,400 / 4 = 350 杯
  step3_zh_hk: 1,400 / 4 = 350 杯
  step4_en: 4 × 350 = 1,400 cups
  step4_zh: 4 × 350 = 1,400 杯
  step4_zh_hk: 4 × 350 = 1,400 杯
  s1_en: Where does 350 come from? Two moves, written out. First, add. 250 plus 300 plus 350 plus 500 is 1,400 cups, the same total we just used. That is everything the four shops sold together.
  s1_zh: 350是怎么来的？就两步，我们写出来。第一步，相加。250加300加350加500，等于1,400杯，就是刚才那个总数。这是四家店一共卖出的全部。
  s1_zh_hk: 350係點嚟㗎？得兩步，我哋寫出嚟。第一步，相加。250加300加350加500，等於1,400杯，即係啱先嗰個總數。呢個係四間店加埋賣出嘅全部。
  s2_en: Second, share. Why divide? Because we want each shop's equal share of that total, just like the bill. So count how many shops are sharing. Not the cups, the shops. Here there are four.
  s2_zh: 第二步，平分。为什么要除？因为我们要的是每家店在总数里的平均份额，跟分账单一样。所以先数一数有几家店在分。数的是店，不是杯。这里是四家。
  s2_zh_hk: 第二步，平分。點解要除？因為我哋要嘅係每間店喺總數入面嘅平均份額，同分張單一樣。所以先數吓有幾多間店喺度分。數嘅係店，唔係杯。呢度係四間。
  s3_en: 1,400 divided by 4 is 350 cups. That equal share is the mean, which most people call the average. It is what each shop would have sold if the total had been spread evenly.
  s3_zh: 1,400除以4，等于350杯。这个平均份额就是平均数。意思是，如果把总数平均摊开，每家店就会卖这么多。
  s3_zh_hk: 1,400除以4，等於350杯。呢個平均份額就係平均數。意思係，如果將總數平均攤開，每間店就會賣咁多。
  s4_en: 'Check it. Four times 350 is 1,400, so the total is kept. Now a common trap: is 350 halfway between the smallest and the largest? Halfway between 250 and 500 is 375, not 350. The mean is not the midpoint of the two ends; it uses every shop.'
  s4_zh: 验算一下。4乘350还是1,400，总数保住了。再看一个常见的陷阱：350是最小值和最大值的正中间吗？250和500的中点是375，不是350。平均数不是两端的中点，它用上了每一家店。
  s4_zh_hk: 驗算吓。4乘350都係1,400，總數保住咗。再睇一個常見嘅陷阱：350係唔係最小值同最大值嘅正中間？250同500嘅中點係375，唔係350。平均數唔係兩端嘅中點，佢用晒每一間店。
- id: name_mean
  visual: title_card
  seconds: 20
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Mean
  title_zh: 平均数
  title_zh_hk: 平均數
  en: Mean. That is the name. Add up every value, then divide by how many values there are. People also call it the average. For these four shops, the mean is 350 cups. Next, the same two moves in a short written form.
  zh: 平均数。这就是它的名字。做法就是刚才那两步：把每个数都加起来，再除以一共有几个数。这四家店的平均数是350杯。接下来，我们把这两步写成一个简短的式子。
  zh_hk: 平均數。呢個就係佢個名。做法就係啱先嗰兩步：將每個數加埋，再除以總共有幾多個數。呢四間店嘅平均數係350杯。跟住，我哋將呢兩步寫成一條短短嘅式。
- id: formula
  visual: steps
  seconds: 92
  kicker: The Formula
  kicker_en: The Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: Label the shops, add, share
  title_zh: 先给门店编号，再相加，再平分
  title_zh_hk: 先畀門店編號，再相加，再平分
  step1_en: 'x₁, x₂, x₃, x₄: the cup counts'
  step1_zh: x₁、x₂、x₃、x₄ 是四家店的杯数
  step1_zh_hk: x₁、x₂、x₃、x₄ 係四間店嘅杯數
  step2_en: 'n is how many shops: here, 4'
  step2_zh: n 是有多少家店：这里是 4
  step2_zh_hk: n 係有幾多間店：呢度係 4
  step3_en: Σ means add every x
  step3_zh: Σ 表示把每一个 x 加起来
  step3_zh_hk: Σ 表示將每一個 x 加起嚟
  step4_en: x̄ = Σ xᵢ / n
  step4_zh: x̄ = Σ xᵢ / n
  step4_zh_hk: x̄ = Σ xᵢ / n
  s1_en: 'The formula is just shorthand for those two moves. Start with the shops. Give each cup count a label: x with a small number. x one is Shop A''s 250, x two is 300, x three is 350, and x four is 500. The small number only says which shop. With more shops we keep going: x one, x two, all the way to x n.'
  s1_zh: 公式只是那两步的简写。先从门店开始。给每个杯数一个标签，就是带小数字的 x。x一是A店的250，x二是300，x三是350，x四是500。小数字只是告诉你是哪家店。店多的话就一直往下写：x一、x二，一直到 x n。
  s1_zh_hk: 公式只係嗰兩步嘅簡寫。由門店開始。每個杯數畀個標籤，就係帶住細數字嘅 x。x一係A店嘅250，x二係300，x三係350，x四係500。細數字只係話你知係邊間店。店多就一路寫落去：x一、x二，一直去到 x n。
  s2_en: So what is n? It is not a cup count. n is how many shops we are averaging, the number we divided by. Here n is 4. With ten shops, n would be 10. The small i in x i just runs from 1 up to n.
  s2_zh: 那 n 是什么？它不是杯数。n 是参与平均的门店有几家，也就是刚才除的那个数。这里 n 是 4。要是有十家店，n 就是 10。x i 里的小 i，就是从 1 数到 n。
  s2_zh_hk: 咁 n 係乜？佢唔係杯數。n 係有幾多間店一齊計平均，即係啱先除嗰個數。呢度 n 係 4。如果有十間店，n 就係 10。x i 入面嘅細 i，就係由 1 數到 n。
  s3_en: 'The capital Greek letter sigma means add. Sigma of x i says: add x one, plus x two, plus x three, plus x four. Every shop, not just the two ends. For our four shops, that sum is 1,400.'
  s3_zh: 大写的希腊字母西格玛，意思是相加。x i 的西格玛就是：x一加x二加x三加x四。每一家店都加，不是只加两端。这四家店加起来是 1,400。
  s3_zh_hk: 大寫嘅希臘字母西格瑪，意思係相加。x i 嘅西格瑪就係：x一加x二加x三加x四。每一間店都加，唔係淨係加兩端。呢四間店加埋係 1,400。
  s4_en: 'Now the left side. The bar over the x is read x bar, and it means the mean. So the whole line says: add every cup count, then divide by n, the number of shops. 1,400 divided by 4 is 350. The same two moves work for any number of shops.'
  s4_zh: 再看等号左边。x 上面加一横，读作 x 拔，表示平均数。整行的意思就是：把每家店的杯数加起来，再除以 n，也就是门店的数量。1,400 除以 4 等于 350。不管有几家店，都是这两步。
  s4_zh_hk: 再睇等號左邊。x 上面加一橫，讀做 x bar，代表平均數。成行嘅意思就係：將每間店嘅杯數加埋，再除以 n，即係門店嘅數目。1,400 除以 4 等於 350。唔理有幾多間店，都係呢兩步。
