  left_zh: 整体的一个数
  left_zh_hk: 整體嘅一個數
  right_en: Not what each shop sold
  right_zh: 不是每家店的销量
  right_zh_hk: 唔係每間店嘅銷量
  s1_en: Two views, one answer. The equal share of the total is 350, and the balance point is 350. So what does this number actually tell the manager, and what does it not?
  s1_zh: 两种看法，同一个答案。总数的平均份额是350，平衡点也是350。那这个数到底能告诉经理什么，又不能告诉他什么？
  s1_zh_hk: 兩種睇法，同一個答案。總數嘅平均份額係350，平衡點都係350。咁呢個數究竟話到經理知啲乜，又話唔到佢知啲乜？
  s2_en: 'What it does: it gives one number for the whole group. Head office asked how the four shops are doing overall, and 350 cups per shop answers that, because four times 350 is the real total.'
  s2_zh: 它能做的，是给整组店一个数。总部问的是四家店整体卖得怎样，每家350杯正好回答这个问题，因为4乘350就是真实的总数。
  s2_zh_hk: 佢做得到嘅，係畀成組店一個數。總部問嘅係四間店整體賣成點，每間350杯就啱啱答到，因為4乘350就係真正嘅總數。
  s3_en: 'What it is not: it is not what each shop sold. Only Shop C sold exactly 350. Shop A sold 250, and Shop D sold 500. So the manager cannot simply send 350 cups'' worth of supplies to every shop. The mean describes the group, not each shop.'
  s3_zh: 它不是每家店各自的销量。只有C店正好卖了350杯，A店卖了250，D店卖了500。所以经理不能直接给每家店都按350杯配货。平均数说的是整体，不是每一家店。
  s3_zh_hk: 佢唔係每間店各自嘅銷量。得C店啱啱賣咗350杯，A店賣咗250，D店賣咗500。所以經理唔可以直接畀每間店都按350杯配貨。平均數講嘅係整體，唔係每一間店。
