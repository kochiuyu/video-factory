  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the mean?
  title_zh: 什么是平均数？
  title_zh_hk: 咩係平均數？
  en: Imagine you manage four coffee shops. On Monday, each one sold a different number of cups. Head office asks you for one number that shows how the group is doing. Which figure do you send? Pick the busiest shop, and the group looks stronger than it really is; set next week's target from it, and the target is too high. Pick the quietest shop, and the group looks weaker; the target ends up too low. So what single number fairly stands for all four shops? The number that answers that is called the mean. What is the mean?
  zh: 假设你管着四家咖啡店。星期一，每家卖出的杯数都不一样。总部只要一个数，想看看整体卖得怎么样。你报哪个数？要是报最忙的那家，整体看起来比实际好，拿它来定下周的目标，目标就定高了。要是报最清闲的那家，整体又显得更差，目标就定低了。那到底哪个数，才能公平地代表这四家店？回答这个问题的数，叫作平均数。什么是平均数？
  zh_hk: 假設你管緊四間咖啡店。星期一，每間賣出嘅杯數都唔同。總部淨係要一個數，想睇吓整體賣成點。你報邊個數？如果報最忙嗰間，整體睇落好過實際，攞佢嚟定下個禮拜嘅目標，目標就定高咗。如果報最清閒嗰間，整體又睇落差啲，目標就定低咗。咁到底邊個數，先可以公平噉代表呢四間店？答到呢個問題嘅數，就叫做平均數。咩係平均數？
