quiz:
- id: Q1
  type: multiple_choice
  question_en: Four shops sold 250, 300, 350, and 500 cups. Why is their mean 350?
  question_zh: 四家店卖了250、300、350和500杯。为什么它们的平均数是350？
  question_zh_hk: 四間店賣咗250、300、350同500杯。點解佢哋嘅平均數係350？
  options_en:
  - 'A: The signed deviations from 350 add up to zero. The left sum equals the right sum.'
  - 'B: 350 is halfway between 250 and 500.'
  - 'C: 350 is what every shop sold.'
  - 'D: 350 is the busiest shop.'
  options_zh:
  - 'A: 离350的带符号离差加起来等于零。左边之和等于右边之和。'
  - 'B: 350是250和500的正中间。'
  - 'C: 350是每家店卖出的杯数。'
  - 'D: 350是最忙的那家店。'
  options_zh_hk:
  - 'A: 離350嘅帶符號離差加起嚟等於零。左邊之和等於右邊之和。'
  - 'B: 350係250同500嘅正中間。'
  - 'C: 350係每間店賣出嘅杯數。'
  - 'D: 350係最忙嗰間店。'
  answer: A
  explanation_en: The signed deviations from 350 are minus 100, minus 50, zero, and plus 150, so they add up to zero. Equivalently, the 150 cups below 350 balance the 150 cups above it. Halfway between 250 and 500 is 375, not 350. The mean is not generally the midpoint of the smallest and largest values.
  explanation_zh: 离350的带符号离差是负100、负50、0和正150，所以它们的和等于零。换一种说法，350以下的150杯与350以上的150杯互相平衡。250和500的中点是375，不是350。平均数一般不是最小值和最大值的中点。
  explanation_zh_hk: 離350嘅帶符號離差係負100、負50、0同正150，所以佢哋嘅和等於零。換句話講，350以下嘅150杯同350以上嘅150杯互相平衡。250同500嘅中點係375，唔係350。平均數一般唔係最小值同最大值嘅中點。
- id: Q2
  type: multiple_choice
  question_en: Three other shops sold 200, 300, and 700 cups. What is their mean?
  question_zh: 另外三家店卖了200、300和700杯。它们的平均数是多少？
  question_zh_hk: 另外三間店賣咗200、300同700杯。佢哋嘅平均數係幾多？
  options_en:
  - 'A: 400, because 1,200 divided by 3 is 400.'
  - 'B: 450, because it is halfway between 200 and 700.'
  - 'C: 300, because it is the middle observation.'
  - 'D: 700, because it is the largest observation.'
  options_zh:
  - 'A: 400，因为1,200除以3等于400。'
  - 'B: 450，因为它是200和700的正中间。'
  - 'C: 300，因为它是中间的那个观测。'
  - 'D: 700，因为它是最大的那个观测。'
  options_zh_hk:
  - 'A: 400，因為1,200除以3等於400。'
  - 'B: 450，因為佢係200同700嘅正中間。'
  - 'C: 300，因為佢係中間嗰個觀測。'
  - 'D: 700，因為佢係最大嗰個觀測。'
  answer: A
  explanation_en: 200 plus 300 plus 700 is 1,200. Divide by 3 and the mean is 400. Halfway between 200 and 700 is 450. The middle observation is 300. Neither of those is the mean.
  explanation_zh: 200加300加700等于1,200。除以3，平均数是400。200和700的正中间是450。中间的观测是300。这两个都不是平均数。
  explanation_zh_hk: 200加300加700等於1,200。除以3，平均數係400。200同700嘅正中間係450。中間嘅觀測係300。呢兩個都唔係平均數。
