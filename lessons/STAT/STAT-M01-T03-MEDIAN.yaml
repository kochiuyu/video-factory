quiz:
- id: Q1
  type: multiple_choice
  question_en: For an odd number of days, how do you find the median?
  question_zh: 当天数为奇数时，如何找出中位数？
  question_zh_hk: 當日數係奇數嗰陣，點樣搵出中位數？
  options_en:
  - 'A: Add up all values and divide by the number of days.'
  - 'B: Sort all values from smallest to largest and select the value at the middle rank.'
  - 'C: Select the largest number reported in the file.'
  - 'D: Find the difference between the highest and lowest sales.'
  options_zh:
  - 'A: 把所有数值加起来，再除以天数。'
  - 'B: 将所有数值从小到大排序，再选取位于中间排位的数值。'
  - 'C: 选取报表里记录的最大数值。'
  - 'D: 计算最高销售额与最低销售额之间的差值。'
  options_zh_hk:
  - 'A: 將所有數值加埋一齊，再除以日數。'
  - 'B: 將所有數值由細到大排序，再揀位於中間排位嘅數值。'
  - 'C: 選取報表入面記錄嘅最大數值。'
  - 'D: 計算最高銷售額與最低銷售額之間嘅差值。'
  answer: B
  explanation_en: For an odd number of days, sort the values first. The value at the single middle rank is the median.
  explanation_zh: 当天数为奇数时，先将数值排序。位于唯一中间排位的数值就是中位数。
  explanation_zh_hk: 當日數係奇數嗰陣，先將數值排序。位於唯一中間排位嘅數值就係中位數。
- id: Q2
  type: multiple_choice
  question_en: Why is the median useful when one day is extremely large?
  question_zh: 当其中一天特别大时，为什么中位数特别有用？
  question_zh_hk: 當其中一日特別大嗰陣，點解中位數特別有用？
  options_en:
  - 'A: It completely ignores how many days there are.'
  - 'B: An extreme day can move farther away without changing the middle rank, provided the ordering stays the same.'
  - 'C: It always matches the arithmetic sum of the dataset.'
  - 'D: It guarantees that every day will sell the same number of cups.'
  options_zh:
  - 'A: 它完全不用管到底有几天。'
  - 'B: 只要排序不变，极端的一天即使继续增大，也不会改变中间排位。'
  - 'C: 它永远与数据集的算术总和相等。'
  - 'D: 它能确保每一天都卖出完全相同杯数的咖啡。'
  options_zh_hk:
  - 'A: 佢完全唔使理會到底有幾多日。'
  - 'B: 只要排序不變，極端嘅一日就算繼續增大，亦唔會改變中間排位。'
  - 'C: 佢永遠同數據集嘅算術總和相等。'
  - 'D: 佢可以保證每一日都賣出完全相同杯數嘅咖啡。'
  answer: B
  explanation_en: The median depends on ordered position rather than numerical distance. If the rush day remains at the high end, making its sales even larger does not change the middle-ranked day.
  explanation_zh: 中位数取决于排序位置，而不是数值距离。只要高峰日仍位于最高端，即使它的销量继续增加，也不会改变处于中间排位的那一天。
  explanation_zh_hk: 中位數取決於排序位置，而唔係數值距離。只要高峰日仍然位於最高端，就算佢嘅銷量繼續增加，亦唔會改變處於中間排位嘅嗰一日。
beats:
- id: hook
  visual: title_card
  seconds: 54
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the median?
  title_zh: 什么是中位数？
  title_zh_hk: 咩係中位數？
  en: "Imagine you manage two coffee shops. Someone asks you for one number: what does a typical day sell? Each shop has several days. One shop has a rush day. If you give the average, most days look like they failed. Which number should you give for a typical day? The number that answers that is called the median. What is the median?"
  zh: "假设你管着两家咖啡店。有人要你给一个数：一个普通的天通常卖多少？每家店有好几天。一家店有一个高峰日。如果你给平均数，大多数天看起来都没达标。该给一个普通的天哪个数？回答这个问题的数叫作中位数。什么是中位数？"
  zh_hk: "假設你管緊兩間咖啡店。有人要你畀一個數：一個普通嘅日通常賣幾多？每間店有幾多日。一間店有一個高峰日。如果你畀平均數，大多數日睇落都冇達標。該畀一個普通嘅日邊個數？回答呢個問題嘅數叫做中位數。咩係中位數？"
