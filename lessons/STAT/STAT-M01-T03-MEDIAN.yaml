  s1_en: Suppose these are Shop A's five days, in cups sold. Day 1 sold 80. Day 2 sold 100. Day 3 sold 120. Day 4 sold 140. And Day 5 sold 460.
  s1_zh: 假设这是A店五天卖出的杯数。第1天卖了80杯。第2天卖了100杯。第3天卖了120杯。第4天卖了140杯。第5天卖了460杯。
  s1_zh_hk: 假設呢個係A店五日賣出嘅杯數。第1日賣咗80杯。第2日賣咗100杯。第3日賣咗120杯。第4日賣咗140杯。第5日賣咗460杯。
  s2_en: Look at the shape of the row. Four days sit close together, between 80 and 140. Day 5 is far above them, a rush at 460. Yet one number has to stand for a typical day.
  s2_zh: 看看这一行的样子。四天挨得很近，在80到140之间。第5天远远高出，是460的高峰。可是我们只能用一个数，代表普通的一天。
  s2_zh_hk: 睇吓呢一行嘅樣。四日企得好近，喺80到140之間。第5日遠遠高過佢哋，係460嘅高峰。但係我哋得一個數，去代表普通嘅一日。
  s3_en: 'Four close days and one rush. The first number most people reach for is the average: add everything up and share it out. So what does the average say here?'
  s3_zh: 四天相近，一天高峰。大多数人第一个想到的是平均数：全部加起来，再平分。那平均数在这里会说什么？
  s3_zh_hk: 四日相近，一日高峰。大部分人第一時間諗到嘅係平均數：全部加埋，再平分。咁平均數喺呢度會講乜？
  rows: 1
  tag_en: Cups sold
  tag_zh: 卖出杯数
  tag_zh_hk: 賣出杯數
- id: plans
  visual: two_column
  seconds: 54
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两个目标
  kicker_zh_hk: 兩個目標
  title_en: Target 180? Four days miss
  title_zh: 目标180？四天没达到
  title_zh_hk: 目標180？四日未達到
  left_en: 'Ordinary days: 80 to 140'
  left_zh: 普通的天：80 到 140
  left_zh_hk: 普通嘅日：80 到 140
  right_en: 'Average target: 180'
  right_zh: 平均目标：180
  right_zh_hk: 平均目標：180
  s1_en: Let's work it out. 80 plus 100 plus 120 plus 140 plus 460 is 900 cups. Divide by 5 days, and the average is 180 cups. Now suppose 180 becomes the target for a typical day.
  s1_zh: 我们算一算。80加100加120加140加460，等于900杯。除以5天，平均数是180杯。现在假设把180定成普通一天的目标。
  s1_zh_hk: 我哋計吓。80加100加120加140加460，等於900杯。除以5日，平均數係180杯。而家假設將180定做普通一日嘅目標。
  s2_en: First, the ordinary days. Four of the five sold between 80 and 140 cups. That is what a normal day at Shop A looks like.
  s2_zh: 先看普通的日子。五天里有四天，卖的是80到140杯。这才是A店平常一天的样子。
  s2_zh_hk: 先睇普通嘅日子。五日入面有四日，賣嘅係80到140杯。呢個先係A店平常一日嘅樣。
  s3_en: Now the average target, 180. Every one of those four days falls short of it, so they all look like failures. Only the rush day clears it. The average answers how many cups the five days sold, shared equally. It does not answer what a typical day sold. So where else could we look?
  s3_zh: 再看平均数定出来的目标，180。那四天全都够不着，看起来都像没达标，只有高峰日过了线。平均数回答的是五天卖的杯数平均分下来是多少，不是普通的一天卖多少。那我们还能看哪里？
  s3_zh_hk: 再睇平均數定出嚟嘅目標，180。嗰四日全部都夠唔到，睇落個個都似冇達標，得高峰日過到線。平均數答嘅係五日賣嘅杯數平分落嚟有幾多，唔係普通嘅一日賣幾多。咁我哋仲可以睇邊度？
- id: lineup
  visual: rank_line
  seconds: 40
  kicker: The Line
  kicker_en: The Line
  kicker_zh: 排队
  kicker_zh_hk: 排隊
  title_en: Line the five days up
  title_zh: 把五天排好
  title_zh_hk: 將五日排好
  values: 80;100;120;140;460
  order: as_given
  mark: none
  s1_en: 'Try something that does not add at all. Think of a queue. Put the days in a line from the fewest cups to the most: 80, then 100, then 120, then 140, then 460.'
  s1_zh: 试一个完全不用加的方法。想想排队。把这些天从杯数最少排到最多：80，然后100，然后120，然后140，然后460。
  s1_zh_hk: 試一個完全唔使加嘅方法。諗吓排隊。將呢啲日由杯數最少排到最多：80，然後100，然後120，然後140，然後460。
  s2_en: Now number the places in the queue, one through five. We have not added anything. We have only put the days in order. That step is called a rank.
  s2_zh: 现在给队里的位置编上号，从第一到第五。我们什么都没加，只是把这些天排好了顺序。这一步叫作排序。
  s2_zh_hk: 而家幫隊入面嘅位置編號，由第一到第五。我哋乜都冇加，只係將呢啲日排好次序。呢一步叫做排序。
  s3_en: With five places, which one is in the middle? The third. Two days stand below it, and two stand above it.
  s3_zh: 五个位置，哪一个在正中间？第三个。它下面有两天，上面也有两天。
  s3_zh_hk: 五個位置，邊一個喺正中間？第三個。佢下面有兩日，上面都有兩日。
- id: middle
  visual: rank_line
  seconds: 42
  kicker: The Middle
  kicker_en: The Middle
  kicker_zh: 正中间
  kicker_zh_hk: 正中間
  title_en: Read the middle day
  title_zh: 读出正中间的一天
  title_zh_hk: 讀出正中間嘅一日
  values: 80;100;120;140;460
  order: as_given
  mark: middle
  footer_en: Middle = 120
  footer_zh: 中间 = 120
  footer_zh_hk: 中間 = 120
  s1_en: 'So read that third place. Here is the same queue, low to high: 80, 100, 120, 140, 460.'
  s1_zh: 那就读出第三个位置。还是这一队，从少到多：80，100，120，140，460。
  s1_zh_hk: 咁就讀出第三個位置。都係呢一隊，由少到多：80，100，120，140，460。
  s2_en: Count in from both ends. Take one off the bottom and one off the top, then one more from each side. The day left standing in the middle is the third.
  s2_zh: 从两头往里数。底下去掉一个，顶上去掉一个，两边再各去掉一个。留在正中间的，就是第三个。
  s2_zh_hk: 由兩頭向入面數。底下剔走一個，頂上剔走一個，兩邊再各剔走一個。留喺正中間嘅，就係第三個。
  s3_en: 'The third day sold 120 cups. That looks like an ordinary day at Shop A: it sits right among the four close days. The average, 180, sits above four of the five. This middle number has a name.'
  s3_zh: 第三天卖了120杯。这才像A店普通的一天：它就落在那四个相近的日子中间。平均数180，却高过五天里的四天。这个正中间的数，有一个名字。
  s3_zh_hk: 第三日賣咗120杯。呢個先似A店普通嘅一日：佢就喺嗰四個相近嘅日子中間。平均數180，就高過五日入面嘅四日。呢個正中間嘅數，有個名。
- id: name_med
  visual: title_card
  seconds: 20
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Median
  title_zh: 中位数
  title_zh_hk: 中位數
  en: Median. That is the name. Sort the values from low to high, then read the one in the middle. For Shop A's five days, the median is 120 cups. But what happens to it if the rush day gets even bigger?
  zh: 中位数。这就是它的名字。把数从小到大排好，再读出正中间的那个。A店这五天，中位数是120杯。可是，要是高峰日变得更大，它会怎样？
  zh_hk: 中位數。呢個就係佢個名。將啲數由細到大排好，再讀出正中間嗰個。A店呢五日，中位數係120杯。但係如果高峰日再大啲，佢會點？
- id: robust
  visual: two_column
  seconds: 52
  kicker: Why It Holds
  kicker_en: Why It Holds
  kicker_zh: 为什么拉不动
  kicker_zh_hk: 點解拉唔郁
  title_en: Rush grows, middle stays
  title_zh: 高峰变大，正中间不变
  title_zh_hk: 高峰變大，正中間唔變
  left_en: 'Rush 460: middle 120'
  left_zh: 高峰 460：正中间 120
  left_zh_hk: 高峰 460：正中間 120
  right_en: 'Rush 4,000: still 120'
  right_zh: 高峰 4,000：仍是 120
  right_zh_hk: 高峰 4,000：仍然係 120
  s1_en: Here is the key difference. The average uses the cups themselves, so a bigger rush adds more cups and drags the share up. The median uses only the place in the queue.
  s1_zh: 关键的分别在这里。平均数用的是杯数本身，高峰越大，加进去的杯数越多，平均份额就被拖上去。中位数只看排序里的位置。
  s1_zh_hk: 關鍵嘅分別喺呢度。平均數用嘅係杯數本身，高峰越大，加入去嘅杯數越多，平均份額就俾佢拖高。中位數只睇排序入面嘅位置。
  s2_en: As it stands, the rush is 460. The queue reads 80, 100, 120, 140, 460, and the middle is 120.
  s2_zh: 现在的高峰是460。这一队是80、100、120、140、460，正中间是120。
  s2_zh_hk: 而家嘅高峰係460。呢一隊係80、100、120、140、460，正中間係120。
  s3_en: Now suppose Day 5 sold 4,000 cups instead. It is still last in the queue, and the third day is still 120, so the median stays 120. The average would jump far above every ordinary day. We have not thrown the rush day out; it is still in the file. A day this far from the rest is called an outlier.
  s3_zh: 现在假设第5天卖的是4,000杯。它还是排在最后，第三天还是120，所以中位数还是120。平均数却会跳到远远高过每一个普通的日子。我们没有把高峰日丢掉，它还在记录里。离其他日子这么远的一天，叫作异常值。
  s3_zh_hk: 而家假設第5日賣咗4,000杯。佢仲係排喺最尾，第三日仲係120，所以中位數仲係120。平均數就會跳到遠遠高過每一個普通嘅日子。我哋冇將高峰日丟走，佢仲喺記錄入面。離其他日子咁遠嘅一日，叫做異常值。
- id: four
  visual: rank_line
  seconds: 46
  kicker: Four Days
  kicker_en: Four Days
  kicker_zh: 四天
  kicker_zh_hk: 四日
  title_en: Shop B. Four days.
  title_zh: B店。四天。
  title_zh_hk: B店。四日。
  values: 100;200;300;800
  order: as_given
  mark: middle
  footer_en: Share 200 and 300
  footer_zh: 平分 200 和 300
  footer_zh_hk: 平分 200 同 300
  s1_en: Five days gave us one middle. But what if the count is even? Suppose Shop B has four days. Day 1 sold 100. Day 2 sold 200. Day 3 sold 300. Day 4 sold 800.
  s1_zh: 五天，给了我们一个正中间。可要是天数是偶数呢？假设B店有四天。第1天卖了100杯，第2天卖了200杯，第3天卖了300杯，第4天卖了800杯。
  s1_zh_hk: 五日，畀咗我哋一個正中間。但如果日數係雙數呢？假設B店有四日。第1日賣咗100杯，第2日賣咗200杯，第3日賣咗300杯，第4日賣咗800杯。
  s2_en: Put them in order on the numbered line, low to high; they already are. With five days, one place sat in the middle. With four, there is no single middle place.
  s2_zh: 按编号从少到多排好，它们本来就是这个顺序。五天的时候，正中间只有一个位置。四天，就没有唯一的正中间了。
  s2_zh_hk: 按編號由少到多排好，佢哋本身已經係呢個次序。五日嗰陣，正中間得一個位置。四日，就冇唯一嘅正中間喇。
  s3_en: 'Instead, two places share the middle: the second and the third, 200 and 300. One day sits below them and one above. So what do we do with two middles?'
  s3_zh: 这时候，中间有两个位置：第二个和第三个，200和300。它们下面一天，上面一天。那两个正中间要怎么办？
  s3_zh_hk: 呢個時候，中間有兩個位置：第二個同第三個，200同300。佢哋下面一日，上面一日。咁兩個正中間點算？
