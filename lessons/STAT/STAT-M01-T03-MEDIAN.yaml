  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A middle, not the whole story
  title_zh: 只是正中间，不是全部
  title_zh_hk: 只係正中間，唔係全部
  left_en: Tells you the typical day
  left_zh: 说出普通的一天
  left_zh_hk: 講出普通嘅一日
  right_en: Hides the total and the rush
  right_zh: 藏起总数和高峰
  right_zh_hk: 收埋總數同高峰
  s1_en: Not quite. Like every summary, the median keeps one thing and drops others. So what does it tell you, and what does it hide?
  s1_zh: 不完全是。跟所有概括的数一样，中位数留下一样东西，也丢掉一些东西。那它告诉你什么，又藏起了什么？
  s1_zh_hk: 唔完全係。同所有概括嘅數一樣，中位數留低一樣嘢，亦丟咗啲嘢。咁佢話你知啲乜，又收埋咗啲乜？
  s2_en: It tells you where the typical day sits. At Shop A, an ordinary day sold about 120 cups. That is a fair picture of the four quiet days.
  s2_zh: 它告诉你普通的一天落在哪里。A店普通的一天，卖120杯左右。这对那四个平稳的日子，是个公平的描述。
  s2_zh_hk: 佢話你知普通嘅一日喺邊度。A店普通嘅一日，賣120杯左右。對嗰四個平穩嘅日子嚟講，係個公平嘅描述。
  s3_en: But it hides the total and the rush. It does not say how many cups the five days sold, and it does not say whether the rush day was a problem. Two very different queues can share the same middle. And 120 is not an order for every day to sell 120. Keep the days themselves in view.
  s3_zh: 可是它藏起了总数和高峰。它不说这五天一共卖了多少杯，也不说高峰日是不是问题。两队很不一样的数字，也可能有同一个正中间。而且120也不是要求每天都卖120杯。原来的这些天，还是要放在眼前。
  s3_zh_hk: 但係佢收埋咗總數同高峰。佢唔話你知呢五日一共賣咗幾多杯，亦唔話你知高峰日係咪問題。兩隊好唔同嘅數字，都可以有同一個正中間。而且120唔係要每日都賣120杯。原本嗰啲日子，仲係要擺喺眼前。
- id: answer
  visual: takeaway
  seconds: 64
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Give the typical day the middle.
  title_zh: 普通的一天，看正中间
  title_zh_hk: 普通嘅一日，睇正中間
  q1_en: What does a typical day sell?
  q1_zh: 普通的一天通常卖多少？
  q1_zh_hk: 普通嘅一日通常賣幾多？
  q2_en: When do you still need the average?
  q2_zh: 什么时候还要用平均数？
  q2_zh_hk: 咩時候仲要用平均數？
  s1_en: 'Back to head office''s question: what does a typical day sell? At Shop A, the median is 120 cups, the middle of five days. The average, 180, sits above four of those days because one rush pulled it up.'
  s1_zh: 回到总部的问题：普通的一天卖多少？A店的中位数是120杯，就是五天的正中间。平均数180，因为一个高峰把它拉高了，高过其中四天。
  s1_zh_hk: 返到總部嘅問題：普通嘅一日賣幾多？A店嘅中位數係120杯，即係五日嘅正中間。平均數180，因為一個高峰將佢拉高咗，高過其中四日。
  s2_en: 'So what does a typical day sell? Sort the days and read the middle. With an even count, like Shop B''s four days, share the two middles: 200 and 300 give 250. When one rush day would pull the average above the ordinary days, give the median.'
  s2_zh: 那普通的一天卖多少？把这些天排好，读出正中间。天数是偶数，比如B店四天，就把两个正中间平均分：200和300，得250。一个高峰日会把平均数拉到普通日子上面时，就报中位数。
  s2_zh_hk: 咁普通嘅一日賣幾多？將啲日排好，讀出正中間。日數係雙數，好似B店四日，就將兩個正中間平均分：200同300，得出250。一個高峰日會將平均數拉到普通日子上面嗰陣，就報中位數。
  s3_en: So when do you still need the average? When the question is about the total shared equally, for example planning the cups for all five days together. Neither number is always right; the question decides. These numbers describe only the days we supposed. Before you set any target, still look at the rush day itself.
  s3_zh: 那什么时候还要用平均数？问题问的是总数平均分下来，比如一起规划五天总共要准备的杯数，就用平均数。哪个数都不是永远对的，看问题决定。这些数只描述我们假设的这几天。真要定目标之前，还是要看看那个高峰日本身。
  s3_zh_hk: 咁咩時候仲要用平均數？問題問嘅係總數平分落嚟，好似一齊計五日總共要準備幾多杯，就用平均數。邊個數都唔係永遠啱，睇問題決定。呢啲數只係描述我哋假設嘅呢幾日。真係要定目標之前，仲要睇吓個高峰日本身。
