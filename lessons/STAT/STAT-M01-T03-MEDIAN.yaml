  footer_en: Middle = good
  footer_zh: 中间 = 好
  footer_zh_hk: 中間 = 好
  s1_en: 'Let''s try it. Suppose five customers answer a satisfaction question, and we line the answers up from poor to excellent: poor, fair, good, very good, excellent.'
  s1_zh: 我们来试一试。假设五位顾客回答一个满意度问题，把答案从差排到非常好：差，一般，好，很好，非常好。
  s1_zh_hk: 我哋試吓。假設五位顧客答一條滿意度問題，將答案由差排到非常好：差，一般，好，好好，非常好。
  s2_en: Five answers on the numbered line, so the middle is the third place. Again, we did not add anything. We only ranked.
  s2_zh: 五个答案放在编号线上，正中间就是第三个位置。同样，我们什么都没加，只是排了序。
  s2_zh_hk: 五個答案擺喺編號線上，正中間就係第三個位置。同樣，我哋乜都冇加，只係排咗序。
  s3_en: The third answer is good, so the typical answer is good. Answers like these, which can be ranked but not added, are called ordinal. The average does not apply to them, because the words are not cups. The median does. So is the median always enough?
  s3_zh: 第三个答案是“好”，所以典型的答案就是“好”。这种能排序、不能相加的答案，叫作定序数据。平均数用不上，因为这些词不是杯数，中位数却用得上。那中位数是不是就够了？
  s3_zh_hk: 第三個答案係「好」，所以典型嘅答案就係「好」。呢種排得到序、加唔到嘅答案，叫做定序數據。平均數用唔上，因為呢啲詞唔係杯數，中位數就用得上。咁係咪有中位數就夠？
