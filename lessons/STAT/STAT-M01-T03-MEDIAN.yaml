  s1_zh_hk: "咁平均分邊兩日？第二日同第三日。200同300。佢哋下面一日，上面一日。"
  s2_en: "Add them. 200 plus 300 is 500. Share equally. 500 divided by 2 is 250. That is the middle of a four-day line."
  s2_zh: "加起来。200加300等于500。平均分。500除以2等于250。这就是四天这一队的正中间。"
  s2_zh_hk: "加起嚟。200加300等於500。平均分。500除以2等於250。呢個就係四日呢一隊嘅正中間。"
  s3_en: "Five days, read the one middle: 120. Four days, share the two middles: 250. The same two steps have a written form."
  s3_zh: "五天，读出那一个正中间：120。四天，把两个正中间平均分：250。同样的两步有一个写法。"
  s3_zh_hk: "五日，讀出嗰一個正中間：120。四日，將兩個正中間平均分：250。同樣嘅兩步有一個寫法。"
- id: defn
  visual: definition_card
  seconds: 42
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Median, written down
  title_zh: 中位数，写成定义
  title_zh_hk: 中位數，寫成定義
  formula: 'Odd count: read the one middle

    Even count: share the two middles'
  formula_zh: '奇数：读出那一个正中间

    偶数：把两个正中间平均分'
  formula_zh_hk: '單數：讀出嗰一個正中間

    雙數：將兩個正中間平均分'
  gloss: 'Five days: 120. Four days: 250.'
  gloss_zh: '五天：120。四天：250。'
  gloss_zh_hk: '五日：120。四日：250。'
  s1_en: "Here is the written form. Sort the days from low to high. If the count is odd, like five, read the single middle. If the count is even, like four, share the two middle days equally."
  s1_zh: "这就是写法。把这些天从少到多排好。如果是奇数，比如五天，读出唯一的正中间。如果是偶数，比如四天，把正中间的两天平均分。"
  s1_zh_hk: "呢個就係寫法。將呢啲日由少到多排好。如果係單數，好似五日，讀出唯一嘅正中間。如果係雙數，好似四日，將正中間嘅兩日平均分。"
  s2_en: "Five days, the median is 120 cups. Four days, the median is 250 cups. It is about place in the line, not about how far a rush day sits. This is the definition. Next, two things the middle can do that the average cannot."
  s2_zh: "五天，中位数是120杯。四天，中位数是250杯。它看的是排队的位置，不是高峰日离得有多远。这就是定义。接下来，正中间能做、而平均数做不到的两件事。"
  s2_zh_hk: "五日，中位數係120杯。四日，中位數係250杯。佢睇嘅係排隊嘅位置，唔係高峰日離得有幾遠。呢個就係定義。跟住，正中間做得到、而平均數做唔到嘅兩件事。"
- id: good
  visual: two_column
  seconds: 44
  kicker: Why It Helps
  kicker_en: Why It Helps
  kicker_zh: 它好在哪里
  kicker_zh_hk: 佢好喺邊度
  title_en: Two things the middle can do
  title_zh: 正中间能做的两件事
  title_zh_hk: 正中間做得到嘅兩件事
  left_en: "A rush day does not move the middle"
  left_zh: "高峰日挪不动正中间"
  left_zh_hk: "高峰日郁唔到正中間"
  right_en: "It works when answers are only ordered"
  right_zh: "答案只能排队时，它也能用"
  right_zh_hk: "答案只能排隊時，佢都用得"
  s1_en: "First, the rush day. We already saw it. Day 5 can grow from 460 to 4,000, and the middle stays 120. The average moves. The middle does not. A far day is called an outlier. The median is less affected by outliers."
  s1_zh: "第一，高峰日。我们已经看过了。第5天可以从460涨到4,000，正中间还是120。平均数会动。正中间不动。离得这么远的一天叫作异常值。中位数比较不受异常值影响。"
  s1_zh_hk: "第一，高峰日。我哋已經睇過。第5日可以由460升到4,000，正中間仲係120。平均數會郁。正中間唔郁。離得咁遠嘅一日叫做異常值。中位數比較唔受異常值影響。"
  s2_en: "Second, some answers are only a line, not cups you can add. A customer says poor, fair, good, very good, or excellent. You can put those words in order. You cannot add good to excellent and divide."
  s2_zh: "第二，有些答案只是一队，不是可以相加的杯数。顾客说差、一般、好、很好、或者非常好。这些词可以排好。你不能把“好”加上“非常好”再除。"
  s2_zh_hk: "第二，有啲答案只係一隊，唔係可以加埋嘅杯數。顧客話差、一般、好、好好、或者非常好。呢啲詞可以排好。你唔可以將「好」加上「非常好」再除。"
  s3_en: "The average needs numbers you can add. The middle only needs a line. Next we read the middle of five answers."
  s3_zh: "平均数需要可以相加的数。正中间只需要一队。接下来读出五个答案的正中间。"
  s3_zh_hk: "平均數需要可以加埋嘅數。正中間只需要一隊。跟住讀出五個答案嘅正中間。"
- id: likert
  visual: steps
  seconds: 42
  kicker: Ordered Answers
  kicker_en: Ordered Answers
  kicker_zh: 只能排队的答案
  kicker_zh_hk: 只能排隊嘅答案
  title_en: Five answers. Read the middle one.
  title_zh: 五个答案。读出正中间那个。
  title_zh_hk: 五個答案。讀出正中間嗰個。
  step1_en: "Poor, fair, good"
  step1_zh: "差，一般，好"
  step1_zh_hk: "差，一般，好"
  step2_en: "Very good, excellent"
  step2_zh: "很好，非常好"
  step2_zh_hk: "好好，非常好"
  step3_en: "Five answers. Middle is good."
  step3_zh: "五个答案。正中间是好。"
  step3_zh_hk: "五個答案。正中間係好。"
  s1_en: "Suppose five customers answer a satisfaction question. Line the answers up, from poor to excellent. Poor, fair, good, very good, excellent."
  s1_zh: "假设五位顾客回答一个满意度问题。把答案从差排到非常好。差，一般，好，很好，非常好。"
  s1_zh_hk: "假設五位顧客回答一個滿意度問題。將答案由差排到非常好。差，一般，好，好好，非常好。"
  s2_en: "Five answers, so the middle is the third. The third is good. That is the typical answer. We did not add anything."
  s2_zh: "五个答案，所以正中间是第三个。第三个是好。这就是最典型的答案。我们什么都没加。"
  s2_zh_hk: "五個答案，所以正中間係第三個。第三個係好。呢個就係最典型嘅答案。我哋咩都冇加。"
  s3_en: "This kind of line is called ordinal. The name can wait. The average does not apply, because the words are not cups. The middle does. Next, what the middle still cannot do."
  s3_zh: "这种只能排队的答案叫作定序。名字可以等一等。平均数用不上，因为这些词不是杯数。正中间用得上。接下来，正中间仍然做不到什么。"
  s3_zh_hk: "呢種只能排隊嘅答案叫做定序。名可以等一等。平均數用唔上，因為呢啲詞唔係杯數。正中間用得上。跟住，正中間仍然做唔到咩。"
- id: limit
  visual: two_column
  seconds: 44
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A reason to check, not the only number
  title_zh: 是检查的理由，不是唯一的数
  title_zh_hk: 係檢查嘅理由，唔係唯一嘅數
  left_en: Why it helps
  left_zh: 它有什么用
  left_zh_hk: 佢有咩用
  right_en: What it is not
  right_zh: 它不是什么
  right_zh_hk: 佢唔係乜
  s1_en: "So the middle has two uses. A rush day does not move it, and it works when the answers are only a line. Why is it still not the only number? It does not say how many cups the days sold in total."
  s1_zh: "所以正中间有两个用处。高峰日挪不动它，答案只是一队时它也能用。为什么它仍然不是唯一的数？它不说这些天一共卖了多少杯。"
  s1_zh_hk: "所以正中間有兩個用處。高峰日郁唔到佢，答案只係一隊時佢都用得。點解佢仍然唔係唯一嘅數？佢唔話呢啲日一共賣咗幾多杯。"
  s2_en: "But the middle is not the only number. It does not say how many cups the days sold in total. It does not say the rush day is fine. Two different lines can also share the same middle. Keep the days in view."
  s2_zh: "但正中间不是唯一的数。它不说这些天一共卖了多少杯。它也不说高峰日没问题。两种不同的排队，也可能有同一个正中间。所以还要看着原来的这些天。"
  s2_zh_hk: "但正中間唔係唯一嘅數。佢唔話呢啲日一共賣咗幾多杯。佢亦唔話高峰日冇問題。兩種唔同嘅排隊，亦可能有同一個正中間。所以仲要睇住原本嘅呢啲日。"
  s3_en: "And 120 is not an order to make every day sell 120. It has no plan in it. It says where the middle of these days sits."
  s3_zh: "而且120不是让每一天都卖120杯的指令。它里面没有计划。它说的是这些天的正中间在哪里。"
  s3_zh_hk: "而且120唔係叫每一日都賣120杯嘅指令。佢入面冇計劃。佢講嘅係呢啲日嘅正中間喺邊度。"
- id: answer
  visual: takeaway
  seconds: 48
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Give the typical day the middle.
  title_zh: 给普通的天正中间。
  title_zh_hk: 畀普通嘅日正中間。
  q1_en: What does a typical day sell?
  q1_zh: 一个普通的天通常卖多少？
  q1_zh_hk: 一個普通嘅日通常賣幾多？
  q2_en: When do you still need the average?
  q2_zh: 什么时候还要用平均数？
  q2_zh_hk: 咩時候仲要用平均數？
  s1_en: "Back to the question. A typical day at Shop A sold 120 cups. That is the middle of five days. The average, 180, sits above four of those days because of the rush."
  s1_zh: "回到问题。A店一个普通的天卖了120杯。那就是五天的正中间。平均数180，因为高峰日，高于其中四天。"
  s1_zh_hk: "返到問題。A店一個普通嘅日賣咗120杯。嗰個就係五日嘅正中間。平均數180，因為高峰日，高過其中四日。"
  s2_en: "Shop B has four days, so there are two middles, 200 and 300. Share them, 250. Use the middle when you want a typical day, and one rush day would pull the average above the ordinary days. Use the average when you want the equal share of the total."
  s2_zh: "B店有四天，所以有两个正中间，200和300。平均分，250。想要一个普通的天，而一个高峰日会把平均数拉到普通的天上面时，用正中间。想要总数的平均份额时，用平均数。"
  s2_zh_hk: "B店有四日，所以有兩個正中間，200同300。平均分，250。想要一個普通嘅日，而一個高峰日會將平均數拉到普通嘅日上面時，用正中間。想要總數嘅平均份額時，用平均數。"
  s3_en: "Neither number is always the right one. The question decides. Before you set the target, still look at the rush day. These numbers describe only the days we supposed. The median says where the middle sits. It does not write the target by itself."
  s3_zh: "哪一个数都不总是对的。问题决定用哪一个。定目标之前，还是要看高峰日。这些数只描述我们假设的这些天。中位数说的是正中间在哪里。它不能单独写目标。"
  s3_zh_hk: "邊一個數都唔係永遠啱。問題決定用邊一個。定目標之前，仲係要睇高峰日。呢啲數只係描述我哋假設嘅呢啲日。中位數講嘅係正中間喺邊度。佢唔可以單獨寫目標。"
