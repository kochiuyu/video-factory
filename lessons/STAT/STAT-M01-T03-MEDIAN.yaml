  s1_en: "Here are the five days behind that question. Shop A, in cups sold. Day 1 sold 80. Day 2 sold 100. Day 3 sold 120. Day 4 sold 140. Day 5 sold 460."
  s1_zh: "这就是那个问题背后的五天。A店卖出的杯数。第1天卖了80杯。第2天卖了100杯。第3天卖了120杯。第4天卖了140杯。第5天卖了460杯。"
  s1_zh_hk: "呢個就係嗰個問題背後嘅五日。A店賣出嚟嘅杯數。第1日賣咗80杯。第2日賣咗100杯。第3日賣咗120杯。第4日賣咗140杯。第5日賣咗460杯。"
  s2_en: "Four days sit near each other, from 80 to 140. Day 5 is a rush at 460. One number has to stand for a typical day."
  s2_zh: "四天离得不远，从80到140。第5天是460的高峰。一个数要代表一个普通的天。"
  s2_zh_hk: "四日離得唔遠，由80到140。第5日係460嘅高峰。一個數要代表一個普通嘅日。"
  s3_en: "If we just add and share, the rush day will pull the number up. Next we see what that target does to the ordinary days."
  s3_zh: "如果我们只是加起来再平分，高峰日会把这个数拉高。接下来看那个目标对普通的天意味着什么。"
  s3_zh_hk: "如果我哋只係加起嚟再平分，高峰日會將呢個數拉高。跟住睇嗰個目標對普通嘅日意味着咩。"
