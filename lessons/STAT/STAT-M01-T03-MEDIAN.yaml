  kicker_zh: 两个目标
  kicker_zh_hk: 兩個目標
  title_en: One average. Most days look short.
  title_zh: 一个平均数，大多数天都像没达标
  title_zh_hk: 一個平均數，大多數日都似冇達標
  left_en: "Ordinary days: 80 to 140"
  left_zh: "普通的天：80 到 140"
  left_zh_hk: "普通嘅日：80 到 140"
  right_en: "Average target: 180"
  right_zh: "平均目标：180"
  right_zh_hk: "平均目標：180"
  s1_en: "So which number do you give? Add the five days and share. 80 plus 100 plus 120 plus 140 plus 460 is 900. Divide by 5. That is 180 cups."
  s1_zh: "那么你给哪个数？把五天加起来再平分。80加100加120加140加460等于900。除以5。等于180杯。"
  s1_zh_hk: "咁你畀邊個數？將五日加起嚟再平分。80加100加120加140加460等於900。除以5。等於180杯。"
  s2_en: "Set 180 as the target for a typical day. Four of the five days sold less. Those days look like they failed."
  s2_zh: "把180定为一个普通的天的目标。五天里有四天卖得更少。那些天看起来都没达标。"
  s2_zh_hk: "將180定做一個普通嘅日嘅目標。五日入面有四日賣得更少。嗰啲日睇落都冇達標。"
  s3_en: "The average answers how many cups the five days sold, shared equally. It does not answer what a typical day sold. Next we line the days up."
  s3_zh: "平均数回答的是五天一共卖了多少杯，平均分。它不回答一个普通的天卖了多少。接下来把这五天排成一队。"
  s3_zh_hk: "平均數回答嘅係五日一共賣咗幾多杯，平均分。佢唔回答一個普通嘅日賣咗幾多。跟住將呢五日排成一隊。"
