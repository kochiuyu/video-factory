duration_target_s: 630
title_en: What is the median?
title_zh: 什么是中位数？
title_zh_hk: 咩係中位數？
objective_en: Decide which number to give a typical day when one rush day pulls the average up, and find the middle of the ordered days for five days and for four.
objective_zh: 当一个高峰日把平均数拉高时，判断普通的一天应该报哪个数，并分别找出五天和四天排好之后的正中间。
objective_zh_hk: 當一個高峰日將平均數拉高時，判斷普通嘅一日應該報邊個數，並分別搵出五日同四日排好之後嘅正中間。
