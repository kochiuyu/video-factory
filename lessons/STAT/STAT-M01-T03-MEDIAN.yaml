  step3_en: 500 / 2 = 250
  step3_zh: 500 / 2 = 250
  step3_zh_hk: 500 / 2 = 250
  step4_en: Four days. Middle is 250.
  step4_zh: 四天。正中间是 250。
  step4_zh_hk: 四日。正中間係 250。
  s1_en: 'We share them, the same way two people split a bill. The two middle days are the second and the third: 200 and 300.'
  s1_zh: 把它们平均分，就像两个人平分一张账单。正中间的两天是第二天和第三天：200和300。
  s1_zh_hk: 將佢哋平均分，就好似兩個人夾一張單咁。正中間嘅兩日係第二日同第三日：200同300。
  s2_en: Add the two middles. 200 plus 300 is 500 cups.
  s2_zh: 先把两个正中间加起来。200加300等于500杯。
  s2_zh_hk: 先將兩個正中間加埋。200加300等於500杯。
  s3_en: 'Then share equally between the two. 500 divided by 2 is 250 cups. Notice that 250 is not one of Shop B''s days. That is fine: it sits halfway between the two middles.'
  s3_zh: 再由这两个平分。500除以2等于250杯。留意，250不是B店任何一天的数。这没关系：它正好落在两个正中间的半路。
  s3_zh_hk: 再由呢兩個平分。500除以2等於250杯。留意，250唔係B店任何一日嘅數。冇問題嘅：佢啱啱喺兩個正中間嘅半路。
  s4_en: 'So the rule is complete. Five days: read the one middle, 120. Four days: share the two middles, 250. Now we can write the median down for any count.'
  s4_zh: 这样规则就完整了。五天：读出唯一的正中间，120。四天：把两个正中间平均分，250。现在可以把中位数写成一个定义，天数多少都适用。
  s4_zh_hk: 噉樣規則就完整喇。五日：讀出唯一嘅正中間，120。四日：將兩個正中間平均分，250。而家可以將中位數寫成一個定義，幾多日都用得。
- id: defn
  visual: definition_card
  seconds: 38
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Median, written down
  title_zh: 中位数，写成定义
  title_zh_hk: 中位數，寫成定義
  formula: 'Odd count: read the one middle

    Even count: share the two middles'
  formula_zh: '奇数：读出那一个正中间

    偶数：把两个正中间平均分'
  formula_zh_hk: '單數：讀出嗰一個正中間

    雙數：將兩個正中間平均分'
  gloss: 'Five days: 120. Four days: 250.'
  gloss_zh: 五天：120。四天：250。
  gloss_zh_hk: 五日：120。四日：250。
  s1_en: Here is the definition. First, sort the values from low to high. If the count is odd, like five, read the single middle value. If the count is even, like four, share the two middle values equally.
  s1_zh: 这就是定义。先把数值从小到大排好。如果个数是奇数，比如五天，就读出唯一的正中间。如果个数是偶数，比如四天，就把正中间的两个数平均分。
  s1_zh_hk: 呢個就係定義。先將數值由細到大排好。如果個數係單數，好似五日，就讀出唯一嘅正中間。如果個數係雙數，好似四日，就將正中間嘅兩個數平均分。
  s2_en: For Shop A's five days, the median is 120 cups. For Shop B's four days, it is 250 cups. Either way, the median depends on place in the line, not on how far out the rush day sits. So what can it do that the average cannot?
  s2_zh: A店五天，中位数是120杯。B店四天，中位数是250杯。不管哪种，中位数看的都是排队的位置，不是高峰日离得多远。那它能做什么，是平均数做不到的？
  s2_zh_hk: A店五日，中位數係120杯。B店四日，中位數係250杯。點都好，中位數睇嘅都係排隊嘅位置，唔係高峰日離得幾遠。咁佢做得到啲乜，係平均數做唔到嘅？
- id: good
  visual: two_column
  seconds: 48
  kicker: Why It Helps
  kicker_en: Why It Helps
  kicker_zh: 它好在哪里
  kicker_zh_hk: 佢好喺邊度
  title_en: Two things the middle can do
  title_zh: 正中间能做的两件事
  title_zh_hk: 正中間做得到嘅兩件事
  left_en: A rush day can't move it
  left_zh: 高峰日挪不动它
  left_zh_hk: 高峰日郁唔到佢
  right_en: Works for ordered answers
  right_zh: 只能排序的答案也能用
  right_zh_hk: 只能排序嘅答案都用得
  s1_en: Two things stand out, and both come from using place instead of size.
  s1_zh: 有两件事特别突出，都来自它看位置、不看大小。
  s1_zh_hk: 有兩件事特別突出，兩樣都係因為佢睇位置、唔睇大細。
  s2_en: First, a rush day cannot move it. We saw Day 5 grow from 460 to 4,000 while the median stayed at 120. The average moves; the median does not. A measure that outliers barely move is called robust, and the median is robust.
  s2_zh: 第一，高峰日挪不动它。我们看到第5天从460涨到4,000，中位数还是120。平均数会动，中位数不动。几乎不受异常值影响的量，叫作稳健，中位数就是稳健的。
  s2_zh_hk: 第一，高峰日郁唔到佢。我哋見到第5日由460升到4,000，中位數仲係120。平均數會郁，中位數唔郁。幾乎唔受異常值影響嘅量，叫做穩健，中位數就係穩健嘅。
  s3_en: Second, it works for answers you can only rank. A customer might say poor, fair, good, very good, or excellent. You can put those words in order, but you cannot add good to excellent and divide. The average needs numbers you can add. The median only needs an order.
  s3_zh: 第二，只能排序的答案，它也能用。顾客可能说差、一般、好、很好、或者非常好。这些词可以排序，但你没法把“好”加上“非常好”再除。平均数需要能相加的数，中位数只需要一个顺序。
  s3_zh_hk: 第二，只能排序嘅答案，佢都用得。顧客可能話差、一般、好、好好、或者非常好。呢啲詞可以排序，但你冇辦法將「好」加「非常好」再除。平均數要可以加埋嘅數，中位數只要一個次序。
