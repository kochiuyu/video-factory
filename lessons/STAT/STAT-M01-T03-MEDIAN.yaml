id: STAT-M01-T03-MEDIAN
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 612
title_en: What is the median?
title_zh: 什么是中位数？
title_zh_hk: 咩係中位數？
objective_en: Decide which number to give a typical day when one rush day pulls the average up, and find the middle of the ordered days for five days and for four.
objective_zh: 当一个高峰日把平均数拉高时，判断该给一个普通的天哪个数，并分别找出五天和四天排好之后的正中间。
objective_zh_hk: 當一個高峰日將平均數拉高時，判斷該畀一個普通嘅日邊個數，並分別搵出五日同四日排好之後嘅正中間。
