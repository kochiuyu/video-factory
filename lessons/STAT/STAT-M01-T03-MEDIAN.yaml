  s1_en: "Median. That is the name. It is the middle of the line, after you have sorted low to high. For these five days it is 120 cups. Next we see why the rush day cannot pull it."
  s1_zh: "中位数。这就是那个名字。它是排好之后正中间的那个数。这五天是120杯。接下来看为什么高峰日拉不动它。"
  s1_zh_hk: "中位數。呢個就係嗰個名。佢係排好之後正中間嗰個數。呢五日係120杯。跟住睇點解高峰日拉唔郁佢。"
- id: robust
  visual: two_column
  seconds: 46
  kicker: Why It Holds
  kicker_en: Why It Holds
  kicker_zh: 为什么拉不动
  kicker_zh_hk: 點解拉唔郁
  title_en: The rush can grow. The middle stays.
  title_zh: 高峰可以更大，正中间不变
  title_zh_hk: 高峰可以更大，正中間唔變
  left_en: "Rush at 460. Middle is 120."
  left_zh: "高峰 460。正中间是 120。"
  left_zh_hk: "高峰 460。正中間係 120。"
  right_en: "Rush at 4,000. Middle is still 120."
  right_zh: "高峰 4,000。正中间还是 120。"
  right_zh_hk: "高峰 4,000。正中間仲係 120。"
  s1_en: "So why does the rush day not pull this number? The average uses the cups. A bigger day adds more cups, so the share goes up. The middle uses the place in the line."
  s1_zh: "那么为什么高峰日拉不动这个数？平均数用的是杯数。更大的一天加上更多杯，份额就上去了。正中间用的是排队的位置。"
  s1_zh_hk: "咁點解高峰日拉唔郁呢個數？平均數用嘅係杯數。更大嘅一日加上更多杯，份額就上去咗。正中間用嘅係排隊嘅位置。"
  s2_en: "Suppose Day 5 sold 4,000 cups, not 460. It is still last in the line. The third day is still 120. The middle is still 120."
  s2_zh: "假设第5天卖了4,000杯，不是460。它还是排在最后。第三天还是120。正中间还是120。"
  s2_zh_hk: "假設第5日賣咗4,000杯，唔係460。佢仲係排喺最後。第三日仲係120。正中間仲係120。"
  s3_en: "The rush day is still in the file. We have not thrown it out. Its distance cannot, by itself, move the middle. A day this far out is called an outlier. The name can wait. Five days have one middle. Next, Shop B, with four days."
  s3_zh: "高峰日还在这份记录里。我们没有把它丢掉。它离得有多远，不能单独挪动正中间。离得这么远的一天叫作异常值。名字可以等一等。五天有一个正中间。接下来，B店，四天。"
  s3_zh_hk: "高峰日仲喺呢份記錄入面。我哋冇將佢丟低。佢離得有幾遠，唔可以單獨郁到正中間。離得咁遠嘅一日叫做異常值。名可以等一等。五日有一個正中間。跟住，B店，四日。"
