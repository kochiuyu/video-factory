id: STAT-M01-T04-MODE
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 570
title_en: What is the mode?
title_zh: 什么是众数？
title_zh_hk: 咩係眾數？
objective_en: Decide which lid to run largest when the sizes are labels you cannot average, count which size customers choose most, and see a tie and a Monday with no mode.
objective_zh: 当杯型是不能相加的标签时，判断该把哪一种杯盖安排最大的批次，清点顾客最常选的规格，并看到并列和没有众数的周一。
objective_zh_hk: 當杯型係唔可以加埋嘅標籤時，判斷該將邊一種杯蓋安排最大嘅批次，清點顧客最常揀嘅規格，並睇到並列同冇眾數嘅星期一。
glossary:
- en: mode
  zh: 众数
  zh_hk: 眾數
  lock: true
- en: frequency
  zh: 频数
  zh_hk: 頻數
  lock: true
- en: categorical data
  zh: 分类数据
  zh_hk: 分類數據
  lock: true
- en: bimodal
  zh: 双峰
  zh_hk: 雙峰
  lock: true
quiz:
- id: Q1
  type: multiple_choice
  question_en: How do you identify the mode in a customer sales record?
  question_zh: 如何从顾客销售记录中找出众数？
  question_zh_hk: 點樣喺顧客銷售記錄入面搵出眾數？
  options_en:
  - 'A: Add up all the numbers and divide by the customer count.'
  - 'B: Sort all values in line and pick the exact middle item.'
  - 'C: Count how often each value or category appears and select the one or more with the highest frequency.'
  - 'D: Subtract the smallest order size from the largest order size.'
  options_zh:
  - 'A: 把所有数字加起来，除以顾客总人数。'
  - 'B: 把所有数值排成一列，挑出正中间的那一个。'
  - 'C: 统计每个数值或类别出现的次数，选出频数最高的一个或多个选项。'
  - 'D: 用最大订单量减去最小订单量。'
  options_zh_hk:
  - 'A: 將所有數字加埋一齊，除以顧客總人數。'
  - 'B: 將所有數值排成一列，揀出正中間嗰一個。'
  - 'C: 統計每個數值或者類別出現嘅次數，揀出頻數最高嘅一個或者多個選項。'
  - 'D: 用最大訂單量減去最少訂單量。'
  answer: C
  explanation_en: The mode is determined by frequency. A dataset may have one mode, more than one mode when top frequencies tie, or no mode when no value repeats.
  explanation_zh: 众数由频数决定。最高频数没有并列时有一个众数；最高频数并列时可以有多个众数；没有任何数值重复时则可能没有众数。
  explanation_zh_hk: 眾數由頻數決定。最高頻數冇並列嗰陣有一個眾數；最高頻數並列嗰陣可以有多個眾數；冇任何數值重複嗰陣就可能冇眾數。
- id: Q2
  type: multiple_choice
  question_en: Why is the mode appropriate for choosing which categorical cup lid to prioritize?
  question_zh: 为什么众数适合用来决定优先准备哪一类杯盖？
  question_zh_hk: 點解眾數適合用嚟決定優先準備邊一類杯蓋？
  options_en:
  - 'A: Categories such as Small, Medium, and Large cannot be meaningfully averaged, but their frequencies can be counted.'
  - 'B: The mode is always mathematically larger than the mean.'
  - 'C: Retail inventory formulas ban the use of division.'
  - 'D: The mode eliminates all competition between store branches.'
  options_zh:
  - 'A: 小杯、中杯和大杯等类别无法进行有意义的平均，但可以统计各自的频数。'
  - 'B: 众数在数学上总是大于算术平均数。'
  - 'C: 零售库存管理公式禁止使用除法运算。'
  - 'D: 众数消除了所有门店分店之间的竞争。'
  options_zh_hk:
  - 'A: 細杯、中杯同大杯等類別冇辦法做有意義嘅平均，但可以統計各自嘅頻數。'
  - 'B: 眾數喺數學上總是大多過算術平均數。'
  - 'C: 零售庫存管理公式禁止使用除法運算。'
  - 'D: 眾數消除咗所有門店分店之間嘅競爭。'
  answer: A
  explanation_en: For nominal categories, mean and median are not meaningful, but frequency is. The mode identifies the most common category and helps managers prioritize matching inventory.
  explanation_zh: 对于名义分类数据，平均数与中位数没有意义，但频数有意义。众数找出最常见的类别，帮助管理者优先准备相应库存。
  explanation_zh_hk: 對於名義分類數據，平均數同中位數冇意義，但頻數有意義。眾數搵出最常見嘅類別，幫管理者優先準備相應庫存。
beats:
- id: hook
  visual: title_card
  seconds: 54
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the mode?
  title_zh: 什么是众数？
  title_zh_hk: 咩係眾數？
  en: "Imagine you manage a coffee shop. The factory asks which lid should get the largest run before Monday. You sell Small, Medium, and Large. Each needs its own lid. A wrong mix means Medium runs out while Small lids pile up, even if the total looks enough. Which size do customers choose most? The number that answers that is called the mode. What is the mode?"
  zh: "假设你管着一家咖啡店。工厂问，周一之前哪一种杯盖该安排最大的批次。你卖小杯、中杯和大杯。每一种都要自己的盖。规格错了，中杯会卖完，小杯盖会堆着，就算总数看起来够。顾客最常选哪一种？回答这个问题的数叫作众数。什么是众数？"
  zh_hk: "假設你管緊一間咖啡店。工廠問，星期一之前邊一種杯蓋該安排最大嘅批次。你賣細杯、中杯同大杯。每一種都要自己嘅蓋。規格錯咗，中杯會賣晒，細杯蓋會堆住，就算總數睇落夠。顧客最常揀邊一種？回答呢個問題嘅數叫做眾數。咩係眾數？"
