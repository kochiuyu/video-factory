  s3_en: "280 is higher than 40, and higher than 100. Medium is the size customers chose most. This count has a name."
  s3_zh: "280高于40，也高于100。中杯是顾客选得最多的规格。这个次数有一个名字。"
  s3_zh_hk: "280高過40，亦高過100。中杯係顧客揀得最多嘅規格。呢個次數有一個名。"
- id: name_mode
  visual: title_card
  seconds: 32
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Mode
  title_zh: 众数
  title_zh_hk: 眾數
  s1_en: "Mode. That is the name. It is the value, or the category, that appears most often. On this Monday it is Medium, with 280 orders. It works for numbers, and it extends to labels."
  s1_zh: "众数。这就是那个名字。它是出现得最多的那个数，或者那个类别。这个周一是中杯，280笔。它对数用得上，也能用到标签上。"
  s1_zh_hk: "眾數。呢個就係嗰個名。佢係出現得最多嗰個數，或者嗰個類別。呢個星期一係中杯，280筆。佢對數用得上，亦用到標籤上。"
- id: good
  visual: two_column
  seconds: 44
  kicker: Why It Helps
  kicker_en: Why It Helps
  kicker_zh: 它好在哪里
  kicker_zh_hk: 佢好喺邊度
  title_en: It extends to labels
  title_zh: 它也能用到标签上
  title_zh_hk: 佢都用到標籤上
  left_en: "Numbers: count the value"
  left_zh: "数字：清点那个数"
  left_zh_hk: "數字：清點嗰個數"
  right_en: "Labels: count the category"
  right_zh: "标签：清点那个类别"
  right_zh_hk: "標籤：清點嗰個類別"
  s1_en: "The mode started as a count of a number. It extends to categorical data, labels you cannot add. Small, Medium, and Large are labels. You can still count them."
  s1_zh: "众数起初是清点一个数。它也能用到分类数据上，就是不能相加的标签。小杯、中杯、大杯是标签。你仍然可以清点。"
  s1_zh_hk: "眾數起初係清點一個數。佢都用到分類數據上，就係唔可以加埋嘅標籤。細杯、中杯、大杯係標籤。你仍然可以清點。"
  s2_en: "The same is true of drink names. Americano, latte, cappuccino. No average drink, and no middle drink. But each order still adds one to a count. The highest count is the mode."
  s2_zh: "饮品的名字也一样。美式、拿铁、卡布奇诺。没有平均的饮品，也没有正中间的饮品。但每一笔订单仍然给一个计数加一。最高的计数就是众数。"
  s2_zh_hk: "飲品嘅名都一樣。美式、拿鐵、卡布奇諾。冇平均嘅飲品，亦冇正中間嘅飲品。但每一筆訂單仍然畀一個計數加一。最高嘅計數就係眾數。"
  s3_en: "So the mode reaches further than the average or the middle. It has two drawbacks. Next, a Monday where two sizes tie."
  s3_zh: "所以众数比平均数和正中间走得更远。它有两个缺点。接下来，一个两种规格并列的周一。"
  s3_zh_hk: "所以眾數比起平均數同正中間行得更遠。佢有兩個缺點。跟住，一個兩種規格並列嘅星期一。"
