- id: good
  visual: two_column
  seconds: 48
  kicker: Why It Helps
  kicker_en: Why It Helps
  kicker_zh: 它好在哪里
  kicker_zh_hk: 佢好喺邊度
  title_en: It extends to labels
  title_zh: 它也能用到标签上
  title_zh_hk: 佢都用到標籤上
  left_en: 'Numbers: count the value'
  left_zh: '数字：清点那个数'
  left_zh_hk: '數字：清點嗰個數'
  right_en: 'Labels: count the category'
  right_zh: '标签：清点那个类别'
  right_zh_hk: '標籤：清點嗰個類別'
  s1_en: >-
    The mode started as a count of a number. When a value repeats, you can count how often it appears.
  s1_zh: >-
    众数起初是清点一个数。一个数重复出现时，你可以清点它出现多少次。
  s1_zh_hk: >-
    眾數起初係清點一個數。一個數重複出現時，你可以清點佢出現幾多次。
  s2_en: >-
    It extends to categorical data, labels you cannot add. Small, Medium, and Large are labels. You can still count them.
    The same is true of drink names. Americano, latte, cappuccino. No average drink, and no middle drink. But each order still adds one to a count. The highest count is the mode.
  s2_zh: >-
    它也能用到分类数据上，就是不能相加的标签。小杯、中杯、大杯是标签。你仍然可以清点。
    饮品的名字也一样。美式、拿铁、卡布奇诺。没有平均的饮品，也没有正中间的饮品。但每一笔订单仍然给一个计数加一。最高的计数就是众数。
  s2_zh_hk: >-
    佢都用到分類數據上，就係唔可以加埋嘅標籤。細杯、中杯、大杯係標籤。你仍然可以清點。
    飲品嘅名都一樣。美式、拿鐵、卡布奇諾。冇平均嘅飲品，亦冇正中間嘅飲品。但每一筆訂單仍然畀一個計數加一。最高嘅計數就係眾數。
  s3_en: >-
    So the mode reaches further than the average or the middle. It has two drawbacks. What if two sizes share the top count?
  s3_zh: >-
    所以众数比平均数和正中间走得更远。它有两个缺点。要是两种规格并列最高，会怎样？
  s3_zh_hk: >-
    所以眾數比起平均數同正中間行得更遠。佢有兩個缺點。如果兩種規格並列最高，會點？
