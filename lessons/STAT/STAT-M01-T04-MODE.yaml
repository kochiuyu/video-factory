  right_zh_hk: "中杯有 280 筆"
  s1_en: "So which lid do you run largest? Suppose you split the run equally across the three sizes. Small has only 40 orders. Those lids pile up."
  s1_zh: "那么哪一种安排最大？假设你把批次平均分给三种规格。小杯只有40笔。那些盖会堆着。"
  s1_zh_hk: "咁邊一種安排最大？假設你將批次平均分畀三種規格。細杯只有40筆。嗰啲蓋會堆住。"
  s2_en: "Medium has 280 orders. An equal share is not enough. Medium runs out, while Small lids sit in the box."
  s2_zh: "中杯有280笔。平均的那一份不够。中杯会卖完，小杯盖还在箱子里。"
