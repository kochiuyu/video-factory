quiz:
- id: Q1
  type: multiple_choice
  question_en: How do you identify the mode in a customer sales record?
  question_zh: 如何从顾客销售记录中找出众数？
  question_zh_hk: 點樣喺顧客銷售記錄入面搵出眾數？
  options_en:
  - 'A: Add up all the numbers and divide by the customer count.'
  - 'B: Sort all values in line and pick the exact middle item.'
  - 'C: Count how often each value or category appears and select the one or more with the highest frequency.'
  - 'D: Subtract the smallest order size from the largest order size.'
  options_zh:
  - 'A: 把所有数字加起来，除以顾客总人数。'
  - 'B: 把所有数值排成一列，挑出正中间的那一个。'
  - 'C: 统计每个数值或类别出现的次数，选出频数最高的一个或多个选项。'
  - 'D: 用最大订单量减去最小订单量。'
  options_zh_hk:
  - 'A: 將所有數字加埋一齊，除以顧客總人數。'
  - 'B: 將所有數值排成一列，揀出正中間嗰一個。'
  - 'C: 統計每個數值或者類別出現嘅次數，揀出頻數最高嘅一個或者多個選項。'
  - 'D: 用最大訂單量減去最少訂單量。'
  answer: C
  explanation_en: The mode is determined by frequency. A dataset may have one mode, more than one mode when top frequencies tie, or no mode when no value repeats.
  explanation_zh: 众数由频数决定。最高频数没有并列时有一个众数；最高频数并列时可以有多个众数；没有任何数值重复时则可能没有众数。
  explanation_zh_hk: 眾數由頻數決定。最高頻數冇並列嗰陣有一個眾數；最高頻數並列嗰陣可以有多個眾數；冇任何數值重複嗰陣就可能冇眾數。
- id: Q2
  type: multiple_choice
  question_en: Why is the mode appropriate for choosing which categorical cup lid to prioritize?
  question_zh: 为什么众数适合用来决定优先准备哪一类杯盖？
  question_zh_hk: 點解眾數適合用嚟決定優先準備邊一類杯蓋？
  options_en:
  - 'A: Categories such as Small, Medium, and Large cannot be meaningfully averaged, but their frequencies can be counted.'
  - 'B: The mode is always mathematically larger than the mean.'
  - 'C: The median of Small, Medium, and Large is always the middle label, so mode is unnecessary.'
  - 'D: Averaging lid sizes gives a factory SKU you can order directly.'
  options_zh:
  - 'A: 小杯、中杯和大杯等类别无法进行有意义的平均，但可以统计各自的频数。'
  - 'B: 众数在数学上总是大于算术平均数。'
  - 'C: 小、中、大的中位数永远是中间那个标签，所以不需要众数。'
  - 'D: 把杯盖尺寸平均一下，就能得到可直接下单的工厂货号。'
  options_zh_hk:
  - 'A: 細杯、中杯同大杯等類別冇辦法做有意義嘅平均，但可以統計各自嘅頻數。'
  - 'B: 眾數喺數學上總是大多過算術平均數。'
  - 'C: 細、中、大嘅中位數永遠係中間嗰個標籤，所以唔使眾數。'
  - 'D: 將杯蓋尺寸平均一下，就可以得到可直接落單嘅工廠貨號。'
  answer: A
  explanation_en: 'For nominal categories, mean and median are not meaningful, but frequency is. The middle label is not a real median of lid sizes, and averaging categories does not produce an orderable SKU. The mode identifies the most common category.'
  explanation_zh: '对于名义分类数据，平均数与中位数没有意义，但频数有意义。中间标签并不是杯盖尺寸的真正中位数，把类别做平均也得不到可下单的货号。众数找出最常见的类别。'
  explanation_zh_hk: '對於名義分類數據，平均數同中位數冇意義，但頻數有意義。中間標籤並唔係杯蓋尺寸嘅真正中位數，將類別做平均亦得不到可落單嘅貨號。眾數搵出最常見嘅類別。'
beats:
- id: hook
  visual: title_card
  seconds: 54
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the mode?
  title_zh: 什么是众数？
  title_zh_hk: 咩係眾數？
  en: >-
    Imagine you manage a coffee shop. The factory asks which lid should get the largest run before Monday.
    You sell Small, Medium, and Large. Each needs its own lid. A wrong mix means Medium runs out while Small lids pile up, even if the total looks enough.
    Which size do customers choose most? The number that answers that is called the mode. What is the mode?
  zh: >-
    假设你管着一家咖啡店。工厂问，周一之前哪一种杯盖该安排最大的批次。
    你卖小杯、中杯和大杯。每一种都要自己的盖。规格错了，中杯会卖完，小杯盖会堆着，就算总数看起来够。
    顾客最常选哪一种？回答这个问题的数叫作众数。什么是众数？
  zh_hk: >-
    假設你管緊一間咖啡店。工廠問，星期一之前邊一種杯蓋該安排最大嘅批次。
    你賣細杯、中杯同大杯。每一種都要自己嘅蓋。規格錯咗，中杯會賣晒，細杯蓋會堆住，就算總數睇落夠。
    顧客最常揀邊一種？回答呢個問題嘅數叫做眾數。咩係眾數？
