  s1_en: "One more case, so the rule is complete. Suppose three orders, one of each size. Small once, Medium once, Large once."
  s1_zh: "再补一种情况，规则才完整。假设三笔订单，每种规格一笔。小杯一次，中杯一次，大杯一次。"
  s1_zh_hk: "再補一種情況，規則先完整。假設三筆訂單，每種規格一筆。細杯一次，中杯一次，大杯一次。"
  s2_en: "No size appears more often than the others. There is no mode. The count does not pick a winner."
  s2_zh: "没有一种比其他的出现得更多。没有众数。这个清点选不出赢家。"
  s2_zh_hk: "冇一種多過其他出現。冇眾數。呢個清點揀唔出贏家。"
  s3_en: "Two drawbacks. There may be more than one mode, as on the tie. There may be no mode, as when nothing repeats. Hence we also read the mode from grouped data. Next, five days that never repeat."
  s3_zh: "两个缺点。可能有不止一个众数，就像刚才的并列。也可能没有众数，就像没有任何重复。所以我们也从分组数据里读众数。接下来，五天都不重复。"
  s3_zh_hk: "兩個缺點。可能有多過一個眾數，好似頭先嘅並列。亦可能冇眾數，好似冇任何重複。所以我哋都由分組數據入面讀眾數。跟住，五日都唔重複。"
