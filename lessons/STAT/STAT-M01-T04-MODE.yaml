  kicker: Grouped Data
  kicker_en: Grouped Data
  kicker_zh: 分组数据
  kicker_zh_hk: 分組數據
  title_en: Group days. Count the groups.
  title_zh: 把这些天分组。清点各组。
  title_zh_hk: 將呢啲日分組。清點各組。
  labels_en: 'Under 100;100 to 150'
  labels_zh: '100 以下;100 到 150'
  labels_zh_hk: '100 以下;100 到 150'
  counts: 2;3
  mark: tallest
  footer_en: 'Modal class = 100 to 150'
  footer_zh: '众数组 = 100 到 150'
  footer_zh_hk: '眾數組 = 100 到 150'
  s1_en: >-
    Suppose five days sold 52, 64, 100, 136, and 148 cups. Every day is different. Nothing repeats, so there is no mode. Put the days into groups on the axis.
  s1_zh: >-
    假设五天卖了52、64、100、136和148杯。每一天都不同。没有重复，所以没有众数。把这些天放到轴上的组别里。
  s1_zh_hk: >-
    假設五日賣咗52、64、100、136同148杯。每一日都唔同。冇重複，所以冇眾數。將呢啲日放到軸上嘅組別入面。
  s2_en: >-
    Under 100 has two days, 52 and 64. From 100 to 150 has three days, 100, 136, and 148. No day sold over 150, so that empty band stays off the chart. We have not added the cups. We have only counted the groups.
  s2_zh: >-
    100以下有两天，52和64。100到150有三天，100、136和148。没有一天超过150，所以空的那一组不画在图上。我们没有把杯数加起来。只是清点了每一组。
  s2_zh_hk: >-
    100以下有兩日，52同64。100到150有三日，100、136同148。冇一日超過150，所以空嗰一組唔畫喺圖上。我哋冇將杯數加起嚟。只係清點咗每一組。
  s3_en: >-
    The group with the highest count is the modal class. Here it is 100 to 150. That is the mode for grouped data. It does not name one day. It names the busiest band.
  s3_zh: >-
    次数最高的那一组叫作众数组。这里是100到150。这就是分组数据的众数。它不说出某一天。它说出最忙的那一段。
  s3_zh_hk: >-
    次數最高嗰一組叫做眾數組。呢度係100到150。呢個就係分組數據嘅眾數。佢唔講出某一日。佢講出最忙嗰一段。
- id: defn
  visual: definition_card
  seconds: 44
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Mode, written down
  title_zh: 众数，写成定义
  title_zh_hk: 眾數，寫成定義
  formula: 'Mode = most frequent value or category'
  formula_zh: '众数 = 频数最高的数值或类别'
  formula_zh_hk: '眾數 = 頻數最高嘅數值或類別'
  gloss: 'Mon: Medium, 280. Grouped: 100–150.'
  gloss_zh: '周一：中杯，280。分组：100 到 150。'
  gloss_zh_hk: '星期一：中杯，280。分組：100 到 150。'
  s1_en: >-
    Here is the written form. Count how often each value, or each category, appears. The one with the highest count is the mode.
    If two tie, both are modes. If nothing repeats, there is no mode, so group the values and read the busiest band.
  s1_zh: >-
    这就是写法。清点每个数，或者每个类别，出现多少次。次数最高的那个就是众数。
    如果两个并列，两个都是。如果没有重复，就没有众数，所以把这些数分组，读出最忙的那一段。
  s1_zh_hk: >-
    呢個就係寫法。清點每個數，或者每個類別，出現幾多次。次數最高嗰個就係眾數。
    如果兩個並列，兩個都係。如果冇重複，就冇眾數，所以將呢啲數分組，讀出最忙嗰一段。
  s2_en: >-
    On the first Monday the mode is Medium, 280 orders. It is about how often, not about adding the sizes. This is the definition. It is not an order to make only Medium lids. So why keep it, and what is it not?
  s2_zh: >-
    第一个周一，众数是中杯，280笔。它看的是出现多少次，不是把规格加起来。这就是定义。它不是只做中杯盖的指令。那为什么还要留着它，它又不是什么？
  s2_zh_hk: >-
    第一個星期一，眾數係中杯，280筆。佢睇嘅係出現幾多次，唔係將規格加起嚟。呢個就係定義。佢唔係只做中杯蓋嘅指令。咁點解仲要留住佢，佢又唔係乜？
- id: limit
  visual: two_column
  seconds: 48
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: Prioritize mode. Stock the rest.
  title_zh: 优先众数。其余也备。
  title_zh_hk: 優先眾數。其餘都備。
  left_en: Shows the most common size
  left_zh: 说出最常选的规格
  left_zh_hk: 講出最常揀嘅規格
  right_en: Not the full lid order
  right_zh: 不是整张杯盖订单
  right_zh_hk: 唔係成張杯蓋訂單
  s1_en: >-
    So why keep the mode? And what is it not?
  s1_zh: >-
    那么为什么还要留着众数？它又不是什么？
  s1_zh_hk: >-
    咁點解仲要留住眾數？佢又唔係乜？
  s2_en: >-
    It tells the factory which lid customers choose most, and it works when the labels cannot be added. Medium should get the largest run.
  s2_zh: >-
    它告诉工厂顾客最常选哪一种盖，而且标签不能相加时它也能用。中杯该安排最大的批次。
  s2_zh_hk: >-
    佢話工廠知顧客最常揀邊一種蓋，而且標籤唔可以加埋時佢都用得。中杯該安排最大嘅批次。
  s3_en: >-
    But the mode is not an order to make only Medium. Small and Large still have 140 orders. Those customers need lids too. Two different mixes can also share the same mode. And 280 is not an order to make exactly 280 Medium lids. It has no safety stock in it. Keep the full table in view.
  s3_zh: >-
    但众数不是只做中杯盖的指令。小杯和大杯还有140笔。那些顾客也要盖。两种不同的组合，也可能有同一个众数。而且280不是正好做280个中杯盖的指令。它里面没有安全库存。所以还要看着整张表。
  s3_zh_hk: >-
    但眾數唔係只做中杯蓋嘅指令。細杯同大杯仲有140筆。嗰啲顧客都要蓋。兩種唔同嘅組合，亦可能有同一個眾數。而且280唔係啱啱做280個中杯蓋嘅指令。佢入面冇安全庫存。所以仲要睇住成張表。
- id: answer
  visual: takeaway
  seconds: 52
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Run Medium largest. Stock rest.
  title_zh: 中杯最大。其余也备。
  title_zh_hk: 中杯最大。其餘都備。
  q1_en: Which lid should get the largest run?
  q1_zh: 哪一种杯盖该安排最大的批次？
  q1_zh_hk: 邊一種杯蓋該安排最大嘅批次？
  q2_en: What else is needed before you set the run?
  q2_zh: 定批次之前，还需要什么？
  q2_zh_hk: 定批次之前，仲需要咩？
  s1_en: >-
    Back to the question. Medium. It appears 280 times, more than Small at 40 and Large at 100. Medium is the mode, so it gets the largest run.
  s1_zh: >-
    回到问题。中杯。它出现了280次，多于小杯的40和大杯的100。中杯是众数，所以它安排最大的批次。
  s1_zh_hk: >-
    返到問題。中杯。佢出現咗280次，多過細杯嘅40同大杯嘅100。中杯係眾數，所以佢安排最大嘅批次。
  s2_en: >-
    A tie means two modes, and both get a large run. No repeat means no mode, and the count does not pick. Use the mode when the labels cannot be added, and you need the most common choice.
  s2_zh: >-
    并列就是两个众数，两个都安排大的批次。没有重复就没有众数，清点选不出。标签不能相加，而你要最常见的选择时，用众数。
  s2_zh_hk: >-
    並列就係兩個眾數，兩個都安排大嘅批次。冇重複就冇眾數，清點揀唔出。標籤唔可以加埋，而你要最常見嘅選擇時，用眾數。
  s3_en: >-
    Before you set the run, still look at Small and Large. These numbers describe only the Monday we supposed. The mode says which size appears most. It does not write the full order by itself.
  s3_zh: >-
    定批次之前，还是要看小杯和大杯。这些数只描述我们假设的这个周一。众数说的是哪一种出现得最多。它不能单独写下整张订单。
  s3_zh_hk: >-
    定批次之前，仲係要睇細杯同大杯。呢啲數只係描述我哋假設嘅呢個星期一。眾數講嘅係邊一種出現得最多。佢唔可以單獨寫低成張訂單。
