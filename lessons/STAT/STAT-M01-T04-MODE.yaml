    細杯40。中杯150。大杯150。中杯同大杯並列最高。兩根柱一樣高。
  s3_en: >-
    There is no single winner. Both are modes. Two sizes should get the large run, not one. When two categories tie for the highest count, we say the file is bimodal. What if nothing repeats at all?
  s3_zh: >-
    没有唯一的赢家。两个都是众数。两种规格都该安排大的批次，不是一种。当两个类别并列最高时，我们说这份记录是双峰的。要是完全没有重复，会怎样？
  s3_zh_hk: >-
    冇唯一嘅贏家。兩個都係眾數。兩種規格都該安排大嘅批次，唔係一種。當兩個類別並列最高時，我哋話呢份記錄係雙峰嘅。如果完全冇重複，會點？
- id: none
  visual: freq_bars
  seconds: 42
  kicker: No Mode
  kicker_en: No Mode
  kicker_zh: 没有众数
  kicker_zh_hk: 冇眾數
  title_en: Every bar the same height
  title_zh: 每根柱一样高
  title_zh_hk: 每根柱一樣高
  labels_en: Small;Medium;Large
  labels_zh: 小杯;中杯;大杯
  labels_zh_hk: 細杯;中杯;大杯
  counts: 1;1;1
  mark: none
  footer_en: No mode
  footer_zh: 没有众数
  footer_zh_hk: 冇眾數
  s1_en: >-
    One more case, so the rule is complete. Suppose three orders, one of each size. Small once, Medium once, Large once.
  s1_zh: >-
    再补一种情况，规则才完整。假设三笔订单，每种规格一笔。小杯一次，中杯一次，大杯一次。
  s1_zh_hk: >-
    再補一種情況，規則先完整。假設三筆訂單，每種規格一筆。細杯一次，中杯一次，大杯一次。
  s2_en: >-
    The three bars are the same height. No size appears more often than the others. The count does not pick a winner.
  s2_zh: >-
    三根柱一样高。没有一种比其他的出现得更多。这个清点选不出赢家。
  s2_zh_hk: >-
    三根柱一樣高。冇一種多過其他出現。呢個清點揀唔出贏家。
  s3_en: >-
    There is no mode. Two drawbacks. There may be more than one mode, as on the tie. There may be no mode, as when nothing repeats. When nothing repeats, how do we still read a mode? Put the days into groups.
  s3_zh: >-
    没有众数。两个缺点。可能有不止一个众数，就像刚才的并列。也可能没有众数，就像没有任何重复。没有重复时，怎样还能读出众数？把这些天放进组别里。
  s3_zh_hk: >-
    冇眾數。兩個缺點。可能有多過一個眾數，好似頭先嘅並列。亦可能冇眾數，好似冇任何重複。冇重複時，點樣仲可以讀出眾數？將呢啲日放進組別入面。
