  s1_en: "Here are Monday's orders, grouped by size. Small, 40 orders. Medium, 280 orders. Large, 100 orders."
  s1_zh: "这就是周一的订单，按规格分好。小杯，40笔。中杯，280笔。大杯，100笔。"
  s1_zh_hk: "呢個就係星期一嘅訂單，按規格分好。細杯，40筆。中杯，280筆。大杯，100筆。"
  s2_en: "These are labels, not cups you can add. Small plus Medium is not a size. You cannot share them equally and get a lid the factory can make."
  s2_zh: "这些是标签，不是可以相加的杯数。小杯加中杯不是一种规格。你不能把它们平均分，得到一个工厂能做的盖。"
  s2_zh_hk: "呢啲係標籤，唔係可以加埋嘅杯數。細杯加中杯唔係一種規格。你唔可以將佢哋平均分，得到一個工廠做得嘅蓋。"
  s3_en: "So neither the average nor the middle of a line can answer the factory. Next we see why."
  s3_zh: "所以平均数和排队的正中间都回答不了工厂。接下来看为什么。"
  s3_zh_hk: "所以平均數同排隊嘅正中間都回答唔到工廠。跟住睇點解。"
- id: why_not
  visual: two_column
  seconds: 48
  kicker: Why Not
  kicker_en: Why Not
  kicker_zh: 为什么不行
  kicker_zh_hk: 點解唔得
  title_en: Mean and median need the wrong thing
  title_zh: 平均数和中位数要的东西不对
  title_zh_hk: 平均數同中位數要嘅嘢唔啱
  left_en: "Mean needs numbers you can add"
  left_zh: "平均数需要可以相加的数"
  left_zh_hk: "平均數需要可以加埋嘅數"
  right_en: "Median needs a real order"
  right_zh: "中位数需要真正的次序"
  right_zh_hk: "中位數需要真正嘅次序"
  s1_en: "The average needs numbers you can add, then share. Small plus Medium is not a size. There is no average lid the factory can make."
  s1_zh: "平均数需要可以相加的数，然后再平分。小杯加中杯不是一种规格。没有一个工厂能做的平均杯盖。"
  s1_zh_hk: "平均數需要可以加埋嘅數，然後再平分。細杯加中杯唔係一種規格。冇一個工廠做得嘅平均杯蓋。"
  s2_en: "The median needs a real line. You can force Small, Medium, Large into an order, but the middle of that line is not the size customers choose most. And drink names have no order at all. Americano, latte, cappuccino. No middle drink."
  s2_zh: "中位数需要真正的一队。你可以把小杯、中杯、大杯硬排成一队，但那一队的正中间，不是顾客选得最多的规格。饮品的名字更没有次序。美式、拿铁、卡布奇诺。没有正中间的饮品。"
  s2_zh_hk: "中位數需要真正嘅一隊。你可以將細杯、中杯、大杯硬排成一隊，但嗰一隊嘅正中間，唔係顧客揀得最多嘅規格。飲品嘅名更加冇次序。美式、拿鐵、卡布奇諾。冇正中間嘅飲品。"
  s3_en: "So mean and median do not fit this question. We need a count of how often each size appears. Next we see what an equal run does."
  s3_zh: "所以平均数和中位数都不适合这个问题。我们需要清点每一种规格出现多少次。接下来看平均分配的批次会怎样。"
  s3_zh_hk: "所以平均數同中位數都唔適合呢個問題。我哋需要清點每一種規格出現幾多次。跟住睇平均分配嘅批次會點。"
- id: plans
  visual: two_column
  seconds: 44
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两套批次
  kicker_zh_hk: 兩套批次
  title_en: Equal lids. Medium runs out.
  title_zh: 平均分配。中杯卖完。
  title_zh_hk: 平均分配。中杯賣晒。
