  s1_en: Do the same for Tuesday. As written, the shops sold 360, 380, 350, and 390.
  s1_zh: 星期二也照做一遍。按写下的顺序，四家店卖了360、380、350和390。
  s1_zh_hk: 星期二都照做一次。照寫低嘅次序，四間店賣咗360、380、350同390。
  s2_en: Sort them. Shop C at 350, Shop A at 360, Shop B at 380, and Shop D at 390.
  s2_zh: 排好序：C店350，A店360，B店380，D店390。
  s2_zh_hk: 排好次序：C店350，A店360，B店380，D店390。
  s3_en: >-
    The ends are 350 and 390. 390 minus 350 is 40 cups. Monday stretches across 110 cups; Tuesday only 40.
    Same average, yet Monday is almost three times as wide. This distance between the two ends has a name.
  s3_zh: 两头是350和390。390减350，等于40杯。星期一要撑开110杯，星期二只有40杯。平均数一样，星期一却宽了差不多三倍。两头之间的这段距离，有一个名字。
  s3_zh_hk: 兩頭係350同390。390減350，即係40杯。星期一要撐110杯，星期二得40杯。平均數一樣，星期一就闊咗差唔多三倍。兩頭之間呢段距離，有個名。
- id: name_range
  visual: title_card
  seconds: 20
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Range
  title_zh: 极差
  title_zh_hk: 全距
  en: Range. That is the name. Take the largest value, subtract the smallest, and what is left is the range. Monday's range is 110 cups. Tuesday's is 40. So how do we write that for any set of numbers?
  zh: 极差，这就是它的名字。用最大的数减去最小的数，剩下的就是极差。星期一的极差是110杯，星期二是40杯。那换成任何一组数，要怎么写？
  zh_hk: 全距，呢個就係佢個名。用最大嘅數減最細嘅數，剩低嘅就係全距。星期一嘅全距係110杯，星期二係40杯。咁換成任何一組數，又點樣寫？
- id: defn
  visual: definition_card
  seconds: 38
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Range, written down
  title_zh: 把极差写下来
  title_zh_hk: 將全距寫低
  formula_en: Range = maximum − minimum
  formula_zh: 极差 = 最大值 − 最小值
  formula_zh_hk: 全距 = 最大值 − 最小值
  gloss_en: 'Monday: 110 cups. Tuesday: 40 cups.'
  gloss_zh: 星期一 110 杯，星期二 40 杯
  gloss_zh_hk: 星期一 110 杯，星期二 40 杯
  s1_en: >-
    Here is the definition. Find the largest value, the maximum. Find the smallest value, the minimum. Then subtract: maximum minus minimum.
    The answer keeps the unit of the data, here cups. The range is the simplest measure of spread, which simply means how far apart the numbers sit.
  s1_zh: 定义是这样的：找出最大的数，就是最大值；找出最小的数，就是最小值；然后相减，最大值减最小值。答案的单位跟数据一样，这里是杯。极差是最简单的一种离散程度指标，离散程度就是这些数分得有多开。
  s1_zh_hk: 定義係噉：搵出最大嘅數，即係最大值；搵出最細嘅數，即係最小值；跟住相減，最大值減最小值。答案嘅單位同數據一樣，呢度係杯。全距係最簡單嘅一種離散程度指標，離散程度即係啲數分得幾開。
  s2_en: For Monday, 420 minus 310 is 110 cups. For Tuesday, 390 minus 350 is 40 cups. Notice what we used each day, two numbers out of four. So what happened to the other two?
  s2_zh: 星期一，420减310是110杯；星期二，390减350是40杯。留意一下，每天四个数，我们只用了两个。另外两个去哪儿了？
  s2_zh_hk: 星期一，420減310係110杯；星期二，390減350係40杯。留意吓，每日四個數，我哋淨係用咗兩個。另外兩個去咗邊？
- id: ends
  visual: two_column
  seconds: 44
  kicker: Only the Ends
  kicker_en: Only the Ends
  kicker_zh: 只看两头
  kicker_zh_hk: 淨係睇兩頭
  title_en: Only the two ends count
  title_zh: 只有两头算数
  title_zh_hk: 淨係兩頭計數
  left_en: 'Uses: 310 and 420'
  left_zh: 用到：310 和 420
  left_zh_hk: 用到：310 同 420
  right_en: 'Skips: 370 and 380'
  right_zh: 没用：370 和 380
  right_zh_hk: 冇用：370 同 380
  s1_en: They were never used. The range reads the two ends of the line and nothing else.
  s1_zh: 它们根本没被用上。极差只读这条线的两头，别的都不看。
  s1_zh_hk: 佢哋根本冇用到。全距淨係讀條線嘅兩頭，其他乜都唔睇。
  s2_en: On Monday, it used Shop B's 310 and Shop C's 420. Those two numbers alone decide the answer, 110.
  s2_zh: 星期一，它只用了B店的310和C店的420。答案110，完全由这两个数决定。
  s2_zh_hk: 星期一，佢淨係用咗B店嘅310同C店嘅420。答案110，完全由呢兩個數決定。
  s3_en: >-
    Shop D's 370 and Shop A's 380 were skipped. Suppose both of them moved anywhere between 310 and 420; the range would still be 110.
    So the range says how wide the line is, but nothing about where the shops in between sit.
    And if only the ends matter, what happens when one end moves a long way?
  s3_zh: D店的370和A店的380都没算进去。就算这两家店在310到420之间随便怎么变，极差还是110。所以极差只说明这条线有多宽，中间的店落在哪里，它一点也不知道。既然只有两头算数，要是其中一头跑得很远，会怎样？
  s3_zh_hk: D店嘅370同A店嘅380都冇計入去。就算呢兩間店喺310到420之間點樣變，全距都仲係110。所以全距淨係話你知條線有幾闊，中間啲店喺邊度，佢完全唔知。既然淨係兩頭計數，如果其中一頭走得好遠，會點？
- id: far
  visual: rank_line
  seconds: 42
  kicker: One Far Shop
  kicker_en: One Far Shop
  kicker_zh: 一家很远的店
  kicker_zh_hk: 一間好遠嘅店
  title_en: Add Shop E, a 24-hour site
  title_zh: 加入24小时营业的E店
  title_zh_hk: 加入24小時營業嘅E店
  values: 380;310;420;370;4,200
  break: last
  labels_en: Shop A;Shop B;Shop C;Shop D;Shop E
  labels_zh: A店;B店;C店;D店;E店
  labels_zh_hk: A店;B店;C店;D店;E店
  order: sorted
  mark: ends
  span: ends
  span_en: 4,200 − 310 = 3,890 cups
  span_zh: 4,200 − 310 = 3,890 杯
  span_zh_hk: 4,200 − 310 = 3,890 杯
  s1_en: Suppose the company also counts Shop E, a 24-hour site. On the same Monday, it sold 4,200 cups. Here are all five shops as written.
  s1_zh: 假设公司把E店也算进来，这是一家24小时营业的店。同一个星期一，它卖了4,200杯。这是五家店按写下顺序的数字。
  s1_zh_hk: 假設公司將E店都計埋入嚟，呢間係24小時營業嘅店。同一個星期一，佢賣咗4,200杯。呢度係五間店照寫低次序嘅數字。
  s2_en: Sort them. The four street shops sit together at the low end, from 310 to 420. Shop E stands alone at the top, at 4,200.
  s2_zh: 排好序。四家街边店挤在低的一头，从310到420。E店一家独自站在最高处，4,200杯。
  s2_zh_hk: 排好次序。四間街邊店擠埋喺低嗰頭，由310到420。E店自己一間企喺最高嗰度，4,200杯。
  s3_en: >-
    Read the ends again. The minimum is still 310, but the maximum is now 4,200. 4,200 minus 310 is 3,890 cups.
    One shop moved the range from 110 to 3,890. So which number is right?
  s3_zh: 再看两头。最小值还是310，最大值却变成了4,200。4,200减310，等于3,890杯。一家店就把极差从110推到了3,890。那哪个数才对？
  s3_zh_hk: 再睇兩頭。最小值仲係310，但最大值變咗4,200。4,200減310，即係3,890杯。一間店就將全距由110推到3,890。咁邊個數先啱？
- id: groups
  visual: two_column
  seconds: 42
  kicker: Two Groups
  kicker_en: Two Groups
  kicker_zh: 两组店
  kicker_zh_hk: 兩組店
  title_en: Both right, different shops
  title_zh: 都对，包括的店不同
  title_zh_hk: 都啱，包括嘅店唔同
  left_en: 'Street shops: 110 cups'
  left_zh: 街边店：110 杯
  left_zh_hk: 街邊店：110 杯
  right_en: 'With Shop E: 3,890 cups'
  right_zh: 加上E店：3,890 杯
  right_zh_hk: 加埋E店：3,890 杯
  s1_en: Both. Each subtraction is correct. They answer the question for different groups of shops.
  s1_zh: 两个都对，每一道减法都没算错。只是它们回答的，是不同一组店的问题。
  s1_zh_hk: 兩個都啱，每一條減數都冇計錯。只不過佢哋答緊嘅，係唔同一組店嘅問題。
  s2_en: The four street shops span 110 cups. That is the stretch a delivery plan for ordinary street shops has to cover.
  s2_zh: 四家街边店的跨度是110杯。给普通街边店定送货方案，要照顾的就是这段差距。
  s2_zh_hk: 四間街邊店嘅跨度係110杯。幫普通街邊店定送貨方案，要照顧嘅就係呢段差距。
  s3_en: >-
    Add Shop E, and the range becomes 3,890 cups, about 35.4 times as large. That number describes a group that mixes street shops with a 24-hour site.
    It is not how far apart ordinary street shops are. So whenever you report a range, say which shops are included.
  s3_zh: 加上E店，极差就变成3,890杯，大约是原来的35.4倍。这个数描述的，是街边店和24小时店混在一起的一组店，不是普通街边店之间相差多远。所以每次报极差，都要讲清楚算了哪些店。
  s3_zh_hk: 加埋E店，全距就變成3,890杯，大約係原本嘅35.4倍。呢個數講嘅，係街邊店同24小時店撈埋一齊嘅一組店，唔係普通街邊店之間相差幾遠。所以每次報全距，都要講清楚計咗邊幾間店。
- id: limit
  visual: two_column
  seconds: 46
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A stretch, not a typical gap
  title_zh: 是跨度，不是一般差距
  title_zh_hk: 係跨度，唔係一般差距
  left_en: How far a plan must stretch
  left_zh: 一个方案要撑多宽
  left_zh_hk: 一個方案要撐幾闊
  right_en: Not a typical shop's gap
  right_zh: 不是一般门店的差距
  right_zh_hk: 唔係一般店嘅差距
  s1_en: So what does the range tell a manager, and what does it not?
  s1_zh: 那极差到底能告诉经理什么，又不能告诉他什么？
  s1_zh_hk: 咁全距究竟話到經理知啲乜，又話唔到佢知啲乜？
  s2_en: >-
    It tells you how far one plan has to stretch. On Monday, the street shops ran from 310 to 420, so a single delivery size has to cover 110 cups of difference.
    And it is quick: one subtraction.
  s2_zh: 它能告诉你，一个方案要撑多宽。星期一，街边店从310卖到420，所以同一个送货量要照顾110杯的差距。而且算起来很快，一道减法就够了。
  s2_zh_hk: 佢話到你知，一個方案要撐幾闊。星期一，街邊店由310賣到420，所以同一個送貨量要照顧110杯嘅差距。而且計起嚟好快，一條減數就得。
  s3_en: >-
    It does not tell you how far a typical shop sits from the others. A range of 110 does not mean each shop swings by 110 cups;
    only the two end shops are that far apart. And it jumps the moment either end changes, as Shop E showed.
  s3_zh: 它不能告诉你，一般的店跟其他店差多远。极差110，不代表每家店都会上下差110杯，只有两头那两家店才差这么多。而且只要任何一头一变，它就会大跳，E店就是例子。
  s3_zh_hk: 佢話唔到你知，一般嘅店同其他店差幾遠。全距110，唔代表每間店都會上落110杯，淨係兩頭嗰兩間店先差咁多。而且只要任何一頭一變，佢就會大跳，E店就係例子。
- id: answer
  visual: takeaway
  seconds: 66
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 答案
  kicker_zh_hk: 答案
  title_en: One size? Check the range first.
  title_zh: 统一送货？先看极差
  title_zh_hk: 統一送貨？先睇全距
  q1_en: Can one delivery fit every shop?
  q1_zh: 一个送货量能照顾所有店吗？
  q1_zh_hk: 一個送貨量啱唔啱晒所有店？
  q2_en: When can the range mislead?
  q2_zh: 极差什么时候会误导人？
  q2_zh_hk: 全距幾時會誤導人？
  s1_en: Back to the morning truck. Can one delivery size fit every shop? The average alone cannot tell you. It was 370 cups on both Monday and Tuesday.
  s1_zh: 回到早上那辆货车。一个送货量，能不能照顾所有店？只看平均数答不了，星期一和星期二都是370杯。
  s1_zh_hk: 返去朝早嗰架貨車。一個送貨量，啱唔啱晒所有店？淨係睇平均數答唔到，星期一同星期二都係370杯。
  s2_en: >-
    The range can. Sort the shops, then take the maximum minus the minimum. Tuesday's range is 40 cups, so one size of 370 works.
    Monday's range is 110 cups, so the same size leaves Shop C 50 short and Shop B with 60 to throw away.
    Check the range before you send everyone the same amount.
  s2_zh: 极差答得了。先把店排好，再用最大值减最小值。星期二的极差是40杯，所以统一送370行得通。星期一的极差是110杯，同样的量会让C店缺50杯，B店扔掉60杯。给每家店送同样的量之前，先看一看极差。
  s2_zh_hk: 全距答得到。先將啲店排好，再用最大值減最小值。星期二嘅全距係40杯，所以統一送370行得通。星期一嘅全距係110杯，同一個量會搞到C店缺50杯，B店要掉60杯。畀每間店送同一個量之前，先睇吓全距。
  s3_en: >-
    When can the range mislead? It uses only the two ends, so one far shop, like Shop E, can blow it up from 110 to 3,890.
    Say which shops are included, and look at the shops in between, not just the ends.
    These numbers describe only the days we supposed. The range tells you how far one plan must stretch, not what each shop needs.
  s3_zh: 极差什么时候会误导人？它只用两头，所以一家很远的店，比如E店，就能把它从110撑到3,890。报的时候要讲清楚算了哪些店，也要看看中间的店，不要只看两头。这些数字只描述我们假设的这两天。极差告诉你一个方案要撑多宽，而不是每家店各要多少。
  s3_zh_hk: 全距幾時會誤導人？佢淨係用兩頭，所以一間好遠嘅店，好似E店，就可以將佢由110撐到3,890。報嘅時候要講清楚計咗邊幾間店，亦要睇吓中間啲店，唔好淨係睇兩頭。呢啲數字只係描述我哋假設嘅呢兩日。全距話你知一個方案要撐幾闊，而唔係每間店各自要幾多。
