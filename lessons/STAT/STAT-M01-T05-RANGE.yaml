id: STAT-M01-T05-RANGE
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 528
title_en: What is the range?
title_zh: 什么是极差？
title_zh_hk: 咩係全距？
objective_en: Decide whether one delivery size can fit every shop when two days share the same average, find the range as maximum minus minimum, and see why one far shop can dominate it while the shops in between are ignored.
objective_zh: 两天的平均数一样时，判断一个送货量能不能照顾所有店，用最大值减最小值求出极差，并看到为什么一家很远的店就能主导极差，而中间的店完全没算进去。
objective_zh_hk: 兩日嘅平均數一樣時，判斷一個送貨量夠唔夠照顧晒所有店，用最大值減最小值計出全距，並睇到點解一間好遠嘅店就可以主導全距，而中間嘅店完全冇計入去。
