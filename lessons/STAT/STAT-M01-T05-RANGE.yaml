  span_en: 420 − 310 = 110 cups
  span_zh: 420 − 310 = 110 杯
  span_zh_hk: 420 − 310 = 110 杯
  s1_en: Take Monday on its own. Here are the four shops in the order we wrote them, 380, 310, 420, 370. In that order, it is hard to see how far apart they are.
  s1_zh: 先单独看星期一。四家店按刚才写下的顺序：380、310、420、370。这样排，很难看出它们相差多远。
  s1_zh_hk: 先單獨睇星期一。四間店照啱先寫低嘅次序：380、310、420、370。噉樣排，好難睇得出佢哋相差幾遠。
  s2_en: So line them up from the fewest cups to the most. Shop B at 310, Shop D at 370, Shop A at 380, and Shop C at 420. Each shop keeps its own number. We have only sorted.
  s2_zh: 所以把它们从卖得最少排到最多：B店310，D店370，A店380，C店420。每家店的数字都没变，我们只是排了个序。
  s2_zh_hk: 所以將佢哋由賣得最少排到最多：B店310，D店370，A店380，C店420。每間店嘅數字都冇變，我哋只係排咗個次序。
  s3_en: >-
    Now read the two ends. The smallest value is 310; it is called the minimum. The largest is 420, the maximum.
    The distance between them is 420 minus 310, which is 110 cups. On Monday, one plan has to stretch across 110 cups.
  s3_zh: 现在看两头。最小的是310，叫作最小值；最大的是420，叫作最大值。两头相差420减310，等于110杯。星期一，一个方案得撑开110杯的差距。
  s3_zh_hk: 而家睇兩頭。最細嗰個係310，叫做最小值；最大嗰個係420，叫做最大值。兩頭相差420減310，即係110杯。星期一，一個方案要撐得住110杯嘅差距。
