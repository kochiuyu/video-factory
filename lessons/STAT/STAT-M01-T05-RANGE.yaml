quiz:
- id: Q1
  type: multiple_choice
  question_en: How do you calculate the range of store sales?
  question_zh: 如何计算门店销量的极差（全距）？
  question_zh_hk: 點樣計算門店銷量嘅全距？
  options_en:
  - 'A: Add the smallest and largest values and divide by two.'
  - 'B: Subtract the minimum sales value from the maximum sales value.'
  - 'C: Count how many stores reported valid sales numbers.'
  - 'D: Subtract the average sales from the highest store sales.'
  options_zh:
  - 'A: 将最小值与最大值相加，再除以二。'
  - 'B: 用最大销售数值减去最小销售数值。'
  - 'C: 统计有多少家门店上报了有效销售数字。'
  - 'D: 用最高门店销量减去平均销量。'
  options_zh_hk:
  - 'A: 將最小值同最大值加埋，再除以二。'
  - 'B: 用最大銷售數值減去最少銷售數值。'
  - 'C: 統計有幾多間門店上報咗有效銷售數字。'
  - 'D: 用最高門店銷量減去平均銷量。'
  answer: B
  explanation_en: 'The range is the full observed span: Maximum minus Minimum. It uses only the two endpoints and retains the original unit, here cups.'
  explanation_zh: 极差是完整观测跨度：最大值减去最小值。它只使用两个端点，并保留原始单位，这里是杯。
  explanation_zh_hk: 全距係完整觀測跨度：最大值減去最小值。佢只使用兩個端點，並保留原始單位，呢度係杯。
- id: Q2
  type: multiple_choice
  question_en: Why is the range vulnerable when planning staff for regular street shops?
  question_zh: 为什么在为普通街头分店安排人手时，极差容易产生误导？
  question_zh_hk: 點解喺為普通街頭分店安排人手嗰陣，全距好容易產生誤導？
  options_en:
  - 'A: It uses only the minimum and maximum, so one unusual endpoint can dominate while all middle observations are ignored.'
  - 'B: It requires dividing by the total number of stores in the chain.'
  - 'C: The range uses every shop equally, so one extreme cannot dominate.'
  - 'D: The range equals the average of all shop sales.'
  options_zh:
  - 'A: 它只使用最小值与最大值，因此一个异常端点就可能主导结果，而中间所有观测值都被忽略。'
  - 'B: 它必须除以连锁公司旗下的门店总数。'
  - 'C: 极差平等使用每家店，所以单个极端值无法主导结果。'
  - 'D: 极差等于所有门店销量的平均数。'
  options_zh_hk:
  - 'A: 佢只使用最小值同最大值，所以一個異常端點就可能主導結果，而中間所有觀測值都被忽略。'
  - 'B: 佢必須除以連鎖公司旗下嘅門店總數。'
  - 'C: 全距平等使用每間店，所以單一極端值冇辦法主導結果。'
  - 'D: 全距等於所有門店銷量嘅平均數。'
  answer: A
  explanation_en: 'One extreme endpoint can greatly enlarge the range without revealing how the remaining stores are distributed. The range does not use every shop equally and is not the average of sales.'
  explanation_zh: '一个极端端点就能大幅扩大极差，却不会说明其余门店如何分布。极差并不平等使用每家店，也不等于销量的平均数。'
  explanation_zh_hk: '一個極端端點就可以大幅擴大全距，卻唔會說明其餘門店點樣分佈。全距並唔平等使用每間店，亦唔等於銷量嘅平均數。'
beats:
- id: hook
  visual: title_card
  seconds: 46
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the range?
  title_zh: 什么是极差？
  title_zh_hk: 咩係全距？
  en: >-
    Imagine you run four coffee shops, and every morning one truck drops the same number of cups at each shop.
    You know the average day. Is that enough to set the drop? If the shops sell about the same, one size fits them all.
    If they are far apart, the same drop leaves one shop running out by lunch and another throwing cups away at closing.
    Same average, very different mornings. So before you send every shop the same amount, you need to know how far apart the shops are.
    The number that answers that is called the range. What is the range?
  zh: >-
    假设你管着四家咖啡店，每天早上，同一辆货车给每家店送去一样多的杯子。你知道平均一天卖多少。光知道这个，够不够定送货量？
    要是四家店卖得差不多，一个量就全都合适。要是差得很远，同样的送货量会让一家店中午就断货，另一家关门时还得扔掉一堆杯子。
    平均数一样，早上的情况却完全不同。所以，给每家店送同样的量之前，你得先知道这几家店相差多远。回答这个问题的数，叫作极差。什么是极差？
  zh_hk: >-
    假設你管緊四間咖啡店，每朝同一架貨車將一樣咁多嘅杯送去每間店。你知道平均一日賣幾多。淨係知呢個，夠唔夠定送貨量？
    如果四間店賣得差唔多，一個量就啱晒。如果相差好遠，同一個送貨量會搞到一間店晏晝就斷貨，另一間收舖嗰陣仲要掉一堆杯。
    平均數一樣，朝早嘅情況就完全唔同。所以，畀每間店送同一個量之前，你要先知道呢幾間店相差幾遠。答到呢個問題嘅數，就叫做全距。咩係全距？
