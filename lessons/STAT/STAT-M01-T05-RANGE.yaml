  footer_en: 'Both days: 1,480 / 4 = 370'
  footer_zh: 两天都是 1,480 / 4 = 370
  footer_zh_hk: 兩日都係 1,480 / 4 = 370
  s1_en: Suppose these are the four shops on Monday, in cups sold. Shop A sold 380. Shop B sold 310. Shop C sold 420. And Shop D sold 370.
  s1_zh: 假设这是四家店星期一卖出的杯数。A店卖了380杯，B店卖了310杯，C店卖了420杯，D店卖了370杯。
  s1_zh_hk: 假設呢啲係四間店星期一賣出嘅杯數。A店賣咗380杯，B店賣咗310杯，C店賣咗420杯，D店賣咗370杯。
  s2_en: Now Tuesday, same four shops. Shop A sold 360, Shop B 380, Shop C 350, and Shop D 390. Different numbers. But look at the totals.
  s2_zh: 再看星期二，还是这四家店。A店卖了360，B店380，C店350，D店390。数字不一样，可是你看看总数。
  s2_zh_hk: 再睇星期二，都係呢四間店。A店賣咗360，B店380，C店350，D店390。數字唔同，但係你睇吓總數。
  s3_en: >-
    Monday adds up to 1,480 cups, and so does Tuesday. The average is the total divided by the number of shops:
    1,480 divided by 4 is 370 cups, on both days. So does the same average mean the same delivery plan?
  s3_zh: 星期一加起来是1,480杯，星期二也是1,480杯。平均数就是总数除以店的数目：1,480除以4，两天都是370杯。那平均数一样，送货方案也能一样吗？
  s3_zh_hk: 星期一加埋係1,480杯，星期二都係1,480杯。平均數就係總數除以店嘅數目：1,480除以4，兩日都係370杯。咁平均數一樣，送貨方案又係咪可以一樣？
- id: plans
  visual: two_column
  seconds: 50
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两个方案
  kicker_zh_hk: 兩個方案
  title_en: Same average, different plan
  title_zh: 平均一样，方案不同
  title_zh_hk: 平均一樣，方案唔同
  left_en: 'Tuesday: within 20 cups'
  left_zh: 星期二：最多差 20 杯
  left_zh_hk: 星期二：最多差 20 杯
  right_en: 'Monday: 50 short, 60 over'
  right_zh: 星期一：缺 50，多 60
  right_zh_hk: 星期一：缺 50，多 60
  s1_en: Let's test it. Send every shop the average, 370 cups, on both days. Who runs out, and who throws cups away?
  s1_zh: 我们来试一试。两天都给每家店送平均数，370杯。哪家会断货，哪家要扔杯子？
  s1_zh_hk: 我哋試吓。兩日都畀每間店送平均數，370杯。邊間會斷貨，邊間要掉杯？
  s2_en: >-
    On Tuesday, the plan works. Every shop sold between 350 and 390, so 370 is never more than 20 cups off.
    A few spare cups at Shop C, a short wait at Shop D. That is a normal day.
  s2_zh: 星期二，这个方案行得通。每家店都卖了350到390杯，所以370最多只差20杯。C店剩几个杯子，D店的客人稍微等一下，这就是平常的一天。
  s2_zh_hk: 星期二，呢個方案行得通。每間店都賣咗350到390杯，所以370最多淨係差20杯。C店剩低幾個杯，D店啲客等多陣，即係平平常常嘅一日。
  s3_en: >-
    On Monday, the same 370 fails at both ends. Shop C sold 420, so it runs 50 cups short. Shop B sold only 310, so 60 cups go in the bin.
    Same average, very different mornings. The average cannot see the difference. So which number can?
  s3_zh: 星期一，同样的370在两头都出问题。C店卖了420杯，缺了50杯；B店只卖了310杯，60个杯子只能扔掉。平均数一样，早上的情况完全不同。平均数看不出这个差别，那哪个数看得出？
  s3_zh_hk: 星期一，同一個370喺兩頭都出事。C店賣咗420杯，就缺咗50杯；B店淨係賣咗310杯，60個杯要掉落垃圾桶。平均數一樣，朝早嘅情況就完全唔同。平均數睇唔出呢個分別，咁邊個數睇得出？
