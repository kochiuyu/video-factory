quiz:
- id: Q1
  type: multiple_choice
  question_en: Using the nearest-rank method with five ordered values, which observation defines the 80th percentile?
  question_zh: 使用最接近秩法处理五个有序观测值时，哪一个观测值决定第80百分位数？
  question_zh_hk: 使用最接近秩法處理五個有序觀測值嗰陣，邊一個觀測值決定第80百分位數？
  options_en:
  - 'A: The first observation.'
  - 'B: The second observation.'
  - 'C: The fourth observation.'
  - 'D: The fifth observation.'
  options_zh:
  - 'A: 第一个观测值。'
  - 'B: 第二个观测值。'
  - 'C: 第四个观测值。'
  - 'D: 第五个观测值。'
  options_zh_hk:
  - 'A: 第一個觀測值。'
  - 'B: 第二個觀測值。'
  - 'C: 第四個觀測值。'
  - 'D: 第五個觀測值。'
  answer: C
  explanation_en: The nearest-rank position is ceiling(0.80 × 5) = 4, so the fourth ordered observation defines the 80th percentile.
  explanation_zh: 最接近秩位置为向上取整(0.80 × 5) = 4，因此第四个有序观测值决定第80百分位数。
  explanation_zh_hk: 最接近秩位置係向上取整(0.80 × 5) = 4，所以第四個有序觀測值決定第80百分位數。
- id: Q2
  type: multiple_choice
  question_en: What does an 80th-percentile sales threshold of 390 cups mean in this lesson?
  question_zh: 本课中，第80百分位数为390杯代表什么？
  question_zh_hk: 本課入面，第80百分位數係390杯代表咩？
  options_en:
  - 'A: Every shop must sell exactly 390 cups.'
  - 'B: Under the stated method, approximately 80% of observed shops are at or below 390 cups.'
  - 'C: The average shop sells 390 cups.'
  - 'D: The top 80% of shops all sell more than 390 cups.'
  options_zh:
  - 'A: 每家门店都必须刚好卖390杯。'
  - 'B: 按本课说明的方法，约80%的观测门店销量不高于390杯。'
  - 'C: 平均每家门店卖390杯。'
  - 'D: 排名前80%的门店销量都高于390杯。'
  options_zh_hk:
  - 'A: 每間門店都一定要啱啱賣390杯。'
  - 'B: 按本課講明嘅方法，大約80%嘅觀測門店銷量唔高過390杯。'
  - 'C: 平均每間門店賣390杯。'
  - 'D: 排名前80%嘅門店銷量都高過390杯。'
  answer: B
  explanation_en: A percentile is a position statement, not an average or target. Its interpretation depends on the observed comparison group and the stated calculation method.
  explanation_zh: 百分位数描述的是相对位置，不是平均数或硬性目标。它的解释取决于比较总体、统计期间与所采用的计算方法。
  explanation_zh_hk: 百分位數描述嘅係相對位置，唔係平均數或者硬性目標。佢嘅解釋取決於比較總體、統計期間同所採用嘅計算方法。
beats:
- id: hook
  visual: title_card
  seconds: 44
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is a percentile?
  title_zh: 什么是百分位数？
  title_zh_hk: 咩係百分位數？
  en: >-
    Suppose head office wants to learn from its strongest coffee shops, so it will visit them first and see what they do differently.
    Shop D sold 390 cups on Monday. Is that a strong day? On its own, 390 cannot tell you.
    If most shops sold more, you would be copying an ordinary shop. If almost every shop sold less, Shop D is worth the trip.
    So the question is not how big 390 is. It is where 390 stands in the line of shops.
    The number that answers that is called a percentile. What is a percentile?
  zh: >-
    假设总部想向最强的几家咖啡店取经，先去这些店看看它们做对了什么。D店星期一卖了390杯。这算不算强？单看390，你判断不了。
    要是大多数店卖得比它多，你就是在学一家普通的店；要是几乎每家店都卖得比它少，D店就值得去一趟。
    所以问题不是390有多大，而是390在这一排店里站在哪里。回答这个问题的数，叫作百分位数。什么是百分位数？
  zh_hk: >-
    假設總部想向最勁嗰幾間咖啡店取經，先去嗰啲店睇吓佢哋做啱咗乜。D店星期一賣咗390杯。噉算唔算勁？淨係睇390，你判斷唔到。
    如果大部分店都賣得多過佢，你就係去學一間普通嘅店；如果差唔多每間店都賣得少過佢，D店就值得去一轉。
    所以問題唔係390有幾大，而係390喺呢一排店入面企喺邊個位。答到呢個問題嘅數，就叫做百分位數。咩係百分位數？
- id: line
  visual: rank_line
  seconds: 60
  kicker: The Line
  kicker_en: The Line
  kicker_zh: 排一排
  kicker_zh_hk: 排一排
  title_en: Five shops, one Monday
  title_zh: 五家店，同一个星期一
  title_zh_hk: 五間店，同一個星期一
  values: 360;420;280;390;310
  labels_en: Shop A;Shop B;Shop C;Shop D;Shop E
  labels_zh: A店;B店;C店;D店;E店
  labels_zh_hk: A店;B店;C店;D店;E店
  order: sorted
  mark: '4'
  span: 1-4
  span_en: 4 of 5 at or below 390
  span_zh: 五家里有四家不高于 390
  span_zh_hk: 五間入面有四間唔高過 390
  s1_en: >-
    Here are the five shops on that Monday, in the order they were written. Shop A sold 360 cups, Shop B 420, Shop C 280, Shop D 390, and Shop E 310.
    Written like this, can you tell where 390 stands?
  s1_zh: 这是那个星期一的五家店，按写下的顺序：A店卖了360杯，B店420，C店280，D店390，E店310。这样写着，你看得出390站在哪里吗？
  s1_zh_hk: 呢個係嗰個星期一嘅五間店，照寫低嘅次序：A店賣咗360杯，B店420，C店280，D店390，E店310。噉樣寫住，你睇唔睇得出390企喺邊？
  s2_en: >-
    So line them up from the fewest cups to the most, and number the places. Shop C at 280 is first, then Shop E at 310, Shop A at 360, Shop D at 390,
    and Shop B at 420 in fifth place. Each shop keeps its own number; we have only sorted. Values put in order like this are called ordered data.
  s2_zh: 所以把它们从卖得最少排到最多，再给每个位置编号。第一位是C店，280；然后是E店310、A店360、D店390，第五位是B店420。每家店的数字都没变，我们只是排了个序。像这样排好顺序的数，叫作有序数据。
  s2_zh_hk: 所以將佢哋由賣得最少排到最多，再幫每個位編號。第一位係C店，280；跟住係E店310、A店360、D店390，第五位係B店420。每間店嘅數字都冇變，我哋只係排咗個次序。好似噉排好次序嘅數，就叫做有序數據。
  s3_en: >-
    Now find Shop D. It is in place 4. Count the shops at or below 390: Shop C, Shop E, Shop A, and Shop D itself. That is 4 of the 5 shops.
    Is there a quicker way, though? What about the average?
  s3_zh: 现在找D店：它在第4位。数一数不高于390的店：C店、E店、A店，还有D店自己，五家里有四家。不过，有没有更快的办法？平均数行不行？
  s3_zh_hk: 而家搵D店：佢喺第4位。數吓有幾多間唔高過390：C店、E店、A店，仲有D店自己，五間入面有四間。不過，有冇更快嘅方法？平均數得唔得？
- id: why_not
  visual: two_column
  seconds: 52
  kicker: The Average
  kicker_en: The Average
  kicker_zh: 平均数
  kicker_zh_hk: 平均數
  title_en: Above average, but how high?
  title_zh: 高于平均，但排多高？
  title_zh_hk: 高過平均，但排幾高？
  left_en: 'Average 352: D is 38 above'
  left_zh: 平均 352：D店高 38
  left_zh_hk: 平均 352：D店高 38
  right_en: 'Line: D is 4th of 5'
  right_zh: 排序：D店五家里排第四
  right_zh_hk: 排序：D店五間入面排第四
  s1_en: Let's test the average first. Can it tell us where 390 stands?
  s1_zh: 我们先试试平均数。它能告诉我们390站在哪里吗？
  s1_zh_hk: 我哋先試吓平均數。佢話唔話到我哋知390企喺邊？
  s2_en: >-
    The average is the total divided by the number of shops. The five shops add up to 1,760 cups, and 1,760 divided by 5 is 352.
    Shop D is 38 cups above it. That sounds good. But it tells you how far, not how many shops Shop D beat.
    One very big shop could pull the average above 390, while Shop D still beats the same three shops.
  s2_zh: 平均数就是总数除以店的数目。五家店加起来是1,760杯，1,760除以5，等于352。D店比它高38杯，听起来不错。可是这说的是高多少，不是D店赢了几家店。只要多一家特别大的店，就能把平均数拉到390上面去，而D店照样赢着同样那三家店。
  s2_zh_hk: 平均數就係總數除以店嘅數目。五間店加埋係1,760杯，1,760除以5，即係352。D店比佢高38杯，聽落唔錯。但係呢個講嘅係高幾多，唔係D店贏咗幾多間店。只要多一間特別大嘅店，就可以將平均數扯上390以上，而D店照樣贏緊同樣嗰三間店。
  s3_en: >-
    The line answers the real question directly. 4 of the 5 shops sold 390 cups or less. That is a statement about place, not size.
    So how do we turn 4 of 5 into one number a manager can compare?
  s3_zh: 排好的那条线，直接回答了真正的问题：五家店里有四家卖了390杯或更少。这说的是位置，不是大小。那怎么把“五家里有四家”变成一个经理可以拿来比较的数？
  s3_zh_hk: 排好嗰條線，直接答到真正嘅問題：五間店入面有四間賣咗390杯或者更少。呢個講嘅係位置，唔係大細。咁點樣將「五間入面有四間」變成一個經理可以攞嚟比較嘅數？
- id: share
  visual: steps
  seconds: 40
  kicker: The Share
  kicker_en: The Share
  kicker_zh: 占多少
  kicker_zh_hk: 佔幾多
  title_en: From 4 of 5 to a percent
  title_zh: 从五分之四到百分比
  title_zh_hk: 由五分之四到百分比
  step1_en: 4 shops at or below 390
  step1_zh: 四家不高于 390
  step1_zh_hk: 四間唔高過 390
  step2_en: 4 ÷ 5 = 0.80
  step2_zh: 4 ÷ 5 = 0.80
  step2_zh_hk: 4 ÷ 5 = 0.80
  step3_en: 0.80 = 80%
  step3_zh: 0.80 = 80%
  step3_zh_hk: 0.80 = 80%
  s1_en: >-
    Start with the count. 4 of the 5 shops sold 390 cups or less. Shop D counts itself, because "at or below" includes the shop we are standing on.
  s1_zh: 先数数。五家店里有四家卖了390杯或更少。D店把自己也算进去，因为“不高于”包括我们站着的这一家。
  s1_zh_hk: 先數吓。五間店入面有四間賣咗390杯或者更少。D店連自己都計埋，因為「唔高過」包括我哋企緊嗰一間。
  s2_en: >-
    Now turn the count into a share. Divide by the number of shops. 4 divided by 5 is 0.80. Think of the line cut into five equal slices; each shop is one fifth, or 20 percent.
  s2_zh: 再把个数变成占比：除以店的数目。4除以5，等于0.80。你可以把这条线切成五等份，每家店占五分之一，也就是20%。
  s2_zh_hk: 再將個數變成佔比：除以店嘅數目。4除以5，即係0.80。你可以將條線切成五等份，每間店佔五分之一，即係20%。
  s3_en: And 0.80 is 80 percent. So 80 percent of these shops sold at or below Shop D. That share, and the value it points to, have names.
  s3_zh: 0.80就是80%。所以这些店里，有80%卖得不比D店多。这个占比，还有它对应的那个数，都有名字。
  s3_zh_hk: 0.80即係80%。所以呢啲店入面，有80%賣得唔多過D店。呢個佔比，同埋佢對應嗰個數，都有名。
- id: name_pctl
  visual: title_card
  seconds: 28
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Percentile
  title_zh: 百分位数
  title_zh_hk: 百分位數
  en: >-
    Percentile. 390 cups is the 80th percentile of these five shops, because about 80 percent of them sit at or below it.
    Turn it around and you get Shop D's percentile rank, 80 percent. The percentile is a value on the line; the percentile rank is the share at or below it.
    So how do we write that down for any group?
  zh: >-
    百分位数。390杯是这五家店的第80百分位数，因为大约80%的店不高于它。反过来说，D店的百分位排名就是80%。
    百分位数是线上的一个数值；百分位排名是不高于它的那一部分占多少。那换成任何一组店，要怎么写下来？
  zh_hk: >-
    百分位數。390杯係呢五間店嘅第80百分位數，因為大約80%嘅店唔高過佢。倒轉嚟講，D店嘅百分位排名就係80%。
    百分位數係條線上面嘅一個數值；百分位排名係唔高過佢嗰部分佔幾多。咁換成任何一組店，又點樣寫低？
- id: defn
  visual: definition_card
  seconds: 46
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Percentile, written down
  title_zh: 把百分位数写下来
  title_zh_hk: 將百分位數寫低
  formula_en: 'pth percentile: about p% at or below'
  formula_zh: 第 p 百分位数：约 p% 不高于它
  formula_zh_hk: 第 p 百分位數：約 p% 唔高過佢
  gloss_en: 390 = 80th percentile of the five
  gloss_zh: 390 是五家店的第八十百分位数
  gloss_zh_hk: 390 係五間店嘅第八十百分位數
  s1_en: >-
    Here it is in words. Put the values in order. The p-th percentile is a value with about p percent of the values at or below it.
    p is just the percent you ask about, 80 for the 80th, 50 for the 50th. And a value's percentile rank is the share of values at or below it.
  s1_zh: 用一句话说：先把数排好。第p百分位数，是一个大约有p%的数不高于它的数值。p就是你问的那个百分比，第80就是80，第50就是50。而一个数的百分位排名，就是不高于它的数占多少。
  s1_zh_hk: 用一句講晒：先將啲數排好。第p百分位數，係一個大約有p%嘅數唔高過佢嘅數值。p就係你問嗰個百分比，第80就係80，第50就係50。而一個數嘅百分位排名，就係唔高過佢嘅數佔幾多。
  s2_en: >-
    For Monday, 390 cups is the 80th percentile, and Shop D's percentile rank is 80 percent. Notice the word "about". With only five shops, each shop is a 20 percent step.
    Now suppose a manager asks the other way round. Give me the 80th percentile. Which shop do you read?
  s2_zh: 星期一的数据里，390杯是第80百分位数，D店的百分位排名是80%。留意“大约”这两个字：只有五家店，每家店就是20%的一级台阶。现在假设经理反过来问：给我第80百分位数。你该读哪一家店？
  s2_zh_hk: 星期一嘅數據入面，390杯係第80百分位數，D店嘅百分位排名係80%。留意「大約」呢兩個字：得五間店，每間店就係20%嘅一級。而家假設經理倒轉問：畀我第80百分位數。你應該讀邊間店？
- id: find80
  visual: steps
  seconds: 42
  kicker: The Other Way
  kicker_en: The Other Way
  kicker_zh: 反过来找
  kicker_zh_hk: 倒轉嚟搵
  title_en: Find the 80th percentile
  title_zh: 找出第八十百分位数
  title_zh_hk: 搵出第八十百分位數
  step1_en: Sort the five shops
  step1_zh: 把五家店排好
  step1_zh_hk: 將五間店排好
  step2_en: 0.80 × 5 = 4
  step2_zh: 0.80 × 5 = 4
  step2_zh_hk: 0.80 × 5 = 4
  step3_en: Place 4 = 390 cups
  step3_zh: 第 4 位 = 390 杯
  step3_zh_hk: 第 4 位 = 390 杯
  s1_en: Use the same five shops. Step one, sort them, from 280 up to 420. A percentile only makes sense on ordered data.
  s1_zh: 还是这五家店。第一步，把它们排好，从280排到420。百分位数只对有序数据才有意义。
  s1_zh_hk: 都係呢五間店。第一步，將佢哋排好，由280排到420。百分位數只係對有序數據先有意思。
  s2_en: >-
    Step two, find the place. Multiply the percent, 0.80, by the number of shops, 5. 0.80 times 5 is 4, so we go to place 4.
    This way of picking a place is called the nearest-rank method.
  s2_zh: 第二步，找位置。用百分比0.80乘以店的数目5。0.80乘以5等于4，所以我们去第4位。这种找位置的做法，叫作最接近秩法。
  s2_zh_hk: 第二步，搵位置。用百分比0.80乘以店嘅數目5。0.80乘5等於4，所以我哋去第4位。呢種搵位置嘅做法，叫做最接近秩法。
  s3_en: >-
    Step three, read the value in place 4. It is 390 cups, Shop D. The same answer, found from the other direction.
    But 0.80 times 5 came out whole. What if the place is not a whole number?
  s3_zh: 第三步，读出第4位的数值：390杯，就是D店。同一个答案，只是从另一个方向找到。不过0.80乘以5刚好是整数。要是位置不是整数呢？
  s3_zh_hk: 第三步，讀出第4位嘅數值：390杯，即係D店。同一個答案，只係由另一個方向搵到。不過0.80乘5啱啱係整數。如果個位置唔係整數又點？
- id: round_up
  visual: rank_line
  seconds: 46
  kicker: Round Up
  kicker_en: Round Up
  kicker_zh: 向上取整
  kicker_zh_hk: 向上取整
  title_en: Not a whole place? Round up
  title_zh: 位置有小数？向上取整
  title_zh_hk: 位置有小數？向上取整
  values: 280;310;360;390;420
  labels_en: Shop C;Shop E;Shop A;Shop D;Shop B
  labels_zh: C店;E店;A店;D店;B店
