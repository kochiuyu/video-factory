  span_zh: 六家里有四家不高于 390
  span_zh_hk: 六間入面有四間唔高過 390
  footer_en: 4 ÷ 6 ≈ 67%
  footer_zh: 4 ÷ 6 ≈ 67%
  footer_zh_hk: 4 ÷ 6 ≈ 67%
  s1_en: >-
    Suppose head office adds a sixth shop, Shop F, that sold more than 420 cups. We do not even need its exact number. Here is the new line, in order.
  s1_zh: 假设总部再加一家店，F店，它卖了超过420杯。连它的确切数字都不需要知道。这是新的一排，已经排好。
  s1_zh_hk: 假設總部再加多一間店，F店，佢賣咗超過420杯。連佢實際賣幾多都唔使知。呢個係新嘅一排，已經排好。
  s2_en: Number the places. Shop D did not change. It still sold 390, and it is still in place 4. But now there are six places, not five.
  s2_zh: 给位置编号。D店没变，还是卖了390杯，还是在第4位。可是现在有六个位置，不是五个。
  s2_zh_hk: 幫位置編號。D店冇變，都係賣咗390杯，都係喺第4位。但係而家有六個位，唔係五個。
  s3_en: >-
    Count again. 4 of 6 shops are at or below 390, and 4 divided by 6 is about 0.67. Shop D's percentile rank falls from 80 percent to about 67.
    The 80th percentile moves too. 0.80 times 6 is 4.8, round up to place 5, which is 420 cups. Same shop, same 390 cups, a different standing.
    And Shop F could have sold a little more or ten times more; nothing here would change. So what does a percentile tell a manager, and what does it not?
  s3_zh: 再数一次：六家里有四家不高于390，4除以6大约是0.67。D店的百分位排名，从80%掉到大约67%。第80百分位数也跟着变：0.80乘以6等于4.8，向上取到第5位，就是420杯。同一家店，同样的390杯，位置却不同了。而且F店多卖一点也好，多卖十倍也好，这里什么都不会变。那百分位数能告诉经理什么，又不能告诉他什么？
  s3_zh_hk: 再數一次：六間入面有四間唔高過390，4除以6大約係0.67。D店嘅百分位排名，由80%跌到大約67%。第80百分位數都跟住變：0.80乘6等於4.8，向上取到第5位，即係420杯。同一間店，同樣係390杯，位置就唔同咗。而且F店多賣少少又好，多賣十倍又好，呢度乜都唔會變。咁百分位數話到經理知啲乜，又話唔到佢知啲乜？
- id: limit
  visual: two_column
  seconds: 50
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A place in line, not a size
  title_zh: 讲的是位置，不是大小
  title_zh_hk: 講嘅係位置，唔係大細
  left_en: 'Tells: share at or below'
  left_zh: 能说：多少店不高于它
  left_zh_hk: 講到：幾多店唔高過佢
  right_en: 'Not: how far ahead'
  right_zh: 不能说：领先多少杯
  right_zh_hk: 講唔到：拋離幾多杯
  s1_en: So what does a percentile tell a manager, and what does it not?
  s1_zh: 那百分位数到底能告诉经理什么，又不能告诉他什么？
  s1_zh_hk: 咁百分位數究竟話到經理知啲乜，又話唔到佢知啲乜？
  s2_en: >-
    It tells you position. Shop D at the 80th percentile means about 80 percent of these shops sold at or below it.
    That is exactly what head office asked. Is this shop near the top of its group?
  s2_zh: 它能告诉你位置。D店在第80百分位，意思是大约80%的店卖得不比它多。这正是总部问的：这家店是不是接近这组店的顶端？
  s2_zh_hk: 佢話到你知位置。D店喺第80百分位，意思係大約80%嘅店賣得唔多過佢。呢個正正係總部問嘅：呢間店係咪接近呢組店嘅頂端？
  s3_en: >-
    It does not tell you distance. It ignores how far ahead or behind the other shops are; Shop F's exact sales never mattered.
    And it is not a target every shop must hit. It belongs to one group, one period, and one method.
    Change any of them, a new shop, a different week, or another way of rounding, and the answer can move.
  s3_zh: 它不能告诉你距离。别的店领先多少、落后多少，它都不管；F店到底卖了多少，从头到尾都无所谓。它也不是每家店都得达到的目标。它只属于一组店、一段时间、一种算法。任何一样变了，多一家店、换一个星期、换一种取整的方法，答案都可能会变。
  s3_zh_hk: 佢話唔到你知距離。其他店拋離幾多、落後幾多，佢都唔理；F店實際賣咗幾多，由頭到尾都冇關係。佢亦唔係每間店都要做到嘅目標。佢只係屬於一組店、一段時間、一種計法。任何一樣變咗，多一間店、換一個星期、換一種取整嘅方法，答案都可能會變。
- id: answer
  visual: takeaway
  seconds: 70
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 答案
  kicker_zh_hk: 答案
  title_en: Strong? Check the percentile.
  title_zh: 强不强？先看排第几
  title_zh_hk: 勁唔勁？先睇排第幾
  q1_en: What does the 80th percentile describe?
  q1_zh: 第八十百分位数描述什么？
  q1_zh_hk: 第八十百分位數描述咩？
  q2_en: What context must accompany it?
  q2_zh: 报告时必须同时说明什么？
  q2_zh_hk: 報告嗰陣一定要同時講明咩？
  s1_en: Back to head office and Shop D. Is 390 cups a strong day? On its own, 390 could not tell you. Lined up with the other four shops, it sits in place 4 of 5.
  s1_zh: 回到总部和D店。390杯算不算强？单看390，你判断不了。跟另外四家店排在一起，它在五家里排第4位。
  s1_zh_hk: 返去總部同D店。390杯算唔算勁？淨係睇390，你判斷唔到。同另外四間店排埋一齊，佢喺五間入面排第4位。
  s2_en: >-
    What does the 80th percentile describe? A value with about 80 percent of the group at or below it. Here that value is 390 cups, so Shop D's percentile rank is 80 percent,
    near the top, with only Shop B ahead. To find it, sort the shops, multiply the percent by the count, round up if the place has a decimal, and read that place.
  s2_zh: 第80百分位数描述什么？一个大约有80%的店不高于它的数值。这里这个数值是390杯，所以D店的百分位排名是80%，接近顶端，只有B店在它前面。找的方法是：把店排好，用百分比乘以店的数目，位置有小数就向上取整，然后读出那个位置。
  s2_zh_hk: 第80百分位數描述咩？一個大約有80%嘅店唔高過佢嘅數值。呢度呢個數值係390杯，所以D店嘅百分位排名係80%，接近頂端，得B店喺佢前面。搵嘅方法係：將啲店排好，用百分比乘店嘅數目，位置有小數就向上取整，然後讀出嗰個位置。
  s3_en: >-
    What context must accompany it? The group of shops, the period, and the method, here the nearest-rank method. Add one bigger shop, and Shop D slips to about 67 percent.
    These are numbers we supposed for one Monday. A percentile tells you where a shop stands in its line, not how much more it sold, and not what any shop should sell.
  s3_zh: 报告时必须同时说明什么？比较的是哪组店、哪段时间、用什么方法，这里是最接近秩法。多加一家更大的店，D店就掉到大约67%。这些都是我们为一个星期一假设的数字。百分位数告诉你一家店在这一排里站在哪里，不告诉你它多卖了多少，也不告诉你哪家店应该卖多少。
  s3_zh_hk: 報告嗰陣一定要同時講明咩？比較嘅係邊組店、邊段時間、用咩方法，呢度係最接近秩法。加多一間大啲嘅店，D店就跌到大約67%。呢啲都係我哋為一個星期一假設嘅數字。百分位數話你知一間店喺呢一排入面企喺邊，唔話你知佢多賣咗幾多，亦唔話你知邊間店應該賣幾多。
