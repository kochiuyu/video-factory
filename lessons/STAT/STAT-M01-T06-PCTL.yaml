  footer_zh: 0.50 × 5 = 2.5 → 3
  footer_zh_hk: 0.50 × 5 = 2.5 → 3
  s1_en: Try the 50th percentile, halfway along the line. Here are the same five shops, already in order.
  s1_zh: 试试第50百分位数，也就是这条线的一半。还是这五家店，已经排好了。
  s1_zh_hk: 試吓第50百分位數，即係條線嘅一半。都係呢五間店，已經排好咗。
  s2_en: >-
    Number the places, 1 to 5. Now 0.50 times 5 is 2.5. There is no place two and a half.
    The nearest-rank method says round up to the next whole place, which is place 3.
  s2_zh: 给位置编号，1到5。0.50乘以5等于2.5，可是没有第二点五位。最接近秩法的规定是：向上取到下一个整数位，也就是第3位。
  s2_zh_hk: 幫位置編號，1到5。0.50乘5等於2.5，但係冇第二點五位。最接近秩法嘅規定係：向上取到下一個整數位，即係第3位。
  s3_en: >-
    Place 3 is Shop A, at 360 cups. Two shops sit below it and two above, so halfway lands right in the middle of the line, as it should.
    Whenever the place has a decimal, round up. So far, the group has been these five shops. What happens to Shop D if the group changes?
  s3_zh: 第3位是A店，360杯。它下面两家，上面两家，所以一半正好落在线的中间，合情合理。只要位置有小数，就向上取整。到目前为止，比较的都是这五家店。要是这组店变了，D店会怎样？
  s3_zh_hk: 第3位係A店，360杯。佢下面兩間，上面兩間，所以一半啱啱落喺條線中間，合情合理。只要位置有小數，就向上取整。到目前為止，比較嘅都係呢五間店。如果呢組店變咗，D店會點？
