course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Where does this shop rank?
title_zh: 这家分店处于什么位置？
title_zh_hk: 呢間分店排喺咩位置？
objective_en: Define a percentile as a relative position in ordered data, calculate the 80th percentile using the nearest-rank method, interpret percentile standing for branch benchmarking, and explain why the method, period, and comparison group must be stated.
objective_zh: 把百分位数定义为有序数据中的相对位置，使用最接近秩法计算第80百分位数，解释百分位排名如何用于门店基准比较，并说明为何必须交代计算方法、统计期间与比较总体。
objective_zh_hk: 將百分位數定義為有序數據入面嘅相對位置，使用最接近秩法計算第80百分位數，解釋百分位排名點樣用於門店基準比較，並說明點解一定要交代計算方法、統計期間同比較總體。
