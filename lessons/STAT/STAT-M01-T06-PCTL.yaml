id: STAT-M01-T06-PCTL
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 540
title_en: What is a percentile?
title_zh: 什么是百分位数？
title_zh_hk: 咩係百分位數？
objective_en: Decide whether one shop's sales are strong by finding its place in the ordered line of shops, turn that place into a percentile rank, find a percentile with the nearest-rank method (round the place up), and see why the answer depends on the group, period and method.
objective_zh: 通过找出一家店在排好的一排店里的位置，判断它的销量强不强；把位置换算成百分位排名，用最接近秩法（位置向上取整）求出百分位数，并看到答案为什么取决于比较哪组店、哪段时间和用什么方法。
objective_zh_hk: 透過搵出一間店喺排好嘅一排店入面嘅位置，判斷佢嘅銷量勁唔勁；將位置換算成百分位排名，用最接近秩法（位置向上取整）搵出百分位數，並睇到答案點解取決於比較邊組店、邊段時間同用咩方法。
