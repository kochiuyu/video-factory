  s1_en: >-
    Suppose head office also counts Shop F, a 24-hour site. On the same Monday it sold 4,200 cups. Now there are six shops, and one sits far off to the right.
  s1_zh: 假设总部把F店也算进来，这是一家通宵营业的店。同一个星期一，它卖了4,200杯。现在有六家店，其中一家远远落在右边。
  s1_zh_hk: 假設總部將F店都計埋入嚟，呢間係通宵營業嘅店。同一個星期一，佢賣咗4,200杯。而家有六間店，其中一間遠遠喺右邊。
  s2_en: >-
    Find the quarter marks again, for six shops. 0.25 times 6 is 1.5, round up to place 2, which is 310. 0.75 times 6 is 4.5, round up to place 5, which is 420.
  s2_zh: 用六家店再找一次四分之一标记。0.25乘以6等于1.5，向上取到第2位，是310。0.75乘以6等于4.5，向上取到第5位，是420。
  s2_zh_hk: 用六間店再搵一次四分之一標記。0.25乘6等於1.5，向上取到第2位，係310。0.75乘6等於4.5，向上取到第5位，係420。
  s3_en: >-
    The box now runs from 310 to 420, so the IQR is 110 cups. It grew by 30. Now look at the ends. Highest minus lowest was 140 cups; now it is 4,200 minus 280, or 3,920, twenty-eight times as wide.
    One far shop stretched the line out to the end, but barely moved the box. Does that make the IQR safe from everything?
  s3_zh: 箱子现在从310到420，所以四分位距是110杯，多了30。再看两头：最高减最低本来是140杯，现在是4,200减280，等于3,920，宽了二十八倍。一家很远的店，把线一直拉长到尽头，却几乎没有挪动箱子。那是不是说，四分位距什么都不怕？
  s3_zh_hk: 個盒而家由310到420，所以四分位距係110杯，多咗30。再睇兩頭：最高減最低本來係140杯，而家係4,200減280，等於3,920，闊咗二十八倍。一間好遠嘅店，將條線一直拉長到盡頭，但係差唔多冇郁到個盒。咁係咪即係話，四分位距乜都唔怕？
