  title_en: The middle, not the whole story
  title_zh: 讲的是中间，不是全部
  title_zh_hk: 講嘅係中間，唔係全部
  left_en: 'Tells: width of the middle'
  left_zh: 能说：中间有多宽
  left_zh_hk: 講到：中間有幾闊
  right_en: 'Not: the far days'
  right_zh: 不能说：两头发生了什么
  right_zh_hk: 講唔到：兩頭發生咗乜
  s1_en: So what does the IQR tell a planner, and what does it not?
  s1_zh: 那四分位距到底能告诉规划的人什么，又不能告诉他什么？
  s1_zh_hk: 咁四分位距究竟話到做規劃嘅人知啲乜，又話唔到佢知啲乜？
  s2_en: >-
    It tells you how wide the middle of the group is. On this Monday the middle shops sat within 80 cups of each other.
    One far shop moved it by 30 cups, not by thousands. That is a fair picture of an ordinary day.
  s2_zh: 它能告诉你这组店的中间有多宽。这个星期一，中间那几家店彼此相差不超过80杯。一家很远的店，只让它变了30杯，而不是几千杯。拿来描述普通的一天，这样比较公道。
  s2_zh_hk: 佢話到你知呢組店嘅中間有幾闊。呢個星期一，中間嗰幾間店之間相差唔超過80杯。一間好遠嘅店，只係令佢變咗30杯，唔係幾千杯。用嚟描述普通嘅一日，噉就公道啲。
  s3_en: >-
    It does not tell you about the far days. Shop F still sold 4,200 cups and still needs its own plan. The IQR also changed, so robust does not mean immune.
    It is not a promise that every shop stays within 80 cups. And it depends on the group, the period, and the method; another textbook or software rule can place the quartiles a little differently.
    The milk order itself still needs the cost of waste and the cost of running out.
  s3_zh: 它不能告诉你两头的事。F店照样卖了4,200杯，照样要单独安排。四分位距自己也变了，所以稳健不等于完全不受影响。它也不是保证每家店都只差80杯。而且它取决于比较哪组店、哪段时间、用什么方法；换一本教材或一个软件，四分位数的位置可能会有一点不同。至于牛奶到底订多少，还得算上倒掉的成本和卖光的成本。
  s3_zh_hk: 佢話唔到你知兩頭嘅事。F店照樣賣咗4,200杯，照樣要另外安排。四分位距自己都變咗，所以穩健唔等於完全唔受影響。佢亦唔係保證每間店都只係差80杯。而且佢取決於比較邊組店、邊段時間、用咩方法；換一本教科書或者一個軟件，四分位數嘅位置可能會有少少唔同。至於牛奶實際訂幾多，仲要計埋倒咗嘅成本同賣晒嘅成本。
- id: answer
  visual: takeaway
  seconds: 68
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 答案
  kicker_zh_hk: 答案
  title_en: Normal day? Check the IQR.
  title_zh: 平常多宽？看四分位距
  title_zh_hk: 平時幾闊？睇四分位距
  q1_en: What does the IQR measure?
  q1_zh: 四分位距量的是什么？
  q1_zh_hk: 四分位距量緊咩？
  q2_en: What must you report with it?
  q2_zh: 报告时要同时说明什么？
  q2_zh_hk: 報告嗰陣要同時講明咩？
  s1_en: >-
    Back to head office and the milk. It wanted a normal band without letting one strange day set it. End to end, the five shops spread over 140 cups, and one far shop could stretch that to 3,920.
  s1_zh: 回到总部和牛奶。总部想要一个正常区间，又不想让一个奇怪的日子来定它。从一头到另一头，五家店相差140杯；多一家很远的店，就能拉到3,920杯。
  s1_zh_hk: 返去總部同牛奶。總部想要一個正常範圍，又唔想畀一日古怪嘅生意嚟定佢。由一頭到另一頭，五間店相差140杯；多一間好遠嘅店，就可以拉到3,920杯。
  s2_en: >-
    What does the IQR measure? The width of the middle of the ordered line, Q3 minus Q1. To find it, sort the values, take 0.25 and 0.75 of the count, round each place up, read Q1 and Q3, and subtract.
    For this Monday, 390 minus 310 is 80 cups.
  s2_zh: 四分位距量的是什么？排好的这条线中间的宽度，也就是Q3减Q1。找的方法是：把数排好，用0.25和0.75分别乘以个数，位置有小数就向上取整，读出Q1和Q3，再相减。这个星期一，390减310，等于80杯。
  s2_zh_hk: 四分位距量緊咩？排好嗰條線中間嘅闊度，即係Q3減Q1。搵嘅方法係：將啲數排好，用0.25同0.75分別乘個數，位置有小數就向上取整，讀出Q1同Q3，再相減。呢個星期一，390減310，等於80杯。
  s3_en: >-
    What must you report with it? The group of shops, the period, and the method, here the nearest-rank method. Add Shop F and the IQR becomes 110 cups, while the ends stretch to 3,920.
    These are numbers we supposed for one Monday. The IQR tells you how wide a normal day's middle is, not what happened on the far days, and not how much milk to order on its own.
  s3_zh: 报告时要同时说明什么？比较的是哪组店、哪段时间、用什么方法，这里是最接近秩法。加上F店，四分位距变成110杯，两头却拉到3,920杯。这些都是我们为一个星期一假设的数字。四分位距告诉你平常日子的中间有多宽，不告诉你两头那几天发生了什么，也不能单靠它决定订多少牛奶。
  s3_zh_hk: 報告嗰陣要同時講明咩？比較嘅係邊組店、邊段時間、用咩方法，呢度係最接近秩法。加埋F店，四分位距變成110杯，兩頭就拉到3,920杯。呢啲都係我哋為一個星期一假設嘅數字。四分位距話你知平時嘅中間有幾闊，唔話你知兩頭嗰幾日發生咗乜，亦唔可以淨靠佢決定訂幾多牛奶。
