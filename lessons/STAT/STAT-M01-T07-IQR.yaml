id: STAT-M01-T07-IQR
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: How wide is the middle fifty percent?
title_zh: 中间百分之五十的跨度有多大？
title_zh_hk: 中間百分之五十嘅跨度有幾大？
objective_en: Define the interquartile range as Q3 minus Q1, connect quartiles to the 25th and 75th percentiles, calculate the IQR using the course quartile convention, and explain why it is less sensitive than the range while remaining dependent on the dataset and quartile method.
objective_zh: 把四分位距定义为Q3减去Q1，将四分位数与第25和第75百分位数联系起来，使用本课程的四分位数约定计算IQR，并解释它为何比极差更不易受极端值影响，同时仍取决于数据集与四分位数算法。
objective_zh_hk: 將四分位距定義為Q3減去Q1，將四分位數同第25同第75百分位數連結起來，使用本課程嘅四分位數約定計算IQR，並解釋佢點解比全距更唔容易受極端值影響，同時仍然取決於數據集同四分位數算法。
