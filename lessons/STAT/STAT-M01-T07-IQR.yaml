id: STAT-M01-T07-IQR
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 506
title_en: What is the interquartile range?
title_zh: 什么是四分位距？
title_zh_hk: 咩係四分位距？
objective_en: Find the width of the middle of an ordered line of shops by locating Q1 and Q3 with the nearest-rank method (place = 0.25 or 0.75 times the count, rounded up), define the interquartile range as Q3 minus Q1, and see why one far value stretches the ends far more than the box, while the IQR still depends on the group, period and method.
objective_zh: 用最接近秩法（位置 = 0.25 或 0.75 乘以个数，向上取整）找出Q1和Q3，量出排好的一排店中间有多宽；把四分位距定义为Q3减Q1，并看到一家很远的店为什么把两头拉得远比箱子多，而四分位距仍然取决于比较哪组店、哪段时间和用什么方法。
objective_zh_hk: 用最接近秩法（位置 = 0.25 或 0.75 乘個數，向上取整）搵出Q1同Q3，量出排好嘅一排店中間有幾闊；將四分位距定義為Q3減Q1，並睇到一間好遠嘅店點解將兩頭拉得遠過個盒好多，而四分位距仍然取決於比較邊組店、邊段時間同用咩方法。
