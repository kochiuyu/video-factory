quiz:
- id: Q1
  type: multiple_choice
  question_en: How does the Interquartile Range (IQR) measure data spread?
  question_zh: 四分位距（IQR）是如何衡量数据离散程度的？
  question_zh_hk: 四分位距（IQR）係點樣衡量數據離散程度嘅？
  options_en:
  - 'A: It calculates the distance between the smallest and largest values in the entire file.'
  - 'B: It measures the distance between Q1 and Q3, the boundaries of about the middle half of ordered observations.'
  - 'C: It divides the arithmetic mean by the number of stores.'
  - 'D: It adds all four quartiles together into a grand total.'
  options_zh:
  - 'A: 它计算整个数据表中最小数值与最大数值之间的距离。'
  - 'B: 它测量Q1与Q3之间的距离，也就是有序观测值大约中间一半的边界跨度。'
  - 'C: 它用算术平均数除以门店总数。'
  - 'D: 它把所有四个四分位数直接相加得出总和。'
  options_zh_hk:
  - 'A: 佢計算成張數據表入面最少數值同最大數值之間嘅距離。'
  - 'B: 佢測量Q1同Q3之間嘅距離，即係有序觀測值大約中間一半嘅邊界跨度。'
  - 'C: 佢用算術平均數除以門店總數。'
  - 'D: 佢將所有四個四分位數直接加埋得出總和。'
  answer: B
  explanation_en: The IQR equals Q3 minus Q1 and describes the span of about the middle half. It is less sensitive to extreme endpoints than the range, but Q1, Q3, and the IQR can still change when the dataset changes.
  explanation_zh: 四分位距等于Q3减去Q1，描述大约中间一半的跨度。它比极差更不易受极端端点影响，但数据集改变时，Q1、Q3与IQR仍可能改变。
  explanation_zh_hk: 四分位距等於Q3減去Q1，描述大約中間一半嘅跨度。佢比全距更唔容易受極端端點影響，但數據集改變嗰陣，Q1、Q3同IQR仍然可能改變。
- id: Q2
  type: multiple_choice
  question_en: Why can the IQR be more useful than the range for describing routine street-store variation?
  question_zh: 为什么四分位距可能比极差更适合描述街头门店的常规波动？
  question_zh_hk: 點解四分位距可能比全距更適合描述街頭門店嘅常規波動？
  options_en:
  - 'A: It focuses on about the middle half, so a single extreme endpoint usually has less influence than it has on the range.'
  - 'B: The IQR ignores the middle shops and only uses the two endpoints.'
  - 'C: The IQR always equals the full range of the data.'
  - 'D: Once you know the IQR, you no longer need Q1 or Q3 labels.'
  options_zh:
  - 'A: 它聚焦大约中间一半，因此单个极端端点通常不像影响极差那样强烈地影响IQR。'
  - 'B: IQR 会忽略中间门店，只使用两个端点。'
  - 'C: IQR 永远等于整段数据的极差。'
  - 'D: 只要知道 IQR，就不再需要 Q1 或 Q3 标签。'
  options_zh_hk:
  - 'A: 佢聚焦大約中間一半，所以單一極端端點通常唔會好似影響全距噉強烈影響IQR。'
  - 'B: IQR 會忽略中間門店，只使用兩個端點。'
  - 'C: IQR 永遠等於成段數據嘅全距。'
  - 'D: 只要知到 IQR，就唔再需要 Q1 或者 Q3 標籤。'
  answer: A
  explanation_en: 'The range uses only the minimum and maximum. The IQR uses Q1 and Q3 around about the middle half, so one isolated endpoint often has less influence. IQR is not the full range, does not ignore the middle, and still needs Q1 and Q3.'
  explanation_zh: '极差只使用最小值和最大值。IQR 使用围绕大约中间一半的 Q1 与 Q3，因此单个孤立端点通常影响较小。IQR 不是整段极差，不会忽略中间，并且仍需要 Q1 与 Q3。'
  explanation_zh_hk: '全距只使用最小值同最大值。IQR 使用圍繞大約中間一半嘅 Q1 同 Q3，所以單一孤立端點通常影響較小。IQR 唔係成段全距，唔會忽略中間，並且仍然需要 Q1 同 Q3。'
beats:
- id: hook
  visual: title_card
  seconds: 46
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is the interquartile range?
  title_zh: 什么是四分位距？
  title_zh_hk: 咩係四分位距？
  en: >-
    Suppose head office plans the morning milk delivery for its street coffee shops. It wants a normal band, a spread of cups that an ordinary day falls inside.
    Make the band too wide, and shops throw milk away. Make it too narrow, and they run out by lunch.
    The trouble is that the lowest and the highest day are often the unusual ones. Plan around them, and one strange day sets the band for everyone.
    So how wide is the middle of the group, once you look past the two ends?
    The number that answers that is called the interquartile range. What is the interquartile range?
  zh: >-
    假设总部要给街边的咖啡店安排每天早上的牛奶。它想要一个正常区间，也就是普通的一天大概会卖多少杯。区间定得太宽，店里就要倒掉牛奶；定得太窄，不到中午就卖光了。
    麻烦的是，最低和最高的那一天，往往正是不寻常的那一天。照着它们来定，一个奇怪的日子就替所有店定了区间。
    所以，撇开两头不看，这组店的中间到底有多宽？回答这个问题的数，叫作四分位距。什么是四分位距？
  zh_hk: >-
    假設總部要幫街邊嘅咖啡店安排每朝嘅牛奶。佢想要一個正常範圍，即係普通一日大概會賣幾多杯。範圍定得太闊，間店就要倒咗啲牛奶；定得太窄，未到晏晝就賣晒。
    麻煩嘅係，最低同最高嗰日，往往就係唔尋常嗰日。跟住佢哋嚟定，一日古怪嘅生意就幫晒所有店定咗個範圍。
    所以，唔睇兩頭，呢組店中間究竟有幾闊？答到呢個問題嘅數，就叫做四分位距。咩係四分位距？
- id: line
  visual: rank_line
  seconds: 66
  kicker: The Line
  kicker_en: The Line
  kicker_zh: 排一排
  kicker_zh_hk: 排一排
  title_en: Five shops, one Monday
  title_zh: 五家店，同一个星期一
  title_zh_hk: 五間店，同一個星期一
  values: 360;420;280;390;310
  labels_en: Shop A;Shop B;Shop C;Shop D;Shop E
  labels_zh: A店;B店;C店;D店;E店
  labels_zh_hk: A店;B店;C店;D店;E店
  order: sorted
  mark: ends
  span: ends
  span_en: 420 − 280 = 140 cups
  span_zh: 420 − 280 = 140 杯
  span_zh_hk: 420 − 280 = 140 杯
  s1_en: >-
    Here are five shops on one Monday, in the order they were written. Shop A sold 360 cups, Shop B 420, Shop C 280, Shop D 390, and Shop E 310.
    Where is the middle of this group? Written like this, it is hard to say.
  s1_zh: 这是五家店在同一个星期一的销量，按写下的顺序：A店卖了360杯，B店420，C店280，D店390，E店310。这组店的中间在哪里？这样写着，很难看出来。
  s1_zh_hk: 呢個係五間店喺同一個星期一嘅銷量，照寫低嘅次序：A店賣咗360杯，B店420，C店280，D店390，E店310。呢組店嘅中間喺邊？噉樣寫住，好難睇得出。
  s2_en: >-
    So line them up from the fewest cups to the most, and number the places. Shop C at 280 is first, then Shop E at 310, Shop A at 360, Shop D at 390, and Shop B at 420 in fifth place.
    Each shop keeps its own number; we have only sorted.
  s2_zh: 所以把它们从卖得最少排到最多，再给位置编号。第一位是C店，280；然后是E店310、A店360、D店390，第五位是B店420。每家店的数字都没变，我们只是排了个序。
  s2_zh_hk: 所以將佢哋由賣得最少排到最多，再幫每個位編號。第一位係C店，280；跟住係E店310、A店360、D店390，第五位係B店420。每間店嘅數字都冇變，我哋只係排咗個次序。
  s3_en: >-
    The quickest width to read is from end to end. 420 minus 280 is 140 cups. That gap, highest minus lowest, is called the range.
    But notice who sets it. Only two shops, the very lowest and the very highest. The three shops in the middle never count.
    What if we measured the middle instead? Where would the middle start?
  s3_zh: 最快读出来的宽度，是从一头到另一头：420减280，等于140杯。最高减最低，这个差叫作极差。可是留意一下，是谁定了它？只有两家店，最低的和最高的。中间那三家店，完全没算进去。如果改量中间呢？中间从哪里开始？
  s3_zh_hk: 最快讀到嘅闊度，係由一頭到另一頭：420減280，等於140杯。最高減最低，呢個差就叫做全距。但係留意吓，係邊個定咗佢？得兩間店，最低嗰間同最高嗰間。中間嗰三間店，完全冇計到。如果改為量中間呢？中間由邊度開始？
- id: q1
  visual: rank_line
  seconds: 50
  kicker: A Quarter Up
  kicker_en: A Quarter Up
  kicker_zh: 四分之一处
  kicker_zh_hk: 四分之一處
  title_en: A quarter of the way up
  title_zh: 从低往上四分之一
  title_zh_hk: 由低向上四分之一
  values: 280;310;360;390;420
  labels_en: Shop C;Shop E;Shop A;Shop D;Shop B
  labels_zh: C店;E店;A店;D店;B店
  labels_zh_hk: C店;E店;A店;D店;B店
  order: as_given
  mark: '2'
  footer_en: 0.25 × 5 = 1.25 → 2
  footer_zh: 0.25 × 5 = 1.25 → 2
  footer_zh_hk: 0.25 × 5 = 1.25 → 2
  s1_en: >-
    Picture the ordered line cut into four equal quarters. The middle starts a quarter of the way up. Here is the same line, already in order.
  s1_zh: 把排好的这条线想象成切成四等份。中间，就从往上四分之一的地方开始。这是同一条线，已经排好了。
  s1_zh_hk: 將排好嘅呢條線想像成切開四等份。中間，就由向上四分之一嘅位置開始。呢條係同一條線，已經排好咗。
  s2_en: >-
    Which place is a quarter of the way up? Multiply one quarter, 0.25, by the number of shops, 5. 0.25 times 5 is 1.25.
    There is no place one and a quarter, so round up to the next whole place, place 2. This way of picking a place is called the nearest-rank method.
  s2_zh: 往上四分之一是第几位？用四分之一，也就是0.25，乘以店的数目5。0.25乘以5等于1.25。没有第一点二五位，所以向上取到下一个整数位，第2位。这种找位置的做法，叫作最接近秩法。
  s2_zh_hk: 向上四分之一係第幾位？用四分之一，即係0.25，乘店嘅數目5。0.25乘5等於1.25。冇第一點二五位，所以向上取到下一個整數位，第2位。呢種搵位置嘅做法，叫做最接近秩法。
  s3_en: >-
    Place 2 is Shop E, at 310 cups. This quarter mark is called the first quartile, Q1 for short. A quartile is simply a quarter mark on the ordered line.
    So the middle starts at 310. Where does it end?
  s3_zh: 第2位是E店，310杯。这个四分之一的标记，叫作第一四分位数，简写Q1。四分位数，其实就是排好的线上一个四分之一的标记。所以中间从310开始。那它在哪里结束？
  s3_zh_hk: 第2位係E店，310杯。呢個四分之一嘅標記，叫做第一四分位數，簡寫Q1。四分位數，其實就係排好嗰條線上面一個四分之一嘅標記。所以中間由310開始。咁佢喺邊度完？
- id: q3
  visual: rank_line
  seconds: 34
  kicker: Three Quarters Up
  kicker_en: Three Quarters Up
  kicker_zh: 四分之三处
  kicker_zh_hk: 四分之三處
  title_en: Three quarters of the way up
  title_zh: 从低往上四分之三
  title_zh_hk: 由低向上四分之三
  values: 280;310;360;390;420
  labels_en: Shop C;Shop E;Shop A;Shop D;Shop B
  labels_zh: C店;E店;A店;D店;B店
  labels_zh_hk: C店;E店;A店;D店;B店
  order: as_given
  mark: '4'
  footer_en: 0.75 × 5 = 3.75 → 4
  footer_zh: 0.75 × 5 = 3.75 → 4
  footer_zh_hk: 0.75 × 5 = 3.75 → 4
  s1_en: It ends three quarters of the way up. Same five shops, same order.
  s1_zh: 它在往上四分之三的地方结束。还是这五家店，还是这个顺序。
  s1_zh_hk: 佢喺向上四分之三嘅位置完。都係呢五間店，都係呢個次序。
  s2_en: >-
    Three quarters is 0.75. 0.75 times 5 is 3.75. Again there is no such place, so round up, to place 4.
  s2_zh: 四分之三就是0.75。0.75乘以5等于3.75。同样没有这个位置，所以向上取整，到第4位。
  s2_zh_hk: 四分之三即係0.75。0.75乘5等於3.75。一樣冇呢個位，所以向上取整，到第4位。
  s3_en: >-
    Place 4 is Shop D, at 390 cups. That is the third quartile, Q3. So the middle of the line runs from 310 to 390.
    How wide is that stretch, and what does it look like?
  s3_zh: 第4位是D店，390杯。这是第三四分位数，Q3。所以这条线的中间，从310走到390。这一段有多宽？画出来又是什么样子？
  s3_zh_hk: 第4位係D店，390杯。呢個係第三四分位數，Q3。所以呢條線嘅中間，由310行到390。呢一段有幾闊？畫出嚟又係點樣？
- id: box
  visual: box_line
  seconds: 48
  kicker: The Box
  kicker_en: The Box
  kicker_zh: 画个箱子
  kicker_zh_hk: 畫個盒
  title_en: Draw the middle as a box
  title_zh: 把中间画成一个箱子
  title_zh_hk: 將中間畫成一個盒
  values: 360;420;280;390;310
  span_en: 390 − 310 = 80 cups
  span_zh: 390 − 310 = 80 杯
  span_zh_hk: 390 − 310 = 80 杯
  footer_en: 'Box: Q1 to Q3. Lines: to each end'
  footer_zh: 箱子：Q1到Q3；线：伸到两头
  footer_zh_hk: 盒：Q1到Q3；線：伸到兩頭
  s1_en: >-
    Put the five shops on a scale of cups. Each dot is one shop, from 280 on the left to 420 on the right. Now the gaps between the shops show too.
  s1_zh: 把五家店放到一条杯数的刻度上。每个点是一家店，左边是280，右边是420。现在店与店之间隔多远，也看得到了。
  s1_zh_hk: 將五間店擺上一條杯數嘅刻度。每一點係一間店，左邊係280，右邊係420。而家店同店之間隔幾遠，都睇得到。
  s2_en: Mark the two quarter marks we found. Q1 at 310, and Q3 at 390.
  s2_zh: 标出刚才找到的两个四分之一标记：Q1在310，Q3在390。
  s2_zh_hk: 標出頭先搵到嘅兩個四分之一標記：Q1喺310，Q3喺390。
  s3_en: >-
    Draw a box from Q1 to Q3. Inside sit the middle shops. Its width is 390 minus 310, which is 80 cups.
    Lines run out from the box to the lowest and the highest shop, so the ends are still on the picture; they just sit outside the box.
    That 80 cups is the number we were after. What is it called?
  s3_zh: 从Q1到Q3画一个箱子，中间的店都在里面。它的宽度是390减310，等于80杯。箱子两边各伸出一条线，连到最低和最高的店，所以两头还在图上，只是在箱子外面。这80杯，就是我们要找的数。它叫什么？
  s3_zh_hk: 由Q1到Q3畫一個盒，中間嘅店都喺入面。佢嘅闊度係390減310，等於80杯。盒兩邊各自伸出一條線，連到最低同最高嘅店，所以兩頭仲喺幅圖度，只係喺個盒外面。呢80杯，就係我哋要搵嘅數。佢叫咩？
- id: name_iqr
  visual: title_card
  seconds: 24
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Interquartile range
  title_zh: 四分位距
  title_zh_hk: 四分位距
  en: >-
    Interquartile range, or IQR. Inter means between, and the quartiles are the quarter marks. So the interquartile range is the distance between the two quartiles,
    Q3 minus Q1. For this Monday it is 80 cups. How do we write that down for any group?
  zh: >-
    四分位距，英文简写IQR。四分位数就是那两个四分之一的标记，四分位距就是这两个标记之间的距离，也就是Q3减Q1。这个星期一，它是80杯。那换成任何一组店，要怎么写下来？
  zh_hk: >-
    四分位距，英文簡寫IQR。四分位數就係嗰兩個四分之一嘅標記，四分位距就係呢兩個標記之間嘅距離，即係Q3減Q1。呢個星期一，佢係80杯。咁換成任何一組店，又點樣寫低？
- id: defn
  visual: definition_card
  seconds: 52
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: The IQR, written down
  title_zh: 把四分位距写下来
  title_zh_hk: 將四分位距寫低
  formula_en: IQR = Q3 − Q1
  formula_zh: 四分位距 = Q3 − Q1
  formula_zh_hk: 四分位距 = Q3 − Q1
  gloss_en: Q1 is the 25th percentile, Q3 the 75th
  gloss_zh: Q1 是第25百分位数，Q3 是第75百分位数
  gloss_zh_hk: Q1 係第25百分位數，Q3 係第75百分位數
  s1_en: >-
    Here it is in symbols. Put the values in order. Q1 is the value a quarter of the way up, and Q3 is the value three quarters of the way up.
    The IQR is Q3 minus Q1. With the nearest-rank method, the place is the fraction times the number of values, rounded up.
  s1_zh: 用符号写出来：先把数排好。Q1是往上四分之一处的数，Q3是往上四分之三处的数。四分位距就是Q3减Q1。用最接近秩法，位置就是这个比例乘以数的个数，有小数就向上取整。
  s1_zh_hk: 用符號寫出嚟：先將啲數排好。Q1係向上四分之一嗰度嘅數，Q3係向上四分之三嗰度嘅數。四分位距就係Q3減Q1。用最接近秩法，位置就係呢個比例乘數嘅個數，有小數就向上取整。
  s2_en: >-
    Another name for Q1 is the 25th percentile, because about 25 percent of the values sit at or below it. Q3 is the 75th percentile.
    So the box holds roughly the middle half of the values. With only five shops, roughly matters; here the box holds three of the five.
    So why would a planner trust the middle more than the ends? Watch what one unusual shop does.
  s2_zh: Q1的另一个名字是第25百分位数，因为大约25%的数不高于它；Q3就是第75百分位数。所以箱子框住的，大约是中间一半的数。只有五家店，“大约”很重要：这里箱子框住了五家里的三家。那为什么规划的人更相信中间，而不是两头？看看一家不寻常的店会怎样。
  s2_zh_hk: Q1嘅另一個名係第25百分位數，因為大約25%嘅數唔高過佢；Q3就係第75百分位數。所以個盒框住嘅，大約係中間一半嘅數。得五間店，「大約」好重要：呢度個盒框住咗五間入面嘅三間。咁點解做規劃嘅人信中間多過兩頭？睇吓一間唔尋常嘅店會點。
