  s1_en: "It tells the manager which shop swings more. Both average 365 cups a day. The standard deviation is the one number that says how spread out each shop's five days are."
  s1_zh: "它告诉经理哪家店晃得更厉害。两家平均每天都是365杯。标准差就是那个概括每家店五天有多分散的数。"
  s1_zh_hk: "佢話畀經理知邊間店搖得更厲害。兩間平均每日都係365杯。標準差就係嗰個概括每間店五日有幾分散嘅數。"
  s2_en: "Shop A is about 47 cups. That is a summary of all five days, not a distance that fits each day. Day 1 was 65 below, and Day 3 was exactly on the average. A needs the flexible plan."
  s2_zh: "A店大约是47杯。这是五天合在一起的概括，不是每一天的实际距离。第1天低了65杯，第3天正好在平均数上。A店需要那套灵活的计划。"
  s2_zh_hk: "A店大約係47杯。呢個係五日合埋嘅概括，唔係每一日嘅實際距離。第1日低咗65杯，第3日啱啱喺平均數上。A店需要嗰套靈活嘅計劃。"
  s3_en: "Shop B is 10 cups. Same idea, smaller number. A steadier plan can hold. Same average, different swing, different plans. So what can 47 tell a manager, and what can it not?"
  s3_zh: "B店是10杯。同样的想法，数字更小。一套较稳的计划可以撑住。平均相同，晃动不同，计划不同。那么，47能告诉经理什么，又不能告诉什么？"
  s3_zh_hk: "B店係10杯。同樣嘅想法，數字更細。一套較穩嘅計劃可以撐住。平均相同，搖動唔同，計劃唔同。咁，47可以話畀經理知啲乜，又唔可以話啲乜？"
- id: limit
  visual: two_column
  seconds: 62
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A reason to check, not an order
  title_zh: 是检查的理由，不是指令
  title_zh_hk: 係檢查嘅理由，唔係指令
  left_en: Uses all five days
  left_zh: 用上全部五天
  left_zh_hk: 用晒全部五日
  right_en: Not an order to add 47
  right_zh: 不是加47人的指令
  right_zh_hk: 唔係加47人嘅指令
  s1_en: "Start with why the number is worth keeping, and then where it stops."
  s1_zh: "先说这个数为什么值得留着，再说它到哪里为止。"
  s1_zh_hk: "先講點解呢個數值得留住，再講佢去到邊度為止。"
  s2_en: "It uses all five days. Multiplying by itself stops the two sides from cancelling, and asking what number times itself brings the answer back to cups. Even when the averages match, we can still see that the plans should differ."
  s2_zh: "它用到了全部五天。自己乘自己让两边不再抵消，再问哪个数乘自己，答案就回到杯。即使平均数一样，我们仍然看得出计划应该不同。"
  s2_zh_hk: "佢用到晒全部五日。自己乘自己令兩邊唔再抵銷，再問邊個數乘自己，答案就返到杯。就算平均數一樣，我哋仍然睇得出計劃應該唔同。"
  s3_en: "But 47 cups is not an order to add 47 people, or to prepare 47 extra cups. It is a reason to check whether A needs a more flexible plan. One number is not the whole file, either. A day far from the average, times itself, is a large number and can pull the standard deviation up, and two different patterns of days can give the same number. So keep the five days in view."
  s3_zh: "但47杯不是多安排47人的指令，也不是多准备47杯的指令。它是一个理由，让我们去检查A店是否需要一套更灵活的计划。而且一个数不是整份记录。某一天离平均数很远，自己乘自己就是一个大数，可能把标准差拉高；两种不同的五天，也可能算出同一个数。所以还要看着原来的五天。"
  s3_zh_hk: "但47杯唔係多安排47個人嘅指令，亦唔係多準備47杯嘅指令。佢係一個理由，令我哋去檢查A店係咪需要一套更靈活嘅計劃。而且一個數唔係成份紀錄。某一日離平均數好遠，自己乘自己就係一個大數，可能將標準差拉高；兩種唔同嘅五日，亦可能計出同一個數。所以仲要睇住原本嘅五日。"
- id: answer
  visual: takeaway
  seconds: 58
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Same average. Different plans.
  title_zh: 平均相同，计划不同
  title_zh_hk: 平均相同，計劃唔同
  q1_en: Why not use the same plan for both shops?
  q1_zh: 为什么不能给两家用同一套计划？
  q1_zh_hk: 點解唔可以畀兩間用同一套計劃？
  q2_en: What do we do with 47 cups?
  q2_zh: 47杯用来做什么？
  q2_zh_hk: 47杯用嚟做咩？
  s1_en: "Back to the question. Both shops average 365 cups, but the swing is not the same. A is about 47 cups. B is 10. Same average does not mean the same plan."
  s1_zh: "回到问题。两家都是365杯，但晃动不一样。A店大约是47杯。B店是10杯。平均相同，不表示计划相同。"
  s1_zh_hk: "返到問題。兩間都係365杯，但搖動唔一樣。A店大約係47杯。B店係10杯。平均相同，唔代表計劃相同。"
  s2_en: "Give A a more flexible plan, so the busy day has enough hands. Give B a steadier plan, closer to 365. Use 47 as a reason to check, not as an order to add 47 people."
  s2_zh: "给A店一套更灵活的计划，让忙的那天有足够的人手。给B店一套较稳的计划，靠近365。把47当作一个检查的理由，而不是加人47个的指令。"
  s2_zh_hk: "畀A店一套更靈活嘅計劃，令忙嗰日有足夠嘅人手。畀B店一套較穩嘅計劃，靠近365。將47當作一個檢查嘅理由，而唔係加人47個嘅指令。"
  s3_en: "Before you set the plan, check how long a cup takes, how long a customer will wait, and what too many or too few staff cost. These numbers describe only the five days we supposed. Use the average and the standard deviation with those details. Neither number decides the plan by itself."
  s3_zh: "定排班之前，还要看做一杯要多久、顾客愿意等多久，以及人手太多或太少的成本。这些数只描述我们假设的五天。把平均数、标准差和这些经营细节放在一起看。哪一个数都不能单独决定排班。"
  s3_zh_hk: "定排班之前，仲要睇整一杯要幾耐、顧客肯等幾耐，同埋人手太多或者太少嘅成本。呢啲數只係描述我哋假設嘅五日。將平均數、標準差同呢啲營運細節放埋一齊睇。邊一個數都唔可以單獨決定排班。"
