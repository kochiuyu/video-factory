  s1_en: "Start from Shop A's five deviations, minus 65 up to plus 65, and multiply each one by itself. You can see it under each day: minus 65 times minus 65, minus 35 times minus 35, zero times zero, 35 times 35, and 65 times 65. A minus times a minus is a plus, so every bar now points up."
  s1_zh: "从A店的五个偏差开始，从负65到正65，每一个都乘以自己。每天下面都写着：负65乘负65，负35乘负35，零乘零，35乘35，65乘65。负数乘负数得正数，所以现在每一根都朝上。"
  s1_zh_hk: "由A店嘅五個偏差開始，由負65到正65，每一個都乘自己。每日下面都寫住：負65乘負65，負35乘負35，零乘零，35乘35，65乘65。負數乘負數得正數，所以而家每一條都向上。"
  s2_en: "Now read the results. Day 1 is 4,225. Day 2 is 1,225. Day 3 stays zero. Day 4 is 1,225, and Day 5 is 4,225. Nothing can cancel now."
  s2_zh: "现在读出结果。第1天是4,225。第2天是1,225。第3天还是零。第4天是1,225，第5天是4,225。现在不会再抵消了。"
  s2_zh_hk: "而家讀出結果。第1日係4,225。第2日係1,225。第3日仍然係零。第4日係1,225，第5日係4,225。而家唔會再抵銷喇。"
  s3_en: "Look at the two far days. They tower over the rest, because a bigger distance times itself grows much faster. Add the five. 4,225 plus 1,225 plus zero plus 1,225 plus 4,225 is 10,900. So what do we do with 10,900?"
  s3_zh: "看看最远的两天。它们比其他几天高出很多，因为距离越大，自己乘自己就长得越快。把五个加起来。4,225加1,225加零加1,225加4,225，等于10,900。那这个10,900要怎么用？"
  s3_zh_hk: "睇吓最遠嗰兩日。佢哋比其他日高出好多，因為距離越大，自己乘自己就大得越快。將五個加埋。4,225加1,225加零加1,225加4,225，等於10,900。咁呢個10,900要點用？"
