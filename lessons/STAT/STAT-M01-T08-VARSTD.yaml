  kicker: Why Square
  kicker_en: Why Square
  kicker_zh: 为什么要平方
  kicker_zh_hk: 點解要平方
  title_en: Multiply a number by itself
  title_zh: 把一个数乘以自己
  title_zh_hk: 將一個數乘自己
  step1_en: "3 × 3 = 9. That is 3 squared."
  step1_zh: "3 × 3 = 9。这就是 3 的平方。"
  step1_zh_hk: "3 × 3 = 9。呢個就係 3 嘅平方。"
  step2_en: "−65 × −65 = +4,225"
  step2_zh: "−65 × −65 = +4,225"
  step2_zh_hk: "−65 × −65 = +4,225"
  step3_en: "+65 × +65 = +4,225"
  step3_zh: "+65 × +65 = +4,225"
  step3_zh_hk: "+65 × +65 = +4,225"
  step4_en: "Minus times minus is plus"
  step4_zh: "负数乘负数，得到正数"
  step4_zh_hk: "負數乘負數，得到正數"
  s1_en: "Here is one way: multiply each distance by itself. Start small. Three times three is 9. We say 3 squared. Squared only means a number times itself."
  s1_zh: "有一个办法：把每个距离乘以自己。先看一个小的。3乘3等于9。我们说3的平方。平方只是一个数乘以自己。"
  s1_zh_hk: "有一個方法：將每個距離乘自己。先睇一個細嘅。3乘3等於9。我哋話3嘅平方。平方只係一個數乘自己。"
  s2_en: "Now the quiet day, 65 cups below. Minus 65 times minus 65. A minus times a minus is a plus. The answer is positive 4,225."
  s2_zh: "现在看清闲的那天，低了65杯。负65乘负65。负数乘负数，得到正数。答案是正4,225。"
  s2_zh_hk: "而家睇清閒嗰日，低咗65杯。負65乘負65。負數乘負數，得到正數。答案係正4,225。"
  s3_en: "The busy day is 65 cups above. Plus 65 times plus 65 is also 4,225. Same size, same answer. The minus sign is gone."
  s3_zh: "忙的那天高了65杯。正65乘正65，也是4,225。距离一样，答案一样。负号没有了。"
  s3_zh_hk: "忙嗰日高咗65杯。正65乘正65，都係4,225。距離一樣，答案一樣。負號冇咗。"
  s4_en: "So a day below counts the same as a day above. And a larger distance weighs more. Sixty-five times 65 is 4,225. Thirty-five times 35 is only 1,225. The busy day is not lost. So what do all five days give?"
  s4_zh: "所以低于平均数的一天和高于平均数的一天算得一样。而且距离大的更重。65乘65是4,225。35乘35只有1,225。忙的那天不会消失。那五天全部这样做，会得到什么？"
  s4_zh_hk: "所以低過平均數嘅一日同高過平均數嘅一日計得一樣。而且距離大嘅更重。65乘65係4,225。35乘35只有1,225。忙嗰日唔會消失。咁五日全部咁做，會得到啲咩？"
