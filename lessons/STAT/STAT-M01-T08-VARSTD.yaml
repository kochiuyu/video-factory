  footer_zh_hk: 兩個平均數都係 365
  s1_en: "Here are the five days for Shop A, in cups sold. Day 1 sold 300. Day 2 sold 330. Day 3 sold 365. Day 4 sold 400. Day 5 sold 430."
  s1_zh: "这是A店五天卖出的杯数。第1天卖了300杯。第2天卖了330杯。第3天卖了365杯。第4天卖了400杯。第5天卖了430杯。"
  s1_zh_hk: "呢個係A店五日賣出嚟嘅杯數。第1日賣咗300杯。第2日賣咗330杯。第3日賣咗365杯。第4日賣咗400杯。第5日賣咗430杯。"
  s2_en: "Those five add to 1,825, so the average is 365, as we just used. The quietest day is 65 cups below, and the busiest is 65 above."
  s2_zh: "这五天加起来是1,825，所以平均数是365，就是我们刚才用的那个。最清闲的那天低了65杯，最忙的那天高了65杯。"
  s2_zh_hk: "呢五日加起嚟係1,825，所以平均數係365，就係我哋頭先用嗰個。最清閒嗰日低咗65杯，最忙嗰日高咗65杯。"
  s3_en: "Shop B sold 350, 360, 365, 370, and 380. Same total, same average. But its quietest and busiest days are only 15 cups away. Does that difference change the plan?"
  s3_zh: "B店卖了350、360、365、370和380杯。总数一样，平均数一样。但它最清闲和最忙的两天，离平均数都只有15杯。这个差别会改变计划吗？"
  s3_zh_hk: "B店賣咗350、360、365、370同380杯。總數一樣，平均數一樣。但佢最清閒同最忙嗰兩日，離平均數都只有15杯。呢個分別會唔會改變計劃？"
- id: plans
  visual: two_column
  seconds: 46
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两套计划
  kicker_zh_hk: 兩套計劃
  title_en: Same average. Not the same plan.
  title_zh: 平均相同，不是同一套计划
  title_zh_hk: 平均相同，唔係同一套計劃
  left_en: 'A swings 65: flexible plan'
  left_zh: A店晃65杯：灵活排班
  left_zh_hk: A店搖65杯：靈活排班
  right_en: 'B within 15: steady plan'
  right_zh: B店只差15杯：稳定排班
  right_zh_hk: B店只差15杯：穩定排班
  s1_en: "It does. The averages match, and the days do not. That is the different swing. A moves 65 cups either side of 365. B stays within 15."
  s1_zh: "会。平均数一样，每天不一样。这就是不同的晃动。A店在365两边各晃了65杯。B店始终离365不超过15杯。"
  s1_zh_hk: "會。平均數一樣，每日唔一樣。呢個就係唔同嘅搖動。A店喺365兩邊各搖咗65杯。B店始終離365唔超過15杯。"
  s2_en: "Staff A for a swing. On the busy day it needs more hands, or the queue grows. A steady plan built for 365 will be short."
  s2_zh: "给A店按晃动来排班。忙的那天需要更多人手，不然队伍会变长。一套按365来的稳定计划会不够。"
  s2_zh_hk: "畀A店按搖動嚟排班。忙嗰日需要更多人手，唔係隊伍會變長。一套按365嚟嘅穩定計劃會唔夠。"
  s3_en: "Staff B closer to a steady 365. Its days barely move, so the same plan can hold. Same average, different swing, different plans. So what one number says how big each swing is?"
  s3_zh: "给B店按较稳的365来排班。它的每天几乎不动，所以同一套计划可以撑住。平均相同，晃动不同，计划不同。那么，用哪一个数来说每家店晃得有多大？"
  s3_zh_hk: "畀B店按較穩嘅365嚟排班。佢嘅每日幾乎唔郁，所以同一套計劃可以撐住。平均相同，搖動唔同，計劃唔同。咁用邊一個數，嚟講每間店搖得有幾大？"
- id: distance
  visual: dev_bars
  seconds: 70
  kicker: The Distances
  kicker_en: The Distances
  kicker_zh: 距离
  kicker_zh_hk: 距離
  title_en: Each day minus 365
  title_zh: 每天减去365
  title_zh_hk: 每日減365
  values: 300;330;365;400;430
  mean: 365
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  mark: far
  footer_en: 'Minus: below 365. Plus: above 365.'
  footer_zh: 负号：低于365；正号：高于365
  footer_zh_hk: 負號：低過365；正號：高過365
  s1_en: "Start with Shop A, the one that needs the flexible plan. Put each day beside the 365 line. Day 1, 300 cups, sits below it. Day 2, 330, is below too. Day 3 is right on it. Days 4 and 5, 400 and 430, sit above."
  s1_zh: "先从A店开始，就是需要灵活计划的那家。把每一天放在365这条线旁边。第1天卖了300杯，在线下面。第2天330杯，也在下面。第3天正好在线上。第4天和第5天，400和430，在线上面。"
  s1_zh_hk: "先由A店開始，就係需要靈活計劃嗰間。將每一日放喺365呢條線旁邊。第1日賣咗300杯，喺線下面。第2日330杯，都喺下面。第3日啱啱喺線上。第4日同第5日，400同430，喺線上面。"
  s2_en: "Now measure each gap: the day minus 365. Day 1 is 300 minus 365, so minus 65. Day 2 is minus 35. Day 3 is zero. Day 4 is plus 35, and Day 5 is plus 65. A minus means the day was below the average. A plus means it was above."
  s2_zh: "现在量一量每天的差距：当天的杯数减去365。第1天是300减365，等于负65。第2天是负35。第3天是零。第4天是正35，第5天是正65。负号表示那天低于平均数。正号表示高于平均数。"
  s2_zh_hk: "而家度吓每日嘅差距：當日嘅杯數減365。第1日係300減365，等於負65。第2日係負35。第3日係零。第4日係正35，第5日係正65。負號代表嗰日低過平均數。正號代表高過平均數。"
  s3_en: "The two far days are 65 cups away, one quiet and one busy. These how-far numbers, with their plus or minus, are called deviations. The idea is just how far, and which side. So can we simply add the five of them to measure the swing?"
  s3_zh: "最远的两天都离了65杯，一天清闲，一天忙。这些“有多远”、带正号或负号的数，叫作偏差。意思就是有多远，在哪一边。那么，能不能把这五个数直接加起来，来衡量晃动？"
  s3_zh_hk: "最遠嗰兩日都離咗65杯，一日清閒，一日忙。呢啲「有幾遠」、帶正號或者負號嘅數，叫做偏差。意思就係有幾遠，喺邊一邊。咁，可唔可以將呢五個數直接加埋，嚟量度搖動？"
- id: cancel
  visual: balance_line
  seconds: 60
  kicker: Why Not Add
  kicker_en: Why Not Add
  kicker_zh: 为什么不能直接加
  kicker_zh_hk: 點解唔可以直接加
  title_en: The two sides cancel
  title_zh: 两边互相抵消
  title_zh_hk: 兩邊互相抵銷
  values: 300;330;365;400;430
  mean: 365
  left_en: 'Below: 65 + 35 = 100'
  left_zh: 低于365：65 + 35 = 100
  left_zh_hk: 低過365：65 + 35 = 100
  right_en: 'Above: 35 + 65 = 100'
  right_zh: 高于365：35 + 65 = 100
  right_zh_hk: 高過365：35 + 65 = 100
  footer_en: −65 − 35 + 0 + 35 + 65 = 0
  footer_zh: −65 − 35 + 0 + 35 + 65 = 0
  footer_zh_hk: −65 − 35 + 0 + 35 + 65 = 0
  s1_en: "Let's try. Put Shop A's five days on one line: 300, 330, 365, 400, and 430. Their deviations are minus 65, minus 35, zero, plus 35, and plus 65."
  s1_zh: "试一试。把A店的五天放在一条线上：300、330、365、400和430。它们的偏差是负65、负35、零、正35和正65。"
  s1_zh_hk: "試吓。將A店嘅五日放喺一條線上面：300、330、365、400同430。佢哋嘅偏差係負65、負35、零、正35同正65。"
  s2_en: "Now put the average, 365, under the line as a balance point. Think of a seesaw. The quiet days sit on one side, and the busy days sit on the other."
  s2_zh: "现在把平均数365放在线的下面，当作支点。想象一个跷跷板。清闲的天在一边，忙的天在另一边。"
  s2_zh_hk: "而家將平均數365放喺條線下面，當係支點。想像一個蹺蹺板。清閒嘅日喺一邊，忙嘅日喺另一邊。"
  s3_en: "The days below pull by 65 plus 35, which is 100 cups. The days above pull by 35 plus 65, also 100. Add all five deviations and you get zero. Zero does not mean Shop A did not swing; we just saw the busy day. So how do we count, so that a day below and a day above do not cancel?"
  s3_zh: "低于平均数的两天，是65加35，等于100杯。高于平均数的两天，是35加65，也是100杯。五个偏差全部加起来，等于零。零不表示A店没有晃，我们刚才已经看到了忙的那天。那要怎么算，才能让低的一天和高的一天不会互相抵消？"
  s3_zh_hk: "低過平均數嗰兩日，係65加35，即係100杯。高過平均數嗰兩日，係35加65，都係100杯。五個偏差全部加埋，等於零。零唔代表A店冇搖，我哋頭先已經見到忙嗰日。咁要點計，先可以令低嘅一日同高嘅一日唔會互相抵銷？"
- id: square
  visual: steps
