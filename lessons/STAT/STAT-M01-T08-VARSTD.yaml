- id: variance
  visual: steps
  seconds: 85
  kicker: The Formula
  kicker_en: The Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: Short names for our steps
  title_zh: 给做过的步骤起简称
  title_zh_hk: 畀做過嘅步驟起簡稱
  step1_en: "Each day is an x: x₁ = 300"
  step1_zh: "每一天是一个 x：x₁ = 300"
  step1_zh_hk: "每一日係一個 x：x₁ = 300"
  step2_en: "The average is μ = 365"
  step2_zh: "平均数是 μ = 365"
  step2_zh_hk: "平均數係 μ = 365"
  step3_en: "How far: x₁ − μ = −65"
  step3_zh: "有多远：x₁ − μ = −65"
  step3_zh_hk: "有幾遠：x₁ − μ = −65"
  step4_en: "Σ means add; n = 5 days"
  step4_zh: "Σ 表示相加；n = 5 天"
  step4_zh_hk: "Σ 表示相加；n = 5 日"
  step5_en: "σ² = Σ(x − μ)² / n = 2,180"
  step5_zh: "σ² = Σ(x − μ)² / n = 2,180"
  step5_zh_hk: "σ² = Σ(x − μ)² / n = 2,180"
  s1_en: "A formula is only nicknames for steps we already did. Each day gets a letter x, with a small number. Day 1 is x one, and it is 300 cups. Day 5 is x five."
  s1_zh: "公式只是给已经做过的步骤起简称。每一天用一个字母 x，带一个小数字。第1天是 x一，是300杯。第5天是 x五。"
  s1_zh_hk: "公式只係畀已經做過嘅步驟起簡稱。每一日用一個字母 x，帶一個細數字。第1日係 x一，係300杯。第5日係 x五。"
  s2_en: "The average already has a nickname: the Greek letter mu. Here mu is 365. It is the equal share we used. Nothing new."
  s2_zh: "平均数已经有简称了：希腊字母 mu。这里 mu 是365。就是我们用过的那个平均份额。没有新东西。"
  s2_zh_hk: "平均數已經有簡稱：希臘字母 mu。呢度 mu 係365。就係我哋用過嗰個平均份額。冇新嘢。"
  s3_en: "How far a day sits from the average is x minus mu. For Day 1, x one minus mu is 300 minus 365, which was minus 65. The little number only says which day."
  s3_zh: "一天离平均数有多远，就是 x 减去 mu。第1天，x一减 mu，是300减365，就是负65。小数字只是说哪一天。"
  s3_zh_hk: "一日離平均數有幾遠，就係 x 減 mu。第1日，x一減 mu，係300減365，就係負65。細數字只係話邊一日。"
  s4_en: "Capital sigma means add every one of them, not just two. n is how many days, not a cup count. Here n is 5."
  s4_zh: "大写西格玛表示每一个都加，不是只加两个。n 是有多少天，不是杯数。这里 n 是5。"
  s4_zh_hk: "大寫西格瑪表示每一個都加，唔係只加兩個。n 係有幾多日，唔係杯數。呢度 n 係5。"
  s5_en: "Now put it together. Sigma with a little 2 is the nickname for the variance. Take each x minus mu and multiply it by itself; that is the little 2 after the bracket. Add them all with sigma, then divide by n. For A, 10,900 divided by 5 is 2,180. Still cups times cups. So how do we get back to cups?"
  s5_zh: "现在合起来。带小2的西格玛是方差的简称。每个 x 减 mu，再乘以自己，就是括号后面那个小2。用西格玛全部加起来，再除以 n。A店是10,900除以5，等于2,180。单位还是杯乘杯。那怎么回到杯？"
  s5_zh_hk: "而家合埋佢。帶細2嘅西格瑪係方差嘅簡稱。每個 x 減 mu，再乘自己，就係括號後面嗰個細2。用西格瑪全部加埋，再除以 n。A店係10,900除以5，等於2,180。單位仲係杯乘杯。咁點樣返到杯？"
- id: formula
  visual: steps
  seconds: 73
  kicker: Back to Cups
  kicker_en: Back to Cups
  kicker_zh: 回到杯
  kicker_zh_hk: 返到杯
  title_en: What times itself is 2,180?
  title_zh: 哪个数乘自己是2,180？
  title_zh_hk: 邊個數乘自己係2,180？
  step1_en: "2,180 is cups times cups"
  step1_zh: "2,180 是杯乘杯"
  step1_zh_hk: "2,180 係杯乘杯"
  step2_en: "√100 = 10, as 10 × 10 = 100"
  step2_zh: "√100 = 10，因为 10 × 10 = 100"
  step2_zh_hk: "√100 = 10，因為 10 × 10 = 100"
  step3_en: "47 × 47 = 2,209, near 2,180"
  step3_zh: "47 × 47 = 2,209，接近 2,180"
  step3_zh_hk: "47 × 47 = 2,209，接近 2,180"
  step4_en: "√2,180 ≈ 47"
  step4_zh: "√2,180 ≈ 47"
  step4_zh_hk: "√2,180 ≈ 47"
  s1_en: "We undo the multiplying. 2,180 is cups times cups, and a manager cannot staff with that. So we ask a simpler question: what number times itself is about 2,180?"
  s1_zh: "我们把乘法倒回去。2,180是杯乘杯，经理没法用它来排班。所以我们问一个更简单的问题：哪个数乘自己，大约等于2,180？"
  s1_zh_hk: "我哋將乘法倒返轉頭。2,180係杯乘杯，經理冇辦法用佢嚟排班。所以我哋問一個更簡單嘅問題：邊個數乘自己，大約等於2,180？"
  s2_en: "Try a small one first. Ten times ten is 100. So the number that times itself gives 100 is 10. That backward step is called a square root. The root sign means: find that number."
  s2_zh: "先试一个小的。10乘10等于100。所以自己乘自己得到100的那个数是10。这一步往回走，叫作开平方。根号的意思就是：找出那个数。"
  s2_zh_hk: "先試一個細嘅。10乘10等於100。所以自己乘自己得到100嗰個數係10。呢一步行返轉頭，叫做開平方。根號嘅意思就係：搵出嗰個數。"
  s3_en: "For A, 47 times 47 is 2,209, close to 2,180. So the square root of 2,180 is about 47. The symbol is sigma, without the little 2. Same idea, back in cups."
  s3_zh: "A店这边，47乘47是2,209，靠近2,180。所以2,180开平方，大约是47。符号是不带小2的西格玛。还是同一个想法，单位回到杯。"
  s3_zh_hk: "A店呢邊，47乘47係2,209，靠近2,180。所以2,180開平方，大約係47。符號係唔帶細2嘅西格瑪。仲係同一個想法，單位返到杯。"
  s4_en: "About 47 cups is a summary of how spread out these five days are. It does not mean every day is 47 cups away. If we had just averaged the distances, without multiplying, we would get 40 cups. 47 is larger because the far days were multiplied by themselves. So what do we call this 47?"
  s4_zh: "大约47杯，概括的是这五天有多分散。它不表示每天都离平均数47杯。如果只把距离平均，不做乘法，会得到40杯。47更大，是因为远的那两天被自己乘过。那这个47叫什么？"
  s4_zh_hk: "大約47杯，概括嘅係呢五日有幾分散。佢唔代表每日都離平均數47杯。如果只將距離平均，唔做乘法，會得到40杯。47更大，係因為遠嗰兩日被自己乘過。咁呢個47叫咩名？"
