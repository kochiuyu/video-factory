duration_target_s: 776
title_en: What are variance and standard deviation?
title_zh: 什么是方差和标准差？
title_zh_hk: 咩係方差同標準差？
objective_en: Explain how two shops can have the same average sales but different daily variation, and why that calls for different plans. Calculate variance and standard deviation for the five days, and explain what these results can and cannot tell a manager.
objective_zh: 解释为什么两家店的平均销量相同、每天的波动却不同，以及为什么这需要不同的计划。计算这五天的方差和标准差，并说明这些结果能帮助经理了解什么、不能决定什么。
objective_zh_hk: 解釋點解兩間店嘅平均銷量相同、每日嘅波動卻唔同，以及點解呢個需要唔同嘅計劃。計算呢五日嘅方差同標準差，再講清楚呢啲結果可以幫經理了解啲乜、唔可以決定啲乜。
