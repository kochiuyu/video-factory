- id: variance
  visual: steps
  seconds: 56
  kicker: The Formula
  kicker_en: The Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: Nicknames for steps we already did
  title_zh: 给已经做过的步骤起简称
  title_zh_hk: 畀已經做過嘅步驟起簡稱
  step1_en: "Each day is an x. Day 1 is x₁ = 300."
  step1_zh: "每一天是一个 x。第1天是 x₁ = 300。"
  step1_zh_hk: "每一日係一個 x。第1日係 x₁ = 300。"
  step2_en: "The average is μ. Here μ = 365."
  step2_zh: "平均数是 μ。这里 μ = 365。"
  step2_zh_hk: "平均數係 μ。呢度 μ = 365。"
  step3_en: "How far: x − μ. Day 1 was −65."
  step3_zh: "有多远：x − μ。第1天是 −65。"
  step3_zh_hk: "有幾遠：x − μ。第1日係 −65。"
  step4_en: "Σ means add. n is how many days: 5."
  step4_zh: "Σ 表示相加。n 是有多少天：5。"
  step4_zh_hk: "Σ 表示相加。n 係有幾多日：5。"
  step5_en: "Variance σ² = add the squares, then ÷ n"
  step5_zh: "方差 σ² = 把平方加起来，再 ÷ n"
  step5_zh_hk: "方差 σ² = 將平方加起嚟，再 ÷ n"
  s1_en: "The formula is only nicknames for steps we already did. Each day gets a letter x, with a small number. Day 1 is x one, and it is 300 cups. Day 5 is x five."
  s1_zh: "公式只是给已经做过的步骤起简称。每一天用一个字母 x，带一个小数字。第1天是 x一，是300杯。第5天是 x五。"
  s1_zh_hk: "公式只係畀已經做過嘅步驟起簡稱。每一日用一個字母 x，帶一個細數字。第1日係 x一，係300杯。第5日係 x五。"
  s2_en: "The average already has a nickname. The Greek letter mu. Here mu is 365. It is the equal share we used. Nothing new."
  s2_zh: "平均数已经有简称了。希腊字母 mu。这里 mu 是365。就是我们用过的那个平均份额。没有新东西。"
  s2_zh_hk: "平均數已經有簡稱。希臘字母 mu。呢度 mu 係365。就係我哋用過嗰個平均份額。冇新嘢。"
  s3_en: "How far a day sits from the average is x minus mu. For day 1, 300 minus 365, which was minus 65. The little number only says which day."
  s3_zh: "一天离平均数有多远，就是 x 减去 mu。第1天是300减365，就是负65。小数字只是说哪一天。"
  s3_zh_hk: "一日離平均數有幾遠，就係 x 減 mu。第1日係300減365，就係負65。細數字只係話邊一日。"
  s4_en: "We then multiplied that distance by itself. Capital sigma means add every one of those, not just two. n is how many days, not a cup count. Here n is 5."
  s4_zh: "然后我们把这个距离乘以自己。大写西格玛表示每一个都加，不是只加两个。n 是有多少天，不是杯数。这里 n 是5。"
  s4_zh_hk: "跟住我哋將呢個距離乘自己。大寫西格瑪表示每一個都加，唔係只加兩個。n 係有幾多日，唔係杯數。呢度 n 係5。"
  s5_en: "Sigma with a little 2 is the nickname for the variance. In words: add every times-itself number, then divide by n. For A that was 10,900 divided by 5, which is 2,180. Still cups times cups."
  s5_zh: "带小2的西格玛是方差的简称。用话说：把每一个“自己乘自己”加起来，再除以 n。A店是10,900除以5，等于2,180。单位还是杯乘杯。"
  s5_zh_hk: "帶細2嘅西格瑪係方差嘅簡稱。用話講：將每一個「自己乘自己」加起嚟，再除以 n。A店係10,900除以5，等於2,180。單位仲係杯乘杯。"
- id: formula
  visual: steps
  seconds: 50
  kicker: Back to Cups
  kicker_en: Back to Cups
  kicker_zh: 回到杯
  kicker_zh_hk: 返到杯
  title_en: What number times itself is 2,180?
  title_zh: 哪个数乘自己等于2,180？
  title_zh_hk: 邊個數乘自己等於2,180？
  step1_en: "2,180 is cups times cups"
  step1_zh: "2,180 是杯乘杯"
  step1_zh_hk: "2,180 係杯乘杯"
  step2_en: "10 × 10 = 100"
  step2_zh: "10 × 10 = 100"
  step2_zh_hk: "10 × 10 = 100"
  step3_en: "47 × 47 is about 2,180"
  step3_zh: "47 × 47 大约是 2,180"
  step3_zh_hk: "47 × 47 大約係 2,180"
  step4_en: "That 47 is the standard deviation"
  step4_zh: "这个 47 就是标准差"
  step4_zh_hk: "呢個 47 就係標準差"
  s1_en: "So how do we get back to cups? 2,180 is cups times cups. A manager cannot staff with that. We ask a simpler question: what number times itself is about 2,180?"
  s1_zh: "那么怎么回到杯呢？2,180是杯乘杯。经理没法用它来排班。我们问一个更简单的问题：哪个数乘自己，大约等于2,180？"
  s1_zh_hk: "咁點樣返到杯呢？2,180係杯乘杯。經理冇辦法用佢嚟排班。我哋問一個更簡單嘅問題：邊個數乘自己，大約等於2,180？"
  s2_en: "Try a small one first. Ten times ten is 100. So the number that times itself gives 100 is 10. That backward step is called a square root. The root sign means: find that number."
  s2_zh: "先试一个小的。10乘10等于100。所以自己乘自己得到100的那个数是10。这一步往回走，叫作开平方。根号的意思就是：找出那个数。"
  s2_zh_hk: "先試一個細嘅。10乘10等於100。所以自己乘自己得到100嗰個數係10。呢一步行返轉頭，叫做開平方。根號嘅意思就係：搵出嗰個數。"
  s3_en: "For A, 47 times 47 is about 2,209, close to 2,180. So the number is about 47. We call it the standard deviation. The symbol is sigma without the little 2. Same idea, back in cups."
  s3_zh: "A店这边，47乘47大约是2,209，靠近2,180。所以那个数大约是47。我们叫它标准差。符号是不带小2的西格玛。还是刚才那个想法，单位回到杯。"
  s3_zh_hk: "A店呢邊，47乘47大約係2,209，靠近2,180。所以嗰個數大約係47。我哋叫佢做標準差。符號係唔帶細2嘅西格瑪。仲係頭先嗰個想法，單位返到杯。"
  s4_en: "About 47 cups is a summary of how spread out these five days are. It does not mean every day is 47 cups away. If we had just averaged the distances, without multiplying, we would get 40 cups. 47 is larger because the far days were multiplied by themselves. This number has a name too."
  s4_zh: "大约47杯概括的是这五天有多分散。它不表示每天都离平均数47杯。如果只把距离平均，不做乘法，会得到40杯。47更大，是因为远的那天被自己乘过。这个数也有一个名字。"
  s4_zh_hk: "大約47杯概括嘅係呢五日有幾分散。佢唔代表每日都離平均數47杯。如果只將距離平均，唔做乘法，會得到40杯。47更大，係因為遠嗰日被自己乘過。呢個數都有一個名。"
