  s3_en: "Add them, and you get 500. Share it across five days: 500 divided by 5 is 100. B's variance is 100 square cups. What number times itself is 100? Ten. So B's standard deviation is 10 cups, against A's about 47. What does that tell the manager?"
  s3_zh: "加起来是500。平均分给五天：500除以5，等于100。B店的方差是100平方杯。哪个数乘自己等于100？是10。所以B店的标准差是10杯，A店大约是47杯。这对经理说明了什么？"
  s3_zh_hk: "加埋係500。平均分畀五日：500除以5，等於100。B店嘅方差係100平方杯。邊個數乘自己等於100？係10。所以B店嘅標準差係10杯，A店大約係47杯。咁對經理嚟講，代表咩？"
