  title_zh: 平均分给五天
  title_zh_hk: 平均分畀五日
  step1_en: "Sum of squares = 10,900"
  step1_zh: "平方之和 = 10,900"
  step1_zh_hk: "平方之和 = 10,900"
  step2_en: "10,900 / 5 = 2,180"
  step2_zh: "10,900 / 5 = 2,180"
  step2_zh_hk: "10,900 / 5 = 2,180"
  step3_en: "2,180 square cups"
  step3_zh: "2,180 平方杯"
  step3_zh_hk: "2,180 平方杯"
  s1_en: "10,900 is the total of the times-itself numbers. We are describing just these five days, so share it equally, the same way we shared the cups."
  s1_zh: "10,900是那些“自己乘自己”的总和。我们描述的就是这五天，所以把它平均分，就好像刚才平分杯数一样。"
  s1_zh_hk: "10,900係嗰啲「自己乘自己」嘅總和。我哋描述嘅就係呢五日，所以將佢平均分，就好似頭先平分杯數一樣。"
  s2_en: "Divide by 5. 10,900 divided by 5 is 2,180."
  s2_zh: "除以5。10,900除以5，等于2,180。"
  s2_zh_hk: "除以5。10,900除以5，等於2,180。"
  s3_en: "That 2,180 is the average of the times-itself numbers. Its unit is cups times cups, because we multiplied cups by cups. We say 2,180 square cups. What do we call this number?"
  s3_zh: "这个2,180是那些“自己乘自己”的平均数。单位是杯乘杯，因为我们拿杯乘了杯。我们说2,180平方杯。这个数叫什么？"
  s3_zh_hk: "呢個2,180係嗰啲「自己乘自己」嘅平均數。單位係杯乘杯，因為我哋用杯乘咗杯。我哋話2,180平方杯。呢個數叫咩名？"
