quiz:
- id: Q1
  type: multiple_choice
  question_en: Two shops have the same average daily sales. Why might a manager still need the standard deviation?
  question_zh: 两家店的日均销量相同。为什么经理仍然可能需要标准差？
  question_zh_hk: 兩間店嘅每日平均銷量相同。點解經理仍然可能需要標準差？
  options_en:
  - 'A: To summarise how spread out daily sales are around the average.'
  - 'B: To replace every day with the average.'
  - 'C: To prove that tomorrow will equal the average.'
  - 'D: To set the exact number of staff with no other information.'
  options_zh:
  - 'A: 概括每天的销量在平均数周围有多分散。'
  - 'B: 用平均数替换每一天。'
  - 'C: 证明明天一定等于平均数。'
  - 'D: 不需要其他信息就定出精确人数。'
  options_zh_hk:
  - 'A: 概括每日嘅銷量喺平均數附近有幾分散。'
  - 'B: 用平均數取代每一日。'
  - 'C: 證明聽日一定等於平均數。'
  - 'D: 唔需要其他資料就定出精確人數。'
  answer: A
  explanation_en: The average is total sales divided by the number of days. Standard deviation summarises the spread around that average. It does not predict tomorrow's sales or set staffing by itself.
  explanation_zh: 平均数是总销量除以天数。标准差概括销量在平均数周围有多分散。它不能预测明天的销量，也不能单独决定人手。
  explanation_zh_hk: 平均數係總銷量除以日數。標準差概括銷量喺平均數附近有幾分散。佢唔可以預測聽日嘅銷量，亦唔可以單獨決定人手。
- id: Q2
  type: multiple_choice
  question_en: A's standard deviation is about 47 cups; B's is 10 cups. Both average 365 cups a day. What should management do?
  question_zh: A店的标准差约47杯，B店是10杯。两家平均每天都卖365杯。管理层应该怎么做？
  question_zh_hk: A店嘅標準差大約47杯，B店係10杯。兩間平均每日都賣365杯。管理層應該點做？
  options_en:
  - 'A: Check whether A needs more staffing flexibility, using preparation time, acceptable waiting time, and staffing costs.'
  - 'B: Add exactly 47 workers at A.'
  - 'C: Staff both shops the same way, because both average 365.'
  - 'D: Treat 47 as the ordinary average of the distances.'
  options_zh:
  - 'A: 结合做一杯的时间、可接受的等待时间和人手成本，检查A店是否需要更灵活的排班。'
  - 'B: 在A店正好多安排47人。'
  - 'C: 两家平均都是365，所以人手相同。'
  - 'D: 把47当成这些距离的普通平均数。'
  options_zh_hk:
  - 'A: 配合整一杯嘅時間、可接受嘅等候時間同人手成本，檢查A店係咪需要更靈活嘅排班。'
  - 'B: 喺A店啱啱好多安排47人。'
  - 'C: 兩間平均都係365，所以人手相同。'
  - 'D: 將47當成呢啲距離嘅普通平均數。'
  answer: A
  explanation_en: 'A''s larger standard deviation indicates more spread in these five days. It prompts a check of staffing flexibility, not an order to add 47 people. Standard deviation is not the ordinary average of the distances: A''s distances are 65, 35, 0, 35, and 65 cups, whose ordinary average is 40 cups, not 47.'
  explanation_zh: A店的标准差更大，表示这五天的销量更分散。它提醒我们检查排班是否需要更灵活，不是增加47人的指令。标准差也不是距离的普通平均数：A店的距离是65、35、0、35和65杯，普通平均数是40杯，不是47杯。
  explanation_zh_hk: A店嘅標準差較大，代表呢五日嘅銷量比較分散。佢提醒我哋檢查排班係咪需要更靈活，唔係增加47個人嘅指令。標準差亦唔係距離嘅普通平均數：A店嘅距離係65、35、0、35同65杯，普通平均數係40杯，唔係47杯。
beats:
- id: hook
  visual: title_card
  seconds: 48
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: Same average. Different plans.
  title_zh: 平均相同，计划不同
  title_zh_hk: 平均相同，計劃唔同
  en: Imagine you manage two coffee shops. Both averaged 365 cups a day over five weekdays. Same average. But Shop A swings — quiet days and busy days. Shop B stays close to 365. If you give them the same staffing plan, A will be short on its busy day. Same average does not mean the same plan. We need a number for how much each shop swings.
  zh: 假设你管着两家咖啡店。五个工作日里，两家平均每天都卖365杯。平均数一样。但A店在晃，有清闲的天，也有忙的天。B店每天都靠近365。如果你给两家同一套排班，A店忙的那天会人手不够。平均相同，不表示计划相同。我们需要一个数，来说每家店晃得有多大。
  zh_hk: 假設你管緊兩間咖啡店。五個平日入面，兩間平均每日都賣365杯。平均數一樣。但A店喺度搖，有清閒嘅日，亦有忙嘅日。B店每日都靠近365。如果你畀兩間同一套排班，A店忙嗰日會人手唔夠。平均相同，唔代表計劃相同。我哋需要一個數，嚟講每間店搖得有幾大。
- id: average
  visual: definition_card
  seconds: 40
  kicker: The Average
  kicker_en: The Average
  kicker_zh: 平均数
  kicker_zh_hk: 平均數
  title_en: First, the equal share
  title_zh: 先算平均份额
  title_zh_hk: 先計平均份額
  formula: 'Average = total / number of days

    1,825 / 5 = 365'
  formula_zh: '平均数 = 合计 / 天数

    1,825 / 5 = 365'
  formula_zh_hk: '平均數 = 合計 / 日數

    1,825 / 5 = 365'
  s1_en: "So what number says how much a shop swings? First we need the 365 we are swinging around. Suppose the five days add to 1,825 cups. We will see those days in a moment. The average is the total shared equally. 1,825 divided by 5 is 365 cups a day."
  s1_zh: "那么哪个数能说一家店晃得有多大？先要有我们围着转的那个365。假设这五天加起来是1,825杯。等一下我们会看到这五天。平均数就是把总数平均分。1,825除以5，等于每天365杯。"
  s1_zh_hk: "咁邊個數可以話一間店搖得有幾大？先要有我哋圍住轉嗰個365。假設呢五日加起嚟係1,825杯。等陣我哋會見到呢五日。平均數就係將總數平均分。1,825除以5，等於每日365杯。"
  s2_en: "That does not mean either shop sold 365 every day. It is one reference number, like splitting a bill equally. Next we set each day's cups beside 365. The shop that stays close can keep a steady plan. The shop that swings needs a different one."
  s2_zh: "这不表示两家店每天真的都卖了365杯。它只是一个用来比较的数，就好像把账单平均分摊。接下来，把每天的杯数放在365旁边。离得近的那家可以维持一套稳定的计划。晃得远的那家需要另一套。"
  s2_zh_hk: "呢個唔代表兩間店每日真係都賣咗365杯。佢只係一個用嚟比較嘅數，就好似將帳單平均分攤。跟住，將每日嘅杯數放喺365旁邊。離得近嗰間可以維持一套穩定嘅計劃。搖得遠嗰間需要另一套。"
