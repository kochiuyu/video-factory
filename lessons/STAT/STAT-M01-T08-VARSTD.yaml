  s1_en: "Here are the five days for Shop A, in cups sold. Day 1 sold 300. Day 2 sold 330. Day 3 sold 365. Day 4 sold 400. Day 5 sold 430."
  s1_zh: "这是A店五天卖出的杯数。第1天卖了300杯。第2天卖了330杯。第3天卖了365杯。第4天卖了400杯。第5天卖了430杯。"
  s1_zh_hk: "呢個係A店五日賣出嚟嘅杯數。第1日賣咗300杯。第2日賣咗330杯。第3日賣咗365杯。第4日賣咗400杯。第5日賣咗430杯。"
  s2_en: "Those five add to 1,825, so the average is 365, as we just used. The quietest day is 65 cups below, and the busiest is 65 above."
  s2_zh: "这五天加起来是1,825，所以平均数是365，就是我们刚才用的那个。最清闲的那天低了65杯，最忙的那天高了65杯。"
  s2_zh_hk: "呢五日加起嚟係1,825，所以平均數係365，就係我哋頭先用嗰個。最清閒嗰日低咗65杯，最忙嗰日高咗65杯。"
  s3_en: "Shop B sold 350, 360, 365, 370, and 380. Same total, same average. But its quietest and busiest days are only 15 cups away."
  s3_zh: "B店卖了350、360、365、370和380杯。总数一样，平均数一样。但它最清闲和最忙的两天，离平均数都只有15杯。"
  s3_zh_hk: "B店賣咗350、360、365、370同380杯。總數一樣，平均數一樣。但佢最清閒同最忙嗰兩日，離平均數都只有15杯。"
- id: plans
  visual: two_column
  seconds: 46
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两套计划
  kicker_zh_hk: 兩套計劃
  title_en: Same average. Not the same plan.
  title_zh: 平均相同，不是同一套计划
  title_zh_hk: 平均相同，唔係同一套計劃
  left_en: "A swings 65 cups. Plan for a busy day."
  left_zh: "A店晃了65杯。按忙的那天来计划。"
  left_zh_hk: "A店搖咗65杯。按忙嗰日嚟計劃。"
  right_en: "B stays within 15. A steadier plan can hold."
  right_zh: "B店只离了15杯。一套较稳的计划就够。"
  right_zh_hk: "B店只離咗15杯。一套較穩嘅計劃就夠。"
  s1_en: "So the averages match, and the days do not. That is the different swing. A moves 65 cups either side of 365. B stays within 15."
  s1_zh: "所以平均数一样，每天不一样。这就是不同的晃动。A店在365两边各晃了65杯。B店始终离365不超过15杯。"
  s1_zh_hk: "所以平均數一樣，每日唔一樣。呢個就係唔同嘅搖動。A店喺365兩邊各搖咗65杯。B店始終離365唔超過15杯。"
  s2_en: "Staff A for a swing. On the busy day it needs more hands, or the queue grows. A steady plan built for 365 will be short."
  s2_zh: "给A店按晃动来排班。忙的那天需要更多人手，不然队伍会变长。一套按365来的稳定计划会不够。"
  s2_zh_hk: "畀A店按搖動嚟排班。忙嗰日需要更多人手，唔係隊伍會變長。一套按365嚟嘅穩定計劃會唔夠。"
  s3_en: "Staff B closer to a steady 365. Its days barely move, so the same plan can hold. Same average, different swing, different plans. Now we need one number that says how big each swing is."
  s3_zh: "给B店按较稳的365来排班。它的每天几乎不动，所以同一套计划可以撑住。平均相同，晃动不同，计划不同。现在我们需要一个数，来说每次晃动有多大。"
  s3_zh_hk: "畀B店按較穩嘅365嚟排班。佢嘅每日幾乎唔郁，所以同一套計劃可以撐住。平均相同，搖動唔同，計劃唔同。而家我哋需要一個數，嚟講每次搖動有幾大。"
- id: distance
  visual: steps
  seconds: 50
  kicker: The Distances
  kicker_en: The Distances
  kicker_zh: 距离
  kicker_zh_hk: 距離
  title_en: Each day minus 365
  title_zh: 每天减去365
  title_zh_hk: 每日減365
  step1_en: "Day 1: 300 − 365 = −65"
  step1_zh: "第1天：300 − 365 = −65"
  step1_zh_hk: "第1日：300 − 365 = −65"
  step2_en: "Day 2: 330 − 365 = −35"
  step2_zh: "第2天：330 − 365 = −35"
  step2_zh_hk: "第2日：330 − 365 = −35"
  step3_en: "Day 3: 365 − 365 = 0"
  step3_zh: "第3天：365 − 365 = 0"
  step3_zh_hk: "第3日：365 − 365 = 0"
  step4_en: "Day 4: 400 − 365 = +35"
  step4_zh: "第4天：400 − 365 = +35"
  step4_zh_hk: "第4日：400 − 365 = +35"
  step5_en: "Day 5: 430 − 365 = +65"
  step5_zh: "第5天：430 − 365 = +65"
  step5_zh_hk: "第5日：430 − 365 = +65"
  s1_en: "Start with Shop A, the one that needs the flexible plan. Take each day and subtract 365. Write a minus if the day was below, a plus if it was above. Day 1 is 300 minus 365, so minus 65. Sixty-five cups below."
  s1_zh: "先从A店开始，就是需要灵活计划的那家。用每天的杯数减去365。低于365就写负号，高于365就写正号。第1天是300减365，等于负65。低了65杯。"
  s1_zh_hk: "先由A店開始，就係需要靈活計劃嗰間。用每日嘅杯數減365。低過365就寫負號，高過365就寫正號。第1日係300減365，等於負65。低咗65杯。"
  s2_en: "Day 2 is 330 minus 365, so minus 35."
  s2_zh: "第2天是330减365，等于负35。"
  s2_zh_hk: "第2日係330減365，等於負35。"
  s3_en: "Day 3 is exactly 365, so zero. That day matched the average."
  s3_zh: "第3天正好是365，所以是零。那天和平均数一样。"
  s3_zh_hk: "第3日啱啱係365，所以係零。嗰日同平均數一樣。"
  s4_en: "Day 4 is 400 minus 365, so plus 35."
  s4_zh: "第4天是400减365，等于正35。"
  s4_zh_hk: "第4日係400減365，等於正35。"
  s5_en: "Day 5 is 430 minus 365, so plus 65. A minus means the day was quiet. A plus means it was busy. These how-far numbers, with a plus or a minus, are called deviations. The name can wait. The idea is just how far, and which side."
  s5_zh: "第5天是430减365，等于正65。负号表示那天比较清闲。正号表示那天比较忙。这些“有多远”、带正号或负号的数，叫作偏差。名字可以等一等。意思就是有多远，在哪一边。"
  s5_zh_hk: "第5日係430減365，等於正65。負號表示嗰日比較清閒。正號表示嗰日比較忙。呢啲「有幾遠」、帶正號或者負號嘅數，叫做偏差。名可以等一等。意思就係有幾遠，喺邊一邊。"
- id: cancel
  visual: two_column
  seconds: 42
  kicker: Why Not Add
  kicker_en: Why Not Add
  kicker_zh: 为什么不能直接加
  kicker_zh_hk: 點解唔可以直接加
  title_en: The two sides cancel
  title_zh: 两边互相抵消
  title_zh_hk: 兩邊互相抵銷
  left_en: "Below: 65 + 35 = 100"
  left_zh: "低于365：65 + 35 = 100"
  left_zh_hk: "低過365：65 + 35 = 100"
  right_en: "Above: 35 + 65 = 100"
  right_zh: "高于365：35 + 65 = 100"
  right_zh_hk: "高過365：35 + 65 = 100"
  s1_en: "Can we just add those five how-far numbers to measure the swing? Minus 65, minus 35, zero, plus 35, plus 65."
  s1_zh: "能不能把这五个“有多远”直接加起来，来衡量晃动？负65、负35、零、正35、正65。"
  s1_zh_hk: "可唔可以將呢五個「有幾遠」直接加起嚟，嚟量度搖動？負65、負35、零、正35、正65。"
  s2_en: "The days below pull one way by 100 cups. The days above pull the other way by 100. Think of a seesaw. The two sides balance."
  s2_zh: "低于365的那几天往一边拉了100杯。高于365的那几天往另一边拉了100杯。可以把它想成一个跷跷板。两边平衡。"
  s2_zh_hk: "低過365嗰幾日往一邊拉咗100杯。高過365嗰幾日往另一邊拉咗100杯。可以將佢想成一個蹺蹺板。兩邊平衡。"
  s3_en: "Add them and you get zero. Zero does not mean Shop A did not swing. We already saw the busy day. We need a count in which a day below and a day above do not cancel."
  s3_zh: "加起来是零。零不表示A店没有晃。我们刚才已经看到了忙的那天。我们需要一种算法，让低于平均数的一天和高于平均数的一天不会互相抵消。"
  s3_zh_hk: "加起嚟係零。零唔代表A店冇搖。我哋頭先已經見到忙嗰日。我哋需要一種計法，令低過平均數嘅一日同高過平均數嘅一日唔會互相抵銷。"
