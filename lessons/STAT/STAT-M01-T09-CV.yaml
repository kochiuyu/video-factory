id: STAT-M01-T09-CV
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Comparing risk across different scales
title_zh: 跨越规模比较经营风险
title_zh_hk: 跨越規模比較經營風險
objective_en: Define the coefficient of variation (CV) as standard deviation divided by the mean, explain how it strips away measurement units, and show how managers use it to fairly compare volatility across different store formats and currencies.
objective_zh: 把变异系数（CV）定义为标准差除以均值，解释它如何消除度量单位的影响，并展示管理者如何用它公平比较不同规模分店与不同货币计价下的相对波动风险。
objective_zh_hk: 將變異系數（CV）定義為標準差除以均值，解釋佢點樣消除度量單位嘅影響，並展示管理者點樣用佢公平比較唔同規模分店與唔同貨幣計價之下嘅相對波動風險。
