title_en: What is the coefficient of variation?
title_zh: 什么是变异系数？
title_zh_hk: 咩係變異系數？
objective_en: Explain why a bigger standard deviation does not always mean a harder-to-plan shop, compute the coefficient of variation as the standard deviation divided by the average, and say when to use it instead of the standard deviation and where it stops.
objective_zh: 解释为什么标准差大，不一定表示这家店更难计划；用标准差除以平均数算出变异系数；并说明什么时候该用它代替标准差，以及它到哪里为止。
objective_zh_hk: 解釋點解標準差大，唔一定代表間店更難計劃；用標準差除以平均數計出變異系數；再講清楚幾時應該用佢代替標準差，同埋佢去到邊度為止。
