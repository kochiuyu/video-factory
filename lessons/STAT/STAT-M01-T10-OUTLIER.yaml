  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A screening rule, not a verdict
  title_zh: 筛查规则，不是判决
  title_zh_hk: 篩查規則，唔係判決
  left_en: 'Tells: which values to check'
  left_zh: 能说：该查哪些值
  left_zh_hk: 講到：要查邊啲值
  right_en: 'Not: why, or what to do'
  right_zh: 不能说：原因和做法
  right_zh_hk: 講唔到：原因同做法
  s1_en: So what does the rule tell you, and what does it not?
  s1_zh: 那这个规则到底能告诉你什么，又不能告诉你什么？
  s1_zh_hk: 咁呢個規則究竟話到你知啲乜，又話唔到你知啲乜？
  s2_en: 'It tells you which values sit unusually far from the rest, the same way every time, so two managers looking at the same file flag the same shops. And because it is built on the quartiles, one far shop barely moves its own fences: the upper fence moved from 510 to 585, not to thousands.'
  s2_zh: 它能告诉你哪些值离其他值异常地远，而且每次用同一种方法，所以两个经理看同一份数据，会标记出同样的店。又因为它建立在四分位数上，一家很远的店几乎挪不动自己的围栏：上围栏从510移到585，而不是移到几千。
  s2_zh_hk: 佢話到你知邊啲值離其他值異常咁遠，而且每次都用同一個方法，所以兩個經理睇同一份數據，會標記出同樣嘅店。又因為佢建基於四分位數，一間好遠嘅店差唔多郁唔到自己嘅圍欄：上圍欄由510移到585，唔係移到幾千。
  s3_en: 'It does not tell you why, or what to do. That takes the record and the business context. It also depends on the method: the 1.5 is a convention, and another textbook or software rule can place the quartiles a little differently and shift the fences. With five or six shops, the fences rest on very few values. And a mistake inside the fences is never flagged: if 390 had been typed as 360, no fence would catch it.'
  s3_zh: 它不能告诉你原因，也不能告诉你该怎么做，这些要靠记录和业务背景。它也取决于方法：1.5是惯例，换一本教材或一个软件，四分位数的位置可能有一点不同，围栏也会跟着移。只有五六家店，围栏只建立在很少的数上。还有，落在围栏里面的错误永远不会被标记：如果390被打成了360，没有一道围栏抓得到。
  s3_zh_hk: 佢話唔到你知原因，亦話唔到你知應該點做，呢啲要靠記錄同業務背景。佢亦取決於方法：1.5係慣例，換一本教科書或者一個軟件，四分位數嘅位置可能有少少唔同，圍欄都會跟住移。得五六間店，圍欄只係建基於好少數。仲有，落喺圍欄入面嘅錯誤永遠唔會被標記：如果390被打成360，冇一道圍欄捉得到。
