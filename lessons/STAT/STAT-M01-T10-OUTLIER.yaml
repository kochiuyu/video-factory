  s1_en: Six shops now, Shop F included. A quarter of 6 is 1.5; round up to place 2, which is 310. Three quarters of 6 is 4.5; round up to place 5, which is 420. The box widens to 420 minus 310, which is 110 cups.
  s1_zh: 现在是六家店，F店也算在内。6的四分之一是1.5，向上取到第2位，是310。6的四分之三是4.5，向上取到第5位，是420。箱子变宽了，420减310，等于110杯。
  s1_zh_hk: 而家係六間店，F店都計埋。6嘅四分之一係1.5，向上取到第2位，係310。6嘅四分之三係4.5，向上取到第5位，係420。個盒闊咗，420減310，等於110杯。
  s2_en: 'One and a half times 110 is 165. So the fences move out: 310 minus 165 is 145, and 420 plus 165 is 585.'
  s2_zh: 1.5乘110等于165。所以围栏往外移：310减165，等于145；420加165，等于585。
  s2_zh_hk: 1.5乘110等於165。所以圍欄向外移：310減165，等於145；420加165，等於585。
  s3_en: Shop F's 4,200 is still far past 585. Same flag, either way. A value this far out gets flagged however you build the box. But does flagged mean wrong?
  s3_zh: F店的4,200仍然远远超过585。两种做法，结论一样。一个远到这种程度的值，不管箱子怎么画，都会被标记出来。可是，被标记就等于错了吗？
  s3_zh_hk: F店嘅4,200仍然遠遠超過585。兩個做法，結論一樣。一個遠到咁嘅值，無論個盒點畫，都會被標記出嚟。但係，被標記係咪即係錯？
- id: stories
  visual: steps
  seconds: 52
  kicker: Three Stories
  kicker_en: Three Stories
  kicker_zh: 三种可能
  kicker_zh_hk: 三個可能
  title_en: Flagged is not wrong
  title_zh: 被标记，不等于错
  title_zh_hk: 被標記，唔等於錯
  layout: rows
  step1_en: 'A typing slip: one 0 too many'
  step1_zh: 打错：多打了一个0
  step1_zh_hk: 打錯：多打咗一個0
  step2_en: 'A one-off: an unusual Monday'
  step2_zh: 一次性：特别的星期一
  step2_zh_hk: 一次性：特別嘅星期一
  step3_en: A different kind of shop
  step3_zh: 不同类型的店
  step3_zh_hk: 唔同類型嘅店
  s1_en: 'The fence says look here. It does not say why. Picture three stories behind 4,200. One: a typing slip. Suppose Shop F really sold 420, and someone typed one zero too many. That is a data error.'
  s1_zh: 围栏只是说“看这里”，没说为什么。想象4,200背后有三种可能。第一，打错了。假设F店其实卖了420杯，有人多打了一个0。这就是数据错误。
  s1_zh_hk: 圍欄只係話「睇呢度」，冇話點解。想像4,200背後有三個可能。第一，打錯咗。假設F店其實賣咗420杯，有人多打咗個0。呢個就係數據錯誤。
  s2_en: 'Two: the number is real, but the day was not ordinary. Suppose a concert nearby kept Shop F busy all night. That is a real one-off.'
  s2_zh: 第二，数字是真的，但那天不寻常。假设附近有一场演唱会，让F店整晚都很忙。这是真实的一次性事件。
  s2_zh_hk: 第二，個數係真嘅，但嗰日唔尋常。假設附近有一場演唱會，令F店成晚都好忙。呢個係真實嘅一次性事件。
  s3_en: 'Three: the number is real, and normal for Shop F. A 24-hour site is a different kind of shop from the five ordinary ones, so it was never a fair comparison. The fence cannot tell these three apart. So what do you do?'
  s3_zh: 第三，数字是真的，而且对F店来说很正常。通宵营业的店，跟五家普通的店本来就不是同一类，一开始就不能公平比较。围栏分不出这三种情况。那该怎么办？
  s3_zh_hk: 第三，個數係真嘅，而且對F店嚟講好正常。通宵營業嘅店，同五間普通嘅店本來就唔係同一類，一開始就唔可以公平噉比。圍欄分唔到呢三個情況。咁點算？
