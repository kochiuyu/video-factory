quiz:
- id: Q1
  type: multiple_choice
  question_en: What is the purpose of the 1.5×IQR rule?
  question_zh: 1.5倍IQR规则的作用是什么？
  question_zh_hk: 1.5倍IQR規則有咩作用？
  options_en:
  - 'A: Automatically delete unusual observations.'
  - 'B: Screen for observations that deserve further investigation.'
  - 'C: Prove that any value outside the fences is a recording mistake.'
  - 'D: Replace a far value with the average so the summary looks normal.'
  options_zh:
  - 'A: 自动删除异常观测值。'
  - 'B: 筛查值得进一步调查的观测值。'
  - 'C: 证明凡是落在围栏外的值都是记录错误。'
  - 'D: 用平均数替换很远的值，让汇总看起来正常。'
  options_zh_hk:
  - 'A: 自動刪除異常觀測值。'
  - 'B: 篩查值得進一步調查嘅觀測值。'
  - 'C: 證明凡係落喺圍欄外嘅值都係記錄錯誤。'
  - 'D: 用平均數取代好遠嘅值，等個總結睇落正常啲。'
  answer: B
  explanation_en: The 1.5×IQR rule flags observations for review. It does not prove they are errors, and it does not tell you to delete or replace them.
  explanation_zh: 1.5倍IQR规则把观测值标记出来供复查，但不能证明它是错误，也不会叫你删掉或替换它。
  explanation_zh_hk: 1.5倍IQR規則將觀測值標記出嚟供複查，但唔可以證明佢係錯誤，亦唔會叫你刪走或者取代佢。
- id: Q2
  type: multiple_choice
  question_en: A 24-hour Shop F sells 4,200 cups while five ordinary shops sell 280–420. What should a manager do first?
  question_zh: 通宵营业的F店卖出4,200杯，而五家普通的店卖出280到420杯。经理首先应该做什么？
  question_zh_hk: 通宵營業嘅F店賣出4,200杯，而五間普通嘅店賣出280到420杯。經理首先應該做咩？
  options_en:
  - 'A: Delete the observation immediately.'
  - 'B: Investigate whether it is a data error, a one-time event, or a valid business signal.'
  - 'C: Replace it with the mean.'
  - 'D: Ignore it completely.'
  options_zh:
  - 'A: 立刻删除该观测值。'
  - 'B: 调查它是数据错误、一次性事件，还是有效的业务信号。'
  - 'C: 用平均数替换它。'
  - 'D: 完全忽略它。'
  options_zh_hk:
  - 'A: 即刻刪除呢個觀測值。'
  - 'B: 調查佢係數據錯誤、一次性事件，定係有效嘅業務訊號。'
  - 'C: 用平均數取代佢。'
  - 'D: 完全忽略佢。'
  answer: B
  explanation_en: An unusual observation may be invalid data or a valid business event. Verify its source and operating context before changing the dataset.
  explanation_zh: 不寻常的观测值可能是无效数据，也可能是真实业务事件。修改数据集前，应先核实来源与运营背景。
  explanation_zh_hk: 不尋常嘅觀測值可能係無效數據，亦可能係真實業務事件。修改數據集之前，應該先核實來源同營運背景。
beats:
- id: hook
  visual: title_card
  seconds: 52
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is an outlier?
  title_zh: 什么是异常值？
  title_zh_hk: 咩係異常值？
  en: Suppose head office checks Monday's sales before it sets next week's milk orders. Five shops sold between 280 and 420 cups. Then Shop F, a 24-hour site, reports 4,200. What do you do with that number? Delete it, and if it was real, Shop F runs short of milk all week. Keep it, and if it was a typing slip, the average for the six shops jumps from 352 cups to about 993, nearly three times as big, and every order built on it is off. So before anyone touches the number, you need a fair way to say how far is too far. A value that sits that far from the rest has a name. What is an outlier?
  zh: 假设总部每个星期一先看销量，再定下星期的牛奶订单。五家店卖了280到420杯。接着，通宵营业的F店报来4,200杯。这个数怎么处理？删掉它，如果它是真的，F店整个星期都会缺牛奶。留着它，如果它其实是打错了，六家店的平均数就会从352杯跳到大约993杯，差不多是原来的三倍，照着它下的订单全都会错。所以在动这个数之前，你需要一个公平的方法，说清楚多远才算太远。离其他数这么远的值，有一个名字。什么是异常值？
  zh_hk: 假設總部逢星期一先睇銷量，再定下個星期嘅牛奶訂單。五間店賣咗280到420杯。跟住，通宵營業嘅F店報上嚟4,200杯。呢個數點處理？刪咗佢，如果佢係真嘅，F店成個星期都會唔夠牛奶。留住佢，如果佢其實係打錯，六間店嘅平均數就會由352杯跳到大約993杯，差唔多係原來嘅三倍，跟住佢落嘅訂單全部都會錯。所以喺郁呢個數之前，你需要一個公平嘅方法，講清楚幾遠先算太遠。離其他數咁遠嘅值，有個名。咩係異常值？
- id: line
  visual: rank_line
  seconds: 50
  kicker: The Line
  kicker_en: The Line
  kicker_zh: 排一排
  kicker_zh_hk: 排一排
  title_en: Six shops, one Monday
  title_zh: 六家店，同一个星期一
  title_zh_hk: 六間店，同一個星期一
  values: 360;420;280;390;310;4,200
  labels_en: Shop A;Shop B;Shop C;Shop D;Shop E;Shop F
  labels_zh: A店;B店;C店;D店;E店;F店
  labels_zh_hk: A店;B店;C店;D店;E店;F店
  order: sorted
  mark: '6'
  break: last
  footer_en: 4,200 ÷ 420 = 10
  footer_zh: 4,200 ÷ 420 = 10
  footer_zh_hk: 4,200 ÷ 420 = 10
  s1_en: Here are the six shops in the order they came in. Shop A sold 360 cups, Shop B 420, Shop C 280, Shop D 390, Shop E 310, and Shop F 4,200.
  s1_zh: 这是六家店按报上来的顺序：A店卖了360杯，B店420，C店280，D店390，E店310，F店4,200。
  s1_zh_hk: 呢度係六間店照報上嚟嘅次序：A店賣咗360杯，B店420，C店280，D店390，E店310，F店4,200。
  s2_en: Line them up from the fewest cups to the most. The five ordinary shops sit close together, from 280 to 420. Shop F is so far off that the line needs a break before it.
  s2_zh: 从卖得最少排到最多。五家普通的店挤在一起，从280到420。F店远得这条线要先断开一下，才放得下它。
  s2_zh_hk: 由賣得最少排到最多。五間普通嘅店擠埋一齊，由280到420。F店遠到條線要斷開一下，先擺得落佢。
  s3_en: 'Shop F sold ten times as much as the next busiest shop: 4,200 divided by 420 is 10. It looks far. But looks far is a feeling, and two managers can feel it differently. So how far is too far?'
  s3_zh: F店卖的是第二多那家店的十倍：4,200除以420，等于10。它看起来很远。可是“看起来远”只是一种感觉，两个经理的感觉可以不一样。那到底多远才算太远？
  s3_zh_hk: F店賣嘅係第二多嗰間嘅十倍：4,200除420，等於10。佢睇落好遠。但係「睇落遠」只係一種感覺，兩個經理嘅感覺可以唔同。咁究竟幾遠先算太遠？
- id: yardstick
  visual: box_line
  seconds: 66
  kicker: The Yardstick
  kicker_en: The Yardstick
  kicker_zh: 尺子
  kicker_zh_hk: 把尺
  title_en: A yardstick from the middle
  title_zh: 用中间做尺子
  title_zh_hk: 用中間做把尺
  values: 360;420;280;390;310
  span_en: 390 − 310 = 80 cups
  span_zh: 390 − 310 = 80 杯
  span_zh_hk: 390 − 310 = 80 杯
  footer_en: 0.25 × 5 → 2 · 0.75 × 5 → 4
  footer_zh: 0.25 × 5 → 2 · 0.75 × 5 → 4
  footer_zh_hk: 0.25 × 5 → 2 · 0.75 × 5 → 4
  s1_en: To judge far, we need a yardstick, and it should come from the ordinary shops, not from the strange one. Put the five ordinary shops on a scale of cups, from 280 on the left to 420 on the right.
  s1_zh: 要判断远不远，得先有一把尺子，而且这把尺子应该来自普通的店，而不是那家奇怪的店。把五家普通的店放到一条杯数的刻度上，左边是280，右边是420。
  s1_zh_hk: 要判斷遠唔遠，先要有把尺，而呢把尺應該嚟自普通嘅店，唔係嗰間古怪嘅店。將五間普通嘅店擺上一條杯數嘅刻度，左邊係280，右邊係420。
  s2_en: Now find the quarter marks. Sort the five and multiply. A quarter of 5 is 1.25. There is no place one and a quarter, so round up to place 2, which is 310. That is the first quartile, Q1. Three quarters of 5 is 3.75. Round up to place 4, which is 390. That is the third quartile, Q3.
  s2_zh: 接着找四分之一的标记。把五个数排好，再乘一乘。5的四分之一是1.25；没有第一点二五位，所以向上取到第2位，是310，这就是第一四分位数，Q1。5的四分之三是3.75，向上取到第4位，是390，这就是第三四分位数，Q3。
  s2_zh_hk: 跟住搵四分之一嘅標記。將五個數排好，再乘一乘。5嘅四分之一係1.25；冇第一點二五位，所以向上取到第2位，係310，呢個就係第一四分位數，Q1。5嘅四分之三係3.75，向上取到第4位，係390，呢個就係第三四分位數，Q3。
  s3_en: Draw a box from Q1 to Q3. It holds about the middle half of the shops. Its width, 390 minus 310, is 80 cups. That width is called the interquartile range, or IQR, and it is our yardstick. So how many yardsticks out counts as too far?
  s3_zh: 从Q1到Q3画一个箱子，里面大约是中间一半的店。它的宽度是390减310，等于80杯。这个宽度叫作四分位距，英文简写IQR，它就是我们的尺子。那么，离箱子多少把尺子，才算太远？
  s3_zh_hk: 由Q1到Q3畫一個盒，入面大約係中間一半嘅店。佢嘅闊度係390減310，等於80杯。呢個闊度叫做四分位距，英文簡寫IQR，佢就係我哋把尺。咁，離個盒幾多把尺先算太遠？
- id: step_out
  visual: steps
  seconds: 38
  kicker: The Fences
  kicker_en: The Fences
  kicker_zh: 围栏
  kicker_zh_hk: 圍欄
  title_en: One and a half boxes out
  title_zh: 往外走一个半箱宽
  title_zh_hk: 向外行一個半盒闊
  layout: rows
  step1_en: 1.5 × 80 = 120 cups
  step1_zh: 1.5 × 80 = 120 杯
  step1_zh_hk: 1.5 × 80 = 120 杯
  step2_en: 310 − 120 = 190 cups
  step2_zh: 310 − 120 = 190 杯
  step2_zh_hk: 310 − 120 = 190 杯
  step3_en: 390 + 120 = 510 cups
  step3_zh: 390 + 120 = 510 杯
  step3_zh_hk: 390 + 120 = 510 杯
  s1_en: A common rule steps out one and a half box widths. One and a half times 80 is 80 plus half of 80, which is 40. So 120 cups.
  s1_zh: 常用的规则是往外走一个半箱宽。1.5乘80，就是80再加80的一半40，等于120杯。
  s1_zh_hk: 常用嘅規則係向外行一個半盒闊。1.5乘80，即係80再加80嘅一半40，等於120杯。
  s2_en: Step that far below Q1. 310 minus 120 is 190 cups. That line is the lower fence.
  s2_zh: 从Q1往下走这么远：310减120，等于190杯。这条线叫下围栏。
  s2_zh_hk: 由Q1向下行咁遠：310減120，等於190杯。呢條線叫下圍欄。
  s3_en: And that far above Q3. 390 plus 120 is 510 cups, the upper fence. A shop between 190 and 510 counts as ordinary by this rule. So where does Shop F land?
  s3_zh: 再从Q3往上走这么远：390加120，等于510杯，这是上围栏。按这个规则，落在190到510之间的店都算普通。那F店落在哪里？
  s3_zh_hk: 再由Q3向上行咁遠：390加120，等於510杯，呢條係上圍欄。按呢個規則，落喺190到510之間嘅店都算普通。咁F店落喺邊？
- id: flag
  visual: box_line
  seconds: 46
  kicker: The Flag
  kicker_en: The Flag
  kicker_zh: 标记
  kicker_zh_hk: 標記
  title_en: Where does Shop F land?
  title_zh: F店落在哪里？
  title_zh_hk: F店落喺邊？
  values: 360;420;280;390;310;4,200
  q1: 310
  q3: 390
  fences: 190;510
  break: last
  span_en: 1.5 × 80 = 120 cups
  span_zh: 1.5 × 80 = 120 杯
  span_zh_hk: 1.5 × 80 = 120 杯
  footer_en: 4,200 − 510 = 3,690 cups
  footer_zh: 4,200 − 510 = 3,690 杯
  footer_zh_hk: 4,200 − 510 = 3,690 杯
  s1_en: Here is the same box, built from the five ordinary shops. Shop F's 4,200 sits on the same line, past a break.
  s1_zh: 这是同一个箱子，用五家普通的店画出来。F店的4,200放在同一条线上，在断开的地方后面。
  s1_zh_hk: 呢個係同一個盒，用五間普通嘅店畫出嚟。F店嘅4,200擺喺同一條線上面，喺斷開位後面。
  s2_en: Add the fences, at 190 and 510, each one and a half box widths out. All five ordinary shops sit inside them, from 280 to 420.
  s2_zh: 加上围栏，在190和510，各离箱子一个半箱宽。五家普通的店全在里面，从280到420。
  s2_zh_hk: 加埋圍欄，喺190同510，各自離個盒一個半盒闊。五間普通嘅店全部喺入面，由280到420。
  s3_en: 'Shop F is far past the upper fence: 4,200 minus 510 is 3,690 cups beyond it. So the rule flags Shop F. Not because it feels far, but because it sits outside a fence that anyone can work out again. What do we call a value like that?'
  s3_zh: F店远远越过了上围栏：4,200减510，超出3,690杯。所以这个规则把F店标记出来。不是因为“感觉很远”，而是它落在一道谁都能重算的围栏外面。这样的值叫什么？
  s3_zh_hk: F店遠遠越過咗上圍欄：4,200減510，超出3,690杯。所以呢個規則將F店標記出嚟。唔係因為「感覺好遠」，而係佢落喺一道邊個都可以重新計嘅圍欄外面。噉嘅值叫咩？
- id: name_outlier
  visual: title_card
  seconds: 28
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Outlier
  title_zh: 异常值
  title_zh_hk: 異常值
  en: 'An outlier. A value that sits unusually far from the rest of the group. The fences turn unusually far into a screening rule: below the lower fence or above the upper fence, and the value is flagged for a check. On this Monday, Shop F is an outlier. So how do we write the rule for any group?'
  zh: 异常值。就是离这组数的其他值异常遥远的值。围栏把“异常遥远”变成一条筛查规则：低于下围栏，或者高于上围栏，这个值就被标记出来，等着核查。这个星期一，F店就是一个异常值。那换成任何一组数，这条规则要怎么写？
  zh_hk: 異常值。即係離呢組數其他值異常遙遠嘅值。圍欄將「異常遙遠」變成一條篩查規則：低過下圍欄，或者高過上圍欄，個值就會被標記出嚟，等人核查。呢個星期一，F店就係一個異常值。咁換成任何一組數，呢條規則又點樣寫？
- id: rule
  visual: definition_card
  seconds: 52
  kicker: The Rule
  kicker_en: The Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: The 1.5 × IQR rule
  title_zh: 1.5倍IQR规则
  title_zh_hk: 1.5倍IQR規則
  formula_en: 'Lower fence = Q1 − 1.5 × IQR

    Upper fence = Q3 + 1.5 × IQR'
  formula_zh: '下围栏 = Q1 − 1.5 × IQR

    上围栏 = Q3 + 1.5 × IQR'
  formula_zh_hk: '下圍欄 = Q1 − 1.5 × IQR

    上圍欄 = Q3 + 1.5 × IQR'
  gloss_en: 'Outside a fence: flag it, then check'
  gloss_zh: 落在围栏外：先标记，再核查
  gloss_zh_hk: 落喺圍欄外：先標記，再核查
  s1_en: Here it is in symbols. Q1 and Q3 are the quarter marks, and the IQR is Q3 minus Q1, the width of the box. The lower fence is Q1 minus one and a half IQRs. The upper fence is Q3 plus one and a half IQRs. Anything outside is flagged.
  s1_zh: 用符号写出来：Q1和Q3是两个四分之一的标记，四分位距是Q3减Q1，也就是箱子的宽度。下围栏是Q1减1.5个四分位距，上围栏是Q3加1.5个四分位距。落在外面的，就被标记出来。
  s1_zh_hk: 用符號寫出嚟：Q1同Q3係兩個四分之一嘅標記，四分位距係Q3減Q1，即係個盒嘅闊度。下圍欄係Q1減1.5個四分位距，上圍欄係Q3加1.5個四分位距。落喺外面嘅，就會被標記出嚟。
  s2_en: Two notes. The one and a half is a convention that many analysts share, not a law of nature. And here we built the box from the five ordinary shops, to check one new number against them. The usual box-plot habit puts every value in, the suspect one too. Does that change the verdict for Shop F?
  s2_zh: 有两点要说明。1.5是很多分析师共同采用的惯例，不是自然定律。另外，刚才我们用五家普通的店来画箱子，再拿一个新的数跟它们比。通常画箱线图的做法，是把所有数都放进去，包括那个可疑的数。这样一来，F店的结论会变吗？
  s2_zh_hk: 有兩點要講清楚。1.5係好多分析員共同用嘅慣例，唔係自然定律。另外，頭先我哋用五間普通嘅店嚟畫個盒，再攞一個新嘅數同佢哋比。一般畫箱線圖嘅做法，係將所有數都放入去，包括嗰個可疑嘅數。噉樣，F店嘅結論會唔會變？
- id: six
  visual: box_line
  seconds: 48
  kicker: Six Shops
  kicker_en: Six Shops
  kicker_zh: 六家店
  kicker_zh_hk: 六間店
  title_en: Count Shop F in too
