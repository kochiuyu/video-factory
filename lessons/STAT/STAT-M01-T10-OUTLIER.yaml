  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 答案
  kicker_zh_hk: 答案
  title_en: Far? Flag it, then check.
  title_zh: 很远？先标记，再核查
  title_zh_hk: 好遠？先標記，再核查
  q1_en: What makes a value an outlier?
  q1_zh: 什么样的值算异常值？
  q1_zh_hk: 點樣嘅值先算異常值？
  q2_en: What do you do after the flag?
  q2_zh: 被标记之后要做什么？
  q2_zh_hk: 被標記之後要做咩？
  s1_en: Back to head office and Shop F's 4,200. Delete it, and a site that really was busy runs short. Keep a typing slip, and the average jumps from 352 cups to about 993.
  s1_zh: 回到总部和F店的4,200杯。删掉它，一家真的很忙的店就会缺货；留着一个打错的数，平均数就会从352杯跳到大约993杯。
  s1_zh_hk: 返去總部同F店嘅4,200杯。刪咗佢，一間真係好忙嘅店就會唔夠貨；留低一個打錯嘅數，平均數就會由352杯跳到大約993杯。
  s2_en: What makes a value an outlier? It sits unusually far from the rest, and the 1.5 times IQR rule makes that precise. From the five ordinary shops, Q1 is 310, Q3 is 390, and the IQR is 80. The fences sit at 190 and 510. Shop F's 4,200 is outside, and it is still outside, past 585, when Shop F is counted in.
  s2_zh: 什么样的值算异常值？离其他值异常遥远的值，而1.5倍IQR规则把“多远”说清楚。用五家普通的店，Q1是310，Q3是390，四分位距是80，围栏在190和510。F店的4,200落在外面；把F店也算进去，它还是在585外面。
  s2_zh_hk: 點樣嘅值先算異常值？離其他值異常遙遠嘅值，而1.5倍IQR規則將「幾遠」講清楚。用五間普通嘅店，Q1係310，Q3係390，四分位距係80，圍欄喺190同510。F店嘅4,200落喺外面；將F店都計埋，佢都仲喺585外面。
  s3_en: What do you do after the flag? Check the record first. Correct an error and write down the change. Keep a real value, and report it on its own, or with and without it. Never delete a value only because it is flagged. These are numbers we supposed for one Monday, and the fences depend on the quartile method you report with them. The fence finds the value to check. The record decides what it means.
  s3_zh: 被标记之后要做什么？先查记录。是错误，就改正，并写下改动；是真的，就保留，单独报告，或者同时给出有它和没有它的结果。绝不要只因为被标记就删掉一个值。这些都是我们为一个星期一假设的数字，而围栏也取决于你同时报告的四分位数方法。围栏找出要查的值，记录才决定它代表什么。
  s3_zh_hk: 被標記之後要做咩？先查記錄。係錯誤，就改正，並寫低改動；係真嘅，就保留，單獨報告，或者同時畀出有佢同冇佢嘅結果。千祈唔好淨係因為被標記就刪走一個值。呢啲都係我哋為一個星期一假設嘅數字，而圍欄亦取決於你同時報告嘅四分位數方法。圍欄搵出要查嘅值，記錄先決定佢代表乜。
