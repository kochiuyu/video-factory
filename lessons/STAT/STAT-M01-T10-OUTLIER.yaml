  kicker: The Decision
  kicker_en: The Decision
  kicker_zh: 决定
  kicker_zh_hk: 決定
  title_en: Check the record, then decide
  title_zh: 先查记录，再决定
  title_zh_hk: 先查記錄，再決定
  left_en: 'Error: correct it, note it'
  left_zh: 错了：改正，并写下来
  left_zh_hk: 錯咗：改正，並寫低
  right_en: 'Real: keep it, report apart'
  right_zh: 是真的：保留，分开报告
  right_zh_hk: 係真嘅：保留，分開報告
  s1_en: First, check the record before you touch the data. Look at Shop F's till receipts for Monday, the units, and whether any sale was counted twice.
  s1_zh: 第一步，动数据之前先查记录。看F店星期一的收银单据、单位，还有有没有哪笔交易算了两次。
  s1_zh_hk: 第一步，郁啲數據之前先查記錄。睇吓F店星期一嘅收銀單據、單位，同埋有冇邊單交易計咗兩次。
  s2_en: If the receipts show a slip, correct it. If they show 420, write 420, and note what you changed and why, so anyone can follow the change later.
  s2_zh: 如果单据显示是打错了，就改正。单据上是420，就写420，再写下改了什么、为什么改，让别人以后也看得懂。
  s2_zh_hk: 如果單據顯示係打錯，就改正。單據上面係420，就寫420，再寫低改咗乜、點解改，等人以後都睇得明。
  s3_en: 'If the number is real, keep it. Do not delete a value just because it is flagged. Report Shop F on its own line, or show the summary with and without it: the average is 352 cups for the five shops, and about 993 with Shop F. Then the five shops and Shop F each get their own plan. So what can the rule tell you, and what can it not?'
  s3_zh: 如果数字是真的，就保留。不要只因为被标记就删掉一个值。可以把F店单独列一行，或者同时给出有它和没有它的结果：五家店的平均数是352杯，算上F店大约是993杯。这样，五家店和F店就各有各的计划。那这个规则能告诉你什么，又不能告诉你什么？
  s3_zh_hk: 如果個數係真嘅，就保留。唔好淨係因為被標記就刪走一個值。可以將F店單獨列一行，或者同時畀出有佢同冇佢嘅結果：五間店嘅平均數係352杯，計埋F店大約係993杯。噉樣，五間店同F店就各自有自己嘅計劃。咁呢個規則話到你知啲乜，又話唔到你知啲乜？
