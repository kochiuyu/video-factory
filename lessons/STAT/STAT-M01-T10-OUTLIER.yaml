id: STAT-M01-T10-OUTLIER
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Signal or noise?
title_zh: 异常值是商业信号还是数据问题？
title_zh_hk: 異常值係商業訊號定數據問題？
objective_en: Define an outlier as an unusually distant observation, apply the 1.5×IQR screening rule using the course quartile convention, and distinguish verified data errors from valid but unusual business observations before deciding how to treat them.
objective_zh: 把异常值定义为距离主体数据异常遥远的观测值，按照本课程的四分位数约定应用1.5倍IQR筛查规则，并在决定处理方式前区分已核实的数据错误与真实但不寻常的业务观测。
objective_zh_hk: 將異常值定義為距離主體數據異常遙遠嘅觀測值，按照本課程嘅四分位數約定應用1.5倍IQR篩查規則，並喺決定處理方式之前，區分已核實嘅數據錯誤同真實但不尋常嘅業務觀測。
