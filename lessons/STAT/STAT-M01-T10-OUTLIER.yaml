id: STAT-M01-T10-OUTLIER
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 636
title_en: What is an outlier?
title_zh: 什么是异常值？
title_zh_hk: 咩係異常值？
objective_en: Define an outlier as a value unusually far from the rest, compute the 1.5 × IQR fences from nearest-rank quartiles, and decide what to do with a flagged value by checking the record before correcting it, keeping it, or reporting it separately.
objective_zh: 把异常值定义为离其他值异常遥远的值；用最接近秩法的四分位数算出1.5倍IQR围栏；并在改正、保留或单独报告之前，先查记录，再决定怎样处理被标记的值。
objective_zh_hk: 將異常值定義為離其他值異常遙遠嘅值；用最接近秩法嘅四分位數計出1.5倍IQR圍欄；並喺改正、保留或者單獨報告之前，先查記錄，再決定點樣處理被標記嘅值。
