  s1_en: Here are the five days behind that prep sheet. Shop A, in cups sold. Day 1 sold 70. Day 2 sold 80. Day 3 sold 90. Day 4 sold 100. Day 5 sold 160.
  s1_zh: 这就是那张备货单背后的五天。A店卖出的杯数。第1天卖了70杯。第2天卖了80杯。第3天卖了90杯。第4天卖了100杯。第5天卖了160杯。
  s1_zh_hk: 呢個就係嗰張備貨單背後嘅五日。A店賣出嚟嘅杯數。第1日賣咗70杯。第2日賣咗80杯。第3日賣咗90杯。第4日賣咗100杯。第5日賣咗160杯。
  s2_en: Those five add to 500, so the average is 100. Three days sit below 100. One day is a rush at 160.
  s2_zh: 这五天加起来是500，所以平均数是100。三天低于100。一天是160的高峰。
  s2_zh_hk: 呢五日加起嚟係500，所以平均數係100。三日低過100。一日係160嘅高峰。
  s3_en: Shop B sold 40, 100, 110, 120, and 130. Same total, same average. But three days sit above 100, and one day is quiet at 40.
  s3_zh: B店卖了40、100、110、120和130杯。总数一样，平均数一样。但三天高于100，一天是40的低谷。
  s3_zh_hk: B店賣咗40、100、110、120同130杯。總數一樣，平均數一樣。但三日高過100，一日係40嘅低谷。
- id: plans
  visual: two_column
  seconds: 46
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两套计划
  kicker_zh_hk: 兩套計劃
  title_en: Same 100. Not the same risk.
  title_zh: 都是100，风险不同
  title_zh_hk: 都係100，風險唔同
  left_en: 'A: three quiet days. Prep 100 wastes.'
  left_zh: A：三天清闲。备100会浪费。
  left_zh_hk: A：三日清閒。備100會浪費。
  right_en: 'B: three busy days. Prep 100 runs out.'
  right_zh: B：三天较忙。备100会不够。
  right_zh_hk: B：三日較忙。備100會唔夠。
  s1_en: So the averages match, and the days do not. Prepare 100 at Shop A. Three of the five days sold less. Those cups get thrown out.
  s1_zh: 所以平均数一样，每天不一样。在A店备100杯。五天里有三天卖得更少。多出来的杯子会被倒掉。
  s1_zh_hk: 所以平均數一樣，每日唔一樣。喺A店備100杯。五日入面有三日賣得更少。多出嚟嘅杯會被倒走。
  s2_en: Prepare 100 at Shop B. Three of the five days sold more. Those days run out.
  s2_zh: 在B店备100杯。五天里有三天卖得更多。那些天会不够。
  s2_zh_hk: 喺B店備100杯。五日入面有三日賣得更多。嗰啲日會唔夠。
  s3_en: Same 100, different risk, different plans. The average cannot say which shop wastes. Next we check it properly, then the spread, to see if either number can.
  s3_zh: 都是100，风险不同，计划不同。平均数说不出哪家浪费。接下来我们把它算清楚，再看分散，看这两个数能不能说。
  s3_zh_hk: 都係100，風險唔同，計劃唔同。平均數講唔出邊間浪費。跟住我哋將佢計清楚，再睇分散，睇呢兩個數可唔可以講。
- id: average
  visual: definition_card
  seconds: 36
  kicker: The Average
  kicker_en: The Average
  kicker_zh: 平均数
  kicker_zh_hk: 平均數
  title_en: First, the equal share
  title_zh: 先算平均份额
  title_zh_hk: 先計平均份額
  formula: 'Average = total / number of days

    500 / 5 = 100'
  formula_zh: '平均数 = 合计 / 天数

    500 / 5 = 100'
  formula_zh_hk: '平均數 = 合計 / 日數

    500 / 5 = 100'
  s1_en: So can either number tell them apart? First the average, the 100 on the prep sheet. Each shop sold 500 cups over the five days. The average is the total shared equally. 500 divided by 5 is 100 cups a day.
  s1_zh: 那么这两个数能不能把它们分开？先看平均数，就是备货单上的那个100。每家店五天一共卖了500杯。平均数就是把总数平均分。500除以5，等于每天100杯。
  s1_zh_hk: 咁呢兩個數可唔可以將佢哋分開？先睇平均數，就係備貨單上嗰個100。每間店五日一共賣咗500杯。平均數就係將總數平均分。500除以5，等於每日100杯。
  s2_en: That does not mean either shop sold 100 every day. It is one reference number. Next we set each day beside 100, and see how far it sits.
  s2_zh: 这不表示两家店每天真的都卖了100杯。它只是一个用来比较的数。接下来，把每天放在100旁边，看看离得有多远。
  s2_zh_hk: 呢個唔代表兩間店每日真係都賣咗100杯。佢只係一個用嚟比較嘅數。跟住，將每日放喺100旁邊，睇吓離得有幾遠。
- id: distance
  visual: steps
  seconds: 46
  kicker: How Far
  kicker_en: How Far
  kicker_zh: 有多远
  kicker_zh_hk: 有幾遠
  title_en: Each day minus 100
  title_zh: 每天减去100
  title_zh_hk: 每日減100
  step1_en: 'Day 1: 70 − 100 = −30'
  step1_zh: 第1天：70 − 100 = −30
  step1_zh_hk: 第1日：70 − 100 = −30
  step2_en: 'Day 2: 80 − 100 = −20'
  step2_zh: 第2天：80 − 100 = −20
  step2_zh_hk: 第2日：80 − 100 = −20
  step3_en: 'Day 3: 90 − 100 = −10'
  step3_zh: 第3天：90 − 100 = −10
  step3_zh_hk: 第3日：90 − 100 = −10
  step4_en: 'Day 4: 100 − 100 = 0'
  step4_zh: 第4天：100 − 100 = 0
  step4_zh_hk: 第4日：100 − 100 = 0
  step5_en: 'Day 5: 160 − 100 = +60'
  step5_zh: 第5天：160 − 100 = +60
  step5_zh_hk: 第5日：160 − 100 = +60
  s1_en: Start with Shop A. Take each day and subtract 100. Write a minus if the day was below, a plus if it was above. Day 1 is 70 minus 100, so minus 30.
  s1_zh: 先从A店开始。用每天的杯数减去100。低于100就写负号，高于100就写正号。第1天是70减100，等于负30。
  s1_zh_hk: 先由A店開始。用每日嘅杯數減100。低過100就寫負號，高過100就寫正號。第1日係70減100，等於負30。
  s2_en: Day 2 is 80 minus 100, so minus 20. Day 3 is 90 minus 100, so minus 10.
  s2_zh: 第2天是80减100，等于负20。第3天是90减100，等于负10。
  s2_zh_hk: 第2日係80減100，等於負20。第3日係90減100，等於負10。
  s3_en: Day 4 is exactly 100, so zero. Day 5 is 160 minus 100, so plus 60. Three days below, one match, one rush. These how-far numbers are called deviations. The name can wait.
  s3_zh: 第4天正好是100，所以是零。第5天是160减100，等于正60。三天低于，一天正好，一天是高峰。这些“有多远”叫作偏差。名字可以等一等。
  s3_zh_hk: 第4日啱啱係100，所以係零。第5日係160減100，等於正60。三日低過，一日啱啱，一日係高峰。呢啲「有幾遠」叫做偏差。名可以等一等。
- id: squares
  visual: steps
  seconds: 48
  kicker: The Spread
  kicker_en: The Spread
  kicker_zh: 分散
  kicker_zh_hk: 分散
  title_en: Multiply by itself, then share
  title_zh: 乘以自己，再平分
  title_zh_hk: 乘自己，再平分
  step1_en: 30 × 30 = 900. 20 × 20 = 400.
  step1_zh: 30 × 30 = 900。20 × 20 = 400。
  step1_zh_hk: 30 × 30 = 900。20 × 20 = 400。
  step2_en: 10 × 10 = 100. 0 × 0 = 0. 60 × 60 = 3,600.
  step2_zh: 10 × 10 = 100。0 × 0 = 0。60 × 60 = 3,600。
  step2_zh_hk: 10 × 10 = 100。0 × 0 = 0。60 × 60 = 3,600。
  step3_en: Sum = 5,000. 5,000 / 5 = 1,000.
  step3_zh: 和 = 5,000。5,000 / 5 = 1,000。
  step3_zh_hk: 和 = 5,000。5,000 / 5 = 1,000。
  step4_en: Shop B does the same. Also 1,000.
  step4_zh: B店同样做。也是 1,000。
  step4_zh_hk: B店同樣做。都係 1,000。
  s1_en: Can we just add those how-far numbers? The days below pull one way. The rush pulls the other. They can cancel, like a seesaw. Multiply each by itself, so both sides count.
  s1_zh: 能不能把这些“有多远”直接加起来？低于100的那几天往一边拉。高峰往另一边拉。它们会抵消，像一个跷跷板。每一个都乘以自己，两边才都算。
  s1_zh_hk: 可唔可以將呢啲「有幾遠」直接加起嚟？低過100嗰幾日往一邊拉。高峰往另一邊拉。佢哋會抵銷，好似一個蹺蹺板。每一個都乘自己，兩邊先都計。
  s2_en: Thirty times 30 is 900. Twenty times 20 is 400. Ten times 10 is 100. Zero times zero is zero. Sixty times 60 is 3,600. A minus times a minus is a plus, so the quiet days count too.
  s2_zh: 30乘30是900。20乘20是400。10乘10是100。零乘零是零。60乘60是3,600。负数乘负数，得到正数，所以清闲的那天也算进去。
  s2_zh_hk: 30乘30係900。20乘20係400。10乘10係100。零乘零係零。60乘60係3,600。負數乘負數，得到正數，所以清閒嗰日都計埋。
  s3_en: Add them and you get 5,000. Divide by 5. That is 1,000. Cups times cups, because we multiplied. We call it the variance. Do the same for Shop B and you get 1,000 again. The spread matches. It still cannot say which side is long.
  s3_zh: 加起来是5,000。除以5，等于1,000。杯乘杯，因为我们做了乘法。我们叫它方差。对B店做同样的计算，也是1,000。分散对得上。它仍然说不出哪一侧被拉长。
  s3_zh_hk: 加起嚟係5,000。除以5，等於1,000。杯乘杯，因為我哋做咗乘法。我哋叫佢做方差。對B店做同樣嘅計算，都係1,000。分散對得上。佢仍然講唔出邊一邊被拉長。
- id: shape
  visual: two_column
  seconds: 44
  kicker: The Shape
  kicker_en: The Shape
  kicker_zh: 形状
  kicker_zh_hk: 形狀
  title_en: One high day, or one low day
  title_zh: 一个高峰日，或一个低谷日
  title_zh_hk: 一個高峰日，或者一個低谷日
  left_en: 'A: 160 is the long high side'
  left_zh: A：160 是被拉长的高的一侧
  left_zh_hk: A：160 係被拉長嘅高嗰一邊
  right_en: 'B: 40 is the long low side'
  right_zh: B：40 是被拉长的低的一侧
  right_zh_hk: B：40 係被拉長嘅低嗰一邊
  s1_en: So the average matches, and the spread matches. What is left is the shape. Line Shop A up from low to high. Three days sit below 100. One day equals 100. One day, 160, sits out on the high side.
  s1_zh: 所以平均数对得上，分散也对得上。剩下的是形状。把A店从少到多排好。三天低于100。一天正好是100。一天是160，远在高的一侧。
  s1_zh_hk: 所以平均數對得上，分散都對得上。剩低嘅係形狀。將A店由少到多排好。三日低過100。一日啱啱係100。一日係160，遠喺高嗰一邊。
  s2_en: That thin end is the tail. Think of a queue. Most people stand together. One person stands far to the right. Shop A has a long high side.
  s2_zh: 细的那一端叫作尾巴。可以把它想成一队人。大多数人站在一起。一个人远远站在右边。A店的高的一侧被拉长。
  s2_zh_hk: 幼嗰一端叫做尾巴。可以將佢想成一隊人。大多數人企埋一齊。一個人遠遠企喺右邊。A店高嗰一邊被拉長。
  s3_en: Line Shop B up. Three days sit above 100. One day equals 100. One day, 40, sits out on the low side. Shop B has a long low side. Before we name these shapes, there is a quicker look.
  s3_zh: 把B店排好。三天高于100。一天正好是100。一天是40，远在低的一侧。B店的低的一侧被拉长。给这两种形状起名字之前，还有一个更快的看法。
  s3_zh_hk: 將B店排好。三日高過100。一日啱啱係100。一日係40，遠喺低嗰一邊。B店低嗰一邊被拉長。畀呢兩種形狀起名之前，仲有一個更快嘅睇法。
- id: clue
  visual: two_column
  seconds: 40
  kicker: A Clue
  kicker_en: A Clue
  kicker_zh: 一个线索
  kicker_zh_hk: 一個線索
  title_en: The middle day is a clue
  title_zh: 排在中间的一天是线索
  title_zh_hk: 排喺中間嘅一日係線索
  left_en: 'A: average 100, middle day 90'
  left_zh: A：平均数 100，中间的一天 90
  left_zh_hk: A：平均數 100，中間嘅一日 90
  right_en: 'B: average 100, middle day 110'
  right_zh: B：平均数 100，中间的一天 110
  right_zh_hk: B：平均數 100，中間嘅一日 110
  s1_en: So which side is long? Line the days up and take the middle one. For Shop A that middle day is 90. For Shop B it is 110. Both averages are 100.
  s1_zh: 那么哪一侧被拉长？把每天从少到多排好，取中间的一天。A店中间的一天是90。B店是110。两家的平均数都是100。
  s1_zh_hk: 咁邊一邊被拉長？將每日由少到多排好，取中間嘅一日。A店中間嘅一日係90。B店係110。兩間嘅平均數都係100。
  s2_en: Shop A's average sits above its middle day. Shop B's average sits below its middle day. That gap points at which side is long. The middle day is called the median. The name can wait. It is a clue, not the definition.
  s2_zh: A店的平均数高于中间的一天。B店的平均数低于中间的一天。这个差距指向哪一侧被拉长。中间的一天叫作中位数。名字可以等一等。它是线索，不是定义。
  s2_zh_hk: A店嘅平均數高過中間嘅一日。B店嘅平均數低過中間嘅一日。呢個差距指向邊一邊被拉長。中間嘅一日叫做中位數。名可以等一等。佢係線索，唔係定義。
  s3_en: Do not stop at the two numbers. Open the five days. Shop A's high day is 160. Shop B's low day is 40. The middle day points you there. Those two shapes have names.
  s3_zh: 不要停在这两个数上。打开这五天。A店的高峰是160，B店的低谷是40。中间的一天把你指到那里。这两种形状有名字。
  s3_zh_hk: 唔好停喺呢兩個數度。打開呢五日。A店嘅高峰係160，B店嘅低谷係40。中間嘅一日將你指到嗰度。呢兩種形狀有名。
