- id: name_skew
  visual: title_card
  seconds: 32
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Skewness
  title_zh: 偏度
  title_zh_hk: 偏度
  s1_en: Skewness. That is the name. It is the number that says which side is long, after the average and the variance have already matched. Next, the formula writes these same steps in short names.
  s1_zh: 偏度。这就是那个名字。它是那个说哪一侧被拉长的数，在平均数和方差已经对上之后。接下来，公式用简称写下刚才这些步骤。
  s1_zh_hk: 偏度。呢個就係嗰個名。佢係嗰個講邊一邊被拉長嘅數，喺平均數同方差已經對上之後。跟住，公式用簡稱寫低頭先呢啲步驟。
- id: formula
  visual: steps
  seconds: 52
  kicker: The Formula
  kicker_en: The Formula
  kicker_zh: 公式
  kicker_zh_hk: 公式
  title_en: Nicknames for steps we already did
  title_zh: 给已经做过的步骤起简称
  title_zh_hk: 畀已經做過嘅步驟起簡稱
  step1_en: Each day is an x. The average is μ = 100.
  step1_zh: 每一天是一个 x。平均数是 μ = 100。
  step1_zh_hk: 每一日係一個 x。平均數係 μ = 100。
  step2_en: 'Cube the how-far: (x − μ) × itself × itself'
  step2_zh: 把“有多远”立方：(x − μ) × 自己 × 自己
  step2_zh_hk: 將「有幾遠」立方：(x − μ) × 自己 × 自己
  step3_en: Σ means add. n is 5. Then divide by σ³.
  step3_zh: Σ 表示相加。n 是 5。再除以 σ³。
  step3_zh_hk: Σ 表示相加。n 係 5。再除以 σ³。
  step4_en: A about +1.1. B about −1.1.
  step4_zh: A 大约 +1.1。B 大约 −1.1。
  step4_zh_hk: A 大約 +1.1。B 大約 −1.1。
  s1_en: The formula is only nicknames for steps we already did. Each day is an x. The average is mu, 100. How far is x minus mu. We then multiply that by itself, then by itself again.
  s1_zh: 公式只是给已经做过的步骤起简称。每一天是一个 x。平均数是 mu，100。有多远就是 x 减去 mu。然后我们把它乘以自己，再乘以自己一次。
  s1_zh_hk: 公式只係畀已經做過嘅步驟起簡稱。每一日係一個 x。平均數係 mu，100。有幾遠就係 x 減 mu。跟住我哋將佢乘自己，再乘自己一次。
  s2_en: Capital sigma means add every one of those, not just two. n is how many days, 5. Sigma is the standard deviation, the number that times itself gives the variance. Here it is the same for both shops. Sigma times itself, then again, takes the cups out, so the two shops can be compared as plain numbers.
  s2_zh: 大写西格玛表示每一个都加，不是只加两个。n 是有多少天，5。西格玛是标准差，就是自己乘自己得到方差的那个数。这里两家店相同。西格玛乘自己，再乘一次，把杯这个单位去掉，所以两家店可以当成普通的数来比较。
  s2_zh_hk: 大寫西格瑪表示每一個都加，唔係只加兩個。n 係有幾多日，5。西格瑪係標準差，就係自己乘自己得到方差嗰個數。呢度兩間店相同。西格瑪乘自己，再乘一次，將杯呢個單位拎走，所以兩間店可以當成普通嘅數嚟比較。
  s3_en: For Shop A the result is about plus 1.1. Positive, so the long side is the high side. Right skew. For Shop B it is about minus 1.1. Negative, so the long side is the low side. Left skew. Zero means the cubed distances balance. It does not, by itself, prove the two sides are perfect mirrors. The same steps have a written form.
  s3_zh: A店算出来大约是正1.1。正的，所以被拉长的是高的一侧。右偏。B店大约是负1.1。负的，所以被拉长的是低的一侧。左偏。零表示这些立方互相平衡。单凭零，不能证明两侧是完美的镜像。同样的步骤有一个写法。
  s3_zh_hk: A店計出嚟大約係正1.1。正，所以被拉長嘅係高嗰一邊。右偏。B店大約係負1.1。負，所以被拉長嘅係低嗰一邊。左偏。零表示呢啲立方互相平衡。單憑零，唔可以證明兩邊係完美嘅鏡像。同樣嘅步驟有一個寫法。
- id: defn
  visual: definition_card
  seconds: 40
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Skewness, written down
  title_zh: 偏度，写成公式
  title_zh_hk: 偏度，寫成公式
  formula: Skewness = (sum of cubed distances / n) / σ³
  formula_zh: 偏度 = （立方距离之和 / n） / σ³
  formula_zh_hk: 偏度 = （立方距離之和 / n） / σ³
  formula_tex: \dfrac{\sum (x_i - \mu)^3 / n}{\sigma^3}
  gloss: A about +1.1. B about −1.1.
  gloss_zh: A 大约 +1.1。B 大约 −1.1。
  gloss_zh_hk: A 大約 +1.1。B 大約 −1.1。
  s1_en: Here is the written form. Cube each day's distance from the average. Add those cubes, divide by n, then divide by sigma cubed. That last divide takes the cups out, so the two shops can be compared as plain numbers.
  s1_zh: 这就是写法。把每天离平均数的距离立方。把这些立方加起来，除以 n，再除以西格玛的立方。最后这一步把杯这个单位去掉，所以两家店可以当成普通的数来比较。
  s1_zh_hk: 呢個就係寫法。將每日離平均數嘅距離立方。將呢啲立方加起嚟，除以 n，再除以西格瑪嘅立方。最後呢一步將杯呢個單位拎走，所以兩間店可以當成普通嘅數嚟比較。
  s2_en: For Shop A that number is about plus 1.1. For Shop B it is about minus 1.1. The sign is the long side. This is the definition. It is not an order to change the prep sheet.
  s2_zh: A店这个数大约是正1.1。B店大约是负1.1。符号就是被拉长的一侧。这就是定义。它不是改备货单的指令。
  s2_zh_hk: A店呢個數大約係正1.1。B店大約係負1.1。符號就係被拉長嘅一邊。呢個就係定義。佢唔係改備貨單嘅指令。
- id: limit
  visual: two_column
  seconds: 44
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A reason to check, not an order
  title_zh: 是检查的理由，不是指令
  title_zh_hk: 係檢查嘅理由，唔係指令
  left_en: Why it helps
  left_zh: 它有什么用
  left_zh_hk: 佢有咩用
  right_en: What it is not
  right_zh: 它不是什么
  right_zh_hk: 佢唔係乜
  s1_en: So why keep the number, if it is not an order? It uses every day. Cubing keeps the sign, so a day above and a day below do not cancel. Even when the average and the variance match, we can still see that the plans should differ.
  s1_zh: 那么如果它不是指令，为什么还要留着这个数？它用到每一天。立方保住了符号，所以高于平均数的一天和低于平均数的一天不会互相抵消。即使平均数和方差都一样，我们仍然看得出计划应该不同。
  s1_zh_hk: 咁如果佢唔係指令，點解仲要留住呢個數？佢用到每一日。立方保住咗符號，所以高過平均數嘅一日同低過平均數嘅一日唔會互相抵銷。就算平均數同方差都一樣，我哋仍然睇得出計劃應該唔同。
  s2_en: A plus does not mean the shop is better, and a minus does not mean it is worse. One high day can make right skew. One low day can make left skew. Two different patterns of days can also give the same number. Keep the five days in view.
  s2_zh: 正号不表示这家店更好，负号也不表示它更差。一个高峰日就可以造成右偏。一个低谷日就可以造成左偏。两种不同的五天，也可能算出同一个数。所以还要看着原来的五天。
  s2_zh_hk: 正號唔表示呢間店更好，負號亦唔表示佢更差。一個高峰日就可以造成右偏。一個低谷日就可以造成左偏。兩種唔同嘅五日，亦可能計出同一個數。所以仲要睇住原本嘅五日。
  s3_en: And 1.1 is not an order to prepare 101 cups, or 99. It has no cups left in it. The sign says which side is long. The count of the days says which outcome showed up on three of these five days.
  s3_zh: 而且1.1不是备101杯或99杯的指令。它里面已经没有杯了。符号说明哪一侧被拉长。天数的清点才说明，这五天里有三天出现了哪一种结果。
  s3_zh_hk: 而且1.1唔係備101杯或者99杯嘅指令。佢入面已經冇杯。符號講邊一邊被拉長。日數嘅清點先講，呢五日入面有三日出現咗邊一種結果。
