  s1_en: No. The averages match, but the days do not. Look at what one sheet of 100 does at each shop.
  s1_zh: 不合适。平均数一样，每天却不一样。看看同一张100杯的单，在两家店会怎样。
  s1_zh_hk: 唔啱。平均數一樣，每日就唔一樣。睇吓同一張100杯嘅單，喺兩間店會點。
  s2_en: Prepare 100 at Shop A. On three of the five days it sold less, so cups are left over and thrown out.
  s2_zh: 在A店备100杯。五天里有三天卖得更少，杯子剩下来，只好倒掉。
  s2_zh_hk: 喺A店備100杯。五日入面有三日賣得少啲，啲杯剩低，惟有倒走。
  s3_en: Prepare 100 at Shop B. On three of the five days it sold more, so it runs out. Same 100, different risk, different plans. Can the average, or the swing, tell the two shops apart?
  s3_zh: 在B店备100杯。五天里有三天卖得更多，所以会卖完。同样是100，风险不同，计划也不同。平均数或者起伏，能不能把两家店分开？
  s3_zh_hk: 喺B店備100杯。五日入面有三日賣得多啲，所以會賣晒。同樣係100，風險唔同，計劃都唔同。平均數或者起跌，可唔可以分得開兩間店？
- id: average
  visual: definition_card
  seconds: 30
  kicker: The Average
  kicker_en: The Average
  kicker_zh: 平均数
  kicker_zh_hk: 平均數
  title_en: First, the equal share
  title_zh: 先算平均份额
  title_zh_hk: 先計平均份額
  formula: 'Average = total / number of days

    500 / 5 = 100'
  formula_zh: '平均数 = 合计 / 天数

    500 / 5 = 100'
  formula_zh_hk: '平均數 = 合計 / 日數

    500 / 5 = 100'
  s1_en: Start with the average, the 100 on the prep sheet. Each shop sold 500 cups over the five days. The average is the total shared equally. 500 divided by 5 is 100 cups a day.
  s1_zh: 先看平均数，就是备货单上的那个100。每家店五天一共卖了500杯。平均数就是把总数平均分。500除以5，等于每天100杯。
  s1_zh_hk: 先睇平均數，即係備貨單上面嗰個100。每間店五日一共賣咗500杯。平均數就係將總數平均分。500除5，等於每日100杯。
  s2_en: Both shops get exactly the same 100, so the average cannot split them. It is one reference point. So how far does each day sit from it?
  s2_zh: 两家店得到的都是100，所以平均数分不开它们。它只是一个参照点。那每一天离它有多远？
  s2_zh_hk: 兩間店得到嘅都係100，所以平均數分唔開佢哋。佢只係一個參照點。咁每一日離佢有幾遠？
- id: distance
  visual: dev_bars
  seconds: 66
  kicker: How Far
  kicker_en: How Far
  kicker_zh: 有多远
  kicker_zh_hk: 有幾遠
  title_en: Each day minus 100
  title_zh: 每天减去100
  title_zh_hk: 每日減100
  values: 70;80;90;100;160
  mean: 100
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  mark: far
  footer_en: −30 − 20 − 10 + 0 + 60 = 0
  footer_zh: −30 − 20 − 10 + 0 + 60 = 0
  footer_zh_hk: −30 − 20 − 10 + 0 + 60 = 0
  s1_en: Start with Shop A. Put each day beside the 100 line. Day 1, 70 cups, sits below it. Day 2, 80, and Day 3, 90, sit below too. Day 4 is right on the line. Day 5, 160, sits far above.
  s1_zh: 先从A店开始。把每一天放在100这条线旁边。第1天70杯，在线下面。第2天80杯、第3天90杯，也在下面。第4天正好在线上。第5天160杯，远远在线上面。
  s1_zh_hk: 先由A店開始。將每一日放喺100呢條線旁邊。第1日70杯，喺線下面。第2日80杯、第3日90杯，都喺下面。第4日啱啱喺線上。第5日160杯，遠遠喺線上面。
  s2_en: 'Now measure each gap: the day minus 100. Day 1 is minus 30. Day 2 is minus 20. Day 3 is minus 10. Day 4 is zero. Day 5 is plus 60. A minus means below the average. A plus means above.'
  s2_zh: 现在量一量每天的差距：当天的杯数减去100。第1天是负30，第2天是负20，第3天是负10，第4天是零，第5天是正60。负号表示低于平均数，正号表示高于平均数。
  s2_zh_hk: 而家度吓每日嘅差距：當日嘅杯數減100。第1日係負30，第2日係負20，第3日係負10，第4日係零，第5日係正60。負號代表低過平均數，正號代表高過平均數。
  s3_en: 'One far day above, three near days below. These signed gaps are called deviations. Add all five and you get zero: minus 30, minus 20 and minus 10 cancel the plus 60. They always cancel around the average. So how do we measure the swing without the cancelling?'
  s3_zh: 上面一天很远，下面三天很近。这些带正负号的差距叫作偏差。五个加起来等于零：负30、负20、负10，刚好抵消正60。在平均数两边，它们总是会抵消。那要怎么量起伏，才不会被抵消掉？
  s3_zh_hk: 上面一日好遠，下面三日好近。呢啲帶正負號嘅差距叫做偏差。五個加埋等於零：負30、負20、負10，啱啱抵銷正60。喺平均數兩邊，佢哋一定會抵銷。咁要點樣量起跌，先唔會被抵銷？
