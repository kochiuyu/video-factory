quiz:
- id: Q1
  type: multiple_choice
  question_en: Two shops average 100 cups and have the same variance. Why might the kitchen still look at skewness before preparing 100?
  question_zh: 两家店平均都是100杯，方差也相同。为什么厨房在备100杯之前仍然可能要看偏度？
  question_zh_hk: 兩間店平均都係100杯，方差都相同。點解廚房備100杯之前仍然可能要睇偏度？
  options_en:
  - 'A: The same average and the same spread can still hide which side is long.'
  - 'B: Skewness replaces the average.'
  - 'C: The same variance means the two shops have the same shape.'
  - 'D: Skewness tells you tomorrow''s sales.'
  options_zh:
  - 'A: 平均数相同、分散程度相同，仍然可能看不出哪一侧被拉长。'
  - 'B: 偏度可以代替平均数。'
  - 'C: 方差相同，就表示两家店的形状相同。'
  - 'D: 偏度可以告诉你明天的销量。'
  options_zh_hk:
  - 'A: 平均數相同、分散程度相同，仍然可能睇唔出邊一邊被拉長。'
  - 'B: 偏度可以代替平均數。'
  - 'C: 方差相同，就表示兩間店嘅形狀相同。'
  - 'D: 偏度可以話你知聽日嘅銷量。'
  answer: A
  explanation_en: Shop A and Shop B both average 100 cups, and both have variance 1,000. A has one high day. B has one low day. Skewness is the next question after the average and the variance.
  explanation_zh: A店和B店平均都是100杯，方差都是1,000。A店有一个高峰日，B店有一个低谷日。看完平均数和方差，下一个问题就是偏度。
  explanation_zh_hk: A店同B店平均都係100杯，方差都係1,000。A店有一個高峰日，B店有一個低谷日。睇完平均數同方差，下一個問題就係偏度。
- id: Q2
  type: multiple_choice
  question_en: A third shop sold 50, 90, 100, 110, and 150 cups. The average is 100. What is the skewness likely to be?
  question_zh: 第三家店卖了50、90、100、110和150杯。平均数是100。偏度大概是多少？
  question_zh_hk: 第三間店賣咗50、90、100、110同150杯。平均數係100。偏度大概係幾多？
  options_en:
  - 'A: About zero. The far low day and the far high day balance.'
  - 'B: About plus 1.1, like Shop A, because 150 is a high day.'
  - 'C: About minus 1.1, like Shop B, because 50 is a low day.'
  - 'D: It cannot be computed, because one day equals the average.'
  options_zh:
  - 'A: 大约是零。远的低的一天和远的高的一天互相平衡。'
  - 'B: 大约是正1.1，和A店一样，因为150是高峰。'
  - 'C: 大约是负1.1，和B店一样，因为50是低谷。'
  - 'D: 算不出来，因为有一天正好等于平均数。'
  options_zh_hk:
  - 'A: 大約係零。遠嘅低嗰一日同遠嘅高嗰一日互相平衡。'
  - 'B: 大約係正1.1，同A店一樣，因為150係高峰。'
  - 'C: 大約係負1.1，同B店一樣，因為50係低谷。'
  - 'D: 計唔出嚟，因為有一日啱啱等於平均數。'
  answer: A
  explanation_en: 50 and 150 sit the same distance from 100, on opposite sides. The cubes are minus 125,000 and plus 125,000, so they balance. About zero means the cubed distances balance. It is not a long high side and not a long low side.
  explanation_zh: 50和150离100一样远，在相反的两侧。立方是负125,000和正125,000，互相平衡。大约是零，表示这些立方的距离互相平衡。这不是高的一侧被拉长，也不是低的一侧被拉长。
  explanation_zh_hk: 50同150離100一樣遠，喺相反嘅兩邊。立方係負125,000同正125,000，互相平衡。大約係零，表示呢啲立方嘅距離互相平衡。呢個唔係高嗰一邊被拉長，亦唔係低嗰一邊被拉長。
beats:
- id: hook
  visual: title_card
  seconds: 54
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is skewness?
  title_zh: 什么是偏度？
  title_zh_hk: 咩係偏度？
  en: "Imagine you manage two coffee shops. Tomorrow morning you write one prep sheet. Both shops averaged 100 cups a day over five weekdays. One sheet of 100 looks right for both. It may not be. One shop can still throw cups out on most days. The other can still run out on most days. Wasted cups cost money. An empty shelf costs the sale. Which shop wastes? Which shop runs out? The number that answers that is called skewness. What is skewness?"
  zh: "假设你管着两家咖啡店。明天早上你要写一张备货单。五个工作日里，两家平均每天都卖100杯。一张100杯的单看起来两家都合适。它可能不是。一家店仍然可能大多数天把杯子倒掉。另一家仍然可能大多数天卖完。倒掉的杯子是成本。卖完是丢了那一单。哪家浪费？哪家不够？回答这个问题的数叫作偏度。什么是偏度？"
  zh_hk: "假設你管緊兩間咖啡店。聽朝早你要寫一張備貨單。五個平日入面，兩間平均每日都賣100杯。一張100杯嘅單睇落兩間都合適。佢可能唔係。一間店仍然可能大多數日子將杯倒走。另一間仍然可能大多數日子賣晒。倒走嘅杯係成本。賣晒就係丟咗嗰一單。邊間浪費？邊間唔夠？回答呢個問題嘅數叫做偏度。咩係偏度？"
