  footer_zh_hk: B店相反：40 遠喺低嗰邊
  s1_en: What is left is the shape. Put Shop A's five days on one line of cups. 70, 80 and 90 sit close together, 100 is next to them, and 160 sits far out on the right.
  s1_zh: 剩下的就是形状。把A店的五天放在一条杯数的线上。70、80和90挤在一起，100就在旁边，160远远落在右边。
  s1_zh_hk: 剩低嘅就係形狀。將A店嘅五日擺喺一條杯數嘅線上面。70、80同90擠埋一齊，100就喺隔籬，160遠遠落喺右邊。
  s2_en: Put the average, 100, under the line as the balance point. The line balances there, even though only one day sits above it.
  s2_zh: 把平均数100放在线的下面，当作支点。这条线就在那里平衡，虽然只有一天在它上面。
  s2_zh_hk: 將平均數100擺喺條線下面，當係支點。條線就喺嗰度平衡，雖然得一日喺佢上面。
  s3_en: 'On the left, three near days pull 30, 20 and 10, which is 60. On the right, one far day pulls 60 on its own. That lonely far end is called the tail. Shop A has a long high side. Shop B is the mirror: 40 sits alone, far out on the low side. Is there a quick way to spot which side is long?'
  s3_zh: 左边三天很近，拉力是30、20和10，合共60。右边只有一天，很远，自己就拉了60。这一端孤零零地伸出去，叫作尾巴。A店的高的一侧被拉长。B店刚好相反：40孤零零地远在低的一侧。有没有一个快的方法，看出哪一侧被拉长？
  s3_zh_hk: 左邊三日好近，拉力係30、20同10，加埋60。右邊得一日，好遠，自己就拉咗60。呢一端孤零零噉伸出去，叫做尾巴。A店高嗰一邊被拉長。B店啱啱相反：40孤零零噉遠喺低嗰一邊。有冇一個快嘅方法，睇得出邊一邊被拉長？
- id: clue
  visual: two_column
  seconds: 44
  kicker: A Clue
  kicker_en: A Clue
  kicker_zh: 一个线索
  kicker_zh_hk: 一個線索
  title_en: The middle day is a clue
  title_zh: 排在中间的一天是线索
  title_zh_hk: 排喺中間嘅一日係線索
  left_en: 'A: middle 90, average 100'
  left_zh: A：中间 90，平均 100
  left_zh_hk: A：中間 90，平均 100
  right_en: 'B: middle 110, average 100'
  right_zh: B：中间 110，平均 100
  right_zh_hk: B：中間 110，平均 100
  s1_en: Here is a quick clue. Line each shop's days up from low to high, and take the day in the middle.
  s1_zh: 有一个快的线索。把每家店的五天从少到多排好，取排在中间的那一天。
  s1_zh_hk: 有一個快嘅線索。將每間店嘅五日由少到多排好，攞排喺中間嗰一日。
  s2_en: Shop A's middle day is 90. Its average, 100, sits above that, because the far day at 160 pulls the average toward the long high side.
  s2_zh: A店中间的一天是90。它的平均数100比90高，因为160那个很远的一天，把平均数往被拉长的高的一侧拉。
  s2_zh_hk: A店中間嗰一日係90。佢嘅平均數100比90高，因為160嗰個好遠嘅一日，將平均數向被拉長嘅高嗰一邊拉。
  s3_en: Shop B's middle day is 110. Its average sits below that, pulled down by the quiet day at 40. The middle day is called the median. It is a clue, not the definition, so still open the five days. So what are these two shapes called?
  s3_zh: B店中间的一天是110。它的平均数比110低，被40那个低谷往下拉。中间的那一天叫作中位数。它只是线索，不是定义，所以还是要打开那五天看看。那这两种形状叫什么？
  s3_zh_hk: B店中間嗰一日係110。佢嘅平均數比110低，俾40嗰個低谷拉低咗。中間嗰一日叫做中位數。佢只係線索，唔係定義，所以都要打開嗰五日睇吓。咁呢兩種形狀叫咩？
- id: name_right
  visual: title_card
  seconds: 30
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Right skew
  title_zh: 右偏
  title_zh_hk: 右偏
  en: Right skew. That is the name for a long high side, like Shop A. It is also called positive skew, because the far day sits above the average. Draw the line from low to high, and the tail points right. The name is a place on the line, not a verdict that the shop is better. And the mirror shape?
  zh: 右偏。这就是高的一侧被拉长的名字，像A店。它也叫正偏，因为那个很远的一天在平均数上面。把线从低画到高，尾巴就指向右边。这个名字只是线上的位置，不是说这家店更好。那反过来的形状呢？
  zh_hk: 右偏。呢個就係高嗰一邊被拉長嘅名，好似A店。佢亦叫正偏，因為嗰個好遠嘅一日喺平均數上面。將條線由低畫到高，條尾就指向右邊。呢個名只係線上面嘅位置，唔係話呢間店好啲。咁反轉嘅形狀呢？
- id: name_left
  visual: title_card
  seconds: 28
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Left skew
  title_zh: 左偏
  title_zh_hk: 左偏
  en: Left skew. That is the name for a long low side, like Shop B. It is also called negative skew, because the far day sits below the average, and the tail points left. Now the shapes have names. But we want a number for them, and squaring threw the sign away. What keeps the sign?
  zh: 左偏。这就是低的一侧被拉长的名字，像B店。它也叫负偏，因为那个很远的一天在平均数下面，尾巴指向左边。现在形状有了名字。可是我们想要一个数，而平方已经把正负号丢掉了。怎样才能保住正负号？
  zh_hk: 左偏。呢個就係低嗰一邊被拉長嘅名，好似B店。佢亦叫負偏，因為嗰個好遠嘅一日喺平均數下面，條尾指向左邊。而家形狀有咗名。但係我哋想要一個數，而平方已經將正負號掉咗。點樣先保得住正負號？
- id: why_cube
  visual: steps
  layout: rows
  seconds: 56
  kicker: Why Cube
  kicker_en: Why Cube
  kicker_zh: 为什么要立方
  kicker_zh_hk: 點解要立方
  title_en: Multiply by itself, then again
  title_zh: 乘以自己，再乘一次
  title_zh_hk: 乘自己，再乘一次
  step1_en: 2 × 2 = 4 and −2 × −2 = 4
  step1_zh: 2 × 2 = 4，−2 × −2 = 4
  step1_zh_hk: 2 × 2 = 4，−2 × −2 = 4
  step2_en: 2 × 2 × 2 = +8
  step2_zh: 2 × 2 × 2 = +8
  step2_zh_hk: 2 × 2 × 2 = +8
  step3_en: −2 × −2 × −2 = −8
  step3_zh: −2 × −2 × −2 = −8
  step3_zh_hk: −2 × −2 × −2 = −8
  step4_en: 4 × 4 × 4 = 64
  step4_zh: 4 × 4 × 4 = 64
  step4_zh_hk: 4 × 4 × 4 = 64
  s1_en: Squaring loses the sign. 2 times 2 is 4, and minus 2 times minus 2 is also 4. A day above and a day below look the same.
  s1_zh: 平方会丢掉正负号。2乘2等于4，负2乘负2也等于4。高于平均的一天和低于平均的一天，看起来一模一样。
  s1_zh_hk: 平方會掉咗正負號。2乘2等於4，負2乘負2都等於4。高過平均嘅一日同低過平均嘅一日，睇落一模一樣。
  s2_en: So multiply once more. 2 times 2 times 2 is 8. A number times itself, then times itself again, is called its cube.
  s2_zh: 所以再乘一次。2乘2乘2等于8。一个数乘以自己，再乘以自己一次，叫作它的立方。
  s2_zh_hk: 所以再乘多一次。2乘2乘2等於8。一個數乘自己，再乘自己一次，叫做佢嘅立方。
  s3_en: Now minus 2 times minus 2 times minus 2. The first two make plus 4, and times minus 2 gives minus 8. The sign survives. A day above stays plus. A day below stays minus.
  s3_zh: 再看负2乘负2乘负2。前两个得正4，再乘负2，得负8。正负号保住了。高于平均的一天仍然是正，低于平均的一天仍然是负。
  s3_zh_hk: 再睇負2乘負2乘負2。頭兩個得正4，再乘負2，得負8。正負號保住咗。高過平均嘅一日仍然係正，低過平均嘅一日仍然係負。
  s4_en: And a far day weighs much more. 4 is only twice as far as 2, but 4 cubed is 64, eight times as big as 8. So what happens when we cube Shop A's days?
  s4_zh: 而且远的一天分量重得多。4只是2的两倍远，但4的立方是64，是8的八倍。那把A店的每一天都立方，会怎样？
  s4_zh_hk: 而且遠嘅一日份量重好多。4只係2嘅兩倍遠，但係4嘅立方係64，係8嘅八倍。咁將A店每一日都立方，會點？
