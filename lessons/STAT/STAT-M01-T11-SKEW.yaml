  title_en: Same steps. The other side.
  title_zh: 同样的步骤，另一侧
  title_zh_hk: 同樣嘅步驟，另一邊
  step1_en: −60 cubed = −216,000
  step1_zh: −60 的立方 = −216,000
  step1_zh_hk: −60 嘅立方 = −216,000
  step2_en: 0, +1,000, +8,000, +27,000
  step2_zh: 0，+1,000，+8,000，+27,000
  step2_zh_hk: 0，+1,000，+8,000，+27,000
