  s1_en: 'Here are the five days behind that prep sheet, in cups sold. Shop A: Day 1 sold 70. Day 2 sold 80. Day 3 sold 90. Day 4 sold 100. Day 5 sold 160.'
  s1_zh: 这就是那张备货单背后的五天，单位是卖出的杯数。A店：第1天卖了70杯，第2天80杯，第3天90杯，第4天100杯，第5天160杯。
  s1_zh_hk: 呢個就係嗰張備貨單背後嘅五日，單位係賣出嘅杯數。A店：第1日賣咗70杯，第2日80杯，第3日90杯，第4日100杯，第5日160杯。
  s2_en: Those five add to 500, so the average is 100. Three days sit below 100. One day is a rush at 160.
  s2_zh: 这五天加起来是500，所以平均数是100。有三天低于100，有一天是160的高峰。
  s2_zh_hk: 呢五日加埋係500，所以平均數係100。有三日低過100，有一日係160嘅高峰。
  s3_en: Shop B sold 40, 100, 110, 120, and 130. Same total, same average. But three days sit above 100, and one day is quiet at 40. So does one sheet of 100 cups suit both shops?
  s3_zh: B店卖了40、100、110、120和130杯。总数一样，平均数一样。但有三天高于100，有一天是40的低谷。那一张100杯的备货单，两家都合适吗？
  s3_zh_hk: B店賣咗40、100、110、120同130杯。總數一樣，平均數一樣。但係有三日高過100，有一日係40嘅低谷。咁一張100杯嘅備貨單，兩間都啱用嗎？
  kicker: Five Days
