- id: why_cube
  visual: steps
  seconds: 48
  kicker: Why Cube
  kicker_en: Why Cube
  kicker_zh: 为什么要立方
  kicker_zh_hk: 點解要立方
  title_en: Multiply by itself, then again
  title_zh: 乘以自己，再乘一次
  title_zh_hk: 乘自己，再乘一次
  step1_en: 2 × 2 = 4. The sign is gone.
  step1_zh: 2 × 2 = 4。符号没有了。
  step1_zh_hk: 2 × 2 = 4。符號冇咗。
  step2_en: 2 × 2 × 2 = 8
  step2_zh: 2 × 2 × 2 = 8
  step2_zh_hk: 2 × 2 × 2 = 8
  step3_en: −2 × −2 × −2 = −8
  step3_zh: −2 × −2 × −2 = −8
  step3_zh_hk: −2 × −2 × −2 = −8
  step4_en: The sign survives
  step4_zh: 符号还在
  step4_zh_hk: 符號仲喺度
  s1_en: Variance already multiplied each distance by itself. That wiped the sign. Two times two is 4. Minus 2 times minus 2 is also 4. So variance can say how big the swing is, and nothing about which side is long.
  s1_zh: 方差已经把每个距离乘以自己。符号被抹掉了。2乘2等于4。负2乘负2也等于4。所以方差只能说晃动有多大，不能说哪一侧被拉长。
  s1_zh_hk: 方差已經將每個距離乘自己。符號被抹走咗。2乘2等於4。負2乘負2都等於4。所以方差只可以話搖動有幾大，唔可以話邊一邊被拉長。
  s2_en: This time we multiply by itself, then by itself again. Two times two times two is 8. That is a cube. A small example first.
  s2_zh: 这一次，我们乘以自己，再乘以自己一次。2乘2乘2等于8。这就是立方。先看一个小的。
  s2_zh_hk: 呢一次，我哋乘自己，再乘自己一次。2乘2乘2等於8。呢個就係立方。先睇一個細嘅。
  s3_en: 'Minus 2 times minus 2 times minus 2 is minus 8. The sign survives. A day above 100 stays positive. A day below 100 stays negative. And a far day weighs more: 4 times 4 times 4 is 64, while 2 times 2 times 2 is only 8.'
  s3_zh: 负2乘负2乘负2等于负8。符号还在。高于100的一天仍然是正的。低于100的一天仍然是负的。而且远的一天更重：4乘4乘4是64，2乘2乘2只有8。
  s3_zh_hk: 負2乘負2乘負2等於負8。符號仲喺度。高過100嘅一日仍然係正。低過100嘅一日仍然係負。而且遠嘅一日更重：4乘4乘4係64，2乘2乘2只有8。
- id: cubes_a
  visual: steps
  seconds: 48
  kicker: Shop A
  kicker_en: Shop A
  kicker_zh: A店
  kicker_zh_hk: A店
  title_en: Cube every day at A
  title_zh: 把A店的每一天立方
  title_zh_hk: 將A店嘅每一日立方
  step1_en: −30 × −30 × −30 = −27,000
  step1_zh: −30 × −30 × −30 = −27,000
  step1_zh_hk: −30 × −30 × −30 = −27,000
  step2_en: −20 cubed = −8,000. −10 cubed = −1,000.
  step2_zh: −20 的立方 = −8,000。−10 的立方 = −1,000。
  step2_zh_hk: −20 嘅立方 = −8,000。−10 嘅立方 = −1,000。
  step3_en: 0 cubed = 0. +60 cubed = +216,000.
  step3_zh: 0 的立方 = 0。+60 的立方 = +216,000。
  step3_zh_hk: 0 嘅立方 = 0。+60 嘅立方 = +216,000。
  step4_en: The rush outweighs the three quiet days
  step4_zh: 高峰压过了三天清闲
  step4_zh_hk: 高峰壓過咗三日清閒
  s1_en: 'Now do that for every day at A. We already have the five how-far numbers: minus 30, minus 20, minus 10, zero, and plus 60.'
  s1_zh: 现在对A店的每一天都这样做。我们刚才已经有了五个“有多远”：负30、负20、负10、零和正60。
  s1_zh_hk: 而家對A店嘅每一日都咁做。我哋頭先已經有咗五個「有幾遠」：負30、負20、負10、零同正60。
  s2_en: Minus 30 times itself, then again, is minus 27,000. Minus 20 gives minus 8,000. Minus 10 gives minus 1,000. The three quiet days pull down.
  s2_zh: 负30乘自己，再乘一次，等于负27,000。负20是负8,000。负10是负1,000。三天清闲往下拉。
  s2_zh_hk: 負30乘自己，再乘一次，等於負27,000。負20係負8,000。負10係負1,000。三日清閒向下拉。
  s3_en: Zero times itself is zero. Plus 60 times itself, then again, is plus 216,000. One rush outweighs the three quiet days. That is the long high side, in a number.
  s3_zh: 零乘自己是零。正60乘自己，再乘一次，等于正216,000。一个高峰压过了三天清闲。这就是被拉长的高的一侧，写成一个数。
  s3_zh_hk: 零乘自己係零。正60乘自己，再乘一次，等於正216,000。一個高峰壓過咗三日清閒。呢個就係被拉長嘅高嗰一邊，寫成一個數。
