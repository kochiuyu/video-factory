title_en: What is skewness?
title_zh: 什么是偏度？
title_zh_hk: 咩係偏度？
objective_en: Decide whether two shops that match on the average and the variance can prepare the same 100 cups, and use the cube of the distances to see which side is long.
objective_zh: 判断两家平均数和方差都相同的门店能不能都按100杯备货，并用距离的立方看出哪一侧被拉长。
objective_zh_hk: 判斷兩間平均數同方差都相同嘅門店可唔可以都按100杯備貨，並用距離嘅立方睇出邊一邊被拉長。
