  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A reason to check, not an order
  title_zh: 是检查的理由，不是指令
  title_zh_hk: 係檢查嘅理由，唔係指令
  left_en: 'Tells: which side is long'
  left_zh: 能说：哪一侧被拉长
  left_zh_hk: 講到：邊一邊被拉長
  right_en: 'Not: better, worse, or cups'
  right_zh: 不能说：好坏或杯数
  right_zh_hk: 講唔到：好壞或者杯數
  s1_en: So what does skewness tell you, and what does it not?
  s1_zh: 那偏度能告诉你什么，又不能告诉你什么？
  s1_zh_hk: 咁偏度話到你知啲乜，又話唔到你知啲乜？
  s2_en: It tells you which side is long, and it uses every day to do it. Cubing keeps the sign, so the far day is not cancelled out. Even when the average and the variance match, as they do here, it shows that the two shops need different plans.
  s2_zh: 它能告诉你哪一侧被拉长，而且用到每一天。立方保住了正负号，所以那个很远的一天不会被抵消掉。即使平均数和方差都一样，就像这里，它也能显示两家店需要不同的计划。
  s2_zh_hk: 佢話到你知邊一邊被拉長，而且用到每一日。立方保住咗正負號，所以嗰個好遠嘅一日唔會被抵銷。就算平均數同方差都一樣，好似呢度噉，佢都顯示到兩間店需要唔同嘅計劃。
  s3_en: It does not say a shop is better or worse. A minus is not a bad mark. It has no cups left in it, so 1.1 is not an order to prepare 101 cups. One far day can create it, and with only five days, one unusual day can change it a lot. Two different sets of days can even give the same number. So keep the five days in view. Then which shop wastes, and which runs out?
  s3_zh: 它不能说一家店更好或更差，负号不是扣分。它里面已经没有杯了，所以1.1不是叫你备101杯的指令。一个很远的日子就能造成它，而只有五天，一个特别的日子就能让它变很多。两组不同的日子，甚至可能算出同一个数。所以要一直看着那五天。那到底哪家浪费，哪家不够？
  s3_zh_hk: 佢講唔到一間店好啲定差啲，負號唔係扣分。佢入面已經冇杯，所以1.1唔係叫你備101杯嘅指令。一個好遠嘅日子就可以造成佢，而得五日，一個特別嘅日子就可以令佢變好多。兩組唔同嘅日子，甚至可能計出同一個數。所以要一直睇住嗰五日。咁究竟邊間浪費，邊間唔夠？
- id: answer
  visual: takeaway
  seconds: 66
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Same average. Different plans.
  title_zh: 平均相同，计划不同
  title_zh_hk: 平均相同，計劃唔同
  q1_en: Which shop wastes, which runs out?
  q1_zh: 哪家浪费，哪家不够？
  q1_zh_hk: 邊間浪費，邊間唔夠？
  q2_en: What else before choosing a prep amount?
  q2_zh: 定备货量之前，还要看什么？
  q2_zh_hk: 定備貨量之前，仲要睇咩？
  s1_en: 'Back to tonight''s prep sheet. Same average, same variance, but not the same shape. Shop A is about plus 1.1, right skew: three days below 100 and one rush at 160. Preparing 100 there wastes cups on three of the five days.'
  s1_zh: 回到今晚的备货单。平均相同，方差相同，形状却不同。A店大约是正1.1，右偏：三天低于100，一天是160的高峰。在那里备100杯，五天里有三天会浪费。
  s1_zh_hk: 返到今晚嘅備貨單。平均相同，方差相同，形狀就唔同。A店大約係正1.1，右偏：三日低過100，一日係160嘅高峰。喺嗰度備100杯，五日入面有三日會浪費。
  s2_en: 'Shop B is about minus 1.1, left skew: three days above 100 and one quiet day at 40. Preparing 100 there runs out on three of the five days. The sign shows the long side. The days themselves show which outcome came up more often.'
  s2_zh: B店大约是负1.1，左偏：三天高于100，一天是40的低谷。在那里备100杯，五天里有三天会不够。正负号指出被拉长的一侧，日子本身才说明哪种结果出现得更多。
  s2_zh_hk: B店大約係負1.1，左偏：三日高過100，一日係40嘅低谷。喺嗰度備100杯，五日入面有三日會唔夠。正負號指出被拉長嘅一邊，啲日子本身先講到邊種結果出現得多啲。
  s3_en: Before you set the plan, check the cost of a wasted cup, the cost of running out, and whether these five days will happen again. These numbers describe only the five days we supposed. The average, the variance and the skewness each answer one question. None of them writes the prep sheet by itself.
  s3_zh: 定计划之前，还要看倒掉一杯的成本、卖完的成本，以及这五天会不会再出现。这些数只描述我们假设的五天。平均数、方差、偏度，各自回答一个问题，哪一个都不能单独写出备货单。
  s3_zh_hk: 定計劃之前，仲要睇倒走一杯嘅成本、賣晒嘅成本，同埋呢五日會唔會再出現。呢啲數只係描述我哋假設嘅五日。平均數、方差、偏度，各自答一個問題，邊一個都唔可以單獨寫出備貨單。
