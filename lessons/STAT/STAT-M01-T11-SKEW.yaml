  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is skewness?
  title_zh: 什么是偏度？
  title_zh_hk: 咩係偏度？
  en: Imagine you run two coffee shops, Shop A and Shop B. Tonight you write one prep sheet for tomorrow. Over five weekdays, both shops averaged 100 cups a day, and their days swung by the same amount. So 100 cups at each shop looks safe. It may not be. At one shop, 100 cups leaves cups to throw out on most days. At the other, 100 runs out on most days. Thrown-out cups cost money. Running out costs the sale. The average and the swing cannot tell you which shop is which. One more number can. What is skewness?
  zh: 假设你管着两家咖啡店，A店和B店。今晚你要写明天的备货单。五个工作日里，两家店平均每天都卖100杯，每天的起伏也一样大。所以两家都备100杯，看起来很稳妥。其实未必。在其中一家，备100杯，大多数日子都要倒掉一些。在另一家，备100杯，大多数日子都会卖完。倒掉的杯子是成本，卖完了就丢了生意。平均数和起伏，都说不出哪家是哪家。还有一个数说得出。什么是偏度？
  zh_hk: 假設你管住兩間咖啡店，A店同B店。今晚你要寫聽日嘅備貨單。五個平日入面，兩間店平均每日都賣100杯，每日嘅起跌亦一樣咁大。所以兩間都備100杯，睇落好穩陣。其實未必。喺其中一間，備100杯，大部分日子都要倒走啲。喺另一間，備100杯，大部分日子都會賣晒。倒走嘅杯係成本，賣晒就走咗生意。平均數同起跌，都講唔到邊間係邊間。仲有一個數講得到。咩係偏度？
