  footer_en: 'Each shop: 5,000 / 5 = 1,000'
  footer_zh: 每家店：5,000 / 5 = 1,000
  footer_zh_hk: 每間店：5,000 / 5 = 1,000
  s1_en: Multiply each deviation by itself. A minus times a minus is a plus, so nothing cancels. Do it for both shops. Shop B's deviations are minus 60, zero, plus 10, plus 20, and plus 30.
  s1_zh: 把每个偏差乘以自己。负数乘负数得正数，所以不会再抵消。两家店都这样做。B店的偏差是负60、零、正10、正20和正30。
  s1_zh_hk: 將每個偏差乘自己。負數乘負數得正數，所以唔會再抵銷。兩間店都咁做。B店嘅偏差係負60、零、正10、正20同正30。
  s2_en: Read the bars. Shop A gives 900, 400, 100, zero, and 3,600. Shop B gives 3,600, zero, 100, 400, and 900. The same five numbers, in a different order.
  s2_zh: 读一读这些柱。A店是900、400、100、零和3,600。B店是3,600、零、100、400和900。同样的五个数，只是次序不同。
  s2_zh_hk: 讀吓啲柱。A店係900、400、100、零同3,600。B店係3,600、零、100、400同900。同樣嘅五個數，只係次序唔同。
  s3_en: So each shop adds to 5,000. Share it over 5 days and you get 1,000. That is the variance, and it is the same for both shops. But squaring wiped out every sign, so it cannot say which side is long. Then what is left that differs?
  s3_zh: 所以每家店加起来都是5,000。平均分到5天，得到1,000。这就是方差，两家店一样。可是平方把所有正负号都抹掉了，所以它说不出哪一侧被拉长。那还剩下什么是不同的？
  s3_zh_hk: 所以每間店加埋都係5,000。平均分落5日，得到1,000。呢個就係方差，兩間店一樣。但係平方將所有正負號都抹走咗，所以佢講唔到邊一邊被拉長。咁仲有乜嘢係唔同？
