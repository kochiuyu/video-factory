  s1_en: Shop B's deviations are minus 60, zero, plus 10, plus 20, and plus 30. Cube each one, the same way.
  s1_zh: B店的偏差是负60、零、正10、正20和正30。用同样的方法，每一个都立方。
  s1_zh_hk: B店嘅偏差係負60、零、正10、正20同正30。用同樣嘅方法，每一個都立方。
  s2_en: Minus 60 cubed is minus 216,000. Zero stays zero. Plus 10, 20, and 30 cubed give plus 1,000, plus 8,000, and plus 27,000.
  s2_zh: 负60的立方是负216,000。零还是零。正10、20、30的立方，是正1,000、正8,000和正27,000。
  s2_zh_hk: 負60嘅立方係負216,000。零仍然係零。正10、20、30嘅立方，係正1,000、正8,000同正27,000。
  s3_en: 'Now the far day points down and outweighs the three busy days. The sum is minus 180,000: the same size as Shop A, with the opposite sign. The sign shows the long side. But 180,000 of what?'
  s3_zh: 这次很远的那一天往下指，压过了三天较忙的。总和是负180,000：大小和A店一样，正负号相反。正负号指出被拉长的一侧。可是，180,000是什么单位？
  s3_zh_hk: 今次好遠嗰一日向下指，壓過咗三日較忙嘅。總和係負180,000：大細同A店一樣，正負號相反。正負號指出被拉長嘅一邊。但係，180,000係乜嘢單位？
- id: formula
  visual: steps
  layout: rows
  seconds: 70
  kicker: Take Out the Cups
  kicker_en: Take Out the Cups
  kicker_zh: 去掉单位
  kicker_zh_hk: 拎走單位
  title_en: Share it, then take out the cups
  title_zh: 平分，再去掉杯
  title_zh_hk: 平分，再拎走杯
  step1_en: 180,000 / 5 = 36,000
  step1_zh: 180,000 / 5 = 36,000
  step1_zh_hk: 180,000 / 5 = 36,000
  step2_en: σ = √1,000 ≈ 31.6
  step2_zh: σ = √1,000 ≈ 31.6
  step2_zh_hk: σ = √1,000 ≈ 31.6
  step3_en: 31.6 × 31.6 × 31.6 ≈ 31,600
  step3_zh: 31.6 × 31.6 × 31.6 ≈ 31,600
  step3_zh_hk: 31.6 × 31.6 × 31.6 ≈ 31,600
  step4_en: 36,000 / 31,600 ≈ +1.1
  step4_zh: 36,000 / 31,600 ≈ +1.1
  step4_zh_hk: 36,000 / 31,600 ≈ +1.1
  s1_en: It is cups times cups times cups, so the number is huge and its unit is strange. First share Shop A's sum over the 5 days, like an average. 180,000 divided by 5 is 36,000.
  s1_zh: 单位是杯乘杯乘杯，所以这个数很大，单位也很怪。先把A店的总和平均分到5天，就像算平均数。180,000除以5，等于36,000。
  s1_zh_hk: 單位係杯乘杯乘杯，所以呢個數好大，單位亦好怪。先將A店嘅總和平均分落5日，好似計平均數噉。180,000除5，等於36,000。
  s2_en: 'Next, the typical swing in plain cups. That is the standard deviation, written sigma: the number that, times itself, gives the variance of 1,000. It is about 31.6 cups.'
  s2_zh: 接着，用普通的杯数说典型的起伏。这就是标准差，写作西格玛：自己乘自己会得到方差1,000的那个数。它大约是31.6杯。
  s2_zh_hk: 跟住，用普通嘅杯數講典型嘅起跌。呢個就係標準差，寫做西格瑪：自己乘自己會得到方差1,000嗰個數。佢大約係31.6杯。
  s3_en: Cube it as well. 31.6 times 31.6 times 31.6 is about 31,600. That is cups cubed too, like the 36,000.
  s3_zh: 把它也立方。31.6乘31.6乘31.6，大约是31,600。它也是杯的立方，和36,000一样。
  s3_zh_hk: 將佢都立方。31.6乘31.6乘31.6，大約係31,600。佢都係杯嘅立方，同36,000一樣。
  s4_en: Now divide. 36,000 over 31,600 is about plus 1.1. The cups cancel, so it is a plain number that any two shops can share. Shop B, with minus 180,000, gives about minus 1.1. So what is this number called?
  s4_zh: 现在相除。36,000除以31,600，大约是正1.1。杯这个单位约掉了，变成一个普通的数，任何两家店都可以拿来比较。B店的总和是负180,000，算出来大约是负1.1。那这个数叫什么？
  s4_zh_hk: 而家相除。36,000除31,600，大約係正1.1。杯呢個單位約咗，變成一個普通嘅數，任何兩間店都可以攞嚟比較。B店嘅總和係負180,000，計出嚟大約係負1.1。咁呢個數叫咩？
- id: name_skew
  visual: title_card
  seconds: 34
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Skewness
  title_zh: 偏度
  title_zh_hk: 偏度
  en: Skewness. It is the number that says which side is long, after the average and the variance have matched. Plus means a long high side, right skew, like Shop A at about plus 1.1. Minus means a long low side, left skew, like Shop B at about minus 1.1. Near zero means the cubes balance. So how do we write it for any group of days?
  zh: 偏度。在平均数和方差都对上之后，它就是说出哪一侧被拉长的那个数。正的表示高的一侧被拉长，也就是右偏，像A店，大约正1.1。负的表示低的一侧被拉长，也就是左偏，像B店，大约负1.1。接近零，表示这些立方互相平衡。那换成任何一组日子，要怎么写？
  zh_hk: 偏度。喺平均數同方差都對上之後，佢就係講出邊一邊被拉長嗰個數。正嘅代表高嗰一邊被拉長，即係右偏，好似A店，大約正1.1。負嘅代表低嗰一邊被拉長，即係左偏，好似B店，大約負1.1。接近零，代表呢啲立方互相平衡。咁換成任何一組日子，要點寫？
- id: defn
  visual: definition_card
  seconds: 44
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Skewness, written down
  title_zh: 偏度，写成公式
  title_zh_hk: 偏度，寫成公式
  formula: Skewness = (Σ(x − μ)³ / n) / σ³
  formula_zh: 偏度 = (Σ(x − μ)³ / n) / σ³
  formula_zh_hk: 偏度 = (Σ(x − μ)³ / n) / σ³
  formula_tex: \dfrac{\sum (x_i - \mu)^3 / n}{\sigma^3}
  gloss: The sign shows which side is long
  gloss_zh: 正负号说明哪一侧被拉长
  gloss_zh_hk: 正負號話你知邊一邊被拉長
  s1_en: Here are the same steps in symbols. x is each day and mu is the average, so x minus mu is the deviation. Cube each one. The big sigma means add them all. Divide by n, the number of days. Then divide by small sigma cubed, the standard deviation cubed.
  s1_zh: 这是同样的步骤，用符号写出来。x是每一天，mu是平均数，所以x减mu就是偏差。每一个都立方。大写的西格玛表示全部加起来。除以n，也就是天数。再除以小写西格玛的立方，就是标准差的立方。
  s1_zh_hk: 呢個係同樣嘅步驟，用符號寫出嚟。x係每一日，mu係平均數，所以x減mu就係偏差。每一個都立方。大寫嘅西格瑪代表全部加埋。除以n，即係日數。再除以細寫西格瑪嘅立方，即係標準差嘅立方。
  s2_en: We divide by n, the number of days, as we did for the variance. For Shop A it gives about plus 1.1, and for Shop B about minus 1.1. So what can this number tell you, and what can it not?
  s2_zh: 和方差一样，我们除以n，也就是天数。A店得到大约正1.1，B店大约负1.1。那这个数能告诉你什么，又不能告诉你什么？
  s2_zh_hk: 同方差一樣，我哋除以n，即係日數。A店得到大約正1.1，B店大約負1.1。咁呢個數話到你知啲乜，又話唔到你知啲乜？
