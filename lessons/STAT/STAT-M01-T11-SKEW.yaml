  q1_en: Which shop wastes, and which shop runs out?
  q1_zh: 哪家浪费，哪家不够？
  q1_zh_hk: 邊間浪費，邊間唔夠？
  q2_en: What else is needed before choosing a prep quantity?
  q2_zh: 选定备货数量之前，还需要什么？
  q2_zh_hk: 揀定備貨數量之前，仲需要咩？
  s1_en: Back to the question. Same average, same spread, different plans. Shop A is about plus 1.1, right skew. Three days are below 100, and one day is a rush at 160. Preparing 100 wastes on three days.
  s1_zh: 回到问题。平均相同，分散相同，计划不同。A店大约是正1.1，右偏。三天低于100，一天是160的高峰。备100杯，三天会浪费。
  s1_zh_hk: 返到問題。平均相同，分散相同，計劃唔同。A店大約係正1.1，右偏。三日低過100，一日係160嘅高峰。備100杯，三日會浪費。
  s2_en: Shop B is about minus 1.1, left skew. Three days are above 100, and one day is quiet at 40. Preparing 100 runs short on three of these five days. The sign says the long side. The day count says which outcome showed up more often.
  s2_zh: B店大约是负1.1，左偏。三天高于100，一天是40的低谷。备100杯，这五天里有三天会不够。符号说明被拉长的一侧。天数的清点说明哪种结果出现得更多。
  s2_zh_hk: B店大約係負1.1，左偏。三日高過100，一日係40嘅低谷。備100杯，呢五日入面有三日會唔夠。符號講被拉長嘅一邊。日數嘅清點講邊種結果出現得更多。
  s3_en: Before you set the plan, check the cost of wasted cups, the cost of running out, and whether these five days will happen again. These numbers describe only the five days we supposed. Neither the average, nor the variance, nor the skewness writes the prep sheet by itself.
  s3_zh: 定备货之前，还要看倒掉杯子的成本、卖完的成本，以及这五天会不会再发生。这些数只描述我们假设的五天。平均数、方差、偏度，哪一个都不能单独写备货单。
  s3_zh_hk: 定備貨之前，仲要睇倒走杯嘅成本、賣晒嘅成本，以及呢五日會唔會再發生。呢啲數只係描述我哋假設嘅五日。平均數、方差、偏度，邊一個都唔可以單獨寫備貨單。
