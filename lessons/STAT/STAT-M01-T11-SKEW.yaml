  footer_zh_hk: 立方之和 = +180,000
  s1_en: 'Take Shop A''s five deviations and cube each one. You can see it under each day: minus 30 cubed, minus 20 cubed, minus 10 cubed, zero cubed, and plus 60 cubed.'
  s1_zh: 拿A店的五个偏差，每一个都立方。每天下面都写着：负30的立方、负20的立方、负10的立方、零的立方，还有正60的立方。
  s1_zh_hk: 攞A店嘅五個偏差，每一個都立方。每日下面都寫住：負30嘅立方、負20嘅立方、負10嘅立方、零嘅立方，同正60嘅立方。
  s2_en: Minus 30 cubed is minus 27,000. Minus 20 gives minus 8,000, and minus 10 gives minus 1,000. Zero stays zero. Plus 60 cubed is plus 216,000. The three quiet days point down, but they are small.
  s2_zh: 负30的立方是负27,000。负20是负8,000，负10是负1,000。零还是零。正60的立方是正216,000。三天清闲的往下指，但都很小。
  s2_zh_hk: 負30嘅立方係負27,000。負20係負8,000，負10係負1,000。零仍然係零。正60嘅立方係正216,000。三日清閒嘅向下指，但係都好細。
  s3_en: 'The far day towers over the rest. Add the five: 216,000 minus 27,000, minus 8,000, minus 1,000 is plus 180,000. Plus, because the long side is high. What does Shop B give?'
  s3_zh: 很远的那一天比其他几天高出一大截。五个加起来：216,000减27,000，减8,000，再减1,000，等于正180,000。是正的，因为被拉长的是高的一侧。那B店会得到什么？
  s3_zh_hk: 好遠嗰一日比其他日高出一大截。五個加埋：216,000減27,000，減8,000，再減1,000，等於正180,000。係正，因為被拉長嘅係高嗰一邊。咁B店會得到乜？
