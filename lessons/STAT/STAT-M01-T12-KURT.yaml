quiz:
- id: Q1
  type: multiple_choice
  question_en: Two shops average 100 cups, have the same variance, and both have zero skewness. Why might a manager still look at kurtosis before setting one reserve?
  question_zh: 两家店平均都是100杯，方差相同，偏度都是零。为什么经理在定同一份储备之前仍然可能要看峰度？
  question_zh_hk: 兩間店平均都係100杯，方差相同，偏度都係零。點解經理定同一份儲備之前仍然可能要睇峰度？
  options_en:
  - 'A: The three matching facts can still hide which shop has the higher fourth-power average.'
  - 'B: Kurtosis measures how widely the days spread, which the variance cannot.'
  - 'C: The same variance means the far days are the same.'
  - 'D: Kurtosis tells the manager exactly how many cups to hold in reserve.'
  options_zh:
  - 'A: 三个对得上的事实，仍然可能看不出哪家的四次方平均值更高。'
  - 'B: 峰度量的是天数分散有多宽，而这是方差做不到的。'
  - 'C: 方差相同，就表示远的天相同。'
  - 'D: 峰度可以直接告诉经理该留多少杯作储备。'
  options_zh_hk:
  - 'A: 三個對得上嘅事實，仍然可能睇唔出邊間嘅四次方平均值更高。'
  - 'B: 峰度量嘅係日數分散有幾闊，而呢個係方差做唔到嘅。'
  - 'C: 方差相同，就表示遠嘅日相同。'
  - 'D: 峰度可以直接話經理知應該留幾多杯作儲備。'
  answer: A
  explanation_en: Shop A and Shop B both average 100, both have variance 1,440 cups squared, and both have skewness 0. Shop A stays in a band. Shop B has two far days and three days on the average. Kurtosis is the next question after those three facts. It is not another way to measure how wide the days spread, and it does not write the reserve by itself.
  explanation_zh: A店和B店平均都是100，方差都是1,440杯的平方，偏度都是0。A店停在一个区间里。B店有两个远的天，三天正好在平均数上。看完这三个事实，下一个问题就是峰度。它不是再量一次分散有多宽，本身也不能写出储备。
  explanation_zh_hk: A店同B店平均都係100，方差都係1,440杯嘅平方，偏度都係0。A店停喺一個區間入面。B店有兩個遠嘅日，三日啱啱喺平均數上。睇完呢三個事實，下一個問題就係峰度。佢唔係再量一次分散有幾闊，本身亦都唔可以寫出儲備。
- id: Q2
  type: multiple_choice
  question_en: A third shop has raw kurtosis 3.25. For a Normal distribution, raw kurtosis is 3. What can the manager conclude?
  question_zh: 第三家店的原始峰度是3.25。正态分布的原始峰度是3。经理可以得出什么结论？
  question_zh_hk: 第三間店嘅原始峰度係3.25。正態分布嘅原始峰度係3。經理可以得出咩結論？
  options_en:
  - 'A: The standardized fourth-power average is above the Normal benchmark. The number alone does not set the reserve.'
  - 'B: The reserve must be 3.25 cups.'
  - 'C: The shop has no far days, because 3.25 is close to 3.'
  - 'D: The average and the variance must both be 3.25.'
  options_zh:
  - 'A: 标准化距离的四次方平均值高于正态基准。这个数本身不定储备。'
  - 'B: 储备必须是3.25杯。'
  - 'C: 这家店没有远离平均数的日子，因为3.25接近3。'
  - 'D: 平均数和方差都必须是3.25。'
  options_zh_hk:
  - 'A: 標準化距離嘅四次方平均值高過正態基準。呢個數本身唔定儲備。'
  - 'B: 儲備一定要係3.25杯。'
  - 'C: 呢間店冇遠離平均數嘅日子，因為3.25接近3。'
  - 'D: 平均數同方差都一定要係3.25。'
  answer: A
  explanation_en: Raw kurtosis 3.25 means the standardized fourth-power average exceeds the Normal benchmark of 3. It does not identify a reserve quantity. A reserve still needs the cost of waste, the cost of running out, how soon the shop can restock, and whether these days will happen again.
  explanation_zh: 原始峰度3.25表示标准化距离的四次方平均值超过正态基准3。它不定储备的数量。定储备仍然要看浪费的成本、卖完的成本、多久能补货，以及这些天会不会再发生。
  explanation_zh_hk: 原始峰度3.25表示標準化距離嘅四次方平均值超過正態基準3。佢唔定儲備嘅數量。定儲備仍然要睇浪費嘅成本、賣晒嘅成本、幾耐可以補貨，以及呢啲日會唔會再發生。
beats:
- id: hook
  visual: title_card
  seconds: 56
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is kurtosis?
  title_zh: 什么是峰度？
  title_zh_hk: 咩係峰度？
  en: Imagine you manage two coffee shops, Shop A and Shop B, and you set one reserve of cups for both. Over five weekdays, both shops averaged 100 cups a day. Their days swung by the same amount, and neither leaned high or low. So one reserve near 100 looks right for both. It may not be. At one shop, the misses are moderate and come often. At the other, most days are spot on, but a rare far day misses by a lot. A far day can empty the shelf, or leave cups to throw out. Which shop needs a different reserve? The average, the swing and the lean all match. One more number can tell them apart. What is kurtosis?
  zh: 假设你管着两家咖啡店，A店和B店，给两家定同一份杯子储备。五个工作日里，两家平均每天都卖100杯。每天的起伏一样大，也都不偏高或偏低。所以一份靠近100的储备，看起来两家都合适。其实未必。一家店常常差一点。另一家大多数日子刚刚好，可是偶尔有一天差很多。很远的一天可能卖完，也可能剩下杯子要倒掉。哪家店需要另一份储备？平均数、起伏、偏向都一样。还有一个数分得开它们。什么是峰度？
  zh_hk: 假設你管住兩間咖啡店，A店同B店，畀兩間定同一份杯嘅儲備。五個平日入面，兩間平均每日都賣100杯。每日嘅起跌一樣咁大，亦都唔偏高或者偏低。所以一份靠近100嘅儲備，睇落兩間都啱。其實未必。一間店成日差少少。另一間大部分日子啱啱好，但係間中有一日差好多。好遠嗰日可能賣晒，亦可能剩低啲杯要倒走。邊間店需要另一份儲備？平均數、起跌、偏向都一樣。仲有一個數分得開佢哋。咩係峰度？
