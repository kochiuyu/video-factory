  name_a_en: Shop A
  name_a_zh: A店
  name_a_zh_hk: A店
  name_b_en: Shop B
  name_b_zh: B店
  name_b_zh_hk: B店
  footer_en: 'Each shop: sum of cubes = 0'
  footer_zh: 两家店：立方之和 = 0
  footer_zh_hk: 兩間店：立方之和 = 0
  s1_en: 'Multiply once more: by itself, then by itself again. That is the cube, and it keeps the sign. A day below stays minus. A day above stays plus.'
  s1_zh: 再多乘一次：乘以自己，再乘以自己。这就是立方，它会保住正负号。低于平均数的一天还是负的，高于的还是正的。
  s1_zh_hk: 再乘多一次：乘自己，再乘自己。呢個就係立方，佢會保住正負號。低過平均數嘅一日仲係負，高過嘅仲係正。
  s2_en: 'Shop A: 48 cubed is 110,592, one plus and one minus. 36 cubed is 46,656, again one plus and one minus. Shop B: 60 cubed is 216,000, one plus and one minus.'
  s2_zh: A店：48的立方是110,592，一正一负。36的立方是46,656，也是一正一负。B店：60的立方是216,000，一正一负。
  s2_zh_hk: A店：48嘅立方係110,592，一正一負。36嘅立方係46,656，都係一正一負。B店：60嘅立方係216,000，一正一負。
  s3_en: 'Every plus has a matching minus, so each shop''s cubes add to zero. That number is the skewness, and here it is zero for both. Neither shop leans high or low. Three facts now match: the average, the variance and the skewness. So where is the difference?'
  s3_zh: 每个正的都有一个对应的负的，所以两家店的立方加起来都是零。这个数就是偏度，这里两家都是零。两家都不偏高，也不偏低。现在三个事实都一样：平均数、方差和偏度。那差别在哪里？
  s3_zh_hk: 每個正數都有一個對應嘅負數，所以兩間店嘅立方加埋都係零。呢個數就係偏度，呢度兩間都係零。兩間都唔偏高，亦唔偏低。而家三個事實都一樣：平均數、方差同偏度。咁分別喺邊？
- id: why_fourth
  visual: steps
  layout: rows
  seconds: 54
  kicker: Why the Fourth
  kicker_en: Why the Fourth
  kicker_zh: 为什么要四次方
  kicker_zh_hk: 點解要四次方
  title_en: Four of the same, multiplied
  title_zh: 四个相同的数相乘
  title_zh_hk: 四個相同嘅數相乘
  step1_en: 2 × 2 × 2 × 2 = 16
  step1_zh: 2 × 2 × 2 × 2 = 16
  step1_zh_hk: 2 × 2 × 2 × 2 = 16
  step2_en: −2 × −2 × −2 × −2 = 16
  step2_zh: −2 × −2 × −2 × −2 = 16
  step2_zh_hk: −2 × −2 × −2 × −2 = 16
  step3_en: 4 × 4 × 4 × 4 = 256
  step3_zh: 4 × 4 × 4 × 4 = 256
  step3_zh_hk: 4 × 4 × 4 × 4 = 256
  s1_en: 'The difference is in the far days, so we need a step that makes far days count more. Take a tiny example. 2 times 2 times 2 times 2 is 16. Four copies of the same number, multiplied: that is the fourth power.'
  s1_zh: 差别在远的那几天，所以我们需要一步，让远的日子算得更重。先看一个小例子。2乘2乘2乘2等于16。四个相同的数乘在一起，这就是四次方。
  s1_zh_hk: 分別喺遠嗰幾日，所以我哋需要一步，令遠嘅日子計得重啲。先睇一個細例子。2乘2乘2乘2等於16。四個相同嘅數乘埋一齊，呢個就係四次方。
  s2_en: Minus 2, four times, is also 16. The minuses pair up and cancel, just as in the variance. So a day below and a day above count the same.
  s2_zh: 负2乘四次，也是16。负号两两配对抵消，和方差一样。所以低于和高于平均数的一天，算得一样。
  s2_zh_hk: 負2乘四次，都係16。負號兩兩配對抵銷，同方差一樣。所以低過同高過平均數嘅一日，計得一樣。
  s3_en: Now 4. It is only twice as far as 2, but 4 to the fourth is 256, sixteen times 16. Double the distance, and the fourth power grows sixteen times. Far days weigh much more. So what does that do to Shop B's far days?
  s3_zh: 再看4。它只是2的两倍远，可是4的四次方是256，是16的十六倍。距离加倍，四次方变成十六倍。远的日子重得多。那这对B店那两天远的日子有什么影响？
  s3_zh_hk: 再睇4。佢只係2嘅兩倍咁遠，但係4嘅四次方係256，係16嘅十六倍。距離加倍，四次方變十六倍。遠嘅日子重好多。咁對B店嗰兩個遠嘅日子有咩影響？
