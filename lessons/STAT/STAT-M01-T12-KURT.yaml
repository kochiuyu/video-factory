id: STAT-M01-T12-KURT
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 668
title_en: What is kurtosis?
title_zh: 什么是峰度？
title_zh_hk: 咩係峰度？
objective_en: Compare two shops that match on the average, the variance, and the skewness, use the fourth power of the distances to see which shop has the higher kurtosis, and explain why that number alone cannot set the reserve.
objective_zh: 比较两家平均数、方差和偏度都相同的门店，用距离的四次方看出哪家峰度更高，并说明这个数本身不能定储备。
objective_zh_hk: 比較兩間平均數、方差同偏度都相同嘅門店，用距離嘅四次方睇出邊間峰度更高，並說明呢個數本身唔可以定儲備。
