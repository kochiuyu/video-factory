  footer_en: Both totals = 500
  footer_zh: 两家合计都是 500
  footer_zh_hk: 兩間合計都係 500
  s1_en: 'Here are the five days behind that reserve, in cups sold. Shop A: Day 1 sold 52. Day 2 sold 64. Day 3 sold 100. Day 4 sold 136. Day 5 sold 148.'
  s1_zh: 这就是那份储备背后的五天，单位是卖出的杯数。A店：第1天卖了52杯，第2天64杯，第3天100杯，第4天136杯，第5天148杯。
  s1_zh_hk: 呢個就係嗰份儲備背後嘅五日，單位係賣出嘅杯數。A店：第1日賣咗52杯，第2日64杯，第3日100杯，第4日136杯，第5日148杯。
  s2_en: Those five add to 500, so the average is 100. The days step out evenly on both sides, from 52 up to 148.
  s2_zh: 这五天加起来是500，所以平均数是100。每天在两边均匀地散开，从52到148。
  s2_zh_hk: 呢五日加埋係500，所以平均數係100。每日喺兩邊平均噉散開，由52到148。
  s3_en: Shop B sold 40, 100, 100, 100, and 160. Same total, same average. Three days sit exactly on 100. Two days sit far out, at 40 and 160. So does one reserve near 100 suit both shops?
  s3_zh: B店卖了40、100、100、100和160杯。总数一样，平均数一样。三天刚好是100。两天离得很远，在40和160。那一份靠近100的储备，两家都合适吗？
  s3_zh_hk: B店賣咗40、100、100、100同160杯。總數一樣，平均數一樣。三日啱啱係100。兩日離得好遠，喺40同160。咁一份靠近100嘅儲備，兩間都啱用嗎？
- id: plans
  visual: two_column
  seconds: 54
  kicker: The Plans
  kicker_en: The Plans
  kicker_zh: 两套储备
  kicker_zh_hk: 兩套儲備
  title_en: One reserve. Not the same risk.
  title_zh: 一份储备，风险不同
  title_zh_hk: 一份儲備，風險唔同
  left_en: 'A: 4 misses of 36–48'
  left_zh: A：四天差36–48杯
  left_zh_hk: A：四日差36–48杯
  right_en: 'B: 2 misses of 60'
  right_zh: B：两天差60杯
  right_zh_hk: B：兩日差60杯
  s1_en: Not quite. The averages match, but the misses do not. Set a reserve near 100 at each shop, and look at how far off it is each day.
  s1_zh: 不完全合适。平均数一样，差的样子却不一样。在两家都定靠近100的储备，看看每天差多少。
  s1_zh_hk: 唔完全啱。平均數一樣，差嘅樣就唔一樣。喺兩間都定靠近100嘅儲備，睇吓每日差幾多。
  s2_en: At Shop A, it is off on four of the five days, by 36 or 48 cups. The misses are moderate, and they come often. A steady daily buffer can cover most of them.
  s2_zh: 在A店，五天里有四天会差，差36或48杯。差得不算多，但常常发生。一个每天固定的缓冲，可以盖住大部分。
  s2_zh_hk: 喺A店，五日入面有四日會差，差36或者48杯。差得唔算多，但係成日發生。一個每日固定嘅緩衝，可以蓋住大部分。
  s3_en: At Shop B, it is spot on for three days. But on two days it is off by 60, once short and once over. Rare, big misses. A buffer sized for ordinary days fails exactly then. Same average, different risk, different reserves. Can the average, or the spread, tell the two shops apart?
  s3_zh: 在B店，有三天刚刚好。可是有两天差60杯，一次不够，一次太多。少见，但差很大。按普通日子定的缓冲，正好在那两天撑不住。平均相同，风险不同，储备也不同。平均数或者分散，能不能把两家店分开？
  s3_zh_hk: 喺B店，有三日啱啱好。但係有兩日差60杯，一次唔夠，一次太多。少見，但差好大。照普通日子定嘅緩衝，就喺嗰兩日撐唔住。平均相同，風險唔同，儲備都唔同。平均數或者分散，可唔可以分得開兩間店？
- id: average
  visual: definition_card
  seconds: 30
  kicker: The Average
  kicker_en: The Average
  kicker_zh: 平均数
  kicker_zh_hk: 平均數
  title_en: First, the equal share
  title_zh: 先算平均份额
  title_zh_hk: 先計平均份額
  formula: 'Average = total / number of days

    500 / 5 = 100'
  formula_zh: '平均数 = 合计 / 天数

    500 / 5 = 100'
  formula_zh_hk: '平均數 = 合計 / 日數

    500 / 5 = 100'
  s1_en: Start with the average, the 100 behind the reserve. Each shop sold 500 cups over the five days. The average is the total shared equally. 500 divided by 5 is 100 cups a day.
  s1_zh: 先看平均数，就是储备背后的那个100。每家店五天一共卖了500杯。平均数就是把总数平均分。500除以5，等于每天100杯。
  s1_zh_hk: 先睇平均數，即係儲備背後嗰個100。每間店五日一共賣咗500杯。平均數就係將總數平均分。500除5，等於每日100杯。
  s2_en: Both shops get exactly the same 100, so the average cannot split them. It is one reference point. So how far does each day sit from it?
  s2_zh: 两家店得到的都是100，所以平均数分不开它们。它只是一个参照点。那每一天离它有多远？
  s2_zh_hk: 兩間店得到嘅都係100，所以平均數分唔開佢哋。佢只係一個參照點。咁每一日離佢有幾遠？
- id: distance
  visual: dev_bars
  seconds: 56
  kicker: How Far
  kicker_en: How Far
  kicker_zh: 有多远
  kicker_zh_hk: 有幾遠
  title_en: Each day minus 100
  title_zh: 每天减去100
  title_zh_hk: 每日減100
  values: 52;64;100;136;148
  values_b: 40;100;100;100;160
  mean: 100
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  mark: none
  name_a_en: Shop A
  name_a_zh: A店
  name_a_zh_hk: A店
  name_b_en: Shop B
  name_b_zh: B店
  name_b_zh_hk: B店
  footer_en: 'Each shop: the gaps add to 0'
  footer_zh: 两家店：距离加起来都是 0
  footer_zh_hk: 兩間店：距離加埋都係 0
  s1_en: Put each day of both shops beside the 100 line. Shop A's days spread out on both sides of it. Shop B has three days right on the line, and two days far away, one below and one above.
  s1_zh: 把两家店的每一天放在100这条线旁边。A店的日子散在线的两边。B店有三天刚好在线上，还有两天离得很远，一天在下面，一天在上面。
  s1_zh_hk: 將兩間店嘅每一日放喺100呢條線旁邊。A店嘅日子散喺條線兩邊。B店有三日啱啱喺線上，仲有兩日離得好遠，一日喺下面，一日喺上面。
  s2_en: 'Now measure each gap: the day minus 100. Shop A is minus 48, minus 36, zero, plus 36, and plus 48. Shop B is minus 60, zero, zero, zero, and plus 60. A minus means below the average. A plus means above.'
  s2_zh: 现在量每一个距离：那天减去100。A店是负48、负36、零、正36、正48。B店是负60、零、零、零、正60。负号表示低于平均数，正号表示高于平均数。
  s2_zh_hk: 而家量每一個距離：嗰日減100。A店係負48、負36、零、正36、正48。B店係負60、零、零、零、正60。負號表示低過平均數，正號表示高過平均數。
  s3_en: These signed gaps are called deviations. Add them up for either shop and you get zero, because the minuses cancel the pluses. They always cancel around the average. So how do we measure the swing without the cancelling?
  s3_zh: 这些带正负号的距离叫作偏差。哪一家店加起来都是零，因为负的抵消了正的。在平均数周围，它们总是互相抵消。那怎样量起伏，又不让它们抵消？
  s3_zh_hk: 呢啲帶正負號嘅距離叫做偏差。邊間店加埋都係零，因為負嘅抵銷咗正嘅。喺平均數周圍，佢哋一定會互相抵銷。咁點樣量起跌，又唔畀佢哋抵銷？
- id: squares
  visual: dev_bars
  seconds: 48
  kicker: The Spread
  kicker_en: The Spread
  kicker_zh: 分散
  kicker_zh_hk: 分散
  title_en: 'Times itself: the same spread'
  title_zh: 乘以自己：分散一样
  title_zh_hk: 乘自己：分散一樣
  values: 52;64;100;136;148
  values_b: 40;100;100;100;160
  mean: 100
  power: 2
  labels_en: Day 1;Day 2;Day 3;Day 4;Day 5
  labels_zh: 第1天;第2天;第3天;第4天;第5天
  labels_zh_hk: 第1日;第2日;第3日;第4日;第5日
  mark: none
  name_a_en: Shop A
  name_a_zh: A店
  name_a_zh_hk: A店
  name_b_en: Shop B
  name_b_zh: B店
  name_b_zh_hk: B店
  footer_en: 'Each shop: 7,200 / 5 = 1,440'
  footer_zh: 两家店：7,200 / 5 = 1,440
  footer_zh_hk: 兩間店：7,200 / 5 = 1,440
  s1_en: Multiply each deviation by itself. A minus times a minus is a plus, so nothing cancels. Every result is positive.
  s1_zh: 把每个偏差乘以自己。负乘负得正，所以不会抵消。每个结果都是正的。
  s1_zh_hk: 將每個偏差乘自己。負乘負得正，所以唔會抵銷。每個結果都係正數。
  s2_en: 'Shop A: 48 times 48 is 2,304, on both sides, and 36 times 36 is 1,296, on both sides. Shop B: 60 times 60 is 3,600, twice, and the three days on 100 give zero.'
  s2_zh: A店：48乘48是2,304，两边各一个；36乘36是1,296，也是两边各一个。B店：60乘60是3,600，有两次；刚好在100的三天是零。
  s2_zh_hk: A店：48乘48係2,304，兩邊各一個；36乘36係1,296，都係兩邊各一個。B店：60乘60係3,600，有兩次；啱啱喺100嘅三日係零。
  s3_en: Each shop adds to 7,200. Share it over 5 days and you get 1,440 square cups, square because we multiplied cups by cups. That is the variance, and it is the same for both shops. So the spread cannot split them. Does the lean?
  s3_zh: 每家店加起来都是7,200。平分到5天，就是1,440平方杯；叫平方，是因为我们把杯乘了杯。这就是方差，两家店一样。所以分散分不开它们。那偏向呢？
  s3_zh_hk: 每間店加埋都係7,200。平分落5日，就係1,440平方杯；叫平方，係因為我哋將杯乘咗杯。呢個就係方差，兩間店一樣。所以分散分唔開佢哋。咁偏向呢？
