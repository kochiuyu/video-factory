- id: hook
  visual: title_card
  seconds: 54
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is kurtosis?
  title_zh: 什么是峰度？
  title_zh_hk: 咩係峰度？
  en: "Imagine you manage two coffee shops. You set one reserve for both. Both averaged 100 cups a day over five weekdays. One reserve near 100 looks right for both. It may not be. One shop's days stay in a band. The other's days are ordinary, or far from 100. A far day can empty the shelf, or leave cups to throw out. Which shop needs a different reserve? The number that answers that is called kurtosis. What is kurtosis?"
  zh: "假设你管着两家咖啡店。你给两家定同一份储备。五个工作日里，两家平均每天都卖100杯。一份靠近100的储备看起来两家都合适。它可能不是。一家店的每天停在一个区间里。另一家是普通的一天，或者远离100。远的那天可能卖完，也可能剩下杯子要倒掉。哪家店需要另一份储备？回答这个问题的数叫作峰度。什么是峰度？"
  zh_hk: "假設你管緊兩間咖啡店。你畀兩間定同一份儲備。五個平日入面，兩間平均每日都賣100杯。一份靠近100嘅儲備睇落兩間都合適。佢可能唔係。一間店嘅每日停喺一個區間入面。另一間係普通嘅一日，或者遠離100。遠嗰日可能賣晒，亦可能剩低杯要倒走。邊間店需要另一份儲備？回答呢個問題嘅數叫做峰度。咩係峰度？"
