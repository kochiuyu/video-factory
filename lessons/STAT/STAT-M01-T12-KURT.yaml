  kicker: Against the Spread
  kicker_en: Against the Spread
  kicker_zh: 和分散比
  kicker_zh_hk: 同分散比
  title_en: One far day, against the spread
  title_zh: 一个远的日子，和分散比
  title_zh_hk: 一個遠嘅日子，同分散比
  step1_en: 60 × 60 = 3,600
  step1_zh: 60 × 60 = 3,600
  step1_zh_hk: 60 × 60 = 3,600
  step2_en: 3,600 / 1,440 = 2.5
  step2_zh: 3,600 / 1,440 = 2.5
  step2_zh_hk: 3,600 / 1,440 = 2.5
  step3_en: 2.5 × 2.5 = 6.25
  step3_zh: 2.5 × 2.5 = 6.25
  step3_zh_hk: 2.5 × 2.5 = 6.25
  s1_en: Take Shop B's far day at 160. It sits 60 cups from the average, and 60 times 60 is 3,600 square cups.
  s1_zh: 看B店160那天。它离平均数60杯，60乘60是3,600平方杯。
  s1_zh_hk: 睇B店160嗰日。佢離平均數60杯，60乘60係3,600平方杯。
  s2_en: 'Compare that with the variance, 1,440 square cups, the typical squared swing. 3,600 divided by 1,440 is 2.5. The cups cancel, so 2.5 is a plain number: in squared terms, this day swings two and a half times the typical amount.'
  s2_zh: 把它和方差比较，方差是1,440平方杯，就是典型的平方起伏。3,600除以1,440等于2.5。杯的单位约掉了，所以2.5是一个普通的数：按平方算，这一天的起伏是典型的两倍半。
  s2_zh_hk: 將佢同方差比較，方差係1,440平方杯，即係典型嘅平方起跌。3,600除1,440等於2.5。杯嘅單位約咗，所以2.5係一個普通嘅數：用平方計，呢日嘅起跌係典型嘅兩倍半。
  s3_en: 'Multiply that by itself: 2.5 times 2.5 is 6.25. That is the far day''s fourth power, measured against the spread. It equals 60 to the fourth divided by 1,440 times 1,440, without the huge numbers. Now do it for every day.'
  s3_zh: 再乘以自己：2.5乘2.5等于6.25。这就是那一天的四次方，用分散来量。它等于60的四次方除以1,440乘1,440，只是不用算那么大的数。现在每一天都这样做。
  s3_zh_hk: 再乘自己：2.5乘2.5等於6.25。呢個就係嗰日嘅四次方，用分散嚟量。佢等於60嘅四次方除以1,440乘1,440，只係唔使計咁大嘅數。而家每一日都咁做。
