  footer_zh: A 6.74 / 5 ≈ 1.3 · B 12.5 / 5 = 2.5
  footer_zh_hk: A 6.74 / 5 ≈ 1.3 · B 12.5 / 5 = 2.5
  s1_en: Do the same for every day of both shops. Square the gap, divide by the variance, 1,440, then multiply the result by itself.
  s1_zh: 两家店的每一天都这样做。距离平方，除以方差1,440，再把结果乘以自己。
  s1_zh_hk: 兩間店嘅每一日都咁做。距離平方，除以方差1,440，再將結果乘自己。
  s2_en: 'Shop B: the two far days give 6.25 each, and the three days on 100 give zero. Shop A: the days 48 away give 2.56 each, and the days 36 away give 0.81 each. B''s two far days tower over A''s whole band.'
  s2_zh: B店：两天远的日子各是6.25，刚好在100的三天是零。A店：离48的两天各是2.56，离36的两天各是0.81。B店那两天，远远高过A店整个区间。
  s2_zh_hk: B店：兩個遠嘅日子各係6.25，啱啱喺100嘅三日係零。A店：離48嘅兩日各係2.56，離36嘅兩日各係0.81。B店嗰兩日，遠遠高過A店成個區間。
  s3_en: 'Now average the five, as we did for the variance. Shop B: 6.25 plus 6.25 is 12.5, divided by 5 is 2.5. Shop A: 2.56, 0.81, zero, 0.81 and 2.56 add to 6.74, divided by 5 is about 1.3. B is higher, and all of it comes from its two far days, the lonely ends of the line. Those far ends are called the tails. So what is this number called?'
  s3_zh: 现在把五个数平均，就像算方差一样。B店：6.25加6.25是12.5，除以5等于2.5。A店：2.56、0.81、零、0.81和2.56加起来是6.74，除以5大约是1.3。B店更高，而且全部来自那两天远的日子，也就是两端孤零零的地方。这些远远的两端叫作尾部。那这个数叫什么？
  s3_zh_hk: 而家將五個數平均，好似計方差咁。B店：6.25加6.25係12.5，除5等於2.5。A店：2.56、0.81、零、0.81同2.56加埋係6.74，除5大約係1.3。B店高啲，而且全部嚟自嗰兩個遠嘅日子，即係兩端孤零零嘅位置。呢啲遠遠嘅兩端叫做尾部。咁呢個數叫咩？
- id: name_kurt
  visual: title_card
  seconds: 42
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Kurtosis
  title_zh: 峰度
  title_zh_hk: 峰度
  en: 'Kurtosis. That is the name for this number. It measures how heavy the tails are, how much the far days weigh, after the average, the variance and the skewness have already matched. Shop B, with two lonely far days, is 2.5. Shop A, whose days step out evenly, is about 1.3. Higher means heavier tails. Myth: peakedness. The weight is in the tails: B''s whole number comes from its two far days. So how do we write it for any group of days?'
  zh: 峰度。这就是这个数的名字。它量的是尾部有多重，也就是远的日子有多重，而且是在平均数、方差和偏度都已经一样之后。B店有两天孤零零的远日子，是2.5。A店的日子均匀散开，大约是1.3。越高，尾部越重。别说成尖峰——看尾部：B店整个数都来自那两天远的日子。那任何一组日子，要怎样写出来？
  zh_hk: 峰度。呢個就係呢個數嘅名。佢量嘅係尾部有幾重，即係遠嘅日子有幾重，而且係喺平均數、方差同偏度都已經一樣之後。B店有兩個孤零零嘅遠日子，係2.5。A店嘅日子平均噉散開，大約係1.3。越高，尾部越重。唔好話成尖峰——睇尾部：B店成個數都嚟自嗰兩個遠日子。咁任何一組日子，要點樣寫出嚟？
- id: defn
  visual: definition_card
  seconds: 50
  kicker: The Definition
  kicker_en: The Definition
  kicker_zh: 定义
  kicker_zh_hk: 定義
  title_en: Kurtosis, written down
  title_zh: 峰度，写成公式
  title_zh_hk: 峰度，寫成公式
  formula: Kurtosis = (Σ(x − μ)⁴ / n) / σ⁴
  formula_zh: 峰度 = (Σ(x − μ)⁴ / n) / σ⁴
  formula_zh_hk: 峰度 = (Σ(x − μ)⁴ / n) / σ⁴
  formula_tex: \dfrac{\sum (x_i - \mu)^4 / n}{\sigma^4}
  gloss: Higher means heavier tails
  gloss_zh: 越高，尾部越重
  gloss_zh_hk: 越高，尾部越重
  s1_en: Here are the same steps in symbols. x is each day and mu is the average, so x minus mu is the deviation. Raise each one to the fourth power. The big sigma means add them all. Divide by n, the number of days, as we did for the variance.
  s1_zh: 这就是同样的步骤，用符号写出来。x 是每一天，mu 是平均数，所以 x 减 mu 就是偏差。把每个偏差四次方。大写的西格玛表示全部加起来。再除以 n，就是天数，和算方差一样。
  s1_zh_hk: 呢個就係同樣嘅步驟，用符號寫出嚟。x 係每一日，mu 係平均數，所以 x 減 mu 就係偏差。將每個偏差四次方。大寫嘅西格瑪表示全部加埋。再除以 n，即係日數，同計方差一樣。
  s2_en: 'Then divide by small sigma to the fourth. Sigma squared is the variance, so sigma to the fourth is just the variance times itself, 1,440 times 1,440. Dividing each day first, as we did, gives the same answer: about 1.3 for Shop A and 2.5 for Shop B. So how do you know whether 2.5 is high?'
  s2_zh: 然后除以小写西格玛的四次方。西格玛的平方就是方差，所以西格玛的四次方就是方差乘方差，1,440乘1,440。像我们刚才那样先逐天除，答案一样：A店大约1.3，B店2.5。那怎么知道2.5算不算高？
  s2_zh_hk: 跟住除以細楷西格瑪嘅四次方。西格瑪嘅平方就係方差，所以西格瑪嘅四次方就係方差乘方差，1,440乘1,440。好似我哋頭先咁逐日先除，答案一樣：A店大約1.3，B店2.5。咁點知2.5算唔算高？
- id: benchmark
  visual: steps
  layout: rows
  seconds: 56
  kicker: The Benchmark
  kicker_en: The Benchmark
  kicker_zh: 基准
  kicker_zh_hk: 基準
  title_en: Compared with a bell curve
  title_zh: 和钟形曲线比
  title_zh_hk: 同鐘形曲線比
  step1_en: 'Bell curve (Normal): 3'
  step1_zh: 钟形曲线（正态）：3
  step1_zh_hk: 鐘形曲線（正態）：3
  step2_en: Excess kurtosis = kurtosis − 3
  step2_zh: 超额峰度 = 峰度 − 3
  step2_zh_hk: 超額峰度 = 峰度 − 3
  step3_en: 'A ≈ 1.3, B = 2.5: compare the shops'
  step3_zh: A ≈ 1.3，B = 2.5：两店相比
  step3_zh_hk: A ≈ 1.3，B = 2.5：兩店相比
  s1_en: 'Textbooks compare it with a reference shape: the smooth, bell-shaped curve called the Normal distribution. For a Normal, kurtosis is 3. Above 3 means heavier tails than the bell. Below 3 means lighter tails.'
  s1_zh: 课本会拿一个参照的形状来比：一条平滑的钟形曲线，叫作正态分布。正态分布的峰度是3。高于3，尾部比钟形更重；低于3，尾部比钟形更轻。
  s1_zh_hk: 課本會攞一個參照嘅形狀嚟比：一條平滑嘅鐘形曲線，叫做正態分布。正態分布嘅峰度係3。高過3，尾部比鐘形重；低過3，尾部比鐘形輕。
  s2_en: 'Careful: some software subtracts 3 and reports excess kurtosis, so a bell curve reads zero. The number we computed is the raw kurtosis, before subtracting. Check which one you are reading before you compare.'
  s2_zh: 要小心：有些软件会减去3，报的是超额峰度，所以钟形曲线读成零。我们算的是原始峰度，还没减。比较之前，先看清楚读的是哪一种。
  s2_zh_hk: 要小心：有啲軟件會減3，報嘅係超額峰度，所以鐘形曲線讀成零。我哋計嘅係原始峰度，未減。比較之前，先睇清楚讀緊邊一種。
  s3_en: 'Both our shops sit below 3. With only five days, a comparison with a smooth curve says little. The useful comparison here is between the two shops: B is higher than A, because of its two far days. So what can this number tell a manager, and what can it not?'
  s3_zh: 我们两家店都低于3。只有五天，和一条平滑曲线比，说明不了多少。这里有用的是两家店互相比：B店比A店高，因为有那两天远的日子。那这个数能告诉经理什么，又不能告诉什么？
  s3_zh_hk: 我哋兩間店都低過3。得五日，同一條平滑曲線比，講唔到幾多嘢。呢度有用嘅係兩間店互相比：B店比A店高，因為有嗰兩個遠嘅日子。咁呢個數可以話經理知啲咩，又唔可以話佢知啲咩？
- id: limit
  visual: two_column
  seconds: 64
  kicker: The Limit
  kicker_en: The Limit
  kicker_zh: 限度
  kicker_zh_hk: 限度
  title_en: A reason to check, not an order
  title_zh: 是检查的理由，不是指令
  title_zh_hk: 係檢查嘅理由，唔係指令
  left_en: 'Tells: how heavy the tails'
  left_zh: 能说：尾部有多重
  left_zh_hk: 講到：尾部有幾重
  right_en: 'Not: how many cups to hold'
  right_zh: 不能说：要留几杯
  right_zh_hk: 講唔到：要留幾多杯
  s1_en: 'What it tells you: how heavy the tails are, using every day. The fourth power makes a far day weigh much more than it did in the variance. So even when the average, the variance and the skewness all match, it shows that Shop B''s risk sits in a few far days.'
  s1_zh: 它能告诉你：尾部有多重，而且用到每一天。四次方让远的日子比在方差里重得多。所以即使平均数、方差和偏度都一样，它也显示B店的风险集中在少数几天远的日子。
  s1_zh_hk: 佢話到你知：尾部有幾重，而且用到每一日。四次方令遠嘅日子比喺方差入面重好多。所以就算平均數、方差同偏度都一樣，佢都顯示到B店嘅風險集中喺少數幾個遠嘅日子。
  s2_en: 'What it does not tell you: how many cups to hold. It has no cups left in it, so 2.5 is not an order to hold 2.5 extra cups. It does not say whether a far day is a rush or a quiet day either. The days do.'
  s2_zh: 它不能告诉你：要留多少杯。它里面已经没有杯了，所以2.5不是叫你多留2.5杯。它也不说远的那天是忙还是淡，要看日子本身。
  s2_zh_hk: 佢講唔到：要留幾多杯。佢入面已經冇杯，所以2.5唔係叫你多留2.5杯。佢亦唔講遠嗰日係旺定淡，要睇啲日子本身。
  s3_en: And with only five days, one unusual day can move it a lot. Two different sets of days can even give the same number. So keep the five days in view. Then which shop needs a different reserve?
  s3_zh: 而且只有五天，一个特别的日子就能让它变很多。两组不同的日子，甚至可能算出同一个数。所以要一直看着那五天。那到底哪家店需要另一份储备？
  s3_zh_hk: 而且得五日，一個特別嘅日子就可以令佢變好多。兩組唔同嘅日子，甚至可能計出同一個數。所以要一直睇住嗰五日。咁究竟邊間店需要另一份儲備？
- id: answer
  visual: takeaway
  seconds: 70
  kicker: The Answer
  kicker_en: The Answer
  kicker_zh: 回答问题
  kicker_zh_hk: 回答問題
  title_en: Same facts. Different reserves.
  title_zh: 事实相同，储备不同
  title_zh_hk: 事實相同，儲備唔同
  q1_en: Which shop needs a different reserve?
  q1_zh: 哪家店需要另一份储备？
  q1_zh_hk: 邊間店需要另一份儲備？
  q2_en: What else before setting the reserve?
  q2_zh: 定储备之前，还要看什么？
  q2_zh_hk: 定儲備之前，仲要睇咩？
  s1_en: Back to the reserve. Same average, same variance, same zero skewness, but not the same tails. Shop A is about 1.3. Its misses are moderate, 36 or 48 cups, and they come on four of the five days. A steady daily buffer can cover most of them.
  s1_zh: 回到储备。平均数一样，方差一样，偏度都是零，可是尾部不一样。A店大约1.3。它差得不多，36或48杯，五天里有四天会差。每天固定的缓冲，可以盖住大部分。
  s1_zh_hk: 返到儲備。平均數一樣，方差一樣，偏度都係零，但係尾部唔一樣。A店大約1.3。佢差得唔多，36或者48杯，五日入面有四日會差。每日固定嘅緩衝，可以蓋住大部分。
  s2_en: Shop B is 2.5, heavier tails. It is spot on for three days, then off by 60 on two. Those rare far days are where its reserve fails. So Shop B is the one that needs a different reserve, planned for the far days, not the ordinary ones.
  s2_zh: B店是2.5，尾部更重。三天刚刚好，然后有两天差60杯。储备撑不住的，就是这些少见的远日子。所以需要另一份储备的是B店，要按远的日子来计划，不是按普通日子。
  s2_zh_hk: B店係2.5，尾部重啲。三日啱啱好，跟住有兩日差60杯。儲備撐唔住嘅，就係呢啲少見嘅遠日子。所以需要另一份儲備嘅係B店，要按遠嘅日子嚟計劃，唔係按普通日子。
  s3_en: Before you set it, check the cost of wasted cups, the cost of running out, how soon the shop can restock, and whether these five days will happen again. These numbers describe only the five days we supposed. The average, the variance, the skewness and the kurtosis each answer one question. None of them writes the reserve by itself.
  s3_zh: 定储备之前，还要看倒掉杯子的成本、卖完的成本、多久能补货，以及这五天会不会再发生。这些数只描述我们假设的五天。平均数、方差、偏度、峰度，各自回答一个问题，哪一个都不能单独写出储备。
  s3_zh_hk: 定儲備之前，仲要睇倒走杯嘅成本、賣晒嘅成本、幾耐可以補貨，同埋呢五日會唔會再發生。呢啲數只係描述我哋假設嘅五日。平均數、方差、偏度、峰度，各自答一個問題，邊一個都唔可以單獨寫出儲備。
