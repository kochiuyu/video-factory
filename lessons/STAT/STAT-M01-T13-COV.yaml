  s1_en: 'Here are five shops we will use. Shop A pays 10,000 in rent and sells 300 cups.
    Shop B: 12,000 and 330. Shop C: 13,000 and 360. Shop D: 16,000 and 400. Shop E: 19,000
    and 460.'
  s1_zh: 这是我们要用的五家店。A店月租10,000元，卖300杯。B店：12,000元和330杯。C店：13,000元和360杯。D店：16,000元和400杯。E店：19,000元和460杯。
  s1_zh_hk: 呢個係我哋要用嘅五間店。A店月租10,000蚊，賣300杯。B店：12,000蚊同330杯。C店：13,000蚊同360杯。D店：16,000蚊同400杯。E店：19,000蚊同460杯。
  s2_en: 'Add the rents: 10,000 plus 12,000 plus 13,000 plus 16,000 plus 19,000 is 70,000.
    Share that over five shops: the average rent is 14,000 dollars.'
  s2_zh: 把租金加起来：10,000加12,000加13,000加16,000加19,000，等于70,000。平分到五家店：平均租金是14,000元。
  s2_zh_hk: 將租金加埋：10,000加12,000加13,000加16,000加19,000，等於70,000。平分到五間店：平均租金係14,000蚊。
  s3_en: 'Add the cups: 300 plus 330 plus 360 plus 400 plus 460 is 1,850. Share that over
    five: the average is 370 cups. So how do you see whether a shop above average in rent
    is also above average in cups?'
  s3_zh: 把杯数加起来：300加330加360加400加460，等于1,850。平分到五家：平均是370杯。那怎样看出，租金高于平均的店，杯数是不是也高于平均？
  s3_zh_hk: 將杯數加埋：300加330加360加400加460，等於1,850。平分到五間：平均係370杯。咁點樣睇出，租金高過平均嘅店，杯數係咪都高過平均？
