  footer_zh_hk: 乘積 880,000 / 5 = 176,000
  s1_en: Put each shop on a plot. Rent runs left to right. Cups run up. Shop A sits low and
    left. Shop E sits high and right. The five points climb as you move right.
  s1_zh: 把每家店画在图上。租金从左到右。杯数往上。A店在左下。E店在右上。往右看，五个点一路往上。
  s1_zh_hk: 將每間店畫喺圖上。租金由左至右。杯數往上。A店喺左下。E店喺右上。望右邊，五個點一路向上。
  s2_en: 'Draw the average rent as a vertical line at 14,000, and the average cups as a horizontal
    line at 370. Those two lines cut the plot into four boxes. Top-right and bottom-left are
    the same-sign boxes: both above average, or both below. They get a plus. The other two
    boxes get a minus.'
  s2_zh: 在14,000画一条竖线表示平均租金，在370画一条横线表示平均杯数。这两条线把图切成四个格子。右上和左下是同号格：都高于平均，或者都低于平均。它们标正号。另外两格标负号。
  s2_zh_hk: 喺14,000畫一條直線表示平均租金，喺370畫一條橫線表示平均杯數。呢兩條線將圖切成四格。右上同左下係同號格：都高過平均，或者都低過平均。佢哋標正號。另外兩格標負號。
  s3_en: 'Every shop here sits in a plus box. For each shop, take rent minus 14,000, times
    cups minus 370. Shop A: minus 4,000 times minus 70 is plus 280,000. Shop E: plus 5,000
    times plus 90 is plus 450,000. All five products are positive. Add them: 880,000. What
    do you do with that total?'
  s3_zh: 这里每家店都落在正号格。对每家店，用租金减14,000，再乘杯数减370。A店：负4,000乘负70，得正280,000。E店：正5,000乘正90，得正450,000。五个乘积都是正的。加起来：880,000。这个总数接下来怎么用？
  s3_zh_hk: 呢度每間店都落喺正號格。對每間店，用租金減14,000，再乘杯數減370。A店：負4,000乘負70，得正280,000。E店：正5,000乘正90，得正450,000。五個乘積都係正。加埋：880,000。呢個總數跟住點用？
- id: walk
  visual: steps
  layout: rows
  seconds: 71
  kicker: Step by Step
  kicker_en: Step by Step
  kicker_zh: 一步一步
  kicker_zh_hk: 一步一步
  title_en: Share the products by five
  title_zh: 把乘积平分到五
  title_zh_hk: 將乘積平分到五
  step1_en: 880,000 / 5 = 176,000
  step1_zh: 880,000 / 5 = 176,000
  step1_zh_hk: 880,000 / 5 = 176,000
  step2_en: 'Unit: dollar-cups'
  step2_zh: 单位：元·杯
  step2_zh_hk: 單位：蚊·杯
  step3_en: 'Sign: positive'
  step3_zh: 符号：正
  step3_zh_hk: 符號：正
  s1_en: Share the 880,000 over the five shops. 880,000 divided by 5 is 176,000. The unit
    is dollars times cups, because rent was in dollars and sales in cups.
  s1_zh: 把880,000平分到五家店。880,000除以5，等于176,000。单位是元乘杯，因为租金用元，销量用杯。
  s1_zh_hk: 將880,000平分到五間店。880,000除5，等於176,000。單位係蚊乘杯，因為租金用蚊，銷量用杯。
  s2_en: That shared number is the covariance of rent and cups for these five shops. It is
    positive, so when rent sits above its average, cups tend to sit above theirs too.
  s2_zh: 这个平分后的数，就是这五家店租金和杯数的协方差。它是正的，所以租金高于自己的平均数时，杯数也常常高于自己的平均数。
  s2_zh_hk: 呢個平分後嘅數，就係呢五間店租金同杯數嘅協方差。佢係正數，所以租金高過自己平均數嗰陣，杯數都成日高過自己平均數。
  s3_en: We divided by n, the number of shops, because we are describing these five shops.
    Some courses divide by n minus 1 when the file is treated as a sample for estimation.
    Here we stay with n, the same choice as the variance short. So what do we call this number?
  s3_zh: 我们除以n，也就是店的家数，因为我们在描述这五家店。有的课在把文件当作估计用的样本时，会除以n减1。这里我们用n，和方差那一课一样。那这个数叫什么？
  s3_zh_hk: 我哋除以n，即係店嘅間數，因為我哋喺度描述呢五間店。有啲課當檔案係估計用嘅樣本嗰陣，會除以n減1。呢度我哋用n，同方差嗰課一樣。咁呢個數叫咩名？
- id: name_cov
  visual: title_card
  seconds: 32
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Covariance
  title_zh: 协方差
  title_zh_hk: 協方差
  en: This number is called the covariance. It asks whether two measures tend to sit on the
    same side of their own averages. A plus means same side. A minus means opposite sides.
  zh: 这个数叫作协方差。它问的是：两个量是不是常常落在各自平均数的同一侧。正号表示同一侧。负号表示相反的两侧。
  zh_hk: 呢個數叫做協方差。佢問嘅係：兩個量係咪成日落喺各自平均數嘅同一邊。正號表示同一邊。負號表示相反兩邊。
- id: formula
  visual: definition_card
  seconds: 43
  kicker: The Rule
  kicker_en: The Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Add the paired gaps, then share
  title_zh: 先加成对差距，再平分
  title_zh_hk: 先加成對差距，再平分
  formula_en: Cov = Σ[(x − μx)(y − μy)] / n
  formula_zh: 协方差 = Σ[(x − μx)(y − μy)] / n
  formula_zh_hk: 協方差 = Σ[(x − μx)(y − μy)] / n
  formula_tex: \mathrm{Cov}=\frac{\sum(x-\mu_x)(y-\mu_y)}{n}
  s1_en: 'In symbols: for each shop, subtract the average rent from that shop''s rent, subtract
    the average cups from that shop''s cups, and multiply the two gaps. Add those products,
    then divide by n.'
  s1_zh: 用符号写：对每家店，用租金减平均租金，用杯数减平均杯数，再把两个差距相乘。把这些乘积加起来，再除以n。
  s1_zh_hk: 用符號寫：對每間店，用租金減平均租金，用杯數減平均杯數，再將兩個差距相乘。將呢啲乘積加埋，再除以n。
  s2_en: Mu sub x is the average rent. Mu sub y is the average cups. n is the number of shops.
    The formula describes the file we have, so it divides by n.
  s2_zh: μₓ是平均租金。μᵧ是平均杯数。n是店的家数。这个公式描述我们手里的这份数据，所以除以n。
  s2_zh_hk: μₓ係平均租金。μᵧ係平均杯數。n係店嘅間數。呢條公式描述我哋手上面呢份數據，所以除以n。
- id: units
  visual: two_column
  seconds: 51
  kicker: The Units
  kicker_en: The Units
  kicker_zh: 单位
  kicker_zh_hk: 單位
  title_en: Same shops. New unit label.
  title_zh: 同样的店，换了单位标签
  title_zh_hk: 同樣嘅店，換咗單位標籤
  left_en: 'Dollars: 176,000'
  left_zh: 用元：176,000
  left_zh_hk: 用蚊：176,000
  right_en: 'Cents: 17,600,000'
  right_zh: 用分：17,600,000
  right_zh_hk: 用仙：17,600,000
  s1_en: The size of 176,000 depends on the units. Suppose we rewrite rent in cents instead
    of dollars. Each rent is 100 times larger.
  s1_zh: 176,000这个数的大小取决于单位。假设我们把租金改成用分，而不是元。每个租金都会变成原来的100倍。
  s1_zh_hk: 176,000呢個數嘅大細取決於單位。假設我哋將租金改成用仙，而唔係蚊。每個租金都會變成原來嘅100倍。
  s2_en: Every rent gap grows by 100, so every product grows by 100, and the covariance becomes
    17,600,000 cent-cups. The shops did not change. Only the unit label did.
  s2_zh: 每个租金差距变成100倍，所以每个乘积也变成100倍，协方差变成17,600,000分·杯。店没有变。变的只是单位标签。
  s2_zh_hk: 每個租金差距變成100倍，所以每個乘積都變成100倍，協方差變成17,600,000仙·杯。店冇變。變嘅淨係單位標籤。
  s3_en: So a bigger covariance number does not mean a stronger link. It can just mean you
    picked a smaller unit. What can the sign still tell you?
  s3_zh: 所以协方差的数更大，并不表示关系更强。它可能只是你选了更小的单位。那符号还能告诉你什么？
  s3_zh_hk: 所以協方差嘅數更大，並唔表示關係更強。佢可能淨係你揀咗更細嘅單位。咁符號仲可以話你知咩？
