id: STAT-M01-T13-COV
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 492
title_en: What is covariance?
title_zh: 什么是协方差？
title_zh_hk: 咩係協方差？
objective_en: Define covariance as the average of paired deviation products divided by n,
  read its sign as the direction of linear co-movement, show that its size depends on measurement
  units, and avoid treating covariance as strength or causation.
objective_zh: 把协方差定义为成对离差乘积之和除以n，用符号解释线性共同变动的方向，说明数值大小取决于计量单位，并避免把协方差当作关系强度或因果关系。
objective_zh_hk: 將協方差定義為成對偏差乘積之和除以n，用符號解釋線性共同變動嘅方向，說明數值大細取決於計量單位，並避免將協方差當成關係強度或者因果關係。
glossary:
- en: covariance
  zh: 协方差
  zh_hk: 協方差
  lock: true
- en: paired product
  zh: 成对乘积
  zh_hk: 成對乘積
  lock: true
quiz:
- id: Q1
  type: multiple_choice
  question_en: What does positive covariance between foot traffic and cup sales indicate?
  question_zh: 客流量与咖啡销量之间呈正协方差，表示什么？
  question_zh_hk: 人流量同咖啡銷量之間呈正協方差，表示咩？
  options_en:
  - 'A: Above-average traffic tends to pair with above-average sales, and below with below.'
  - 'B: Foot traffic and coffee sales are completely independent of each other.'
  - 'C: Positive covariance proves that raising rent will raise cup sales.'
  - 'D: Positive covariance means the two averages must be equal.'
  options_zh:
  - 'A: 高于平均的客流往往配上高于平均的销量，低于平均亦然。'
  - 'B: 客流量与咖啡销量之间完全独立，没有任何关联。'
  - 'C: 正协方差证明提高租金就会提高杯销量。'
  - 'D: 正协方差表示两个平均数必须相等。'
  options_zh_hk:
  - 'A: 高過平均嘅人流往往配上高過平均嘅銷量，低過平均亦然。'
  - 'B: 人流量同咖啡銷量之間完全獨立，冇任何關聯。'
  - 'C: 正協方差證明提高租金就會提高杯銷量。'
  - 'D: 正協方差表示兩個平均數必須相等。'
  answer: A
  explanation_en: Positive covariance results when paired deviations tend to share the same
    sign. It indicates same-direction linear co-movement. It does not prove that raising rent
    raises sales, and it does not require the two averages to be equal.
  explanation_zh: 当成对离差通常同号时，协方差为正。它表示同向的线性共同变动，并不证明提高租金就会提高销量，也不要求两个平均数相等。
  explanation_zh_hk: 當成對偏差通常同號嗰陣，協方差為正。佢表示同向嘅線性共同變動，並唔證明提高租金就會提高銷量，亦唔要求兩個平均數相等。
- id: Q2
  type: multiple_choice
  question_en: Why is raw covariance unable to tell a manager the actual strength of a relationship
    between two variables?
  question_zh: 为什么原始协方差无法直接告诉管理者两个变量之间关系的实际强弱？
  question_zh_hk: 點解原始協方差冇辦法直接話畀管理者知兩個變量之間關係嘅實際強弱？
  options_en:
  - 'A: Its size depends on the units, so big units can make a huge number without a stronger link.'
  - 'B: Covariance is always between −1 and +1, so size is already standardized.'
  - 'C: Covariance only works when both variables are percentages.'
  - 'D: A larger covariance always means a stronger business link, whatever the units.'
  options_zh:
  - 'A: 它的大小取决于单位，单位变大就会算出很大数字，但不代表关系更强。'
  - 'B: 协方差总是在−1到+1之间，所以大小本身已经标准化。'
  - 'C: 协方差只在两个变量都是百分比时才有效。'
  - 'D: 无论单位如何，较大的协方差总是表示更强的业务关联。'
  options_zh_hk:
  - 'A: 佢嘅大細取決於單位，單位變大就會計出好大數字，但唔代表關係更強。'
  - 'B: 協方差總係喺−1到+1之間，所以大細本身已經標準化。'
  - 'C: 協方差淨係喺兩個變量都係百分比嗰陣先有效。'
  - 'D: 無論單位點樣，較大嘅協方差總係表示更強嘅業務關聯。'
  answer: A
  explanation_en: Changing a variable from dollars to cents multiplies the covariance by 100
    even though the underlying relationship is unchanged. Raw magnitude therefore cannot be
    interpreted as standardized strength. Covariance is not bounded by −1 and +1, and it is not
    limited to percentages.
  explanation_zh: 把变量的单位从元改为分，会令协方差扩大100倍，但基础关系没有改变。因此，原始数值大小不能被解释为标准化的关系强度。协方差不受−1到+1限制，也不只适用于百分比。
  explanation_zh_hk: 將變量嘅單位由元改為分，會令協方差擴大100倍，但基礎關係冇改變。所以，原始數值大細唔可以被解釋為標準化嘅關係強度。協方差唔受−1到+1限制，亦唔淨係適用於百分比。
beats:
- id: hook
  visual: title_card
  seconds: 36
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is covariance?
  title_zh: 什么是协方差？
  title_zh_hk: 咩係協方差？
  en: Imagine you pick sites for coffee shops. For each site you know the monthly rent and
    how many cups that shop sells in a day. Some high-rent sites also sell a lot. Some cheap
    sites sell little. Do rent and sales tend to move together? Before you talk about strength
    or cause, you need a number for that joint movement. What is covariance?
  zh: 假设你在给咖啡店选址。每个地点你都知道月租，也知道这家店一天卖多少杯。有些高租金的地点卖得也多。有些便宜的地点卖得少。租金和销量是不是常常一起变动？在谈强弱或因果之前，你需要一个数来量这种一起动。什么是协方差？
  zh_hk: 假設你喺度幫咖啡店選址。每個地點你都知月租，亦都知呢間店一日賣幾多杯。有啲高租金嘅地點賣得都多。有啲平嘅地點賣得少。租金同銷量係咪成日一齊變動？喺傾強弱或者因果之前，你需要一個數嚟量呢種一齊郁。咩係協方差？
