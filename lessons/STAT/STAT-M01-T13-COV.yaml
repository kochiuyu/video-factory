id: STAT-M01-T13-COV
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Do they move together?
title_zh: 两个变量是否同向变动？
title_zh_hk: 兩個變量係咪同向變動？
objective_en: Define sample covariance as the sum of paired deviation products divided by n minus 1, interpret its sign as the direction of linear co-movement, explain why its magnitude depends on measurement units, and avoid treating covariance as evidence of strength or causation.
objective_zh: 把样本协方差定义为成对离差乘积之和除以n减1，把其符号解释为线性共同变动的方向，说明其数值大小为何取决于计量单位，并避免把协方差当作关系强度或因果关系的证据。
objective_zh_hk: 將樣本協方差定義為成對偏差乘積之和除以n減1，將佢嘅符號解釋為線性共同變動嘅方向，說明佢嘅數值大小點解取決於計量單位，並避免將協方差當成關係強度或者因果關係嘅證據。
