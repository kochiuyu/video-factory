  right_zh_hk: 大細：取決於單位
  s1_en: Read the sign for direction. Positive means the two measures tend to move together.
    Negative means they tend to move opposite ways.
  s1_zh: 用符号看方向。正号表示两个量倾向一起动。负号表示它们倾向反着动。
  s1_zh_hk: 用符號睇方向。正號表示兩個量傾向一齊郁。負號表示佢哋傾向反住郁。
  s2_en: Do not read the raw size as strength. The size carries the units. And do not read
    covariance as proof that higher rent causes higher sales. A busy street can push both
    up.
  s2_zh: 不要把原始大小当成强弱。大小带着单位。也不要把协方差当成高租金导致高销量的证明。一条热闹的街，可以同时推高两者。
  s2_zh_hk: 唔好將原始大細當成強弱。大細帶住單位。亦唔好將協方差當成高租金導致高銷量嘅證明。一條熱鬧嘅街，可以同時推高兩者。
  s3_en: So use covariance to read direction on a paired file, and stop before you claim strength
    or cause. What should a manager take away?
  s3_zh: 所以用协方差读成对文件的方向，到此为止，不要声称强弱或因果。经理应该带走什么？
  s3_zh_hk: 所以用協方差讀成對檔案嘅方向，到此為止，唔好聲稱強弱或者因果。經理應該帶走咩？
