  s1_en: >-
    Here are five shops on one file. Shop A: 10,000 dollars and 300 cups. Shop E: 19,000 and 460.
    Average rent 14,000. Average cups 370. The average of the paired gap products — the covariance —
    is 176,000 dollar-cups.
  s1_zh: 这里有五家店的同一份表。A店：10,000元和300杯。E店：19,000元和460杯。平均租金14,000。平均杯数370。成对差距乘积的平均——协方差——是176,000元·杯。
  s1_zh_hk: 呢度有五間店嘅同一份表。A店：10,000蚊同300杯。E店：19,000蚊同460杯。平均租金14,000。平均杯數370。成對差距乘積嘅平均——協方差——係176,000蚊·杯。
  s2_en: Direction is already clear and positive. To talk about strength, we need to strip the units out
    of that 176,000. How?
  s2_zh: 方向已经清楚，而且是正的。要谈强弱，需要把176,000里的单位去掉。怎么做？
  s2_zh_hk: 方向已經清楚，而且係正。要傾強弱，需要將176,000入面嘅單位去掉。點做？
