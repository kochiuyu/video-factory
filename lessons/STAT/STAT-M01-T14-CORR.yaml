  left_zh_hk: 用蚊：r ≈ +1.00
  right_en: 'Cents: r ≈ +1.00'
  right_zh: 用分：r ≈ +1.00
  right_zh_hk: 用仙：r ≈ +1.00
  s1_en: Rewrite rent in cents. Covariance jumps by 100, to 17,600,000. The rent standard deviation also
    jumps by 100.
  s1_zh: 把租金改成用分。协方差扩大100倍，变成17,600,000。租金的标准差也扩大100倍。
  s1_zh_hk: 將租金改成用仙。協方差擴大100倍，變成17,600,000。租金嘅標準差都擴大100倍。
  s2_en: In the correlation fraction, that 100 appears on top and on the bottom, so it cancels. r stays
    about +1.00.
  s2_zh: 在相关系数的分式里，这个100出现在上面也出现在下面，所以消掉了。r仍然约为+1.00。
  s2_zh_hk: 喺相關系數嘅分式入面，呢個100出現喺上面亦出現喺下面，所以消咗。r仍然約為+1.00。
  s3_en: That is the point of dividing by both spreads. Correlation lets you compare linear strength across
    files that started in different units.
  s3_zh: 这正是同时除掉两边分散的意义。相关系数让你可以比较一开始单位不同的文件上的线性强弱。
  s3_zh_hk: 呢個正係同時除掉兩邊分散嘅意義。相關系數等你可以比較一開始單位唔同嘅檔案上嘅線性強弱。
