  role_en: 'Confounder: busy streets raise both'
  role_zh: 混杂因素：热闹的街推高两者
  role_zh_hk: 混雜因素：熱鬧嘅街推高兩者
  s1_en: A strong r is a reason to investigate, not a reason to claim that raising rent will raise cup
    sales.
  s1_zh: 一个很强的r是值得调查的理由，不是声称提高租金就会提高杯销量的理由。
  s1_zh_hk: 一個好強嘅r係值得調查嘅理由，唔係聲稱提高租金就會提高杯銷量嘅理由。
  s2_en: Draw a third factor. Foot traffic can push rent up, because busy streets cost more, and push
    cups up, because more people pass the door.
  s2_zh: 画出第三个因素。客流量可以推高租金，因为热闹的街更贵；也可以推高杯数，因为更多人经过门口。
  s2_zh_hk: 畫出第三個因素。人流量可以推高租金，因為熱鬧嘅街更貴；亦可以推高杯數，因為更多人經過門口。
  s3_en: Then rent and cups move together in the file even if rent itself does not cause cups. Check the
    scatterplot, the story, and stronger designs before you claim cause.
  s3_zh: 这样在数据里租金和杯数会一起动，即使租金本身并不导致杯数。声称因果之前，要检查散点图、业务故事和更强的研究设计。
  s3_zh_hk: 咁樣喺數據入面租金同杯數會一齊郁，即使租金本身並唔導致杯數。聲稱因果之前，要檢查散點圖、業務故事同更強嘅研究設計。
