  title_en: Strength yes. Cause later.
  title_zh: 强弱可以谈，因果往后
  title_zh_hk: 強弱可以傾，因果往後
  q1_en: How strong is the linear link?
  q1_zh: 线性联系有多强？
  q1_zh_hk: 線性聯繫有幾強？
  q2_en: What must you still not claim?
  q2_zh: 你仍然不能声称什么？
  q2_zh_hk: 你仍然唔可以聲稱咩？
  s1_en: 'For these five shops, r is about +1.00: a very strong positive linear pattern on a unit-free
    scale from −1 to +1.'
  s1_zh: 对这五家店，r约为+1.00：在−1到+1的无单位尺度上，这是非常强的正向线性模式。
  s1_zh_hk: 對呢五間店，r約為+1.00：喺−1到+1嘅無單位尺度上，呢個係非常強嘅正向線性模式。
  s2_en: That strength reading survives a change from dollars to cents. Covariance alone did not.
  s2_zh: 这个强弱读数在从元换成分之后仍然成立。单靠协方差做不到。
  s2_zh_hk: 呢個強弱讀數喺由蚊換成仙之後仍然成立。單靠協方差做唔到。
  s3_en: 'The operating rule: use r for direction and linear strength, inspect the scatterplot, and do
    not treat correlation as proof of cause.'
  s3_zh: 经营规则：用r看方向和线性强弱，检查散点图，不要把相关当成因果的证明。
  s3_zh_hk: 營運規則：用r睇方向同線性強弱，檢查散點圖，唔好將相關當成因果嘅證明。
