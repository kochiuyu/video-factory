id: STAT-M01-T14-CORR
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: How strong is the linear connection?
title_zh: 线性关联到底有多紧密？
title_zh_hk: 線性關聯到底有幾緊密？
objective_en: Define Pearson correlation as covariance divided by the product of the two standard deviations, explain how standardization removes units and constrains r to the interval from minus one to plus one, interpret correlation as the direction and strength of linear association, and explain why correlation is a starting point for investigation rather than proof of causation.
objective_zh: 把皮尔逊相关系数定义为协方差除以两个变量标准差之积，解释标准化如何消除单位并把r限制在负一到正一之间，把相关系数解释为线性关联的方向与强度，并说明相关分析是进一步调查的起点，而不是因果关系的证明。
objective_zh_hk: 將皮爾遜相關系數定義為協方差除以兩個變量標準差之積，解釋標準化點樣消除單位並將r限制喺負一到正一之間，將相關系數解釋為線性關聯嘅方向同強度，並說明相關分析係進一步調查嘅起點，而唔係因果關係嘅證明。
