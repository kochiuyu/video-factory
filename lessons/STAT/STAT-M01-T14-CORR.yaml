  footer_zh_hk: 協方差 = 176,000 蚊·杯
  s1_en: Put the five shops on the plot again. As rent rises, cups rise. The points sit close to one climbing
    line.
  s1_zh: 再把五家店画在图上。租金越高，杯数越高。这些点贴近一条往上的线。
  s1_zh_hk: 再將五間店畫喺圖上。租金越高，杯數越高。呢啲點貼近一條向上嘅線。
  s2_en: The mean lines cross at 14,000 and 370. Every shop sits in a same-sign box, which is why the
    covariance was positive.
  s2_zh: 平均线交在14,000和370。每家店都落在同号格，所以协方差是正的。
  s2_zh_hk: 平均線交喺14,000同370。每間店都落喺同號格，所以協方差係正。
  s3_en: Closeness to a straight line is the strength question. Covariance alone cannot answer it, because
    its size still carries units. What do we divide by?
  s3_zh: 点有多贴近直线，才是强弱问题。单靠协方差答不了，因为它的大小还带着单位。我们该除以什么？
  s3_zh_hk: 點有幾貼近直線，先係強弱問題。單靠協方差答唔到，因為佢嘅大細仲帶住單位。我哋應該除以咩？
- id: sds
  visual: steps
  layout: rows
  seconds: 66
  kicker: Step by Step
  kicker_en: Step by Step
  kicker_zh: 一步一步
  kicker_zh_hk: 一步一步
  title_en: Two standard deviations
  title_zh: 两个标准差
  title_zh_hk: 兩個標準差
  step1_en: Rent SD ≈ 3,162
  step1_zh: 租金标准差 ≈ 3,162
  step1_zh_hk: 租金標準差 ≈ 3,162
  step2_en: Cups SD ≈ 55.9
  step2_zh: 杯数标准差 ≈ 55.9
  step2_zh_hk: 杯數標準差 ≈ 55.9
  step3_en: 3,162 × 55.9 ≈ 176,750
  step3_zh: 3,162 × 55.9 ≈ 176,750
  step3_zh_hk: 3,162 × 55.9 ≈ 176,750
  s1_en: 'First the rent spread. Share the squared rent gaps by five: 50,000,000 / 5 = 10,000,000. Take
    the square root: about 3,162 dollars. That is the rent standard deviation, with divide by n, matching
    the variance short.'
  s1_zh: 先看租金的分散。把租金差距的平方平分到五：50,000,000 / 5 = 10,000,000。开方：大约3,162元。这是租金的标准差，除以n，和方差那一课一致。
  s1_zh_hk: 先睇租金嘅分散。將租金差距嘅平方平分到五：50,000,000 / 5 = 10,000,000。開方：大約3,162蚊。呢個係租金嘅標準差，除以n，同方差嗰課一致。
  s2_en: 'Now the cups spread. Share the squared cup gaps by five: 15,600 / 5 = 3,120. Square root: about
    55.9 cups.'
  s2_zh: 再看杯数的分散。把杯数差距的平方平分到五：15,600 / 5 = 3,120。开方：大约55.9杯。
  s2_zh_hk: 再睇杯數嘅分散。將杯數差距嘅平方平分到五：15,600 / 5 = 3,120。開方：大約55.9杯。
  s3_en: 'Multiply the two standard deviations: 3,162 times 55.9 is about 176,750. That product carries
    the same dollar-cup units as the covariance. Ready to cancel them?'
  s3_zh: 把两个标准差相乘：3,162乘55.9，大约176,750。这个乘积带着和协方差一样的元·杯单位。可以用来消掉单位了吗？
  s3_zh_hk: 將兩個標準差相乘：3,162乘55.9，大約176,750。呢個乘積帶住同協方差一樣嘅蚊·杯單位。可以攞嚟消咗單位未？
