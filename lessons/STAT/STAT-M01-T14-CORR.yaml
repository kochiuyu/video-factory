- id: hook
  visual: title_card
  seconds: 36
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is correlation?
  title_zh: 什么是相关系数？
  title_zh_hk: 咩係相關系數？
  en: >-
    Suppose you pick sites for coffee shops. At five shops, rent and cups move together: when rent is
    above its average, cups tend to be above theirs too. The average of those paired gaps — the
    covariance — is 176,000 dollar-cups, a size that jumps if you rewrite dollars as cents. A manager
    asks how strong the linear link is on a scale that ignores units. What is correlation?
  zh: 假设你在为咖啡店选址。五家店的租金和杯数同向变动：租金高于平均时，杯数也往往高于平均。把这些成对差距乘起来再平均，得到协方差176,000元·杯——若改用分来计价，这个数会跳变。经理要问的是：这条线性联系有多强，而且尺度不该跟着单位变。什么是相关系数？
  zh_hk: 假設你喺為咖啡店選址。五間店嘅租金同杯數同向變動：租金高過平均嗰陣，杯數都往往高過平均。將呢啲成對差距乘起嚟再平均，得到協方差176,000蚊·杯——若改用仙嚟計價，呢個數會跳變。經理要問嘅係：呢條線性聯繫有幾強，而且尺度唔應該跟住單位變。咩係相關系數？
