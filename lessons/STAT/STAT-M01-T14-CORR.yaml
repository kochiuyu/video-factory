  visual: steps
  layout: rows
  seconds: 48
  kicker: Cancel the Units
  kicker_en: Cancel the Units
  kicker_zh: 消掉单位
  kicker_zh_hk: 消咗單位
  title_en: Covariance over the product
  title_zh: 协方差除以乘积
  title_zh_hk: 協方差除以乘積
  step1_en: 176,000 / 176,750
  step1_zh: 176,000 / 176,750
  step1_zh_hk: 176,000 / 176,750
  step2_en: r ≈ +0.996
  step2_zh: r ≈ +0.996
  step2_zh_hk: r ≈ +0.996
  step3_en: About +1.00
  step3_zh: 约为 +1.00
  step3_zh_hk: 約為 +1.00
  s1_en: Divide the covariance by that product. 176,000 / 176,750 is about +0.996.
  s1_zh: 用协方差除以那个乘积。176,000 / 176,750，大约是+0.996。
  s1_zh_hk: 用協方差除以嗰個乘積。176,000 / 176,750，大約係+0.996。
  s2_en: The dollar-cup units cancel. What remains is a plain number near plus one.
  s2_zh: 元·杯的单位消掉了。剩下的是一个接近正一的纯数字。
  s2_zh_hk: 蚊·杯嘅單位消咗。剩低嘅係一個接近正一嘅純數字。
  s3_en: For these five shops we can say r is about +1.00 — almost as strong a positive linear pattern
    as the scale allows. What do we call this number?
  s3_zh: 对这五家店，我们可以说r约为+1.00——在这个尺度上，正向线性模式几乎强到顶。这个数叫什么？
  s3_zh_hk: 對呢五間店，我哋可以講r約為+1.00——喺呢個尺度上，正向線性模式幾乎強到頂。呢個數叫咩名？
- id: name_corr
  visual: title_card
  seconds: 32
  kicker: The Name
  kicker_en: The Name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Correlation
  title_zh: 相关系数
  title_zh_hk: 相關系數
  en: This number is called the correlation, often written r. It keeps the direction from covariance and
    adds a unit-free reading of how tightly the points follow a straight line.
  zh: 这个数叫作相关系数，常写成r。它保留协方差的方向，并加上一个无单位的读数：点有多紧地贴着一条直线。
  zh_hk: 呢個數叫做相關系數，成日寫成r。佢保留協方差嘅方向，再加一個無單位嘅讀數：點有幾緊貼住一條直線。
- id: formula
  visual: definition_card
  seconds: 42
  kicker: The Rule
  kicker_en: The Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Divide out both spreads
  title_zh: 把两边的分散除掉
  title_zh_hk: 將兩邊嘅分散除掉
  formula_en: r = Cov(X, Y) / (SD_x × SD_y)
  formula_zh: r = 协方差 /（标准差ₓ × 标准差ᵧ）
  formula_zh_hk: r = 協方差 /（標準差ₓ × 標準差ᵧ）
  formula_tex: r = \frac{\mathrm{Cov}(X,Y)}{s_X s_Y}
  s1_en: Pearson correlation divides the covariance by the product of the two standard deviations. Use
    the same divide-by-n choice you used for covariance and variance in this module.
  s1_zh: 皮尔逊相关系数用协方差除以两个标准差的乘积。这里除以n的选择，和本模块协方差、方差那两课一致。
  s1_zh_hk: 皮爾遜相關系數用協方差除以兩個標準差嘅乘積。呢度除以n嘅選擇，同本模塊協方差、方差嗰兩課一致。
  s2_en: The result r has no units and sits between −1 and +1. The sign is direction. The distance from
    zero is linear strength.
  s2_zh: 得到的r没有单位，落在−1到+1之间。符号是方向。离零的距离是线性强弱。
  s2_zh_hk: 得到嘅r冇單位，落喺−1到+1之間。符號係方向。離零嘅距離係線性強弱。
