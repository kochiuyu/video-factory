  kicker: The Scale
  kicker_en: The Scale
  kicker_zh: 尺度
  kicker_zh_hk: 尺度
  title_en: From −1 to +1
  title_zh: 从−1到+1
  title_zh_hk: 由−1到+1
  r: 0.996
  left_en: Near −1
  left_zh: 接近−1
  left_zh_hk: 接近−1
  mid_en: Near 0
  mid_zh: 接近0
  mid_zh_hk: 接近0
  right_en: Near +1
  right_zh: 接近+1
  right_zh_hk: 接近+1
  footer_en: 'Five shops: r ≈ +1.00'
  footer_zh: 五家店：r ≈ +1.00
  footer_zh_hk: 五間店：r ≈ +1.00
  s1_en: Picture a ruler from minus one to plus one. Every correlation lands somewhere on this scale,
    whatever units the raw file used.
  s1_zh: 想象一把从负一到正一的标尺。无论原始文件用什么单位，每个相关系数都会落在这把尺上。
  s1_zh_hk: 想像一把由負一到正一嘅標尺。無論原始檔案用咩單位，每個相關系數都會落喺呢把尺上。
  s2_en: Near plus one, points climb together in a tight line. Near minus one, they fall together. Near
    zero, a straight line barely helps.
  s2_zh: 接近正一，点紧贴着一起往上。接近负一，点紧贴着一起往下。接近零，直线几乎帮不上忙。
  s2_zh_hk: 接近正一，點緊貼住一齊向上。接近負一，點緊貼住一齊向下。接近零，直線幾乎幫唔上手。
  s3_en: Our five shops pin near plus one. That is a very strong positive linear pattern on this file
    — still not a proof that rent causes sales.
  s3_zh: 我们这五家店钉在接近正一的位置。这是这份数据上非常强的正向线性模式——仍然不能证明租金导致销量。
  s3_zh_hk: 我哋呢五間店釘喺接近正一嘅位置。呢個係呢份數據上非常強嘅正向線性模式——仍然唔可以證明租金導致銷量。
