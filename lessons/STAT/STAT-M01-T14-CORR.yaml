id: STAT-M01-T14-CORR
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 552
title_en: What is correlation?
title_zh: 什么是相关系数？
title_zh_hk: 咩係相關系數？
objective_en: Define Pearson correlation as covariance divided by the product of the two standard deviations (with ÷ n), read r on a unit-free −1 to +1 scale, use the five-shop rent and cups file, and treat a strong r as a starting point for investigation rather than proof of causation.
objective_zh: 把皮尔逊相关系数定义为协方差除以两个标准差之积（除以n），在−1到+1的无单位尺度上读r，使用五家店租金与杯数的例子，并把强相关视为调查的起点，而不是因果关系的证明。
objective_zh_hk: 將皮爾遜相關系數定義為協方差除以兩個標準差之積（除以n），喺−1到+1嘅無單位尺度上讀r，使用五間店租金同杯數嘅例子，並將強相關視為調查嘅起點，而唔係因果關係嘅證明。
glossary:
- en: correlation
  zh: 相关系数
  zh_hk: 相關系數
  lock: true
- en: unit-free
  zh: 无单位
  zh_hk: 無單位
  lock: true
quiz:
- id: Q1
  type: multiple_choice
  question_en: What does r ≈ +1.00 between shop rent and daily cup sales indicate for these five shops?
  question_zh: 这五家店的租金与日销量相关系数约为 r ≈ +1.00，表示什么？
  question_zh_hk: 呢五間店嘅租金同日銷量相關系數大約係 r ≈ +1.00，表示咩？
  options_en:
  - 'A: The five shops show a very strong positive linear pattern between rent and cups.'
  - 'B: Paying higher rent is guaranteed to raise cup sales at every shop.'
  - 'C: An r near +1 means you have a perfect staffing formula for every shop.'
  - 'D: Correlation only works when the two averages are exactly equal.'
  options_zh:
  - 'A: 这五家店在租金与杯数之间呈现非常强的正向线性模式。'
  - 'B: 支付更高的租金，一定能提高每家店的杯数销量。'
  - 'C: r 接近 +1 表示你已有适用于每家店的完美人手公式。'
  - 'D: 只有两个平均数完全相等时，相关才有效。'
  options_zh_hk:
  - 'A: 呢五間店喺租金同杯數之間呈現非常強嘅正向線性模式。'
  - 'B: 付更高嘅租金，一定可以提高每間店嘅杯數銷量。'
  - 'C: r 接近 +1 表示你已有適用於每間店嘅完美人手公式。'
  - 'D: 淨係兩個平均數完全相等嗰陣，相關先有效。'
  answer: A
  explanation_en: 'An r near +1 indicates a very strong positive linear pattern in the observed file. It does not guarantee that higher rent raises cups, give a perfect staffing formula, or require the two averages to be equal.'
  explanation_zh: 'r接近+1表示观测数据中存在非常强的正向线性模式。它不能保证更高租金会提高杯数，也不等于完美人手公式，更不要求两个平均数相等。'
  explanation_zh_hk: 'r接近+1表示觀測數據入面存在非常強嘅正向線性模式。佢唔可以保證更高租金會提高杯數，亦唔等於完美人手公式，更加唔要求兩個平均數相等。'
- id: Q2
  type: multiple_choice
  question_en: Why does a strong correlation not establish causation?
  question_zh: 为什么强相关不能证明因果关系？
  question_zh_hk: 點解強相關唔可以證明因果關係？
  options_en:
  - 'A: A third factor may push both variables, the direction may run the other way, or the pattern may
    be coincidental.'
  - 'B: A large r still carries the original units, so bigger units mean a stronger link.'
  - 'C: A strong r proves the earlier shop is the cause of the later shop.'
  - 'D: An r near +1 always means one shop''s rent causes another shop''s cups.'
  options_zh:
  - 'A: 第三个因素可能同时推动两个变量，也可能方向相反，或者只是巧合。'
  - 'B: 较大的 r 仍带着原始单位，所以单位越大关系就越强。'
  - 'C: 强相关证明靠前的店是靠后那家店的原因。'
  - 'D: r 接近 +1 总表示一家店的租金导致另一家店的杯数。'
  options_zh_hk:
  - 'A: 第三個因素可能同時推動兩個變量，亦可能方向相反，或者淨係巧合。'
  - 'B: 較大嘅 r 仍然帶住原始單位，所以單位越大關係就越強。'
  - 'C: 強相關證明靠前嘅店係靠後嗰間店嘅原因。'
  - 'D: r 接近 +1 總表示一間店嘅租金導致另一間店嘅杯數。'
  answer: A
  explanation_en: 'Foot traffic may push both rent and sales, the arrow may run the other way, or the pattern may be chance. Correlation is unit-free, so bigger units do not make a stronger r, and a strong r still does not prove that one shop causes another.'
  explanation_zh: '客流量可能同时推高租金与销量，方向也可能相反，或者只是巧合。相关系数无单位，单位变大不会让 r 更强；强相关也不能证明一家店导致另一家。'
  explanation_zh_hk: '人流量可能同時推高租金同銷量，方向亦可能相反，或者淨係巧合。相關系數無單位，單位變大唔會令 r 更強；強相關亦唔可以證明一間店導致另一間。'
