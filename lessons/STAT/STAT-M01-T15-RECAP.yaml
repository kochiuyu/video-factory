id: STAT-M01-T15-RECAP
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 500
title_en: What is a decision dashboard?
title_zh: 什么是决策仪表盘？
title_zh_hk: 咩係決策儀表板？
objective_en: Close the module by turning the four descriptive dials into one decision dashboard — pick complementary measures for center, spread, shape, and association, state each limitation, and never manage by a single statistic.
objective_zh: 用四个描述性刻度收束本模块，组成一张决策仪表盘：为中心、离散、形态与关联挑选互补指标，写明各自局限，绝不只凭单一统计量管理。
objective_zh_hk: 用四個描述性刻度收束本模組，組成一張決策儀表板：為中心、離散、形態同關聯揀互補指標，寫明各自局限，絕唔好只憑單一統計量管理。
