  n2_zh: 租金
  n2_zh_hk: 租金
  n3_id: Cups
  n3_en: Cups
  n3_zh: 杯数
  n3_zh_hk: 杯數
  e1: Traffic->Rent
  e2: Traffic->Cups
  highlight: Traffic->Cups
  role_en: 'Busy streets raise both'
  role_zh: 旺街抬高两者
  role_zh_hk: 旺街抬高兩者
  s1_en: >-
    Suppose five shops with rent from 10,000 to 19,000 dollars and cups from 300 to 460.
    With divide by n, covariance is 176,000 dollar-cups and r is about +1.00. Strong together-movement.
  s1_zh: >-
    假设五家店，租金从10,000到19,000元，杯数从300到460。
    除以n时，协方差是176,000元·杯，r大约是+1.00。同向走得很强。
  s1_zh_hk: >-
    假設五間店，租金由10,000到19,000蚊，杯數由300到460。
    除以n嗰陣，協方差係176,000蚊·杯，r大約係+1.00。同向走得好勁。
  s2_en: >-
    That number still does not prove that raising rent raises cups.
    Foot traffic can push both: busy streets cost more to rent, and more people pass the door.
  s2_zh: >-
    这个数字仍然证明不了提高租金就会提高杯数。
    人流可以同时推动两者：旺的街道租金更贵，路过的人也更多。
  s2_zh_hk: >-
    呢個數字仍然證明唔到提高租金就會提高杯數。
    人流可以同時推動兩者：旺嘅街道租金更貴，路過嘅人亦更多。
  s3_en: >-
    So the association dial on the dashboard says "investigate the pair," not "raise rent to raise cups."
    Check the scatter, the story, and stronger designs before you claim cause.
  s3_zh: >-
    所以仪表盘上的关联刻度说的是「去查这对变量」，不是「加租金就能加杯数」。
    在声称因果之前，先看散点图、业务故事和更强的设计。
  s3_zh_hk: >-
    所以儀表板上嘅關聯刻度講嘅係「去查呢對變量」，唔係「加租金就能加杯數」。
    喺聲稱因果之前，先睇散點圖、業務故事同更強嘅設計。
- id: checklist
  visual: steps
  layout: rows
  seconds: 60
  kicker: Before You Act
  kicker_en: Before You Act
  kicker_zh: 行动之前
  kicker_zh_hk: 行動之前
  title_en: Four checks on every measure
  title_zh: 每个指标四道检查
  title_zh_hk: 每個指標四道檢查
  step1_en: '1. Name the dial'
  step1_zh: 1. 点名所问刻度
  step1_zh_hk: 1. 點名所問刻度
  step2_en: '2. Shops, period, unit'
  step2_zh: 2. 店、期间、单位
  step2_zh_hk: 2. 店、期間、單位
  step3_en: '3. Matching measure (/n)'
  step3_zh: 3. 匹配指标（÷n）
  step3_zh_hk: 3. 匹配指標（÷n）
  step4_en: '4. Write the limitation'
  step4_zh: 4. 旁写局限
  step4_zh_hk: 4. 旁寫局限
  s1_en: >-
    Before you act, first name the dial. Are you asking about center, spread, shape, or association?
  s1_zh: >-
    行动之前，先点名刻度。你在问中心、离散、形态，还是关联？
  s1_zh_hk: >-
    行動之前，先點名刻度。你喺度問中心、離散、形態，定係關聯？
  s2_en: >-
    Second, name the comparison group. Which shops, which period, and which unit are in the file?
  s2_zh: >-
    第二，写明比较总体。文件里是哪些店、哪个期间、什么单位？
  s2_zh_hk: >-
    第二，寫明比較總體。檔案入面係邊啲店、邊個期間、咩單位？
  s3_en: >-
    Third, pick a matching measure. In this descriptive module, variance and related spreads divide by n.
  s3_zh: >-
    第三，选匹配的指标。在本描述性模块里，方差和相关离散量都除以n。
  s3_zh_hk: >-
    第三，揀匹配嘅指標。喺本描述性模組入面，方差同相關離散量都除以n。
  s4_en: >-
    Fourth, write the limitation beside the number. Then the dashboard is ready for a decision, not for a slogan.
  s4_zh: >-
    第四，在数字旁边写上局限。这样仪表盘才服务于决策，而不是一句口号。
  s4_zh_hk: >-
    第四，喺數字隔離寫上局限。咁儀表板先服務決策，而唔係一句口號。
- id: answer
  visual: takeaway
  seconds: 48
  kicker: The Rule
  kicker_en: The Rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Never manage by one number
  title_zh: 不要只凭一个数
  title_zh_hk: 唔好只憑一個數
  q1_en: How should managers build the dashboard?
  q1_zh: 管理者应如何构建仪表盘？
  q1_zh_hk: 管理者應該點樣構建儀表板？
  q2_en: What does descriptive statistics support?
  q2_zh: 描述性统计支持什么？
  q2_zh_hk: 描述性統計支持咩？
  s1_en: >-
    Begin with the decision question. Pair center or position with spread, then inspect shape, outliers, and relationships when they matter.
  s1_zh: >-
    从决策问题出发。把中心或位置与离散配对，需要时再检查形态、异常值与变量关系。
  s1_zh_hk: >-
    由決策問題出發。將中心或者位置同離散配對，需要嗰陣再檢查形態、異常值同變量關係。
  s2_en: >-
    Descriptive statistics summarizes the observed file and flags patterns worth checking. It does not replace judgment, prove causation, or remove uncertainty.
  s2_zh: >-
    描述性统计概括已经看到的文件，并标出值得复查的模式。它不能取代判断、证明因果或消除不确定。
  s2_zh_hk: >-
    描述性統計概括已經睇到嘅檔案，並標出值得複查嘅模式。佢唔可以取代判斷、證明因果或者消除唔確定。
  s3_en: >-
    The operating rule: select complementary measures, state the comparison group and each limitation, investigate unusual results, and connect every statistic to a named dial before you decide.
  s3_zh: >-
    操作规则：选择互补指标，写明比较总体与各自局限，调查异常结果，并在决策前把每个统计量对应到已点名的刻度。
  s3_zh_hk: >-
    操作規則：揀互補指標，寫明比較總體同各自局限，調查異常結果，並喺決策之前將每個統計量對應到已點名嘅刻度。
