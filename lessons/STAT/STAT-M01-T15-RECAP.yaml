  tag_en: Three shops
  tag_zh: 三家店
  tag_zh_hk: 三間店
  s1_en: >-
    Suppose Monday cups again. Shop A sold 310. Shop B sold 420. Shop C sold 4,200.
    Same three numbers you have seen as a teaching file. Which single summary should run the chain?
  s1_zh: >-
    再看假设的星期一杯数。A店310，B店420，C店4,200。
    还是这份教学文件里的三个数。该用哪一个摘要来管整条连锁？
  s1_zh_hk: >-
    再睇假設嘅星期一杯數。A店310，B店420，C店4,200。
    仲係呢份教學檔案入面嘅三個數。應該用邊一個摘要嚟管成條連鎖？
  s2_en: >-
    The average is pulled by Shop C. The middle shop is 420. The end-to-end gap is 3,890 cups.
    Each of those answers a different question. None of them is the whole plan.
  s2_zh: >-
    平均数会被C店拉开。中间那家是420。两端差距是3,890杯。
    每一个都在回答不同的问题。没有一个等于整份计划。
  s2_zh_hk: >-
    平均數會被C店拉開。中間嗰間係420。兩端差距係3,890杯。
    每一個都喺度答唔同嘅問題。冇一個等於整份計劃。
  s3_en: >-
    So the close of this module is not a longer formula list.
    It is a dashboard that names the dial, picks a matching measure, and states what that measure cannot do.
  s3_zh: >-
    所以本模块的收束，不是一张更长的公式清单。
    而是一块仪表盘：点名刻度，选对指标，并写明那个指标做不到什么。
  s3_zh_hk: >-
    所以本模組嘅收束，唔係一張更長嘅公式清單。
    而係一塊儀表板：點名刻度，揀對指標，並寫明嗰個指標做唔到咩。
