  footer_en: 'Center · spread · shape at a glance'
  footer_zh: 一眼看到中心、离散、形态
  footer_zh_hk: 一眼睇到中心、離散、形態
  s1_en: >-
    Put the three shops on one line. Shop A at 310, Shop B at 420, Shop C at 4,200 after a break.
    Center, spread, and shape can all speak from this single column.
  s1_zh: >-
    把三家店放在一条线上。A店310，B店420，隔开之后是C店4,200。
    中心、离散、形态，都能从这一列发言。
  s1_zh_hk: >-
    將三間店放喺一條線上。A店310，B店420，隔開之後係C店4,200。
    中心、離散、形態，都能夠由呢一欄發言。
  s2_en: >-
    Order them. The middle shop is 420. End to end is 3,890 cups. The high side is the long side.
    One calm center can sit next to a loud shape. That is why the dashboard has more than one dial.
  s2_zh: >-
    排好序。中间是420。两端是3,890杯。高的一边就是长的一边。
    平静的中心旁边，可以有吵闹的形态。所以仪表盘不能只有一个刻度。
  s2_zh_hk: >-
    排好序。中間係420。兩端係3,890杯。高嗰邊就係長嗰邊。
    平靜嘅中心旁邊，可以有嘈吵嘅形態。所以儀表板唔可以得一個刻度。
  s3_en: >-
    Association still cannot speak from cups alone. Add rent beside each shop when you need that dial.
    Keep the picture, then choose which dial the decision actually asks.
  s3_zh: >-
    只有杯数，关联还是发不了言。需要那个刻度时，再给每家店配上租金。
    先留住这幅图，再选决策真正在问的那个刻度。
  s3_zh_hk: >-
    淨係杯數，關聯仲係發唔到言。需要嗰個刻度嗰陣，再畀每間店配上租金。
    先留住呢幅圖，再揀決策真正喺度問嗰個刻度。
