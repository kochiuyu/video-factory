  footer_en: 'Name the dial before the number'
  footer_zh: 先点名刻度，再谈数字
  footer_zh_hk: 先點名刻度，再講數字
  s1_en: >-
    Read the board left to right. Center asks where typical demand sits. The tools are mean, median, and mode.
    Caution: a center number is not the full staffing or inventory plan.
  s1_zh: >-
    从左到右读这块板。中心问常规需求落在哪里。工具是平均数、中位数和众数。
    小心：一个中心数字不等于整份人手或库存计划。
  s1_zh_hk: >-
    由左到右讀呢塊板。中心問常規需求落喺邊。工具係平均數、中位數同眾數。
    小心：一個中心數字唔等於整份人手或者庫存計劃。
  s2_en: >-
    Spread asks how wide the shops sit. Range, IQR, standard deviation, and CV each measure width differently.
    Caution: width is not an automatic staffing formula. In this module, variance and SD divide by n.
  s2_zh: >-
    离散问各店相距有多宽。极差、四分位距、标准差和变异系数，量法各不相同。
    小心：宽度不是自动的人手公式。本模块里，方差和标准差都除以n。
  s2_zh_hk: >-
    離散問各店相距有幾闊。全距、四分位距、標準差同變異系數，量法各有唔同。
    小心：闊度唔係自動嘅人手公式。本模組入面，方差同標準差都除以n。
  s3_en: >-
    Shape asks which side is long and which far day needs a check. Skewness, kurtosis, and outlier fences flag review.
    Association asks what moves together. Covariance and correlation need a second measure, such as rent beside cups.
    Caution on both rows: a flag is not proof of a recording error, and moving together is not causation.
  s3_zh: >-
    形态问哪一边更长、哪一个远日需要复查。偏度、峰度和异常值围栏只是标记复查。
    关联问什么一起动。协方差和相关需要第二个指标，例如租金配杯数。
    两行都要小心：标记不等于证明记错，同向也不等于因果。
  s3_zh_hk: >-
    形態問邊一邊更長、邊一個遠日需要複查。偏度、峰度同異常值圍欄淨係標記複查。
    關聯問咩一齊郁。協方差同相關需要第二個指標，例如租金配杯數。
    兩行都要小心：標記唔等於證明記錯，同向亦唔等於因果。
