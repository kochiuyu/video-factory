quiz:
- id: Q1
  type: multiple_choice
  question_en: Why should a manager avoid evaluating business performance with only one summary statistic?
  question_zh: 为什么管理者不应只用一个汇总统计量评估业务绩效？
  question_zh_hk: 點解管理者唔應該只用一個匯總統計量評估業務績效？
  options_en:
  - 'A: Each statistic answers one kind of question and can miss spread, shape, outliers, or links.'
  - 'B: One measure is always sufficient when the dataset is large.'
  - 'C: Multiple measures automatically prove causation.'
  - 'D: Every statistic answers exactly the same business question.'
  options_zh:
  - 'A: 每个统计量只回答一类问题，并可能漏掉离散、形态、异常值或关联。'
  - 'B: 只要数据集足够大，一个指标就永远足够。'
  - 'C: 使用多个指标会自动证明因果关系。'
  - 'D: 每个统计量都回答完全相同的业务问题。'
  options_zh_hk:
  - 'A: 每個統計量只回答一類問題，並可能漏咗離散、形態、異常值或者關聯。'
  - 'B: 只要數據集足夠大，一個指標就永遠足夠。'
  - 'C: 使用多個指標會自動證明因果關係。'
  - 'D: 每個統計量都回答完全相同嘅業務問題。'
  answer: A
  explanation_en: A useful dashboard combines complementary measures. Center does not describe spread; spread does not describe asymmetry; association does not establish causation.
  explanation_zh: 有效的仪表盘会组合互补指标。中心指标不描述离散，离散指标不描述不对称性，关联指标也不能证明因果关系。
  explanation_zh_hk: 有效嘅儀表板會組合互補指標。中心指標唔描述離散，離散指標唔描述唔對稱性，關聯指標亦唔可以證明因果關係。
- id: Q2
  type: multiple_choice
  question_en: Which combination best supports a balanced review of branch performance?
  question_zh: 哪一种组合最适合对分店业绩进行平衡评估？
  question_zh_hk: 邊一種組合最適合對分店業績作平衡評估？
  options_en:
  - 'A: Typical level, spread, a check of shape and outliers, plus any useful association.'
  - 'B: The range alone for every decision.'
  - 'C: The mean alone, regardless of outliers or business format.'
  - 'D: Correlation alone as proof that one operational variable causes another.'
  options_zh:
  - 'A: 典型水平、离散、形态与异常值检查，以及有用的关联分析。'
  - 'B: 所有决策都只使用极差。'
  - 'C: 不考虑异常值或门店业态，只使用平均数。'
  - 'D: 只用相关系数证明一个运营变量导致另一个变量。'
  options_zh_hk:
  - 'A: 典型水平、離散、形態同異常值檢查，以及有用嘅關聯分析。'
  - 'B: 所有決策都只使用全距。'
  - 'C: 唔考慮異常值或者門店業態，只使用平均數。'
  - 'D: 只用相關系數證明一個營運變量導致另一個變量。'
  answer: A
  explanation_en: Balanced decisions combine measures that answer different questions. The appropriate selection depends on the business objective, comparison group, data quality, and limitations of each statistic.
  explanation_zh: 平衡决策会组合回答不同问题的指标。具体选择取决于业务目标、比较总体、数据质量与各统计量的局限。
  explanation_zh_hk: 平衡決策會組合回答唔同問題嘅指標。具體選擇取決於業務目標、比較總體、數據質量同各統計量嘅局限。
beats:
- id: hook
  visual: title_card
  seconds: 52
  kicker: The Question
  kicker_en: The Question
  kicker_zh: 业务问题
  kicker_zh_hk: 業務問題
  title_en: What is a decision dashboard?
  title_zh: 什么是决策仪表盘？
  title_zh_hk: 咩係決策儀表板？
  en: >-
    Suppose you manage several coffee shops. One Monday column of cup counts hits the desk.
    If you steer the chain with a single average, the quiet shops overstock and the busy shop runs dry.
    If you steer with the widest gap alone, every plan looks like an emergency.
    One number answers one question and hides the rest. You need a small board of dials that names each question before you act.
    That board is a decision dashboard. What is a decision dashboard?
  zh: >-
    假设你管着几家咖啡店。星期一，桌上只有一列杯数。
    要是只拿一个平均数管整条连锁，清闲的店会堆货，忙店中午前就会断货。
    要是只拿最宽的那一段管计划，每件事都像紧急事故。
    一个数字只回答一个问题，其余的都被盖住。你需要一块小小的刻度板，先点名问题再行动。
    那块板，叫决策仪表盘。什么是决策仪表盘？
  zh_hk: >-
    假設你管緊幾間咖啡店。星期一，檯上得一欄杯數。
    如果淨係攞一個平均數管成條連鎖，清閒嘅店會積貨，忙店中午前就會斷貨。
    如果淨係攞最闊嗰段管計劃，每件事都好似緊急事故。
    一個數字只答一個問題，其餘嘅都被遮住。你需要一塊細細嘅刻度板，先點名問題再行動。
    嗰塊板，就叫決策儀表板。咩係決策儀表板？
