id: STAT-M01-T15-RECAP
course: statistics
course_en: Business Statistics
course_zh: 商务统计
course_zh_hk: 商務統計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 162
title_en: The executive decision dashboard
title_zh: 管理层决策仪表盘
title_zh_hk: 管理層決策儀表板
objective_en: Synthesize the module’s descriptive statistics into a managerial decision framework, showing how leaders combine measures of center, position, spread, shape, data quality, and association while respecting each measure’s limitations.
objective_zh: 把本模块的描述性统计整合为管理决策框架，说明领导者如何结合中心、位置、离散、形态、数据质量与关联指标，同时尊重每项指标的局限。
objective_zh_hk: 將本模組嘅描述性統計整合成管理決策框架，說明領導者點樣結合中心、位置、離散、形態、數據質量同關聯指標，同時尊重每項指標嘅局限。
