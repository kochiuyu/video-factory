- id: roadmap
  visual: module_open
  seconds: 44
  title_en: "The Four Probability Pillars"
  title_zh: "管理不确定性的四大支柱"
  title_zh_hk: "管理不確定性嘅四大支柱"
  item1_en: "Universe: Defining all possible transaction outcomes"
  item1_zh: "全集：穷尽界定所有可能的交易与营运结果"
  item1_zh_hk: "全集：窮盡界定所有可能嘅交易同營運結果"
  item2_en: "Conditioning: Updating odds when customer context changes"
  item2_zh: "条件：根据顾客画像与场景动态更新胜率"
  item2_zh_hk: "條件：根據顧客畫像同場景動態更新勝率"
  item3_en: "Inversion: Diagnosing true equipment faults from alerts"
  item3_zh: "逆转：透过传感器警报倒推设备真实故障率"
  item3_zh_hk: "逆轉：透過傳感器警報倒推設備真實故障率"
  item4_en: "Valuation: Pricing bets with Expected Monetary Value"
  item4_zh: "定价：运用期望收益为保单与投资商业定价"
  item4_zh_hk: "定價：運用期望收益為保單同投資商業定價"
  en: "Navigating uncertainty needs four pillars. First, define the operational universe of all possible outcomes. Second, update probabilities as new context arrives. Third, invert alerts to diagnose real faults behind the alarm. Fourth, weight the money at stake with expected value before you bet."
  zh: "要应对不确定，靠四根柱子。第一，把所有可能结果先圈成一套业务全集。第二，情况一变，就更新预判。第三，从警报倒推，找出背后的真故障。第四，用期望值给钱加权，再决定下不下这个注。"
  zh_hk: "要應付唔確定，靠四條柱。第一，將所有可能結果先圈成一套業務全集。第二，情況一變，就更新預判。第三，由警報倒推，搵出背後嘅真故障。第四，用期望值幫錢加權，再決定下唔下呢注。"
- id: foundation
  visual: two_column
  seconds: 44
  kicker: "The Paradigm Shift"
  kicker_en: "The Paradigm Shift"
  kicker_zh: "思维跃迁"
  kicker_zh_hk: "思維躍遷"
  title_en: "From description to prediction"
  title_zh: "从回溯描述到前瞻推演"
  title_zh_hk: "由回溯描述到前瞻推演"
  left_en: "Descriptive: Recording what happened"
  left_zh: "描述统计：忠实复盘既成事实"
  left_zh_hk: "描述統計：忠實複盤既成事實"
  right_en: "Probability: Quantifying what could happen"
  right_zh: "概率模型：科学量化未来可能"
  right_zh_hk: "概率模型：科學量化未來可能"
  s1_en: "Descriptive statistics looks in the rearview mirror. It counts completed transactions and historical variance to review past execution."
  s1_zh: "描述性统计像在看后视镜。它数已经完成的交易，算历史方差，用来复盘过去做得怎样。"
  s1_zh_hk: "描述性統計好似睇緊後視鏡。佢數已經完成嘅交易，計歷史方差，用嚟複盤過去做得點。"
  s2_en: "Probability looks through the front windshield. It maps uncertainty onto a zero-to-one scale so you can commit resources before the future unfolds."
  s2_zh: "概率像在看前方挡风玻璃。它把不确定标在零到一的尺上，让你在未来真正到来前，就能先把资源配好。"
  s2_zh_hk: "概率好似睇緊前方擋風玻璃。佢將唔確定標喺零到一嘅尺上面，等你喺未來真正到之前，就可以先將資源配好。"
  s3_en: "So the manager's job shifts from summarizing yesterday's cups to pricing what could happen before the bet is placed."
  s3_zh: "所以经理的工作，从总结昨天的杯数，变成在下注前，给可能发生的事定个价。"
  s3_zh_hk: "所以經理嘅工作，由總結尋日嘅杯數，變成喺下注之前，幫可能發生嘅事定個價。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "The Forward Rule"
  kicker_en: "The Forward Rule"
  kicker_zh: "前瞻法则"
  kicker_zh_hk: "前瞻法則"
  title_en: "Manage by process, not outcome"
  title_zh: "按过程管理，不看单次结果"
  title_zh_hk: "按過程管理，唔睇單次結果"
  q1_en: "Why learn probability? → Price risk up front"
  q1_zh: "为什么学概率？→ 先给风险定价"
  q1_zh_hk: "點解學概率？→ 先為風險定價"
  q2_en: "Protect judgment? → Judge odds, not one roll"
  q2_zh: "如何守护判断？→ 评胜率，不评一次掷骰"
  q2_zh_hk: "點樣守護判斷？→ 評勝率，唔評一次擲骰"
  s1_en: "Leaders learn probability to price tomorrow's risk before storms, halts, or crowds arrive."
  s1_zh: "学概率，是为了在暴雨、断货或爆客到来前，给明天的风险定价。"
  s1_zh_hk: "學概率，係為咗喺暴雨、斷貨或者爆客到之前，幫聽日嘅風險定價。"
  s2_en: "A bad roll does not prove a bad bet. Judge the odds you chose."
  s2_zh: "一次掷骰不利，不证明注下错了。要评的是你当时选的胜率。"
  s2_zh_hk: "一次擲骰唔好彩，唔證明注下錯咗。要評嘅係你當時揀嘅勝率。"
  s3_en: "Manage by the process that stacked those odds — not by one outcome alone."
  s3_zh: "按堆出胜率的决策过程来管，不要只盯这一次结果。"
  s3_zh_hk: "按堆出勝率嘅決策過程嚟管，唔好淨係盯呢一次結果。"
