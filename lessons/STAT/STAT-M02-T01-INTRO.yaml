quiz:
- id: Q1
  type: multiple_choice
  question_en: "What is the primary difference between descriptive statistics and business probability?"
  question_zh: "描述性统计与商务概率论之间最根本的区别是什么？"
  question_zh_hk: "描述性統計同商務概率論之間最根本嘅分別係咩？"
  options_en:
  - "A: Descriptive statistics summarizes historical past data, while probability quantifies future uncertainty for decision-making."
  - "B: Descriptive statistics only uses addition, while probability only uses division."
  - "C: Probability can only be calculated on government tax documents."
  - "D: Descriptive statistics guarantees that future store sales will never change."
  options_zh:
  - "A: 描述性统计汇总的是过去的既成历史数据，而概率论量化的是面向未来的不确定性以指导决策。"
  - "B: 描述性统计只涉及加法运算，而概率论只涉及除法运算。"
  - "C: 概率只能用于政府税务合规文件的计算。"
  - "D: 描述性统计能够百分之百保证未来的门店销量永远不再变化。"
  options_zh_hk:
  - "A: 描述性統計匯總嘅係過去嘅既成歷史數據，而概率論量化嘅係面向未來嘅不確定性以指導決策。"
  - "B: 描述性統計淨係涉及加法運算，而概率論淨係涉及除法運算。"
  - "C: 概率淨係可以用喺政府稅務合規文件嘅計算。"
  - "D: 描述性統計能夠百分之百保證未來嘅門店銷量永遠唔再變化。"
  answer: A
  explanation_en: "Descriptive statistics looks backward at recorded receipts, while probability models the likelihood of future operational outcomes before they occur."
  explanation_zh: "描述性统计向后回顾已经发生的账目流水，而概率论在事件发生前对未来的营运结果可能性进行前瞻量化。"
  explanation_zh_hk: "描述性統計向後回顧已經發生咗嘅賬目流水，而概率論喺事件發生之前對未來嘅營運結果可能性進行前瞻量化。"
- id: Q2
  type: multiple_choice
  question_en: "Why is a sound probabilistic decision still valuable even if a bad operational outcome occurs?"
  question_zh: "为什么即便最终遭遇了不利的营运结果，一个优秀的概率决策依然极具管理价值？"
  question_zh_hk: "點解就算最終遭遇咗唔好嘅營運結果，一個優秀嘅概率決策依然極具管理價值？"
  options_en:
  - "A: Good decision-making optimizes odds under uncertainty, distinguishing the quality of executive logic from unpredictable luck."
  - "B: Regulators automatically refund all monetary losses if a probability formula was written down."
  - "C: Probability calculations prevent bad weather from ever affecting retail stores."
  - "D: Any decision involving probability is legally guaranteed to double company profit."
  options_zh:
  - "A: 优秀的决策是在不确定性下权衡最优胜率，将决策逻辑的严谨性与无法预测的随机运气区分开来。"
  - "B: 只要在纸上写过概率计算公式，监管机构就会全额补偿所有经济损失。"
  - "C: 概率计算可以彻底阻止恶劣天气对零售门店产生任何负面影响。"
  - "D: 任何应用了概率论的商业决策，法律上都保证能让公司利润直接翻倍。"
  options_zh_hk:
  - "A: 優秀嘅決策係喺不確定性之下權衡最優勝率，將決策邏輯嘅嚴謹性同冇辦法預測嘅隨機運氣區分開嚟。"
  - "B: 只要喺張紙度寫過概率計算公式，監管機構就會全額補償所有經濟損失。"
  - "C: 概率計算可以徹底阻止惡劣天氣對零售門市產生任何負面影響。"
  - "D: 任何應用咗概率論嘅商業決策，法律上都保證可以令公司利潤直接翻倍。"
  answer: A
  explanation_en: "Executives cannot control random luck, but they can control rational odds. Evaluating decisions by process rather than outcome alone protects the business over the long run."
  explanation_zh: "管理者无法控制纯粹的随机运气，但可以掌控理性的胜率。依据决策过程而非单一偶发结果来评估管理，能在长期经营中守护企业。"
  explanation_zh_hk: "管理者冇辦法控制純粹嘅隨機運氣，但可以掌控理性嘅勝率。依據決策過程而唔係單一偶發結果嚟評估管理，可以喺長期經營入面守護企業。"
