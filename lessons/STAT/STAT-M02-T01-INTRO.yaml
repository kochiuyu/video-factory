id: STAT-M02-T01-INTRO
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 154
title_en: "Seeing tomorrow through probability"
title_zh: "用概率透视明天的商业不确定性"
title_zh_hk: "用概率透視聽日嘅商業不確定性"
objective_en: "Introduce probability as the forward-looking language of business risk, distinguish historical descriptive receipts from probabilistic forecasts, and establish the four core pillars of managerial decision-making under uncertainty."
objective_zh: "将概率介绍为衡量企业未来风险的前瞻性语言，区分历史描述性账目与前瞻性概率预测，并确立不确定性下商业决策的四大核心支柱。"
objective_zh_hk: "將概率介紹為衡量企業未來風險嘅前瞻性語言，區分歷史描述性賬目與前瞻性概率預測，並確立不確定性之下商業決策嘅四大核心支柱。"
