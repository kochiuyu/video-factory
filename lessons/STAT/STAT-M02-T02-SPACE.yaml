id: STAT-M02-T02-SPACE
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Defining the universe of outcomes"
title_zh: "穷尽界定业务结果的全集"
title_zh_hk: "窮盡界定業務結果嘅全集"
objective_en: "Define sample spaces and events within a retail store context, explain the criteria of mutual exclusivity and collective exhaustiveness (MECE), and calculate baseline probabilities from transaction logs."
objective_zh: "在零售门店场景下定义样本空间与事件，阐释互斥且完全穷尽（MECE）的核心准则，并基于交易账目计算基准概率。"
objective_zh_hk: "喺零售門市場景之下定義樣本空間同事件，闡釋互斥且完全窮盡（MECE）嘅核心準則，並基於交易賬目計算基準概率。"
