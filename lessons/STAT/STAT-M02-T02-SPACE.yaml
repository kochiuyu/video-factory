  q1_zh_hk: "管理者嘅第一職責？→ 鎖緊 MECE 樣本空間"
  q2_en: "Event probability? → Sum the atomic outcomes that fit"
  q2_zh: "事件概率怎么算？→ 把符合条件的基本结果相加"
  q2_zh_hk: "事件概率點計？→ 將符合條件嘅基本結果相加"
  s1_en: "Before you price any risk, lock a sample space that is mutually exclusive and collectively exhaustive."
  s1_zh: "给风险定价之前，先把样本空间锁成互斥、又完全穷尽。"
  s1_zh_hk: "幫風險定價之前，先將樣本空間鎖成互斥、又完全窮盡。"
  s2_en: "An event's probability is the sum of the atomic outcomes that fit it."
