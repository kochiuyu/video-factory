title_en: "Defining the universe of outcomes"
title_zh: "穷尽界定业务结果的全集"
title_zh_hk: "窮盡界定業務結果嘅全集"
youtube:
  description_en: |
    Defining the universe of outcomes

    Before you can price any business risk, you must answer a deceptively simple question: what are all the things that could possibly occur? Leave out even one transaction type and the model collapses on bad math.

    The sample space S is the complete universe of distinct atomic outcomes; its total probability is 1.0. An event is any subset management cares about. Build S under the MECE rule: mutually exclusive (no overlap) and collectively exhaustive (no gaps).

    Suppose a Monday register shows 1,000 orders: Beverage Only 600 (0.60), Food Only 100 (0.10), Bundle 300 (0.30). Those three add to 1.00. The food-purchase event is Food Only plus Bundle: 0.10 + 0.30 = 0.40.

    Business Probability Foundations - Module 2 - Short 2 (sample space)
    If this helped, subscribe for the next short.
  description_zh: |
    穷尽界定业务结果的全集

    在给任何商业风险定价之前，你必须先回答一个看似简单的问题：现场到底可能发生哪些情况？哪怕漏掉一种交易形态，模型也会因底层漏洞崩塌。

    样本空间 S 是所有互不相同的基本结果的完整全集，总概率恒等于 1.0。事件是管理层关心的任一子集。搭建 S 要守 MECE：互斥（不重叠）且完全穷尽（无遗漏）。

    假设周一收银有 1,000 笔订单：纯饮品 600（0.60）、纯餐点 100（0.10）、组合套餐 300（0.30）。三者之和为 1.00。购买食物事件 = 纯餐点 + 组合：0.10 + 0.30 = 0.40。

    商务概率基础 - 模块2 - 短片2（样本空间）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    窮盡界定業務結果嘅全集

    喺為任何商業風險定價之前，你必須先回答一條睇落好簡單嘅問題：現場到底可能發生邊啲情況？哪怕漏咗一種交易形態，模型都會因為底層漏洞崩塌。

    樣本空間 S 係所有互不相同嘅基本結果嘅完整全集，總概率恆等於 1.0。事件係管理層關心嘅任一子集。搭建 S 要守 MECE：互斥（唔重疊）而且完全窮盡（無遺漏）。

    假設周一收銀有 1,000 筆訂單：純飲品 600（0.60）、純餐點 100（0.10）、組合套餐 300（0.30）。三者之和係 1.00。買食物事件 = 純餐點 + 組合：0.10 + 0.30 = 0.40。

    商務概率基礎 - 模組2 - 短片2（樣本空間）
    覺得有用嘅話，訂閱下一集。
