id: STAT-M02-T03-COMPL
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "The easy way to find failure"
title_zh: "反向推演：用对立事件算清业务风险"
title_zh_hk: "反向推演：用對立事件計清業務風險"
objective_en: "State the core axioms of probability, explain the complement rule P(A complement) = 1 - P(A), and show how managers flip complex 'at least one failure' operational calculations into simple arithmetic."
objective_zh: "阐明概率论的核心公理，解释对立事件法则 P(A补集) = 1 - P(A)，并展示管理者如何把复杂的“至少发生一次故障”的运算转化为极简算术。"
objective_zh_hk: "闡明概率論嘅核心公理，解釋對立事件法則 P(A補集) = 1 - P(A)，並展示管理者點樣將複雜嘅「至少發生一次故障」嘅運算轉化為極簡算術。"
