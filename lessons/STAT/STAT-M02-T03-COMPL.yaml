title_en: "The easy way to find failure"
title_zh: "反向推演：用对立事件算清业务风险"
title_zh_hk: "反向推演：用對立事件計清業務風險"
youtube:
  description_en: |
    The easy way to find failure

    When a manager asks for the chance of at least one defect, do not list every failure path. The complement rule flips the question: find the probability of a flawless run, then subtract it from 1.0.

    Suppose 940 of 1,000 espresso shots meet every standard. The clean-run probability is 0.94. VIP defect risk is 1.0 minus 0.94 — exactly 0.06. No need to tally bitter pulls, cold groupheads, and channeling one by one.

    Business Probability Foundations - Module 2 - Short 3 (complement)
    If this helped, subscribe for the next short.
  description_zh: |
    找失败概率的捷径

    当管理者问“至少一次瑕疵”的概率时，不要逐一枚举失败路径。对立事件法则把问题翻转：先算完美出品的概率，再用 1.0 减去它。

    假设 1,000 杯浓缩里有 940 杯全部达标，完美概率是 0.94。贵宾遇到瑕疵的风险就是 1.0 减 0.94，精确等于 0.06。不必再把过萃、水温过低和通道效应分开加总。

    商务概率基础 - 模块2 - 短片3（对立事件）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    搵失敗概率嘅捷徑

    當管理者問「至少一次瑕疵」嘅概率嗰陣，唔好逐一枚舉失敗路徑。對立事件法則將問題翻轉：先計完美出品嘅概率，再用 1.0 減佢。

    假設 1,000 杯濃縮入面有 940 杯全部達標，完美概率係 0.94。貴賓遇到瑕疵嘅風險就係 1.0 減 0.94，精確等於 0.06。唔使再將過萃、水溫過低同通道效應分開加總。

    商務概率基礎 - 模組2 - 短片3（對立事件）
    覺得有用嘅話，訂閱下一集。
