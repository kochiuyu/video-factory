id: STAT-M02-T04-TABLE
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Reading the 2x2 retail matrix"
title_zh: "读懂 2x2 零售矩阵：边缘与联合概率"
title_zh_hk: "讀識 2x2 零售矩陣：邊緣與聯合概率"
objective_en: "Construct and interpret a 2x2 contingency table, distinguish marginal probabilities on the outer margins from joint intersection probabilities in the interior cells, and calculate them using retail cross-selling data."
objective_zh: "构建并解读 2x2 列联表，区分外侧边缘概率与内部单元格联合概率，并运用零售连带交叉销售数据进行计算。"
objective_zh_hk: "構建並解讀 2x2 列聯表，區分外側邊緣概率同內部單元格聯合概率，並運用零售連帶交叉銷售數據進行計算。"
