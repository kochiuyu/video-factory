youtube:
  description_en: |
    Reading the 2x2 retail matrix

    A 2x2 ticket table separates two layers. Interior cells hold joint probabilities — both conditions at once. Outer margins hold marginal totals — one factor alone. The bottom-right corner always anchors at 1.0.

    In a 1,000-order ledger: 120 tickets buy iced coffee and a pastry (joint 0.12). The iced row sums to 400 (marginal 0.40). The pastry column sums to 300 (marginal 0.30). Bundle decisions read the interior cell; margins only set category scale.

    Business Probability Foundations - Module 2 - Short 4 (contingency table)
    If this helped, subscribe for the next short.
  description_zh: |
    读懂零售 2x2 列联表

    2x2 客单表分两层。内部单元格是联合概率——两种条件同时成立；外侧边缘是边缘合计——只看单一因素。右下角总锚点恒为 1.0。

    在 1,000 笔订单里：120 笔同时买冰咖啡与甜点（联合 0.12）；冷饮行合计 400（边缘 0.40）；甜点列合计 300（边缘 0.30）。套餐决策读内部单元格；边缘只用来判断品类规模。

    商务概率基础 - 模块2 - 短片4（列联表）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    讀懂零售 2x2 列聯表

    2x2 客單表分兩層。內部單元格係聯合概率——兩種條件同時成立；外側邊緣係邊緣合計——淨係睇單一因素。右下角總錨點恆為 1.0。

    喺 1,000 筆訂單入面：120 筆同時買凍咖啡同甜點（聯合 0.12）；凍飲行合計 400（邊緣 0.40）；甜點列合計 300（邊緣 0.30）。套餐決策讀內部單元格；邊緣只用嚟判斷品類規模。

    商務概率基礎 - 模組2 - 短片4（列聯表）
    覺得有用嘅話，訂閱下一集。
