  s1_en: "Check our Shop A ledger of 1,000 orders. Exactly 120 patrons buy both iced coffee and a pastry. That interior cell gives a joint probability of zero point one two."
  s1_zh: "看A店 1,000 笔订单。刚好有 120 位顾客既买冰咖啡又买点心。那个内部格的联合概率是 0.12。"
  s1_zh_hk: "睇吓A舖 1,000 筆訂單。啱啱有 120 位顧客既買凍咖啡又買點心。嗰個內部格嘅聯合概率係 0.12。"
  s2_en: "Sum across the entire row: 120 pastry-buyers plus 280 non-pastry buyers gives 400 total iced orders. That margin gives a marginal probability of zero point four zero."
  s2_zh: "沿这一行加出去：120 笔配点心，加 280 笔不配点心，冷饮一共 400 笔。右侧边缘概率是 0.40。"
  s2_zh_hk: "沿住呢一行加出去：120 筆配點心，加 280 筆唔配點心，凍飲一共 400 筆。右側邊緣概率係 0.40。"
  s3_en: "Sum down the first column: 120 iced plus 180 hot gives 300 total pastry buyers. The bottom margin gives a marginal pastry probability of zero point three zero."
  s3_zh: "再沿第一列往下加：120 笔冷饮加 180 笔热饮，点心一共 300 笔。底部边缘概率是 0.30。"
  s3_zh_hk: "再沿住第一列落去加：120 筆凍飲加 180 筆熱飲，點心一共 300 筆。底部邊緣概率係 0.30。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Edge is not the center"
  title_zh: "边缘不是中心"
  title_zh_hk: "邊緣唔係中心"
  q1_en: "Edge vs center? → Margins=scale; joints=bundles"
  q1_zh: "边缘还是中心？→ 边缘看规模；内部看捆绑"
  q1_zh_hk: "邊緣定中心？→ 邊緣睇規模；內部睇捆綁"
  q2_en: "Avoid bundle errors? → Read the interior cell"
  q2_zh: "如何避免套餐失策？→ 直接读内部单元格"
  q2_zh_hk: "點樣避免套餐失策？→ 直接讀內部單元格"
  s1_en: "Margins measure one category's scale. Interior joints reveal true bundle attachment."
  s1_zh: "边缘看单一品类有多大；内部联合才看出真实捆绑。"
  s1_zh_hk: "邊緣睇單一品類有幾大；內部聯合先睇到真實捆綁。"
  s2_en: "Do not add two marginal rates and call that a bundle forecast."
  s2_zh: "不要把两个边缘需求一加，就当成套餐预测。"
  s2_zh_hk: "唔好將兩個邊緣需求一加，就當做成套餐預測。"
  s3_en: "For the bundle call, read the joint cell; use margins only for overall scale."
  s3_zh: "做套餐决策，读联合格；边缘只用来看总体规模。"
  s3_zh_hk: "做套餐決策，讀聯合格；邊緣只用嚟睇總體規模。"
