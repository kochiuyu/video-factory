title_en: "Don't count the pastry twice"
title_zh: "切莫将甜点算了两遍：概率加法法则"
title_zh_hk: "千祈咪將甜點計咗兩次：概率加法法則"
objective_en: "Define the General Addition Rule for probability, explain why overlapping joint outcomes must be subtracted to prevent double-counting, contrast mutually exclusive and non-mutually exclusive events, and apply the rule to retail promotional campaigns."
objective_zh: "阐释概率的一般加法法则，解释为何必须剔除重叠的联合事件以防重复计算，辨析互斥事件与非互斥事件的区别，并将其应用于零售促销预算测算。"
objective_zh_hk: "闡釋概率嘅一般加法法則，解釋點解必須扣除重疊嘅聯合事件以防重複計算，辨析互斥事件同非互斥事件嘅分別，並將其應用喺零售促銷預算測算。"
