id: STAT-M02-T05-ADDIT
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
duration_target_s: 166
title_en: "Don't count the pastry twice"
title_zh: "切莫将甜点算了两遍：概率加法法则"
title_zh_hk: "千祈咪將甜點計咗兩次：概率加法法則"
youtube:
  description_en: |
    Don't count the pastry twice

    The general addition rule prices OR events: P(A or B) = P(A) + P(B) − P(A and B). When categories overlap, adding margins alone double-counts the bridge.

    If iced coffee is 0.40, pastry is 0.30, and both together are 0.12, then either item appears on 0.40 + 0.30 − 0.12 = 0.58 of tickets. Budget the promotion for 58 percent — not 70 percent.

    Business Probability Foundations - Module 2 - Short 5 (addition rule)
    If this helped, subscribe for the next short.
  description_zh: |
    别把甜点算两次

    一般加法法则给“或”事件定价：P(A 或 B) = P(A) + P(B) − P(A 且 B)。品类有重叠时，只加边缘会把交集算两遍。

    若冷饮 0.40、甜点 0.30、两者兼有 0.12，则至少买其一的比例是 0.40 + 0.30 − 0.12 = 0.58。促销预算按 58% 计，而不是 70%。

    商务概率基础 - 模块2 - 短片5（加法法则）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    唔好將甜點計兩次

    一般加法法則為「或」事件定價：P(A 或 B) = P(A) + P(B) − P(A 兼 B)。品類有重疊嗰陣，淨係加邊緣會將交集計兩次。

    若凍飲 0.40、甜點 0.30、兩者兼有 0.12，則至少買其一嘅比例係 0.40 + 0.30 − 0.12 = 0.58。促銷預算按 58% 計，而唔係 70%。

    商務概率基礎 - 模組2 - 短片5（加法法則）
    覺得有用嘅話，訂閱下一集。
