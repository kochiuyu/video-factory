  s1_en: "Look back at our Shop A ledger. Step one: identify the condition. Four hundred patrons purchased iced coffee; four hundred is our new denominator."
  s1_zh: "回到A店台账。第一步：锁定条件。四百位顾客买了冷饮，四百就是新分母。"
  s1_zh_hk: "返去A舖台賬。第一步：鎖定條件。四百位顧客買咗凍飲，四百就係新分母。"
  s2_en: "Step two: identify how many tickets inside that specific group also ordered a pastry. The cross-tab shows exactly one hundred and twenty."
  s2_zh: "第二步：在这一群里，有多少单同时加了烘焙点心？交叉表显示正好一百二十笔。"
  s2_zh_hk: "第二步：喺呢一班入面，有幾多單同時加咗烘焙點心？交叉表顯示啱啱一百二十筆。"
  s3_en: "Step three: divide one hundred and twenty by four hundred. The conditional probability of buying a pastry given an iced drink is zero point three zero."
  s3_zh: "第三步：一百二十除以四百。已知买了冷饮，再加点心的条件概率是 0.30。"
  s3_zh_hk: "第三步：一百二十除以四百。已知買咗凍飲，再加點心嘅條件概率係 0.30。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Context resets the denominator"
  title_zh: "场景重置分母，条件决定胜率"
  title_zh_hk: "場景重置分母，條件決定勝率"
  q1_en: "Read P(A|B)? → Shrink the universe to B first"
  q1_zh: "如何读 P(A|B)？→ 先把世界缩到 B"
  q1_zh_hk: "點樣讀 P(A|B)？→ 先將世界縮到 B"
  q2_en: "Why condition? → Blunt averages become sharp segments"
  q2_zh: "为何要条件化？→ 把粗平均变成细分层"
  q2_zh_hk: "點解要條件化？→ 將粗平均變成細分層"
  s1_en: "With prior information, shrink the universe to condition B before you quote odds."
  s1_zh: "已有先验信息时，先把全集缩到条件 B，再报价率。"
  s1_zh_hk: "已有先驗資訊嗰陣，先將全集縮到條件 B，再報價率。"
  s2_en: "Unconditional averages stay blunt; conditioning turns them into tailored segments."
  s2_zh: "无条件平均仍然粗糙；条件化才能做成精准分层。"
  s2_zh_hk: "無條件平均仍然粗糙；條件化先做得成精準分層。"
  s3_en: "Iced segment: 120 over 400 — pastry rate 30 percent inside that world."
  s3_zh: "冷饮细分：120 除以 400——这个世界里点心率是 30%。"
  s3_zh_hk: "凍飲細分：120 除以 400——呢個世界入面點心率係 30%。"
