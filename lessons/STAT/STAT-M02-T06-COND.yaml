quiz:
- id: Q1
  type: multiple_choice
  question_en: "When calculating the conditional probability P(A|B), what mathematical adjustment fundamentally occurs?"
  question_zh: "在计算条件概率 P(A|B) 时，底层在数学上究竟发生了什么根本性的调整？"
  question_zh_hk: "喺計算條件概率 P(A|B) 嗰陣，底層喺數學上究竟發生咗咩根本性嘅調整？"
  options_en:
  - "A: The denominator shrinks from the grand total sample space down to the subset where condition B occurs."
  - "B: All probability percentages are multiplied by 100 to convert into dollar sales."
  - "C: Negative probabilities are introduced to reflect customer cancellations."
  - "D: The numerator is replaced by the total number of retail employees on shift."
  options_zh:
  - "A: 计算的分母从全局样本空间缩减为满足条件 B 的特定子集群体。"
  - "B: 将所有概率百分比乘以 100，直接换算成销售收入金额。"
  - "C: 引入负数概率，用来反映顾客临时取消订单的情况。"
  - "D: 分子被替换为当班在岗的零售员工总人数。"
  options_zh_hk:
  - "A: 計算嘅分母由全局樣本空間縮減為滿足條件 B 嘅特定子集群體。"
  - "B: 將所有概率百分比乘以 100，直接換算做銷售收入金額。"
  - "C: 引入負數概率，用嚟反映顧客臨時取消訂單嘅情況。"
  - "D: 分子被替換為當值在崗嘅零售員工總人數。"
  answer: A
  explanation_en: "Conditioning on B means that outcomes outside B are impossible. The universe shrinks to B, making P(B) the new denominator."
  explanation_zh: "以 B 为条件意味着 B 之外的所有结果都不可能发生。分析全集缩窄至 B，因此 P(B) 成为新的分母。"
  explanation_zh_hk: "以 B 為條件意味住 B 之外嘅所有結果都唔可能發生。分析全集縮窄至 B，因此 P(B) 成為新嘅分母。"
- id: Q2
  type: multiple_choice
  question_en: "Across 1,000 orders, 400 patrons order Iced Drinks (B) and 120 order both Iced Drinks and Pastries (A and B). Given that a patron ordered an Iced Drink, what is the probability they also bought a Pastry, P(Pastry|Iced)?"
  question_zh: "在 1,000 笔订单中，有 400 位点了冷饮（B），其中 120 位兼点了烘焙甜点（A 且 B）。已知一位顾客点了冷饮，其同时选购甜点的条件概率 P(甜点|冷饮) 是多少？"
  question_zh_hk: "喺 1,000 筆訂單入面，有 400 位點咗凍飲（B），其中 120 位兼點咗烘焙甜點（A 兼 B）。已知一位顧客點咗凍飲，佢同時選購甜點嘅條件概率 P(甜點|凍飲) 係幾多？"
  options_en:
  - "A: 0.12"
  - "B: 0.30"
  - "C: 0.40"
  - "D: 0.52"
  options_zh:
  - "A: 0.12"
  - "B: 0.30"
  - "C: 0.40"
  - "D: 0.52"
  options_zh_hk:
  - "A: 0.12"
  - "B: 0.30"
  - "C: 0.40"
  - "D: 0.52"
  answer: B
  explanation_en: "P(Pastry|Iced) = P(Pastry and Iced) / P(Iced) = 120 / 400 = 0.30."
  explanation_zh: "P(甜点|冷饮) = P(甜点且冷饮) / P(冷饮) = 120 / 400 = 0.30。"
  explanation_zh_hk: "P(甜點|凍飲) = P(甜點兼凍飲) / P(凍飲) = 120 / 400 = 0.30。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Macro Blindspot"
  kicker_en: "The Macro Blindspot"
  kicker_zh: "大盘盲区"
  kicker_zh_hk: "大盤盲區"
  title_en: "Average customer, misleading strategy"
  title_zh: "大盘平均顾客，误导营销策略"
  title_zh_hk: "大盤平均顧客，誤導營銷策略"
  en: "Storewide data says thirty percent of patrons purchase a bakery item. But treat every customer walking through the door as a thirty percent prospect, and you will misallocate staff and waste marketing push notifications. An iced-drink customer may have a different pastry rate from the storewide average. How should managers recalculate when the customer segment is already known?"
  zh: "全店大盘数据显示，有 30% 的顾客会购买烘焙点心。但如果你把进门的每一位顾客都当成只有 30% 购买概率的普通客群，就会错配烘焙人手并浪费精准推送。冷饮顾客的点心购买率可能不同于全店平均值。当顾客所属群体已经明确时，管理者应如何重新计算？"
  zh_hk: "全店大盤數據顯示，有 30% 嘅顧客會買烘焙點心。但如果你將入舖嘅每一位顧客都當成淨係得 30% 購買概率嘅普通客群，就會錯配烘焙人手兼且浪費精準推送。凍飲顧客買點心嘅比率可能同全店平均值唔同。當顧客所屬群體已經知道，管理者應該點樣重新計算？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The logic of conditional probability"
  title_zh: "条件概率的核心定义与逻辑"
  title_zh_hk: "條件概率嘅核心定義與邏輯"
  formula: "P(A|B) = P(A and B) / P(B)"
  formula_tex: 'P(A\mid B) = \frac{P(A\cap B)}{P(B)}'
  formula_zh: "P(A|B) = P(A 且 B) / P(B)"
  formula_zh_hk: "P(A|B) = P(A 兼 B) / P(B)"
  s1_en: "Conditional probability measures the likelihood of event A occurring given that event B is already known to have happened, written as P of A vertical bar B."
  s1_zh: "条件概率度量的是在已知事件 B 已经发生的前提下，事件 A 发生的可能性，记作 P(A|B)，读作在给定 B 条件下 A 的概率。"
  s1_zh_hk: "條件概率度量嘅係喺已知事件 B 已經發生嘅前提下，事件 A 發生嘅可能性，記做 P(A|B)，讀做喺給定 B 條件下 A 嘅概率。"
  s2_en: "The vertical bar represents a lens: everything outside condition B disappears. The denominator is no longer the entire store ledger; it shrinks strictly to the subset of condition B."
  s2_zh: "竖线宛如一个滤镜：满足条件 B 之外的所有其他情况全部隐去。计算的分母不再是全店总账，而是严格缩窄为条件 B 这个局部子集。"
  s2_zh_hk: "條豎線就似一個濾鏡：滿足條件 B 之外嘅所有其他情況全部隱去。計算嘅分母唔再係全店總賬，而係嚴格縮窄為條件 B 呢個局部子集。"
- id: mechanism
  visual: two_column
  seconds: 36
  kicker: "The Mechanism"
  kicker_en: "The Mechanism"
  kicker_zh: "缩窄原理"
  kicker_zh_hk: "縮窄原理"
  title_en: "Shrinking the sample space"
  title_zh: "样本空间的物理级缩减"
  title_zh_hk: "樣本空間嘅物理級縮減"
  left_en: "Unconditional: Denominator = 1,000"
  left_zh: "无条件概率：分母为全部 1,000 笔订单"
  left_zh_hk: "無條件概率：分母為全部 1,000 筆訂單"
  right_en: "Conditional: Denominator = Subset B"
  right_zh: "条件概率：分母仅保留子集 B 的体量"
  right_zh_hk: "條件概率：分母淨係保留子集 B 嘅體量"
  s1_en: "When evaluating unconditioned customer choices, your reference point is the entire sample space of all one thousand transactions."
  s1_zh: "在评估无条件的大盘顾客偏好时，你的基准参照系是包含全部一千笔订单的完整样本空间。"
  s1_zh_hk: "喺評估無條件嘅大盤顧客偏好嗰陣，你嘅基準參照系係包含全部一千筆訂單嘅完整樣本空間。"
  s2_en: "The moment you ask 'given iced drinks', the six hundred hot coffee orders are discarded. They cannot happen under this condition."
  s2_zh: "但一旦你提出“在点了冷饮的前提下”，另外六百笔热咖啡订单就被立即剔除，因为在此条件下它们绝不可能出现。"
  s2_zh_hk: "但一旦你提出「喺點咗凍飲嘅前提下」，另外六百筆熱咖啡訂單就被即刻剔除，因為喺呢個條件下佢哋絕唔可能出現。"
  s3_en: "The new universe consists solely of the four hundred iced drink tickets, and conditional probability counts what fraction of those four hundred included food."
  s3_zh: "全新的分析宇宙仅由这四百笔冷饮订单构成，条件概率所计算的，正是这四百笔订单中究竟有多大比例加购了餐点。"
  s3_zh_hk: "全新嘅分析宇宙淨係由呢四百筆凍飲訂單構成，條件概率所計算嘅，正正係呢四百筆訂單入面究竟有幾大比例加購咗餐點。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实操"
  kicker_zh_hk: "賬目實操"
  title_en: "Calculating conversion given iced orders"
  title_zh: "推演冷饮顾客的加购转化率"
  title_zh_hk: "推演凍飲顧客嘅加購轉化率"
  step1_en: "Identify new denominator: 400 Iced tickets"
  step1_zh: "锁定新分母：400 笔冷饮订单"
  step1_zh_hk: "鎖定新分母：400 筆凍飲訂單"
  step2_en: "Locate joint numerator: 120 combo orders"
  step2_zh: "提取分子交集：120 笔组合订单"
  step2_zh_hk: "提取分子交集：120 筆組合訂單"
  step3_en: "Calculate ratio: 120 / 400 = 0.30"
  step3_zh: "计算条件胜率：120 / 400 = 0.30"
  step3_zh_hk: "計算條件勝率：120 / 400 = 0.30"
  s1_en: "Look back at our Wan Chai ledger. Step one: identify the condition. Four hundred patrons purchased iced coffee; four hundred is our new denominator."
  s1_zh: "回到湾仔店的交易台账。第一步：锁定已知条件。四百位顾客购买了冷饮，四百就是计算的新分母。"
  s1_zh_hk: "返去灣仔舖嘅交易台賬。第一步：鎖定已知條件。四百位顧客買咗凍飲，四百就係計算嘅新分母。"
  s2_en: "Step two: identify how many tickets inside that specific group also ordered a pastry. The cross-tab shows exactly one hundred and twenty."
  s2_zh: "第二步：在这一特定客群中，找出有多少张小票同时加点了烘焙点心。交叉制表显示恰好是一百二十笔。"
  s2_zh_hk: "第二步：喺呢個特定客群入面，搵出有幾多張單同時加點咗烘焙點心。交叉制表顯示啱啱好係一百二十筆。"
  s3_en: "Step three: divide one hundred and twenty by four hundred. The conditional probability of buying a pastry given an iced drink is zero point three zero."
  s3_zh: "第三步：用一百二十除以四百。在已知购买冷饮的前提下，加购烘焙点心的条件概率是 0.30。"
  s3_zh_hk: "第三步：用一百二十除以四百。喺已知購買凍飲嘅前提下，加購烘焙點心嘅條件概率係 0.30。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Context resets the denominator"
  title_zh: "场景重置分母，条件决定胜率"
  title_zh_hk: "場景重置分母，條件決定勝率"
  q1_en: "How should managers interpret P(A|B)?"
  q1_zh: "管理者应如何正确解读条件概率 P(A|B)？"
  q1_zh_hk: "管理者應點樣正確解讀條件概率 P(A|B)？"
  q2_en: "Why is conditioning essential for precision?"
  q2_zh: "为什么条件思维是精细化运营的核心？"
  q2_zh_hk: "點解條件思維係精細化營運嘅核心？"
  s1_en: "Whenever you evaluate risk with prior business information, shrink your universe to condition B before calculating odds."
  s1_zh: "每当借助已知的商业背景信息评估风险时，在核算胜率前，务必先将分析全集缩减至条件 B 所在的范畴。"
  s1_zh_hk: "每當借助已知嘅商業背景資訊評估風險嗰陣，喺核算勝率之前，務必先將分析全集縮減至條件 B 所在嘅範疇。"
  s2_en: "Managing by unconditional averages leads to blunt operations; conditioning turns blunt averages into sharp, tailored segmentation."
  s2_zh: "依赖大盘无条件均值做管理会导致运营粗放，而条件概率能把粗放的均值淬炼成精准定制的客群分层策略。"
  s2_zh_hk: "依賴大盤無條件均值做管理會搞到營運粗放，而條件概率可以將粗放嘅均值淬煉成精準定製嘅客群分層策略。"
  s3_en: "For the iced-drink segment, use 400 as the denominator and 120 as the joint numerator: the relevant pastry rate is 30 percent."
  s3_zh: "针对冷饮客群，应以 400 为分母、120 为联合分子：相关的点心购买率就是 30%。"
  s3_zh_hk: "針對凍飲客群，應該用 400 做分母、120 做聯合分子：相關嘅點心購買率就係 30%。"