title_en: "Restricting the operational universe"
title_zh: "收窄视野：条件概率与样本空间缩减"
title_zh_hk: "收窄視野：條件概率與樣本空間縮減"
objective_en: "Define conditional probability P(A|B) as the probability of event A occurring given that event B has already occurred, demonstrate how condition B shrinks the denominator from the grand total to a restricted subset, and calculate conversion rates using loyalty app data."
objective_zh: "把条件概率 P(A|B) 定义为已知事件 B 发生的前提下事件 A 发生的概率，演示条件 B 如何将分母从全局样本缩减至特定子集，并运用会员 App 转化数据完成计算。"
objective_zh_hk: "將條件概率 P(A|B) 定義為已知事件 B 發生嘅前提下事件 A 發生嘅概率，演示條件 B 點樣將分母由全局樣本縮減至特定子集，並運用會員 App 轉化數據完成計算。"
