title_en: "Restricting the operational universe"
title_zh: "收窄视野：条件概率与样本空间缩减"
title_zh_hk: "收窄視野：條件概率與樣本空間縮減"
youtube:
  description_en: |
    Restricting the operational universe

    Conditional probability P(A|B) asks: given we already sit inside B, what is the chance of A? Shrink the denominator to condition B before you quote a rate.

    Among 1,000 tickets, 400 are iced. Of those, 120 also take a pastry. So P(pastry | iced) = 120 / 400 = 0.30 — not the unconditional pastry margin of 0.30 on the whole store, read inside the iced segment.

    Business Probability Foundations - Module 2 - Short 6 (conditional probability)
    If this helped, subscribe for the next short.
  description_zh: |
    缩小运营世界再算概率

    条件概率 P(A|B) 问的是：已经处在 B 里，A 的机会有多大？报价率之前，先把分母收缩到条件 B。

    1,000 笔里有 400 笔冷饮；其中 120 笔兼买甜点。所以 P(甜点|冷饮) = 120/400 = 0.30——在冷饮细分里读，而不是只看全店甜点边缘。

    商务概率基础 - 模块2 - 短片6（条件概率）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    收細營運世界再計概率

    條件概率 P(A|B) 問嘅係：已經處喺 B 入面，A 嘅機會有幾大？報價率之前，先將分母收縮到條件 B。

    1,000 筆入面有 400 筆凍飲；其中 120 筆兼買甜點。所以 P(甜點|凍飲) = 120/400 = 0.30——喺凍飲細分入面讀，而唔係淨係睇全店甜點邊緣。

    商務概率基礎 - 模組2 - 短片6（條件概率）
    覺得有用嘅話，訂閱下一集。
