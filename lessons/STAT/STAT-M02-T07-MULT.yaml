title_en: "The mechanics of bundling"
title_zh: "组合连带的演化机制：乘法法则"
title_zh_hk: "組合連帶嘅演化機制：乘法法則"
youtube:
  description_en: |
    The mechanics of bundling

    The general multiplication rule chains events: P(A and B) = P(B) × P(A|B). Use it when several milestones must succeed in sequence.

    Morning funnel: 40 percent order cold brew; given that, 30 percent add a croissant. Joint bundle rate = 0.40 × 0.30 = 0.12 — about 120 bundles per 1,000 customers. Multiplying raw margins alone is safe only after independence is proven.

    Business Probability Foundations - Module 2 - Short 7 (multiplication rule)
    If this helped, subscribe for the next short.
  description_zh: |
    捆绑漏斗的乘法机制

    一般乘法法则把事件串起来：P(A 且 B) = P(B) × P(A|B)。多个里程碑必须依次成功时用它。

    早市漏斗：40% 点冷萃；在此条件下 30% 加可颂。联合套餐率 = 0.40 × 0.30 = 0.12——约每 1,000 位顾客 120 份。只有证明相互独立后，才能直接把边缘概率相乘。

    商务概率基础 - 模块2 - 短片7（乘法法则）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    捆綁漏斗嘅乘法機制

    一般乘法法則將事件串起嚟：P(A 兼 B) = P(B) × P(A|B)。多個里程碑必須依次成功嗰陣用佢。

    早市漏斗：40% 點冷萃；喺呢個條件下 30% 加可頌。聯合套餐率 = 0.40 × 0.30 = 0.12——約每 1,000 位顧客 120 份。只有證明互相獨立之後，先可以直接將邊緣概率相乘。

    商務概率基礎 - 模組2 - 短片7（乘法法則）
    覺得有用嘅話，訂閱下一集。
