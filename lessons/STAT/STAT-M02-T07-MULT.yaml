quiz:
- id: Q1
  type: multiple_choice
  question_en: "How is the General Multiplication Rule derived from the definition of conditional probability?"
  question_zh: "一般乘法法则在数学上是如何从条件概率的定义中推导出来的？"
  question_zh_hk: "一般乘法法則喺數學上係點樣由條件概率嘅定義入面推導出嚟嘅？"
  options_en:
  - "A: By multiplying both sides of P(A|B) = P(A and B) / P(B) by P(B)."
  - "B: By subtracting the mean from the median."
  - "C: By setting the probability of condition B strictly to zero."
  - "D: By dividing total store revenue by the number of cash registers."
  options_zh:
  - "A: 将条件概率公式 P(A|B) = P(A 且 B) / P(B) 等号两边同时乘以 P(B)。"
  - "B: 从中位数中直接减去均值。"
  - "C: 将条件 B 的发生概率强制设定为严格等于零。"
  - "D: 用门店总销售额除以收银机的台数。"
  options_zh_hk:
  - "A: 將條件概率公式 P(A|B) = P(A 兼 B) / P(B) 等號兩邊同時乘以 P(B)。"
  - "B: 由中位數入面直接減去均值。"
  - "C: 將條件 B 嘅發生概率強制設定為嚴格等於零。"
  - "D: 用門市總銷售額除以收銀機嘅部數。"
  answer: A
  explanation_en: "Rearranging P(A|B) = P(A and B) / P(B) isolates the joint probability: P(A and B) = P(B) * P(A|B)."
  explanation_zh: "对公式 P(A|B) = P(A 且 B) / P(B) 两边同乘分母 P(B)，即可分离出联合概率：P(A 且 B) = P(B) * P(A|B)。"
  explanation_zh_hk: "對公式 P(A|B) = P(A 兼 B) / P(B) 兩邊同乘分母 P(B)，就可以分離出聯合概率：P(A 兼 B) = P(B) * P(A|B)。"
- id: Q2
  type: multiple_choice
  question_en: "If 40% of customers order iced drinks, and among those iced drink buyers, 30% add a bakery pastry, what percentage of all store orders will be an Iced Drink + Pastry bundle?"
  question_zh: "若全店有 40% 的顾客点冷饮，且在冷饮顾客中有 30% 会加购烘焙点心，那么全店总客单中冷饮加点心套餐的占比是多少？"
  question_zh_hk: "若全店有 40% 嘅顧客點凍飲，兼且喺凍飲顧客入面有 30% 會加購烘焙點心，噉全店總客單入面凍飲加點心套餐嘅佔比係幾多？"
  options_en:
  - "A: 70%"
  - "B: 12%"
  - "C: 30%"
  - "D: 10%"
  options_zh:
  - "A: 70%"
  - "B: 12%"
  - "C: 30%"
  - "D: 10%"
  options_zh_hk:
  - "A: 70%"
  - "B: 12%"
  - "C: 30%"
  - "D: 10%"
  answer: B
  explanation_en: "Using the multiplication rule: P(Iced and Pastry) = P(Iced) * P(Pastry|Iced) = 0.40 * 0.30 = 0.12 (12%)."
  explanation_zh: "运用乘法法则：P(冷饮 且 点心) = P(冷饮) * P(点心|冷饮) = 0.40 * 0.30 = 0.12（即 12%）。"
  explanation_zh_hk: "運用乘法法則：P(凍飲 兼 點心) = P(凍飲) * P(點心|凍飲) = 0.40 * 0.30 = 0.12（即 12%）。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Forecasting Challenge"
  kicker_en: "The Forecasting Challenge"
  kicker_zh: "预测挑战"
  kicker_zh_hk: "預測挑戰"
  title_en: "Forecasting the multi-step sale"
  title_zh: "如何科学预测两步连带转化？"
  title_zh_hk: "點樣科學預測兩步連帶轉化？"
  en: "A commercial manager wants to introduce a breakfast bundle: cold brew plus a warmed croissant. We know from pilot tests that forty percent of morning patrons order cold brew, and thirty percent of those cold brew drinkers accept the croissant upsell. How does the executive forecast the exact proportion of overall store tickets that will purchase the full combo?"
  zh: "商业经理想推早餐组合：冷萃加温热可颂。先导测试说，早间有 40% 进店顾客会买冷萃；在这些冷萃顾客里，又有 30% 接受加购可颂。那全店客单里，完整买下这套餐的比例，该怎么估？"
  zh_hk: "商業經理想推早餐組合：冷萃加溫熱牛角包。先導測試話，朝早有 40% 入舖顧客會買冷萃；喺呢啲冷萃顧客入面，又有 30% 接受加購牛角包。咁全店客單入面，完整買落呢個套餐嘅比例，應該點樣估？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The general multiplication rule"
  title_zh: "概率的一般乘法法则"
  title_zh_hk: "概率嘅一般乘法法則"
  formula: "P(A and B) = P(B) * P(A|B)"
  formula_tex: 'P(A\cap B) = P(B) \times P(A\mid B)'
  formula_zh: "P(A 且 B) = P(B) × P(A|B)"
  formula_zh_hk: "P(A 兼 B) = P(B) × P(A|B)"
  s1_en: "In conditional probability, we divided the joint overlap by condition B. By flipping that formula around, we get the General Multiplication Rule."
  s1_zh: "学条件概率时，我们用联合交集除以条件 B。把公式翻过来，就得到一般乘法法则。"
  s1_zh_hk: "學條件概率嗰陣，我哋用聯合交集除以條件 B。將公式翻轉過嚟，就得到一般乘法法則。"
  s2_en: "The probability that both event A and event B happen together equals the probability of condition B occurring first, multiplied by the conditional probability of A given that B has occurred."
  s2_zh: "事件 A 和 B 同时发生的概率，等于先发生条件 B 的概率，再乘以「在 B 已经发生的前提下，A 发生」的条件概率。"
  s2_zh_hk: "事件 A 同 B 同時發生嘅概率，等於先生條件 B 嘅概率，再乘以「喺 B 已經發生嘅前提下，A 發生」嘅條件概率。"
- id: funnel
  visual: two_column
  seconds: 36
  kicker: "The Mechanism"
  kicker_en: "The Mechanism"
  kicker_zh: "转化机理"
  kicker_zh_hk: "轉化機理"
  title_en: "The operational conversion funnel"
  title_zh: "业务转化漏斗的层层渗透"
  title_zh_hk: "業務轉化漏斗嘅層層滲透"
  left_en: "Stage 1: P(B) enters the gate"
  left_zh: "第一阶段：P(B) 入局初筛门槛"
  left_zh_hk: "第一階段：P(B) 入局初篩門檻"
  right_en: "Stage 2: P(A|B) completes the sale"
  right_zh: "第二阶段：P(A|B) 承接后续转化"
  right_zh_hk: "第二階段：P(A|B) 承接後續轉化"
  s1_en: "Think of the multiplication rule as a multi-stage retail funnel. To get a customer to buy the combo, they must pass through two successive gates."
  s1_zh: "把乘法法则想成多级零售漏斗。要买成组合套餐，顾客得连过两道门槛。"
  s1_zh_hk: "將乘法法則諗成多級零售漏斗。要買成組合套餐，顧客要連過兩道門檻。"
  s2_en: "First, forty percent of total patrons enter gate B by ordering an iced drink. The remaining sixty percent walk away without cold brew, ending their bundle journey."
  s2_zh: "第一道：全店有 40% 顾客点了冷萃，跨过门槛 B。另外 60% 没点冷萃，套餐旅程到此结束。"
  s2_zh_hk: "第一道：全店有 40% 顧客點咗冷萃，跨過門檻 B。另外 60% 冇點冷萃，套餐旅程到呢度完。"
  s3_en: "Second, among those surviving the first gate, only thirty percent accept the pastry. Multiplying shrinks the funnel at each step, yielding the true compound conversion."
  s3_zh: "第二道：过了第一关的人里，只有 30% 再接受点心。每乘一步，漏斗就收窄一层，得到真实的复合转化。"
  s3_zh_hk: "第二道：過咗第一關嘅人入面，淨係得 30% 再接受點心。每乘一步，漏斗就收窄一層，得到真實嘅複合轉化。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目推演"
  kicker_zh_hk: "賬目推演"
  title_en: "Forecasting Shop A bundle orders"
  title_zh: "测算A店组合套餐预估体量"
  title_zh_hk: "測算A舖組合套餐預估體量"
  step1_en: "P(B) = 0.40 cold brew"
  step1_zh: "P(B)=0.40 冷萃"
  step1_zh_hk: "P(B)=0.40 冷萃"
  step2_en: "P(A|B) = 0.30 upsell"
  step2_zh: "P(A|B)=0.30 加购"
  step2_zh_hk: "P(A|B)=0.30 加購"
  step3_en: "Joint = 0.40 × 0.30 = 0.12"
  step3_zh: "联合=0.40x0.30=0.12"
  step3_zh_hk: "聯合=0.40x0.30=0.12"
  s1_en: "Apply this to our Shop A morning forecast. Step one: out of 1,000 projected customers, forty percent will order an iced cold brew."
  s1_zh: "用到A店早间预测。第一步：预计一千位进店顾客里，有 40% 会点冰冷萃。"
  s1_zh_hk: "用到A舖朝早預測。第一步：預計一千位入舖顧客入面，有 40% 會點凍冷萃。"
  s2_en: "Step two: our barista suggestive selling data shows a conditional conversion rate of thirty percent among those specific buyers."
  s2_zh: "第二步：咖啡师连带推销数据显示，在这群人里，点心的条件转化率是 30%。"
  s2_zh_hk: "第二步：咖啡師連帶推銷數據顯示，喺呢班人入面，點心嘅條件轉化率係 30%。"
  s3_en: "Step three: multiply zero point four zero by zero point three zero. Exactly twelve percent of all store tickets—or one hundred and twenty bundles—will be sold."
  s3_zh: "第三步：0.40 乘 0.30。全店客单里刚好有 12%，也就是 120 套，会卖出去。"
  s3_zh_hk: "第三步：0.40 乘 0.30。全店客單入面啱啱有 12%，即係 120 套，會賣出街。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Multiply sequential odds down the funnel"
  title_zh: "顺沿转化漏斗，链式相乘定局"
  title_zh_hk: "順沿轉化漏斗，鏈式相乘定局"
  q1_en: "When multiply? → Sequential milestones in a funnel"
  q1_zh: "何时相乘？→ 漏斗里要依次过关的里程碑"
  q1_zh_hk: "幾時相乘？→ 漏斗入面要依次過關嘅里程碑"
  q2_en: "Margins alone? → Only if independence is proven"
  q2_zh: "能直接乘边缘吗？→ 唯有已证明相互独立"
  q2_zh_hk: "可唔可以直接乘邊緣？→ 唯有已證明互相獨立"
  s1_en: "When milestones must succeed in sequence, multiply the step probabilities down the chain."
  s1_zh: "多个里程碑必须依次成功时，把各步概率沿链条相乘。"
  s1_zh_hk: "多個里程碑必須依次成功嗰陣，將各步概率沿住鏈條相乘。"
  s2_en: "Never multiply unconditional margins unless independence is proven."
  s2_zh: "除非已经证明相互独立，否则不要直接乘无条件边缘。"
  s2_zh_hk: "除非已經證明互相獨立，否則唔好直接乘無條件邊緣。"
  s3_en: "Cold brew 40 percent times croissant 30 percent given that: 12 percent of tickets."
  s3_zh: "冷萃 40% 乘以该条件下可颂 30%：占全部客单的 12%。"
  s3_zh_hk: "冷萃 40% 乘以呢個條件下牛角包 30%：佔全部客單嘅 12%。"
