title_en: "The mechanics of bundling"
title_zh: "组合连带的演化机制：乘法法则"
title_zh_hk: "組合連帶嘅演化機制：乘法法則"
objective_en: "Derive the General Multiplication Rule P(A and B) = P(B) * P(A|B) from conditional probability, explain how sequential operational conversion funnels work, and apply the formula to forecast combination retail sales."
objective_zh: "由条件概率推导一般乘法法则 P(A 且 B) = P(B) * P(A|B)，阐释序列化业务转化漏斗的运作机理，并运用该公式预测零售组合套餐的实际销量。"
objective_zh_hk: "由條件概率推導一般乘法法則 P(A 兼 B) = P(B) * P(A|B)，闡釋序列化業務轉化漏斗嘅運作機理，並運用呢條公式預測零售組合套餐嘅實際銷量。"
