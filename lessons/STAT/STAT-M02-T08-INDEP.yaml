id: STAT-M02-T08-INDEP
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
duration_target_s: 166
title_en: "Are they really unrelated?"
title_zh: "它们真的毫无瓜葛吗？统计独立性"
title_zh_hk: "佢哋真係毫無瓜葛嗎？統計獨立性"
youtube:
  description_en: |
    Are they really unrelated?

    Independence means P(A|B) = P(A), or equivalently P(A and B) = P(A)×P(B). Different shelves do not prove independent choices.

    If the independence forecast says three percent joint demand, but the ledger shows 60 of 1,000 tickets take both decaf and oat milk (six percent), the conditional test failed. Plan inventory on the observed joint — not the independence shortcut.

    Business Probability Foundations - Module 2 - Short 8 (independence)
    If this helped, subscribe for the next short.
  description_zh: |
    它们真的互不相关吗？

    独立意味着 P(A|B) = P(A)，或等价地 P(A 且 B) = P(A)×P(B)。货架不同，并不证明选择独立。

    若独立假设给出 3% 的联合需求，但台账显示 1,000 笔里有 60 笔同时要低因与燕麦奶（6%），条件检验就失败了。备货按观测到的联合需求，而不是独立捷径。

    商务概率基础 - 模块2 - 短片8（独立性）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    佢哋真係互唔相關嗎？

    獨立意味住 P(A|B) = P(A)，或者等價噉 P(A 兼 B) = P(A)×P(B)。貨架唔同，唔等於證明選擇獨立。

    若獨立假設畀出 3% 嘅聯合需求，但台賬顯示 1,000 筆入面有 60 筆同時要低因同燕麥奶（6%），條件檢驗就失敗咗。備貨按觀測到嘅聯合需求，而唔係獨立捷徑。

    商務概率基礎 - 模組2 - 短片8（獨立性）
    覺得有用嘅話，訂閱下一集。
