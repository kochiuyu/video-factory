id: STAT-M02-T08-INDEP
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Are they really unrelated?"
title_zh: "它们真的毫无瓜葛吗？统计独立性"
title_zh_hk: "佢哋真係毫無瓜葛嗎？統計獨立性"
objective_en: "Define statistical independence mathematically using P(A|B) = P(A) and P(A and B) = P(A) * P(B), contrast casual assumptions of independence with data-driven dependence tests, and apply the concept to retail merchandising and stock allocation."
objective_zh: "通过 P(A|B) = P(A) 及 P(A 且 B) = P(A) * P(B) 在数学上界定统计独立性，对比盲目主观假定独立与基于数据的关联检验，并将其应用于零售品类连带及库存备货。"
objective_zh_hk: "透過 P(A|B) = P(A) 同 P(A 兼 B) = P(A) * P(B) 喺數學上界定統計獨立性，對比盲目主觀假定獨立與基於數據嘅關聯檢驗，並將其應用喺零售品類連帶同庫存備貨。"
