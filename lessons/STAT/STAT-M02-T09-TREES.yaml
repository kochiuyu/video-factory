title_en: "Mapping chain reactions"
title_zh: "绘制连锁反应：概率树与序贯决策"
title_zh_hk: "繪製連鎖反應：概率樹與序貫決策"
objective_en: "Construct and evaluate sequential probability trees, explain the two fundamental tree mechanics (multiplying branch probabilities along a path and summing across paths), and trace multi-stage cold-chain supply delivery risks."
objective_zh: "构建并评估序贯概率树，阐释树状图的两大运算基石（沿路径连乘分支概率，跨路径相加目标结局），并对多环节冷链物流的履约风险进行全程追踪。"
objective_zh_hk: "構建並評估序貫概率樹，闡釋樹狀圖嘅兩大運算基石（沿路徑連乘分支概率，跨路徑相加目標結局），並對多環節冷鏈物流嘅履約風險進行全程追蹤。"
