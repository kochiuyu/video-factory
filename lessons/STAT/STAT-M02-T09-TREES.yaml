youtube:
  description_en: |
    Mapping chain reactions

    A probability tree maps multi-stage operations. Multiply along a branch for a path probability; add mutually exclusive tip paths for an event total.

    Main bakery ledger: compliant batches 95 percent; given compliance, on-time delivery 90 percent. Clean-and-on-time path = 0.95 × 0.90 = 0.855. Complement disruption risk is 14.5 percent. Inspect each branch before you change the process.

    Business Probability Foundations - Module 2 - Short 9 (probability trees)
    If this helped, subscribe for the next short.
  description_zh: |
    画出连锁反应

    概率树刻画多阶段运营。沿分支相乘得路径概率；把互斥末梢相加得事件总和。

    主烘焙账本：批次达标 95%；在达标前提下准时送达 90%。完美准时路径 = 0.95 × 0.90 = 0.855。对立的中断风险是 14.5%。改流程前，先检查每一条分支。

    商务概率基础 - 模块2 - 短片9（概率树）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    畫出連鎖反應

    概率樹刻畫多階段營運。沿分支相乘得路徑概率；將互斥末梢相加得事件總和。

    主烘焙賬本：批次達標 95%；喺達標前提下準時送達 90%。完美準時路徑 = 0.95 × 0.90 = 0.855。對立嘅中斷風險係 14.5%。改流程之前，先檢查每一條分支。

    商務概率基礎 - 模組2 - 短片9（概率樹）
    覺得有用嘅話，訂閱下一集。
