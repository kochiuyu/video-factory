  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Weight by volume to find true risk"
  title_zh: "按业务份额加权，方得全局真实风险"
  title_zh_hk: "按業務份額加權，先得全局真實風險"
  q1_en: "Simple average of defect rates? → Wrong — weight by volume"
  q1_zh: "次品率简单平均？→ 错——要按体量加权"
  q1_zh_hk: "次品率簡單平均？→ 錯——要按體量加權"
  q2_en: "Executive control? → One network rate from weighted parts"
  q2_zh: "如何统筹？→ 用加权零件拼出全网率"
  q2_zh_hk: "點樣統籌？→ 用加權零件拼出全網率"
  s1_en: "Never average supplier defect rates unweighted. Weight each by volume share, then add."
  s1_zh: "不要对供应商次品率做未加权平均。按体量份额加权后再相加。"
  s1_zh_hk: "唔好對供應商次品率做未加權平均。按體量份額加權之後再相加。"
  s2_en: "Total probability gives one macro lens across a decentralized network."
  s2_zh: "全概率给分散网络提供一个统一的宏观镜头。"
  s2_zh_hk: "全概率畀分散網絡提供一個統一嘅宏觀鏡頭。"
  s3_en: "Shares yield 0.010 + 0.012 + 0.010 = 0.032 — a 3.2 percent network defect rate."
  s3_zh: "份额贡献 0.010 + 0.012 + 0.010 = 0.032——全网次品率 3.2%。"
  s3_zh_hk: "份額貢獻 0.010 + 0.012 + 0.010 = 0.032——全網次品率 3.2%。"
