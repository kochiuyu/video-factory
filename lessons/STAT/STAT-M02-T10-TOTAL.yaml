audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Stitching the network together"
title_zh: "全网缝合：全概率公式与风险汇总"
title_zh_hk: "全網縫合：全概率公式與風險匯總"
objective_en: "Define the Law of Total Probability as a weighted average across mutually exclusive and collectively exhaustive partitions, calculate network-wide defect rates across multiple regional bakery suppliers, and demonstrate how corporate headquarters aggregates operational risk."
objective_zh: "将全概率公式定义为跨越互斥且完全穷尽分区的加权平均数，计算多家区域烘焙供应商的全网综合次品率，并展示企业总部如何完成营运风险的全局汇总。"
objective_zh_hk: "將全概率公式定義為跨越互斥且完全窮盡分區嘅加權平均數，計算幾間區域烘焙供應商嘅全網綜合次品率，並展示企業總部點樣完成營運風險嘅全局匯總。"
