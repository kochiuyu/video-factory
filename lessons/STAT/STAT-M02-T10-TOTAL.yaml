title_en: "Stitching the network together"
title_zh: "全网缝合：全概率公式与风险汇总"
title_zh_hk: "全網縫合：全概率公式與風險匯總"
youtube:
  description_en: |
    Stitching the network together

    The law of total probability weights each conditional rate by how much volume that source carries, then adds the pieces. A simple average of supplier defect rates ignores uneven share.

    Weight each bakery by supply share: contributions 0.010 + 0.012 + 0.010 = 0.032. Network defect rate is 3.2 percent — the macro number executives can manage.

    Business Probability Foundations - Module 2 - Short 10 (total probability)
    If this helped, subscribe for the next short.
  description_zh: |
    把网络风险缝成一个数

    全概率定律按各来源的体量份额，给条件次品率加权再相加。对供应商次品率做简单平均，会忽略份额不均。

    按供货份额加权：0.010 + 0.012 + 0.010 = 0.032。全网次品率是 3.2%——高管可以统筹的宏观数字。

    商务概率基础 - 模块2 - 短片10（全概率）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    將網絡風險縫成一個數

    全概率定律按各來源嘅體量份額，為條件次品率加權再相加。對供應商次品率做簡單平均，會忽略份額不均。

    按供貨份額加權：0.010 + 0.012 + 0.010 = 0.032。全網次品率係 3.2%——高管可以統籌嘅宏觀數字。

    商務概率基礎 - 模組2 - 短片10（全概率）
    覺得有用嘅話，訂閱下一集。
