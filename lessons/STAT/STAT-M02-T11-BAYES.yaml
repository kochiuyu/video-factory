  title_zh_hk: "呼叫搶修之前，務必貝葉斯逆轉"
  q1_en: "90% sensor ≠ breakdown? → Blend alert with base rate"
  q1_zh: "90% 灵敏度≠真故障？→ 警报要结合基础率"
  q1_zh_hk: "90% 靈敏度≠真故障？→ 警報要結合基礎率"
  q2_en: "Act on alerts? → Use posterior + cost of action"
  q2_zh: "如何应对警报？→ 看后验，再加行动成本"
  q2_zh_hk: "點樣應對警報？→ 睇後驗，再加行動成本"
  s1_en: "Sensor accuracy is not the chance the machine is broken. Blend the alert with the base rate."
  s1_zh: "传感器灵敏度不是机器已坏的概率。要把警报和基础率合在一起。"
  s1_zh_hk: "傳感器靈敏度唔係機器已壞嘅概率。要將警報同基礎率合埋一齊。"
  s2_en: "Decide with the posterior plus safety steps and the cost of pausing service."
  s2_zh: "用后验来决策，并加上安全步骤与停业成本。"
  s2_zh_hk: "用後驗嚟決策，並加上安全步驟同停業成本。"
  s3_en: "Thirty-six of eighty-four alarms are real: about 42.9 percent, not 90 percent."
  s3_zh: "84 次警报里 36 次为真：约 42.9%，不是 90%。"
  s3_zh_hk: "84 次警報入面 36 次為真：約 42.9%，唔係 90%。"
