id: STAT-M02-T11-BAYES
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Inverting the diagnostic evidence"
title_zh: "证据逆转：贝叶斯法则与设备故障排查"
title_zh_hk: "證據逆轉：貝葉斯法則與設備故障排查"
objective_en: "Derive Bayes' Rule as the inversion of conditional probability, distinguish prior belief from posterior probability, and apply Bayesian updating to diagnose true machine breakdowns following an automated IoT sensor alert."
objective_zh: "把贝叶斯法则推导为条件概率的逆转运算，区分先验信念与后验概率，并运用贝叶斯更新在物联网传感器报警后诊断机器的真实故障率。"
objective_zh_hk: "將貝葉斯法則推導為條件概率嘅逆轉運算，區分先驗信念與後驗概率，並運用貝葉斯更新喺物聯網傳感器報警之後診斷機器嘅真實故障率。"
