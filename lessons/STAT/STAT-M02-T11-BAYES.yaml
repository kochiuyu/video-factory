title_en: "Inverting the diagnostic evidence"
title_zh: "证据逆转：贝叶斯法则与设备故障排查"
title_zh_hk: "證據逆轉：貝葉斯法則與設備故障排查"
youtube:
  description_en: |
    Inverting the diagnostic evidence

    Bayes' rule flips evidence into belief: blend the prior base rate with how the alert behaves when the machine is broken versus healthy.

    On 1,000 Shop E hours, 40 are true failures (prior 4%). At 90 percent sensitivity the sensor fires 36 true alerts; false alerts swell the total to 84. Posterior P(Broken | Alert) = 36/84 ≈ 42.9 percent — not 90 percent. Act with the posterior plus cost and safety procedures.

    Business Probability Foundations - Module 2 - Short 11 (Bayes)
    If this helped, subscribe for the next short.
  description_zh: |
    把诊断证据倒过来读

    贝叶斯法则把证据翻成信念：把先验基础率，与机器故障/正常时警报如何表现结合起来。

    E店 1,000 工时里有 40 次真故障（先验 4%）。90% 灵敏度下有 36 次真报警；误报把警报总数抬到 84。后验 P(故障|警报) = 36/84 ≈ 42.9%——不是 90%。行动要看后验，再加成本与安全流程。

    商务概率基础 - 模块2 - 短片11（贝叶斯）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    將診斷證據倒轉嚟讀

    貝葉斯法則將證據翻成信念：將先驗基礎率，同機器故障／正常時警報點樣表現結合起嚟。

    E舖 1,000 工時入面有 40 次真故障（先驗 4%）。90% 靈敏度下有 36 次真報警；誤報將警報總數抬到 84。後驗 P(故障|警報) = 36/84 ≈ 42.9%——唔係 90%。行動要睇後驗，再加成本同安全流程。

    商務概率基礎 - 模組2 - 短片11（貝葉斯）
    覺得有用嘅話，訂閱下一集。
