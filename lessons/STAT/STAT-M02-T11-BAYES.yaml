  s1_en: "Track 1,000 operating hours on our Shop E machine. Historically, only 40 hours suffer real boiler failure (a 4% prior rate). With 90% sensor sensitivity, it sounds 36 true alarms."
  s1_zh: "追踪E店这台机一千个运转工时。历史上只有 40 个工时真故障（先验 4%）。按 90% 灵敏度，会发出 36 次真报警。"
  s1_zh_hk: "追蹤E舖呢部機一千個運轉工時。歷史上淨係得 40 個工時真故障（先驗 4%）。按 90% 靈敏度，佢會發出 36 次真報警。"
  s2_en: "The remaining 960 hours are completely healthy. But the sensor has a 5% false positive rate: 5% of 960 healthy hours generates 48 false alarms."
  s2_zh: "其余 960 个工时完全正常。但传感器有 5% 误报率：960 的 5% 会凭空造出 48 次假警报。"
  s2_zh_hk: "其餘 960 個工時完全正常。但傳感器有 5% 誤報率：960 嘅 5% 會憑空整出 48 次假警報出嚟。"
  s3_en: "Total alarms buzzing on the wall: 36 plus 48 equals 84. When the alarm sounds, the probability that the machine is actually broken is 36 divided by 84—just 42.9%."
  s3_zh: "墙上警报一共响 36 加 48，等于 84 次。警报响起时，机器真坏的概率是 36 除以 84——只有约 42.9%。"
  s3_zh_hk: "牆上警報一共響 36 加 48，等於 84 次。警報響起嗰陣，部機真壞嘅概率係 36 除以 84——淨係約 42.9%。"
- id: takeaway
  visual: takeaway
