- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Base Rate Fallacy"
  title_zh: "基准率谬误的心理机制"
  title_zh_hk: "基準率謬誤嘅心理機制"
  formula: "Tiny Base Rate * Huge Population >> High Test Accuracy"
  formula_tex: 'P(F\mid +) = \frac{P(+\mid F)P(F)}{P(+\mid F)P(F)+P(+\mid F^c)P(F^c)}'
  formula_zh: "微小的基准率 × 庞大的正常总体 >> 看似微弱的误报率"
  formula_zh_hk: "微小嘅基準率 × 龐大嘅正常總體 >> 睇落微弱嘅誤報率"
  s1_en: "The Base Rate Fallacy is the powerful cognitive blindspot where human intuition fixates on diagnostic test accuracy and ignores how rare the event is in the baseline population."
  s1_zh: "基准率谬误是一种常见认知盲区：直觉爱盯着检测工具有多准，却忽略目标事件在总体里有多罕见。"
  s1_zh_hk: "基準率謬誤係一種常見認知盲區：直覺鍾意盯住檢測工具有幾準，卻忽略目標事件喺總體入面有幾罕見。"
  s2_en: "When an operational disaster or criminal fraud is extremely rare, the tiny percentage of false alarms generated by the massive healthy majority will dwarf the real culprits."
  s2_zh: "当运营灾难或欺诈极为罕见时，哪怕只有百分之一的轻微误报，乘上海量正常群体，假警报也会在数量上压过真警报。"
  s2_zh_hk: "當營運災難或者欺詐極之罕見嗰陣，就算淨係得百分之一嘅輕微誤報，乘上海量正常群體，假警報亦會喺數量上壓過真警報。"
- id: imbalance
  visual: two_column
  seconds: 36
  kicker: "The Numbers Mismatch"
  kicker_en: "The Numbers Mismatch"
  kicker_zh: "体量不对称"
  kicker_zh_hk: "體量唔對稱"
  title_en: "Tiny fraction of huge beats large fraction of tiny"
  title_zh: "庞大总体的微弱误判，击穿罕见事件的精准拦截"
  title_zh_hk: "龐大總體嘅微弱誤判，擊穿罕見事件嘅精準攔截"
  left_en: "Real Frauds: 10 orders (0.1% pool)"
  left_zh: "真实欺诈：仅 10 笔（全盘占比 0.1%）"
  left_zh_hk: "真實欺詐：得 10 筆（全盤佔比 0.1%）"
  right_en: "Honest Orders: 9,990 orders (99.9% pool)"
  right_zh: "正常顾客：高达 9,990 笔（全盘占比 99.9%）"
  right_zh_hk: "正常顧客：高達 9,990 筆（全盤佔比 99.9%）"
  s1_en: "Consider the scale of the two opposing groups. Real fraudsters account for only one out of every one thousand digital orders."
  s1_zh: "先看两群人的体量反差。真正的欺诈者，可能每一千笔数字订单里只有一笔。"
  s1_zh_hk: "先睇兩班人體量反差。真正嘅欺詐者，可能每一千筆數碼訂單入面淨係得一筆。"
  s2_en: "The honest population is huge: nine thousand nine hundred and ninety orders. A one-percent false positive rate applied to that massive army produces nearly one hundred innocent victims."
  s2_zh: "正常顾客群极大：足足九千九百九十笔。只要对这庞大群体误判百分之一，就会造出近一百个被误伤的无辜单。"
  s2_zh_hk: "正常顧客群極大：足足九千九百九十筆。只要對呢個龐大群體誤判百分之一，就會整出近一百個被誤傷嘅無辜單。"
  s3_en: "A tiny slice of a massive mountain is still vastly bigger than almost the entirety of a tiny pebble."
  s3_zh: "大山上切下一小撮碎石，体量也远大过整颗本来就很小的砂砾。"
  s3_zh_hk: "大山上面切落一小撮碎石，體量都遠大過成粒本來就好細嘅沙石。"
