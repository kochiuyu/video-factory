title_en: "The rare disaster trap"
title_zh: "罕见灾难陷阱：基准率谬误"
title_zh_hk: "罕見災難陷阱：基準率謬誤"
youtube:
  description_en: |
    The rare disaster trap

    The base-rate fallacy hits when the event is rare. Even a decent screen can flood you with false flags that outnumber true ones.

    If 10 of 110 flags are genuine fraud, the posterior fraud probability is about 9.1 percent; the other 100 flags are false positives. Treat a flag as evidence, not proof — design the response with verified risk, customer impact, and approved controls.

    Business Probability Foundations - Module 2 - Short 12 (base rate)
    If this helped, subscribe for the next short.
  description_zh: |
    低频灾难陷阱

    事件很罕见时，基础率谬误最伤人。即便筛查还不错，误报也可能远多于真报。

    若 110 次标记里只有 10 次是真实欺诈，后验欺诈概率约 9.1%；其余 100 次是误报。把标记当证据而非铁证——响应要结合核实风险、顾客影响与批准的管控。

    商务概率基础 - 模块2 - 短片12（基础率）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    低頻災難陷阱

    事件好罕見嗰陣，基礎率謬誤最傷人。即便篩查都唔錯，誤報都可能遠多過真報。

    若 110 次標記入面淨係得 10 次係真實欺詐，後驗欺詐概率約 9.1%；其餘 100 次係誤報。將標記當證據而唔係鐵證——響應要結合核實風險、顧客影響同批准嘅管控。

    商務概率基礎 - 模組2 - 短片12（基礎率）
    覺得有用嘅話，訂閱下一集。
