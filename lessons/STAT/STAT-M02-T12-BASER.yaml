title_en: "The rare disaster trap"
title_zh: "罕见灾难陷阱：基准率谬误"
title_zh_hk: "罕見災難陷阱：基準率謬誤"
objective_en: "Define the Base Rate Fallacy in business operations, explain why extremely low prior probabilities cause high-accuracy automated detection systems to produce mostly false alarms, and evaluate mobile payment fraud detection alerts."
objective_zh: "在商业运营中界定基准率谬误，解释为什么极低的先验基础概率会导致高精度的自动化拦截系统依然产生大量的虚假警报，并对移动支付反欺诈预警系统进行量化评估。"
objective_zh_hk: "喺商業營運入面界定基準率謬誤，解釋點解極低嘅先驗基礎概率會搞到高精度嘅自動化攔截系統依然產生大量嘅虛假警報，並對手機支付反欺詐預警系統進行量化評估。"
