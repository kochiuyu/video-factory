quiz:
- id: Q1
  type: multiple_choice
  question_en: "What cognitive error defines the Base Rate Fallacy among business managers?"
  question_zh: "商业管理者常犯的“基准率谬误”究竟是指哪种典型的认知偏差？"
  question_zh_hk: "商業管理者常犯嘅「基準率謬誤」究竟係指邊種典型嘅認知偏差？"
  options_en:
  - "A: Overemphasizing high diagnostic test accuracy while completely ignoring how rarely the underlying condition naturally occurs in the population."
  - "B: Forgetting to charge local sales tax on corporate invoice payments."
  - "C: Believing that mobile payment apps operate free of electricity costs."
  - "D: Demanding that bank fraud investigators inspect 100% of all cash bills."
  options_zh:
  - "A: 过度聚焦于检测工具本身的高准确度，而彻底忽略了该目标事件在总体环境中发生概率原本就极低的事实。"
  - "B: 在向企业客户开具付款发票时忘记申报和计提销售税费。"
  - "C: 误以为移动端电子支付应用在运行过程中完全不需要消耗电力成本。"
  - "D: 强制要求银行反欺诈调查员对每一张流通的实体纸币进行全量人工查验。"
  options_zh_hk:
  - "A: 過度聚焦喺檢測工具本身嘅高準確度，而徹底忽視咗嗰個目標事件喺總體環境入面發生概率原本就極之低嘅事實。"
  - "B: 喺向企業客戶開具付款發票嗰陣唔記得申報同計提銷售稅費。"
  - "C: 誤以為手機端電子支付應用喺運行過程入面完全唔需要消耗電力成本。"
  - "D: 強制要求銀行反欺詐調查員對每一張流通嘅實體紙幣進行全量人工查驗。"
  answer: A
  explanation_en: "The Base Rate Fallacy occurs when people evaluate conditional probability by looking only at test sensitivity, forgetting that an extremely low base rate anchors the true odds near zero."
  explanation_zh: "基准率谬误发生在决策者只看测试工具的高灵敏度，而忘记了极低的基准发生率会将真实的后验胜率牢牢按在低位。"
  explanation_zh_hk: "基準率謬誤發生喺決策者淨係睇測試工具嘅高靈敏度，而唔記得咗極低嘅基準發生率會將真實嘅後驗勝率牢牢禁喺低位。"
- id: Q2
  type: multiple_choice
  question_en: "Out of 10,000 mobile app coffee transactions, only 10 are fraudulent (0.1% base rate). A security algorithm flags all 10 fraudulent orders and produces 100 false flags among the 9,990 legitimate orders. When a customer order is flagged, what is the probability it is actual fraud?"
  question_zh: "在一万笔移动 App 咖啡订单中，仅有 10 笔属于真实信用卡欺诈（基准率 0.1%）。一套安全风控算法识别出全部 10 笔真实欺诈订单，同时在 9,990 笔正常订单中产生了 100 次误报。当顾客订单被系统拦截警报时，它属于真实欺诈的概率是多少？"
  question_zh_hk: "喺一萬筆手機 App 咖啡訂單入面，淨係得 10 筆屬於真實信用卡欺詐（基準率 0.1%）。一套安全風控算法識別出全部 10 筆真實欺詐訂單，同時喺 9,990 筆正常訂單入面產生咗 100 次誤報。當顧客訂單被系統攔截警報嗰陣，佢屬於真實欺詐嘅概率係幾多？"
  options_en:
  - "A: 10 / 110 ≈ 9.1%"
  - "B: 99.0%"
  - "C: 10 / 10,000 = 0.1%"
  - "D: 50.0%"
  options_zh:
  - "A: 10 / 110 ≈ 9.1%"
  - "B: 99.0%"
  - "C: 10 / 10,000 = 0.1%"
  - "D: 50.0%"
  options_zh_hk:
  - "A: 10 / 110 ≈ 9.1%"
  - "B: 99.0%"
  - "C: 10 / 10,000 = 0.1%"
  - "D: 50.0%"
  answer: A
  explanation_en: "Total flags = 10 true frauds + 100 false alarms = 110. The posterior probability of genuine fraud is 10 / 110 ≈ 9.1%."
  explanation_zh: "系统拦截报警总数 = 10 次真实欺诈 + 100 次误报 = 110 次。真正欺诈的后验概率为 10 / 110 ≈ 9.1%。"
  explanation_zh_hk: "系統攔截報警總數 = 10 次真實欺詐 + 100 次誤報 = 110 次。真正欺詐嘅後驗概率為 10 / 110 ≈ 9.1%。"
