- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Base Rate Fallacy"
  title_zh: "基准率谬误的心理机制"
  title_zh_hk: "基準率謬誤嘅心理機制"
  formula: "Tiny Base Rate * Huge Population >> High Test Accuracy"
  formula_tex: 'P(F\mid +) = \frac{P(+\mid F)P(F)}{P(+\mid F)P(F)+P(+\mid F^c)P(F^c)}'
  formula_zh: "微小的基准率 × 庞大的正常总体 >> 看似微弱的误报率"
  formula_zh_hk: "微小嘅基準率 × 龐大嘅正常總體 >> 睇落微弱嘅誤報率"
  s1_en: "The Base Rate Fallacy is the powerful cognitive blindspot where human intuition fixates on diagnostic test accuracy and ignores how rare the event is in the baseline population."
  s1_zh: "基准率谬误是一种极其普遍的认知盲区：人类的直觉本能往往过分迷信检测工具的高指标，却彻底忽视了目标事件在底层总体中极度罕见的客观基准。"
  s1_zh_hk: "基準率謬誤係一種極之普遍嘅認知盲區：人類嘅直覺本能往往過分迷信檢測工具嘅高指標，卻徹底忽視咗目標事件喺底層總體入面極度罕見嘅客觀基準。"
  s2_en: "When an operational disaster or criminal fraud is extremely rare, the tiny percentage of false alarms generated by the massive healthy majority will dwarf the real culprits."
  s2_zh: "当某种运营灾难或违规欺诈极为罕见时，哪怕只有百分之一的轻微误报率，乘上海量的正常群体基数后，产生的假警报也会以压倒性优势碾压真实警报。"
  s2_zh_hk: "當某種營運災難或者違規欺詐極之罕見嗰陣，就算淨係得百分之一嘅輕微誤報率，乘上海量嘅正常群體基數之後，產生嘅假警報亦都會以壓倒性優勢碾壓真實警報。"
- id: imbalance
  visual: two_column
  seconds: 36
  kicker: "The Numbers Mismatch"
  kicker_en: "The Numbers Mismatch"
  kicker_zh: "体量不对称"
  kicker_zh_hk: "體量唔對稱"
  title_en: "Tiny fraction of huge beats large fraction of tiny"
  title_zh: "庞大总体的微弱误判，击穿罕见事件的精准拦截"
  title_zh_hk: "龐大總體嘅微弱誤判，擊穿罕見事件嘅精準攔截"
  left_en: "Real Frauds: 10 orders (0.1% pool)"
  left_zh: "真实欺诈：仅 10 笔（全盘占比 0.1%）"
  left_zh_hk: "真實欺詐：得 10 筆（全盤佔比 0.1%）"
  right_en: "Honest Orders: 9,990 orders (99.9% pool)"
  right_zh: "正常顾客：高达 9,990 笔（全盘占比 99.9%）"
  right_zh_hk: "正常顧客：高達 9,990 筆（全盤佔比 99.9%）"
  s1_en: "Consider the scale of the two opposing groups. Real fraudsters account for only one out of every one thousand digital orders."
  s1_zh: "看看这两个对抗群体的实际体量反差。真正的欺诈者在数字化点单中每一千笔里可能只有寥寥一笔。"
  s1_zh_hk: "睇吓呢兩個對抗群體嘅實際體量反差。真正嘅欺詐者喺數碼化點單入面每一千筆入面可能淨係得寥寥一筆。"
  s2_en: "The honest population is huge: nine thousand nine hundred and ninety orders. A one-percent false positive rate applied to that massive army produces nearly one hundred innocent victims."
  s2_zh: "而合法合规的正常顾客群极为庞大：足足有九千九百九十笔。只要对这个庞大群体产生百分之一的误判，就会制造出近百名被误伤的无辜受害者。"
  s2_zh_hk: "而合法合規嘅正常顧客群極之龐大：足足有九千九百九十筆。只要對呢個龐大群體產生百分之一嘅誤判，就會製造出近百名被誤傷嘅無辜受害者。"
  s3_en: "A tiny slice of a massive mountain is still vastly bigger than almost the entirety of a tiny pebble."
  s3_zh: "万丈高山上切下的一小撮碎石，其体量也远远大过整整一颗原本就微不足道的砂砾。"
  s3_zh_hk: "萬丈高山上面切落嚟嘅一小撮碎石，其體量亦都遠遠大過成粒原本就微不足道嘅沙石。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实核"
  kicker_zh_hk: "賬目實核"
  title_en: "Auditing 10,000 mobile transactions"
  title_zh: "审计一万笔移动支付拦截台账"
  title_zh_hk: "審計一萬筆手機支付攔截台賬"
  step1_en: "Frauds: 10 * 99% accuracy = 10 caught"
  step1_zh: "真欺诈：10 笔；全部 10 笔被标记"
  step1_zh_hk: "真欺詐：10 筆；全部 10 筆被標記"
  step2_en: "Honest: 9,990 * 1% error = 100 false alarms"
  step2_zh: "正常订单：9,990 笔；其中 100 笔被误报"
  step2_zh_hk: "正常訂單：9,990 筆；其中 100 筆被誤報"
  step3_en: "Precision: 10 / 110 = 9.1% actual fraud rate"
  step3_zh: "真实有效报警率：10 / 110 ≈ 仅 9.1% 是真欺诈"
  step3_zh_hk: "真實有效報警率：10 / 110 ≈ 得 9.1% 係真欺詐"
  s1_en: "Audit our 10,000-order app transaction log. Exactly ten transactions are real fraud. In this ledger, the security algorithm flags all ten fraudulent orders."
  s1_zh: "审查一万笔手机 App 交易台账。其中恰好有 10 笔是真实盗刷。在这份台账中，系统将 10 笔真实欺诈订单全部标记出来。"
  s1_zh_hk: "審查一萬筆手機 App 交易台賬。其中啱啱好有 10 筆係真實盜刷。喺呢份台賬入面，系統將 10 筆真實欺詐訂單全部標記出嚟。"
  s2_en: "Now look at the 9,990 honest customers. Among the 9,990 legitimate orders, the algorithm produces 100 false flags, a false-positive rate of about 1.0 percent."
  s2_zh: "再看剩下的 9,990 笔正常客单。在 9,990 笔正常订单中，系统产生 100 次误报，对应约 1.0% 的假阳性率。"
  s2_zh_hk: "再睇淨低嘅 9,990 筆正常客單。喺 9,990 筆正常訂單入面，系統產生 100 次誤報，對應大約 1.0% 嘅假陽性率。"
  s3_en: "Add them up: 110 red flags ring in the security dashboard. Divide 10 by 110: only nine point one percent of flagged orders are genuine fraud. Over ninety percent are innocent patrons being turned away."
  s3_zh: "加在一起：风控后台总共弹出了 110 次拦截报警。用 10 除以 110：被拦截的订单中真正有罪的仅占 9.1%。超过 90% 的被拦截者全是被粗暴拒之门外的无辜熟客。"
  s3_zh_hk: "加埋一齊：風控後台總共彈出咗 110 次攔截報警。用 10 除以 110：被攔截嘅訂單入面真正有罪嘅淨係得 9.1%。超過 90% 嘅被攔截者全係被粗暴拒之門外嘅無辜熟客。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Check the base rate before setting hard barriers"
  title_zh: "筑设硬性阻拦前，先算底层基准率"
  title_zh_hk: "築設硬性阻攔前，先計底層基準率"
  q1_en: "Why do automated screens fail in low-frequency events?"
  q1_zh: "为什么面对低频事件，自动化拦截机制极易失效？"
  q1_zh_hk: "點解面對低頻事件，自動化攔截機制極易失效？"
  q2_en: "How should managers design alert responses?"
  q2_zh: "管理者在设计警报响应时应采取怎样的审慎分级？"
  q2_zh_hk: "管理者喺設計警報響應嗰陣應採取點樣嘅審慎分級？"
  s1_en: "A low base rate can make false flags outnumber true flags, depending on the screen’s sensitivity and false-positive rate; calculate the posterior rate from the actual alert counts."
  s1_zh: "较低的基准率可能使误报多于真警报，具体取决于系统灵敏度和假阳性率；应根据实际警报数量计算后验概率。"
  s1_zh_hk: "較低嘅基準率可能令誤報多過真警報，實際情況取決於系統靈敏度同假陽性率；應該按實際警報數量計算後驗概率。"
  s2_en: "Treat a flag as evidence rather than proof. Design the response by combining the posterior fraud probability with verified risk, customer impact, and the organization’s approved controls."
  s2_zh: "应把警报视为证据而非定论，并结合后验欺诈概率、已核实风险、顾客影响及组织批准的控制措施来设计响应。"
  s2_zh_hk: "應該將警報視為證據而唔係定論，並結合後驗欺詐概率、已核實風險、顧客影響同組織批准嘅控制措施嚟設計回應。"
  s3_en: "For this ledger, 10 of 110 flags are genuine fraud, so the posterior fraud probability is about 9.1 percent; the remaining 100 flags are false positives."
  s3_zh: "在这份台账中，110 次警报里有 10 次是真实欺诈，因此后验欺诈概率约为 9.1%；其余 100 次是假阳性误报。"
  s3_zh_hk: "喺呢份台賬入面，110 次警報有 10 次係真實欺詐，所以後驗欺詐概率大約係 9.1%；其餘 100 次係假陽性誤報。"