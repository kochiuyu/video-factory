  s1_en: "Audit our 10,000-order app transaction log. Exactly ten transactions are real fraud. In this ledger, the security algorithm flags all ten fraudulent orders."
  s1_zh: "审一万笔 App 交易账。刚好有 10 笔是真盗刷。这份账里，系统把 10 笔真欺诈全部标了出来。"
  s1_zh_hk: "審一萬筆 App 交易賬。啱啱有 10 筆係真盜刷。呢份賬入面，系統將 10 筆真欺詐全部標咗出嚟。"
  s2_en: "Now look at the 9,990 honest customers. Among the 9,990 legitimate orders, the algorithm produces 100 false flags, a false-positive rate of about 1.0 percent."
  s2_zh: "再看剩下的 9,990 笔正常单。其中系统误报 100 次，假阳性大约 1.0%。"
  s2_zh_hk: "再睇淨低嘅 9,990 筆正常單。其中系統誤報 100 次，假陽性大約 1.0%。"
  s3_en: "Add them up: 110 red flags ring in the security dashboard. Divide 10 by 110: only nine point one percent of flagged orders are genuine fraud. Over ninety percent are innocent patrons being turned away."
  s3_zh: "加起来：风控后台一共弹出 110 次拦截。10 除以 110：被拦的单里真正有问题的只有约 9.1%。超过 90% 是被拦在门外的无辜熟客。"
  s3_zh_hk: "加埋：風控後台一共彈出 110 次攔截。10 除以 110：被攔嘅單入面真正有問題嘅淨係約 9.1%。超過 90% 係被攔喺門外嘅無辜熟客。"
