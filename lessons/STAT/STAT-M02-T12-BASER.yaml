  q1_zh_hk: "低頻篩查點解失效？→ 誤報可以多過真報"
  q2_en: "Design alerts? → Treat a flag as evidence, not proof"
  q2_zh: "如何设计响应？→ 标记是证据，不是铁证"
  q2_zh_hk: "點樣設計響應？→ 標記係證據，唔係鐵證"
  s1_en: "A low base rate can make false flags outnumber true ones. Compute the posterior from alert counts."
  s1_zh: "基础率很低时，误报可以多于真报。用警报计数算后验。"
  s1_zh_hk: "基礎率好低嗰陣，誤報可以多過真報。用警報計數計後驗。"
  s2_en: "A flag is evidence, not proof. Pair the posterior with verified risk and approved controls."
  s2_zh: "标记是证据，不是铁证。后验要配合核实风险与批准的管控。"
  s2_zh_hk: "標記係證據，唔係鐵證。後驗要配合核實風險同批准嘅管控。"
  s3_en: "Ten of 110 flags are real fraud — about 9.1 percent posterior."
  s3_zh: "110 次标记里 10 次为真欺诈——后验约 9.1%。"
  s3_zh_hk: "110 次標記入面 10 次為真欺詐——後驗約 9.1%。"
