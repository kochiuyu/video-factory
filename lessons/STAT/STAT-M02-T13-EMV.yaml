id: STAT-M02-T13-EMV
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: "Pricing the gamble"
title_zh: "给风险定价：预期货币价值与理性博弈"
title_zh_hk: "幫風險定價：預期貨幣價值與理性博弈"
objective_en: "Define Expected Monetary Value (EMV) as the probability-weighted sum of financial payoffs, construct decision payoff tables, and evaluate commercial warranty decisions under uncertainty."
objective_zh: "把预期货币价值（EMV）定义为以概率加权的财务收益之和，构建决策收益矩阵表，并在不确定性下理性评估商业设备保修决策。"
objective_zh_hk: "將預期貨幣價值（EMV）定義為以概率加權嘅財務收益之和，構建決策收益矩陣表，並喺不確定性之下理性評估商業設備保養決策。"
