quiz:
- id: Q1
  type: multiple_choice
  question_en: "How is the Expected Monetary Value (EMV) of a commercial operational decision calculated?"
  question_zh: "商业运营决策中的预期货币价值（EMV）在数学上是如何计算的？"
  question_zh_hk: "商業營運決策入面嘅預期貨幣價值（EMV）喺數學上係點樣計算嘅？"
  options_en:
  - "A: By multiplying each possible financial payoff by its associated probability and summing all products."
  - "B: By subtracting total store expenses from total annual tax refunds."
  - "C: By averaging the best-case profit and the worst-case loss equally."
  - "D: By selecting the outcome with the highest probability and ignoring its dollar value."
  options_zh:
  - "A: 将每种可能结果的财务收益与其对应的发生概率相乘，并将所有乘积加总求和。"
  - "B: 从全店年度总支出中减去全年的退税补贴总额。"
  - "C: 将最佳情景的最高利润与最差情景的最大亏损直接简单相加除以二。"
  - "D: 仅选取发生概率最高的那种情况，完全忽略其实际对应的金额大小。"
  options_zh_hk:
  - "A: 將每種可能結果嘅財務收益同佢對應嘅發生概率相乘，並將所有乘積加總求和。"
  - "B: 由全舖年度總支出入面減去全年嘅退稅補貼總額。"
  - "C: 將最佳情景嘅最高利潤同最差情景嘅最大虧損直接簡單相加除以二。"
  - "D: 淨係選取發生概率最高嘅嗰種情況，完全忽略其實際對應嘅金額大細。"
  answer: A
  explanation_en: "EMV = Sum of [ Payoff_i * P(Payoff_i) ]. It represents the long-run average monetary outcome if the exact same decision were repeated thousands of times."
  explanation_zh: "EMV = ∑ [ 收益_i × P(收益_i) ]。它代表了如果在完全相同的商业场景下重复博弈成千上万次时，长期平均能够获得的期望资金损益。"
  explanation_zh_hk: "EMV = ∑ [ 收益_i × P(收益_i) ]。佢代表咗如果喺完全相同嘅商業場景之下重複博弈成千上萬次嗰陣，長期平均能夠獲得嘅期望資金損益。"
- id: Q2
  type: multiple_choice
  question_en: "An espresso machine repair costs $10,000 with a 5% failure probability, or $0 with 95% probability. An extended warranty costs a guaranteed $600 per machine. Which option minimizes expected financial cost?"
  question_zh: "一台意式浓缩咖啡机有 5% 的概率发生严重故障（维修需 10,000 元），有 95% 的概率运转正常（维修费 0 元）。厂家延保合同定价为每台确定的 600 元。哪种策略能将期望财务成本降至最低？"
  question_zh_hk: "一部意式濃縮咖啡機有 5% 嘅概率發生嚴重故障（維修需要 10,000 蚊），有 95% 嘅概率運轉正常（維修費 0 蚊）。廠家延保合約定價為每部確定嘅 600 蚊。邊種策略可以將期望財務成本降至最低？"
  options_en:
  - "A: Self-insuring (uninsured repair), because its expected cost of $500 is lower than the $600 warranty premium."
  - "B: Buying the warranty, because $600 is lower than the catastrophic $10,000 bill."
  - "C: Buying two machines so that expected cost automatically doubles."
  - "D: Both options produce identical financial expected losses of $6,000."
  options_zh:
  - "A: 选择自担风险（自费维修），因为其期望成本仅为 500 元，低于延保的 600 元刚性保费。"
  - "B: 购买延保，因为 600 元远低于一万元的灾难性账单。"
  - "C: 立即增购两台机器，使得期望成本自动翻倍。"
  - "D: 两种策略造成的财务期望损失完全相等，皆为 6,000 元。"
  options_zh_hk:
  - "A: 選擇自擔風險（自費維修），因為其期望成本淨係得 500 蚊，低過延保嘅 600 蚊剛性保費。"
  - "B: 購買延保，因為 600 蚊遠低於一萬蚊嘅災難性賬單。"
  - "C: 即刻增購兩部機器，令到期望成本自動翻倍。"
  - "D: 兩種策略造成嘅財務期望損失完全相等，皆為 6,000 蚊。"
  answer: A
  explanation_en: "Expected repair cost = (0.05 * $10,000) + (0.95 * $0) = $500. Comparing $500 expected cost against a guaranteed $600 warranty shows self-insuring saves $100 per machine on average."
  explanation_zh: "自担期望维修成本 = (0.05 × 10,000) + (0.95 × 0) = 500 元。对比 600 元的固定保费，自担风险平均每台机器能为公司节省 100 元期望支出。"
  explanation_zh_hk: "自擔期望維修成本 = (0.05 × 10,000) + (0.95 × 0) = 500 蚊。對比 600 蚊嘅固定保費，自擔風險平均每部機器可以為公司慳返 100 蚊期望支出。"
