youtube:
  description_en: |
    Pricing the gamble

    Expected monetary value (EMV) weights each payoff by its probability and sums. Use it to compare average financial outcomes — then check whether cash can absorb the bad path.

    In a simplified machine ledger, self-insuring costs an expected 500 dollars versus a certain 600-dollar warranty. The 100-dollar EMV edge must still clear cash-flow risk and what the contract actually covers.

    Business Probability Foundations - Module 2 - Short 13 (EMV)
    If this helped, subscribe for the next short.
  description_zh: |
    给这场赌注定价

    预期货币价值（EMV）用概率给每个损益加权再求和。用它比较平均财务结果——然后检查现金能否扛住坏路径。

    简化机台账本里，自担的期望成本是 500 美元，保修费是确定的 600 美元。100 美元的 EMV 优势，仍要过现金流风险与合同真实覆盖这一关。

    商务概率基础 - 模块2 - 短片13（期望货币价值）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    為呢場賭注定價

    預期貨幣價值（EMV）用概率為每個損益加權再求和。用佢比較平均財務結果——然後檢查現金可唔可以扛住壞路徑。

    簡化機台賬本入面，自擔嘅期望成本係 500 美元，保修費係確定嘅 600 美元。100 美元嘅 EMV 優勢，仍然要過現金流風險同合約真實覆蓋呢一關。

    商務概率基礎 - 模組2 - 短片13（預期貨幣價值）
    覺得有用嘅話，訂閱下一集。
