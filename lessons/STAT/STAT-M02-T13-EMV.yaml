  title_en: "Should we buy the extended warranty?"
  title_zh: "我们究竟该不该买设备延保？"
  title_zh_hk: "我哋究竟應唔應該買設備延保？"
  en: "Every regional manager faces this sales pitch: the equipment vendor offers an extended warranty on thirty store espresso machines for six hundred dollars each per year. If a boiler blows up without coverage, the replacement costs ten thousand dollars. Fear whispers that you should pay eighteen thousand dollars right now for total peace of mind. How do executives replace emotional panic with cold, calculated expected value?"
  zh: "每位区域经理都听过设备商这句推销：给全网三十家店的咖啡机买延保，每台每年六百元。要是锅炉在没有保修时彻底爆了，更换要一万元。恐惧常让人立刻掏出一万八千元买个安心。高管该怎么把情绪恐慌剥开，用期望值给风险定个价？"
  zh_hk: "每位區域經理都聽過設備商呢句推銷：畀全網三十間舖嘅咖啡機買延保，每部每年六百蚊。如果鍋爐喺冇保養嗰陣徹底爆咗，更換要一萬蚊。恐懼成日令人即刻攞出一萬八千蚊買個安心。高管應該點樣將情緒恐慌剝開，用期望值幫風險定個價？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "Expected Monetary Value (EMV)"
  title_zh: "预期货币价值的数学内核"
  title_zh_hk: "預期貨幣價值嘅數學內核"
  formula: "EMV = Sum of [ Outcome Payoff * Probability ]"
  formula_zh: "EMV = 各状态真实损益加权之和 = ∑ [ 财务结果 × 发生概率 ]"
  formula_zh_hk: "EMV = 各狀態真實損益加權之和 = ∑ [ 財務結果 × 發生概率 ]"
  formula_tex: "E[X] = \\sum_{i=1}^{n} x_i \\cdot P(X = x_i)"
  s1_en: "Expected Monetary Value translates probabilistic odds into real financial balances by weighting each possible dollar payoff by its probability of occurrence."
  s1_zh: "预期货币价值，是把每种可能的现金收支，乘上它发生的概率再加总，把抽象胜率换成可以比较的金额。"
  s1_zh_hk: "預期貨幣價值，係將每種可能嘅現金收支，乘上佢發生嘅概率再加總，將抽象勝率換成可以比較嘅金額。"
  s2_en: "EMV does not predict what will happen on a single lucky or unlucky Tuesday; it describes the long-run average outcome under repeated comparable decisions; any finite portfolio can still differ from that average."
  s2_zh: "EMV 不预测某一个周二会走运还是倒霉；它说的是大量可比决策反复发生时的长期平均。有限规模的实际结果，仍可能偏离这个平均。"
  s2_zh_hk: "EMV 唔預測某一個禮拜二會行好運定行衰運；佢講嘅係大量可比決策反覆發生嗰陣嘅長期平均。有限規模嘅實際結果，仍然可能偏離呢個平均。"
- id: table
  visual: two_column
  seconds: 36
  kicker: "The Payoff Matrix"
  kicker_en: "The Payoff Matrix"
  kicker_zh: "收益矩阵"
  kicker_zh_hk: "收益矩陣"
  title_en: "Certain premium versus uncertain repair cost"
  title_zh: "确定保费与不确定维修成本"
  title_zh_hk: "確定保費與不確定維修成本"
  left_en: "Option 1: Buy warranty (Certain -$600)"
  left_zh: "策略一：全量购买延保（每台刚性流出 600 元）"
  left_zh_hk: "策略一：全量購買延保（每部剛性流出 600 蚊）"
  right_en: "Option 2: Self-insure (Weighted average)"
  right_zh: "策略二：选择风险自担（按故障概率加权均摊）"
  right_zh_hk: "策略二：選擇風險自擔（按故障概率加權均攤）"
  s1_en: "To compare competing strategies, executives construct a decision payoff table listing mutually exclusive choices against all potential future states of nature."
  s1_zh: "要比较不同对策，就做一张决策收益表：互斥选项对着可能出现的各种自然状态。"
  s1_zh_hk: "要比較唔同對策，就做一張決策收益表：互斥選項對住可能出現嘅各種自然狀態。"
  s2_en: "Option One makes the warranty premium certain in this simplified comparison: you hand over a guaranteed six hundred dollars per machine regardless of whether anything breaks."
  s2_zh: "在这个简化比较里，选项一让延保保费变成确定支出：机器坏不坏，你都得为每台交出六百元。"
  s2_zh_hk: "喺呢個簡化比較入面，選項一令延保保費變成確定支出：部機壞唔壞，你都要為每部交出六百蚊。"
  s3_en: "Option Two embraces variance: ninety-five percent of the time you pay zero, and five percent of the time you pay a massive ten thousand dollars."
  s3_zh: "选项二接受波动：有 95% 的时间你一分不用付，只有 5% 的情况会面对一万元维修。"
  s3_zh_hk: "選項二接受波動：有 95% 嘅時間你一毫子都唔使畀，淨係 5% 嘅情況會面對一萬蚊維修。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目精算"
  kicker_zh_hk: "賬目精算"
  title_en: "Evaluating thirty espresso machines"
  title_zh: "全网三十台咖啡机的财务精算"
  title_zh_hk: "全網三十部咖啡機嘅財務精算"
  step1_en: "Self-insure EMV = −$500"
  step1_zh: "自保 EMV = -$500"
  step1_zh_hk: "自保 EMV = -$500"
  step2_en: "Warranty = −$600 certain"
  step2_zh: "保修 = -$600 确定"
  step2_zh_hk: "保修 = -$600 確定"
  step3_en: "30 × $100 edge = $3,000"
  step3_zh: "30x$100 优势 = $3,000"
  step3_zh_hk: "30x$100 優勢 = $3,000"
  s1_en: "Run the math across our network ledger. Step one: calculate the expected cost of self-insuring. Five percent chance of ten thousand dollars plus ninety-five percent chance of zero equals five hundred dollars per machine."
  s1_zh: "按全网账来算。第一步：自担风险的单台期望成本。5% 概率付一万元，加 95% 概率付零，单台期望是五百元。"
  s1_zh_hk: "按全網賬嚟計。第一步：自擔風險嘅單部期望成本。5% 概率畀一萬蚊，加 95% 概率畀零，單部期望係五百蚊。"
  s2_en: "Step two: evaluate the warranty contract. It charges a fixed six hundred dollars with absolute certainty, which is one hundred dollars more than the five-hundred-dollar expected repair cost per machine."
  s2_zh: "第二步：看延保合同。它确定收六百元，比每台五百元的期望维修成本高一百元。"
  s2_zh_hk: "第二步：睇延保合約。佢確定收六百蚊，比每部五百蚊嘅期望維修成本高一百蚊。"
  s3_en: "Step three: scale up to all thirty metro cafes. Across thirty machines, self-insuring has an expected cost three thousand dollars lower than buying the warranty, before considering risk tolerance and contract details."
  s3_zh: "第三步：放大到三十家店。三十台机器算下来，自担的期望成本比买延保低三千元；实际决策还要看风险承受力和合同细节。"
  s3_zh_hk: "第三步：放大到三十間舖。三十部機器計落，自擔嘅期望成本比買延保低三千蚊；實際決策仲要睇風險承受力同合約細節。"
