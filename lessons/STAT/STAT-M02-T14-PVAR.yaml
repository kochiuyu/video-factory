  s1_zh_hk: "將期望值、離散度，以及企業扛住壞結果嘅能力放埋一齊睇。"
  s2_en: "Higher risk capacity may self-insure; others pay to transfer risk."
  s2_zh: "承受力强的可以自担；其他企业付费转移风险。"
  s2_zh_hk: "承受力強嘅可以自擔；其他企業付費轉移風險。"
  s3_en: "Self-insure: expected 500 dollars, SD about 2,179 — compare with the 600-dollar premium."
  s3_zh: "自担：期望 500 元，标准差约 2,179——对照 600 元保费。"
  s3_zh_hk: "自擔：期望 500 蚊，標準差約 2,179——對照 600 蚊保費。"
