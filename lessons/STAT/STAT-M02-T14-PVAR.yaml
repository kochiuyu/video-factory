quiz:
- id: Q1
  type: multiple_choice
  question_en: "How does the variance of a discrete random variable Var(X) differ conceptually from the sample variance s^2 learned in descriptive statistics?"
  question_zh: "离散随机变量的方差 Var(X) 与我们在描述统计学中学习的样本方差 s^2 在概念上有何不同？"
  question_zh_hk: "離散隨機變量嘅方差 Var(X) 同我哋喺描述統計學入面學習嘅樣本方差 s^2 喺概念上有咩唔同？"
  options_en:
  - "A: Sample variance s^2 measures historical dispersion in recorded past data, while Var(X) measures dispersion under a specified probability distribution by weighting squared deviations by their probabilities."
  - "B: Var(X) can only produce negative numbers."
  - "C: Sample variance uses probabilities, while Var(X) only uses raw counts."
  - "D: Corporate tax law forbids calculating Var(X) on capital equipment."
  options_zh:
  - "A: 样本方差 s^2 衡量的是历史账目已发生数据的离散程度，而 Var(X) 在给定概率分布下，以各结果的概率加权其对期望值的平方偏差。"
  - "B: Var(X) 的计算结果只能是负数。"
  - "C: 样本方差使用概率计算，而 Var(X) 只能使用原始频数。"
  - "D: 企业税法明令禁止对固定资产设备计算 Var(X)。"
  options_zh_hk:
  - "A: 樣本方差 s^2 衡量嘅係歷史賬目已發生數據嘅離散程度，而 Var(X) 喺指定概率分布之下，以各結果嘅概率加權佢哋對期望值嘅平方偏差。"
  - "B: Var(X) 嘅計算結果淨係可以係負數。"
  - "C: 樣本方差使用概率計算，而 Var(X) 淨係可以使用原始頻數。"
  - "D: 企業稅法明令禁止對固定資產設備計算 Var(X)。"
  answer: A
  explanation_en: "Sample variance s^2 is a descriptive summary of empirical observations. Population/model variance Var(X) = Sum of [(x_i - mu)^2 * P(x_i)] describes dispersion in the probability model for an uncertain payoff."
  explanation_zh: "样本方差 s^2 是对既成经验观测值的描述性汇总。而理论方差 Var(X) = ∑ [(x_i - μ)^2 × P(x_i)] 描述的是不确定收益在概率模型中的离散程度。"
  explanation_zh_hk: "樣本方差 s^2 係對既成經驗觀測值嘅描述性匯總。而理論方差 Var(X) = ∑ [(x_i - μ)^2 × P(x_i)] 描述嘅係不確定收益喺概率模型入面嘅離散程度。"
- id: Q2
  type: multiple_choice
  question_en: "If self-insuring a coffee machine has an expected cost of $500 with a standard deviation of $2,179, why would a single independent cafe owner pay $600 for a warranty?"
  question_zh: "如果一台咖啡机自担风险的期望维修成本为 500 元，但标准差高达 2,179 元，为什么一家单体独立咖啡馆老板依然愿意花费 600 元购买延保？"
  question_zh_hk: "如果一部咖啡機自擔風險嘅期望維修成本為 500 蚊，但標準差高達 2,179 蚊，點解一間單體獨立咖啡館老闆依然願意使 600 蚊買延保？"
  options_en:
  - "A: To eliminate downside volatility: a $10,000 repair may be difficult for a small business to absorb, so paying an extra $100 over expected cost can transfer that modeled repair risk."
  - "B: Because the warranty company guarantees to double customer foot traffic."
  - "C: Because standard deviation can be deducted from utility bills."
  - "D: The cafe owner is mathematically prohibited from calculating expected value."
  options_zh:
  - "A: 为了消除下行破产风险：一万元维修费可能令小企业难以承受，因此多付 100 元高于期望成本的保费，可以转移模型中的维修风险。"
  - "B: 因为延保公司合同里保证会让门店的顾客人流量翻倍。"
  - "C: 因为标准差可以直接从日常水电费账单中扣除。"
  - "D: 法律禁止单体咖啡馆老板计算数学期望值。"
  options_zh_hk:
  - "A: 為咗消除下行破產風險：一萬蚊維修費可能令小企業難以承受，所以畀多 100 蚊高過期望成本嘅保費，可以轉移模型入面嘅維修風險。"
  - "B: 因為延保公司合約入面保證會令門市嘅顧客人流量翻倍。"
  - "C: 因為標準差可以直接由日常水電費賬單入面扣減。"
  - "D: 法律禁止單體咖啡館老闆計算數學期望值。"
  answer: A
  explanation_en: "Risk-averse businesses buy insurance not because EMV is favorable, but to pay a risk premium that reduces the modeled repair-cost volatility and transfers part of the financial risk."
  explanation_zh: "厌恶风险的小微企业之所以买保险，不是因为期望值划算，而是为了支付风险溢价，以降低模型中的维修成本波动并转移部分财务风险。"
  explanation_zh_hk: "厭惡風險嘅小微企業之所以買保險，唔係因為期望值划算，而係為咗支付風險溢價，以降低模型入面嘅維修成本波動並轉移部分財務風險。"
