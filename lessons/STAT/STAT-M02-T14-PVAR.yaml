title_en: "Pricing the volatility"
title_zh: "给波动定价：随机变量的方差与标准差"
title_zh_hk: "幫波動定價：隨機變量嘅方差與標準差"
objective_en: "Define the variance and standard deviation of a discrete random variable, contrast expected payoffs with downside financial volatility, and explain why risk tolerance dictates whether small versus large businesses buy insurance."
objective_zh: "把离散随机变量的方差与标准差定义为偏离期望值平方的概率加权平均数，对比期望收益与下行财务波动，并解释为什么风险承受力决定了小微店与大型连锁截然不同的投保决策。"
objective_zh_hk: "將離散隨機變量嘅方差同標準差定義為偏離期望值平方嘅概率加權平均數，對比期望收益同下行財務波動，並解釋點解風險承受力決定咗小微舖同大型連鎖截然唔同嘅投保決策。"
