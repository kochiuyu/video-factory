youtube:
  description_en: |
    Pricing the volatility

    Expected value prices the center. Variance and standard deviation price the spread. Small firms can die on a bad draw even when the average looks fine.

    For one machine, self-insurance expects 500 dollars with a standard deviation near 2,179 dollars. Compare both figures with the certain 600-dollar premium and what the warranty actually covers before you choose.

    Business Probability Foundations - Module 2 - Short 14 (probability variance)
    If this helped, subscribe for the next short.
  description_zh: |
    给波动定价

    期望值给中心定价；方差与标准差给离散定价。小微企业即使平均看起来不错，一次坏结果也可能致命。

    单台机器自担期望 500 美元，标准差约 2,179 美元。决策前，把这两个数与确定的 600 美元保费、以及保修真实覆盖对照。

    商务概率基础 - 模块2 - 短片14（概率方差）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    為波動定價

    期望值為中心定價；方差同標準差為離散定價。小微企業即使平均睇落唔錯，一次壞結果都可能致命。

    單台機器自擔期望 500 美元，標準差約 2,179 美元。決策之前，將呢兩個數同確定嘅 600 美元保費、以及保修真實覆蓋對照。

    商務概率基礎 - 模組2 - 短片14（概率方差）
    覺得有用嘅話，訂閱下一集。
