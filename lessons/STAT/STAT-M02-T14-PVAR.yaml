  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Expected value sets price, variance tests survival"
  title_zh: "期望值决定价格底线，方差考验生存韧性"
  title_zh_hk: "期望值決定價格底線，方差考驗生存韌性"
  q1_en: "EMV alone for small firms? → Dispersion can kill before the average"
  q1_zh: "小微只看期望？→ 波动可能先于均值致命"
  q1_zh_hk: "小微淨睇期望？→ 波動可能早過均值致命"
