title_en: "The probabilistic risk dashboard"
title_zh: "管理层概率风险仪表盘与前瞻矩阵"
title_zh_hk: "管理層概率風險儀表板與前瞻矩陣"
youtube:
  description_en: |
    The probabilistic risk dashboard

    This recap closes Module 2. Lead under uncertainty by judging the process you chose — events, assumptions, probabilities, alternatives, consequences — not one realized roll.

    Use the dashboard in order: lock an MECE sample space, model combinations or paths, update beliefs when evidence arrives, then compare expected value with dispersion before you act. That is the close of this short — no teaser for another module.

    Business Probability Foundations - Module 2 - Short 15 (recap)
    If this helped, subscribe for more shorts.
  description_zh: |
    概率风险仪表盘

    本集收束模块2。不确定下的领导力，要评判你当时选用的过程——事件、假设、概率、备选与后果——而不是一次实现的结果。

    仪表盘按序使用：锁紧 MECE 样本空间，为组合或路径建模，证据到来时更新信念，行动前比较期望与离散。这就是本集的收束——不再预告其他模块。

    商务概率基础 - 模块2 - 短片15（回顾）
    觉得有用的话，订阅获取更多短片。
  description_zh_hk: |
    概率風險儀表板

    本集收束模組2。不確定下嘅領導力，要評判你當時選用嘅過程——事件、假設、概率、備選同後果——而唔係一次實現嘅結果。

    儀表板按序使用：鎖緊 MECE 樣本空間，為組合或者路徑建模，證據到嚟時更新信念，行動前比較期望同離散。呢個就係本集嘅收束——唔再預告其他模組。

    商務概率基礎 - 模組2 - 短片15（回顧）
    覺得有用嘅話，訂閱獲取更多短片。
