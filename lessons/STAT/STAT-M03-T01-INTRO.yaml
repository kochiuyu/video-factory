  en: "Four pillars. First, turn messy events into random variables — clean numbers. Second, use discrete models like Binomial and Poisson for batch defects and queue arrivals. Third, use continuous models like the Exponential for wait times and machine life. Fourth, use the Normal curve to size safety buffers."
  zh: "四根支柱。第一，把杂乱事件变成随机变量——变成干净的数字。第二，用二项、泊松这类离散模型，刻画批次次品和排队到达。第三，用指数这类连续模型，度量等待时间和设备寿命。第四，用正态曲线来核定安全缓冲。"
