quiz:
- id: Q1
  type: multiple_choice
  question_en: "Why is analyzing a single transaction's probability insufficient for executive-level retail planning?"
  question_zh: "为什么分析单笔交易的发生概率无法满足高管层面的零售运营规划需求？"
  question_zh_hk: "點解分析單筆交易嘅發生概率冇辦法滿足高管層面嘅零售營運規劃需求？"
  options_en:
  - "A: Executive decisions govern aggregate daily capacity, total inventory volume, and queue staffing across thousands of customers, which requires modeling the entire distribution of outcomes."
  - "B: Corporate accounting software automatically deletes any calculation involving only one person."
  - "C: Single transactions are legally exempt from probability rules under commercial law."
  - "D: Individual customers always buy identical quantities of coffee every single day."
  options_zh:
  - "A: 高管决策管控的是成千上万顾客汇聚而成的大盘承载力、总库存规模及排班调度，这必须依赖对全部结果的概率分布建模。"
  - "B: 企业的财务会计软件会自动删除仅涉及单一个体的任何计算结果。"
  - "C: 商业法律明文规定单笔独立交易在法律层面上豁免遵循概率法则。"
  - "D: 每一位顾客在现实中每天购买的咖啡杯数都是完全恒定相同的。"
  options_zh_hk:
  - "A: 高管決策管控嘅係成千上萬顧客匯聚而成嘅大盤承載力、總庫存規模同埋排班調度，呢個必須依賴對全部結果嘅概率分佈建模。"
  - "B: 企業嘅財務會計軟件會自動刪除淨係涉及單一個體嘅任何計算結果。"
  - "C: 商業法律明文規定單筆獨立交易喺法律層面上豁免遵循概率法則。"
  - "D: 每一位顧客喺現實入面每日購買嘅咖啡杯數都係完全恆定相同嘅。"
  answer: A
  explanation_en: "While probability foundations examine individual event likelihoods, operational management requires probability distributions to model total volume, service queues, and aggregate demand."
  explanation_zh: "虽然概率论基础研究的是单一事件的发生胜率，但运营管理必须借助概率分布来为总量规模、排队队列和总体需求进行系统建模。"
  explanation_zh_hk: "雖然概率論基礎研究嘅係單一事件嘅發生勝率，但營運管理必須借助概率分佈嚟為總量規模、排隊隊列同埋總體需求進行系統建模。"
- id: Q2
  type: multiple_choice
  question_en: "What mathematical transformation does a random variable X perform on real-world retail operations?"
  question_zh: "在真实的零售业务中，随机变量 X 在数学上执行了怎样的核心转换？"
  question_zh_hk: "喺真實嘅零售業務入面，隨機變量 X 喺數學上執行咗點樣嘅核心轉換？"
  options_en:
  - "A: It assigns a distinct numerical value to every possible qualitative operational outcome in the sample space."
  - "B: It converts foreign currency transactions into domestic legal tender."
  - "C: It replaces all customer order receipts with letters of the alphabet."
  - "D: It guarantees that total monthly sales revenue will remain completely constant."
  options_zh:
  - "A: 它把样本空间中每一种可能出现的定性业务结果，精确映射为一个确定的数值。"
  - "B: 它负责将跨国业务中的外币交易金额兑换为本国法定货币。"
  - "C: 它把所有顾客的点单收据全部强制替换为英文字母。"
  - "D: 它能确保门店全月的销售总收入在任何情况下都保持完全恒定。"
  options_zh_hk:
  - "A: 佢將樣本空間入面每一種可能出現嘅定性業務結果，精確映射為一個確定嘅數值。"
  - "B: 佢負責將跨國業務入面嘅外幣交易金額兌換為本國法定貨幣。"
  - "C: 佢將所有顧客嘅點單收據全部強制替換為英文字母。"
  - "D: 佢能夠確保門市全月嘅銷售總收入喺任何情況下都保持完全恆定。"
  answer: A
  explanation_en: "A random variable X is a function that maps qualitative operational events (e.g., 'no pastry', 'one croissant') onto clean, numerical values (0, 1, 2, ...)."
  explanation_zh: "随机变量 X 是一个映射函数，它把现实中定性的业务事件（如“未加点”、“加点一个可颂”）转换为清晰可运算的数值（0, 1, 2, ...）。"
  explanation_zh_hk: "隨機變量 X 係一個映射函數，佢將現實入面定性嘅業務事件（好似「冇加點」、「加點一個牛角包」）轉換為清晰可運算嘅數值（0, 1, 2, ...）。"
