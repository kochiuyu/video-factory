- id: foundation
  visual: two_column
  seconds: 44
  kicker: "The Paradigm Shift"
  kicker_en: "The Paradigm Shift"
  kicker_zh: "认知跃迁"
  kicker_zh_hk: "認知躍遷"
  title_en: "From point bets to population models"
  title_zh: "从单点博弈到大盘模型"
  title_zh_hk: "由單點博弈到大盤模型"
  left_en: "Single Event: P(A) on one ticket"
  left_zh: "单次事件：关注单张小票上的点购概率"
  left_zh_hk: "單次事件：關注單張單據上嘅點購概率"
  right_en: "Distribution: P(X = x) across the network"
  right_zh: "概率分布：全网规模下各量级的整体全貌"
  right_zh_hk: "概率分佈：全網規模下各量級嘅整體全貌"
  s1_en: "A single event probability asks whether one particular customer buys a croissant. It is a one-off draw from uncertainty."
  s1_zh: "单次事件概率问的是：这一位客人会不会买可颂？那是一次单独的抽签。"
  s1_zh_hk: "單次事件概率問嘅係：呢一位客人會唔會買牛角包？嗰下係一次單獨嘅抽籤。"
  s2_en: "A random variable can represent the total number of croissant add-ons across the ten thousand orders. Its probability distribution assigns a probability to each possible total, such as zero, fifty, or five hundred add-ons, under the stated model assumptions."
  s2_zh: "随机变量可以表示一万笔订单里可颂加购的总数。它的概率分布，会给每个可能总数——比如 0、50、500——配上一个概率。"
  s2_zh_hk: "隨機變量可以表示一萬筆訂單入面牛角包加購嘅總數。佢嘅概率分佈，會畀每個可能總數——好似 0、50、500——配上一個概率。"
  s3_en: "The operating distinction is between one ticket and the distribution of outcomes across the system. Capacity decisions use that distribution, not a single anecdote."
  s3_zh: "运营上真正要分清的，是单张小票，还是整盘结果的分布。排承载力，靠的是分布，不是一两个故事。"
  s3_zh_hk: "營運上真正要分清嘅，係單張單據，定係成盤結果嘅分佈。排承載力，靠嘅係分佈，唔係一兩個故事。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "The Operating Rule"
  kicker_en: "The Operating Rule"
  kicker_zh: "运营法则"
  kicker_zh_hk: "營運法則"
  title_en: "Manage the distribution, not the anecdote"
  title_zh: "管分布，别只听个案"
  title_zh_hk: "管分佈，唔好淨係聽個案"
  q1_en: "Why distributions? → They map the whole range of outcomes"
  q1_zh: "为什么要分布？→ 它把整盘可能结果摊开"
  q1_zh_hk: "點解要分佈？→ 佢將成盤可能結果攤開"
  q2_en: "Why a random variable? → It turns events into numbers you can plan with"
  q2_zh: "为什么要随机变量？→ 把事件变成能算的数字"
  q2_zh_hk: "點解要隨機變量？→ 將事件變成計得嘅數字"
  s1_en: "A distribution lays out which totals are likely, so staffing, baking, and logistics rest on more than one ticket."
  s1_zh: "分布把哪些总量更可能发生摊开，排班、烘焙、物流才不只盯着一张小票。"
  s1_zh_hk: "分佈將邊啲總量更可能發生攤開，排班、烘焙、物流先唔會淨係睇住一張單據。"
  s2_en: "Map the outcome to a random variable, then ask: discrete count, or continuous measure?"
  s2_zh: "先把结果映射成随机变量，再问：这是离散计数，还是连续度量？"
  s2_zh_hk: "先將結果映射成隨機變量，再問：呢個係離散計數，定係連續度量？"
  s3_en: "Then pick a distribution whose assumptions fit the process — and check them before you decide."
  s3_zh: "再选一个假设贴合业务过程的分布——拍板之前，先核对假设。"
  s3_zh_hk: "再揀一個假設貼合業務過程嘅分佈——拍板之前，先核對假設。"
