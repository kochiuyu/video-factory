id: STAT-M03-T01-INTRO
course: statistics
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
audience: "first-year business students"
audience_en: "first-year business students"
audience_zh: "商学院一年级学生"
audience_zh_hk: "商學院一年級學生"
duration_target_s: 154
title_en: "Modeling the operating engine"
title_zh: "建模运营引擎：概率分布思维"
title_zh_hk: "建模營運引擎：概率分佈思維"
objective_en: "Introduce probability distributions as mathematical models of operational systems, contrast one-off single-event wagers with recurring population processes, and define random variables as quantitative functions that map business outcomes to numbers."
objective_zh: "将概率分布介绍为刻画企业运营系统的数学模型，对比单次偶发博弈与规模化总体运行过程，并将随机变量定义为把业务结果映射为数值的定量函数。"
objective_zh_hk: "將概率分佈介紹為刻畫企業營運系統嘅數學模型，對比單次偶發博弈與規模化總體運行過程，並將隨機變量定義為將業務結果映射為數值嘅定量函數。"
