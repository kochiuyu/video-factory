youtube:
  description_en: |
    Modeling the operating engine
    
    A fifty-store coffee chain processes ten thousand morning orders. Knowing one customer's chance of buying food does not show total pastry demand, queue load, or staffing pressure. How do you model the range of outcomes for the whole system?
    
    Four pillars frame the answer: map messy retail events into random variables; use discrete models such as Binomial and Poisson for batch defects and queue arrivals; use continuous models such as the Exponential for wait times and machine life; and use the Normal curve to size safety buffers.
    
    Manage the distribution, not the anecdote. Capacity decisions rest on which totals are likely across the system — not on one coffee ticket.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 1 (INTRO)
    If this helped, subscribe for the next short.
  description_zh: |
    建模运营引擎：概率分布思维
    
    一家五十间门店的咖啡连锁，早市要处理一万笔订单。你只知道一个客人加点点心的概率，看不出点心总需求、排队压力，也看不出要排多少人。整盘结果的变化，到底该怎么建模型？
    
    四根支柱：把杂乱事件变成随机变量；用二项、泊松等离散模型刻画批次次品和排队到达；用指数等连续模型度量等待与设备寿命；再用正态曲线核定安全缓冲。
    
    管分布，别只听个案。排承载力靠的是整盘结果的分布，不是一两张小票。
    
    离散与连续概率分布 - 模块3 - 短片1（INTRO）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    建模營運引擎：概率分佈思維
    
    一間五十間門市嘅咖啡連鎖，朝早要處理一萬筆訂單。你淨係知一個客人加點點心嘅概率，睇唔出點心總需求、排隊壓力，亦睇唔出要排幾多人。成盤結果嘅變化，到底要點樣建模型？
    
    四條支柱：將雜亂事件變成隨機變量；用二項、泊松等離散模型刻畫批次次品同排隊到達；用指數等連續模型度量等待同設備壽命；再用正態曲線核定安全緩衝。
    
    管分佈，唔好淨係聽個案。排承載力靠嘅係成盤結果嘅分佈，唔係一兩張單據。
    
    離散與連續概率分佈 - 模組3 - 短片1（INTRO）
    覺得有用嘅話，訂閱下一集。
