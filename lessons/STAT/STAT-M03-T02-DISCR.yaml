youtube:
  description_en: |
    The discrete probability engine
    
    Shop A must decide how many croissants to bake for the morning. Too few means stockouts; too many means waste. How do you list the possible add-on counts, attach probabilities, and get a planning baseline?
    
    A discrete random variable takes countable values such as 0, 1, 2, or 3 croissants. Its PMF assigns each value a probability between 0 and 1, and those probabilities must sum to 1.0. Expected value E[X] is the probability-weighted average — the center of gravity of the PMF, not a promise on any single ticket.
    
    With weights 0 (0.50), 1 (0.30), 2 (0.15), 3 (0.05), E[X] = 0.75 croissants per patron. Four hundred morning tickets times 0.75 gives a baseline of 300 croissants — an average plan, still needing swings, waste tolerance, and service targets before you lock the bake.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 2 (DISCR)
    If this helped, subscribe for the next short.
  description_zh: |
    离散概率引擎：概率质量函数与数学期望
    
    A店要决定早市烤多少可颂。少了会断货，多了会浪费。你怎么把可能的加购件数列出来、配上概率，再算出一个规划基准？
    
    离散随机变量取可数取值，比如 0、1、2、3 件可颂。PMF 给每个取值配 0 到 1 之间的概率，且全部加起来必须等于 1.0。期望 E[X] 是概率加权平均——整块 PMF 的重心，不是某张小票上的保证。
    
    权重 0（0.50）、1（0.30）、2（0.15）、3（0.05）时，E[X]=0.75 件/客。四百笔早市订单乘以 0.75，基准是 300 件可颂——是平均规划，定产量前还要把波动、浪费容忍和服务目标算进去。
    
    离散与连续概率分布 - 模块3 - 短片2（DISCR）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    離散概率引擎：概率質量函數與數學期望
    
    A舖要決定朝早焗幾多件牛角包。少咗會斷貨，多咗會浪費。你點樣將可能嘅加購件數列出嚟、配上概率，再計一個規劃基準？
    
    離散隨機變量取可數取值，好似 0、1、2、3 件牛角包。PMF 畀每個取值配 0 到 1 之間嘅概率，兼且全部加埋必須等於 1.0。期望 E[X] 係概率加權平均——成塊 PMF 嘅重心，唔係某張單據上面嘅保證。
    
    權重 0（0.50）、1（0.30）、2（0.15）、3（0.05）嗰陣，E[X]=0.75 件/客。四百筆朝早訂單乘以 0.75，基準係 300 件牛角包——係平均規劃，定產量之前仲要將波動、浪費容忍同服務目標計入去。
    
    離散與連續概率分佈 - 模組3 - 短片2（DISCR）
    覺得有用嘅話，訂閱下一集。
