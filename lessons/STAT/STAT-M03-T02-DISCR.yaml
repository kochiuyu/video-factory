title_en: "The discrete probability engine"
title_zh: "离散概率引擎：概率质量函数与数学期望"
title_zh_hk: "離散概率引擎：概率質量函數與數學期望"
objective_en: "Define discrete random variables and probability mass functions (PMF), verify the foundational condition that all probabilities sum to 1.0, and calculate the expected value E[X] for inventory demand planning."
objective_zh: "定义离散型随机变量与概率质量函数（PMF），验证各项概率之和严格等于 1.0 的公理基石，并计算数学期望 E[X] 以指导烘焙点心备货与销量规划。"
objective_zh_hk: "定義離散型隨機變量同概率質量函數（PMF），驗證各項概率之和嚴格等於 1.0 嘅公理基石，並計算數學期望 E[X] 用嚟指導烘焙點心備貨同銷量規劃。"
