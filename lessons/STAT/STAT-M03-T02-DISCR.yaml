quiz:
- id: Q1
  type: multiple_choice
  question_en: "What two mathematical criteria must every valid Probability Mass Function (PMF) satisfy?"
  question_zh: "一个合格合规的概率质量函数（PMF）在数学上必须同时满足哪两项硬性准则？"
  question_zh_hk: "一個合格合規嘅概率質量函數（PMF）喺數學上必須同時滿足邊兩項硬性準則？"
  options_en:
  - "A: Every probability P(X = x) must be between 0 and 1 inclusive, and the sum of probabilities across all possible values must equal exactly 1.0."
  - "B: The probabilities must strictly increase as x increases, and negative values are permitted."
  - "C: Total probability must equal 100 times the number of retail cash registers."
  - "D: The expected value E[X] must always equal the median."
  options_zh:
  - "A: 每个可能取值的概率 P(X = x) 必须介于 0 到 1 之间，且所有可能取值的概率总和严格等于 1.0。"
  - "B: 概率数值必须随着 x 的增加而严格递增，并且允许出现负数概率。"
  - "C: 总概率必须恰好等于门店收银机数量的 100 倍。"
  - "D: 数学期望值 E[X] 必须在任何情况下都等于中位数。"
  options_zh_hk:
  - "A: 每個可能取值嘅概率 P(X = x) 必須介乎 0 到 1 之間，兼且所有可能取值嘅概率總和嚴格等於 1.0。"
  - "B: 概率數值必須隨住 x 嘅增加而嚴格遞增，並且容許出現負數概率。"
  - "C: 總概率必須啱啱好等於門市收銀機數量嘅 100 倍。"
  - "D: 數學期望值 E[X] 必須喺任何情況下都等於中位數。"
  answer: A
  explanation_en: "A valid PMF requires that all probabilities are non-negative, bounded by 1, and collectively exhaustive such that Sum[P(X = x)] = 1.0."
  explanation_zh: "合格的 PMF 要求每项取值概率非负且不大于 1，同时完全穷尽，所有概率加总必须精准等于 1.0。"
  explanation_zh_hk: "合格嘅 PMF 要求每項取值概率非負兼且唔大過 1，同時完全窮盡，所有概率加總必須精準等於 1.0。"
- id: Q2
  type: multiple_choice
  question_en: "If a register's croissant add-on orders X have PMF: P(0) = 0.50, P(1) = 0.30, P(2) = 0.15, and P(3) = 0.05, what is the expected number of croissants sold per order, E[X]?"
  question_zh: "如果收银台加购可颂数量 X 的分布为：P(0) = 0.50，P(1) = 0.30，P(2) = 0.15，P(3) = 0.05，那么单笔客单的期望加购件数 E[X] 是多少？"
  question_zh_hk: "如果收銀機加購牛角包數量 X 嘅分佈為：P(0) = 0.50，P(1) = 0.30，P(2) = 0.15，P(3) = 0.05，噉單筆客單嘅期望加購件數 E[X] 係幾多？"
  options_en:
  - "A: 0.75 croissants"
  - "B: 1.00 croissant"
  - "C: 1.50 croissants"
  - "D: 0.50 croissants"
  options_zh:
  - "A: 0.75 个"
  - "B: 1.00 个"
  - "C: 1.50 个"
  - "D: 0.50 个"
  options_zh_hk:
  - "A: 0.75 個"
  - "B: 1.00 個"
  - "C: 1.50 個"
  - "D: 0.50 個"
  answer: A
  explanation_en: "E[X] = (0 * 0.50) + (1 * 0.30) + (2 * 0.15) + (3 * 0.05) = 0 + 0.30 + 0.30 + 0.15 = 0.75 croissants."
  explanation_zh: "E[X] = (0 × 0.50) + (1 × 0.30) + (2 × 0.15) + (3 × 0.05) = 0 + 0.30 + 0.30 + 0.15 = 0.75 个可颂。"
  explanation_zh_hk: "E[X] = (0 × 0.50) + (1 × 0.30) + (2 × 0.15) + (3 × 0.05) = 0 + 0.30 + 0.30 + 0.15 = 0.75 個牛角包。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Inventory Guesswork"
  kicker_en: "The Inventory Guesswork"
  kicker_zh: "盲目备货之痛"
  kicker_zh_hk: "盲目備貨之痛"
  title_en: "How many pastries will actually leave the shelf?"
  title_zh: "今天到底会有多少件点心被买走？"
  title_zh_hk: "今日到底會有幾多件點心被買走？"
  en: "Shop A must decide how many croissants to bake for the morning. Too few means stockouts; too many means waste. How do you list the possible add-on counts, attach probabilities, and get a planning baseline?"
  zh: "A店要决定早市烤多少可颂。少了会断货，多了会浪费。你怎么把可能的加购件数列出来、配上概率，再算出一个规划基准？"
  zh_hk: "A舖要決定朝早焗幾多件牛角包。少咗會斷貨，多咗會浪費。你點樣將可能嘅加購件數列出嚟、配上概率，再計一個規劃基準？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Probability Mass Function"
  title_zh: "离散随机变量与概率质量函数"
  title_zh_hk: "離散隨機變量與概率質量函數"
  formula: "P(X = x) >= 0; Sum of P(X = x) = 1.0"
  formula_zh: "P(X = x) >= 0；且所有可能取值的概率累加之和恒等于 1.0"
  formula_zh_hk: "P(X = x) >= 0；兼且所有可能取值嘅概率累加之和恆等於 1.0"
  formula_tex: "p(x) = P(X = x), \\quad \\sum_{x} p(x) = 1.0"
  s1_en: "When a quantity can take a countable set of distinct values, such as zero, one, two, or three croissants, it can be modeled as a discrete random variable X."
  s1_zh: "如果一个量只能取可数的几个值——比如 0、1、2、3 件可颂——就可以把它建成离散型随机变量 X。"
  s1_zh_hk: "如果一個量只可以取可數嘅幾個值——好似 0、1、2、3 件牛角包——就可以將佢建成離散型隨機變量 X。"
  s2_en: "Its Probability Mass Function, or PMF, assigns a probability to each possible value. Every probability must lie between zero and one, and the probabilities over all possible values must sum to 1.0."
  s2_zh: "概率质量函数，也就是 PMF，给每个可能取值配一个概率。每个概率都要在 0 到 1 之间，而且全部加起来必须等于 1.0。"
  s2_zh_hk: "概率質量函數，即係 PMF，會畀每個可能取值配一個概率。每個概率都要喺 0 到 1 之間，而且全部加埋必須等於 1.0。"
- id: expectation
  visual: two_column
  seconds: 36
  kicker: "The Balance Point"
  kicker_en: "The Balance Point"
  kicker_zh: "平衡支点"
  kicker_zh_hk: "平衡支點"
  title_en: "Expected value as the center of gravity"
  title_zh: "数学期望：需求分布的物理重心"
  title_zh_hk: "數學期望：需求分佈嘅物理重心"
  left_en: "PMF Table: P(X = x) spreads the mass"
  left_zh: "PMF 质量表：将概率质量分布在离散取值上"
  left_zh_hk: "PMF 質量表：將概率質量分佈喺離散取值上"
  right_en: "Expected Value E[X]: Weighted average pull"
  right_zh: "期望值 E[X]：概率加权产生的总体物理重心"
  right_zh_hk: "期望值 E[X]：概率加權產生嘅總體物理重心"
  s1_en: "To find the baseline operational load, managers calculate the Expected Value, denoted as E of X or mu."
  s1_zh: "要找基准负荷，就算期望值，记作 E[X]，也常写成 mu。"
  s1_zh_hk: "要搵基準負荷，就計期望值，記做 E[X]，亦經常寫成 mu。"
  s2_en: "Think of expected value not as a number you will see on any single ticket, but as the physical center of gravity of the PMF probability seesaw."
  s2_zh: "别把期望当成某张小票上一定会出现的数字。把它想成整块 PMF 跷跷板的重心。"
  s2_zh_hk: "唔好將期望當成某張單據上面一定會出現嘅數字。將佢想像成成塊 PMF 搖搖板嘅重心。"
  s3_en: "Multiply each possible count by its PMF probability and add the products. The result is the long-run average per ticket under the model, which provides a baseline rather than a guaranteed daily outcome."
  s3_zh: "每个可能件数乘上自己的概率，再加总。得到的是模型下的长期单笔平均——是基准，不是每天的保证。"
  s3_zh_hk: "每個可能件數乘上自己嘅概率，再加總。得出嚟嘅係模型之下嘅長期單筆平均——係基準，唔係每日嘅保證。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Walking through 1,000 register tickets"
  title_zh: "假设有一千笔客单的可颂加购"
  title_zh_hk: "假設有一千筆客單嘅牛角包加購"
  step1_en: "PMF weights: 0 (0.50), 1 (0.30), 2 (0.15), 3 (0.05)"
  step1_zh: "PMF 赋权：0件(0.50)，1件(0.30)，2件(0.15)，3件(0.05)"
  step1_zh_hk: "PMF 賦權：0件(0.50)，1件(0.30)，2件(0.15)，3件(0.05)"
  step2_en: "Verify axioms: 0.50 + 0.30 + 0.15 + 0.05 = 1.00"
  step2_zh: "检验 PMF：四项概率相加等于 1.00"
  step2_zh_hk: "檢驗 PMF：四項概率相加等於 1.00"
  step3_en: "Compute E[X]: 0 + 0.30 + 0.30 + 0.15 = 0.75 units/ticket"
  step3_zh: "推演期望均值：单笔客单平均加购 0.75 件可颂"
  step3_zh_hk: "推演期望均值：單筆客單平均加購 0.75 件牛角包"
  s1_en: "Suppose 1,000 breakfast tickets at Shop A. Half of customers buy no food. Thirty percent add one croissant, fifteen percent add two, and five percent buy three."
  s1_zh: "假设 A 店有一千张早餐小票。一半客人没买烘焙；30% 加一件可颂，15% 加两件，5% 买了三件。"
  s1_zh_hk: "假設 A 舖有一千張早餐單據。一半客人冇買烘焙；30% 加一件牛角包，15% 加兩件，5% 買咗三件。"
  s2_en: "First check: zero point five zero plus zero point three zero plus zero point one five plus zero point zero five equals 1.0, so the listed values form a valid PMF for this model."
  s2_zh: "先核对：0.50 加 0.30 加 0.15 加 0.05 等于 1.0，所以这份表在本模型里是合格的 PMF。"
  s2_zh_hk: "先核對：0.50 加 0.30 加 0.15 加 0.05 等於 1.0，所以呢份表喺本模型入面係合格嘅 PMF。"
  s3_en: "Now weight each count: zero times 0.50 is 0; one times 0.30 is 0.30; two times 0.15 is 0.30; three times 0.05 is 0.15. Sum them up: the expected demand is 0.75 croissants per patron."
  s3_zh: "再加权：0×0.50=0；1×0.30=0.30；2×0.15=0.30；3×0.05=0.15。加起来，单客期望需求是 0.75 件可颂。"
  s3_zh_hk: "再加權：0×0.50=0；1×0.30=0.30；2×0.15=0.30；3×0.05=0.15。加埋，單客期望需求係 0.75 件牛角包。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Scale the expected value to size the batch"
  title_zh: "用期望做基准，再乘上客流"
  title_zh_hk: "用期望做基準，再乘上客流"
  q1_en: "How does E[X] size the batch? → Scale it by forecasted tickets"
  q1_zh: "期望怎么定产量？→ 乘上预测客单量"
  q1_zh_hk: "期望點定產量？→ 乘上預測客單量"
  q2_en: "Is E[X] a promise? → No — baseline plus variability and service goals"
  q2_zh: "期望是保证吗？→ 不是——基准还要加上波动和服务目标"
  q2_zh_hk: "期望係保證嗎？→ 唔係——基準仲要加上波動同服務目標"
  s1_en: "Check the PMF sums to one, then take the probability-weighted average — that is E[X]."
  s1_zh: "先确认 PMF 加总为 1，再做概率加权平均——那就是 E[X]。"
  s1_zh_hk: "先確認 PMF 加總為 1，再做概率加權平均——嗰個就係 E[X]。"
  s2_en: "Four hundred morning tickets times 0.75 gives a baseline of 300 croissants — an average plan, not a guarantee."
  s2_zh: "四百笔早市订单乘以 0.75，基准是 300 件可颂——是平均规划，不是保证卖出 300。"
  s2_zh_hk: "四百筆朝早訂單乘以 0.75，基準係 300 件牛角包——係平均規劃，唔係保證賣出 300。"
  s3_en: "Fold in demand swings, waste tolerance, and service targets before you lock the bake."
  s3_zh: "定产量之前，还要把需求波动、浪费容忍和服务目标一起算进去。"
  s3_zh_hk: "定產量之前，仲要將需求波動、浪費容忍同服務目標一齊計入去。"
