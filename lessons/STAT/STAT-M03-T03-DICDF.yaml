quiz:
- id: Q1
  type: multiple_choice
  question_en: "Why is the discrete Cumulative Distribution Function F(x) shaped like a rising staircase rather than a smooth diagonal curve?"
  question_zh: "为什么离散型累积分布函数 F(x) 的图像呈现为逐级上升的阶梯状，而非平滑连续的倾斜曲线？"
  question_zh_hk: "點解離散型累積分佈函數 F(x) 嘅圖像呈現為逐級上升嘅階梯狀，而唔係平滑連續嘅傾斜曲線？"
  options_en:
  - "A: Because discrete probability mass exists only at specific integer points; cumulative probability jumps at those points and stays flat across gaps."
  - "B: Because retail store computers reboot at the end of every hour."
  - "C: Staircase shapes are mandated by corporate legal guidelines for reporting quarterly earnings."
  - "D: Because negative complaint counts cancel out positive counts."
  options_zh:
  - "A: 因为离散变量的概率质量只凝聚在特定整数点上；累积概率在这些取值点瞬间向上跳跃，在整数间隙保持完全平坦。"
  - "B: 因为零售门店的电脑收银系统每到整点都会强制自动重启一次。"
  - "C: 企业财务合规准则强制要求在季报披露中必须使用阶梯形状展示。"
  - "D: 因为负数投诉会与正数投诉在运算过程中相互抵消为零。"
  options_zh_hk:
  - "A: 因為離散變量嘅概率質量淨係凝聚喺特定整數點上面；累積概率喺呢啲取值點瞬間向上跳躍，喺整數間隙保持完全平坦。"
  - "B: 因為零售門市嘅電腦收銀系統每到整點都會強制自動重啟一次。"
  - "C: 企業財務合規準則強制要求喺季報披露入面必須使用階梯形狀展示。"
  - "D: 因為負數投訴會同正數投訴喺運算過程入面相互抵消為零。"
  answer: A
  explanation_en: "Probability accumulates only where discrete mass exists. Between discrete outcomes (e.g., between 1 and 2 complaints), no new outcomes exist, so F(x) remains completely flat."
  explanation_zh: "概率只在离散取值点发生累加。在两个整数之间（如 1 与 2 次投诉之间）不存在任何新结果，因此 F(x) 在区间内保持水平不变。"
  explanation_zh_hk: "概率淨係喺離散取值點發生累加。喺兩個整數之間（好似 1 同 2 次投訴之間）唔存在任何新結果，因此 F(x) 喺區間內保持水平不變。"
- id: Q2
  type: multiple_choice
  question_en: "If a coffee shop's daily complaint PMF is P(0) = 0.60, P(1) = 0.25, P(2) = 0.10, and P(3) = 0.05, what is the probability that daily complaints exceed the store SLA threshold of at most 1?"
  question_zh: "如果一家咖啡店的每日客诉 PMF 为：P(0) = 0.60，P(1) = 0.25，P(2) = 0.10，P(3) = 0.05，每日客诉超过“至多 1 起”SLA 容忍红线的概率是多少？"
  question_zh_hk: "如果一間咖啡舖嘅每日客訴 PMF 為：P(0) = 0.60，P(1) = 0.25，P(2) = 0.10，P(3) = 0.05，每日客訴超過「最多 1 宗」SLA 容忍紅線嘅概率係幾多？"
  options_en:
  - "A: 0.15"
  - "B: 0.85"
  - "C: 0.25"
  - "D: 0.05"
  options_zh:
  - "A: 0.15"
  - "B: 0.85"
  - "C: 0.25"
  - "D: 0.05"
  options_zh_hk:
  - "A: 0.15"
  - "B: 0.85"
  - "C: 0.25"
  - "D: 0.05"
  answer: A
  explanation_en: "F(1) = P(X <= 1) = 0.60 + 0.25 = 0.85. The upper-tail breach risk is P(X > 1) = 1 - F(1) = 1 - 0.85 = 0.15."
  explanation_zh: "F(1) = P(X <= 1) = 0.60 + 0.25 = 0.85。上尾超标违约风险为 P(X > 1) = 1 - F(1) = 1 - 0.85 = 0.15。"
  explanation_zh_hk: "F(1) = P(X <= 1) = 0.60 + 0.25 = 0.85。上尾超標違約風險為 P(X > 1) = 1 - F(1) = 1 - 0.85 = 0.15。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The SLA Dilemma"
  kicker_en: "The SLA Dilemma"
  kicker_zh: "考核红线困惑"
  kicker_zh_hk: "考核紅線困惑"
  title_en: "Did the morning shift break the service agreement?"
  title_zh: "早班团队到底有没有击穿服务承诺？"
  title_zh_hk: "早班團隊到底有冇擊穿服務承諾？"
  en: "A store monitors whether morning-shift complaints stay within an operating target of at most two. A PMF gives the probability of each exact complaint count, but management needs the probability of all acceptable counts combined. How can the CDF calculate compliance with the threshold and the risk of exceeding it?"
  zh: "门店监测早班投诉是否控制在“至多两起”的运营目标内。PMF 给出每个确切投诉数的概率，但管理层需要把所有达标结果合并起来。CDF 如何计算阈值达标概率，以及超过阈值的风险？"
  zh_hk: "門市監測早班投訴係咪控制喺「最多兩宗」嘅營運目標之內。PMF 會畀出每個確切投訴數嘅概率，但管理層需要將所有達標結果加埋。CDF 點樣計算閾值達標概率，以及超過閾值嘅風險？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Cumulative Distribution Function"
  title_zh: "离散累积分布函数的定义与结构"
  title_zh_hk: "離散累積分佈函數嘅定義與結構"
  formula: "F(x) = P(X <= x) = Sum of p(t) for all t <= x"
  formula_zh: "F(x) = P(X <= x) = 所有满足 t <= x 的单点概率累加求和"
  formula_zh_hk: "F(x) = P(X <= x) = 所有滿足 t <= x 嘅單點概率累加求和"
  formula_tex: "F(x) = P(X \\le x) = \\sum_{t \\le x} P(X = t)"
  s1_en: "The Cumulative Distribution Function, written as capital F of x, measures the probability that a random variable X takes a value less than or equal to a specified limit x."
  s1_zh: "累积分布函数通常记作大写字母 F(x)，它度量的是随机变量 X 的取值小于或等于某一指定考核阈值 x 的整体概率。"
  s1_zh_hk: "累積分佈函數通常記做大寫字母 F(x)，佢度量嘅係隨機變量 X 嘅取值細過或者等於某一指定考核閾值 x 嘅整體概率。"
  s2_en: "Unlike the PMF, which assigns probability to individual values, the CDF adds the probabilities of every value less than or equal to x. It is non-decreasing and approaches 1 as x moves beyond all possible outcomes."
  s2_zh: "PMF 为单个取值赋予概率，而 CDF 则把所有小于或等于 x 的取值概率相加。CDF 不会下降；当 x 超过全部可能结果时，其值达到 1。"
  s2_zh_hk: "PMF 會為單個取值賦予概率，而 CDF 就將所有細過或者等於 x 嘅取值概率加埋。CDF 唔會下降；當 x 超過全部可能結果，佢嘅值就去到 1。"
- id: staircase
  visual: two_column
  seconds: 36
  kicker: "The Geometry"
  kicker_en: "The Geometry"
  kicker_zh: "几何形态"
  kicker_zh_hk: "幾何形態"
  title_en: "The rising operational staircase"
  title_zh: "逐级登高的运营阶梯函数"
  title_zh_hk: "逐級登高嘅營運階梯函數"
  left_en: "Treads: Flat between attainable values"
  left_zh: "踏步台面：可取值之间没有新增概率"
  left_zh_hk: "踏步台面：可取值之間冇新增概率"
  right_en: "Risers: Jumps equal the PMF mass"
  right_zh: "阶梯踢板：在可取值处按 PMF 概率跃升"
  right_zh_hk: "階梯踢板：喺可取值處按 PMF 概率躍升"
  s1_en: "For a discrete random variable, the CDF graph resembles a staircase. Between attainable values, such as between one and two complaints, no additional probability is accumulated."
  s1_zh: "对于离散随机变量，CDF 图像呈阶梯状。在两个可取值之间，例如 1 起与 2 起投诉之间，没有新的概率被累积。"
  s1_zh_hk: "對離散隨機變量嚟講，CDF 圖像呈階梯狀。喺兩個可取值之間，例如 1 宗同 2 宗投訴之間，冇新概率被累積。"
  s2_en: "Therefore, the CDF stays constant between attainable values and rises only where probability mass occurs."
  s2_zh: "因此，CDF 在可取值之间保持不变，只在存在概率质量的取值处上升。"
  s2_zh_hk: "因此，CDF 喺可取值之間保持不變，只會喺存在概率質量嘅取值處上升。"
  s3_en: "At each attainable value, the CDF jumps upward by the PMF probability assigned to that value. The jump size equals P(X = x)."
  s3_zh: "在每个可取值处，CDF 按该点的 PMF 概率向上跳跃；跳跃幅度等于 P(X = x)。"
  s3_zh_hk: "喺每個可取值處，CDF 會按該點嘅 PMF 概率向上跳；跳幅等於 P(X = x)。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目核验"
  kicker_zh_hk: "賬目核驗"
  title_en: "Auditing shift complaints at Mong Kok"
  title_zh: "审计旺角店早班客诉台账"
  title_zh_hk: "審計旺角舖早班客訴台賬"
  step1_en: "Baseline mass: P(0) = 0.60, P(1) = 0.25, P(2) = 0.10, P(3) = 0.05"
  step1_zh: "基准单点概率：0起(0.60)，1起(0.25)，2起(0.10)，3起(0.05)"
  step1_zh_hk: "基準單點概率：0宗(0.60)，1宗(0.25)，2宗(0.10)，3宗(0.05)"
  step2_en: "Compute CDF: F(0) = 0.60, F(1) = 0.85, F(2) = 0.95, F(3) = 1.00"
  step2_zh: "计算累积台阶：F(0)=0.60，F(1)=0.85，F(2)=0.95，F(3)=1.00"
  step2_zh_hk: "計算累積台階：F(0)=0.60，F(1)=0.85，F(2)=0.95，F(3)=1.00"
  step3_en: "Evaluate SLA breach: P(X > 2) = 1 - F(2) = 1 - 0.95 = 5% risk"
  step3_zh: "评估违约罚款：P(X > 2) = 1 - F(2) = 1 - 0.95 = 5% 违约率"
  step3_zh_hk: "評估違約罰款：P(X > 2) = 1 - F(2) = 1 - 0.95 = 5% 違約率"
  s1_en: "Consider a modeled daily complaint PMF for the Mong Kok morning shift: zero complaints has probability 0.60, one has 0.25, two has 0.10, and three has 0.05."
  s1_zh: "考虑旺角店早班每日投诉数的一个模型 PMF：0 起投诉的概率为 0.60，1 起为 0.25，2 起为 0.10，3 起为 0.05。"
  s1_zh_hk: "考慮旺角舖早班每日投訴數嘅一個模型 PMF：0 宗投訴嘅概率係 0.60，1 宗係 0.25，2 宗係 0.10，3 宗係 0.05。"
  s2_en: "Stack the cumulative stairs: F of zero is zero point six zero. F of one adds 0.25, reaching zero point eight five. F of two adds 0.10, reaching zero point nine five."
  s2_zh: "逐级搭建累积台阶：F(0) 跃至 0.60。F(1) 叠加 0.25 达到 0.85。F(2) 进一步叠加 0.10，使累计概率达到 0.95。"
  s2_zh_hk: "逐級搭建累積台階：F(0) 躍至 0.60。F(1) 疊加 0.25 達到 0.85。F(2) 進一步疊加 0.10，令累積概率達到 0.95。"
  s3_en: "The operating target is at most two complaints. F of two equals 0.95, so the model assigns 95% probability to meeting the target. The upper-tail probability of exceeding it is 1 minus 0.95, or 5%."
  s3_zh: "运营目标是投诉至多 2 起。F(2)=0.95，因此模型给出的达标概率为 95%；超过目标的上尾概率为 1-0.95，即 5%。"
  s3_zh_hk: "營運目標係投訴最多 2 宗。F(2)=0.95，所以模型畀出嘅達標概率係 95%；超過目標嘅上尾概率係 1-0.95，即係 5%。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Contracts govern boundaries, not single points"
  title_zh: "商业协议管区间阈值，莫在孤立单点纠缠"
  title_zh_hk: "商業協議管區間閾值，咪喺孤立單點糾纏"
  q1_en: "Why is the CDF essential for risk contracts?"
  q1_zh: "为什么商业风险合同必须依靠累积分布函数？"
  q1_zh_hk: "點解商業風險合約必須依靠累積分佈函數？"
  q2_en: "How do managers calculate upper-tail breach risk?"
  q2_zh: "管理者如何利用 CDF 闪电计算违约概率？"
  q2_zh_hk: "管理者點樣利用 CDF 閃電計算違約概率？"
  s1_en: "When a decision criterion is written as “at most x,” the CDF gives the probability of meeting that upper threshold: F(x) = P(X <= x)."
  s1_zh: "当决策标准写成“至多 x”时，CDF 直接给出满足该上限阈值的概率：F(x)=P(X≤x)。"
  s1_zh_hk: "當決策標準寫成「最多 x」嗰陣，CDF 直接畀出符合上限門檻嘅概率：F(x)=P(X≤x)。"
  s2_en: "To find the probability of exceeding that upper threshold, use the complement: P(X > x) = 1 - F(x)."
  s2_zh: "要想快速求得击穿上限红线的超标违约风险，只需激活补集法则：P(X > x) 等于极为干脆的 1.0 减去 F(x)。"
  s2_zh_hk: "要想快速求得擊穿上限紅線嘅超標違約風險，淨係需要啟動補集法則：P(X > x) 等於極為乾脆嘅 1.0 減去 F(x)。"
  s3_en: "For this complaint model, F(2)=0.95 and P(X>2)=0.05. The operating rule is to use the CDF for cumulative thresholds and the complement for upper-tail exceedance."
  s3_zh: "在这个投诉模型中，F(2)=0.95，且 P(X>2)=0.05。运营规则是：用 CDF 计算累积阈值，用补集计算上尾超标概率。"
  s3_zh_hk: "喺呢個投訴模型入面，F(2)=0.95，而 P(X>2)=0.05。營運規則係：用 CDF 計累積門檻，用補集計上尾超標概率。"