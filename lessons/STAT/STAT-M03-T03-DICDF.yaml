title_en: "Tracking the thresholds"
title_zh: "锁定阈值底线：离散累积分布函数"
title_zh_hk: "鎖定閾值底線：離散累積分佈函數"
objective_en: "Define the discrete Cumulative Distribution Function (CDF) as F(x) = P(X <= x), demonstrate its non-decreasing step-function properties, and use cumulative thresholds to evaluate service-level agreement (SLA) compliance on customer complaints."
objective_zh: "把离散累积分布函数（CDF）定义为 F(x) = P(X <= x)，演示其非递减阶梯函数的几何特性，并运用累积阈值评估顾客投诉的服务等级协议（SLA）达标率。"
objective_zh_hk: "將離散累積分佈函數（CDF）定義為 F(x) = P(X <= x)，演示其非遞減階梯函數嘅幾何特性，並運用累積閾值評估顧客投訴嘅服務承諾協議（SLA）達標率。"
