youtube:
  description_en: |
    Tracking the thresholds
    
    A store watches whether morning-shift complaints stay at most two. A PMF gives each exact count, but management needs every acceptable count combined. How does the CDF get the chance of meeting the threshold — and the chance of blowing past it?
    
    The discrete CDF stacks probability mass into a staircase: F(x) = P(X at most x). Between attainable values the curve stays flat; at each mass point it jumps by the PMF.
    
    For Shop B morning complaints with P(0)=0.60, P(1)=0.25, P(2)=0.10, P(3)=0.05, the stairs give F(2)=0.95. Meeting “at most two” has modeled probability 95%; breach risk is 1 − F(2) = 5%. Contracts govern boundaries, not single points.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 3 (DICDF)
    If this helped, subscribe for the next short.
  description_zh: |
    锁定阈值底线：离散累积分布函数
    
    门店要看早班投诉是不是压在「最多两起」以内。PMF 告诉你每个确切数字的概率，但管理层要的是所有达标结果合在一起。
    
    离散 CDF 把概率质量叠成楼梯：F(x)=P(X 至多 x)。可取值之间是平的，有质量的点才往上跳。
    
    B店早班投诉模型 P(0)=0.60、P(1)=0.25、P(2)=0.10、P(3)=0.05 时，F(2)=0.95。「最多两起」达标约 95%；超标风险 1−F(2)=5%。合同管阈值，不盯单点。
    
    离散与连续概率分布 - 模块3 - 短片3（DICDF）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    鎖定閾值底線：離散累積分佈函數
    
    門市要睇早班投訴係咪壓喺「最多兩宗」以內。PMF 話你知每個確切數字嘅概率，但管理層要嘅係所有達標結果加埋。
    
    離散 CDF 將概率質量疊成樓梯：F(x)=P(X 至多 x)。可取值之間係平嘅，有質量嘅點先向上跳。
    
    B舖早班投訴模型 P(0)=0.60、P(1)=0.25、P(2)=0.10、P(3)=0.05 嗰陣，F(2)=0.95。「最多兩宗」達標約 95%；超標風險 1−F(2)=5%。合約管門檻，唔好盯單點。
    
    離散與連續概率分佈 - 模組3 - 短片3（DICDF）
    覺得有用嘅話，訂閱下一集。
