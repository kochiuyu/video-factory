quiz:
- id: Q1
  type: multiple_choice
  question_en: "For a Bernoulli trial with success probability p, at what value of p does the operational outcome variance reach its theoretical maximum?"
  question_zh: "对于成功概率为 p 的伯努利试验，参数 p 取何值时，业务产出的波动方差达到理论最大值？"
  question_zh_hk: "對於成功概率為 p 嘅伯努利試驗，參數 p 取咩數值嗰陣，業務產出嘅波動方差達到理論最大值？"
  options_en:
  - "A: p = 0.50, where variance sigma^2 = 0.50 * 0.50 = 0.25."
  - "B: p = 1.00, because 100% conversion creates the most profit."
  - "C: p = 0.00, because zero sales implies infinite volatility."
  - "D: p = 0.75, because three out of four customers are satisfied."
  options_zh:
  - "A: p = 0.50，此时方差 sigma^2 = 0.50 × 0.50 = 0.25 达到抛物线顶点。"
  - "B: p = 1.00，因为百分之百的满额转化能创造最高利润。"
  - "C: p = 0.00，因为零销量意味着无限的不确定性。"
  - "D: p = 0.75，因为四分之三的顾客均表示满意。"
  options_zh_hk:
  - "A: p = 0.50，呢個時候方差 sigma^2 = 0.50 × 0.50 = 0.25 達到拋物線頂點。"
  - "B: p = 1.00，因為百分之百嘅滿額轉化能創造最高利潤。"
  - "C: p = 0.00，因為零銷量意味住無限嘅不確定性。"
  - "D: p = 0.75，因為四分之三嘅顧客都表示滿意。"
  answer: A
  explanation_en: "The Bernoulli variance formula sigma^2 = p(1-p) is a downward parabola peaking at p = 0.50. When p moves toward 0 or 1, certainty increases and variance drops."
  explanation_zh: "伯努利方差公式 sigma^2 = p(1-p) 是一条开口向下的抛物线，在 p = 0.50 时取极大值。当 p 趋向于 0 或 1 时，确定性增强，方差收窄。"
  explanation_zh_hk: "伯努利方差公式 sigma^2 = p(1-p) 係一條開口向下嘅拋物線，喺 p = 0.50 嗰陣攞到極大值。當 p 趨向於 0 或者 1 嗰陣，確定性增強，方差收窄。"
- id: Q2
  type: multiple_choice
  question_en: "A cashier prompts incoming guests to upgrade to single-origin beans, succeeding 30% of the time (p = 0.30). What are the expected value E[X] and variance Var(X) for a single customer?"
  question_zh: "收银员向进店顾客推荐升级单品手冲豆，升杯成功率为 30%（p = 0.30）。对于单次进店顾客，其转化指示变量的期望值 E[X] 与方差 Var(X) 分别是多少？"
  question_zh_hk: "收銀員向入舖顧客推薦升級單品手沖豆，升杯成功率為 30%（p = 0.30）。對於單次入舖顧客，其轉化指示變量嘅期望值 E[X] 同方差 Var(X) 分別係幾多？"
  options_en:
  - "A: E[X] = 0.30; Var(X) = 0.21"
  - "B: E[X] = 1.00; Var(X) = 0.30"
  - "C: E[X] = 0.70; Var(X) = 0.49"
  - "D: E[X] = 0.30; Var(X) = 0.09"
  options_zh:
  - "A: E[X] = 0.30；Var(X) = 0.21"
  - "B: E[X] = 1.00；Var(X) = 0.30"
  - "C: E[X] = 0.70；Var(X) = 0.49"
  - "D: E[X] = 0.30；Var(X) = 0.09"
  options_zh_hk:
  - "A: E[X] = 0.30；Var(X) = 0.21"
  - "B: E[X] = 1.00；Var(X) = 0.30"
  - "C: E[X] = 0.70；Var(X) = 0.49"
  - "D: E[X] = 0.30；Var(X) = 0.09"
  answer: A
  explanation_en: "E[X] = p = 0.30. Var(X) = p(1-p) = 0.30 * 0.70 = 0.21."
  explanation_zh: "E[X] = p = 0.30。Var(X) = p(1-p) = 0.30 × 0.70 = 0.21。"
  explanation_zh_hk: "E[X] = p = 0.30。Var(X) = p(1-p) = 0.30 × 0.70 = 0.21。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Atomic Interaction"
  kicker_en: "The Atomic Interaction"
  kicker_zh: "单次交互之变"
  kicker_zh_hk: "單次交互之變"
  title_en: "Yes or no at the register"
  title_zh: "收银机前的一瞬决断：成与败"
  title_zh_hk: "收銀機前嘅一瞬決斷：成與敗"
  en: "At the register, each customer either accepts a single-origin bean upgrade or declines it. For one customer there are only two outcomes, but management still needs a precise way to represent the conversion probability and its uncertainty. How does a Bernoulli random variable model this yes-or-no decision?"
  zh: "在收银台前，每位顾客要么接受单品豆升级，要么拒绝。对单个顾客而言只有两个结果，但管理层仍需要准确表示转化概率及其不确定性。伯努利随机变量如何为这个“接受或拒绝”的决策建模？"
  zh_hk: "喺收銀機前，每位顧客要麼接受單品豆升級，要麼拒絕。對單個顧客嚟講只有兩個結果，但管理層仍然需要準確表示轉化概率同不確定性。伯努利隨機變量點樣為呢個「接受定拒絕」嘅決策建模？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Bernoulli random variable"
  title_zh: "伯努利随机变量与参数 p"
  title_zh_hk: "伯努利隨機變量與參數 p"
  formula: "X in {0, 1}; P(X = 1) = p, P(X = 0) = 1 - p"
  formula_zh: "X 属于 {0, 1}；成功 P(X=1) = p，失败 P(X=0) = 1 - p"
  formula_zh_hk: "X 屬於 {0, 1}；成功 P(X=1) = p，失敗 P(X=0) = 1 - p"
  formula_tex: "X \\sim \\text{Bernoulli}(p), \\quad P(X = x) = p^x (1-p)^{1-x}"
  s1_en: "A Bernoulli trial has exactly two mutually exclusive and collectively exhaustive outcomes. We label the event of interest as X = 1 and the other outcome as X = 0; these labels do not imply value judgments."
  s1_zh: "伯努利试验恰好有两个互斥且完全穷尽的结果。我们把关注的事件标记为 X=1，另一结果标记为 X=0；这些数字只是建模标签。"
  s1_zh_hk: "伯努利試驗啱啱有兩個互斥兼完全窮盡嘅結果。我哋將關注嘅事件標記做 X=1，另一個結果標記做 X=0；呢啲數字只係建模標籤。"
  s2_en: "The model has one parameter, p, which is the probability that X equals 1. The probability that X equals 0 is its complement, 1 minus p."
  s2_zh: "该模型只有一个参数 p，表示 X=1 的概率；X=0 的概率是其补集，即 1-p。"
  s2_zh_hk: "呢個模型只有一個參數 p，表示 X=1 嘅概率；X=0 嘅概率係佢嘅補集，即係 1-p。"
- id: variance
  visual: two_column
  seconds: 36
  kicker: "The Variance Curve"
  kicker_en: "The Variance Curve"
  kicker_zh: "方差抛物线"
  kicker_zh_hk: "方差拋物線"
  title_en: "Mean p, and why uncertainty peaks at fifty percent"
  title_zh: "期望等于 p，而波动在半数时登顶"
  title_zh_hk: "期望等於 p，而波動喺半數嗰陣登頂"
  left_en: "Mean: E[X] = (1*p) + (0*(1-p)) = p"
  left_zh: "数学期望：E[X] 严格恒等于胜率参数 p"
  left_zh_hk: "數學期望：E[X] 嚴格恆等於勝率參數 p"
  right_en: "Variance: Var(X) = p(1 - p)"
  right_zh: "离散方差：Var(X) = p(1-p)，于 0.50 处达峰"
  right_zh_hk: "離散方差：Var(X) = p(1-p)，喺 0.50 處達峰"
  s1_en: "Calculate the expected value: 1 times p plus 0 times 1 minus p equals p. The expected value of an indicator variable is simply the success rate itself."
  s1_zh: "推演数学期望：1 乘 p 加上 0 乘 1 减 p，结果恰好等于 p。指示变量的期望值在数值上就是事件本身的发生胜率。"
  s1_zh_hk: "推演數學期望：1 乘 p 加上 0 乘 1 減 p，結果啱啱好等於 p。指示變量嘅期望值喺數值上就係事件本身嘅發生勝率。"
  s2_en: "Now look at the variance: p times 1 minus p. This creates an inverted parabolic arch."
  s2_zh: "再看代表波动的方差：p 乘以 1 减 p。这在坐标系中勾勒出一条完美的开口向下抛物线。"
  s2_zh_hk: "再睇代表波動嘅方差：p 乘以 1 減 p。呢個喺坐標系入面勾勒出一條完美嘅開口向下拋物線。"
  s3_en: "For a single Bernoulli outcome, variance is small when p is near 0 or 1 and reaches its maximum of 0.25 when p equals 0.50. This describes uncertainty in the indicator, not the full variability of staffing or inventory demand."
  s3_zh: "对单个伯努利结果而言，当 p 接近 0 或 1 时方差较小；当 p=0.50 时，方差达到最大值 0.25。这描述的是指示变量的不确定性，并不等同于排班或库存需求的全部波动。"
  s3_zh_hk: "對單個伯努利結果嚟講，當 p 接近 0 或者 1，方差較細；當 p=0.50，方差去到最大值 0.25。呢個描述嘅係指示變量嘅不確定性，唔等於排班或者庫存需求嘅全部波動。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实推"
  kicker_zh_hk: "賬目實推"
  title_en: "Auditing Airport till upselling"
  title_zh: "审计机场店手冲豆加购转化"
  title_zh_hk: "審計機場舖手沖豆加購轉化"
  step1_en: "Trial definition: X = 1 (Upgrade), X = 0 (Regular)"
  step1_zh: "试验定义：X = 1（加价升级），X = 0（保持普通）"
  step1_zh_hk: "試驗定義：X = 1（加價升級），X = 0（保持普通）"
  step2_en: "Model input: p = 0.30, 1 - p = 0.70"
  step2_zh: "模型输入：p = 0.30，1 - p = 0.70"
  step2_zh_hk: "模型輸入：p = 0.30，1 - p = 0.70"
  step3_en: "Metrics: E[X] = 0.30, Var(X) = 0.30 * 0.70 = 0.21"
  step3_zh: "指标落定：期望值 E[X] = 0.30，方差 Var(X) = 0.21"
  step3_zh_hk: "指標落定：期望值 E[X] = 0.30，方差 Var(X) = 0.21"
  s1_en: "Consider a register-upgrade model for the Airport terminal branch in which each eligible order is recorded as upgrade or no upgrade."
  s1_zh: "考虑机场航站楼店的收银升级模型：每笔符合条件的订单都记录为“升级”或“不升级”。"
  s1_zh_hk: "考慮機場航站樓舖嘅收銀升級模型：每筆符合條件嘅訂單都記錄做「升級」或者「唔升級」。"
  s2_en: "Use p equals zero point three zero as the estimated conversion probability for one eligible order, so the probability of no upgrade is zero point seven zero."
  s2_zh: "把 p=0.30 作为单笔符合条件订单的估计转化概率，则不升级的概率为 0.70。"
  s2_zh_hk: "將 p=0.30 當成單筆符合條件訂單嘅估計轉化概率，噉唔升級嘅概率就係 0.70。"
  s3_en: "For the indicator X, E of X equals zero point three zero and Var of X equals 0.30 times 0.70, or zero point two one. These summarize one modeled customer decision; they do not by themselves forecast the total number of upgrades across a shift."
  s3_zh: "对于指示变量 X，E[X]=0.30，Var(X)=0.30×0.70=0.21。这两个指标概括单次顾客决策，但不能单独预测整班的升级总数。"
  s3_zh_hk: "對指示變量 X 嚟講，E[X]=0.30，Var(X)=0.30×0.70=0.21。呢兩個指標概括單次顧客決策，但唔可以單獨預測成班嘅升級總數。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Compound the atoms to build the fleet"
  title_zh: "串联原子试验，筑就规模大盘"
  title_zh_hk: "串聯原子試驗，築就規模大盤"
  q1_en: "Why do operations executives care about Bernoulli trials?"
  q1_zh: "为什么掌管大局的运营高管必须洞悉伯努利试验？"
  q1_zh_hk: "點解掌管大局嘅營運高管必須洞悉伯努利試驗？"
  q2_en: "When is a Bernoulli model appropriate for one customer decision?"
  q2_zh: "单个顾客决策在什么条件下适合使用伯努利模型？"
  q2_zh_hk: "單個顧客決策喺咩條件之下適合用伯努利模型？"
  s1_en: "Many yes-or-no operational events, such as an upgrade, a defect flag, or a renewal, can be represented with Bernoulli indicators when the two-outcome model fits the process."
  s1_zh: "当二元模型符合业务过程时，升级、次品标记或续约等“是或否”事件，都可以用伯努利指示变量表示。"
  s1_zh_hk: "當二元模型符合業務過程，升級、次品標記或者續約等「係或唔係」事件，都可以用伯努利指示變量表示。"
  s2_en: "A Bernoulli indicator has its largest per-trial variance at p equals 0.50, but managers should not manipulate conversion merely to reduce variance. The objective is to estimate p accurately and connect the indicator to the actual business decision."
  s2_zh: "伯努利指示变量在 p=0.50 时具有最大的单次方差，但管理者不应只为降低方差而操纵转化率。关键是准确估计 p，并把指标与实际业务决策连接起来。"
  s2_zh_hk: "伯努利指示變量喺 p=0.50 嗰陣有最大嘅單次方差，但管理者唔應該純粹為咗降低方差而操縱轉化率。關鍵係準確估計 p，並將指標同實際業務決策連接起嚟。"
  s3_en: "For one eligible order with p equal to 0.30, the Bernoulli model gives E[X] = 0.30 and Var(X) = 0.21. Use it only when the outcome is genuinely binary and the meaning of X = 1 is defined clearly."
  s3_zh: "对一笔符合条件且 p=0.30 的订单，伯努利模型给出 E[X]=0.30、Var(X)=0.21。只有当结果确实是二元，而且 X=1 的含义定义清楚时，才应使用该模型。"
  s3_zh_hk: "對一筆符合條件而 p=0.30 嘅訂單，伯努利模型會畀出 E[X]=0.30、Var(X)=0.21。只有當結果真係二元，而且 X=1 嘅意思定義清楚，先應該用呢個模型。"