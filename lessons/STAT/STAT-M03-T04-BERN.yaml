duration_target_s: 166
title_en: "The binary atomic event"
title_zh: "单次决策的原子基石：伯努利试验"
title_zh_hk: "單次決策嘅原子基石：伯努利試驗"
youtube:
  description_en: |
    The binary atomic event
    
    At the register, each customer either accepts a single-origin bean upgrade or declines it. For one customer there are only two outcomes, but management still needs a precise way to represent the conversion probability and its uncertainty.
    
    A Bernoulli trial codes the outcome as X=1 (upgrade) or X=0 (regular), with P(X=1)=p and P(X=0)=1−p. Expected value equals p; variance equals p(1−p) and peaks at 0.25 when p=0.50.
    
    For Shop C with p=0.30: E[X]=0.30 and Var(X)=0.21. Those summarize one modeled yes-or-no decision. Compound the atoms — Binomial and beyond — when you need fleet totals.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 4 (BERN)
    If this helped, subscribe for the next short.
  description_zh: |
    单次决策的原子基石：伯努利试验
    
    收银台前，每位客人要么接受精品豆升级，要么不接受。一个人只有两个结果，但你还是要说清楚转化概率和波动。
    
    伯努利试验把结果记成 X=1（升级）或 X=0（普通），P(X=1)=p，P(X=0)=1−p。期望等于 p；方差等于 p(1−p)，在 p=0.50 时达到最大 0.25。
    
    C店取 p=0.30：E[X]=0.30，Var(X)=0.21。这概括的是单次是非决策。要规模总量时，再把原子试验串成二项等模型。
    
    离散与连续概率分布 - 模块3 - 短片4（BERN）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    單次決策嘅原子基石：伯努利試驗
    
    收銀機前面，每位客人要麼接受精品豆升級，要麼唔接受。一個人只有兩個結果，但你都要講清楚轉化概率同波動。
    
    伯努利試驗將結果記成 X=1（升級）或 X=0（普通），P(X=1)=p，P(X=0)=1−p。期望等於 p；方差等於 p(1−p)，喺 p=0.50 嗰陣去到最大 0.25。
    
    C舖取 p=0.30：E[X]=0.30，Var(X)=0.21。呢個概括嘅係單次是非決策。要規模總量嗰陣，再將原子試驗串成二項等模型。
    
    離散與連續概率分佈 - 模組3 - 短片4（BERN）
    覺得有用嘅話，訂閱下一集。
