id: STAT-M03-T04-BERN
course: statistics
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
audience: "first-year business students"
audience_en: "first-year business students"
audience_zh: "商学院一年级学生"
audience_zh_hk: "商學院一年級學生"
duration_target_s: 168
title_en: "The binary atomic event"
title_zh: "单次决策的原子基石：伯努利试验"
title_zh_hk: "單次決策嘅原子基石：伯努利試驗"
objective_en: "Define the Bernoulli random variable as a binary operational trial X in {0, 1}, derive its mean mu = p and variance sigma^2 = p(1-p), explain why operational uncertainty peaks at p = 0.50, and evaluate till-side loyalty conversion."
objective_zh: "将伯努利随机变量定义为二元商业试验 X 属于 {0, 1}，推导其期望均值 mu = p 与方差 sigma^2 = p(1-p)，阐释为何业务不确定性在转化率恰好为 50% 时达到顶峰，并运用于收银台会员转化分析。"
objective_zh_hk: "將伯努利隨機變量定義為二元商業試驗 X 屬於 {0, 1}，推導其期望均值 mu = p 同方差 sigma^2 = p(1-p)，闡釋點解業務不確定性喺轉化率啱啱好係 50% 嗰陣達到頂峰，並應用喺收銀機會員轉化分析。"
