id: STAT-M03-T05-BINOM
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
duration_target_s: 166
title_en: "The batch inspection ledger"
title_zh: "批次质检台账：二项分布与抽检决策"
title_zh_hk: "批次質檢台賬：二項分佈與抽檢決策"
youtube:
  description_en: |
    The batch inspection ledger
    
    A warehouse inspects a random sample of twenty ceramic mugs from a large shipment and counts defects. Inspecting every mug may be impractical, but a sample result alone does not automatically determine acceptance.
    
    Under fixed n, binary outcomes, independence, and constant p, the Binomial models the defect count. With n=20 and p=0.05, E[X]=1.0, P(X=0)≈0.358, and P(X=1)≈0.377 — about 73.5% chance of at most one defect after assumptions hold.
    
    Design sampling rules around cumulative binomial risk, plus AQL and producer/consumer risk. If defects cluster or p drifts, reassess before you use the simple Binomial.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 5 (BINOM)
    If this helped, subscribe for the next short.
  description_zh: |
    批次质检台账：二项分布与抽检决策
    
    仓库从一大批陶瓷杯里随机抽 20 只，数次品。逐只全检可能不现实，但一次抽样也不能自动决定收不收货。
    
    在固定 n、二元结果、独立、恒定 p 的假设下，二项分布给次品数建模。n=20、p=0.05 时，E[X]=1.0，P(X=0)≈0.358，P(X=1)≈0.377——假设成立后，「至多一件」约 73.5%。
    
    基于累积二项概率筑验收防线，还要 AQL 与产消双方风险。次品成团或 p 漂移时，先重新评估再套简单二项。
    
    离散与连续概率分布 - 模块3 - 短片5（BINOM）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    批次質檢台賬：二項分佈與抽檢決策
    
    倉庫由一大批陶瓷杯入面隨機抽 20 隻，數次品。逐隻全檢可能唔現實，但一次抽樣亦唔可以自動決定收唔收貨。
    
    喺固定 n、二元結果、獨立、恆定 p 嘅假設之下，二項分佈畀次品數建模。n=20、p=0.05 嗰陣，E[X]=1.0，P(X=0)≈0.358，P(X=1)≈0.377——假設成立之後，「至多一件」約 73.5%。
    
    基於累積二項概率築驗收防線，仲要 AQL 同產消雙方風險。次品成團或者 p 漂移嗰陣，先重新評估再套簡單二項。
    
    離散與連續概率分佈 - 模組3 - 短片5（BINOM）
    覺得有用嘅話，訂閱下一集。
