objective_en: "Define the Binomial distribution as the sum of n independent identical Bernoulli trials, apply its probability formula using combinations, calculate its mean np and variance np(1-p), and evaluate warehouse batch acceptance sampling for ceramic mugs."
objective_zh: "将二项分布定义为 n 次独立同分布伯努利试验的总和，运用组合数二项公式计算概率，推导期望 np 与方差 np(1-p)，并将其应用于陶瓷马克杯入库批次抽检决策。"
objective_zh_hk: "將二項分佈定義為 n 次獨立同分佈伯努利試驗嘅總和，運用組合數二項公式計算概率，推導期望 np 同方差 np(1-p)，並將其應用喺陶瓷馬克杯入庫批次抽檢決策。"
