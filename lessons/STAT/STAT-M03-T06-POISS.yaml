  kicker: "The Queue Surge"
  kicker_en: "The Queue Surge"
  kicker_zh: "早高峰拥堵之谜"
  kicker_zh_hk: "朝高峰擁堵之謎"
  title_en: "When sixty customers hit the counter at once"
  title_zh: "六十杯订单汹涌而至，吧台如何招架？"
  title_zh_hk: "六十杯訂單洶湧而至，吧台點樣招架？"
  en: "A Mong Kok counter receives an average of two customer arrivals per minute during the morning rush, but the actual count varies from minute to minute. Management needs the probability of quiet minutes and of arrival counts that exceed service capacity. When is a Poisson model appropriate for this problem?"
  zh: "旺角店早高峰期间平均每分钟有 2 位顾客到达，但实际人数会逐分钟变化。管理层需要知道安静时段的概率，以及到达人数超过服务能力的概率。泊松模型在什么条件下适合处理这个问题？"
  zh_hk: "旺角舖朝早繁忙時段平均每分鐘有 2 位顧客到達，但實際人數會逐分鐘變化。管理層需要知道安靜分鐘嘅概率，以及到達人數超過服務能力嘅概率。泊松模型喺咩條件之下適合處理呢個問題？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Poisson distribution"
  title_zh: "泊松分布的数学结构"
  title_zh_hk: "泊松分佈嘅數學結構"
  formula: "P(X = k) = (lambda^k * e^(-lambda)) / k!"
  formula_zh: "P(X = k) = (lambda^k × e^(-lambda)) / k!，其中 k = 0, 1, 2, ..."
  formula_zh_hk: "P(X = k) = (lambda^k × e^(-lambda)) / k!，其中 k = 0, 1, 2, ..."
  formula_tex: "P(X = k) = \\frac{\\lambda^k e^{-\\lambda}}{k!}, \\quad k \\in \\{0, 1, 2, \\dots\\}"
  s1_en: "A Poisson count model is appropriate when events occur independently, the average rate is constant over the interval, and simultaneous arrivals are negligible at a sufficiently small scale. X counts events in a specified interval of time or space."
  s1_zh: "当事件相互独立、区间内平均速率保持稳定，而且在足够小的尺度上同时发生多个事件的概率可以忽略时，可使用泊松计数模型。X 统计指定时间或空间区间内的事件数。"
  s1_zh_hk: "當事件互相獨立、區間內平均速率保持穩定，而且喺足夠細嘅尺度上同時發生多個事件嘅概率可以忽略，就可以用泊松計數模型。X 統計指定時間或者空間區間入面嘅事件數。"
  s2_en: "Unlike a Binomial count, a Poisson count has no fixed upper trial limit. Its support is the non-negative integers, and lambda is the expected number of events in the specified interval."
  s2_zh: "与二项计数不同，泊松计数没有固定的试验上限；其取值为非负整数，lambda 表示指定区间内的期望事件数。"
  s2_zh_hk: "同二項計數唔同，泊松計數冇固定嘅試驗上限；佢嘅取值係非負整數，而 lambda 表示指定區間內嘅期望事件數。"
- id: signature
  visual: two_column
  seconds: 36
  kicker: "The Defining Equality"
  kicker_en: "The Defining Equality"
  kicker_zh: "标志性恒等"
  kicker_zh_hk: "標誌性恆等"
  title_en: "Mean equals variance: E[X] = Var(X) = lambda"
  title_zh: "均值等同方差：波动与速率的永恒绑定"
  title_zh_hk: "均值等同方差：波動與速率嘅永恆綁定"
  left_en: "Expectation: E[X] = lambda"
  left_zh: "数学期望：窗口内平均到达客流等于 lambda"
  left_zh_hk: "數學期望：窗口內平均到達客流等於 lambda"
  right_en: "Variance: Var(X) = lambda"
  right_zh: "到达方差：客流波动幅度恰好等于 lambda"
  right_zh_hk: "到達方差：客流波動幅度啱啱好等於 lambda"
  s1_en: "The defining mathematical signature of the Poisson distribution is that its expected value and variance are identical: both equal the parameter lambda."
  s1_zh: "泊松分布最独特的数学印记在于：其数学期望与方差完全相等，二者均严格等于到达率参数 lambda。"
  s1_zh_hk: "泊松分佈最獨特嘅數學印記喺於：其數學期望同方差完全相等，兩者都嚴格等於到達率參數 lambda。"
  s2_en: "If a busy terminal branch handles an average of four arrivals per minute, the variance of those minute-by-minute arrivals is also exactly four."
  s2_zh: "如果一家繁华的枢纽门店平均每分钟迎来四位顾客，那么每分钟客流波动的离散方差也精准地等于四。"
  s2_zh_hk: "如果一間繁華嘅樞紐門市平均每分鐘迎嚟四位顧客，噉每分鐘客流波動嘅離散方差亦都精準噉等於四。"
  s3_en: "Taking the square root gives a standard deviation of two. The interval from two to six is one standard deviation around the mean of four, but it is not a guaranteed range and does not determine a service-capacity target by itself."
  s3_zh: "开平方得到标准差 2。区间 2 到 6 是均值 4 上下一个标准差的范围，但它不是保证区间，也不能单独决定服务产能。"
  s3_zh_hk: "開平方得到標準差 2。區間 2 到 6 係均值 4 上下一個標準差嘅範圍，但佢唔係保證區間，亦唔可以單獨決定服務產能。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实推"
  kicker_zh_hk: "賬目實推"
  title_en: "Staffing Mong Kok at 2 arrivals per minute"
  title_zh: "推演旺角店每分钟到达两人的排班压力"
  title_zh_hk: "推演旺角舖每分鐘到達兩人嘅排班壓力"
  step1_en: "Baseline rate: lambda = 2.0 arrivals per minute; e^(-2) = 0.1353"
  step1_zh: "到达基准：平均每分钟到达 lambda = 2 人；底数常数 e^(-2) ≈ 0.1353"
  step1_zh_hk: "到達基準：平均每分鐘到達 lambda = 2 人；底數常數 e^(-2) ≈ 0.1353"
  step2_en: "P(0) = 0.135; P(1) = 0.271; P(2) = 0.271"
  step2_zh: "逐级概率：零人到达 13.5%，恰好一人 27.1%，恰好两人 27.1%"
  step2_zh_hk: "逐級概率：零人到達 13.5%，啱啱好一人 27.1%，啱啱好兩人 27.1%"
  step3_en: "Capacity overflow: P(X >= 5) = 1 - F(4) = 1 - 0.9473 = 5.3% queue shock"
  step3_zh: "击穿吧台：P(X >= 5) = 1 - F(4) = 5.3% 的分钟会出现 5人以上拥堵"
  step3_zh_hk: "擊穿吧台：P(X >= 5) = 1 - F(4) = 5.3% 嘅分鐘會出現 5人以上擁堵"
  s1_en: "For this Mong Kok illustration, assume a constant rate of lambda equals two arrivals per minute and that the Poisson assumptions are reasonable. The exponential factor e to the negative two is about zero point one three five."
  s1_zh: "在这个旺角店示例中，假设到达率恒定为每分钟 lambda=2，并且泊松假设基本成立。指数项 e 的负二次方约为 0.1353。"
  s1_zh_hk: "喺呢個旺角舖示例入面，假設到達率固定係每分鐘 lambda=2，而且泊松假設大致成立。指數項 e 嘅負二次方大約係 0.1353。"
  s2_en: "Step two gives the modeled probabilities: zero arrivals has probability thirteen point five percent, exactly one has twenty-seven point one percent, and exactly two also has twenty-seven point one percent."
  s2_zh: "第二步给出模型概率：零人到达为 13.5%，恰好 1 人为 27.1%，恰好 2 人也为 27.1%。"
  s2_zh_hk: "第二步畀出模型概率：零人到達係 13.5%，啱啱好 1 人係 27.1%，啱啱好 2 人亦係 27.1%。"
  s3_en: "For illustration, suppose the service threshold is four arrivals per minute. The CDF through four is about 0.9473, so the modeled probability of five or more arrivals is about 0.0527. This is an arrival-threshold calculation, not a complete queueing analysis."
  s3_zh: "作为示例，假设服务阈值为每分钟 4 人。CDF 累加至 4 约为 0.9473，因此 5 人及以上的模型概率约为 0.0527。这是到达阈值计算，并不是完整的排队分析。"
  s3_zh_hk: "作為示例，假設服務門檻係每分鐘 4 人。CDF 累加到 4 大約係 0.9473，所以 5 人或以上嘅模型概率大約係 0.0527。呢個係到達門檻計算，唔係完整嘅排隊分析。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Staff for the Poisson wave, not the flat average"
  title_zh: "按泊松浪涌峰值排班，莫被平滑均值麻痹"
  title_zh_hk: "按泊松浪湧峰值排班，咪被平滑均值麻痹"
  q1_en: "Why does staffing for average arrivals cause lines to spill out the door?"
  q1_zh: "为什么按照平均客流配置人手会导致排队必然失控溢出？"
  q1_zh_hk: "點解按照平均客流配置人手會搞到排隊必然失控溢出？"
  q2_en: "How does the Poisson distribution link batches to continuous time?"
  q2_zh: "泊松分布是如何在批次抽样与连续时间之间搭建桥梁的？"
  q2_zh_hk: "泊松分佈係點樣喺批次抽樣同連續時間之間搭建橋樑嘅？"
  s1_en: "If a Poisson model fits the arrivals, counts above the mean have positive probability. Staffing decisions should therefore consider an acceptable exceedance probability, service time, existing queue, and service target rather than lambda alone."
  s1_zh: "如果泊松模型适合到达过程，高于均值的计数具有正概率。因此排班不应只看 lambda，还应考虑可接受的超标概率、服务时间、现有队列和服务目标。"
  s1_zh_hk: "如果泊松模型適合到達過程，高過均值嘅計數有正概率。所以排班唔應該淨係睇 lambda，仲要考慮可接受嘅超標概率、服務時間、現有隊列同服務目標。"
  s2_en: "Do not use a universal two-standard-deviation buffer. Select capacity from the relevant Poisson tail probability and combine it with service-time and queueing information."
  s2_zh: "不要采用统一的“两倍标准差”缓冲。应根据相关泊松上尾概率选择产能，并结合服务时间与排队信息。"
  s2_zh_hk: "唔好採用劃一嘅「兩倍標準差」緩衝。應該根據相關泊松上尾概率選擇產能，再結合服務時間同排隊資料。"
  s3_en: "For lambda = 2, P(X = 0) is about 13.5% and P(X >= 5) is about 5.3%. Use those tail probabilities for threshold planning only after checking rate stability and arrival independence, and do not treat them as a complete queueing model."
  s3_zh: "当 lambda=2 时，P(X=0) 约为 13.5%，P(X≥5) 约为 5.3%。只有检查速率稳定性与到达独立性后，才可将这些上尾概率用于阈值规划，而且不能把它们当作完整的排队模型。"
  s3_zh_hk: "當 lambda=2，P(X=0) 大約係 13.5%，P(X≥5) 大約係 5.3%。只有檢查速率穩定性同到達獨立性之後，先可以將呢啲上尾概率用於門檻規劃，而且唔可以將佢哋當成完整嘅排隊模型。"