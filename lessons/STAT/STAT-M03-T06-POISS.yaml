youtube:
  description_en: |
    Managing the morning rush
    
    Shop B averages two arrivals per minute in the morning rush, but the count jumps around. You need the chance of a quiet minute and the chance of overflowing capacity.
    
    When a Poisson model fits a stable independent-event rate, mean and variance both equal λ. For λ=2: P(X=0)≈13.5%, P(X=1)≈27.1%, P(X=2)≈27.1%. With a service threshold of four arrivals per minute, P(X at least 5)≈5.3%.
    
    Staff for the Poisson wave, not the flat average. Pick capacity from the upper tail you care about — after checking rate stability and independence.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 6 (POISS)
    If this helped, subscribe for the next short.
  description_zh: |
    早高峰排队调度：泊松分布与客流涌入
    
    B店早高峰平均每分钟来 2 位客人，但实际人数会跳来跳去。你要知道安静一分钟的概率，也要知道挤爆服务能力的概率。
    
    泊松合用时，均值与方差都等于 λ。λ=2 时：P(X=0)约 13.5%，P(X=1)约 27.1%，P(X=2)约 27.1%。服务阈值按每分钟 4 人计，P(X 至少 5)约 5.3%。
    
    按泊松浪涌峰值排班，莫被平滑均值麻痹。按你关心的上尾选承载力——先核对速率稳定与独立性。
    
    离散与连续概率分布 - 模块3 - 短片6（POISS）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    朝高峰排隊調度：泊松分佈與客流湧入
    
    B舖朝早繁忙時段平均每分鐘嚟 2 位客人，但實際人數會跳嚟跳去。你要知安靜一分鐘嘅概率，亦要知迫爆服務能力嘅概率。
    
    泊松合用嗰陣，均值同方差都等於 λ。λ=2 嗰陣：P(X=0)約 13.5%，P(X=1)約 27.1%，P(X=2)約 27.1%。服務門檻按每分鐘 4 人計，P(X 至少 5)約 5.3%。
    
    按泊松浪湧峰值排班，咪被平滑均值麻痹。按你關心嘅上尾揀承載力——先核對速率穩定同獨立性。
    
    離散與連續概率分佈 - 模組3 - 短片6（POISS）
    覺得有用嘅話，訂閱下一集。
