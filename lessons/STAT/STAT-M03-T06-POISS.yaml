quiz:
- id: Q1
  type: multiple_choice
  question_en: "What unique mathematical signature distinguishes a Poisson random variable from other discrete distributions?"
  question_zh: "泊松分布随机变量具有哪项独一无二的标志性数学特征？"
  question_zh_hk: "泊松分佈隨機變量具有邊項獨一無二嘅標誌性數學特徵？"
  options_en:
  - "A: Its expected value and its variance are mathematically identical, both strictly equal to the rate parameter lambda: E[X] = Var(X) = lambda."
  - "B: The probability of zero arrivals is always exactly 0.50 regardless of the rate."
  - "C: Outcomes are strictly limited to integers between 0 and 10."
  - "D: The distribution variance shrinks to zero whenever the shop is open."
  options_zh:
  - "A: 它的数学期望与方差在数学上完全相等，且都严格等于到达率参数 lambda：E[X] = Var(X) = lambda。"
  - "B: 无论客流多大，零到达的概率永远固定等于 0.50。"
  - "C: 结果被严格限制在 0 到 10 之间的有限整数区间内。"
  - "D: 只要门店正常开门营业，其客流方差就会自动归零。"
  options_zh_hk:
  - "A: 佢嘅數學期望同方差喺數學上完全相等，兼且都嚴格等於到達率參數 lambda：E[X] = Var(X) = lambda。"
  - "B: 無論客流幾大，零到達嘅概率永遠固定等於 0.50。"
  - "C: 結果被嚴格限制喺 0 到 10 之間嘅有限整數區間入面。"
  - "D: 只要門市正常開門營業，其客流方差就會自動歸零。"
  answer: A
  explanation_en: "In a pure Poisson process, the mean and variance are tied together by definition: E[X] = Var(X) = lambda. If variance significantly exceeds the mean in real store data, overdispersion is present."
  explanation_zh: "在纯粹的泊松过程中，均值与方差在数学定义上严格绑定：E[X] = Var(X) = lambda。如果实测数据的方差远超均值，则表明存在超额离散现象。"
  explanation_zh_hk: "喺純粹嘅泊松過程入面，均值同方差喺數學定義上嚴格綁定：E[X] = Var(X) = lambda。如果實測數據嘅方差遠超均值，就表明存在超額離散現象。"
- id: Q2
  type: multiple_choice
  question_en: "During morning rush, a cafe counter receives on average lambda = 2 customer arrivals per minute. What is the probability that exactly 0 customers arrive in a specific one-minute window?"
  question_zh: "在早高峰期间，咖啡吧台平均每分钟迎来 lambda = 2 位顾客到达。在指定的某 1 分钟窗口内，恰好有 0 位顾客到达的概率是多少？"
  question_zh_hk: "喺朝高峰期間，咖啡吧台平均每分鐘迎嚟 lambda = 2 位顧客到達。喺指定嘅某 1 分鐘窗口入面，啱啱好有 0 位顧客到達嘅概率係幾多？"
  options_en:
  - "A: e^(-2) ≈ 0.135"
  - "B: 2.000"
  - "C: 0.500"
  - "D: 0.020"
  options_zh:
  - "A: e^(-2) ≈ 0.135"
  - "B: 2.000"
  - "C: 0.500"
  - "D: 0.020"
  options_zh_hk:
  - "A: e^(-2) ≈ 0.135"
  - "B: 2.000"
  - "C: 0.500"
  - "D: 0.020"
  answer: A
  explanation_en: "Using the Poisson formula P(X = k) = (lambda^k * e^(-lambda)) / k!, for k = 0: P(X = 0) = (2^0 * e^(-2)) / 0! = 1 * e^(-2) / 1 ≈ 0.1353 (13.5%)."
  explanation_zh: "根据泊松公式 P(X = k) = (lambda^k * e^(-lambda)) / k!，当 k = 0 时：P(X = 0) = (2^0 * e^(-2)) / 0! = e^(-2) ≈ 0.1353（即 13.5%）。"
  explanation_zh_hk: "根據泊松公式 P(X = k) = (lambda^k * e^(-lambda)) / k!，當 k = 0 嗰陣：P(X = 0) = (2^0 * e^(-2)) / 0! = e^(-2) ≈ 0.1353（即 13.5%）。"
beats:
- id: hook
  visual: title_card
