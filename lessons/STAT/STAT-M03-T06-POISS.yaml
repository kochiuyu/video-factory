audience_zh: "商学院一年级学生"
audience_zh_hk: "商學院一年級學生"
duration_target_s: 168
title_en: "Managing the morning rush"
title_zh: "早高峰排队调度：泊松分布与客流涌入"
title_zh_hk: "朝高峰排隊調度：泊松分佈與客流湧入"
objective_en: "Define the Poisson distribution as a model for discrete event arrivals over continuous time, explain the arrival rate parameter lambda, leverage the equality E[X] = Var(X) = lambda, and calculate queue capacity risks during morning rush hours."
objective_zh: "将泊松分布定义为连续时间流中离散事件到达的模型，解析到达率参数 lambda，掌握期望与方差均等于 lambda 的核心特性，并测算早高峰时段排队容量击穿风险。"
objective_zh_hk: "將泊松分佈定義為連續時間流入面離散事件到達嘅模型，解析到達率參數 lambda，掌握期望同方差均等於 lambda 嘅核心特性，並測算朝高峰時段排隊容量擊穿風險。"
