- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Law of Rare Events"
  title_zh: "小概率事件定律与泊松近似"
  title_zh_hk: "小概率事件定律與泊松近似"
  formula: "Binomial(n, p) converges to Poisson(lambda = n * p) as n -> inf, p -> 0"
  formula_zh: "当 n 极大且 p 极微时，二项分布 Binomial(n, p) 极限收敛于泊松分布 Poisson(lambda = np)"
  formula_zh_hk: "當 n 極大兼且 p 極微嗰陣，二項分佈 Binomial(n, p) 極限收斂於泊松分佈 Poisson(lambda = np)"
  formula_tex: "\\lim_{n \\to \\infty, p \\to 0} \\binom{n}{k} p^k (1-p)^{n-k} = \\frac{\\lambda^k e^{-\\lambda}}{k!}, \\quad \\lambda = np"
  s1_en: "The Poisson limit applies when independent Bernoulli trials have n increasing, p decreasing, and the product np approaching a finite value lambda. For large n and small p, Poisson(lambda=np) may approximate the Binomial count."
  s1_zh: "当 n 很大、p 很小，二项计数可以用 λ=np 的泊松来近似——省事，但不是免检通行证。"
  s1_zh_hk: "當 n 好大、p 好細，二項計數可以用 λ=np 嘅泊松嚟近似——慳事，但唔係免檢通行證。"
  s2_en: "The approximation replaces Binomial(n,p) with Poisson(lambda=np). It can simplify hand calculation, although modern software can also evaluate the exact Binomial probability without directly expanding enormous factorials."
  s2_zh: "该近似用 Poisson(lambda=np) 代替 Binomial(n,p)，可简化手算；现代软件也能在不直接展开巨大阶乘的情况下计算精确二项概率。"
  s2_zh_hk: "呢個近似用 Poisson(lambda=np) 代替 Binomial(n,p)，可以簡化手算；現代軟件亦可以唔直接展開巨大階乘而計到精確二項概率。"
- id: criteria
  visual: two_column
  seconds: 36
  kicker: "The Rule of Thumb"
  kicker_en: "The Rule of Thumb"
  kicker_zh: "应用判据"
  kicker_zh_hk: "應用判據"
  title_en: "A practical screening checklist"
  title_zh: "实务中的近似筛选准则"
  title_zh_hk: "實務中嘅近似篩選準則"
  left_en: "Sample Size: n >= 100 trials"
  left_zh: "样本基数充分大：试验次数 n >= 100"
  left_zh_hk: "樣本基數充分大：試驗次數 n >= 100"
  right_en: "Rare Probability: p <= 0.05, lambda <= 10"
  right_zh: "事件极罕见：概率 p <= 0.05 且乘积 lambda <= 10"
  right_zh_hk: "事件極罕見：概率 p <= 0.05 兼且乘積 lambda <= 10"
  s1_en: "Rules of thumb screen whether the approximation is likely to be useful, but different courses and applications use different cutoffs. Accuracy should be judged for the probability or tail that matters."
  s1_zh: "经验准则可初步判断近似是否可能有用，但不同课程和应用会采用不同阈值。应针对实际关注的概率或尾部检验近似精度。"
  s1_zh_hk: "經驗準則可以初步判斷近似係咪可能有用，但唔同課程同應用會採用唔同門檻。應該針對實際關注嘅概率或者尾部檢驗近似精度。"
  s2_en: "One classroom convention is n at least one hundred and p at most five percent. These are screening values, not universal mathematical requirements."
  s2_zh: "一种课堂经验准则是 n 至少为 100、p 不高于 5%。这些只是筛选阈值，并非普遍适用的数学硬条件。"
  s2_zh_hk: "一種課堂經驗準則係 n 至少為 100、p 唔高過 5%。呢啲只係篩選門檻，唔係普遍適用嘅數學硬條件。"
  s3_en: "The same convention also keeps lambda=np at ten or below. Meeting it does not make the error zero, so compare against the exact Binomial result when the decision is sensitive to approximation error."
  s3_zh: "同一经验准则还要求 lambda=np 不高于 10。满足这些条件也不表示误差为零；若决策对近似误差敏感，应与精确二项结果比较。"
  s3_zh_hk: "同一經驗準則仲要求 lambda=np 唔高過 10。符合呢啲條件亦唔表示誤差係零；如果決策對近似誤差敏感，應該同精確二項結果比較。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Auditing 2,000 espresso machine pulls"
  title_zh: "两千杯高压萃取的密封圈安全台账"
  title_zh_hk: "兩千杯高壓萃取嘅密封圈安全台賬"
  step1_en: "Check conditions: n = 2,000 >= 100, p = 0.001 <= 0.05 -> Valid!"
  step1_zh: "准据核准：n = 2,000 >= 100，p = 0.001 <= 0.05，完全符合条件"
  step1_zh_hk: "準據核准：n = 2,000 >= 100，p = 0.001 <= 0.05，完全符合條件"
  step2_en: "Equivalent rate: lambda = 2,000 * 0.001 = 2.0 blowouts per week"
  step2_zh: "折算强度：lambda = 2,000 × 0.001 = 全周期望爆垫 2.0 次"
  step2_zh_hk: "折算強度：lambda = 2,000 × 0.001 = 全周期望爆圈 2.0 次"
  step3_en: "Poisson odds: P(0) = 0.135, P(1) = 0.271, P(2) = 0.271, P(>=3) = 0.323"
  step3_zh: "精准预警：零次13.5%，一次27.1%，两次27.1%，三次及以上32.3%"
  step3_zh_hk: "精準預警：零次13.5%，一次27.1%，兩次27.1%，三次及以上32.3%"
  s1_en: "For this Shop C illustration, assume 2,000 independent pulls in a week and a constant gasket-failure probability of 0.001 per pull."
  s1_zh: "在这个C店示例中，假设一周有 2,000 次相互独立的萃取，每次密封圈失效概率固定为 0.001。"
  s1_zh_hk: "喺呢個C舖示例入面，假設一星期有 2,000 次互相獨立嘅萃取，每次密封圈失效概率固定係 0.001。"
  s2_en: "The example passes the stated screening convention: n is 2,000, p is 0.001, and lambda=np equals 2. The Poisson approximation therefore merits consideration, subject to the independence and constant-p assumptions."
  s2_zh: "本例通过所述经验筛选：n=2,000、p=0.001，而且 lambda=np=2。因此可考虑泊松近似，但仍须满足独立性与固定 p 假设。"
  s2_zh_hk: "本例通過所述經驗篩選：n=2,000、p=0.001，而且 lambda=np=2。所以可以考慮泊松近似，但仍然要符合獨立性同固定 p 假設。"
  s3_en: "Under Poisson(2), the modeled probabilities are 13.5% for zero failures, 27.1% for one, and 27.1% for two. The complement gives about 32.3% for three or more; maintenance actions require separate cost, safety, and service information."
  s3_zh: "在 Poisson(2) 下，模型给出零次失效 13.5%、一次 27.1%、两次 27.1%。利用补集得出三次及以上约为 32.3%；维修行动仍需结合成本、安全和服务信息。"
  s3_zh_hk: "喺 Poisson(2) 之下，模型畀出零次失效 13.5%、一次 27.1%、兩次 27.1%。用補集得到三次或以上大約 32.3%；維修行動仍然要結合成本、安全同服務資料。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Use Poisson to model rare defects at scale"
  title_zh: "大样本微概率，果断启用泊松近似"
  title_zh_hk: "大樣本微概率，果斷啟用泊松近似"
  q1_en: "When Poisson≈Binomial? → Large n, small p, independent, constant p"
  q1_zh: "何时泊松近似二项？→ n 大、p 小、独立、p 恒定"
  q1_zh_hk: "幾時泊松近似二項？→ n 大、p 細、獨立、p 恆定"
  q2_en: "Sensitive decision? → Cross-check exact Binomial or bound the error"
  q2_zh: "决策很敏感？→ 对照精确二项，或给出误差界"
  q2_zh_hk: "決策好敏感？→ 對照精確二項，或者畀誤差界"
  s1_en: "Treat n-large / p-small cutoffs as rules of thumb, not guarantees."
  s1_zh: "把“n 大、p 小”当成经验门槛，不是万能保证。"
  s1_zh_hk: "將「n 大、p 細」當成經驗門檻，唔係萬能保證。"
  s2_en: "If the decision hangs on approximation error, compare with the exact Binomial before you act."
  s2_zh: "如果对近似误差很敏感，行动前先和精确二项对照。"
  s2_zh_hk: "如果對近似誤差好敏感，行動前先同精確二項對照。"
  s3_en: "n=2000, p=0.001 → λ=2, P(X≥3)≈32.3% under Poisson — only with the stated assumptions."
  s3_zh: "n=2000、p=0.001 → λ=2，泊松下 P(X≥3)约 32.3%——前提是假设成立。"
  s3_zh_hk: "n=2000、p=0.001 → λ=2，泊松下 P(X≥3)約 32.3%——前提係假設成立。"
