youtube:
  description_en: |
    Catching rare quality hazards
    
    Shop C models 2,000 espresso pulls in a week, with a gasket-failure probability of 0.001 per pull. Management wants the probability of three or more failures. The exact Binomial is available — can a Poisson approximation simplify the work?
    
    A common classroom screen is large n, small p, and λ=np kept modest (here λ=2). Under those conditions Poisson(λ=2) approximates the rare-event count and makes P(X at least 3) faster to evaluate — still compare with the exact Binomial when the decision is high stakes.
    
    Use Poisson to model rare defects at scale after you check the assumptions. Large n and tiny p is the setting where the approximation earns its keep.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 7 (POAPP)
    If this helped, subscribe for the next short.
  description_zh: |
    捕捉罕见质量隐患：泊松近似与极限法则
    
    C店按一周 2000 次浓缩萃取建模，每次密封圈失效概率 0.001。你要一周出现 3 次及以上失效的概率。精确二项能算，但泊松近似能不能更省事？
    
    课堂常用筛查：n 够大、p 够小，且 λ=np 不太大（这里 λ=2）。此时 Poisson(λ=2) 可近似罕见计数，更快评估「至少 3 次」——高风险决策仍应对照精确二项。
    
    大样本微概率，果断启用泊松近似——先核对假设。这正是近似真正省力的场景。
    
    离散与连续概率分布 - 模块3 - 短片7（POAPP）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    捕捉罕見質量隱患：泊松近似與極限定則
    
    C舖按一星期 2000 次濃縮萃取建模，每次密封圈失效概率 0.001。你要一星期出現 3 次或以上失效嘅概率。精確二項計得，但泊松近似可唔可以更省事？
    
    課堂常用篩查：n 夠大、p 夠細，兼且 λ=np 唔太大（呢度 λ=2）。呢陣 Poisson(λ=2) 可以近似罕見計數，更快評估「至少 3 次」——高風險決策都應對照精確二項。
    
    大樣本微概率，果斷啟用泊松近似——先核對假設。呢個正正係近似真正慳力嘅場景。
    
    離散與連續概率分佈 - 模組3 - 短片7（POAPP）
    覺得有用嘅話，訂閱下一集。
