  en: "An Airport store models 2,000 espresso pulls in a week, with a gasket-failure probability of 0.001 per pull. Management wants the probability of three or more failures. The exact Binomial model is available, but can a Poisson distribution provide a simpler approximation, and what assumptions must be checked first?"
  zh: "机场店以一周 2,000 次浓缩咖啡萃取建立模型，假设每次密封圈失效的概率为 0.001。管理层需要计算一周发生 3 次及以上失效的概率。精确二项模型可以使用，但泊松分布能否提供更简便的近似？使用前应检查哪些假设？"
