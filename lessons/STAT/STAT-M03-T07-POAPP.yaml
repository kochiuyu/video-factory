quiz:
- id: Q1
  type: multiple_choice
  question_en: "Under which operational conditions is substituting a Binomial distribution with a Poisson distribution mathematically valid and recommended?"
  question_zh: "在下列哪种业务场景下，使用泊松分布替代二项分布在数学上不仅高度精准且运算极力推荐？"
  question_zh_hk: "喺下列邊種業務場景之下，使用泊松分佈替代二項分佈喺數學上唔單止高度精準兼且運算極力推薦？"
  options_en:
  - "A: When the trial count n is large (n >= 100) and the single-trial event probability p is very rare (p <= 0.05), with lambda = np remaining moderate."
  - "B: When n is very small (n <= 5) and the probability is exactly 0.50."
  - "C: Only when the warehouse inventory is completely sold out by noon."
  - "D: When the standard deviation exceeds the market capitalization of the firm."
  options_zh:
  - "A: 当试验基数 n 极大（n >= 100）且单次发生概率 p 极低（p <= 0.05），使得期望到达率 lambda = np 保持在温和适中区间时。"
  - "B: 当试验样本极小（n <= 5）且单次成功率恰好等于 0.50 时。"
  - "C: 仅当仓库货架上的所有库存商品在中午前被全部抢购一空时。"
  - "D: 仅当业务方差的标准差超过整家上市公司的股票总市值时。"
  options_zh_hk:
  - "A: 當試驗基數 n 極大（n >= 100）兼且單次發生概率 p 極低（p <= 0.05），令到期望到達率 lambda = np 保持喺溫和適中區間嗰陣。"
  - "B: 當試驗樣本極細（n <= 5）兼且單次成功率啱啱好等於 0.50 嗰陣。"
  - "C: 淨係得當倉庫貨架上嘅所有庫存商品喺中午前被全部搶購一空嗰陣。"
  - "D: 淨係得當業務方差嘅標準差超過成間上市公司嘅股票總市值嗰陣。"
  answer: A
  explanation_en: "The Law of Rare Events states that as n -> infinity and p -> 0 with lambda = np held constant, Binomial(n, p) converges mathematically to Poisson(lambda). The rule of thumb n >= 100 and p <= 0.05 ensures excellent accuracy."
  explanation_zh: "小概率事件定律指出：当 n 趋向无穷且 p 趋向于 0、保持 lambda = np 恒定时，二项分布收敛于泊松分布。通常 n >= 100 且 p <= 0.05 时近似误差微乎其微。"
  explanation_zh_hk: "小概率事件定律指出：當 n 趨向無窮兼且 p 趨向於 0、保持 lambda = np 恆定嗰陣，二項分佈收斂於泊松分佈。通常 n >= 100 兼且 p <= 0.05 嗰陣近似誤差微乎其微。"
- id: Q2
  type: multiple_choice
  question_en: "Across 2,000 espresso pulls in a week, machine gasket blowouts occur with historical probability p = 0.001. Using the Poisson approximation, what is lambda, and what is the probability of zero blowouts?"
  question_zh: "在全周抽拉的 2,000 杯浓缩咖啡中，密封胶圈爆裂的历史概率为 p = 0.001。运用泊松近似，等效参数 lambda 是多少，全周零爆裂的概率是多少？"
  question_zh_hk: "喺全周沖煮嘅 2,000 杯濃縮咖啡入面，密封膠圈爆裂嘅歷史概率為 p = 0.001。運用泊松近似，等效參數 lambda 係幾多，全周零爆裂嘅概率係幾多？"
  options_en:
  - "A: lambda = 2.0; P(X = 0) = e^(-2) ≈ 0.135"
  - "B: lambda = 0.002; P(X = 0) = 0.998"
  - "C: lambda = 20.0; P(X = 0) = 0.000"
  - "D: lambda = 2,000; P(X = 0) = 0.500"
  options_zh:
  - "A: lambda = 2.0；P(X = 0) = e^(-2) ≈ 0.135"
  - "B: lambda = 0.002；P(X = 0) = 0.998"
  - "C: lambda = 20.0；P(X = 0) = 0.000"
  - "D: lambda = 2,000；P(X = 0) = 0.500"
  options_zh_hk:
  - "A: lambda = 2.0；P(X = 0) = e^(-2) ≈ 0.135"
  - "B: lambda = 0.002；P(X = 0) = 0.998"
  - "C: lambda = 20.0；P(X = 0) = 0.000"
  - "D: lambda = 2,000；P(X = 0) = 0.500"
  answer: A
  explanation_en: "lambda = n * p = 2,000 * 0.001 = 2.0 blowouts per week. P(X = 0) = (2^0 * e^(-2)) / 0! = e^(-2) ≈ 0.1353 (13.5%)."
  explanation_zh: "lambda = n * p = 2,000 * 0.001 = 每周 2.0 次爆裂。P(X = 0) = (2^0 * e^(-2)) / 0! = e^(-2) ≈ 0.1353（即 13.5%）。"
  explanation_zh_hk: "lambda = n * p = 2,000 * 0.001 = 每周 2.0 次爆裂。P(X = 0) = (2^0 * e^(-2)) / 0! = e^(-2) ≈ 0.1353（即 13.5%）。"
