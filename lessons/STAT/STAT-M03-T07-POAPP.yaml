title_en: "Catching rare quality hazards"
title_zh: "捕捉罕见质量隐患：泊松近似与极限法则"
title_zh_hk: "捕捉罕見質量隱患：泊松近似與極限定則"
objective_en: "Explain the Poisson approximation to the Binomial distribution for large n and small p, verify the operational rule of thumb (n >= 100, p <= 0.05, and lambda = np <= 10), and evaluate espresso machine pressure seal blowout risks."
objective_zh: "阐释大样本 n 与微小概率 p 条件下二项分布向泊松分布的收敛近似，验证常用运营判据（n >= 100，p <= 0.05 且 lambda = np <= 10），并将其应用于商用咖啡机密封垫圈爆裂风险评估。"
objective_zh_hk: "闡釋大樣本 n 同微小概率 p 條件下二項分佈向泊松分佈嘅收斂近似，驗證常用營運判據（n >= 100，p <= 0.05 兼且 lambda = np <= 10），並將其應用喺商用咖啡機密封膠圈爆裂風險評估。"
