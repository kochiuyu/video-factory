quiz:
- id: Q1
  type: multiple_choice
  question_en: "Why is the probability of a continuous variable taking an exact single value mathematically equal to zero: P(X = 45.00000000...) = 0?"
  question_zh: "为什么连续型随机变量恰好精准落在某一个具体单点数值上的概率在数学上严格等于零：P(X = 45.00000000...) = 0？"
  question_zh_hk: "點解連續型隨機變量啱啱好精準落喺某一個具體單點數值上嘅概率喺數學上嚴格等於零：P(X = 45.00000000...) = 0？"
  options_en:
  - "A: Because a continuous continuum contains uncountably infinite possible points, giving a single point zero width (dx = 0) and therefore zero area under the density curve."
  - "B: Because stopwatches used by retail managers automatically break down at 45 seconds."
  - "C: Because continuous events are physically impossible to observe in real-world cafes."
  - "D: Because probability density values f(x) are legally prohibited from exceeding zero."
  options_zh:
  - "A: 因为连续区间内包含不可数无穷多个潜在数值点，使得单个孤立点的宽度为零（dx = 0），因此曲线下的积分面积严格为零。"
  - "B: 因为门店店长所使用的计时秒表在运行到 45 秒时会自动死机停跳。"
  - "C: 因为在现实门店中，物理法则禁止任何人观测到连续变化的变量。"
  - "D: 因为计量法规明文规定概率密度函数的值 f(x) 绝不能大于零。"
  options_zh_hk:
  - "A: 因為連續區間入面包含不可數無窮多個潛在數值點，令到單個孤立點嘅寬度為零（dx = 0），因此曲線下嘅積分面積嚴格為零。"
  - "B: 因為門市店長所使用嘅計時秒錶喺運作到 45 秒嗰陣會自動死機停跳。"
  - "C: 因為喺現實門市入面，物理法則禁止任何人觀測到連續變化嘅變量。"
  - "D: 因為計量法規明文規定概率密度函數嘅值 f(x) 絕唔可以大過零。"
  answer: A
  explanation_en: "Probability in continuous distributions represents the area under the curve. A single point has width zero, so Integral from c to c of f(x)dx = 0, even though f(c) > 0."
  explanation_zh: "在连续型分布中，概率严格等于曲线下方的面积。单点在几何上没有宽度，因此积分面积为零，即便该点的密度高度 f(c) 大于零。"
  explanation_zh_hk: "喺連續型分佈入面，概率嚴格等於曲線下方嘅面積。單點喺幾何上冇寬度，因此積分面積為零，就算嗰個點嘅密度高度 f(c) 大過零都係噉話。"
- id: Q2
  type: multiple_choice
  question_en: "If a barista's pour-over brew time has a uniform density f(x) = 1/20 between 40 and 60 seconds, what is the probability that an order takes between 45 and 55 seconds?"
  question_zh: "如果咖啡师冲煮一杯手冲的时间在 40 到 60 秒之间呈均匀密度 f(x) = 1/20，那么出餐耗时落在 45 到 55 秒之间的概率是多少？"
  question_zh_hk: "如果咖啡師沖煮一杯手沖嘅時間喺 40 到 60 秒之間呈均勻密度 f(x) = 1/20，噉出餐耗時落喺 45 到 55 秒之間嘅概率係幾多？"
  options_en:
  - "A: (55 - 45) * (1/20) = 10 / 20 = 0.50 (50%)"
  - "B: 1/20 = 0.05 (5%)"
  - "C: 55 / 60 = 0.917 (91.7%)"
  - "D: Exactly 0.00 because of the zero-probability paradox"
  options_zh:
  - "A: (55 - 45) × (1/20) = 10 / 20 = 0.50 (即 50%)"
  - "B: 1/20 = 0.05 (即 5%)"
  - "C: 55 / 60 ≈ 0.917 (即 91.7%)"
  - "D: 依据零概率悖论，任何区间的概率都精确为零"
  options_zh_hk:
  - "A: (55 - 45) × (1/20) = 10 / 20 = 0.50 (即 50%)"
  - "B: 1/20 = 0.05 (即 5%)"
  - "C: 55 / 60 ≈ 0.917 (即 91.7%)"
  - "D: 依據零概率悖論，任何區間嘅概率都精確為零"
  answer: A
  explanation_en: "For continuous random variables, probability is the area of the interval: Width * Height = (55 - 45) * (1/20) = 10 * 0.05 = 0.50."
  explanation_zh: "对于连续型随机变量，概率等于区间的矩形面积：底宽 × 高度 = (55 - 45) × (1/20) = 10 × 0.05 = 0.50。"
  explanation_zh_hk: "對於連續型隨機變量，概率等於區間嘅矩形面積：底寬 × 高度 = (55 - 45) × (1/20) = 10 × 0.05 = 0.50。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Stopwatch Paradox"
  kicker_en: "The Stopwatch Paradox"
  kicker_zh: "秒表上的数学悖论"
  kicker_zh_hk: "秒錶上嘅數學悖論"
  title_en: "What are the odds of taking exactly 45 seconds?"
  title_zh: "精准耗时四十五秒整的概率，竟是零？"
  title_zh_hk: "精準耗時四十五秒整嘅概率，竟然係零？"
  en: "A store models pour-over preparation time as a continuous random variable. Under that model, the probability of finishing at exactly 45 seconds is zero, even though every observed brew receives some recorded time. How can a possible outcome have zero point probability, and what probability should management calculate instead?"
  zh: "门店把手冲制作时间建模为连续型随机变量。在该模型下，恰好 45 秒完成的概率为零，尽管每杯咖啡最终都会记录一个时间。一个可能发生的结果为何具有零单点概率？管理层真正应该计算哪种概率？"
  zh_hk: "門市將手沖製作時間建模成連續型隨機變量。喺呢個模型之下，啱啱好 45 秒完成嘅概率係零，雖然每杯咖啡最後都會記錄一個時間。一個可能發生嘅結果點解會有零單點概率？管理層真正應該計邊種概率？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "From mass to probability density"
  title_zh: "从离散质量到连续概率密度"
  title_zh_hk: "由離散質量到連續概率密度"
  formula: "P(a <= X <= b) = Integral from a to b of f(x) dx; P(X = c) = 0"
  formula_zh: "P(a <= X <= b) = 区间 [a, b] 曲线下的积分面积；且单点 P(X = c) = 0"
  formula_zh_hk: "P(a <= X <= b) = 區間 [a, b] 曲線下嘅積分面積；兼且單點 P(X = c) = 0"
  formula_tex: "P(a \\le X \\le b) = \\int_{a}^{b} f(x)\\,dx, \\quad P(X = c) = \\int_{c}^{c} f(x)\\,dx = 0"
  s1_en: "Continuous variables like time, temperature, and weight can take an uncountably infinite number of values along a continuum."
  s1_zh: "诸如制作耗时、牛奶温度和咖啡豆重量等连续型变量，可以在连续数轴上取不可数无穷多个潜在数值。"
  s1_zh_hk: "好似製作耗時、牛奶溫度同咖啡豆重量呢啲連續型變量，可以喺連續數軸上面攞到不可數無窮多個潛在數值。"
  s2_en: "A probability density function f(x) is nonnegative and has total area one. Probabilities come from integrating the density over intervals; the value f(x) is a density per unit, not the probability of the single point x."
  s2_zh: "概率密度函数 f(x) 必须非负，而且曲线下总面积为 1。概率来自对区间上的密度积分；f(x) 是单位尺度上的密度，并不是单点 x 的概率。"
  s2_zh_hk: "概率密度函數 f(x) 必須非負，而且曲線下總面積係 1。概率來自對區間上嘅密度積分；f(x) 係每個單位尺度嘅密度，唔係單點 x 嘅概率。"
- id: paradox
  visual: two_column
  seconds: 36
  kicker: "The Geometry"
  kicker_en: "The Geometry"
  kicker_zh: "几何解密"
  kicker_zh_hk: "幾何解密"
  title_en: "Points have zero width, intervals have area"
  title_zh: "孤立单点无宽度，区间横跨方成面"
  title_zh_hk: "孤立單點冇寬度，區間橫跨先成面"
  left_en: "Single Point: Width dx = 0 -> Area = 0"
  left_zh: "单点取值：底边宽度为零，所围面积必定为零"
  left_zh_hk: "單點取值：底邊寬度為零，所圍面積必定為零"
  right_en: "Interval Range: Width * Height = Real Area"
  right_zh: "区间范围：底宽乘以高度，形成真实决策概率"
  right_zh_hk: "區間範圍：底寬乘以高度，形成真實決策概率"
  s1_en: "In continuous probability, likelihood is purely geometric: probability equals the area under the density curve."
  s1_zh: "在连续型概率体系中，可能性的度量纯粹是一个几何问题：概率严格等于密度曲线下方的投影面积。"
  s1_zh_hk: "喺連續型概率體系入面，可能性嘅度量純粹係一個幾何問題：概率嚴格等於密度曲線下方嘅投影面積。"
  s2_en: "For an absolutely continuous distribution, the event X equals exactly 45 corresponds to an interval of zero width, so its integral is zero. A displayed stopwatch reading of 45.0 seconds usually represents a rounded interval, which can have positive probability."
  s2_zh: "对于绝对连续分布，事件 X 恰好等于 45 对应零宽区间，因此积分为零。秒表显示的 45.0 秒通常代表经过四舍五入的区间，该区间可以具有正概率。"
  s2_zh_hk: "對絕對連續分佈嚟講，事件 X 啱啱好等於 45 對應零寬區間，所以積分係零。秒錶顯示嘅 45.0 秒通常代表經過四捨五入嘅區間，而呢個區間可以有正概率。"
  s3_en: "To obtain a positive probability, specify a nonzero interval, such as 44 to 46 seconds, and integrate the density over that interval."
  s3_zh: "要得到正概率，应指定一个非零宽度区间，例如 44 至 46 秒，并对该区间上的密度积分。"
  s3_zh_hk: "要得到正概率，應該指定一個非零寬度區間，例如 44 至 46 秒，再對呢個區間上嘅密度積分。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实测"
  kicker_zh_hk: "賬目實測"
  title_en: "Auditing Wan Chai pour-over prep times"
  title_zh: "实测湾仔店手冲出餐耗时区间"
  title_zh_hk: "實測灣仔舖手沖出餐耗時區間"
  step1_en: "Density spread: Uniform between 40s and 60s; f(x) = 1/20 = 0.05"
  step1_zh: "密度分布：耗时在 40 至 60 秒均匀分布；恒定高度 f(x) = 1/20 = 0.05"
  step1_zh_hk: "密度分佈：耗時喺 40 至 60 秒均勻分佈；恆定高度 f(x) = 1/20 = 0.05"
  step2_en: "Single point check: P(X = 45.000s) = Area of zero width = 0.00"
  step2_zh: "单点核验：P(X = 45.000秒) = 单线无宽，面积严格为 0.00"
  step2_zh_hk: "單點核驗：P(X = 45.000秒) = 單線無寬，面積嚴格為 0.00"
  step3_en: "Interval SLA: P(45 <= X <= 55) = (55 - 45) * 0.05 = 50% on-time"
  step3_zh: "服务承诺：P(45 <= X <= 55) = (55 - 45) × 0.05 = 50% 达标胜率"
  step3_zh_hk: "服務承諾：P(45 <= X <= 55) = (55 - 45) × 0.05 = 50% 達標勝率"
  s1_en: "For this Wan Chai illustration, assume brew time is uniformly distributed from 40 to 60 seconds. The density is therefore constant at one over twenty, or 0.05 per second."
  s1_zh: "在这个湾仔店示例中，假设制作时间在 40 至 60 秒之间均匀分布，因此密度恒为 1/20，即每秒 0.05。"
  s1_zh_hk: "喺呢個灣仔舖示例入面，假設製作時間喺 40 至 60 秒之間均勻分佈，所以密度固定係 1/20，即係每秒 0.05。"
  s2_en: "Step two asks for the probability that the unrounded continuous time equals exactly 45 seconds. Under the model it is zero; this does not mean a stopwatch cannot display 45 seconds after rounding."
  s2_zh: "第二步计算未经取整的连续时间恰好等于 45 秒的概率。在模型下结果为零；这不表示秒表四舍五入后不能显示 45 秒。"
  s2_zh_hk: "第二步計未經取整嘅連續時間啱啱好等於 45 秒嘅概率。喺模型之下結果係零；呢個唔表示秒錶四捨五入之後唔可以顯示 45 秒。"
  s3_en: "Step three evaluates the interval from 45 to 55 seconds. Under the uniform model, multiply the ten-second width by the density 0.05 to obtain probability 0.50."
  s3_zh: "第三步计算 45 至 55 秒区间。在均匀模型下，以 10 秒宽度乘以密度 0.05，得到概率 0.50。"
  s3_zh_hk: "第三步計 45 至 55 秒區間。喺均勻模型之下，用 10 秒寬度乘以密度 0.05，得到概率 0.50。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Manage through intervals, not pinpoints"
  title_zh: "以区间带宽管理业务，切莫执念单点绝对值"
  title_zh_hk: "以區間帶寬管理業務，咪執念單點絕對值"
  q1_en: "Why must operational SLAs define target intervals instead of single numbers?"
  q1_zh: "为什么商业服务协议必须设定区间范围，而非单一数字指标？"
  q1_zh_hk: "點解商業服務協議必須設定區間範圍，而唔係單一數字指標？"
  q2_en: "What tool accumulates continuous probability across entire ranges?"
  q2_zh: "在连续型随机变量中，哪项工具负责累积整段区间的概率？"
  q2_zh_hk: "喺連續型隨機變量入面，邊項工具負責累積成段區間嘅概率？"
  s1_en: "If compliance is defined through a continuous measurement model, an interval or one-sided threshold usually supports a meaningful probability calculation. The chosen tolerance must come from operational or contractual requirements, not from probability theory alone."
  s1_zh: "如果达标判断采用连续测量模型，区间或单侧阈值通常更适合计算概率。容差范围应来自运营或合同要求，而不能仅由概率理论决定。"
  s1_zh_hk: "如果達標判斷採用連續測量模型，區間或者單側門檻通常更適合計概率。容差範圍應該來自營運或者合約要求，唔可以淨係由概率理論決定。"
  s2_en: "For an absolutely continuous distribution, including or excluding finitely many endpoints does not change probability. Therefore P(X <= c) equals P(X < c)."
  s2_zh: "在连续型变量中，包含端点与否对结果毫无影响：P(X <= c) 与严格小于的 P(X < c) 在数值上完全等价，因为边界单点概率严格为零。"
  s2_zh_hk: "喺連續型變量入面，包唔包端點對結果毫無影響：P(X <= c) 同嚴格細過嘅 P(X < c) 喺數值上完全等價，因為邊界單點概率嚴格為零。"
  s3_en: "Under the uniform 40-to-60-second model, P(X=45)=0 while P(45<=X<=55)=0.50. The operating rule is to calculate continuous probabilities as interval areas and to interpret recorded rounded values according to their measurement intervals."
  s3_zh: "在 40 至 60 秒的均匀模型下，P(X=45)=0，而 P(45≤X≤55)=0.50。运营规则是把连续概率计算为区间面积，并按照相应测量区间解释经过取整的记录值。"
  s3_zh_hk: "喺 40 至 60 秒嘅均勻模型之下，P(X=45)=0，而 P(45≤X≤55)=0.50。營運規則係將連續概率計成區間面積，並按照相應測量區間解釋經過取整嘅記錄值。"