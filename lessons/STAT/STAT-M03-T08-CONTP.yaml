title_en: "The zero-probability paradox"
title_zh: "单点概率为零之谜：连续密度与区间面积"
title_zh_hk: "單點概率為零之謎：連續密度與區間面積"
objective_en: "Explain the fundamental shift from discrete mass to continuous probability density functions (PDF), resolve the zero-probability paradox P(X = c) = 0 for single points, and calculate service time likelihoods using interval areas."
objective_zh: "阐释从离散质量函数向连续概率密度函数（PDF）的本质跃迁，破解单点概率严格为零 P(X = c) = 0 的反直觉悖论，并运用曲线下面积测算饮品制作时长区间的达标胜率。"
objective_zh_hk: "闡釋由離散質量函數向連續概率密度函數（PDF）嘅本質躍遷，破解單點概率嚴格為零 P(X = c) = 0 嘅反直覺悖論，並運用曲線下面積測算飲品製作時長區間嘅達標勝率。"
