youtube:
  description_en: |
    The zero-probability paradox
    
    A store models pour-over time as continuous. Under that model, finishing in exactly 45 seconds has probability zero — even though every cup gets a recorded time. Why can a possible outcome have zero point mass?
    
    Continuous probability lives in interval area under a density, not in single-point spikes. Exact clock readings still get logged, but the managerial question is the chance of landing inside a service band — not the chance of one exact second.
    
    Manage through intervals, not pinpoints. Design SLAs and process checks around bands of time, not one stopwatch reading.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 8 (CONTP)
    If this helped, subscribe for the next short.
  description_zh: |
    单点概率为零之谜：连续密度与区间面积
    
    门店把手冲时间建成连续型变量。模型里「恰好 45 秒完成」的概率是零，可每杯还是会记下时间。可能发生的结果为什么单点概率为零？
    
    连续概率活在密度曲线下的区间面积里，不在单点尖峰上。秒表仍会记录，但管理层该算的是落在服务带宽内的概率，不是某一整秒。
    
    以区间带宽管理业务，切莫执念单点绝对值。服务承诺与过程检查都按时间带设计。
    
    离散与连续概率分布 - 模块3 - 短片8（CONTP）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    單點概率為零之謎：連續密度與區間面積
    
    門市將手沖時間建成連續型變量。模型入面「啱啱好 45 秒完成」嘅概率係零，但每杯都仲會記低時間。可能發生嘅結果點解單點概率係零？
    
    連續概率活喺密度曲線底下嘅區間面積入面，唔喺單點尖峰上面。秒錶都仲會記錄，但管理層應該計嘅係落喺服務帶寬入面嘅概率，唔係某一整秒。
    
    以區間帶寬管理業務，咪執念單點絕對值。服務承諾同過程檢查都按時間帶設計。
    
    離散與連續概率分佈 - 模組3 - 短片8（CONTP）
    覺得有用嘅話，訂閱下一集。
