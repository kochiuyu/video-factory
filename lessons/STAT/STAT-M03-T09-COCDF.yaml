quiz:
- id: Q1
  type: multiple_choice
  question_en: "How does the mathematical shape of a continuous CDF F(x) differ fundamentally from the discrete staircase CDF learned earlier?"
  question_zh: "连续型累积分布函数 F(x) 的几何曲线，与先前学过的离散型阶梯 CDF 在本质上有何不同？"
  question_zh_hk: "連續型累積分佈函數 F(x) 嘅幾何曲線，同之前學過嘅離散型階梯 CDF 喺本質上有咩唔同？"
  options_en:
  - "A: It is continuous and non-decreasing with no vertical jumps, although it may contain flat sections or corners."
  - "B: It slopes downward from 1.0 to 0.0 as time elapses."
  - "C: It consists exclusively of discrete horizontal bars separated by blank spaces."
  - "D: Continuous CDFs are strictly prohibited from reaching 1.0 under standard business accounting."
  options_zh:
  - "A: 它连续且单调非减，没有垂直跳跃，但可以包含水平区段或折点。"
  - "B: 随着时间推移，该曲线会从 1.0 向下平直跌落至 0.0。"
  - "C: 它完全由被空白间隙分隔开的离散水平条状断块组成。"
  - "D: 在企业财务与管理规范下，连续 CDF 绝不允许触碰 1.0 的上限。"
  options_zh_hk:
  - "A: 佢連續兼單調非減，冇垂直跳躍，但可以包含水平區段或者折點。"
  - "B: 隨住時間推移，嗰條曲線會由 1.0 向下平直跌落至 0.0。"
  - "C: 佢完全由被空白間隙分隔開嘅離散水平條狀斷塊組成。"
  - "D: 喺企業財務與管理規範下，連續 CDF 絕唔允許掂到 1.0 嘅上限。"
  answer: A
  explanation_en: "For an absolutely continuous distribution, point probabilities are zero, so F(x) has no vertical jumps. It is continuous and non-decreasing, but it need not be smooth or strictly increasing."
  explanation_zh: "对于绝对连续分布，单点概率为零，因此 F(x) 没有垂直跳跃。它连续且单调非减，但不一定光滑或严格递增。"
  explanation_zh_hk: "對絕對連續分佈嚟講，單點概率係零，所以 F(x) 冇垂直跳躍。佢連續兼單調非減，但唔一定光滑或者嚴格遞增。"
- id: Q2
  type: multiple_choice
  question_en: "If customer order prep time X has continuous CDF F(x) = (x - 2) / 6 for x between 2 and 8 minutes, what SLA target x ensures that exactly 90% of customers receive their coffee on time?"
  question_zh: "若顾客点单自提制作时长 X 的连续累积函数为 F(x) = (x - 2) / 6（取值在 2 到 8 分钟之间），为确保恰好 90% 的顾客能准时取餐，SLA 履约时限 x 应当定为多少？"
  question_zh_hk: "若顧客點單自提製作時長 X 嘅連續累積函數為 F(x) = (x - 2) / 6（取值喺 2 到 8 分鐘之間），為確保啱啱好 90% 嘅顧客能準時攞餐，SLA 履約時限 x 應當定為幾多？"
  options_en:
  - "A: x = 7.4 minutes"
  - "B: x = 5.0 minutes"
  - "C: x = 8.0 minutes"
  - "D: x = 6.2 minutes"
  options_zh:
  - "A: x = 7.4 分钟"
  - "B: x = 5.0 分钟"
  - "C: x = 8.0 分钟"
  - "D: x = 6.2 分钟"
  options_zh_hk:
  - "A: x = 7.4 分鐘"
  - "B: x = 5.0 分鐘"
  - "C: x = 8.0 分鐘"
  - "D: x = 6.2 分鐘"
  answer: A
  explanation_en: "Set F(x) = 0.90: (x - 2) / 6 = 0.90 -> x - 2 = 5.4 -> x = 7.4 minutes. The 90th percentile is 7.4 minutes."
  explanation_zh: "设定 F(x) = 0.90：解方程 (x - 2) / 6 = 0.90，得 x - 2 = 5.4，解得 x = 7.4 分钟。第 90 百分位数即为 7.4 分钟。"
  explanation_zh_hk: "設定 F(x) = 0.90：解方程 (x - 2) / 6 = 0.90，得 x - 2 = 5.4，解得 x = 7.4 分鐘。第 90 百分位數即為 7.4 分鐘。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Customer Promise"
  kicker_en: "The Customer Promise"
  kicker_zh: "客户承诺的抉择"
  kicker_zh_hk: "客戶承諾嘅抉擇"
  title_en: "What wait time should the app guarantee?"
  title_zh: "手机点单页面该向顾客承诺几分钟取餐？"
  title_zh_hk: "手機點單頁面應向顧客承諾幾分鐘攞餐？"
  en: "Mobile pickup wants a prep-time cutoff that covers 95% of orders. The average does not answer that — it does not mark the upper-tail cutoff. How do the continuous CDF and quantiles turn a target probability into a time threshold?"
  zh: "手机自提想选一个能盖住 95% 订单的制作时间门槛。平均值答不了——它标不出上尾截止点。连续 CDF 和分位数怎么把目标概率换成时间阈值？"
  zh_hk: "手機自提想揀一個可以蓋住 95% 訂單嘅製作時間門檻。平均值答唔到——佢標唔出上尾截止點。連續 CDF 同分位數點樣將目標概率換成時間門檻？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The continuous CDF and its inverse"
  title_zh: "连续累积分布函数与其逆函数"
  title_zh_hk: "連續累積分佈函數與其逆函數"
  formula: "F(x) = P(X <= x) = Integral from -inf to x of f(t) dt; x_p = F^(-1)(p)"
  formula_zh: "F(x) = 概率密度自负无穷至 x 的积分；分位数 x_p = inf{x: F(x) >= p}"
  formula_zh_hk: "F(x) = 概率密度由負無窮至 x 嘅積分；分位數 x_p = inf{x: F(x) >= p}"
  formula_tex: "F(x) = \\int_{-\\infty}^{x} f(t)\\,dt, \\quad x_p = F^{-1}(p)"
  s1_en: "The continuous Cumulative Distribution Function, F of x, represents the total accumulated probability from the far left of the distribution up to threshold x."
  s1_zh: "连续 CDF 同样是 F(x)=P(X≤x)。要找覆盖率对应的时间点，就反查分位数。"
  s1_zh_hk: "連續 CDF 同樣係 F(x)=P(X≤x)。要搵覆蓋率對應嘅時間點，就反查分位數。"
  s2_en: "For an absolutely continuous model, the CDF is continuous and non-decreasing. The p-quantile is the smallest x for which F(x) is at least p; when F is strictly increasing, this agrees with the ordinary inverse CDF."
  s2_zh: "对于绝对连续模型，CDF 连续且单调非减。第 p 分位数是使 F(x) 至少达到 p 的最小 x；当 F 严格递增时，它与普通逆 CDF 一致。"
  s2_zh_hk: "對絕對連續模型嚟講，CDF 連續兼單調非減。第 p 分位數係令 F(x) 至少去到 p 嘅最細 x；當 F 嚴格遞增，佢同普通逆 CDF 一致。"
- id: percentile
  visual: two_column
  seconds: 36
  kicker: "The Two Directions"
  kicker_en: "The Two Directions"
  kicker_zh: "双向推演"
  kicker_zh_hk: "雙向推演"
  title_en: "Forward probabilities versus inverse quantiles"
  title_zh: "正向求算胜率，逆向划定底线"
  title_zh_hk: "正向求算勝率，逆向劃定底線"
  left_en: "Forward: x -> F(x) = Probability"
  left_zh: "正向推演：已知指标时限，评估履约概率"
  left_zh_hk: "正向推演：已知指標時限，評估履約概率"
  right_en: "Inverse: Target p -> x_p = Percentile"
  right_zh: "逆向解构：先定商业标准，反推合规考核线"
  right_zh_hk: "逆向解構：先定商業標準，反推合規考核線"
  s1_en: "Forward CDF analysis asks: If we set a six-minute promise, what fraction of customers will be satisfied? We plug in time x and calculate compliance probability F of x."
  s1_zh: "正向 CDF 分析回答的是：如果我们向外界承诺六分钟，将有多少比例的顾客能被按时满足？我们代入时长 x，直接算出达标胜率 F(x)。"
  s1_zh_hk: "正向 CDF 分析回答嘅係：如果我哋向外界承諾六分鐘，將有幾多比例嘅顧客能被按時滿足？我哋代入時長 x，直接計出達標勝率 F(x)。"
  s2_en: "Inverse quantile analysis answers the true executive question: We need ninety-five percent on-time delivery to protect our brand. What exact time cutoff must we engineer?"
  s2_zh: "而逆向分位数分析则回答了高管层真正的商业核心：为了捍卫品牌口碑，我们必须实现 95% 的准点履约率。运营端究竟该把承诺时限严密卡在几分几秒？"
  s2_zh_hk: "而逆向分位數分析就回答咗高管層真正嘅商業核心：為咗捍衛品牌口碑，我哋必須實現 95% 嘅準點履約率。營運端究竟應該將承諾時限嚴密卡喺幾分幾秒？"
  s3_en: "At the 95th percentile, the model places at least 95% of preparation times at or below the cutoff and at most 5% above it."
  s3_zh: "在第 95 百分位数处，模型把至少 95% 的制作时间放在截止点及其左侧，右侧最多保留 5%。"
  s3_zh_hk: "喺第 95 百分位數，模型將至少 95% 嘅製作時間放喺截止點同佢左邊，右邊最多保留 5%。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目精算"
  kicker_zh_hk: "賬目精算"
  title_en: "Setting the Shop A mobile pickup SLA"
  title_zh: "测算A店手机点单自提服务线"
  title_zh_hk: "測算A舖手機點單自提服務線"
  step1_en: "Model assumption: Uniform between 2 and 8 minutes"
  step1_zh: "模型假设：制作时间在 2 到 8 分钟均匀分布；f(x) = 1/6"
  step1_zh_hk: "模型假設：製作時間喺 2 到 8 分鐘均勻分佈；f(x) = 1/6"
  step2_en: "CDF formula: F(x) = (x - 2) / 6 for x in [2, 8]"
  step2_zh: "累积函数：F(x) = (x - 2) / 6；随时间推进由 0 线性升至 1.0"
  step2_zh_hk: "累積函數：F(x) = (x - 2) / 6；隨時間推進由 0 線性升至 1.0"
  step3_en: "Invert for 95%: (x - 2) / 6 = 0.95 -> x = 2 + 5.7 = 7.7 minutes"
  step3_zh: "逆解 95% 目标：(x - 2) / 6 = 0.95，解得 x = 7.7 分钟（462秒）"
  step3_zh_hk: "逆解 95% 目標：(x - 2) / 6 = 0.95，解得 x = 7.7 分鐘（462秒）"
  s1_en: "For this Shop A illustration, assume preparation time is uniformly distributed between two and eight minutes, giving density one over six on that interval."
  s1_zh: "在这个A店示例中，假设制作时间在 2 到 8 分钟之间均匀分布，因此区间内密度为 1/6。"
  s1_zh_hk: "喺呢個A舖示例入面，假設製作時間喺 2 到 8 分鐘之間均勻分佈，所以區間內密度係 1/6。"
  s2_en: "Integrate from the minimum baseline of two minutes: our continuous CDF is F of x equals x minus two divided by six."
  s2_zh: "从两分钟的最短基准时间开始积分：该场景下的连续累积分布函数 F(x) 恰好等于 x 减去二、再除以六。"
  s2_zh_hk: "由兩分鐘嘅最短基準時間開始積分：該場景下嘅連續累積分佈函數 F(x) 啱啱好等於 x 減去二、再除以六。"
  s3_en: "To find the 95th percentile, set F(x) to 0.95. Solving gives x=7.7 minutes. This is a model-based coverage cutoff; any external promise must also consider model fit, measurement, capacity, and business cost."
  s3_zh: "要求第 95 百分位数时，令 F(x)=0.95，解得 x=7.7 分钟。这是模型给出的覆盖截止点；任何对外承诺还应考虑模型拟合、测量、产能和业务成本。"
  s3_zh_hk: "要求第 95 百分位數嗰陣，令 F(x)=0.95，解得 x=7.7 分鐘。呢個係模型畀出嘅覆蓋截止點；任何對外承諾仲要考慮模型擬合、測量、產能同業務成本。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Price service agreements using percentiles"
  title_zh: "以分位数锚定服务承诺，以逆累积锁定战略安全"
  title_zh_hk: "以分位數錨定服務承諾，以逆累積鎖定戰略安全"
  q1_en: "Promise the mean wait? → No — half the mass can sit above the mean"
  q1_zh: "把平均等待当承诺？→ 不行——均值上面往往还有一半"
  q1_zh_hk: "將平均等待當承諾？→ 唔得——均值上面往往仲有一半"
  q2_en: "Need a coverage cutoff? → Invert the CDF (quantile)"
  q2_zh: "要覆盖率截止点？→ 反查 CDF（分位数）"
  q2_zh_hk: "要覆蓋率截止點？→ 反查 CDF（分位數）"
  s1_en: "Do not treat the mean as a percentile until you know the shape. Symmetry about the mean is not a satisfaction claim."
  s1_zh: "没看清分布形状前，别把均值当成分位数。关于均值对称，也不等于顾客满意。"
  s1_zh_hk: "未睇清分佈形狀之前，唔好將均值當成分位數。關於均值對稱，亦唔等於顧客滿意。"
  s2_en: "Pick the target probability from the business, read the quantile, then validate the model before you publish the promise."
  s2_zh: "目标概率来自业务，读出分位数，对外承诺前先验证模型。"
  s2_zh_hk: "目標概率嚟自業務，讀出分位數，對外承諾前先驗證模型。"
  s3_en: "Uniform 2–8 min: 90th≈7.4 min, 95th≈7.7 min — model-based cutoffs, not slogans."
  s3_zh: "均匀 2–8 分钟：90 分位约 7.4 分，95 分位约 7.7 分——是模型截止点，不是口号。"
  s3_zh_hk: "均勻 2–8 分鐘：90 分位約 7.4 分，95 分位約 7.7 分——係模型截止點，唔係口號。"
