title_en: "Setting service level guarantees"
title_zh: "划定履约底线：连续累积分布与分位数"
title_zh_hk: "劃定履約底線：連續累積分佈與分位數"
objective_en: "Define the continuous Cumulative Distribution Function F(x) as the running integral of probability density, apply the inverse CDF to determine operational percentiles and quantiles, and engineer customer wait-time SLA cutoffs for mobile pickup."
objective_zh: "将连续累积分布函数 F(x) 定义为概率密度的连续积分，运用逆累积函数求解运营分位数与百分位数，并为手机移动点单自提精准设定顾客等待时长的 SLA 考核线。"
objective_zh_hk: "將連續累積分佈函數 F(x) 定義為概率密度嘅連續積分，運用逆累積函數求解營運分位數與百分位數，並為手機點單自提精準設定顧客等待時長嘅 SLA 考核線。"
