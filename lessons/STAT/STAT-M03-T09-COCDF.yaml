id: STAT-M03-T09-COCDF
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
duration_target_s: 166
title_en: "Setting service level guarantees"
title_zh: "划定履约底线：连续累积分布与分位数"
title_zh_hk: "劃定履約底線：連續累積分佈與分位數"
youtube:
  description_en: |
    Setting service level guarantees
    
    Mobile pickup wants a prep-time cutoff that covers 95% of orders. The average does not answer that — it does not mark the upper-tail cutoff. How do the continuous CDF and quantiles turn a target probability into a time threshold?
    
    Read F(t) as the probability that prep time stays at most t. Invert the CDF — take the quantile — to find the time that matches a target coverage such as 95%. That is how a service promise becomes a number on the app.
    
    Price service agreements using percentiles, not averages. The continuous CDF turns a coverage goal into an operational cutoff.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 9 (COCDF)
    If this helped, subscribe for the next short.
  description_zh: |
    划定履约底线：连续累积分布与分位数
    
    手机自提想选一个能盖住 95% 订单的制作时间门槛。平均值答不了——它标不出上尾截止点。
    
    把 F(t) 读成制作时间至多为 t 的概率。再对 CDF 求逆——取分位数——就能把 95% 这类目标覆盖率换成时间阈值。服务承诺这才变成 App 上的数字。
    
    以分位数锚定服务承诺，以逆累积锁定战略安全。连续 CDF 把覆盖目标换成运营截止线。
    
    离散与连续概率分布 - 模块3 - 短片9（COCDF）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    劃定履約底線：連續累積分佈與分位數
    
    手機自提想揀一個可以蓋住 95% 訂單嘅製作時間門檻。平均值答唔到——佢標唔出上尾截止點。
    
    將 F(t) 讀成製作時間至多係 t 嘅概率。再對 CDF 求逆——取分位數——就可以將 95% 呢類目標覆蓋率換成時間門檻。服務承諾先變成 App 上面嘅數字。
    
    以分位數錨定服務承諾，以逆累積鎖定戰略安全。連續 CDF 將覆蓋目標換成營運截止線。
    
    離散與連續概率分佈 - 模組3 - 短片9（COCDF）
    覺得有用嘅話，訂閱下一集。
