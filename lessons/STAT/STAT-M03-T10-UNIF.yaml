title_en: "Equal uncertainty in supply windows"
title_zh: "原料入场的时间盲盒：连续均匀分布"
title_zh_hk: "原料入場嘅時間盲盒：連續均勻分佈"
objective_en: "Define the continuous Uniform distribution U(a, b), calculate its flat density f(x) = 1/(b-a), derive its mean (a+b)/2 and variance (b-a)^2/12, and evaluate fresh milk delivery lead times against morning store opening deadlocks."
objective_zh: "定义连续型均匀分布 U(a, b)，推导其恒定平直密度高度 f(x) = 1/(b-a)、期望值 (a+b)/2 与方差 (b-a)^2/12，并将其应用于鲜牛奶清晨冷链到货与门店开闸营业的压哨风险评估。"
objective_zh_hk: "定義連續型均勻分佈 U(a, b)，推導其恆定平直密度高度 f(x) = 1/(b-a)、期望值 (a+b)/2 同方差 (b-a)^2/12，並將其應用喺鮮牛奶清晨冷鏈到貨與門市開舖營業嘅壓哨風險評估。"
