quiz:
- id: Q1
  type: multiple_choice
  question_en: "Why is the variance formula for a continuous uniform distribution U(a, b) equal to (b - a)^2 / 12, featuring the constant divisor 12?"
  question_zh: "为什么连续均匀分布 U(a, b) 的方差公式为 (b - a)^2 / 12，其中的分母常数 12 是从何而来的？"
  question_zh_hk: "點解連續均勻分佈 U(a, b) 嘅方差公式為 (b - a)^2 / 12，入面嘅分母常數 12 係由邊度嚟嘅？"
  options_en:
  - "A: It arises mathematically from integrating the squared deviation term (x - mu)^2 over a flat continuous interval [a, b]."
  - "B: It represents the twelve calendar months of corporate supply chain accounting."
  - "C: It accounts for the twelve hours a typical retail cafe stays open each day."
  - "D: The constant 12 was chosen arbitrarily by retail trade associations."
  options_zh:
  - "A: 它来源于在平坦连续区间 [a, b] 上对离差平方项 (x - mu)^2 进行微积分定积分运算后的严格数学推导结果。"
  - "B: 它代表了企业供应链年报审计中所对应的十二个自然日历月份。"
  - "C: 它对应了常规精品咖啡门店每天开门营业的十二个小时营业时长。"
  - "D: 常数 12 是早年零售行业协会在制定行规时人为随意敲定的经验数值。"
  options_zh_hk:
  - "A: 佢來源於喺平坦連續區間 [a, b] 上對偏差平方項 (x - mu)^2 進行微積分定積分運算後嘅嚴格數學推導結果。"
  - "B: 佢代表咗企業供應鏈年報審計入面所對應嘅十二個自然日曆月份。"
  - "C: 佢對應咗常規精品咖啡門市每日開門營業嘅十二個鐘營業時長。"
  - "D: 常數 12 係早年零售行業協會喺制定行規嗰陣人為隨意敲定嘅經驗數值。"
  answer: A
  explanation_en: "Integrating (x - (a+b)/2)^2 / (b - a) from a to b yields [u^3 / 3] evaluated at endpoints, which produces (b - a)^2 / 12."
  explanation_zh: "对 (x - (a+b)/2)^2 / (b - a) 在区间 [a, b] 上求定积分，原函数展开后会出现 [u^3 / 3] 的立方项，代入上下限化简即得出严密的 (b - a)^2 / 12。"
  explanation_zh_hk: "對 (x - (a+b)/2)^2 / (b - a) 喺區間 [a, b] 上求定積分，原函數展開後會出現 [u^3 / 3] 嘅立方項，代入上下限化簡即得出嚴密嘅 (b - a)^2 / 12。"
- id: Q2
  type: multiple_choice
  question_en: "Fresh milk delivery arrives uniformly between 5:00 AM and 5:30 AM (a = 0, b = 30 minutes). Store staff must begin espresso calibration by 5:24 AM (t = 24). What is the probability that milk arrives dangerously late after 5:24 AM?"
  question_zh: "鲜牛奶冷链配送在早晨 5:00 到 5:30 之间均匀到达（设 a = 0，b = 30 分钟）。门店必须在 5:24（第 24 分钟）前拿到鲜奶调试校准意式机。鲜奶延迟在 5:24 之后送达、导致开业告急的概率是多少？"
  question_zh_hk: "鮮牛奶冷鏈配送喺朝早 5:00 到 5:30 之間均勻到達（設 a = 0，b = 30 分鐘）。門市必須喺 5:24（第 24 分鐘）前攞到鮮奶調試校準意式機。鮮奶延遲喺 5:24 之後送達、搞到開舖告急嘅概率係幾多？"
  options_en:
  - "A: (30 - 24) / 30 = 6 / 30 = 0.20 (20%)"
  - "B: 24 / 30 = 0.80 (80%)"
  - "C: 1 / 30 = 0.033 (3.3%)"
  - "D: 6 / 24 = 0.25 (25%)"
  options_zh:
  - "A: (30 - 24) / 30 = 6 / 30 = 0.20 (即 20%)"
  - "B: 24 / 30 = 0.80 (即 80%)"
  - "C: 1 / 30 ≈ 0.033 (即 3.3%)"
  - "D: 6 / 24 = 0.25 (即 25%)"
  options_zh_hk:
  - "A: (30 - 24) / 30 = 6 / 30 = 0.20 (即 20%)"
  - "B: 24 / 30 = 0.80 (即 80%)"
  - "C: 1 / 30 ≈ 0.033 (即 3.3%)"
  - "D: 6 / 24 = 0.25 (即 25%)"
  answer: A
  explanation_en: "The right-tail danger interval runs from 24 to 30 minutes. Length = 6 minutes. P(X > 24) = 6 * (1/30) = 6/30 = 0.20 (20%)."
  explanation_zh: "危急延误区间为 24 到 30 分钟，区间长度为 6 分钟。P(X > 24) = 6 × (1/30) = 6/30 = 0.20（即 20%）。"
  explanation_zh_hk: "危急延誤區間為 24 到 30 分鐘，區間長度為 6 分鐘。P(X > 24) = 6 × (1/30) = 6/30 = 0.20（即 20%）。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Cold-Chain Window"
  kicker_en: "The Cold-Chain Window"
  kicker_zh: "冷链到货之困"
  kicker_zh_hk: "冷鏈到貨之困"
  title_en: "When the supplier gives you a 30-minute window"
  title_zh: "供货商只给半小时窗口，门店如何备战？"
  title_zh_hk: "供貨商淨係畀半個鐘窗口，門市點樣備戰？"
  en: "A Mong Kok store is told that a milk delivery will arrive between 5:00 and 5:30 AM. If the analysis assumes no time within that window is favored over any other, how can a continuous Uniform distribution quantify the expected arrival time, variability, and probability of arriving after a chosen threshold?"
  zh: "旺角店获知鲜奶将在早上 5:00 至 5:30 之间送达。如果分析假设窗口内没有任何时刻比其他时刻更可能，连续均匀分布如何量化期望到达时间、波动程度，以及超过指定阈值才到达的概率？"
  zh_hk: "旺角舖收到資料，鮮奶會喺朝早 5:00 至 5:30 之間送到。如果分析假設窗口入面冇任何時刻比其他時刻更可能，連續均勻分佈點樣量化期望到達時間、波動程度，以及超過指定門檻先到達嘅概率？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The continuous Uniform distribution"
  title_zh: "连续均匀分布的数学形态"
  title_zh_hk: "連續均勻分佈嘅數學形態"
  formula: "f(x) = 1 / (b - a) for x in [a, b]; zero elsewhere"
  formula_zh: "在区间 [a, b] 内密度高度恒定 f(x) = 1 / (b - a)；其余区间严格为零"
  formula_zh_hk: "喺區間 [a, b] 內密度高度恆定 f(x) = 1 / (b - a)；其餘區間嚴格為零"
  formula_tex: "X \\sim U(a, b), \\quad f(x) = \\frac{1}{b-a}, \\quad a \\le x \\le b"
  s1_en: "A continuous Uniform model on [a,b] assigns constant density across the interval. Consequently, any two subintervals of equal length have equal probability; individual points still have probability zero."
  s1_zh: "区间 [a,b] 上的连续均匀模型具有恒定密度。因此，任意两个等长子区间具有相同概率，而单个点的概率仍为零。"
  s1_zh_hk: "區間 [a,b] 上嘅連續均勻模型具有固定密度。所以，任何兩個等長子區間都有相同概率，而單個點嘅概率仍然係零。"
  s2_en: "Its probability density function f(x) is a perfect horizontal rectangle of width b minus a and constant height one over b minus a, ensuring the total area equals exactly 1.0."
  s2_zh: "其概率密度函数 f(x) 在几何上呈现为一个规整的水平矩形：底边宽度为 b 减 a，恒定高度严格等于底宽的倒数，确保其下方的总面积严丝合缝等于 1.0。"
  s2_zh_hk: "其概率密度函數 f(x) 喺幾何上呈現為一個規整嘅水平矩形：底邊寬度為 b 減 a，恆定高度嚴格等於底寬嘅倒數，確保其下方嘅總面積嚴絲合縫等於 1.0。"
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: "The Two Moments"
  kicker_en: "The Two Moments"
  kicker_zh: "中心与离散"
  kicker_zh_hk: "中心與離散"
  title_en: "Symmetric midpoint and the constant twelve"
  title_zh: "对称的几何中点与神奇的常数十二"
  title_zh_hk: "對稱嘅幾何中點與神奇嘅常數十二"
  left_en: "Expected Value: E[X] = (a + b) / 2"
  left_zh: "数学期望：E[X] = (a + b) / 2，严格平分区间中点"
  left_zh_hk: "數學期望：E[X] = (a + b) / 2，嚴格平分區間中點"
  right_en: "Variance: Var(X) = (b - a)^2 / 12"
  right_zh: "离散方差：Var(X) = (b - a)^2 / 12，全展宽度平方除以十二"
  right_zh_hk: "離散方差：Var(X) = (b - a)^2 / 12，全展寬度平方除以十二"
  s1_en: "Because the rectangular density is perfectly symmetrical, its center of gravity sits dead center: the expected value is simply the midpoint, a plus b divided by two."
  s1_zh: "由于矩形密度曲线具备完美的对称性，其物理质心永远精确落在区间的正中央：数学期望就是简明的中点均值，a 加上 b 除以二。"
  s1_zh_hk: "由於矩形密度曲線具備完美嘅對稱性，其物理質心永遠精確落喺區間嘅正中央：數學期望就係簡明嘅中點均值，a 加上 b 除以二。"
  s2_en: "Its variance measures dispersion around the midpoint. Integrating squared deviations under the constant density gives the interval span squared divided by twelve."
  s2_zh: "其方差衡量结果围绕中点的离散程度。对恒定密度下的离差平方积分，可得区间跨度平方除以十二。"
  s2_zh_hk: "佢嘅方差衡量結果圍繞中點嘅離散程度。對固定密度之下嘅偏差平方積分，可以得到區間跨度平方除以十二。"
  s3_en: "Holding the Uniform assumption fixed, variance grows with the square of the window width. A wider window therefore means greater timing dispersion, while its operational effect depends on the schedule and available buffer."
  s3_zh: "在均匀假设保持不变时，方差随窗口宽度的平方增长。因此，更宽的窗口表示更大的时间离散程度；实际运营影响仍取决于排程与缓冲时间。"
  s3_zh_hk: "喺均勻假設保持不變嗰陣，方差會隨窗口寬度嘅平方增長。所以，更闊嘅窗口表示更大嘅時間離散程度；實際營運影響仍然取決於排程同緩衝時間。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实推"
  kicker_zh_hk: "賬目實推"
  title_en: "Modeling Mong Kok dairy arrival"
  title_zh: "旺角店清晨鲜奶到货模型"
  title_zh_hk: "旺角舖清晨鮮奶到貨模型"
  step1_en: "Window: 5:00 to 5:30 AM -> a = 0, b = 30 min; f(x) = 1/30"
  step1_zh: "到达窗口：5:00 至 5:30 -> a = 0，b = 30分钟；恒定密度 f(x) = 1/30"
  step1_zh_hk: "到達窗口：5:00 至 5:30 -> a = 0，b = 30分鐘；恆定密度 f(x) = 1/30"
  step2_en: "Parameters: E[X] = 15 min (5:15 AM); SD = sqrt(30^2 / 12) = 8.66 min"
  step2_zh: "核心基准：期望到达 5:15；标准差 = 根号(900/12) ≈ 8.66 分钟"
  step2_zh_hk: "核心基準：期望到達 5:15；標準差 = 根號(900/12) ≈ 8.66 分鐘"
  step3_en: "Late risk: P(X > 24) = (30 - 24) * (1/30) = 6/30 = 20% stockout risk"
  step3_zh: "开店告急：P(X > 24) = (30 - 24) × (1/30) = 20% 概率延误导致空转"
  step3_zh_hk: "開舖告急：P(X > 24) = (30 - 24) × (1/30) = 20% 概率延誤搞到空轉"
  s1_en: "For this Mong Kok illustration, assume delivery time is uniformly distributed between 5:00 and 5:30 AM. Measured in minutes after 5:00, X is Uniform(0,30) with density 1/30 per minute."
  s1_zh: "在这个旺角店示例中，假设配送时间在 5:00 至 5:30 之间均匀分布。以 5:00 后的分钟数计，X 服从 Uniform(0,30)，每分钟密度为 1/30。"
  s1_zh_hk: "喺呢個旺角舖示例入面，假設配送時間喺 5:00 至 5:30 之間均勻分佈。以 5:00 之後嘅分鐘數計，X 服從 Uniform(0,30)，每分鐘密度係 1/30。"
  s2_en: "Step two computes the center and dispersion: the expected arrival is 5:15 AM, the variance is 900 divided by 12, or 75 square minutes, and the standard deviation is about 8.66 minutes."
  s2_zh: "第二步计算中心与离散程度：期望到达时刻为 5:15，方差为 900/12，即 75 平方分钟，标准差约为 8.66 分钟。"
  s2_zh_hk: "第二步計算中心同離散程度：期望到達時間係 5:15，方差係 900/12，即係 75 平方分鐘，標準差大約係 8.66 分鐘。"
  s3_en: "Step three applies an illustrative threshold of 5:24 AM. The interval after that threshold is six minutes, so P(X>24)=6/30=0.20. This is a model probability of arriving after the threshold, not by itself a prediction of stockout frequency."
  s3_zh: "第三步使用 5:24 这一示例阈值。阈值之后的区间长度为 6 分钟，因此 P(X>24)=6/30=0.20。这是超过阈值才到达的模型概率，本身并不预测缺货发生频率。"
  s3_zh_hk: "第三步使用 5:24 呢個示例門檻。門檻之後嘅區間長度係 6 分鐘，所以 P(X>24)=6/30=0.20。呢個係超過門檻先到達嘅模型概率，本身並唔預測缺貨發生頻率。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Contractual boundaries dictate operational variance"
  title_zh: "合同边界收窄一分，营运方差骤降四成"
  title_zh_hk: "合約邊界收窄一分，營運方差驟降四成"
  q1_en: "When should executives assume a Uniform distribution?"
  q1_zh: "企业管理者应在何种业务情境下果断采用均匀分布？"
  q1_zh_hk: "企業管理者應喺邊種業務情境下果斷採用均勻分佈？"
  q2_en: "How does negotiating narrower supply windows improve reliability?"
  q2_zh: "通过商务谈判压缩供货窗口，如何根本性提升系统可靠度？"
  q2_zh_hk: "透過商務談判壓縮供貨窗口，點樣根本性提升系統可靠度？"
  s1_en: "Use a Uniform model only when constant density across the bounded window is a defensible assumption. A stated delivery window alone does not prove that all equal-length subintervals are equally likely."
  s1_zh: "只有当有限窗口内的恒定密度假设有理据时，才使用均匀模型。仅知道配送窗口，并不能证明所有等长子区间具有相同概率。"
  s1_zh_hk: "只有當有限窗口入面嘅固定密度假設有理據，先使用均勻模型。淨係知道配送窗口，並唔可以證明所有等長子區間有相同概率。"
  s2_en: "Within the same Uniform model, halving the window width reduces the modeled variance to one quarter, a 75% reduction. Whether reliability improves in practice depends on whether the new window is credible and met."
  s2_zh: "在同一均匀模型内，若窗口宽度减半，模型方差降至四分之一，即减少 75%。实际可靠性是否改善，仍取决于新窗口是否可信并得到遵守。"
  s2_zh_hk: "喺同一均勻模型入面，如果窗口寬度減半，模型方差會降到四分之一，即係減少 75%。實際可靠性係咪改善，仍然取決於新窗口係咪可信同得到遵守。"
  s3_en: "For the Uniform(0,30) illustration, the expected arrival is 5:15 AM, the standard deviation is about 8.66 minutes, and P(X>24)=0.20. Use these results only if equal density across the window is a defensible assumption."
  s3_zh: "对于 Uniform(0,30) 示例，期望到达时刻为 5:15，标准差约为 8.66 分钟，且 P(X>24)=0.20。只有当窗口内等密度假设有理据时，才应使用这些结果。"
  s3_zh_hk: "對 Uniform(0,30) 示例嚟講，期望到達時間係 5:15，標準差大約係 8.66 分鐘，而 P(X>24)=0.20。只有當窗口入面等密度假設有理據，先應該使用呢啲結果。"