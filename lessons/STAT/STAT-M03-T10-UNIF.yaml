course_zh_hk: "離散與連續概率分佈"
duration_target_s: 166
title_en: "Equal uncertainty in supply windows"
title_zh: "原料入场的时间盲盒：连续均匀分布"
title_zh_hk: "原料入場嘅時間盲盒：連續均勻分佈"
youtube:
  description_en: |
    Equal uncertainty in supply windows
    
    Shop B hears milk will arrive between 5:00 and 5:30 AM. If no minute inside that window is favored, how does a continuous Uniform quantify expected arrival, spread, and the chance of landing after a chosen cutoff?
    
    On minutes after 5:00, X ~ Uniform(0, 30) has mean 15 minutes (5:15 AM) and sd ≈ 8.66 minutes. An illustrative cutoff at 5:24 AM gives P(X after 24)=6/30=0.20.
    
    A delivery window alone does not prove equal likelihood — defend the flat-density assumption. Inside that Uniform story, halving width cuts modeled variance by about 75%.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 10 (UNIF)
    If this helped, subscribe for the next short.
  description_zh: |
    原料入场的时间盲盒：连续均匀分布
    
    B店听说鲜奶会在早上 5:00 到 5:30 送到。如果窗口里每一分钟都一样可能，连续均匀分布怎么量化期望到达、波动，以及晚过某条线的概率？
    
    以 5:00 后的分钟计，X ~ Uniform(0, 30) 的期望是 15 分钟（5:15），标准差约 8.66 分钟。示例截止 5:24 时，P(X 晚于 24)=6/30=0.20。
    
    交货窗口本身不能证明等可能——要为平坦密度辩护。在该均匀设定下，窗口减半可使模型方差约降 75%。
    
    离散与连续概率分布 - 模块3 - 短片10（UNIF）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    原料入場嘅時間盲盒：連續均勻分佈
    
    B舖聽講鮮奶會喺朝早 5:00 到 5:30 送到。如果窗口入面每一分鐘都一樣可能，連續均勻分佈點樣量化期望到達、波動，以及遲過某條線嘅概率？
    
    以 5:00 之後嘅分鐘計，X ~ Uniform(0, 30) 嘅期望係 15 分鐘（5:15），標準差約 8.66 分鐘。示例截止 5:24 嗰陣，P(X 遲過 24)=6/30=0.20。
    
    交貨窗口本身唔可以證明等可能——要為平坦密度辯護。喺呢個均勻設定之下，窗口減半可以令模型方差約降 75%。
    
    離散與連續概率分佈 - 模組3 - 短片10（UNIF）
    覺得有用嘅話，訂閱下一集。
