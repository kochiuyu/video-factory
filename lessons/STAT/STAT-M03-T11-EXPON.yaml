id: STAT-M03-T11-EXPON
course: statistics
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
audience: "first-year business students"
audience_en: "first-year business students"
audience_zh: "商学院一年级学生"
audience_zh_hk: "商學院一年級學生"
duration_target_s: 168
title_en: "Service times and machine lifespans"
title_zh: "服务耗时与设备寿命：指数分布与无记忆性"
title_zh_hk: "服務耗時與設備壽命：指數分佈與無記憶性"
objective_en: "Define the Exponential distribution Exp(lambda) as the continuous waiting time between Poisson events, explain its mean 1/lambda and memoryless property, and evaluate commercial espresso grinder burr lifespans to schedule preventative maintenance."
objective_zh: "将指数分布 Exp(lambda) 定义为泊松事件之间的连续等待时间模型，阐释其期望均值 1/lambda 与反直觉的“无记忆性”，并将其应用于商用磨豆机刀盘寿命测算以制定预防性维保排期。"
objective_zh_hk: "將指數分佈 Exp(lambda) 定義為泊松事件之間嘅連續等待時間模型，闡釋其期望均值 1/lambda 同反直覺嘅「無記憶性」，並將其應用喺商用磨豆機刀盤壽命測算以制定預防性維保排期。"
