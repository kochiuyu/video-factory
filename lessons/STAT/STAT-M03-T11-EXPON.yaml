quiz:
- id: Q1
  type: multiple_choice
  question_en: "What does the 'memoryless property' P(X > s + t | X > s) = P(X > t) imply for an electronic component following an Exponential distribution?"
  question_zh: "无记忆性公式 P(X > s + t | X > s) = P(X > t) 对于服从指数分布的电子电气元器件意味着什么？"
  question_zh_hk: "無記憶性公式 P(X > s + t | X > s) = P(X > t) 對於服從指數分佈嘅電子電氣元器件意味住咩？"
  options_en:
  - "A: Given that the component has already survived s hours without failing, its probability of surviving another t hours is identical to that of a brand-new component."
  - "B: The component automatically reboots its computer memory every twenty-four hours."
  - "C: Older components fail with 100% certainty the moment maintenance staff inspect them."
  - "D: The failure rate drops to zero as soon as store warranty papers are signed."
  options_zh:
  - "A: 已知该部件已经无故障连续运行了 s 小时，它在未来继续正常运行 t 小时的条件概率，与一个全新出厂的部件能运行 t 小时的概率完全相同。"
  - "B: 机器内部的板载芯片每隔二十四小时就会自动重置清空其操作内存。"
  - "C: 老旧部件只要一被维保质检员触碰，就会百分之百立刻发生断电停机。"
  - "D: 一旦在保修合同上正式签字盖章，设备的随机失效率就会瞬间自动归零。"
  options_zh_hk:
  - "A: 已知嗰個部件已經無故障連續運行咗 s 個鐘，佢喺未來繼續正常運行 t 個鐘嘅條件概率，同一個全新出廠嘅部件能運行 t 個鐘嘅概率完全相同。"
  - "B: 機器內部嘅板載晶片每隔二十四個鐘就會自動重置清空其操作內存。"
  - "C: 老舊部件只要一被維保質檢員掂到，就會百分之百即刻發生斷電停機。"
  - "D: 一旦喺保養合約上正式簽字蓋印，設備嘅隨機失效率就會瞬間自動歸零。"
  answer: A
  explanation_en: "Among nonnegative continuous lifetime distributions, the Exponential distribution is characterized by memorylessness. Conditional survival for another t units does not depend on age s; this is a model implication, not proof that a physical component does not wear."
  explanation_zh: "在非负连续寿命分布中，指数分布以无记忆性为特征：再生存 t 个单位的条件概率不依赖当前年龄 s。这是模型含义，并不能证明实体部件不会磨损。"
  explanation_zh_hk: "喺非負連續壽命分佈入面，指數分佈以無記憶性為特徵：再生存 t 個單位嘅條件概率唔依賴目前年齡 s。呢個係模型含義，唔可以證明實體部件唔會磨損。"
- id: Q2
  type: multiple_choice
  question_en: "If commercial grinder titanium burrs have an average lifespan of 500 operating hours (lambda = 1/500 = 0.002 per hour), what is the probability that a set of burrs fails before reaching 100 hours of service?"
  question_zh: "若商用磨豆机钛金刀盘的平均无故障寿命为 500 运转小时（lambda = 1/500 = 0.002/小时），一副全新刀盘在服役满 100 小时前便突发故障报废的概率是多少？"
  question_zh_hk: "若商用磨豆機鈦金刀盤嘅平均無故障壽命為 500 運轉個鐘（lambda = 1/500 = 0.002/個鐘），一副全新刀盤喺服役滿 100 個鐘前就突發故障報廢嘅概率係幾多？"
  options_en:
  - "A: 1 - e^(-0.002 * 100) = 1 - e^(-0.2) ≈ 0.181 (18.1%)"
  - "B: 100 / 500 = 0.200 (20.0%)"
  - "C: e^(-0.2) ≈ 0.819 (81.9%)"
  - "D: (0.002)^2 = 0.000004"
  options_zh:
  - "A: 1 - e^(-0.002 × 100) = 1 - e^(-0.2) ≈ 0.181 (即 18.1%)"
  - "B: 100 / 500 = 0.200 (即 20.0%)"
  - "C: e^(-0.2) ≈ 0.819 (即 81.9%)"
  - "D: (0.002)^2 = 0.000004"
  options_zh_hk:
  - "A: 1 - e^(-0.002 × 100) = 1 - e^(-0.2) ≈ 0.181 (即 18.1%)"
  - "B: 100 / 500 = 0.200 (即 20.0%)"
  - "C: e^(-0.2) ≈ 0.819 (即 81.9%)"
  - "D: (0.002)^2 = 0.000004"
  answer: A
  explanation_en: "The continuous CDF is F(t) = 1 - e^(-lambda * t). For t = 100 and lambda = 0.002: F(100) = 1 - e^(-0.2) ≈ 1 - 0.8187 = 0.1813 (18.1%)."
  explanation_zh: "连续 CDF 为 F(t) = 1 - e^(-lambda × t)。代入 t = 100 及 lambda = 0.002：F(100) = 1 - e^(-0.2) ≈ 1 - 0.8187 = 0.1813（即 18.1%）。"
  explanation_zh_hk: "連續 CDF 為 F(t) = 1 - e^(-lambda × t)。代入 t = 100 同埋 lambda = 0.002：F(100) = 1 - e^(-0.2) ≈ 1 - 0.8187 = 0.1813（即 18.1%）。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Mid-Rush Breakdown"
  kicker_en: "The Mid-Rush Breakdown"
  kicker_zh: "高峰瘫痪之危"
  kicker_zh_hk: "高峰癱瘓之危"
  title_en: "When the primary grinder jams at 8:30 AM"
  title_zh: "早八点半磨豆机骤停：设备寿命的隐形倒计时"
  title_zh_hk: "朝八點半磨豆機驟停：設備壽命嘅隱形倒計時"
  en: "An Airport store models grinder-burr lifetime with an average of 500 operating hours. A set fails after only 100 hours. Under an Exponential model, how likely is failure before 100 hours, and what does memorylessness say about a set that has already survived that long?"
  zh: "机场店用平均 500 个运转小时为磨豆机刀盘寿命建模。一套刀盘只运行 100 小时便失效。在指数模型下，100 小时前失效的概率是多少？已经运行 100 小时仍未失效的刀盘，其无记忆性又意味着什么？"
  zh_hk: "機場舖用平均 500 個運轉鐘為磨豆機刀盤壽命建模。一套刀盤淨係運行 100 個鐘就失效。喺指數模型之下，100 個鐘之前失效嘅概率係幾多？已經運行 100 個鐘仍未失效嘅刀盤，佢嘅無記憶性又意味住咩？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Exponential distribution"
  title_zh: "指数分布的概率密度与累积函数"
  title_zh_hk: "指數分佈嘅概率密度與累積函數"
  formula: "f(t) = lambda * e^(-lambda * t); F(t) = 1 - e^(-lambda * t)"
  formula_zh: "密度 f(t) = lambda × e^(-lambda × t)；累积失效 F(t) = 1 - e^(-lambda × t)"
  formula_zh_hk: "密度 f(t) = lambda × e^(-lambda × t)；累積失效 F(t) = 1 - e^(-lambda × t)"
  formula_tex: "f(t) = \\lambda e^{-\\lambda t}, \\quad F(t) = 1 - e^{-\\lambda t}, \\quad t \\ge 0"
  s1_en: "In a homogeneous Poisson process with constant rate lambda, event counts are Poisson and the waiting times between consecutive events are Exponential. The lifetime interpretation therefore assumes a constant hazard rate."
  s1_zh: "在速率 lambda 恒定的齐次泊松过程中，事件计数服从泊松分布，相邻事件之间的等待时间服从指数分布。用于寿命时，这意味着假设危险率恒定。"
  s1_zh_hk: "喺速率 lambda 固定嘅齊次泊松過程入面，事件計數服從泊松分佈，相鄰事件之間嘅等待時間服從指數分佈。用於壽命嗰陣，呢個意味住假設危險率固定。"
  s2_en: "With lambda greater than zero, the density starts at lambda when t equals zero and decreases exponentially. The survival function is P(T>t)=e^(-lambda t), and the hazard remains lambda."
  s2_zh: "当 lambda 大于零时，密度在 t=0 处等于 lambda，随后指数下降。生存函数为 P(T>t)=e^(-lambda t)，危险率保持为 lambda。"
  s2_zh_hk: "當 lambda 大過零，密度喺 t=0 嗰陣等於 lambda，之後指數下降。生存函數係 P(T>t)=e^(-lambda t)，危險率保持做 lambda。"
- id: memoryless
  visual: two_column
  seconds: 36
  kicker: "The Counterintuitive Law"
  kicker_en: "The Counterintuitive Law"
  kicker_zh: "反直觉法则"
  kicker_zh_hk: "反直覺法則"
  title_en: "Mean 1/lambda and the memoryless paradox"
  title_zh: "期望等于 1/lambda，以及反直觉的无记忆性"
  title_zh_hk: "期望等於 1/lambda，以及反直覺嘅無記憶性"
  left_en: "Moments: E[T] = 1/lambda, SD[T] = 1/lambda"
  left_zh: "核心矩：期望寿命与标准差完全相等，皆为 1/lambda"
  left_zh_hk: "核心矩：期望壽命與標準差完全相等，皆為 1/lambda"
  right_en: "Memoryless: P(T > s + t | T > s) = P(T > t)"
  right_zh: "无记忆性：已知运行 s 小时，未来再挺 t 小时概率恒定"
  right_zh_hk: "無記憶性：已知運行 s 個鐘，未來再頂 t 個鐘概率恆定"
  s1_en: "The expected waiting time until the next incident is simply the reciprocal of the rate: one over lambda. Crucially, its standard deviation is also exactly one over lambda."
  s1_zh: "突发故障前的期望运行时间，恰好等于失效率的倒数：即 1/lambda。至关重要的是，其波动的标准差在数值上也严密恒等于 1/lambda。"
  s1_zh_hk: "突發故障前嘅期望運行時間，啱啱好等於失效率嘅倒數：即 1/lambda。至關重要嘅係，其波動嘅標準差喺數值上亦都嚴密恆等於 1/lambda。"
  s2_en: "Even more surprising is the memoryless property: surviving s hours without incident does not make the component any more likely to fail in the next t hours."
  s2_zh: "更为反直觉的是其独特的无记忆性：即便设备已经安然无恙运转了 s 小时，它在接下来的 t 小时内发生损坏的条件概率并不会因此而升高。"
  s2_zh_hk: "更為反直覺嘅係其獨特嘅無記憶性：就算設備已經安然無恙運轉咗 s 個鐘，佢喺跟住落嚟嘅 t 個鐘內發生損壞嘅條件概率並唔會因此而升高。"
  s3_en: "Under the Exponential model, a component that has survived s hours has the same conditional probability of surviving the next t hours as a new component. This comparison concerns a future interval, not failure at an exact instant."
  s3_zh: "在指数模型下，已经运行 s 小时的部件继续运行未来 t 小时的条件概率，与新部件运行 t 小时的概率相同。该比较针对未来区间，而不是某个精确瞬间的失效概率。"
  s3_zh_hk: "喺指數模型之下，已經運行 s 個鐘嘅部件繼續運行未來 t 個鐘嘅條件概率，同新部件運行 t 個鐘嘅概率相同。呢個比較針對未來區間，唔係某個精確瞬間嘅失效概率。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Modeling Airport grinder-burr lifetime"
  title_zh: "机场店磨豆机刀盘寿命模型"
  title_zh_hk: "機場舖磨豆機刀盤壽命模型"
  step1_en: "Rate: E[T] = 500 hours -> lambda = 1/500 = 0.002 failure/hour"
  step1_zh: "失效率核定：期望寿命 500 小时 -> lambda = 1/500 = 0.002/小时"
  step1_zh_hk: "失效率核定：期望壽命 500 個鐘 -> lambda = 1/500 = 0.002/個鐘"
  step2_en: "Early failure: F(100) = 1 - e^(-0.002 * 100) = 1 - e^(-0.2) = 18.1%"
  step2_zh: "100 小时前失效：F(100) = 1 - e^(-0.2) ≈ 0.181"
  step2_zh_hk: "100 個鐘前失效：F(100) = 1 - e^(-0.2) ≈ 0.181"
  step3_en: "Surviving mean: E[T - 100 | T > 100] = 500 hours remaining!"
  step3_zh: "条件剩余期望：在指数模型下，运行 100 小时后仍为 500 小时"
  step3_zh_hk: "條件剩餘期望：喺指數模型下，運行 100 個鐘後仍然係 500 個鐘"
  s1_en: "For this Airport illustration, assume grinder-burr lifetime is Exponential with mean 500 operating hours. Then lambda equals one over 500, or 0.002 per hour."
  s1_zh: "在这个机场店示例中，假设磨豆机刀盘寿命服从均值为 500 运转小时的指数分布，因此 lambda=1/500=0.002/小时。"
  s1_zh_hk: "喺呢個機場舖示例入面，假設磨豆機刀盤壽命服從均值為 500 個運轉鐘嘅指數分佈，所以 lambda=1/500=0.002/個鐘。"
  s2_en: "Step two computes the modeled probability of failure before 100 hours: F(100)=1-e^(-0.2), approximately 0.181 or 18.1%."
  s2_zh: "第二步计算 100 小时前失效的模型概率：F(100)=1-e^(-0.2)，约为 0.181，即 18.1%。"
  s2_zh_hk: "第二步計 100 個鐘之前失效嘅模型概率：F(100)=1-e^(-0.2)，大約係 0.181，即係 18.1%。"
  s3_en: "Under this model, failure before 100 hours has probability 18.1%. Conditional on survival to 100 hours, memorylessness gives an expected remaining lifetime of 500 hours, not 400."
  s3_zh: "在该模型下，100 小时前失效的概率为 18.1%。在已生存至 100 小时的条件下，无记忆性给出的剩余期望寿命是 500 小时，而不是 400 小时。"
  s3_zh_hk: "喺呢個模型之下，100 個鐘之前失效嘅概率係 18.1%。喺已經生存到 100 個鐘嘅條件下，無記憶性畀出嘅剩餘期望壽命係 500 個鐘，而唔係 400 個鐘。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Stock spares for the crash, not the average life"
  title_zh: "备件储备防范早夭突袭，预防维保勿信平均寿命"
  title_zh_hk: "備件儲備防範早夭突襲，預防維保咪信平均壽命"
  q1_en: "What does an Exponential model contribute to spare-parts planning?"
  q1_zh: "指数模型可为备件规划提供什么信息？"
  q1_zh_hk: "指數模型可以為備件規劃提供咩資料？"
  q2_en: "When does the memoryless assumption fail in operational engineering?"
  q2_zh: "在工程运维中，指数分布的无记忆性假设会在何时宣告失效？"
  q2_zh_hk: "喺工程運維入面，指數分佈嘅無記憶性假設會喺幾時宣告失效？"
  s1_en: "The 18.1% early-failure probability can inform a spare-parts decision, but stock levels also depend on downtime cost, replacement lead time, failure consequences, and model fit."
  s1_zh: "18.1% 的早期失效概率可为备件决策提供依据，但库存水平还取决于停机成本、补货提前期、失效后果和模型拟合程度。"
  s1_zh_hk: "18.1% 嘅早期失效概率可以為備件決策提供依據，但庫存水平仲取決於停機成本、補貨提前期、失效後果同模型擬合程度。"
  s2_en: "If the observed hazard changes with age because of wear, burn-in, or other mechanisms, the constant-hazard Exponential model may not fit. Use diagnostics and consider a model that allows age-dependent hazard."
  s2_zh: "如果因为磨损、磨合期或其他机制，观察到的危险率随年龄变化，则恒定危险率的指数模型可能不适用。应使用诊断并考虑允许危险率随年龄变化的模型。"
  s2_zh_hk: "如果因為磨損、磨合期或者其他機制，觀察到嘅危險率會隨年齡變化，固定危險率嘅指數模型可能唔適用。應該使用診斷，並考慮容許危險率隨年齡變化嘅模型。"
  s3_en: "For an Exponential lifetime with mean 500 hours, lambda=0.002, P(T<=100)=18.1%, and the expected remaining life after surviving 100 hours is still 500 hours. These conclusions depend on the constant-hazard assumption."
  s3_zh: "对于均值为 500 小时的指数寿命，lambda=0.002，P(T≤100)=18.1%；在已运行 100 小时的条件下，剩余期望寿命仍为 500 小时。这些结论依赖恒定危险率假设。"
  s3_zh_hk: "對均值為 500 個鐘嘅指數壽命嚟講，lambda=0.002，P(T≤100)=18.1%；喺已經運行 100 個鐘嘅條件下，剩餘期望壽命仍然係 500 個鐘。呢啲結論依賴固定危險率假設。"