youtube:
  description_en: |
    Service times and machine lifespans
    
    Shop C models grinder-burr lifetime with an average of 500 operating hours. A set fails after only 100 hours. Under an Exponential model, how likely is failure before 100 hours, and what does memorylessness say about a set that has already survived that long?
    
    With mean 500 hours, λ=0.002 per hour and F(100)≈18.1%. Memorylessness says that after surviving 100 hours, expected remaining life is still 500 hours under this model — which fails when hazard changes with age.
    
    Stock spares for the crash, not the average life. Early-fail probability informs spares; downtime cost and lead time still decide the policy.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 11 (EXPON)
    If this helped, subscribe for the next short.
  description_zh: |
    服务耗时与设备寿命：指数分布与无记忆性
    
    C店用平均 500 运转小时给磨豆刀盘建模。一套只跑了 100 小时就坏。指数模型下，100 小时前失效的概率多大？已经跑了 100 小时还没坏，无记忆性又意味着什么？
    
    均值 500 小时时 λ=0.002/小时，F(100)≈18.1%。无记忆性说：撑过 100 小时后，期望剩余寿命仍是 500 小时——危险率随年龄变化时，这个模型就失效。
    
    备件储备防范早夭突袭，预防维保勿信平均寿命。早夭概率影响备件；停机成本与提前期仍决定政策。
    
    离散与连续概率分布 - 模块3 - 短片11（EXPON）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    服務耗時與設備壽命：指數分佈與無記憶性
    
    C舖用平均 500 運轉鐘畀磨豆刀盤建模。一套淨係跑咗 100 個鐘就壞。指數模型下，100 個鐘之前失效嘅概率幾大？已經跑咗 100 個鐘都未壞，無記憶性又意味住咩？
    
    均值 500 個鐘嗰陣 λ=0.002/鐘，F(100)≈18.1%。無記憶性話：撐過 100 個鐘之後，期望剩餘壽命都仲係 500 個鐘——危險率隨年齡變化嗰陣，呢個模型就失效。
    
    備件儲備防範早夭突襲，預防維保咪信平均壽命。早夭概率影響備件；停機成本同提前期都仲決定政策。
    
    離散與連續概率分佈 - 模組3 - 短片11（EXPON）
    覺得有用嘅話，訂閱下一集。
