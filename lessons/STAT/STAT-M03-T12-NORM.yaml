id: STAT-M03-T12-NORM
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
duration_target_s: 166
title_en: "The grand operational baseline"
title_zh: "统御大盘的基准钟形线：正态分布"
title_zh_hk: "統領大盤嘅基準鐘形線：正態分佈"
youtube:
  description_en: |
    The grand operational baseline
    
    A coffee chain models total daily bean usage across its stores. Individual orders vary, and aggregation may produce a smoother distribution, but a bell curve is not automatic. What defines a Normal model, and what evidence is needed before using it for aggregate demand?
    
    In an illustration with mean 80 kg and sd 12 kg, inflection points sit at 68 kg and 92 kg. Symmetry gives P(X above 80)=0.50; 116 kg is z=3, an extreme upper tail of about 0.00135 under the Normal model.
    
    Defend Normality with data and process story, not aggregation slogans. Aggregate micro variance can unleash a usable bell curve — only after the fit check.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 12 (NORM)
    If this helped, subscribe for the next short.
  description_zh: |
    统御大盘的基准钟形线：正态分布
    
    咖啡连锁要为各店每日咖啡豆总用量建模。单笔订单有高有低，加总后曲线可能更平滑，但钟形不会自动长出来。
    
    示例均值 80 千克、标准差 12 千克时，拐点在 68 与 92 千克。对称性给出 P(X 高于 80)=0.50；116 千克对应 z=3，正态上尾约 0.00135。
    
    用样本与过程故事为正态辩护，别靠「加总就会钟形」的口号。汇聚微观杂音可以启用正态大盘——前提是拟合检查过关。
    
    离散与连续概率分布 - 模块3 - 短片12（NORM）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    統領大盤嘅基準鐘形線：正態分佈
    
    咖啡連鎖要為各舖每日咖啡豆總用量建模。單筆訂單有高有低，加總之後曲線可能更平滑，但鐘形唔會自動長出嚟。
    
    示例均值 80 公斤、標準差 12 公斤嗰陣，拐點喺 68 同 92 公斤。對稱性畀出 P(X 高過 80)=0.50；116 公斤對應 z=3，正態上尾約 0.00135。
    
    用樣本同過程故事為正態辯護，唔好靠「加總就會鐘形」嘅口號。匯聚微觀雜音可以啟用正態大盤——前提係擬合檢查過關。
    
    離散與連續概率分佈 - 模組3 - 短片12（NORM）
    覺得有用嘅話，訂閱下一集。
