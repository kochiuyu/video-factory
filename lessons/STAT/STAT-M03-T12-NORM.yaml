title_en: "The grand operational baseline"
title_zh: "统御大盘的基准钟形线：正态分布"
title_zh_hk: "統領大盤嘅基準鐘形線：正態分佈"
objective_en: "Define the Gaussian Normal distribution N(mu, sigma^2), explain its perfect bell-shaped symmetry around the mean, identify the geometric inflection points at mu +/- sigma, and model network-wide aggregate daily coffee bean consumption."
objective_zh: "定义高斯正态分布 N(mu, sigma^2)，解析围绕均值展开的完美钟形对称性，识别拐点几何特征 mu +/- sigma，并对全网五十家门店的每日咖啡生豆总消耗量进行科学建模。"
objective_zh_hk: "定義高斯正態分佈 N(mu, sigma^2)，解析圍繞均值展開嘅完美鐘形對稱性，識別拐點幾何特徵 mu +/- sigma，並對全網五十間門市嘅每日咖啡生豆總消耗量進行科學建模。"
