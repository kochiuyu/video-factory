quiz:
- id: Q1
  type: multiple_choice
  question_en: "At what exact coordinates along the horizontal axis do the geometric inflection points of a Normal distribution curve N(mu, sigma^2) occur?"
  question_zh: "正态分布密度曲线 N(mu, sigma^2) 的几何拐点（凸向凹转换点）精确出现在横轴的哪两个坐标位置？"
  question_zh_hk: "正態分佈密度曲線 N(mu, sigma^2) 嘅幾何拐點（凸向凹轉換點）精確出現喺橫軸嘅邊兩個坐標位置？"
  options_en:
  - "A: At exactly one standard deviation to the left and right of the mean: x = mu - sigma and x = mu + sigma."
  - "B: At the minimum and maximum observed data points in the store ledger."
  - "C: At the vertical axis intercept where sales revenue equals zero."
  - "D: At three standard deviations above the mean exclusively."
  options_zh:
  - "A: 精确出现在均值左侧与右侧各一个标准差的位置：x = mu - sigma 与 x = mu + sigma。"
  - "B: 出现在门店历史账目中实际记录的最小值与最大值端点处。"
  - "C: 出现在横轴与纵轴相交、销售收入恰好为零的坐标原点处。"
  - "D: 仅出现在均值右侧三个标准差以外的极端上尾区域。"
  options_zh_hk:
  - "A: 精確出現喺均值左側同右側各一個標準差嘅位置：x = mu - sigma 同埋 x = mu + sigma。"
  - "B: 出現喺門市歷史賬目入面實際記錄嘅最小值同最大值端點處。"
  - "C: 出現喺橫軸同縱軸相交、銷售收入啱啱好係零嘅坐標原點處。"
  - "D: 淨係出現喺均值右側三個標準差以外嘅極端上尾區域。"
  answer: A
  explanation_en: "Taking the second derivative of the Normal PDF and setting f''(x) = 0 mathematically yields x = mu +/- sigma, representing where the bell curve transitions from concave downward to concave upward."
  explanation_zh: "对正态密度函数求二阶导数并令 f''(x) = 0，在数学上严格解得 x = mu +/- sigma，该处正是钟形曲线由下凹转向下凸的几何拐点。"
  explanation_zh_hk: "對正態密度函數求二階導數並令 f''(x) = 0，喺數學上嚴格解得 x = mu +/- sigma，嗰處正正係鐘形曲線由下凹轉向下凸嘅幾何拐點。"
- id: Q2
  type: multiple_choice
  question_en: "If total network coffee bean usage follows N(mu = 80 kg, sigma = 12 kg), what is the probability that daily network demand exceeds 80 kg?"
  question_zh: "若全网五十家门店的每日咖啡豆总消耗量服从正态分布 N(mu = 80 kg, sigma = 12 kg)，单日消耗量超过 80 公斤的概率是多少？"
  question_zh_hk: "若全網五十間門市嘅每日咖啡豆總消耗量服從正態分佈 N(mu = 80 kg, sigma = 12 kg)，單日消耗量超過 80 公斤嘅概率係幾多？"
  options_en:
  - "A: Exactly 0.50 (50%), because the Normal distribution is perfectly symmetrical about its mean mu."
  - "B: 0.80 (80%) because the mean is 80."
  - "C: 0.12 (12%) because the standard deviation is 12."
  - "D: 1.00 (100%) because coffee beans are consumed every day."
  options_zh:
  - "A: 严格等于 0.50 (即 50%)，因为正态分布密度曲线围绕均值 mu 呈现出绝对严格的左右对称。"
  - "B: 0.80 (即 80%)，因为基准均值为 80 公斤。"
  - "C: 0.12 (即 12%)，因为离散标准差为 12 公斤。"
  - "D: 1.00 (即 100%)，因为门店每天都在开门消耗咖啡豆。"
  options_zh_hk:
  - "A: 嚴格等於 0.50 (即 50%)，因為正態分佈密度曲線圍繞均值 mu 呈現出絕對嚴格嘅左右對稱。"
  - "B: 0.80 (即 80%)，因為基準均值為 80 公斤。"
  - "C: 0.12 (即 12%)，因為離散標準差為 12 公斤。"
  - "D: 1.00 (即 100%)，因為門市每日都喺度開門消耗咖啡豆。"
  answer: A
  explanation_en: "Symmetry guarantees that exactly half the total area under the curve lies below the mean, and half lies above it: P(X > mu) = P(X < mu) = 0.50."
  explanation_zh: "绝对对称性确保了曲线下方的总积分面积被均值严格一分为二：P(X > mu) = P(X < mu) = 0.50。"
  explanation_zh_hk: "絕對對稱性確保咗曲線下方嘅總積分面積被均值嚴格一分為二：P(X > mu) = P(X < mu) = 0.50。"
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Macro Aggregation"
  kicker_en: "The Macro Aggregation"
  kicker_zh: "宏观聚合之力"
  kicker_zh_hk: "宏觀聚合之力"
  title_en: "Why do a thousand chaotic cups form a smooth bell?"
  title_zh: "数万张杂乱小票，何以汇聚成完美钟形？"
  title_zh_hk: "數萬張雜亂單據，點解匯聚成完美鐘形？"
  en: "A coffee chain models total daily bean usage across its stores. Individual orders vary, and aggregation may produce a smoother distribution, but a bell curve is not automatic. What defines a Normal model, and what evidence is needed before using it for aggregate demand?"
  zh: "一家咖啡连锁为各门店每日咖啡豆总用量建模。单笔订单各有差异，聚合后分布可能更平滑，但钟形曲线并不会自动出现。正态模型由什么定义？在用于总量需求前又需要哪些证据？"
  zh_hk: "一間咖啡連鎖為各門市每日咖啡豆總用量建模。單筆訂單各有差異，聚合之後分佈可能更平滑，但鐘形曲線唔會自動出現。正態模型由咩定義？用於總量需求之前又需要邊啲證據？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The Gaussian Normal distribution"
  title_zh: "高斯正态分布的数学机理"
  title_zh_hk: "高斯正態分佈嘅數學機理"
  formula: "f(x) = [1 / (sigma * sqrt(2*pi))] * e^[ - (x - mu)^2 / (2*sigma^2) ]"
  formula_zh: "f(x) = [1 / (sigma × 根号(2*pi))] × e^[ - (x - mu)^2 / (2*sigma^2) ]"
  formula_zh_hk: "f(x) = [1 / (sigma × 根號(2*pi))] × e^[ - (x - mu)^2 / (2*sigma^2) ]"
  formula_tex: "f(x) = \\frac{1}{\\sigma \\sqrt{2\\pi}} \\exp\\left( -\\frac{(x - \\mu)^2}{2\\sigma^2} \\right), \\quad -\\infty < x < \\infty"
  s1_en: "A Normal distribution is determined by its mean mu and positive standard deviation sigma, or equivalently by variance sigma squared. Its density is symmetric about mu and integrates to one."
  s1_zh: "正态分布由均值 mu 与正标准差 sigma 决定，也可用方差 sigma 平方表示。其密度围绕 mu 对称，曲线下总面积为 1。"
  s1_zh_hk: "正態分佈由均值 mu 同正標準差 sigma 決定，亦可以用方差 sigma 平方表示。佢嘅密度圍繞 mu 對稱，曲線下總面積係 1。"
  s2_en: "Its density formula balances the mathematical constants pi and e. The squared distance in the exponent pulls probabilities smoothly downward as values move away from mu, creating its unmistakable bell profile."
  s2_zh: "其密度函数精妙平衡了圆周率 pi 与自然常数 e。指数项中与均值的离差平方，确保了数值越远离核心中心 mu、概率密度便越平滑迅猛地向下衰减，雕刻出标志性的钟形轮廓。"
  s2_zh_hk: "其密度函數精妙平衡咗圓周率 pi 同自然常數 e。指數項入面與均值嘅偏差平方，確保咗數值越遠離核心中心 mu、概率密度就越平滑迅猛噉向下衰減，雕刻出標誌性嘅鐘形輪廓。"
- id: anatomy
  visual: two_column
  seconds: 36
  kicker: "The Geometry"
  kicker_en: "The Geometry"
  kicker_zh: "几何解剖"
  kicker_zh_hk: "幾何解剖"
  title_en: "Symmetry, peak, and the two inflection points"
  title_zh: "中心极值对称，与标准差天然拐点"
  title_zh_hk: "中心極值對稱，與標準差天然拐點"
  left_en: "Symmetry: Mean = Median = Mode = mu"
  left_zh: "对称三合一：均值 = 中位数 = 众数 = mu"
  left_zh_hk: "對稱三合一：均值 = 中位數 = 眾數 = mu"
  right_en: "Inflections: Curvature flips at mu +/- sigma"
  right_zh: "曲率反转：钟形弯曲在 mu +/- sigma 处发生突变"
  right_zh_hk: "曲率反轉：鐘形彎曲喺 mu +/- sigma 處發生突變"
  s1_en: "The Normal curve is perfectly symmetrical about its center. At the exact peak x equals mu, the mean, median, and mode coincide into one single master benchmark."
  s1_zh: "正态曲线围绕其中心垂线呈现绝对完美的镜像对称。在正中央最高峰值点 x 等于 mu 处，均值、中位数与众数三位一体彻底重合。"
  s1_zh_hk: "正態曲線圍繞其中心垂線呈現絕對完美嘅鏡像對稱。喺正中央最高峰值點 x 等於 mu 處，均值、中位數同眾數三位一體徹底重合。"
  s2_en: "Move outwards from the center: the curve initially arches like a dome, bowing downwards. At exactly one standard deviation to the left and right, the curvature reverses."
  s2_zh: "自顶峰向两侧延展：曲线最初如苍穹穹顶般向下拱起下凹。而恰恰在左右各跨越一个标准差的位置，曲线的几何曲率发生关键反转。"
  s2_zh_hk: "由頂峰向兩側延展：曲線最初好似蒼穹穹頂噉向下拱起下凹。而恰恰喺左右各跨越一個標準差嘅位置，曲線嘅幾何曲率發生關鍵反轉。"
  s3_en: "The inflection points occur at mu minus sigma and mu plus sigma, where the density changes concavity. They are geometric features, not operational risk thresholds by themselves."
  s3_zh: "拐点位于 mu 减 sigma 与 mu 加 sigma，密度曲线在此改变凹凸性。它们是几何特征，本身并不是运营风险阈值。"
  s3_zh_hk: "拐點位於 mu 減 sigma 同 mu 加 sigma，密度曲線喺呢度改變凹凸性。佢哋係幾何特徵，本身唔係營運風險門檻。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Modeling network coffee bean usage"
  title_zh: "全网咖啡豆日耗正态模型"
  title_zh_hk: "全網咖啡豆日耗正態模型"
  step1_en: "Model parameters: X ~ N(mu = 80 kg, sigma^2 = 144 -> sigma = 12 kg)"
  step1_zh: "模型确立：日用量服从正态 N(mu = 80kg，方差 144 -> 标准差 12kg)"
  step1_zh_hk: "模型確立：日用量服從正態 N(mu = 80kg，方差 144 -> 標準差 12kg)"
  step2_en: "Inflection zone: [80 - 12, 80 + 12] = 68 kg to 92 kg"
  step2_zh: "拐点核心带：[80 - 12, 80 + 12] = 68 公斤至 92 公斤"
  step2_zh_hk: "拐點核心帶：[80 - 12, 80 + 12] = 68 公斤至 92 公斤"
  step3_en: "Tail baseline: P(X > 80 kg) = 0.50; P(X > 116 kg) is extreme tail"
  step3_zh: "上尾概率：P(X > 80kg)=0.50；P(X > 116kg)≈0.00135"
  step3_zh_hk: "上尾概率：P(X > 80kg)=0.50；P(X > 116kg)≈0.00135"
  s1_en: "For this illustration, assume aggregate daily bean usage follows a Normal distribution with mean 80 kilograms and standard deviation 12 kilograms. These are model parameters, not authenticated operating records."
  s1_zh: "本例假设每日咖啡豆总用量服从均值 80 公斤、标准差 12 公斤的正态分布。这些是模型参数，并非经过认证的运营记录。"
  s1_zh_hk: "本例假設每日咖啡豆總用量服從均值 80 公斤、標準差 12 公斤嘅正態分佈。呢啲係模型參數，唔係經過認證嘅營運記錄。"
  s2_en: "Step two locates the geometric inflection points: 80 minus 12 equals 68 kilograms, and 80 plus 12 equals 92 kilograms. This interval is not automatically a service or inventory band."
  s2_zh: "第二步定位几何拐点：80 减 12 等于 68 公斤，80 加 12 等于 92 公斤。该区间不会自动成为服务或库存范围。"
  s2_zh_hk: "第二步定位幾何拐點：80 減 12 等於 68 公斤，80 加 12 等於 92 公斤。呢個區間唔會自動成為服務或者庫存範圍。"
  s3_en: "Step three uses symmetry to obtain P(X>80)=0.50. Standardizing 116 kilograms gives z=3, so the upper-tail probability is about 0.00135 under the Normal model."
  s3_zh: "第三步利用对称性得到 P(X>80)=0.50。将 116 公斤标准化得到 z=3，因此在正态模型下，上尾概率约为 0.00135。"
  s3_zh_hk: "第三步利用對稱性得到 P(X>80)=0.50。將 116 公斤標準化得到 z=3，所以喺正態模型之下，上尾概率大約係 0.00135。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Aggregate micro variance to unleash the bell curve"
  title_zh: "汇聚微观杂音，启用正态大盘统御全局"
  title_zh_hk: "匯聚微觀雜音，啟用正態大盤統領全局"
  q1_en: "When is a Normal model a defensible forecasting baseline?"
  q1_zh: "何时可以把正态模型作为有理据的预测基准？"
  q1_zh_hk: "幾時可以將正態模型作為有理據嘅預測基準？"
  q2_en: "What must be checked before a Normal model is used for aggregate demand?"
  q2_zh: "将正态模型用于总量需求前，必须检查什么？"
  q2_zh_hk: "將正態模型用於總量需求之前，必須檢查咩？"
  s1_en: "Do not assume Normality solely because a metric is aggregated. Examine the data and the dependence, tail behavior, and contribution sizes; a Normal approximation is more defensible when no small set of components dominates and dependence is limited."
  s1_zh: "不要仅因指标经过聚合就假设正态性。应检查数据以及相关性、尾部行为和各组成项的贡献；当少数组成项不会主导总量且依赖程度有限时，正态近似才更有理据。"
  s1_zh_hk: "唔好淨係因為指標經過聚合就假設正態性。應該檢查數據以及相關性、尾部行為同各組成項嘅貢獻；當少數幾項唔會主導總量而依賴程度有限，正態近似先更有理據。"
  s2_en: "Within a validated Normal model, mu describes the center and sigma describes dispersion. Changes in sigma do not by themselves prove that a process is gaining or losing control."
  s2_zh: "在经过验证的正态模型中，mu 描述中心，sigma 描述离散程度。sigma 的变化本身不能证明流程正在恢复控制或失去控制。"
  s2_zh_hk: "喺經過驗證嘅正態模型入面，mu 描述中心，sigma 描述離散程度。sigma 嘅變化本身唔可以證明流程正在恢復控制或者失去控制。"
  s3_en: "For the N(80,144) model, the inflection points are 68 and 92 kilograms, P(X>80)=0.50, and P(X>116) is about 0.00135. Use these results only after checking whether a Normal model fits the aggregate-demand data."
  s3_zh: "对于 N(80,144) 模型，拐点为 68 与 92 公斤，P(X>80)=0.50，P(X>116) 约为 0.00135。只有检查正态模型是否适合总量需求数据后，才应使用这些结果。"
  s3_zh_hk: "對 N(80,144) 模型嚟講，拐點係 68 同 92 公斤，P(X>80)=0.50，P(X>116) 大約係 0.00135。只有檢查正態模型係咪適合總量需求數據之後，先應該使用呢啲結果。"