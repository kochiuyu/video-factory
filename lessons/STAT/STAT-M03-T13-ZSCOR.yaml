quiz:
- id: Q1
  type: multiple_choice
  question_en: "What mathematical transformation does the formula Z = (X - mu) / sigma perform on any normal distribution X ~ N(mu, sigma^2)?"
  question_zh: "转换公式 Z = (X - mu) / sigma 对任意正态分布 X ~ N(mu, sigma^2) 在数学上执行了怎样的核心转换？"
  question_zh_hk: "轉換公式 Z = (X - mu) / sigma 對任意正態分佈 X ~ N(mu, sigma^2) 喺數學上執行咗點樣嘅核心轉換？"
  options_en:
  - "A: It centers the distribution at 0 by subtracting mu, and scales the spread to exactly 1 by dividing by sigma, producing Z ~ N(0, 1)."
  - "B: It converts negative financial losses into positive tax credits."
  - "C: It doubles the sample size of the underlying store ledger."
  - "D: It guarantees that all subsequent customer orders will be identically priced."
  options_zh:
  - "A: 通过减去均值 mu 将分布中心平移归零，并通过除以标准差 sigma 将离散尺度缩放为严格的 1，生成标准正态分布 Z ~ N(0, 1)。"
  - "B: 将财务账目上的负数净亏损全额转化为正向的政府税收抵免。"
  - "C: 将底层门店台账中记录的客单抽样量人为扩大一倍。"
  - "D: 确保在此之后进店的所有顾客点单金额都保持绝对一致。"
  options_zh_hk:
  - "A: 透過減去均值 mu 將分佈中心平移歸零，並透過除以標準差 sigma 將離散尺度縮放為嚴格嘅 1，生成標準正態分佈 Z ~ N(0, 1)。"
  - "B: 將財務賬目上嘅負數淨虧損全額轉化為正向嘅政府稅收抵免。"
  - "C: 將底層門市台賬入面記錄嘅客單抽樣量人為擴大一倍。"
  - "D: 確保喺呢個之後入舖嘅所有顧客點單金額都保持絕對一致。"
  answer: A
  explanation_en: "Subtracting mu shifts the location so the new mean is 0. Dividing by sigma normalizes the spread so the new standard deviation and variance are 1."
  explanation_zh: "减去均值 mu 完成中心平移使新均值为 0；除以 sigma 完成尺度归一化使新标准差和方差均为 1。"
  explanation_zh_hk: "減去均值 mu 完成中心平移令新均值為 0；除以 sigma 完成尺度歸一化令新標準差同方差均為 1。"
- id: Q2
  type: multiple_choice
  question_en: "Shop B sells 520 cold brews on a day when its baseline is N(450, 35^2). Shop C sells 710 cold brews when its baseline is N(600, 50^2). Which branch achieved the more extraordinary demand surge?"
  question_zh: "B店某日售出 520 杯冷萃（该店基准为 N(450, 35^2)）。C店同日售出 710 杯冷萃（该店基准为 N(600, 50^2)）。哪家分店取得了更为罕见、相对冲击力更大的爆单突破？"
  question_zh_hk: "B舖某日賣出 520 杯冷萃（該舖基準為 N(450, 35^2)）。C舖同日賣出 710 杯冷萃（該舖基準為 N(600, 50^2)）。邊間分店攞到更為罕見、相對衝擊力更大嘅爆單突破？"
  options_en:
  - "A: Shop C, because Z_C = (710 - 600) / 50 = +2.20, which is higher than Shop B's Z_B = (520 - 450) / 35 = +2.00."
  - "B: Shop B, because 520 is closer to its mean."
  - "C: Both branches performed identically because both Z-scores are positive."
  - "D: Neither branch experienced a surge because cold brew is a seasonal item."
  options_zh:
  - "A: C店，因为C店的 Z 分数为 (710 - 600) / 50 = +2.20，高于B店的 Z 分数 (520 - 450) / 35 = +2.00。"
  - "B: B店，因为 520 比 710 更接近其日常均值。"
  - "C: 两家门店表现完全相同，因为两者的 Z 分数全部都是正数。"
  - "D: 两家店均未出现爆单，因为冷萃咖啡属于强季节性商品。"
  options_zh_hk:
  - "A: C舖，因為C舖嘅 Z 分數為 (710 - 600) / 50 = +2.20，高過B舖嘅 Z 分數 (520 - 450) / 35 = +2.00。"
  - "B: B舖，因為 520 仲接近其日常均值。"
  - "C: 兩間門市表現完全相同，因為兩者嘅 Z 分數全部都係正數。"
  - "D: 兩間舖都冇出現爆單，因為冷萃咖啡屬於強季節性商品。"
  answer: A
  explanation_en: "Z_C = 110 / 50 = +2.20 standard deviations above mean; Z_B = 70 / 35 = +2.00 standard deviations above mean. Shop C was 2.20 sigmas out, representing a rarer statistical surge."
  explanation_zh: "C店 Z = 110 / 50 = +2.20 个标准差；B店 Z = 70 / 35 = +2.00 个标准差。C店偏离均值更远，代表了统计概率上更为罕见、相对幅度更大的销售爆发。"
  explanation_zh_hk: "C舖 Z = 110 / 50 = +2.20 個標準差；B舖 Z = 70 / 35 = +2.00 個標準差。C舖偏離均值更遠，代表咗統計概率上更為罕見、相對幅度更大嘅銷售爆發。"
beats:
- id: hook
