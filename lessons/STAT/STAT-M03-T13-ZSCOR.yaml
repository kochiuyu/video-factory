- id: hook
  visual: title_card
  seconds: 30
  kicker: "The Evaluation Dispute"
  kicker_en: "The Evaluation Dispute"
  kicker_zh: "跨店考核之争"
  kicker_zh_hk: "跨舖考核之爭"
  title_en: "Who had the more impressive sales surge?"
  title_zh: "七百一十对五百二十：究竟谁的表现更卓越？"
  title_zh_hk: "七百一十對五百二十：究竟邊個嘅表現更卓越？"
  en: "An operations team compares two daily cold-brew demand signals: 710 cups at Airport and 520 at Mong Kok. Raw totals differ because the locations have different baselines and variability. How can standardization express each observation relative to its own distribution before the team compares their statistical extremeness?"
  zh: "运营团队比较两个单日冷萃需求信号：机场店 710 杯，旺角店 520 杯。由于两地基准与波动程度不同，原始总量不能直接反映相对偏离程度。标准化如何先把每个观测值放回各自分布，再比较其统计极端程度？"
  zh_hk: "營運團隊比較兩個單日冷萃需求訊號：機場舖 710 杯，旺角舖 520 杯。由於兩地基準同波動程度唔同，原始總量唔可以直接反映相對偏離程度。標準化點樣先將每個觀測值放返各自分佈，再比較佢哋嘅統計極端程度？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "Standardization and the Z-score"
  title_zh: "标准化转换与标准正态分布"
  title_zh_hk: "標準化轉換與標準正態分佈"
  formula: "Z = (X - mu) / sigma; Z ~ N(0, 1)"
  formula_zh: "Z = (X - mu) / sigma；标准化后的新变量 Z 服从标准正态 N(0, 1)"
  formula_zh_hk: "Z = (X - mu) / sigma；標準化後嘅新變量 Z 服從標準正態 N(0, 1)"
  formula_tex: "Z = \\frac{X - \\mu}{\\sigma}, \\quad Z \\sim N(0, 1)"
  s1_en: "For any variable with finite mean mu and positive standard deviation sigma, standardization produces the dimensionless Z-score. If X is Normal, the transformed variable follows the Standard Normal distribution N(0,1)."
  s1_zh: "对于具有有限均值 mu 与正标准差 sigma 的变量，标准化会产生无量纲的 Z 分数。如果 X 服从正态分布，转换后的变量便服从标准正态分布 N(0,1)。"
  s1_zh_hk: "對具有有限均值 mu 同正標準差 sigma 嘅變量，標準化會產生無量綱嘅 Z 分數。如果 X 服從正態分佈，轉換後嘅變量就服從標準正態分佈 N(0,1)。"
  s2_en: "Subtracting the store mean shifts the center to exactly zero. Dividing by the store standard deviation rescales spread to exactly one, producing the Standard Normal distribution, Z."
  s2_zh: "分子减去门店基准均值，将坐标中心精准平移归零；分母除以该店的标准差，将离散宽度统一压缩缩放为 1。由此诞生了统领全局的标准正态分布 Z。"
  s2_zh_hk: "分子減去門市基準均值，將坐標中心精準平移歸零；分母除以嗰間舖嘅標準差，將離散闊度統一壓縮縮放為 1。由此誕生咗統領全局嘅標準正態分佈 Z。"
- id: interpretation
  visual: two_column
  seconds: 36
  kicker: "The Interpretation"
  kicker_en: "The Interpretation"
  kicker_zh: "物理内涵"
  kicker_zh_hk: "物理內涵"
  title_en: "Counting standard deviations from the mean"
  title_zh: "度量偏离均值几个标准差"
  title_zh_hk: "度量偏離均值幾個標準差"
  left_en: "Positive Z: Performance above baseline"
  left_zh: "正 Z 分数：业绩超越常态基准，数值越大约罕见"
  left_zh_hk: "正 Z 分數：業績超越常態基準，數值越大越罕見"
  right_en: "Negative Z: Performance below baseline"
  right_zh: "负 Z 分数：落入低谷承压区间，警惕运营滑坡"
  right_zh_hk: "負 Z 分數：落入低谷承壓區間，警惕營運滑坡"
  s1_en: "A Z-score reports how many standard deviations an observation lies above or below the reference mean. Its interpretation depends on the reference period, data quality, and stability of the underlying process."
  s1_zh: "Z 分数表示观测值高于或低于参考均值多少个标准差。解释结果时，还要考虑参考期间、数据质量和底层过程是否稳定。"
  s1_zh_hk: "Z 分數表示觀測值高過或者低過參考均值幾多個標準差。解釋結果嗰陣，仲要考慮參考期間、數據質量同底層過程係咪穩定。"
  s2_en: "A Z-score of plus 2.00 means the observation is two standard deviations above the reference mean. Under a Normal model, its upper-tail probability is about 2.28%, but an empirical historical rank requires the actual data."
  s2_zh: "Z=+2.00 表示观测值高于参考均值两个标准差。在正态模型下，其上尾概率约为 2.28%；实际历史排名仍需使用真实数据。"
  s2_zh_hk: "Z=+2.00 表示觀測值高過參考均值兩個標準差。喺正態模型之下，佢嘅上尾概率大約係 2.28%；實際歷史排名仍然要用真實數據。"
  s3_en: "Z-scores remove location and scale units, which supports comparison of relative position. They do not by themselves adjust for different time periods, data definitions, seasonality, dependence, or business context."
  s3_zh: "Z 分数消除了位置与尺度单位，可用于比较相对位置；但它本身不会调整不同期间、数据定义、季节性、相关性或业务环境。"
  s3_zh_hk: "Z 分數消除咗位置同尺度單位，可以用嚟比較相對位置；但佢本身唔會調整唔同期間、數據定義、季節性、相關性或者業務環境。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Comparing Mong Kok and Airport demand signals"
  title_zh: "旺角店与机场店冷萃需求信号比较"
  title_zh_hk: "旺角舖與機場舖冷萃需求訊號比較"
  step1_en: "Mong Kok: X = 520, mu = 450, sigma = 35 -> Z = (520 - 450) / 35 = +2.00"
  step1_zh: "旺角店核算：销量 520，均值 450，标准差 35 -> Z = (520 - 450) / 35 = +2.00"
  step1_zh_hk: "旺角舖核算：銷量 520，均值 450，標準差 35 -> Z = (520 - 450) / 35 = +2.00"
  step2_en: "Airport: X = 710, mu = 600, sigma = 50 -> Z = (710 - 600) / 50 = +2.20"
  step2_zh: "机场店核算：销量 710，均值 600，标准差 50 -> Z = (710 - 600) / 50 = +2.20"
  step2_zh_hk: "機場舖核算：銷量 710，均值 600，標準差 50 -> Z = (710 - 600) / 50 = +2.20"
  step3_en: "Verdict: Z_Airport (+2.20) > Z_MK (+2.00) -> Airport surge was rarer!"
  step3_zh: "裁决评定：机场店 Z 分数 (+2.20) 高于旺角店 (+2.00) -> 机场店突破更为罕见！"
  step3_zh_hk: "裁決評定：機場舖 Z 分數 (+2.20) 高過旺角舖 (+2.00) -> 機場舖突破更為罕見！"
  s1_en: "Audit the cold brew ledger. Mong Kok sells 520 cups against a baseline mean of 450 and standard deviation of 35. Five hundred and twenty minus four hundred and fifty is seventy cups over baseline. Dividing by thirty-five gives a Z-score of exactly plus two point zero zero."
  s1_zh: "核查冷萃咖啡出餐流水。旺角店售出 520 杯，其常态基准均值为 450 杯、标准差为 35 杯。净超出均值七十杯，除以三十五得出旺角店的 Z 分数恰好为正 2.00。"
  s1_zh_hk: "核查冷萃咖啡出餐流水。旺角舖賣出 520 杯，其常態基準均值為 450 杯、標準差為 35 杯。淨超出均值七十杯，除以三十五得出旺角舖嘅 Z 分數啱啱好為正 2.00。"
  s2_en: "Airport sells 710 cups against its baseline mean of 600 and standard deviation of 50. Seven-ten minus six hundred is one hundred and ten cups above baseline. Dividing by fifty gives a Z-score of plus two point two zero."
  s2_zh: "再看机场店：单日卖出 710 杯，常态基准均值为 600 杯、标准差为 50 杯。净超出基准一百一十杯，除以五十计算出机场店的 Z 分数高达正 2.20。"
  s2_zh_hk: "再睇機場舖：單日賣出 710 杯，常態基準均值為 600 杯、標準差為 50 杯。淨超出基準一百一十杯，除以五十計算出機場舖嘅 Z 分數高達正 2.20。"
  s3_en: "Raw totals differ by 190 cups. Relative to the stated baselines, Airport has Z=2.20 and Mong Kok has Z=2.00, so the Airport observation is farther above its own mean. This comparison describes demand extremeness, not employee contribution or entitlement to a reward."
  s3_zh: "原始总量相差 190 杯。相对于给定基准，机场店 Z=2.20，旺角店 Z=2.00，因此机场店的观测值偏离自身均值更远。该比较描述需求信号的极端程度，并不衡量员工贡献或奖励资格。"
  s3_zh_hk: "原始總量相差 190 杯。相對於指定基準，機場舖 Z=2.20，旺角舖 Z=2.00，所以機場舖嘅觀測值偏離自身均值更遠。呢個比較描述需求訊號嘅極端程度，唔係衡量員工貢獻或者獎勵資格。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Compare relative positions with validated baselines"
  title_zh: "使用经过验证的基准比较相对位置"
  title_zh_hk: "使用經過驗證嘅基準比較相對位置"
  q1_en: "What does a Z-score contribute when comparing demand observations across locations?"
  q1_zh: "比较不同地点的需求观测值时，Z 分数提供了什么信息？"
  q1_zh_hk: "比較唔同地點嘅需求觀測值嗰陣，Z 分數提供咗咩資料？"
  q2_en: "What common threshold defines an operational anomaly or outlier?"
  q2_zh: "在日常业务监控中，通常以多大的 Z 分数阈值来界定突发异常值？"
  q2_zh_hk: "喺日常業務監控入面，通常以幾大嘅 Z 分數閾值嚟界定突發異常值？"
  s1_en: "Use Z-scores to compare observations relative to their stated baselines, not to evaluate individual managers. Confirm that the metrics, reference periods, and data-generating processes are comparable before interpreting the difference."
  s1_zh: "可用 Z 分数比较观测值相对于各自基准的位置，但不要用它评价个别经理。解释差异前，应确认指标、参考期间和数据生成过程具有可比性。"
  s1_zh_hk: "可以用 Z 分數比較觀測值相對於各自基準嘅位置，但唔好用佢評價個別經理。解釋差異之前，應該確認指標、參考期間同數據生成過程具有可比性。"
  s2_en: "Thresholds such as |Z|>2 or |Z|>3 are screening conventions, not universal anomaly rules. Select thresholds using the Normal-model fit, monitoring frequency, false-alarm cost, and operational consequences."
  s2_zh: "|Z|>2 或 |Z|>3 只是筛选惯例，并非普遍异常规则。阈值应结合正态模型拟合、监测频率、误报成本与运营后果来选择。"
  s2_zh_hk: "|Z|>2 或者 |Z|>3 只係篩選慣例，唔係普遍異常規則。門檻應該結合正態模型擬合、監測頻率、誤報成本同營運後果嚟選擇。"
  s3_en: "For the stated demand baselines, Mong Kok has Z=2.00 and Airport has Z=2.20. The Airport observation is farther above its own mean, but the conclusion depends on valid, comparable baselines and does not establish causation or individual performance."
  s3_zh: "在给定需求基准下，旺角店 Z=2.00，机场店 Z=2.20。机场店的观测值高于自身均值的程度更大，但结论依赖有效且可比的基准，也不能证明因果关系或个人绩效。"
  s3_zh_hk: "喺指定需求基準之下，旺角舖 Z=2.00，機場舖 Z=2.20。機場舖嘅觀測值高過自身均值嘅程度更大，但結論依賴有效兼可比嘅基準，亦唔可以證明因果關係或者個人績效。"