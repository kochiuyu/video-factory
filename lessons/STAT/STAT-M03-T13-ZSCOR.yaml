- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "Standardization and the Z-score"
  title_zh: "标准化转换与标准正态分布"
  title_zh_hk: "標準化轉換與標準正態分佈"
  formula: "Z = (X - mu) / sigma; Z ~ N(0, 1)"
  formula_zh: "Z = (X - mu) / sigma；标准化后的新变量 Z 服从标准正态 N(0, 1)"
  formula_zh_hk: "Z = (X - mu) / sigma；標準化後嘅新變量 Z 服從標準正態 N(0, 1)"
  formula_tex: "Z = \\frac{X - \\mu}{\\sigma}, \\quad Z \\sim N(0, 1)"
  s1_en: "For any variable with finite mean mu and positive standard deviation sigma, standardization produces the dimensionless Z-score. If X is Normal, the transformed variable follows the Standard Normal distribution N(0,1)."
  s1_zh: "Z 分数把观测值换成“离均值多少个标准差”：Z=(x−μ)/σ。"
  s1_zh_hk: "Z 分數將觀測值換成「離均值幾多個標準差」：Z=(x−μ)/σ。"
  s2_en: "Subtracting the store mean shifts the center to exactly zero. Dividing by the store standard deviation rescales spread to exactly one, producing the Standard Normal distribution, Z."
  s2_zh: "分子减去门店基准均值，将坐标中心精准平移归零；分母除以该店的标准差，将离散宽度统一压缩缩放为 1。由此诞生了统领全局的标准正态分布 Z。"
  s2_zh_hk: "分子減去門市基準均值，將坐標中心精準平移歸零；分母除以嗰間舖嘅標準差，將離散闊度統一壓縮縮放為 1。由此誕生咗統領全局嘅標準正態分佈 Z。"
- id: interpretation
  visual: two_column
  seconds: 36
  kicker: "The Interpretation"
  kicker_en: "The Interpretation"
  kicker_zh: "物理内涵"
  kicker_zh_hk: "物理內涵"
  title_en: "Counting standard deviations from the mean"
  title_zh: "度量偏离均值几个标准差"
  title_zh_hk: "度量偏離均值幾個標準差"
  left_en: "Positive Z: Performance above baseline"
  left_zh: "正 Z 分数：业绩超越常态基准，数值越大约罕见"
  left_zh_hk: "正 Z 分數：業績超越常態基準，數值越大越罕見"
  right_en: "Negative Z: Performance below baseline"
  right_zh: "负 Z 分数：落入低谷承压区间，警惕运营滑坡"
  right_zh_hk: "負 Z 分數：落入低谷承壓區間，警惕營運滑坡"
  s1_en: "A Z-score reports how many standard deviations an observation lies above or below the reference mean. Its interpretation depends on the reference period, data quality, and stability of the underlying process."
  s1_zh: "Z 分数表示观测值高于或低于参考均值多少个标准差。解释结果时，还要考虑参考期间、数据质量和底层过程是否稳定。"
  s1_zh_hk: "Z 分數表示觀測值高過或者低過參考均值幾多個標準差。解釋結果嗰陣，仲要考慮參考期間、數據質量同底層過程係咪穩定。"
  s2_en: "A Z-score of plus 2.00 means the observation is two standard deviations above the reference mean. Under a Normal model, its upper-tail probability is about 2.28%, but an empirical historical rank requires the actual data."
  s2_zh: "Z=+2.00 表示观测值高于参考均值两个标准差。在正态模型下，其上尾概率约为 2.28%；实际历史排名仍需使用真实数据。"
  s2_zh_hk: "Z=+2.00 表示觀測值高過參考均值兩個標準差。喺正態模型之下，佢嘅上尾概率大約係 2.28%；實際歷史排名仍然要用真實數據。"
  s3_en: "Z-scores remove location and scale units, which supports comparison of relative position. They do not by themselves adjust for different time periods, data definitions, seasonality, dependence, or business context."
  s3_zh: "Z 分数消除了位置与尺度单位，可用于比较相对位置；但它本身不会调整不同期间、数据定义、季节性、相关性或业务环境。"
  s3_zh_hk: "Z 分數消除咗位置同尺度單位，可以用嚟比較相對位置；但佢本身唔會調整唔同期間、數據定義、季節性、相關性或者業務環境。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目实算"
  kicker_zh_hk: "賬目實算"
  title_en: "Comparing Shop B and Shop C demand signals"
  title_zh: "B店与C店冷萃需求信号比较"
  title_zh_hk: "B舖與C舖冷萃需求訊號比較"
  step1_en: "Shop B: X = 520, mu = 450, sigma = 35 -> Z = (520 - 450) / 35 = +2.00"
  step1_zh: "B店核算：销量 520，均值 450，标准差 35 -> Z = (520 - 450) / 35 = +2.00"
  step1_zh_hk: "B舖核算：銷量 520，均值 450，標準差 35 -> Z = (520 - 450) / 35 = +2.00"
  step2_en: "Shop C: X = 710, mu = 600, sigma = 50 -> Z = (710 - 600) / 50 = +2.20"
  step2_zh: "C店核算：销量 710，均值 600，标准差 50 -> Z = (710 - 600) / 50 = +2.20"
  step2_zh_hk: "C舖核算：銷量 710，均值 600，標準差 50 -> Z = (710 - 600) / 50 = +2.20"
  step3_en: "Verdict: Z_C (+2.20) > Z_B (+2.00) -> Shop C surge was rarer!"
  step3_zh: "裁决评定：C店 Z 分数 (+2.20) 高于B店 (+2.00) -> C店突破更为罕见！"
  step3_zh_hk: "裁決評定：C舖 Z 分數 (+2.20) 高過B舖 (+2.00) -> C舖突破更為罕見！"
  s1_en: "Audit the cold brew ledger. Shop B sells 520 cups against a baseline mean of 450 and standard deviation of 35. Five hundred and twenty minus four hundred and fifty is seventy cups over baseline. Dividing by thirty-five gives a Z-score of exactly plus two point zero zero."
  s1_zh: "核查冷萃咖啡出餐流水。B店售出 520 杯，其常态基准均值为 450 杯、标准差为 35 杯。净超出均值七十杯，除以三十五得出B店的 Z 分数恰好为正 2.00。"
  s1_zh_hk: "核查冷萃咖啡出餐流水。B舖賣出 520 杯，其常態基準均值為 450 杯、標準差為 35 杯。淨超出均值七十杯，除以三十五得出B舖嘅 Z 分數啱啱好為正 2.00。"
  s2_en: "Shop C sells 710 cups against its baseline mean of 600 and standard deviation of 50. Seven-ten minus six hundred is one hundred and ten cups above baseline. Dividing by fifty gives a Z-score of plus two point two zero."
  s2_zh: "再看C店：单日卖出 710 杯，常态基准均值为 600 杯、标准差为 50 杯。净超出基准一百一十杯，除以五十计算出C店的 Z 分数高达正 2.20。"
  s2_zh_hk: "再睇C舖：單日賣出 710 杯，常態基準均值為 600 杯、標準差為 50 杯。淨超出基準一百一十杯，除以五十計算出C舖嘅 Z 分數高達正 2.20。"
  s3_en: "Raw totals differ by 190 cups. Relative to the stated baselines, Shop C has Z=2.20 and Shop B has Z=2.00, so the Shop C observation is farther above its own mean. This comparison describes demand extremeness, not employee contribution or entitlement to a reward."
  s3_zh: "原始总量相差 190 杯。相对于给定基准，C店 Z=2.20，B店 Z=2.00，因此C店的观测值偏离自身均值更远。该比较描述需求信号的极端程度，并不衡量员工贡献或奖励资格。"
  s3_zh_hk: "原始總量相差 190 杯。相對於指定基準，C舖 Z=2.20，B舖 Z=2.00，所以C舖嘅觀測值偏離自身均值更遠。呢個比較描述需求訊號嘅極端程度，唔係衡量員工貢獻或者獎勵資格。"
- id: takeaway
  visual: takeaway
  seconds: 30
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Compare relative positions with validated baselines"
  title_zh: "使用经过验证的基准比较相对位置"
  title_zh_hk: "使用經過驗證嘅基準比較相對位置"
  q1_en: "Z-score across sites? → Compare vs each baseline — not people"
  q1_zh: "跨店 Z 分数？→ 相对各自基准比——不拿来评人"
  q1_zh_hk: "跨舖 Z 分數？→ 相對各自基準比——唔好攞嚟評人"
  q2_en: "|Z|>2 or 3? → Screening conventions, not universal laws"
  q2_zh: "|Z|>2 或 3？→ 筛查惯例，不是万能法则"
  q2_zh_hk: "|Z|>2 或者 3？→ 篩查慣例，唔係萬能法則"
  s1_en: "Align metrics, windows, and data-generating process before you interpret a gap."
  s1_zh: "解释差距前，先对齐指标、时间窗和数据生成过程。"
  s1_zh_hk: "解釋差距之前，先對齊指標、時間窗同數據生成過程。"
  s2_en: "Choose thresholds from model fit, monitoring rate, and false-alarm cost — not from habit alone."
  s2_zh: "阈值要看拟合、监测频率和误报成本——别只凭习惯。"
  s2_zh_hk: "門檻要睇擬合、監測頻率同誤報成本——唔好淨憑習慣。"
  s3_en: "Shop B Z=2.00, Shop C Z=2.20 — Shop C sits farther above its own mean, given comparable setups."
  s3_zh: "B 店 Z=2.00，C店 Z=2.20——在设定可比时，C店相对自身均值更靠上。"
  s3_zh_hk: "B 舖 Z=2.00，C舖 Z=2.20——喺設定可比嗰陣，C舖相對自身均值更靠上。"
