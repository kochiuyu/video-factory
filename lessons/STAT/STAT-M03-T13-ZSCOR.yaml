  en: "Ops compares two cold-brew days: 710 cups at Shop C and 520 at Shop B. Raw totals differ because baselines and spreads differ. How does standardization put each reading back on its own scale before you compare statistical extremity?"
  zh: "运营比较两个冷萃日：C店 710 杯，B 店 520 杯。基准和波动不同，原始总量不能直接比谁更“离谱”。标准化怎么先把每个观测放回自己的分布，再比统计极端程度？"
