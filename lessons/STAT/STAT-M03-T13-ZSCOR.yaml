title_en: "The universal operational yardstick"
title_zh: "通用的运营度量衡：标准化与 Z 分数"
title_zh_hk: "通用嘅營運度量衡：標準化與 Z 分數"
youtube:
  description_en: |
    The universal operational yardstick
    
    Ops compares two cold-brew days: 710 cups at Shop C and 520 at Shop B. Raw totals differ because baselines and spreads differ. How does standardization put each reading back on its own scale before you compare statistical extremity?
    
    Shop B: 520 against mean 450 and sd 35 gives Z=+2.00. Shop C: 710 against mean 600 and sd 50 gives Z=+2.20. Raw totals differ by 190 cups, yet Shop C sits farther above its own mean.
    
    Compare relative positions with validated baselines — aligned metrics, windows, and data-generating process — not raw cup counts alone.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 13 (ZSCOR)
    If this helped, subscribe for the next short.
  description_zh: |
    通用的运营度量衡：标准化与 Z 分数
    
    运营比较两个冷萃日：C店 710 杯，B店 520 杯。基准和波动不同，原始总量不能直接比谁更「离谱」。
    
    B店：520 相对均值 450、标准差 35，Z=+2.00。C店：710 相对均值 600、标准差 50，Z=+2.20。原始总量相差 190 杯，但 C店相对自身均值更远。
    
    使用经过验证的基准比较相对位置——对齐指标、窗口与生成过程——别只盯杯数差额。
    
    离散与连续概率分布 - 模块3 - 短片13（ZSCOR）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    通用嘅營運度量衡：標準化與 Z 分數
    
    營運比較兩個冷萃日：C舖 710 杯，B舖 520 杯。基準同波動唔同，原始總量唔可以直接比邊個更「離譜」。
    
    B舖：520 相對均值 450、標準差 35，Z=+2.00。C舖：710 相對均值 600、標準差 50，Z=+2.20。原始總量相差 190 杯，但 C舖相對自身均值更遠。
    
    使用經過驗證嘅基準比較相對位置——對齊指標、窗口同生成過程——唔好淨係睇杯數差額。
    
    離散與連續概率分佈 - 模組3 - 短片13（ZSCOR）
    覺得有用嘅話，訂閱下一集。
