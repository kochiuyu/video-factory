  kicker: "The Evaluation Dispute"
  kicker_en: "The Evaluation Dispute"
  kicker_zh: "跨店考核之争"
  kicker_zh_hk: "跨舖考核之爭"
  title_en: "Who had the more impressive sales surge?"
