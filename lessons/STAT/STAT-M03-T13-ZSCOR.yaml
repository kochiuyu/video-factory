id: STAT-M03-T13-ZSCOR
course: statistics
course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
audience: "first-year business students"
audience_en: "first-year business students"
audience_zh: "商学院一年级学生"
audience_zh_hk: "商學院一年級學生"
duration_target_s: 168
title_en: "The universal operational yardstick"
title_zh: "通用的运营度量衡：标准化与 Z 分数"
title_zh_hk: "通用嘅營運度量衡：標準化與 Z 分數"
objective_en: "Define the standard normal distribution Z ~ N(0, 1), apply the standardization formula Z = (X - mu) / sigma to convert arbitrary normal distributions onto a universal scale, and benchmark sales surges across disparate retail branches."
objective_zh: "定义标准正态分布 Z ~ N(0, 1)，运用标准化转换公式 Z = (X - mu) / sigma 将任意正态分布统一映射至全局通用标尺，并对不同体量与波动背景的连锁分店进行业绩爆单公平对标。"
objective_zh_hk: "定義標準正態分佈 Z ~ N(0, 1)，運用標準化轉換公式 Z = (X - mu) / sigma 將任意正態分佈統一映射至全局通用標尺，並對唔同體量與波動背景嘅連鎖分店進行業績爆單公平對標。"
