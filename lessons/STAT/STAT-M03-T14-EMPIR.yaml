  en: "A Wan Chai store models daily oat-milk demand as Normal with mean 100 cartons and standard deviation 10 cartons. If it begins the period with exactly 100 cartons and there is no replenishment, the model places half of demand above that level. How can the Empirical Rule translate a target one-tailed service probability into a demand buffer?"
  zh: "湾仔店把每日燕麦奶需求建模为均值 100 箱、标准差 10 箱的正态分布。如果期初库存恰为 100 箱且期间不补货，模型把一半需求放在该水平之上。经验法则如何把目标单尾服务概率转换为需求缓冲？"
  zh_hk: "灣仔舖將每日燕麥奶需求建模成均值 100 箱、標準差 10 箱嘅正態分佈。如果期初庫存啱啱好係 100 箱而期間冇補貨，模型將一半需求放喺呢個水平之上。經驗法則點樣將目標單尾服務概率轉換成需求緩衝？"
- id: define
  visual: definition_card
  seconds: 34
  kicker: "What It Is"
  kicker_en: "What It Is"
  kicker_zh: "核心概念"
  kicker_zh_hk: "核心概念"
  title_en: "The 68-95-99.7 Empirical Rule"
  title_zh: "正态分布 68-95-99.7 经验法则"
  title_zh_hk: "正態分佈 68-95-99.7 經驗法則"
  formula: "mu +/- 1*sigma = 68.27%; mu +/- 2*sigma = 95.45%; mu +/- 3*sigma = 99.73%"
  formula_zh: "一倍标准差区间覆盖 68.3%；两倍覆盖 95.5%；三倍覆盖 99.7%"
  formula_zh_hk: "一倍標準差區間覆蓋 68.3%；兩倍覆蓋 95.5%；三倍覆蓋 99.7%"
  formula_tex: "P(|X - \\mu| \\le k\\sigma) \\approx \\{0.683, 0.955, 0.997\\} \\quad \\text{for } k \\in \\{1, 2, 3\\}"
  s1_en: "For a Normal distribution, the Empirical Rule summarizes approximate central coverage within one, two, and three standard deviations of the mean."
  s1_zh: "对于正态分布，经验法则概括均值上下一个、两个和三个标准差内的近似中心覆盖率。"
  s1_zh_hk: "對正態分佈嚟講，經驗法則概括均值上下一個、兩個同三個標準差之內嘅近似中心覆蓋率。"
  s2_en: "Approximately sixty-eight percent of all observations fall within plus or minus one standard deviation of the mean. Roughly ninety-five percent fall within two standard deviations. And ninety-nine point seven percent land within three."
  s2_zh: "大约 68% 的全部业务结果紧密落在均值加减一个标准差的区间内；约 95% 落在加减两个标准差之内；而高达 99.7% 的大盘全貌被牢牢锁定在正负三个标准差之间。"
  s2_zh_hk: "大約 68% 嘅全部業務結果緊密落喺均值加減一個標準差嘅區間內；約 95% 落喺加減兩個標準差之內；而高達 99.7% 嘅大盤全貌被牢牢鎖定喺正負三個標準差之間。"
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: "The Inventory Geometry"
  kicker_en: "The Inventory Geometry"
  kicker_zh: "库存几何学"
  kicker_zh_hk: "庫存幾何學"
  title_en: "Converting two-tailed intervals into one-tailed buffers"
  title_zh: "双尾区间到单尾安全库存的惊险一跃"
  title_zh_hk: "雙尾區間到單尾安全庫存嘅驚險一躍"
  left_en: "Two-Tailed Zone: Excludes 5% (2.5% left, 2.5% right)"
  left_zh: "对称双尾区间：排除 5% 极端（极低 2.5%，极高 2.5%）"
  left_zh_hk: "對稱雙尾區間：排除 5% 極端（極低 2.5%，極高 2.5%）"
  right_en: "One-Tailed SLA: Stock = mu + k*sigma protects 97.5%"
  right_zh: "单尾履约库存：备货 mu + k*sigma 稳保 97.5% 不断货"
  right_zh_hk: "單尾履約庫存：備貨 mu + k*sigma 穩保 97.5% 不斷貨"
  s1_en: "The Empirical Rule gives central two-tailed coverage. For a stock threshold, the relevant model quantity is usually the upper-tail probability that demand exceeds available inventory."
  s1_zh: "经验法则给出中心双尾覆盖率。对于库存阈值，通常关注的是需求超过可用库存的上尾概率。"
  s1_zh_hk: "經驗法則畀出中心雙尾覆蓋率。對庫存門檻嚟講，通常關注嘅係需求超過可用庫存嘅上尾概率。"
  s2_en: "Using the rounded Empirical Rule, about 95% lies within two standard deviations, leaving about 5% split equally between the two tails. The upper tail is therefore about 2.5%; the exact Normal value above z=2 is about 2.28%."
  s2_zh: "按四舍五入的经验法则，约 95% 位于两个标准差内，剩余约 5% 对称分到两端，因此上尾约为 2.5%；正态分布在 z=2 以上的精确概率约为 2.28%。"
  s2_zh_hk: "按四捨五入嘅經驗法則，大約 95% 位於兩個標準差之內，剩低大約 5% 對稱分到兩端，所以右尾大約係 2.5%；正態分佈喺 z=2 以上嘅精確概率大約係 2.28%。"
  s3_en: "Under the rounded Empirical Rule, a threshold at mu plus two sigma covers about 97.5% of modeled demand. Using the exact Normal CDF, the coverage is about 97.72%."
  s3_zh: "按四舍五入的经验法则，阈值设在 mu 加两个 sigma 可覆盖约 97.5% 的模型需求；按精确正态 CDF，覆盖率约为 97.72%。"
  s3_zh_hk: "按四捨五入嘅經驗法則，門檻設喺 mu 加兩個 sigma 可以覆蓋大約 97.5% 嘅模型需求；按精確正態 CDF，覆蓋率大約係 97.72%。"
- id: ledger
  visual: steps
  seconds: 36
  kicker: "The Ledger"
  kicker_en: "The Ledger"
  kicker_zh: "账目精算"
  kicker_zh_hk: "賬目精算"
  title_en: "Sizing Wan Chai oat milk safety stock"
  title_zh: "湾仔店燕麦奶安全库存精算法则"
  title_zh_hk: "灣仔舖燕麥奶安全庫存精算法則"
  step1_en: "Baseline metrics: Demand X ~ N(mu = 100 cartons, sigma = 10 cartons)"
  step1_zh: "消耗基准：日消耗 X 服从正态 N(均值 100 箱，标准差 10 箱)"
  step1_zh_hk: "消耗基準：日消耗 X 服從正態 N(均值 100 箱，標準差 10 箱)"
  step2_en: "Approximate coverage = 97.5% -> Buffer = +2*sigma = 2 * 10 = 20 cartons"
  step2_zh: "近似覆盖率 97.5% -> 安全缓冲 = 2 倍标准差 = 2 × 10 = 20 箱"
  step2_zh_hk: "近似覆蓋率 97.5% -> 安全緩衝 = 2 倍標準差 = 2 × 10 = 20 箱"
  step3_en: "Approximate coverage = 99.85% -> Buffer = +3*sigma = 3 * 10 = 30 cartons"
  step3_zh: "近似覆盖率 99.85% -> 安全缓冲 = 3 倍标准差 = 3 × 10 = 30 箱"
  step3_zh_hk: "近似覆蓋率 99.85% -> 安全緩衝 = 3 倍標準差 = 3 × 10 = 30 箱"
  s1_en: "For this Wan Chai illustration, assume single-period oat-milk demand is Normal with mean 100 cartons and standard deviation 10 cartons."
  s1_zh: "在这个湾仔店示例中，假设单期燕麦奶需求服从均值 100 箱、标准差 10 箱的正态分布。"
  s1_zh_hk: "喺呢個灣仔舖示例入面，假設單期燕麥奶需求服從均值 100 箱、標準差 10 箱嘅正態分佈。"
  s2_en: "With 100 cartons, the model gives P(X>100)=0.50. Using the rounded two-sigma rule gives a threshold of 120 cartons and about 97.5% coverage; the exact Normal coverage is about 97.72%."
  s2_zh: "库存为 100 箱时，模型给出 P(X>100)=0.50。按四舍五入的两倍标准差规则，阈值为 120 箱，覆盖率约 97.5%；精确正态覆盖率约为 97.72%。"
  s2_zh_hk: "庫存係 100 箱嗰陣，模型畀出 P(X>100)=0.50。按四捨五入嘅兩倍標準差規則，門檻係 120 箱，覆蓋率大約 97.5%；精確正態覆蓋率大約係 97.72%。"
  s3_en: "A threshold of 130 cartons is three standard deviations above the mean. The rounded Empirical Rule implies about 99.85% one-sided coverage; the exact Normal coverage is about 99.865%."
  s3_zh: "阈值 130 箱位于均值以上三个标准差。经验法则给出约 99.85% 的单侧覆盖率；精确正态覆盖率约为 99.865%。"
  s3_zh_hk: "門檻 130 箱位於均值以上三個標準差。經驗法則畀出大約 99.85% 嘅單側覆蓋率；精確正態覆蓋率大約係 99.865%。"
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: "Decision Rule"
  kicker_en: "Decision Rule"
  kicker_zh: "商业法则"
  kicker_zh_hk: "商業法則"
  title_en: "Base stock on the mean; size buffers on the standard deviation"
  title_zh: "均值敲定常规底盘，标准差核定安全缓冲"
  title_zh_hk: "均值敲定常規底盤，標準差核定安全緩衝"
  q1_en: "What exceedance probability does the model assign when stock equals mean demand?"
  q1_zh: "当库存等于平均需求时，模型给出的需求超库存概率是多少？"
  q1_zh_hk: "當庫存等於平均需求嗰陣，模型畀出嘅需求超庫存概率係幾多？"
  q2_en: "What additional information is needed to price a higher coverage target?"
  q2_zh: "计算更高覆盖目标的成本还需要哪些信息？"
  q2_zh_hk: "計算更高覆蓋目標嘅成本仲需要邊啲資料？"
  s1_en: "In the stated single-period Normal model, stocking at the mean leaves a 50% probability that demand exceeds stock. A buffer of k sigma changes modeled coverage, but a complete inventory policy must also reflect lead time, replenishment, leftover stock, and cost."
  s1_zh: "在所述单期正态模型中，按均值备货会留下 50% 的需求超库存概率。k 倍 sigma 缓冲会改变模型覆盖率，但完整库存政策还应考虑提前期、补货、剩余库存与成本。"
  s1_zh_hk: "喺所述單期正態模型入面，按均值備貨會留低 50% 嘅需求超庫存概率。k 倍 sigma 緩衝會改變模型覆蓋率，但完整庫存政策仲要考慮提前期、補貨、剩餘庫存同成本。"
  s2_en: "Higher modeled coverage requires a larger buffer, but its monetary cost is not determined by the Normal curve alone. Compare holding, spoilage, shortage, and replenishment costs before selecting the target."
  s2_zh: "更高的模型覆盖率需要更大的缓冲，但货币成本不能仅由正态曲线决定。选择目标前，应比较持有、损耗、缺货与补货成本。"
  s2_zh_hk: "更高嘅模型覆蓋率需要更大緩衝，但貨幣成本唔可以淨係由正態曲線決定。選擇目標之前，應該比較持有、損耗、缺貨同補貨成本。"
  s3_en: "For the N(100,10 squared) illustration, thresholds of 120 and 130 cartons correspond to z=2 and z=3. Their approximate one-sided coverages are 97.5% and 99.85%, subject to Normal-model and single-period inventory assumptions."
  s3_zh: "对于 N(100,10 平方) 示例，120 箱和 130 箱分别对应 z=2 与 z=3，近似单侧覆盖率为 97.5% 与 99.85%。这些结果依赖正态模型与单期库存假设。"
  s3_zh_hk: "對 N(100,10 平方) 示例嚟講，120 箱同 130 箱分別對應 z=2 同 z=3，近似單側覆蓋率係 97.5% 同 99.85%。呢啲結果依賴正態模型同單期庫存假設。"