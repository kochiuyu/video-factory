course_en: "Discrete & Continuous Probability Distributions"
course_zh: "离散与连续概率分布"
course_zh_hk: "離散與連續概率分佈"
duration_target_s: 166
title_en: "Sizing the safety stock"
title_zh: "测算安全库存：经验法则与缓冲系数"
title_zh_hk: "測算安全庫存：經驗法則與緩衝系數"
youtube:
  description_en: |
    Sizing the safety stock
    
    Shop A models oat-milk demand as Normal with mean 100 cartons and sd 10. Starting with exactly 100 and no replenishment, the model puts half of demand above that stock. How does the empirical rule turn a one-sided service target into a demand buffer?
    
    About 68% / 95% / 99.7% sit within 1 / 2 / 3 standard deviations (two-tailed). A threshold at μ+2σ = 120 cartons covers about 97.5% one-sided; μ+3σ = 130 covers about 99.85% (approximate Empirical Rule).
    
    Base stock on the mean; size buffers on the standard deviation — then weigh holding, spoilage, shortage, and replenishment costs the curve does not price.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 14 (EMPIR)
    If this helped, subscribe for the next short.
  description_zh: |
    测算安全库存：经验法则与缓冲系数
    
    A店把燕麦奶日需求建成均值 100 箱、标准差 10 箱的正态。期初正好 100 箱且期间不补货，模型把一半需求放在库存之上。
    
    约 68% / 95% / 99.7% 落在 1 / 2 / 3 倍标准差内（双尾）。阈值 μ+2σ=120 箱约覆盖单侧 97.5%；μ+3σ=130 箱约 99.85%（经验法则近似）。
    
    均值敲定常规底盘，标准差核定安全缓冲——再权衡持有、损耗、缺货与补货成本，曲线本身不定价。
    
    离散与连续概率分布 - 模块3 - 短片14（EMPIR）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    測算安全庫存：經驗法則與緩衝系數
    
    A舖將燕麥奶日需求建成均值 100 箱、標準差 10 箱嘅正態。期初啱啱好 100 箱而期間冇補貨，模型將一半需求放喺庫存之上。
    
    約 68% / 95% / 99.7% 落喺 1 / 2 / 3 倍標準差之內（雙尾）。門檻 μ+2σ=120 箱約覆蓋單側 97.5%；μ+3σ=130 箱約 99.85%（經驗法則近似）。
    
    均值敲定常規底盤，標準差核定安全緩衝——再權衡持有、損耗、缺貨同補貨成本，曲線本身唔定價。
    
    離散與連續概率分佈 - 模組3 - 短片14（EMPIR）
    覺得有用嘅話，訂閱下一集。
