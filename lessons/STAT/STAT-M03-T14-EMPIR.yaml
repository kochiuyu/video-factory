quiz:
- id: Q1
  type: multiple_choice
  question_en: "Under the 68-95-99.7 Empirical Rule, if demand follows a Normal distribution, what is the one-tailed stockout probability if inventory is stocked to exactly mu + 2*sigma?"
  question_zh: "根据 68-95-99.7 经验法则，如果市场需求服从正态分布，当门店库存备货量恰好定为 mu + 2*sigma 时，遭遇上尾缺货断供的概率是多少？"
  question_zh_hk: "根據 68-95-99.7 經驗法則，如果市場需求服從正態分佈，當門市庫存備貨量啱啱好定為 mu + 2*sigma 嗰陣，遭遇上尾缺貨斷供嘅概率係幾多？"
  options_en:
  - "A: 2.5%, because the 5% remaining outside two standard deviations is split equally between the lower and upper tails (5% / 2 = 2.5%)."
  - "B: 5.0%, because two standard deviations covers 95%."
  - "C: 32.0%, because one standard deviation covers 68%."
  - "D: 0.3%, because the upper tail is always negligible."
  options_zh:
  - "A: 2.5%，因为两个标准差以外未被覆盖的 5% 概率被对称均分到极低与极高的两端尾部（5% / 2 = 2.5%）。"
  - "B: 5.0%，因为两个标准差覆盖了中间的 95%。"
  - "C: 32.0%，因为一个标准差覆盖了 68%。"
  - "D: 0.3%，因为上尾断供在商业上完全可以忽略不计。"
  options_zh_hk:
  - "A: 2.5%，因為兩個標準差以外未被覆蓋嘅 5% 概率被對稱均分到極低同極高嘅兩端尾部（5% / 2 = 2.5%）。"
  - "B: 5.0%，因為兩個標準差覆蓋咗中間嘅 95%。"
  - "C: 32.0%，因為一個標準差覆蓋咗 68%。"
  - "D: 0.3%，因為上尾斷供喺商業上完全可以忽略不計。"
  answer: A
  explanation_en: "The Empirical Rule states that 95% lies within [mu - 2*sigma, mu + 2*sigma]. The remaining 5% is split into two symmetric 2.5% tails. Stocking at mu + 2*sigma protects all outcomes up to that point, leaving a 2.5% stockout risk."
  explanation_zh: "经验法则表明中间双尾区间覆盖 95%。剩余的 5% 均分为两个 2.5% 的对称尾部。备货到 mu + 2*sigma 意味着满足所有小于该值的需求，断供风险仅为单侧上尾的 2.5%。"
  explanation_zh_hk: "經驗法則表明中間雙尾區間覆蓋 95%。剩餘嘅 5% 均分為兩個 2.5% 嘅對稱尾部。備貨到 mu + 2*sigma 意味住滿足所有細過嗰個數值嘅需求，斷供風險淨係得單側上尾嘅 2.5%。"
- id: Q2
  type: multiple_choice
  question_en: "Wan Chai branch daily oat milk demand follows N(mu = 100 cartons, sigma = 10 cartons). Using the rounded Empirical Rule, what stock threshold corresponds to approximately 97.5% one-sided coverage?"
  question_zh: "湾仔店每日燕麦奶消耗量服从正态分布 N(mu = 100 箱, sigma = 10 箱)。按四舍五入的经验法则，哪个库存阈值对应约 97.5% 的单侧覆盖率？"
  question_zh_hk: "灣仔舖每日燕麥奶消耗量服從正態分佈 N(mu = 100 箱, sigma = 10 箱)。按四捨五入嘅經驗法則，邊個庫存門檻對應大約 97.5% 嘅單側覆蓋率？"
  options_en:
  - "A: 120 cartons (100 + 2 * 10)"
  - "B: 110 cartons (100 + 1 * 10)"
  - "C: 130 cartons (100 + 3 * 10)"
  - "D: 100 cartons (zero safety stock)"
  options_zh:
  - "A: 120 箱 (100 + 2 × 10)"
  - "B: 110 箱 (100 + 1 × 10)"
  - "C: 130 箱 (100 + 3 × 10)"
  - "D: 100 箱 (零安全缓冲)"
  options_zh_hk:
  - "A: 120 箱 (100 + 2 × 10)"
  - "B: 110 箱 (100 + 1 × 10)"
  - "C: 130 箱 (100 + 3 × 10)"
  - "D: 100 箱 (零安全緩衝)"
  answer: A
  explanation_en: "Under the rounded Empirical Rule, approximately 97.5% lies below mu + 2*sigma; the exact Normal CDF gives about 97.72%. Stock = 100 + (2 * 10) = 120 cartons."
  explanation_zh: "按四舍五入的经验法则，约 97.5% 位于 mu + 2*sigma 以下；精确正态 CDF 给出约 97.72%。备货总量 = 100 + (2 × 10) = 120 箱。"
  explanation_zh_hk: "按四捨五入嘅經驗法則，大約 97.5% 位於 mu + 2*sigma 以下；精確正態 CDF 畀出大約 97.72%。備貨總量 = 100 + (2 × 10) = 120 箱。"
