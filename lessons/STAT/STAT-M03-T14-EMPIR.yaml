title_en: "Sizing the safety stock"
title_zh: "测算安全库存：经验法则与缓冲系数"
title_zh_hk: "測算安全庫存：經驗法則與緩衝系數"
objective_en: "Apply the 68-95-99.7 Empirical Rule for normal distributions, distinguish two-tailed intervals from one-tailed inventory stockout risks, and size oat milk safety stock buffers as Base + k * sigma to achieve target service levels."
objective_zh: "应用正态分布的 68-95-99.7 经验法则，严格区分双尾区间与供应链单尾缺货风险，并运用“基准需求 + k 倍标准差”科学设定燕麦奶安全库存以达成既定服务水平。"
objective_zh_hk: "應用正態分佈嘅 68-95-99.7 經驗法則，嚴格區分雙尾區間同供應鏈單尾缺貨風險，並運用「基準需求 + k 倍標準差」科學設定燕麥奶安全庫存以達成既定服務承諾水平。"
