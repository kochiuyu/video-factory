id: STAT-M03-T15-RECAP
course: statistics
course_en: Discrete & Continuous Probability Distributions
course_zh: 离散与连续概率分布
course_zh_hk: 離散與連續概率分佈
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 164
title_en: The operational distribution dashboard
title_zh: 运营分布决策罗盘：知识体系全景与推演总括
title_zh_hk: 營運分佈決策羅盤：知識體系全景與推演總括
objective_en: Synthesize the discrete and continuous distribution taxonomy into an executive decision tree, contrast model selection criteria across operational scenarios, and bridge probability foundations to statistical inference and sampling theory.
objective_zh: 将离散与连续概率分布的知识图谱归纳为高管运营决策树，横向对比各类业务场景下的选型判据，并搭建从概率分布理论通往统计推断与抽样大数定律的核心桥梁。
objective_zh_hk: 將離散與連續概率分佈嘅知識圖譜歸納為高管營運決策樹，橫向對比各類業務場景下嘅選型判據，並搭建由概率分佈理論通往統計推斷與抽樣大數定律嘅核心橋樑。
