youtube:
  description_en: |
    The operational distribution dashboard
    
    This module used coffee-shop examples for binary outcomes, fixed-trial counts, arrivals, continuous measures, waits, and aggregate demand. When a new metric shows up, how do you pick a candidate distribution, state assumptions, and check whether the model fits?
    
    Model selection starts with the variable and the data-generating process: Bernoulli for one binary trial, Binomial for fixed independent trials, Poisson for interval counts under a stable rate; Uniform, Exponential, and Normal each carry their own continuous assumptions.
    
    Choose the model, then check the assumptions. In the worked examples p, λ, μ, and σ were handed to you; with real data those parameters are unknown — estimate them, then decide.
    
    Discrete & Continuous Probability Distributions - Module 3 - Short 15 (RECAP)
    If this helped, subscribe for the next short.
  description_zh: |
    运营分布决策罗盘：知识体系全景与推演总括
    
    这一模块用咖啡店例子走过二元结果、固定次数计数、到达计数、连续度量、等待时间和加总需求。来了新指标，你怎么认候选分布、讲清假设，再检验合不合适？
    
    模型选择从变量与数据生成过程开始：单次二元用伯努利，固定独立试验用二项，稳定速率区间计数用泊松；均匀、指数、正态各有连续假设。
    
    先选模型，再检查假设。例题里 p、λ、μ、σ 是给定的；真实数据里参数未知——先估计，再决策。
    
    离散与连续概率分布 - 模块3 - 短片15（RECAP）
    觉得有用的话，订阅下一集。
  description_zh_hk: |
    營運分佈決策羅盤：知識體系全景與推演總括
    
    呢個模組用咖啡店例子行過二元結果、固定次數計數、到達計數、連續度量、等待時間同加總需求。嚟咗新指標，你點樣認候選分佈、講清假設，再檢驗合唔合適？
    
    模型選擇由變量同數據生成過程開始：單次二元用伯努利，固定獨立試驗用二項，穩定速率區間計數用泊松；均勻、指數、正態各有連續假設。
    
    先選模型，再檢查假設。例題入面 p、λ、μ、σ 係畀定嘅；真實數據入面參數未知——先估計，再決策。
    
    離散與連續概率分佈 - 模組3 - 短片15（RECAP）
    覺得有用嘅話，訂閱下一集。
