quiz:
- id: Q1
  type: multiple_choice
  question_en: What is the key difference between a population parameter (such as mu) and a sample statistic (such as x-bar)?
  question_zh: 总体参数（比如总体均值 mu）和样本统计量（比如样本均值 x-bar）最关键的区别是什么？
  question_zh_hk: 總體參數（例如總體均值 mu）同樣本統計量（例如樣本均值 x-bar）最關鍵嘅分別係乜嘢？
  options_en:
  - 'A: The parameter is one fixed, unknown number for the whole population; the statistic is computed from a sample and changes from draw to draw.'
  - 'B: The statistic is the true value, because it comes from data we actually saw; the parameter is only a guess.'
  - 'C: They are the same number once the sample has more than 100 receipts.'
  - 'D: The parameter changes every time we draw a new sample, while the statistic stays fixed.'
  options_zh:
  - 'A: 参数是整个总体一个固定、未知的数；统计量是从样本算出来的，每抽一次都会变。'
  - 'B: 统计量才是真值，因为它来自我们真看到的数据；参数只是猜测。'
  - 'C: 只要样本超过 100 张小票，两者就是同一个数。'
  - 'D: 每抽一次新样本，参数就会变，统计量反而固定不变。'
  options_zh_hk:
  - 'A: 參數係成個總體一個固定、未知嘅數；統計量係由樣本計出嚟，每抽一次都會變。'
  - 'B: 統計量先係真值，因為佢嚟自我哋真係睇到嘅數據；參數只係估吓。'
  - 'C: 只要樣本多過 100 張單，兩樣就係同一個數。'
  - 'D: 每抽一次新樣本，參數就會變，統計量反而唔變。'
  answer: A
  explanation_en: The parameter mu is one fixed number for all receipts, which we do not see. The statistic x-bar depends on
    which receipts happened to be drawn, so a new draw gives a new value.
  explanation_zh: 参数 mu 是全部小票的一个固定数，我们看不到。统计量 x-bar 取决于这次刚好抽中哪些小票，所以换一批就换一个值。
  explanation_zh_hk: 參數 mu 係全部單據嘅一個固定數，我哋睇唔到。統計量 x-bar 要睇今次啱啱抽中邊啲單，所以換一批就換一個值。
- id: Q2
  type: multiple_choice
  question_en: A manager estimates the chain's average spend from 500 mobile-app orders only, and gets x-bar = $68.50. Why
    is this a poor estimate for all customers?
  question_zh: 经理只用 500 张手机 App 订单来估全连锁的平均客单价，得到 x-bar = $68.50。为什么这个数不适合代表所有顾客？
  question_zh_hk: 經理淨係用 500 張手機 App 訂單去估成間連鎖嘅平均客單價，得到 x-bar = $68.50。點解呢個數唔適合代表所有客人？
  options_en:
  - 'A: Selection bias: app users may spend differently from walk-in customers, so the sample leans one way.'
  - 'B: 500 orders is too few; with 5,000 app orders the estimate would be fine.'
  - 'C: It is only sampling error, so the gap will average out to zero.'
  - 'D: A sample mean is only valid when it ends in a whole dollar.'
  options_zh:
  - 'A: 选择偏差：App 用户和现场排队的顾客花钱习惯可能不同，样本会偏向一边。'
  - 'B: 500 张太少；换成 5,000 张 App 订单就没问题了。'
  - 'C: 这只是抽样误差，差距平均下来会变成零。'
  - 'D: 样本均值必须是整数元才有效。'
  options_zh_hk:
  - 'A: 選擇偏差：App 用戶同現場排隊嘅客人使錢習慣可能唔同，樣本會偏咗一邊。'
  - 'B: 500 張太少；換成 5,000 張 App 訂單就冇問題。'
  - 'C: 呢個只係抽樣誤差，差距平均落嚟會變成零。'
  - 'D: 樣本均值一定要係整數蚊先有效。'
  answer: A
  explanation_en: The sample must represent the people we care about. App-only orders leave out walk-in customers, so the
    estimate can sit away from the true mu, and more app orders repeat the same lean.
  explanation_zh: 样本要能代表我们关心的所有顾客。只看 App 订单，就漏掉了现场顾客，估计会偏离真实的 mu；再多抽 App 订单，也只是重复同一个偏。
  explanation_zh_hk: 樣本要代表到我哋關心嘅所有客人。淨係睇 App 訂單，就漏咗現場嘅客人，估計會偏離真實嘅 mu；再抽多啲 App 訂單，都只係重複同一個偏。
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: The 25,000 receipts
  kicker_en: The 25,000 receipts
  kicker_zh: 两万五千张小票
  kicker_zh_hk: 兩萬五千張單據
  title_en: What is a sample statistic?
  title_zh: 什么是样本统计量？
  title_zh_hk: 咩係樣本統計量？
  en: 'Suppose our coffee chain prints twenty-five thousand receipts a day across Shop A, Shop B, Shop C and the rest. The
    operations manager wants one number: the average spend per receipt. Get it wrong, and she orders the wrong stock and
    sets the wrong prices. Checking every receipt costs too much. So we read only some of them. Which ones? That choice
    is what a sample statistic is about.'
  zh: 假设我们这家咖啡连锁，A店、B店、C店加起来，一天打出两万五千张小票。运营经理只想要一个数：每张小票平均花多少钱。这个数一错，进货就进错，价钱也定错。一张张去查？成本太高了。所以我们只看其中一部分。那看哪一部分呢？这就是样本统计量要讲的事。
  zh_hk: 假設我哋間咖啡連鎖，A店、B店、C店加埋，一日印出兩萬五千張單。營運經理只想要一個數：每張單平均使幾多錢。呢個數一錯，入貨就入錯，價錢都定錯。逐張去查？成本太高喇。所以我哋淨係睇其中一部分。咁睇邊一部分呢？呢個就係樣本統計量要講嘅嘢。
- id: define
  visual: definition_card
  seconds: 32
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Parameter versus statistic
  title_zh: 总体参数与样本统计量
  title_zh_hk: 總體參數同樣本統計量
  formula: 'All receipts: mu · Sample: x-bar'
  formula_zh: 全部小票：mu · 样本：x-bar
  formula_zh_hk: 全部單據：mu · 樣本：x-bar
  s1_en: Think of all twenty-five thousand receipts as the whole pot of soup. Their true average is one fixed number. We call
    it mu, a population parameter. It exists, but nobody sees it, because nobody reads every receipt.
  s1_zh: 把两万五千张小票想成一整锅汤。全部小票的真实平均，是一个固定的数，我们叫它 mu，也就是总体参数。它确实存在，可是没人看得到，因为没人会把每张小票都读一遍。
  s1_zh_hk: 將兩萬五千張單想像成一大煲湯。全部單嘅真實平均，係一個固定嘅數，我哋叫佢 mu，即係總體參數。佢真係存在，但冇人睇得到，因為冇人會逐張單讀晒。
  s2_en: So we take a spoonful, say four hundred receipts, and average those. That average is x-bar, a sample statistic.
    Take another spoonful and x-bar moves a little. Mu stays put; x-bar changes with every draw.
  s2_zh: 所以我们舀一勺，比如四百张小票，算它们的平均。这个平均叫 x-bar，就是样本统计量。再舀一勺，x-bar 就会动一点。mu 不会变，x-bar 每抽一次都会变。
  s2_zh_hk: 所以我哋舀一啖，例如四百張單，計佢哋嘅平均。呢個平均叫 x-bar，就係樣本統計量。再舀一啖，x-bar 就會郁少少。mu 唔會變，x-bar 每抽一次都會變。
- id: mechanics
  visual: two_column
  seconds: 50
  kicker: Two ways to miss
  kicker_en: Two ways to miss
  kicker_zh: 两种偏差
  kicker_zh_hk: 兩種偏差
  title_en: Sampling error vs selection bias
  title_zh: 抽样误差与选择偏差
  title_zh_hk: 抽樣誤差同選擇偏差
  left_en: 'Sampling error: random'
  left_zh: 抽样误差：随机
  left_zh_hk: 抽樣誤差：隨機
  right_en: 'Selection bias: one-sided'
  right_zh: 选择偏差：一边倒
  right_zh_hk: 選擇偏差：一面倒
  s1_en: A spoonful never tastes exactly like the whole pot. So x-bar almost never equals mu. That small, random gap is sampling
    error. Sometimes x-bar is a bit high, sometimes a bit low.
  s1_zh: 一勺汤，味道永远不会跟整锅一模一样。所以 x-bar 几乎不会刚好等于 mu。这个小小的、随机的差距，就叫抽样误差。有时偏高一点，有时偏低一点。
  s1_zh_hk: 一啖湯，味道永遠唔會同成煲一模一樣。所以 x-bar 幾乎唔會啱啱等於 mu。呢個細細嘅、隨機嘅差距，就叫抽樣誤差。有時高少少，有時低少少。
  s2_en: 'Selection bias is different. It happens when the way we pick leaves some customers out, like scooping only from
    the top of the pot. Then x-bar leans the same way every time, and a bigger spoon does not help.'
  s2_zh: 选择偏差就不一样了。它出在我们挑样本的方法本身漏掉了一部分顾客，好像每次只舀最上面那层汤。这样 x-bar 每次都偏向同一边，勺子再大也没用。
  s2_zh_hk: 選擇偏差就唔同喇。佢出喺我哋揀樣本嘅方法本身漏咗一部分客人，好似每次淨係舀最面嗰層湯。咁 x-bar 每次都偏向同一邊，個殼再大都冇用。
  s3_en: 'Here is the case for our chain. Suppose Shop E, a 24-hour site, serves late-night groups who spend more per visit.
    A sample from Shop E alone will read high, and no amount of arithmetic afterwards will pull it back.'
  s3_zh: 放到我们连锁看。假设E店是一间二十四小时营业的店，深夜来的多是一群人，每次花得比较多。只从E店抽样，平均一定偏高，事后怎么算都拉不回来。
  s3_zh_hk: 放返落我哋間連鎖睇。假設E店係一間廿四小時營業嘅舖，深夜嚟嘅多數係一班人，每次使得多啲。淨係喺E店抽樣，平均一定偏高，之後點計都拉唔返。
- id: ledger
  visual: steps
  layout: rows
  seconds: 76
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: Two samples of 400 receipts
  title_zh: 两个四百张的样本
  title_zh_hk: 兩個四百張嘅樣本
  step1_en: 'Assume N = 25,000, mu = $48.20'
  step1_zh: 假设：N = 25,000，mu = $48.20
  step1_zh_hk: 假設：N = 25,000，mu = $48.20
  step2_en: 'Shop E only, 400: $64.10'
  step2_zh: 只抽E店 400 张：$64.10
  step2_zh_hk: 淨係E店 400 張：$64.10
  step3_en: 64.10 / 48.20 ≈ 1.33 (+33%)
  step3_zh: 64.10 / 48.20 ≈ 1.33 (+33%)
  step3_zh_hk: 64.10 / 48.20 ≈ 1.33 (+33%)
  step4_en: 'All shops, random 400: $48.65'
  step4_zh: 全部门店随机 400 张：$48.65
  step4_zh_hk: 全部分店隨機 400 張：$48.65
  step5_en: 48.65 − 48.20 = $0.45
  step5_zh: 48.65 − 48.20 = $0.45
  step5_zh_hk: 48.65 − 48.20 = $0.45
  s1_en: Let us make this concrete with made-up numbers. Suppose the day has twenty-five thousand receipts, and suppose we
    could peek at the true average, mu. It is forty-eight dollars and twenty cents. In real life, head office never sees
    this.
  s1_zh: 我们用一组假设的数字来算。假设这一天有两万五千张小票，再假设我们能偷看到真实平均 mu：四十八块两毛。现实里，总部是永远看不到这个数的。
  s1_zh_hk: 我哋用一組假設嘅數字嚟計。假設呢日有兩萬五千張單，再假設我哋可以偷睇到真實平均 mu：四十八蚊兩毫。現實入面，總部係永遠睇唔到呢個數嘅。
  s2_en: Now a busy checker grabs four hundred receipts, all from Shop E, because it is open late and easy to reach. Their
    average, x-bar, comes out at sixty-four dollars and ten cents.
  s2_zh: 现在有个赶时间的同事，图方便，四百张全从E店拿，因为它开得晚、好拿。这四百张的平均，x-bar，是六十四块一毛。
  s2_zh_hk: 而家有個趕時間嘅同事，貪方便，四百張全部喺E店攞，因為佢開得夜、易攞。呢四百張嘅平均，x-bar，係六十四蚊一毫。
  s3_en: How far off is that? Divide sixty-four ten by forty-eight twenty and you get about one point three three. So the
    Shop E sample reads about thirty-three percent too high.
  s3_zh: 偏了多少？六十四块一除以四十八块二，大约是一点三三。也就是说，E店这个样本高了大概百分之三十三。
  s3_zh_hk: 偏咗幾多？六十四蚊一除四十八蚊二，大約係一點三三。即係話，E店呢個樣本高咗大概百分之三十三。
  s4_en: Now draw four hundred receipts at random from every shop, so busy shops get more of the sample, the way they get
    more customers. This x-bar comes out at forty-eight dollars and sixty-five cents.
  s4_zh: 换个方法，从每间门店随机抽，客人多的店就多抽一点，一共也是四百张。这一次 x-bar 是四十八块六毛五。
  s4_zh_hk: 換個方法，喺每間分店隨機抽，客多嘅舖就抽多啲，一共都係四百張。今次 x-bar 係四十八蚊六毫五。
  s5_en: Forty-eight sixty-five minus forty-eight twenty is forty-five cents. Same sample size, four hundred both times. The
    random draw misses by a little, and that is sampling error. The Shop E draw misses by a third, and that is selection
    bias.
  s5_zh: 四十八块六毛五减四十八块二，差四毛五。两次样本都是四百张。随机抽的只差一点点，这是抽样误差；只抽E店的差了三分之一，这就是选择偏差。
  s5_zh_hk: 四十八蚊六毫五減四十八蚊二，差四毫半。兩次樣本都係四百張。隨機抽嗰個只差少少，呢個係抽樣誤差；淨係抽E店嗰個差咗三分之一，呢個就係選擇偏差。
