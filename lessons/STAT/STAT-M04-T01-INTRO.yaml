course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 226
title_en: What is a sample statistic?
title_zh: 什么是样本统计量？
title_zh_hk: 咩係樣本統計量？
objective_en: Distinguish unknown population parameters from observed sample statistics, recognize the physical and economic
  necessity of sampling across massive transaction flows, and diagnose sampling error versus selection bias in retail audits.
objective_zh: 严格区分未知的总体参数与实际观测的样本统计量，阐明海量业务流水下全量普查的物理与经济不可能三角，并在零售审计场景中精准诊断抽样随机误差与系统性选择偏差。
objective_zh_hk: 嚴格區分未知嘅總體參數同實際觀測嘅樣本統計量，闡明海量業務流水下全量普查嘅物理同經濟不可能三角，並喺零售審計場景入面精準診斷抽樣隨機誤差同系統性選擇偏差。
youtube:
  description_en: |
    What is a sample statistic?

    Suppose a coffee chain prints 25,000 receipts a day, and the operations manager needs one number: the average spend per receipt. Checking every receipt costs too much, so we read a sample. But which sample?

    The true average of all receipts is a population parameter, mu: one fixed number we never see. The average of the receipts we read is a sample statistic, x-bar: it changes with every draw.

    In an assumed example, 400 receipts from one late-night shop give $64.10, about 33% too high. 400 receipts drawn at random across all shops give $48.65, only 45 cents from the assumed true $48.20.

    Two kinds of miss: sampling error is the small, random gap every honest sample has. Selection bias is a one-sided miss that a bigger sample does not fix.

    Rule: check how the sample was picked before you do any math.
  description_zh: |
    什么是样本统计量？

    假设一家咖啡连锁每天打出两万五千张小票，运营经理只想要一个数：每张小票平均花多少钱。一张张查成本太高，所以我们只看一部分。问题是，看哪一部分？

    全部小票的真实平均是总体参数 mu：一个固定、但我们看不到的数。我们抽出来那批小票的平均是样本统计量 x-bar：每抽一次都会变。

    在一个假设的例子里，只从一间深夜店抽 400 张，得到 $64.10，高了大约 33%。在所有门店随机抽 400 张，得到 $48.65，跟假设的真值 $48.20 只差四毛五。

    两种偏差：抽样误差是每个诚实样本都有的、随机的小差距；选择偏差是一边倒的偏，样本再大也补不回来。

    规则：先看样本是怎么抽的，再去算。
  description_zh_hk: |
    咩係樣本統計量？

    假設一間咖啡連鎖每日印出兩萬五千張單據，營運經理只想要一個數：每張單平均使幾多錢。逐張查成本太高，所以我哋淨係睇一部分。問題係，睇邊一部分？

    全部單據嘅真實平均係總體參數 mu：一個固定、但我哋睇唔到嘅數。我哋抽出嚟嗰批單嘅平均係樣本統計量 x-bar：每抽一次都會變。

    喺一個假設嘅例子入面，淨係喺一間通宵舖抽 400 張，得到 $64.10，高咗大約 33%。喺所有分店隨機抽 400 張，得到 $48.65，同假設嘅真值 $48.20 只差四毫半。

    兩種偏差：抽樣誤差係每個老實樣本都有嘅、隨機嘅細差距；選擇偏差係一面倒嘅偏，樣本再大都補唔返。

    規則：先睇樣本點樣抽，再去計。
