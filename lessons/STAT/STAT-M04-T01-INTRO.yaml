  s1_en: 'So, back to the manager''s question: which receipts should we read? Not the easiest ones. Size does not cure a bad
    pick; ten thousand Shop E receipts still read high.'
  s1_zh: 回到经理的问题：该看哪些小票？不是最好拿的那些。样本大不能救坏的抽法；一万张E店小票，还是偏高。
  s1_zh_hk: 返去經理嘅問題：應該睇邊啲單？唔係最易攞嗰啲。樣本大救唔到壞嘅抽法；一萬張E店嘅單，一樣偏高。
  s2_en: A fair random draw across all shops has its own small gap, sampling error, but that gap goes both ways instead of
    leaning one way.
  s2_zh: 在所有门店公平随机地抽，也会有小差距，就是抽样误差；但这个差距有高有低，不会一边倒。
  s2_zh_hk: 喺所有分店公平隨機噉抽，都會有細差距，即係抽樣誤差；但呢個差距有高有低，唔會一面倒。
  s3_en: The rule is simple. Before you compute x-bar, check how the receipts were picked. A fair pick makes x-bar a useful
    stand-in for mu. A one-sided pick does not, however big it is.
  s3_zh: 规则很简单：算 x-bar 之前，先看小票是怎么抽的。抽法公平，x-bar 才能拿来代替 mu；抽法一边倒，样本再大也不行。
  s3_zh_hk: 規則好簡單：計 x-bar 之前，先睇啲單係點樣抽。抽法公平，x-bar 先可以攞嚟代替 mu；抽法一面倒，樣本再大都唔得。
