quiz:
- id: Q1
  type: multiple_choice
  question_en: Why does dividing sum of squared deviations by n instead of n-1 create a biased estimator that systematically
    underestimates population variance sigma^2?
  question_zh: 为什么在计算样本方差时，若将离差平方和除以样本量 n 而非 n-1，会构成系统性低估总体真实方差 sigma^2 的有偏估计量？
  question_zh_hk: 點解喺計算樣本方差嗰陣，若果將偏差平方和除以樣本量 n 而唔係 n-1，會構成系統性低估總體真實方差 sigma^2 嘅有偏估計量？
  options_en:
  - 'A: Because sample data points are naturally closer to their own sample mean x-bar than to the true, unknown population
    mean mu, shrinking the squared deviations.'
  - 'B: Because corporate accounting rules mandate a 1-unit discount on all retail inventory variances.'
  - 'C: Because digital cash registers automatically drop the final receipt of every audit batch.'
  - 'D: Because dividing by n-1 artificially inflates numbers to please conservative financial auditors.'
  options_zh:
  - 'A: 因为样本内各数据点到自身样本均值 x-bar 的离差平方和，在几何上必然小于或等于它们到真正总体均值 mu 的离差平方和，导致分子天然偏小。'
  - 'B: 因为企业会计准则明文要求在所有零售库存方差计算中扣减一个单位的折让。'
  - 'C: 因为智能收银机系统在导出审计批次时会自动强制丢弃最后一张结算小票。'
  - 'D: 因为除以 n-1 只是审计师为了迎合保守派管理层而人为拔高波动数字的手段。'
  options_zh_hk:
  - 'A: 因為樣本內各數據點到自身樣本均值 x-bar 嘅偏差平方和，喺幾何上必然細過或等於佢哋到真正總體均值 mu 嘅偏差平方和，搞到分子天然偏細。'
  - 'B: 因為企業會計準則明文要求喺所有零售庫存方差計算入面扣減一個單位嘅折讓。'
  - 'C: 因為智能收銀機系統喺導出審計批次嗰陣會自動強制丟棄最後一張結算單據。'
  - 'D: 因為除以 n-1 淨係審計師為咗迎合保守派管理層而人為拔高波動數字嘅手段。'
  answer: A
  explanation_en: The sample mean x-bar minimizes the sum of squared deviations for that specific sample. Sum of (X_i - x-bar)^2
    is strictly less than Sum of (X_i - mu)^2 unless x-bar = mu. Dividing by n-1 scales the expected value back up to exactly
    sigma^2.
  explanation_zh: 样本均值 x-bar 使样本自身的离差平方和达到绝对最小值。只要 x-bar 不等于总体真实均值 mu，以 x-bar 为基准计算的平方和就必然小于以 mu 为基准的平方和。除以 n-1 恰好能将期望补偿至
    sigma^2。
  explanation_zh_hk: 樣本均值 x-bar 令樣本自身嘅偏差平方和達到絕對最小值。只要 x-bar 唔等於總體真實均值 mu，以 x-bar 為基準計算嘅平方和就必然細過以 mu 為基準嘅平方和。除以 n-1 啱啱好可以將期望補償返去
    sigma^2。
- id: Q2
  type: multiple_choice
  question_en: 'An auditor inspects n = 5 customer receipts at Mong Kok: $40, $45, $50, $55, $60. The sample mean is x-bar
    = $50. What is the unbiased sample variance s^2?'
  question_zh: 审计员在旺角店随机抽取 n = 5 张顾客小票：$40、$45、$50、$55、$60。算得样本均值 x-bar = $50。该样本的无偏样本方差 s^2 是多少？
  question_zh_hk: 審計員喺旺角舖隨機抽取 n = 5 張顧客單據：$40、$45、$50、$55、$60。計得樣本均值 x-bar = $50。嗰個樣本嘅無偏樣本方差 s^2 係幾多？
  options_en:
  - 'A: s^2 = 250 / (5 - 1) = 250 / 4 = 62.50 dollars squared'
  - 'B: s^2 = 250 / 5 = 50.00 dollars squared'
  - 'C: s^2 = 50 / 5 = 10.00 dollars squared'
  - 'D: s^2 = 250 / (5 + 1) = 41.67 dollars squared'
  options_zh:
  - 'A: s^2 = 250 / (5 - 1) = 250 / 4 = 62.50 平方元'
  - 'B: s^2 = 250 / 5 = 50.00 平方元'
  - 'C: s^2 = 50 / 5 = 10.00 平方元'
  - 'D: s^2 = 250 / (5 + 1) = 41.67 平方元'
  options_zh_hk:
  - 'A: s^2 = 250 / (5 - 1) = 250 / 4 = 62.50 平方元'
  - 'B: s^2 = 250 / 5 = 50.00 平方元'
  - 'C: s^2 = 50 / 5 = 10.00 平方元'
  - 'D: s^2 = 250 / (5 + 1) = 41.67 平方元'
  answer: A
  explanation_en: 'Deviations from 50 are -10, -5, 0, +5, +10. Squared deviations are 100, 25, 0, 25, 100, summing to 250.
    Divide by degrees of freedom df = n - 1 = 4: 250 / 4 = 62.50.'
  explanation_zh: 离均差分别为 -10, -5, 0, +5, +10。平方后为 100, 25, 0, 25, 100，总和为 250。除以自由度 df = 5 - 1 = 4，得 250 / 4 = 62.50。
  explanation_zh_hk: 離均差分別係 -10, -5, 0, +5, +10。平方之後係 100, 25, 0, 25, 100，總和為 250。除以自由度 df = 5 - 1 = 4，得 250 / 4 = 62.50。
