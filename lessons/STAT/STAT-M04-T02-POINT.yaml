title_en: Why does sample variance use n − 1?
title_zh: 样本方差为什么除以 n − 1？
title_zh_hk: 樣本方差點解除以 n − 1？
objective_en: Define unbiased point estimators for population parameters, explain mathematically why dividing by n systematically
  underestimates population variance, and apply Bessel's n-1 correction to evaluate customer spending volatility.
objective_zh: 阐释总体参数的无偏点估计量定义，从数学几何本质解析为何除以 n 会系统性低估总体真实方差，并应用贝塞尔 n-1 修正准确度量客单消费波动。
objective_zh_hk: 闡釋總體參數嘅無偏點估計量定義，由數學幾何本質解析點解除以 n 會系統性低估總體真實方差，並應用貝塞爾 n-1 修正準確度量客單消費波動。
youtube:
  description_en: |
    Why does sample variance divide by n − 1?

    Suppose a manager reads five receipts from Shop A to judge how much customer spend swings, so she can size the cash float. If she reads the swing too small, the float runs short on a busy day.

    A point estimator is one number from a sample that stands in for a number about all customers. It is unbiased when, over many repeat samples, its guesses average out to the true value. The sample mean x-bar is unbiased. Variance divided by n is not: it lands low on average.

    Why? x-bar sits in the middle of its own sample, so distances from x-bar are tighter than distances from the true mean mu. Once x-bar is fixed, only n − 1 of the distances are free: that is the degrees of freedom. Bessel's correction divides by n − 1.

    In an assumed example, five receipts of $40, $45, $50, $55 and $60 have mean $50 and squared distances that add to 250. Divide by 5 and you get 50; divide by 4 and you get 62.5 square dollars, a standard deviation of about $7.91 instead of $7.07.

    Rule: to estimate the spread of all customers from a sample, divide by n − 1.
  description_zh: |
    样本方差为什么除以 n − 1？

    假设经理从A店拿五张小票，想看顾客花钱的波动有多大，好决定收银备用金放多少。波动看小了，忙的那天备用金就不够。

    点估计量，就是用样本算出一个数，去代替全部顾客的那个数。如果反复抽很多次样本，它的猜测平均下来刚好等于真值，就叫无偏。样本均值 x-bar 是无偏的；方差如果除以 n，平均下来会偏小。

    为什么？x-bar 就坐在自己这批样本的正中间，所以离 x-bar 的距离，比离真实均值 mu 的距离更紧。x-bar 一定下来，n 个距离里只有 n − 1 个能自由变动，这就是自由度。贝塞尔修正就是除以 n − 1。

    在一个假设的例子里，五张小票 $40、$45、$50、$55、$60，平均 $50，距离平方加起来是 250。除以 5 得 50；除以 4 得 62.5 平方元，标准差大约 $7.91，而不是 $7.07。

    规则：用样本去估全部顾客的波动，就除以 n − 1。
  description_zh_hk: |
    樣本方差點解除以 n − 1？

    假設經理喺A店攞五張單，想睇吓客人使錢嘅波動有幾大，好決定收銀備用金放幾多。波動睇細咗，忙嗰日備用金就唔夠。

    點估計量，即係用樣本計一個數，去代替全部客人嗰個數。如果重複抽好多次樣本，佢嘅估計平均落嚟啱啱等於真值，就叫無偏。樣本均值 x-bar 係無偏嘅；方差如果除以 n，平均落嚟會偏細。

    點解？x-bar 就坐喺自己呢批樣本嘅正中間，所以離 x-bar 嘅距離，會比離真實均值 mu 嘅距離更緊。x-bar 一定咗落嚟，n 個距離入面只有 n − 1 個可以自由郁，呢個就係自由度。貝塞爾修正就係除以 n − 1。

    喺一個假設嘅例子入面，五張單 $40、$45、$50、$55、$60，平均 $50，距離平方加埋係 250。除以 5 得 50；除以 4 得 62.5 平方元，標準差大約 $7.91，而唔係 $7.07。

    規則：用樣本去估全部客人嘅波動，就除以 n − 1。
