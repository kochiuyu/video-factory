  q1_zh_hk: 除以 5？→ 250 / 5 = 50，√50 ≈ $7.07
  q2_en: 'Divide by 4? → 62.5, √62.5 ≈ $7.91'
  q2_zh: 除以 4？→ 62.5，√62.5 ≈ $7.91
  q2_zh_hk: 除以 4？→ 62.5，√62.5 ≈ $7.91
  s1_en: Back to the manager's till. Divide by five and she gets fifty square dollars. Take the square root, the number that
    times itself gives fifty, and the swing reads about seven dollars and seven cents. That reads the swing too small.
  s1_zh: 回到经理的收银机。除以五，得到五十平方元。开平方根，也就是找哪个数自己乘自己等于五十，波动大约是七块零七分。这样看，波动就看小了。
  s1_zh_hk: 返去經理部收銀機。除以五，得到五十平方元。開平方根，即係搵邊個數自己乘自己等於五十，波動大約係七蚊零七仙。噉睇，波動就睇細咗。
  s2_en: Divide by four and the variance is sixty-two point five. Its square root is about seven dollars and ninety-one cents.
    That is the standard deviation she should plan the float around. With thousands of receipts, n and n minus one barely
    differ.
  s2_zh: 除以四，方差是六十二点五，开根号大约是七块九毛一。她应该按这个标准差去安排备用金。如果有几千张小票，除以 n 和除以 n 减一，差别就很小了。
  s2_zh_hk: 除以四，方差係六十二點五，開方大約係七蚊九毫一。佢應該按呢個標準差去安排備用金。如果有幾千張單，除以 n 同除以 n 減一，分別就好細。
  s3_en: 'So the rule: when a sample stands in for all customers, divide the squared distances by n minus one. The five receipts
    leave four degrees of freedom, and that is why we divide by four. The estimate still has its own sampling error.'
  s3_zh: 所以规则是：用样本去代表全部顾客的时候，距离平方和就除以 n 减一。五张小票只剩四个自由度，所以除以四。当然，这个估计本身还是有抽样误差的。
  s3_zh_hk: 所以規則係：用樣本去代表全部客人嗰陣，距離平方和就除以 n 減一。五張單只剩四個自由度，所以除以四。當然，呢個估計本身都仲有抽樣誤差。
