quiz:
- id: Q1
  type: multiple_choice
  question_en: Why does dividing the sum of squared distances by n, instead of n − 1, tend to underestimate the population
    variance sigma^2?
  question_zh: 算样本方差时，把距离平方和除以 n 而不是 n − 1，为什么往往会低估总体方差 sigma^2？
  question_zh_hk: 計樣本方差嗰陣，將距離平方和除以 n 而唔係 n − 1，點解往往會低估總體方差 sigma^2？
  options_en:
  - 'A: The data sit closer to their own sample mean x-bar than to the true mean mu, so the squared distances come out too small.'
  - 'B: One receipt in every sample is usually a recording error, so we drop one before dividing.'
  - 'C: Dividing by n − 1 just makes the answer bigger, and a bigger spread is always the safer choice.'
  - 'D: The sample mean x-bar is biased, so the variance must make up for that bias.'
  options_zh:
  - 'A: 数据离自己的样本均值 x-bar，比离真实均值 mu 更近，所以算出来的距离平方偏小。'
  - 'B: 每个样本里通常有一张小票记错了，所以要先扣掉一张再除。'
  - 'C: 除以 n − 1 只是让答案变大，波动估大一点总是比较保险。'
  - 'D: 样本均值 x-bar 本身有偏，所以方差要帮它补回来。'
  options_zh_hk:
  - 'A: 數據離自己嘅樣本均值 x-bar，比離真實均值 mu 更近，所以計出嚟嘅距離平方偏細。'
  - 'B: 每個樣本入面通常有一張單記錯咗，所以要先扣走一張再除。'
  - 'C: 除以 n − 1 只係令個答案大啲，波動估大啲總係穩陣啲。'
  - 'D: 樣本均值 x-bar 本身有偏，所以方差要幫佢補返。'
  answer: A
  explanation_en: x-bar is the point that makes the squared distances of its own sample as small as possible. Unless x-bar
    happens to equal mu, distances from x-bar add to less than distances from mu. Dividing by n − 1 makes the average of
    s^2 over many samples equal sigma^2.
  explanation_zh: x-bar 正好是让这批样本距离平方和最小的那个点。除非 x-bar 刚好等于 mu，否则离 x-bar 的平方和一定比离 mu 的小。除以 n − 1，s^2 在很多次抽样里的平均才刚好等于 sigma^2。
  explanation_zh_hk: x-bar 啱啱係令呢批樣本距離平方和最細嘅嗰一點。除非 x-bar 啱啱等於 mu，否則離 x-bar 嘅平方和一定細過離 mu 嘅。除以 n − 1，s^2 喺好多次抽樣入面嘅平均先會啱啱等於 sigma^2。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose a sample of n = 4 receipts from Shop C reads $30, $34, $38, $42, so x-bar = $36. What is the sample
    variance s^2 that we use to estimate the spread of all customers?'
  question_zh: 假设从C店抽了 n = 4 张小票：$30、$34、$38、$42，所以 x-bar = $36。用来估全部顾客波动的样本方差 s^2 是多少？
  question_zh_hk: 假設喺C店抽咗 n = 4 張單：$30、$34、$38、$42，所以 x-bar = $36。用嚟估全部客人波動嘅樣本方差 s^2 係幾多？
  options_en:
  - 'A: s^2 = 80 / (4 − 1) ≈ 26.67 square dollars'
  - 'B: s^2 = 80 / 4 = 20.00 square dollars'
  - 'C: s^2 = 16 / (4 − 1) ≈ 5.33 square dollars'
  - 'D: s^2 = 80 / (4 + 1) = 16.00 square dollars'
  options_zh:
  - 'A: s^2 = 80 / (4 − 1) ≈ 26.67 平方元'
  - 'B: s^2 = 80 / 4 = 20.00 平方元'
  - 'C: s^2 = 16 / (4 − 1) ≈ 5.33 平方元'
  - 'D: s^2 = 80 / (4 + 1) = 16.00 平方元'
  options_zh_hk:
  - 'A: s^2 = 80 / (4 − 1) ≈ 26.67 平方元'
  - 'B: s^2 = 80 / 4 = 20.00 平方元'
  - 'C: s^2 = 16 / (4 − 1) ≈ 5.33 平方元'
  - 'D: s^2 = 80 / (4 + 1) = 16.00 平方元'
  answer: A
  explanation_en: 'Distances from 36 are −6, −2, +2, +6. Squared, they are 36, 4, 4, 36, which add to 80. Divide by the degrees
    of freedom, n − 1 = 3: 80 / 3 ≈ 26.67. B divides by n, C adds the distances without squaring, and D divides by n + 1.'
  explanation_zh: 离 36 的距离是 −6、−2、+2、+6，平方后是 36、4、4、36，加起来 80。除以自由度 n − 1 = 3，得 80 / 3 ≈ 26.67。B 除以了 n，C 没有平方就直接加距离，D 除以了 n + 1。
  explanation_zh_hk: 離 36 嘅距離係 −6、−2、+2、+6，平方之後係 36、4、4、36，加埋 80。除以自由度 n − 1 = 3，得 80 / 3 ≈ 26.67。B 除咗 n，C 冇平方就直接加距離，D 除咗 n + 1。
