  title_en: Why does variance use n − 1?
  title_zh: 方差为什么除以 n − 1？
  title_zh_hk: 方差點解除以 n − 1？
  en: 'Suppose the manager of Shop A must decide how much cash to keep in the till. She needs to know how much customer spend
    swings, not just the average. Read the swing too small, and on a busy day the float runs short. So she checks five receipts.
    The usual way to measure swing divides by five. Statisticians say divide by four. Why n minus one?'
  zh: 假设A店的经理要决定收银机里放多少备用金。她要知道的不只是平均花多少，还要知道顾客花钱的波动有多大。波动看小了，碰上忙的日子，备用金就不够用。所以她拿了五张小票来看。一般算波动是除以五，可是统计学家说要除以四。为什么是 n 减一？
  zh_hk: 假設A店嘅經理要決定收銀機入面放幾多備用金。佢要知嘅唔止係平均使幾多，仲要知客人使錢嘅波動有幾大。波動睇細咗，撞啱忙嘅日子，備用金就唔夠用。所以佢攞咗五張單嚟睇。一般計波動係除以五，但統計學家話要除以四。點解係 n 減一？
- id: define
  visual: definition_card
  seconds: 36
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Point estimator, unbiased
  title_zh: 点估计量与无偏性
  title_zh_hk: 點估計量同無偏性
  formula: 'Many samples: average guess = true value'
  formula_zh: 反复抽样：猜测的平均 = 真值
  formula_zh_hk: 重複抽樣：估計嘅平均 = 真值
  s1_en: 'First, two words. A point estimator is one number from a sample that stands in for a number about all customers.
    The sample mean, x-bar, stands in for the true mean, mu. Variance is the average squared distance from the mean.'
  s1_zh: 先讲两个词。点估计量，就是用样本算出一个数，去代替全部顾客的那个数。样本均值 x-bar，就是拿来代替真实均值 mu 的。方差呢，是离均值的距离平方，再取平均。
  s1_zh_hk: 先講兩個詞。點估計量，即係用樣本計一個數，去代替全部客人嗰個數。樣本均值 x-bar，就係攞嚟代替真實均值 mu 嘅。方差呢，就係離均值嘅距離平方，再攞平均。
  s2_en: 'An estimator is unbiased if, over many repeat samples, its guesses average out to the true value. Some guesses high,
    some low, centred on the truth. x-bar passes this test. Variance divided by n does not: on average it lands low.'
  s2_zh: 如果反复抽很多次样本，这个数的猜测平均下来刚好等于真值，它就是无偏的。有时猜高，有时猜低，但中心对准真值。x-bar 过得了这一关；方差除以 n 就过不了，平均下来会偏小。
  s2_zh_hk: 如果重複抽好多次樣本，呢個數嘅估計平均落嚟啱啱等於真值，佢就係無偏嘅。有時估高，有時估低，但中心對準真值。x-bar 過到呢關；方差除以 n 就過唔到，平均落嚟會偏細。
- id: mechanics
  visual: two_column
  seconds: 52
  kicker: Why it lands low
  kicker_en: Why it lands low
  kicker_zh: 为什么偏小
  kicker_zh_hk: 點解會偏細
  title_en: Distances from mu vs x-bar
  title_zh: 离 mu 与离 x-bar
  title_zh_hk: 離 mu 同離 x-bar
  left_en: 'From mu: the true spread'
  left_zh: 离 mu：真实波动
  left_zh_hk: 離 mu：真實波動
  right_en: 'From x-bar: too tight'
  right_zh: 离 x-bar：偏紧
  right_zh_hk: 離 x-bar：偏緊
  s1_en: Why does it land low? Think of x-bar as a seesaw's balance point, set right in the middle of our five receipts. No
    other point gives a smaller total of squared distances to those five. That is what being the middle means.
  s1_zh: 为什么会偏小？把 x-bar 想成跷跷板的支点，它就放在这五张小票的正中间。换任何别的点，五张小票的距离平方加起来，都不会比它更小。这就是正中间的意思。
  s1_zh_hk: 點解會偏細？將 x-bar 想像成蹺蹺板嘅支點，佢就擺喺呢五張單嘅正中間。換第二個點，五張單嘅距離平方加埋，都唔會細過佢。呢個就係正中間嘅意思。
  s2_en: 'But the true mean, mu, is almost never exactly at x-bar. It sits a little to one side. Distances measured from mu
    are wider. So when we measure from x-bar, we are using the one point that makes the spread look smallest.'
  s2_zh: 可是真实均值 mu，几乎不会刚好落在 x-bar 上，总会偏一点。从 mu 量过去，距离会更宽。所以我们从 x-bar 量，就等于挑了一个让波动看起来最小的点。
  s2_zh_hk: 但真實均值 mu，幾乎唔會啱啱落喺 x-bar 度，總會偏少少。由 mu 度量過去，距離會闊啲。所以我哋由 x-bar 度量，就等於揀咗一個令波動睇落最細嘅點。
  s3_en: 'There is a second way to see it. The distances from x-bar always add to zero. Know four of them, and the fifth is
    forced. Only n minus one are free; we call that the degrees of freedom. Bessel''s correction divides by n minus one.'
  s3_zh: 还有另一个角度。离 x-bar 的距离，正负加起来一定是零。知道了其中四个，第五个就定死了。只有 n 减一个是自由的，这叫自由度。贝塞尔修正，就是除以 n 减一。
  s3_zh_hk: 仲有另一個角度。離 x-bar 嘅距離，正負加埋一定係零。知道咗其中四個，第五個就定死咗。只有 n 減一個係自由嘅，呢個叫自由度。貝塞爾修正，就係除以 n 減一。
- id: ledger
  visual: steps
  layout: rows
  seconds: 66
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: Five receipts from Shop A
  title_zh: A店的五张小票
  title_zh_hk: A店嘅五張單
  step1_en: '40 + 45 + 50 + 55 + 60 = 250'
  step1_zh: '40 + 45 + 50 + 55 + 60 = 250'
  step1_zh_hk: '40 + 45 + 50 + 55 + 60 = 250'
  step2_en: '250 / 5 = $50 (x-bar)'
  step2_zh: '250 / 5 = $50 (x-bar)'
  step2_zh_hk: '250 / 5 = $50 (x-bar)'
  step3_en: 'Gaps: −10, −5, 0, +5, +10'
  step3_zh: 距离：−10, −5, 0, +5, +10
  step3_zh_hk: 距離：−10, −5, 0, +5, +10
  step4_en: '100 + 25 + 0 + 25 + 100 = 250'
  step4_zh: '100 + 25 + 0 + 25 + 100 = 250'
  step4_zh_hk: '100 + 25 + 0 + 25 + 100 = 250'
  step5_en: '250 / (5 − 1) = 62.5'
  step5_zh: '250 / (5 − 1) = 62.5'
  step5_zh_hk: '250 / (5 − 1) = 62.5'
  s1_en: Let us work it with made-up numbers. Suppose the five receipts read forty, forty-five, fifty, fifty-five and sixty
    dollars. Add them up and you get two hundred and fifty dollars.
  s1_zh: 我们用一组假设的数字来算。假设五张小票分别是四十、四十五、五十、五十五、六十块。全部加起来，是两百五十块。
  s1_zh_hk: 我哋用一組假設嘅數字嚟計。假設五張單分別係四十、四十五、五十、五十五、六十蚊。全部加埋，係二百五十蚊。
  s2_en: The average is the total divided by how many receipts. Two hundred and fifty divided by five is fifty dollars. That
    is x-bar, our balance point.
  s2_zh: 平均就是总数除以张数。两百五十除以五，等于五十块。这就是 x-bar，我们的支点。
  s2_zh_hk: 平均即係總數除以張數。二百五十除以五，等於五十蚊。呢個就係 x-bar，我哋嘅支點。
  s3_en: Now each receipt's distance from fifty. Forty is ten below, forty-five is five below, fifty is on the spot, then five
    above and ten above. Notice they add to zero.
  s3_zh: 再看每张小票离五十有多远。四十低了十，四十五低了五，五十刚好在点上，然后是高五、高十。留意一下，正负加起来刚好是零。
  s3_zh_hk: 再睇每張單離五十有幾遠。四十低咗十，四十五低咗五，五十啱啱喺點上，跟住係高五、高十。留意吓，正負加埋啱啱係零。
  s4_en: Square each distance, a number times itself. Ten times ten is one hundred, five times five is twenty-five. One hundred,
    twenty-five, zero, twenty-five, one hundred. The total is two hundred and fifty.
  s4_zh: 把每个距离平方，也就是自己乘自己。十乘十是一百，五乘五是二十五。一百、二十五、零、二十五、一百，加起来是两百五十。
  s4_zh_hk: 將每個距離平方，即係自己乘自己。十乘十係一百，五乘五係二十五。一百、二十五、零、二十五、一百，加埋係二百五十。
  s5_en: Now divide by n minus one, which is four. Two hundred and fifty over four is sixty-two point five. Because we squared
    dollars, the unit is square dollars. That is the sample variance, s squared.
  s5_zh: 现在除以 n 减一，也就是四。两百五十除以四，等于六十二点五。因为我们把钱平方了，单位是平方元。这就是样本方差，s 平方。
  s5_zh_hk: 而家除以 n 減一，即係四。二百五十除以四，等於六十二點五。因為我哋將錢平方咗，單位係平方元。呢個就係樣本方差，s 平方。
