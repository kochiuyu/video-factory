  s1_en: Back to the manager of Shop A. Single receipts swing by about eighteen dollars, but that is sigma, not the swing
    of her average. With twenty-five receipts, the average moves by about three dollars and sixty cents.
  s1_zh: 回到A店的经理。单张小票大约差十八块，可那是 sigma，不是她那个平均的波动。抽二十五张，平均大约只会移动三块六。
  s1_zh_hk: 返到A店嘅經理。單張單大約差十八蚊，但嗰個係 sigma，唔係佢個平均嘅波動。抽二十五張，平均大約只會郁三蚊六。
  s2_en: Should she check a hundred? That halves the standard error to one dollar and eighty cents, at four times the checking
    work. It pays only if a wrong read of about three sixty costs her more than the extra work.
  s2_zh: 要不要查一百张？标准误会减半到一块八，可查账工作是四倍。只有当看错三块六左右的代价，比多出来的工作更大，才值得。
  s2_zh_hk: 使唔使查一百張？標準誤會減半到一蚊八，但查數工夫係四倍。只有當睇錯三蚊六左右嘅代價，大過多出嚟嘅工夫，先至值得。
  s3_en: 'So the rule: the standard error is sigma over the square root of n, and halving it takes four times the sample.
    This assumes the receipts are drawn at random and independently.'
  s3_zh: 所以规则是：标准误等于 sigma 除以根号 n，想把它减半，就要四倍的样本。这里假设小票是随机、独立抽出来的。
  s3_zh_hk: 所以規則係：標準誤等於 sigma 除以 n 開方，想將佢減半，就要四倍嘅樣本。呢度假設啲單係隨機、獨立抽出嚟嘅。
