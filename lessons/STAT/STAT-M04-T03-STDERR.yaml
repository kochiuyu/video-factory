- id: define
  visual: definition_card
  seconds: 36
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Standard error of the mean
  title_zh: 样本均值的标准误
  title_zh_hk: 樣本均值嘅標準誤
  formula: SE = σ / √n
  formula_zh: SE = σ / √n
  formula_zh_hk: SE = σ / √n
  formula_tex: \text{SE} = \frac{\sigma}{\sqrt{n}}
  s1_en: Two spreads, two jobs. The standard deviation, sigma, says how much single receipts spread. The standard error says
    how much the sample average would move if we drew a fresh random sample of the same size, again and again.
  s1_zh: 两种波动，各管一件事。标准差 sigma，说的是单张小票分散得多开。标准误说的是，同样多的小票，再随机抽一批、再抽一批，样本平均每次会移动多少。
  s1_zh_hk: 兩種波動，各自管一樣嘢。標準差 sigma，講嘅係單張單散得幾開。標準誤講嘅係，同樣咁多張單，再隨機抽一批、再抽一批，樣本平均每次會郁幾多。
  s2_en: Why does the average move less? A big order and a small one partly cancel. So the standard error is sigma over
    the square root of n, the number of receipts. That root is the number that times itself gives n.
  s2_zh: 为什么平均晃得比较少？求平均的时候，大单和小单会部分抵消。所以标准误等于 sigma 除以根号 n，n 是小票的张数。根号 n，就是哪个数自己乘自己等于 n。
  s2_zh_hk: 點解平均郁得冇咁多？計平均嗰陣，大單同細單會部分抵銷。所以標準誤等於 sigma 除以 n 開方，n 係單嘅張數。n 開方，即係邊個數自己乘自己等於 n。
- id: ledger
  visual: steps
  layout: rows
  seconds: 62
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: Shop A, σ = $18
  title_zh: A店，σ = $18
  title_zh_hk: A店，σ = $18
  step1_en: 5 × 5 = 25, so √25 = 5
  step1_zh: 5 × 5 = 25，所以 √25 = 5
  step1_zh_hk: 5 × 5 = 25，所以 √25 = 5
  step2_en: 'n = 25: 18 / 5 = $3.60'
  step2_zh: 'n = 25：18 / 5 = $3.60'
  step2_zh_hk: 'n = 25：18 / 5 = $3.60'
  step3_en: 10 × 10 = 100, so √100 = 10
  step3_zh: 10 × 10 = 100，所以 √100 = 10
  step3_zh_hk: 10 × 10 = 100，所以 √100 = 10
  step4_en: 'n = 100: 18 / 10 = $1.80'
  step4_zh: 'n = 100：18 / 10 = $1.80'
  step4_zh_hk: 'n = 100：18 / 10 = $1.80'
  s1_en: Let us work it with made-up numbers. Suppose single receipts at Shop A have a standard deviation of eighteen dollars.
    The manager checks twenty-five receipts. What number times itself gives twenty-five? Five, because five times five is
    twenty-five.
  s1_zh: 我们用一组假设的数字来算。假设A店单张小票的标准差是十八块，经理抽查二十五张。哪个数自己乘自己等于二十五？是五，因为五乘五等于二十五。
  s1_zh_hk: 我哋用一組假設嘅數字嚟計。假設A店單張單嘅標準差係十八蚊，經理抽查二十五張。邊個數自己乘自己等於二十五？係五，因為五乘五等於二十五。
  s2_en: So the standard error is eighteen divided by five, three dollars and sixty cents. Single receipts spread by about
    eighteen dollars, but an average of twenty-five moves by only about three sixty from sample to sample.
  s2_zh: 所以标准误是十八除以五，等于三块六。单张小票大约差十八块，可是二十五张的平均，换一批样本，只会移动大约三块六。
  s2_zh_hk: 所以標準誤係十八除以五，等於三蚊六。單張單大約差十八蚊，但二十五張嘅平均，換一批樣本，只會郁大約三蚊六。
  s3_en: Now she checks four times as many, one hundred receipts. What number times itself gives one hundred? Ten, because
    ten times ten is one hundred. The receipts grew four times, but the square root only doubled, from five to ten.
  s3_zh: 现在她抽查四倍的量，一百张。哪个数自己乘自己等于一百？是十，因为十乘十等于一百。小票多了四倍，根号却只从五变成十，只大了两倍。
  s3_zh_hk: 而家佢抽查四倍嘅量，一百張。邊個數自己乘自己等於一百？係十，因為十乘十等於一百。單多咗四倍，開方就只係由五變做十，大咗兩倍。
  s4_en: So the standard error is eighteen divided by ten, one dollar and eighty cents. Four times the receipts, and the standard
    error is only cut in half, from three sixty to one eighty.
  s4_zh: 所以标准误是十八除以十，等于一块八。小票多了四倍，标准误只是减半，从三块六降到一块八。
  s4_zh_hk: 所以標準誤係十八除以十，等於一蚊八。單多咗四倍，標準誤只係減半，由三蚊六跌到一蚊八。
- id: mechanics
  visual: two_column
  seconds: 44
  kicker: The trade-off
  kicker_en: The trade-off
  kicker_zh: 代价
  kicker_zh_hk: 代價
  title_en: The square-root law
  title_zh: 平方根法则
  title_zh_hk: 平方根法則
  left_en: Cost grows with n
  left_zh: 成本跟着 n 涨
  left_zh_hk: 成本跟住 n 升
  right_en: SE shrinks with √n
  right_zh: SE 跟着 √n 缩
  right_zh_hk: SE 跟住 √n 縮
  s1_en: Now look at the bill. Checking receipts takes staff time, and every receipt costs about the same. Four times the
    receipts means about four times the checking work. The cost grows in step with n.
  s1_zh: 再看成本。查小票要花人手，每一张的工夫差不多。小票多四倍，查账的工作也差不多多四倍。成本是跟着 n 一起涨的。
  s1_zh_hk: 再睇成本。查單要用人手，每一張嘅工夫差唔多。單多四倍，查數嘅工夫都差唔多多四倍。成本係跟住 n 一齊升嘅。
  s2_en: But the standard error shrinks only with the square root of n. Four times the work halves it. To cut it to a tenth,
    you need ten times ten, a hundred times the receipts. This is the square-root law.
  s2_zh: 可是标准误只跟着根号 n 缩小。四倍的工作，只换来一半。想把它缩到十分一，要十乘十，也就是一百倍的小票。这就叫平方根法则。
  s2_zh_hk: 但標準誤只係跟住 n 開方縮細。四倍嘅工夫，只換到一半。想將佢縮到十分一，要十乘十，即係一百倍嘅單。呢個就叫平方根法則。
  s3_en: So each extra receipt buys less precision than the one before. We call this diminishing precision returns. Past
    some point, more checking costs more than the extra sharpness is worth.
  s3_zh: 所以每多查一张，买到的精度都比上一张少。这叫精度边际收益递减。过了某个点，多查的成本，就会比多出来的那点精度更贵。
  s3_zh_hk: 所以每多查一張，買到嘅精度都少過上一張。呢個叫精度邊際收益遞減。過咗某個位，多查嘅成本，就會貴過多出嚟嗰少少精度。
