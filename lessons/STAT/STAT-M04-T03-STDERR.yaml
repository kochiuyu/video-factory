quiz:
- id: Q1
  type: multiple_choice
  question_en: Suppose single receipts at Shop B have a standard deviation of sigma = $18. What happens to the standard error
    of the sample mean if the manager checks n = 100 receipts instead of n = 25?
  question_zh: 假设B店单张小票的标准差是 sigma = $18。经理抽查的小票从 n = 25 张加到 n = 100 张，样本均值的标准误会怎样变？
  question_zh_hk: 假設B店單張單嘅標準差係 sigma = $18。經理抽查嘅單由 n = 25 張加到 n = 100 張，樣本均值嘅標準誤會點變？
  options_en:
  - 'A: It halves, from $3.60 to $1.80, because √100 = 10 is only twice √25 = 5.'
  - 'B: It falls by 75%, to $0.90, because n grew four times.'
  - 'C: It stays at $18, because single receipts swing just as much as before.'
  - 'D: It rises, because more receipts bring in more extreme orders.'
  options_zh:
  - 'A: 减半，从 $3.60 降到 $1.80，因为 √100 = 10 只是 √25 = 5 的两倍。'
  - 'B: 降 75%，变成 $0.90，因为 n 大了四倍。'
  - 'C: 还是 $18，因为单张小票的波动没变。'
  - 'D: 变大，因为小票多了，极端的大单也会更多。'
  options_zh_hk:
  - 'A: 減半，由 $3.60 跌到 $1.80，因為 √100 = 10 只係 √25 = 5 嘅兩倍。'
  - 'B: 跌 75%，變成 $0.90，因為 n 大咗四倍。'
  - 'C: 仲係 $18，因為單張單嘅波動冇變。'
  - 'D: 變大，因為單多咗，極端嘅大單都會多咗。'
  answer: A
  explanation_en: SE = 18 / √25 = 18 / 5 = $3.60, and SE = 18 / √100 = 18 / 10 = $1.80. Four times the receipts only doubles
    the square root, so the standard error halves. B divides by n instead of √n; C confuses sigma with SE; D forgets that
    highs and lows cancel in an average.
  explanation_zh: SE = 18 / √25 = 18 / 5 = $3.60；SE = 18 / √100 = 18 / 10 = $1.80。小票多四倍，根号只大两倍，所以标准误减半。B 除的是 n 不是 √n；C 把 sigma 当成了 SE；D 忘了求平均时高低会抵消。
  explanation_zh_hk: SE = 18 / √25 = 18 / 5 = $3.60；SE = 18 / √100 = 18 / 10 = $1.80。單多四倍，開方只係大兩倍，所以標準誤減半。B 除嘅係 n 唔係 √n；C 將 sigma 當咗係 SE；D 唔記得計平均嗰陣高低會抵銷。
- id: Q2
  type: multiple_choice
  question_en: What is the difference between the standard deviation sigma and the standard error SE?
  question_zh: 标准差 sigma 和标准误 SE 有什么不同？
  question_zh_hk: 標準差 sigma 同標準誤 SE 有乜嘢唔同？
  options_en:
  - 'A: Sigma is how much single receipts spread; SE is how much the sample average moves from one sample to the next.'
  - 'B: They are the same spread; SE is just a shorter name for sigma.'
  - 'C: Sigma shrinks as we check more receipts, while SE stays fixed.'
  - 'D: SE is how far one receipt sits from the sample average.'
  options_zh:
  - 'A: sigma 是单张小票分散多开；SE 是换一批样本，样本平均会移动多少。'
  - 'B: 两个是同一种波动，SE 只是 sigma 的简称。'
  - 'C: 小票查得越多，sigma 越小，SE 不变。'
  - 'D: SE 是一张小票离样本平均有多远。'
  options_zh_hk:
  - 'A: sigma 係單張單散得幾開；SE 係換一批樣本，樣本平均會郁幾多。'
  - 'B: 兩個係同一種波動，SE 只係 sigma 嘅簡稱。'
  - 'C: 單查得越多，sigma 越細，SE 唔變。'
  - 'D: SE 係一張單離樣本平均有幾遠。'
  answer: A
  explanation_en: Sigma belongs to single customers and does not shrink when we check more receipts. SE belongs to the sample
    average; it equals sigma / √n, so it shrinks as n grows. C has the two the wrong way round, and D describes one receipt's
    distance, not the swing of the average.
  explanation_zh: sigma 属于单个顾客，多查小票它也不会变小。SE 属于样本平均，等于 sigma / √n，n 越大它越小。C 把两者调转了，D 讲的是一张小票的距离，不是平均的波动。
  explanation_zh_hk: sigma 屬於單個客人，查多啲單佢都唔會變細。SE 屬於樣本平均，等於 sigma / √n，n 越大佢越細。C 將兩樣調轉咗，D 講嘅係一張單嘅距離，唔係平均嘅波動。
