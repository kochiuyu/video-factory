title_en: What is the standard error?
title_zh: 什么是标准误？
title_zh_hk: 乜嘢係標準誤？
objective_en: Define the standard error of the sample mean SE = sigma / sqrt(n), explain the square-root law of precision,
  contrast individual dispersion sigma with sampling uncertainty SE, and calculate audit sample sizes under budget trade-offs.
objective_zh: 定义样本均值的标准误 SE = sigma / 根号(n)，解析精度提升的平方根边际递减法则，严格区分个体波动 sigma 与抽样不确定度 SE，并在审计预算约束下权衡抽检规模。
objective_zh_hk: 定義樣本均值嘅標準誤 SE = sigma / 根號(n)，解析精度提升嘅平方根邊際遞減法則，嚴格區分個體波動 sigma 與抽樣不確定度 SE，並喺審計預算約束下權衡抽檢規模。
youtube:
  description_en: |
    What is the standard error?

    Suppose the manager of Shop A wants to know the average spend per customer. One receipt is a single coffee, the next is a whole office order, so single receipts swing a lot. If she treats the average of a sample as if it swings like one receipt, she misreads every change; if she checks more receipts than she needs, she pays for precision she does not use.

    The standard deviation, sigma, is how much single receipts spread. The standard error, SE, is how much the sample average would move from one random sample to the next. In an average, high and low receipts partly cancel, so SE = sigma / √n, where √n is the number that times itself gives n.

    In an assumed example, sigma = $18. With n = 25 receipts, √25 = 5, so SE = 18 / 5 = $3.60. With n = 100 receipts, √100 = 10, so SE = 18 / 10 = $1.80.

    Four times the receipts, four times the checking work, but the standard error only halves. To cut it to a tenth, you need a hundred times the receipts. That is the square-root law, and it is why precision has diminishing returns.

    Rule: SE = sigma / √n. Halving the standard error takes four times the sample, so weigh the checking cost against the cost of a wrong read before you grow n. This assumes the receipts are drawn at random and independently.
  description_zh: |
    什么是标准误？

    假设A店的经理想知道每位顾客平均花多少钱。一张小票可能只是一杯咖啡，下一张却是整个办公室的订单，单张小票波动很大。如果把样本平均当成单张小票那样晃，每次变动都会看错；如果抽查的小票比需要的多，就是花钱买了用不上的精度。

    标准差 sigma，看的是单张小票分散得多开。标准误 SE，看的是换一批随机样本，样本平均会移动多少。求平均的时候，高的和低的会部分抵消，所以 SE = sigma / √n。√n 就是哪个数自己乘自己等于 n。

    在一个假设的例子里，sigma = $18。抽 25 张小票，√25 = 5，SE = 18 / 5 = $3.60。抽 100 张小票，√100 = 10，SE = 18 / 10 = $1.80。

    小票多了四倍，查账的工作也多了四倍，标准误却只减了一半。想把它缩到十分一，就要一百倍的小票。这就是平方根法则，也是精度边际收益递减的原因。

    规则：SE = sigma / √n。标准误减半要四倍的样本，所以扩大 n 以前，先比较抽查成本和看错的代价。这里假设小票是随机、独立抽出来的。
  description_zh_hk: |
    乜嘢係標準誤？

    假設A店嘅經理想知每位客人平均使幾多錢。一張單可能只係一杯咖啡，下一張就係成個辦公室嘅訂單，單張單波動好大。如果將樣本平均當成單張單噉郁，每次變動都會睇錯；如果抽查嘅單多過需要，就係用錢買咗用唔着嘅精度。

    標準差 sigma，睇嘅係單張單散得幾開。標準誤 SE，睇嘅係換一批隨機樣本，樣本平均會郁幾多。計平均嗰陣，高嘅同低嘅會部分抵銷，所以 SE = sigma / √n。√n 即係邊個數自己乘自己等於 n。

    喺一個假設嘅例子入面，sigma = $18。抽 25 張單，√25 = 5，SE = 18 / 5 = $3.60。抽 100 張單，√100 = 10，SE = 18 / 10 = $1.80。

    單多咗四倍，查數嘅工夫都多咗四倍，標準誤就只係減咗一半。想將佢縮到十分一，就要一百倍嘅單。呢個就係平方根法則，亦都係精度邊際收益遞減嘅原因。

    規則：SE = sigma / √n。標準誤減半要四倍嘅樣本，所以加大 n 以前，先比較抽查成本同睇錯嘅代價。呢度假設啲單係隨機、獨立抽出嚟嘅。
