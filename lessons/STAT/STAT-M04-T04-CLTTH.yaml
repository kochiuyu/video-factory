title_en: What is the Central Limit Theorem?
title_zh: 什么是中心极限定理？
title_zh_hk: 乜嘢係中心極限定理？
objective_en: Formulate the Central Limit Theorem (CLT), explain why sample means converge to a normal distribution regardless
  of underlying population skewness when sample size reaches n >= 30, and model right-skewed Mong Kok customer spend.
objective_zh: 阐明中心极限定理（CLT）的数学内涵，解析为何当样本量达到 n >= 30 时样本均值会无视底层总体的偏态分布而收敛为正态分布，并将其应用于旺角店右偏客单消费建模。
objective_zh_hk: 闡明中心極限定理（CLT）嘅數學內涵，解析點解當樣本量達到 n >= 30 嗰陣樣本均值會無視底層總體嘅偏態分佈而收斂為正態分佈，並將其應用喺旺角舖右偏客單消費建模。
youtube:
  description_en: |
    What is the Central Limit Theorem?

    Suppose the manager of Shop A checks a random batch of receipts and gets a high average. Is that unusual, or just luck? Most receipts are one coffee, but a few are big office orders, so single receipts are right-skewed, nothing like a bell. Can she still use bell-curve tools?

    In an average, one big order is diluted by the many coffees around it, so high and low partly cancel. Draw many batches and the averages pile up evenly around the middle: a bell appears, even though single receipts stay skewed.

    The Central Limit Theorem: for a large random sample, the sample average X̄ is close to Normal, centred on mu (the true average), with width sigma / √n, the standard error. A common rule of thumb is about 30 receipts. It is a guide, not a law: heavy skew needs more, and the receipts must be drawn at random and independently.

    In an assumed example, mu = $45 and sigma = $20. With n = 64, 8 × 8 = 64, so √64 = 8 and SE = 20 / 8 = $2.50. A sample average of $50 is 50 − 45 = $5 away, and 5 / 2.50 = 2 standard errors up. About 95% of a bell lies within 2 steps, so about 2.5% lies above; a Normal table gives 2.28%.

    Rule: the bell belongs to the average, not the single receipt. A result two standard errors up is a signal worth checking, but it does not say why it happened.
  description_zh: |
    什么是中心极限定理？

    假设A店的经理随机抽了一批小票，算出来的平均偏高。这是真的不寻常，还是只是运气？大部分小票只是一杯咖啡，少数却是办公室大订单，所以单张小票是右偏的，一点也不像钟形。她还能用钟形曲线吗？

    求平均的时候，一张大单会被身边很多杯咖啡冲淡，高的和低的部分抵消。抽很多批，每批的平均会在中间两边均匀地堆起来，变成钟形，可单张小票本身还是偏的。

    中心极限定理：随机样本够大，样本平均 X̄ 就接近正态，中心是 mu（真正的平均），宽度是标准误 sigma / √n。常见的经验阈值是三十张左右。这只是参考，不是定律：偏得重就要更多，而且小票要随机、独立地抽。

    在一个假设的例子里，mu = $45，sigma = $20。抽 n = 64 张，8 × 8 = 64，所以 √64 = 8，SE = 20 / 8 = $2.50。样本平均 $50，离中间 50 − 45 = $5，5 / 2.50 = 往上 2 个标准误。钟形里大约 95% 落在两步以内，所以上面大约剩 2.5%；正态表给的是 2.28%。

    规则：钟形属于平均，不属于单张小票。往上两个标准误，值得查一查，可它不会告诉你原因。
  description_zh_hk: |
    乜嘢係中心極限定理？

    假設A店嘅經理隨機抽咗一批單，計出嚟嘅平均偏高。究竟真係唔尋常，定係只係好彩？大部分單只係一杯咖啡，但有少數係辦公室大訂單，所以單張單係右偏嘅，一啲都唔似鐘形。佢仲可唔可以用鐘形曲線？

    計平均嗰陣，一張大單會被身邊好多杯咖啡沖淡，高嘅同低嘅部分抵銷。抽好多批，每批嘅平均會喺中間兩邊均勻噉堆起嚟，變成鐘形，但單張單本身仲係偏嘅。

    中心極限定理：隨機樣本夠大，樣本平均 X̄ 就接近正態，中心係 mu（真正嘅平均），闊度係標準誤 sigma / √n。常見嘅經驗閾值係三十張左右。呢個只係參考，唔係定律：偏得重就要多啲，仲有啲單要隨機、獨立噉抽。

    喺一個假設嘅例子入面，mu = $45，sigma = $20。抽 n = 64 張，8 × 8 = 64，所以 √64 = 8，SE = 20 / 8 = $2.50。樣本平均 $50，離中間 50 − 45 = $5，5 / 2.50 = 向上 2 個標準誤。鐘形入面大約 95% 落喺兩步以內，所以上面大約剩 2.5%；正態表畀嘅係 2.28%。

    規則：鐘形屬於平均，唔屬於單張單。向上兩個標準誤，值得查一查，但佢唔會話你知原因。
