  en: Suppose the manager of Shop A checks a random batch of receipts and gets a high average. Is that unusual, or just luck?
    Most receipts are one coffee, but a few are big office orders, so single receipts are skewed, nothing like a bell. If she
    uses bell-curve tools anyway, is she fooling herself? The answer is the Central Limit Theorem.
  zh: 假设A店的经理随机抽了一批小票，算出来的平均偏高。这是真的不寻常，还是只是运气？大部分小票只是一杯咖啡，少数却是办公室的大订单，所以单张小票是偏的，一点也不像钟形。她要是照样用钟形曲线去判断，是不是在骗自己？答案就是中心极限定理。
  zh_hk: 假設A店嘅經理隨機抽咗一批單，計出嚟嘅平均偏高。究竟真係唔尋常，定係只係好彩？大部分單只係一杯咖啡，但有少數係辦公室嘅大訂單，所以單張單係偏嘅，一啲都唔似鐘形。佢如果照用鐘形曲線嚟判斷，係咪呃緊自己？答案就係中心極限定理。
- id: mechanics
  visual: two_column
  seconds: 56
  kicker: Why averages calm down
  kicker_en: Why averages calm down
  kicker_zh: 平均为什么会变乖
  kicker_zh_hk: 平均點解會乖啲
  title_en: One receipt vs an average
  title_zh: 一张小票与平均
  title_zh_hk: 一張單同平均
  left_en: 'One receipt: skewed'
  left_zh: 一张小票：偏斜
  left_zh_hk: 一張單：偏斜
  right_en: 'An average: bell-shaped'
  right_zh: 一批平均：钟形
  right_zh_hk: 一批平均：鐘形
  s1_en: Start with one receipt. It is usually a cheap coffee, but now and then a big office order.
    Draw many single receipts and you get a tall pile on the left with a long tail to the right. That shape is right skew.
  s1_zh: 先看一张小票。随便抽一张，通常是一杯便宜的咖啡，偶尔却是办公室大单。抽很多张画出来，左边一大堆，右边拖着长长的尾巴，这就是右偏。
  s1_zh_hk: 先睇一張單。是但抽一張，通常係一杯平價咖啡，間中就係辦公室大單。抽好多張畫出嚟，左邊一大堆，右邊拖住條長尾，呢個就係右偏。
  s2_en: Now average a batch of receipts instead. To get a very high average, almost every receipt in the batch must be a
    big order, and that rarely happens. One big order is diluted by the many coffees around it, so high and low partly cancel.
  s2_zh: 现在改成把一批小票求平均。想要平均很高，差不多每张都得是大单，这种事很少发生。一张大单会被身边很多杯咖啡冲淡，高的和低的部分抵消。
  s2_zh_hk: 而家改做將一批單計平均。想個平均好高，差唔多每張都要係大單，呢種事好少發生。一張大單會被身邊好多杯咖啡沖淡，高嘅同低嘅部分抵銷。
  s3_en: Draw many such batches, and the averages pile up evenly on both sides of the middle. The long tail fades, and a bell
    shape appears, even though the single receipts are still skewed.
  s3_zh: 抽很多批，每批算一个平均，这些平均就会在中间两边均匀地堆起来。长尾巴不见了，变成钟形，可单张小票本身还是偏的。
  s3_zh_hk: 抽好多批，每批計一個平均，呢啲平均就會喺中間兩邊均勻噉堆起嚟。條長尾冇咗，變成鐘形，但單張單本身仲係偏嘅。
- id: define
  visual: definition_card
  seconds: 36
  kicker: What it says
  kicker_en: What it says
  kicker_zh: 定理说什么
  kicker_zh_hk: 定理講乜
  title_en: Central Limit Theorem
  title_zh: 中心极限定理
  title_zh_hk: 中心極限定理
  formula: X̄ ≈ Normal(μ, σ / √n)
  formula_zh: X̄ ≈ 正态(μ, σ / √n)
  formula_zh_hk: X̄ ≈ 正態(μ, σ / √n)
  formula_tex: \bar{X} \approx \text{Normal}\left(\mu,\ \frac{\sigma}{\sqrt{n}}\right)
  s1_en: This pattern has a name, the Central Limit Theorem. When we take a large random sample, the sample average, X bar,
    follows close to a bell, a Normal shape, whatever the shape of the single receipts.
  s1_zh: 这个规律有名字，叫中心极限定理。随机抽一个够大的样本，样本平均 X bar 就会接近钟形，也就是正态分布，不管单张小票本身是什么形状。
  s1_zh_hk: 呢個規律有個名，叫中心極限定理。隨機抽一個夠大嘅樣本，樣本平均 X bar 就會接近鐘形，即係正態分佈，唔理單張單本身係咩形狀。
  s2_en: The bell sits at mu, the true average spend of all receipts. Its width is the standard error, sigma over the square
    root of n, where sigma is how much single receipts spread and n is how many we draw.
  s2_zh: 钟形的中心在 mu，就是全部小票真正的平均消费。它的宽度是标准误，sigma 除以根号 n。sigma 是单张小票分散得多开，n 是抽了多少张。
  s2_zh_hk: 鐘形嘅中心喺 mu，即係全部單真正嘅平均消費。佢嘅闊度係標準誤，sigma 除以 n 開方。sigma 係單張單散得幾開，n 係抽咗幾多張。
- id: enough
  visual: two_column
  seconds: 40
  kicker: How large is large?
  kicker_en: How large is large?
  kicker_zh: 多大才算大？
  kicker_zh_hk: 幾大先算大？
  title_en: A rule of thumb
  title_zh: 经验阈值
  title_zh_hk: 經驗閾值
  left_en: 'Mild skew: about 30'
  left_zh: 偏得轻：三十左右
  left_zh_hk: 偏得輕：三十左右
  right_en: 'Heavy skew: more'
  right_zh: 偏得重：要更多
  right_zh_hk: 偏得重：要多啲
  s1_en: So how large is large enough? A common rule of thumb is about thirty. It is a guide, not a law of nature.
  s1_zh: 那么，多大才算够大？常见的经验阈值是三十张左右。这只是参考，不是自然定律。
  s1_zh_hk: 咁，幾大先算夠大？常見嘅經驗閾值係三十張左右。呢個只係參考，唔係自然定律。
  s2_en: When the skew is mild, thirty or even fewer can be enough. When the skew is heavy, with rare huge orders, the average
    needs many more receipts before it looks like a bell.
  s2_zh: 偏得轻的，三十张甚至更少就够。偏得重、偶尔有超大单的，要多抽很多张，平均才会像钟形。
  s2_zh_hk: 偏得輕嘅，三十張甚至更少都夠。偏得重、間中有超大單嘅，要抽多好多張，平均先會似鐘形。
  s3_en: And size is not the only condition. The receipts must be drawn at random and independently. A big sample taken only
    from the lunch rush will not fix a biased draw.
  s3_zh: 而且样本大小不是唯一条件。小票要随机、独立地抽。只从午饭高峰抽出来的大样本，再大也救不了抽歪了的样本。
  s3_zh_hk: 而且樣本大細唔係唯一條件。啲單要隨機、獨立噉抽。淨係喺午飯繁忙時間抽出嚟嘅大樣本，幾大都救唔到抽歪咗嘅樣本。
