  step1_en: Within ±2 SE ≈ 95%
  step1_zh: ±2 个 SE 以内 ≈ 95%
  step1_zh_hk: ±2 個 SE 以內 ≈ 95%
  step2_en: 100% − 95% = 5% outside
  step2_zh: 100% − 95% = 5% 在外面
  step2_zh_hk: 100% − 95% = 5% 喺外面
  step3_en: 5% / 2 ≈ 2.5% above (table 2.28%)
  step3_zh: 5% / 2 ≈ 2.5% 在上面（查表 2.28%）
  step3_zh_hk: 5% / 2 ≈ 2.5% 喺上面（查表 2.28%）
  s1_en: How rare is two steps up? In a bell, about ninety-five percent of the averages land within two standard errors
    of the middle, on either side.
  s1_zh: 往上两步有多罕见？在钟形里，大约百分之九十五的平均，会落在中间上下两个标准误以内。
  s1_zh_hk: 向上兩步有幾罕見？喺鐘形入面，大約百分之九十五嘅平均，會落喺中間上下兩個標準誤以內。
  s2_en: So one hundred percent minus ninety-five leaves about five percent outside those two steps, split between the low
    side and the high side.
  s2_zh: 所以百分之一百减去九十五，大约剩百分之五在两步以外，一半在低的那边，一半在高的那边。
  s2_zh_hk: 所以百分之一百減九十五，大約剩百分之五喺兩步以外，一半喺低嗰邊，一半喺高嗰邊。
  s3_en: Half of five percent is about two and a half percent above. A Normal table gives the exact figure, two point two
    eight percent. Without the theorem, we could not use this bell on skewed receipts at all.
  s3_zh: 百分之五的一半，大约是百分之二点五在上面。正态表给的准确数字是百分之二点二八。没有这条定理，偏斜的小票根本没法用这个钟形。
  s3_zh_hk: 百分之五嘅一半，大約係百分之二點五喺上面。正態表畀嘅準確數字係百分之二點二八。冇呢條定理，偏斜嘅單根本冇辦法用呢個鐘形。
