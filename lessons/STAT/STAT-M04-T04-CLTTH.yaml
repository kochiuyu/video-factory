id: STAT-M04-T04-CLTTH
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Order from chaos: the Central Limit Theorem'
title_zh: 混沌中的秩序：中心极限定理与偏态驯服
title_zh_hk: 混沌中的秩序：中心極限定理與偏態馴服
objective_en: Formulate the Central Limit Theorem (CLT), explain why sample means converge to a normal distribution regardless
  of underlying population skewness when sample size reaches n >= 30, and model right-skewed Mong Kok customer spend.
objective_zh: 阐明中心极限定理（CLT）的数学内涵，解析为何当样本量达到 n >= 30 时样本均值会无视底层总体的偏态分布而收敛为正态分布，并将其应用于旺角店右偏客单消费建模。
objective_zh_hk: 闡明中心極限定理（CLT）嘅數學內涵，解析點解當樣本量達到 n >= 30 嗰陣樣本均值會無視底層總體嘅偏態分佈而收斂為正態分佈，並將其應用喺旺角舖右偏客單消費建模。
