  q2_en: What happens when the underlying metric is not continuous dollars, but discrete pastry counts?
  q2_zh: 如果分析的指标不再是连续的交易金额，而是离散跳跃的点心加购件数呢？
  q2_zh_hk: 如果分析嘅指標唔再係連續嘅交易金額，而係離散跳躍嘅點心加購件數呢？
  s1_en: Never abandon normal distribution tools just because individual customer behavior is skewed; as long as your audit
    draws thirty or more independent tickets, the CLT secures your analysis.
  s1_zh: 切勿仅因单个顾客点单偏斜就仓皇放弃正态分析武器；只要你的抽样批次达到或超过三十笔独立小票，中心极限定理便为你筑起坚实的理论护城河。
  s1_zh_hk: 切勿淨係因單個顧客點單偏斜就倉皇放棄正態分析武器；只要你嘅抽樣批次達到或者超過三十筆獨立單據，中心極限定理就為你築起堅實嘅理論護城河。
  s2_en: 'Focus executive monitoring on sample averages: they compress operational noise, smooth out unpredictable surges,
    and unlock standard risk forecasting.'
  s2_zh: 将高管层风控重心聚焦在批次均值之上：它能主动对冲运营杂音、平抑偶发脉冲大单，并解锁工业界成熟完备的正态风险预测工具箱。
  s2_zh_hk: 將高管層風控重心聚焦喺批次均值之上：佢能主動對沖營運雜音、平抑偶發脈衝大單，並解鎖工業界成熟完備嘅正態風險預測工具箱。
  s3_en: The operating rule is to trust the sample mean once n reaches 30, even if single tickets are skewed. On 64 Mong Kok
    receipts the chance of a mean above $50 is about 2.28%.
  s3_zh: 操作规则是样本量达到 30 后信任样本均值，即使单张小票偏斜。旺角 64 张小票的均值超过 $50 的概率约为 2.28%。
  s3_zh_hk: 操作規則係樣本量達到 30 之後信任樣本均值，就算單張單據偏斜。旺角 64 張單據嘅均值超過 $50 嘅概率約為 2.28%。
