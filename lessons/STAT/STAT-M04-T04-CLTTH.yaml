quiz:
- id: Q1
  type: multiple_choice
  question_en: Single receipts at a coffee shop are heavily right-skewed. According to the Central Limit Theorem, what happens
    to the shape of the sample mean's distribution as the number of random receipts n grows?
  question_zh: 一家咖啡店的单张小票严重右偏。根据中心极限定理，随机抽的小票张数 n 越来越大，样本平均的分布形状会怎样变？
  question_zh_hk: 一間咖啡店嘅單張單嚴重右偏。根據中心極限定理，隨機抽嘅單張數 n 越嚟越大，樣本平均嘅分佈形狀會點變？
  options_en:
  - 'A: It gets closer to a bell shape centred on mu, with spread sigma / √n.'
  - 'B: It stays as skewed as single receipts, because the big orders never go away.'
  - 'C: The single receipts themselves become bell-shaped once n is large.'
  - 'D: It gets wider, because a bigger sample catches more extreme orders.'
  options_zh:
  - 'A: 越来越接近以 mu 为中心的钟形，宽度是 sigma / √n。'
  - 'B: 跟单张小票一样偏，因为大单一直都在。'
  - 'C: n 大了以后，单张小票本身会变成钟形。'
  - 'D: 越来越宽，因为样本大了会抽到更多极端大单。'
  options_zh_hk:
  - 'A: 越嚟越似以 mu 為中心嘅鐘形，闊度係 sigma / √n。'
  - 'B: 同單張單一樣咁偏，因為大單一直都喺度。'
  - 'C: n 大咗以後，單張單本身會變成鐘形。'
  - 'D: 越嚟越闊，因為樣本大咗會抽到多啲極端大單。'
  answer: A
  explanation_en: In an average, the rare big orders are diluted by many ordinary ones, so the averages bunch into a bell
    around mu with spread sigma / √n. B ignores the dilution; C confuses single receipts with their average (single receipts
    stay skewed); D forgets that the spread of the average shrinks with √n.
  explanation_zh: 求平均时，少见的大单被大量普通小票冲淡，所以平均会聚成以 mu 为中心、宽度 sigma / √n 的钟形。B 忽略了冲淡；C 把单张小票和平均搞混了，单张小票还是偏的；D 忘了平均的宽度会跟着 √n 缩小。
  explanation_zh_hk: 計平均嗰陣，少見嘅大單會被大量普通單沖淡，所以平均會聚成以 mu 為中心、闊度 sigma / √n 嘅鐘形。B 忽略咗沖淡；C 將單張單同平均搞亂咗，單張單仲係偏嘅；D 唔記得平均嘅闊度會跟住 √n 縮細。
- id: Q2
  type: multiple_choice
  question_en: Suppose single receipts at Shop B are right-skewed, with mu = $40 and sigma = $15. A manager draws n = 25
    receipts at random. About how likely is a sample mean above $46?
  question_zh: 假设B店单张小票右偏，mu = $40，sigma = $15。经理随机抽 n = 25 张。样本平均超过 $46 的机会大约是多少？
  question_zh_hk: 假設B店單張單右偏，mu = $40，sigma = $15。經理隨機抽 n = 25 張。樣本平均超過 $46 嘅機會大約係幾多？
  options_en:
  - 'A: SE = 15 / 5 = $3; 46 − 40 = $6 = 2 SE; about 2.5% (table 2.28%)'
  - 'B: 6 / 15 = 0.4 sigma; about 34%, using sigma instead of SE'
  - 'C: It cannot be estimated, because single receipts are not Normal.'
  - 'D: SE = 15 / 25 = $0.60; 6 / 0.60 = 10 SE; almost 0%'
  options_zh:
  - 'A: SE = 15 / 5 = $3；46 − 40 = $6 = 2 个 SE；约 2.5%（查表 2.28%）'
  - 'B: 6 / 15 = 0.4 个 sigma；约 34%，用了 sigma 而不是 SE'
  - 'C: 没法估，因为单张小票不是正态的。'
  - 'D: SE = 15 / 25 = $0.60；6 / 0.60 = 10 个 SE；几乎是 0%'
  options_zh_hk:
  - 'A: SE = 15 / 5 = $3；46 − 40 = $6 = 2 個 SE；約 2.5%（查表 2.28%）'
  - 'B: 6 / 15 = 0.4 個 sigma；約 34%，用咗 sigma 而唔係 SE'
  - 'C: 冇得估，因為單張單唔係正態。'
  - 'D: SE = 15 / 25 = $0.60；6 / 0.60 = 10 個 SE；差唔多係 0%'
  answer: A
  explanation_en: 5 × 5 = 25, so √25 = 5 and SE = 15 / 5 = $3. The gap 46 − 40 = $6 is 6 / 3 = 2 standard errors. About
    95% of a bell lies within 2 steps, so about 2.5% lies above; a Normal table gives 2.28%. B uses sigma, the spread of one
    receipt; C forgets that the average, not the receipt, becomes bell-shaped; D divides by n instead of √n.
  explanation_zh: 5 × 5 = 25，所以 √25 = 5，SE = 15 / 5 = $3。差距 46 − 40 = $6，就是 6 / 3 = 2 个标准误。钟形里大约 95% 落在两步以内，所以上面大约剩 2.5%；正态表给的是 2.28%。B 用了单张小票的 sigma；C 忘了变成钟形的是平均，不是单张小票；D 除的是 n 不是 √n。
  explanation_zh_hk: 5 × 5 = 25，所以 √25 = 5，SE = 15 / 5 = $3。差距 46 − 40 = $6，即係 6 / 3 = 2 個標準誤。鐘形入面大約 95% 落喺兩步以內，所以上面大約剩 2.5%；正態表畀嘅係 2.28%。B 用咗單張單嘅 sigma；C 唔記得變成鐘形嘅係平均，唔係單張單；D 除嘅係 n 唔係 √n。
