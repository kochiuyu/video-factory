  s1_en: Let us work it with made-up numbers. Suppose single receipts at Shop A average forty-five dollars, with a standard
    deviation of twenty, skewed to the right. The manager draws sixty-four receipts. What number times itself gives sixty-four?
    Eight.
  s1_zh: 我们用一组假设的数字来算。假设A店单张小票平均四十五块，标准差二十块，而且右偏。经理随机抽六十四张。哪个数自己乘自己等于六十四？是八。
  s1_zh_hk: 我哋用一組假設嘅數字嚟計。假設A店單張單平均四十五蚊，標準差二十蚊，仲係右偏。經理隨機抽六十四張。邊個數自己乘自己等於六十四？係八。
  s2_en: So the standard error is twenty divided by eight, two dollars and fifty cents. Sixty-four is well past the rule of
    thumb, so the averages of sixty-four receipts form a bell around forty-five, about two fifty wide.
  s2_zh: 所以标准误是二十除以八，等于两块五。六十四张远超经验阈值，所以六十四张的平均，会在四十五块周围排成钟形，宽度大约两块五。
  s2_zh_hk: 所以標準誤係二十除以八，等於兩蚊五。六十四張遠超經驗閾值，所以六十四張嘅平均，會喺四十五蚊附近排成鐘形，闊度大約兩蚊五。
  s3_en: Her sample comes back with an average of fifty dollars. How far is that from the middle? Fifty minus forty-five is
    five dollars.
  s3_zh: 她抽出来的样本平均是五十块。离中间有多远？五十减四十五，等于五块。
  s3_zh_hk: 佢抽出嚟嘅樣本平均係五十蚊。離中間有幾遠？五十減四十五，等於五蚊。
  s4_en: Now measure that gap in standard errors. Five divided by two fifty is two. Her average sits two standard errors
    above the middle of the bell.
  s4_zh: 再用标准误来量这段距离。五除以两块五，等于二。她的平均在钟形中间往上两个标准误的位置。
  s4_zh_hk: 再用標準誤嚟量呢段距離。五除以兩蚊五，等於二。佢嘅平均喺鐘形中間向上兩個標準誤嘅位置。
