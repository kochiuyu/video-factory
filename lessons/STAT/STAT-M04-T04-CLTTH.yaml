  q1_en: 'n = 64 → SE = $2.50'
  q1_zh: 'n = 64 → SE = $2.50'
  q1_zh_hk: 'n = 64 → SE = $2.50'
  q2_en: '$50 = 2 SE up → about 2.28%'
  q2_zh: '$50 = 上 2 个 SE → 约 2.28%'
  q2_zh_hk: '$50 = 上 2 個 SE → 約 2.28%'
  s1_en: Back to the manager of Shop A. Her single receipts are skewed, but she is not fooling herself. The bell describes
    her average of sixty-four receipts, not any one receipt.
  s1_zh: 回到A店的经理。她的单张小票是偏的，可她没有骗自己。钟形描述的是六十四张小票的平均，不是任何一张小票。
  s1_zh_hk: 返到A店嘅經理。佢啲單張單係偏嘅，但佢冇呃自己。鐘形描述嘅係六十四張單嘅平均，唔係任何一張單。
  s2_en: An average of fifty dollars is two standard errors above forty-five. By luck alone, that happens only about two
    percent of the time, so it is a signal worth checking. It does not tell her why it happened.
  s2_zh: 平均五十块，比四十五块高两个标准误。光靠运气，大约只有百分之二的机会，所以值得查一查。可它不会告诉她原因是什么。
  s2_zh_hk: 平均五十蚊，比四十五蚊高兩個標準誤。單靠好彩，大約只有百分之二嘅機會，所以值得查一查。但佢唔會話畀佢知原因係乜。
  s3_en: 'So the rule: for a large random sample, treat the sample average as roughly Normal, centred on mu, with width
    sigma over root n. About thirty is a rule of thumb; heavy skew needs more.'
  s3_zh: 所以规则是：随机样本够大，就把样本平均当成大致正态，中心是 mu，宽度是 sigma 除以根号 n。三十左右只是经验阈值，偏得重就要更多。
  s3_zh_hk: 所以規則係：隨機樣本夠大，就將樣本平均當成大致正態，中心係 mu，闊度係 sigma 除以 n 開方。三十左右只係經驗閾值，偏得重就要多啲。
