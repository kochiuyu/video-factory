  title_en: Scale transforms fragmented counts into continuous certainty
  title_zh: 微观离散不足惧，规模跃迁定乾坤
  title_zh_hk: 微觀離散不足懼，規模躍遷定乾坤
  q1_en: Why should supply chain leaders never worry about discrete units when ordering at scale?
  q1_zh: 为什么供应链决策者在面对规模化大宗订货时，完全无需纠结微观层面的离散性？
  q1_zh_hk: 點解供應鏈決策者喺面對規模化大宗訂貨嗰陣，完全唔需要糾結微觀層面嘅離散性？
  q2_en: How does the Central Limit Theorem apply when the metric is a binary percentage like loyalty app scans?
  q2_zh: 当被监测的指标不再是物理件数，而是二元离散的 App 会员扫码率时，中心极限定理又当如何施展？
  q2_zh_hk: 當被監測嘅指標唔再係物理件數，而係二元離散嘅 App 會員掃碼率嗰陣，中心極限定理又當點樣施展？
  s1_en: Never attempt to model massive retail logistics with complicated combinatorial formulas; once customer volume exceeds
    thirty, aggregate discrete demands behave as clean, continuous normal variables.
  s1_zh: 切勿在规模化零售物流中使用繁冗复杂的离散组合数学；只要消费客流跨越三十大关，聚合总需求便会无缝跃迁为优雅、连续且精准的高斯正态变量。
  s1_zh_hk: 切勿喺規模化零售物流入面使用繁冗複雜嘅離散組合數學；只要消費客流跨越三十大關，聚合總需求就會無縫躍遷為優雅、連續兼且精準嘅高斯正態變量。
  s2_en: 'Buffer aggregate capacity using the square root of n: as volume scales, relative risk steadily declines, yielding
    massive margin economies of scale.'
  s2_zh: 依托根号 n 的尺度规律科学核定产能安全缓冲：随着总体规模急剧扩容，相对风控成本持续递减，这正是大型商业连锁企业无往不利的规模经济护城河。
  s2_zh_hk: 依托根號 n 嘅尺度規律科學核定產能安全緩衝：隨住總體規模急劇擴容，相對風控成本持續遞減，呢個正正係大型商業連鎖企業無往不利嘅規模經濟護城河。
  s3_en: The operating rule is to buffer the sum, not the single order. Four hundred commuters imply 300 croissants plus 1.96
    times 16, so the bake is 332.
  s3_zh: 操作规则是给总量留缓冲，而不是给单笔订单留缓冲。四百位客人对应 300 个可颂再加 1.96 乘 16，出炉数为 332。
  s3_zh_hk: 操作規則係畀總量留緩衝，而唔係畀單筆訂單留緩衝。四百位客人對應 300 個牛角包再加 1.96 乘 16，出爐數係 332。
