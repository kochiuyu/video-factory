  s1_en: 'Work it with made-up numbers. Suppose each Shop A customer averages zero point seven five croissants,
    with a standard deviation of zero point eight zero. The morning draws four hundred independent customers.'
  s1_zh: 用一组假设的数字来算。假设A店每位客人平均零点七五个可颂，标准差零点八零。早市来了四百位彼此独立的客人。
  s1_zh_hk: 用一組假設嘅數字嚟計。假設A店每位客人平均零點七五個牛角包，標準差零點八零。朝早嚟咗四百位彼此獨立嘅客人。
  s2_en: Expected total demand is four hundred times zero point seven five. That is three hundred 
    croissants at the centre of the bell.
  s2_zh: 总量的期望是四百乘零点七五，等于三百个可颂，就在钟形的中心。
  s2_zh_hk: 總量嘅期望係四百乘零點七五，等於三百個牛角包，就喺鐘形嘅中心。
  s3_en: What number times itself is four hundred? Twenty. So the square root of four hundred is 
    twenty.
  s3_zh: 哪个数自己乘自己等于四百？是二十。所以四百开根号等于二十。
  s3_zh_hk: 邊個數自己乘自己等於四百？係二十。所以四百開方等於二十。
  s4_en: 'The standard deviation of the total is twenty times zero point eight zero: sixteen croissants.
    So the morning total spreads about sixteen around three hundred.'
  s4_zh: 总量的标准差是二十乘零点八零，等于十六个可颂。早市总量在三百附近大约散开十六个。
  s4_zh_hk: 總量嘅標準差係二十乘零點八零，等於十六個牛角包。朝早總量喺三百附近大約散開十六個。
