title_en: What is the CLT for totals?
title_zh: 总量的中心极限定理是什么？
title_zh_hk: 總量嘅中心極限定理係乜？
objective_en: 'Apply the Central Limit Theorem to discrete integer customer demands, model the transition
  from individual jumpy Poisson or Binomial choices to smooth aggregate Gaussian curves, and calculate
  morning breakfast pastry production buffers.'
objective_zh: 将中心极限定理推广应用于离散整数型客户需求，解析底层跳跃的泊松或二项选择如何聚合成平滑连续的高斯正态曲线，并精准测算中央厨房早高峰点心生产备料缓冲。
objective_zh_hk: 將中心極限定理推廣應用喺離散整數型客戶需求，解析底層跳躍嘅泊松或者二項選擇點樣聚合成平滑連續嘅高斯正態曲線，並精準測算中央廚房朝高峰點心生產備料緩衝。
youtube:
  description_en: |
    What is the CLT for totals?

    Suppose Shop A sells croissants with morning coffee. Each customer buys zero, one, two, or three — never half a croissant. The kitchen still has to decide how many to bake for hundreds of customers. How can a smooth bell curve help with jumpy integer orders?

    The Central Limit Theorem is not only about averages. It also covers the total, the sum S_n of n independent orders. When n is large enough, that total is close to Normal, centred on n times mu, with spread root-n times sigma.

    In an assumed example, each customer averages mu = 0.75 croissants with sigma = 0.80. For n = 400 customers: 400 × 0.75 = 300, so the total averages 300. 20 × 20 = 400, so √400 = 20, and 20 × 0.80 = 16, so the total spreads by about 16 croissants.

    About 95% of a bell lies within ±2 steps of the middle. So baking about two standard deviations above the mean — 300 + 2 × 16 = 332 — covers most mornings without claiming an exact critical value from a later lesson.

    Rule: plan the total, not the single order. Discrete steps look jumpy one by one, but at scale the sum behaves like a smooth bell whose relative width shrinks with √n.
  description_zh: |
    总量的中心极限定理是什么？

    假设A店早市卖可颂配咖啡。每位客人买零个、一个、两个或三个——从来不会买半个。厨房却要为几百位客人决定烤多少。平滑的钟形曲线，怎么帮得上跳跃的整数订单？

    中心极限定理不只讲平均，也管总量：n 笔独立订单加起来的总和 S_n。n 够大时，这个总量接近正态，中心是 n 倍的 mu，宽度是根号 n 倍的 sigma。

    在一个假设的例子里，每位客人平均 mu = 0.75 个可颂，sigma = 0.80。n = 400 位客人：400 × 0.75 = 300，所以总量平均是 300。20 × 20 = 400，所以 √400 = 20，再 20 × 0.80 = 16，总量大约散开 16 个。

    钟形里大约 95% 落在中间上下两步以内。所以比平均大约高出两个标准差去烤——300 + 2 × 16 = 332——能盖住大多数早晨，也不用提前搬出后面课才教的临界值。

    规则：给总量做计划，不要盯着单笔订单。一个一个看是跳跃的整数，规模一大，总和就像平滑的钟形，相对宽度跟着 √n 缩小。
  description_zh_hk: |
    總量嘅中心極限定理係乜？

    假設A店朝早賣牛角包配咖啡。每位客人買零個、一個、兩個或者三個——從來唔會買半個。廚房卻要為幾百位客人決定焗幾多。平滑嘅鐘形曲線，點樣幫到跳躍嘅整數訂單？

    中心極限定理唔淨係講平均，亦都管總量：n 筆獨立訂單加起嚟嘅總和 S_n。n 夠大嗰陣，呢個總量接近正態，中心係 n 倍嘅 mu，闊度係 √n 倍嘅 sigma。

    喺一個假設嘅例子入面，每位客人平均 mu = 0.75 個牛角包，sigma = 0.80。n = 400 位客人：400 × 0.75 = 300，所以總量平均係 300。20 × 20 = 400，所以 √400 = 20，再 20 × 0.80 = 16，總量大約散開 16 個。

    鐘形入面大約 95% 落喺中間上下兩步以內。所以比平均大約高兩個標準差去焗——300 + 2 × 16 = 332——可以蓋住大多數朝早，亦都唔使提前搬出後面課先教嘅臨界值。

    規則：畀總量做計劃，唔好死盯單筆訂單。一個一個睇係跳躍嘅整數，規模一大，總和就似平滑嘅鐘形，相對闊度跟住 √n 縮細。
