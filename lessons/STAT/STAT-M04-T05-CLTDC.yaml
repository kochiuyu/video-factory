  en: 'Suppose Shop A sells croissants with morning coffee. Each customer buys zero, one, two, or three
    — never a half. Bake too few and the rush sells out; bake too many and the extras go stale. How can
    a smooth bell curve help with orders that only jump in whole pieces? The answer is the Central Limit
    Theorem for totals.'
  zh: 
    假设A店早市卖可颂配咖啡。每位客人买零个、一个、两个或三个——从来不会买半个。烤少了，高峰会卖断；烤多了，多出来的会变陈。平滑的钟形曲线，怎么帮得上只按整件跳动的订单？答案就是管总量的中心极限定理。
  zh_hk: 
    假設A店朝早賣牛角包配咖啡。每位客人買零個、一個、兩個或者三個——從來唔會買半個。焗少咗，高峰會賣晒；焗多咗，多出嚟嘅會變舊。平滑嘅鐘形曲線，點樣幫到淨係按整件跳動嘅訂單？答案就係管總量嘅中心極限定理。
- id: counts
  visual: freq_bars
  seconds: 42
  kicker: One customer
  kicker_en: One customer
  kicker_zh: 一位客人
  kicker_zh_hk: 一位客人
  title_en: Orders jump in whole pieces
  title_zh: 订单按整件跳动
  title_zh_hk: 訂單按整件跳動
  labels_en: 0;1;2;3
  labels_zh: 0;1;2;3
  labels_zh_hk: 0;1;2;3
  counts: 45;40;10;5
  mark: none
  footer_en: Suppose 100 tickets · mean ≈ 0.75
  footer_zh: 假设 100 张小票 · 均值 ≈ 0.75
  footer_zh_hk: 假設 100 張單 · 均值 ≈ 0.75
  s1_en: 'Start with one customer. The possible buys are zero, one, two, or three croissants. There is
    no half on the axis.'
  s1_zh: 先看一位客人。可能买的是零个、一个、两个或三个可颂。轴上没有半个。
  s1_zh_hk: 先睇一位客人。可能買嘅係零個、一個、兩個或者三個牛角包。軸上冇半個。
  s2_en: 'Suppose one hundred morning tickets look like this. Forty-five buy none, forty buy one, ten
    buy two, and five buy three. The bars jump from bar to bar.'
  s2_zh: 假设一百张早市小票是这样：四十五位不买，四十位买一个，十位买两个，五位买三个。柱子一根一根跳。
  s2_zh_hk: 假設一百張朝早單係噉：四十五位唔買，四十位買一個，十位買兩個，五位買三個。柱一根一根跳。
  s3_en: 'That picture is discrete. A planner who thinks only in single tickets sees jumps, not a smooth
    curve. The kitchen, though, cares about the total across hundreds of tickets.'
  s3_zh: 这幅图是离散的。只盯着单张小票的人，看到的是跳跃，不是平滑曲线。可厨房在意的，是几百张小票加起来的总量。
  s3_zh_hk: 呢幅圖係離散嘅。淨係盯住單張單嘅人，見到嘅係跳躍，唔係平滑曲線。但廚房在意嘅，係幾百張單加起嚟嘅總量。
- id: define
  visual: definition_card
  seconds: 40
  kicker: What it says
  kicker_en: What it says
  kicker_zh: 定理说什么
  kicker_zh_hk: 定理講乜
  title_en: CLT for the sum
  title_zh: 总和的中心极限定理
  title_zh_hk: 總和嘅中心極限定理
  formula: 'S_n ≈ Normal(nμ, √n · σ)'
  formula_zh: 'S_n ≈ 正态(nμ, √n · σ)'
  formula_zh_hk: 'S_n ≈ 正態(nμ, √n · σ)'
  formula_tex: 'S_n = \sum_{i=1}^{n} X_i \approx \mathrm{Normal}\!\left(n\mu,\ \sqrt{n}\,\sigma\right)'
  s1_en: 'Most lessons first show the Central Limit Theorem on the sample average. For a kitchen, the
    useful object is the total. Call the sum of n independent orders S_n. That sum is just n times the
    average.'
  s1_zh: 多数课先用样本平均讲中心极限定理。对厨房来说，有用的是总量。把 n 笔独立订单加起来，叫做 S_n。这个总和就是平均乘上 n。
  s1_zh_hk: 多數課先用樣本平均講中心極限定理。對廚房嚟講，有用嘅係總量。將 n 筆獨立訂單加起嚟，叫做 S_n。呢個總和就係平均乘上 n。
  s2_en: 'When n is large enough, S_n is close to a Normal bell. The centre is n times mu. The spread
    is root n times sigma. Large enough is a guide, not a law: heavy jumps need more tickets, and the
    orders must be independent.'
  s2_zh: n 够大时，S_n 接近正态钟形。中心是 n 倍的 mu。宽度是根号 n 倍的 sigma。够大只是参考，不是定律：跳得凶要更多小票，而且订单要彼此独立。
  s2_zh_hk: n 夠大嗰陣，S_n 接近正態鐘形。中心係 n 倍嘅 mu。闊度係 √n 倍嘅 sigma。夠大只係參考，唔係定律：跳得兇要多啲單，而且訂單要彼此獨立。
- id: mechanics
  visual: two_column
  seconds: 48
  kicker: Scale effect
  kicker_en: Scale effect
  kicker_zh: 规模效应
  kicker_zh_hk: 規模效應
  title_en: Mean grows faster than spread
  title_zh: 均值比波动长得快
  title_zh_hk: 均值比波動長得快
  left_en: 'Mean of total: grows with n'
  left_zh: 总量均值：跟 n 一起长
  left_zh_hk: 總量均值：跟 n 一齊長
  right_en: 'SD of total: grows with √n'
  right_zh: 总量标准差：跟 √n 一起长
  right_zh_hk: 總量標準差：跟 √n 一齊長
  s1_en: 'Watch the two growth rates. Double the customers and the expected total doubles. The standard
    deviation of the total only grows by the square root of that factor — about forty-one percent, not
    one hundred.'
  s1_zh: 看这两种增长速度。客人翻倍，总量的期望也翻倍。总量的标准差只按根号那个倍数变大——大约多四成，不是翻倍。
  s1_zh_hk: 睇呢兩種增長速度。客人加一倍，總量嘅期望都加一倍。總量嘅標準差淨係按 √ 嗰個倍數變大——大約多四成，唔係加一倍。
  s2_en: 'So the relative wobble, the standard deviation divided by the mean, shrinks like one over root
    n. A busy morning is steadier, as a share of total volume, than a quiet one.'
  s2_zh: 所以相对晃动——标准差除以均值——会像一比根号 n 那样缩小。忙碌的早市，相对总量来说，比冷清的早市更稳。
  s2_zh_hk: 所以相對晃動——標準差除以均值——會好似一比 √n 噉縮細。忙碌嘅朝早，相對總量嚟講，比冷清嘅朝早穩陣啲。
  s3_en: 'That is why a planner can treat the morning total as a smooth bell and set a bake buffer from
    the middle and the spread, instead of counting every combinatorial path of who bought zero, one, or
    two.'
  s3_zh: 所以规划的人可以把早市总量当成平滑钟形，从中心和宽度去定烤量缓冲，而不用穷举谁买了零个、一个还是两个。
  s3_zh_hk: 所以規劃嘅人可以把朝早總量當成平滑鐘形，由中心同闊度去定焗量緩衝，而唔使窮舉邊個買咗零個、一個定兩個。
