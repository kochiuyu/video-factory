id: STAT-M04-T05-CLTDC
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: CLT on discrete demands
title_zh: 离散需求的连续跃迁：中心极限定理与烘焙批次聚合
title_zh_hk: 離散需求的連續躍遷：中心極限定理與烘焙批次聚合
objective_en: Apply the Central Limit Theorem to discrete integer customer demands, model the transition from individual jumpy
  Poisson or Binomial choices to smooth aggregate Gaussian curves, and calculate morning breakfast pastry production buffers.
objective_zh: 将中心极限定理推广应用于离散整数型客户需求，解析底层跳跃的泊松或二项选择如何聚合成平滑连续的高斯正态曲线，并精准测算中央厨房早高峰点心生产备料缓冲。
objective_zh_hk: 將中心極限定理推廣應用喺離散整數型客戶需求，解析底層跳躍嘅泊松或者二項選擇點樣聚合成平滑連續嘅高斯正態曲線，並精準測算中央廚房朝高峰點心生產備料緩衝。
