  kicker: A high bake
  kicker_en: A high bake
  kicker_zh: 偏高的烤量
  kicker_zh_hk: 偏高嘅焗量
  title_en: Two steps above the middle
  title_zh: 中心往上两步
  title_zh_hk: 中心向上兩步
  step1_en: 'Within ±2 SD ≈ 95%'
  step1_zh: '±2 个 SD 以内 ≈ 95%'
  step1_zh_hk: '±2 個 SD 以內 ≈ 95%'
  step2_en: 'About 2.5% above the middle'
  step2_zh: '大约 2.5% 在中心上面'
  step2_zh_hk: '大約 2.5% 喺中心上面'
  step3_en: 300 + 2 × 16 = 332
  step3_zh: 300 + 2 × 16 = 332
  step3_zh_hk: 300 + 2 × 16 = 332
  s1_en: 'How high should the bake sit? In a bell, about ninety-five percent of mornings land within two
    standard deviations of the middle, on either side.'
  s1_zh: 烤量要定多高？在钟形里，大约百分之九十五的早市，会落在中心上下两个标准差以内。
  s1_zh_hk: 焗量應該定幾高？喺鐘形入面，大約百分之九十五嘅朝早，會落喺中心上下兩個標準差以內。
  s2_en: 'That leaves about five percent outside. Roughly half of that five percent sits above the middle:
    about two and a half percent.'
  s2_zh: 大约剩百分之五在两步以外。这百分之五里大约一半在中心上面，也就是大约百分之二点五。
  s2_zh_hk: 大約剩百分之五喺兩步以外。呢百分之五入面大約一半喺中心上面，亦即係大約百分之二點五。
  s3_en: 'So bake two standard deviations above the mean: three hundred plus two times sixteen equals
    three hundred thirty-two. That is a high buffer from the total, without borrowing a later critical
    value.'
  s3_zh: 所以比平均高出两个标准差去烤：三百加二乘十六，等于三百三十二。这是按总量定的高缓冲，也不用提前借用后面才教的临界值。
  s3_zh_hk: 所以比平均高兩個標準差去焗：三百加二乘十六，等於三百三十二。呢個係按總量定嘅高緩衝，亦都唔使提前借用後面先教嘅臨界值。
- id: takeaway
  visual: takeaway
  seconds: 50
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Plan the total
  title_zh: 给总量做计划
  title_zh_hk: 畀總量做計劃
  q1_en: 'S_n ≈ Normal(nμ, √n · σ)'
  q1_zh: 'S_n ≈ 正态(nμ, √n · σ)'
  q1_zh_hk: 'S_n ≈ 正態(nμ, √n · σ)'
  q2_en: 400 guests → bake 332
  q2_zh: 400 位客人 → 烤 332
  q2_zh_hk: 400 位客人 → 焗 332
  s1_en: 'Back to Shop A. Single orders jump in whole croissants, but the kitchen is not stuck counting
    combinations. When many independent orders add up, the total follows a smooth bell.'
  s1_zh: 回到A店。单笔订单按整只可颂跳动，可厨房不必困在组合计数里。许多独立订单加在一起，总量就会走平滑钟形。
  s1_zh_hk: 返到A店。單筆訂單按成隻牛角包跳動，但廚房唔使困喺組合計數入面。好多獨立訂單加喺一齊，總量就會行平滑鐘形。
  s2_en: 'With four hundred customers, the centre is three hundred and the spread is sixteen. Two steps
    above that centre is three hundred thirty-two — a high bake from the total, not from any one ticket.'
  s2_zh: 四百位客人时，中心是三百，宽度是十六。中心往上两步是三百三十二——这是按总量定的高烤量，不是按某一张小票。
  s2_zh_hk: 四百位客人嗰陣，中心係三百，闊度係十六。中心向上兩步係三百三十二——呢個係按總量定嘅高焗量，唔係按某一張單。
  s3_en: 'So the rule: for enough independent orders, treat the total S_n as roughly Normal, centred on
    n times mu, with width root n times sigma. Relative risk shrinks with root n. Plan the sum, not the
    single order.'
  s3_zh: 所以规则是：独立订单够多，就把总量 S_n 当成大致正态，中心是 n 倍 mu，宽度是根号 n 倍 sigma。相对风险跟着根号 n 缩小。给总和做计划，不要盯着单笔。
  s3_zh_hk: 所以規則係：獨立訂單夠多，就將總量 S_n 當成大致正態，中心係 n 倍 mu，闊度係 √n 倍 sigma。相對風險跟住 √n 縮細。畀總和做計劃，唔好死盯單筆。
