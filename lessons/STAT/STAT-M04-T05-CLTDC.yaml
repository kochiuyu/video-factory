quiz:
- id: Q1
  type: multiple_choice
  question_en: 'Why can a bakery plan total croissant demand for 400 morning customers with a continuous
    Normal curve, even though each customer buys only an integer count (0, 1, 2, or 3)?'
  question_zh: 尽管每位客人只能买整数个可颂（0、1、2 或 3 个），为什么厨房仍可用连续的正态曲线来规划 400 位早餐客人的总需求？
  question_zh_hk: 儘管每位客人淨係可以買整數個牛角包（0、1、2 或 3 個），點解廚房仲可以用連續嘅正態曲線嚟規劃 400 位早餐客人嘅總需求？
  options_en:
  - 'A: Because the sum S_n of many independent discrete orders is close to Normal when n is large.'
  - 'B: Because the average of 400 orders has the same jumpy shape as one order.'
  - 'C: Because once n hits 30, every single customer order becomes continuous.'
  - 'D: Because Normal curves only work for money amounts, never for counts.'
  options_zh:
  - 'A: 因为大量独立离散订单的总和 S_n，在 n 够大时接近正态。'
  - 'B: 因为 400 笔订单的平均，形状仍跟单笔订单一样跳跃。'
  - 'C: 因为只要 n 到 30，每一笔客人订单本身都会变成连续的。'
  - 'D: 因为正态曲线只适用于金额，从来不适用于件数。'
  options_zh_hk:
  - 'A: 因為大量獨立離散訂單嘅總和 S_n，喺 n 夠大嗰陣接近正態。'
  - 'B: 因為 400 筆訂單嘅平均，形狀仲係同單筆訂單一樣跳躍。'
  - 'C: 因為只要 n 到 30，每一筆客人訂單本身都會變成連續。'
  - 'D: 因為正態曲線只適用於金額，從來不適用於件數。'
  answer: A
  explanation_en: 'The CLT covers sums as well as averages. S_n = n × X-bar is close to N(n*mu, n*sigma^2)
    when n is large, so the integer steps look tiny next to the total. B confuses the sum with one order;
    C treats n≈30 as a law that changes each order; D invents a false limit on what Normal can describe.'
  explanation_zh: '中心极限定理同样管总和。n 够大时，S_n = n × X-bar 接近 N(n*mu, n*sigma^2)，整数台阶相对总量就显得很小。B 把总和跟单笔搞混；C
    把大约三十当成会改变每笔订单的定律；D 虚构了正态不能描述件数。'
  explanation_zh_hk: '中心極限定理同樣管總和。n 夠大嗰陣，S_n = n × X-bar 接近 N(n*mu, n*sigma^2)，整數台階相對總量就顯得好細。B 將總和同單筆搞亂；C
    將大約三十當成會改變每筆訂單嘅定律；D 虛構咗正態唔可以描述件數。'
- id: Q2
  type: multiple_choice
  question_en: 'Suppose muffin add-on demand per customer at Shop B has mu = 0.80 and sigma = 1.00. Across
    n = 225 morning customers, what are the mean and standard deviation of total muffin demand?'
  question_zh: 假设B店每位客人的松饼加购量均值 mu = 0.80，标准差 sigma = 1.00。早市 n = 225 位客人，松饼总需求的均值与标准差是多少？
  question_zh_hk: 假設B店每位客人嘅鬆餅加購量均值 mu = 0.80，標準差 sigma = 1.00。朝市 n = 225 位客人，鬆餅總需求嘅均值同標準差係幾多？
  options_en:
  - 'A: Mean = 225 × 0.80 = 180; SD = √225 × 1.00 = 15 × 1 = 15'
  - 'B: Mean = 180; SD = 225 × 1.00 = 225'
  - 'C: Mean = 0.80; SD = 1.00 / √225 = 1/15'
  - 'D: Mean = 225; SD = 15'
  options_zh:
  - 'A: 均值 = 225 × 0.80 = 180；标准差 = √225 × 1.00 = 15 × 1 = 15'
  - 'B: 均值 = 180；标准差 = 225 × 1.00 = 225'
  - 'C: 均值 = 0.80；标准差 = 1.00 / √225 = 1/15'
  - 'D: 均值 = 225；标准差 = 15'
  options_zh_hk:
  - 'A: 均值 = 225 × 0.80 = 180；標準差 = √225 × 1.00 = 15 × 1 = 15'
  - 'B: 均值 = 180；標準差 = 225 × 1.00 = 225'
  - 'C: 均值 = 0.80；標準差 = 1.00 / √225 = 1/15'
  - 'D: 均值 = 225；標準差 = 15'
  answer: A
  explanation_en: 'For the sum S_n: E[S_n] = n × mu = 225 × 0.80 = 180. SD(S_n) = √n × sigma = 15 × 1.00
    = 15. B multiplies sigma by n instead of √n; C quotes the SE of the average, not the SD of the total;
    D sets the mean to n.'
  explanation_zh: 对总和 S_n：期望 = n × mu = 225 × 0.80 = 180。标准差 = √n × sigma = 15 × 1.00 = 15。B 把 sigma
    乘了 n 而不是 √n；C 说的是平均的标准误，不是总量的标准差；D 把均值当成了 n。
  explanation_zh_hk: 對總和 S_n：期望 = n × mu = 225 × 0.80 = 180。標準差 = √n × sigma = 15 × 1.00 = 15。B 將 
    sigma 乘咗 n 而唔係 √n；C 講嘅係平均嘅標準誤，唔係總量嘅標準差；D 將均值當成咗 n。
