title_en: What is a sample proportion?
title_zh: 样本比例是什么？
title_zh_hk: 樣本比例係乜？
objective_en: Model sample proportions p-hat = X / n as random variables, derive the standard error
  SE_p = sqrt(p(1 - p) / n), check the success-failure condition (np and n(1 - p) at least
  10), and read a loyalty-app scan gap against sampling noise.
objective_zh: 将样本比例 p-hat = X / n 建模为随机变量，推导比例标准误 SE_p = 根号(p(1 - p) / n)，核验成功-失败条件（np 与 n(1 - p) 均至少为 10），并用抽样噪声解读会员扫码落差。
objective_zh_hk: 將樣本比例 p-hat = X / n 建模為隨機變量，推導比例標準誤 SE_p = 根號(p(1 - p) / n)，核驗成功-失敗條件（np 同 n(1 - p) 均至少為 10），並用抽樣雜音解讀會員掃碼落差。
youtube:
  description_en: |
    What is a sample proportion?

    Suppose Shop A wants thirty percent of counter tickets to scan its loyalty app. A random check of two hundred tickets finds fifty-two scans — twenty-six percent. Is that a real miss, or ordinary sampling noise?

    A sample proportion p-hat is just the share of ones in a yes-or-no sample: one if the ticket scanned, zero if it did not. Its centre is the true rate p. Its standard error is the square root of p times (1 - p) divided by n.

    Before you read that gap with a Normal bell, check the success-failure rule of thumb: expected scans np and expected non-scans n(1 - p) should both be at least about ten. With p = 0.30 and n = 200, that is 60 and 140 — both fine.

    Worked numbers: 52 / 200 = 0.26. Then 0.30 × 0.70 = 0.21, 0.21 / 200 = 0.00105, and √0.00105 ≈ 0.0324. The gap 0.26 - 0.30 = -0.04, so Z ≈ -0.04 / 0.0324 ≈ -1.23. About ninety-five percent of a bell sits within about two standard errors of the middle, so |Z| ≈ 1.23 is ordinary noise — not proof the shop missed the target.

    Rule: score a share against SE = √(p(1-p)/n), after the success-failure check. A few points off in a few hundred tickets is often sampling wobble, not a finished verdict.
  description_zh: |
    样本比例是什么？

    假设A店希望百分之三十的柜台小票扫会员码。随机抽查两百张，只有五十二张扫了——百分之二十六。这是真的没达标，还是普通的抽样噪声？

    样本比例 p-hat 就是是非样本里「是」的份额：扫了记 1，没扫记 0。它的中心是真实比率 p。标准误是 p 乘 (1 - p) 再除以 n，然后开根号。

    用正态钟形读这个落差之前，先看成功-失败的经验规矩：预期扫码次数 np、预期未扫次数 n(1 - p)，都最好至少大约十次。p = 0.30、n = 200 时，是 60 和 140——都够。

    算一遍：52 / 200 = 0.26。接着 0.30 × 0.70 = 0.21，0.21 / 200 = 0.00105，√0.00105 ≈ 0.0324。落差 0.26 - 0.30 = -0.04，所以 Z ≈ -0.04 / 0.0324 ≈ -1.23。钟形里大约百分之九十五落在中心上下大约两个标准误以内，所以 |Z| ≈ 1.23 仍是普通噪声——不能当成门店没达标的铁证。

    规则：先做成功-失败检查，再用 SE = √(p(1-p)/n) 衡量份额落差。几百张小票里差几个点，常常是抽样晃动，不是最终判决。
  description_zh_hk: |
    樣本比例係乜？

    假設A店希望百分之三十櫃檯單掃會員碼。隨機抽查兩百張，淨係五十二張掃咗——百分之二十六。呢個係真嘅冇達標，定係普通抽樣雜音？

    樣本比例 p-hat 就係是非樣本入面「是」嘅份額：掃咗記 1，冇掃記 0。佢嘅中心係真實比率 p。標準誤係 p 乘 (1 - p) 再除以 n，然後開方。

    用正態鐘形讀呢個落差之前，先睇成功-失敗嘅經驗規矩：預期掃碼次數 np、預期未掃次數 n(1 - p)，都最好至少大約十次。p = 0.30、n = 200 嗰陣，係 60 同 140——都夠。

    計一次：52 / 200 = 0.26。跟住 0.30 × 0.70 = 0.21，0.21 / 200 = 0.00105，√0.00105 ≈ 0.0324。落差 0.26 - 0.30 = -0.04，所以 Z ≈ -0.04 / 0.0324 ≈ -1.23。鐘形入面大約百分之九十五落喺中心上下大約兩個標準誤以內，所以 |Z| ≈ 1.23 仲係普通雜音——唔可以當成門市冇達標嘅鐵證。

    規則：先做成功-失敗檢查，再用 SE = √(p(1-p)/n) 衡量份額落差。幾百張單入面差幾個點，好多時係抽樣晃動，唔係最終判決。
