  q1_en: Why is a raw percentage drop in a small sample never conclusive proof of failure?
  q1_zh: 为什么小样本中原始百分比的微弱下滑，绝不能作为判定运营失败的铁证？
  q1_zh_hk: 點解小樣本入面原始百分比嘅微弱下滑，絕唔可以作為判定營運失敗嘅鐵證？
  q2_en: What happens when our total customer or asset population is small and finite rather than infinite?
  q2_zh: 当所审计的资产或顾客总体规模高度受限且有限时，抽样标准误该如何二次校准？
  q2_zh_hk: 當所審計嘅資產或者顧客總體規模高度受限兼且有限嗰陣，抽樣標準誤應該點樣二次校準？
  s1_en: Never evaluate percentage performance without checking its standard error; a four percent deficit on two hundred
    customers is ordinary variance, not managerial failure.
  s1_zh: 考核比率绩效切忌脱离标准误盲目下结论；在两百张小票的样本中出现四个点的落差，纯属统计学允许的随机浮动，绝非管理层的运营渎职。
  s1_zh_hk: 考核比率績效切忌脫離標準誤盲目下結論；喺兩百張單據嘅樣本入面出現四個點嘅落差，純屬統計學容許嘅隨機浮動，絕非管理層嘅營運瀆職。
  s2_en: 'Always confirm the success-failure condition before applying Z-scores: verify that both np and n times one minus
    p reach ten to keep your conclusions statistically sound.'
  s2_zh: 调用 Z 分数研判比例异动前，务必先检核成功-失败法则：确保 np 与 n 乘 1 减 p 均达到十次，方能立于严密无懈的科学法度之上。
  s2_zh_hk: 調用 Z 分數研判比例異動前，務必先檢核成功-失敗法則：確保 np 同 n 乘 1 減 p 均達到十次，先可以立於嚴密無懈嘅科學法度之上。
  s3_en: The operating rule is to score the gap against the proportion standard error. Fifty-two scans out of 200 is Z about
    -1.23, inside ordinary noise around a 30% target.
  s3_zh: 操作规则是用比例标准误衡量落差。200 笔中 52 次扫码，Z 约为 -1.23，落在 30% 目标的普通噪声内。
  s3_zh_hk: 操作規則係用比例標準誤衡量落差。200 筆入面 52 次掃碼，Z 約為 -1.23，落喺 30% 目標嘅普通雜音內。
