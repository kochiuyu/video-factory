quiz:
- id: Q1
  type: multiple_choice
  question_en: 'Before you model a sample proportion p-hat with a Normal curve, which
    rule of thumb should you check on the planned sample?'
  question_zh: 在用正态曲线为样本比例 p-hat 建模之前，应该先在计划样本上核验哪条经验规矩？
  question_zh_hk: 喺用正態曲線為樣本比例 p-hat 建模之前，應該先喺計劃樣本上核驗邊條經驗規矩？
  options_en:
  - 'A: Success-failure: expected scans np and expected non-scans n(1 - p) are both at least about 10.'
  - 'B: The sample size n must be at least 30, and then Normal is automatic.'
  - 'C: The sample proportion p-hat itself must be greater than 0.50.'
  - 'D: Use the receipt-dollar SE formula σ/√n instead of a proportion SE.'
  options_zh:
  - 'A: 成功-失败：预期扫码 np 与预期未扫 n(1 - p) 都至少大约为 10。'
  - 'B: 只要样本量 n 至少为 30，正态就自动成立。'
  - 'C: 样本比例 p-hat 本身必须大于 0.50。'
  - 'D: 改用金额标准误公式 σ/√n，而不是比例标准误。'
  options_zh_hk:
  - 'A: 成功-失敗：預期掃碼 np 同預期未掃 n(1 - p) 都至少大約為 10。'
  - 'B: 只要樣本量 n 至少為 30，正態就自動成立。'
  - 'C: 樣本比例 p-hat 本身必須大過 0.50。'
  - 'D: 改用金額標準誤公式 σ/√n，而唔係比例標準誤。'
  answer: A
  explanation_en: 'A proportion is a mean of zeros and ones, so a Normal model needs
    enough expected hits on both sides. The usual check is np and n(1 - p) both at least
    about 10. B treats n≈30 as a law; C constrains the observed share, not the plan;
    D borrows the wrong SE.'
  explanation_zh: '比例是一串 0 和 1 的平均，所以正态模型需要两边都有足够的预期次数。常用检查是 np 与 n(1 - p) 都至少大约为 10。B 把大约三十当成定律；C 限制的是观测份额而不是计划；D 借错了标准误。'
  explanation_zh_hk: '比例係一串 0 同 1 嘅平均，所以正態模型需要兩邊都有足夠嘅預期次數。常用檢查係 np 同 n(1 - p) 都至少大約為 10。B 將大約三十當成定律；C 限制嘅係觀測份額而唔係計劃；D 借錯咗標準誤。'
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B targets p = 0.20 app scans. In n = 100 tickets, X = 14
    scan (p-hat = 0.14). What are the proportion SE and Z-score?'
  question_zh: 假设B店目标扫码率 p = 0.20。抽查 n = 100 张小票，有 X = 14 张扫码（p-hat = 0.14）。比例标准误与 Z 分数是多少？
  question_zh_hk: 假設B店目標掃碼率 p = 0.20。抽查 n = 100 張單，有 X = 14 張掃碼（p-hat = 0.14）。比例標準誤同 Z 分數係幾多？
  options_en:
  - 'A: SE = √(0.20 × 0.80 / 100) = √0.0016 = 0.04; Z = (0.14 - 0.20) / 0.04 = -1.50'
  - 'B: SE = 0.20 / √100 = 0.02; Z = (0.14 - 0.20) / 0.02 = -3.00'
  - 'C: SE = √(0.14 × 0.86 / 100) ≈ 0.0347; Z ≈ -1.73'
  - 'D: SE = √(100 × 0.20 × 0.80) = 4; Z = -1.50'
  options_zh:
  - 'A: SE = √(0.20 × 0.80 / 100) = √0.0016 = 0.04；Z = (0.14 - 0.20) / 0.04 = -1.50'
  - 'B: SE = 0.20 / √100 = 0.02；Z = (0.14 - 0.20) / 0.02 = -3.00'
  - 'C: SE = √(0.14 × 0.86 / 100) ≈ 0.0347；Z ≈ -1.73'
  - 'D: SE = √(100 × 0.20 × 0.80) = 4；Z = -1.50'
  options_zh_hk:
  - 'A: SE = √(0.20 × 0.80 / 100) = √0.0016 = 0.04；Z = (0.14 - 0.20) / 0.04 = -1.50'
  - 'B: SE = 0.20 / √100 = 0.02；Z = (0.14 - 0.20) / 0.02 = -3.00'
  - 'C: SE = √(0.14 × 0.86 / 100) ≈ 0.0347；Z ≈ -1.73'
  - 'D: SE = √(100 × 0.20 × 0.80) = 4；Z = -1.50'
  answer: A
  explanation_en: 'SE uses the planned rate p, not p-hat: √(p(1-p)/n) = √(0.16/100) = 0.04.
    Then Z = (0.14 - 0.20) / 0.04 = -1.50. B drops the (1-p) factor; C plugs p-hat into
    the SE; D computes the count SD √(np(1-p)), not the proportion SE.'
  explanation_zh: '标准误用计划比率 p，不用 p-hat：√(p(1-p)/n) = √(0.16/100) = 0.04。然后 Z = (0.14 - 0.20) / 0.04 = -1.50。B 丢掉了 (1-p)；C 把 p-hat 塞进了标准误；D 算的是次数标准差 √(np(1-p))，不是比例标准误。'
  explanation_zh_hk: '標準誤用計劃比率 p，唔用 p-hat：√(p(1-p)/n) = √(0.16/100) = 0.04。然後 Z = (0.14 - 0.20) / 0.04 = -1.50。B 掉咗 (1-p)；C 將 p-hat 塞入咗標準誤；D 計嘅係次數標準差 √(np(1-p))，唔係比例標準誤。'
