quiz:
- id: Q1
  type: multiple_choice
  question_en: What operational condition must be satisfied to justify using a Normal distribution to model the sample proportion
    p-hat of digital loyalty scans?
  question_zh: 在运用正态分布对数字化会员扫码样本比例 p-hat 进行建模推演前，必须在业务数据上严格核验哪项充分性判定准则？
  question_zh_hk: 喺運用正態分佈對數碼化會員掃碼樣本比例 p-hat 進行建模推演前，必須喺業務數據上嚴格核驗邊項充分性判定準則？
  options_en:
  - 'A: The success-failure condition: both expected successes np and expected failures n(1 - p) must equal or exceed 10.'
  - 'B: The total number of audited receipts must exceed 100,000 transactions.'
  - 'C: The store must only accept digital wallet payments and ban all physical cash.'
  - 'D: The sample proportion p-hat must be strictly greater than 0.50.'
  options_zh:
  - 'A: 成功-失败准则：预期成功次数 np 与预期失败次数 n(1 - p) 必须双双大于或等于 10。'
  - 'B: 参与审计的收银小票总流水必须硬性突破十万笔交易。'
  - 'C: 门店必须全线禁用现金找零，实现百分之百移动电子支付。'
  - 'D: 实际测算出的样本比例 p-hat 必须严格大于 0.50（50%）。'
  options_zh_hk:
  - 'A: 成功-失敗準則：預期成功次數 np 同預期失敗次數 n(1 - p) 必須雙雙大過或等於 10。'
  - 'B: 參與審計嘅收銀單據總流水必須硬性突破十萬筆交易。'
  - 'C: 門市必須全線禁用現金找續，實現百分之百流動電子支付。'
  - 'D: 實際測算出嘅樣本比例 p-hat 必須嚴格大過 0.50（50%）。'
  answer: A
  explanation_en: Under the Central Limit Theorem for Bernoulli sums, the sampling distribution of p-hat converges to Normal
    only when both np >= 10 and n(1 - p) >= 10, preventing boundary skew near 0 or 1.
  explanation_zh: 基于伯努利求和的中心极限定理，只有当预期成功 np 与预期失败 n(1 - p) 均不小于 10 时，二项阶梯才能摆脱贴近 0 或 1 边界的严重偏斜，收敛为对称平滑的正态分布。
  explanation_zh_hk: 基於伯努利求和嘅中心極限定理，淨係得當預期成功 np 同預期失敗 n(1 - p) 均唔細過 10 嗰陣，二項階梯先可以擺脫貼近 0 或者 1 邊界嘅嚴重偏斜，收斂為對稱平滑嘅正態分佈。
- id: Q2
  type: multiple_choice
  question_en: Metro's benchmark app adoption rate is p = 0.30. In an audit of n = 200 Airport counter orders, 52 patrons
    scan the app (p-hat = 0.26). What is the standard error and resulting Z-score of this outcome?
  question_zh: 都市咖啡全网设定的会员扫码基准渗透率为 p = 0.30。在机场店抽查的 n = 200 笔柜台订单中，实测 52 位顾客扫码（p-hat = 0.26）。该结果的抽样标准误 SE 与对应的 Z 分数分别是多少？
  question_zh_hk: 都市咖啡全網設定嘅會員掃碼基準滲透率為 p = 0.30。喺機場舖抽查嘅 n = 200 筆櫃檯訂單入面，實測 52 位顧客掃碼（p-hat = 0.26）。嗰個結果嘅抽樣標準誤 SE 同對應嘅 Z 分數分別係幾多？
  options_en:
  - 'A: SE = sqrt(0.30 * 0.70 / 200) = sqrt(0.00105) ≈ 0.0324 (3.24%); Z = (0.26 - 0.30) / 0.0324 ≈ -1.23'
  - 'B: SE = 0.30 / sqrt(200) ≈ 0.0212; Z = (0.26 - 0.30) / 0.0212 ≈ -1.89'
  - 'C: SE = 0.26 * 0.74 = 0.1924; Z = -0.04'
  - 'D: SE = sqrt(200 * 0.30 * 0.70) ≈ 6.48; Z = -4.00'
  options_zh:
  - 'A: 比例标准误 SE = 根号(0.30 × 0.70 / 200) ≈ 0.0324（3.24%）；Z = (0.26 - 0.30) / 0.0324 ≈ -1.23'
  - 'B: 比例标准误 SE = 0.30 / 根号(200) ≈ 0.0212；Z = (0.26 - 0.30) / 0.0212 ≈ -1.89'
  - 'C: 比例标准误 SE = 0.26 × 0.74 = 0.1924；Z = -0.04'
  - 'D: 比例标准误 SE = 根号(200 × 0.30 × 0.70) ≈ 6.48；Z = -4.00'
  options_zh_hk:
  - 'A: 比例標準誤 SE = 根號(0.30 × 0.70 / 200) ≈ 0.0324（3.24%）；Z = (0.26 - 0.30) / 0.0324 ≈ -1.23'
  - 'B: 比例標準誤 SE = 0.30 / 根號(200) ≈ 0.0212；Z = (0.26 - 0.30) / 0.0212 ≈ -1.89'
  - 'C: 比例標準誤 SE = 0.26 × 0.74 = 0.1924；Z = -0.04'
  - 'D: 比例標準誤 SE = 根號(200 × 0.30 × 0.70) ≈ 6.48；Z = -4.00'
  answer: A
  explanation_en: 'Variance of p-hat is p(1 - p) / n = 0.21 / 200 = 0.00105, giving SE = sqrt(0.00105) ≈ 0.0324. Standardizing:
    Z = (0.26 - 0.30) / 0.0324 = -1.23. The deviation is within ordinary sampling noise (|Z| < 1.96).'
  explanation_zh: 样本比例方差为 p(1 - p) / n = 0.21 / 200 = 0.00105，开根号得 SE ≈ 0.0324。计算标准化 Z = -0.04 / 0.0324 = -1.23。因绝对值小于 1.96，该下滑属于合理的抽样随机扰动。
  explanation_zh_hk: 樣本比例方差為 p(1 - p) / n = 0.21 / 200 = 0.00105，開根號得 SE ≈ 0.0324。計算標準化 Z = -0.04 / 0.0324 = -1.23。因絕對值細過
    1.96，嗰個下滑屬於合理嘅抽樣隨機擾動。
