  title_en: 'Shop A: SE of the share'
  title_zh: A店：份额的标准误
  title_zh_hk: A店：份額嘅標準誤
  step1_en: 'p=0.30 · n=200 · X=52'
  step1_zh: 'p=0.30 · n=200 · X=52'
  step1_zh_hk: 'p=0.30 · n=200 · X=52'
  step2_en: 52 / 200 = 0.26
  step2_zh: 52 / 200 = 0.26
  step2_zh_hk: 52 / 200 = 0.26
  step3_en: 0.30 × 0.70 = 0.21
  step3_zh: 0.30 × 0.70 = 0.21
  step3_zh_hk: 0.30 × 0.70 = 0.21
  step4_en: 0.21 / 200 = 0.00105
  step4_zh: 0.21 / 200 = 0.00105
  step4_zh_hk: 0.21 / 200 = 0.00105
  step5_en: '√0.00105 ≈ 0.0324'
  step5_zh: '√0.00105 ≈ 0.0324'
  step5_zh_hk: '√0.00105 ≈ 0.0324'
  s1_en: 'Use made-up Shop A numbers. The planned rate is zero point three zero. The
    sample has two hundred tickets and fifty-two scans.'
  s1_zh: 用一组假设的A店数字。计划比率是零点三零。样本有两百张小票、五十二次扫码。
  s1_zh_hk: 用一組假設嘅A店數字。計劃比率係零點三零。樣本有兩百張單、五十二次掃碼。
  s2_en: 'Fifty-two divided by two hundred is zero point two six. That is p-hat —
    the sample share on the screen.'
  s2_zh: 五十二除以两百等于零点二六。这就是 p-hat——屏幕上的样本份额。
  s2_zh_hk: 五十二除以兩百等於零點二六。呢個就係 p-hat——屏幕上嘅樣本份額。
  s3_en: 'For the variance piece, multiply zero point three zero by zero point seven
    zero. That is zero point two one.'
  s3_zh: 先算方差那一块：零点三零乘零点七零，得到零点二一。
  s3_zh_hk: 先計方差嗰一塊：零點三零乘零點七零，得到零點二一。
  s4_en: 'Divide that by the sample size: zero point two one over two hundred equals
    zero point zero zero one zero five.'
  s4_zh: 再除以样本量：零点二一除以两百，等于零点零零一零五。
  s4_zh_hk: 再除以樣本量：零點二一除以兩百，等於零點零零一零五。
  s5_en: 'The standard error is the square root of that. Square root of zero point
    zero zero one zero five is about zero point zero three two four — roughly three
    point two percent.'
  s5_zh: 标准误就是它开根号。零点零零一零五开根号，大约零点零三二四——大约三个百分点。
  s5_zh_hk: 標準誤就係佢開方。零點零零一零五開方，大約零點零三二四——大約三個百分點。
