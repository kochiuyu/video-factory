title_en: The sampling distribution of proportions
title_zh: 比率的度量衡：样本比例的抽样分布与数字化渗透率
title_zh_hk: 比率嘅度量衡：樣本比例嘅抽樣分佈與數碼化滲透率
objective_en: Model sample proportions p-hat = X / n as random variables, derive the standard error formula SE_p = sqrt(p(1
  - p) / n), verify the success-failure normal approximation condition (np >= 10 and n(1 - p) >= 10), and evaluate Metro Loyalty
  QR scan compliance.
objective_zh: 将样本比例 p-hat = X / n 建模为随机变量，推导比例标准误公式 SE_p = 根号(p(1 - p) / n)，核验成功-失败正态近似判定准则（np >= 10 且 n(1 - p) >= 10），并在机场分店会员
  App 扫码审计中识别真伪异动。
objective_zh_hk: 將樣本比例 p-hat = X / n 建模為隨機變量，推導比例標準誤公式 SE_p = 根號(p(1 - p) / n)，核驗成功-失敗正態近似判定準則（np >= 10 且 n(1 - p) >= 10），並喺機場分舖會員
  App 掃碼審計入面識別真偽異動。
