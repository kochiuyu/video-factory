  title_en: Score the share against SE
  title_zh: 用标准误衡量份额
  title_zh_hk: 用標準誤衡量份額
  q1_en: 'SE = √(p(1−p)/n)'
  q1_zh: 'SE = √(p(1−p)/n)'
  q1_zh_hk: 'SE = √(p(1−p)/n)'
  q2_en: '52/200 → Z ≈ −1.23'
  q2_zh: '52/200 → Z ≈ −1.23'
  q2_zh_hk: '52/200 → Z ≈ −1.23'
  s1_en: 'Back to Shop A. Fifty-two scans out of two hundred looked like a miss. Against
    a three-point SE, Z about negative one point two three is still ordinary noise.'
  s1_zh: 回到A店。两百张里五十二次扫码，看起来像没达标。对照大约三个百分点的标准误，Z 大约负一点二三，仍是普通噪声。
  s1_zh_hk: 返到A店。兩百張入面五十二次掃碼，睇落好似冇達標。對照大約三個百分點嘅標準誤，Z 大約負一點二三，仲係普通雜音。
  s2_en: 'Check success-failure first, then score the gap with SE equals the square
    root of p times one minus p over n. Do not treat a few points off as a finished
    verdict.'
  s2_zh: 先做成功-失败检查，再用标准误衡量落差：根号下 p 乘一减 p 再除以 n。不要把差几个点当成最终判决。
  s2_zh_hk: 先做成功-失敗檢查，再用標準誤衡量落差：根號下 p 乘一減 p 再除以 n。唔好將差幾個點當成最終判決。
  s3_en: 'The operating rule is simple: a sample share wobbles. Read it in standard
    errors before you call the process broken.'
  s3_zh: 操作规则很简单：样本份额会晃。先用标准误来读，再谈流程是不是坏了。
  s3_zh_hk: 操作規則好簡單：樣本份額會晃。先用標準誤嚟讀，再傾流程係咪壞咗。
