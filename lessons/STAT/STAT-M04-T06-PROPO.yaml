  title_zh_hk: 樣本比例係乜？
  en: 'Suppose Shop A wants thirty percent of counter tickets to scan its loyalty
    app. A random check of two hundred tickets finds fifty-two scans — twenty-six
    percent. Before anyone treats that as a failed process, ask: is the miss real,
    or ordinary sampling noise? The tool for that question is the sampling distribution
    of a sample proportion.'
  zh: 假设A店希望百分之三十的柜台小票扫会员码。随机抽查两百张，只有五十二张扫了——百分之二十六。在把这当成流程失败之前，先问：落差是真的，还是普通抽样噪声？回答这个问题的工具，就是样本比例的抽样分布。
  zh_hk: 假設A店希望百分之三十櫃檯單掃會員碼。隨機抽查兩百張，淨係五十二張掃咗——百分之二十六。喺將呢個當成流程失敗之前，先問：落差係真，定係普通抽樣雜音？回答呢個問題嘅工具，就係樣本比例嘅抽樣分佈。
- id: define
  visual: definition_card
  seconds: 40
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: p-hat is a share of ones
  title_zh: p-hat 是一的份额
  title_zh_hk: p-hat 係一嘅份額
  formula: 'p̂ ≈ Normal(p, √(p(1−p)/n))'
  formula_zh: 'p̂ ≈ 正态(p, √(p(1−p)/n))'
  formula_zh_hk: 'p̂ ≈ 正態(p, √(p(1−p)/n))'
  formula_tex: '\hat{p} \approx N\left(p,\ \sqrt{\frac{p(1-p)}{n}}\right)'
  s1_en: 'A sample proportion is the average of zeros and ones. Mark one when the
    ticket scans the app, and zero when it does not. Divide the ones by n, and you
    have p-hat.'
  s1_zh: 样本比例就是一串零和一的平均。小票扫了码记一，没扫记零。把一的个数除以 n，就是 p-hat。
  s1_zh_hk: 樣本比例就係一串零同一嘅平均。單掃咗碼記一，冇掃記零。將一嘅個數除以 n，就係 p-hat。
  s2_en: 'Because p-hat is an average, it has a sampling centre and a sampling spread.
    The centre is the true rate p. The standard error is the square root of p times
    one minus p, all over n.'
  s2_zh: 因为 p-hat 是一种平均，它有抽样中心，也有抽样宽度。中心是真实比率 p。标准误是 p 乘一减 p，再除以 n，然后开根号。
  s2_zh_hk: 因為 p-hat 係一種平均，佢有抽樣中心，亦都有抽樣闊度。中心係真實比率 p。標準誤係 p 乘一減 p，再除以 n，然後開方。
- id: condition
  visual: steps
  layout: rows
  seconds: 48
  kicker: Before the bell
  kicker_en: Before the bell
  kicker_zh: 动用钟形之前
  kicker_zh_hk: 用鐘形之前
  title_en: Success-failure check
  title_zh: 成功-失败检查
  title_zh_hk: 成功-失敗檢查
  step1_en: 'Need np ≥ 10'
  step1_zh: '需要 np ≥ 10'
  step1_zh_hk: '需要 np ≥ 10'
  step2_en: 'Need n(1−p) ≥ 10'
  step2_zh: '需要 n(1−p) ≥ 10'
  step2_zh_hk: '需要 n(1−p) ≥ 10'
  step3_en: '200×0.30=60 · 200×0.70=140'
  step3_zh: '200×0.30=60 · 200×0.70=140'
  step3_zh_hk: '200×0.30=60 · 200×0.70=140'
  s1_en: 'Shares live between zero and one. When p is near a wall — a rare fraud rate,
    say — the binomial pile leans hard, and a symmetric bell is a poor picture.'
  s1_zh: 份额夹在零和一之间。当 p 贴着墙——比如很少见的作弊率——二项堆会严重偏斜，对称钟形就不合适。
  s1_zh_hk: 份額夾喺零同一之間。當 p 貼住牆——好似好少見嘅作弊率——二項堆會嚴重偏斜，對稱鐘形就唔合適。
  s2_en: 'So before you read p-hat with Normal tools, use a rule of thumb: expected
    scans np, and expected non-scans n times one minus p, should both be at least about
    ten. It is a guide, not a law.'
  s2_zh: 所以用正态工具读 p-hat 之前，先用一条经验规矩：预期扫码次数 np，以及预期未扫次数 n 乘一减 p，都最好至少大约十次。这是参考，不是定律。
  s2_zh_hk: 所以用正態工具讀 p-hat 之前，先用一條經驗規矩：預期掃碼次數 np，以及預期未掃次數 n 乘一減 p，都最好至少大約十次。呢個係參考，唔係定律。
  s3_en: 'Shop A planned two hundred tickets at thirty percent. Two hundred times
    zero point three zero is sixty. Two hundred times zero point seven zero is one
    hundred forty. Both clear ten, so the Normal picture is usable here.'
  s3_zh: A店计划两百张、百分之三十。两百乘零点三零是六十。两百乘零点七零是一百四十。两边都过十，这里可以用正态图来读。
  s3_zh_hk: A店計劃兩百張、百分之三十。兩百乘零點三零係六十。兩百乘零點七零係一百四十。兩邊都過十，呢度可以用正態圖嚟讀。
