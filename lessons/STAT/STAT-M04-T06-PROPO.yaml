  step2_zh_hk: '−0.04 / 0.0324 ≈ −1.23'
  step3_en: '|−1.23| within 2 SE'
  step3_zh: '|−1.23| 在 2 SE 内'
  step3_zh_hk: '|−1.23| 喺 2 SE 內'
  s1_en: 'Now measure the gap. Zero point two six minus zero point three zero is negative
    zero point zero four — four percentage points below the plan.'
  s1_zh: 现在量落差。零点二六减零点三零，是负的零点零四——比计划低四个百分点。
  s1_zh_hk: 而家量落差。零點二六減零點三零，係負嘅零點零四——比計劃低四個百分點。
  s2_en: 'Divide by the standard error. Negative zero point zero four over zero point
    zero three two four is about negative one point two three. That is the Z-score
    — how many standard errors below the centre.'
  s2_zh: 再除以标准误。负零点零四除以零点零三二四，大约负一点二三。这就是 Z 分数——比中心低了几个标准误。
  s2_zh_hk: 再除以標準誤。負零點零四除以零點零三二四，大約負一點二三。呢個就係 Z 分數——比中心低咗幾個標準誤。
  s3_en: 'In a bell, about ninety-five percent of sample shares land within about
    two standard errors of the middle. Absolute one point two three is inside that
    window, so the four-point miss is ordinary sampling noise — not proof the process
    failed.'
  s3_zh: 在钟形里，大约百分之九十五的样本份额会落在中心上下大约两个标准误以内。绝对值一点二三仍在这个窗口里，所以四个点的落差是普通抽样噪声——不能证明流程失败。
  s3_zh_hk: 喺鐘形入面，大約百分之九十五嘅樣本份額會落喺中心上下大約兩個標準誤以內。絕對值一點二三仲喺呢個窗口入面，所以四個點嘅落差係普通抽樣雜音——唔能夠證明流程失敗。
