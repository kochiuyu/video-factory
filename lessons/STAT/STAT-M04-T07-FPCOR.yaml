  kicker_zh_hk: 商業法度
  title_en: Claim the statistical dividend of small closed systems
  title_zh: 收割封闭总体确定性红利，守住有限视界精算底线
  title_zh_hk: 收割封閉總體確定性紅利，守住有限視界精算底線
  q1_en: Why does sampling without replacement yield higher precision than sampling with replacement?
  q1_zh: 为什么无放回抽样的估算精度天然高于有放回抽样？
  q1_zh_hk: 點解無放回抽樣嘅估算精度天然高過有放回抽樣？
  q2_en: When should executives reject requests to expand equipment audit sample sizes?
  q2_zh: 高管层在何时应当断然拒绝技术团队盲目追加设备抽检样本量的申请？
  q2_zh_hk: 高管層喺幾時應當斷然拒絕技術團隊盲目追加設備抽檢樣本量嘅申請？
  s1_en: Never use the infinite population standard error when auditing closed asset fleets; whenever your sample exceeds
    five percent of total inventory, apply the FPC to claim the precision you already bought.
  s1_zh: 巡检封闭资产底册时，切勿盲目套用无限总体标准误；只要抽样份额超过总资产的百分之五，务必启用 FPC，全额兑现你本就应得的高估算精度。
  s1_zh_hk: 巡檢封閉資產底冊嗰陣，切勿盲目套用無限總體標準誤；只要抽樣份額超過總資產嘅百分之五，務必啟用 FPC，全額兌現你本來就應得嘅高估算精度。
  s2_en: 'Audit budgets must account for finite gains: when thirty percent of the fleet is already inspected, the FPC shrinks
    your margin of error, making expensive extra teardowns wasteful.'
  s2_zh: 资产审计预算必须考虑有限修正带来的信息红利：当三成机队已被核验时，FPC 已显著压缩误差区间，继续盲目拆检只会徒增沉没成本。
  s2_zh_hk: 資產審計預算必須考慮有限修正帶嚟嘅信息紅利：當三成機隊已經被核驗嗰陣，FPC 已經顯著壓縮誤差區間，繼續盲目拆檢淨係會徒增沉沒成本。
  s3_en: The operating rule is to apply the finite correction once the draw exceeds 5% of a closed fleet. Forty of 120 machines
    cuts the standard error from 2.37 to 1.94 points.
  s3_zh: 操作规则是封闭机队抽样超过 5% 时乘上有限修正。120 台中抽 40 台，标准误由 2.37 分降到 1.94 分。
  s3_zh_hk: 操作規則係封閉機隊抽樣超過 5% 嗰陣乘上有限修正。120 部入面抽 40 部，標準誤由 2.37 分降到 1.94 分。
