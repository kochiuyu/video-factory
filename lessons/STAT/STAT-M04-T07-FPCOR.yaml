title_en: What is the finite population correction?
title_zh: 有限总体修正是什么？
title_zh_hk: 有限總體修正係乜？
objective_en: Calculate the Finite Population Correction (FPC) factor for sampling without replacement, apply the 5% threshold
  rule (n / N > 0.05) to adjust the standard error of the mean, and evaluate boiler maintenance wear across Metro's commercial
  espresso machine fleet.
objective_zh: 计算无放回抽样下的有限总体修正（FPC）系数，运用 5% 抽样比例阈值法则（n / N > 0.05）校准样本均值的标准误，并在都市咖啡商用浓缩咖啡机机队锅炉磨损巡检中实现精准审计。
objective_zh_hk: 計算無放回抽樣下嘅有限總體修正（FPC）系數，運用 5% 抽樣比例閾值法則（n / N > 0.05）校準樣本均值嘅標準誤，並喺都市咖啡商用濃縮咖啡機機隊鍋爐磨損巡檢入面實現精準審計。
youtube:
  description_en: |
    What is the finite population correction?

    Suppose Shop A runs a closed fleet of exactly 120 espresso machines. Maintenance draws 40 machines without putting any back. Textbooks often write SE = sigma / sqrt(n) as if the pool never shrinks. Covering one-third of a closed fleet is not that world.

    When you sample without replacement from a finite population of size N, each draw removes an unknown unit. The Finite Population Correction (FPC) is the square root of (N minus n) over (N minus 1). Multiply the usual SE by that factor.

    A common rule of thumb: if n / N is at most about 5%, FPC is almost 1 and you can ignore it. If the fraction is larger, apply the correction. If n equals N, FPC is 0 — a full census has no sampling error left.

    Worked numbers (made-up): N = 120, n = 40, sigma = 15. Then 40 / 120 = 33.3%, so FPC is needed. (120 - 40) / (120 - 1) = 80 / 119, and sqrt(80 / 119) is about 0.820. Raw SE = 15 / sqrt(40) is about 2.37. Corrected SE = 2.37 times 0.820 is about 1.94 points.

    Rule: for a closed fleet, when the draw exceeds about 5% of N, multiply SE by FPC. Claiming the precision you already bought stops you from overpaying for extra teardowns.
  description_zh: |
    有限总体修正是什么？

    假设A店有一支封闭机队，正好一百二十台浓缩咖啡机。维保无放回抽了四十台。教科书常写 SE = sigma / 根号 n，好像总体永远不会变小。抽到封闭机队的三分之一，不是那个世界。

    从容量为 N 的有限总体无放回抽样时，每抽一台就少一个未知单元。有限总体修正（FPC）是 (N 减 n) 除以 (N 减 1)，再开根号。把通常的标准误乘上这个系数。

    常用经验规矩：若 n / N 大约不超过 5%，FPC 几乎是 1，可以忽略。份额更大时，就要乘修正。若 n 等于 N，FPC 是 0——全量普查没有抽样误差。

    假设数字：N = 120，n = 40，sigma = 15。40 / 120 = 33.3%，需要 FPC。(120 - 40) / (120 - 1) = 80 / 119，根号(80 / 119) 大约 0.820。原始 SE = 15 / 根号(40) 大约 2.37。修正后 SE = 2.37 乘 0.820 大约 1.94 分。

    规则：封闭机队抽样大约超过总体 5% 时，把 SE 乘上 FPC。把已经买到的精度算进去，就少花冤枉钱去多拆机器。
  description_zh_hk: |
    有限總體修正係乜？

    假設A店有一支封閉機隊，剛好一百二十部濃縮咖啡機。維保無放回抽咗四十部。教科書成日寫 SE = sigma / 根號 n，好似總體永遠唔會變細。抽到封閉機隊三分一，唔係嗰個世界。

    由容量為 N 嘅有限總體無放回抽樣嗰陣，每抽一部就少一個未知單元。有限總體修正（FPC）係 (N 減 n) 除以 (N 減 1)，再開方。將通常嘅標準誤乘上呢個系數。

    常用經驗規矩：若果 n / N 大約唔超過 5%，FPC 幾乎係 1，可以忽略。份額更大嗰陣，就要乘修正。若果 n 等於 N，FPC 係 0——全量普查冇抽樣誤差。

    假設數字：N = 120，n = 40，sigma = 15。40 / 120 = 33.3%，需要 FPC。(120 - 40) / (120 - 1) = 80 / 119，根號(80 / 119) 大約 0.820。原始 SE = 15 / 根號(40) 大約 2.37。修正後 SE = 2.37 乘 0.820 大約 1.94 分。

    規則：封閉機隊抽樣大約超過總體 5% 嗰陣，將 SE 乘上 FPC。將已經買到嘅精度計入去，就少花冤枉錢去多拆機器。
