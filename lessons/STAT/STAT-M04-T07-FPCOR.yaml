  step2_zh: '修正 SE = (σ / √n) × FPC'
  step2_zh_hk: '修正 SE = (σ / √n) × FPC'
  step3_en: 'If n = N, FPC = 0'
  step3_zh: '若 n = N，FPC = 0'
  step3_zh_hk: '若 n = N，FPC = 0'
  s1_en: 'First compute the usual standard error: sigma over the square root of n —
    as if the fleet never shrank.'
  s1_zh: 先算通常的标准误：sigma 除以根号 n——假装机队从来没有变小。
  s1_zh_hk: 先計通常嘅標準誤：sigma 除以根號 n——當機隊從來冇變細。
  s2_en: 'Then multiply by FPC. That is the corrected standard error for sampling
    without replacement from a finite fleet.'
  s2_zh: 再乘上 FPC。这就是从有限机队无放回抽样时，校准后的标准误。
  s2_zh_hk: 再乘上 FPC。呢個就係由有限機隊無放回抽樣嗰陣，校準後嘅標準誤。
