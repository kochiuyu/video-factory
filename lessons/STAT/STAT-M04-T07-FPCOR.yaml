quiz:
- id: Q1
  type: multiple_choice
  question_en: When sampling without replacement from a finite population of size N, why does drawing a large fraction of
    the population (n / N larger than about 0.05) shrink the standard error of the sample mean below sigma / sqrt(n)?
  question_zh: 在总体容量为 N 的有限总体中进行无放回抽样时，为什么当抽样比例大约超过 5%（n / N 大于约 0.05）后，样本均值的真实标准误会小于 sigma / 根号(n)？
  question_zh_hk: 喺總體容量為 N 嘅有限總體入面進行無放回抽樣嗰陣，點解當抽樣比例大約超過 5%（n / N 大過約 0.05）之後，樣本均值嘅真實標準誤會細過 sigma / 根號(n)？
  options_en:
  - 'A: Because each sampled unit removes uncertainty about the remaining population; if you inspect all N units, the sampling
    error drops to exactly zero.'
  - 'B: Because a larger sample always multiplies the usual SE by n / N.'
  - 'C: Because the Central Limit Theorem only applies when N is at least one million.'
  - 'D: Because equipment fleets must use SE = sigma / n instead of sigma / sqrt(n).'
  options_zh:
  - 'A: 因为每无放回地抽检一台设备，就锁定了总体的部分真值并消除了剩余未知；若抽检全量 N 台，抽样误差将降为零。'
  - 'B: 因为更大的样本总是把通常的标准误直接乘上 n / N。'
  - 'C: 因为中心极限定理只有在 N 至少一百万时才适用。'
  - 'D: 因为设备机队必须用 SE = sigma / n，而不是 sigma / 根号(n)。'
  options_zh_hk:
  - 'A: 因為每無放回噉抽檢一部設備，就鎖定咗總體嘅部分真值並消除咗剩餘未知；若果抽檢全量 N 部，抽樣誤差將降為零。'
  - 'B: 因為更大嘅樣本總係將通常嘅標準誤直接乘上 n / N。'
  - 'C: 因為中心極限定理淨係喺 N 至少一百萬嗰陣先適用。'
  - 'D: 因為設備機隊必須用 SE = sigma / n，而唔係 sigma / 根號(n)。'
  answer: A
  explanation_en: In sampling without replacement, draws are not independent. As sample size n approaches population size
    N, the remaining pool of unknown units shrinks. At n = N, the census is complete, FPC = sqrt(0) = 0, and standard error
    becomes 0.
  explanation_zh: 在无放回抽样中，各次抽取不再相互独立。随着样本量 n 逐步逼近总体总量 N，未被核查的未知单元越来越少。当 n = N 时普查完成，FPC = 根号(0) = 0，抽样标准误降为零。
  explanation_zh_hk: 喺無放回抽樣入面，各次抽取唔再相互獨立。隨住樣本量 n 逐步逼近總體總量 N，未被核查嘅未知單元越嚟越少。當 n = N 嗰陣普查完成，FPC = 根號(0) = 0，抽樣標準誤降為零。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B audits n = 25 machines from a closed fleet of N = 100. Wear sigma = 10.0 points. What are the
    FPC and the corrected SE of the mean?'
  question_zh: 假设B店从封闭机队 N = 100 台中无放回抽检 n = 25 台。磨损标准差 sigma = 10.0 分。有限总体修正系数（FPC）与校准后的标准误分别是多少？
  question_zh_hk: 假設B店由封閉機隊 N = 100 部入面無放回抽檢 n = 25 部。磨損標準差 sigma = 10.0 分。有限總體修正系數（FPC）同校準後嘅標準誤分別係幾多？
  options_en:
  - 'A: FPC = sqrt((100 - 25) / 99) = sqrt(75 / 99) ≈ 0.870; Corrected SE = (10 / sqrt(25)) × 0.870 = 2.00 × 0.870 ≈ 1.74
    points'
  - 'B: FPC = 25 / 100 = 0.25; Corrected SE = 2.00 × 0.25 = 0.50 points'
  - 'C: FPC = sqrt(25 / 100) = 0.50; Corrected SE = 10 × 0.50 = 5.00 points'
  - 'D: FPC = 1.000; Corrected SE = 10 / sqrt(25) = 2.00 points, because n = 25 is large enough to skip the correction'
  options_zh:
  - 'A: FPC = 根号((100 - 25) / 99) = 根号(75 / 99) ≈ 0.870；校准后标准误 = (10 / 根号(25)) × 0.870 = 2.00 × 0.870 ≈ 1.74 分'
  - 'B: FPC = 25 / 100 = 0.25；校准后标准误 = 2.00 × 0.25 = 0.50 分'
  - 'C: FPC = 根号(25 / 100) = 0.50；校准后标准误 = 10 × 0.50 = 5.00 分'
  - 'D: FPC = 1.000；校准后标准误 = 10 / 根号(25) = 2.00 分，因为 n = 25 已经够大，可以不做修正'
  options_zh_hk:
  - 'A: FPC = 根號((100 - 25) / 99) = 根號(75 / 99) ≈ 0.870；校準後標準誤 = (10 / 根號(25)) × 0.870 = 2.00 × 0.870 ≈ 1.74 分'
  - 'B: FPC = 25 / 100 = 0.25；校準後標準誤 = 2.00 × 0.25 = 0.50 分'
  - 'C: FPC = 根號(25 / 100) = 0.50；校準後標準誤 = 10 × 0.50 = 5.00 分'
  - 'D: FPC = 1.000；校準後標準誤 = 10 / 根號(25) = 2.00 分，因為 n = 25 已經夠大，可以唔做修正'
  answer: A
  explanation_en: 'Sampling fraction is 25 / 100 = 25% — larger than about 5%, so FPC is required. FPC = sqrt((100 - 25) /
    (100 - 1)) = sqrt(75 / 99) ≈ 0.870. Unadjusted SE = 10 / sqrt(25) = 2.00. Adjusted SE = 2.00 × 0.870 ≈ 1.74 points. B multiplies
    by the fraction itself; C uses the wrong radicand; D skips the correction because n looks "large," which is the n≥30 myth
    applied to the wrong place.'
  explanation_zh: '抽样比例为 25 / 100 = 25%，大约超过 5%，必须启用 FPC。FPC = 根号((100 - 25) / 99) = 根号(75 / 99) ≈ 0.870。未修正标准误为 10 / 根号(25) = 2.00。修正后标准误 = 2.00 × 0.870 ≈ 1.74 分。B 直接乘了抽样比；C 开错了根号；D 因为 n 看起来“够大”就跳过修正，把大约三十的神话用错了地方。'
  explanation_zh_hk: '抽樣比例為 25 / 100 = 25%，大約超過 5%，必須啟用 FPC。FPC = 根號((100 - 25) / 99) = 根號(75 / 99) ≈ 0.870。未修正標準誤為 10 / 根號(25) = 2.00。修正後標準誤 = 2.00 × 0.870 ≈ 1.74 分。B 直接乘咗抽樣比；C 開錯咗根號；D 因為 n 睇落「夠大」就跳過修正，將大約三十嘅神話用錯咗地方。'
