    you do not need. The fix is the finite population correction.'
  zh: 假设A店一共正好一百二十台浓缩咖啡机——一支封闭机队，不是无尽的小票海。维保无放回抽了四十台。通常公式说标准误是 sigma 除以根号 n。但封闭机队的三分之一，不是无限总体。如果你忽略这一点，要么低估了审计已经有的精度，要么为不需要的拆检多花钱。补上的工具，就是有限总体修正。
  zh_hk: 假設A店一共剛好一百二十部濃縮咖啡機——一支封閉機隊，唔係無盡嘅單海。維保無放回抽咗四十部。通常公式話標準誤係 sigma 除以根號 n。但封閉機隊嘅三分一，唔係無限總體。若果你忽略呢一點，要么低估咗審計已經有嘅精度，要么為唔需要嘅拆檢多使錢。補上嘅工具，就係有限總體修正。
- id: define
  visual: definition_card
  seconds: 42
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: FPC shrinks the SE
  title_zh: FPC 把标准误收窄
  title_zh_hk: FPC 將標準誤收窄
  formula: 'FPC = √((N − n) / (N − 1))'
  formula_zh: 'FPC = 根号((N − n) / (N − 1))'
  formula_zh_hk: 'FPC = 根號((N − n) / (N − 1))'
  formula_tex: '\text{FPC} = \sqrt{\frac{N - n}{N - 1}}'
  s1_en: 'Ordinary sampling formulas treat the pool as endless, or as sampling with
    replacement — each draw leaves the unknown pool unchanged.'
  s1_zh: 普通抽样公式把总体当成无穷大，或者当成有放回抽样——每次抽取都不会让未知池变小。
  s1_zh_hk: 普通抽樣公式將總體當成無窮大，或者當成有放回抽樣——每次抽取都唔會令未知池變細。
  s2_en: 'In a machine audit we sample without replacement. N is the fleet size, n
    is how many we open. FPC is the square root of (N minus n) over (N minus 1) —
    almost always below one, so it pulls the usual SE down.'
  s2_zh: 机队巡检是无放回抽样。N 是机队台数，n 是打开的台数。FPC 是 (N 减 n) 除以 (N 减 1) 再开根号——几乎总小于一，所以会把通常的标准误往下拉。
  s2_zh_hk: 機隊巡檢係無放回抽樣。N 係機隊部數，n 係打開嘅部數。FPC 係 (N 減 n) 除以 (N 減 1) 再開方——幾乎總細過一，所以會將通常嘅標準誤往下拉。
