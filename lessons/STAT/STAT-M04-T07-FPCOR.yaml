    so the correction is tiny and often skipped.'
  s1_zh: 常用经验规矩：当抽样比例 n 比 N 大约不超过百分之五时，FPC 几乎是一——大约大于零点九九七——修正很小，常常可以跳过。
  s1_zh_hk: 常用經驗規矩：當抽樣比例 n 比 N 大約唔超過百分之五嗰陣，FPC 幾乎係一——大約大過零點九九七——修正好細，好多時可以跳過。
  s2_en: 'Once the draw takes more than about five percent of the fleet, skipping
    FPC inflates the standard error. Your audit looks less precise than it really is.'
  s2_zh: 一旦抽样大约超过机队的百分之五，跳过 FPC 会把标准误虚增。审计看起来比实际更不精确。
