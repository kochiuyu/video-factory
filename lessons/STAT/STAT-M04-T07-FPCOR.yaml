    full census leaves no sampling error — every machine is known.'
  s3_zh: 看边界：若 n 等于 N，分子是零，FPC 就是零。全量普查没有抽样误差——每台机器都已知。
  s3_zh_hk: 睇邊界：若 n 等於 N，分子係零，FPC 就係零。全量普查冇抽樣誤差——每部機器都已知。
