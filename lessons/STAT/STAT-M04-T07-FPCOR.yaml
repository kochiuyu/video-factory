  s3_en: 'Contrast a receipt check: four hundred tickets out of twenty-five thousand
    is only one point six percent. That stays in the ignore-FPC zone. Forty machines
    out of one hundred twenty does not.'
  s3_zh: 对照小票抽查：两万五千张里抽四百张，只有百分之一点六。那仍在可忽略 FPC 的区间。一百二十台里抽四十台，就不在。
  s3_zh_hk: 對照單抽查：兩萬五千張入面抽四百張，淨係百分之一點六。嗰個仲喺可忽略 FPC 嘅區間。一百二十部入面抽四十部，就唔喺。
