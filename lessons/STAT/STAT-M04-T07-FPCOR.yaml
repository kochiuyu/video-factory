id: STAT-M04-T07-FPCOR
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: The finite population correction
title_zh: 小机队的约束：有限总体修正与无放回抽样
title_zh_hk: 小機隊嘅約束：有限總體修正與無放回抽樣
objective_en: Calculate the Finite Population Correction (FPC) factor for sampling without replacement, apply the 5% threshold
  rule (n / N > 0.05) to adjust the standard error of the mean, and evaluate boiler maintenance wear across Metro's commercial
  espresso machine fleet.
objective_zh: 计算无放回抽样下的有限总体修正（FPC）系数，运用 5% 抽样比例阈值法则（n / N > 0.05）校准样本均值的标准误，并在都市咖啡商用浓缩咖啡机机队锅炉磨损巡检中实现精准审计。
objective_zh_hk: 計算無放回抽樣下嘅有限總體修正（FPC）系數，運用 5% 抽樣比例閾值法則（n / N > 0.05）校準樣本均值嘅標準誤，並喺都市咖啡商用濃縮咖啡機機隊鍋爐磨損巡檢入面實現精準審計。
