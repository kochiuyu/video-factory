  step1_en: 'N=120 · n=40 · σ=15'
  step1_zh: 'N=120 · n=40 · σ=15'
  step1_zh_hk: 'N=120 · n=40 · σ=15'
  step2_en: '40 / 120 = 33.3%'
  step2_zh: '40 / 120 = 33.3%'
  step2_zh_hk: '40 / 120 = 33.3%'
  step3_en: '(120−40)/(120−1)=80/119'
  step3_zh: '(120−40)/(120−1)=80/119'
  step3_zh_hk: '(120−40)/(120−1)=80/119'
  step4_en: '√(80/119) ≈ 0.820'
  step4_zh: '√(80/119) ≈ 0.820'
  step4_zh_hk: '√(80/119) ≈ 0.820'
  step5_en: 'SE 2.37 × 0.820 ≈ 1.94'
  step5_zh: 'SE 2.37 × 0.820 ≈ 1.94'
  step5_zh_hk: 'SE 2.37 × 0.820 ≈ 1.94'
  s1_en: 'Use made-up Shop A numbers. Fleet size N is one hundred twenty. Sample n
    is forty, drawn without replacement. Wear sigma is fifteen points.'
  s1_zh: 用一组假设的A店数字。机队 N 是一百二十台。无放回样本 n 是四十台。磨损 sigma 是十五分。
  s1_zh_hk: 用一組假設嘅A店數字。機隊 N 係一百二十部。無放回樣本 n 係四十部。磨損 sigma 係十五分。
  s2_en: 'Check the fraction: forty over one hundred twenty is thirty-three point
    three percent — far above about five percent. So FPC is required, not optional.'
  s2_zh: 先看比例：四十除以一百二十是百分之三十三点三——远高于大约百分之五。所以必须用 FPC，不是可选项。
  s2_zh_hk: 先睇比例：四十除以一百二十係百分之三十三點三——遠高過大約百分之五。所以必須用 FPC，唔係可選項。
  s3_en: 'Build the fraction inside the square root. One hundred twenty minus forty
    is eighty. One hundred twenty minus one is one hundred nineteen. So we need eighty
    over one hundred nineteen.'
  s3_zh: 再搭开根号里面的分数。一百二十减四十是八十。一百二十减一是一百一十九。所以要八十除以一百一十九。
  s3_zh_hk: 再搭開方入面嘅分數。一百二十減四十係八十。一百二十減一係一百一十九。所以要八十除以一百一十九。
  s4_en: 'FPC is the square root of that. Square root of eighty over one hundred nineteen
    is about zero point eight two zero.'
  s4_zh: FPC 就是它开根号。八十除以一百一十九再开根号，大约零点八二零。
  s4_zh_hk: FPC 就係佢開方。八十除以一百一十九再開方，大約零點八二零。
  s5_en: 'Usual SE is fifteen over square root of forty, about two point three seven.
    Multiply by zero point eight two zero: about one point nine four points. Same
    forty machines, tighter uncertainty — about eighteen percent narrower — without
    opening another boiler.'
  s5_zh: 通常标准误是十五除以根号四十，大约两分三七。乘上零点八二零：大约一分九四。还是这四十台，不确定度更紧——大约收窄百分之十八——不用再拆一台锅炉。
  s5_zh_hk: 通常標準誤係十五除以根號四十，大約兩分三七。乘上零點八二零：大約一分九四。仲係呢四十部，不確定度更緊——大約收窄百分之十八——唔使再拆一部鍋爐。
- id: takeaway
  visual: takeaway
  seconds: 56
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Claim the precision you bought
  title_zh: 把已买到的精度算进去
  title_zh_hk: 將已買到嘅精度計入去
  q1_en: 'n/N > 5% → × FPC'
  q1_zh: 'n/N > 5% → × FPC'
  q1_zh_hk: 'n/N > 5% → × FPC'
  q2_en: '40/120 → SE 1.94'
  q2_zh: '40/120 → SE 1.94'
  q2_zh_hk: '40/120 → SE 1.94'
  s1_en: 'Back to Shop A. Forty of one hundred twenty machines looked like ordinary
    sampling. After FPC, the standard error falls from about two point three seven
    to about one point nine four points.'
  s1_zh: 回到A店。一百二十台里抽四十台，看起来像普通抽样。乘上 FPC 后，标准误从大约两分三七降到大约一分九四。
  s1_zh_hk: 返到A店。一百二十部入面抽四十部，睇落好似普通抽樣。乘上 FPC 之後，標準誤由大約兩分三七降到大約一分九四。
  s2_en: 'For a closed fleet, when the draw exceeds about five percent of N, multiply
    the usual SE by FPC — the square root of (N minus n) over (N minus 1).'
  s2_zh: 封闭机队抽样大约超过 N 的百分之五时，把通常的标准误乘上 FPC——(N 减 n) 除以 (N 减 1)，再开根号。
  s2_zh_hk: 封閉機隊抽樣大約超過 N 嘅百分之五嗰陣，將通常嘅標準誤乘上 FPC——(N 減 n) 除以 (N 減 1)，再開方。
  s3_en: 'The operating rule is simple: a closed pool gives you free precision. Count
    it before you budget another teardown.'
  s3_zh: 操作规则很简单：封闭总体自带免费精度。先把它算进去，再谈要不要多拆一台。
  s3_zh_hk: 操作規則好簡單：封閉總體自帶免費精度。先將佢計入去，再傾要唔要多拆一部。
