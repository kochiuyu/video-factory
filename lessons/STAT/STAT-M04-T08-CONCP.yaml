  s1_zh: >-
    用一组假设的A店数字。六十四杯早市饮品被计时。样本均值是四十二点四秒，sigma 是八点零秒。
  s1_zh_hk: >-
    用一組假設嘅A店數字。六十四杯朝市飲品被計時。樣本均值係四十二點四秒，sigma 係八點零秒。
  s2_en: >-
    First open the square root. Sixty-four is eight times eight, so the square
    root of sixty-four is exactly eight.
  s2_zh: >-
    先开根号。六十四是八乘八，所以根号六十四正好是八。
  s2_zh_hk: >-
    先開方。六十四係八乘八，所以根號六十四啱啱好係八。
  s3_en: >-
    Standard error is eight divided by eight: exactly one point zero second.
    That is how far the sample mean typically wobbles.
  s3_zh: >-
    标准误是八除以八：正好一点零秒。这就是样本均值通常晃多远。
  s3_zh_hk: >-
    標準誤係八除以八：啱啱好一點零秒。呢個就係樣本均值通常晃幾遠。
  s4_en: >-
    Apply the about-two-SE rule of thumb. Two times one point zero is two point
    zero seconds — that is the margin of error for this first bracket.
  s4_zh: >-
    套用大约两个标准误的经验规矩。二乘一点零是两点零秒——这就是这层第一区间的误差容限。
  s4_zh_hk: >-
    套用大約兩個標準誤嘅經驗規矩。二乘一點零係兩點零秒——呢個就係呢層第一區間嘅誤差容限。
  s5_en: >-
    Forty-two point four minus two is forty point four; plus two is forty-four
    point four. Instead of a reckless single second, leadership now has the
    bracket forty point four to forty-four point four seconds.
  s5_zh: >-
    四十二点四减二是四十点四；加二是四十四点四。相比轻率的单一秒数，管理层现在有了四十点四到四十四点四秒的区间。
  s5_zh_hk: >-
    四十二點四減二係四十點四；加二係四十四點四。比起輕率嘅單一秒數，管理層而家有咗四十點四到四十四點四秒嘅區間。
- id: takeaway
  visual: takeaway
  seconds: 56
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Report the bracket
  title_zh: 报告区间，不要裸点
  title_zh_hk: 報告區間，唔好裸點
  q1_en: 'Interval = point ± MOE'
  q1_zh: '区间 = 点估计 ± 误差容限'
  q1_zh_hk: '區間 = 點估計 ± 誤差容限'
  q2_en: '~2×SE → [40.4, 44.4]'
  q2_zh: '~2×SE → [40.4, 44.4]'
  q2_zh_hk: '~2×SE → [40.4, 44.4]'
  s1_en: >-
    Back to Shop A. The single second forty-two point four was the fragile claim.
    With SE one point zero and about two SEs of margin, the honest bracket is
    forty point four to forty-four point four seconds.
  s1_zh: >-
    回到A店。四十二点四那一个秒数，是脆弱的宣称。标准误一点零、大约两个标准误的容限之后，诚实的区间是四十点四到四十四点四秒。
  s1_zh_hk: >-
    返到A店。四十二點四嗰一個秒數，係脆弱嘅宣稱。標準誤一點零、大約兩個標準誤嘅容限之後，誠實嘅區間係四十點四到四十四點四秒。
  s2_en: >-
    The operating rule is interval equals point estimate plus or minus MOE. For
    a first ~ninety-five percent feel, take MOE about two times SE — and remember
    that narrower and safer cannot both rise without a larger sample.
  s2_zh: >-
    操作规则是：区间等于点估计加减误差容限。若要大约百分之九十五的第一层手感，取误差容限约为 2 倍 SE——并记住，更窄与更稳妥不能在不加大样本时同时上升。
  s2_zh_hk: >-
    操作規則係：區間等於點估計加減誤差容限。若要大約百分之九十五嘅第一層手感，取誤差容限約為 2 倍 SE——並記住，更窄同更穩妥唔可以喺唔加大樣本嗰陣同時上升。
  s3_en: >-
    So answer headquarters with the bracket, not the bare point. That is what an
    interval estimate is for.
  s3_zh: >-
    所以回答总部时给区间，而不是裸点。这就是区间估计的用处。
  s3_zh_hk: >-
    所以回答總部嗰陣畀區間，而唔係裸點。呢個就係區間估計嘅用處。
