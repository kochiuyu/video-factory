title_en: What is an interval estimate?
title_zh: 区间估计是什么？
title_zh_hk: 區間估計係乜？
objective_en: Explain why continuous point estimates fail with probability 1 under continuous time measurement, formulate
  interval estimation as point estimate plus-or-minus margin of error, examine the trade-off between precision and confidence,
  and bracket morning barista drink preparation times at Wan Chai.
objective_zh: 阐明在连续时间测度下点估计量单点命中概率为零的数学本质，建立“点估计值 ± 误差容限”的区间估计框架，权衡估计精度（区间宽度）与把握度（置信水平）的制约关系，并对湾仔店早市饮品出杯制作工时进行合规区间框定。
objective_zh_hk: 闡明喺連續時間測度下點估計量單點命中概率為零嘅數學本質，建立「點估計值 ± 誤差容限」嘅區間估計框架，權衡估計精度（區間闊度）同把握度（置信水平）嘅制約關係，並對灣仔舖早市飲品出杯製作工時進行合規區間框定。
youtube:
  description_en: |
    What is an interval estimate?

    Suppose Shop A’s morning manager reports that average drink prep time is exactly 42.4 seconds. Staffing and service targets built on one fragile number can miss the true mean by sampling luck alone. Headquarters asks for a bracket, not a single second.

    A point estimate is your best single guess from the sample — often the sample mean x-bar. An interval estimate wraps a margin of error (MOE) around that point: Interval = point estimate ± MOE.

    For about ninety-five percent coverage under a Normal sampling model, a common rule of thumb is MOE about two standard errors: MOE ≈ 2 × SE, where SE = σ / √n. Exact critical multipliers are a later short; this one stays with the concept.

    Worked numbers (made-up): n = 64 drinks, x-bar = 42.4 s, σ = 8.0 s. Then √64 = 8, so SE = 8 / 8 = 1.0 s. MOE ≈ 2 × 1.0 = 2.0 s. The interval is [40.4, 44.4] seconds.

    Narrower brackets look sharper but miss the truth more often unless you pay for a larger sample. Wider brackets feel safer but guide staffing less. Sizing MOE is a business choice about precision versus confidence.

    Rule: report the bracket, not the bare point. About two SEs is a workable first margin when you need a ~95% feel without naming a tabled critical value yet.
  description_zh: |
    区间估计是什么？

    假设A店早市店长汇报：平均出杯制作时间正好是 42.4 秒。用一个脆弱的单点去排班、定服务目标，单靠抽样运气就可能偏离真均值。总部要的是一段区间，不是某一个秒数。

    点估计是样本给出的最优单一猜想——常常是样本均值 x-bar。区间估计在这个点两边加上误差容限（MOE）：区间 = 点估计 ± 误差容限。

    在正态抽样模型下，若要大约百分之九十五的覆盖，常用经验规矩是误差容限大约等于两个标准误：误差容限 ≈ 2 × SE，其中 SE = σ / √n。精确的临界乘数留给后面的短课；本课先把概念讲清。

    假设数字：n = 64 杯，x-bar = 42.4 秒，σ = 8.0 秒。√64 = 8，所以 SE = 8 / 8 = 1.0 秒。误差容限 ≈ 2 × 1.0 = 2.0 秒。区间是 [40.4, 44.4] 秒。

    区间更窄看起来更锋利，但除非加大样本，更容易漏掉真值。区间更宽更稳妥，但对排班指导更弱。误差容限的大小，是精度与把握度之间的经营取舍。

    规则：报告区间，而不是裸点。大约两个标准误，是还没引入表值临界乘数之前，对约百分之九十五手感的可用第一层容限。
  description_zh_hk: |
    區間估計係乜？

    假設A店朝市店長匯報：平均出杯製作時間啱啱好係 42.4 秒。用一個脆弱嘅單點去排班、定服務目標，單靠抽樣運氣就可能偏離真均值。總部要嘅係一段區間，唔係某一個秒數。

    點估計係樣本畀出嘅最優單一猜想——好多時係樣本均值 x-bar。區間估計喺呢個點兩邊加上誤差容限（MOE）：區間 = 點估計 ± 誤差容限。

    喺正態抽樣模型下，若要大約百分之九十五嘅覆蓋，常用經驗規矩係誤差容限大約等於兩個標準誤：誤差容限 ≈ 2 × SE，其中 SE = σ / √n。精確嘅臨界乘數留俾後面短課；呢課先將概念講清。

    假設數字：n = 64 杯，x-bar = 42.4 秒，σ = 8.0 秒。√64 = 8，所以 SE = 8 / 8 = 1.0 秒。誤差容限 ≈ 2 × 1.0 = 2.0 秒。區間係 [40.4, 44.4] 秒。

    區間更窄睇落更鋒利，但除非加大樣本，更容易漏咗真值。區間更闊更穩妥，但對排班指導更弱。誤差容限嘅大細，係精度同把握度之間嘅經營取捨。

    規則：報告區間，而唔係裸點。大約兩個標準誤，係仲未引入表值臨界乘數之前，對約百分之九十五手感嘅可用第一層容限。
