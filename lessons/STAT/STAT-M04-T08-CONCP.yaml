quiz:
- id: Q1
  type: multiple_choice
  question_en: Why is a store manager's claim that 'the true average drink preparation time is exactly 42.4000 seconds' guaranteed
    to be technically false under classical continuous probability?
  question_zh: 在经典连续概率论中，为什么门店经理声称“早高峰真实平均出杯制作时间恰好等于 42.4000 秒”在数学上必然为假？
  question_zh_hk: 喺經典連續概率論入面，點解門市經理聲稱「朝高峰真實平均出杯製作時間啱啱好等於 42.4000 秒」喺數學上必然為假？
  options_en:
  - 'A: For any continuous random variable, the probability of hitting any single exact infinitesimal point is precisely zero:
    P(X = c) = 0.'
  - 'B: Because commercial timers are legally banned from recording tenths of a second.'
  - 'C: Because barista preparation times can only take integer values.'
  - 'D: Because point estimates are only mathematically valid for revenue, never for time.'
  options_zh:
  - 'A: 对于任何连续型随机变量，命中任何特定无理数/无穷小数单点的理论概率在测度论上精确为零：P(X = c) = 0。'
  - 'B: 因为商业工时计时器在计量法规上严禁记录小数秒数。'
  - 'C: 因为咖啡师的制作工时在物理上只能是跳跃的整数秒。'
  - 'D: 因为点估计仅在财务营收指标中合法，绝不可应用于工时测算。'
  options_zh_hk:
  - 'A: 對於任何連續型隨機變量，命中任何特定無窮小數單點嘅理論概率喺測度論上精確為零：P(X = c) = 0。'
  - 'B: 因為商業工時計時器喺計量法規上嚴禁記錄小數秒數。'
  - 'C: 因為咖啡師嘅製作工時喺物理上只能夠係跳躍嘅整數秒。'
  - 'D: 因為點估計淨係喺財務營收指標入面合法，絕唔可以應用喺工時測算。'
  answer: A
  explanation_en: Continuous distributions assign probability to intervals (areas under the curve), not individual points.
    The integral over a single point dx is zero, meaning point estimates are almost surely wrong. Management needs an interval.
  explanation_zh: 连续型变量的概率定义在区间面积之上，单点处的微元积分恒为零，即单点命中的理论概率几近于无。管理层必须用有宽度的区间代替脆弱的单点。
  explanation_zh_hk: 連續型變量嘅概率定義喺區間面積之上，單點處嘅微元積分恆為零，即係話單點命中嘅理論概率微乎其微。管理層必須用有闊度嘅區間代替脆弱嘅單點。
- id: Q2
  type: multiple_choice
  question_en: An operations audit of n = 64 peak-hour drinks at Wan Chai finds a sample mean preparation time of x-bar =
    42.4 seconds with standard error SE = 1.0 second. If leadership insists on an operational margin of error of +/- 1.96
    seconds, what is the resulting interval estimate?
  question_zh: 湾仔店早市抽检 n = 64 杯饮品，样本平均制作工时为 x-bar = 42.4 秒，标准误 SE = 1.0 秒。若管理层要求按 ± 1.96 秒的误差容限构建区间估计，得出的工时受控区间是多少？
  question_zh_hk: 灣仔舖早市抽檢 n = 64 杯飲品，樣本平均製作工時為 x-bar = 42.4 秒，標準誤 SE = 1.0 秒。若果管理層要求按 ± 1.96 秒嘅誤差容限構建區間估計，得出嘅工時受控區間係幾多？
  options_en:
  - 'A: [42.4 - 1.96, 42.4 + 1.96] = [40.44 seconds, 44.36 seconds]'
  - 'B: [42.4 - 1.00, 42.4 + 1.00] = [41.40 seconds, 43.40 seconds]'
  - 'C: [0.00 seconds, 84.80 seconds]'
  - 'D: [42.4 / 1.96, 42.4 * 1.96] = [21.63 seconds, 83.10 seconds]'
  options_zh:
  - 'A: [42.4 - 1.96, 42.4 + 1.96] = [40.44 秒, 44.36 秒]'
  - 'B: [42.4 - 1.00, 42.4 + 1.00] = [41.40 秒, 43.40 秒]'
  - 'C: [0.00 秒, 84.80 秒]'
  - 'D: [42.4 / 1.96, 42.4 * 1.96] = [21.63 秒, 83.10 秒]'
  options_zh_hk:
  - 'A: [42.4 - 1.96, 42.4 + 1.96] = [40.44 秒, 44.36 秒]'
  - 'B: [42.4 - 1.00, 42.4 + 1.00] = [41.40 秒, 43.40 秒]'
  - 'C: [0.00 秒, 84.80 秒]'
  - 'D: [42.4 / 1.96, 42.4 * 1.96] = [21.63 秒, 83.10 秒]'
  answer: A
  explanation_en: An interval estimate equals Point Estimate +/- Margin of Error. Here, 42.4 - 1.96 = 40.44s and 42.4 + 1.96
    = 44.36s. The interval [40.44, 44.36] encapsulates our operational uncertainty.
  explanation_zh: 区间估计的结构为“点估计值 ± 误差容限”。此处下界为 42.4 - 1.96 = 40.44 秒，上界为 42.4 + 1.96 = 44.36 秒。区间 [40.44, 44.36] 完整包裹了抽样估算的不确定性。
  explanation_zh_hk: 區間估計嘅結構為「點估計值 ± 誤差容限」。呢度下界為 42.4 - 1.96 = 40.44 秒，上界為 42.4 + 1.96 = 44.36 秒。區間 [40.44, 44.36] 完整包裹咗抽樣估算嘅不確定性。
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: The Exact Second Illusion
  kicker_en: The Exact Second Illusion
  kicker_zh: 绝对秒数的幻象
  kicker_zh_hk: 絕對秒數嘅幻象
  title_en: Why single-point operational targets fail an audit
  title_zh: 四十二点四秒出杯：单一数值为何通不过严密审计？
  title_zh_hk: 四十二點四秒出杯：單一數值點解過唔到嚴密審計？
  en: 'During the 8:00 AM rush at Wan Chai, the store manager proudly reports to headquarters: Our baristas have mastered
    espresso workflow; true average drink preparation time is exactly forty-two point four seconds. The Chief Operating Officer
    reviews the memo and pushes it back immediately: Claiming an exact single point is mathematically indefensible! In continuous
    operational time, the probability of hitting any precise decimal is literally zero. Why are point estimates doomed to
    fail, and how do executive leaders build honest performance intervals?'
  zh: 早晨八点湾仔店早高峰，店长在向总部提交的周报中信誓旦旦：咖啡师已彻底跑通出餐流线，全店早市真实平均制作工时恰好是四十二点四秒。首席运营官翻阅报告后当场驳回：在审计层面上声称命中某个确凿单点，在数学上根本站不住脚！在连续时间流中，命中任何特定小数点的概率在理论上精确为零。为什么孤立的点估计注定破产？卓越的管理者又该如何搭建诚实可靠的区间护栏？
  zh_hk: 朝早八點灣仔舖朝高峰，店長喺向總部遞交嘅週報入面拍晒心口：咖啡師已經徹底搞掂出餐流程，全舖早市真實平均製作工時啱啱好係四十二點四秒。首席營運官睇完報告即刻打沉：喺審計層面上聲稱命中某個確鑿單點，喺數學上根本企唔穩陣腳！喺連續時間流入面，命中任何特定小數點嘅概率喺理論上精確為零。點解孤立嘅點估計注定破產？卓越嘅管理者又應該點樣搭建誠實可靠嘅區間護欄？
- id: define
  visual: definition_card
  seconds: 34
  kicker: What It Is
  kicker_en: What It Is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: The interval estimate architecture
  title_zh: 区间估计的双元架构
  title_zh_hk: 區間估計嘅雙元架構
  formula: Interval = Point Estimate +/- Margin of Error; MOE = Critical Value * SE
  formula_zh: 区间估计 = 点估计值 ± 误差容限 (MOE)；误差容限 = 临界系数 × 抽样标准误
  formula_zh_hk: 區間估計 = 點估計值 ± 誤差容限 (MOE)；誤差容限 = 臨界系數 × 抽樣標準誤
  formula_tex: \text{Interval} = \bar{X} \pm \text{MOE} = \bar{X} \pm \left( Z^* \cdot \frac{\sigma}{\sqrt{n}} \right)
  s1_en: A point estimate gives our best single-number guess, such as sample mean x-bar. But in continuous reality, the probability
    of sample mean landing dead on the true parameter mu is mathematically zero.
  s1_zh: 点估计给出了我们基于样本计算出的最优单一猜想值，比如样本均值 x-bar。但在连续分布的世界里，样本均值恰好分毫不差命中总体真值 mu 的概率在测度论上严格为零。
  s1_zh_hk: 點估計畀出咗我哋基於樣本計算出嚟嘅最優單一猜想值，好似樣本均值 x-bar。但喺連續分佈嘅世界入面，樣本均值啱啱好分毫不差命中總體真值 mu 嘅概率喺測度論上嚴格為零。
  s2_en: An interval estimate surrounds that point estimate with a protective margin of error. It transforms a fragile, pinpoint
    target into an operational bracket backed by probabilistic certainty.
  s2_zh: 区间估计则在单点估计周围筑起一道坚实的“误差容限”安全带。它将一个极度脆弱的单点指标，升级为具备概率确定性背书的营运弹性区间。
  s2_zh_hk: 區間估計就喺單點估計周圍築起一道堅實嘅「誤差容限」安全帶。佢將一個極度脆弱嘅單點指標，升級為具備概率確定性背書嘅營運彈性區間。
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: The Executive Dilemma
  kicker_en: The Executive Dilemma
  kicker_zh: 管理博弈
  kicker_zh_hk: 管理博弈
  title_en: The precision versus confidence trade-off
  title_zh: 精度与置信度的终极权衡
  title_zh_hk: 精度與置信度嘅終極權衡
  left_en: 'Narrow Bracket: Ultra-precise, but high risk of missing truth'
  left_zh: 窄区间：精度极高、颗粒度细，但漏网脱靶风险急剧飙升
  left_zh_hk: 窄區間：精度極高、顆粒度細，但漏網脫靶風險急劇飆升
  right_en: 'Wide Bracket: High confidence, but vague managerial utility'
  right_zh: 宽区间：把握度高、极度安全，但流于宽泛丧失决策指导价值
  right_zh_hk: 寬區間：把握度高、極度安全，但流於寬泛喪失決策指導價值
  s1_en: 'Every operational interval faces an inescapable tension: you cannot simultaneously increase precision and increase
    confidence without paying for a larger sample.'
  s1_zh: 任何营运区间都面临着不可调和的底层张力：在不追加抽查样本量的前提下，你绝不可能在收窄区间精度的同时，还凭空提高捕捉真值的把握度。
  s1_zh_hk: 任何營運區間都面臨住不可調和嘅底層張力：喺唔追加抽查樣本量嘅前提下，你絕唔可能喺收窄區間精度嘅同時，仲憑空提高捕捉真值嘅把握度。
  s2_en: If marketing boasts that barista speed is between forty-two point one and forty-two point seven seconds, precision
    is razor-sharp—but random noise will frequently kick truth outside the bracket.
  s2_zh: 若向外界宣称咖啡师制作耗时在四十二点一到四十二点七秒之间，精度固然无可挑剔，但日常的随机杂音会极其频繁地将真实水平甩出这个窄缝。
  s2_zh_hk: 若果向外界宣稱咖啡師製作耗時喺四十二點一到四十二點七秒之間，精度固然無可挑剔，但日常嘅隨機雜音會極其頻繁噉將真實水平甩出呢個窄縫。
  s3_en: Conversely, promising speed between ten and ninety seconds provides one hundred percent certainty, but tells executives
    nothing about staffing or queue management. Sizing the margin of error is a conscious business choice.
  s3_zh: 反之，若承诺出餐在十秒到九十秒之间，把握度虽达百分之百，却对排班和防拥堵毫无指导意义。划定误差容限的大小，本质上是管理层的战略取舍。
  s3_zh_hk: 反之，若果承諾出餐喺十秒到九十秒之間，把握度雖達百分之百，但對排班同防擁堵毫無指導意義。劃定誤差容限嘅大細，本質上係管理層嘅戰略取捨。
- id: ledger
  visual: steps
  seconds: 36
  kicker: The Ledger
  kicker_en: The Ledger
  kicker_zh: 账目精算
  kicker_zh_hk: 賬目精算
  title_en: Auditing Wan Chai barista prep speed
  title_zh: 湾仔店早高峰出杯工时区间实测
  title_zh_hk: 灣仔舖朝高峰出杯工時區間實測
  step1_en: 'Point baseline: Audit n = 64 drinks -> x-bar = 42.4s, sigma = 8.0s -> SE = 1.0s'
  step1_zh: 抽检基准：抽查 n = 64 杯 -> 样本均值 42.4 秒，标准差 8.0 秒 -> 标准误 1.0 秒
  step1_zh_hk: 抽檢基準：抽查 n = 64 杯 -> 樣本均值 42.4 秒，標準差 8.0 秒 -> 標準誤 1.0 秒
  step2_en: 'Set tolerance: Apply 95% critical value Z* = 1.96 -> MOE = 1.96 * 1.0 = 1.96s'
  step2_zh: 设定容限：匹配 95% 置信标尺 Z* = 1.96 -> 误差容限 MOE = 1.96 × 1.0 = 1.96 秒
  step2_zh_hk: 設定容限：匹配 95% 置信標尺 Z* = 1.96 -> 誤差容限 MOE = 1.96 × 1.0 = 1.96 秒
  step3_en: 'Bracket bounds: 42.4 +/- 1.96s -> Certified interval: [40.44s, 44.36s]'
  step3_zh: 生成区间：42.4 ± 1.96 秒 -> 认证受控区间：[40.44 秒, 44.36 秒]
  step3_zh_hk: 生成區間：42.4 ± 1.96 秒 -> 認證受控區間：[40.44 秒, 44.36 秒]
  s1_en: Review the operations audit ledger at Wan Chai. Across sixty-four stopwatch-timed morning espresso drinks, the sample
    mean preparation time lands at forty-two point four seconds, with individual standard deviation sigma of eight point zero
    seconds.
  s1_zh: 查阅湾仔店早高峰秒表核查台账。在六十四杯受检意式浓缩中，样本平均制作工时为四十二点四秒，单杯波动标准差 sigma 为八点零秒。
  s1_zh_hk: 查閱灣仔舖朝高峰秒錶核查台賬。喺六十四杯受檢意式濃縮入面，樣本平均製作工時為四十二點四秒，單杯波動標準差 sigma 為八點零秒。
  s2_en: Dividing eight seconds by the square root of sixty-four reveals a clean standard error of exactly one point zero
    second. To deliver ninety-five percent operational coverage, we match this standard error to a normal critical multiplier
    of one point nine six, producing a margin of error of one point nine six seconds.
  s2_zh: 将八秒除以根号六十四，精准得出整整一秒的标准误。为达成百分之九十五的可靠覆盖，我们调用一点九六的正态临界乘数，求得误差容限为一点九六秒。
  s2_zh_hk: 將八秒除以根號六十四，精準得出整整一秒嘅標準誤。為咗達成百分之九十五嘅可靠覆蓋，我哋調用一點九六嘅正態臨界乘數，求得誤差容限為一點九六秒。
  s3_en: 'Forty-two point four minus one point nine six gives forty point four four; adding it yields forty-four point three
    six. Instead of a reckless single number, leadership now possesses a rigorously certified service benchmark: forty point
    four to forty-four point four seconds.'
  s3_zh: 四十二点四减一点九六得四十点四四，加上则为四十四点三六。相比于轻率的单一数字，管理层如今掌握了经受得住审计考验的坚挺标准：制作工时稳居四十点四至四十四点四秒区间。
  s3_zh_hk: 四十二點四減一點九六得四十點四四，加上就係四十四點三六。比起輕率嘅單一數字，管理層而家掌握咗經受得住審計考驗嘅硬淨標準：製作工時穩居四十點四至四十四點四秒區間。
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: Decision Rule
  kicker_en: Decision Rule
  kicker_zh: 商业法度
  kicker_zh_hk: 商業法度
  title_en: Never present a point estimate without its operational bracket
  title_zh: 单点有穷尽，区间见真章：用误差容限守卫管理威信
  title_zh_hk: 單點有窮盡，區間見真章：用誤差容限守衛管理威信
  q1_en: Why should executives immediately reject audit memos reporting single unqualified point estimates?
  q1_zh: 为什么高管在审阅汇报时，应当坚决退回任何缺乏区间范围的裸点估计报告？
  q1_zh_hk: 點解高管喺審閱匯報嗰陣，應當堅決打沉任何缺乏區間範圍嘅單點估計報告？
  q2_en: What specific critical values govern ninety, ninety-five, and ninety-nine percent intervals?
  q2_zh: 百分之九十、九十五与九十九的常规置信区间，分别由哪些经典 Z 临界值统帅？
  q2_zh_hk: 百分之九十、九十五同九十九嘅常規置信區間，分別由邊啲經典 Z 臨界值統領？
  s1_en: Never accept a point estimate at face value; in continuous operations, exact point claims carry zero probabilistic
    credibility, while intervals protect managerial reputation.
  s1_zh: 切勿孤立采信单点估计；在连续商业运营中，断言精确命中单一数字毫无概率可信度，唯有区间估计才能捍卫决策的科学性与容错空间。
  s1_zh_hk: 切勿孤立採信單點估計；喺連續商業營運入面，斷言精確命中單一數字毫無概率可信度，淨係得區間估計先可以捍衛決策嘅科學性同容錯空間。
  s2_en: 'Calibrate the precision-confidence trade-off deliberately: invest in larger audit samples when business risk requires
    both a narrow interval and high statistical certainty.'
  s2_zh: 清醒拿捏精度与置信度的战略平衡：唯有当商业风险同时要求极窄区间与极高可靠度时，才值得斥资扩大抽样规模，绝不在低价值业务上浪费公帑。
  s2_zh_hk: 清醒拿捏精度與置信度嘅戰略平衡：淨係得當商業風險同時要求極窄區間與極高可靠度嗰陣，先值得斥資擴大抽樣規模，絕唔喺低價值業務上浪費公帑。
  s3_en: The operating rule is to report the bracket, not the single second. Sixty-four drinks at 42.4 seconds with a standard
    error of 1.0 give [40.44, 44.36] at the 1.96 multiplier.
  s3_zh: 操作规则是报告区间，而不是报告那一个秒数。64 杯均值为 42.4 秒、标准误 1.0 秒，乘 1.96 得到 [40.44, 44.36]。
  s3_zh_hk: 操作規則係報告區間，而唔係報告嗰一個秒數。64 杯均值為 42.4 秒、標準誤 1.0 秒，乘 1.96 得到 [40.44, 44.36]。
