quiz:
- id: Q1
  type: multiple_choice
  question_en: Why should a manager report an interval estimate for average drink prep time, not only a bare point estimate?
  question_zh: 为什么经理报告平均出杯制作时间时，应当给出区间估计，而不是只报一个裸点估计？
  question_zh_hk: 點解經理報告平均出杯製作時間嗰陣，應當畀出區間估計，而唔係淨係報一個裸點估計？
  options_en:
  - 'A: A point is one guess; an interval adds a margin of error that shows sampling uncertainty.'
  - 'B: Point estimates are valid only when the sample size is at least 30.'
  - 'C: Intervals are allowed for revenue only, never for preparation time.'
  - 'D: The sample mean always equals the true mean exactly, so a point is enough.'
  options_zh:
  - 'A: 点估计只是一次猜想；区间加上误差容限，把抽样不确定性标出来。'
  - 'B: 只有样本量至少为 30 时，点估计才合法。'
  - 'C: 区间估计只许用于营收，绝不可用于制作时间。'
  - 'D: 样本均值总是恰好等于真均值，所以单点就够。'
  options_zh_hk:
  - 'A: 點估計只係一次猜想；區間加上誤差容限，將抽樣不確定性標出嚟。'
  - 'B: 淨係樣本量至少為 30 嗰陣，點估計先合法。'
  - 'C: 區間估計淨係准用喺營收，絕唔可以用喺製作時間。'
  - 'D: 樣本均值成日啱啱好等於真均值，所以單點就夠。'
  answer: A
  explanation_en: 'An interval keeps the point estimate and wraps a margin of error around it, so readers see how far sampling noise can swing the guess. B turns a rule of thumb into a law; C invents a topic ban; D pretends sampling error is zero.'
  explanation_zh: '区间保留点估计，并在两边加上误差容限，让读者看到抽样噪声能把猜想晃多远。B 把经验规矩当成定律；C 虚构了主题禁令；D 假装没有抽样误差。'
  explanation_zh_hk: '區間保留點估計，並喺兩邊加上誤差容限，等讀者睇到抽樣雜音可以將猜想晃幾遠。B 將經驗規矩當成定律；C 虛構咗主題禁令；D 假裝冇抽樣誤差。'
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B times n = 36 peak drinks. The sample mean is x-bar = 50.0 s and σ = 12.0 s. Using MOE ≈ 2 × SE, what are SE and the interval?'
  question_zh: 假设B店抽测 n = 36 杯高峰饮品，样本均值 x-bar = 50.0 秒，σ = 12.0 秒。按 误差容限 ≈ 2 × SE，标准误与区间分别是多少？
  question_zh_hk: 假設B店抽測 n = 36 杯高峰飲品，樣本均值 x-bar = 50.0 秒，σ = 12.0 秒。按 誤差容限 ≈ 2 × SE，標準誤同區間分別係幾多？
  options_en:
  - 'A: SE = 12 / √36 = 2.0 s; interval [46.0 s, 54.0 s]'
  - 'B: SE = 2.0 s; interval [48.0 s, 52.0 s]'
  - 'C: SE = 12 / 36 ≈ 0.33 s; interval [49.3 s, 50.7 s]'
  - 'D: SE = √(12 / 36) ≈ 0.58 s; interval [48.8 s, 51.2 s]'
  options_zh:
  - 'A: SE = 12 / √36 = 2.0 秒；区间 [46.0 秒, 54.0 秒]'
  - 'B: SE = 2.0 秒；区间 [48.0 秒, 52.0 秒]'
  - 'C: SE = 12 / 36 ≈ 0.33 秒；区间 [49.3 秒, 50.7 秒]'
  - 'D: SE = √(12 / 36) ≈ 0.58 秒；区间 [48.8 秒, 51.2 秒]'
  options_zh_hk:
  - 'A: SE = 12 / √36 = 2.0 秒；區間 [46.0 秒, 54.0 秒]'
  - 'B: SE = 2.0 秒；區間 [48.0 秒, 52.0 秒]'
  - 'C: SE = 12 / 36 ≈ 0.33 秒；區間 [49.3 秒, 50.7 秒]'
  - 'D: SE = √(12 / 36) ≈ 0.58 秒；區間 [48.8 秒, 51.2 秒]'
  answer: A
  explanation_en: '√36 = 6, so SE = 12 / 6 = 2.0 s. MOE ≈ 2 × 2.0 = 4.0 s, so 50.0 ± 4.0 gives [46.0, 54.0]. B uses ± one SE only; C divides by n instead of √n; D puts σ/n under a square root.'
  explanation_zh: '√36 = 6，所以 SE = 12 / 6 = 2.0 秒。误差容限 ≈ 2 × 2.0 = 4.0 秒，于是 50.0 ± 4.0 得到 [46.0, 54.0]。B 只用了 ± 一个 SE；C 用 n 而不是 √n 去除；D 把 σ/n 放进了根号。'
  explanation_zh_hk: '√36 = 6，所以 SE = 12 / 6 = 2.0 秒。誤差容限 ≈ 2 × 2.0 = 4.0 秒，於是 50.0 ± 4.0 得到 [46.0, 54.0]。B 淨係用咗 ± 一個 SE；C 用 n 而唔係 √n 去除；D 將 σ/n 放入咗根號。'
beats:
- id: hook
  visual: title_card
  seconds: 34
  kicker: A fragile single second
  kicker_en: A fragile single second
  kicker_zh: 脆弱的单点秒数
  kicker_zh_hk: 脆弱嘅單點秒數
  title_en: What is an interval estimate?
  title_zh: 区间估计是什么？
  title_zh_hk: 區間估計係乜？
  en: >-
    Suppose Shop A’s morning manager reports that average drink prep time is
    exactly forty-two point four seconds. Staffing and service targets built on
    that one number can miss the true mean by sampling luck alone. Headquarters
    pushes back: give us a bracket, not a single second. How do you turn a fragile
    point into an honest interval estimate?
  zh: >-
    假设A店早市店长汇报：平均出杯制作时间正好是四十二点四秒。用这一个数字去排班、定服务目标，单靠抽样运气就可能偏离真均值。总部退回：给我们一段区间，不要某一个秒数。怎样把脆弱的单点，变成诚实的区间估计？
  zh_hk: >-
    假設A店朝市店長匯報：平均出杯製作時間啱啱好係四十二點四秒。用呢一個數字去排班、定服務目標，單靠抽樣運氣就可能偏離真均值。總部打沉：畀我哋一段區間，唔好某一個秒數。點樣將脆弱嘅單點，變成誠實嘅區間估計？
- id: define
  visual: definition_card
  seconds: 42
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: Point plus a margin
  title_zh: 点估计加上一段容限
  title_zh_hk: 點估計加上一段容限
  formula: 'Interval = point estimate ± MOE'
  formula_zh: 区间估计 = 点估计 ± 误差容限（MOE）
  formula_zh_hk: 區間估計 = 點估計 ± 誤差容限（MOE）
  s1_en: >-
    A point estimate is your best single guess from the sample — often the sample
    mean, x-bar. It is useful, but it is still one draw. Another random sample
    of the same size would usually land somewhere else.
  s1_zh: >-
    点估计是样本给出的最优单一猜想——常常是样本均值 x-bar。它有用，但仍然只是一次抽取。同样大小的另一次随机样本，通常会落在别处。
  s1_zh_hk: >-
    點估計係樣本畀出嘅最優單一猜想——好多時係樣本均值 x-bar。佢有用，但仍然只係一次抽取。同樣大細嘅另一次隨機樣本，通常會落喺第度。
  s2_en: >-
    An interval estimate keeps that point and wraps a margin of error around it.
    The architecture is simple: interval equals the point estimate plus or minus
    the margin of error — written MOE.
  s2_zh: >-
    区间估计保留这个点，并在两边加上误差容限（MOE）。结构很简单：区间等于点估计加减误差容限。
  s2_zh_hk: >-
    區間估計保留呢個點，並喺兩邊加上誤差容限（MOE）。結構好簡單：區間等於點估計加減誤差容限。
- id: moe
  visual: steps
  layout: rows
  seconds: 48
  kicker: A first margin
  kicker_en: A first margin
  kicker_zh: 第一层容限
  kicker_zh_hk: 第一層容限
  title_en: About two standard errors
  title_zh: 大约两个标准误
  title_zh_hk: 大約兩個標準誤
  step1_en: 'SE = σ / √n'
  step1_zh: 'SE = σ / √n'
  step1_zh_hk: 'SE = σ / √n'
  step2_en: 'MOE ≈ 2 × SE'
  step2_zh: '误差容限 ≈ 2 × SE'
  step2_zh_hk: '誤差容限 ≈ 2 × SE'
  step3_en: 'Interval = x̄ ± MOE'
  step3_zh: '区间 = x̄ ± 误差容限'
  step3_zh_hk: '區間 = x̄ ± 誤差容限'
  s1_en: >-
    The standard error SE is how much the sample mean wobbles from sample to
    sample: sigma over the square root of n. You already met that scale.
  s1_zh: >-
    标准误 SE 衡量样本均值在样本与样本之间晃多少：sigma 除以根号 n。你已经见过这个尺度。
  s1_zh_hk: >-
    標準誤 SE 衡量樣本均值喺樣本同樣本之間晃幾多：sigma 除以根號 n。你已經見過呢個尺度。
  s2_en: >-
    For about ninety-five percent coverage under a Normal sampling model, a common
    rule of thumb sets the margin at about two standard errors: MOE about two
    times SE. Exact tabled multipliers wait for a later short.
  s2_zh: >-
    在正态抽样模型下，若要大约百分之九十五的覆盖，常用经验规矩把误差容限定在大约两个标准误：误差容限约等于 2 倍 SE。精确的表值乘数留给后面的短课。
  s2_zh_hk: >-
    喺正態抽樣模型下，若要大約百分之九十五嘅覆蓋，常用經驗規矩將誤差容限定喺大約兩個標準誤：誤差容限約等於 2 倍 SE。精確嘅表值乘數留俾後面短課。
  s3_en: >-
    Put the pieces together: start at x-bar, step left and right by the MOE, and
    you have the interval. That is the concept — a point wearing a safety belt.
  s3_zh: >-
    合在一起：从 x-bar 出发，向左、向右各走一段误差容限，就得到区间。这就是概念——给单点系上安全带。
  s3_zh_hk: >-
    合埋一齊：由 x-bar 出發，向左、向右各行一段誤差容限，就得到區間。呢個就係概念——畀單點繫上安全帶。
- id: tradeoff
  visual: two_column
  seconds: 48
  kicker: The business choice
  kicker_en: The business choice
  kicker_zh: 经营取舍
  kicker_zh_hk: 經營取捨
  title_en: Precision versus confidence
  title_zh: 精度与把握度
  title_zh_hk: 精度同把握度
  left_en: 'Narrow: sharp, misses more'
  left_zh: 窄：锋利，更易漏真值
  left_zh_hk: 窄：鋒利，更易漏真值
  right_en: 'Wide: safer, weaker guide'
  right_zh: 宽：更稳，指导更弱
  right_zh_hk: 闊：更穩，指導更弱
  s1_en: >-
    Every operational interval faces the same tension. Without a larger sample,
    you cannot tighten the bracket and raise confidence at the same time.
  s1_zh: >-
    任何营运区间都面对同一张力。不加大样本，你不可能一边收窄区间，一边又提高把握度。
  s1_zh_hk: >-
    任何營運區間都面對同一張力。唔加大樣本，你唔可能一邊收窄區間，一邊又提高把握度。
  s2_en: >-
    A razor-thin band around forty-two point four seconds looks precise. Random
    sampling noise will kick the truth outside that band often.
  s2_zh: >-
    围着四十二点四秒的一条极窄带子，看起来很精确。抽样噪声会常常把真值踢出那条带。
  s2_zh_hk: >-
    圍住四十二點四秒嘅一條極窄帶子，睇落好精確。抽樣雜音會成日將真值踢出嗰條帶。
  s3_en: >-
    A band from ten to ninety seconds feels certain, yet it barely helps schedule
    baristas. Sizing the margin of error is a conscious business choice about
    precision versus confidence.
  s3_zh: >-
    从十秒到九十秒的带子把握度很高，但对排班几乎没有帮助。划定误差容限的大小，是精度与把握度之间的经营取舍。
  s3_zh_hk: >-
    由十秒到九十秒嘅帶子把握度好高，但對排班幾乎冇幫助。劃定誤差容限嘅大細，係精度同把握度之間嘅經營取捨。
