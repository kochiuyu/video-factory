id: STAT-M04-T09-ZINTV
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Constructing the Z-interval
title_zh: 筑牢置信之界：构建 Z 区间与临界值博弈
title_zh_hk: 築牢置信之界：構建 Z 區間與臨界值博弈
objective_en: Derive two-sided normal critical values (Z* = 1.645, 1.960, and 2.576) from standard normal tables, calculate
  the margin of error for known variance, examine how expanding confidence from 90% to 99% widens interval width by over 56%,
  and construct milk foam temperature compliance brackets.
objective_zh: 根据标准正态分布分位数推导双尾临界值（Z* = 1.645、1.960 与 2.576），计算总体方差已知下的误差容限，量化从 90% 提升至 99% 置信度导致区间宽度膨胀逾 56% 的边际代价，并构建奶泡打发温度品控合规区间。
objective_zh_hk: 根據標準正態分佈分位數推導雙尾臨界值（Z* = 1.645、1.960 同 2.576），計算總體方差已知下嘅誤差容限，量化由 90% 提升至 99% 置信度搞到區間闊度膨脹超過 56% 嘅邊際代價，並構建奶泡打發溫度品控合規區間。
