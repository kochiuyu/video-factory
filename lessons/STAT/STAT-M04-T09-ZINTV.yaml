id: STAT-M04-T09-ZINTV
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 350
title_en: Constructing the Z-interval
title_zh: 构建 Z 置信区间
title_zh_hk: 構建 Z 置信區間
objective_en: Derive two-sided normal critical values (Z* = 1.645, 1.960, and 2.576) from standard normal tables, calculate
  the margin of error for known variance, examine how expanding confidence from 90% to 99% widens interval width by over 56%,
  and construct milk foam temperature compliance brackets.
objective_zh: 根据标准正态分布分位数推导双尾临界值（Z* = 1.645、1.960 与 2.576），计算总体方差已知下的误差容限，量化从 90% 提升至 99% 置信度导致区间宽度膨胀逾 56% 的边际代价，并构建奶泡打发温度品控合规区间。
objective_zh_hk: 根據標準正態分佈分位數推導雙尾臨界值（Z* = 1.645、1.960 同 2.576），計算總體方差已知下嘅誤差容限，量化由 90% 提升至 99% 置信度搞到區間闊度膨脹超過 56% 嘅邊際代價，並構建奶泡打發溫度品控合規區間。
youtube:
  description_en: |-
    What is a Z-interval?

    Suppose Shop A steams milk for latte foam. Too hot scorches the proteins; too cool and the foam collapses. A sample of 100 drinks lands at an average of 65.0°C. Marketing wants a razor-thin quality bracket for the ad. Legal wants near-certain coverage. Who wins — and how wide must the bracket be?

    When the population standard deviation sigma is known and a Normal model for the sample mean is reasonable, a Z-confidence interval is:
    CI = sample mean ± Z* × SE, with SE = sigma / √n.

    Confidence level is 1 − alpha. Split the leftover risk alpha into two equal tails. The critical value Z* is the Normal cutoff that keeps the middle share. Three common tabled values:
    90% → Z* = 1.645
    95% → Z* = 1.960
    99% → Z* = 2.576

    Made-up Shop A numbers: n = 100, sample mean = 65.0°C, sigma = 2.5°C. √100 = 10, so SE = 2.5 / 10 = 0.25°C.
    At 90%: margin of error = 1.645 × 0.25 = 0.411°C → [64.59, 65.41]
    At 99%: margin of error = 2.576 × 0.25 = 0.644°C → [64.36, 65.64]
    Width rises from 0.822°C to 1.288°C — about 56.6% wider, because 2.576 / 1.645 ≈ 1.566.

    Rule: pick Z* to match the cost of a miss. Raising confidence without growing n buys safety by widening the bracket.
  description_zh: |-
    什么是 Z 置信区间？

    假设A店打发拿铁奶泡。太烫会焦糊蛋白；太凉奶泡塌掉。抽测 100 杯，样本均值 65.0°C。营销想要极窄的品控区间做宣传，法务想要更高的把握度。区间到底该拉多宽？

    当总体标准差 sigma 已知，且样本均值可用正态模型时，Z 置信区间是：
    置信区间 = 样本均值 ± 临界值 × 标准误，标准误 = sigma / √n。

    置信水平 = 1 − alpha。把未覆盖风险 alpha 均分到两侧尾部。临界值（Z*）就是保住中间把握度的正态分界。三个常用表值：
    90% → 临界值 = 1.645
    95% → 临界值 = 1.960
    99% → 临界值 = 2.576

    假设A店数字：n = 100，样本均值 = 65.0°C，sigma = 2.5°C。√100 = 10，所以标准误 = 2.5 / 10 = 0.25°C。
    90%：误差容限 = 1.645 × 0.25 = 0.411°C → [64.59, 65.41]
    99%：误差容限 = 2.576 × 0.25 = 0.644°C → [64.36, 65.64]
    宽度从 0.822°C 到 1.288°C，大约再宽 56.6%，因为 2.576 / 1.645 ≈ 1.566。

    规则：按脱靶代价选择临界值。不加大样本就提高置信水平，换来的是更宽的区间。
  description_zh_hk: |-
    乜嘢係 Z 置信區間？

    假設A店打發鮮奶咖啡奶泡。太燙會焦糊蛋白；太涼奶泡冧咗。抽測 100 杯，樣本均值 65.0°C。營銷想要極窄嘅品控區間做宣傳，法務想要更高嘅把握度。區間到底應該拉幾闊？

    當總體標準差 sigma 已知，兼且樣本均值可用正態模型嗰陣，Z 置信區間係：
    置信區間 = 樣本均值 ± 臨界值 × 標準誤，標準誤 = sigma / √n。

    置信水平 = 1 − alpha。將未覆蓋風險 alpha 均分到兩側尾部。臨界值（Z*）就係保住中間把握度嘅正態分界。三個常用表值：
    90% → 臨界值 = 1.645
    95% → 臨界值 = 1.960
    99% → 臨界值 = 2.576

    假設A店數字：n = 100，樣本均值 = 65.0°C，sigma = 2.5°C。√100 = 10，所以標準誤 = 2.5 / 10 = 0.25°C。
    90%：誤差容限 = 1.645 × 0.25 = 0.411°C → [64.59, 65.41]
    99%：誤差容限 = 2.576 × 0.25 = 0.644°C → [64.36, 65.64]
    闊度由 0.822°C 到 1.288°C，大約再闊 56.6%，因為 2.576 / 1.645 ≈ 1.566。

    規則：按脫靶代價選擇臨界值。唔加大樣本就提高置信水平，換嚟嘅係更闊嘅區間。
