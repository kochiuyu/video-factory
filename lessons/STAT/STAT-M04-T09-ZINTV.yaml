quiz:
- id: Q1
  type: multiple_choice
  question_en: When constructing a two-sided confidence interval for a population mean with known variance, why is the critical value for a 95% confidence level Z* = 1.960 instead of Z* = 1.645?
  question_zh: 在总体方差已知的双尾均值置信区间构建中，为什么 95% 置信水平对应的临界值是 Z* = 1.960，而不是 Z* = 1.645？
  question_zh_hk: 喺總體方差已知嘅雙尾均值置信區間構建入面，點解 95% 置信水平對應嘅臨界值係 Z* = 1.960，而唔係 Z* = 1.645？
  options_en:
  - 'A: A 95% confidence interval isolates alpha = 5% split into two 2.5% tails, placing the upper critical cutoff at the 97.5th percentile where Z = 1.960.'
  - 'B: Because 1.645 already covers 95% in one tail, so the two-sided interval can reuse it.'
  - 'C: Because 1.645 applies only when sigma is unknown, while 1.960 is reserved for known sigma.'
  - 'D: Because 1.960 is simply the square root of 0.95 rounded to three decimals.'
  options_zh:
  - 'A: 95% 置信区间把 alpha = 5% 均分到两侧各 2.5% 的尾部，上临界值对应标准正态第 97.5 百分位（Z = 1.960）。'
  - 'B: 因为 1.645 已经在单侧覆盖 95%，所以双尾区间可以直接复用。'
  - 'C: 因为 1.645 只适用于 sigma 未知，而 1.960 专用于 sigma 已知。'
  - 'D: 因为 1.960 只是把 0.95 开方后再四舍五入到三位小数。'
  options_zh_hk:
  - 'A: 95% 置信區間將 alpha = 5% 均分到兩側各 2.5% 嘅尾部，上臨界值對應標準正態第 97.5 百分位（Z = 1.960）。'
  - 'B: 因為 1.645 已經喺單側覆蓋 95%，所以雙尾區間可以直接重用。'
  - 'C: 因為 1.645 淨係適用於 sigma 未知，而 1.960 專用於 sigma 已知。'
  - 'D: 因為 1.960 淨係將 0.95 開方之後再四捨五入到三位小數。'
  answer: A
  explanation_en: In a two-sided interval, alpha = 1 - 0.95 = 0.05. Splitting equally across both tails leaves alpha / 2 = 0.025 in each tail. The cumulative probability is 1 - 0.025 = 0.9750, which corresponds to Z* = 1.960 on the standard normal table. 1.645 is the two-sided 90% cutoff, not a one-tail reuse of 95%.
  explanation_zh: 在双尾区间中，未覆盖概率 alpha = 1 - 0.95 = 0.05。平分到两端得每侧 alpha / 2 = 0.025。累积概率 0.9750 对应的标准正态临界值是 Z* = 1.960。1.645 是双尾 90% 的临界值，不是把 95% 单侧拿来复用。
  explanation_zh_hk: 喺雙尾區間入面，未覆蓋概率 alpha = 1 - 0.95 = 0.05。平分到兩端得每側 alpha / 2 = 0.025。累積概率 0.9750 對應嘅標準正態臨界值係 Z* = 1.960。1.645 係雙尾 90% 嘅臨界值，唔係將 95% 單側攞嚟重用。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B times n = 64 steamed drinks. The sample mean is 70.0°C and sigma = 4.0°C. What are SE and the 95% Z-interval (Z* = 1.960)?'
  question_zh: 假设B店抽测 n = 64 杯打发饮品，样本均值 = 70.0°C，sigma = 4.0°C。标准误与 95% 的 Z 置信区间（临界值 = 1.960）分别是多少？
  question_zh_hk: 假設B店抽測 n = 64 杯打發飲品，樣本均值 = 70.0°C，sigma = 4.0°C。標準誤同 95% 嘅 Z 置信區間（臨界值 = 1.960）分別係幾多？
  options_en:
  - 'A: SE = 0.50°C; interval [69.02°C, 70.98°C]'
  - 'B: SE = 0.50°C; interval [69.50°C, 70.50°C]'
  - 'C: SE = 4.0 / 64 = 0.0625°C; interval [69.88°C, 70.12°C]'
  - 'D: SE = 0.50°C; interval [68.71°C, 71.29°C] using Z* = 2.576'
  options_zh:
  - 'A: 标准误 = 0.50°C；区间 [69.02°C, 70.98°C]'
  - 'B: 标准误 = 0.50°C；区间 [69.50°C, 70.50°C]'
  - 'C: 标准误 = 4.0 / 64 = 0.0625°C；区间 [69.88°C, 70.12°C]'
  - 'D: 标准误 = 0.50°C；区间 [68.71°C, 71.29°C]（误用临界值 2.576）'
  options_zh_hk:
  - 'A: 標準誤 = 0.50°C；區間 [69.02°C, 70.98°C]'
  - 'B: 標準誤 = 0.50°C；區間 [69.50°C, 70.50°C]'
  - 'C: 標準誤 = 4.0 / 64 = 0.0625°C；區間 [69.88°C, 70.12°C]'
  - 'D: 標準誤 = 0.50°C；區間 [68.71°C, 71.29°C]（誤用臨界值 2.576）'
  answer: A
  explanation_en: '√64 = 8, so SE = 4.0 / 8 = 0.50°C. Margin of error = 1.960 × 0.50 = 0.98°C, so 70.0 ± 0.98 gives [69.02, 70.98]. B uses ± one SE only; C divides by n instead of √n; D plugs in the 99% critical value.'
  explanation_zh: '√64 = 8，所以标准误 = 4.0 / 8 = 0.50°C。误差容限 = 1.960 × 0.50 = 0.98°C，于是 70.0 ± 0.98 得到 [69.02, 70.98]。B 只用了 ± 一个标准误；C 用 n 而不是 √n 去除；D 误用了 99% 的临界值。'
  explanation_zh_hk: '√64 = 8，所以標準誤 = 4.0 / 8 = 0.50°C。誤差容限 = 1.960 × 0.50 = 0.98°C，於是 70.0 ± 0.98 得到 [69.02, 70.98]。B 淨係用咗 ± 一個標準誤；C 用 n 而唔係 √n 去除；D 誤用咗 99% 嘅臨界值。'
beats:
- id: hook
  visual: title_card
  seconds: 36
  kicker: A quality-bracket fight
  kicker_en: A quality-bracket fight
  kicker_zh: 品控区间之争
  kicker_zh_hk: 品控區間之爭
  title_en: What is a Z-interval?
  title_zh: 什么是 Z 置信区间？
  title_zh_hk: 乜嘢係 Z 置信區間？
  en: >-
    Suppose Shop A steams milk for latte foam. Push past about seventy degrees
    Celsius and the proteins can scorch; drop near sixty and the foam collapses.
    A sample of one hundred drinks lands at an average of sixty-five degrees.
    Marketing wants a razor-thin bracket for the ad. Legal wants near-certain
    coverage. How wide must the quality bracket be — and which critical multiplier
    settles the fight? That tool is the Z-interval.
  zh: >-
    假设A店打发拿铁奶泡。温度靠近七十摄氏度，蛋白可能焦糊；靠近六十度，奶泡容易塌掉。抽测一百杯，样本均值落在六十五度。营销想要极窄的品控区间做宣传；法务想要更高的把握度。区间到底该拉多宽——哪个临界乘数能裁定这场争执？答案就是 Z 置信区间。
  zh_hk: >-
    假設A店打發鮮奶咖啡奶泡。溫度靠近七十攝氏度，蛋白可能焦糊；靠近六十度，奶泡容易冧。抽測一百杯，樣本均值落喺六十五度。營銷想要極窄嘅品控區間做宣傳；法務想要更高嘅把握度。區間到底應該拉幾闊——邊個臨界乘數可以裁定呢場爭執？答案就係 Z 置信區間。
- id: define
  visual: definition_card
  seconds: 46
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: Point ± critical × SE
  title_zh: 点估计 ± 临界值 × 标准误
  title_zh_hk: 點估計 ± 臨界值 × 標準誤
  formula: 'CI = sample mean ± Z* × SE'
  formula_zh: 置信区间 = 样本均值 ± 临界值 × 标准误
  formula_zh_hk: 置信區間 = 樣本均值 ± 臨界值 × 標準誤
  formula_tex: \text{CI}=\bar{X}\pm Z^{*}\cdot\frac{\sigma}{\sqrt{n}}
  gloss_en: 'SE = σ / √n'
  gloss_zh: 标准误 = σ / √n
  gloss_zh_hk: 標準誤 = σ / √n
  s1_en: >-
    When sigma is known and a Normal model for the sample mean is a fair working
    assumption, the Z-confidence interval keeps the point estimate and stretches
    left and right by a critical value times the standard error. Write SE for
    sigma over square root of n.
  s1_zh: >-
    当总体标准差 sigma 已知，并且样本均值可用正态模型作为合理工作假设时，Z 置信区间保留点估计，再向左右各伸出「临界值乘以标准误」的一段。标准误（SE）就是 sigma 除以根号 n。
  s1_zh_hk: >-
    當總體標準差 sigma 已知，兼且樣本均值可用正態模型作為合理工作假設嗰陣，Z 置信區間保留點估計，再向左右各伸出「臨界值乘以標準誤」嘅一段。標準誤（SE）就係 sigma 除以根號 n。
  s2_en: >-
    Confidence level equals one minus alpha. Split the leftover risk alpha into
    two equal tails. The critical value Z-star is the Normal cutoff that keeps
    the middle share intact. About two SE was yesterday’s rule of thumb; today
    we name the tabled multipliers.
  s2_zh: >-
    置信水平等于一减 alpha。把未覆盖风险 alpha 均分到两侧尾部。临界值（Z*）就是保住中间把握度的正态分界。昨天大约两个标准误是经验规矩；今天我们点名表上的临界乘数。
  s2_zh_hk: >-
    置信水平等於一減 alpha。將未覆蓋風險 alpha 均分到兩側尾部。臨界值（Z*）就係保住中間把握度嘅正態分界。尋日大約兩個標準誤係經驗規矩；今日我哋點名表上面嘅臨界乘數。
- id: name_zstar
  visual: title_card
  seconds: 16
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Critical value Z*
  title_zh: 临界值 Z*
  title_zh_hk: 臨界值 Z*
  en: >-
    Say it once out loud: critical value Z-star. It is the Normal table number
    that matches your confidence level before you multiply by the standard error.
  zh: >-
    大声念一次：临界值 Z 星号。它是匹配你所选置信水平的正态表值，之后再乘上标准误。
  zh_hk: >-
    大聲唸一次：臨界值 Z 星號。佢係匹配你所選置信水平嘅正態表值，之後再乘上標準誤。
- id: criticals
  visual: steps
  layout: rows
  seconds: 60
  kicker: Three tabled cutoffs
  kicker_en: Three tabled cutoffs
  kicker_zh: 三个表值
  kicker_zh_hk: 三個表值
  title_en: '90%, 95%, 99%'
  title_zh: 90%、95%、99%
  title_zh_hk: 90%、95%、99%
  step1_en: '90%: Z* = 1.645'
  step1_zh: '90%：临界值 = 1.645'
  step1_zh_hk: '90%：臨界值 = 1.645'
  step2_en: '95%: Z* = 1.960'
  step2_zh: '95%：临界值 = 1.960'
  step2_zh_hk: '95%：臨界值 = 1.960'
  step3_en: '99%: Z* = 2.576'
  step3_zh: '99%：临界值 = 2.576'
  step3_zh_hk: '99%：臨界值 = 2.576'
  s1_en: >-
    Ninety percent confidence uses Z-star one point six four five. Alpha is ten
    percent, so five percent sits in each tail. This is a nimble internal screen,
    not a courtroom claim.
  s1_zh: >-
    百分之九十置信水平用临界值一点六四五。alpha 是百分之十，所以每侧尾部各留百分之五。这适合敏捷的内部巡检，不是上法庭的宣称。
  s1_zh_hk: >-
    百分之九十置信水平用臨界值一點六四五。alpha 係百分之十，所以每側尾部各留百分之五。呢個適合敏捷嘅內部巡檢，唔係上法庭嘅宣稱。
  s2_en: >-
    Ninety-five percent is the everyday gold standard: Z-star one point nine six
    zero. Alpha is five percent, so each tail holds two point five percent — the
    Normal table’s ninety-seven point five percentile, not one point six four five.
  s2_zh: >-
    百分之九十五是日常黄金标准：临界值一点九六零。alpha 是百分之五；均分后每侧百分之二点五。上临界值对应标准正态第百分之九十七点五的分位——所以是一点九六，而不是一点六四五。
  s2_zh_hk: >-
    百分之九十五係日常黃金標準：臨界值一點九六零。alpha 係百分之五；均分後每側百分之二點五。上臨界值對應標準正態第百分之九十七點五嘅分位——所以係一點九六，而唔係一點六四五。
  s3_en: >-
    Ninety-nine percent pushes Z-star to two point five seven six. Each tail keeps
    only half a percent. You buy rarer misses, and you pay with a wider bracket —
    we will measure that cost on the next card.
  s3_zh: >-
    百分之九十九把临界值推到二点五七六。每侧尾部只留百分之零点五。你买到更少的脱靶，代价是更宽的区间——下一张卡片我们算出这笔账。
  s3_zh_hk: >-
    百分之九十九將臨界值推到二點五七六。每側尾部淨係留百分之零點五。你買到更少嘅脫靶，代價係更闊嘅區間——下一張卡片我哋計出呢筆數。
- id: givens
  visual: formula
  seconds: 18
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: the givens'
  title_zh: A店：已知条件
  title_zh_hk: A店：已知條件
  formula: 'sample mean = 65.0 · n = 100 · σ = 2.5'
  formula_zh: 样本均值 = 65.0 · n = 100 · σ = 2.5
  formula_zh_hk: 樣本均值 = 65.0 · n = 100 · σ = 2.5
  formula_tex: '\bar{X}=65.0,\ n=100,\ \sigma=2.5'
  en: >-
    Use made-up Shop A numbers. One hundred steamed drinks are sampled. The
    sample mean is sixty-five point zero degrees, and sigma is two point five.
  zh: >-
    用一组假设的A店数字。抽测一百杯打发饮品。样本均值是六十五点零度，sigma 是两点五度。
  zh_hk: >-
    用一組假設嘅A店數字。抽測一百杯打發飲品。樣本均值係六十五點零度，sigma 係兩點五度。
- id: ledger_se
  visual: steps
  layout: rows
  seconds: 30
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: find the SE'
  title_zh: A店：先算标准误
  title_zh_hk: A店：先計標準誤
  step1_en: '√100 = 10'
  step1_zh: '√100 = 10'
  step1_zh_hk: '√100 = 10'
  step2_en: 'SE = 2.5 / 10 = 0.25°C'
  step2_zh: '标准误 = 2.5 / 10 = 0.25°C'
  step2_zh_hk: '標準誤 = 2.5 / 10 = 0.25°C'
  s1_en: >-
    Open the square root first. One hundred is ten times ten, so the square root
    of one hundred is exactly ten.
  s1_zh: >-
    先开根号。一百是十乘十，所以根号一百正好是十。
  s1_zh_hk: >-
    先開方。一百係十乘十，所以根號一百啱啱好係十。
  s2_en: >-
    Standard error is two point five divided by ten: exactly zero point two five
    degrees. That is the wobble of the sample mean.
  s2_zh: >-
    标准误是两点五除以十：正好零点二五度。这就是样本均值通常晃多远。
  s2_zh_hk: >-
    標準誤係兩點五除以十：啱啱好零點二五度。呢個就係樣本均值通常晃幾遠。
- id: ledger_ci
  visual: steps
  layout: rows
  seconds: 80
  kicker: Attach the criticals
  kicker_en: Attach the criticals
  kicker_zh: 接上临界值
  kicker_zh_hk: 接上臨界值
  title_en: '90% vs 99% brackets'
  title_zh: 90% 与 99% 区间
  title_zh_hk: 90% 同 99% 區間
  step1_en: '90%: 1.645×0.25=0.411'
  step1_zh: '90%：1.645×0.25=0.411'
  step1_zh_hk: '90%：1.645×0.25=0.411'
  step2_en: '[64.59°C, 65.41°C]'
  step2_zh: '[64.59°C, 65.41°C]'
  step2_zh_hk: '[64.59°C, 65.41°C]'
  step3_en: '99%: 2.576×0.25=0.644'
  step3_zh: '99%：2.576×0.25=0.644'
  step3_zh_hk: '99%：2.576×0.25=0.644'
  step4_en: '[64.36°C, 65.64°C]'
  step4_zh: '[64.36°C, 65.64°C]'
  step4_zh_hk: '[64.36°C, 65.64°C]'
  step5_en: '0.822 → 1.288 (+56.6%)'
  step5_zh: '0.822 → 1.288（+56.6%）'
  step5_zh_hk: '0.822 → 1.288（+56.6%）'
  s1_en: >-
    For a ninety percent review, multiply zero point two five by one point six
    four five. The margin of error — MOE — is about zero point four one one degrees.
  s1_zh: >-
    做百分之九十的巡检，用零点二五乘一点六四五。误差容限（MOE）约零点四一一度。
  s1_zh_hk: >-
    做百分之九十嘅巡檢，用零點二五乘一點六四五。誤差容限（MOE）約零點四一一度。
  s2_en: >-
    Sixty-five point zero minus zero point four one one is sixty-four point five
    nine; plus the same margin is sixty-five point four one. That is the ninety
    percent bracket.
  s2_zh: >-
    六十五点零减零点四一一是六十四点五九；加上同一段容限是六十五点四一。这就是百分之九十区间。
  s2_zh_hk: >-
    六十五點零減零點四一一係六十四點五九；加上同一段容限係六十五點四一。呢個就係百分之九十區間。
  s3_en: >-
    If legal insists on ninety-nine percent, multiply by two point five seven six
    instead. The margin grows to about zero point six four four degrees.
  s3_zh: >-
    若法务坚持百分之九十九，改乘二点五七六。误差容限涨到约零点六四四度。
  s3_zh_hk: >-
    若法務堅持百分之九十九，改乘二點五七六。誤差容限漲到約零點六四四度。
  s4_en: >-
    Subtract and add that larger margin: sixty-four point three six through
    sixty-five point six four. Same center, wider belt.
  s4_zh: >-
    用更大的容限左右加减：六十四点三六到六十五点六四。中心不变，带子更宽。
  s4_zh_hk: >-
    用更大嘅容限左右加減：六十四點三六到六十五點六四。中心唔變，帶子更闊。
  s5_en: >-
    Width is twice the margin: about zero point eight two two up to one point two
    eight eight. Divide two point five seven six by one point six four five —
    about one point five six six, or roughly fifty-six percent wider.
  s5_zh: >-
    宽度是误差容限的两倍：约零点八二二升到一点二八八。二点五七六除以一点六四五约一点五六六——大约再宽百分之五十六。
  s5_zh_hk: >-
    闊度係誤差容限嘅兩倍：約零點八二二升到一點二八八。二點五七六除以一點六四五約一點五六六——大約再闊百分之五十六。
- id: rule
  visual: formula
  seconds: 20
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Operating rule
  title_zh: 操作规则
  title_zh_hk: 操作規則
  formula: 'CI = sample mean ± Z* × SE'
  formula_zh: 置信区间 = 样本均值 ± 临界值 × 标准误
  formula_zh_hk: 置信區間 = 樣本均值 ± 臨界值 × 標準誤
  formula_tex: '\text{CI}=\bar{X}\pm Z^{*}\cdot SE'
  en: >-
    The operating rule is confidence interval equals the sample mean plus or minus
    Z-star times SE.
  zh: >-
    操作规则是：置信区间等于样本均值加减临界值乘以标准误。
  zh_hk: >-
    操作規則係：置信區間等於樣本均值加減臨界值乘以標準誤。
- id: takeaway
  visual: takeaway
  seconds: 44
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Match Z* to the cost of a miss
  title_zh: 按脱靶代价选择临界值
  title_zh_hk: 按脫靶代價選擇臨界值
  q1_en: '90→99%: +56.6% width'
  q1_zh: '90→99%：宽度 +56.6%'
  q1_zh_hk: '90→99%：闊度 +56.6%'
  q2_en: '90% agile · 95% everyday · 99% costly miss'
  q2_zh: '90% 巡检 · 95% 日常 · 99% 脱靶很贵'
  q2_zh_hk: '90% 巡檢 · 95% 日常 · 99% 脫靶好貴'
  s1_en: >-
    Back to Shop A. Marketing’s thin ninety percent bracket was about zero point
    eight two degrees wide. Legal’s ninety-nine percent bracket was about fifty-six
    percent wider. Neither team is “wrong” — they priced different miss costs.
  s1_zh: >-
    回到A店。营销的百分之九十窄区间，宽约零点八二度。法务的百分之九十九区间，大约再宽百分之五十六。两边都不是“错”——他们给不同的脱靶代价标了价。
  s1_zh_hk: >-
    返到A店。營銷嘅百分之九十窄區間，闊約零點八二度。法務嘅百分之九十九區間，大約再闊百分之五十六。兩邊都唔係「錯」——佢哋畀唔同嘅脫靶代價標咗價。
  s2_en: >-
    Use ninety percent for agile internal checks, ninety-five percent as the everyday
    benchmark, and ninety-nine percent when a miss is truly costly.
  s2_zh: >-
    内部敏捷巡检可用百分之九十，日常对标用百分之九十五，脱靶代价真的很高时才上百分之九十九。
  s2_zh_hk: >-
    內部敏捷巡檢可用百分之九十，日常對標用百分之九十五，脫靶代價真係好高嗰陣先上百分之九十九。
  s3_en: >-
    So answer the foam fight with a named critical value and a worked bracket —
    not with a bare average and a vague promise of certainty.
  s3_zh: >-
    所以回答这场奶泡争执时，给出点名的临界值和算清的区间——而不是一个裸均值，外加含糊的“很有把握”。
  s3_zh_hk: >-
    所以回答呢場奶泡爭執嗰陣，畀出點名嘅臨界值同計清嘅區間——而唔係一個裸均值，外加含糊嘅「好有把握」。
