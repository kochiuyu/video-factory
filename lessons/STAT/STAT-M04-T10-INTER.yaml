quiz:
- id: Q1
  type: multiple_choice
  question_en: 'A junior analyst constructs a 95% confidence interval for average customer spend: [$46.00, $52.00]. Why is the statement ''There is a 95% probability that true mean spend mu lies between $46 and $52'' mathematically incorrect under frequentist statistics?'
  question_zh: 初级分析师为客单价构建了 95% 置信区间 [$46.00, $52.00]。为什么在频率学派统计里，声称「真实平均消费 mu 落在 $46 至 $52 之间的概率为 95%」在数学上是错的？
  question_zh_hk: 初級分析師為客單價構建咗 95% 置信區間 [$46.00, $52.00]。點解喺頻率學派統計入面，聲稱「真實平均消費 mu 落喺 $46 至 $52 之間嘅概率為 95%」喺數學上係錯嘅？
  options_en:
  - 'A: The true parameter mu is a fixed constant; once the interval numbers are calculated, mu is either inside (probability 1) or outside (probability 0). The 95% belongs to the long-run procedure.'
  - 'B: Because a 95% interval is valid only when the sample size is at least 30.'
  - 'C: Because after sampling, mu itself becomes a random variable with a Normal distribution.'
  - 'D: Because the margin of error must always equal exactly $3.00 for any spend interval.'
  options_zh:
  - 'A: 真参数 mu 是固定常数；一旦算出具体区间，mu 要么在里面（概率 1），要么在外面（概率 0）。95% 属于长期流程，不属于这组静态数字。'
  - 'B: 因为只有样本量至少为 30 时，95% 区间才合法。'
  - 'C: 因为抽样之后，mu 本身变成服从正态的随机变量。'
  - 'D: 因为任何客单区间的误差容限都必须刚好等于 $3.00。'
  options_zh_hk:
  - 'A: 真參數 mu 係固定常數；一旦計出具體區間，mu 一係喺入面（概率 1），一係喺外面（概率 0）。95% 屬於長期流程，唔屬於呢組靜態數字。'
  - 'B: 因為淨係樣本量至少為 30 嗰陣，95% 區間先合法。'
  - 'C: 因為抽樣之後，mu 本身變成服從正態嘅隨機變量。'
  - 'D: 因為任何客單區間嘅誤差容限都必須啱啱好等於 $3.00。'
  answer: A
  explanation_en: Parameters are fixed constants, not random variables. Once numbers are plugged in, the interval does not move; mu is either captured or missed. The 95% reflects the long-run success rate of the method across repeated samples.
  explanation_zh: 总体参数是固定常数，不是随机变量。一旦数值代入完毕，区间已经定格；mu 要么被罩住，要么脱靶。95% 指的是在重复抽样中，该方法构建区间捕获真值的长期成功率。
  explanation_zh_hk: 總體參數係固定常數，唔係隨機變量。一旦數值代入完畢，區間已經定格；mu 一係被罩住，一係脫靶。95% 指嘅係喺重複抽樣入面，嗰個方法構建區間捕獲真值嘅長期成功率。
- id: Q2
  type: multiple_choice
  question_en: Suppose 100 analysts each independently draw a random sample of 100 receipts at Shop B and each builds a 95% confidence interval for mu. What should you expect in the long run?
  question_zh: 假设 100 位分析师各自独立在B店随机抽取 100 张小票，并各自构建 95% 置信区间。长期来看，你应当预期什么？
  question_zh_hk: 假設 100 位分析師各自獨立喺B店隨機抽取 100 張單據，並各自構建 95% 置信區間。長期嚟睇，你應當預期咩？
  options_en:
  - 'A: About 95 of the 100 intervals will contain the true mu; about 5 will miss it.'
  - 'B: All 100 intervals will share the same center and the same width.'
  - 'C: Exactly 95% of all receipts in the store database will fall inside each interval.'
  - 'D: All 100 intervals will fail, because n = 100 is too small for the Central Limit Theorem.'
  options_zh:
  - 'A: 大约 95 个区间会罩住真实 mu，大约 5 个会脱靶。'
  - 'B: 这 100 个区间的中心与宽度全部完全相同。'
  - 'C: 店内数据库中恰好 95% 的原始小票金额会落在每个区间内。'
  - 'D: 100 个区间全部失败，因为 n = 100 太小，无法触发中心极限定理。'
  options_zh_hk:
  - 'A: 大約 95 個區間會罩住真實 mu，大約 5 個會脫靶。'
  - 'B: 呢 100 個區間嘅中心同闊度全部完全相同。'
  - 'C: 店內數據庫入面啱啱好 95% 嘅原始單據金額會落喺每個區間入面。'
  - 'D: 100 個區間全部失敗，因為 n = 100 太細，冇辦法觸發中心極限定理。'
  answer: A
  explanation_en: 95% confidence is a property of the sampling procedure. Across repeated independent trials, about 95% of the resulting intervals cover the fixed true parameter mu, while about 5% miss because of extreme sampling draws.
  explanation_zh: 95% 置信度是抽样流程的长期属性。在多次独立重复抽检中，约 95% 的区间能够罩住不变的总体真值 mu，约 5% 会因极端抽样而脱靶。
  explanation_zh_hk: 95% 置信度係抽樣流程嘅長期屬性。喺多次獨立重複抽檢入面，約 95% 嘅區間能夠罩住不變嘅總體真值 mu，約 5% 會因極端抽樣而脫靶。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker: A dangerous misreading
  kicker_en: A dangerous misreading
  kicker_zh: 危险的误读
  kicker_zh_hk: 危險嘅誤讀
  title_en: What does 95% confidence mean?
  title_zh: 95% 置信度是什么意思？
  title_zh_hk: 95% 置信度係乜意思？
  en: >-
    Suppose Shop A presents a ninety-five percent confidence interval for average
    customer spend: forty-six to fifty-two dollars. A manager hears those numbers
    and concludes there is a ninety-five percent chance the true mean sits inside
    that finished bracket. Treat that reading as almost-certain truth, and you can
    overfund a weak pitch or underfund a real risk. If the probability is not
    ninety-five percent, what does confidence actually mean?
  zh: >-
    假设A店给出客单价的百分之九十五置信区间：四十六元到五十二元。有人听成：真均值有百分之九十五的概率落在这个已经算完的区间里。把这种读法当成几乎确定的真相，你可能给弱方案加码，也可能低估真实风险。若不是九成五的命中概率，置信度究竟度量了什么？
  zh_hk: >-
    假設A店畀出客單價嘅百分之九十五置信區間：四十六蚊到五十二蚊。有人聽成：真均值有百分之九十五嘅概率落喺呢個已經計完嘅區間入面。將呢種讀法當成幾乎確定嘅真相，你可能畀弱方案加碼，亦可能低估真實風險。若果唔係九成五嘅命中概率，置信度究竟度量咗咩？
- id: define
  visual: definition_card
  seconds: 48
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: Fixed mean, moving interval
  title_zh: 均值固定，区间会动
  title_zh_hk: 均值固定，區間會郁
  formula: 'Before sample: P(L ≤ μ ≤ U) = 0.95'
  formula_zh: '抽样前：P(L ≤ μ ≤ U) = 0.95'
  formula_zh_hk: '抽樣前：P(L ≤ μ ≤ U) = 0.95'
  formula_tex: 'P\left(L \le \mu \le U\right) = 1 - \alpha'
  s1_en: >-
    Under frequentist statistics, the true population mean mu is an objective,
    fixed constant. It does not wander, and it does not wear a probability
    distribution of its own.
  s1_zh: >-
    在频率学派统计里，总体真实均值 mu 是客观固定的常数。它不会自己漂移，也没有属于自己的概率分布。
  s1_zh_hk: >-
    喺頻率學派統計入面，總體真實均值 mu 係客觀固定嘅常數。佢唔會自己漂移，亦冇屬於自己嘅概率分佈。
  s2_en: >-
    The random piece is the interval. Call the ends L and U — they depend on
    today's sample mean. Before you sample, the chance that the random interval
    covers mu is one minus alpha. After the numbers are locked, that chance is
    either one or zero.
  s2_zh: >-
    真正随机的是区间。把两端叫做 L 与 U——它们取决于今天的样本均值。抽样之前，随机区间罩住 mu 的概率是一减 alpha。数字锁定之后，这个概率只能是一或者零。
  s2_zh_hk: >-
    真正隨機嘅係區間。將兩端叫做 L 同 U——佢哋取決於今日嘅樣本均值。抽樣之前，隨機區間罩住 mu 嘅概率係一減 alpha。數字鎖定之後，呢個概率淨係可以係一或者零。
- id: name_coverage
  visual: title_card
  seconds: 28
  kicker: Name the idea
  kicker_en: Name the idea
  kicker_zh: 给它起名
  kicker_zh_hk: 畀佢起名
  title_en: Long-run coverage rate
  title_zh: 长期覆盖率
  title_zh_hk: 長期覆蓋率
  en: >-
    That long-run success rate of the method is the long-run coverage rate.
    Ninety-five percent confidence means about ninety-five of one hundred
    repeated intervals catch the fixed mean, not that today's finished numbers
    still carry a ninety-five percent probability.
  zh: >-
    方法的长期成功率，就叫做长期覆盖率。百分之九十五的置信度，指的是大约一百个重复区间里有九十五个罩住固定均值，而不是今天这组已经算完的数字还带着百分之九十五的概率。
  zh_hk: >-
    方法嘅長期成功率，就叫做長期覆蓋率。百分之九十五嘅置信度，指嘅係大約一百個重複區間入面有九十五個罩住固定均值，而唔係今日呢組已經計完嘅數字仲帶住百分之九十五嘅概率。
- id: mechanics
  visual: two_column
  seconds: 52
  kicker: The thought experiment
  kicker_en: The thought experiment
  kicker_zh: 思想实验
  kicker_zh_hk: 思想實驗
  title_en: One hundred repeat samples
  title_zh: 一百次重复样本
  title_zh_hk: 一百次重複樣本
  left_en: '~95 of 100 nets hit'
  left_zh: '约 100 次中 95 次命中'
  left_zh_hk: '約 100 次入面 95 次命中'
  right_en: 'One net: hit or miss'
  right_zh: '一张网：命中或脱靶'
  right_zh_hk: '一張網：命中或脫靶'
  s1_en: >-
    Picture one hundred independent repeat samples of the same size. Each sample
    builds its own ninety-five percent confidence interval around the sample
    mean.
  s1_zh: >-
    想象同样大小的一百次独立重复样本。每次样本各自围绕样本均值，建一个百分之九十五置信区间。
  s1_zh_hk: >-
    想像同樣大細嘅一百次獨立重複樣本。每次樣本各自圍繞樣本均值，建一個百分之九十五置信區間。
  s2_en: >-
    Because each sample mean lands somewhere different, each interval sits in a
    slightly different place. The true mean mu stays put — say at forty-eight
    dollars in this teaching story.
  s2_zh: >-
    因为每次样本均值落点不同，每个区间的位置也略有不同。真实均值 mu 却站着不动——在这个教学故事里，就放在四十八元。
  s2_zh_hk: >-
    因為每次樣本均值落點唔同，每個區間嘅位置亦略有唔同。真實均值 mu 卻企喺度唔郁——喺呢個教學故事入面，就放喺四十八蚊。
  s3_en: >-
    In the long run, about ninety-five of those one hundred intervals capture
    forty-eight dollars. About five miss. The ninety-five percent lives in that
    batting average of the procedure, not inside one finished pair of numbers.
  s3_zh: >-
    长期来看，这一百个区间里大约有九十五个能罩住四十八元，大约五个脱靶。百分之九十五活在流程的命中率里，不活在某一对已经算完的数字里。
  s3_zh_hk: >-
    長期嚟睇，呢一百個區間入面大約有九十五個能罩住四十八蚊，大約五個脫靶。百分之九十五活喺流程嘅命中率入面，唔活喺某一對已經計完嘅數字入面。
