  step1_en: 'Truth (unknown): μ = $48.20'
  step1_zh: '真值（未知）：μ = $48.20'
  step1_zh_hk: '真值（未知）：μ = $48.20'
  step2_en: 'A → [$46.69, $50.61] HIT'
  step2_zh: 'A → [$46.69, $50.61] 命中'
  step2_zh_hk: 'A → [$46.69, $50.61] 命中'
  step3_en: 'C → [$48.84, $52.76] MISS'
  step3_zh: 'C → [$48.84, $52.76] 脱靶'
  step3_zh_hk: 'C → [$48.84, $52.76] 脫靶'
  s1_en: >-
    Standing outside the sample, suppose the unknown chain-wide true mean mu is
    exactly forty-eight dollars and twenty cents.
  s1_zh: >-
    站在样本以外，假设未知的全网真均值 mu 正好是四十八块两毛。
  s1_zh_hk: >-
    企喺樣本之外，假設未知嘅全網真均值 mu 啱啱好係四十八蚊兩毫。
  s2_en: >-
    Sample A with margin one ninety-six builds forty-six sixty-nine to fifty
    sixty-one. Forty-eight twenty sits inside: a hit.
  s2_zh: >-
    样本 A 加上一块九毛六的误差容限，区间是四十六块六毛九到五十块六毛一。四十八块两毛在里面：命中。
  s2_zh_hk: >-
    樣本 A 加上一蚊九毫六嘅誤差容限，區間係四十六蚊六毫九到五十蚊六毫一。四十八蚊兩毫喺入面：命中。
  s3_en: >-
    Sample C with the same margin builds forty-eight eighty-four to fifty-two
    seventy-six. Forty-eight twenty sits below the lower end: a miss. That
    five-percent miss rate is the statistical cost of the procedure.
  s3_zh: >-
    样本 C 用同一误差容限，得到四十八块八毛四到五十二块七毛六。四十八块两毛低于下界：脱靶。这百分之五的脱靶率，就是流程必须承受的统计代价。
  s3_zh_hk: >-
    樣本 C 用同一誤差容限，得到四十八蚊八毫四到五十二蚊七毫六。四十八蚊兩毫低過下界：脫靶。呢個百分之五嘅脫靶率，就係流程必須承受嘅統計代價。
- id: takeaway
  visual: takeaway
  seconds: 70
  kicker: The rule
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Trust the procedure, not one net
  title_zh: 信任流程，不要迷信一张网
  title_zh_hk: 信任流程，唔好迷信一張網
  q1_en: '95% = long-run coverage'
  q1_zh: '95% = 长期覆盖率'
  q1_zh_hk: '95% = 長期覆蓋率'
  q2_en: 'Finished bracket: hit or miss'
  q2_zh: '算完的区间：命中或脱靶'
  q2_zh_hk: '計完嘅區間：命中或脫靶'
  s1_en: >-
    Back to Shop A. The manager asked whether forty-six to fifty-two still carried
    a ninety-five percent probability after the numbers locked. The answer is no:
    mu is fixed, and that finished bracket either caught it or missed it.
  s1_zh: >-
    回到A店。有人问：四十六到五十二在数字锁定之后，是否还带着百分之九十五的概率？答案是不：mu 是固定的，那个算完的区间要么罩住，要么脱靶。
  s1_zh_hk: >-
    返到A店。有人問：四十六到五十二喺數字鎖定之後，係咪仲帶住百分之九十五嘅概率？答案係唔係：mu 係固定嘅，嗰個計完嘅區間一係罩住，一係脫靶。
  s2_en: >-
    State it correctly: we are ninety-five percent confident in the sampling
    procedure — about nineteen of twenty repeated intervals capture the fixed
    mean. Sample C from forty-eight eighty-four missed forty-eight twenty.
  s2_zh: >-
    正确说法：我们对抽样流程有百分之九十五的信心——大约二十次里有十九次罩住固定均值。样本 C 从四十八块八毛四起，错过了四十八块两毛。
  s2_zh_hk: >-
    正確講法：我哋對抽樣流程有百分之九十五嘅信心——大約二十次入面有十九次罩住固定均值。樣本 C 由四十八蚊八毫四起，錯過咗四十八蚊兩毫。
  s3_en: >-
    Operating rule: never say the parameter has a ninety-five percent chance of
    lying in your finished interval. Trust the long-run coverage of the method —
    about ninety-five of one hundred repeated nets — not one single net.
  s3_zh: >-
    操作规则：不要说参数有百分之九十五的概率落在你已经算完的区间里。信任方法的长期覆盖率——大约一百张重复网里有九十五张——而不是迷信某一张网。
  s3_zh_hk: >-
    操作規則：唔好講參數有百分之九十五嘅概率落喺你已經計完嘅區間入面。信任方法嘅長期覆蓋率——大約一百張重複網入面有九十五張——而唔係迷信某一張網。
