id: STAT-M04-T10-INTER
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 322
title_en: Interpreting confidence
title_zh: 怎样解读置信度
title_zh_hk: 點樣解讀置信度
objective_en: Correct the classical frequentist fallacy regarding confidence intervals, establish that the population parameter
  is a fixed constant while intervals are random variables, simulate the 100-auditor thought experiment to demonstrate long-run
  coverage rates, and interpret Metro Coffee customer spend audit brackets.
objective_zh: 纠正将置信区间误读为参数落入概率的经典频率学派谬误，确立“总体参数为恒定客观常数，区间才是随机变动实体”的核心教义，通过 100 位审计员的思想实验阐明长期捕获覆盖率，并精准解读都市咖啡客单消费审计区间。
objective_zh_hk: 糾正將置信區間誤讀為參數落入概率嘅經典頻率學派謬誤，確立「總體參數為恆定客觀常數，區間先係隨機變動實體」嘅核心教義，透過 100 位審計員嘅思想實驗闡明長期捕獲覆蓋率，並精準解讀都市咖啡客單消費審計區間。
youtube:
  description_en: |-
    What does 95% confidence mean?

    Suppose Shop A reports a 95% confidence interval for average customer spend: [$46, $52]. A manager hears "there is a 95% chance the true mean sits inside those numbers." That reading is wrong under frequentist statistics — and it can make a team treat one finished bracket as almost certain truth.

    The population mean mu is a fixed unknown constant. It does not jump around after you sample. What moves is the interval: its ends depend on today's sample mean. Before you sample, the random interval covers mu with probability 1 − alpha (for 95%, that is 0.95). After you plug in numbers, the finished bracket either caught mu (probability 1) or missed it (probability 0).

    So 95% is a long-run coverage rate for the method. Imagine 100 independent repeat samples of the same size, each building its own 95% interval. About 95 of those 100 intervals will contain the fixed mu; about 5 will miss.

    Made-up numbers: suppose the unknown truth is mu = $48.20. Sample A lands at sample mean = $48.65 with margin of error $1.96, so [$46.69, $50.61] — a hit. Sample C lands at sample mean = $50.80 with the same margin, so [$48.84, $52.76] — a miss, because 48.20 sits below the lower end.

    Rule: never say "mu has a 95% probability of lying in this finished interval." Say you are 95% confident in the sampling procedure, because about nineteen of twenty repeated intervals capture the fixed mean.
  description_zh: |-
    百分之九十五的置信度究竟是什么意思？

    假设A店报告客单价的 95% 置信区间：[$46, $52]。有人听成「真均值有 95% 的概率落在这两个数之间」。在频率学派统计里，这个读法是错的——它会让团队把算完的单一区间当成几乎确定的真相。

    总体均值 mu 是固定的未知常数，抽完样也不会自己乱跳。会动的是区间：两端取决于今天的样本均值。抽样之前，随机区间覆盖 mu 的概率是 1 − alpha（95% 时就是 0.95）。一旦代入数字，算完的区间要么罩住 mu（概率 1），要么脱靶（概率 0）。

    所以 95% 是方法的长期覆盖率。想象同样大小的 100 次独立重复样本，每次各自建一个 95% 区间。大约 95 个区间会罩住固定的 mu，大约 5 个会脱靶。

    假设数字：未知真值 mu = $48.20。样本 A 得到样本均值 = $48.65，误差容限 $1.96，区间 [$46.69, $50.61]——命中。样本 C 得到样本均值 = $50.80，同一误差容限，区间 [$48.84, $52.76]——脱靶，因为 48.20 低于下界。

    规则：不要说「mu 有 95% 的概率落在这个已经算完的区间里」。要说你对抽样流程有 95% 的信心，因为大约二十次里有十九次，重复区间会罩住固定均值。
  description_zh_hk: |-
    百分之九十五嘅置信度究竟係乜意思？

    假設A店報告客單價嘅 95% 置信區間：[$46, $52]。有人聽成「真均值有 95% 嘅概率落喺呢兩個數之間」。喺頻率學派統計入面，呢個讀法係錯嘅——佢會令團隊將計完嘅單一區間當成幾乎確定嘅真相。

    總體均值 mu 係固定嘅未知常數，抽完樣亦唔會自己亂跳。會郁嘅係區間：兩端取決於今日嘅樣本均值。抽樣之前，隨機區間覆蓋 mu 嘅概率係 1 − alpha（95% 嗰陣就係 0.95）。一旦代入數字，計完嘅區間一係罩住 mu（概率 1），一係脫靶（概率 0）。

    所以 95% 係方法嘅長期覆蓋率。想像同樣大細嘅 100 次獨立重複樣本，每次各自建一個 95% 區間。大約 95 個區間會罩住固定嘅 mu，大約 5 個會脫靶。

    假設數字：未知真值 mu = $48.20。樣本 A 得到樣本均值 = $48.65，誤差容限 $1.96，區間 [$46.69, $50.61]——命中。樣本 C 得到樣本均值 = $50.80，同一誤差容限，區間 [$48.84, $52.76]——脫靶，因為 48.20 低過下界。

    規則：唔好講「mu 有 95% 嘅概率落喺呢個已經計完嘅區間入面」。要講你對抽樣流程有 95% 嘅信心，因為大約二十次入面有十九次，重複區間會罩住固定均值。
