id: STAT-M04-T10-INTER
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Interpreting confidence
title_zh: 真值恒定区间动：置信度的百人审计思想实验
title_zh_hk: 真值恆定區間動：置信度嘅百人審計思想實驗
objective_en: Correct the classical frequentist fallacy regarding confidence intervals, establish that the population parameter
  is a fixed constant while intervals are random variables, simulate the 100-auditor thought experiment to demonstrate long-run
  coverage rates, and interpret Metro Coffee customer spend audit brackets.
objective_zh: 纠正将置信区间误读为参数落入概率的经典频率学派谬误，确立“总体参数为恒定客观常数，区间才是随机变动实体”的核心教义，通过 100 位审计员的思想实验阐明长期捕获覆盖率，并精准解读都市咖啡客单消费审计区间。
objective_zh_hk: 糾正將置信區間誤讀為參數落入概率嘅經典頻率學派謬誤，確立「總體參數為恆定客觀常數，區間先係隨機變動實體」嘅核心教義，透過 100 位審計員嘅思想實驗闡明長期捕獲覆蓋率，並精準解讀都市咖啡客單消費審計區間。
