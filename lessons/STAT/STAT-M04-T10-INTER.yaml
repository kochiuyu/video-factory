  kicker_zh_hk: 商業法度
  title_en: Trust the protocol, not the single net
  title_zh: 敬畏流程长期胜率，莫对单一区间执迷绝对
  title_zh_hk: 敬畏流程長期勝率，咪對單一區間執迷絕對
  q1_en: Why is saying 'mu has a 95% probability of lying here' a red flag in executive presentations?
  q1_zh: 为什么在管理层汇报中声称“总体均值有 95% 概率落在此处”会暴露不专业？
  q1_zh_hk: 點解喺管理層匯報入面聲稱「總體均值有 95% 概率落喺呢度」會暴露唔專業？
  q2_en: How do we construct confidence intervals when estimating binary proportions rather than continuous spend?
  q2_zh: 当评估的指标不再是连续的客单金额，而是离散二元的业务转化比率时，区间又该如何构建？
  q2_zh_hk: 當評估嘅指標唔再係連續嘅客單金額，而係離散二元嘅業務轉化比率嗰陣，區間又應該點樣構建？
  s1_en: Never say the parameter has a ninety-five percent chance of being in your interval; the parameter is fixed, and your
    calculated bracket either caught it or it did not.
  s1_zh: 汇报时切勿声称总体参数有 95% 的概率落在你的区间内；参数客观恒定，你算出的区间要么命中、要么脱网，概率非零即一。
  s1_zh_hk: 匯報嗰陣切勿聲稱總體參數有 95% 嘅概率落喺你嘅區間入面；參數客觀恆定，你計出嚟嘅區間一係命中、一係脫網，概率非零即一。
  s2_en: 'State confidence correctly: we are ninety-five percent confident in our sampling methodology, knowing that repeated
    audits will capture truth nineteen times out of twenty.'
  s2_zh: 准确表述置信度：我们对该抽样质量控制规程抱有 95% 的信心，因为长期重复巡检构建的区间，每二十次必有十九次能精准捕获真值。
  s2_zh_hk: 準確表述置信度：我哋對嗰個抽樣質量控制規程抱有 95% 嘅信心，因為長期重複巡檢構建嘅區間，每二十次必有十九次能精準捕獲真值。
  s3_en: The operating rule is to trust the procedure, not one net. About 95 of 100 repeated intervals capture the fixed mean.
    Auditor C's bracket from $48.84 missed $48.20.
  s3_zh: 操作规则是信任流程，而不是信任一张网。重复构建的 100 个区间大约有 95 个罩住固定均值。审计员 C 从 $48.84 起的区间错过了 $48.20。
  s3_zh_hk: 操作規則係信任流程，而唔係信任一張網。重複構建嘅 100 個區間大約有 95 個罩住固定均值。審計員 C 由 $48.84 起嘅區間錯過咗 $48.20。
