  q1_en: Why should corporate financial models always budget against the lower bound of an upsell interval?
  q1_zh: 为什么商业财务回报模型必须严格依据转化率区间的下界来进行保守测算？
  q1_zh_hk: 點解商業財務回報模型必須嚴格依據轉化率區間嘅下界嚟進行保守測算？
  q2_en: What happens when our sample size is small and we don't know the population standard deviation?
  q2_zh: 若样本量极小且总体真实方差未知，正态分布模型又将面临何种致命挑战？
  q2_zh_hk: 若果樣本量極細兼且總體真實方差未知，正態分佈模型又將面臨咩致命挑戰？
  s1_en: Never pitch a digital transformation business case using raw sample conversion; forty percent was merely an empirical
    snapshot subject to random sampling error.
  s1_zh: 切勿仅凭单一样本转化率就仓促提交数字化转型提案；百分之四十仅仅是特定样本的微观抓拍，随时受制于随机抽样波动。
  s1_zh_hk: 切勿淨係憑單一樣本轉化率就倉促提交數碼化轉型提案；百分之四十淨係特定樣本嘅微觀抓拍，隨時受制於隨機抽樣波動。
  s2_en: 'Pressure-test return on investment against the lower bound: if Metro''s hardware rollout remains profitable at thirty-four
    point nine percent conversion, the project is commercially bulletproof.'
  s2_zh: 用区间下界压力测试投资回报：若全港铺设点单机在百分之三十四点九的最悲观底线下依然盈利，该千万级硬件投资方能立于不败之地。
  s2_zh_hk: 用區間下界壓力測試投資回報：若果全港鋪設點單機喺百分之三十四點九嘅最悲觀底線下依然有得賺，嗰個千萬級硬件投資先可以立於不敗之地。
  s3_en: The operating rule is to budget against the lower bound. One hundred forty accepts out of 350 give a 95% bracket
    of 34.87% to 45.13%.
  s3_zh: 操作规则是按区间下界做预算。350 笔中 140 次加购，95% 区间为 34.87% 至 45.13%。
  s3_zh_hk: 操作規則係按區間下界做預算。350 筆入面 140 次加購，95% 區間為 34.87% 至 45.13%。
