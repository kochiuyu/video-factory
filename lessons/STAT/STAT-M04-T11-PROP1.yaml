  title_en: 'Shop A: 95% bracket'
  title_zh: A店：95% 区间
  title_zh_hk: A店：95% 區間
  step1_en: 'Z* = 1.960'
  step1_zh: '临界值 = 1.960'
  step1_zh_hk: '臨界值 = 1.960'
  step2_en: 'MOE = 1.960 × 0.0262 ≈ 0.0513'
  step2_zh: '误差容限 = 1.960 × 0.0262 ≈ 0.0513'
  step2_zh_hk: '誤差容限 = 1.960 × 0.0262 ≈ 0.0513'
  step3_en: '0.40 ± 0.0513 → [34.87%, 45.13%]'
  step3_zh: '0.40 ± 0.0513 → [34.87%, 45.13%]'
  step3_zh_hk: '0.40 ± 0.0513 → [34.87%, 45.13%]'
  s1_en: >-
    For a ninety-five percent two-sided interval, the Normal table critical value
    is one point nine six zero — the same Z-star we used for means when sigma
    was known.
  s1_zh: >-
    百分之九十五的双尾区间，正态表临界值是一点九六零——和总体标准差已知时均值区间用的临界值相同。
  s1_zh_hk: >-
    百分之九十五嘅雙尾區間，正態表臨界值係一點九六零——同總體標準差已知時均值區間用嘅臨界值相同。
  s2_en: >-
    Margin of error equals Z-star times the standard error: one point nine six
    zero times zero point zero two six two is about zero point zero five one three,
    or five point one three percentage points.
  s2_zh: >-
    误差容限等于临界值乘以标准误：一点九六零乘零点零二六二，大约零点零五一三，也就是五个点一三个百分点。
  s2_zh_hk: >-
    誤差容限等於臨界值乘以標準誤：一點九六零乘零點零二六二，大約零點零五一三，亦即係五個點一三個百分點。
  s3_en: >-
    Add and subtract that margin from forty percent. The ninety-five percent
    conversion bracket runs from about thirty-four point nine percent up to
    forty-five point one percent.
  s3_zh: >-
    从百分之四十加减这段误差容限。百分之九十五的转化率区间大约从百分之三十四点九到四十五点一。
  s3_zh_hk: >-
    由百分之四十加減呢段誤差容限。百分之九十五嘅轉化率區間大約由百分之三十四點九到四十五點一。
- id: takeaway
  visual: takeaway
