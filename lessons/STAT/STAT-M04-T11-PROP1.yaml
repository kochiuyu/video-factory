title_en: Estimating market proportions
title_zh: 比例的置信区间
title_zh_hk: 比例嘅置信區間
objective_en: Construct a two-sided confidence interval for a population proportion using the sample proportion and its estimated
  standard error, check the success-failure counts, and read a kiosk upsell conversion bracket before a rollout decision.
objective_zh: 用样本比例及其估计标准误构建总体比例的双尾置信区间，核验成功-失败次数，并在门店自助点单机加购试点上读出转化率区间再做铺开决策。
objective_zh_hk: 用樣本比例同其估計標準誤構建總體比例嘅雙尾置信區間，核驗成功-失敗次數，並喺門市自助點單機加購試點上讀出轉化率區間先至做鋪開決策。
youtube:
  description_en: |-
    What is a confidence interval for a proportion?

    Suppose Shop A pilots a pastry upsell prompt on self-ordering kiosks. Out of 350 orders, 140 customers add a pastry — a sample share of 40%. A manager is ready to roll the hardware out on that single number. How wide is the true network conversion bracket?

    For a binary yes/no outcome, the sample proportion is p-hat = X / n. When the success-failure check clears (n × p-hat and n × (1 − p-hat) both at least 10), a Normal Z-interval is fair:
    CI = p-hat ± Z* × SE, with SE = sqrt(p-hat × (1 − p-hat) / n).

    Made-up Shop A numbers: n = 350, X = 140, so p-hat = 0.40.
    Successes 140 and failures 210 both clear 10.
    0.40 × 0.60 = 0.24; 0.24 / 350 ≈ 0.000686; SE ≈ sqrt(0.000686) ≈ 0.0262.
    At 95%, Z* = 1.960, so margin of error ≈ 1.960 × 0.0262 ≈ 0.0513.
    Interval: 0.40 ± 0.0513 → about [34.87%, 45.13%].

    Rule: do not pitch a rollout on the raw 40% alone. Pressure-test the plan against the lower bound of the interval.
  description_zh: |-
    什么是比例的置信区间？

    假设A店在自助点单机上试点烘焙点心加购提示。350 笔订单里有 140 位顾客加购——样本份额 40%。有人准备只凭这一个数字铺开硬件。全网真实转化率的区间到底有多宽？

    对是/否这类二元结果，样本比例 = X / n。当成功-失败检查通过（n × 样本比例 与 n × (1 − 样本比例) 都至少为 10）时，可用正态 Z 区间：
    置信区间 = 样本比例 ± 临界值 × 标准误，标准误 = 根号(样本比例 × (1 − 样本比例) / n)。

    假设A店数字：n = 350，X = 140，所以样本比例 = 0.40。
    成功 140、失败 210，都超过 10。
    0.40 × 0.60 = 0.24；0.24 / 350 ≈ 0.000686；标准误 ≈ 根号(0.000686) ≈ 0.0262。
    95% 时临界值 = 1.960，误差容限 ≈ 1.960 × 0.0262 ≈ 0.0513。
    区间：0.40 ± 0.0513 → 大约 [34.87%, 45.13%]。

    规则：不要只凭原始的 40% 去推铺开方案。用区间下界压力测试计划。
  description_zh_hk: |-
    乜嘢係比例嘅置信區間？

    假設A店喺自助點單機上試點烘焙點心加購提示。350 筆訂單入面有 140 位顧客加購——樣本份額 40%。有人準備淨係憑呢一個數字鋪開硬件。全網真實轉化率嘅區間到底有幾闊？

    對係/否呢類二元結果，樣本比例 = X / n。當成功-失敗檢查通過（n × 樣本比例 同 n × (1 − 樣本比例) 都至少為 10）嗰陣，可用正態 Z 區間：
    置信區間 = 樣本比例 ± 臨界值 × 標準誤，標準誤 = 根號(樣本比例 × (1 − 樣本比例) / n)。

    假設A店數字：n = 350，X = 140，所以樣本比例 = 0.40。
    成功 140、失敗 210，都超過 10。
    0.40 × 0.60 = 0.24；0.24 / 350 ≈ 0.000686；標準誤 ≈ 根號(0.000686) ≈ 0.0262。
    95% 時臨界值 = 1.960，誤差容限 ≈ 1.960 × 0.0262 ≈ 0.0513。
    區間：0.40 ± 0.0513 → 大約 [34.87%, 45.13%]。

    規則：唔好淨係憑原始嘅 40% 去推鋪開方案。用區間下界壓力測試計劃。
