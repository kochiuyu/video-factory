quiz:
- id: Q1
  type: multiple_choice
  question_en: When constructing a confidence interval for an unknown population proportion p, why must the standard error
    formula substitute the sample proportion p-hat in place of the true population parameter p?
  question_zh: 在构建未知总体比例 p 的置信区间时，为什么在标准误计算中必须以样本比例 p-hat 替代总体真实参数 p？
  question_zh_hk: 喺構建未知總體比例 p 嘅置信區間嗰陣，點解喺標準誤計算入面必須以樣本比例 p-hat 替代總體真實參數 p？
  options_en:
  - 'A: Because the true population parameter p is unknown and precisely the value being estimated, so p-hat serves as the
    best empirical plug-in estimate for variance.'
  - 'B: Because statistical software algorithms crash if the true parameter p is used in denominators.'
  - 'C: Because sample proportions always equal exactly 0.50 under market equilibrium.'
  - 'D: Because using p-hat artificially widens the interval to satisfy government accounting audits.'
  options_zh:
  - 'A: 因为总体真实比例 p 本身客观未知且正是待估目标，因而样本比例 p-hat 是计算抽样离散方差的最优实证代入估计量。'
  - 'B: 因为若在分母中强行调用总体参数 p，统计分析软件的底层算法会直接宕机崩溃。'
  - 'C: 因为在零售市场均衡状态下，所有产品的样本加购比例在数学上必定恒等于 0.50。'
  - 'D: 因为代入 p-hat 能够人为拉宽区间宽度，从而迎合政府监管部门的合规审计。'
  options_zh_hk:
  - 'A: 因為總體真實比例 p 本身客觀未知兼且正正係待估目標，因而樣本比例 p-hat 係計算抽樣離散方差嘅最優實證代入估計量。'
  - 'B: 因為若果喺分母入面強行調用總體參數 p，統計分析軟件嘅底層算法會直接冧機崩潰。'
  - 'C: 因為喺零售市場均衡狀態下，所有產品嘅樣本加購比例喺數學上必定恆等於 0.50。'
  - 'D: 因為代入 p-hat 能夠人為拉闊區間闊度，從而迎合政府監管部門嘅合規審計。'
  answer: A
  explanation_en: In estimation problems, the true parameter p is unknown. We estimate the standard error SE_p by plugging
    in the observed point estimator p-hat into sqrt(p-hat * (1 - p-hat) / n).
  explanation_zh: 在统计参数估计场景中，真值 p 客观未知。我们只能将实际观测到的无偏点估计量 p-hat 代入公式 根号(p-hat * (1 - p-hat) / n) 来估算抽样分布的标准误。
  explanation_zh_hk: 喺統計參數估計場景入面，真值 p 客觀未知。我哋淨係可以將實際觀測到嘅無偏點估計量 p-hat 代入公式 根號(p-hat * (1 - p-hat) / n) 嚟估算抽樣分佈嘅標準誤。
- id: Q2
  type: multiple_choice
  question_en: In a pilot test of self-ordering kiosks at the Airport branch, 140 out of 350 patrons accept a pastry upsell
    prompt (p-hat = 0.40). What is the 95% confidence interval for the true network conversion rate?
  question_zh: 在机场店自助点单机的试点排查中，350 位顾客中有 140 位接受了点心加购推荐（p-hat = 0.40）。该点单机全网真实加购转化率的 95% 置信区间是多少？
  question_zh_hk: 喺機場舖自助點單機嘅試點排查入面，350 位顧客入面有 140 位接受咗點心加購推薦（p-hat = 0.40）。嗰個點單機全網真實加購轉化率嘅 95% 置信區間係幾多？
  options_en:
  - 'A: SE ≈ sqrt(0.40 * 0.60 / 350) ≈ 0.0262; MOE = 1.96 * 0.0262 ≈ 0.0513 (5.13%); CI = [0.3487, 0.4513] or [34.87%, 45.13%]'
  - 'B: SE = 0.40 / sqrt(350) ≈ 0.0214; CI = [0.3581, 0.4419]'
  - 'C: MOE = 140 / 350 = 0.4000; CI = [0.0000, 0.8000]'
  - 'D: CI = [0.4000, 0.4000], because 350 transactions eliminates all estimation uncertainty'
  options_zh:
  - 'A: SE ≈ 根号(0.40 × 0.60 / 350) ≈ 0.0262；MOE = 1.96 × 0.0262 ≈ 0.0513（5.13%）；置信区间为 [34.87%, 45.13%]'
  - 'B: SE = 0.40 / 根号(350) ≈ 0.0214；置信区间为 [35.81%, 44.19%]'
  - 'C: MOE = 140 / 350 = 0.4000；置信区间为 [0.0000, 0.8000]'
  - 'D: 置信区间为 [0.4000, 0.4000]，因为 350 笔订单样本足以消除一切抽样不确定度'
  options_zh_hk:
  - 'A: SE ≈ 根號(0.40 × 0.60 / 350) ≈ 0.0262；MOE = 1.96 × 0.0262 ≈ 0.0513（5.13%）；置信區間為 [34.87%, 45.13%]'
  - 'B: SE = 0.40 / 根號(350) ≈ 0.0214；置信區間為 [35.81%, 44.19%]'
  - 'C: MOE = 140 / 350 = 0.4000；置信區間為 [0.0000, 0.8000]'
  - 'D: 置信區間為 [0.4000, 0.4000]，因為 350 筆訂單樣本足以消除一切抽樣不確定度'
  answer: A
  explanation_en: Variance is 0.40 * 0.60 / 350 = 0.0006857, giving SE = sqrt(0.0006857) ≈ 0.02619. For 95% confidence, MOE
    = 1.960 * 0.02619 ≈ 0.0513. The interval is 0.40 +/- 0.0513, yielding [34.87%, 45.13%].
  explanation_zh: 方差项为 0.40 × 0.60 / 350 ≈ 0.0006857，开根号得估计标准误 SE ≈ 0.02619。对应 95% 置信度，MOE = 1.960 × 0.02619 ≈ 0.0513。区间为
    0.40 ± 0.0513，即 [34.87%, 45.13%]。
  explanation_zh_hk: 方差項為 0.40 × 0.60 / 350 ≈ 0.0006857，開根號得估計標準誤 SE ≈ 0.02619。對應 95% 置信度，MOE = 1.960 × 0.02619 ≈ 0.0513。區間為
    0.40 ± 0.0513，即 [34.87%, 45.13%]。
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: The Kiosk Rollout Bet
  kicker_en: The Kiosk Rollout Bet
  kicker_zh: 自助点单机千万元豪赌
  kicker_zh_hk: 自助點單機千萬元豪賭
  title_en: Will pastry upsells justify the digital investment?
  title_zh: 加购转化实测四成：我们真能全网铺开点单机吗？
  title_zh_hk: 加購轉化實測四成：我哋真係可以全網鋪開點單機咩？
  en: 'Metro Coffee considers investing ten million dollars to install interactive digital self-ordering kiosks across Wan
    Chai, Mong Kok, and the Airport. The commercial business case hinges entirely on automated pastry upsells: popping up
    a heated butter croissant prompt before checkout. In a trial run at the Airport terminal, one hundred and forty out of
    three hundred and fifty customers accept the pastry prompt—a sample conversion rate of exactly forty percent. The Chief
    Commercial Officer is ready to sign the contract. But wait: what is the true conversion bracket across the entire network?'
  zh: 都市咖啡正评估一项耗资千万的重磅数字化基建：在湾仔、旺角和机场全线门店加装交互式自助点单机。这项巨额投资的财务回报模型，完全押注在结账前自动弹窗推荐烘焙可颂的加购转化率上。在机场店的设备试运行中，三百五十位点单顾客中有整整一百四十位顺手加购了面点——实测样本转化率整整达到百分之四十。商务总监迫不及待准备签字拍板。然而，这套交互界面在全港大盘上的真实转化区间究竟落在何处？
  zh_hk: 都市咖啡正評估一項耗資千萬嘅重磅數碼化基建：喺灣仔、旺角同機場全線門市加裝交互式自助點單機。呢項巨額投資嘅財務回報模型，完全押注喺結賬前自動彈窗推薦烘焙牛角包嘅加購轉化率上。喺機場舖嘅設備試運行入面，三百五十位點單顧客入面有整整一百四十位順便加購咗面點——實測樣本轉化率整整達到百分之四十。商務總監迫不及待準備簽字拍板。然而，呢套交互界面喺全港大盤上嘅真實轉化區間究竟落喺邊度？
- id: define
  visual: definition_card
  seconds: 34
  kicker: What It Is
  kicker_en: What It Is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: The proportion confidence interval
  title_zh: 总体比例置信区间数学范式
  title_zh_hk: 總體比例置信區間數學範式
  formula: CI = p-hat +/- Z*(alpha / 2) * sqrt(p-hat * (1 - p-hat) / n)
  formula_zh: 比例置信区间 = 样本比例 ± Z* 临界值 × 根号下 (p-hat × (1 - p-hat) / n)
  formula_zh_hk: 比例置信區間 = 樣本比例 ± Z* 臨界值 × 根號下 (p-hat × (1 - p-hat) / n)
  formula_tex: \text{CI} = \hat{p} \pm Z^*_{\alpha/2} \cdot \sqrt{\frac{\hat{p}(1 - \hat{p})}{n}}
  s1_en: When analyzing binary outcomes like upselling or churn, the true population proportion p is unknown. We use the observed
    sample proportion p-hat as our unbiased point estimator.
  s1_zh: 在度量加购成功与否或客户流失这类二元商业行为时，总体真实比率 p 隐秘未知。我们选取实际观测到的样本比例 p-hat 作为最客观的无偏点估计量。
  s1_zh_hk: 喺度量加購成功與否抑或客戶流失呢類二元商業行為嗰陣，總體真實比率 p 隱秘未知。我哋選取實際觀測到嘅樣本比例 p-hat 作為最客觀嘅無偏點估計量。
  s2_en: Because we cannot know true p to calculate variance, we plug in p-hat to estimate standard error. Multiplying by
    critical value Z star generates a robust confidence interval around our estimate.
  s2_zh: 正因为真值 p 未知导致我们无法直接计算理论方差，我们以 p-hat 代入来估算抽样标准误。乘上对应的 Z 临界值，便在点估计周围撑起了一道无惧波动的置信区间。
  s2_zh_hk: 正正因為真值 p 未知搞到我哋冇辦法直接計算理論方差，我哋以 p-hat 代入嚟估算抽樣標準誤。乘上對應嘅 Z 臨界值，就喺點估計周圍撐起咗一道無懼波動嘅置信區間。
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: The Prerequisite Check
  kicker_en: The Prerequisite Check
  kicker_zh: 准入核验
  kicker_zh_hk: 准入核驗
  title_en: The empirical success-failure check
  title_zh: 实证层面的成功-失败核验
  title_zh_hk: 實證層面嘅成功-失敗核驗
  left_en: 'Sample Rule: n*p-hat >= 10 and n*(1 - p-hat) >= 10'
  left_zh: 实操准则：实测成功数与失败数双双不少于十例
  left_zh_hk: 實操準則：實測成功數與失敗數雙雙唔少於十例
  right_en: 'Skew Trap: Small samples or extreme proportions break normality'
  right_zh: 偏斜陷阱：样本不足或极端比率将导致区间边界严重失真
  right_zh_hk: 偏斜陷阱：樣本不足或極端比率將搞到區間邊界嚴重失真
  s1_en: 'Before deploying normal Z multipliers on proportions, we must verify the empirical success-failure rule using our
    observed counts: n times p-hat and n times one minus p-hat must both reach at least ten.'
  s1_zh: 在将正态 Z 标尺应用于比例估计之前，必须用实测数据严格检核成功-失败法则：观测到的成功次数 n 乘 p-hat 与失败次数 n 乘 1 减 p-hat 必须双双达到十次以上。
  s1_zh_hk: 喺將正態 Z 標尺應用喺比例估計之前，必須用實測數據嚴格檢核成功-失敗法則：觀測到嘅成功次數 n 乘 p-hat 與失敗次數 n 乘 1 減 p-hat 必須雙雙達到十次以上。
  s2_en: If an upsell is extremely rare—say, only two customers out of one hundred accept—the binomial distribution skews
    hard against zero, and the standard symmetric Z-interval breaks down.
  s2_zh: 若加购行为极其罕见——比如一百人中仅有两人接受——二项分布会死死撞在零值边界上发生剧烈偏倚，此时标准对称的 Z 区间公式将彻底失效。
  s2_zh_hk: 若果加購行為極其罕見——好似一百人入面淨係得兩個人接受——二項分佈會死死撞喺零值邊界上發生劇烈偏倚，呢個時候標準對稱嘅 Z 區間公式將徹底失效。
  s3_en: In our Airport pilot, one hundred and forty successes and two hundred and ten failures easily clear the hurdle, unlocking
    rigorous normal inference.
  s3_zh: 在机场店试点中，实测一百四十次成功加购与二百一十次未加购，轻松跨过十次门槛，完全具备调用正态推断的合法资格。
  s3_zh_hk: 喺機場舖試點入面，實測一百四十次成功加購與二百一十次未加購，輕鬆跨過十次門檻，完全具備調用正態推斷嘅合法資格。
- id: ledger
  visual: steps
  seconds: 36
  kicker: The Ledger
  kicker_en: The Ledger
  kicker_zh: 账目精算
  kicker_zh_hk: 賬目精算
  title_en: Auditing Airport kiosk upsell conversion
  title_zh: 机场店自助加购转化区间实算
  title_zh_hk: 機場舖自助加購轉化區間實算
  step1_en: 'Pilot baseline: n = 350, X = 140 accepts -> p-hat = 140 / 350 = 0.40 (40.0%)'
  step1_zh: 试点基准：n = 350 笔，加购 X = 140 单 -> 样本转化率 p-hat = 140 / 350 = 0.40
  step1_zh_hk: 試點基準：n = 350 筆，加購 X = 140 單 -> 樣本轉化率 p-hat = 140 / 350 = 0.40
  step2_en: 'Estimated SE: sqrt(0.40 * 0.60 / 350) = sqrt(0.000686) ≈ 0.0262 (2.62%)'
  step2_zh: 估计标准误：根号(0.40 × 0.60 / 350) = 根号(0.000686) ≈ 0.0262（2.62%）
  step2_zh_hk: 估計標準誤：根號(0.40 × 0.60 / 350) = 根號(0.000686) ≈ 0.0262（2.62%）
  step3_en: '95% Bracket: 0.40 +/- 1.96 * 0.0262 = 0.40 +/- 0.0513 -> [34.87%, 45.13%]'
  step3_zh: 95% 置信区间：0.40 ± 1.96 × 0.0262 = 0.40 ± 0.0513 -> 认证区间：[34.87%, 45.13%]
  step3_zh_hk: 95% 置信區間：0.40 ± 1.96 × 0.0262 = 0.40 ± 0.0513 -> 認證區間：[34.87%, 45.13%]
  s1_en: Audit the Airport terminal digital pilot log. Across n equals three hundred and fifty kiosk transactions, exactly
    one hundred and forty customers clicked add a pastry to order, establishing our empirical point estimate at forty percent.
  s1_zh: 调阅机场航站楼数字试点日志。在三百五十笔自助点单机交易中，恰好有一百四十位顾客点击了“加购现烤可颂”，样本点估计转化率实打实录得百分之四十。
  s1_zh_hk: 調閱機場航站樓數碼試點日誌。喺三百五十筆自助點單機交易入面，啱啱好有一百四十位顧客點擊咗「加購現烤牛角包」，樣本點估計轉化率實打實錄得百分之四十。
  s2_en: 'Step two computes estimated standard error: zero point forty times zero point sixty divided by three hundred and
    fifty, all under the square root. That yields zero point zero two six two, or roughly two point six percent.'
  s2_zh: 第二步计算样本比例的估计标准误：零点四零乘零点六零除以三百五十，整体开平方根。精确求得零点零二六二，折合约二点六个百分点的抽样离散幅度。
  s2_zh_hk: 第二步計算樣本比例嘅估計標準誤：零點四零乘零點六零除以三百五十，整體開平方根。精確求得零點零二六二，折合約二點六個百分點嘅抽樣離散幅度。
  s3_en: Step three scales by our ninety-five percent critical multiplier of one point nine six, giving a margin of error
    of five point one three percent. Our ninety-five percent certified conversion bracket spans thirty-four point eight seven
    to forty-five point one three percent.
  s3_zh: 第三步乘上百分之九十五置信水平的一点九六临界乘数，得出误差容限为五个点一三。全网真实转化率的百分之九十五认证区间落定在百分之三十四点八七至四十五点一三之间。
  s3_zh_hk: 第三步乘上百分之九十五置信水平嘅一點九六臨界乘數，得出誤差容限為五個點一三。全網真實轉化率嘅百分之九十五認證區間落定喺百分之三十四點八七至四十五點一三之間。
