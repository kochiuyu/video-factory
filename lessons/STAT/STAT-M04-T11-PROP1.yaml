  kicker: Decision rule
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Budget against the lower bound
  title_zh: 按区间下界做预算
  title_zh_hk: 按區間下界做預算
  q1_en: Why not pitch the rollout on raw 40%?
  q1_zh: 为什么不能只凭原始的 40% 铺开？
  q1_zh_hk: 點解唔可以淨係憑原始嘅 40% 鋪開？
  q2_en: 'Shop A 140/350: what is the 95% bracket?'
  q2_zh: A店 140/350 的 95% 区间是多少？
  q2_zh_hk: A店 140/350 嘅 95% 區間係幾多？
  s1_en: >-
    Forty percent was one sample snapshot. Sampling noise still swings the share
    by a few percentage points either way — that is what the standard error
    measured.
  s1_zh: >-
    百分之四十只是一次样本快照。抽样噪声仍会让份额左右摆几个百分点——标准误量的就是这件事。
  s1_zh_hk: >-
    百分之四十淨係一次樣本快照。抽樣噪聲仍然會令份額左右擺幾個百分點——標準誤量嘅就係呢件事。
  s2_en: >-
    Pressure-test the hardware plan against the lower bound. If the rollout still
    looks workable near thirty-five percent conversion, the case is sturdier than
    a pitch that needs the lucky forty.
  s2_zh: >-
    用区间下界压力测试硬件方案。如果转化率靠近百分之三十五时方案仍然说得通，就比必须押中幸运的百分之四十更稳。
  s2_zh_hk: >-
    用區間下界壓力測試硬件方案。如果轉化率靠近百分之三十五時方案仍然講得通，就比一定要押中幸運嘅百分之四十更穩。
  s3_en: >-
    Operating rule: for a yes-or-no share, build p-hat ± Z-star times SE after the
    success-failure check. On Shop A, one hundred forty of three hundred fifty
    give about thirty-four point nine to forty-five point one percent at ninety-five
    percent confidence.
  s3_zh: >-
    操作规则：对是非份额，通过成功-失败检查后，建「样本比例 ± 临界值 × 标准误」。A店三百五十笔里一百四十次加购，百分之九十五置信下大约百分之三十四点九到四十五点一。
  s3_zh_hk: >-
    操作規則：對係非份額，通過成功-失敗檢查之後，建「樣本比例 ± 臨界值 × 標準誤」。A店三百五十筆入面一百四十次加購，百分之九十五置信下大約百分之三十四點九到四十五點一。
