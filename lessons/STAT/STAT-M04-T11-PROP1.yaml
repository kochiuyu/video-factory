  title_en: What is a CI for a proportion?
  title_zh: 什么是比例的置信区间？
  title_zh_hk: 乜嘢係比例嘅置信區間？
  en: >-
    Suppose Shop A pilots a pastry upsell prompt on self-ordering kiosks. Out of
    three hundred and fifty orders, one hundred and forty customers add a pastry —
    a sample share of forty percent. A manager is ready to roll the hardware out
    on that single number. How wide is the true network conversion bracket? That
    tool is a confidence interval for a proportion.
  zh: >-
    假设A店在自助点单机上试点烘焙点心加购提示。三百五十笔订单里，有一百四十位顾客加购——样本份额百分之四十。有人准备只凭这一个数字铺开硬件。全网真实转化率的区间到底有多宽？答案就是比例的置信区间。
  zh_hk: >-
    假設A店喺自助點單機上試點烘焙點心加購提示。三百五十筆訂單入面，有一百四十位顧客加購——樣本份額百分之四十。有人準備淨係憑呢一個數字鋪開硬件。全網真實轉化率嘅區間到底有幾闊？答案就係比例嘅置信區間。
- id: define
  visual: definition_card
  seconds: 46
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: p-hat ± Z* × SE
  title_zh: 样本比例 ± 临界值 × 标准误
  title_zh_hk: 樣本比例 ± 臨界值 × 標準誤
  formula: 'CI = p-hat ± Z* × SE'
  formula_zh: 置信区间 = 样本比例 ± 临界值 × 标准误
  formula_zh_hk: 置信區間 = 樣本比例 ± 臨界值 × 標準誤
  formula_tex: '\widehat{p}\ \pm\ Z^{*}\cdot\sqrt{\widehat{p}(1-\widehat{p})/n}'
  gloss_en: 'SE = sqrt(p-hat(1 − p-hat)/n)'
  gloss_zh: 标准误 = 根号(样本比例×(1−样本比例)/n)
  gloss_zh_hk: 標準誤 = 根號(樣本比例×(1−樣本比例)/n)
  s1_en: >-
    For a yes-or-no outcome — accept the pastry prompt, or skip it — the unknown
    population share is p. The sample proportion p-hat equals X over n: the count
    of yeses divided by the sample size. That is our point estimate.
  s1_zh: >-
    对「接受加购提示」或「跳过」这类是非结果，未知的总体份额是 p。样本比例等于 X 除以 n：成功次数除以样本量。这就是点估计。
  s1_zh_hk: >-
    對「接受加購提示」或者「跳過」呢類係非結果，未知嘅總體份額係 p。樣本比例等於 X 除以 n：成功次數除以樣本量。呢個就係點估計。
  s2_en: >-
    Because true p is unknown, we estimate the standard error by plugging p-hat
    into the square-root formula. Multiply by the critical value Z-star — for
    ninety-five percent, one point nine six zero — and the confidence interval
    stretches left and right around the point estimate.
  s2_zh: >-
    因为真实的 p 未知，我们把样本比例代入开根号公式，得到估计标准误。再乘上临界值；百分之九十五时是一点九六零。置信区间就在点估计左右撑开。
  s2_zh_hk: >-
    因為真實嘅 p 未知，我哋將樣本比例代入開根號公式，得到估計標準誤。再乘上臨界值；百分之九十五時係一點九六零。置信區間就喺點估計左右撐開。
- id: name_phat
  visual: title_card
  seconds: 16
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Sample proportion p-hat
  title_zh: 样本比例
  title_zh_hk: 樣本比例
  en: >-
    Say it once: sample proportion, written p-hat. It is the share of ones in the
    sample — the count of yeses over n — before we build any interval around it.
  zh: >-
    大声念一次：样本比例。它是样本里「是」的份额——成功次数除以 n——之后才在它周围撑起区间。
  zh_hk: >-
    大聲唸一次：樣本比例。佢係樣本入面「係」嘅份額——成功次數除以 n——之後先喺佢周圍撐起區間。
- id: condition
  visual: steps
  layout: rows
  seconds: 48
  kicker: Before the Normal tool
  kicker_en: Before the Normal tool
  kicker_zh: 动用正态工具之前
  kicker_zh_hk: 用正態工具之前
  title_en: Success-failure check
  title_zh: 成功-失败检查
  title_zh_hk: 成功-失敗檢查
  step1_en: 'Need n × p-hat ≥ 10'
  step1_zh: '需要 n × 样本比例 ≥ 10'
  step1_zh_hk: '需要 n × 樣本比例 ≥ 10'
  step2_en: 'Need n × (1 − p-hat) ≥ 10'
  step2_zh: '需要 n × (1 − 样本比例) ≥ 10'
  step2_zh_hk: '需要 n × (1 − 樣本比例) ≥ 10'
  step3_en: 'Shop A: 140 and 210 both clear'
  step3_zh: 'A店：140 与 210 都过线'
  step3_zh_hk: 'A店：140 同 210 都過線'
  s1_en: >-
    Before you multiply by a Normal Z-star, check the counts. n times p-hat — the
    number of observed successes — must reach at least ten.
  s1_zh: >-
    乘上正态临界值之前，先检查次数。n 乘样本比例——样本里的成功次数——至少要到十。
  s1_zh_hk: >-
    乘上正態臨界值之前，先檢查次數。n 乘樣本比例——樣本入面嘅成功次數——至少要到十。
  s2_en: >-
    And n times one minus p-hat — the failures — must also reach at least ten.
    Extreme shares or tiny samples leave the binomial skewed against zero or one,
    and the symmetric Z-interval stops being fair.
  s2_zh: >-
    n 乘一减样本比例——失败次数——也至少要到十。份额太极端或样本太小，二项分布会贴着零或一偏斜，对称的 Z 区间就不再公道。
  s2_zh_hk: >-
    n 乘一減樣本比例——失敗次數——都至少要到十。份額太極端或者樣本太細，二項分佈會貼住零或者一偏斜，對稱嘅 Z 區間就唔再公道。
  s3_en: >-
    On the made-up Shop A pilot, one hundred forty accepts and two hundred ten
    skips both clear the bar, so the Normal Z-interval is on the table.
  s3_zh: >-
    在假设的A店试点里，一百四十次加购、二百一十次未加购，都过了门槛，所以可以动用正态 Z 区间。
  s3_zh_hk: >-
    喺假設嘅A店試點入面，一百四十次加購、二百一十次未加購，都過咗門檻，所以可以用正態 Z 區間。
- id: ledger_se
  visual: steps
  layout: rows
  seconds: 56
  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: find the SE'
  title_zh: A店：先算标准误
  title_zh_hk: A店：先計標準誤
  step1_en: '140 / 350 = 0.40'
  step1_zh: '140 / 350 = 0.40'
  step1_zh_hk: '140 / 350 = 0.40'
  step2_en: '0.40 × 0.60 = 0.24'
  step2_zh: '0.40 × 0.60 = 0.24'
  step2_zh_hk: '0.40 × 0.60 = 0.24'
  step3_en: '0.24 / 350 ≈ 0.000686'
  step3_zh: '0.24 / 350 ≈ 0.000686'
  step3_zh_hk: '0.24 / 350 ≈ 0.000686'
  step4_en: 'SE ≈ √0.000686 ≈ 0.0262'
  step4_zh: '标准误 ≈ √0.000686 ≈ 0.0262'
  step4_zh_hk: '標準誤 ≈ √0.000686 ≈ 0.0262'
  s1_en: >-
    Start with the point estimate. One hundred forty accepts over three hundred
    fifty orders is exactly zero point forty — forty percent.
  s1_zh: >-
    先写点估计。一百四十次加购除以三百五十笔订单，正好是零点四十——百分之四十。
  s1_zh_hk: >-
    先寫點估計。一百四十次加購除以三百五十筆訂單，啱啱係零點四十——百分之四十。
  s2_en: >-
    Next form p-hat times one minus p-hat: zero point forty times zero point sixty
    equals zero point twenty-four. That is the estimated Bernoulli variance factor.
  s2_zh: >-
    下一步算样本比例乘以一减样本比例：零点四十乘零点六十等于零点二十四。这是伯努利方差里的估计因子。
  s2_zh_hk: >-
    下一步計樣本比例乘以一減樣本比例：零點四十乘零點六十等於零點二十四。呢個係伯努利方差入面嘅估計因子。
  s3_en: >-
    Divide that factor by n: zero point twenty-four over three hundred fifty is
    about zero point zero zero zero six eight six.
  s3_zh: >-
    把这个因子除以 n：零点二十四除以三百五十，大约零点零零零六八六。
  s3_zh_hk: >-
    將呢個因子除以 n：零點二十四除以三百五十，大約零點零零零六八六。
  s4_en: >-
    Take the square root. The estimated standard error is about zero point zero
    two six two — roughly two point six percentage points of sampling noise.
  s4_zh: >-
    开平方。估计标准误大约零点零二六二——大约两个六点百分点的抽样噪声。
  s4_zh_hk: >-
    開平方。估計標準誤大約零點零二六二——大約兩個六個百分點嘅抽樣噪聲。
