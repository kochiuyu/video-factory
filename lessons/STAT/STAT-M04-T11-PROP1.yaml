title_en: Estimating market proportions
title_zh: 比率的置信区间：自助点单机加购转化率测定
title_zh_hk: 比率嘅置信區間：自助點單機加購轉化率測定
objective_en: Construct two-sided confidence intervals for a population proportion using sample proportion p-hat and estimated
  standard error, verify the sample size sufficiency criteria, and evaluate pastry upsell conversion rates on Airport digital
  kiosks before approving chain-wide hardware rollouts.
objective_zh: 利用样本比例 p-hat 及其估计标准误构建双尾总体比例置信区间，核验正态近似充分性准则，并在全网推广前对机场店自助点单机烘焙点心加购转化率实施科学区间测定与资本回报评估。
objective_zh_hk: 利用樣本比例 p-hat 同其估計標準誤構建雙尾總體比例置信區間，核驗正態近似充分性準則，並喺全網推廣前對機場舖自助點單機烘焙點心加購轉化率實施科學區間測定與資本回報評估。
