quiz:
- id: Q1
  type: multiple_choice
  question_en: When constructing a confidence interval for an unknown population proportion p, why does the standard error formula plug in the sample proportion p-hat instead of the true p?
  question_zh: 在构建未知总体比例 p 的置信区间时，为什么标准误公式要用样本比例代入，而不是真实的 p？
  question_zh_hk: 喺構建未知總體比例 p 嘅置信區間嗰陣，點解標準誤公式要用樣本比例代入，而唔係真實嘅 p？
  options_en:
  - 'A: Because the true p is unknown — it is exactly the value we are estimating — so p-hat is the plug-in we have for the variance.'
  - 'B: Because using the true p would always make the standard error equal to zero.'
  - 'C: Because the Normal table requires p-hat to be exactly 0.50 before any interval is valid.'
  - 'D: Because plugging in p-hat automatically doubles the margin of error for every sample size.'
  options_zh:
  - 'A: 因为真实的 p 本身未知——它正是要估计的目标——所以只能把样本比例代入方差。'
  - 'B: 因为如果用真实的 p，标准误会永远等于零。'
  - 'C: 因为正态表要求样本比例必须恰好等于 0.50，区间才有效。'
  - 'D: 因为代入样本比例会自动把任何样本量下的误差容限加倍。'
  options_zh_hk:
  - 'A: 因為真實嘅 p 本身未知——佢正正係要估計嘅目標——所以淨係可以將樣本比例代入方差。'
  - 'B: 因為如果用真實嘅 p，標準誤會永遠等於零。'
  - 'C: 因為正態表要求樣本比例必須啱啱等於 0.50，區間先有效。'
  - 'D: 因為代入樣本比例會自動將任何樣本量下嘅誤差容限加倍。'
  answer: A
  explanation_en: In estimation, p is unknown. The estimated standard error therefore uses sqrt(p-hat × (1 − p-hat) / n), with the observed sample proportion as the plug-in.
  explanation_zh: 在估计问题里，p 未知。估计标准误因此用 根号(样本比例 × (1 − 样本比例) / n)，把样本里的比例作为代入值。
  explanation_zh_hk: 喺估計問題入面，p 未知。估計標準誤因此用 根號(樣本比例 × (1 − 樣本比例) / n)，將樣本入面嘅比例作為代入值。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B runs a kiosk pilot: n = 200 orders, X = 70 pastry accepts, so p-hat = 0.35. What are the estimated SE and the 95% Z-interval (Z* = 1.960)?'
  question_zh: 假设B店试点自助点单机：n = 200 笔，加购 X = 70，样本比例 = 0.35。估计标准误与 95% 的 Z 置信区间（临界值 = 1.960）分别是多少？
  question_zh_hk: 假設B店試點自助點單機：n = 200 筆，加購 X = 70，樣本比例 = 0.35。估計標準誤同 95% 嘅 Z 置信區間（臨界值 = 1.960）分別係幾多？
  options_en:
  - 'A: SE ≈ 0.0337; interval about [0.284, 0.416]'
  - 'B: SE ≈ 0.0337; interval about [0.316, 0.384] (plus or minus one SE only)'
  - 'C: SE = 0.35 / sqrt(200) ≈ 0.0247; interval about [0.302, 0.398]'
  - 'D: SE ≈ 0.0337; interval about [0.263, 0.437] using Z* = 2.576'
  options_zh:
  - 'A: 标准误 ≈ 0.0337；区间大约 [0.284, 0.416]'
  - 'B: 标准误 ≈ 0.0337；区间大约 [0.316, 0.384]（只加减一个标准误）'
  - 'C: 标准误 = 0.35 / 根号(200) ≈ 0.0247；区间大约 [0.302, 0.398]'
  - 'D: 标准误 ≈ 0.0337；区间大约 [0.263, 0.437]（误用临界值 2.576）'
  options_zh_hk:
  - 'A: 標準誤 ≈ 0.0337；區間大約 [0.284, 0.416]'
  - 'B: 標準誤 ≈ 0.0337；區間大約 [0.316, 0.384]（淨係加減一個標準誤）'
  - 'C: 標準誤 = 0.35 / 根號(200) ≈ 0.0247；區間大約 [0.302, 0.398]'
  - 'D: 標準誤 ≈ 0.0337；區間大約 [0.263, 0.437]（誤用臨界值 2.576）'
  answer: A
  explanation_en: 'SE = sqrt(0.35 × 0.65 / 200) = sqrt(0.0011375) ≈ 0.0337. Margin of error = 1.960 × 0.0337 ≈ 0.0661, so 0.35 ± 0.0661 ≈ [0.284, 0.416]. B uses ± one SE; C uses the wrong SE shape; D plugs in the 99% critical value.'
  explanation_zh: '标准误 = 根号(0.35 × 0.65 / 200) = 根号(0.0011375) ≈ 0.0337。误差容限 = 1.960 × 0.0337 ≈ 0.0661，于是 0.35 ± 0.0661 ≈ [0.284, 0.416]。B 只用了 ± 一个标准误；C 用了错误的标准误形状；D 误用了 99% 的临界值。'
  explanation_zh_hk: '標準誤 = 根號(0.35 × 0.65 / 200) = 根號(0.0011375) ≈ 0.0337。誤差容限 = 1.960 × 0.0337 ≈ 0.0661，於是 0.35 ± 0.0661 ≈ [0.284, 0.416]。B 淨係用咗 ± 一個標準誤；C 用咗錯誤嘅標準誤形狀；D 誤用咗 99% 嘅臨界值。'
