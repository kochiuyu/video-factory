id: STAT-M04-T12-STUDT
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 372
title_en: Unknown variance and Student's t
title_zh: 未知方差与学生 t 分布
title_zh_hk: 未知方差同學生 t 分佈
objective_en: Distinguish between standard normal Z and Student's t distributions, explain why replacing unknown population
  variance sigma with sample standard deviation s inflates estimation uncertainty through degrees of freedom df = n - 1, and
  evaluate water filter hardness across a pilot sample of 10 taps at Wan Chai.
objective_zh: 严格区分标准正态 Z 分布与学生 t 分布，解析在总体真实方差 sigma 未知时以样本标准差 s 替代所引入的双重不确定性及自由度 df = n - 1 的几何本质，并对湾仔店 10 个新装净水滤芯水质硬度进行小样本试点评估。
objective_zh_hk: 嚴格區分標準正態 Z 分佈與學生 t 分佈，解析喺總體真實方差 sigma 未知嗰陣以樣本標準差 s 替代所引入嘅雙重不確定性及自由度 df = n - 1 嘅幾何本質，並對灣仔舖 10 個新裝淨水濾芯水質硬度進行小樣本試點評估。
youtube:
  description_en: |-
    What is Student's t-distribution?

    Suppose Shop A installs ten new water-filter taps. A hardness check of all ten lands at an average of 72.0 ppm, with sample standard deviation s = 4.2 ppm. The true population sigma is unknown. A junior auditor reaches for the Normal Z* = 1.960. Why is that dangerously thin for a small pilot?

    When sigma is unknown, replace it with s. But s itself wobbles from sample to sample, so the standardized statistic
    t = (sample mean − μ) / (s / √n)
    follows Student's t with df = n − 1, not the standard Normal.

    Made-up Shop A numbers: n = 10, sample mean = 72.0 ppm, s = 4.2 ppm.
    df = 10 − 1 = 9.
    √10 ≈ 3.162, so SE = 4.2 / 3.162 ≈ 1.328 ppm.
    At 95%, Z* = 1.960 but t*(df = 9) = 2.262 — about 15% wider.
    Margin with t: 2.262 × 1.328 ≈ 3.00 ppm. With Z it would be only about 2.60 ppm.

    Rule: when sigma is unknown and n is small, pay the heavy-tail cost — use t*, not 1.960.
  description_zh: |-
    什么是学生 t 分布？

    假设A店新装了十个净水龙头。对这十个点位做硬度巡测，样本均值 72.0 ppm，样本标准差 s = 4.2 ppm。总体真实的 sigma 未知。助理随手拿正态临界值 1.960。为什么在小样本试点上这样会把区间压得过窄？

    当 sigma 未知时，用 s 代替。但 s 本身也会抽样晃动，所以标准化统计量
    t = (样本均值 − μ) / (s / √n)
    服从自由度为 n − 1 的学生 t 分布，而不是标准正态。

    假设A店数字：n = 10，样本均值 = 72.0 ppm，s = 4.2 ppm。
    自由度 = 10 − 1 = 9。
    √10 ≈ 3.162，所以标准误 = 4.2 / 3.162 ≈ 1.328 ppm。
    95% 时 Z 临界值 = 1.960，但 t 临界值（自由度 9）= 2.262——大约宽 15%。
    用 t 的误差容限：2.262 × 1.328 ≈ 3.00 ppm。若用 Z，大约只有 2.60 ppm。

    规则：总体标准差未知且样本小时，要付厚尾代价——用 t 临界值，不要用 1.960。
  description_zh_hk: |-
    乜嘢係學生 t 分佈？

    假設A店新裝咗十個淨水龍頭。對呢十個點位做硬度巡測，樣本均值 72.0 ppm，樣本標準差 s = 4.2 ppm。總體真實嘅 sigma 未知。助理隨手拎正態臨界值 1.960。點解喺小樣本試點上咁樣會將區間壓得過窄？

    當 sigma 未知嗰陣，用 s 代替。但 s 本身都會抽樣晃動，所以標準化統計量
    t = (樣本均值 − μ) / (s / √n)
    服從自由度為 n − 1 嘅學生 t 分佈，而唔係標準正態。

    假設A店數字：n = 10，樣本均值 = 72.0 ppm，s = 4.2 ppm。
    自由度 = 10 − 1 = 9。
    √10 ≈ 3.162，所以標準誤 = 4.2 / 3.162 ≈ 1.328 ppm。
    95% 時 Z 臨界值 = 1.960，但 t 臨界值（自由度 9）= 2.262——大約闊 15%。
    用 t 嘅誤差容限：2.262 × 1.328 ≈ 3.00 ppm。若果用 Z，大約淨係得 2.60 ppm。

    規則：總體標準差未知兼且樣本細嗰陣，要付厚尾代價——用 t 臨界值，唔好用 1.960。
