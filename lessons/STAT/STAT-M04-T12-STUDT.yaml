  kicker: A worked example
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: df and SE'
  title_zh: A店：自由度与标准误
  title_zh_hk: A店：自由度同標準誤
  step1_en: 'df = 10 − 1 = 9'
  step1_zh: '自由度 = 10 − 1 = 9'
  step1_zh_hk: '自由度 = 10 − 1 = 9'
  step2_en: '√10 ≈ 3.162'
  step2_zh: '√10 ≈ 3.162'
  step2_zh_hk: '√10 ≈ 3.162'
  step3_en: 'SE = 4.2 / 3.162 ≈ 1.328 ppm'
  step3_zh: '标准误 = 4.2 / 3.162 ≈ 1.328 ppm'
  step3_zh_hk: '標準誤 = 4.2 / 3.162 ≈ 1.328 ppm'
  s1_en: >-
    Degrees of freedom first: ten taps minus one free parameter for the mean
    leaves nine. Write df equals nine.
  s1_zh: >-
    先算自由度：十个龙头，减去均值占去的一个自由参数，剩下九。写下自由度等于九。
  s1_zh_hk: >-
    先計自由度：十個龍頭，減去均值佔去嘅一個自由參數，剩低九。寫低自由度等於九。
  s2_en: >-
    Open the square root. Ten is not a perfect square, so √10 is about three
    point one six two.
  s2_zh: >-
    再开根号。十不是完全平方数，所以根号十大约是三点一六二。
  s2_zh_hk: >-
    再開方。十唔係完全平方數，所以根號十大約係三點一六二。
  s3_en: >-
    Standard error is four point two divided by three point one six two —
    about one point three two eight ppm. That is the wobble of the sample mean
    when we estimate sigma with s.
  s3_zh: >-
    标准误是四点二除以三点一六二——大约一点三二八 ppm。这就是用 s 估计 sigma 时，样本均值通常晃多远。
  s3_zh_hk: >-
    標準誤係四點二除以三點一六二——大約一點三二八 ppm。呢個就係用 s 估計 sigma 嗰陣，樣本均值通常晃幾遠。
- id: ledger_moe
  visual: steps
  layout: rows
  seconds: 70
  kicker: Attach the criticals
  kicker_en: Attach the criticals
  kicker_zh: 接上临界值
  kicker_zh_hk: 接上臨界值
  title_en: 'Z* vs t*: the margin'
  title_zh: Z 与 t：误差容限
  title_zh_hk: Z 同 t：誤差容限
  step1_en: 'Z* = 1.960 · t*(df=9) = 2.262'
  step1_zh: 'Z 临界值 = 1.960 · t 临界值(自由度9) = 2.262'
  step1_zh_hk: 'Z 臨界值 = 1.960 · t 臨界值(自由度9) = 2.262'
  step2_en: 'MOE_Z ≈ 1.960×1.328 ≈ 2.60'
  step2_zh: 'Z 误差容限 ≈ 1.960 × 1.328 ≈ 2.60 ppm'
  step2_zh_hk: 'Z 誤差容限 ≈ 1.960 × 1.328 ≈ 2.60 ppm'
  step3_en: 'MOE_t ≈ 2.262×1.328 ≈ 3.00'
  step3_zh: 't 误差容限 ≈ 2.262 × 1.328 ≈ 3.00 ppm'
  step3_zh_hk: 't 誤差容限 ≈ 2.262 × 1.328 ≈ 3.00 ppm'
  step4_en: 't* is about 15% wider than Z*'
  step4_zh: 't 临界值大约比 Z 宽 15%'
  step4_zh_hk: 't 臨界值大約比 Z 闊 15%'
  s1_en: >-
    Look up both cutoffs at ninety-five percent. The Normal table still says
    one point nine six zero. Student's table at nine degrees of freedom says
    two point two six two.
  s1_zh: >-
    在百分之九十五上对照两个临界值。正态表仍是一点九六零。自由度九的学生 t 表是二点二六二。
  s1_zh_hk: >-
    喺百分之九十五上對照兩個臨界值。正態表仍然係一點九六零。自由度九嘅學生 t 表係二點二六二。
  s2_en: >-
    Multiply the Normal cutoff by the standard error: one point nine six zero
    times one point three two eight is about two point six zero ppm. That is
    the thin margin the junior auditor almost used.
  s2_zh: >-
    用正态临界值乘上标准误：一点九六零乘一点三二八，大约二点六零 ppm。这就是助理差点用上的偏窄容限。
  s2_zh_hk: >-
    用正態臨界值乘上標準誤：一點九六零乘一點三二八，大約兩點六零 ppm。呢個就係助理差啲用上嘅偏窄容限。
  s3_en: >-
    Now multiply by the t cutoff: two point two six two times one point three
    two eight is about three point zero zero ppm. That is the honest margin.
  s3_zh: >-
    再用 t 临界值去乘：二点二六二乘一点三二八，大约三点零零 ppm。这才是诚实的误差容限。
  s3_zh_hk: >-
    再用 t 臨界值去乘：二點二六二乘一點三二八，大約三點零零 ppm。呢個先係誠實嘅誤差容限。
  s4_en: >-
    Two point two six two over one point nine six zero is about one point one
    five — a fifteen percent wider multiplier. Using Z would understate the
    margin by roughly thirteen percent against the t answer.
  s4_zh: >-
    二点二六二除以一点九六零大约一点一五——乘数宽约百分之十五。若用 Z，相对 t 的答案会把误差容限低估大约百分之十三。
  s4_zh_hk: >-
    二點二六二除以一點九六零大約一點一五——乘數闊約百分之十五。若果用 Z，相對 t 嘅答案會將誤差容限低估大約百分之十三。
- id: takeaway
  visual: takeaway
  seconds: 40
  kicker: Decision rule
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Pay the heavy-tail cost
  title_zh: 付上厚尾代价
  title_zh_hk: 付上厚尾代價
  q1_en: When does Student's t approach Z?
  q1_zh: 学生 t 何时会靠回标准正态 Z？
  q1_zh_hk: 學生 t 幾時會靠返標準正態 Z？
  q2_en: Which cutoff for Shop A's ten taps?
  q2_zh: A店质检在十个龙头上该用哪个临界值？
  q2_zh_hk: A店質檢喺十個龍頭上應該用邊個臨界值？
  s1_en: >-
    Never paste Normal Z-star onto a small sample when population sigma is
    unknown. Use Student's t so the denominator noise is paid for in the tails.
  s1_zh: >-
    总体标准差未知、样本又小时，不要把正态 Z 临界值硬贴上去。改用学生 t，让分母的噪声在尾部被如实计价。
  s1_zh_hk: >-
    總體標準差未知、樣本又細嗰陣，唔好將正態 Z 臨界值硬貼上去。改用學生 t，等分母嘅噪聲喺尾部被如實計價。
  s2_en: >-
    As n grows into the hundreds, degrees of freedom climb, the heavy-tail
    penalty fades, and t converges back toward Z.
  s2_zh: >-
    当样本量扩到数百、自由度升高时，厚尾惩罚会慢慢消退，t 会重新靠向 Z。
  s2_zh_hk: >-
    當樣本量擴到數百、自由度升高嗰陣，厚尾懲罰會慢慢消退，t 會重新靠向 Z。
  s3_en: >-
    So for Shop A's ten taps and nine degrees of freedom, reject one point nine
    six zero. Use t-star two point two six two and a margin near three point
    zero zero ppm — that answers the thin-bracket trap from the hook.
  s3_zh: >-
    所以对A店的十个龙头、自由度九，拒绝一点九六零。用 t 临界值二点二六二，误差容限大约三点零零 ppm——这就回答了开场那个过窄区间的陷阱。
  s3_zh_hk: >-
    所以對A店嘅十個龍頭、自由度九，拒絕一點九六零。用 t 臨界值二點二六二，誤差容限大約三點零零 ppm——呢個就回答咗開場嗰個過窄區間嘅陷阱。
