  q1_en: When does the Student's t-distribution converge back into the standard normal curve?
  q1_zh: 学生氏 t 分布会在何时渐进收敛退化回标准正态 Z 曲线？
  q1_zh_hk: 學生氏 t 分佈會喺幾時漸進收斂退化返標準正態 Z 曲線？
  q2_en: How do we construct complete confidence intervals using t-distributions for core coffee metrics?
  q2_zh: 在核心咖啡品控指标中，我们该如何完整落地构建 t 置信区间？
  q2_zh_hk: 喺核心咖啡品控指標入面，我哋應該點樣完整落地構建 t 置信區間？
  s1_en: Never use standard normal Z critical values on small samples when population variance is unknown; always enforce
    Student's t to honor the true statistical noise.
  s1_zh: 当总体方差未知且样本规模受限时，严禁滥用标准正态 Z 标尺；务必遵从学生氏 t 分布，如实接纳分母波动所带来的客观风险。
  s1_zh_hk: 當總體方差未知兼且樣本規模受限嗰陣，嚴禁濫用標準正態 Z 標尺；務必遵從學生氏 t 分佈，如實接納分母波動所帶嚟嘅客觀風險。
  s2_en: As sample size expands into hundreds, degrees of freedom climb, the tail penalty fades away, and t smoothly converges
    back to Z.
  s2_zh: 只有当抽样量逐步扩大至数百笔流水、自由度突破大关时，厚尾惩罚才会自然消退，t 分布方才平滑收敛回归至高斯正态。
  s2_zh_hk: 淨係得當抽樣量逐步擴大至數百筆流水、自由度突破大關嗰陣，厚尾懲罰先會自然消退，t 分佈先至平滑收斂回歸至高斯正態。
  s3_en: The operating rule is to use t star, not 1.960, when sigma is unknown and n is small. Ten taps and nine degrees of
    freedom put the 95% cutoff at 2.262 and the margin at 3.00 ppm.
  s3_zh: 操作规则是总体标准差未知且样本小时用 t 星号，不用 1.960。十个龙头、自由度 9，95% 临界值为 2.262，容限为 3.00 ppm。
  s3_zh_hk: 操作規則係總體標準差未知兼且樣本細嗰陣用 t 星號，唔用 1.960。十個龍頭、自由度 9，95% 臨界值為 2.262，容限為 3.00 ppm。
