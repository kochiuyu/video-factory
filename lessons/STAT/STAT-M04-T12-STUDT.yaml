quiz:
- id: Q1
  type: multiple_choice
  question_en: Why does the standardized statistic t = (sample mean − mu) / (s / sqrt(n)) follow Student's t with heavier tails than Z when the sample is small?
  question_zh: 当样本量较小时，为什么标准化统计量 t = (样本均值 − mu) / (s / 根号(n)) 服从尾部厚于标准正态 Z 的学生 t 分布？
  question_zh_hk: 當樣本量較細嗰陣，點解標準化統計量 t = (樣本均值 − mu) / (s / 根號(n)) 服從尾部厚過標準正態 Z 嘅學生 t 分佈？
  options_en:
  - 'A: Because replacing fixed sigma with the random sample s adds noise in the denominator, so extreme values appear more often.'
  - 'B: Because water sensors measure particles instead of currency, so Normal tables cannot apply.'
  - 'C: Because degrees of freedom force every continuous distribution to become a discrete integer.'
  - 'D: Because using s always doubles the standard error for every sample size.'
  options_zh:
  - 'A: 因为用变动的样本标准差 s 替代固定的总体常数 sigma，在分母里多加了一层随机波动，极值更常出现。'
  - 'B: 因为水质传感器测的是微粒浓度而不是货币金额，所以正态表不能用。'
  - 'C: 因为自由度会把任何连续分布强制变成离散整数。'
  - 'D: 因为使用 s 会把任何样本量下的标准误自动加倍。'
  options_zh_hk:
  - 'A: 因為用變動嘅樣本標準差 s 替代固定嘅總體常數 sigma，喺分母入面多加咗一層隨機波動，極值更常出現。'
  - 'B: 因為水質傳感器測嘅係微粒濃度而唔係貨幣金額，所以正態表唔能用。'
  - 'C: 因為自由度會將任何連續分佈強制變成離散整數。'
  - 'D: 因為使用 s 會將任何樣本量下嘅標準誤自動加倍。'
  answer: A
  explanation_en: In a Z score only the numerator (the sample mean) is random. In t, both the numerator and the denominator s are random. When n is small, wobble in s fattens the tails.
  explanation_zh: 在 Z 分数里，只有分子（样本均值）是随机的。在 t 统计量里，分子和分母 s 都是随机的。样本量小时，s 自身的晃动把概率推向两翼。
  explanation_zh_hk: 喺 Z 分數入面，淨係得分子（樣本均值）係隨機。喺 t 統計量入面，分子同分母 s 都係隨機。樣本量細嗰陣，s 自身嘅晃動將概率推向兩翼。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop B checks n = 16 filter taps with sample SD s = 5.0 ppm (df = 15). For a 95% interval, SE = 5.0 / 4 = 1.25 and t* = 2.131. What is the t-based margin of error?'
  question_zh: 假设B店抽测 n = 16 个滤水龙头，样本标准差 s = 5.0 ppm（自由度 = 15）。做 95% 区间时，标准误 = 5.0 / 4 = 1.25，t 临界值 = 2.131。用 t 的误差容限是多少？
  question_zh_hk: 假設B店抽測 n = 16 個濾水龍頭，樣本標準差 s = 5.0 ppm（自由度 = 15）。做 95% 區間嗰陣，標準誤 = 5.0 / 4 = 1.25，t 臨界值 = 2.131。用 t 嘅誤差容限係幾多？
  options_en:
  - 'A: About 2.66 ppm (2.131 × 1.25)'
  - 'B: 2.45 ppm (1.960 × 1.25, using Z* instead of t*)'
  - 'C: 0.3125 ppm (5.0 / 16, dividing by n not √n)'
  - 'D: 10.655 ppm (2.131 × 5.0, forgetting to divide by √n)'
  options_zh:
  - 'A: 大约 2.66 ppm（2.131 × 1.25）'
  - 'B: 2.45 ppm（1.960 × 1.25，误用 Z 临界值）'
  - 'C: 0.3125 ppm（5.0 / 16，用 n 而不是 √n）'
  - 'D: 10.655 ppm（2.131 × 5.0，忘了除以 √n）'
  options_zh_hk:
  - 'A: 大約 2.66 ppm（2.131 × 1.25）'
  - 'B: 2.45 ppm（1.960 × 1.25，誤用 Z 臨界值）'
  - 'C: 0.3125 ppm（5.0 / 16，用 n 而唔係 √n）'
  - 'D: 10.655 ppm（2.131 × 5.0，唔記得除以 √n）'
  answer: A
  explanation_en: 'Margin of error = t* × SE = 2.131 × 1.25 ≈ 2.66 ppm. B swaps in the Normal Z*; C divides by n; D multiplies t* by s and skips √n.'
  explanation_zh: '误差容限 = t 临界值 × 标准误 = 2.131 × 1.25 ≈ 2.66 ppm。B 误用了正态 Z 临界值；C 用 n 去除；D 用 t 临界值乘上 s 却跳过了 √n。'
  explanation_zh_hk: '誤差容限 = t 臨界值 × 標準誤 = 2.131 × 1.25 ≈ 2.66 ppm。B 誤用咗正態 Z 臨界值；C 用 n 去除；D 用 t 臨界值乘上 s 卻跳過咗 √n。'
beats:
- id: hook
  visual: title_card
  seconds: 42
  kicker: The unknown-sigma trap
  kicker_en: The unknown-sigma trap
  kicker_zh: 未知方差的陷阱
  kicker_zh_hk: 未知方差嘅陷阱
  title_en: What is Student's t?
  title_zh: 什么是学生 t 分布？
  title_zh_hk: 乜嘢係學生 t 分佈？
  en: >-
    Suppose Shop A installs ten new water-filter taps to steady espresso water.
    A hardness check of all ten lands at seventy-two point zero parts per million,
    with a sample standard deviation of four point two. The true population sigma
    is unknown — this filter model is brand new. A junior auditor still reaches
    for the Normal cutoff one point nine six zero. Why is that dangerously thin
    for a small pilot? The honest answer is Student's t-distribution.
  zh: >-
    假设A店新装了十个净水龙头，想稳住意式浓缩用水。对这十个点位做硬度巡测，样本均值七十二点零百万分比浓度，样本标准差四点二。总体真实的 sigma 未知——这款滤芯是新型号。助理仍随手拿正态临界值一点九六零。为什么在小样本试点上这样会把区间压得过窄？诚实的答案就是学生 t 分布。
  zh_hk: >-
    假設A店新裝咗十個淨水龍頭，想穩住意式濃縮用水。對呢十個點位做硬度巡測，樣本均值七十二點零百萬分比濃度，樣本標準差四點二。總體真實嘅 sigma 未知——呢款濾芯係新型號。助理仍然隨手拎正態臨界值一點九六零。點解喺小樣本試點上咁樣會將區間壓得過窄？誠實嘅答案就係學生 t 分佈。
- id: define
  visual: definition_card
  seconds: 48
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: t when sigma is unknown
  title_zh: sigma 未知时用 t
  title_zh_hk: sigma 未知時用 t
  formula: 't = (mean − μ)/(s/√n) ~ t(df=n−1)'
  formula_zh: t = (样本均值 − μ)/(s/√n) ~ t(df=n−1)
  formula_zh_hk: t = (樣本均值 − μ)/(s/√n) ~ t(df=n−1)
  formula_tex: t=\frac{\bar{X}-\mu}{S/\sqrt{n}}\sim t_{(df=n-1)}
  s1_en: >-
    When population sigma is unknown, we plug in the sample standard deviation s.
    But s itself is a random number that wobbles from sample to sample, so the
    denominator is no longer a fixed constant.
  s1_zh: >-
    当总体标准差 sigma 未知时，我们用样本标准差 s 代入。但 s 本身会随样本上下晃动，分母不再是固定常数。
  s1_zh_hk: >-
    當總體標準差 sigma 未知嗰陣，我哋用樣本標準差 s 代入。但 s 本身會隨樣本上下晃動，分母唔再係固定常數。
  s2_en: >-
    That dual uncertainty — a random mean on top and a random s below — produces
    heavier tails than the Normal curve. In nineteen oh eight, Guinness brewer
    William Sealy Gosset showed the shape is Student's t with degrees of freedom
    df equals n minus one.
  s2_zh: >-
    这种双重不确定性——分子上的随机均值，加上分母里晃动的 s——会养出比正态更厚的尾部。一九零八年，健力士酿造师威廉·戈塞证明，这个形状就是自由度等于 n 减一的学生 t 分布。
  s2_zh_hk: >-
    呢種雙重不確定性——分子上嘅隨機均值，加上分母入面晃動嘅 s——會養出比正態更厚嘅尾部。一九零八年，健力士釀造師威廉·戈塞證明，呢個形狀就係自由度等於 n 減一嘅學生 t 分佈。
- id: name_t
  visual: title_card
  seconds: 18
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Student's t
  title_zh: 学生 t 分布
  title_zh_hk: 學生 t 分佈
  en: >-
    Say it once out loud: Student's t-distribution. It is the sampling shape you
    use when sigma is unknown and you estimate it with s.
  zh: >-
    大声念一次：学生 t 分布。总体标准差未知、只能用样本标准差 s 估计时，就用这个抽样形状。
  zh_hk: >-
    大聲唸一次：學生 t 分佈。總體標準差未知、淨係可以用樣本標準差 s 估計嗰陣，就用呢個抽樣形狀。
- id: name_df
  visual: title_card
  seconds: 18
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Degrees of freedom
  title_zh: 自由度
  title_zh_hk: 自由度
  en: >-
    Degrees of freedom, df, equals n minus one for a single sample mean. Fewer
    free pieces of information mean a thicker tail and a larger critical value.
  zh: >-
    自由度（df）对单样本均值来说等于 n 减一。可自由变动的信息越少，尾部越厚，临界值越大。
  zh_hk: >-
    自由度（df）對單樣本均值嚟講等於 n 減一。可自由變動嘅資訊越少，尾部越厚，臨界值越大。
- id: mechanics
  visual: two_column
  seconds: 52
  kicker: The shape of uncertainty
  kicker_en: The shape of uncertainty
  kicker_zh: 不确定性的形状
  kicker_zh_hk: 不確定性嘅形狀
  title_en: Z is thin; t is heavier
  title_zh: Z 尾薄；t 尾更厚
  title_zh_hk: Z 尾薄；t 尾更厚
  left_en: 'Z: thin tails; sigma known'
  left_zh: 标准正态 Z：尾薄；sigma 已知
  left_zh_hk: 標準正態 Z：尾薄；sigma 已知
  right_en: 't (df=9): 95% 1.960→2.262'
  right_zh: 学生 t（自由度 9）：95% 临界值 1.960 → 2.262
  right_zh_hk: 學生 t（自由度 9）：95% 臨界值 1.960 → 2.262
  s1_en: >-
    Because s often understates true volatility in a small pilot, extreme
    standardized values show up more often than Gaussian math predicts.
  s1_zh: >-
    小样本里，样本标准差 s 常常低估真实波动，所以极端标准化数值出现得比高斯公式预测的更频繁。
  s1_zh_hk: >-
    小樣本入面，樣本標準差 s 成日低估真實波動，所以極端標準化數值出現得比高斯公式預測嘅更頻密。
  s2_en: >-
    Student's t pays for that risk with a heavy-tail penalty: the smaller the
    sample, the lower the degrees of freedom, and the farther the critical value
    must stretch.
  s2_zh: >-
    学生 t 用厚尾惩罚来买单：样本量越小，自由度越低，临界值就必须撑得更开。
  s2_zh_hk: >-
    學生 t 用厚尾懲罰嚟埋單：樣本量越細，自由度越低，臨界值就必須撐得更開。
  s3_en: >-
    With only nine degrees of freedom, the ninety-five percent cutoff expands
    from one point nine six zero to two point two six two — about a fifteen
    percent wider multiplier. That is the honest cost of not knowing sigma.
  s3_zh: >-
    自由度只有九时，百分之九十五的临界值从一点九六零升到二点二六二——乘数大约宽百分之十五。这就是不知道 sigma 时该付的诚实代价。
  s3_zh_hk: >-
    自由度淨係得九嗰陣，百分之九十五嘅臨界值由一點九六零升到二點二六二——乘數大約闊百分之十五。呢個就係唔知 sigma 嗰陣應該付嘅誠實代價。
