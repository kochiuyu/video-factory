quiz:
- id: Q1
  type: multiple_choice
  question_en: Quality control tests n = 12 espresso shots at Shop B to measure extraction yield. The sample mean is 19.80%
    and sample standard deviation is s = 1.20%. For a 95% confidence level, what degrees of freedom and critical value t*
    must be used?
  question_zh: B店质检团队抽测 n = 12 杯意式浓缩咖啡的萃取率，算得样本均值为 19.80%，样本标准差 s = 1.20%。若构建 95% 置信区间，必须调用的自由度 df 与临界值 t* 分别是多少？
  question_zh_hk: B店質檢團隊抽測 n = 12 杯意式濃縮咖啡嘅萃取率，計得樣本均值為 19.80%，樣本標準差 s = 1.20%。若果構建 95% 置信區間，必須調用嘅自由度 df 與臨界值 t* 分別係幾多？
  options_en:
  - 'A: df = 12 - 1 = 11; t* = 2.201'
  - 'B: df = 12; t* = 1.960'
  - 'C: df = 12 + 1 = 13; t* = 2.160'
  - 'D: df = 11; t* = 1.796'
  options_zh:
  - 'A: 自由度 df = 12 - 1 = 11；查表得双尾临界值 t* = 2.201'
  - 'B: 自由度 df = 12；临界值 t* = 1.960'
  - 'C: 自由度 df = 12 + 1 = 13；临界值 t* = 2.160'
  - 'D: 自由度 df = 11；单尾临界值 t* = 1.796'
  options_zh_hk:
  - 'A: 自由度 df = 12 - 1 = 11；查表得雙尾臨界值 t* = 2.201'
  - 'B: 自由度 df = 12；臨界值 t* = 1.960'
  - 'C: 自由度 df = 12 + 1 = 13；臨界值 t* = 2.160'
  - 'D: 自由度 df = 11；單尾臨界值 t* = 1.796'
  answer: A
  explanation_en: 'Degrees of freedom equals sample size minus one: df = 12 - 1 = 11. On the Student''s t-table, the two-tailed
    95% critical value for df = 11 is exactly t* = 2.201.'
  explanation_zh: 自由度等于样本容量减一：df = 12 - 1 = 11。查阅学生 t 分布表，双尾 95% 置信水平且自由度为 11 对应的临界值精确为 t* = 2.201。
  explanation_zh_hk: 自由度等於樣本容量減一：df = 12 - 1 = 11。查閱學生 t 分佈表，雙尾 95% 置信水平兼且自由度為 11 對應嘅臨界值精確為 t* = 2.201。
- id: Q2
  type: multiple_choice
  question_en: 'With sample mean = 19.80%, sample standard deviation s = 1.20%, and n = 12 shots (t* = 2.201), what is
    the certified 95% t-confidence interval for true average espresso extraction yield?'
  question_zh: 已知样本均值 = 19.80%，样本标准差 s = 1.20%，抽检杯数 n = 12 杯（t* = 2.201），真实平均意式浓缩萃取率的 95% t 置信区间是多少？
  question_zh_hk: 已知樣本均值 = 19.80%，樣本標準差 s = 1.20%，抽檢杯數 n = 12 杯（t* = 2.201），真實平均意式濃縮萃取率嘅 95% t 置信區間係幾多？
  options_en:
  - 'A: SE = 1.20 / sqrt(12) ≈ 0.3464%; MOE = 2.201 * 0.3464% ≈ 0.76%; CI = [19.04%, 20.56%]'
  - 'B: SE = 1.20 / 12 = 0.1000%; MOE = 1.96 * 0.10% = 0.20%; CI = [19.60%, 20.00%]'
  - 'C: MOE = 2.201 * 1.20% = 2.64%; CI = [17.16%, 22.44%]'
  - 'D: CI = [18.00%, 22.00%] because industrial espresso standards override sample math'
  options_zh:
  - 'A: 标准误 SE = 1.20 / 根号(12) ≈ 0.3464%；误差容限 MOE = 2.201 × 0.3464% ≈ 0.76%；区间 CI = [19.04%, 20.56%]'
  - 'B: 标准误 SE = 1.20 / 12 = 0.1000%；误差容限 MOE = 1.96 × 0.10% = 0.20%；区间 CI = [19.60%, 20.00%]'
  - 'C: 误差容限 MOE = 2.201 × 1.20% = 2.64%；区间 CI = [17.16%, 22.44%]'
  - 'D: 区间 CI = [18.00%, 22.00%]，因为行业既定公差强制覆盖样本数据计算结果'
  options_zh_hk:
  - 'A: 標準誤 SE = 1.20 / 根號(12) ≈ 0.3464%；誤差容限 MOE = 2.201 × 0.3464% ≈ 0.76%；區間 CI = [19.04%, 20.56%]'
  - 'B: 標準誤 SE = 1.20 / 12 = 0.1000%；誤差容限 MOE = 1.96 × 0.10% = 0.20%；區間 CI = [19.60%, 20.00%]'
  - 'C: 誤差容限 MOE = 2.201 × 1.20% = 2.64%；區間 CI = [17.16%, 22.44%]'
  - 'D: 區間 CI = [18.00%, 22.00%]，因為行業既定公差強制覆蓋樣本數據計算結果'
  answer: A
  explanation_en: SE = s / sqrt(n) = 1.20 / 3.4641 ≈ 0.3464%. MOE = t* * SE = 2.201 * 0.3464% ≈ 0.762%. The 95% interval is
    19.80% +/- 0.76% = [19.04%, 20.56%], sitting safely inside the golden 18% to 22% target window.
  explanation_zh: 标准误 SE = 1.20 / 根号(12) ≈ 0.3464%。误差容限 MOE = 2.201 × 0.3464% ≈ 0.762%。求得 95% 置信区间为 19.80% ± 0.76% = [19.04%,
    20.56%]，整段区间稳稳落在精品咖啡协会 18% 至 22% 的金杯萃取黄金带之内。
  explanation_zh_hk: 標準誤 SE = 1.20 / 根號(12) ≈ 0.3464%。誤差容限 MOE = 2.201 × 0.3464% ≈ 0.762%。求得 95% 置信區間為 19.80% ± 0.76% = [19.04%,
    20.56%]，成段區間穩穩落喺精品咖啡協會 18% 至 22% 嘅金杯萃取黃金帶入面。
beats:
- id: hook
  visual: title_card
  seconds: 44
  kicker: The Golden Cup audit
  kicker_en: The Golden Cup audit
  kicker_zh: 金杯萃取的认证
  kicker_zh_hk: 金杯萃取嘅認證
  title_en: What is a t-interval?
  title_zh: 什么是 t 置信区间？
  title_zh_hk: 乜嘢係 t 置信區間？
  en: >-
    Suppose Shop A pulls twelve espresso shots for a quality pilot. Industry
    Golden Cup guidance wants total dissolved solids between eighteen and
    twenty-two percent — under eighteen tastes hollow and sharp; past twenty-two
    turns bitter. The sample mean lands at nineteen point eight zero percent,
    with sample standard deviation one point two zero percent. Population sigma
    is unknown, and twelve cups are too few to lean on the Central Limit Theorem.
    Can this short pilot certify the bar, or only the sample average? The tool
    is the one-sample t-interval.
  zh: >-
    假设A店抽测十二杯意式浓缩做品控试点。行业金杯指引希望总溶解固体萃取率落在百分之十八至二十二——低过十八会寡淡尖酸，高过二十二会焦苦。样本均值百分之十九点八零，样本标准差百分之一点二零。总体 sigma 未知，十二杯也太少，撑不起中心极限定理。这段短试点能不能给吧台背书，还是只能证明样本均值？要用的工具就是单样本 t 置信区间。
  zh_hk: >-
    假設A店抽測十二杯意式濃縮做品控試點。行業金杯指引希望總溶解固體萃取率落喺百分之十八至二十二——低過十八會寡淡尖酸，高過二十二會焦苦。樣本均值百分之十九點八零，樣本標準差百分之一點二零。總體 sigma 未知，十二杯亦太少，撐唔起中心極限定理。呢段短試點可唔可以為吧台背書，定係淨係證明樣本均值？要用嘅工具就係單樣本 t 置信區間。
- id: define
  visual: definition_card
  seconds: 48
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 它是什么
  kicker_zh_hk: 佢係乜
  title_en: The one-sample t-interval
  title_zh: 单样本 t 置信区间
  title_zh_hk: 單樣本 t 置信區間
  formula: 'CI = mean ± t*(df=n−1) × (s/√n)'
  formula_zh: 置信区间 = 样本均值 ± t 临界值(自由度=n−1) × (s/√n)
  formula_zh_hk: 置信區間 = 樣本均值 ± t 臨界值(自由度=n−1) × (s/√n)
  formula_tex: \text{CI}_t = \bar{X} \pm t^*_{\alpha/2,\,n-1}\cdot\frac{S}{\sqrt{n}}
  s1_en: >-
    When population sigma is unknown and n is modest, keep the sample standard
    deviation s in the denominator, and replace the Normal cutoff with Student's
    t critical value. That critical value is locked by degrees of freedom df
    equals n minus one.
  s1_zh: >-
    当总体标准差 sigma 未知、样本量又不大时，分母继续用样本标准差 s，并把正态临界值换成学生 t 临界值。这个临界值由自由度决定——自由度等于 n 减一。
  s1_zh_hk: >-
    當總體標準差 sigma 未知、樣本量又唔大嗰陣，分母繼續用樣本標準差 s，並將正態臨界值換成學生 t 臨界值。呢個臨界值由自由度決定——自由度等於 n 減一。
  s2_en: >-
    Margin of error is t-star times s over square root of n. Multiplying by the
    heavier t cutoff widens the bracket just enough to pay for estimating sigma
    with a wobbling s.
  s2_zh: >-
    误差容限等于 t 临界值乘上 s 再除以根号 n。乘上更厚的 t 临界值，区间会略微变宽，正好补偿用晃动的 s 去估计 sigma。
  s2_zh_hk: >-
    誤差容限等於 t 臨界值乘上 s 再除以根號 n。乘上更厚嘅 t 臨界值，區間會略為變闊，啱啱補償用晃動嘅 s 去估計 sigma。
- id: name_tstar
  visual: title_card
  seconds: 18
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: t critical value
  title_zh: t 临界值
  title_zh_hk: t 臨界值
  en: >-
    Say the name once: t critical value, written t-star. It is the Student's t
    cutoff that matches your confidence level and your degrees of freedom.
  zh: >-
    大声念一次：t 临界值，写作 t 星号。它是对应你的置信水平和自由度的学生 t 分界。
  zh_hk: >-
    大聲唸一次：t 臨界值，寫作 t 星號。佢係對應你嘅置信水平同自由度嘅學生 t 分界。
- id: name_ci
  visual: title_card
  seconds: 16
  kicker: The name
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Confidence interval
  title_zh: 置信区间
  title_zh_hk: 置信區間
  en: >-
    And the finished object: a confidence interval — sample mean plus or minus
    the margin of error. Certify the whole bracket, not a single point.
  zh: >-
    再记住成品的名字：置信区间——样本均值加减误差容限。认证看整段区间，不是看一个点。
  zh_hk: >-
    再記住成品嘅名：置信區間——樣本均值加減誤差容限。認證睇成段區間，唔係睇一個點。
- id: normality
  visual: two_column
  seconds: 52
  kicker: The small-sample contract
  kicker_en: The small-sample contract
  kicker_zh: 小样本的前提
  kicker_zh_hk: 小樣本嘅前提
  title_en: When can you trust a t-interval?
  title_zh: 何时能信 t 区间？
  title_zh_hk: 幾時可以信 t 區間？
  left_en: 'Large n (~30+): CLT helps'
  left_zh: 大样本(~30+)：CLT 可帮扶
  left_zh_hk: 大樣本(~30+)：CLT 可幫扶
  right_en: 'Small n: ~normal parent'
  right_zh: 小样本：母体宜大致正态
  right_zh_hk: 小樣本：母體宜大致正態
  s1_en: >-
    With a large sample, the Central Limit Theorem helps the sample mean look
    Normal even when single cups are a bit skewed.
  s1_zh: >-
    样本量够大时，中心极限定理会帮样本均值靠近正态，即使单杯萃取略有偏斜。
  s1_zh_hk: >-
    樣本量夠大嗰陣，中心極限定理會幫樣本均值靠近正態，即使單杯萃取略有偏斜。
  s2_en: >-
    With only twelve cups, that rescue is weak. The t-interval derivation wants
    the underlying extraction process itself to be roughly bell-shaped.
  s2_zh: >-
    只有十二杯时，这个救援很弱。t 区间的推导希望底层萃取过程本身大致呈钟形。
  s2_zh_hk: >-
    淨係十二杯嗰陣，呢個救援好弱。t 區間嘅推導希望底層萃取過程本身大致呈鐘形。
  s3_en: >-
    So before publishing the bracket, glance at a histogram or box plot of the
    twelve readings. Strong skew or a wild outlier means fix the process first,
    then compute.
  s3_zh: >-
    所以在对外给出区间前，先看这十二个读数的直方图或箱线图。若严重偏斜或有极端离群点，先理顺工艺，再计算。
  s3_zh_hk: >-
    所以喺對外出區間前，先睇呢十二個讀數嘅直方圖或者箱線圖。若果嚴重偏斜或者有極端離群點，先理順工藝，再計算。
