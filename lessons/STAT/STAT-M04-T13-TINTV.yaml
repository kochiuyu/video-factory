quiz:
- id: Q1
  type: multiple_choice
  question_en: Quality control tests n = 12 espresso shots at Mong Kok to measure extraction yield. The sample mean is 19.80%
    and sample standard deviation is s = 1.20%. For a 95% confidence level, what degrees of freedom and critical value t*
    must be used?
  question_zh: 旺角店质检团队抽测 n = 12 杯意式浓缩咖啡的萃取率，算得样本均值为 19.80%，样本标准差 s = 1.20%。若构建 95% 置信区间，必须调用的自由度 df 与临界值 t* 分别是多少？
  question_zh_hk: 旺角舖質檢團隊抽測 n = 12 杯意式濃縮咖啡嘅萃取率，計得樣本均值為 19.80%，樣本標準差 s = 1.20%。若果構建 95% 置信區間，必須調用嘅自由度 df 與臨界值 t* 分別係幾多？
  options_en:
  - 'A: df = 12 - 1 = 11; t* = 2.201'
  - 'B: df = 12; t* = 1.960'
  - 'C: df = 12 + 1 = 13; t* = 2.160'
  - 'D: df = 11; t* = 1.796'
  options_zh:
  - 'A: 自由度 df = 12 - 1 = 11；查表得双尾临界值 t* = 2.201'
  - 'B: 自由度 df = 12；临界值 t* = 1.960'
  - 'C: 自由度 df = 12 + 1 = 13；临界值 t* = 2.160'
  - 'D: 自由度 df = 11；单尾临界值 t* = 1.796'
  options_zh_hk:
  - 'A: 自由度 df = 12 - 1 = 11；查表得雙尾臨界值 t* = 2.201'
  - 'B: 自由度 df = 12；臨界值 t* = 1.960'
  - 'C: 自由度 df = 12 + 1 = 13；臨界值 t* = 2.160'
  - 'D: 自由度 df = 11；單尾臨界值 t* = 1.796'
  answer: A
  explanation_en: 'Degrees of freedom equals sample size minus one: df = 12 - 1 = 11. On the Student''s t-table, the two-tailed
    95% critical value for df = 11 is exactly t* = 2.201.'
  explanation_zh: 自由度等于样本容量减一：df = 12 - 1 = 11。查阅学生氏 t 分布表，双尾 95% 置信水平且自由度为 11 对应的临界值精确为 t* = 2.201。
  explanation_zh_hk: 自由度等於樣本容量減一：df = 12 - 1 = 11。查閱學生氏 t 分佈表，雙尾 95% 置信水平兼且自由度為 11 對應嘅臨界值精確為 t* = 2.201。
- id: Q2
  type: multiple_choice
  question_en: With sample mean x-bar = 19.80%, sample standard deviation s = 1.20%, and n = 12 shots (t* = 2.201), what is
    the certified 95% t-confidence interval for true average espresso extraction yield?
  question_zh: 已知样本均值 x-bar = 19.80%，样本标准差 s = 1.20%，抽检杯数 n = 12 杯（t* = 2.201），真实平均意式浓缩萃取率的 95% t 置信区间是多少？
  question_zh_hk: 已知樣本均值 x-bar = 19.80%，樣本標準差 s = 1.20%，抽檢杯數 n = 12 杯（t* = 2.201），真實平均意式濃縮萃取率嘅 95% t 置信區間係幾多？
  options_en:
  - 'A: SE = 1.20 / sqrt(12) ≈ 0.3464%; MOE = 2.201 * 0.3464% ≈ 0.76%; CI = [19.04%, 20.56%]'
  - 'B: SE = 1.20 / 12 = 0.1000%; MOE = 1.96 * 0.10% = 0.20%; CI = [19.60%, 20.00%]'
  - 'C: MOE = 2.201 * 1.20% = 2.64%; CI = [17.16%, 22.44%]'
  - 'D: CI = [18.00%, 22.00%] because industrial espresso standards override sample math'
  options_zh:
  - 'A: 标准误 SE = 1.20 / 根号(12) ≈ 0.3464%；误差容限 MOE = 2.201 × 0.3464% ≈ 0.76%；区间 CI = [19.04%, 20.56%]'
  - 'B: 标准误 SE = 1.20 / 12 = 0.1000%；误差容限 MOE = 1.96 × 0.10% = 0.20%；区间 CI = [19.60%, 20.00%]'
  - 'C: 误差容限 MOE = 2.201 × 1.20% = 2.64%；区间 CI = [17.16%, 22.44%]'
  - 'D: 区间 CI = [18.00%, 22.00%]，因为行业既定公差强制覆盖样本数据计算结果'
  options_zh_hk:
  - 'A: 標準誤 SE = 1.20 / 根號(12) ≈ 0.3464%；誤差容限 MOE = 2.201 × 0.3464% ≈ 0.76%；區間 CI = [19.04%, 20.56%]'
  - 'B: 標準誤 SE = 1.20 / 12 = 0.1000%；誤差容限 MOE = 1.96 × 0.10% = 0.20%；區間 CI = [19.60%, 20.00%]'
  - 'C: 誤差容限 MOE = 2.201 × 1.20% = 2.64%；區間 CI = [17.16%, 22.44%]'
  - 'D: 區間 CI = [18.00%, 22.00%]，因為行業既定公差強制覆蓋樣本數據計算結果'
  answer: A
  explanation_en: SE = s / sqrt(n) = 1.20 / 3.4641 ≈ 0.3464%. MOE = t* * SE = 2.201 * 0.3464% ≈ 0.762%. The 95% interval is
    19.80% +/- 0.76% = [19.04%, 20.56%], sitting safely inside the golden 18% to 22% target window.
  explanation_zh: 标准误 SE = 1.20 / 根号(12) ≈ 0.3464%。误差容限 MOE = 2.201 × 0.3464% ≈ 0.762%。求得 95% 置信区间为 19.80% ± 0.76% = [19.04%,
    20.56%]，整段区间稳稳落在精品咖啡协会 18% 至 22% 的金杯萃取黄金带之内。
  explanation_zh_hk: 標準誤 SE = 1.20 / 根號(12) ≈ 0.3464%。誤差容限 MOE = 2.201 × 0.3464% ≈ 0.762%。求得 95% 置信區間為 19.80% ± 0.76% = [19.04%,
    20.56%]，成段區間穩穩落喺精品咖啡協會 18% 至 22% 嘅金杯萃取黃金帶入面。
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: The Golden Cup Audit
  kicker_en: The Golden Cup Audit
  kicker_zh: 金杯萃取的认证大考
  kicker_zh_hk: 金杯萃取嘅認證大考
  title_en: Can twelve test cups certify chain-wide quality?
  title_zh: 仅凭十二杯测试样，真能为全店出品背书吗？
  title_zh_hk: 淨憑十二杯測試樣，真係能為全舖出品背書咩？
  en: 'At Metro Coffee''s Mong Kok flagship, quality control tests a pilot batch of twelve espresso shots using an optical
    refractometer. Industry standards require total extraction yield to sit strictly between eighteen and twenty-two percent:
    under-extract below eighteen and coffee tastes hollow and sharply sour; over-extract past twenty-two and bitter astringency
    ruins the cup. The sample average lands at nineteen point eight percent. But pulling hundreds of destructive test shots
    is commercially impossible. How do executives build an ironclad quality interval from just twelve cups?'
  zh: 在都市咖啡旺角旗舰店吧台前，质检团队手持光学折光仪对十二杯浓缩咖啡进行了抽验。精品咖啡行业金杯准则严苛规定：总溶解固体萃取率必须死死咬合在百分之十八至二十二之间：低于十八度则风味寡淡尖酸，高于二十二度则焦苦干涩锁喉。抽查均值录得百分之十九点八。但每杯测试样都意味着豆子与工时的报废，不可能无休止破坏性抽检数百杯。管理层究竟该如何仅凭十二杯小样，筑起无懈可击的品控认证区间？
  zh_hk: 喺都市咖啡旺角旗艦舖吧台前，質檢團隊手持光學折光儀對十二杯濃縮咖啡進行咗抽驗。精品咖啡行業金杯準則嚴苛規定：總溶解固體萃取率必須死死咬合喺百分之十八至二十二之間：低過十八度就風味寡淡尖酸，高過二十二度就焦苦乾澀鎖喉。抽查均值錄得百分之十九點八。但每杯測試樣都意味住豆同工時嘅報廢，唔可能無休止破壞性抽檢幾百杯。管理層究竟應該點樣淨憑十二杯細樣，築起無懈可擊嘅品控認證區間？
- id: define
  visual: definition_card
  seconds: 34
  kicker: What It Is
  kicker_en: What It Is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: The one-sample t-interval formula
  title_zh: 单样本 t 置信区间标准构型
  title_zh_hk: 單樣本 t 置信區間標準構型
  formula: CI = x-bar +/- t*(alpha / 2, df = n - 1) * (s / sqrt(n))
  formula_zh: t 置信区间 = 样本均值 ± t* 临界值(自由度 df = n - 1) × (样本标准差 / 根号(n))
  formula_zh_hk: t 置信區間 = 樣本均值 ± t* 臨界值(自由度 df = n - 1) × (樣本標準差 / 根號(n))
  formula_tex: \text{CI}_t = \bar{X} \pm t^*_{\alpha/2, \, n-1} \cdot \frac{S}{\sqrt{n}}
  s1_en: When population variance sigma is unknown and sample size n is modest, we replace standard normal Z with Student's
    critical value t star, determined by degrees of freedom df equals n minus one.
  s1_zh: 当总体方差 sigma 深不可测且样本量偏小时，我们以样本标准差 s 估算离散度，并坚决用学生氏临界值 t 星号取代正态 Z 标尺，其取值完全由自由度 df 等于 n 减一所规约。
  s1_zh_hk: 當總體方差 sigma 深不可測兼且樣本量偏細嗰陣，我哋以樣本標準差 s 估算離散度，並堅決用學生氏臨界值 t 星號取代正態 Z 標尺，其取值完全由自由度 df 等於 n 減一所規約。
  s2_en: The margin of error equals t star multiplied by s divided by the square root of n. This expands the interval width
    just enough to absorb the random fluctuations of our estimated sample variance.
  s2_zh: 误差容限严格等于 t 星号乘上 s 除以根号 n。这种外扩补偿恰如其分地吸收了样本方差自身的随机晃动，赋予小样本推断经得起推敲的统计严密性。
  s2_zh_hk: 誤差容限嚴格等於 t 星號乘上 s 除以根號 n。呢種外擴補償啱啱好吸收咗樣本方差自身嘅隨機晃動，賦予小樣本推斷經得起推敲嘅統計嚴密性。
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: The Underlying Contract
  kicker_en: The Underlying Contract
  kicker_zh: 底层契约
  kicker_zh_hk: 底層契約
  title_en: The normality assumption in small samples
  title_zh: 小样本依赖的正态性母体假设
  title_zh_hk: 小樣本依賴嘅正態性母體假設
  left_en: 'Large Samples (n >= 30): CLT guarantees normality regardless of parent shape'
  left_zh: 大样本世界 (n >= 30)：中心极限定理生效，母体偏态皆可被自然抹平
  left_zh_hk: 大樣本世界 (n >= 30)：中心極限定理生效，母體偏態皆可被自然抹平
  right_en: 'Small Samples (n < 30): Parent population must be roughly normal and outlier-free'
  right_zh: 小样本世界 (n < 30)：丧失大数庇护，要求母体大体对称且绝无极端离群点
  right_zh_hk: 小樣本世界 (n < 30)：喪失大數庇護，要求母體大體對稱兼且絕無極端離群點
  s1_en: 'In large samples, the Central Limit Theorem rescues us: sample means converge to normal even if individual customer
    receipts are wildly skewed.'
  s1_zh: 面对动辄上百笔的大样本，中心极限定理赐予我们免死金牌：哪怕底层原始客单严重偏态，加总均值依然会自然收敛为对称正态。
  s1_zh_hk: 面對郁啖上百筆嘅大樣本，中心極限定理賜予我哋免死金牌：哪怕底層原始客單嚴重偏態，加總均值依然會自然收斂為對稱正態。
  s2_en: With only twelve coffee shots, the CLT cannot operate. The mathematical derivation of the t-distribution strictly
    requires that the underlying physical extraction process itself is approximately bell-shaped.
  s2_zh: 但在仅抽检十二杯咖啡的小样本情境下，CLT 无法触发。学生氏 t 分布在数学推导上严格依赖一项物理契约：即机器真实的单杯萃取率本身必须大致对称、符合正态形态。
  s2_zh_hk: 但喺淨係抽檢十二杯咖啡嘅小樣本情境下，CLT 冇辦法觸發。學生氏 t 分佈喺數學推導上嚴格依賴一項物理契約：即係機器真實嘅單杯萃取率本身必須大致對稱、符合正態形態。
  s3_en: Before publishing a small-sample t-interval, quality managers must verify that the twelve sample readings show no
    severe skewness or wild outliers.
  s3_zh: 在对外出具小样本 t 置信区间之前，品质总监必须先审视数据箱线图或直方图，核验这十二个样本点不存在明显的偏斜畸形或破坏性离群极值。
  s3_zh_hk: 喺對外出具小樣本 t 置信區間之前，品質總監必須先審視數據箱線圖或者直方圖，核驗呢十二個樣本點唔存在明顯嘅偏斜畸形或者破壞性離群極值。
- id: ledger
  visual: steps
  seconds: 36
  kicker: The Ledger
  kicker_en: The Ledger
  kicker_zh: 账目精算
  kicker_zh_hk: 賬目精算
  title_en: Certifying Mong Kok espresso extraction yield
  title_zh: 旺角旗舰店浓缩萃取率实测认证
  title_zh_hk: 旺角旗艦舖濃縮萃取率實測認證
  step1_en: 'Audit baseline: n = 12 shots -> x-bar = 19.80%, s = 1.20% -> df = 12 - 1 = 11'
  step1_zh: 抽检基准：n = 12 杯，均值 x-bar = 19.80%，样本 s = 1.20% -> 自由度 df = 11
  step1_zh_hk: 抽檢基準：n = 12 杯，均值 x-bar = 19.80%，樣本 s = 1.20% -> 自由度 df = 11
  step2_en: 'Critical value: Table t*(0.025, 11) = 2.201; SE = 1.20 / sqrt(12) = 0.346%'
  step2_zh: 查定临界值：查表双尾 t*(0.025, 11) = 2.201；标准误 SE = 1.20 / 根号(12) = 0.346%
  step2_zh_hk: 查定臨界值：查表雙尾 t*(0.025, 11) = 2.201；標準誤 SE = 1.20 / 根號(12) = 0.346%
  step3_en: '95% Bracket: MOE = 2.201 * 0.346% = 0.76% -> CI: [19.04%, 20.56%] (Passed!)'
  step3_zh: 认证区间：MOE = 2.201 × 0.346% = 0.76% -> 区间：[19.04%, 20.56%]（全线达标！）
  step3_zh_hk: 認證區間：MOE = 2.201 × 0.346% = 0.76% -> 區間：[19.04%, 20.56%]（全線達標！）
  s1_en: Review the quality audit log at Mong Kok. Across twelve consecutive test shots on the central espresso bar, average
    extraction yield is nineteen point eight zero percent, with sample standard deviation s of one point two zero percent.
  s1_zh: 审视旺角店吧台的品质巡检流水。在主意式机连续抽取的十二杯测试浓缩中，平均萃取率录得百分之十九点八零，样本标准差 s 为百分之一点二零。
  s1_zh_hk: 審視旺角舖吧台嘅品質巡檢流水。喺主意式機連續抽取嘅十二杯測試濃縮入面，平均萃取率錄得百分之十九點八零，樣本標準差 s 為百分之一點二零。
  s2_en: 'Step two checks degrees of freedom: twelve minus one is eleven. Consulting the Student''s t table for ninety-five
    percent confidence yields t star of two point two zero one. Standard error is one point twenty divided by the square root
    of twelve: zero point three four six percent.'
  s2_zh: 第二步核定自由度：十二减一等于十一。翻开学生氏 t 分布表，百分之九十五双尾置信度对应的临界值 t 星号确凿为二点二零一。标准误为一点二零除以根号十二，算得百分之零点三四六。
  s2_zh_hk: 第二步核定自由度：十二減一等於十一。翻開學生氏 t 分佈表，百分之九十五雙尾置信度對應嘅臨界值 t 星號確鑿為二點二零一。標準誤為一點二零除以根號十二，計得百分之零點三四六。
  s3_en: 'Step three computes the margin of error: two point two zero one times zero point three four six is zero point seven
    six percent. Our ninety-five percent certified extraction bracket spans nineteen point zero four to twenty point five
    six percent. Because the entire interval sits securely inside the golden eighteen to twenty-two percent window, the machine
    calibration is certified!'
  s3_zh: 第三步计算误差容限：二点二零一乘百分之零点三四六得百分之零点七六。求出经九成五认证的真实萃取区间为百分之十九点零四至二十点五六。由于该区间从上限到下限全线死死锁在十八至二十二黄金带之内，吧台校准大获全胜！
  s3_zh_hk: 第三步計算誤差容限：二點二零一乘百分之零點三四六得百分之零點七六。求出經九成五認證嘅真實萃取區間為百分之十九點零四至二十點五六。由於嗰個區間由上限到下限全線死死鎖喺十八至二十二黃金帶入面，吧台校準大獲全勝！
- id: takeaway
  visual: takeaway
  seconds: 32
  kicker: Decision Rule
  kicker_en: Decision Rule
  kicker_zh: 商业法度
  kicker_zh_hk: 商業法度
  title_en: Certify small pilots with rigorous t-bounds
  title_zh: 用 t 区间严把试产关口，既省抽检成本又拒侥幸过关
  title_zh_hk: 用 t 區間嚴把試產關口，既省抽檢成本又拒僥倖過關
  q1_en: Why is a sample mean inside specification limits never sufficient proof of product quality?
  q1_zh: 为什么样本均值落在公差规格之内，绝不代表产品质量已经合格？
  q1_zh_hk: 點解樣本均值落喺公差規格之內，絕唔代表產品質量已經合格？
  q2_en: How do managers determine the exact sample size needed before spending money on audits?
  q2_zh: 管理层该如何在掏出真金白银开展审计前，精准逆向求解所需的最优样本量？
  q2_zh_hk: 管理層應該點樣喺掏出真金白銀開展審計前，精準逆向求解所需嘅最優樣本量？
  s1_en: Never declare a pilot test compliant just because the sample average hits the target; you must verify that the entire
    t-interval falls comfortably within engineering tolerance limits.
  s1_zh: 切勿仅凭样本均值看似达标便轻率宣告试产合格；必须严格核验整段 t 置信区间是否完完全全被包容在工程公差边界之内。
  s1_zh_hk: 切勿淨係憑樣本均值睇落達標就輕率宣告試產合格；必須嚴格核驗成段 t 置信區間係咪完完全全被包容喺工程公差邊界入面。
  s2_en: 'Respect the normality condition on small samples: if your process suffers from severe skewness or unstable machine
    jams, fix the operational pipeline before computing t-intervals.'
  s2_zh: 敬畏小样本的正态前提：若生产流程存在严重的出料偏倚或设备卡顿，务必先在工程现场理顺工艺流线，切忌在畸形数据上强行套用 t 区间掩耳盗铃。
  s2_zh_hk: 敬畏小樣本嘅正態前提：若果生產流程存在嚴重嘅出料偏倚或者設備卡頓，務必先喺工程現場理順工藝流線，切忌喺畸形數據上強行套用 t 區間掩耳盜鈴。
  s3_en: The operating rule is to certify the whole interval, not the sample mean. Twelve shots give [19.04%, 20.56%], inside
    the 18% to 22% window.
  s3_zh: 操作规则是认证整段区间，而不是认证样本均值。十二杯给出 [19.04%, 20.56%]，落在 18% 至 22% 的窗口内。
  s3_zh_hk: 操作規則係認證成段區間，而唔係認證樣本均值。十二杯畀出 [19.04%, 20.56%]，落喺 18% 至 22% 嘅窗口內。
