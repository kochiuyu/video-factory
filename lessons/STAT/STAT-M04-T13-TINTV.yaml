id: STAT-M04-T13-TINTV
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Constructing the t-interval
title_zh: 小样本的淬炼：构建 t 置信区间与萃取率品控
title_zh_hk: 小樣本嘅淬煉：構建 t 置信區間與萃取率品控
objective_en: Construct one-sample t confidence intervals for a population mean with unknown variance, determine critical
  values t* based on degrees of freedom df = n - 1, state underlying normality assumptions, and evaluate espresso extraction
  yield compliance across a 12-shot pilot audit at Mong Kok.
objective_zh: 在总体方差未知情形下构建单样本 t 均值置信区间，基于自由度 df = n - 1 查验临界值 t*，核验底层总体正态性前提假设，并在旺角店 12 杯意式浓缩咖啡萃取率品控抽检中完成合规认证。
objective_zh_hk: 喺總體方差未知情形下構建單樣本 t 均值置信區間，基於自由度 df = n - 1 查驗臨界值 t*，核驗底層總體正態性前提假設，並喺旺角舖 12 杯意式濃縮咖啡萃取率品控抽檢入面完成合規認證。
