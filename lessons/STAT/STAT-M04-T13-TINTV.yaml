  title_zh_hk: A店：自由度、臨界值同標準誤
  step1_en: 'df = 12 − 1 = 11'
  step1_zh: '自由度 = 12 − 1 = 11'
  step1_zh_hk: '自由度 = 12 − 1 = 11'
  step2_en: 't*(95%, df=11) = 2.201'
  step2_zh: 't 临界值(95%，自由度11) = 2.201'
  step2_zh_hk: 't 臨界值(95%，自由度11) = 2.201'
  step3_en: 'SE = 1.20 / √12 ≈ 0.346%'
  step3_zh: '标准误 = 1.20 / √12 ≈ 0.346%'
  step3_zh_hk: '標準誤 = 1.20 / √12 ≈ 0.346%'
  s1_en: >-
    Degrees of freedom first: twelve shots minus one free parameter for the mean
    leaves eleven. Write df equals eleven.
  s1_zh: >-
    先算自由度：十二杯，减去均值占去的一个自由参数，剩下十一。写下自由度等于十一。
  s1_zh_hk: >-
    先計自由度：十二杯，減去均值佔去嘅一個自由參數，剩低十一。寫低自由度等於十一。
  s2_en: >-
    Open the Student's t table at ninety-five percent, two tails, eleven degrees
    of freedom. The critical value t-star is two point two zero one — larger than
    the Normal one point nine six zero.
  s2_zh: >-
    翻开学生 t 表，百分之九十五、双尾、自由度十一。临界值 t 星号是二点二零一——比正态的一点九六零更大。
  s2_zh_hk: >-
    翻開學生 t 表，百分之九十五、雙尾、自由度十一。臨界值 t 星號係二點二零一——比正態嘅一點九六零更大。
  s3_en: >-
    Standard error is one point two zero divided by the square root of twelve.
    Square root of twelve is about three point four six four, so SE is about
    zero point three four six percent.
  s3_zh: >-
    标准误是一点二零除以根号十二。根号十二大约三点四六四，所以标准误大约百分之零点三四六。
  s3_zh_hk: >-
    標準誤係一點二零除以根號十二。根號十二大約三點四六四，所以標準誤大約百分之零點三四六。
- id: ledger_ci
  visual: steps
  layout: rows
  seconds: 70
  kicker: Attach the margin
  kicker_en: Attach the margin
  kicker_zh: 接上误差容限
  kicker_zh_hk: 接上誤差容限
  title_en: 'Shop A: MOE and the interval'
  title_zh: A店：误差容限与区间
  title_zh_hk: A店：誤差容限同區間
  step1_en: 'MOE = 2.201 × 0.346% ≈ 0.76%'
  step1_zh: '误差容限 = 2.201 × 0.346% ≈ 0.76%'
  step1_zh_hk: '誤差容限 = 2.201 × 0.346% ≈ 0.76%'
  step2_en: 'CI = 19.80% ± 0.76%'
  step2_zh: '置信区间 = 19.80% ± 0.76%'
  step2_zh_hk: '置信區間 = 19.80% ± 0.76%'
  step3_en: 'CI = [19.04%, 20.56%]'
  step3_zh: '置信区间 = [19.04%, 20.56%]'
  step3_zh_hk: '置信區間 = [19.04%, 20.56%]'
  step4_en: 'Inside 18%–22% window'
  step4_zh: '落在 18%–22% 金杯窗口内'
  step4_zh_hk: '落喺 18%–22% 金杯窗口內'
  s1_en: >-
    Margin of error is t-star times standard error: two point two zero one times
    zero point three four six percent is about zero point seven six percent.
  s1_zh: >-
    误差容限等于 t 临界值乘上标准误：二点二零一乘百分之零点三四六，大约百分之零点七六。
  s1_zh_hk: >-
    誤差容限等於 t 臨界值乘上標準誤：二點二零一乘百分之零點三四六，大約百分之零點七六。
  s2_en: >-
    Center the bracket on the sample mean: nineteen point eight zero percent
    plus or minus zero point seven six percent.
  s2_zh: >-
    把区间以样本均值为中心：百分之十九点八零加减百分之零点七六。
  s2_zh_hk: >-
    將區間以樣本均值為中心：百分之十九點八零加減百分之零點七六。
  s3_en: >-
    That lands at nineteen point zero four to twenty point five six percent.
    Write the confidence interval as that closed bracket.
  s3_zh: >-
    得到百分之十九点零四到二十点五六。把置信区间写成这段闭区间。
  s3_zh_hk: >-
    得到百分之十九點零四到二十點五六。將置信區間寫成呢段閉區間。
  s4_en: >-
    The entire interval sits inside the eighteen to twenty-two percent Golden Cup
    window. So the pilot can certify the bar — because the whole t-interval cleared
    the band, not because the sample mean alone looked pretty.
  s4_zh: >-
    整段区间都落在百分之十八至二十二的金杯窗口内。所以试点可以为吧台背书——因为整段 t 置信区间过关，而不是因为样本均值看起来好看。
  s4_zh_hk: >-
    成段區間都落喺百分之十八至二十二嘅金杯窗口內。所以試點可以為吧台背書——因為成段 t 置信區間過關，而唔係因為樣本均值睇落靚。
- id: takeaway
  visual: takeaway
  seconds: 58
  kicker: Decision rule
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Certify the whole interval
  title_zh: 认证整段区间
  title_zh_hk: 認證成段區間
  q1_en: Why is the sample mean alone not enough?
  q1_zh: 为什么样本均值落在公差内还不够？
  q1_zh_hk: 點解樣本均值落喺公差內都唔夠？
  q2_en: Did Shop A's twelve cups certify the bar?
  q2_zh: A店这十二杯能为吧台背书吗？
  q2_zh_hk: A店呢十二杯可唔可以為吧台背書？
  s1_en: >-
    Never declare a pilot compliant just because the sample average sits inside
    the tolerance band. You must check that the entire t-interval fits inside
    the band as well.
  s1_zh: >-
    不要只因为样本均值落在公差带内就宣布试点合格。还必须核验整段 t 置信区间是否也落在公差带内。
  s1_zh_hk: >-
    唔好淨係因為樣本均值落喺公差帶內就宣佈試點合格。仲必須核驗成段 t 置信區間係咪都落喺公差帶內。
  s2_en: >-
    On small n, respect the normality contract: if the twelve readings look
    badly skewed or spiked by outliers, fix the process before you publish a
    t-interval.
  s2_zh: >-
    样本量小时，守住正态性前提：若这十二个读数严重偏斜或被离群点拉歪，先理顺工艺，再发布 t 区间。
  s2_zh_hk: >-
    樣本量細嗰陣，守住正態性前提：若果呢十二個讀數嚴重偏斜或者被離群點拉歪，先理順工藝，再發佈 t 區間。
  s3_en: >-
    For Shop A's twelve cups, the ninety-five percent t-interval is nineteen
    point zero four to twenty point five six percent — inside eighteen to
    twenty-two. That answers the hook: twelve cups can certify the bar when the
    whole interval clears the Golden Cup window.
  s3_zh: >-
    对A店这十二杯，百分之九十五的 t 置信区间是百分之十九点零四至二十点五六——落在十八至二十二之内。这就回答了开场：当整段区间清过金杯窗口时，十二杯可以为吧台背书。
  s3_zh_hk: >-
    對A店呢十二杯，百分之九十五嘅 t 置信區間係百分之十九點零四至二十點五六——落喺十八至二十二之內。呢個就回答咗開場：當成段區間清過金杯窗口嗰陣，十二杯可以為吧台背書。
