audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 390
title_en: Constructing the t-interval
title_zh: 构建 t 置信区间
title_zh_hk: 構建 t 置信區間
objective_en: Construct one-sample t confidence intervals for a population mean with unknown variance, determine critical
  values t* based on degrees of freedom df = n - 1, state underlying normality assumptions, and evaluate espresso extraction
  yield compliance across a 12-shot pilot audit at Mong Kok.
objective_zh: 在总体方差未知情形下构建单样本 t 均值置信区间，基于自由度 df = n - 1 查验临界值 t*，核验底层总体正态性前提假设，并在旺角店 12 杯意式浓缩咖啡萃取率品控抽检中完成合规认证。
objective_zh_hk: 喺總體方差未知情形下構建單樣本 t 均值置信區間，基於自由度 df = n - 1 查驗臨界值 t*，核驗底層總體正態性前提假設，並喺旺角舖 12 杯意式濃縮咖啡萃取率品控抽檢入面完成合規認證。
youtube:
  description_en: |-
    What is a one-sample t-interval?

    Suppose Shop A pulls twelve espresso shots for a quality pilot. Industry Golden Cup guidance wants total dissolved solids between 18% and 22%. The sample mean lands at 19.80%, with sample standard deviation s = 1.20%. Population sigma is unknown, and twelve cups are too few for the Central Limit Theorem to rescue a skewed parent. Can this short pilot certify the bar — or only the sample average?

    When sigma is unknown, replace Z* with Student's t critical value t* at df = n − 1:
    CI = sample mean ± t* × SE, with SE = s / √n.

    Made-up Shop A numbers: n = 12, sample mean = 19.80%, s = 1.20%.
    df = 12 − 1 = 11; t*(95%, df = 11) = 2.201.
    √12 ≈ 3.464, so SE = 1.20 / 3.464 ≈ 0.346%.
    Margin of error = 2.201 × 0.346 ≈ 0.76%.
    Interval: 19.80% ± 0.76% → [19.04%, 20.56%], inside the 18%–22% window.

    Rule: certify the whole t-interval against the tolerance band, not the sample mean alone. On small n, also check that the parent process looks roughly symmetric and free of wild outliers.
  description_zh: |-
    什么是单样本 t 置信区间？

    假设A店抽测十二杯意式浓缩做品控试点。行业金杯指引希望总溶解固体萃取率落在 18% 至 22%。样本均值 19.80%，样本标准差 s = 1.20%。总体 sigma 未知，十二杯也太少，中心极限定理救不了偏态母体。这段短试点能不能给吧台背书——还是只能证明样本均值？

    当 sigma 未知时，用学生 t 临界值 t*（自由度 df = n − 1）替换 Z 临界值：
    置信区间 = 样本均值 ± t 临界值 × 标准误，标准误 = s / √n。

    假设A店数字：n = 12，样本均值 = 19.80%，s = 1.20%。
    自由度 = 12 − 1 = 11；95% 时 t 临界值（自由度 11）= 2.201。
    √12 ≈ 3.464，所以标准误 = 1.20 / 3.464 ≈ 0.346%。
    误差容限 = 2.201 × 0.346 ≈ 0.76%。
    区间：19.80% ± 0.76% → [19.04%, 20.56%]，落在 18%–22% 窗口内。

    规则：用整段 t 置信区间对照公差带做认证，不要只看样本均值。样本量小时，还要核验母体过程大致对称、没有极端离群点。
  description_zh_hk: |-
    乜嘢係單樣本 t 置信區間？

    假設A店抽測十二杯意式濃縮做品控試點。行業金杯指引希望總溶解固體萃取率落喺 18% 至 22%。樣本均值 19.80%，樣本標準差 s = 1.20%。總體 sigma 未知，十二杯亦太少，中心極限定理救唔到偏態母體。呢段短試點可唔可以為吧台背書——定係淨係證明樣本均值？

    當 sigma 未知嗰陣，用學生 t 臨界值 t*（自由度 df = n − 1）替換 Z 臨界值：
    置信區間 = 樣本均值 ± t 臨界值 × 標準誤，標準誤 = s / √n。

    假設A店數字：n = 12，樣本均值 = 19.80%，s = 1.20%。
    自由度 = 12 − 1 = 11；95% 時 t 臨界值（自由度 11）= 2.201。
    √12 ≈ 3.464，所以標準誤 = 1.20 / 3.464 ≈ 0.346%。
    誤差容限 = 2.201 × 0.346 ≈ 0.76%。
    區間：19.80% ± 0.76% → [19.04%, 20.56%]，落喺 18%–22% 窗口內。

    規則：用成段 t 置信區間對照公差帶做認證，唔好淨係睇樣本均值。樣本量細嗰陣，仲要核驗母體過程大致對稱、冇極端離群點。
