id: STAT-M04-T14-SSIZE
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 344
title_en: Sample size engineering
title_zh: 样本量工程
title_zh_hk: 樣本量工程
objective_en: Derive sample size formulas for estimating means and proportions by inverting the margin of error equation,
  apply the conservative variance heuristic (p* = 0.50), round sample sizes upward to the next integer, and budget quarterly
  mystery shopper audits for customer queue wait times across Metro stores.
objective_zh: 通过对误差容限方程进行代数逆解推导均值与比例的最优样本量公式，应用极端方差保守启发式准则（p* = 0.50），执行向上取整整数准则，并在都市咖啡全网神秘顾客排队等候工时季度巡检中精准核定审计预算。
objective_zh_hk: 透過對誤差容限方程進行代數逆解推導均值同比例嘅最優樣本量公式，應用極端方差保守啟發式準則（p* = 0.50），執行向上取整整數準則，並喺都市咖啡全網神秘顧客排隊等候工時季度巡檢入面精準核定審計預算。
youtube:
  description_en: |-
    What is sample size engineering?

    Suppose the coffee chain wants a quarterly mystery-shopper audit of peak queue waits at Shop A, Shop B, and Shop C. Leadership demands a 95% confidence interval for the average wait with target margin of error E = 3.0 seconds. Historical sigma is 18.0 seconds. Each secret visit costs 400 dollars. The CFO will not sign a blank check for 500 visits. How many audits must you fund?

    Invert the margin-of-error formula:
    For a mean: n = (Z* × sigma / E)^2
    For a proportion: n = (Z*^2 × p*(1 − p*)) / E^2

    Made-up numbers: Z* = 1.960, sigma = 18.0 s, E = 3.0 s.
    n = (1.960 × 18.0 / 3.0)^2 = 11.76^2 = 138.2976 → ceiling to 139 visits.
    Budget = 139 × 400 = 55,600 dollars — not 200,000 for 500 visits.

    Two iron rules: always round n upward; when a proportion has no history, set p* = 0.50 (worst-case variance 0.25).
  description_zh: |-
    什么是样本量工程？

    假设连锁咖啡要在A店、B店、C店做季度神秘顾客暗访，摸清早高峰排队等待时间。管理层要求：百分之九十五置信区间，目标误差容限 E = 3.0 秒。历史标准差 sigma = 18.0 秒。每单暗访 400 元。财务总监不肯签五百次的空白支票。到底该批多少次？

    对误差容限公式做代数逆解：
    均值：n = (Z* × sigma / E)^2
    比例：n = (Z*^2 × p*(1 − p*)) / E^2

    假设数字：Z* = 1.960，sigma = 18.0 秒，E = 3.0 秒。
    n = (1.960 × 18.0 / 3.0)^2 = 11.76^2 = 138.2976 → 向上取整到 139 次。
    预算 = 139 × 400 = 55,600 元——不是五百次的二十万。

    两条铁律：样本量永远向上取整；比例没有历史时，取 p* = 0.50（最坏方差 0.25）。
  description_zh_hk: |-
    乜嘢係樣本量工程？

    假設連鎖咖啡要喺A店、B店、C店做季度神秘顧客暗訪，摸清朝高峰排隊等待時間。管理層要求：百分之九十五置信區間，目標誤差容限 E = 3.0 秒。歷史標準差 sigma = 18.0 秒。每單暗訪 400 蚊。財務總監唔肯簽五百次嘅空白支票。到底應該批幾多次？

    對誤差容限公式做代數逆解：
    均值：n = (Z* × sigma / E)^2
    比例：n = (Z*^2 × p*(1 − p*)) / E^2

    假設數字：Z* = 1.960，sigma = 18.0 秒，E = 3.0 秒。
    n = (1.960 × 18.0 / 3.0)^2 = 11.76^2 = 138.2976 → 向上取整到 139 次。
    預算 = 139 × 400 = 55,600 蚊——唔係五百次嘅二十萬。

    兩條鐵律：樣本量永遠向上取整；比例冇歷史嗰陣，取 p* = 0.50（最壞方差 0.25）。
