  title_zh_hk: 精度倒逼規模，進位捍衛法度：用逆解為資本支出護航
  q1_en: Why does cutting target margin of error in half quadruple your audit sample size?
  q1_zh: 为什么将审计误差容限砍半，必然会导致所需样本量疯狂翻上四倍？
  q1_zh_hk: 點解將審計誤差容限斬半，必然會搞到所需樣本量瘋狂翻上四倍？
  q2_en: How do managers assemble this entire toolkit into a single master estimation workflow?
  q2_zh: 运营管理者该如何将这一整套统计推断工具，融会贯通为一张总览全局的决策仪表盘？
  q2_zh_hk: 營運管理者應該點樣將呢一整套統計推斷工具，融會貫通為一張總覽全局嘅決策儀表盤？
  s1_en: Never guess an audit budget; establish target margin of error upfront and mathematically solve for sample size, always
    applying the ceiling rule to protect compliance.
  s1_zh: 切勿拍脑袋预估巡检预算；必须由管理层先敲定容限红线并逆解样本量，坚决贯彻向上取整法则以捍卫合规底线。
  s1_zh_hk: 切勿拍心口預估巡檢預算；必須由管理層先敲定容限紅線並逆解樣本量，堅決貫徹向上取整法則以捍衛合規底線。
  s2_en: 'Remember the quadratic penalty: shrinking error from three seconds to one point five seconds quadruples sample size
    from one hundred and thirty-nine to five hundred and fifty-four visits.'
  s2_zh: 时刻警惕二次方惩罚：将误差容限由三秒收窄至一点五秒，样本量将直接翻两番飙至五百五十四次，管理层必须清醒评估精度的边际成本。
  s2_zh_hk: 時刻警惕二次方懲罰：將誤差容限由三秒收窄至一點五秒，樣本量將直接翻兩番飆到五百五十四次，管理層必須清醒評估精度嘅邊際成本。
  s3_en: The operating rule is to solve for n and round up. A 3-second margin at sigma 18 needs 139 audits, not 138.
  s3_zh: 操作规则是反解样本量并向上取整。标准差 18 秒、容限 3 秒，需要 139 次巡查，不是 138 次。
  s3_zh_hk: 操作規則係反解樣本量並向上取整。標準差 18 秒、容限 3 秒，需要 139 次巡查，唔係 138 次。
