  step1_en: '(1.960×18.0/3.0)^2 = 138.2976'
  step1_zh: '(1.960×18.0/3.0)^2 = 138.2976'
  step1_zh_hk: '(1.960×18.0/3.0)^2 = 138.2976'
  step2_en: 'Ceiling → n = 139 visits'
  step2_zh: '向上取整 → n = 139 次'
  step2_zh_hk: '向上取整 → n = 139 次'
  step3_en: 'Budget = 139 × $400 = $55,600'
  step3_zh: '预算 = 139 × $400 = $55,600'
  step3_zh_hk: '預算 = 139 × $400 = $55,600'
  step4_en: 'Vs 500 visits → save ~$144k'
  step4_zh: '对比 500 次 → 省约十四万'
  step4_zh_hk: '對比 500 次 → 慳約十四萬'
  s1_en: >-
    Run the algebra. One point nine six zero times eighteen divided by three
    equals eleven point seven six. Square it: one hundred thirty-eight point
    two nine seven six required visits.
  s1_zh: >-
    执行代数逆解。一点九六零乘十八除以三，等于十一点七六。再平方：需要一百三十八点二九七六次暗访。
  s1_zh_hk: >-
    執行代數逆解。一點九六零乘十八除以三，等於十一點七六。再平方：需要一百三十八點二九七六次暗訪。
  s2_en: >-
    Apply the ceiling rule. Round up to exactly one hundred thirty-nine visits.
    One hundred thirty-eight would let the error slip past three seconds.
  s2_zh: >-
    执行向上取整。进到整整一百三十九次。一百三十八次会让误差越过三秒。
  s2_zh_hk: >-
    執行向上取整。進到整整一百三十九次。一百三十八次會令誤差越過三秒。
  s3_en: >-
    At four hundred dollars a visit, the purchase order is fifty-five thousand
    six hundred dollars.
  s3_zh: >-
    以每单四百元计，采购单是五万五千六百元。
  s3_zh_hk: >-
    以每單四百蚊計，採購單係五萬五千六百蚊。
  s4_en: >-
    Compare that with a blank check for five hundred visits at two hundred
    thousand dollars. Solving for n buys the same three-second precision and
    keeps about one hundred forty-four thousand dollars in cash.
  s4_zh: >-
    对比五百次的二十万空白支票。逆解样本量买到同样的三秒精度，还省下大约十四万四千元现金。
  s4_zh_hk: >-
    對比五百次嘅二十萬空白支票。逆解樣本量買到同樣嘅三秒精度，仲慳返大約十四萬四千蚊現金。
- id: takeaway
  visual: takeaway
  seconds: 48
  kicker: Decision rule
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Solve for n, then round up
  title_zh: 先逆解 n，再向上取整
  title_zh_hk: 先逆解 n，再向上取整
  q1_en: Why does halving E roughly quadruple n?
  q1_zh: 为什么把误差容限砍半，样本量大约翻四倍？
  q1_zh_hk: 點解將誤差容限斬半，樣本量大約翻四倍？
  q2_en: How many audits should the CFO fund here?
  q2_zh: 这次财务总监该批多少次暗访？
  q2_zh_hk: 呢次財務總監應該批幾多次暗訪？
  s1_en: >-
    Never guess an audit budget. Name the target margin of error first, solve
    for sample size, and always apply the ceiling rule so compliance holds.
  s1_zh: >-
    不要拍脑袋估巡检预算。先敲定目标误差容限，再逆解样本量，并坚决向上取整，合规才站得住。
  s1_zh_hk: >-
    唔好拍心口估巡檢預算。先敲定目標誤差容限，再逆解樣本量，並堅決向上取整，合規先企得住。
  s2_en: >-
    Watch the quadratic penalty: shrinking E from three seconds to one point
    five seconds multiplies n by about four — from one hundred thirty-nine up
    toward five hundred fifty-four visits.
  s2_zh: >-
    盯住二次方惩罚：把误差容限从三秒收到一点五秒，样本量大约翻四倍——从一百三十九冲向五百五十四次。
  s2_zh_hk: >-
    盯住二次方懲罰：將誤差容限由三秒收到一點五秒，樣本量大約翻四倍——由一百三十九衝向五百五十四次。
  s3_en: >-
    That answers the hook. With sigma eighteen and a three-second target, the
    CFO funds one hundred thirty-nine mystery audits — not one hundred
    thirty-eight, and not a blank check for five hundred.
  s3_zh: >-
    这就回答了开场。标准差十八秒、容限三秒，财务总监批一百三十九次神秘暗访——不是一百三十八，也不是五百次的空白支票。
  s3_zh_hk: >-
    呢個就回答咗開場。標準差十八秒、容限三秒，財務總監批一百三十九次神秘暗訪——唔係一百三十八，都唔係五百次嘅空白支票。
