  title_zh_hk: 巡舖預算到底應該批幾多單？
  en: >-
    Suppose the coffee chain wants a quarterly mystery-shopper audit of peak
    queue waits at Shop A, Shop B, and Shop C — and Shop E, a 24-hour site, if
    the night shift matters. Leadership is firm: estimate average wait with
    ninety-five percent confidence to within plus-or-minus three seconds. The
    agency charges four hundred dollars per secret visit. The CFO will not sign
    a blank check for five hundred visits. How do you reverse the margin formula
    and buy exactly the precision leadership wants — without wasting a dollar?
  zh: >-
    假设连锁咖啡要在A店、B店、C店做季度神秘顾客暗访——如果夜班也要紧，再加上E店这家二十四小时店——摸清早高峰排队等待时间。考核底线不容商量：百分之九十五置信度下，平均排队时间的估算误差必须锁在正负三秒以内。市调机构每单四百元。财务总监不肯签五百次的空白支票。你该怎样反解误差公式，买到管理层要的精度，又不多花一分冤枉钱？
  zh_hk: >-
    假設連鎖咖啡要喺A店、B店、C店做季度神秘顧客暗訪——如果夜班都要紧，再加埋E店呢間二十四小時店——摸清朝高峰排隊等待時間。考核底線唔好傾：百分之九十五置信度下，平均排隊時間嘅估算誤差必須鎖喺正負三秒以內。市調機構每單四百蚊。財務總監唔肯簽五百次嘅空白支票。你應該點樣反解誤差公式，買到管理層要嘅精度，又唔多使一分冤枉錢？
- id: define
  visual: definition_card
  seconds: 44
  kicker: What it is
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: The sample size equations
  title_zh: 样本量逆解公式
  title_zh_hk: 樣本量逆解公式
  formula: 'n=(Z* σ / E)^2'
  formula_zh: 'n=(Z* σ / E)^2'
  formula_zh_hk: 'n=(Z* σ / E)^2'
  formula_tex: 'n=\left(\frac{Z^{*}_{\alpha/2}\,\sigma}{E}\right)^{2}\qquad n=\frac{(Z^{*}_{\alpha/2})^{2}\,p^{*}(1-p^{*})}{E^{2}}'
  s1_en: >-
    Sample size engineering is the margin-of-error formula run backwards.
    Leadership names the target tolerance E first; you solve for the smallest
    sample size n that can deliver it.
  s1_zh: >-
    样本量工程，本质上是把误差容限公式做代数逆解。管理层先下达精度指标——误差容限 E；你再反解出能达到这个精度的最少样本量 n。
  s1_zh_hk: >-
    樣本量工程，本質上係將誤差容限公式做代數逆解。管理層先下達精度指標——誤差容限 E；你再反解出可以達到呢個精度嘅最少樣本量 n。
  s2_en: >-
    Because the square root of n sits in the standard-error denominator,
    isolating n squares the whole ratio. Required sample size grows with
    variance and shrinks with the square of target error.
  s2_zh: >-
    因为样本量的平方根藏在标准误的分母里，解出 n 时整个比会平方。所需样本量随方差变大，随目标误差的平方变小。
  s2_zh_hk: >-
    因為樣本量嘅平方根藏喺標準誤嘅分母入面，解出 n 嗰陣成個比會平方。所需樣本量隨方差變大，隨目標誤差嘅平方變細。
- id: name_n
  visual: title_card
  seconds: 28
  kicker: Name it
  kicker_en: Name it
  kicker_zh: 先定名
  kicker_zh_hk: 先定名
  title_en: Sample size (n)
  title_zh: 样本量（n）
  title_zh_hk: 樣本量（n）
  en: >-
    Say it once out loud: sample size — written n. It is the number of mystery
    visits you must fund so the planned interval can hit the error target.
  zh: >-
    大声念一次：样本量，写作 n。它就是你要批复的神秘暗访次数，好让计划中的区间能碰到误差目标。
  zh_hk: >-
    大聲念一次：樣本量，寫作 n。佢就係你要批復嘅神秘暗訪次數，等計劃中嘅區間可以碰到誤差目標。
- id: name_E
  visual: title_card
  seconds: 30
  kicker: Name it
  kicker_en: Name it
  kicker_zh: 先定名
  kicker_zh_hk: 先定名
  title_en: Margin of error (E)
  title_zh: 误差容限（E）
  title_zh_hk: 誤差容限（E）
  en: >-
    And the second name: margin of error — written E, sometimes called MOE.
    Here it is the plus-or-minus three seconds leadership will tolerate around
    the estimated average wait.
  zh: >-
    第二个名字：误差容限，写作 E，英文也叫 MOE。这里就是管理层能接受的、估计平均等待时间上下浮动的正负三秒。
  zh_hk: >-
    第二個名：誤差容限，寫作 E，英文都叫 MOE。呢度就係管理層接受得嘅、估計平均等待時間上下浮動嘅正負三秒。
- id: iron_rules
  visual: two_column
  seconds: 52
  kicker: Two iron rules
  kicker_en: Two iron rules
  kicker_zh: 两大铁律
  kicker_zh_hk: 兩大鐵律
  title_en: Ceiling rule and conservative p*
  title_zh: 向上取整与保守 p*
  title_zh_hk: 向上取整同保守 p*
  left_en: 'Ceiling: always round n up'
  left_zh: 向上取整：n 永远进位
  left_zh_hk: 向上取整：n 永遠進位
  right_en: 'No history: set p* = 0.50'
  right_zh: 比例未知：取 p* = 0.50
  right_zh_hk: 比例未知：取 p* = 0.50
  s1_en: >-
    First iron rule — the ceiling. Even if the calculator prints one hundred
    thirty-eight point one, you round up to one hundred thirty-nine. Fractions
    of a visit do not exist.
  s1_zh: >-
    第一条铁律——向上取整。就算计算器吐出一百三十八点一，也要进到一百三十九。暗访不能只做零点一单。
  s1_zh_hk: >-
    第一條鐵律——向上取整。就算計算機吐出一百三十八點一，都要進到一百三十九。暗訪唔可以淨係做零點一單。
  s2_en: >-
    Round down to one hundred thirty-eight and the realized margin of error
    slips past three seconds — the executive mandate is already broken.
  s2_zh: >-
    若向下舍到一百三十八，实际误差容限就会越过三秒红线——管理红线已经破了。
  s2_zh_hk: >-
    若果向下捨到一百三十八，實際誤差容限就會越過三秒紅線——管理紅線已經破咗。
  s3_en: >-
    Second iron rule — for a proportion with no history, set p-star to zero
    point fifty. That locks variance at its peak of zero point twenty-five, so
    the budget still holds in the worst case.
  s3_zh: >-
    第二条铁律——比例没有历史时，把 p 星号设为零点五零。方差被锁在峰值零点二五，预算在最坏情况下也站得住。
  s3_zh_hk: >-
    第二條鐵律——比例冇歷史嗰陣，將 p 星號設為零點五零。方差被鎖喺峰值零點二五，預算喺最壞情況下都企得住。
- id: givens
  visual: formula
  seconds: 40
  kicker: The mandate
  kicker_en: The mandate
  kicker_zh: 管理红线
  kicker_zh_hk: 管理紅線
  title_en: Shop network wait-time audit
  title_zh: 门店网排队暗访参数
