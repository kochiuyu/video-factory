quiz:
- id: Q1
  type: multiple_choice
  question_en: Headquarters requires a 95% confidence interval for average customer queue wait time with a target margin of
    error of no more than E = 3.0 seconds. Historical standard deviation is sigma = 18.0 seconds. What is the minimum number
    of mystery shopper audits that must be funded?
  question_zh: 总部要求构建 95% 置信区间评估顾客平均排队等候时间，目标误差容限不得超过 E = 3.0 秒。历史排队标准差为 sigma = 18.0 秒。管理层最少需要出资批复多少次神秘顾客独立抽查？
  question_zh_hk: 總部要求構建 95% 置信區間評估顧客平均排隊等候時間，目標誤差容限唔可以超過 E = 3.0 秒。歷史排隊標準差為 sigma = 18.0 秒。管理層最少需要出資批復幾多次神秘顧客獨立抽查？
  options_en:
  - 'A: n = (1.960 × 18.0 / 3.0)^2 = (11.76)^2 = 138.2976 → Must fund 139 audits (ceiling).'
  - 'B: n = (1.960 × 18.0 / 3.0) = 11.76 → 12 audits.'
  - 'C: n = 18.0 / 3.0 = 6 audits.'
  - 'D: n = 138 audits, rounding down to save budget.'
  options_zh:
  - 'A: n = (1.960 × 18.0 / 3.0)^2 = (11.76)^2 = 138.2976 → 向上取整，必须足额批复 139 次巡查。'
  - 'B: n = (1.960 × 18.0 / 3.0) = 11.76 → 向上取整为 12 次巡查。'
  - 'C: n = 18.0 / 3.0 = 6 次巡查。'
  - 'D: 取 n = 138 次，向下取整以节省审计支出。'
  options_zh_hk:
  - 'A: n = (1.960 × 18.0 / 3.0)^2 = (11.76)^2 = 138.2976 → 向上取整，必須足額批復 139 次巡查。'
  - 'B: n = (1.960 × 18.0 / 3.0) = 11.76 → 向上取整為 12 次巡查。'
  - 'C: n = 18.0 / 3.0 = 6 次巡查。'
  - 'D: 取 n = 138 次，向下取整以節省審計支出。'
  answer: A
  explanation_en: 'Solving E = Z* × sigma / sqrt(n) for n gives n = (Z* × sigma / E)^2 = (1.96 × 18 / 3)^2 = 11.76^2 = 138.30.
    Because 138 audits would let the error exceed 3.0 seconds, you must always round up to the next integer: 139 audits.'
  explanation_zh: 对误差公式 E = Z* × sigma / 根号(n) 进行代数逆解，得 n = (Z* × sigma / E)^2 = (1.96 × 18 / 3)^2 = 11.76^2 = 138.30。若仅抽查
    138 次，误差将微弱突破 3.0 秒红线，因此样本量工程必须严格执行向上取整：139 次。
  explanation_zh_hk: 對誤差公式 E = Z* × sigma / 根號(n) 進行代數逆解，得 n = (Z* × sigma / E)^2 = (1.96 × 18 / 3)^2 = 11.76^2 = 138.30。若果淨係抽查
    138 次，誤差將微弱突破 3.0 秒紅線，因此樣本量工程必須嚴格執行向上取整：139 次。
- id: Q2
  type: multiple_choice
  question_en: When sizing a customer survey to estimate a market proportion with zero historical data, why is plugging in
    p* = 0.50 the most conservative business practice?
  question_zh: 在缺乏任何历史先验数据的前提下为市场比例调研规划样本量时，为什么代入 p* = 0.50 是最审慎保险的商业惯例？
  question_zh_hk: 喺缺乏任何歷史先驗數據嘅前提下為市場比例調研規劃樣本量嗰陣，點解代入 p* = 0.50 係最審慎保險嘅商業慣例？
  options_en:
  - 'A: The product p(1 − p) reaches its maximum at p = 0.50 (0.25), so the planned sample size covers any true proportion.'
  - 'B: Because the true market proportion is known to sit near 50% in every category.'
  - 'C: Because p* = 0.50 removes the need to compute a standard error at all.'
  - 'D: Because setting p = 0.50 cuts the required sample size in half.'
  options_zh:
  - 'A: 二次函数 p(1 − p) 在 p = 0.50 处达到极大值（0.25），据此算出的样本量足以兜底任何未知的真实比例。'
  - 'B: 因为每个品类的真实市场比例都已知接近 50%。'
  - 'C: 因为设定 p* = 0.50 就可以完全不必再算标准误。'
  - 'D: 因为设定 p = 0.50 可以把所需样本量直接砍半。'
  options_zh_hk:
  - 'A: 二次函數 p(1 − p) 喺 p = 0.50 處達到極大值（0.25），據此計出嚟嘅樣本量足以兜底任何未知嘅真實比例。'
  - 'B: 因為每個品類嘅真實市場比例都已知接近 50%。'
  - 'C: 因為設定 p* = 0.50 就可以完全唔使再計標準誤。'
  - 'D: 因為設定 p = 0.50 可以把所需樣本量直接斬半。'
  answer: A
  explanation_en: Variance p(1 − p) peaks at 0.50 × 0.50 = 0.25. Planning with p* = 0.50 is the worst-case variance scenario,
    so the audit still meets the target margin of error no matter what the true proportion turns out to be.
  explanation_zh: 方差函数 p(1 − p) 在 0.50 处取得峰值 0.25。采用 p* = 0.50 设定了方差的上限边界，无论最终测得的真实比例是多少，实际误差容限都不会超过预设目标。
  explanation_zh_hk: 方差函數 p(1 − p) 喺 0.50 處取得峰值 0.25。採用 p* = 0.50 設定咗方差嘅上限邊界，無論最終測得嘅真實比例係幾多，實際誤差容限都唔會超過預設目標。
