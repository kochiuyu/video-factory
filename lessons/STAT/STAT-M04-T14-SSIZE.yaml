id: STAT-M04-T14-SSIZE
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: Sample size engineering
title_zh: 样本量工程学：神秘顾客巡店预算与精度逆解
title_zh_hk: 樣本量工程學：神秘顧客巡舖預算與精度逆解
objective_en: Derive sample size formulas for estimating means and proportions by inverting the margin of error equation,
  apply the conservative variance heuristic (p* = 0.50), round sample sizes upward to the next integer, and budget quarterly
  mystery shopper audits for customer queue wait times across Metro stores.
objective_zh: 通过对误差容限方程进行代数逆解推导均值与比例的最优样本量公式，应用极端方差保守启发式准则（p* = 0.50），执行向上取整整数准则，并在都市咖啡全网神秘顾客排队等候工时季度巡检中精准核定审计预算。
objective_zh_hk: 透過對誤差容限方程進行代數逆解推導均值同比例嘅最優樣本量公式，應用極端方差保守啟發式準則（p* = 0.50），執行向上取整整數準則，並喺都市咖啡全網神秘顧客排隊等候工時季度巡檢入面精準核定審計預算。
