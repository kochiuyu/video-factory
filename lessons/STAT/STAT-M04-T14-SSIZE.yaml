  formula: 'Z*=1.960 · E=3.0s · σ=18.0s · $400'
  formula_zh: Z*=1.960 · E=3.0秒 · σ=18.0秒 · $400
  formula_zh_hk: Z*=1.960 · E=3.0秒 · σ=18.0秒 · $400
  formula_tex: Z^{*}=1.960,\quad E=3.0,\quad \sigma=18.0
  s1_en: >-
    Lay out the quarterly mystery-audit sheet. Ninety-five percent confidence
    locks the critical value Z-star at one point nine six zero. Target margin
    of error E is three point zero seconds. Historical queue volatility sigma
    is eighteen point zero seconds. Each visit costs four hundred dollars.
  s1_zh: >-
    摊开季度暗访参数表。百分之九十五置信度把临界值 Z 星号钉在一点九六零。目标误差容限 E 是三点零秒。历史排队波动标准差 sigma 是十八点零秒。每单四百元。
  s1_zh_hk: >-
    攤開季度暗訪參數表。百分之九十五置信度將臨界值 Z 星號釘喺一點九六零。目標誤差容限 E 係三點零秒。歷史排隊波動標準差 sigma 係十八點零秒。每單四百蚊。
  s2_en: >-
    These four numbers — Z-star, sigma, E, and the unit cost — are all you need
    before you touch the sample-size formula.
  s2_zh: >-
    Z 临界值、sigma、误差容限 E，再加上单价——动手算样本量之前，只需要这四个数。
  s2_zh_hk: >-
    Z 臨界值、sigma、誤差容限 E，再加埋單價——郁手計樣本量之前，淨係需要呢四個數。
