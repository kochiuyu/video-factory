  title_zh_hk: 用區間框定大局，以嚴密推斷啟航假設檢驗
  q1_en: How does interval estimation prevent executive teams from committing catastrophic capital errors?
  q1_zh: 区间估计如何从根本上杜绝管理层在商业扩张中犯下灾难性的重资产投资失误？
  q1_zh_hk: 區間估計點樣由根本上杜絕管理層喺商業擴張入面犯下災難性嘅重資產投資失誤？
  q2_en: Which interval belongs to a 12-shot pilot with unknown variance?
  q2_zh: 方差未知的十二杯试点应当使用哪一种区间？
  q2_zh_hk: 方差未知嘅十二杯試點應當使用邊一種區間？
  s1_en: Never make a high-stakes capital allocation based on a raw sample average; always demand its confidence interval
    to inspect the downside boundary before committing shareholder resources.
  s1_zh: 切勿基于裸露的样本均值孤注一掷下达资本决断；务必调阅置信区间并严审悲观下界，方可在未知风险面前捍卫股东的真金白银。
  s1_zh_hk: 切勿基於裸露嘅樣本均值孤注一擲下達資本決斷；務必調閱置信區間並嚴審悲觀下界，先可以喺未知風險面前捍衛股東嘅真金白銀。
  s2_en: 'Follow the master taxonomy: apply Z for large means and proportions, t for unknown variance in small pilots, and
    the FPC whenever auditing over five percent of closed physical assets.'
  s2_zh: 严守推断分类法度：大样本均值与二元比例调用 Z 标尺，小样本未知方差启用 t 分布，资产抽验超 5% 坚决执行 FPC 修正。
  s2_zh_hk: 嚴守推斷分類法度：大樣本均值與二元比例調用 Z 標尺，小樣本未知方差啟用 t 分佈，資產抽驗超 5% 堅決執行 FPC 修正。
  s3_en: The operating rule is to match the metric before spending the capital. Spend uses a mean interval, kiosk conversion
    uses a proportion interval, and a 12-shot pilot uses t.
  s3_zh: 操作规则是先对上指标，再动用资本。客单用均值区间，点单机转化用比例区间，十二杯试点用 t。
  s3_zh_hk: 操作規則係先對上指標，再動用資本。客單用均值區間，點單機轉化用比例區間，十二杯試點用 t。
