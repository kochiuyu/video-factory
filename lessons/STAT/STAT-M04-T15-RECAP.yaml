id: STAT-M04-T15-RECAP
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 298
title_en: The executive estimation dashboard
title_zh: 区间估计总览看板
title_zh_hk: 區間估計總覽看板
objective_en: Synthesize the complete estimation toolkit across means, proportions, finite corrections, and sample size engineering
  into an executive decision tree, contrast estimation with hypothesis testing, and formulate evidence-based operational strategy
  across Metro branches.
objective_zh: 将均值估计、比例估计、有限总体修正及样本量工程学融会贯通为高管级统计决策树，阐明参数估计与假设检验的对偶桥梁关系，并针对都市咖啡全港连锁网络制定基于证据的运营决断战略。
objective_zh_hk: 將均值估計、比例估計、有限總體修正及樣本量工程學融會貫通為高管級統計決策樹，闡明參數估計同假設檢驗嘅對偶橋樑關係，並針對都市咖啡全港連鎖網絡制定基於證據嘅營運決斷戰略。
youtube:
  description_en: |-
    What is the estimation dashboard?

    Across this module the coffee chain faced the same question in many uniforms: which interval tool fits which metric? Shop A basket spend with a large n, a kiosk conversion proportion, a twelve-shot espresso pilot with unknown sigma, and a mystery-audit sample-size plan.

    Master branch logic:
    Metric → mean or proportion.
    Mean: Z if sigma known, student t if unknown.
    Proportion: Z when success-failure clears.
    If n/N exceeds about 5%, multiply SE by the finite population correction (FPC).
    Always: CI = point estimate ± (critical value × SE × [FPC]).

    Module numbers kept as-is:
    Shop A spend, n = 100 → 95% CI about [$46.69, $50.61].
    Shop E kiosk, n = 350 → 95% CI about [34.87%, 45.13%].
    Shop A espresso, n = 12 → 95% t-CI [19.04%, 20.56%].

    Duality: a hypothesized mu_0 is rejected at alpha = 0.05 (two-tailed) exactly when it sits outside the 95% CI.
  description_zh: |-
    什么是区间估计总览看板？

    整门课里，连锁咖啡反复遇到同一问题的不同制服：哪个区间工具配哪个指标？A店大样本客单、点单机转化比例、十二杯未知 sigma 的意式浓缩试点，还有神秘暗访的样本量计划。

    主分支逻辑：
    指标 → 均值或比例。
    均值：sigma 已知用 Z，未知用学生 t。
    比例：成败条件过关时用 Z。
    若 n/N 大约超过 5%，标准误再乘有限总体修正（FPC）。
    通式：置信区间 = 点估计 ±（临界值 × 标准误 × [FPC]）。

    本课沿用模块数字：
    A店客单，n = 100 → 95% 区间约 [$46.69, $50.61]。
    E店点单机，n = 350 → 95% 区间约 [34.87%, 45.13%]。
    A店萃取，n = 12 → 95% t 区间 [19.04%, 20.56%]。

    对偶：原假设值 mu_0 在 alpha = 0.05 双尾检验中被拒绝，当且仅当它落在 95% 置信区间之外。
  description_zh_hk: |-
    乜嘢係區間估計總覽看板？

    成門課入面，連鎖咖啡反覆遇到同一問題嘅唔同制服：邊個區間工具配邊個指標？A店大樣本客單、點單機轉化比例、十二杯未知 sigma 嘅意式濃縮試點，仲有神秘暗訪嘅樣本量計劃。

    主分支邏輯：
    指標 → 均值或比例。
    均值：sigma 已知用 Z，未知用學生 t。
    比例：成敗條件過關嗰陣用 Z。
    若果 n/N 大約超過 5%，標準誤再乘有限總體修正（FPC）。
    通式：置信區間 = 點估計 ±（臨界值 × 標準誤 × [FPC]）。

    本課沿用模組數字：
    A店客單，n = 100 → 95% 區間約 [$46.69, $50.61]。
    E店點單機，n = 350 → 95% 區間約 [34.87%, 45.13%]。
    A店萃取，n = 12 → 95% t 區間 [19.04%, 20.56%]。

    對偶：原假設值 mu_0 喺 alpha = 0.05 雙尾檢驗入面被拒絕，當且僅當佢落喺 95% 置信區間之外。
