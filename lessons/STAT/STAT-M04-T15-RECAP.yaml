quiz:
- id: Q1
  type: multiple_choice
  question_en: Which master decision path should leadership follow when auditing average daily spend per transaction at a
    new pilot shop with n = 45 receipts and completely unknown population variance sigma?
  question_zh: 当管理层审计某新开试点店的平均单笔客单价时（抽查 n = 45 张小票，总体方差 sigma 完全未知），应当沿用哪条经典统计决策路径？
  question_zh_hk: 當管理層審計某新開試點店嘅平均單筆客單價嗰陣（抽查 n = 45 張單據，總體方差 sigma 完全未知），應當沿用邊條經典統計決策路徑？
  options_en:
  - 'A: Use the one-sample t-interval (or a Normal approximation since n >= 30, with s in place of sigma) because the parameter
    is a continuous mean with unknown population variance.'
  - 'B: Use the proportion formula with p* = 0.50 because spend is recorded digitally.'
  - 'C: Use the Finite Population Correction because 45 receipts exceeds 5% of the pilot''s customers.'
  - 'D: Abandon the audit because estimation is impossible without knowing population sigma.'
  options_zh:
  - 'A: 采用单样本 t 置信区间（或鉴于 n >= 30，以样本标准差 s 替代并可用正态近似），因为所测指标为总体方差未知的连续均值。'
  - 'B: 采用保守基准比例公式 p* = 0.50，因为客单是电子结算的。'
  - 'C: 启用有限总体修正（FPC），因为 45 张小票突破了该店客流的 5%。'
  - 'D: 放弃该项审计，因为总体方差 sigma 未知时无法做参数估计。'
  options_zh_hk:
  - 'A: 採用單樣本 t 置信區間（或鑑於 n >= 30，以樣本標準差 s 替代並可用正態近似），因為所測指標為總體方差未知嘅連續均值。'
  - 'B: 採用保守基準比例公式 p* = 0.50，因為客單係電子結算嘅。'
  - 'C: 啟用有限總體修正（FPC），因為 45 張單據突破咗該店客流嘅 5%。'
  - 'D: 放棄嗰項審計，因為總體方差 sigma 未知嗰陣冇辦法做參數估計。'
  answer: A
  explanation_en: Transaction spend is a continuous mean. Because true sigma is unknown, use sample standard deviation s.
    With n = 45 >= 30, the CLT supports treating the sample mean as roughly normal, and t with df = 44 sits close to Normal.
  explanation_zh: 客单交易金额属于连续型均值指标。由于总体标准差未知，以样本标准差 s 估算。加之样本量 n = 45 >= 30，中心极限定理支持，可采用单样本 t 流程（自由度 df = 44，接近正态）。
  explanation_zh_hk: 客單交易金額屬於連續型均值指標。由於總體標準差未知，以樣本標準差 s 估算。加之樣本量 n = 45 >= 30，中心極限定理支持，可以採用單樣本 t 流程（自由度 df = 44，接近正態）。
- id: Q2
  type: multiple_choice
  question_en: What is the structural duality between a two-sided 95% confidence interval and a two-tailed hypothesis test
    at significance level alpha = 0.05?
  question_zh: 双尾 95% 置信区间与显著性水平 alpha = 0.05 的双尾假设检验之间，存在何种结构对偶关系？
  question_zh_hk: 雙尾 95% 置信區間與顯著性水平 alpha = 0.05 嘅雙尾假設檢驗之間，存在咩結構對偶關係？
  options_en:
  - 'A: A hypothesized null value mu_0 is rejected by an alpha = 0.05 two-tailed test if and only if that value falls outside
    the 95% confidence interval.'
  - 'B: Confidence intervals are only for reporting, while hypothesis tests are only for legal review.'
  - 'C: If the confidence interval contains zero, every future hypothesis test must produce a p-value of 1.0.'
  - 'D: There is no mathematical link; estimation and hypothesis testing are unrelated.'
  options_zh:
  - 'A: 当且仅当原假设设定的目标值 mu_0 完全落在 95% 置信区间之外时，该零假设才会在 alpha = 0.05 的双尾检验中被拒绝。'
  - 'B: 置信区间只用于报表展示，假设检验只供法务审阅。'
  - 'C: 只要置信区间包含零，未来所有假设检验的 p 值都必然等于 1.0。'
  - 'D: 两者在数学上没有关系；参数估计与假设检验互不相关。'
  options_zh_hk:
  - 'A: 當且僅當原假設設定嘅目標值 mu_0 完全落喺 95% 置信區間之外嗰陣，嗰個零假設先至會喺 alpha = 0.05 嘅雙尾檢驗入面被拒絕。'
  - 'B: 置信區間淨係用於報表展示，假設檢驗淨係供法務審閱。'
  - 'C: 只要置信區間包含零，未來所有假設檢驗嘅 p 值都必然等於 1.0。'
  - 'D: 兩者喺數學上冇關係；參數估計同假設檢驗互唔相關。'
  answer: A
  explanation_en: A confidence interval contains all null values that would not be rejected at alpha = 1 − confidence. If
    the corporate benchmark mu_0 lies outside the 95% interval, the difference is statistically significant at the 5% level.
  explanation_zh: 置信区间囊括了在显著性水平 alpha 下无法被拒绝的所有合理零假设取值。若管理层设定的基准值 mu_0 落在 95% 区间外部，则在 5% 显著性水平下必定拒绝原假设。
  explanation_zh_hk: 置信區間囊括咗喺顯著性水平 alpha 下冇辦法被拒絕嘅所有合理零假設取值。若果管理層設定嘅基準值 mu_0 落喺 95% 區間外部，噉喺 5% 顯著性水平下必定拒絕原假設。
beats:
- id: hook
  visual: title_card
  seconds: 44
  kicker: The executive mandate
  kicker_en: The executive mandate
  kicker_zh: 高管的考题
  kicker_zh_hk: 高管嘅考題
  title_en: How do leaders pick tools?
  title_zh: 管理者如何选对区间工具？
  title_zh_hk: 管理者點樣揀啱區間工具？
  en: >-
    From morning rushes at Shop A and Shop B to late shifts at Shop E, a
    24-hour site, leaders face the same audit fork again and again: Z or
    student t? A continuous mean or a binary proportion? Does this closed
    asset need a finite correction? Without a master chart, the team freezes.
    How do you fold the module's estimation tools into one dashboard that
    steers capital without guessing?
  zh: >-
    从A店、B店的早高峰，到E店这家二十四小时店的夜班，管理层反复撞上同一道分岔：用 Z 还是学生 t？连续均值还是二元比例？封闭资产要不要做有限总体修正？没有总览航标，团队很容易瘫痪。你该怎样把本模块的估计工具收成一张看板，用证据掌舵资本，而不是拍脑袋？
  zh_hk: >-
    由A店、B店嘅朝高峰，到E店呢間二十四小時店嘅夜班，管理層反覆撞上同一道分岔：用 Z 定係學生 t？連續均值定係二元比例？封閉資產要唔要做有限總體修正？冇總覽航標，團隊好容易癱瘓。你應該點樣將本模組嘅估計工具收成一張看板，用證據掌舵資本，而唔係拍心口？
- id: define
  visual: definition_card
  seconds: 46
  kicker: The taxonomy
  kicker_en: The taxonomy
  kicker_zh: 总览体系
  kicker_zh_hk: 總覽體系
  title_en: The master estimation taxonomy
  title_zh: 估计决策树
  title_zh_hk: 估計決策樹
  formula: 'CI = point ± (crit × SE × [FPC])'
  formula_zh: '置信区间 = 点估计 ±（临界值 × 标准误 × [FPC]）'
  formula_zh_hk: '置信區間 = 點估計 ±（臨界值 × 標準誤 × [FPC]）'
  formula_tex: '\mathrm{CI}=\widehat{\theta}\pm\big(c^{*}\cdot\mathrm{SE}\cdot[\mathrm{FPC}]\big)'
  s1_en: >-
    Estimation follows a branch tree. First classify the metric: continuous
    spend and wait times ride the mean track; yes-or-no conversion rides the
    proportion track.
  s1_zh: >-
    参数估计走一棵决策树。先给指标定性：连续的客单与等待时间走均值轨道；是或否的转化走比例轨道。
  s1_zh_hk: >-
    參數估計行一樖決策樹。先俾指標定性：連續嘅客單同等待時間行均值軌道；係定唔係嘅轉化行比例軌道。
  s2_en: >-
    For means: if population sigma is known, use Z; if unknown, use student t.
    For proportions, clear the success-failure check, then use Z. When the
    sample grabs more than about five percent of a closed population, multiply
    the standard error by the finite population correction.
  s2_zh: >-
    对均值：总体 sigma 已知用 Z，未知用学生 t。对比例：先过成败条件，再用 Z。当样本占封闭总体大约超过百分之五时，标准误再乘有限总体修正。
  s2_zh_hk: >-
    對均值：總體 sigma 已知用 Z，未知用學生 t。對比例：先過成敗條件，再用 Z。當樣本佔封閉總體大約超過百分之五嗰陣，標準誤再乘有限總體修正。
- id: name_ci
  visual: title_card
  seconds: 28
  kicker: Name it
  kicker_en: Name it
  kicker_zh: 先定名
  kicker_zh_hk: 先定名
  title_en: Confidence interval (CI)
  title_zh: 置信区间（CI）
  title_zh_hk: 置信區間（CI）
  en: >-
    Say the finished product once: confidence interval — written CI. Point
    estimate plus or minus critical value times standard error, with FPC when
    the closed-population share is large.
  zh: >-
    大声念一次成品名：置信区间，写作 CI。点估计加减临界值乘标准误；封闭总体占比大时，再乘有限总体修正。
  zh_hk: >-
    大聲念一次成品名：置信區間，寫作 CI。點估計加減臨界值乘標準誤；封閉總體佔比大嗰陣，再乘有限總體修正。
- id: name_t
  visual: title_card
  seconds: 28
  kicker: Name it
  kicker_en: Name it
  kicker_zh: 先定名
  kicker_zh_hk: 先定名
  title_en: Student's t
  title_zh: 学生 t 分布
  title_zh_hk: 學生 t 分佈
  en: >-
    And the small-sample name: student t. When sigma is unknown and n is not
    huge, replace Z-star with a t critical value at degrees of freedom n minus
    one.
  zh: >-
    还有小样本的名字：学生 t 分布。当 sigma 未知、样本量又不够大时，用自由度等于 n 减一的 t 临界值替换 Z 临界值。
  zh_hk: >-
    仲有小樣本嘅名：學生 t 分佈。當 sigma 未知、樣本量又唔夠大嗰陣，用自由度等於 n 減一嘅 t 臨界值替換 Z 臨界值。
- id: bridge
  visual: two_column
  seconds: 50
  kicker: Dual engines
  kicker_en: Dual engines
  kicker_zh: 对偶双引擎
  kicker_zh_hk: 對偶雙引擎
  title_en: Estimation bridges to testing
  title_zh: 估计通向假设检验
  title_zh_hk: 估計通向假設檢驗
  left_en: 'Estimation: what is theta?'
  left_zh: 估计：参数大概是多少？
  left_zh_hk: 估計：參數大概係幾多？
  right_en: 'Testing: benchmark survive?'
  right_zh: 检验：基准还站得住吗？
  right_zh_hk: 檢驗：基準仲企唔企得住？
  s1_en: >-
    Confidence intervals and hypothesis tests are mathematical twins.
    Estimation asks what the parameter is, and brackets every value the data
    still find plausible.
  s1_zh: >-
    置信区间与假设检验在数学上是孪生对偶。参数估计问真值大概是多少，并用数据框出仍说得通的取值范围。
  s1_zh_hk: >-
    置信區間同假設檢驗喺數學上係孿生對偶。參數估計問真值大概係幾多，並用數據框出仍然講得通嘅取值範圍。
  s2_en: >-
    Hypothesis testing asks whether an executive benchmark still survives.
    It checks whether a named null value remains inside that plausible set.
  s2_zh: >-
    假设检验追问：管理层定下的基准还站不站得住？它核验那个点名的原假设取值是否仍落在可信集合里。
  s2_zh_hk: >-
    假設檢驗追問：管理層定低嘅基準仲企唔企得住？佢核驗嗰個點名嘅原假設取值係咪仍然落喺可信集合入面。
  s3_en: >-
    If the corporate benchmark falls outside your ninety-five percent interval,
    a two-tailed test at alpha zero point zero five is guaranteed to reject it.
    The interval is the bridge.
  s3_zh: >-
    只要考核基准完全落在这段百分之九十五置信区间之外，在百分之五显著性的双尾检验里，它在数学上注定被拒绝。区间就是那座桥。
  s3_zh_hk: >-
    只要考核基準完全落喺呢段百分之九十五置信區間之外，喺百分之五顯著性嘅雙尾檢驗入面，佢喺數學上注定被拒絕。區間就係嗰座橋。
- id: ledger
  visual: steps
  seconds: 54
  kicker: The master ledger
  kicker_en: The master ledger
  kicker_zh: 大盘看板
  kicker_zh_hk: 大盤看板
  title_en: Three module audits, one matrix
  title_zh: 三笔模块审计，一张矩阵
  title_zh_hk: 三筆模組審計，一張矩陣
  layout: rows
  step1_en: 'Shop A spend n=100 → [$46.69, $50.61]'
  step1_zh: 'A店客单 n=100 → [$46.69, $50.61]'
  step1_zh_hk: 'A店客單 n=100 → [$46.69, $50.61]'
  step2_en: 'Shop E kiosk n=350 → [34.87%, 45.13%]'
  step2_zh: 'E店点单机 n=350 → [34.87%, 45.13%]'
  step2_zh_hk: 'E店點單機 n=350 → [34.87%, 45.13%]'
  step3_en: 'Shop A n=12 → t-CI [19.04%, 20.56%]'
  step3_zh: 'A店萃取 n=12 → t区间 [19.04%, 20.56%]'
  step3_zh_hk: 'A店萃取 n=12 → t區間 [19.04%, 20.56%]'
  s1_en: >-
    Pull the module dashboard. Shop A's large basket sample of one hundred
    tickets uses a Normal mean interval and lands about forty-six sixty-nine
    to fifty sixty-one dollars.
  s1_zh: >-
    拉开模块看板。A店一百张客单的大样本走正态均值区间，大约落在四十六块六毛九至五十块六毛一。
  s1_zh_hk: >-
    拉開模組看板。A店一百張客單嘅大樣本行正態均值區間，大約落喺四十六蚊六毫九至五十蚊六毫一。
  s2_en: >-
    Shop E's kiosk pilot of three hundred fifty orders builds a proportion
    bracket from thirty-four point eight seven to forty-five point thirteen
    percent — the same arithmetic as the pastry upsell short.
  s2_zh: >-
    E店三百五十笔点单机构建比例区间百分之三十四点八七至四十五点一三——算术与加购比例那一课相同。
  s2_zh_hk: >-
    E店三百五十筆點單機構建比例區間百分之三十四點八七至四十五點一三——算術同加購比例嗰一課相同。
  s3_en: >-
    Shop A's twelve-shot espresso pilot with unknown sigma calls student t and
    certifies yield between nineteen point zero four and twenty point five six
    percent. Each challenge already had its matching tool in the module.
  s3_zh: >-
    A店十二杯意式浓缩试点、总体方差未知，调用学生 t，把萃取率认证在百分之十九点零四至二十点五六。每一道业务题，模块里都有对位工具。
  s3_zh_hk: >-
    A店十二杯意式濃縮試點、總體方差未知，調用學生 t，將萃取率認證喺百分之十九點零四至二十點五六。每一道業務題，模組入面都有對位工具。
- id: takeaway
  visual: takeaway
  seconds: 48
  kicker: Decision rule
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Match the metric, then fund
  title_zh: 先对上指标，再动用资本
  title_zh_hk: 先對上指標，再動用資本
  q1_en: Why demand a CI before a capital call?
  q1_zh: 为什么资本决策前先要置信区间？
  q1_zh_hk: 點解資本決策前先要置信區間？
  q2_en: Which tool fits a 12-shot unknown-sigma?
  q2_zh: 十二杯未知方差试点该用哪种工具？
  q2_zh_hk: 十二杯未知方差試點應該用邊種工具？
  s1_en: >-
    Never green-light a high-stakes spend on a naked sample average. Demand
    the confidence interval and read the downside bound before shareholder
    cash moves.
  s1_zh: >-
    不要只凭裸露的样本均值就放行高风险支出。先调出置信区间，看清悲观下界，再动股东的真金白银。
  s1_zh_hk: >-
    唔好淨憑裸露嘅樣本均值就放行高風險支出。先調出置信區間，睇清悲觀下界，再郁股東嘅真金白銀。
  s2_en: >-
    Follow the taxonomy: Z for large means and cleared proportions, student t
    when sigma is unknown on small pilots, and FPC when you audit more than
    about five percent of a closed asset base.
  s2_zh: >-
    守住分类法：大样本均值与过关的比例用 Z；小样本未知方差用学生 t；抽验封闭资产超过大约百分之五时用有限总体修正。
  s2_zh_hk: >-
    守住分類法：大樣本均值同過關嘅比例用 Z；小樣本未知方差用學生 t；抽驗封閉資產超過大約百分之五嗰陣用有限總體修正。
  s3_en: >-
    That answers the hook. Leaders navigate the matrix by matching the metric
    first — spend means, kiosk proportions, twelve-shot t — then reading the
    whole interval before they fund.
  s3_zh: >-
    这就回答了开场。管理者先对上指标——客单走均值，点单机走比例，十二杯走 t——再读完整段区间，然后才批预算。
  s3_zh_hk: >-
    呢個就回答咗開場。管理者先對上指標——客單行均值，點單機行比例，十二杯行 t——再讀完整段區間，然後先至批預算。
