id: STAT-M04-T15-RECAP
course: STAT-M04
course_en: Sampling Distributions, the Central Limit Theorem, and Interval Estimation
course_zh: 抽样分布、中心极限定理与区间估计
course_zh_hk: 抽樣分佈、中心極限定理與區間估計
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: The executive estimation dashboard
title_zh: 总揽全局：执行官区间估计总览看板与假设检验之桥
title_zh_hk: 總攬全局：執行官區間估計總覽看板與假設檢驗之橋
objective_en: Synthesize the complete estimation toolkit across means, proportions, finite corrections, and sample size engineering
  into an executive decision tree, contrast estimation with hypothesis testing, and formulate evidence-based operational strategy
  across Metro branches.
objective_zh: 将均值估计、比例估计、有限总体修正及样本量工程学融会贯通为高管级统计决策树，阐明参数估计与假设检验的对偶桥梁关系，并针对都市咖啡全港连锁网络制定基于证据的运营决断战略。
objective_zh_hk: 將均值估計、比例估計、有限總體修正及樣本量工程學融會貫通為高管級統計決策樹，闡明參數估計同假設檢驗嘅對偶橋樑關係，並針對都市咖啡全港連鎖網絡制定基於證據嘅營運決斷戰略。
