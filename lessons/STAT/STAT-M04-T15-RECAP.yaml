quiz:
- id: Q1
  type: multiple_choice
  question_en: Which master decision path should Metro leadership follow when auditing average daily spend per transaction
    across a new pilot branch with n = 45 receipts and completely unknown population variance sigma?
  question_zh: 当都市咖啡管理层审计某新开试点分店的平均单笔客单价时（抽查 n = 45 张小票，总体方差 sigma 完全未知），应当沿用哪条经典统计决策路径？
  question_zh_hk: 當都市咖啡管理層審計某新開試點分舖嘅平均單筆客單價嗰陣（抽查 n = 45 張單據，總體方差 sigma 完全未知），應當沿用邊條經典統計決策路徑？
  options_en:
  - 'A: Use the one-sample t-interval (or normal approximation since n >= 30, with s in place of sigma) because the parameter
    is a continuous mean with unknown population variance.'
  - 'B: Use the proportion formula with p* = 0.50 because customer spend is recorded digitally.'
  - 'C: Use the Finite Population Correction because 45 receipts exceeds 5% of the pilot''s customers.'
  - 'D: Reject the audit entirely because estimation is impossible without knowing population sigma.'
  options_zh:
  - 'A: 采用单样本 t 置信区间（或鉴于 n >= 30 中心极限定理生效，以样本标准差 s 替代并调用正态临界值），因为所测指标为总体方差未知的连续均值。'
  - 'B: 采用保守基准比例公式 p* = 0.50，因为客单消费是以电子数字化方式结算的。'
  - 'C: 强制启用有限总体修正（FPC），因为 45 张小票突破了该店客流的 5%。'
  - 'D: 彻底废弃该项审计，因为在总体方差 sigma 未知的情形下在数学上根本无法实施参数估计。'
  options_zh_hk:
  - 'A: 採用單樣本 t 置信區間（或鑑於 n >= 30 中心極限定理生效，以樣本標準差 s 替代並調用正態臨界值），因為所測指標為總體方差未知嘅連續均值。'
  - 'B: 採用保守基準比例公式 p* = 0.50，因為客單消費係以電子數碼化方式結算嘅。'
  - 'C: 強制啟用有限總體修正（FPC），因為 45 張單據突破咗該舖客流嘅 5%。'
  - 'D: 徹底廢棄嗰項審計，因為喺總體方差 sigma 未知嘅情形下喺數學上根本冇辦法實施參數估計。'
  answer: A
  explanation_en: Transaction spend is a continuous mean. Because true sigma is unknown, we use sample standard deviation
    s. With n = 45 >= 30, the CLT guarantees normality of the sample mean, and t_(df=44) converges closely to the normal distribution.
  explanation_zh: 客单交易金额属于连续型均值指标。由于总体标准差未知，以样本标准差 s 估算。加之样本量 n = 45 >= 30，中心极限定理生效，可直接采用单样本 t 流程（自由度 df = 44，渐近等价于正态分布）。
  explanation_zh_hk: 客單交易金額屬於連續型均值指標。由於總體標準差未知，以樣本標準差 s 估算。加之樣本量 n = 45 >= 30，中心極限定理生效，可以直接採用單樣本 t 流程（自由度 df = 44，漸近等價於正態分佈）。
- id: Q2
  type: multiple_choice
  question_en: What is the profound structural duality between a two-sided 95% confidence interval and a two-tailed hypothesis
    test at significance level alpha = 0.05?
  question_zh: 双尾 95% 置信区间与显著性水平 alpha = 0.05 的双尾假设检验之间，存在何种深刻的结构对偶关系？
  question_zh_hk: 雙尾 95% 置信區間與顯著性水平 alpha = 0.05 嘅雙尾假設檢驗之間，存在咩深刻嘅結構對偶關係？
  options_en:
  - 'A: A hypothesized null value mu_0 will be rejected by an alpha = 0.05 two-tailed test if and only if that value falls
    completely outside the 95% confidence interval.'
  - 'B: Confidence intervals are designed exclusively for marketing, while hypothesis tests are reserved for legal teams.'
  - 'C: If the confidence interval captures zero, all future hypothesis tests will produce p-values of 1.0.'
  - 'D: There is no mathematical relationship; estimation and hypothesis testing are mutually exclusive.'
  options_zh:
  - 'A: 当且仅当原假设设定的目标值 mu_0 完全落在 95% 置信区间之外时，该零假设才会在 alpha = 0.05 的双尾检验中被正式拒绝。'
  - 'B: 置信区间是专为品牌营销设计的报表，而假设检验则是法务与合规团队的专用工具。'
  - 'C: 只要置信区间包含了数值零，未来所有的假设检验都会得出恒等于 1.0 的 p 值。'
  - 'D: 两者在数学结构上毫无关联；参数估计与假设检验属于非此即彼的对立体系。'
  options_zh_hk:
  - 'A: 當且僅當原假設設定嘅目標值 mu_0 完全落喺 95% 置信區間之外嗰陣，嗰個零假設先至會喺 alpha = 0.05 嘅雙尾檢驗入面被正式拒絕。'
  - 'B: 置信區間係專為品牌營銷設計嘅報表，而假設檢驗就係法務與合規團隊嘅專用工具。'
  - 'C: 只要置信區間包含咗數值零，未來所有嘅假設檢驗都會得出恆等於 1.0 嘅 p 值。'
  - 'D: 兩者喺數學結構上毫無關聯；參數估計與假設檢驗屬於非此即彼嘅對立體系。'
  answer: A
  explanation_en: A confidence interval contains all plausible null hypotheses that cannot be rejected at alpha = 1 - Confidence.
    If the corporate benchmark mu_0 lies outside the 95% interval, the difference is statistically significant at the 5% level.
  explanation_zh: 置信区间本质上囊括了在显著性水平 alpha 下无法被拒绝的所有合理零假设取值集合。若管理层设定的基准值 mu_0 落在 95% 区间外部，则在 5% 显著性水平下必定拒绝原假设。
  explanation_zh_hk: 置信區間本質上囊括咗喺顯著性水平 alpha 下冇辦法被拒絕嘅所有合理零假設取值集合。若果管理層設定嘅基準值 mu_0 落喺 95% 區間外部，噉喺 5% 顯著性水平下必定拒絕原假設。
beats:
- id: hook
  visual: title_card
  seconds: 30
  kicker: The Executive Mandate
  kicker_en: The Executive Mandate
  kicker_zh: 首席执行官的考题
  kicker_zh_hk: 首席執行官嘅考題
  title_en: How do leaders navigate the estimation matrix?
  title_zh: 面对万千业务指标：管理者如何执掌推断总则？
  title_zh_hk: 面對萬千業務指標：管理者點樣執掌推斷總則？
  en: 'From morning rushes at Wan Chai and Mong Kok to late departures at the Airport, Metro Coffee executives face endless
    audit dilemmas: Should we use Z or t? Are transactions continuous dollars or discrete proportions? Does our espresso machine
    audit require a finite correction? Operating without a master navigational chart invites strategic paralysis. How do leaders
    synthesize all fifteen tools of statistical inference into a unified decision dashboard that steers multi-million-dollar
    capital investments?'
  zh: 从湾仔与旺角的早高峰出餐，到国际机场航站楼的午夜航班，都市咖啡的管理层每天都面临着复杂的统计抉择：面对未知方差该调遣 Z 还是 t？加购点心应当套用连续均值还是二元比例？机队巡检是否触发有限修正红线？若缺乏宏观航标，决策者极易在指标迷宫中陷入瘫痪。高管层究竟该如何将十五节课的推断法度融会贯通为统一看板，从容掌舵数以千万计的商业资本决断？
  zh_hk: 由灣仔同旺角嘅朝高峰出餐，到國際機場航站樓嘅午夜航班，都市咖啡嘅管理層每日都面臨住複雜嘅統計抉擇：面對未知方差應該調遣 Z 定係 t？加購點心應當套用連續均值定係二元比例？機隊巡檢係咪觸發有限修正紅線？若果缺乏宏觀航標，決策者極易喺指標迷宮入面陷入癱瘓。高管層究竟應該點樣將十五節課嘅推斷法度融會貫通為統一看板，從容掌舵數以千萬計嘅商業資本決斷？
- id: define
  visual: definition_card
  seconds: 34
  kicker: The Taxonomy
  kicker_en: The Taxonomy
  kicker_zh: 总览体系
  kicker_zh_hk: 總覽體系
  title_en: The master estimation taxonomy
  title_zh: 统计推断四大核心分支
  title_zh_hk: 統計推斷四大核心分支
  formula: Metric -> [Mean (Z if sigma known, t if unknown) | Proportion (Z if np, n(1-p)>=10)] * [FPC if n/N > 0.05]
  formula_zh: 业务指标 -> [均值：sigma 已知用 Z，未知用 t] 或 [比例：np 与 n(1-p) >= 10 用 Z]；若抽样比突破 5% 乘 FPC
  formula_zh_hk: 業務指標 -> [均值：sigma 已知用 Z，未知用 t] 或 [比例：np 同 n(1-p) >= 10 用 Z]；若果抽樣比突破 5% 乘 FPC
  formula_tex: \text{CI} = \text{Point Estimate} \pm \left( \text{Multiplier} \cdot \text{SE} \cdot [\text{FPC}] \right)
  s1_en: 'Statistical estimation follows a clear branch logic. First classify the metric: continuous operational metrics belong
    to means; binary success rates belong to proportions.'
  s1_zh: 现代参数估计遵循严密的决策树逻辑。首要任务是定性指标归属：连续型工时与消费流水归属于均值轨道；二元对立的扫码与加购转化归属于比例轨道。
  s1_zh_hk: 現代參數估計遵循嚴密嘅決策樹邏輯。首要任務係定性指標歸屬：連續型工時同消費流水歸屬於均值軌道；二元對立嘅掃碼與加購轉化歸屬於比例軌道。
  s2_en: 'For means, determine variance: if population sigma is known, use normal Z; if unknown, invoke Student''s t. For
    closed systems where sample fraction exceeds five percent, apply the Finite Population Correction.'
  s2_zh: 针对均值核查方差状态：总体真实 sigma 已知调用 Z 标尺，未知则启用学生氏 t 分布。若在封闭资产中抽样比突破百分之五，强制乘上 FPC 锁定高精度。
  s2_zh_hk: 針對均值核查方差狀態：總體真實 sigma 已知調用 Z 標尺，未知就啟用學生氏 t 分佈。若果喺封閉資產入面抽樣比突破百分之五，強制乘上 FPC 鎖定高精度。
- id: mechanics
  visual: two_column
  seconds: 36
  kicker: The Dual Engine
  kicker_en: The Dual Engine
  kicker_zh: 对偶双璧
  kicker_zh_hk: 對偶雙璧
  title_en: Estimation as the bridge to hypothesis testing
  title_zh: 区间估计与假设检验的对偶纽带
  title_zh_hk: 區間估計與假設檢驗嘅對偶紐帶
  left_en: 'Estimation (What is the parameter?): Brackets the true state of nature'
  left_zh: 参数估计（真值为几何？）：构建区间，框定未知的客观世界真容
  left_zh_hk: 參數估計（真值係幾多？）：構建區間，框定未知嘅客觀世界真容
  right_en: 'Testing (Did performance change?): Rejects null benchmark if outside CI'
  right_zh: 假设检验（变革是否奏效？）：当既定基准脱网于区间外时，坚决证伪
  right_zh_hk: 假設檢驗（變革係咪奏效？）：當既定基準脫網喺區間外嗰陣，堅決證偽
  s1_en: 'Confidence intervals and hypothesis tests are mathematical twins. Estimation answers: What is the parameter? It
    builds a bracket containing all plausible truths supported by data.'
  s1_zh: 置信区间与假设检验在数学底层是孪生对偶体。参数估计回答“宏观真值究竟是多少”，它用数据划定出一片包容所有合理解释的安全区间。
  s1_zh_hk: 置信區間與假設檢驗喺數學底層係孿生對偶體。參數估計回答「宏觀真值究竟係幾多」，佢用數據劃定出一片包容所有合理解釋嘅安全區間。
  s2_en: 'Hypothesis testing answers: Did our operational intervention make an impact? It tests whether an executive performance
    benchmark remains plausible.'
  s2_zh: 而假设检验则追问“我们的业务变革是否真实产生了效果”。它严密核验既定的绩效基准在统计上是否站得住脚。
  s2_zh_hk: 而假設檢驗就追問「我哋嘅業務變革係咪真實產生咗效果」。佢嚴密核驗既定嘅績效基準喺統計上係咪企得穩陣腳。
  s3_en: If the corporate benchmark falls outside your ninety-five percent confidence interval, a two-tailed test at alpha
    point zero five is mathematically guaranteed to reject it. Estimation sets the foundation for testing.
  s3_zh: 只要集团考核基准完全跌落在这段 95% 置信区间之外，在 5% 显著性水平的双尾检验中，该基准便在数学上注定被推翻拒绝。区间估计正是通往假设检验的基石。
  s3_zh_hk: 只要集團考核基準完全跌落喺呢段 95% 置信區間之外，喺 5% 顯著性水平嘅雙尾檢驗入面，嗰個基準就喺數學上注定被推翻拒絕。區間估計正正係通往假設檢驗嘅基石。
- id: ledger
  visual: steps
  seconds: 36
  kicker: The Master Ledger
  kicker_en: The Master Ledger
  kicker_zh: 大盘巡检
  kicker_zh_hk: 大盤巡檢
  title_en: Consolidated executive audit dashboard
  title_zh: 都市咖啡全港三大业务支柱推断矩阵
  title_zh_hk: 都市咖啡全港三大業務支柱推斷矩陣
  step1_en: 'Customer spend (Wan Chai, n = 100): CLT normal mean -> 95% CI = [$46.69, $50.61]'
  step1_zh: 客单消费（湾仔店，n = 100）：大样本 CLT 均值 -> 95% 区间 [$46.69, $50.61]
  step1_zh_hk: 客單消費（灣仔舖，n = 100）：大樣本 CLT 均值 -> 95% 區間 [$46.69, $50.61]
  step2_en: 'Digital conversion (Airport, n = 350): Kiosk upsell -> 95% CI = [34.87%, 45.13%]'
  step2_zh: 数字转化（机场店，n = 350）：二元触控屏比例 -> 95% 区间 [34.87%, 45.13%]
  step2_zh_hk: 數字轉化（機場舖，n = 350）：二元觸控屏比例 -> 95% 區間 [34.87%, 45.13%]
  step3_en: 'Quality yield (Mong Kok, n = 12): Unknown sigma -> 95% t-CI = [19.04%, 20.56%]'
  step3_zh: 出品萃取（旺角店，n = 12）：未知方差小样本 -> 95% t 区间 [19.04%, 20.56%]
  step3_zh_hk: 出品萃取（旺角舖，n = 12）：未知方差小樣本 -> 95% t 區間 [19.04%, 20.56%]
  s1_en: Consolidate the quarterly executive dashboard. In customer spend at Wan Chai, one hundred tickets leverage the Central
    Limit Theorem to bound average basket size between forty-six sixty-nine and fifty sixty-one.
  s1_zh: 聚合全港季度高管看板。在湾仔店的客单消费审计中，一百张流水依托中心极限定理，将大盘均值死死框定在四十六块六毛九至五十块六毛一之间。
  s1_zh_hk: 聚合全港季度高管看板。喺灣仔舖嘅客單消費審計入面，一百張流水依托中心極限定理，將大盤均值死死框定喺四十六蚊六毫九至五十蚊六毫一之間。
  s2_en: In digital growth at the Airport terminal, three hundred and fifty kiosk transactions yield a proportion bracket
    of thirty-four point eight seven to forty-five point thirteen percent, conclusively securing our thirty-three percent
    investment hurdle.
  s2_zh: 在机场航站楼的数字化渗透战役中，三百五十笔点单机流水构建的转化区间为百分之三十四点八七至四十五点一三，彻底锁死三十三保本线。
  s2_zh_hk: 喺機場航站樓嘅數碼化滲透戰役入面，三百五十筆點單機流水構建嘅轉化區間為百分之三十四點八七至四十五點一三，徹底鎖死三十三保本線。
  s3_en: In Mong Kok coffee extraction, twelve pilot shots command Student's t critical values to certify extraction yield
    between nineteen point zero four and twenty point five six percent. Every business challenge finds its exact mathematical
    match.
  s3_zh: 而在旺角旗舰店的品质巡检中，十二杯小样本调遣学生氏 t 分布，将真实萃取率认证在百分之十九点零四至二十点五六黄金带。每一项商业决策，均有法度完备的数学工具精准对位。
  s3_zh_hk: 而喺旺角旗艦舖嘅品質巡檢入面，十二杯小樣本調遣學生氏 t 分佈，將真實萃取率認證喺百分之十九點零四至二十點五六黃金帶。每一項商業決策，均有法度完備嘅數學工具精準對位。
