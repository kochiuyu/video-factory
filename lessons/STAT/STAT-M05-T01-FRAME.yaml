objective_en: Formulate null and alternative hypotheses for a business mean, standardize the gap between a sample estimate
  and a null benchmark, explain why a nonsignificant result means fail to reject rather than accept H0, and separate statistical
  evidence from employee-level conclusions.
objective_zh: 为业务均值规范设定原假设与备择假设，把样本估计与原假设基准之间的差距标准化，解释为什么不显著结果应表述为“不拒绝”而非“接受”H0，并区分统计证据与针对员工个人的结论。
objective_zh_hk: 為業務均值規範設定原假設同備擇假設，將樣本估計同原假設基準之間嘅差距標準化，解釋點解唔顯著結果應該表述為「唔拒絕」而唔係「接受」H0，並區分統計證據同針對員工個人嘅結論。
youtube:
  description_en: |
    Framing a Hypothesis Test

    Suppose Shop A checks the cash drawer on 36 shifts, and on average the drawer comes up HK$1.80 short per shift. Call that a real process problem when it is just noise, and the team wastes time. Shrug it off when it is real, and money keeps leaking. How big must a gap be before we act? That tool is a hypothesis test.

    The null hypothesis (H0) is the benchmark we hold until the data push hard against it, here mu equals 0. The alternative (H1) is the competing claim, here mu is not equal to 0. Not equal means a drawer that runs short or runs over both count. Fix the benchmark and the direction before you look at the result.

    In an assumed example, sigma is HK$9, so the standard error is 9 / √36 = HK$1.50. Then Z = (−1.80 − 0) / 1.50 = −1.20, and the two-sided p-value is about 0.230. At alpha = 0.05 we fail to reject H0. Gaps like this turn up about one time in four from noise alone.

    Rule: report reject or fail to reject, never accept. Fail to reject is not proof that H0 is true, and a rejection is about the process, not a verdict on any one cashier.
  description_zh: |
    构建假设检验：原假设、备择假设与证据

    假设A店抽查了 36 个班次的收银钱箱，平均每个班次短款 HK$1.80。把日常小波动当成流程出了问题，团队就白忙一场；问题是真的却不当回事，钱就会一直漏掉。差距要多大才值得出手？回答这个问题的工具，就叫假设检验（hypothesis test）。

    原假设（null hypothesis，H0）是我们先守住的基准，直到数据强烈反对它，这里是 mu 等于 0。备择假设（alternative hypothesis，H1）是对立的主张，这里是 mu 不等于 0。不等于的意思是，长期短款或者长期多出来都算。基准和方向，要在看结果之前就定好。

    在一个假设的例子里，标准差 sigma 是 HK$9，标准误是 9 / √36 = HK$1.50。于是 Z = (−1.80 − 0) / 1.50 = −1.20，双侧 p 值大约 0.230。在 alpha = 0.05 下，不拒绝原假设。这么大的差距，光靠随机波动大约每四次就会出现一次。

    规则：只报告“拒绝”或“不拒绝”，永远不说“接受”。不拒绝不等于证明 H0 为真；就算拒绝了，也只是对流程的判断，不是对哪一位收银员的判决。
  description_zh_hk: |
    構建假設檢驗：原假設、備擇假設同證據

    假設A店抽查咗 36 個班次嘅收銀錢箱，平均每個班次短款 HK$1.80。將日常細波動當成流程出咗問題，團隊就白做一場；問題係真嘅又唔當一回事，錢就會一直漏走。差距要幾大先值得出手？答呢條問題嘅工具，就叫假設檢驗（hypothesis test）。

    原假設（null hypothesis，H0）係我哋先守住嘅基準，直到數據強烈反對佢，呢度係 mu 等於 0。備擇假設（alternative hypothesis，H1）係對立嘅主張，呢度係 mu 唔等於 0。唔等於即係話，長期短款或者長期多出嚟都計。基準同方向，要喺睇結果之前就定好。

    喺一個假設嘅例子入面，標準差 sigma 係 HK$9，標準誤係 9 / √36 = HK$1.50。於是 Z = (−1.80 − 0) / 1.50 = −1.20，雙側 p 值大約 0.230。喺 alpha = 0.05 之下，唔拒絕原假設。咁大嘅差距，淨係靠隨機波動大約每四次就會出現一次。

    規則：只報告「拒絕」或者「唔拒絕」，永遠唔講「接受」。唔拒絕唔等於證明 H0 為真；就算拒絕咗，都只係對流程嘅判斷，唔係對邊一位收銀員嘅判決。
