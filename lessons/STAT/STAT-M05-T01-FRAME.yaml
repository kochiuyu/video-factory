quiz:
- id: Q1
  type: multiple_choice
  question_en: Why should a nonsignificant result be reported as fail to reject H0 rather than accept H0?
  question_zh: 检验结果不显著时，为什么要说“不拒绝原假设”，而不能说“接受原假设”？
  question_zh_hk: 檢驗結果唔顯著嗰陣，點解要講「唔拒絕原假設」，而唔可以講「接受原假設」？
  options_en:
  - 'A: Weak evidence against H0 does not prove H0; noise or a small sample can hide a real gap.'
  - 'B: Because a p-value above 0.05 means H0 has a 95% chance of being true.'
  - 'C: Because H0 can only be accepted once the sample has more than 30 observations.'
  - 'D: Because a nonsignificant result proves the alternative H1 is false.'
  options_zh:
  - 'A: 反对 H0 的证据不够，不等于证明 H0 为真；噪声大或样本小都可能掩盖真实差距。'
  - 'B: 因为 p 值大于 0.05，就表示 H0 有 95% 的机会为真。'
  - 'C: 因为样本超过 30 个观测值之后，才可以接受 H0。'
  - 'D: 因为不显著的结果证明了备择假设 H1 是错的。'
  options_zh_hk:
  - 'A: 反對 H0 嘅證據唔夠，唔等於證明 H0 為真；雜音大或者樣本細都可能遮住真實差距。'
  - 'B: 因為 p 值大過 0.05，就表示 H0 有 95% 機會為真。'
  - 'C: 因為樣本超過 30 個觀測值之後，先可以接受 H0。'
  - 'D: 因為唔顯著嘅結果證明咗備擇假設 H1 係錯嘅。'
  answer: A
  explanation_en: A nonsignificant result means the evidence did not cross the chosen rejection threshold. Like a not-guilty
    verdict, it says the burden of proof was not met; it does not establish that the null is true.
  explanation_zh: 不显著只表示证据没有越过事先定好的拒绝门槛。就像法庭判“证据不足”，只是举证责任没有完成，并不证明原假设就是真的。
  explanation_zh_hk: 唔顯著淨係表示證據未越過事先定好嘅拒絕門檻。好似法庭判「證據不足」，只係舉證責任未完成，並唔證明原假設就係真嘅。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose Shop A checks 36 shifts. The benchmark mean cash gap is HK$0, the sample mean is -HK$1.80, and the
    known standard error is HK$1.50. What are the two-sided hypotheses and the test statistic Z?'
  question_zh: 假设A店抽查 36 个班次。现金差额的基准均值是 HK$0，样本均值是 -HK$1.80，已知标准误是 HK$1.50。双侧假设和检验统计量 Z 分别是什么？
  question_zh_hk: 假設A店抽查 36 個班次。現金差額嘅基準均值係 HK$0，樣本均值係 -HK$1.80，已知標準誤係 HK$1.50。雙側假設同檢驗統計量 Z 分別係乜嘢？
  options_en:
  - 'A: H0: μ = 0 vs H1: μ ≠ 0; Z_calc = (-1.80 - 0) / 1.50 = -1.20'
  - 'B: H0: μ = -1.80 vs H1: μ = 0; Z_calc = -1.80 / 36 = -0.05'
  - 'C: H0: μ > 0 vs H1: μ < 0; Z_calc = 1.50 / -1.80 = -0.83'
  - 'D: H0: μ ≠ 0 vs H1: μ = 0; Z_calc = (-1.80 * 1.50) = -2.70'
  options_zh:
  - 'A: H0: μ = 0 对 H1: μ ≠ 0；Z_calc = (-1.80 - 0) / 1.50 = -1.20'
  - 'B: H0: μ = -1.80 对 H1: μ = 0；Z_calc = -1.80 / 36 = -0.05'
  - 'C: H0: μ > 0 对 H1: μ < 0；Z_calc = 1.50 / -1.80 = -0.83'
  - 'D: H0: μ ≠ 0 对 H1: μ = 0；Z_calc = (-1.80 × 1.50) = -2.70'
  options_zh_hk:
  - 'A: H0: μ = 0 對 H1: μ ≠ 0；Z_calc = (-1.80 - 0) / 1.50 = -1.20'
  - 'B: H0: μ = -1.80 對 H1: μ = 0；Z_calc = -1.80 / 36 = -0.05'
  - 'C: H0: μ > 0 對 H1: μ < 0；Z_calc = 1.50 / -1.80 = -0.83'
  - 'D: H0: μ ≠ 0 對 H1: μ = 0；Z_calc = (-1.80 × 1.50) = -2.70'
  answer: A
  explanation_en: 'The null sits on the benchmark, H0: mu = 0, and a two-sided alternative is H1: mu != 0. Standardize the
    gap: Z = (-1.80 - 0) / 1.50 = -1.20. A full decision also needs a significance level or a p-value.'
  explanation_zh: '原假设放在基准上：H0: mu = 0；双侧备择假设是 H1: mu != 0。把差距标准化：Z = (-1.80 - 0) / 1.50 = -1.20。要做最终决策，还需要显著性水平或 p 值。'
  explanation_zh_hk: '原假設放喺基準上：H0: mu = 0；雙側備擇假設係 H1: mu != 0。將差距標準化：Z = (-1.80 - 0) / 1.50 = -1.20。要做最終決定，仲需要顯著性水平或者 p 值。'
beats:
- id: hook
  visual: title_card
  seconds: 42
  kicker_en: The cash-drawer question
  kicker_zh: 收银差额的判断
  kicker_zh_hk: 收銀差額嘅判斷
  title_en: What is a hypothesis test?
  title_zh: 什么是假设检验？
  title_zh_hk: 乜嘢係假設檢驗？
  en: >-
    Suppose Shop A checks the cash drawer on 36 shifts, and on average the drawer comes up HK$1.80 short per shift. If the
    manager calls that a real process problem when it is just everyday noise, the team wastes time fixing nothing. If she
    shrugs it off when it is real, money keeps leaking. So how big does a gap have to be before we act? The tool that
    answers this is a hypothesis test.
  zh: >-
    假设A店抽查了 36 个班次的收银钱箱，平均每个班次短款 HK$1.80。如果店长把日常的小波动当成流程出了问题，团队就白忙一场；如果问题是真的，她却不当回事，钱就会一直漏掉。那差距要多大，才值得出手？回答这个问题的工具，就叫假设检验。
  zh_hk: >-
    假設A店抽查咗 36 個班次嘅收銀錢箱，平均每個班次短款 HK$1.80。如果店長將日常嘅細波動當成流程出咗問題，團隊就白做一場；如果問題係真嘅，佢又唔當一回事，錢就會一直漏走。咁差距要幾大，先值得出手？答呢條問題嘅工具，就叫假設檢驗。
- id: define
  visual: definition_card
  seconds: 46
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Benchmark vs competing claim
  title_zh: 基准与竞争主张
  title_zh_hk: 基準同競爭主張
  formula: 'H0: μ = μ0 vs H1: μ ≠ μ0'
  formula_zh: 'H0: μ = μ0 对 H1: μ ≠ μ0'
  formula_zh_hk: 'H0: μ = μ0 對 H1: μ ≠ μ0'
  formula_tex: 'H_0:\ \mu = \mu_0 \qquad H_1:\ \mu \ne \mu_0'
  s1_en: >-
    Start with the benchmark. Mu is the true average cash gap per shift; mu-zero is what a clean process should give, here
    zero. The null hypothesis, H0, says mu equals that benchmark. It is a reference point, not a promise of perfect shifts.
  s1_zh: >-
    先定基准。mu 是每个班次真正的平均现金差额，mu 零是流程正常时应有的数值，这里就是零。原假设（H0）说的是：mu 就等于这个基准。它是流程的参照点，不是说每个班次都分毫不差。
  s1_zh_hk: >-
    先定基準。mu 係每個班次真正嘅平均現金差額，mu 零係流程正常嗰陣應該有嘅數，呢度就係零。原假設（H0）講嘅係：mu 就等於呢個基準。佢係流程嘅參照點，唔係話每個班次都分毫不差。
  s2_en: >-
    The alternative hypothesis, H1, is the competing claim: mu is not equal to zero. Not equal means a drawer that runs
    short or runs over both count. Pick the benchmark and this direction before you look at the result, not after.
  s2_zh: >-
    备择假设（H1）是对立的主张：mu 不等于零。不等于的意思是，长期短款或者长期多出来，都算数。基准和这个方向，要在看结果之前就定好，不能看完再改。
  s2_zh_hk: >-
    備擇假設（H1）係對立嘅主張：mu 唔等於零。唔等於即係話，長期短款或者長期多出嚟，都計數。基準同呢個方向，要喺睇結果之前就定好，唔可以睇完先改。
- id: name_h0h1
  visual: title_card
  seconds: 16
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Null and alternative
  title_zh: 原假设与备择假设
  title_zh_hk: 原假設同備擇假設
  en: >-
    Say the two names once more. The null hypothesis is the benchmark we hold until the data push hard against it. The
    alternative hypothesis is the claim the data would have to support.
  zh: >-
    再念一次这两个名字。原假设，是我们先守住的基准，直到数据强烈反对它；备择假设，是数据要撑得起才能成立的主张。
  zh_hk: >-
    再唸一次呢兩個名。原假設，係我哋先守住嘅基準，直到數據強烈反對佢；備擇假設，係數據要撐得起先成立嘅主張。
- id: mechanics
  visual: two_column
  seconds: 50
  kicker_en: The burden of proof
  kicker_zh: 举证责任
  kicker_zh_hk: 舉證責任
  title_en: Fail to reject is not proof
  title_zh: 不拒绝不等于证明
  title_zh_hk: 唔拒絕唔等於證明
  left_en: 'Reject: data clash with it'
  left_zh: 拒绝：数据与基准冲突
  left_zh_hk: 拒絕：數據同基準衝突
  right_en: 'Fail to reject: not enough'
  right_zh: 不拒绝：证据不足
  right_zh_hk: 唔拒絕：證據不足
  s1_en: >-
    Think of a courtroom. The null is presumed innocent, and the data carry the burden of proof. A test ends in one of two
    ways. Reject the null means the data clash with the benchmark strongly enough under the rule we chose.
  s1_zh: >-
    想像一个法庭。原假设先被当作无罪，举证责任在数据身上。检验只有两种结局。拒绝原假设，表示按照我们事先定的规则，数据和基准冲突得够厉害。
  s1_zh_hk: >-
    想像一個法庭。原假設先被當作無罪，舉證責任喺數據身上。檢驗只有兩種結局。拒絕原假設，即係按照我哋事先定嘅規則，數據同基準衝突得夠厲害。
  s2_en: >-
    Fail to reject means the case was not made. Not guilty is not the same as proven innocent. A weak result can come from
    a small effect, a noisy process, or too few shifts, so it never proves the null is true.
  s2_zh: >-
    不拒绝原假设，表示案子没有立起来。判无罪，不等于证明清白。结果弱，可能是效应小、流程噪声大，或者班次太少，所以它从来不能证明原假设为真。
  s2_zh_hk: >-
    唔拒絕原假設，即係案件未立得住。判無罪，唔等於證明清白。結果弱，可能係效應細、流程雜音大，或者班次太少，所以佢永遠唔可以證明原假設為真。
  s3_en: >-
    And even a rejection does not name a cause or a person. This test is about the drawer process across shifts. It is
    not a verdict on any one cashier.
  s3_zh: >-
    就算拒绝了，也说明不了原因，更点不出是谁。这个检验看的是各个班次的收银流程，不是对哪一位收银员的判决。
  s3_zh_hk: >-
    就算拒絕咗，都講唔到原因，更加點唔出係邊個。呢個檢驗睇嘅係各個班次嘅收銀流程，唔係對邊一位收銀員嘅判決。
- id: ledger
  visual: steps
  layout: rows
  seconds: 90
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: is HK$1.80 a real gap?'
  title_zh: A店：1.80 元是真差距吗？
  title_zh_hk: A店：1.80 蚊係真差距咩？
  step1_en: 'H0: μ = 0 vs H1: μ ≠ 0'
  step1_zh: 'H0: μ = 0 对 H1: μ ≠ 0'
  step1_zh_hk: 'H0: μ = 0 對 H1: μ ≠ 0'
  step2_en: 'SE = 9 / √36 = HK$1.50'
  step2_zh: '标准误 = 9 / √36 = HK$1.50'
  step2_zh_hk: '標準誤 = 9 / √36 = HK$1.50'
  step3_en: 'Z = (−1.80 − 0) / 1.50 = −1.20'
  step3_zh: 'Z = (−1.80 − 0) / 1.50 = −1.20'
  step3_zh_hk: 'Z = (−1.80 − 0) / 1.50 = −1.20'
  step4_en: 'Two-sided p ≈ 0.230'
  step4_zh: '双侧 p ≈ 0.230'
  step4_zh_hk: '雙側 p ≈ 0.230'
  step5_en: 'Fail to reject H0 at α = 0.05'
  step5_zh: 'α = 0.05：不拒绝原假设'
  step5_zh_hk: 'α = 0.05：唔拒絕原假設'
  s1_en: >-
    These are made-up teaching numbers. Write the hypotheses first: the true average gap mu is zero, against mu is not
    zero.
  s1_zh: >-
    下面是教学用的假设数字。先写假设：真正的平均差额 mu 等于零，对上 mu 不等于零。
  s1_zh_hk: >-
    以下係教學用嘅假設數字。先寫假設：真正嘅平均差額 mu 等於零，對上 mu 唔等於零。
  s2_en: >-
    Suppose the shift-to-shift spread, sigma, is known to be HK$9. The standard error, how much an average of 36 shifts
    usually wobbles, is 9 divided by the square root of 36, which is 6. That gives HK$1.50.
  s2_zh: >-
    假设班次之间的波动，也就是标准差 sigma，已知是 HK$9。标准误（SE），就是 36 个班次的平均数通常会晃多少：9 除以根号 36，根号 36 是 6，得到 HK$1.50。
  s2_zh_hk: >-
    假設班次之間嘅波動，即係標準差 sigma，已知係 HK$9。標準誤（SE），即係 36 個班次嘅平均數通常會晃幾多：9 除以根號 36，根號 36 係 6，得到 HK$1.50。
  s3_en: >-
    Now measure the gap in those wobble units. The sample mean, minus 1.80, minus the benchmark zero, divided by 1.50,
    gives Z equals minus 1.20. The sample sits 1.2 standard errors below the benchmark.
  s3_zh: >-
    再用这个“晃动单位”去量差距。样本均值（x-bar）负 1.80，减去基准零，再除以 1.50，得到检验统计量 Z 等于负 1.20。也就是说，样本落在基准下方 1.2 个标准误。
  s3_zh_hk: >-
    再用呢個「晃動單位」去量差距。樣本均值（x-bar）負 1.80，減去基準零，再除以 1.50，得到檢驗統計量 Z 等於負 1.20。即係話，樣本落喺基準下面 1.2 個標準誤。
  s4_en: >-
    How surprising is that if the null is true? The p-value is the chance of a gap at least this far out, on either side,
    when mu really is zero. For Z of 1.2 either way, the Normal table gives about 0.230.
  s4_zh: >-
    如果原假设成立，这有多意外？p 值（p-value），就是在 mu 真的等于零时，两边任何一边出现至少这么远差距的机会。Z 在正负 1.2 以外，查正态表大约是 0.230。
  s4_zh_hk: >-
    如果原假設成立，呢個有幾意外？p 值（p-value），即係喺 mu 真係等於零嗰陣，兩邊任何一邊出現至少咁遠差距嘅機會。Z 喺正負 1.2 以外，查正態表大約係 0.230。
  s5_en: >-
    Our cut-off, the significance level alpha, was set at 0.05 before we looked. A p-value of 0.230 is above 0.05, so we
    fail to reject the null. Gaps like this turn up about one time in four from noise alone.
  s5_zh: >-
    我们事先把门槛，也就是显著性水平 alpha，定在 0.05。p 值 0.230 高于 0.05，所以不拒绝原假设。这么大的差距，光靠随机波动，大约每四次就会出现一次。
  s5_zh_hk: >-
    我哋事先將門檻，即係顯著性水平 alpha，定喺 0.05。p 值 0.230 高過 0.05，所以唔拒絕原假設。咁大嘅差距，淨係靠隨機波動，大約每四次就會出現一次。
- id: takeaway
  visual: takeaway
  seconds: 50
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Frame first, conclude narrowly
  title_zh: 先设假设，再谨慎下结论
  title_zh_hk: 先設假設，再審慎落結論
  q1_en: Why is fail to reject not proof of H0?
  q1_zh: 为什么不拒绝不等于证明 H0？
  q1_zh_hk: 點解唔拒絕唔等於證明 H0？
  q2_en: What must be fixed before testing?
  q2_zh: 检验前必须先定好什么？
  q2_zh_hk: 檢驗前必須先定好乜嘢？
  s1_en: >-
    Fix the plan before you look: what mu measures, the benchmark, the direction of the alternative, how the shifts were
    sampled, and the cut-off alpha. Moving any of them after seeing the data quietly breaks the test.
  s1_zh: >-
    看数据之前先把计划定好：mu 量的是什么、基准是多少、备择假设朝哪个方向、班次怎么抽、门槛 alpha 定多少。看完数据再改任何一项，这个检验就悄悄失效了。
  s1_zh_hk: >-
    睇數據之前先將計劃定好：mu 量緊乜、基準係幾多、備擇假設向邊個方向、班次點樣抽、門檻 alpha 定幾多。睇完數據先改任何一樣，呢個檢驗就靜靜雞失效。
  s2_en: >-
    Then report reject or fail to reject, never accept. Put the estimate, the standard error, Z and the p-value beside the
    decision, and state the assumptions, such as independent shifts and a known sigma.
  s2_zh: >-
    然后只报告“拒绝”或“不拒绝”，永远不说“接受”。决策旁边要写上估计值、标准误、Z 和 p 值，也要讲清楚前提，比如班次彼此独立、sigma 已知。
  s2_zh_hk: >-
    跟住只報告「拒絕」或者「唔拒絕」，永遠唔講「接受」。決定旁邊要寫埋估計值、標準誤、Z 同 p 值，亦要講清楚前提，例如班次之間獨立、sigma 已知。
  s3_en: >-
    So, is Shop A's HK$1.80 shortfall bigger than everyday noise? With Z of minus 1.20 and p about 0.230, not shown. We fail
    to reject a zero average gap: a statement about the process, not proof of a perfect drawer or a verdict on a cashier.
  s3_zh: >-
    所以，A店每班次短款 HK$1.80，是不是超出了日常波动？Z 等于负 1.20，p 大约 0.230，证据不够。我们不拒绝平均差额为零。这是对流程的判断，不证明钱箱完全没问题，也不是对哪位收银员的评价。
  s3_zh_hk: >-
    所以，A店每班次短款 HK$1.80，係咪超出咗日常波動？Z 等於負 1.20，p 大約 0.230，證據唔夠。我哋唔拒絕平均差額係零。呢個係對流程嘅判斷，唔證明錢箱完全冇問題，亦唔係對邊位收銀員嘅評價。
