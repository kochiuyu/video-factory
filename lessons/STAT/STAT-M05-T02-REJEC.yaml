quiz:
- id: Q1
  type: multiple_choice
  question_en: Why should alpha and the critical values be fixed before looking at the test result?
  question_zh: 为什么显著性水平 alpha 和临界值，要在看检验结果之前就定好？
  question_zh_hk: 點解顯著性水平 alpha 同臨界值，要喺睇檢驗結果之前就定好？
  options_en:
  - 'A: So the stated error rate holds; moving the line after seeing data lets the result pick the rule.'
  - 'B: Because the critical value 1.96 changes once the sample has been collected.'
  - 'C: Because fixing alpha first means the test can never make a Type I error.'
  - 'D: Because a smaller alpha picked after the data always gives a more accurate conclusion.'
  options_zh:
  - 'A: 这样声称的错误率才成立；看完数据再挪界线，等于让结果来挑规则。'
  - 'B: 因为样本一收集完，临界值 1.96 就会跟着改变。'
  - 'C: 因为先定好 alpha，检验就永远不会犯第一类错误。'
  - 'D: 因为看完数据再选更小的 alpha，结论一定更准确。'
  options_zh_hk:
  - 'A: 咁樣聲稱嘅錯誤率先成立；睇完數據先郁條界線，等於由結果揀規則。'
  - 'B: 因為樣本一收集完，臨界值 1.96 就會跟住改變。'
  - 'C: 因為先定好 alpha，檢驗就永遠唔會犯第一類錯誤。'
  - 'D: 因為睇完數據先揀細啲嘅 alpha，結論一定更準確。'
  answer: A
  explanation_en: Alpha is the long-run chance of rejecting a true H0, but only if the rule is set before the data are seen.
    Fixing it first does not remove Type I errors; it keeps their rate at the level you stated.
  explanation_zh: alpha 是原假设为真却被拒绝的长期机会，前提是规则在看数据之前就定好。先定好并不能消除第一类错误，只是让它的发生率保持在你说的水平。
  explanation_zh_hk: alpha 係原假設為真但被拒絕嘅長期機會，前提係規則喺睇數據之前就定好。先定好唔可以消除第一類錯誤，只係令佢嘅發生率維持喺你講嘅水平。
- id: Q2
  type: multiple_choice
  question_en: 'Shop A tests H0: μ = 350 ml vs H1: μ ≠ 350 ml, with known σ = 12 ml, n = 36, α = 0.05 and critical value
    1.96. Which sample means fall in the rejection regions?'
  question_zh: 'A店检验 H0: μ = 350 ml 对 H1: μ ≠ 350 ml，已知 σ = 12 ml，n = 36，α = 0.05，临界值 1.96。样本均值落在哪里会进入拒绝域？'
  question_zh_hk: 'A店檢驗 H0: μ = 350 ml 對 H1: μ ≠ 350 ml，已知 σ = 12 ml，n = 36，α = 0.05，臨界值 1.96。樣本均值落喺邊度會入拒絕域？'
  options_en:
  - 'A: At or below 346.08 ml, or at or above 353.92 ml'
  - 'B: At or below 349.35 ml, or at or above 350.65 ml'
  - 'C: Below 338.00 ml, or above 362.00 ml'
  - 'D: Between 346.08 ml and 353.92 ml'
  options_zh:
  - 'A: 小于等于 346.08 ml，或大于等于 353.92 ml'
  - 'B: 小于等于 349.35 ml，或大于等于 350.65 ml'
  - 'C: 小于 338.00 ml，或大于 362.00 ml'
  - 'D: 在 346.08 ml 到 353.92 ml 之间'
  options_zh_hk:
  - 'A: 細過或等於 346.08 ml，或者大過或等於 353.92 ml'
  - 'B: 細過或等於 349.35 ml，或者大過或等於 350.65 ml'
  - 'C: 細過 338.00 ml，或者大過 362.00 ml'
  - 'D: 喺 346.08 ml 至 353.92 ml 之間'
  answer: A
  explanation_en: 'SE = 12 / √36 = 2 ml, so the cutoffs are 350 ± 1.96 × 2 = 346.08 and 353.92 ml. B forgets the square
    root (12 / 36), C uses σ instead of the standard error, and D is the nonrejection region.'
  explanation_zh: '标准误 = 12 / √36 = 2 ml，所以临界点是 350 ± 1.96 × 2，即 346.08 和 353.92 ml。B 忘了开根号（12 / 36），C 把 σ 当成标准误，D 是不拒绝域。'
  explanation_zh_hk: '標準誤 = 12 / √36 = 2 ml，所以臨界點係 350 ± 1.96 × 2，即係 346.08 同 353.92 ml。B 漏咗開方（12 / 36），C 將 σ 當咗標準誤，D 係唔拒絕域。'
beats:
- id: hook
  visual: title_card
  seconds: 36
  kicker_en: The cold-brew question
  kicker_zh: 冷萃注杯的判断
  kicker_zh_hk: 冷萃注杯嘅判斷
  title_en: What is a rejection region?
  title_zh: 什么是拒绝域？
  title_zh_hk: 乜嘢係拒絕域？
  en: >-
    Suppose Shop A runs a cold-brew machine that should pour 350 millilitres on average. A check of 36 pours averages
    345.4. Stop the machine when it is fine, and you lose a morning of sales for nothing. Keep it running when it really
    under-pours, and every customer gets short-changed. So where exactly do we draw the line? That line is called a
    rejection region.
  zh: >-
    假设A店有一台冷萃机，平均每杯应该出 350 毫升。抽查 36 杯，平均只有 345.4 毫升。机器明明没问题却停掉，一个上午的生意就白白丢了；机器真的少出却照样开着，每位客人都吃亏。那条线到底该画在哪里？这条线圈出来的范围，就叫拒绝域。
  zh_hk: >-
    假設A店有部冷萃機，平均每杯應該出 350 毫升。抽查 36 杯，平均得 345.4 毫升。部機明明冇事你又停咗佢，成個朝早嘅生意就白白冇咗；部機真係出少咗你又照開，每位客都蝕底。咁條線究竟應該劃喺邊？呢條線圈出嚟嘅範圍，就叫拒絕域。
- id: define
  visual: definition_card
  seconds: 54
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Cutoffs split the Z line
  title_zh: 临界值切开 Z 轴
  title_zh_hk: 臨界值切開 Z 軸
  formula: 'Reject H0 when |Z| ≥ the critical value'
  formula_zh: '|Z| ≥ 临界值时拒绝 H0'
  formula_zh_hk: '|Z| ≥ 臨界值嗰陣拒絕 H0'
  formula_tex: 'Z = \frac{\bar{X} - \mu_0}{\sigma/\sqrt{n}} \qquad \text{reject } H_0 \text{ if } |Z| \geq z_{\alpha/2}'
  s1_en: >-
    First, put the gap on a common ruler. Z is the sample mean minus the benchmark mu-zero, divided by the standard
    error, how much an average of 36 pours usually wobbles. If the null hypothesis, H0, is true, Z sits near zero most of
    the time.
  s1_zh: >-
    先把差距放到同一把尺上。Z 就是样本均值（x-bar）减去基准 mu 零，再除以标准误（SE），也就是 36 杯的平均数通常会晃多少。如果原假设（H0）成立，Z 大多数时候都在零附近。
  s1_zh_hk: >-
    先將差距放上同一把尺。Z 就係樣本均值（x-bar）減基準 mu 零，再除以標準誤（SE），即係 36 杯嘅平均數通常會晃幾多。如果原假設（H0）成立，Z 大部分時間都喺零附近。
  s2_en: >-
    Now pick the cut-off, the significance level alpha. It is the chance we accept of rejecting a true null, a Type I
    error. Critical values leave exactly alpha in the far tails, and past them is the rejection region.
  s2_zh: >-
    再定门槛，也就是显著性水平 alpha。它是我们愿意承担的、把真的原假设错误拒绝的机会，这种错叫第一类错误。临界值，就是在最远两端刚好留下 alpha 的那几个 Z 点，越过它们就是拒绝域。
  s2_zh_hk: >-
    跟住定門檻，即係顯著性水平 alpha。佢係我哋願意承擔、將真嘅原假設錯誤拒絕嘅機會，呢種錯叫第一類錯誤。臨界值，就係喺最遠兩頭啱啱留低 alpha 嘅嗰幾個 Z 點，過咗佢哋就係拒絕域。
- id: name_region
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Rejection region, critical value
  title_zh: 拒绝域与临界值
  title_zh_hk: 拒絕域同臨界值
  en: >-
    Say the two names once more. A critical value is the cut-off point on the Z line. The rejection region is everything
    at or beyond it, where we reject the null.
  zh: >-
    再念一次这两个名字。临界值，是 Z 轴上的分界点；拒绝域，是分界点上和分界点以外的整片范围，Z 落进去，我们就拒绝原假设。
  zh_hk: >-
    再唸一次呢兩個名。臨界值，係 Z 軸上面嘅分界點；拒絕域，係分界點上面同埋分界點以外嘅成片範圍，Z 跌入去，我哋就拒絕原假設。
- id: mechanics
  visual: two_column
  seconds: 68
  kicker_en: The rule
  kicker_zh: 规则
  kicker_zh_hk: 規則
  title_en: Set the line before you look
  title_zh: 先画线，再看结果
  title_zh_hk: 先劃線，再睇結果
  left_en: 'Do not reject: Z inside'
  left_zh: 不拒绝：Z 在两个临界值之间
  left_zh_hk: 唔拒絕：Z 喺兩個臨界值之間
  right_en: 'Reject: Z past a cutoff'
  right_zh: 拒绝：Z 到达或越过临界值
  right_zh_hk: 拒絕：Z 到達或越過臨界值
  s1_en: >-
    So where are the critical values for us? Short-pouring and over-pouring both matter, so the test is two-sided and
    alpha of 0.05 is split in half, 0.025 in each tail. The Normal table puts those cutoffs at about minus 1.96 and plus
    1.96.
  s1_zh: >-
    那我们的临界值在哪里？少出和多出都要管，所以是双侧检验，alpha 0.05 要平分到两边，每边 0.025。查正态表，这两个临界值大约是负 1.96 和正 1.96。
  s1_zh_hk: >-
    咁我哋嘅臨界值喺邊？出少同出多都要理，所以係雙側檢驗，alpha 0.05 要平分落兩邊，每邊 0.025。查正態表，呢兩個臨界值大約係負 1.96 同正 1.96。
  s2_en: >-
    Z between them, we do not reject the null. Z landing on or past either one, we reject. Fix this line before you see
    the data, like goalposts set before kick-off. Move it afterwards and the 5 percent error rate no longer holds.
  s2_zh: >-
    Z 落在两者之间，就不拒绝原假设；Z 碰到或越过任何一边，就拒绝。这条线要在看数据之前定好，就像开球前先摆好龙门。看完再挪，等于让结果来挑规则，5% 的错误率也就不成立了。
  s2_zh_hk: >-
    Z 落喺兩個之間，就唔拒絕原假設；Z 掂到或者越過任何一邊，就拒絕。呢條線要喺睇數據之前定好，好似開波前先擺好龍門。睇完先郁，等於由結果揀規則，5% 嘅錯誤率都唔再成立。
  s3_en: >-
    And a rejection is a statement about the average pour, not a repair order. It says the mean looks different from 350
    under our assumptions. Stopping the machine also depends on measuring accuracy, gap size, and cost.
  s3_zh: >-
    还有，拒绝只是对平均出杯量的判断，不是维修单。它说的是，在我们的假设下，平均数看起来不是 350。要不要停机，还要看量得准不准、差距有多大、停一次要付出多少成本。
  s3_zh_hk: >-
    仲有，拒絕只係對平均出杯量嘅判斷，唔係維修單。佢講嘅係，喺我哋嘅假設之下，平均數睇落唔係 350。使唔使停機，仲要睇量得準唔準、差距有幾大、停一次要付幾多成本。
- id: ledger
  visual: steps
  layout: rows
  seconds: 112
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: is 345.4 ml past it?'
  title_zh: A店：345.4 毫升过线了吗？
  title_zh_hk: A店：345.4 毫升過咗線未？
  step1_en: 'H0: μ = 350 vs H1: μ ≠ 350'
  step1_zh: 'H0: μ = 350 对 H1: μ ≠ 350'
  step1_zh_hk: 'H0: μ = 350 對 H1: μ ≠ 350'
  step2_en: 'SE = 12 / √36 = 2 ml'
  step2_zh: '标准误 = 12 / √36 = 2 ml'
  step2_zh_hk: '標準誤 = 12 / √36 = 2 ml'
  step3_en: '1.96 × 2 = 3.92 ml'
  step3_zh: '1.96 × 2 = 3.92 ml'
  step3_zh_hk: '1.96 × 2 = 3.92 ml'
  step4_en: 'Cutoffs: 346.08 and 353.92'
  step4_zh: '临界点：346.08 和 353.92'
  step4_zh_hk: '臨界點：346.08 同 353.92'
  step5_en: 'Z = (345.4 − 350) / 2 = −2.30'
  step5_zh: 'Z = (345.4 − 350) / 2 = −2.30'
  step5_zh_hk: 'Z = (345.4 − 350) / 2 = −2.30'
  s1_en: >-
    These are made-up teaching numbers. Write the plan first: the true average pour mu is 350, against mu is not 350,
    with alpha at 0.05, so the cutoffs are plus and minus 1.96.
  s1_zh: >-
    下面是教学用的假设数字。先写计划：真正的平均出杯量 mu 等于 350，对上 mu 不等于 350，alpha 定在 0.05，所以临界值是正负 1.96。
  s1_zh_hk: >-
    以下係教學用嘅假設數字。先寫計劃：真正嘅平均出杯量 mu 等於 350，對上 mu 唔等於 350，alpha 定喺 0.05，所以臨界值係正負 1.96。
  s2_en: >-
    Suppose the pour-to-pour spread, sigma, is known to be 12 millilitres. The standard error is 12 divided by the square
    root of 36. The square root of 36 is 6, so that is 2 millilitres.
  s2_zh: >-
    假设每杯之间的波动，也就是标准差 sigma，已知是 12 毫升。标准误就是 12 除以根号 36。根号 36 是 6，所以是 2 毫升。
  s2_zh_hk: >-
    假設每杯之間嘅波動，即係標準差 sigma，已知係 12 毫升。標準誤就係 12 除以根號 36。根號 36 係 6，所以係 2 毫升。
  s3_en: >-
    Now turn the Z cutoff into millilitres. 1.96 standard errors is 1.96 times 2, which is 3.92 millilitres. That is how
    far the average may drift either way before we call it unusual.
  s3_zh: >-
    接着把 Z 的临界值换成毫升。1.96 个标准误，就是 1.96 乘 2，等于 3.92 毫升。平均数往任何一边偏离超过这么多，才算异常。
  s3_zh_hk: >-
    跟住將 Z 嘅臨界值換成毫升。1.96 個標準誤，即係 1.96 乘 2，等於 3.92 毫升。平均數向任何一邊偏離超過咁多，先算異常。
  s4_en: >-
    So in millilitres, the two lines are 350 minus 3.92, which is 346.08, and 350 plus 3.92, which is 353.92 millilitres. Any
    sample mean at or outside those lines lands in the rejection region.
  s4_zh: >-
    所以换成毫升，两条线就是 350 减 3.92，等于 346.08；还有 350 加 3.92，等于 353.92 毫升。样本均值碰到或落在这两条线以外，就进了拒绝域。
  s4_zh_hk: >-
    所以換成毫升，兩條線就係 350 減 3.92，等於 346.08；同埋 350 加 3.92，等於 353.92 毫升。樣本均值掂到或者落喺呢兩條線以外，就入咗拒絕域。
  s5_en: >-
    Our sample mean is 345.4, below 346.08. In Z terms, 345.4 minus 350 is minus 4.6, divided by 2 gives minus 2.30, past
    minus 1.96. Both views agree: it is in the lower rejection region, so we reject the null at the 5 percent level.
  s5_zh: >-
    我们的样本均值是 345.4，低于 346.08。换成 Z 来看，345.4 减 350 等于负 4.6，除以 2 得负 2.30，越过了负 1.96。两种看法结论一样：落在左边的拒绝域，所以在 5% 水平拒绝原假设。
  s5_zh_hk: >-
    我哋嘅樣本均值係 345.4，低過 346.08。換成 Z 嚟睇，345.4 減 350 等於負 4.6，除以 2 得負 2.30，越過咗負 1.96。兩種睇法結論一樣：落喺左邊嘅拒絕域，所以喺 5% 水平拒絕原假設。
- id: takeaway
  visual: takeaway
  seconds: 68
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Fix the line, read it narrowly
  title_zh: 先画线，再谨慎解读
  title_zh_hk: 先劃線，再審慎解讀
  q1_en: What does alpha control?
  q1_zh: alpha 控制的是什么？
  q1_zh_hk: alpha 控制嘅係乜嘢？
  q2_en: Why is rejecting not proof of a fault?
  q2_zh: 为什么拒绝不等于证明故障？
  q2_zh_hk: 點解拒絕唔等於證明故障？
  s1_en: >-
    Alpha controls the long-run rate of rejecting a true null, if the rule is fixed in advance. It is not the chance that
    this particular rejection is wrong. A smaller alpha makes false alarms rarer but makes a real drift easier to miss.
  s1_zh: >-
    alpha 控制的是，在规则事先定好的前提下，长期来看把真的原假设拒绝掉的比率。它不是这一次拒绝出错的机会。alpha 越小，误报越少，但真的偏了也更容易漏掉。
  s1_zh_hk: >-
    alpha 控制嘅係，喺規則事先定好嘅前提之下，長遠嚟講將真嘅原假設拒絕咗嘅比率。佢唔係今次拒絕出錯嘅機會。alpha 越細，誤報越少，但真係偏咗都更容易漏咗。
  s2_en: >-
    Then report the whole rule: the hypotheses, alpha, the critical values, the standard error, Z and the decision. State
    the assumptions too, such as independent pours and a known sigma.
  s2_zh: >-
    然后把整套规则都报告出来：假设、alpha、临界值、标准误、Z 和决策。前提也要讲清楚，比如每杯彼此独立、sigma 已知。
  s2_zh_hk: >-
    跟住將成套規則報告出嚟：假設、alpha、臨界值、標準誤、Z 同決定。前提都要講清楚，例如每杯之間獨立、sigma 已知。
  s3_en: >-
    So where is Shop A's line? With alpha at 0.05, the cutoffs are 346.08 and 353.92 millilitres, and 345.4 falls below.
    We reject an average pour of 350. That is evidence about the average, not proof of a fault; the stop decision still
    needs the costs.
  s3_zh: >-
    所以，A店的线画在哪里？alpha 定在 0.05，临界点是 346.08 和 353.92 毫升，345.4 落在下面。我们拒绝平均出杯量是 350。这是关于平均数的证据，不证明机器坏了；要不要停机，还要算成本。
  s3_zh_hk: >-
    所以，A店條線劃喺邊？alpha 定喺 0.05，臨界點係 346.08 同 353.92 毫升，345.4 跌咗喺下面。我哋拒絕平均出杯量係 350。呢個係關於平均數嘅證據，唔證明部機壞咗；使唔使停機，仲要計埋成本。
