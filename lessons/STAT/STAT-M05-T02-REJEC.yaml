title_en: Rejection Regions and Critical Values
title_zh: 拒绝域与临界值：设定决策边界
title_zh_hk: 拒絕域同臨界值：設定決策邊界
objective_en: Define the significance level as the long-run Type I error rate under the null, use critical values to divide
  a test-statistic distribution into rejection and nonrejection regions, calculate two-sided standard-normal cutoffs, and
  translate those cutoffs into sample-mean boundaries for an assumed dispenser fill test.
objective_zh: 把显著性水平定义为原假设成立时的长期第一类错误率，利用临界值把检验统计量分布划分为拒绝域与不拒绝域，计算双侧标准正态临界点，并把临界点转化为假设的注杯量检验中的样本均值边界。
objective_zh_hk: 將顯著性水平定義為原假設成立嗰陣嘅長期第一類錯誤率，利用臨界值將檢驗統計量分佈劃分成拒絕域同唔拒絕域，計算雙側標準正態臨界點，並將臨界點轉化成假設嘅注杯量檢驗入面嘅樣本均值邊界。
youtube:
  description_en: |
    Rejection Regions and Critical Values

    Suppose Shop A runs a cold-brew machine that should pour 350 millilitres on average. A check of 36 pours averages 345.4. Stop a fine machine, and you lose a morning of sales. Keep a real under-pour running, and every customer gets short-changed. Where do we draw the line? That line is a rejection region.

    A critical value is the cut-off on the Z line. The rejection region is everything at or beyond it. For a two-sided 5 percent test the critical values are ±1.96. Set the line before you look at the sample, not after.

    In an assumed example, sigma is 12 ml, so SE = 12 / √36 = 2 ml. The mean cutoffs are 350 ± 1.96 × 2, which is 346.08 and 353.92. The sample mean 345.4 gives Z = (345.4 − 350) / 2 = −2.30, past −1.96, so we reject H0: mu = 350 at the 5 percent level.

    Rule: alpha is the long-run false-alarm rate of a pre-fixed rule, not the chance that this one rejection is wrong. Read the result as evidence about the average pour, not automatic proof of a fault.
  description_zh: |
    拒绝域与临界值：设定决策边界

    假设A店有一台冷萃机，平均每杯应该出 350 毫升。抽查 36 杯，平均只有 345.4 毫升。机器没问题却停掉，一个上午的生意就白白丢了；真的少出却照样开着，每位客人都吃亏。那条线该画在哪里？这条线圈出来的范围，就叫拒绝域（rejection region）。

    临界值（critical value）是 Z 轴上的分界点；拒绝域是分界点上和以外的整片范围。双侧 5% 检验的临界值是 ±1.96。这条线要在看样本之前就定好，不能看完再改。

    在一个假设的例子里，sigma 是 12 毫升，标准误 = 12 / √36 = 2 毫升。均值边界是 350 ± 1.96 × 2，也就是 346.08 和 353.92。样本均值 345.4 给出 Z = (345.4 − 350) / 2 = −2.30，越过 −1.96，所以在 5% 水平拒绝 H0: mu = 350。

    规则：alpha 控制的是事先定好规则时，长期把真的原假设拒绝掉的比率，不是这一次拒绝出错的机会。结果是关于平均注杯量的证据，不是故障的自动证明。
  description_zh_hk: |
    拒絕域同臨界值：設定決策邊界

    假設A店有部冷萃機，平均每杯應該出 350 毫升。抽查 36 杯，平均得 345.4 毫升。部機冇事你又停咗佢，成個朝早嘅生意就白白冇咗；真係出少咗又照開，每位客都蝕底。條線應該劃喺邊？呢條線圈出嚟嘅範圍，就叫拒絕域（rejection region）。

    臨界值（critical value）係 Z 軸上面嘅分界點；拒絕域係分界點上面同以外嘅成片範圍。雙側 5% 檢驗嘅臨界值係 ±1.96。呢條線要喺睇樣本之前就定好，唔可以睇完先改。

    喺一個假設嘅例子入面，sigma 係 12 毫升，標準誤 = 12 / √36 = 2 毫升。均值邊界係 350 ± 1.96 × 2，即係 346.08 同 353.92。樣本均值 345.4 畀出 Z = (345.4 − 350) / 2 = −2.30，越過 −1.96，所以喺 5% 水平拒絕 H0: mu = 350。

    規則：alpha 控制嘅係規則事先定好嗰陣，長遠將真嘅原假設拒絕咗嘅比率，唔係今次拒絕出錯嘅機會。結果係關於平均注杯量嘅證據，唔係故障嘅自動證明。
