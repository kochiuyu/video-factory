id: STAT-M05-T03-PVALU
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The p-Value: Quantifying Compatibility with the Null'
title_zh: p 值：量化数据与原假设的相容程度
title_zh_hk: p 值：量化數據同原假設嘅相容程度
objective_en: Define the p-value as a tail probability calculated under H0, distinguish it from the probability that H0 is
  true, calculate a two-sided p-value from a standard-normal statistic, and interpret the result as statistical evidence without
  converting it directly into a mechanical or operational diagnosis.
objective_zh: 把 p 值定义为在 H0 成立条件下计算的尾部概率，区分 p 值与“H0 为真的概率”，由标准正态统计量计算双侧 p 值，并把结果解释为统计证据，而不直接转化为机械或经营诊断。
objective_zh_hk: 將 p 值定義為喺 H0 成立條件之下計算嘅尾部概率，區分 p 值同「H0 為真嘅概率」，由標準正態統計量計算雙側 p 值，並將結果解讀成統計證據，而唔直接轉化成機械或者營運診斷。
