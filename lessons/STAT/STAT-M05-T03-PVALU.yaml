quiz:
- id: Q1
  type: multiple_choice
  question_en: Which statement correctly defines a two-sided p-value?
  question_zh: 下列哪一句正确说出了双侧 p 值的定义？
  question_zh_hk: 下列邊一句正確講出咗雙側 p 值嘅定義？
  options_en:
  - 'A: Under H0, the probability of a test statistic at least as extreme in absolute value as the one observed.'
  - 'B: The probability that the null hypothesis H0 is true, given the observed sample.'
  - 'C: The probability that the manager makes a wrong business decision if she rejects H0.'
  - 'D: One minus the significance level alpha that was chosen before looking at the data.'
  options_zh:
  - 'A: 在原假设 H0 成立时，检验统计量绝对值至少和观测值一样极端的概率。'
  - 'B: 在看到样本之后，原假设 H0 为真的概率。'
  - 'C: 如果店长拒绝 H0，她做出错误经营决策的概率。'
  - 'D: 一减去事先选定的显著性水平 alpha。'
  options_zh_hk:
  - 'A: 喺原假設 H0 成立嗰陣，檢驗統計量絕對值至少同觀測值一樣極端嘅概率。'
  - 'B: 喺睇到樣本之後，原假設 H0 為真嘅概率。'
  - 'C: 如果店長拒絕 H0，佢做咗錯誤營運決定嘅概率。'
  - 'D: 一減去事先選定嘅顯著性水平 alpha。'
  answer: A
  explanation_en: The p-value is calculated from the test-statistic distribution assuming H0. It is not P(H0 | data), not
    the chance of a wrong decision, and not 1 minus alpha.
  explanation_zh: p 值是在假定原假设成立时，由检验统计量分布算出来的。它不是 P(H0｜数据)，不是做错决定的机会，也不是 1 减 alpha。
  explanation_zh_hk: p 值係喺假定原假設成立嗰陣，由檢驗統計量分佈計出嚟嘅。佢唔係 P(H0｜數據)，唔係做錯決定嘅機會，亦唔係 1 減 alpha。
- id: Q2
  type: multiple_choice
  question_en: 'Shop A tests H0: μ = 93.0°C vs H1: μ ≠ 93.0°C, with known σ = 1.6°C, n = 64, and sample mean 93.49°C. What
    is the two-sided p-value and the decision at α = 0.05?'
  question_zh: 'A店检验 H0: μ = 93.0°C 对 H1: μ ≠ 93.0°C，已知 σ = 1.6°C，n = 64，样本均值 93.49°C。双侧 p 值是多少，α = 0.05 时如何决策？'
  question_zh_hk: 'A店檢驗 H0: μ = 93.0°C 對 H1: μ ≠ 93.0°C，已知 σ = 1.6°C，n = 64，樣本均值 93.49°C。雙側 p 值係幾多，α = 0.05 嗰陣點樣決策？'
  options_en:
  - 'A: Z = 2.45; two-sided p ≈ 0.0142; reject H0 because p < 0.05'
  - 'B: Two-sided p = 2.45 / 0.05 = 49.0; fail to reject H0'
  - 'C: p = 0.0500 because alpha was set to 5%'
  - 'D: Two-sided p = 1 − 0.0142 = 0.9858; fail to reject H0'
  options_zh:
  - 'A: Z = 2.45；双侧 p ≈ 0.0142；因 p < 0.05，拒绝原假设'
  - 'B: 双侧 p = 2.45 / 0.05 = 49.0；不拒绝原假设'
  - 'C: p = 0.0500，因为事先把 alpha 定成了 5%'
  - 'D: 双侧 p = 1 − 0.0142 = 0.9858；不拒绝原假设'
  options_zh_hk:
  - 'A: Z = 2.45；雙側 p ≈ 0.0142；因 p < 0.05，拒絕原假設'
  - 'B: 雙側 p = 2.45 / 0.05 = 49.0；唔拒絕原假設'
  - 'C: p = 0.0500，因為事先將 alpha 定成咗 5%'
  - 'D: 雙側 p = 1 − 0.0142 = 0.9858；唔拒絕原假設'
  answer: A
  explanation_en: 'SE = 1.6 / √64 = 0.20, so Z = (93.49 − 93.0) / 0.20 = 2.45. The two-sided p-value is about 2 × 0.0071 =
    0.0142, below 0.05, so reject H0. B divides Z by alpha, C confuses p with alpha, and D uses the non-tail area.'
  explanation_zh: '标准误 = 1.6 / √64 = 0.20，所以 Z = (93.49 − 93.0) / 0.20 = 2.45。双侧 p 值约为 2 × 0.0071 = 0.0142，低于 0.05，因此拒绝原假设。B 把 Z 除以了 alpha，C 把 p 和 alpha 混为一谈，D 用了非尾部面积。'
  explanation_zh_hk: '標準誤 = 1.6 / √64 = 0.20，所以 Z = (93.49 − 93.0) / 0.20 = 2.45。雙側 p 值約為 2 × 0.0071 = 0.0142，低過 0.05，因此拒絕原假設。B 將 Z 除咗以 alpha，C 將 p 同 alpha 撈亂，D 用咗非尾部面積。'
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The boiler-temperature question
  kicker_zh: 锅炉水温的判断
  kicker_zh_hk: 鍋爐水溫嘅判斷
  title_en: What is a p-value?
  title_zh: 什么是 p 值？
  title_zh_hk: 乜嘢係 p 值？
  en: >-
    Suppose Shop A checks an espresso boiler that should sit at 93.0 degrees Celsius on average. Sixty-four readings average
    93.49. Call that a real drift when it is only noise, and the team tears down a fine machine. Shrug it off when the mean
    really moved, and every shot runs off-spec. So how unusual is this gap if the target is still true? That tail chance
    is called a p-value.
  zh: >-
    假设A店检查一台意式咖啡机锅炉，平均水温应该在 93.0 摄氏度。抽了 64 个读数，平均是 93.49。如果只是噪声却当成真的漂移，团队会白拆一台好机器；如果均值真偏了却不当回事，每杯出品都会偏。那如果目标还成立，这个差距有多异常？这个尾部机会，就叫 p 值。
  zh_hk: >-
    假設A店檢查一部意式咖啡機鍋爐，平均水溫應該喺 93.0 攝氏度。抽咗 64 個讀數，平均係 93.49。如果淨係雜音你又當成真係漂移，團隊會白拆一部好機；如果均值真係偏咗你又唔理，每杯出品都會偏。咁如果目標仍然成立，呢個差距有幾異常？呢個尾部機會，就叫 p 值。
- id: define
  visual: definition_card
  seconds: 52
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: A tail chance under H0
  title_zh: 原假设下的尾部机会
  title_zh_hk: 原假設下嘅尾部機會
  formula: 'Two-sided p = P(|Z| ≥ |Zobs| | H0)'
  formula_zh: '双侧 p = P(|Z| ≥ |Z观测|｜原假设成立)'
  formula_zh_hk: '雙側 p = P(|Z| ≥ |Z觀測|｜原假設成立)'
  formula_tex: 'p = P\left(|Z|\geq |z_{\mathrm{obs}}| \mid H_0\right)'
  s1_en: >-
    A p-value is the chance, under the null hypothesis H0, of a test statistic at least as extreme as the one we saw, in
    the direction the alternative picked. So it follows the test statistic and whether the test is one-sided or two-sided.
  s1_zh: >-
    p 值（p-value），是在原假设（H0）成立时算出来的机会：检验统计量至少和我们看到的一样极端，方向由备择假设指定。所以它跟着检验统计量走，也取决于单侧还是双侧。
  s1_zh_hk: >-
    p 值（p-value），係喺原假設（H0）成立嗰陣計出嚟嘅機會：檢驗統計量至少同我哋睇到嘅一樣極端，方向由備擇假設指定。所以佢跟住檢驗統計量走，亦取決於單側定雙側。
  s2_en: >-
    A smaller p-value means the observed statistic fits H0 less well under the model we kept. It does not measure effect
    size, practical importance, the probability that H0 is true, or the chance the result happened purely by luck.
  s2_zh: >-
    p 值越小，说明在既定模型下，观测统计量与原假设越不相容。它不度量效应有多大、实际有多重要、原假设为真的概率，也不是“结果纯属偶然”的机会。
  s2_zh_hk: >-
    p 值越細，即係喺既定模型之下，觀測統計量同原假設越唔相容。佢唔量度效應有幾大、實際有幾重要、原假設為真嘅概率，亦唔係「結果純屬偶然」嘅機會。
- id: name_pvalue
  visual: title_card
  seconds: 16
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: The p-value
  title_zh: p 值
  title_zh_hk: p 值
  en: >-
    Say the name once more. The p-value is that tail probability under the null: how often a gap at least this extreme
    would show up if H0 were true.
  zh: >-
    再念一次这个名字。p 值，就是原假设下的那个尾部概率：如果原假设为真，至少这么极端的差距，多久会出现一次。
  zh_hk: >-
    再唸一次呢個名。p 值，就係原假設下嗰個尾部概率：如果原假設為真，至少咁極端嘅差距，隔幾耐會出現一次。
- id: mechanics
  visual: two_column
  seconds: 64
  kicker_en: The trap
  kicker_zh: 常见陷阱
  kicker_zh_hk: 常見陷阱
  title_en: Do not flip the condition
  title_zh: 不要颠倒条件
  title_zh_hk: 唔好顛倒條件
  left_en: 'Correct: extreme under null'
  left_zh: 正确：原假设下有多极端
  left_zh_hk: 正確：原假設下有幾極端
  right_en: 'Wrong: null given data'
  right_zh: 错误：原假设为真的机会
  right_zh_hk: 錯誤：原假設為真嘅機會
  s1_en: >-
    A p-value of 0.0142 does not mean H0 has a 1.42 percent chance of being true. Classical p-values condition on H0 and
    ask about the test-statistic distribution. They do not hand H0 a posterior probability.
  s1_zh: >-
    p 等于 0.0142，并不表示原假设有 1.42% 的机会为真。经典 p 值是以原假设为条件，问检验统计量会怎么分布；它不会给原假设一个后验概率。
  s1_zh_hk: >-
    p 等於 0.0142，並唔表示原假設有 1.42% 機會為真。經典 p 值係以原假設為條件，問檢驗統計量會點樣分佈；佢唔會畀原假設一個後驗概率。
  s2_en: >-
    The decision rule compares p with a preselected significance level alpha. If p is at or below alpha, reject H0;
    otherwise fail to reject H0. Never say accept. The cut-off is a convention for error control, not a wall between truth
    and falsehood.
  s2_zh: >-
    决策规则把 p 和事先定好的显著性水平 alpha 比较。如果 p 小于等于 alpha，就拒绝原假设；否则不拒绝，永远不说“接受”。这个门槛是控制错误率的约定，不是真与假的分界墙。
  s2_zh_hk: >-
    決策規則將 p 同事先定好嘅顯著性水平 alpha 比較。如果 p 細過或者等於 alpha，就拒絕原假設；否則唔拒絕，永遠唔講「接受」。呢個門檻係控制錯誤率嘅約定，唔係真同假嘅分界牆。
  s3_en: >-
    Report the exact p-value when you can, with the estimate, the standard error, a confidence interval, and the
    assumptions. Values just above and just below alpha are not fundamentally different evidence once uncertainty is in
    view.
  s3_zh: >-
    能报确切 p 值就报，并写上估计值、标准误、置信区间和假设。p 只比 alpha 略高或略低，一旦把不确定性算进去，两者并不是本质不同的证据。
  s3_zh_hk: >-
    能夠報確切 p 值就報，並寫埋估計值、標準誤、置信區間同假設。p 淨係比 alpha 略高或者略低，一旦將不確定性計埋，兩者並唔係本質唔同嘅證據。
- id: ledger
  visual: steps
  layout: rows
  seconds: 110
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: is 93.49 unusual?'
  title_zh: A店：93.49 算异常吗？
  title_zh_hk: A店：93.49 算唔算異常？
  step1_en: 'H0: μ = 93.0 vs H1: μ ≠ 93.0'
  step1_zh: 'H0: μ = 93.0 对 H1: μ ≠ 93.0'
  step1_zh_hk: 'H0: μ = 93.0 對 H1: μ ≠ 93.0'
  step2_en: 'SE = 1.6 / √64 = 0.20°C'
  step2_zh: '标准误 = 1.6 / √64 = 0.20°C'
  step2_zh_hk: '標準誤 = 1.6 / √64 = 0.20°C'
  step3_en: 'Z = (93.49−93.0)/0.20 = 2.45'
  step3_zh: 'Z = (93.49 − 93.0) / 0.20 = 2.45'
  step3_zh_hk: 'Z = (93.49 − 93.0) / 0.20 = 2.45'
  step4_en: 'Tail 0.0071; p ≈ 0.0142'
  step4_zh: '上尾 0.0071；双侧 p ≈ 0.0142'
  step4_zh_hk: '上尾 0.0071；雙側 p ≈ 0.0142'
  step5_en: 'Reject H0 at α = 0.05'
  step5_zh: 'α = 0.05：拒绝原假设'
  step5_zh_hk: 'α = 0.05：拒絕原假設'
  s1_en: >-
    These are made-up teaching numbers. Write the plan first: the true average temperature mu is 93.0 degrees, against mu
    is not 93.0, with known sigma 1.6 degrees and 64 readings.
  s1_zh: >-
    下面是教学用的假设数字。先写计划：真正的平均水温 mu 等于 93.0 度，对上 mu 不等于 93.0，标准差 sigma 已知是 1.6 度，一共 64 个读数。
  s1_zh_hk: >-
    以下係教學用嘅假設數字。先寫計劃：真正嘅平均水溫 mu 等於 93.0 度，對上 mu 唔等於 93.0，標準差 sigma 已知係 1.6 度，一共 64 個讀數。
  s2_en: >-
    The standard error, how much an average of 64 readings usually wobbles, is 1.6 divided by the square root of 64. The
    square root of 64 is 8, so that is 0.20 degrees.
  s2_zh: >-
    标准误（SE），就是 64 个读数的平均数通常会晃多少：1.6 除以根号 64。根号 64 是 8，所以是 0.20 度。
  s2_zh_hk: >-
    標準誤（SE），即係 64 個讀數嘅平均數通常會晃幾多：1.6 除以根號 64。根號 64 係 8，所以係 0.20 度。
  s3_en: >-
    Now measure the gap in those wobble units. The sample mean, 93.49, minus the benchmark 93.0, divided by 0.20, gives Z
    equals 2.45. The sample sits 2.45 standard errors above the target.
  s3_zh: >-
    再用这个“晃动单位”去量差距。样本均值（x-bar）93.49，减去基准 93.0，再除以 0.20，得到检验统计量 Z 等于 2.45。样本落在目标上方 2.45 个标准误。
  s3_zh_hk: >-
    再用呢個「晃動單位」去量差距。樣本均值（x-bar）93.49，減去基準 93.0，再除以 0.20，得到檢驗統計量 Z 等於 2.45。樣本落喺目標上面 2.45 個標準誤。
  s4_en: >-
    How surprising is that if the null is true? The Normal table puts about 0.0071 in the upper tail past 2.45. Because
    the test is two-sided, double it: the p-value is about 0.0142.
  s4_zh: >-
    如果原假设成立，这有多意外？查正态表，超过 2.45 的上尾大约是 0.0071。因为是双侧检验，再乘 2：p 值大约是 0.0142。
  s4_zh_hk: >-
    如果原假設成立，呢個有幾意外？查正態表，超過 2.45 嘅上尾大約係 0.0071。因為係雙側檢驗，再乘 2：p 值大約係 0.0142。
  s5_en: >-
    Our cut-off, the significance level alpha, was set at 0.05 before we looked. A p-value of 0.0142 is below 0.05, so we
    reject the null. That is evidence against a 93.0-degree mean; it does not name a cause or write a repair order.
  s5_zh: >-
    我们事先把门槛，也就是显著性水平 alpha，定在 0.05。p 值 0.0142 低于 0.05，所以拒绝原假设。这是反对平均水温为 93.0 度的证据；它说不出原因，也不会自动开出维修单。
  s5_zh_hk: >-
    我哋事先將門檻，即係顯著性水平 alpha，定喺 0.05。p 值 0.0142 低過 0.05，所以拒絕原假設。呢個係反對平均水溫係 93.0 度嘅證據；佢講唔出原因，亦唔會自動開出維修單。
- id: takeaway
  visual: takeaway
  seconds: 66
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Evidence, not an action code
  title_zh: 证据摘要，不是行动指令
  title_zh_hk: 證據摘要，唔係行動指令
  q1_en: What probability does a p-value calculate?
  q1_zh: p 值计算的是什么概率？
  q1_zh_hk: p 值計算嘅係咩概率？
  q2_en: What else is needed before you act?
  q2_zh: 采取行动前还需要什么？
  q2_zh_hk: 採取行動前仲需要乜嘢？
  s1_en: >-
    A p-value measures the tail probability of the observed or more extreme statistic under H0 and the stated test. It is
    not the probability that H0 is true, not the probability of a wrong decision, and not a direct measure of economic
    importance.
  s1_zh: >-
    p 值度量的是，在原假设和指定检验下，观测统计量或更极端结果的尾部概率。它不是原假设为真的概率，不是做错决定的概率，也不是经济重要性的直接度量。
  s1_zh_hk: >-
    p 值量度嘅係，喺原假設同指定檢驗之下，觀測統計量或者更極端結果嘅尾部概率。佢唔係原假設為真嘅概率，唔係做錯決定嘅概率，亦唔係經濟重要性嘅直接量度。
  s2_en: >-
    Before acting, look at the estimated gap, the confidence interval, sensor calibration, independence, distributional
    assumptions, process tolerance, safety consequences, and the costs of false alarms and missed defects. Statistical
    evidence is one input, not the whole decision.
  s2_zh: >-
    采取行动前，还要看估计差距、置信区间、传感器校准、独立性、分布假设、流程公差、安全后果，以及误报与漏报的成本。统计证据只是输入之一，不是整套决策。
  s2_zh_hk: >-
    採取行動之前，仲要睇估計差距、置信區間、感應器校準、獨立性、分佈假設、流程公差、安全後果，以及誤報同漏報嘅成本。統計證據只係輸入之一，唔係成套決策。
  s3_en: >-
    So, is Shop A's 93.49 unusual under a 93.0 target? With Z of 2.45 and a two-sided p about 0.0142, yes under the 5
    percent rule: we reject that mean. Report the evidence precisely, and keep mechanical diagnosis and the stop decision
    separate.
  s3_zh: >-
    所以，在目标 93.0 下，A店的 93.49 算不算异常？Z 等于 2.45，双侧 p 大约 0.0142，按 5% 规则，是：我们拒绝这个均值。要准确报告证据，同时把机械诊断和停机决定分开。
  s3_zh_hk: >-
    所以，喺目標 93.0 之下，A店嘅 93.49 算唔算異常？Z 等於 2.45，雙側 p 大約 0.0142，按 5% 規則，係：我哋拒絕呢個均值。要準確報告證據，同時將機械診斷同停機決定分開。
