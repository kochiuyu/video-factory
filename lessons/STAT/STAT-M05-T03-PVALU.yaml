title_en: What a p-Value Measures
title_zh: p 值：衡量反对原假设的证据
title_zh_hk: p 值：衡量反對原假設嘅證據
objective_en: Define the p-value as a tail probability calculated under H0, distinguish it from the probability that H0 is
  true, calculate a two-sided p-value from a standard-normal statistic, and interpret the result as statistical evidence without
  converting it directly into a mechanical or operational diagnosis.
objective_zh: 把 p 值定义为在原假设成立条件下计算的尾部概率，区分 p 值与“原假设为真的概率”，由标准正态统计量计算双侧 p 值，并把结果解释为统计证据，而不直接转化为机械或经营诊断。
objective_zh_hk: 將 p 值定義為喺原假設成立條件之下計算嘅尾部概率，區分 p 值同「原假設為真嘅概率」，由標準正態統計量計算雙側 p 值，並將結果解讀成統計證據，而唔直接轉化成機械或者營運診斷。
youtube:
  description_en: |
    What a p-Value Measures

    Suppose Shop A checks an espresso boiler that should sit at 93.0 degrees Celsius on average. Sixty-four readings average 93.49. Call that a real drift when it is only noise, and the team tears down a fine machine. Shrug it off when the mean really moved, and every shot runs off-spec. How unusual is this gap if the target is still true? That tail chance is a p-value.

    A p-value is the probability, under H0, of a test statistic at least as extreme as the one we saw, in the direction the alternative picked. It is not the probability that H0 is true, not the chance of a wrong decision, and not a direct measure of economic importance.

    In an assumed example, SE = 1.6 / √64 = 0.20°C, so Z = (93.49 − 93.0) / 0.20 = 2.45. One Normal tail is about 0.0071, and the two-sided p-value is about 0.0142. At alpha = 0.05 we reject H0: mu = 93.0.

    Rule: report the p-value as evidence against the null under the chosen test. Keep mechanical diagnosis and the stop decision separate.
  description_zh: |
    p 值：衡量反对原假设的证据

    假设A店检查一台意式咖啡机锅炉，平均水温应该在 93.0 摄氏度。抽了 64 个读数，平均是 93.49。如果只是噪声却当成真的漂移，团队会白拆一台好机器；均值真偏了却不当回事，每杯出品都会偏。如果目标还成立，这个差距有多异常？这个尾部机会，就叫 p 值（p-value）。

    p 值是在原假设 H0 下，出现至少和观测一样极端的检验统计量的概率，方向由备择假设指定。它不是原假设为真的概率，不是做错决定的概率，也不是经济重要性的直接度量。

    在一个假设的例子里，标准误 = 1.6 / √64 = 0.20°C，于是 Z = (93.49 − 93.0) / 0.20 = 2.45。单侧正态尾大约 0.0071，双侧 p 值大约 0.0142。在 alpha = 0.05 下拒绝 H0: mu = 93.0。

    规则：把 p 值报告成在指定检验下反对原假设的证据。机械诊断和停机决定，要另外做。
  description_zh_hk: |
    p 值：衡量反對原假設嘅證據

    假設A店檢查一部意式咖啡機鍋爐，平均水溫應該喺 93.0 攝氏度。抽咗 64 個讀數，平均係 93.49。如果淨係雜音你又當成真係漂移，團隊會白拆一部好機；均值真係偏咗又唔理，每杯出品都會偏。如果目標仍然成立，呢個差距有幾異常？呢個尾部機會，就叫 p 值（p-value）。

    p 值係喺原假設 H0 之下，出現至少同觀測一樣極端嘅檢驗統計量嘅概率，方向由備擇假設指定。佢唔係原假設為真嘅概率，唔係做錯決定嘅概率，亦唔係經濟重要性嘅直接量度。

    喺一個假設嘅例子入面，標準誤 = 1.6 / √64 = 0.20°C，於是 Z = (93.49 − 93.0) / 0.20 = 2.45。單側正態尾大約 0.0071，雙側 p 值大約 0.0142。喺 alpha = 0.05 之下拒絕 H0: mu = 93.0。

    規則：將 p 值報告成喺指定檢驗之下反對原假設嘅證據。機械診斷同停機決定，要另外做。
