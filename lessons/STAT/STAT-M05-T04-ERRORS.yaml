title_en: Type I and Type II Errors
title_zh: 第一类与第二类错误：权衡误报与漏报
title_zh_hk: 第一類同第二類錯誤：權衡誤報同漏報
objective_en: Define Type I and Type II errors using truth-by-decision outcomes, distinguish significance level, beta, and
  power, explain the conditional alpha-beta trade-off when sample size and effect size are fixed, and compare testing policies
  for an assumed grinder-quality audit without inventing costs or prescribing action.
objective_zh: 利用“真实状态 × 检验决策”结果定义第一类与第二类错误，区分显著性水平、beta 与功效，解释样本量和效应大小固定时 alpha 与 beta 的条件性权衡，并比较假设磨豆机质量巡检中的检验方案，同时避免虚构成本或直接规定行动。
objective_zh_hk: 利用「真實狀態 × 檢驗決策」結果定義第一類同第二類錯誤，區分顯著性水平、beta 同功效，解釋樣本量同效應大小固定嗰陣 alpha 同 beta 嘅條件性權衡，並比較假設磨豆機品質巡檢入面嘅檢驗方案，同時避免虛構成本或者直接規定行動。
youtube:
  description_en: |
    Type I and Type II Errors

    Suppose Shop A plans a quality check on its coffee grinder. Flag a grinder that is still fine, and the shop stops work for nothing. Miss a grinder that has really drifted, and worn-out coffee keeps going to customers. No test can remove both risks. Which mistakes can a test make, and how do we balance them?

    A Type I error is a false alarm: H0 is true, but the test rejects it. Its long-run chance under H0 is alpha. A Type II error is a miss: H1 is true at a specific shift, but the test fails to reject. Its chance is beta, and power is 1 − beta. Alpha is computed assuming H0; beta is computed at one concrete shift.

    In an assumed example, tightening alpha from 0.05 to 0.01 moves the two-sided Z cutoffs from ±1.960 to ±2.576. False alarms fall from 5% to 1%, but with the same sample and shift, beta rises: more drifted grinders slip through.

    Rule: fix alpha, the shift worth catching, target power, and real costs before the data. Report both risks. Neither is ever zero.
  description_zh: |
    第一类与第二类错误：权衡误报与漏报

    假设A店打算给磨豆机做一次质量检查。机器其实还好，却被判成有问题，店里就白白停工；机器真的已经走样，却没被发现，磨坏的咖啡就继续卖给客人。没有哪个检验能把两种风险都消掉。检验会犯哪几种错？又该怎么平衡？

    第一类错误（Type I error）是误报：原假设为真，却被拒绝，长期机会是 alpha。第二类错误（Type II error）是漏报：在某个具体偏移下备择为真，却没有拒绝，机会是 beta；功效是 1 − beta。alpha 假定 H0 成立来算；beta 要在某一个具体偏移下算。

    在一个假设的例子里，把 alpha 从 0.05 收到 0.01，双侧 Z 临界值从 ±1.960 移到 ±2.576。误报从 5% 降到 1%，但样本量与偏移不变时，beta 会上升：更多已经走样的磨豆机会被漏掉。

    规则：看数据之前先定好 alpha、值得抓的偏移、目标功效和真实成本。两类风险都要报告，谁都不可能是零。
  description_zh_hk: |
    第一類同第二類錯誤：權衡誤報同漏報

    假設A店打算幫磨豆機做一次品質檢查。部機其實冇事，但係俾人判咗有問題，間舖就白白停工；部機真係已經走樣，又冇人發現，磨壞咗嘅咖啡就繼續賣俾客。冇一個檢驗可以將兩種風險都清走。檢驗會犯邊幾種錯？又應該點樣平衡？

    第一類錯誤（Type I error）係誤報：原假設為真，但係被拒絕，長遠機會係 alpha。第二類錯誤（Type II error）係漏報：喺某個具體偏移之下備擇為真，但係冇拒絕，機會係 beta；功效係 1 − beta。alpha 假定 H0 成立嚟計；beta 要喺某一個具體偏移之下計。

    喺一個假設嘅例子入面，將 alpha 由 0.05 收到 0.01，雙側 Z 臨界值由 ±1.960 移到 ±2.576。誤報由 5% 降到 1%，但樣本量同偏移唔變嗰陣，beta 會上升：更多已經走樣嘅磨豆機會被漏咗。

    規則：睇數據之前先定好 alpha、值得捉嘅偏移、目標功效同真實成本。兩類風險都要報告，邊個都唔可能係零。
