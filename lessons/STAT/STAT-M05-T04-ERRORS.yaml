quiz:
- id: Q1
  type: multiple_choice
  question_en: Which statement correctly distinguishes Type I and Type II errors?
  question_zh: 下列哪一句正确区分了第一类错误和第二类错误？
  question_zh_hk: 下列邊一句正確分清咗第一類錯誤同第二類錯誤？
  options_en:
  - 'A: Type I rejects a true H0; Type II fails to reject H0 when a specified alternative is true.'
  - 'B: Type I fails to reject a false H0; Type II rejects a true H0.'
  - 'C: Type I has probability 1 − α; Type II has probability equal to the power.'
  - 'D: Type II error is the probability that H0 is true after the test fails to reject it.'
  options_zh:
  - 'A: 第一类错误是拒绝了真的 H0（误报）；第二类错误是在指定备择为真时没有拒绝 H0（漏报）。'
  - 'B: 第一类错误是没有拒绝假的 H0；第二类错误是拒绝了真的 H0。'
  - 'C: 第一类错误的概率是 1 − α；第二类错误的概率等于功效。'
  - 'D: 第二类错误是检验不拒绝 H0 之后，H0 为真的概率。'
  options_zh_hk:
  - 'A: 第一類錯誤係拒絕咗真嘅 H0（誤報）；第二類錯誤係喺指定備擇為真嗰陣冇拒絕 H0（漏報）。'
  - 'B: 第一類錯誤係冇拒絕假嘅 H0；第二類錯誤係拒絕咗真嘅 H0。'
  - 'C: 第一類錯誤嘅概率係 1 − α；第二類錯誤嘅概率等於功效。'
  - 'D: 第二類錯誤係檢驗唔拒絕 H0 之後，H0 為真嘅概率。'
  answer: A
  explanation_en: Type I error is defined under H0 and has probability α for the stated test. Type II error is defined at
    a specified alternative and has probability β; power is 1 − β. B swaps the two, C mixes up α with 1 − α and β with power,
    and D flips the condition.
  explanation_zh: 第一类错误在 H0 为真时定义，概率是 α（误报，生产方风险）。第二类错误在指定备择为真时定义，概率是 β（漏报，消费方风险）；功效是 1 − β。B 把两者调换了，C 把 α 和 1 − α、β 和功效搞混了，D 把条件颠倒了。
  explanation_zh_hk: 第一類錯誤喺 H0 為真嗰陣定義，概率係 α（誤報，生產方風險）。第二類錯誤喺指定備擇為真嗰陣定義，概率係 β（漏報，消費方風險）；功效係 1 − β。B 將兩樣調轉咗，C 將 α 同 1 − α、β 同功效撈亂咗，D 將條件顛倒咗。
- id: Q2
  type: multiple_choice
  question_en: For the same two-sided Z test, with sample size, variability, and alternative effect fixed, what happens when
    α is reduced from 0.05 to 0.01?
  question_zh: 同一个双侧 Z 检验，样本量、波动和备择效应都固定。把 α 从 0.05 降到 0.01，会发生什么？
  question_zh_hk: 同一個雙側 Z 檢驗，樣本量、波動同備擇效應都固定。將 α 由 0.05 降到 0.01，會發生乜嘢？
  options_en:
  - 'A: Critical values move from about ±1.960 to ±2.576; Type I risk falls and β rises for the specified alternative.'
  - 'B: Critical values move from about ±1.960 to ±2.576; both Type I risk and β fall, because the test is stricter.'
  - 'C: Critical values move inward from ±1.960 to ±1.645; Type I risk falls.'
  - 'D: Type I risk falls and β stays the same, because β depends only on the sample size.'
  options_zh:
  - 'A: 临界值从约 ±1.960 移到 ±2.576；第一类错误风险下降，指定备择下的 β 上升。'
  - 'B: 临界值从约 ±1.960 移到 ±2.576；因为检验更严格，第一类错误风险和 β 都下降。'
  - 'C: 临界值从 ±1.960 往内移到 ±1.645；第一类错误风险下降。'
  - 'D: 第一类错误风险下降，β 不变，因为 β 只取决于样本量。'
  options_zh_hk:
  - 'A: 臨界值由大約 ±1.960 移到 ±2.576；第一類錯誤風險下降，指定備擇之下嘅 β 上升。'
  - 'B: 臨界值由大約 ±1.960 移到 ±2.576；因為檢驗更嚴格，第一類錯誤風險同 β 都下降。'
  - 'C: 臨界值由 ±1.960 向內移到 ±1.645；第一類錯誤風險下降。'
  - 'D: 第一類錯誤風險下降，β 唔變，因為 β 淨係取決於樣本量。'
  answer: A
  explanation_en: With the other design inputs fixed, a smaller α pushes the cutoffs farther out, to about ±2.576. More results
    land in the do-not-reject region, so the Type I rate falls and β rises for the specified alternative. B misses the trade-off,
    C moves the cutoffs the wrong way, and D forgets that β also depends on α and the effect size.
  explanation_zh: 其他设计输入固定时，α 变小会把临界值推得更远，到约 ±2.576。更多结果落在不拒绝域，所以第一类错误率下降，指定备择下的 β 上升。B 忽略了此消彼长，C 把临界值移错了方向，D 忘了 β 也取决于 α 和效应大小。
  explanation_zh_hk: 其他設計輸入固定嗰陣，α 細咗會將臨界值推得更遠，去到大約 ±2.576。更多結果落喺唔拒絕域，所以第一類錯誤率下降，指定備擇之下嘅 β 上升。B 冇理此消彼長，C 將臨界值移錯咗方向，D 唔記得 β 亦取決於 α 同效應大小。
