  step4_zh_hk: '誤報率：5% → 1%'
  step5_en: 'Same n and shift: β rises'
  step5_zh: 'n 和偏移不变：β 上升'
  step5_zh_hk: 'n 同偏移唔變：β 上升'
  s1_en: >-
    These are planning assumptions, not grinder records. Shop A runs a two-sided Z test: the grinder mean mu equals the
    benchmark mu zero, against mu not equal to mu zero, with sample size, noise sigma, and the shift fixed.
  s1_zh: >-
    下面是规划用的假设，不是磨豆机的真实记录。A店做双侧 Z 检验：磨豆机的真实均值 mu 等于基准 mu 零，对上 mu 不等于 mu 零。样本量、噪声 sigma 和要紧的偏移都固定。
  s1_zh_hk: >-
    以下係規劃假設，唔係真實記錄。A店做雙側 Z 檢驗：磨豆機均值 mu 等於基準 mu 零，對上 mu 唔等於 mu 零；樣本量、雜音 sigma 同偏移都固定。
  s2_en: >-
    Rule one uses alpha equal to 0.05. The two-sided critical values are about plus or minus 1.960: reject H0 when Z is that
    far from zero.
  s2_zh: >-
    第一条规则用 alpha 等于 0.05。双侧临界值大约是正负 1.960，所以 Z 离零至少 1.960，就拒绝原假设。
  s2_zh_hk: >-
    第一條規則用 alpha 等於 0.05。雙側臨界值大約係正負 1.960，所以 Z 離零至少 1.960，就拒絕原假設。
  s3_en: >-
    Rule two uses alpha equal to 0.01. The critical values move out to about plus or minus 2.576. The statistic must be
    more extreme before we reject.
  s3_zh: >-
    第二条规则用 alpha 等于 0.01。临界值往外移到大约正负 2.576，检验统计量要更极端，才拒绝原假设。
  s3_zh_hk: >-
    第二條規則用 alpha 等於 0.01。臨界值向外移到大約正負 2.576，檢驗統計量要更極端，先拒絕原假設。
  s4_en: >-
    What did we buy? When the grinder is really fine, the long-run false-alarm rate drops from 5 percent to 1 percent.
  s4_zh: >-
    这样换来了什么？如果磨豆机其实没问题，长期误报率从 5% 降到 1%。
  s4_zh_hk: >-
    噉樣換到啲乜？如果部磨豆機其實冇問題，長遠誤報率由 5% 跌到 1%。
  s5_en: >-
    What did we pay? With the same sample and shift, more drifted grinders slip through, so beta rises. Cutoffs alone cannot
    pick the rule; you also need the shift worth catching, the target power, and each mistake's real cost.
  s5_zh: >-
    付出了什么？样本和偏移都不变，更多已经走样的磨豆机会溜过去，所以 beta 上升。光看临界值选不出规则；还要知道值得抓的偏移、想要的功效，以及两种错误的真实代价。
  s5_zh_hk: >-
    又要俾啲乜？樣本同偏移都唔變，更多已經走樣嘅磨豆機會走甩，所以 beta 上升。淨係睇臨界值揀唔到規則；仲要知道值得捉嘅偏移、想要嘅功效，同埋兩種錯誤嘅真實代價。
- id: takeaway
  visual: takeaway
  seconds: 66
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Plan for both errors
  title_zh: 两类错误都要计划
  title_zh_hk: 兩類錯誤都要計劃
  q1_en: Why does beta need a stated shift?
  q1_zh: 为什么不指定备择效应，就说不出 beta？
  q1_zh_hk: 點解唔指定備擇效應，就講唔出 beta？
  q2_en: How to raise power without raising alpha?
  q2_zh: 哪些设计改变能提高功效，又不用调高 alpha？
  q2_zh_hk: 邊啲設計改變可以提高功效，又唔使調高 alpha？
  s1_en: >-
    Alpha is worked out assuming H0 is true. Beta is worked out at one particular shift. A small shift is harder to catch
    than a big one, so always report beta and power together with the shift, sample size, noise, and rule.
  s1_zh: >-
    alpha 是假定原假设成立来算的；beta 是在某一个具体偏移下算的。小偏移比大偏移难抓，所以报告 beta 和功效时，一定要连同偏移、样本量、噪声和规则一起说。
  s1_zh_hk: >-
    alpha 係假定原假設成立嚟計嘅；beta 係喺某一個具體偏移之下計嘅。細偏移比大偏移難捉，所以報告 beta 同功效嗰陣，一定要連埋偏移、樣本量、雜音同規則一齊講。
  s2_en: >-
    Power can go up with a larger sample, less measurement noise, a paired or blocked design, a justified one-sided test,
    or a bigger real effect. Each change has assumptions and costs to check first.
  s2_zh: >-
    功效可以靠这些提高：更大的样本、更小的测量噪声、配对或分组的设计、有依据的单侧检验，或者真实效应本来就更大。每一种改变都有自己的假设和成本，要先查清楚。
  s2_zh_hk: >-
    功效可以靠呢啲提高：更大樣本、更細量度雜音、配對或者分組設計、有依據嘅單側檢驗，或者真實效應本身更大。每種改變都有假設同成本，要先查清楚。
  s3_en: >-
    So which mistakes can Shop A's grinder test make? A false alarm, the Type I error, and a miss, the Type II error. Fix
    alpha, the shift, target power, and real costs before the data, then report both risks. Neither is ever zero.
  s3_zh: >-
    所以，A店的磨豆机检验会犯哪些错？误报，就是第一类错误；漏报，就是第二类错误。收数据前，先定好 alpha、偏移、目标功效和真实成本，再把两种风险都报出来；哪一种都不会是零。
  s3_zh_hk: >-
    所以，A店嘅磨豆機檢驗會犯邊啲錯？誤報，即係第一類錯誤；漏報，即係第二類錯誤。收數據之前，先定好 alpha、偏移、目標功效同真實成本，再將兩種風險都報出嚟；邊種都唔會係零。
