- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Truth crossed with decision
  title_zh: 把真实状态和检验决策交叉
  title_zh_hk: 將真實狀態同檢驗決策交叉
  formula: 'α: false alarm; β: miss; power = 1 − β'
  formula_zh: 'α = P(拒绝 H0｜H0 为真)；β = P(不拒绝 H0｜H1 为真)；功效 = 1 − β'
  formula_zh_hk: 'α = P(拒絕 H0｜H0 為真)；β = P(唔拒絕 H0｜H1 為真)；功效 = 1 − β'
  formula_tex: '\alpha = P(\mathrm{reject}\ H_0 \mid H_0) \qquad \beta = P(\mathrm{not\ reject}\ H_0 \mid H_1) \qquad \mathrm{power} = 1-\beta'
  s1_en: >-
    A Type I error is a false alarm: the null hypothesis H0 is true, but the test rejects it. The significance level alpha
    sets how often that happens in the long run when H0 holds. It describes the rule, not one rejection.
  s1_zh: >-
    第一类错误（Type I error）就是误报：原假设（H0）其实是对的，检验却把它拒绝了。显著性水平（alpha）定的，就是 H0 成立时，长期来看这种事多常发生。它说的是规则，不是某一次拒绝。
  s1_zh_hk: >-
    第一類錯誤（Type I error）即係誤報：原假設（H0）其實係啱嘅，檢驗卻將佢拒絕咗。顯著性水平（alpha）定嘅，就係 H0 成立嗰陣，長遠嚟講呢種事有幾常見。佢講嘅係規則，唔係某一次拒絕。
  s2_en: >-
    A Type II error is a miss: a specific shift is real, but the test does not reject H0. Its chance, beta, depends on the
    shift size, noise, sample size, and alpha. Power, one minus beta, is the chance of catching that shift.
  s2_zh: >-
    第二类错误（Type II error）就是漏报：某个具体的备择情况是真的，检验却没有拒绝 H0。它的机会叫 beta，取决于偏移有多大、噪声、样本量和 alpha。功效（power）等于 1 减 beta，就是抓到这个偏移的机会。
  s2_zh_hk: >-
    第二類錯誤（Type II error）即係漏報：某個具體嘅備擇情況係真嘅，檢驗卻冇拒絕 H0。佢嘅機會叫 beta，取決於偏移有幾大、雜音、樣本量同 alpha。功效（power）等於 1 減 beta，即係捉到呢個偏移嘅機會。
- id: name_errors
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Type I error · Type II error
  title_zh: 第一类错误 · 第二类错误
  title_zh_hk: 第一類錯誤 · 第二類錯誤
  en: >-
    Say the names once more. A Type I error is the false alarm, with chance alpha. A Type II error is the miss, with chance
    beta.
  zh: >-
    再念一次这两个名字。第一类错误，是误报，机会是 alpha；第二类错误，是漏报，机会是 beta。
  zh_hk: >-
    再唸一次呢兩個名。第一類錯誤，係誤報，機會係 alpha；第二類錯誤，係漏報，機會係 beta。
- id: mechanics
  visual: two_column
  seconds: 64
  kicker_en: The seesaw
  kicker_zh: 跷跷板
  kicker_zh_hk: 蹺蹺板
  title_en: The trade-off has conditions
  title_zh: 此消彼长，是有条件的
  title_zh_hk: 此消彼長，係有條件嘅
  left_en: 'Lower alpha: beta rises'
  left_zh: 降低 alpha，n 和偏移不变：beta 上升
  left_zh_hk: 降低 alpha，n 同偏移唔變：beta 上升
  right_en: 'Bigger n: beta falls'
  right_zh: 更多信息，alpha 不变：beta 下降
  right_zh_hk: 更多資訊，alpha 唔變：beta 下降
  s1_en: >-
    Picture a seesaw. Keep the sample size, the noise, and the shift fixed, then lower alpha. The cutoffs move farther into
    the tails, so fewer false alarms. But more results now land in the do-not-reject zone, so beta rises.
  s1_zh: >-
    想象一个跷跷板。样本量、噪声和偏移都不变，只把 alpha 调低。临界值往尾部更外面推，误报就少了；可是更多结果落进不拒绝的区域，beta 就升上去。
  s1_zh_hk: >-
    想像一個蹺蹺板。樣本量、雜音同偏移都唔變，淨係將 alpha 調低。臨界值向尾部再推出啲，誤報就少咗；但係更多結果跌入唔拒絕嘅範圍，beta 就升上去。
  s2_en: >-
    The seesaw only holds when nothing else changes. A larger sample shrinks the standard error, so the same alpha can come
    with a smaller beta. Better measurement, less noise, or a smarter design can help too.
  s2_zh: >-
    这个跷跷板，只在其他条件都不变时才成立。样本量加大，标准误就变小，同样的 alpha 也能换来更小的 beta。测量更准、噪声更小、设计更聪明，也都有帮助。
  s2_zh_hk: >-
    呢個蹺蹺板，淨係喺其他條件都唔變嗰陣先成立。樣本量加大，標準誤就變細，同一個 alpha 都可以換到更細嘅 beta。量度更準、雜音更細、設計更聰明，都會幫到手。
  s3_en: >-
    Neither error is automatically worse. Which one hurts more depends on safety, customers, and real costs, and those
    should be written down before the data come in, not made up after the result is known.
  s3_zh: >-
    没有哪一种错误天生更严重。哪种伤害更大，要看安全、顾客和真实成本；这些都应该在数据进来之前写清楚，而不是结果出来以后再编。
  s3_zh_hk: >-
    冇邊一種錯誤天生更嚴重。邊種傷害更大，要睇安全、顧客同真實成本；呢啲都應該喺數據入嚟之前寫清楚，而唔係結果出咗之後先作。
