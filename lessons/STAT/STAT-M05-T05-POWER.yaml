quiz:
- id: Q1
  type: multiple_choice
  question_en: What does 80% power mean for a specified effect Δ under a fixed test design?
  question_zh: 对一个指定效应 Δ、设计固定的检验来说，80% 的功效是什么意思？
  question_zh_hk: 對一個指定效應 Δ、設計固定嘅檢驗嚟講，80% 嘅功效係咩意思？
  options_en:
  - 'A: If that effect Δ is real and the assumptions hold, the test rejects H0 in about 80% of repeated studies.'
  - 'B: There is an 80% chance that H1 is true after this study rejects H0.'
  - 'C: There is an 80% chance that H0 is rejected when H0 is actually true.'
  - 'D: The test will detect any effect, of any size, 80% of the time.'
  options_zh:
  - 'A: 如果效应 Δ 真的存在、假设也成立，重复做很多次研究，大约 80% 会拒绝 H0。'
  - 'B: 这次研究拒绝 H0 之后，H1 为真的概率是 80%。'
  - 'C: H0 其实为真时，有 80% 的机会拒绝 H0。'
  - 'D: 不管效应多大多小，检验都有 80% 的机会检出。'
  options_zh_hk:
  - 'A: 如果效應 Δ 真係存在、假設又成立，重複做好多次研究，大約 80% 會拒絕 H0。'
  - 'B: 今次研究拒絕 H0 之後，H1 為真嘅概率係 80%。'
  - 'C: H0 其實為真嗰陣，有 80% 機會拒絕 H0。'
  - 'D: 唔理效應幾大幾細，檢驗都有 80% 機會檢出。'
  answer: A
  explanation_en: Power is a repeated-sampling probability at one specified alternative, equal to 1 − β. B reverses the condition,
    C describes a Type I error rate (that is α, not power), and D forgets that power depends on the effect size.
  explanation_zh: 功效是在某个指定备择下、重复抽样意义上的概率，等于 1 − β。B 把条件颠倒了；C 说的是第一类错误率，那是 α 不是功效；D 忘了功效取决于效应大小。
  explanation_zh_hk: 功效係喺某個指定備擇之下、重複抽樣意義上嘅概率，等於 1 − β。B 將條件顛倒咗；C 講嘅係第一類錯誤率，嗰個係 α 唔係功效；D 唔記得功效取決於效應大小。
- id: Q2
  type: multiple_choice
  question_en: For a two-sided one-sample Z test with Δ = 10 s, known σ = 20 s, α = 0.05 and target power 0.80, what sample
    size does the simple formula give?
  question_zh: 双侧单样本 Z 检验，Δ = 10 秒，已知 σ = 20 秒，α = 0.05，目标功效 0.80。简单公式给出的样本量是多少？
  question_zh_hk: 雙側單樣本 Z 檢驗，Δ = 10 秒，已知 σ = 20 秒，α = 0.05，目標功效 0.80。簡單公式計出嘅樣本量係幾多？
  options_en:
  - 'A: n = ((1.96 + 0.84) × 20 / 10)² = 31.36, round up to 32.'
  - 'B: n = (1.96 × 20 / 10)² = 15.37, round up to 16.'
  - 'C: n = ((1.96 + 0.84) × 20 / 10)² = 31.36, round down to 31.'
  - 'D: n = (1.96 + 0.84) × 20 / 10 = 5.6, round up to 6.'
  options_zh:
  - 'A: n = ((1.96 + 0.84) × 20 / 10)² = 31.36，向上取整为 32。'
  - 'B: n = (1.96 × 20 / 10)² = 15.37，向上取整为 16。'
  - 'C: n = ((1.96 + 0.84) × 20 / 10)² = 31.36，四舍五入为 31。'
  - 'D: n = (1.96 + 0.84) × 20 / 10 = 5.6，向上取整为 6。'
  options_zh_hk:
  - 'A: n = ((1.96 + 0.84) × 20 / 10)² = 31.36，向上取整做 32。'
  - 'B: n = (1.96 × 20 / 10)² = 15.37，向上取整做 16。'
  - 'C: n = ((1.96 + 0.84) × 20 / 10)² = 31.36，四捨五入做 31。'
  - 'D: n = (1.96 + 0.84) × 20 / 10 = 5.6，向上取整做 6。'
  answer: A
  explanation_en: The formula is n = ((z_(α/2) + z_β) × σ / Δ)², which gives 31.36, and sample sizes always round up, so 32.
    B leaves out the power term z_β, C rounds down and falls short of the target power, and D forgets to square.
  explanation_zh: 公式是 n = ((z_(α/2) + z_β) × σ / Δ)²，得 31.36；样本量一律向上取整，所以是 32。B 漏了功效那一项 z_β，C 往下取整会达不到目标功效，D 忘了平方。
  explanation_zh_hk: 公式係 n = ((z_(α/2) + z_β) × σ / Δ)²，得 31.36；樣本量一律向上取整，所以係 32。B 漏咗功效嗰項 z_β，C 向下取整會達唔到目標功效，D 唔記得平方。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The idea that almost got dropped
  kicker_zh: 差点被放弃的点子
  kicker_zh_hk: 差啲俾人放棄嘅點子
  title_en: Could a test miss a real gain?
  title_zh: 检验会不会漏掉真改善？
  title_zh_hk: 檢驗會唔會漏咗真改善？
  en: >-
    Suppose Shop A tries an express pickup shelf to cut customer wait time. A small trial comes back not significant, and
    the idea almost gets dropped. But maybe the trial was simply too small to see a real gain. How do we know, before
    collecting data, whether a test can catch the improvement we care about? That is called statistical power.
  zh: >-
    假设A店试一个快取货架，想缩短顾客的等待时间。一个小规模试验做完，结果不显著，这个点子差点就被放弃了。可是，说不定只是试验太小，根本看不出真实的改善。在收数据之前，我们怎么知道一个检验能不能抓到我们在乎的改善？这就叫统计功效。
  zh_hk: >-
    假設A店試一個快取貨架，想縮短顧客嘅等候時間。一個細規模試驗做完，結果唔顯著，呢個點子差啲就俾人放棄。但係，可能只係試驗太細，根本睇唔出真實嘅改善。喺收數據之前，我哋點知一個檢驗捉唔捉到我哋在乎嘅改善？呢個就叫統計功效。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Power belongs to one effect size
  title_zh: 功效对应一个指定效应
  title_zh_hk: 功效對應一個指定效應
  formula: 'Power(Δ) = P(reject H0 | Δ) = 1 − β'
  formula_zh: '功效(Δ) = P(拒绝 H0｜效应 = Δ) = 1 − β'
  formula_zh_hk: '功效(Δ) = P(拒絕 H0｜效應 = Δ) = 1 − β'
  formula_tex: '\mathrm{power}(\Delta) = P(\mathrm{reject}\ H_0 \mid \Delta) \qquad \mathrm{power} = 1-\beta(\Delta)'
  s1_en: >-
    Statistical power is the chance that the test rejects H0 when a specific effect, Delta, is really there. It is not one
    fixed number for a study. Change the effect you have in mind, and the power changes too.
  s1_zh: >-
    统计功效（power）就是：某个具体的效应 Delta 真的存在时，检验能拒绝原假设 H0 的机会。它不是一项研究固定的一个数。你心里想的效应一变，功效也跟着变。
  s1_zh_hk: >-
    統計功效（power）即係：某個具體嘅效應 Delta 真係存在嗰陣，檢驗可以拒絕原假設 H0 嘅機會。佢唔係一項研究固定嘅一個數。你心目中嘅效應一變，功效都會跟住變。
  s2_en: >-
    Beta is the chance of missing that effect, the Type II error. So power is one minus beta. A target like 80 percent
    is a planning choice, not a promise that any result is true.
  s2_zh: >-
    beta 是漏掉这个效应的机会，也就是第二类错误。所以功效等于 1 减 beta。80% 这样的目标，是规划时的选择，不是保证哪个结果一定对。
  s2_zh_hk: >-
    beta 係漏咗呢個效應嘅機會，即係第二類錯誤。所以功效等於 1 減 beta。80% 呢類目標，係規劃時嘅選擇，唔係保證邊個結果一定啱。
- id: name_power
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Power · effect size
  title_zh: 统计功效 · 效应量
  title_zh_hk: 統計功效 · 效應量
  en: >-
    Say the names once more. Power is the chance of catching a real effect. The effect size, Delta, is the smallest change
    that matters.
  zh: >-
    再念一次这两个名字。统计功效，是抓到真实效应的机会；效应量 Delta（effect size），是值得在乎的最小变化。
  zh_hk: >-
    再唸一次呢兩個名。統計功效，係捉到真實效應嘅機會；效應量 Delta（effect size），係值得在乎嘅最細變化。
- id: mechanics
  visual: two_column
  seconds: 64
  kicker_en: The levers
  kicker_zh: 几根杠杆
  kicker_zh_hk: 幾條槓桿
  title_en: More signal, less noise
  title_zh: 信号更强，噪声更小
  title_zh_hk: 訊號更強，雜音更細
  left_en: 'Bigger Δ: power up'
  left_zh: 效应 Δ 更大：功效上升
  left_zh_hk: 效應 Δ 更大：功效上升
  right_en: 'Bigger n, less σ: power up'
  right_zh: n 更大或 σ 更小：功效上升
  right_zh_hk: n 更大或 σ 更細：功效上升
  s1_en: >-
    A big effect is easier to tell apart from the benchmark than a small one. Plan with the smallest change that really
    matters to the shop, not a hopeful number picked just to make the sample look small.
  s1_zh: >-
    大效应比小效应更容易和基准区分开。规划时要用对店里真正要紧的最小变化，而不是为了让样本看起来小，挑一个乐观的数字。
  s1_zh_hk: >-
    大效應比細效應更容易同基準分開。規劃嗰陣要用對間舖真正要緊嘅最細變化，而唔係為咗令樣本睇落細，揀個樂觀嘅數字。
  s2_en: >-
    A bigger sample, or less noise in the outcome, shrinks the standard error, and power usually goes up. But records that
    repeat the same customers add less information than truly independent ones.
  s2_zh: >-
    样本更大，或者结果的波动更小，标准误就变小，功效通常就上去。不过，同一批顾客重复出现的记录，带来的信息比真正独立的观测少。
  s2_zh_hk: >-
    樣本更大，或者結果嘅波動更細，標準誤就變細，功效通常就上去。不過，同一班顧客重複出現嘅記錄，帶嚟嘅資訊比真正獨立嘅觀測少。
  s3_en: >-
    With everything else fixed, a bigger alpha also raises power, but it raises false alarms too. Choose alpha, the test
    direction, and the design before you see any results.
  s3_zh: >-
    其他条件都不变时，把 alpha 调大也会提高功效，但误报也跟着变多。alpha、检验方向和设计，都要在看到结果之前定好。
  s3_zh_hk: >-
    其他條件都唔變嗰陣，將 alpha 調大都會提高功效，但係誤報都會跟住多咗。alpha、檢驗方向同設計，都要喺睇到結果之前定好。
- id: ledger
  visual: steps
  layout: rows
  seconds: 100
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: how many customers?'
  title_zh: A店：要量几位顾客？
  title_zh_hk: A店：要量幾多位顧客？
  step1_en: 'Δ = 10 s, σ = 20 s, α = 0.05'
  step1_zh: 'Δ = 10 秒，σ = 20 秒，α = 0.05'
  step1_zh_hk: 'Δ = 10 秒，σ = 20 秒，α = 0.05'
  step2_en: 'z(α/2) = 1.96, z(β) = 0.84'
  step2_zh: 'z(α/2) = 1.96，z(β) = 0.84'
  step2_zh_hk: 'z(α/2) = 1.96，z(β) = 0.84'
  step3_en: 'n = ((1.96 + 0.84) × 20 / 10)²'
  step3_zh: 'n = ((1.96 + 0.84) × 20 / 10)²'
  step3_zh_hk: 'n = ((1.96 + 0.84) × 20 / 10)²'
  step4_en: 'n = 5.60² = 31.36'
  step4_zh: 'n = 5.60² = 31.36'
  step4_zh_hk: 'n = 5.60² = 31.36'
  step5_en: 'Round up: 32 customers'
  step5_zh: '向上取整：32 位顾客'
  step5_zh_hk: '向上取整：32 位顧客'
  s1_en: >-
    These are made-up teaching numbers. The smallest cut in wait time that matters is ten seconds. The standard deviation
    sigma is known, twenty seconds. The test is two-sided at alpha 0.05, and we want power 0.80.
  s1_zh: >-
    下面是教学用的假设数字。值得在乎的最小缩短是 10 秒；标准差 sigma 已知，是 20 秒；双侧检验，alpha 等于 0.05；目标功效 0.80。
  s1_zh_hk: >-
    以下係教學用嘅假設數字。值得在乎嘅最細縮短係 10 秒；標準差 sigma 已知，係 20 秒；雙側檢驗，alpha 等於 0.05；目標功效 0.80。
  s2_en: >-
    Look up two z values: 1.96 for a two-sided alpha of 0.05, and 0.84 for 80 percent power.
  s2_zh: >-
    查两个 z 值：双侧 alpha 0.05 对应 1.96，80% 功效对应 0.84。
  s2_zh_hk: >-
    查兩個 z 值：雙側 alpha 0.05 對應 1.96，80% 功效對應 0.84。
  s3_en: >-
    Plug them into the simple planning formula: add the two z values, times sigma, divide by Delta, then square.
  s3_zh: >-
    代入简单的规划公式：两个 z 值相加，乘以 sigma，除以 Delta，再平方。
  s3_zh_hk: >-
    代入簡單嘅規劃公式：兩個 z 值加埋，乘 sigma，除 Delta，再平方。
  s4_en: >-
    1.96 plus 0.84 is 2.80. Times twenty, divided by ten, gives 5.60. Squared, that is 31.36.
  s4_zh: >-
    1.96 加 0.84 等于 2.80，乘 20 再除 10，得 5.60；平方，就是 31.36。
  s4_zh_hk: >-
    1.96 加 0.84 等於 2.80，乘 20 再除 10，得 5.60；平方，就係 31.36。
  s5_en: >-
    Sample sizes always round up, so Shop A needs 32 independent customers. That is a baseline. Missing data, repeat
    customers, or a different final test mean you should recalculate.
  s5_zh: >-
    样本量一律向上取整，所以A店需要 32 位独立的顾客。这只是基线；如果有缺失数据、重复的顾客，或者最后用的检验不一样，就要重新算。
  s5_zh_hk: >-
    樣本量一律向上取整，所以A店需要 32 位獨立嘅顧客。呢個只係基線；如果有缺失數據、重複嘅顧客，或者最後用嘅檢驗唔同，就要重新計。
- id: takeaway
  visual: takeaway
  seconds: 66
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Plan power before the data
  title_zh: 收数据前先规划功效
  title_zh_hk: 收數據之前先規劃功效
  q1_en: Why does power need a stated effect?
  q1_zh: 为什么不指定效应，功效就说不清？
  q1_zh_hk: 點解唔指定效應，功效就講唔清？
  q2_en: What must the plan and analysis share?
  q2_zh: 规划和最后的分析要对齐什么？
  q2_zh_hk: 規劃同最後嘅分析要對齊乜嘢？
  s1_en: >-
    Big effects are easier to catch than small ones, so power always comes with an effect size. A not-significant result
    from a low-power study is inconclusive. It does not prove the idea failed.
  s1_zh: >-
    大效应比小效应容易抓，所以功效一定要连同效应大小一起说。低功效研究的不显著结果，说明不了什么，并不能证明这个点子失败了。
  s1_zh_hk: >-
    大效應比細效應易捉，所以功效一定要連埋效應大小一齊講。低功效研究嘅唔顯著結果，說明唔到乜嘢，唔可以證明呢個點子失敗咗。
  s2_en: >-
    The plan should match the final analysis: the outcome, the test direction, alpha, the variance assumption, and how
    the data depend on each other. If the real design differs, recalculate.
  s2_zh: >-
    规划要和最后的分析对得上：结果怎么定义、检验方向、alpha、方差假设，还有数据之间是不是相关。实际设计不一样，就重新算。
  s2_zh_hk: >-
    規劃要同最後嘅分析對得上：結果點定義、檢驗方向、alpha、方差假設，同埋數據之間有冇關連。實際設計唔同，就重新計。
  s3_en: >-
    So, can Shop A's test catch a ten-second cut? With 32 independent customers, it has about 80 percent power. Set Delta,
    alpha, and power before the data, and write every input down.
  s3_zh: >-
    所以，A店的检验抓得到 10 秒的缩短吗？有 32 位独立的顾客，功效大约是 80%。收数据之前，先定好 Delta、alpha 和功效，并把每个输入都记下来。
  s3_zh_hk: >-
    所以，A店嘅檢驗捉唔捉到 10 秒嘅縮短？有 32 位獨立嘅顧客，功效大約係 80%。收數據之前，先定好 Delta、alpha 同功效，再將每個輸入都記低。
