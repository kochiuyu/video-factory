objective_en: Define statistical power at a specified alternative, explain how sample size, alpha, effect size, and variability
  affect power, distinguish a low-powered nonsignificant result from evidence of no effect, and calculate an approximate one-sample
  Z-test size for an assumed queue-time experiment.
objective_zh: 在指定备择状态下定义统计功效，解释样本量、alpha、效应大小与波动如何影响功效，区分低功效下的不显著结果与“无效应”的证据，并为假设排队时间实验计算近似单样本 Z 检验规模。
objective_zh_hk: 喺指定備擇狀態之下定義統計功效，解釋樣本量、alpha、效應大小同波動點樣影響功效，區分低功效之下嘅唔顯著結果同「冇效應」嘅證據，並為假設排隊時間實驗計算近似單樣本 Z 檢驗規模。
youtube:
  description_en: |
    Statistical Power and Sample Size

    Suppose Shop A tries an express pickup shelf to cut customer wait time. A small trial comes back not significant, and the idea almost gets dropped. Maybe the trial was simply too small to see a real gain. How do we know, before collecting data, whether a test can catch the improvement we care about?

    Statistical power is the chance of rejecting H0 when a specific effect size Delta is really there. It is not one fixed number for a study. Change Delta, and the power changes. An underpowered nonsignificant result does not prove the idea failed.

    In an assumed example, Shop A wants 80% power to catch a 10-second cut, with sigma = 20 s and two-sided alpha = 0.05. Using z(alpha/2) = 1.96 and z(beta) = 0.84, n = ((1.96 + 0.84) × 20 / 10)² = 31.36, which rounds up to 32 independent customers.

    Rule: set Delta, alpha, and power before the data, write every input down, and recalculate if the final design changes.
  description_zh: |
    统计功效与实验规模：为检测重要效应而设计

    假设A店试一个快取货架，想缩短顾客等待时间。一个小规模试验做完，结果不显著，这个点子差点就被放弃。可是说不定只是试验太小，根本看不出真实的改善。在收数据之前，我们怎么知道一个检验能不能抓到我们在乎的改善？

    统计功效（statistical power）是当某个具体效应量 Delta 真的存在时，检验拒绝 H0 的机会。它不是研究的一个固定数字。换一个 Delta，功效就变。低功效之下的不显著结果，说明不了什么，并不能证明这个点子失败了。

    在一个假设的例子里，A店想要 80% 功效去抓到 10 秒的缩短，sigma = 20 秒，双侧 alpha = 0.05。用 z(alpha/2) = 1.96 和 z(beta) = 0.84，得到 n = ((1.96 + 0.84) × 20 / 10)² = 31.36，向上取整为 32 位独立顾客。

    规则：看数据之前先定好 Delta、alpha 和功效，把每个输入写下来；最终设计变了，就要重算。
  description_zh_hk: |
    統計功效同實驗規模：為檢測重要效應而設計

    假設A店試一個快取貨架，想縮短顧客等候時間。一個細規模試驗做完，結果唔顯著，呢個點子差啲就俾人放棄。但係可能只係試驗太細，根本睇唔出真實嘅改善。喺收數據之前，我哋點知一個檢驗捉唔捉到我哋在乎嘅改善？

    統計功效（statistical power）係當某個具體效應量 Delta 真係存在嗰陣，檢驗拒絕 H0 嘅機會。佢唔係研究嘅一個固定數字。換一個 Delta，功效就變。低功效之下嘅唔顯著結果，說明唔到乜嘢，唔可以證明呢個點子失敗咗。

    喺一個假設嘅例子入面，A店想要 80% 功效去捉到 10 秒嘅縮短，sigma = 20 秒，雙側 alpha = 0.05。用 z(alpha/2) = 1.96 同 z(beta) = 0.84，得到 n = ((1.96 + 0.84) × 20 / 10)² = 31.36，向上取整為 32 位獨立顧客。

    規則：睇數據之前先定好 Delta、alpha 同功效，將每個輸入寫低；最終設計變咗，就要重計。
