id: STAT-M05-T06-ZTEST
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The One-Sample Z-Test: Auditing a Mean with Known Process Variation'
title_zh: 单样本 Z 检验：在已知流程波动下审计均值
title_zh_hk: 單樣本 Z 檢驗：喺已知流程波動之下審計均值
objective_en: Formulate and execute a two-sided one-sample Z-test for a population mean when the population standard deviation
  is genuinely known, calculate the standard error, Z statistic, critical-value decision, and p-value, and separate evidence
  about the process mean from equipment diagnosis, compliance, and financial conclusions.
objective_zh: 在总体标准差确实已知时，构建并执行双侧单样本 Z 均值检验，计算标准误、Z 统计量、临界值决策与 p 值，并区分关于流程均值的统计证据与设备诊断、合规及财务结论。
objective_zh_hk: 喺總體標準差確實已知嗰陣，構建並執行雙側單樣本 Z 均值檢驗，計算標準誤、Z 統計量、臨界值決策同 p 值，並區分關於流程均值嘅統計證據同設備診斷、合規及財務結論。
