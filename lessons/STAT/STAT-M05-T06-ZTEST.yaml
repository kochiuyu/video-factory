quiz:
- id: Q1
  type: multiple_choice
  question_en: When is a one-sample Z-test for a population mean the right tool?
  question_zh: 检验一个总体均值时，什么情况下该用单样本 Z 检验？
  question_zh_hk: 檢驗一個總體均值嗰陣，乜嘢情況下應該用單樣本 Z 檢驗？
  options_en:
  - 'A: When the population standard deviation σ is genuinely known from a reliable source, and the sample mean is close to normal.'
  - 'B: Whenever the sample is large, because a large n turns the sample standard deviation s into a known σ.'
  - 'C: Only when the sample mean lands exactly on the target μ0.'
  - 'D: Whenever σ is unknown, by plugging in the s from this same sample and still calling it Z.'
  options_zh:
  - 'A: 总体标准差 σ 确实有可靠来源、是已知的，而且样本均值接近正态分布时。'
  - 'B: 只要样本够大就行，因为 n 大了，样本标准差 s 就变成已知的 σ。'
  - 'C: 只有样本均值刚好等于目标 μ0 时。'
  - 'D: σ 未知时，直接用这次样本算出的 s 代进去，照样叫 Z。'
  options_zh_hk:
  - 'A: 總體標準差 σ 確實有可靠來源、係已知嘅，而且樣本均值接近正態分佈嗰陣。'
  - 'B: 只要樣本夠大就得，因為 n 大咗，樣本標準差 s 就變成已知嘅 σ。'
  - 'C: 淨係喺樣本均值啱啱等於目標 μ0 嗰陣。'
  - 'D: σ 未知嗰陣，直接用今次樣本計出嘅 s 代入去，照樣叫 Z。'
  answer: A
  explanation_en: The defining condition is a known σ. A large sample can make the sample mean close to normal, but it does
    not turn an estimate s into a known σ. When σ is estimated from the sample, use the Student t approach in the next lesson,
    the t-test. C confuses the test with its result, and D hides the extra uncertainty from estimating σ.
  explanation_zh: 关键条件是 σ 已知。样本大可以让样本均值接近正态，但不会把估计出来的 s 变成已知的 σ。σ 要靠样本估计时，就该用学生 t 检验。C 把检验和结果混在一起；D 忽略了估计 σ 带来的额外不确定。
  explanation_zh_hk: 關鍵條件係 σ 已知。樣本大可以令樣本均值接近正態，但唔會將估計出嚟嘅 s 變成已知嘅 σ。σ 要靠樣本估計嗰陣，就應該用學生 t 檢驗。C 將檢驗同結果撈埋一齊；D 忽略咗估計 σ 帶嚟嘅額外不確定。
- id: Q2
  type: multiple_choice
  question_en: 'H0: μ = 250.0 g vs H1: μ ≠ 250.0 g, known σ = 4.0 g, n = 64, sample mean 251.25 g. What are Z and the decision
    at α = 0.05?'
  question_zh: 'H0: μ = 250.0 克 对 H1: μ ≠ 250.0 克，已知 σ = 4.0 克，n = 64，样本均值 251.25 克。在 α = 0.05 下，Z 和结论是什么？'
  question_zh_hk: 'H0: μ = 250.0 克 對 H1: μ ≠ 250.0 克，已知 σ = 4.0 克，n = 64，樣本均值 251.25 克。喺 α = 0.05 之下，Z 同結論係乜嘢？'
  options_en:
  - 'A: SE = 4.0 / √64 = 0.50 g; Z = 1.25 / 0.50 = 2.50; p ≈ 0.0124; reject H0.'
  - 'B: SE = 4.0 / 64 = 0.0625 g; Z = 1.25 / 0.0625 = 20.0; reject H0.'
  - 'C: Z = 1.25 / 4.0 = 0.3125; fail to reject H0.'
  - 'D: Z = 2.50, but the bags are heavier, not lighter, so a two-sided test does not reject.'
  options_zh:
  - 'A: SE = 4.0 / √64 = 0.50 克；Z = 1.25 / 0.50 = 2.50；p ≈ 0.0124；拒绝 H0。'
  - 'B: SE = 4.0 / 64 = 0.0625 克；Z = 1.25 / 0.0625 = 20.0；拒绝 H0。'
  - 'C: Z = 1.25 / 4.0 = 0.3125；不拒绝 H0。'
  - 'D: Z = 2.50，但袋子是偏重不是偏轻，所以双侧检验不拒绝。'
  options_zh_hk:
  - 'A: SE = 4.0 / √64 = 0.50 克；Z = 1.25 / 0.50 = 2.50；p ≈ 0.0124；拒絕 H0。'
  - 'B: SE = 4.0 / 64 = 0.0625 克；Z = 1.25 / 0.0625 = 20.0；拒絕 H0。'
  - 'C: Z = 1.25 / 4.0 = 0.3125；唔拒絕 H0。'
  - 'D: Z = 2.50，不過啲袋係偏重唔係偏輕，所以雙側檢驗唔拒絕。'
  answer: A
  explanation_en: SE = 4 / √64 = 4 / 8 = 0.50 g, so Z = 1.25 / 0.50 = 2.50. Since |Z| ≥ 1.96 and p ≈ 0.0124 ≤ 0.05, reject
    H0. B forgets the square root, C divides by σ instead of the standard error, and D forgets that a two-sided test counts
    both directions.
  explanation_zh: SE = 4 / √64 = 4 / 8 = 0.50 克，所以 Z = 1.25 / 0.50 = 2.50。|Z| ≥ 1.96，p ≈ 0.0124 ≤ 0.05，拒绝 H0。B 忘了开根号；C 除的是 σ 而不是标准误；D 忘了双侧检验两个方向都算。
  explanation_zh_hk: SE = 4 / √64 = 4 / 8 = 0.50 克，所以 Z = 1.25 / 0.50 = 2.50。|Z| ≥ 1.96，p ≈ 0.0124 ≤ 0.05，拒絕 H0。B 唔記得開方；C 除嘅係 σ 而唔係標準誤；D 唔記得雙側檢驗兩個方向都計。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The bag that weighs a little too much
  kicker_zh: 每袋多一点点
  kicker_zh_hk: 每袋多少少
  title_en: Are the bags really off target?
  title_zh: 豆袋真的偏离目标了吗？
  title_zh_hk: 啲豆袋真係偏離目標咗？
  en: >-
    Suppose Shop A fills coffee-bean bags with a target of 250 grams each. Too light, and customers are short-changed. Too
    heavy, and the shop gives beans away on every bag. A check of 64 bags averages 251.25 grams. Is that a real shift, or
    just the normal wobble of a sample? These are made-up teaching numbers.
  zh: >-
    假设A店给咖啡豆装袋，每袋目标 250 克。装少了，顾客吃亏；装多了，店里每袋都在白送豆子。抽查 64 袋，平均 251.25 克。这是真的偏了，还是样本正常的晃动？下面都是教学用的假设数字。
  zh_hk: >-
    假設A店幫咖啡豆入袋，每袋目標 250 克。入少咗，顧客蝕底；入多咗，間舖每袋都喺度白送豆。抽查 64 袋，平均 251.25 克。係真係偏咗，定係樣本正常嘅晃動？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Use Z when σ is known
  title_zh: σ 已知时用 Z
  title_zh_hk: σ 已知嗰陣用 Z
  formula: 'Z = (mean − μ0) / (σ / √n)'
  formula_zh: 'Z = (样本均值 − μ0) / (σ / √n)'
  formula_zh_hk: 'Z = (樣本均值 − μ0) / (σ / √n)'
  formula_tex: 'H_0:\ \mu = \mu_0 \qquad H_1:\ \mu \ne \mu_0 \qquad Z = \frac{\bar{X} - \mu_0}{\sigma/\sqrt{n}}'
  s1_en: >-
    The null hypothesis H0 says the true average fill is still the target, mu zero. The alternative H1 says it has moved,
    up or down. Both directions matter here, so the test is two-sided, and we choose that before looking at the data.
  s1_zh: >-
    原假设 H0 说，真实的平均装量还是目标 mu 零；备择假设 H1 说它变了，偏高或偏低都算。两个方向都要紧，所以是双侧检验，而且要在看数据之前就定好。
  s1_zh_hk: >-
    原假設 H0 話，真實嘅平均裝量仲係目標 mu 零；備擇假設 H1 話佢變咗，偏高定偏低都算。兩個方向都要緊，所以係雙側檢驗，而且要喺睇數據之前就定好。
  s2_en: >-
    Z is the gap between the sample mean, x-bar, and the target, divided by the standard error, sigma over root n. The
    key condition is a genuinely known sigma, say from long machine records. A big sample does not make it known.
  s2_zh: >-
    Z 就是把样本均值（x-bar）和目标的差距，除以标准误，也就是 sigma 除以根号 n。关键条件是：总体标准差 sigma 真的已知，比如来自机器长期的记录。样本再大，也不会让未知的 sigma 变成已知。
  s2_zh_hk: >-
    Z 即係將樣本均值（x-bar）同目標嘅差距，除以標準誤，即係 sigma 除以根號 n。關鍵條件係：總體標準差 sigma 真係已知，例如嚟自部機長期嘅記錄。樣本幾大都好，都唔會令未知嘅 sigma 變成已知。
- id: name_ztest
  visual: title_card
  seconds: 16
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: One-sample Z-test
  title_zh: 单样本 Z 检验
  title_zh_hk: 單樣本 Z 檢驗
  en: >-
    Say the name once more. A one-sample Z-test checks one group's mean against a fixed target, using a known sigma.
  zh: >-
    再念一次这个名字。单样本 Z 检验（one-sample Z-test），就是用已知的 sigma，拿一组数据的均值去和一个固定目标比。
  zh_hk: >-
    再唸一次呢個名。單樣本 Z 檢驗（one-sample Z-test），即係用已知嘅 sigma，攞一組數據嘅均值同一個固定目標比。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: Two ways to decide
  kicker_zh: 两种判法
  kicker_zh_hk: 兩種判法
  title_en: Critical value and p-value agree
  title_zh: 临界值和 p 值结论一致
  title_zh_hk: 臨界值同 p 值結論一致
  left_en: 'Cutoff: Z past ±1.96'
  left_zh: 临界值：Z 越过 ±1.96
  left_zh_hk: 臨界值：Z 越過 ±1.96
  right_en: 'p-value: p ≤ α'
  right_zh: p 值：p ≤ α
  right_zh_hk: p 值：p ≤ α
  s1_en: >-
    At a significance level alpha of 0.05, two-sided, the critical values are minus and plus 1.96. If Z lands beyond either
    one, it falls in the rejection region, and we reject H0. The sign only tells us the direction.
  s1_zh: >-
    显著性水平 alpha 取 0.05、双侧时，临界值是负 1.96 和正 1.96。Z 只要越过其中一边，就落进拒绝域，我们就拒绝 H0。正负号只告诉我们方向。
  s1_zh_hk: >-
    顯著性水平 alpha 取 0.05、雙側嗰陣，臨界值係負 1.96 同正 1.96。Z 只要越過其中一邊，就跌入拒絕域，我哋就拒絕 H0。正負號淨係話畀我哋知方向。
  s2_en: >-
    The p-value asks the same question another way: if H0 were true, how often would a Z at least this far from zero, on
    either side, show up? With the same alpha, the two rules always give the same answer.
  s2_zh: >-
    p 值是换个方式问同一个问题：如果 H0 成立，离零至少这么远的 Z，不管哪一边，会多常出现？alpha 一样的话，两种规则的结论永远一致。
  s2_zh_hk: >-
    p 值係換個方式問同一個問題：如果 H0 成立，離零至少咁遠嘅 Z，唔理邊一邊，會幾常出現？alpha 一樣嘅話，兩種規則嘅結論永遠一致。
  s3_en: >-
    Rejecting H0 is a statement about the average fill. It does not prove the machine is broken, or say how much money is
    lost. Those need their own checks. And not rejecting does not prove the target is met.
  s3_zh: >-
    拒绝 H0，说的只是平均装量。它不能证明机器坏了，也说不出亏了多少钱，那些要另外查。反过来，不拒绝 H0 也不等于证明达标了。
  s3_zh_hk: >-
    拒絕 H0，講嘅只係平均裝量。佢證明唔到部機壞咗，亦講唔出蝕咗幾多錢，嗰啲要另外查。倒轉嚟講，唔拒絕 H0 亦唔等於證明達標。
- id: ledger
  visual: steps
  layout: rows
  seconds: 100
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: 64 bags'
  title_zh: A店：64 袋豆
  title_zh_hk: A店：64 袋豆
  step1_en: 'H0: μ = 250.0 vs H1: μ ≠ 250.0'
  step1_zh: 'H0: μ = 250.0 对 H1: μ ≠ 250.0'
  step1_zh_hk: 'H0: μ = 250.0 對 H1: μ ≠ 250.0'
  step2_en: 'SE = 4.0 / √64 = 0.50 g'
  step2_zh: 'SE = 4.0 / √64 = 0.50 克'
  step2_zh_hk: 'SE = 4.0 / √64 = 0.50 克'
  step3_en: 'Z = 1.25 / 0.50 = 2.50'
  step3_zh: 'Z = 1.25 / 0.50 = 2.50'
  step3_zh_hk: 'Z = 1.25 / 0.50 = 2.50'
  step4_en: '|Z| = 2.50 ≥ 1.96; p ≈ 0.0124'
  step4_zh: '|Z| = 2.50 ≥ 1.96；p ≈ 0.0124'
  step4_zh_hk: '|Z| = 2.50 ≥ 1.96；p ≈ 0.0124'
  step5_en: 'Reject H0 at α = 0.05'
  step5_zh: '在 α = 0.05 下拒绝 H0'
  step5_zh_hk: '喺 α = 0.05 之下拒絕 H0'
  s1_en: >-
    Start with the hypotheses. H0 says the true average is 250 grams. H1 says it is not, in either direction. The machine
    records give a known sigma of 4 grams, and we weigh 64 independent bags.
  s1_zh: >-
    先写假设。H0：真实平均是 250 克；H1：不是 250 克，偏哪边都算。机器记录给出已知的 sigma 是 4 克，我们称了 64 袋独立的豆子。
  s1_zh_hk: >-
    先寫假設。H0：真實平均係 250 克；H1：唔係 250 克，偏邊邊都算。部機嘅記錄畀出已知嘅 sigma 係 4 克，我哋磅咗 64 袋獨立嘅豆。
  s2_en: >-
    Next, the standard error, how much an average of 64 bags usually wobbles. The square root of 64 is 8, and 4 divided by
    8 is 0.50 grams.
  s2_zh: >-
    接着算标准误，也就是 64 袋的平均通常会晃多少。根号 64 是 8，4 除以 8，等于 0.50 克。
  s2_zh_hk: >-
    跟住計標準誤，即係 64 袋嘅平均通常會晃幾多。根號 64 係 8，4 除 8，等於 0.50 克。
  s3_en: >-
    Now measure the gap in that unit. The sample mean, 251.25, minus the target 250, is 1.25 grams. Divided by 0.50, Z is
    2.50. The sample sits two and a half standard errors above the target.
  s3_zh: >-
    再用这个单位去量差距。样本均值 251.25 减去目标 250，差 1.25 克，除以 0.50，Z 等于 2.50。样本落在目标上方两个半标准误。
  s3_zh_hk: >-
    再用呢個單位去量差距。樣本均值 251.25 減目標 250，差 1.25 克，除 0.50，Z 等於 2.50。樣本落喺目標上面兩個半標準誤。
  s4_en: >-
    Compare. 2.50 is past the critical value 1.96, and the two-sided p-value is about 0.0124, below 0.05. Both rules say
    the same thing.
  s4_zh: >-
    比一比。2.50 越过了临界值 1.96，双侧 p 值大约 0.0124，比 0.05 小。两种规则说的是同一件事。
  s4_zh_hk: >-
    比一比。2.50 越過咗臨界值 1.96，雙側 p 值大約 0.0124，細過 0.05。兩種規則講緊同一件事。
  s5_en: >-
    So we reject H0 at the 5 percent level. The evidence says the average fill has moved, and the bags run heavy. Why,
    and what to do about it, is a separate question.
  s5_zh: >-
    所以，在 5% 的水平下拒绝 H0。证据显示平均装量偏了，而且是偏重。至于为什么、要怎么处理，是另一个问题。
  s5_zh_hk: >-
    所以，喺 5% 嘅水平之下拒絕 H0。證據顯示平均裝量偏咗，而且係偏重。至於點解、要點處理，係另一個問題。
- id: takeaway
  visual: takeaway
  seconds: 66
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Use Z only with a known σ
  title_zh: σ 已知才用 Z
  title_zh_hk: σ 已知先用 Z
  q1_en: What makes a Z-test different from a t-test?
  q1_zh: Z 检验和 t 检验差在哪里？
  q1_zh_hk: Z 檢驗同 t 檢驗差喺邊？
  q2_en: What should the shop do after rejecting H0?
  q2_zh: 拒绝 H0 之后，店里还要做什么？
  q2_zh_hk: 拒絕 H0 之後，間舖仲要做乜嘢？
  s1_en: >-
    Use a Z-test when sigma is genuinely known. If sigma has to be estimated from the same sample, that adds extra
    uncertainty, and the Student t-test in the next lesson handles it.
  s1_zh: >-
    sigma 真的已知，才用 Z 检验。如果 sigma 要从同一个样本估出来，就多了一层不确定，要改用下一课的学生 t 检验。
  s1_zh_hk: >-
    sigma 真係已知，先用 Z 檢驗。如果 sigma 要由同一個樣本估出嚟，就多咗一層不確定，要改用下一課嘅學生 t 檢驗。
  s2_en: >-
    After rejecting, report the gap, the standard error, Z, and the p-value. Then check the scale is calibrated, look at
    single bags and how steady the line is, and compare the size of the gap with its cost.
  s2_zh: >-
    拒绝之后，要报告差距、标准误、Z 和 p 值。然后检查秤准不准，看看单袋重量和产线稳不稳定，再把差距的大小和它的成本比一比。
  s2_zh_hk: >-
    拒絕之後，要報告差距、標準誤、Z 同 p 值。之後檢查個磅準唔準，睇吓單袋重量同條線穩唔穩定，再將差距嘅大細同佢嘅成本比一比。
  s3_en: >-
    So, are Shop A's bags off target? With Z equal to 2.50 and p about 0.0124, yes, the average runs heavy. That is
    evidence of a shift, not proof of its cause.
  s3_zh: >-
    所以，A店的豆袋偏离目标了吗？Z 等于 2.50，p 大约 0.0124，是的，平均偏重了。这是偏移的证据，不是原因的证明。
  s3_zh_hk: >-
    所以，A店啲豆袋偏離目標咗未？Z 等於 2.50，p 大約 0.0124，係，平均偏重咗。呢個係偏移嘅證據，唔係原因嘅證明。
