title_en: 'The One-Sample Z-Test: Known σ'
title_zh: 单样本 Z 检验：σ 已知时检验均值
title_zh_hk: 單樣本 Z 檢驗：σ 已知時檢驗均值
objective_en: Formulate and execute a two-sided one-sample Z-test for a population mean when the population standard deviation
  is genuinely known, calculate the standard error, Z statistic, critical-value decision, and p-value, and separate evidence
  about the process mean from equipment diagnosis, compliance, and financial conclusions.
objective_zh: 在总体标准差确实已知时，构建并执行双侧单样本 Z 均值检验，计算标准误、Z 统计量、临界值决策与 p 值，并区分关于流程均值的统计证据与设备诊断、合规及财务结论。
objective_zh_hk: 喺總體標準差確實已知嗰陣，構建並執行雙側單樣本 Z 均值檢驗，計算標準誤、Z 統計量、臨界值決策同 p 值，並區分關於流程均值嘅統計證據同設備診斷、合規及財務結論。
youtube:
  description_en: |
    The One-Sample Z-Test: Known σ

    Suppose Shop A fills coffee-bean bags with a target of 250 grams each. Too light, and customers are short-changed. Too heavy, and the shop gives beans away on every bag. A check of 64 bags averages 251.25 grams. Is that a real shift, or just sample wobble?

    A one-sample Z-test checks one group's mean against a fixed target when the population standard deviation sigma is known. The test statistic is Z = (mean − mu0) / (sigma / √n). Both directions matter here, so the test is two-sided.

    In an assumed example, SE = 4.0 / √64 = 0.50 g, so Z = 1.25 / 0.50 = 2.50. That clears the 1.96 cutoff, and the two-sided p-value is about 0.0124. At alpha = 0.05 we reject H0: mu = 250.0. The average runs heavy.

    Rule: this is evidence about the process mean under a known sigma, not a diagnosis of the filler, a compliance finding, or a financial conclusion.
  description_zh: |
    单样本 Z 检验：σ 已知时检验均值

    假设A店给咖啡豆装袋，每袋目标 250 克。装少了，顾客吃亏；装多了，店里每袋都在白送豆子。抽查 64 袋，平均 251.25 克。这是真的偏了，还是样本正常的晃动？

    单样本 Z 检验（one-sample Z-test）在总体标准差 sigma 已知时，拿一组数据的均值去和一个固定目标比。检验统计量是 Z = (均值 − mu0) / (sigma / √n)。这里两个方向都重要，所以用双侧检验。

    在一个假设的例子里，标准误 = 4.0 / √64 = 0.50 克，于是 Z = 1.25 / 0.50 = 2.50，越过 1.96，双侧 p 值大约 0.0124。在 alpha = 0.05 下拒绝 H0: mu = 250.0，平均偏重。

    规则：这是在 sigma 已知前提之下关于流程均值的证据，不是灌装机诊断、合规结论，也不是财务判断。
  description_zh_hk: |
    單樣本 Z 檢驗：σ 已知時檢驗均值

    假設A店幫咖啡豆入袋，每袋目標 250 克。入少咗，顧客蝕底；入多咗，間舖每袋都喺度白送豆。抽查 64 袋，平均 251.25 克。係真係偏咗，定係樣本正常嘅晃動？

    單樣本 Z 檢驗（one-sample Z-test）喺總體標準差 sigma 已知嗰陣，攞一組數據嘅均值去同一個固定目標比。檢驗統計量係 Z = (均值 − mu0) / (sigma / √n)。呢度兩個方向都重要，所以用雙側檢驗。

    喺一個假設嘅例子入面，標準誤 = 4.0 / √64 = 0.50 克，於是 Z = 1.25 / 0.50 = 2.50，越過 1.96，雙側 p 值大約 0.0124。喺 alpha = 0.05 之下拒絕 H0: mu = 250.0，平均偏重。

    規則：呢個係喺 sigma 已知前提之下關於流程均值嘅證據，唔係灌裝機診斷、合規結論，亦唔係財務判斷。
