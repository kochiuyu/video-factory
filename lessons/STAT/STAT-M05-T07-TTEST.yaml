quiz:
- id: Q1
  type: multiple_choice
  question_en: Why does a one-sample mean test use Student's t when the population σ is unknown?
  question_zh: σ 未知时，检验一个总体均值为什么要用学生 t 分布？
  question_zh_hk: σ 未知嗰陣，檢驗一個總體均值點解要用學生 t 分佈？
  options_en:
  - 'A: Because estimating σ with the sample s adds extra uncertainty to the standard error, so the statistic follows a t distribution with n − 1 degrees of freedom.'
  - 'B: Because the sample mean is above the target, and t is the test for a gap in one direction.'
  - 'C: Because t gives a smaller critical value than Z, so a real shift is easier to detect.'
  - 'D: Because once n is 20 or more, the sample s equals the true σ exactly.'
  options_zh:
  - 'A: 因为用样本标准差 s 去估计 σ，给标准误多加了一层不确定，所以统计量服从自由度为 n − 1 的 t 分布。'
  - 'B: 因为样本均值高于目标，而 t 检验是专门检验单一方向差距的。'
  - 'C: 因为 t 的临界值比 Z 小，比较容易发现真正的偏移。'
  - 'D: 因为 n 到了 20 以上，样本的 s 就刚好等于真实的 σ。'
  options_zh_hk:
  - 'A: 因為用樣本標準差 s 去估計 σ，畀標準誤多加咗一層不確定，所以統計量服從自由度係 n − 1 嘅 t 分佈。'
  - 'B: 因為樣本均值高過目標，而 t 檢驗係專門檢驗單一方向差距嘅。'
  - 'C: 因為 t 嘅臨界值細過 Z，比較容易搵到真正嘅偏移。'
  - 'D: 因為 n 去到 20 以上，樣本嘅 s 就啱啱等於真實嘅 σ。'
  answer: A
  explanation_en: When σ is unknown and estimated with s, the standardized mean follows Student's t distribution under the
    normal-population model, with df = n − 1. B confuses the test with the direction of H1, C has it backwards (the t cutoff
    is wider), and D treats an estimate as the true value.
  explanation_zh: σ 未知、要用 s 来估计时，在正态总体模型下，标准化的均值服从自由度为 n − 1 的学生 t 分布。B 把检验和 H1 的方向混在一起；C 说反了，t 的临界值更宽；D 把估计值当成了真实值。
  explanation_zh_hk: σ 未知、要用 s 嚟估計嗰陣，喺正態總體模型之下，標準化嘅均值服從自由度係 n − 1 嘅學生 t 分佈。B 將檢驗同 H1 嘅方向撈埋一齊；C 講反咗，t 嘅臨界值更闊；D 將估計值當咗做真實值。
- id: Q2
  type: multiple_choice
  question_en: 'H0: μ = 45.0 s vs H1: μ ≠ 45.0 s, n = 20, sample mean 48.2 s, s = 6.0 s. With df = 19 and critical value
    2.093, what is the decision at α = 0.05?'
  question_zh: 'H0: μ = 45.0 秒 对 H1: μ ≠ 45.0 秒，n = 20，样本均值 48.2 秒，s = 6.0 秒。自由度 19、临界值 2.093，在 α = 0.05 下结论是什么？'
  question_zh_hk: 'H0: μ = 45.0 秒 對 H1: μ ≠ 45.0 秒，n = 20，樣本均值 48.2 秒，s = 6.0 秒。自由度 19、臨界值 2.093，喺 α = 0.05 之下結論係乜嘢？'
  options_en:
  - 'A: SE = 6.0 / √20 ≈ 1.342 s; t ≈ 2.385; p ≈ 0.0276; reject H0 because |t| ≥ 2.093.'
  - 'B: SE = 6.0 / 20 = 0.30 s; t ≈ 10.67; fail to reject H0.'
  - 'C: t = 3.2 / 6.0 ≈ 0.533; fail to reject H0.'
  - 'D: t ≈ 2.385; fail to reject H0, because it is below the cutoff 2.576.'
  options_zh:
  - 'A: SE = 6.0 / √20 ≈ 1.342 秒；t ≈ 2.385；p ≈ 0.0276；因为 |t| ≥ 2.093，拒绝 H0。'
  - 'B: SE = 6.0 / 20 = 0.30 秒；t ≈ 10.67；不拒绝 H0。'
  - 'C: t = 3.2 / 6.0 ≈ 0.533；不拒绝 H0。'
  - 'D: t ≈ 2.385；因为小于临界值 2.576，不拒绝 H0。'
  options_zh_hk:
  - 'A: SE = 6.0 / √20 ≈ 1.342 秒；t ≈ 2.385；p ≈ 0.0276；因為 |t| ≥ 2.093，拒絕 H0。'
  - 'B: SE = 6.0 / 20 = 0.30 秒；t ≈ 10.67；唔拒絕 H0。'
  - 'C: t = 3.2 / 6.0 ≈ 0.533；唔拒絕 H0。'
  - 'D: t ≈ 2.385；因為細過臨界值 2.576，唔拒絕 H0。'
  answer: A
  explanation_en: SE = 6 / √20 ≈ 1.342 s, so t = 3.2 / 1.342 ≈ 2.385. With df = 19 the two-sided 5% cutoff is 2.093, and
    p ≈ 0.0276 ≤ 0.05, so reject H0. B forgets the square root (and its decision does not even follow), C divides by s
    instead of the standard error, and D uses the 1% normal cutoff instead of the t cutoff for α = 0.05.
  explanation_zh: SE = 6 / √20 ≈ 1.342 秒，所以 t = 3.2 / 1.342 ≈ 2.385。自由度 19 时，双侧 5% 临界值是 2.093，p ≈ 0.0276 ≤ 0.05，拒绝 H0。B 忘了开根号，结论也对不上；C 除的是 s 而不是标准误；D 用了正态 1% 的临界值，而不是 α = 0.05 的 t 临界值。
  explanation_zh_hk: SE = 6 / √20 ≈ 1.342 秒，所以 t = 3.2 / 1.342 ≈ 2.385。自由度 19 嗰陣，雙側 5% 臨界值係 2.093，p ≈ 0.0276 ≤ 0.05，拒絕 H0。B 唔記得開方，結論都對唔上；C 除嘅係 s 而唔係標準誤；D 用咗正態 1% 嘅臨界值，而唔係 α = 0.05 嘅 t 臨界值。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The pastry that waits a little too long
  kicker_zh: 每个牛角包慢一点点
  kicker_zh_hk: 每個牛角包慢少少
  title_en: Is warming really slower?
  title_zh: 加热真的变慢了吗？
  title_zh_hk: 加熱真係慢咗？
  en: >-
    Suppose Shop A promises to warm each pastry in 45 seconds on average. Call it slow when it is not, and the shop wastes
    money fixing a working line. Miss a real slowdown, and the morning queue keeps growing. A sample of 20 orders averages
    48.2 seconds. Is that a real shift, or just sample wobble? These are made-up teaching numbers.
  zh: >-
    假设A店承诺，每个牛角包平均 45 秒加热好。明明没变慢却说慢了，店里就白花钱去修一条好好的流程；真的变慢了却没发现，早上的队就越排越长。抽查 20 单，平均 48.2 秒。这是真的慢了，还是样本正常的晃动？下面都是教学用的假设数字。
  zh_hk: >-
    假設A店承諾，每個牛角包平均 45 秒加熱好。明明冇慢咗都話慢，間舖就白白使錢去整一條好地地嘅流程；真係慢咗又睇唔到，朝早條隊就越排越長。抽查 20 單，平均 48.2 秒。係真係慢咗，定係樣本正常嘅晃動？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Use t when σ is unknown
  title_zh: σ 未知时用 t
  title_zh_hk: σ 未知嗰陣用 t
  formula: 't = (mean − μ0) / (s / √n), df = n − 1'
  formula_zh: 't = (样本均值 − μ0) / (s / √n)，df = n − 1'
  formula_zh_hk: 't = (樣本均值 − μ0) / (s / √n)，df = n − 1'
  formula_tex: 'H_0:\ \mu = \mu_0 \qquad H_1:\ \mu \ne \mu_0 \qquad t = \frac{\bar{X} - \mu_0}{s/\sqrt{n}}'
  s1_en: >-
    The null hypothesis H0 says the true average warming time is still the promise, mu zero, 45 seconds. The alternative
    H1 says it has moved, up or down. We choose two-sided before looking at the data.
  s1_zh: >-
    原假设 H0 说，真实的平均加热时间还是承诺的 mu 零，也就是 45 秒；备择假设 H1 说它变了，偏快偏慢都算。双侧，要在看数据之前就定好。
  s1_zh_hk: >-
    原假設 H0 話，真實嘅平均加熱時間仲係承諾嘅 mu 零，即係 45 秒；備擇假設 H1 話佢變咗，快咗慢咗都算。雙側，要喺睇數據之前就定好。
  s2_en: >-
    Last lesson, the Z-test used a known sigma. Here nobody knows sigma, so we estimate it with s, the standard deviation
    of this same sample. The gap between the sample mean, x-bar, and mu zero, divided by s over root n, is called t.
  s2_zh: >-
    上一课的 Z 检验用的是已知的 sigma。这里没人知道 sigma，只好用同一个样本算出来的样本标准差 s 去估计。样本均值（x-bar）和 mu 零的差距，除以 s 除以根号 n，就叫 t。
  s2_zh_hk: >-
    上一課嘅 Z 檢驗用嘅係已知嘅 sigma。呢度冇人知 sigma，唯有用同一個樣本計出嚟嘅樣本標準差 s 去估計。樣本均值（x-bar）同 mu 零嘅差距，除以 s 除根號 n，就叫做 t。
- id: name_ttest
  visual: title_card
  seconds: 16
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: One-sample t-test
  title_zh: 单样本 t 检验
  title_zh_hk: 單樣本 t 檢驗
  en: >-
    Say the name once more. A one-sample t-test checks one group's mean against a fixed target, when sigma has to be
    estimated from the sample.
  zh: >-
    再念一次这个名字。单样本 t 检验（one-sample t-test），就是 sigma 要靠样本估计时，拿一组数据的均值去和一个固定目标比。
  zh_hk: >-
    再唸一次呢個名。單樣本 t 檢驗（one-sample t-test），即係 sigma 要靠樣本估計嗰陣，攞一組數據嘅均值同一個固定目標比。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: Why the cutoff moves
  kicker_zh: 临界值为什么变了
  kicker_zh_hk: 臨界值點解變咗
  title_en: t has wider cutoffs than Z
  title_zh: t 的临界值比 Z 宽
  title_zh_hk: t 嘅臨界值比 Z 闊
  left_en: 'Z: σ is known'
  left_zh: Z：σ 已知
  left_zh_hk: Z：σ 已知
  right_en: 't: σ estimated by s'
  right_zh: t：用 s 估计 σ
  right_zh_hk: t：用 s 估計 σ
  s1_en: >-
    With a known sigma, the two-sided 5 percent critical values are minus and plus 1.96. But s is itself a guess, and it
    wobbles from sample to sample. That extra wobble gives the t distribution, Student's t, heavier tails than the normal
    curve.
  s1_zh: >-
    sigma 已知时，双侧 5% 的临界值是负 1.96 和正 1.96。可是 s 本身也是估出来的，每次抽样都会晃。多出来的这层晃动，让 t 分布，也就是学生 t 分布，尾巴比正态曲线更厚。
  s1_zh_hk: >-
    sigma 已知嗰陣，雙側 5% 嘅臨界值係負 1.96 同正 1.96。不過 s 本身都係估出嚟嘅，每次抽樣都會晃。多出嚟呢層晃動，令 t 分佈，即係學生 t 分佈，條尾比正態曲線更厚。
  s2_en: >-
    How heavy depends on the degrees of freedom, df, which here is n minus one. With 20 orders, df is 19, and the critical
    values move out to about 2.093. More data, more degrees of freedom, and t gets closer to Z.
  s2_zh: >-
    厚多少，要看自由度（df），这里是 n 减 1。20 单的话，自由度是 19，临界值就往外推到大约 2.093。数据越多，自由度越大，t 就越接近 Z。
  s2_zh_hk: >-
    厚幾多，要睇自由度（df），呢度係 n 減 1。20 單嘅話，自由度係 19，臨界值就推出去大約 2.093。數據越多，自由度越大，t 就越似 Z。
  s3_en: >-
    The wider cutoff only covers the guess in s. It cannot fix a bad sample. The orders should be independent and
    represent the morning, and with only 20 orders, check for strong skew or one extreme order that drags both the mean
    and s.
  s3_zh: >-
    更宽的临界值，只照顾 s 是估出来的这一点，救不了坏样本。订单要互相独立，能代表早市；只有 20 单的话，还要看看有没有严重偏斜，或者一单特别离谱、把均值和 s 一起拉歪。
  s3_zh_hk: >-
    更闊嘅臨界值，淨係照顧到 s 係估出嚟呢一點，救唔到壞樣本。啲訂單要互相獨立，代表到朝早；得 20 單嘅話，仲要睇吓有冇嚴重偏斜，或者有一單特別離譜，將均值同 s 一齊拉歪。
- id: ledger
  visual: steps
  layout: rows
  seconds: 100
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: 20 orders'
  title_zh: A店：20 单
  title_zh_hk: A店：20 單
  step1_en: 'H0: μ = 45.0 vs H1: μ ≠ 45.0'
  step1_zh: 'H0: μ = 45.0 对 H1: μ ≠ 45.0'
  step1_zh_hk: 'H0: μ = 45.0 對 H1: μ ≠ 45.0'
  step2_en: 'SE = 6.0 / √20 ≈ 1.342 s'
  step2_zh: 'SE = 6.0 / √20 ≈ 1.342 秒'
  step2_zh_hk: 'SE = 6.0 / √20 ≈ 1.342 秒'
  step3_en: 't = 3.2 / 1.342 ≈ 2.385'
  step3_zh: 't = 3.2 / 1.342 ≈ 2.385'
  step3_zh_hk: 't = 3.2 / 1.342 ≈ 2.385'
  step4_en: '|t| ≥ 2.093; p ≈ 0.0276'
  step4_zh: '|t| ≥ 2.093；p ≈ 0.0276'
  step4_zh_hk: '|t| ≥ 2.093；p ≈ 0.0276'
  step5_en: 'Reject H0 at α = 0.05'
  step5_zh: '在 α = 0.05 下拒绝 H0'
  step5_zh_hk: '喺 α = 0.05 之下拒絕 H0'
  s1_en: >-
    Start with the hypotheses. H0 says the true average is 45 seconds. H1 says it is not, in either direction. We time 20
    independent orders. The sample mean is 48.2 seconds, and s, the sample standard deviation, is 6.0 seconds.
  s1_zh: >-
    先写假设。H0：真实平均是 45 秒；H1：不是 45 秒，偏哪边都算。我们计时了 20 张独立的订单，样本均值 48.2 秒，样本标准差 s 是 6.0 秒。
  s1_zh_hk: >-
    先寫假設。H0：真實平均係 45 秒；H1：唔係 45 秒，偏邊邊都算。我哋計咗 20 張獨立訂單嘅時間，樣本均值 48.2 秒，樣本標準差 s 係 6.0 秒。
  s2_en: >-
    Next, the estimated standard error, how much an average of 20 orders usually wobbles. The square root of 20 is about
    4.47, and 6.0 divided by that is about 1.342 seconds.
  s2_zh: >-
    接着算估计的标准误，也就是 20 单的平均通常会晃多少。根号 20 大约 4.47，6.0 除以它，大约 1.342 秒。
  s2_zh_hk: >-
    跟住計估計嘅標準誤，即係 20 單嘅平均通常會晃幾多。根號 20 大約 4.47，6.0 除佢，大約 1.342 秒。
  s3_en: >-
    Now measure the gap in that unit. 48.2 minus 45 is 3.2 seconds. Divided by 1.342, t is about 2.385. The sample sits
    almost two and a half standard errors above the promise.
  s3_zh: >-
    再用这个单位去量差距。48.2 减 45，差 3.2 秒，除以 1.342，t 大约 2.385。样本落在承诺上方差不多两个半标准误。
  s3_zh_hk: >-
    再用呢個單位去量差距。48.2 減 45，差 3.2 秒，除 1.342，t 大約 2.385。樣本落喺承諾上面差唔多兩個半標準誤。
  s4_en: >-
    Compare. With 19 degrees of freedom, the critical value is 2.093, and 2.385 is past it. The two-sided p-value is about
    0.0276, below 0.05. Both rules agree.
  s4_zh: >-
    比一比。自由度 19，临界值是 2.093，2.385 越过了它。双侧 p 值大约 0.0276，比 0.05 小。两种规则说的是同一件事。
  s4_zh_hk: >-
    比一比。自由度 19，臨界值係 2.093，2.385 越過咗佢。雙側 p 值大約 0.0276，細過 0.05。兩種規則講緊同一件事。
  s5_en: >-
    So we reject H0 at the 5 percent level. The evidence says the average warming time has moved, and it runs slow. It
    does not say why, and it says nothing about any one worker.
  s5_zh: >-
    所以，在 5% 的水平下拒绝 H0。证据显示平均加热时间变了，而且是变慢。它说不出原因，更不能用来评价哪一位员工。
  s5_zh_hk: >-
    所以，喺 5% 嘅水平之下拒絕 H0。證據顯示平均加熱時間變咗，而且係變慢。佢講唔出原因，更加唔可以攞嚟評價邊一位員工。
- id: takeaway
  visual: takeaway
  seconds: 66
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Unknown σ? Use t
  title_zh: σ 未知就用 t
  title_zh_hk: σ 未知就用 t
  q1_en: Why does using s for σ widen the cutoff?
  q1_zh: 为什么用 s 估计 σ 会改变临界值？
  q1_zh_hk: 點解用 s 估計 σ 會改變臨界值？
  q2_en: What to check after rejecting H0?
  q2_zh: 拒绝 H0 之后，店里还要查什么？
  q2_zh_hk: 拒絕 H0 之後，間舖仲要查乜嘢？
  s1_en: >-
    Estimating sigma from the same sample adds randomness to the bottom of the fraction. So under the normal model the
    statistic follows a t distribution, and the degrees of freedom decide how much wider its cutoffs are than Z's.
  s1_zh: >-
    用同一个样本去估 sigma，等于给分母多加了随机性。所以在正态模型下，统计量服从 t 分布，自由度决定它的临界值比 Z 宽多少。
  s1_zh_hk: >-
    用同一個樣本去估 sigma，等於畀分母多加咗隨機性。所以喺正態模型之下，統計量服從 t 分佈，自由度決定佢嘅臨界值比 Z 闊幾多。
  s2_en: >-
    After rejecting, report the gap, the standard error, t, the degrees of freedom, and the p-value. Then check the
    timestamps, the equipment, the order mix, and how steady the line is, before choosing a fix.
  s2_zh: >-
    拒绝之后，要报告差距、标准误、t、自由度和 p 值。然后检查计时准不准、设备、订单组合，还有流程稳不稳定，再决定怎么改。
  s2_zh_hk: >-
    拒絕之後，要報告差距、標準誤、t、自由度同 p 值。之後檢查計時準唔準、設備、訂單組合，仲有流程穩唔穩定，先至決定點樣改。
  s3_en: >-
    So, is Shop A's warming really slower? With t about 2.385, 19 degrees of freedom, and p about 0.0276, yes, the average
    runs slow. That is evidence about the process mean, not proof of a cause or of anyone's fault.
  s3_zh: >-
    所以，A店的加热真的变慢了吗？t 大约 2.385，自由度 19，p 大约 0.0276，是的，平均变慢了。这是关于流程均值的证据，不是原因的证明，也不是谁的过错。
  s3_zh_hk: >-
    所以，A店嘅加熱真係慢咗？t 大約 2.385，自由度 19，p 大約 0.0276，係，平均慢咗。呢個係關於流程均值嘅證據，唔係原因嘅證明，亦唔係邊個嘅錯。
