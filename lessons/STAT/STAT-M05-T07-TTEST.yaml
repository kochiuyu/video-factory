id: STAT-M05-T07-TTEST
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The One-Sample t-Test: Testing a Mean with Unknown Variance'
title_zh: 单样本 t 检验：在方差未知时检验均值
title_zh_hk: 單樣本 t 檢驗：喺方差未知嗰陣檢驗均值
objective_en: Formulate and execute a two-sided one-sample t-test for a population mean when variance is unknown, calculate
  the estimated standard error, t statistic, degrees of freedom, critical-value decision, and p-value, and distinguish statistical
  evidence about a mean from operational diagnosis or employee-level conclusions.
objective_zh: 在总体方差未知时构建并执行双侧单样本 t 均值检验，计算估计标准误、t 统计量、自由度、临界值决策与 p 值，并区分关于均值的统计证据与经营诊断或针对员工个人的结论。
objective_zh_hk: 喺總體方差未知嗰陣構建並執行雙側單樣本 t 均值檢驗，計算估計標準誤、t 統計量、自由度、臨界值決策同 p 值，並區分關於均值嘅統計證據同營運診斷或者針對員工個人嘅結論。
