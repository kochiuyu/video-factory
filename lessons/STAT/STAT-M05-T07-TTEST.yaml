title_en: 'The One-Sample t-Test: Unknown σ'
title_zh: 单样本 t 检验：σ 未知时检验均值
title_zh_hk: 單樣本 t 檢驗：σ 未知時檢驗均值
objective_en: Formulate and execute a two-sided one-sample t-test for a population mean when the population standard deviation
  is unknown, calculate the estimated standard error, t statistic, degrees of freedom, critical-value decision, and p-value,
  and separate evidence about the process mean from operational diagnosis or conclusions about individual employees.
objective_zh: 在总体标准差未知时，构建并执行双侧单样本 t 均值检验，计算估计标准误、t 统计量、自由度、临界值决策与 p 值，并区分关于流程均值的统计证据与经营诊断或针对员工个人的结论。
objective_zh_hk: 喺總體標準差未知嗰陣，構建並執行雙側單樣本 t 均值檢驗，計算估計標準誤、t 統計量、自由度、臨界值決策同 p 值，並區分關於流程均值嘅統計證據同營運診斷或者針對員工個人嘅結論。
youtube:
  description_en: |
    The One-Sample t-Test: Unknown σ

    Suppose Shop A promises to warm each pastry in 45 seconds on average. Call it slow when it is not, and the shop wastes money fixing a working line. Miss a real slowdown, and the morning queue keeps growing. A sample of 20 orders averages 48.2 seconds. Sigma is not known from outside the sample.

    A one-sample t-test replaces sigma with the sample standard deviation s, and uses the student t distribution with df = n − 1. The statistic is t = (mean − mu0) / (s / √n).

    In an assumed example, s = 6.0 s, so SE ≈ 1.342 s and t ≈ 3.2 / 1.342 ≈ 2.385. With df = 19 the two-sided 5 percent cutoff is 2.093, and p is about 0.0276. At alpha = 0.05 we reject H0: mu = 45.0. The average runs slow.

    Rule: this is evidence about the process mean under an estimated sigma, not proof of a cause and not a verdict on any staff member.
  description_zh: |
    单样本 t 检验：σ 未知时检验均值

    假设A店承诺，每个牛角包平均 45 秒加热好。明明没变慢却说慢了，店里就白花钱去修一条好好的流程；真的变慢了却没发现，早上的队就越排越长。抽查 20 单，平均 48.2 秒。外面并没有一个已知的 sigma。

    单样本 t 检验（one-sample t-test）用样本标准差 s 代替 sigma，并使用自由度 df = n − 1 的学生 t 分布。统计量是 t = (均值 − mu0) / (s / √n)。

    在一个假设的例子里，s = 6.0 秒，标准误约 1.342 秒，t ≈ 3.2 / 1.342 ≈ 2.385。自由度 19 时双侧 5% 临界值是 2.093，p 大约 0.0276。在 alpha = 0.05 下拒绝 H0: mu = 45.0，平均变慢了。

    规则：这是在用样本估计 sigma 时关于流程均值的证据，不是原因的证明，也不是对哪位员工的判决。
  description_zh_hk: |
    單樣本 t 檢驗：σ 未知時檢驗均值

    假設A店承諾，每個牛角包平均 45 秒加熱好。明明冇慢咗都話慢，間舖就白白使錢去整一條好地地嘅流程；真係慢咗又睇唔到，朝早條隊就越排越長。抽查 20 單，平均 48.2 秒。外面並冇一個已知嘅 sigma。

    單樣本 t 檢驗（one-sample t-test）用樣本標準差 s 代替 sigma，並使用自由度 df = n − 1 嘅學生 t 分佈。統計量係 t = (均值 − mu0) / (s / √n)。

    喺一個假設嘅例子入面，s = 6.0 秒，標準誤約 1.342 秒，t ≈ 3.2 / 1.342 ≈ 2.385。自由度 19 嗰陣雙側 5% 臨界值係 2.093，p 大約 0.0276。喺 alpha = 0.05 之下拒絕 H0: mu = 45.0，平均慢咗。

    規則：呢個係喺用樣本估計 sigma 嗰陣關於流程均值嘅證據，唔係原因嘅證明，亦唔係對邊位員工嘅判決。
