quiz:
- id: Q1
  type: multiple_choice
  question_en: When is a one-tailed test defensible?
  question_zh: 什么情况下用单尾检验才站得住脚？
  question_zh_hk: 咩情況之下用單尾檢驗先至企得住腳？
  options_en:
  - 'A: When the direction is meaningful, fixed before seeing the data, and a change the other way would not support the claim.'
  - 'B: Whenever it gives a smaller p-value, because then a real effect is easier to show.'
  - 'C: When the analyst sees that the sample mean leans the favorable way, and then picks that tail.'
  - 'D: Whenever the manager hopes the change helps, even if a slowdown would also change the decision.'
  options_zh:
  - 'A: 方向本身有意义，在看数据之前就定好，而且反方向的变化并不支持这个主张。'
  - 'B: 只要单尾的 p 值更小就用，因为这样更容易证明有效果。'
  - 'C: 分析员看到样本均值往有利的方向偏，再选那一侧的尾。'
  - 'D: 只要经理希望改动有帮助就用，即使变慢了也会影响决策。'
  options_zh_hk:
  - 'A: 方向本身有意義，喺睇數據之前就定好，而且反方向嘅變化並唔支持呢個主張。'
  - 'B: 只要單尾嘅 p 值細啲就用，因為咁樣容易啲證明有效果。'
  - 'C: 分析員睇到樣本均值向有利嘅方向偏，先揀嗰一邊條尾。'
  - 'D: 只要經理希望改動有幫助就用，就算慢咗都會影響決策。'
  answer: A
  explanation_en: A one-tailed test puts all of alpha in one direction chosen in advance. B and C pick the tail to get a
    result, which breaks the error-control rule. D ignores that a change the other way would matter, so that question is two-sided.
  explanation_zh: 单尾检验把全部 α 放在事先定好的一个方向。B 和 C 都是为了结果去挑尾，破坏了错误控制的规则；D 忽略了反方向的变化同样重要，那个问题本来就是双侧的。
  explanation_zh_hk: 單尾檢驗將全部 α 放喺事先定好嘅一個方向。B 同 C 都係為咗結果去揀尾，破壞咗錯誤控制嘅規則；D 忽略咗反方向嘅變化一樣重要，嗰個問題本身就係雙側嘅。
- id: Q2
  type: multiple_choice
  question_en: 'H0: μ ≥ 42.0 s vs H1: μ < 42.0 s, n = 25, sample mean 39.9 s, s = 5.0 s, df = 24. What is the left-tailed
    decision at α = 0.05?'
  question_zh: 'H0: μ ≥ 42.0 秒 对 H1: μ < 42.0 秒，n = 25，样本均值 39.9 秒，s = 5.0 秒，自由度 24。在 α = 0.05 下，左尾检验的结论是什么？'
  question_zh_hk: 'H0: μ ≥ 42.0 秒 對 H1: μ < 42.0 秒，n = 25，樣本均值 39.9 秒，s = 5.0 秒，自由度 24。喺 α = 0.05 之下，左尾檢驗嘅結論係乜嘢？'
  options_en:
  - 'A: SE = 5.0 / √25 = 1.0 s; t = −2.10 ≤ −1.711; p ≈ 0.0232; reject H0.'
  - 'B: SE = 5.0 / 25 = 0.20 s; t = −10.5; fail to reject H0.'
  - 'C: t = −2.10; the one-tailed cutoff is −2.492; fail to reject H0.'
  - 'D: t = (42.0 − 39.9) / 1.0 = +2.10; not in the left tail, so fail to reject H0.'
  options_zh:
  - 'A: SE = 5.0 / √25 = 1.0 秒；t = −2.10 ≤ −1.711；p ≈ 0.0232；拒绝 H0。'
  - 'B: SE = 5.0 / 25 = 0.20 秒；t = −10.5；不拒绝 H0。'
  - 'C: t = −2.10；单尾临界值是 −2.492；不拒绝 H0。'
  - 'D: t = (42.0 − 39.9) / 1.0 = +2.10；不在左尾，所以不拒绝 H0。'
  options_zh_hk:
  - 'A: SE = 5.0 / √25 = 1.0 秒；t = −2.10 ≤ −1.711；p ≈ 0.0232；拒絕 H0。'
  - 'B: SE = 5.0 / 25 = 0.20 秒；t = −10.5；唔拒絕 H0。'
  - 'C: t = −2.10；單尾臨界值係 −2.492；唔拒絕 H0。'
  - 'D: t = (42.0 − 39.9) / 1.0 = +2.10；唔喺左尾，所以唔拒絕 H0。'
  answer: A
  explanation_en: SE = 5 / √25 = 1.0 s, so t = (39.9 − 42.0) / 1.0 = −2.10. With df = 24 the left-tail 5% cutoff is −1.711,
    and −2.10 is past it, so reject H0 (p ≈ 0.0232). B forgets the square root (and its decision does not follow), C uses
    the 1% cutoff, and D subtracts the wrong way round.
  explanation_zh: SE = 5 / √25 = 1.0 秒，所以 t = (39.9 − 42.0) / 1.0 = −2.10。自由度 24 时，左尾 5% 临界值是 −1.711，−2.10 越过了它，拒绝 H0（p ≈ 0.0232）。B 忘了开根号，结论也对不上；C 用的是 1% 的临界值；D 减反了。
  explanation_zh_hk: SE = 5 / √25 = 1.0 秒，所以 t = (39.9 − 42.0) / 1.0 = −2.10。自由度 24 嗰陣，左尾 5% 臨界值係 −1.711，−2.10 越過咗佢，拒絕 H0（p ≈ 0.0232）。B 唔記得開方，結論都對唔上；C 用咗 1% 嘅臨界值；D 減反咗。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: A faster bar, or just a hope?
  kicker_zh: 吧台真的变快了吗
  kicker_zh_hk: 吧台真係快咗？
  title_en: One tail or two?
  title_zh: 单尾还是双尾？
  title_zh_hk: 單尾定雙尾？
  en: >-
    Suppose Shop A tries a new bar layout. The old average was 42.0 seconds per drink. Fund the change when it does not
    really help, and the money is wasted. But pick the question after peeking at the data, and the test quietly lies. So
    before any timing, decide: are we asking only "is it faster?", or "has it changed at all?" That is one tail or two.
    These are made-up teaching numbers.
  zh: >-
    假设A店试一种新的吧台布局。原来平均每杯 42.0 秒。改动其实没帮上忙，却拨了钱，钱就白花了。可要是先偷看数据再定问题，检验就会悄悄骗人。所以在计时之前就要定好：我们只问“变快了吗”，还是问“有没有变”？这就是单尾和双尾。下面都是教学用的假设数字。
  zh_hk: >-
    假設A店試一種新嘅吧台佈局。原本平均每杯 42.0 秒。改動其實冇幫到手，又批咗錢，啲錢就白使咗。但係如果先偷睇數據再定問題，檢驗就會靜靜雞呃人。所以喺計時之前就要定好：我哋淨係問「快咗未」，定係問「有冇變」？呢個就係單尾同雙尾。以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Direction sets the alternative
  title_zh: 方向决定备择假设
  title_zh_hk: 方向決定備擇假設
  formula: 'H1: μ ≠ μ0   vs   H1: μ < μ0'
  formula_zh: 'H1: μ ≠ μ0   对   H1: μ < μ0'
  formula_zh_hk: 'H1: μ ≠ μ0   對   H1: μ < μ0'
  formula_tex: 'H_1:\ \mu \ne \mu_0 \qquad H_1:\ \mu < \mu_0'
  s1_en: >-
    On the left, the two-sided alternative. H1 says the true average, mu, is not the old mu zero, 42 seconds. Faster or
    slower both count. So the rare-result zone, alpha, is split in half, 2.5 percent in each tail.
  s1_zh: >-
    左边是双侧的备择假设。H1 说真实平均 mu 不等于原来的 mu 零，也就是 42 秒，变快变慢都算。所以显著性水平 alpha 要对半分，两边尾巴各放 2.5%。
  s1_zh_hk: >-
    左邊係雙側嘅備擇假設。H1 話真實平均 mu 唔等於原本嘅 mu 零，即係 42 秒，快咗慢咗都算。所以顯著性水平 alpha 要一分為二，兩邊條尾各放 2.5%。
  s2_en: >-
    On the right, the directional one. H1 says mu is below 42 seconds, faster only. All 5 percent sits in the left tail.
    A result in the other direction, even a big slowdown, cannot support this claim.
  s2_zh: >-
    右边是有方向的备择。H1 说 mu 小于 42 秒，只问变快。5% 全部放在左边的尾巴。反方向的结果，就算慢了很多，也不能支持这个主张。
  s2_zh_hk: >-
    右邊係有方向嘅備擇。H1 話 mu 細過 42 秒，淨係問快咗未。5% 全部放喺左邊條尾。反方向嘅結果，就算慢咗好多，都唔可以支持呢個主張。
- id: name_tails
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: One-tailed vs two-tailed test
  title_zh: 单尾检验与双尾检验
  title_zh_hk: 單尾檢驗同雙尾檢驗
  en: >-
    Now the names. Putting all of alpha in one direction is a one-tailed test. Splitting it across both sides is a
    two-tailed test.
  zh: >-
    现在给它们起名字。把 alpha 全放在一个方向，叫单尾检验（one-tailed test）；两边各放一半，叫双尾检验（two-tailed test）。
  zh_hk: >-
    而家幫佢哋改名。將 alpha 全部放喺一個方向，叫單尾檢驗（one-tailed test）；兩邊各放一半，叫雙尾檢驗（two-tailed test）。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: The trade-off
  kicker_zh: 有得有失
  kicker_zh_hk: 有得有失
  title_en: One tail is easier, but narrower
  title_zh: 单尾更容易，但问得更窄
  title_zh_hk: 單尾易啲，但問得窄啲
  left_en: 'Two tails: α split in half'
  left_zh: 双尾：α 对半分
  left_zh_hk: 雙尾：α 一分為二
  right_en: 'One tail: all α on one side'
  right_zh: 单尾：α 全放一边
  right_zh_hk: 單尾：α 全放一邊
  s1_en: >-
    Here we use the t-test, because sigma is unknown. With 25 drinks, the degrees of freedom are 24. Two-sided, the
    critical values are minus and plus 2.064. One-sided to the left, the critical value moves in to minus 1.711.
  s1_zh: >-
    这里 sigma 未知，所以用 t 检验。25 杯，自由度是 24。双侧的临界值是负 2.064 和正 2.064；只看左边的话，临界值往里收到负 1.711。
  s1_zh_hk: >-
    呢度 sigma 未知，所以用 t 檢驗。25 杯，自由度係 24。雙側嘅臨界值係負 2.064 同正 2.064；淨係睇左邊嘅話，臨界值收入去負 1.711。
  s2_en: >-
    So one tail finds a real speed-up more easily. That is its power advantage. The price is that it has no rejection
    zone at all for a slowdown. If a slowdown would also change the plan, the honest question is two-sided.
  s2_zh: >-
    所以单尾更容易发现真正的提速，这是它在统计功效上的好处。代价是：变慢的那一边，完全没有拒绝域。要是变慢也会改变计划，诚实的问题就该是双侧的。
  s2_zh_hk: >-
    所以單尾容易啲發現真正嘅提速，呢個係佢喺統計功效上嘅好處。代價係：慢咗嗰一邊，完全冇拒絕域。如果慢咗都會改變計劃，誠實嘅問題就應該係雙側。
  s3_en: >-
    And the direction must be written down before the data arrive. Picking the tail after seeing which way the sample
    leans is post-hoc directional bias. The real error rate is then higher than the 5 percent we claim.
  s3_zh: >-
    而且方向一定要在数据出来之前写下来。看到样本往哪边偏，才挑那边的尾，叫事后定向选择偏差。这样真实的错误率，会比我们说的 5% 更高。
  s3_zh_hk: >-
    而且方向一定要喺數據出嚟之前寫低。睇到樣本向邊邊偏，先揀嗰邊條尾，叫事後定向選擇偏差。咁樣真實嘅錯誤率，會比我哋講嘅 5% 更高。
- id: ledger
  visual: steps
  layout: rows
  seconds: 100
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: 25 drinks'
  title_zh: A店：25 杯
  title_zh_hk: A店：25 杯
  step1_en: 'H0: μ ≥ 42.0 vs H1: μ < 42.0'
  step1_zh: 'H0: μ ≥ 42.0 对 H1: μ < 42.0'
  step1_zh_hk: 'H0: μ ≥ 42.0 對 H1: μ < 42.0'
  step2_en: 'SE = 5.0 / √25 = 1.0 s'
  step2_zh: 'SE = 5.0 / √25 = 1.0 秒'
  step2_zh_hk: 'SE = 5.0 / √25 = 1.0 秒'
  step3_en: 't = −2.1 / 1.0 = −2.10'
  step3_zh: 't = −2.1 / 1.0 = −2.10'
  step3_zh_hk: 't = −2.1 / 1.0 = −2.10'
  step4_en: '−2.10 ≤ −1.711; p ≈ 0.0232'
  step4_zh: '−2.10 ≤ −1.711；p ≈ 0.0232'
  step4_zh_hk: '−2.10 ≤ −1.711；p ≈ 0.0232'
  step5_en: 'Reject H0 at α = 0.05'
  step5_zh: '在 α = 0.05 下拒绝 H0'
  step5_zh_hk: '喺 α = 0.05 之下拒絕 H0'
  s1_en: >-
    Start with the hypotheses, set before any timing. H0 says the average is still 42 seconds or more. H1 says it is
    lower. We time 25 independent drinks. The sample mean is 39.9 seconds, and s, the sample standard deviation, is 5.0.
  s1_zh: >-
    先写假设，要在计时之前定好。H0：平均还是 42 秒或者更慢；H1：比 42 秒快。我们计时了 25 杯互相独立的饮品，样本均值 39.9 秒，样本标准差 s 是 5.0 秒。
  s1_zh_hk: >-
    先寫假設，要喺計時之前定好。H0：平均仲係 42 秒或者更慢；H1：快過 42 秒。我哋計咗 25 杯互相獨立嘅飲品，樣本均值 39.9 秒，樣本標準差 s 係 5.0 秒。
  s2_en: >-
    Next, the estimated standard error, how much an average of 25 drinks usually wobbles. The square root of 25 is 5, and
    5.0 divided by 5 is 1.0 second.
  s2_zh: >-
    接着算估计的标准误，也就是 25 杯的平均通常会晃多少。根号 25 是 5，5.0 除以 5，就是 1.0 秒。
  s2_zh_hk: >-
    跟住計估計嘅標準誤，即係 25 杯嘅平均通常會晃幾多。根號 25 係 5，5.0 除 5，就係 1.0 秒。
  s3_en: >-
    Now measure the gap in that unit. 39.9 minus 42.0 is minus 2.1 seconds. Divided by 1.0, t is minus 2.10. The
    sample sits about two standard errors below the old average.
  s3_zh: >-
    再用这个单位去量差距。39.9 减 42.0，是负 2.1 秒，除以 1.0，t 等于负 2.10。样本落在原来平均下方大约两个标准误。
  s3_zh_hk: >-
    再用呢個單位去量差距。39.9 減 42.0，係負 2.1 秒，除 1.0，t 等於負 2.10。樣本落喺原本平均下面大約兩個標準誤。
  s4_en: >-
    Compare. The left-tail critical value is minus 1.711, and minus 2.10 is past it. The one-tailed p-value is about
    0.0232, below 0.05. Both rules agree.
  s4_zh: >-
    比一比。左尾临界值是负 1.711，负 2.10 越过了它。单尾 p 值大约 0.0232，比 0.05 小。两种规则说的是同一件事。
  s4_zh_hk: >-
    比一比。左尾臨界值係負 1.711，負 2.10 越過咗佢。單尾 p 值大約 0.0232，細過 0.05。兩種規則講緊同一件事。
  s5_en: >-
    So we reject H0 at the 5 percent level. The evidence says the average is below 42 seconds. It does not prove the new
    layout caused the drop, and on its own it does not approve the spending.
  s5_zh: >-
    所以，在 5% 的水平下拒绝 H0。证据显示平均低于 42 秒。但它证明不了是新布局造成的，单凭这一点也不能批准这笔开支。
  s5_zh_hk: >-
    所以，喺 5% 嘅水平之下拒絕 H0。證據顯示平均低過 42 秒。但係佢證明唔到係新佈局造成嘅，單憑呢一點亦唔可以批准呢筆開支。
- id: takeaway
  visual: takeaway
  seconds: 64
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Pick the tail from the question
  title_zh: 尾部看问题，不看结果
  title_zh_hk: 條尾睇問題，唔睇結果
  q1_en: When is a one-tailed test fair?
  q1_zh: 什么时候用单尾检验才公平？
  q1_zh_hk: 幾時用單尾檢驗先至公平？
  q2_en: What to report with the result?
  q2_zh: 结果出来后还要报告什么？
  q2_zh_hk: 結果出咗之後仲要報告乜嘢？
  s1_en: >-
    Use one tail only when the direction matters for the decision, a change the other way would not support the claim,
    and the direction was fixed before the data. Otherwise, use two tails.
  s1_zh: >-
    只有在方向对决策有意义、反方向的变化不支持这个主张，而且方向在看数据前就定好时，才用单尾；否则就用双尾。
  s1_zh_hk: >-
    淨係喺方向對決策有意義、反方向嘅變化唔支持呢個主張，而且方向喺睇數據之前已經定好嗰陣，先至用單尾；否則就用雙尾。
  s2_en: >-
    Report the hypotheses and direction set in advance, alpha, the gap, the standard error, t, and the p-value. Then weigh
    cost, risk, and whether the layout really caused the change, separately from the test.
  s2_zh: >-
    要报告事先定好的假设和方向、alpha、差距、标准误、t 和 p 值。成本、风险，以及是不是布局真的造成了变化，要和检验分开来评估。
  s2_zh_hk: >-
    要報告事先定好嘅假設同方向、alpha、差距、標準誤、t 同 p 值。成本、風險，同埋係咪佈局真係造成咗變化，要同檢驗分開嚟評估。
  s3_en: >-
    So, one tail or two? Here the speed-up question was set in advance, so one tail is fair. With t equal to minus 2.10
    and p about 0.0232, the average is below 42 seconds. That is evidence about the mean, not approval to spend.
  s3_zh: >-
    所以，单尾还是双尾？这里“变快了吗”是事先定好的问题，所以用单尾是公平的。t 等于负 2.10，p 大约 0.0232，平均低于 42 秒。这是关于均值的证据，不是批钱的许可。
  s3_zh_hk: >-
    所以，單尾定雙尾？呢度「快咗未」係事先定好嘅問題，所以用單尾係公平嘅。t 等於負 2.10，p 大約 0.0232，平均低過 42 秒。呢個係關於均值嘅證據，唔係批錢嘅許可。
