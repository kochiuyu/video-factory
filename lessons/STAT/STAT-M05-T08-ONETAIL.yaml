id: STAT-M05-T08-ONETAIL
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 340
title_en: 'One- vs Two-Tailed Tests: Direction First'
title_zh: 单尾与双尾检验：先定方向再看数据
title_zh_hk: 單尾同雙尾檢驗：先定方向再睇數據
objective_en: Distinguish directional one-tailed alternatives from non-directional two-tailed alternatives, explain how alpha
  is allocated, justify direction before data collection, calculate a left-tailed one-sample t-test, and avoid treating statistical
  significance as automatic approval for an investment.
objective_zh: 区分定向单尾备择与非定向双尾备择，解释 alpha 的分配方式，在收集数据前说明方向依据，计算左尾单样本 t 检验，并避免把统计显著性直接当作投资批准。
objective_zh_hk: 區分定向單尾備擇同非定向雙尾備擇，解釋 alpha 嘅分配方式，喺收集數據之前說明方向依據，計算左尾單樣本 t 檢驗，並避免將統計顯著性直接當成投資批准。
youtube:
  description_en: |
    One- vs Two-Tailed Tests: Direction First

    Suppose Shop A tries a new bar layout. The old average was 42.0 seconds per drink. Fund the change when it does not really help, and the money is wasted. But pick the question after peeking at the data, and the test quietly lies. Before any timing, decide: are we asking only "is it faster?", or "did it change either way?"

    A one-tailed test puts all of alpha in one direction. A two-tailed test splits it. Directional alternatives are fair only when the direction is fixed before seeing the data. Choosing the side after peeking is a post-hoc directional bias.

    In an assumed example the speed-up question was set in advance: H0: mu is at least 42.0 versus H1: mu is below 42.0. With n = 25, SE = 1.0 s, and t = −2.10, the left-tail 5 percent cutoff is −1.711 and p is about 0.0232. At alpha = 0.05 we reject H0.

    Rule: fix one tail or two before the data. Significance is evidence about the mean, not automatic approval to spend.
  description_zh: |
    单尾与双尾检验：先定方向再看数据

    假设A店试一种新的吧台布局。原来平均每杯 42.0 秒。改动其实没帮上忙，却拨了钱，钱就白花了。可要是先偷看数据再定问题，检验就会悄悄骗人。计时之前就要定好：我们只问“变快了吗”，还是问“有没有变”？

    单尾检验（one-tailed test）把全部 alpha 放在一个方向；双尾检验（two-tailed test）把它拆开。定向备择只有在看数据之前就定好方向时才公平。偷看后再选边，是事后定向选择偏差。

    在一个假设的例子里，“变快了吗”是事先定好的：H0: mu 至少 42.0，对 H1: mu 低于 42.0。n = 25，标准误 = 1.0 秒，t = −2.10，左尾 5% 临界值是 −1.711，p 大约 0.0232。在 alpha = 0.05 下拒绝 H0。

    规则：单尾还是双尾，要在看数据之前定好。显著性是关于均值的证据，不是批钱的许可。
  description_zh_hk: |
    單尾同雙尾檢驗：先定方向再睇數據

    假設A店試一種新嘅吧台佈局。原本平均每杯 42.0 秒。改動其實冇幫到手，又批咗錢，啲錢就白使咗。但係如果先偷睇數據再定問題，檢驗就會靜靜雞呃人。計時之前就要定好：我哋淨係問「快咗未」，定係問「有冇變」？

    單尾檢驗（one-tailed test）將全部 alpha 放喺一個方向；雙尾檢驗（two-tailed test）將佢拆開。定向備擇只有喺睇數據之前就定好方向嗰陣先公平。偷睇完再揀邊，係事後定向選擇偏差。

    喺一個假設嘅例子入面，「快咗未」係事先定好嘅：H0: mu 至少 42.0，對 H1: mu 低於 42.0。n = 25，標準誤 = 1.0 秒，t = −2.10，左尾 5% 臨界值係 −1.711，p 大約 0.0232。喺 alpha = 0.05 之下拒絕 H0。

    規則：單尾定雙尾，要喺睇數據之前定好。顯著性係關於均值嘅證據，唔係批錢嘅許可。
