quiz:
- id: Q1
  type: multiple_choice
  question_en: Why do the variance terms add when we subtract two independent sample means?
  question_zh: 两个独立样本均值相减，为什么它们的方差反而要相加？
  question_zh_hk: 兩個獨立樣本均值相減，點解佢哋嘅方差反而要相加？
  options_en:
  - 'A: In general Var(A − B) = Var(A) + Var(B) − 2Cov(A, B); independence makes the covariance zero, leaving the sum.'
  - 'B: Because a minus sign cancels the noise, so Var(A − B) = Var(A) − Var(B).'
  - 'C: Because the larger group''s variance is the only one that counts, so we just use the bigger one.'
  - 'D: Because the variances add only when the two sample sizes are equal.'
  options_zh:
  - 'A: 一般来说 Var(A − B) = Var(A) + Var(B) − 2Cov(A, B)；两组独立时协方差为零，就只剩两项相加。'
  - 'B: 因为减号会把噪声抵掉，所以 Var(A − B) = Var(A) − Var(B)。'
  - 'C: 因为只有样本量大的那组方差才算数，直接用大的那个就行。'
  - 'D: 因为只有两组样本量相等时，方差才相加。'
  options_zh_hk:
  - 'A: 一般嚟講 Var(A − B) = Var(A) + Var(B) − 2Cov(A, B)；兩組獨立嗰陣協方差係零，就淨低兩項相加。'
  - 'B: 因為減號會將雜音抵銷，所以 Var(A − B) = Var(A) − Var(B)。'
  - 'C: 因為淨係樣本量大嗰組嘅方差先計數，直接用大嗰個就得。'
  - 'D: 因為淨係兩組樣本量相等嗰陣，方差先至相加。'
  answer: A
  explanation_en: The variance of a difference includes a covariance term. For independent sample means the covariance is
    zero, so subtracting the means still adds their variance contributions. B subtracts the variances, C drops one group,
    and D invents an equal-size condition.
  explanation_zh: 差的方差里有一项协方差。两个样本均值独立时，协方差是零，所以均值相减，方差照样相加。B 把方差相减了，C 丢掉了一组，D 编了一个样本量相等的条件。
  explanation_zh_hk: 差嘅方差入面有一項協方差。兩個樣本均值獨立嗰陣，協方差係零，所以均值相減，方差照樣相加。B 將方差相減咗，C 漏咗一組，D 作咗個樣本量相等嘅條件。
- id: Q2
  type: multiple_choice
  question_en: 'Assume independent groups: Shop A n1 = 120, mean HK$52.40, s1 = HK$18.00; Shop B n2 = 150, mean HK$46.80,
    s2 = HK$15.00. What is the large-sample two-sided result for H0: μ1 − μ2 = 0 at α = 0.05?'
  question_zh: '假设两组独立：A店 n1 = 120，均值 HK$52.40，s1 = HK$18.00；B店 n2 = 150，均值 HK$46.80，s2 = HK$15.00。在 H0: μ1 − μ2 = 0、α = 0.05 下，大样本双尾检验的结论是什么？'
  question_zh_hk: '假設兩組獨立：A店 n1 = 120，均值 HK$52.40，s1 = HK$18.00；B店 n2 = 150，均值 HK$46.80，s2 = HK$15.00。喺 H0: μ1 − μ2 = 0、α = 0.05 之下，大樣本雙尾檢驗嘅結論係乜嘢？'
  options_en:
  - 'A: SE ≈ HK$2.049; Z ≈ 2.73; two-sided p ≈ 0.0063; reject H0.'
  - 'B: SE = 18.00 − 15.00 = HK$3.00; Z = 5.60 / 3.00 ≈ 1.87; fail to reject H0.'
  - 'C: SE = √(120 + 150) ≈ 16.43; Z = 5.60 / 16.43 ≈ 0.34; fail to reject H0.'
  - 'D: SE = √(18² + 15²) ≈ 23.43; Z = 5.60 / 23.43 ≈ 0.24; fail to reject H0.'
  options_zh:
  - 'A: SE ≈ HK$2.049；Z ≈ 2.73；双尾 p ≈ 0.0063；拒绝 H0。'
  - 'B: SE = 18.00 − 15.00 = HK$3.00；Z = 5.60 / 3.00 ≈ 1.87；不拒绝 H0。'
  - 'C: SE = √(120 + 150) ≈ 16.43；Z = 5.60 / 16.43 ≈ 0.34；不拒绝 H0。'
  - 'D: SE = √(18² + 15²) ≈ 23.43；Z = 5.60 / 23.43 ≈ 0.24；不拒绝 H0。'
  options_zh_hk:
  - 'A: SE ≈ HK$2.049；Z ≈ 2.73；雙尾 p ≈ 0.0063；拒絕 H0。'
  - 'B: SE = 18.00 − 15.00 = HK$3.00；Z = 5.60 / 3.00 ≈ 1.87；唔拒絕 H0。'
  - 'C: SE = √(120 + 150) ≈ 16.43；Z = 5.60 / 16.43 ≈ 0.34；唔拒絕 H0。'
  - 'D: SE = √(18² + 15²) ≈ 23.43；Z = 5.60 / 23.43 ≈ 0.24；唔拒絕 H0。'
  answer: A
  explanation_en: The estimated variance of the difference is 18²/120 + 15²/150 = 2.70 + 1.50 = 4.20, so SE ≈ 2.049. The
    HK$5.60 gap gives Z ≈ 2.73 and p ≈ 0.0063, so reject H0. B subtracts the standard deviations, C uses the sample sizes
    as if they were spread, and D forgets to divide by n.
  explanation_zh: 均值差的估计方差是 18²/120 + 15²/150 = 2.70 + 1.50 = 4.20，所以 SE ≈ 2.049。HK$5.60 的差距得到 Z ≈ 2.73，p ≈ 0.0063，拒绝 H0。B 把两个标准差相减了，C 把样本量当成了波动，D 忘了除以 n。
  explanation_zh_hk: 均值差嘅估計方差係 18²/120 + 15²/150 = 2.70 + 1.50 = 4.20，所以 SE ≈ 2.049。HK$5.60 嘅差距得到 Z ≈ 2.73，p ≈ 0.0063，拒絕 H0。B 將兩個標準差相減咗，C 將樣本量當咗做波動，D 唔記得除 n。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: A real gap, or just noise?
  kicker_zh: 差距是真的吗
  kicker_zh_hk: 差距係真嘅？
  title_en: Two shops, two averages
  title_zh: 两家店，两个平均
  title_zh_hk: 兩間舖，兩個平均
  en: >-
    Suppose Shop A and Shop B each sample their own customers. Shop A averages HK$52.40 a visit, Shop B HK$46.80, a gap
    of HK$5.60. Call that gap real when it is only sampling luck, and a manager may copy the wrong shop. Both averages
    wobble, so how big must the gap be? These are made-up teaching numbers.
  zh: >-
    假设A店和B店各自抽了一批顾客。A店平均每次消费 HK$52.40，B店 HK$46.80，差了 HK$5.60。要是这个差距只是抽样的运气，却当成真的，经理可能就去学错了店。两个平均都会晃，差距要多大才算数？下面都是教学用的假设数字。
  zh_hk: >-
    假設A店同B店各自抽咗一批顧客。A店平均每次消費 HK$52.40，B店 HK$46.80，差咗 HK$5.60。如果呢個差距淨係抽樣嘅運氣，你又當咗佢係真，經理可能就去學錯間舖。兩個平均都會晃，差距要幾大先算數？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Gap over its standard error
  title_zh: 差距除以它的标准误
  title_zh_hk: 差距除以佢嘅標準誤
  formula: 'H0: μ1 − μ2 = 0   Z = gap / SE'
  formula_zh: 'H0: μ1 − μ2 = 0   Z = 差距 / SE'
  formula_zh_hk: 'H0: μ1 − μ2 = 0   Z = 差距 / SE'
  formula_tex: 'H_0:\ \mu_1 - \mu_2 = 0 \qquad Z = \frac{\bar{X}_1 - \bar{X}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}}'
  s1_en: >-
    On the left, the null. Mu one and mu two are the true average spends at the two shops. H0 says their difference is
    zero. The alternative is two-sided, because a gap either way would matter.
  s1_zh: >-
    左边是原假设。mu 一、mu 二是两家店真实的平均消费。H0 说两者之差是零。备择是双侧的，因为不管哪边高，都有意义。
  s1_zh_hk: >-
    左邊係原假設。mu 一、mu 二係兩間舖真實嘅平均消費。H0 話兩者之差係零。備擇係雙側嘅，因為邊邊高都有意義。
  s2_en: >-
    On the right, the test statistic. On top is the gap between the two sample means. Underneath is its standard error,
    built from each shop's s squared over its n. Z says how many standard errors apart the shops are.
  s2_zh: >-
    右边是检验统计量。上面是两个样本均值的差距，下面是这个差距的标准误，由每家店的 s 平方除以各自的 n 拼起来。Z 告诉我们，两家店相差几个标准误。
  s2_zh_hk: >-
    右邊係檢驗統計量。上面係兩個樣本均值嘅差距，下面係呢個差距嘅標準誤，由每間舖嘅 s 平方除以各自嘅 n 砌出嚟。Z 話俾我哋知，兩間舖差幾多個標準誤。
  s3_en: >-
    With large samples, Z is close to Normal, and each shop's sample variance stands in for its unknown true one. That is
    a large-sample approximation, not a guarantee from one magic sample size.
  s3_zh: >-
    样本够大时，Z 接近正态分布，每家店的样本方差可以代替它未知的真实方差。这是大样本近似，不是某个神奇样本量一到就自动保证。
  s3_zh_hk: >-
    樣本夠大嗰陣，Z 接近正態分佈，每間舖嘅樣本方差可以代替佢未知嘅真實方差。呢個係大樣本近似，唔係某個神奇樣本量一到就自動保證。
- id: name_twoin
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Two independent samples
  title_zh: 双独立样本与均值差标准误
  title_zh_hk: 雙獨立樣本同均值差標準誤
  en: >-
    Now the names. Two groups sampled separately, with no link between them, are two independent samples. The bottom of
    our Z is the standard error of the difference.
  zh: >-
    现在给它们起名字。两组分开抽、彼此没有关联，叫双独立样本（two independent samples）。Z 下面那个数，叫均值差标准误（standard error of difference）。
  zh_hk: >-
    而家幫佢哋改名。兩組分開抽、彼此冇關連，叫雙獨立樣本（two independent samples）。Z 下面嗰個數，叫均值差標準誤（standard error of difference）。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: Why variances add
  kicker_zh: 方差为什么相加
  kicker_zh_hk: 方差點解相加
  title_en: Subtract means, add variances
  title_zh: 均值相减，方差相加
  title_zh_hk: 均值相減，方差相加
  left_en: 'Linked: covariance counts'
  left_zh: 有关联的两组：协方差要算
  left_zh_hk: 有關連嘅兩組：協方差要計
  right_en: 'Independent: variances add'
  right_zh: 独立的两组：方差直接相加
  right_zh_hk: 獨立嘅兩組：方差直接相加
  s1_en: >-
    Why does the bottom add, when the top subtracts? Each average wobbles on its own. Take one wobbly number away from
    another, and the gap wobbles even more, not less. A minus sign does not cancel noise.
  s1_zh: >-
    上面是相减，下面为什么是相加？每个平均都在自己晃。一个会晃的数减去另一个会晃的数，差距只会晃得更厉害，不会更少。减号抵不掉噪声。
  s1_zh_hk: >-
    上面係相減，下面點解係相加？每個平均都喺度自己晃。一個會晃嘅數減另一個會晃嘅數，差距只會晃得更犀利，唔會少啲。減號抵銷唔到雜音。
  s2_en: >-
    The full rule has one more piece. The variance of A minus B is the variance of A, plus the variance of B, minus twice
    their covariance, how much they move together. If the groups are linked, like the same customers measured twice, that
    piece matters.
  s2_zh: >-
    完整的规则还多一项：A 减 B 的方差，等于 A 的方差加 B 的方差，再减两倍的协方差，也就是两者一起动的程度。如果两组有关联，比如同一批顾客量两次，这一项就不能忽略。
  s2_zh_hk: >-
    完整嘅規則仲多一項：A 減 B 嘅方差，等於 A 嘅方差加 B 嘅方差，再減兩倍嘅協方差，即係兩者一齊郁嘅程度。如果兩組有關連，例如同一批顧客量兩次，呢一項就唔可以唔理。
  s3_en: >-
    With two independent samples, the covariance is zero, so the variances simply add. That is why we check the design
    first. Paired, repeated, or clustered data need a different standard error.
  s3_zh: >-
    双独立样本的协方差是零，所以方差直接相加。这就是为什么要先看研究设计：配对、重复测量或者成群抽样的数据，标准误要换一种算法。
  s3_zh_hk: >-
    雙獨立樣本嘅協方差係零，所以方差直接相加。呢個就係點解要先睇研究設計：配對、重複量度或者成群抽樣嘅數據，標準誤要換一種計法。
- id: ledger
  visual: steps
  layout: rows
  seconds: 110
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A vs Shop B'
  title_zh: A店对B店
  title_zh_hk: A店對B店
  step1_en: 'Gap = 52.40 − 46.80 = HK$5.60'
  step1_zh: '差距 = 52.40 − 46.80 = HK$5.60'
  step1_zh_hk: '差距 = 52.40 − 46.80 = HK$5.60'
  step2_en: '2.70 + 1.50 = 4.20'
  step2_zh: '2.70 + 1.50 = 4.20'
  step2_zh_hk: '2.70 + 1.50 = 4.20'
  step3_en: 'SE = √4.20 ≈ HK$2.049'
  step3_zh: 'SE = √4.20 ≈ HK$2.049'
  step3_zh_hk: 'SE = √4.20 ≈ HK$2.049'
  step4_en: 'Z = 5.60 / 2.049 ≈ 2.73'
  step4_zh: 'Z = 5.60 / 2.049 ≈ 2.73'
  step4_zh_hk: 'Z = 5.60 / 2.049 ≈ 2.73'
  step5_en: 'p ≈ 0.0063; reject H0'
  step5_zh: 'p ≈ 0.0063；拒绝 H0'
  step5_zh_hk: 'p ≈ 0.0063；拒絕 H0'
  s1_en: >-
    Let us work it through. Suppose Shop A samples 120 independent visits, with a mean of HK$52.40 and s of HK$18.00.
    Shop B samples 150 visits, with a mean of HK$46.80 and s of HK$15.00. The gap is HK$5.60.
  s1_zh: >-
    我们来算一遍。假设A店抽了 120 次互相独立的消费，平均 HK$52.40，s 是 HK$18.00；B店抽了 150 次，平均 HK$46.80，s 是 HK$15.00。差距是 HK$5.60。
  s1_zh_hk: >-
    我哋計一次。假設A店抽咗 120 次互相獨立嘅消費，平均 HK$52.40，s 係 HK$18.00；B店抽咗 150 次，平均 HK$46.80，s 係 HK$15.00。差距係 HK$5.60。
  s2_en: >-
    Now each shop's wobble. For Shop A, 18 times 18 is 324, and divided by 120 that is 2.70. For Shop B, 15 times 15 is
    225, and divided by 150 that is 1.50.
  s2_zh: >-
    接着算每家店各自晃多少。A店，18 乘 18 是 324，除以 120，是 2.70；B店，15 乘 15 是 225，除以 150，是 1.50。
  s2_zh_hk: >-
    跟住計每間舖各自晃幾多。A店，18 乘 18 係 324，除 120，係 2.70；B店，15 乘 15 係 225，除 150，係 1.50。
  s3_en: >-
    The groups are independent, so we add. 2.70 plus 1.50 is 4.20. What number times itself is 4.20? About 2.049. So the
    standard error of the difference is about HK$2.049.
  s3_zh: >-
    两组独立，所以相加：2.70 加 1.50 是 4.20。什么数乘自己等于 4.20？大约 2.049。所以均值差标准误大约是 HK$2.049。
  s3_zh_hk: >-
    兩組獨立，所以相加：2.70 加 1.50 係 4.20。乜嘢數乘自己等於 4.20？大約 2.049。所以均值差標準誤大約係 HK$2.049。
  s4_en: >-
    Measure the gap in that unit. 5.60 divided by 2.049 gives Z of about 2.73. The two-sided critical value at 5 percent
    is 1.96, and 2.73 is past it. The two-sided p-value is about 0.0063. Both rules agree.
  s4_zh: >-
    再用这个单位量差距：5.60 除以 2.049，Z 大约 2.73。5% 双尾的临界值是 1.96，2.73 越过了它。双尾 p 值大约 0.0063。两种规则说的是同一件事。
  s4_zh_hk: >-
    再用呢個單位量差距：5.60 除 2.049，Z 大約 2.73。5% 雙尾嘅臨界值係 1.96，2.73 越過咗佢。雙尾 p 值大約 0.0063。兩種規則講緊同一件事。
  s5_en: >-
    So we reject H0 at the 5 percent level. The evidence says the true averages differ. It does not say why. Customer mix,
    time of day, or promotions could explain it, so this alone is not a pricing decision.
  s5_zh: >-
    所以，在 5% 的水平下拒绝 H0。证据显示两家店的真实平均不一样，但没说为什么。顾客构成、时段、促销都可能是原因，所以单凭这一点，不能拿来定价。
  s5_zh_hk: >-
    所以，喺 5% 嘅水平之下拒絕 H0。證據顯示兩間舖嘅真實平均唔一樣，但冇講點解。顧客組成、時段、推廣都可能係原因，所以單憑呢一點，唔可以攞嚟定價。
- id: takeaway
  visual: takeaway
  seconds: 54
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Check the design, then the gap
  title_zh: 先看设计，再看差距
  title_zh_hk: 先睇設計，再睇差距
  q1_en: Why do the variances add?
  q1_zh: 为什么方差要相加？
  q1_zh_hk: 點解方差要相加？
  q2_en: What to check before acting?
  q2_zh: 行动之前要查什么？
  q2_zh_hk: 行動之前要查乜嘢？
  s1_en: >-
    For two independent samples, the covariance is zero, so the variance of the gap is the sum of the two variances. If
    the groups are linked, use a method that counts the covariance instead.
  s1_zh: >-
    双独立样本的协方差是零，所以差距的方差等于两个方差之和。如果两组有关联，就要换一个把协方差算进去的方法。
  s1_zh_hk: >-
    雙獨立樣本嘅協方差係零，所以差距嘅方差等於兩個方差之和。如果兩組有關連，就要換一個將協方差計埋落去嘅方法。
  s2_en: >-
    Before acting, check how each sample was drawn, whether spend was measured the same way, outliers, and whether the
    groups are really comparable. Report the gap with its uncertainty, and weigh costs separately from the test.
  s2_zh: >-
    行动之前，要查每组样本是怎么抽的、消费是不是用同一种方法量的、有没有异常值、两组是不是真的可比。报告差距时要带上它的不确定性，成本要和检验分开评估。
  s2_zh_hk: >-
    行動之前，要查每組樣本係點抽、消費係咪用同一種方法量、有冇異常值、兩組係咪真係可比。報告差距嗰陣要連埋佢嘅不確定性，成本要同檢驗分開評估。
  s3_en: >-
    So, real gap or just noise? Here Z is about 2.73 and p about 0.0063, so the HK$5.60 gap is larger than sampling noise
    would usually make. That is evidence the averages differ, not proof of why, and not a reason to copy a shop.
  s3_zh: >-
    所以，差距是真的还是噪声？这里 Z 大约 2.73，p 大约 0.0063，HK$5.60 的差距比抽样噪声通常造成的要大。这是两家平均不同的证据，不是原因的证明，也不是去学哪家店的理由。
  s3_zh_hk: >-
    所以，差距係真定係雜音？呢度 Z 大約 2.73，p 大約 0.0063，HK$5.60 嘅差距大過抽樣雜音通常整到嘅。呢個係兩間舖平均唔同嘅證據，唔係原因嘅證明，亦唔係去學邊間舖嘅理由。
