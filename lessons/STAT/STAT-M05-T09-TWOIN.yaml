title_en: 'Two Independent Samples: Comparing Means'
title_zh: 双独立样本：检验两个总体均值之差
title_zh_hk: 雙獨立樣本：檢驗兩個總體均值之差
objective_en: Formulate a test for the difference between two independent population means, derive the standard error with
  the covariance term made explicit, apply a large-sample normal approximation using group-specific sample variances, and
  interpret an assumed customer-spend comparison without turning association into a pricing or causal conclusion.
objective_zh: 构建两个独立总体均值之差的检验，明确协方差项并推导标准误，在大样本下使用各组样本方差进行正态近似，并解释假设的顾客消费比较，同时避免把统计关联转化为定价或因果结论。
objective_zh_hk: 構建兩個獨立總體均值之差嘅檢驗，明確協方差項並推導標準誤，喺大樣本之下使用各組樣本方差進行正態近似，並解讀假設嘅顧客消費比較，同時避免將統計關聯轉化成定價或者因果結論。
youtube:
  description_en: |
    Two Independent Samples: Comparing Means

    Suppose Shop A and Shop B each sample their own customers. Shop A averages HK$52.40 a visit, Shop B HK$46.80, a gap of HK$5.60. Call that gap real when it is only sampling luck, and a manager may copy the wrong shop. Both averages wobble, so how big must the gap be?

    A two-independent-samples comparison looks at the difference between means. Under large samples, a Normal approximation uses each group's own sample variance. The standard error of the difference is the square root of the sum of the two variance-over-n terms.

    In an assumed example, 2.70 + 1.50 = 4.20, so SE ≈ √4.20 ≈ HK$2.049. Then Z = 5.60 / 2.049 ≈ 2.73, and the two-sided p-value is about 0.0063. At the 5 percent level we reject equal means.

    Rule: this is evidence the averages differ, not proof of why, and not a reason to copy a shop or change prices.
  description_zh: |
    双独立样本：检验两个总体均值之差

    假设A店和B店各自抽了一批顾客。A店平均每次消费 HK$52.40，B店 HK$46.80，差了 HK$5.60。要是这个差距只是抽样的运气，却当成真的，经理可能就去学错了店。两个平均都会晃，差距要多大才算数？

    双独立样本比较看的是均值之差。大样本之下，正态近似用各组自己的样本方差。均值差的标准误，是两个“方差除以 n”相加后再开方。

    在一个假设的例子里，2.70 + 1.50 = 4.20，标准误 ≈ √4.20 ≈ HK$2.049。于是 Z = 5.60 / 2.049 ≈ 2.73，双侧 p 值大约 0.0063。在 5% 水平拒绝均值相等。

    规则：这是两家平均不同的证据，不是原因的证明，也不是去学哪家店或改价的理由。
  description_zh_hk: |
    雙獨立樣本：檢驗兩個總體均值之差

    假設A店同B店各自抽咗一批顧客。A店平均每次消費 HK$52.40，B店 HK$46.80，差咗 HK$5.60。如果呢個差距淨係抽樣嘅運氣，你又當咗佢係真，經理可能就去學錯間舖。兩個平均都會晃，差距要幾大先算數？

    雙獨立樣本比較睇嘅係均值之差。大樣本之下，正態近似用各組自己嘅樣本方差。均值差嘅標準誤，係兩個「方差除以 n」加埋之後再開方。

    喺一個假設嘅例子入面，2.70 + 1.50 = 4.20，標準誤 ≈ √4.20 ≈ HK$2.049。於是 Z = 5.60 / 2.049 ≈ 2.73，雙側 p 值大約 0.0063。喺 5% 水平拒絕均值相等。

    規則：呢個係兩間舖平均唔同嘅證據，唔係原因嘅證明，亦唔係去學邊間舖或者改價嘅理由。
