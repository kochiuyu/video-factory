quiz:
- id: Q1
  type: multiple_choice
  question_en: Why do the variance terms add when subtracting two independent sample means?
  question_zh: 为什么两个独立样本均值之差的方差 Var(X1_bar - X2_bar) 等于 (sigma1^2 / n1) + (sigma2^2 / n2)，即两组方差必须相加而非相减？
  question_zh_hk: 點解兩個獨立樣本均值之差嘅方差 Var(X1_bar - X2_bar) 等於 (sigma1^2 / n1) + (sigma2^2 / n2)，即係兩組方差必須相加而唔係相減？
  options_en:
  - 'A: In general Var(A - B) = Var(A) + Var(B) - 2Cov(A,B); independence makes covariance zero, leaving the sum.'
  - 'B: Because financial regulations forbid negative signs in retail operations variance formulas.'
  - 'C: Because the Central Limit Theorem requires all subtraction operators to convert to addition.'
  - 'D: Because sample sizes n1 and n2 cancel each other out in the denominator.'
  options_zh:
  - 'A: 因为独立的随机不确定性必然复合叠加；求两组充满随机扰动的测量值之差会放大总波动，故方差恒为相加：Var(X - Y) = Var(X) + Var(Y)。'
  - 'B: 因为商业审计法规明文禁止在零售运营的方差核算公式中出现减号。'
  - 'C: 因为中心极限定理强制要求在推导过程中将所有减法算子自动替换为加法。'
  - 'D: 因为两组样本量 n1 与 n2 会在公式分母中相互抵消归零。'
  options_zh_hk:
  - 'A: 因為獨立嘅隨機不確定性必然複合疊加；求兩組充滿隨機擾動嘅測量值之差會放大總波動，故方差恆為相加：Var(X - Y) = Var(X) + Var(Y)。'
  - 'B: 因為商業審計法規明文禁止喺零售營運嘅方差核算公式入面出現減號。'
  - 'C: 因為中心極限定理強制要求喺推導過程入面將所有減法算子自動替換為加法。'
  - 'D: 因為兩組樣本量 n1 同 n2 會喺公式分母入面相互抵消歸零。'
  answer: A
  explanation_en: The variance formula includes covariance. For independent sample means, covariance is zero, so subtracting
    the means still leads to adding their variance contributions.
  explanation_zh: 方差度量的是离散波动跨度而非方向。对于两个独立的随机变量，做差必然导致不确定性进一步扩散：Var(A - B) = Var(A) + (-1)^2 × Var(B) = Var(A) + Var(B)。
  explanation_zh_hk: 方差度量嘅係離散波動跨度而唔係方向。對於兩個獨立嘅隨機變量，做差必然搞到不確定性進一步擴散：Var(A - B) = Var(A) + (-1)^2 × Var(B) = Var(A) + Var(B)。
- id: Q2
  type: multiple_choice
  question_en: 'Assume independent groups with n1 = 120, x1-bar = HK$52.40, s1 = HK$18.00 and n2 = 150, x2-bar = HK$46.80,
    s2 = HK$15.00. What is the large-sample two-sided result for H0: mu1 - mu2 = 0?'
  question_zh: '都市咖啡审计客单价：湾仔店（n1 = 120，均值 $52.40，s1 = $18.00）对决 旺角店（n2 = 150，均值 $46.80，s2 = $15.00）。在 H0: mu1 - mu2 = 0 下，检验统计量
    Z_calc 与 alpha = 0.05 的裁决分别是什么？'
  question_zh_hk: '都市咖啡審計客單價：灣仔舖（n1 = 120，均值 $52.40，s1 = $18.00）對決 旺角舖（n2 = 150，均值 $46.80，s2 = $15.00）。喺 H0: mu1 - mu2 = 0
    下，檢驗統計量 Z_calc 與 alpha = 0.05 嘅裁決分別係幾多？'
  options_en:
  - 'A: SE_diff ≈ HK$2.049; Z ≈ 2.73; two-sided p ≈ 0.0063; reject H0 at alpha = 0.05.'
  - 'B: SE_diff = 18.00 - 15.00 = $3.00; Z_calc = 5.60 / 3.00 = +1.87. Fail to reject H0.'
  - 'C: Z_calc = (52.40 - 46.80) / sqrt(120 + 150) = 5.60 / 16.43 ≈ +0.34. Retain H0.'
  - 'D: Z_calc = +2.73; fail to reject H0 because retail customer spend is legally immune to regional variation.'
  options_zh:
  - 'A: SE_diff = 根号(18^2 / 120 + 15^2 / 150) = 根号(2.70 + 1.50) = 根号(4.20) ≈ $2.049；Z_calc = (52.40 - 46.80) / 2.049 ≈ +2.73。因
    +2.73 > +1.96（p = 0.0063），拒绝 H0：两区客单价存在显著结构性分化。'
  - 'B: SE_diff = 18.00 - 15.00 = $3.00；Z_calc = 5.60 / 3.00 = +1.87。判定不拒绝 H0。'
  - 'C: Z_calc = (52.40 - 46.80) / 根号(120 + 150) = 5.60 / 16.43 ≈ +0.34。判定保留 H0。'
  - 'D: Z_calc = +2.73；判定不拒绝 H0，因为各区客单在商业法规上不允许存在结构性差异。'
  options_zh_hk:
  - 'A: SE_diff = 根號(18^2 / 120 + 15^2 / 150) = 根號(2.70 + 1.50) = 根號(4.20) ≈ $2.049；Z_calc = (52.40 - 46.80) / 2.049 ≈ +2.73。因
    +2.73 > +1.96（p = 0.0063），拒絕 H0：兩區客單價存在顯著結構性分化。'
  - 'B: SE_diff = 18.00 - 15.00 = $3.00；Z_calc = 5.60 / 3.00 = +1.87。判定唔拒絕 H0。'
  - 'C: Z_calc = (52.40 - 46.80) / 根號(120 + 150) = 5.60 / 16.43 ≈ +0.34。判定保留 H0。'
  - 'D: Z_calc = +2.73；判定唔拒絕 H0，因為各區客單喺商業法規上唔容許存在結構性差異。'
  answer: A
  explanation_en: The estimated variance is 18^2/120 + 15^2/150 = 4.20, so SE_diff ≈ 2.049. The HK$5.60 difference gives Z
    ≈ 2.73 and p ≈ 0.0063.
  explanation_zh: 均值差方差为 324/120 + 225/150 = 2.70 + 1.50 = 4.20。开根号得均值差标准误 SE_diff ≈ $2.049。标准化 Z = 5.60 / 2.049 ≈ +2.73。由于
    +2.73 显著超越 +1.96，断然推翻原假设（p = 0.0063）。
  explanation_zh_hk: 均值差方差為 324/120 + 225/150 = 2.70 + 1.50 = 4.20。開根號得均值差標準誤 SE_diff ≈ $2.049。標準化 Z = 5.60 / 2.049 ≈ +2.73。由於
    +2.73 顯著超越 +1.96，斷然推翻原假設（p = 0.0063）。
beats:
- id: hook
  visual: title_card
  seconds: 28
  kicker_en: The Two-Store Divergence
  kicker_zh: 两店客单分化之辨
  kicker_zh_hk: 兩舖客單分化之辨
  title_en: Is the observed difference larger than combined sampling noise?
  title_zh: 观测差异是否超过两组抽样噪声？
  title_zh_hk: 觀測差異係咪超過兩組抽樣雜音？
  en: Metro Coffee is comparing customer spend in two assumed, independently sampled store populations. Group 1 has a sample
    mean of HK$52.40 and Group 2 has a sample mean of HK$46.80, an observed gap of HK$5.60. The raw difference is not enough
    for a conclusion because each sample mean carries uncertainty. A two-sample procedure standardizes the gap using the combined
    uncertainty from both groups.
  zh: 都市咖啡正在比较两个假设且独立抽样的门店总体中的顾客消费。第 1 组样本均值为 HK$52.40，第 2 组为 HK$46.80，观测差距为 HK$5.60。仅凭原始差异不足以下结论，因为每个样本均值都带有不确定性。双样本方法会利用两组的合并不确定性把差距标准化。
  zh_hk: 都市咖啡正比較兩個假設而且獨立抽樣嘅門市總體入面嘅顧客消費。第 1 組樣本均值係 HK$52.40，第 2 組係 HK$46.80，觀測差距係 HK$5.60。單憑原始差異唔足以下結論，因為每個樣本均值都帶有不確定性。雙樣本方法會利用兩組嘅合併不確定性將差距標準化。
- id: define
  visual: definition_card
  seconds: 34
  kicker_en: What It Is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Standardize the difference between independent sample means
  title_zh: 标准化两个独立样本均值之差
  title_zh_hk: 標準化兩個獨立樣本均值之差
  formula: 'H0: mu_1 - mu_2 = Delta_0; Z = ((x1-bar - x2-bar) - Delta_0) / sqrt(s1^2/n1 + s2^2/n2)'
  formula_zh: 'H0: mu_1 - mu_2 = Delta_0；Z = ((x1-bar - x2-bar) - Delta_0) / √(s1^2/n1 + s2^2/n2)'
  formula_zh_hk: 'H0: mu_1 - mu_2 = Delta_0；Z = ((x1-bar - x2-bar) - Delta_0) / √(s1^2/n1 + s2^2/n2)'
  formula_tex: Z=\frac{(\bar X_1-\bar X_2)-\Delta_0}{\sqrt{s_1^2/n_1+s_2^2/n_2}}
  s1_en: The parameter is the difference between two population means. The null commonly sets that difference to zero, while
    a two-sided alternative asks whether it differs from zero in either direction. The samples must represent distinct groups
    and provide independent information across groups.
  s1_zh: 参数是两个总体均值之差。原假设通常把该差设为零，双侧备择则询问其是否向任一方向偏离零。样本必须代表不同组，并在组间提供独立信息。
  s1_zh_hk: 參數係兩個總體均值之差。原假設通常將嗰個差設做零，雙側備擇就詢問佢係咪向任何一個方向偏離零。樣本必須代表唔同組，並喺組間提供獨立資訊。
  s2_en: With sufficiently large, well-behaved samples, the difference in sample means can be approximated by a normal distribution,
    and each population variance may be estimated by its group sample variance. This is a large-sample approximation, not
    a guarantee triggered by a universal sample-size cutoff.
  s2_zh: 当样本足够大且表现良好时，样本均值之差可近似服从正态分布，各总体方差可由对应组样本方差估计。这是大样本近似，而不是由某个普遍样本量门槛自动保证。
  s2_zh_hk: 當樣本足夠大而且表現良好嗰陣，樣本均值之差可以近似服從正態分佈，各總體方差可以由對應組樣本方差估計。呢個係大樣本近似，唔係由某個普遍樣本量門檻自動保證。
- id: mechanics
  visual: two_column
  seconds: 34
  kicker_en: The Variance Rule
  kicker_zh: 方差叠加律
  kicker_zh_hk: 方差疊加律
  title_en: Variances add only after accounting for covariance
  title_zh: 先处理协方差，才可判断方差如何合并
  title_zh_hk: 先處理協方差，先可以判斷方差點樣合併
  left_en: 'General rule: Var(A - B) = Var(A) + Var(B) - 2Cov(A,B)'
  left_zh: 一般规则：Var(A - B) = Var(A) + Var(B) - 2Cov(A,B)
  left_zh_hk: 一般規則：Var(A - B) = Var(A) + Var(B) - 2Cov(A,B)
  right_en: 'Independent groups: Cov(A,B) = 0, so the variances add'
  right_zh: 独立组：Cov(A,B) = 0，因此方差相加
  right_zh_hk: 獨立組：Cov(A,B) = 0，所以方差相加
  s1_en: The minus sign in a difference does not mean its variance terms should be subtracted. In general, variance of A minus
    B includes a covariance term. When the two sample means are independent, covariance is zero, leaving the sum of their
    variances.
  s1_zh: 差值中的减号并不表示方差项应相减。一般而言，A - B 的方差包含协方差项。当两个样本均值独立时，协方差为零，于是剩下两者方差之和。
  s1_zh_hk: 差值入面嘅減號唔表示方差項應該相減。一般而言，A - B 嘅方差包含協方差項。當兩個樣本均值獨立嗰陣，協方差係零，於是剩低兩者方差之和。
  s2_en: If observations are paired, repeated, clustered, or otherwise dependent across groups, the independence formula is
    inappropriate. The design determines the covariance structure, so analysts must identify the sampling unit before choosing
    the standard-error formula.
  s2_zh: 如果观测是配对、重复、聚类，或组间存在其他依赖，独立样本公式就不适用。设计决定协方差结构，因此分析人员必须先识别抽样单位，再选择标准误公式。
  s2_zh_hk: 如果觀測係配對、重複、聚類，或者組間存在其他依賴，獨立樣本公式就唔適用。設計決定協方差結構，所以分析人員必須先識別抽樣單位，再選擇標準誤公式。
  s3_en: A statistically detectable group difference does not explain why the groups differ. Customer mix, time of day, product
    mix, promotions, selection, and measurement processes may all matter. A two-sample test alone does not establish a pricing
    effect or causal mechanism.
  s3_zh: 统计上可检测的组间差异并不能解释差异为何存在。顾客组合、时段、产品组合、促销、选择机制与测量流程都可能有关。双样本检验本身不能证明定价效应或因果机制。
  s3_zh_hk: 統計上可檢測嘅組間差異並唔可以解釋差異點解存在。顧客組合、時段、產品組合、促銷、選擇機制同量度流程都可能有關。雙樣本檢驗本身唔可以證明定價效應或者因果機制。
- id: ledger
  visual: steps
  seconds: 38
  kicker_en: The Ledger
  kicker_zh: 台账实裁
  kicker_zh_hk: 台賬實裁
  title_en: Execute the assumed two-group spend comparison
  title_zh: 执行假设两组顾客消费比较
  title_zh_hk: 執行假設兩組顧客消費比較
  step1_en: 'Group 1: n1 = 120, x1-bar = HK$52.40, s1 = HK$18.00; Group 2: n2 = 150, x2-bar = HK$46.80, s2 = HK$15.00'
  step1_zh: 第 1 组：n1 = 120，x1-bar = HK$52.40，s1 = HK$18.00；第 2 组：n2 = 150，x2-bar = HK$46.80，s2 = HK$15.00
  step1_zh_hk: 第 1 組：n1 = 120，x1-bar = HK$52.40，s1 = HK$18.00；第 2 組：n2 = 150，x2-bar = HK$46.80，s2 = HK$15.00
  step2_en: SE_diff = sqrt(18^2/120 + 15^2/150) = sqrt(4.20) ≈ HK$2.049
  step2_zh: SE_diff = √(18^2/120 + 15^2/150) = √4.20 ≈ HK$2.049
  step2_zh_hk: SE_diff = √(18^2/120 + 15^2/150) = √4.20 ≈ HK$2.049
  step3_en: Z = 5.60 / 2.049 ≈ 2.73; two-sided p ≈ 0.0063; reject H0 at alpha = 0.05
  step3_zh: Z = 5.60 / 2.049 ≈ 2.73；双侧 p ≈ 0.0063；在 alpha = 0.05 时拒绝 H0
  step3_zh_hk: Z = 5.60 / 2.049 ≈ 2.73；雙側 p ≈ 0.0063；喺 alpha = 0.05 嗰陣拒絕 H0
  s1_en: For illustration, assume two independently sampled groups provide the stated sample sizes, means, and standard deviations.
    These are teaching assumptions, not verified store, customer-segment, pricing, or transaction records. The null states
    that the population mean difference equals zero.
  s1_zh: 作为示例，假设两个独立抽样组提供上述样本量、均值与标准差。这些数字是教学假设，并非已核实的门店、顾客分群、定价或交易记录。原假设表示总体均值之差为零。
  s1_zh_hk: 作為例子，假設兩個獨立抽樣組提供上述樣本量、均值同標準差。呢啲數字係教學假設，唔係已核實嘅門市、顧客分群、定價或者交易記錄。原假設表示總體均值之差係零。
  s2_en: The estimated variance of the difference is 18 squared over 120 plus 15 squared over 150, equal to 2.70 plus 1.50,
    or 4.20. Taking the square root gives an estimated standard error of approximately HK$2.049.
  s2_zh: 均值差的估计方差为 18 平方除以 120，加上 15 平方除以 150，即 2.70 + 1.50 = 4.20。开根号后，估计标准误约为 HK$2.049。
  s2_zh_hk: 均值差嘅估計方差係 18 平方除以 120，加上 15 平方除以 150，即係 2.70 + 1.50 = 4.20。開根號之後，估計標準誤約係 HK$2.049。
  s3_en: The observed difference is HK$5.60, giving Z approximately 2.73 and a two-sided p-value approximately 0.0063. Reject
    equality of population means at the 5% level under the large-sample assumptions. The result supports a mean difference,
    but not a causal explanation or an automatic pricing decision.
  s3_zh: 观测差异为 HK$5.60，得到 Z 约 2.73，双侧 p 值约 0.0063。在大样本假设下，于 5% 水平拒绝总体均值相等。该结果支持均值存在差异，但不提供因果解释，也不能自动决定定价。
  s3_zh_hk: 觀測差異係 HK$5.60，得到 Z 約 2.73，雙側 p 值約 0.0063。喺大樣本假設之下，喺 5% 水平拒絕總體均值相等。呢個結果支持均值存在差異，但唔提供因果解釋，亦唔可以自動決定定價。
- id: takeaway
  visual: takeaway
  seconds: 34
  kicker_en: Decision Rule
  kicker_zh: 商业法度
  kicker_zh_hk: 商業法度
  title_en: Verify independence, estimate uncertainty, and interpret narrowly
  title_zh: 核实独立性、估计不确定性，并谨慎解释
  title_zh_hk: 核實獨立性、估計不確定性，並審慎解讀
  q1_en: Why do the variance terms add for independent sample means?
  q1_zh: 为什么独立样本均值的方差项相加？
  q1_zh_hk: 點解獨立樣本均值嘅方差項相加？
  q2_en: What must be checked before turning a group difference into a business action?
  q2_zh: 把组间差异转化为商业行动前必须检查什么？
  q2_zh_hk: 將組間差異轉化成商業行動之前必須檢查咩？
  s1_en: For independent sample means, covariance is zero, so the variance of their difference equals the sum of their variances.
    If the design creates dependence, use a method that represents that covariance instead of applying the independent-groups
    formula.
  s1_zh: 对于独立样本均值，协方差为零，因此其差值方差等于两者方差之和。如果设计产生依赖，应使用能够反映协方差的方法，而不是套用独立组公式。
  s1_zh_hk: 對於獨立樣本均值，協方差係零，所以佢哋差值嘅方差等於兩者方差之和。如果設計產生依賴，應該使用能夠反映協方差嘅方法，而唔係套用獨立組公式。
  s2_en: Before acting, verify sampling frames, independence, measurement consistency, outliers, group comparability, missingness,
    effect size, confidence interval, and practical costs. Observational differences may reflect composition or selection
    rather than a controllable treatment effect.
  s2_zh: 采取行动前，应核实抽样框、独立性、测量一致性、异常值、组间可比性、缺失情况、效应大小、置信区间与实际成本。观察性差异可能反映构成或选择，而不是可控处理效应。
  s2_zh_hk: 採取行動之前，應該核實抽樣框、獨立性、量度一致性、異常值、組間可比性、缺失情況、效應大小、置信區間同實際成本。觀察性差異可能反映構成或者選擇，而唔係可控處理效應。
  s3_en: For the assumed comparison, Z is approximately 2.73 and p approximately 0.0063, so the 5% two-sided large-sample
    test rejects equal population means. Report the estimated HK$5.60 difference with its uncertainty and keep pricing and
    causal decisions separate.
  s3_zh: 在假设比较中，Z 约为 2.73，p 约为 0.0063，因此 5% 双侧大样本检验拒绝总体均值相等。应报告估计的 HK$5.60 差异及其不确定性，并把定价和因果决策分开。
  s3_zh_hk: 喺假設比較入面，Z 約係 2.73，p 約係 0.0063，所以 5% 雙側大樣本檢驗拒絕總體均值相等。應該報告估計嘅 HK$5.60 差異同佢嘅不確定性，並將定價同因果決策分開。
