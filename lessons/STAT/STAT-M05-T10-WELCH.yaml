quiz:
- id: Q1
  type: multiple_choice
  question_en: Why use Welch’s t-test instead of the pooled-variance t-test when equal variances are not justified?
  question_zh: 两组方差相等没有依据时，为什么用韦尔奇 t 检验，而不用合并方差 t 检验？
  question_zh_hk: 兩組方差相等冇依據嗰陣，點解用韋爾奇 t 檢驗，而唔用合併方差 t 檢驗？
  options_en:
  - 'A: Welch keeps each group’s s²/n separate and adjusts the degrees of freedom, so it drops the equal-variance assumption;
    independence and sampling assumptions still apply.'
  - 'B: Welch makes the test valid under any design, including paired or clustered data.'
  - 'C: Welch always gives a smaller p-value, so it finds differences more easily.'
  - 'D: Welch is only needed when the two sample sizes are equal.'
  options_zh:
  - 'A: 韦尔奇把每组的 s²/n 分开算，再调整自由度，所以不需要方差相等的假设；但组间独立、抽样适当等假设照样要满足。'
  - 'B: 韦尔奇检验在任何设计下都成立，配对或成群抽样的数据也一样。'
  - 'C: 韦尔奇检验总是给出更小的 p 值，所以更容易找到差异。'
  - 'D: 只有两组样本量相等时，才需要用韦尔奇检验。'
  options_zh_hk:
  - 'A: 韋爾奇將每組嘅 s²/n 分開計，再調整自由度，所以唔使方差相等嘅假設；但組間獨立、抽樣適當呢啲假設照樣要滿足。'
  - 'B: 韋爾奇檢驗喺任何設計之下都成立，配對或者成群抽樣嘅數據都一樣。'
  - 'C: 韋爾奇檢驗一定俾出更細嘅 p 值，所以更容易搵到差異。'
  - 'D: 淨係兩組樣本量相等嗰陣，先需要用韋爾奇檢驗。'
  answer: A
  explanation_en: 'Welch addresses unequal population variances only. B is wrong because paired or clustered data need a
    method matched to that design. C is wrong because Welch can give a larger p-value than the pooled test. D has it backwards:
    the pooled test is most fragile when the sizes are unequal.'
  explanation_zh: 韦尔奇只处理总体方差不等的问题。B 错在配对、成群抽样的数据要用和设计相配的方法；C 错在韦尔奇的 p 值也可能比合并检验大；D 刚好说反了，样本量不等时合并检验最容易出问题。
  explanation_zh_hk: 韋爾奇淨係處理總體方差唔等嘅問題。B 錯喺配對、成群抽樣嘅數據要用同設計相配嘅方法；C 錯喺韋爾奇嘅 p 值都可能大過合併檢驗；D 啱啱講反咗，樣本量唔等嗰陣合併檢驗最容易出事。
- id: Q2
  type: multiple_choice
  question_en: 'Assume independent groups: Shop A n1 = 16, mean 38.0 s, s1 = 4.0 s; Shop B n2 = 25, mean 44.0 s, s2 = 10.0
    s. What is the Welch result for H0: μ1 − μ2 = 0 at α = 0.05?'
  question_zh: '假设两组独立：A店 n1 = 16，均值 38.0 秒，s1 = 4.0 秒；B店 n2 = 25，均值 44.0 秒，s2 = 10.0 秒。在 H0: μ1 − μ2 = 0、α = 0.05 下，韦尔奇检验的结论是什么？'
  question_zh_hk: '假設兩組獨立：A店 n1 = 16，均值 38.0 秒，s1 = 4.0 秒；B店 n2 = 25，均值 44.0 秒，s2 = 10.0 秒。喺 H0: μ1 − μ2 = 0、α = 0.05 之下，韋爾奇檢驗嘅結論係乜嘢？'
  options_en:
  - 'A: SE ≈ 2.236 s; t ≈ −2.68; df ≈ 34.1; two-sided p ≈ 0.011; reject H0.'
  - 'B: SE = √(4² + 10²) ≈ 10.77 s; t ≈ −0.56; fail to reject H0.'
  - 'C: SE = √(4/16 + 10/25) ≈ 0.806 s; t ≈ −7.44; reject H0.'
  - 'D: SE = 4²/16 + 10²/25 = 5.00 s; t = −1.20; fail to reject H0.'
  options_zh:
  - 'A: SE ≈ 2.236 秒；t ≈ −2.68；df ≈ 34.1；双尾 p ≈ 0.011；拒绝 H0。'
  - 'B: SE = √(4² + 10²) ≈ 10.77 秒；t ≈ −0.56；不拒绝 H0。'
  - 'C: SE = √(4/16 + 10/25) ≈ 0.806 秒；t ≈ −7.44；拒绝 H0。'
  - 'D: SE = 4²/16 + 10²/25 = 5.00 秒；t = −1.20；不拒绝 H0。'
  options_zh_hk:
  - 'A: SE ≈ 2.236 秒；t ≈ −2.68；df ≈ 34.1；雙尾 p ≈ 0.011；拒絕 H0。'
  - 'B: SE = √(4² + 10²) ≈ 10.77 秒；t ≈ −0.56；唔拒絕 H0。'
  - 'C: SE = √(4/16 + 10/25) ≈ 0.806 秒；t ≈ −7.44；拒絕 H0。'
  - 'D: SE = 4²/16 + 10²/25 = 5.00 秒；t = −1.20；唔拒絕 H0。'
  answer: A
  explanation_en: SE = √(4²/16 + 10²/25) = √5 ≈ 2.236. The −6.0-second gap gives t ≈ −2.68, Welch df ≈ 34.1, and two-sided
    p ≈ 0.011, so reject H0. B forgets to divide by n, C uses s instead of s², and D forgets the square root.
  explanation_zh: SE = √(4²/16 + 10²/25) = √5 ≈ 2.236。−6.0 秒的差距得到 t ≈ −2.68，韦尔奇 df ≈ 34.1，双尾 p ≈ 0.011，拒绝 H0。B 忘了除以 n，C 用了 s 而不是 s²，D 忘了开根号。
  explanation_zh_hk: SE = √(4²/16 + 10²/25) = √5 ≈ 2.236。−6.0 秒嘅差距得到 t ≈ −2.68，韋爾奇 df ≈ 34.1，雙尾 p ≈ 0.011，拒絕 H0。B 唔記得除 n，C 用咗 s 而唔係 s²，D 唔記得開方。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: Same gap, different spread
  kicker_zh: 波动不一样
  kicker_zh_hk: 波動唔一樣
  title_en: One steady shop, one jumpy shop
  title_zh: 一家很稳，一家忽快忽慢
  title_zh_hk: 一間好穩，一間忽快忽慢
  en: >-
    Suppose Shop A times 16 drinks and averages 38 seconds, give or take about 4. Shop B times 25 drinks and averages 44
    seconds, but give or take about 10. Assume both spreads are the same, and you can misjudge the gap and blame the wrong
    shop. So how do we compare them fairly? These are made-up teaching numbers.
  zh: >-
    假设A店计时了 16 杯饮品，平均 38 秒，上下大概差 4 秒；B店计时了 25 杯，平均 44 秒，可是上下差到 10 秒左右。要是硬当两家的波动一样，差距就可能看错，还怪错了店。那怎样才比得公平？下面都是教学用的假设数字。
  zh_hk: >-
    假設A店計咗 16 杯飲品嘅時間，平均 38 秒，上下大概差 4 秒；B店計咗 25 杯，平均 44 秒，但係上下差到 10 秒左右。如果硬當兩間嘅波動一樣，差距就可能睇錯，仲怪錯間舖。噉點樣先比得公平？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 60
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Keep each shop’s spread separate
  title_zh: 每家店的波动分开算
  title_zh_hk: 每間舖嘅波動分開計
  formula: 't = gap / √(s1²/n1 + s2²/n2)'
  formula_zh: 't = 差距 / √(s1²/n1 + s2²/n2)   ν 用韦尔奇-萨特思韦特公式'
  formula_zh_hk: 't = 差距 / √(s1²/n1 + s2²/n2)   ν 用韋爾奇-薩特思韋特公式'
  formula_tex: 't = \frac{\bar{X}_1 - \bar{X}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}} \qquad \nu = \frac{(s_1^2/n_1 + s_2^2/n_2)^2}{\frac{(s_1^2/n_1)^2}{n_1 - 1} + \frac{(s_2^2/n_2)^2}{n_2 - 1}}'
  s1_en: >-
    On the left, the test statistic. On top is the gap between the two sample means. Underneath, each shop keeps its own
    s squared over n. Nothing is pooled into one shared variance.
  s1_zh: >-
    左边是检验统计量。上面是两个样本均值的差距；下面，每家店保留自己的 s 平方除以 n，不把两家的方差合并成一个。
  s1_zh_hk: >-
    左邊係檢驗統計量。上面係兩個樣本均值嘅差距；下面，每間舖保留自己嘅 s 平方除以 n，唔會將兩間嘅方差合併成一個。
  s2_en: >-
    On the right, the degrees of freedom, written nu. It is built from those same two pieces. It is usually not a whole
    number, and it is never more than n1 plus n2 minus 2.
  s2_zh: >-
    右边是自由度，写作 nu。它也是用同样那两块算出来的，通常不是整数，而且不会超过 n1 加 n2 减 2。
  s2_zh_hk: >-
    右邊係自由度，寫做 nu。佢都係用同樣嗰兩舊計出嚟，通常唔係整數，而且唔會超過 n1 加 n2 減 2。
  s3_en: >-
    We then read t against a Student t distribution with nu degrees of freedom, just like the one-sample t-test.
  s3_zh: >-
    然后拿 t 去对照自由度为 nu 的学生 t 分布，跟单样本 t 检验的做法一样。
  s3_zh_hk: >-
    然後攞 t 去對照自由度係 nu 嘅學生 t 分佈，同單樣本 t 檢驗嘅做法一樣。
- id: name_welch
  visual: title_card
  seconds: 20
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Welch’s t-test
  title_zh: 韦尔奇 t 检验
  title_zh_hk: 韋爾奇 t 檢驗
  en: >-
    Now the names. This test is Welch’s t-test. The adjusted nu is the Welch–Satterthwaite degrees of freedom.
  zh: >-
    现在给它们起名字。这个检验叫韦尔奇 t 检验（Welch's t-test）。调整过的 nu，叫韦尔奇-萨特思韦特自由度（Welch-Satterthwaite degrees of freedom）。
  zh_hk: >-
    而家幫佢哋改名。呢個檢驗叫韋爾奇 t 檢驗（Welch's t-test）。調整過嘅 nu，叫韋爾奇-薩特思韋特自由度（Welch-Satterthwaite degrees of freedom）。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: Pooled or Welch?
  kicker_zh: 合并还是韦尔奇
  kicker_zh_hk: 合併定韋爾奇
  title_en: Welch drops one assumption
  title_zh: 韦尔奇只少一个假设
  title_zh_hk: 韋爾奇只少一個假設
  left_en: 'Pooled: equal variances'
  left_zh: 合并方差：假设方差相等
  left_zh_hk: 合併方差：假設方差相等
  right_en: 'Welch: variances may differ'
  right_zh: 韦尔奇：两组方差可以不等
  right_zh_hk: 韋爾奇：兩組方差可以唔等
  s1_en: >-
    The older pooled t-test assumes both shops share one true variance, and blends their spreads into one number. When
    the spreads and the sample sizes both differ, that blend can mislead, especially if the smaller group is the noisier
    one.
  s1_zh: >-
    传统的合并方差 t 检验，假设两家店有同一个真实方差，把两家的波动揉成一个数。要是波动和样本量都不一样，这样揉就可能误导人，尤其是样本小的那组反而更晃的时候。
  s1_zh_hk: >-
    傳統嘅合併方差 t 檢驗，假設兩間舖有同一個真實方差，將兩間嘅波動搓埋做一個數。如果波動同樣本量都唔一樣，噉搓就可能誤導人，尤其係樣本細嗰組反而更晃嘅時候。
  s2_en: >-
    Welch does not need equal variances. That is why many analysts use it by default for two independent means. But the
    groups must still be independent, the timing must be measured the same way, and with small samples, check for heavy
    skew and outliers.
  s2_zh: >-
    韦尔奇不需要方差相等，所以很多分析师比较两个独立均值时，默认就用它。不过两组仍然要独立、计时方法要一致；样本小的时候，还要看看有没有严重偏斜和异常值。
  s2_zh_hk: >-
    韋爾奇唔需要方差相等，所以好多分析師比較兩個獨立均值嗰陣，預設就用佢。不過兩組仍然要獨立、計時方法要一致；樣本細嗰陣，仲要睇吓有冇嚴重偏斜同異常值。
  s3_en: >-
    And no test explains the cause. If the same drinks are timed twice, or the data are clustered by shift, you need a
    method that matches that design.
  s3_zh: >-
    而且没有哪个检验能说明原因。如果同一批饮品计时两次，或者数据按班次成群，就要换一个和设计相配的方法。
  s3_zh_hk: >-
    而且冇邊個檢驗講得出原因。如果同一批飲品計兩次時間，或者數據按更次成群，就要換一個同設計相配嘅方法。
- id: ledger
  visual: steps
  layout: rows
  seconds: 118
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A vs Shop B'
  title_zh: A店对B店
  title_zh_hk: A店對B店
  step1_en: 'A 4²/16 = 1; B 10²/25 = 4'
  step1_zh: 'A店 4²/16 = 1；B店 10²/25 = 4'
  step1_zh_hk: 'A店 4²/16 = 1；B店 10²/25 = 4'
  step2_en: 'SE = √5 ≈ 2.236 s'
  step2_zh: 'SE = √5 ≈ 2.236 秒'
  step2_zh_hk: 'SE = √5 ≈ 2.236 秒'
  step3_en: 't = −6.0 / 2.236 ≈ −2.68'
  step3_zh: 't = −6.0 / 2.236 ≈ −2.68'
  step3_zh_hk: 't = −6.0 / 2.236 ≈ −2.68'
  step4_en: 'ν = 25 / 0.733 ≈ 34.1'
  step4_zh: 'ν = 25 / 0.733 ≈ 34.1'
  step4_zh_hk: 'ν = 25 / 0.733 ≈ 34.1'
  step5_en: 'p ≈ 0.011; reject H0'
  step5_zh: 'p ≈ 0.011；拒绝 H0'
  step5_zh_hk: 'p ≈ 0.011；拒絕 H0'
  s1_en: >-
    Let us work it through. For Shop A, 4 squared is 16, divided by 16 gives 1. For Shop B, 10 squared is 100, divided
    by 25 gives 4. Shop B adds four times as much wobble.
  s1_zh: >-
    我们来算一遍。A店，4 的平方是 16，除以 16，得 1；B店，10 的平方是 100，除以 25，得 4。B店带来的晃动是A店的四倍。
  s1_zh_hk: >-
    我哋計一次。A店，4 嘅平方係 16，除 16，得 1；B店，10 嘅平方係 100，除 25，得 4。B店帶嚟嘅晃動係A店嘅四倍。
  s2_en: >-
    Add them, 1 plus 4 is 5. The square root of 5 is about 2.236, so the standard error of the difference is about 2.236
    seconds.
  s2_zh: >-
    两个加起来，1 加 4 是 5。根号 5 大约 2.236，所以均值差标准误大约是 2.236 秒。
  s2_zh_hk: >-
    兩個加埋，1 加 4 係 5。5 開方大約 2.236，所以均值差標準誤大約係 2.236 秒。
  s3_en: >-
    The gap is 38 minus 44, minus 6 seconds. Divide by 2.236, and t is about minus 2.68.
  s3_zh: >-
    差距是 38 减 44，负 6 秒。除以 2.236，t 大约是负 2.68。
  s3_zh_hk: >-
    差距係 38 減 44，負 6 秒。除 2.236，t 大約係負 2.68。
  s4_en: >-
    Now the degrees of freedom. On top, 5 squared is 25. Underneath, 1 squared over 15, plus 4 squared over 24, about
    0.733. 25 divided by 0.733 is about 34.1, fewer than the 39 a pooled test would use.
  s4_zh: >-
    接着算自由度。上面，5 的平方是 25；下面，1 的平方除以 15，加上 4 的平方除以 24，大约 0.733。25 除以 0.733，大约 34.1，比合并检验用的 39 要少。
  s4_zh_hk: >-
    跟住計自由度。上面，5 嘅平方係 25；下面，1 嘅平方除 15，加 4 嘅平方除 24，大約 0.733。25 除 0.733，大約 34.1，少過合併檢驗用嘅 39。
  s5_en: >-
    With about 34 degrees of freedom, the two-sided 5 percent critical value is about 2.03, and 2.68 is past it. The two-sided
    p-value is about 0.011. So we reject H0. Shop A is faster in the sample, but this does not say why.
  s5_zh: >-
    自由度约 34 时，5% 双尾临界值大约 2.03，2.68 越过了它；双尾 p 值大约 0.011。所以拒绝 H0。样本里A店比较快，但这没说明为什么。
  s5_zh_hk: >-
    自由度約 34 嗰陣，5% 雙尾臨界值大約 2.03，2.68 越過咗佢；雙尾 p 值大約 0.011。所以拒絕 H0。樣本入面A店快啲，但呢個冇講點解。
- id: takeaway
  visual: takeaway
  seconds: 56
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Different spreads? Use Welch
  title_zh: 波动不一样，就用韦尔奇
  title_zh_hk: 波動唔一樣，就用韋爾奇
  q1_en: What does Welch fix, and what does it not?
  q1_zh: 韦尔奇解决了什么，没解决什么？
  q1_zh_hk: 韋爾奇解決咗乜嘢，冇解決乜嘢？
  q2_en: What to check before acting?
  q2_zh: 行动之前要查什么？
  q2_zh_hk: 行動之前要查乜嘢？
  s1_en: >-
    Welch keeps each group’s s squared over n separate and adjusts the degrees of freedom, so it does not need equal variances.
    It still needs independent groups and sensible sampling.
  s1_zh: >-
    韦尔奇把每组的 s 平方除以 n 分开算，再调整自由度，所以不需要方差相等。但它仍然要求两组独立、抽样合理。
  s1_zh_hk: >-
    韋爾奇將每組嘅 s 平方除以 n 分開計，再調整自由度，所以唔使方差相等。但佢仍然要求兩組獨立、抽樣合理。
  s2_en: >-
    Before acting, check the raw times, how they were recorded, outliers, and whether the shops are really comparable.
    Report the gap with its uncertainty, not just reject or not.
  s2_zh: >-
    行动之前，要查原始计时、记录方法、异常值，以及两家店是不是真的可比。报告差距时要带上它的不确定性，不要只说拒绝或不拒绝。
  s2_zh_hk: >-
    行動之前，要查原始計時、記錄方法、異常值，同埋兩間舖係咪真係可比。報告差距嗰陣要連埋佢嘅不確定性，唔好淨係講拒絕定唔拒絕。
  s3_en: >-
    So, how do we compare fairly? Let each shop keep its own spread. Here t is about minus 2.68 and p about 0.011. The
    6-second gap is evidence, not proof of why, and no reason to blame staff.
  s3_zh: >-
    所以，怎样比才公平？让每家店保留自己的波动。这里 t 大约负 2.68，自由度约 34.1，p 大约 0.011，6 秒的差距是真实的证据，但不是原因的证明，也不是去怪员工的理由。
  s3_zh_hk: >-
    所以，點樣比先公平？等每間舖保留自己嘅波動。呢度 t 大約負 2.68，自由度約 34.1，p 大約 0.011，6 秒嘅差距係真實嘅證據，但唔係原因嘅證明，亦唔係去怪員工嘅理由。
