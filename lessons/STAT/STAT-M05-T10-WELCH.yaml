id: STAT-M05-T10-WELCH
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 360
title_en: 'Welch’s t-Test: Means with Unequal Variances'
title_zh: 韦尔奇 t 检验：方差不等时比较两个均值
title_zh_hk: 韋爾奇 t 檢驗：方差唔等嗰陣比較兩個均值
objective_en: Apply Welch’s two-sample t-test to compare two independent population means without assuming equal variances,
  calculate the unpooled standard error and Welch-Satterthwaite degrees of freedom, assess design and distribution conditions,
  and interpret an assumed service-time difference without converting it into a causal, operational, or employee-level conclusion.
objective_zh: 在不假定方差相等的情况下，应用韦尔奇双样本 t 检验比较两个独立总体均值，计算非合并标准误与韦尔奇-萨特思韦特自由度，评估设计与分布条件，并解释假设的服务时间差异，同时避免把结果转化为因果、经营或针对员工个人的结论。
objective_zh_hk: 喺唔假定方差相等嘅情況之下，應用韋爾奇雙樣本 t 檢驗比較兩個獨立總體均值，計算非合併標準誤同韋爾奇-薩特思韋特自由度，評估設計同分佈條件，並解讀假設嘅服務時間差異，同時避免將結果轉化成因果、營運或者針對員工個人嘅結論。
youtube:
  description_en: |
    Welch’s t-Test: Means with Unequal Variances

    Suppose Shop A times 16 drinks and averages 38 seconds, give or take about 4. Shop B times 25 drinks and averages 44 seconds, but give or take about 10. Assume both spreads are the same, and you can misjudge the gap and blame the wrong shop. How do we compare them fairly?

    Welch’s t-test lets each group keep its own variance. The SE is the square root of s1²/n1 + s2²/n2, and the degrees of freedom follow the Welch–Satterthwaite formula. No shared pooled variance is required.

    In an assumed example, 4²/16 = 1 and 10²/25 = 4, so SE = √5 ≈ 2.236 s. Then t = −6.0 / 2.236 ≈ −2.68, with nu = 25 / 0.733 ≈ 34.1. The two-sided p-value is about 0.011, so we reject equal means. Shop A is faster in the sample.

    Rule: the 6-second gap is evidence, not proof of why, and no reason to blame staff.
  description_zh: |
    韦尔奇 t 检验：方差不等时比较两个均值

    假设A店计时了 16 杯饮品，平均 38 秒，上下大概差 4 秒；B店计时了 25 杯，平均 44 秒，可是上下差到 10 秒左右。要是硬当两家的波动一样，差距就可能看错，还怪错了店。怎样才比得公平？

    韦尔奇 t 检验（Welch's t-test）让每组保留自己的方差。标准误是 s1²/n1 + s2²/n2 再开方，自由度按韦尔奇-萨特思韦特公式调整，不需要合并成一个共同方差。

    在一个假设的例子里，4²/16 = 1，10²/25 = 4，标准误 = √5 ≈ 2.236 秒。于是 t = −6.0 / 2.236 ≈ −2.68，自由度 nu = 25 / 0.733 ≈ 34.1。双侧 p 值大约 0.011，拒绝均值相等。样本里 A 店更快。

    规则：6 秒的差距是证据，不是原因的证明，也不是去怪员工的理由。
  description_zh_hk: |
    韋爾奇 t 檢驗：方差唔等嗰陣比較兩個均值

    假設A店計咗 16 杯飲品嘅時間，平均 38 秒，上下大概差 4 秒；B店計咗 25 杯，平均 44 秒，但係上下差到 10 秒左右。如果硬當兩間嘅波動一樣，差距就可能睇錯，仲怪錯間舖。點樣先比得公平？

    韋爾奇 t 檢驗（Welch's t-test）等每組保留自己嘅方差。標準誤係 s1²/n1 + s2²/n2 再開方，自由度按韋爾奇-薩特思韋特公式調整，唔需要合併成一個共同方差。

    喺一個假設嘅例子入面，4²/16 = 1，10²/25 = 4，標準誤 = √5 ≈ 2.236 秒。於是 t = −6.0 / 2.236 ≈ −2.68，自由度 nu = 25 / 0.733 ≈ 34.1。雙側 p 值大約 0.011，拒絕均值相等。樣本入面 A 店更快。

    規則：6 秒嘅差距係證據，唔係原因嘅證明，亦唔係去怪員工嘅理由。
