id: STAT-M05-T11-PAIRD
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 340
title_en: 'The Paired t-Test: Change in the Same Units'
title_zh: 配对差值 t 检验：检验同一批单元内部的变化
title_zh_hk: 配對差值 t 檢驗：檢驗同一批單元內部嘅變化
objective_en: Convert matched before-and-after observations into one difference score per unit, formulate and execute a one-sample
  t-test on those differences, explain when pairing can improve precision and when it cannot, and interpret an assumed workflow-training
  result without making employee-level or causal claims beyond the design.
objective_zh: 把匹配的前后观测转化为每个单元一个差值，对这些差值构建并执行单样本 t 检验，解释配对何时可以提高精度、何时不能，并解释假设的流程培训结果，同时避免作出超出设计范围的员工个人或因果结论。
objective_zh_hk: 將匹配嘅前後觀測轉化成每個單元一個差值，對呢啲差值構建並執行單樣本 t 檢驗，解釋配對幾時可以提高精度、幾時唔可以，並解讀假設嘅流程培訓結果，同時避免作出超出設計範圍嘅員工個人或者因果結論。
youtube:
  description_en: |
    The Paired t-Test: Change in the Same Units

    Suppose Shop A times 15 baristas making a drink, then sends them to a short training, and times the same 15 again. Some baristas were always quick, some always slow. Compare the two lists as if they were strangers, and those built-in differences drown out the training. How do we see the change clearly?

    A paired-difference t-test gives each unit one difference score D, here after minus before, and tests whether the mean of those differences is zero. The statistic is t = (mean D − 0) / (sD / √n), with df = n − 1.

    In an assumed example, mean D = −4.20 s, sD = 3.873, SE ≈ 1.000 s, so t ≈ −4.20 with df = 14. The two-sided p-value is about 0.0009, so we reject H0: muD = 0. On average these baristas were faster after training.

    Rule: pairing helps when the match is real and the two times move together. A mis-match ruins the design. The result is evidence of an average speed-up, not proof of why and not a verdict on any one barista.
  description_zh: |
    配对差值 t 检验：检验同一批单元内部的变化

    假设A店给 15 位咖啡师计时做一杯饮品，再送他们去短训，然后给同一批 15 人再计一次。有人本来就快，有人本来就慢。把两份名单当成陌生人来比，这些固有差异就会把培训效果淹没。怎样才能看清变化？

    配对差值 t 检验（paired-difference t-test）给每个单元一个配对差值 D，这里是后测减前测，再检验这些差值的均值是否为零。统计量是 t = (均值 D − 0) / (sD / √n)，自由度 df = n − 1。

    在一个假设的例子里，均值 D = −4.20 秒，sD = 3.873，标准误约 1.000 秒，于是 t ≈ −4.20，df = 14。双侧 p 值大约 0.0009，拒绝 H0: muD = 0。平均来说，培训后这些咖啡师更快了。

    规则：匹配是真的、前后时间又一起变动时，配对才有用。配错了，设计就毁了。结果是平均变快的证据，不是原因的证明，也不是对哪一位咖啡师的判决。
  description_zh_hk: |
    配對差值 t 檢驗：檢驗同一批單元內部嘅變化

    假設A店畀 15 位咖啡師計時做一杯飲品，再送佢哋去短訓，然後畀同一批 15 人再計一次。有人本来就快，有人本来就慢。將兩份名單當成陌生人嚟比，呢啲固有差異就會將培訓效果淹沒。點樣先睇得清變化？

    配對差值 t 檢驗（paired-difference t-test）畀每個單元一個配對差值 D，呢度係後測減前測，再檢驗呢啲差值嘅均值係咪為零。統計量係 t = (均值 D − 0) / (sD / √n)，自由度 df = n − 1。

    喺一個假設嘅例子入面，均值 D = −4.20 秒，sD = 3.873，標準誤約 1.000 秒，於是 t ≈ −4.20，df = 14。雙側 p 值大約 0.0009，拒絕 H0: muD = 0。平均嚟講，培訓後呢啲咖啡師快咗。

    規則：匹配係真嘅、前後時間又一齊郁嗰陣，配對先有用。配錯咗，設計就冇咗用。結果係平均變快嘅證據，唔係原因嘅證明，亦唔係對邊一位咖啡師嘅判決。
