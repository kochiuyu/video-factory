quiz:
- id: Q1
  type: multiple_choice
  question_en: Why can a paired design be more precise than comparing two independent groups?
  question_zh: 为什么配对设计可能比两个独立组的比较更精确？
  question_zh_hk: 點解配對設計可能比兩個獨立組嘅比較更精確？
  options_en:
  - 'A: Subtracting within each unit cancels stable unit-to-unit differences when the before and after times move together,
    so the differences vary less.'
  - 'B: Pairing doubles the degrees of freedom from n − 1 to 2n − 2.'
  - 'C: Pairing guarantees a smaller p-value, whatever the data look like.'
  - 'D: Pairing proves the training caused the change, because each unit is its own control.'
  options_zh:
  - 'A: 同一单元内相减，在前后时间一起高、一起低时，能抵消单元之间稳定的差异，所以差值波动更小。'
  - 'B: 配对会把自由度从 n − 1 翻倍到 2n − 2。'
  - 'C: 不管数据怎样，配对一定给出更小的 p 值。'
  - 'D: 每个单元自己做对照，所以配对就证明了是培训导致变化。'
  options_zh_hk:
  - 'A: 同一單元入面相減，喺前後時間一齊高、一齊低嗰陣，可以抵消單元之間穩定嘅差異，所以差值波動細啲。'
  - 'B: 配對會將自由度由 n − 1 翻倍到 2n − 2。'
  - 'C: 唔理數據點樣，配對一定俾出更細嘅 p 值。'
  - 'D: 每個單元自己做對照，所以配對就證明咗係培訓導致變化。'
  answer: A
  explanation_en: 'The gain comes from valid matching and a positive link within pairs. B is wrong: there are n differences,
    so df = n − 1. C is wrong: with a weak link the gain can vanish. D is wrong: time trends and other changes can also move
    the differences.'
  explanation_zh: 好处来自有效的匹配，以及配对内的正相关。B 错在只有 n 个差值，所以 df = n − 1；C 错在配对内关联弱时，好处可能消失；D 错在时间趋势和其他同期变化也会推动差值。
  explanation_zh_hk: 好處嚟自有效嘅匹配，同埋配對內嘅正相關。B 錯喺淨係得 n 個差值，所以 df = n − 1；C 錯喺配對內關聯弱嗰陣，好處可能冇咗；D 錯喺時間趨勢同其他同期變化都會推動差值。
- id: Q2
  type: multiple_choice
  question_en: 'Assume n = 15 pairs, mean difference −4.20 s (after − before), s_D = 3.873 s. What is the two-sided result
    for H0: μ_D = 0 at α = 0.05?'
  question_zh: '假设 n = 15 对，平均差值 −4.20 秒（训后 − 训前），s_D = 3.873 秒。在 H0: μ_D = 0、α = 0.05 双尾下，结论是什么？'
  question_zh_hk: '假設 n = 15 對，平均差值 −4.20 秒（訓後 − 訓前），s_D = 3.873 秒。喺 H0: μ_D = 0、α = 0.05 雙尾之下，結論係乜嘢？'
  options_en:
  - 'A: SE = 3.873 / √15 ≈ 1.000 s; t ≈ −4.20; df = 14; p ≈ 0.0009; reject H0.'
  - 'B: SE = 3.873 / 15 ≈ 0.258 s; t ≈ −16.3; df = 14; reject H0.'
  - 'C: t ≈ −4.20, but fail to reject H0 because n = 15 is below 30.'
  - 'D: t = −4.20 / 3.873 ≈ −1.08; p ≈ 0.30; fail to reject H0.'
  options_zh:
  - 'A: SE = 3.873 / √15 ≈ 1.000 秒；t ≈ −4.20；df = 14；p ≈ 0.0009；拒绝 H0。'
  - 'B: SE = 3.873 / 15 ≈ 0.258 秒；t ≈ −16.3；df = 14；拒绝 H0。'
  - 'C: t ≈ −4.20，但 n = 15 少于 30，所以不拒绝 H0。'
  - 'D: t = −4.20 / 3.873 ≈ −1.08；p ≈ 0.30；不拒绝 H0。'
  options_zh_hk:
  - 'A: SE = 3.873 / √15 ≈ 1.000 秒；t ≈ −4.20；df = 14；p ≈ 0.0009；拒絕 H0。'
  - 'B: SE = 3.873 / 15 ≈ 0.258 秒；t ≈ −16.3；df = 14；拒絕 H0。'
  - 'C: t ≈ −4.20，但 n = 15 少過 30，所以唔拒絕 H0。'
  - 'D: t = −4.20 / 3.873 ≈ −1.08；p ≈ 0.30；唔拒絕 H0。'
  answer: A
  explanation_en: SE = 3.873 / √15 ≈ 1.000, so t ≈ −4.20 with 14 df and two-sided p ≈ 0.0009; reject H0. B divides by n
    instead of √n, C misuses the n = 30 rule (the t-test handles small samples), and D forgets to divide by √n at all.
  explanation_zh: SE = 3.873 / √15 ≈ 1.000，所以 t ≈ −4.20，自由度 14，双尾 p ≈ 0.0009，拒绝 H0。B 除以 n 而不是 √n；C 误用了 n = 30 的说法，t 检验本来就是给小样本用的；D 完全没除以 √n。
  explanation_zh_hk: SE = 3.873 / √15 ≈ 1.000，所以 t ≈ −4.20，自由度 14，雙尾 p ≈ 0.0009，拒絕 H0。B 除 n 而唔係除 √n；C 誤用咗 n = 30 嘅講法，t 檢驗本身就係俾細樣本用；D 完全冇除 √n。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: Same people, twice
  kicker_zh: 同一批人，量两次
  kicker_zh_hk: 同一批人，量兩次
  title_en: Same baristas, now faster?
  title_zh: 同一批咖啡师变快了吗？
  title_zh_hk: 同一批咖啡師快咗未？
  en: >-
    Suppose Shop A times 15 baristas making a drink, then sends them to a short training, and times the same 15 again.
    Some baristas were always quick, some always slow. Compare the two lists as if they were strangers, and those built-in
    differences drown out the training. So how do we see the change clearly? These are made-up teaching numbers.
  zh: >-
    假设A店先给 15 位咖啡师计时做一杯饮品，然后送他们去做个短期培训，回来再给同样这 15 位计时。有人本来就快，有人本来就慢。要是把前后两份名单当成两批陌生人来比，这些天生的差异就会把培训的效果盖住。那怎样才能把变化看清楚？下面都是教学用的假设数字。
  zh_hk: >-
    假設A店先同 15 位咖啡師計做一杯飲品嘅時間，跟住送佢哋去上個短期培訓，返嚟再同同樣呢 15 位計時。有人本身就快，有人本身就慢。如果將前後兩張名單當成兩批陌生人嚟比，呢啲本身嘅差異就會遮住培訓嘅效果。噉點樣先睇得清變化？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: One difference per barista
  title_zh: 每位咖啡师一个差值
  title_zh_hk: 每位咖啡師一個差值
  formula: 't = (mean D − 0) / (sD / √n)'
  formula_zh: 't = (平均差值 − 0) / (sD / √n)'
  formula_zh_hk: 't = (平均差值 − 0) / (sD / √n)'
  formula_tex: 'D_i = X_{after,i} - X_{before,i} \qquad t = \frac{\bar{D} - 0}{s_D/\sqrt{n}}'
  s1_en: >-
    On the left, each barista gets one number: the after time minus the before time. Fix this direction first. Here a
    negative difference means that barista got faster.
  s1_zh: >-
    左边，每位咖啡师只留一个数：训后的时间减训前的时间。方向要先定好。这里差值是负的，就表示这位咖啡师变快了。
  s1_zh_hk: >-
    左邊，每位咖啡師淨係留一個數：訓後嘅時間減訓前嘅時間。方向要先定好。呢度差值係負，就表示呢位咖啡師快咗。
  s2_en: >-
    On the right, we just run a one-sample t-test on those differences. On top, the mean difference, D-bar, minus zero.
    Underneath, s_D, the standard deviation of the differences, over root n.
  s2_zh: >-
    右边，就是对这些差值做一次单样本 t 检验。上面是平均差值（D-bar）减 0；下面是差值的标准差 s_D，除以根号 n。
  s2_zh_hk: >-
    右邊，就係對呢啲差值做一次單樣本 t 檢驗。上面係平均差值（D-bar）減 0；下面係差值嘅標準差 s_D，除根號 n。
  s3_en: >-
    There are n differences, so the degrees of freedom are n minus 1. Never use the separate before and after
    standard deviations here.
  s3_zh: >-
    一共 n 个差值，所以自由度是 n 减 1。这里千万不要分别拿训前、训后的标准差来算。
  s3_zh_hk: >-
    總共 n 個差值，所以自由度係 n 減 1。呢度千祈唔好分開攞訓前、訓後嘅標準差嚟計。
- id: name_paired
  visual: title_card
  seconds: 18
  kicker_en: The name
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Paired-difference t-test
  title_zh: 配对差值 t 检验
  title_zh_hk: 配對差值 t 檢驗
  en: >-
    Now the name. This is the paired-difference t-test, or paired t-test. Each D is a difference score.
  zh: >-
    现在给它起名字。这叫配对差值 t 检验（paired-difference t-test）。每个 D 叫配对差值（difference score）。
  zh_hk: >-
    而家幫佢改名。呢個叫配對差值 t 檢驗（paired-difference t-test）。每個 D 叫配對差值（difference score）。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: When pairing helps
  kicker_zh: 配对什么时候有用
  kicker_zh_hk: 配對幾時有用
  title_en: A good match cuts the noise
  title_zh: 配得好，杂音就少
  title_zh_hk: 配得好，雜音就少
  left_en: 'Valid: same barista, task'
  left_zh: 有效：同一人、同一任务
  left_zh_hk: 有效：同一人、同一任務
  right_en: 'Weak: mismatch, drift'
  right_zh: 失效：配错、时间漂移
  right_zh_hk: 失效：配錯、時間漂移
  s1_en: >-
    If a barista who is quick before is usually quick after, subtracting cancels that steady difference between people.
    The differences then vary less, so the standard error shrinks. This gain is not guaranteed; it depends on how strongly
    the before and after times move together.
  s1_zh: >-
    如果训前快的人，训后通常也快，一相减，人与人之间那种稳定的差异就抵消了。差值的波动变小，标准误也跟着变小。不过这个好处不是一定有的，要看前后时间一起变动得有多紧。
  s1_zh_hk: >-
    如果訓前快嘅人，訓後通常都快，一減，人同人之間嗰種穩定嘅差異就抵消咗。差值嘅波動細咗，標準誤都跟住細咗。不過呢個好處唔係一定有，要睇前後時間一齊郁得幾貼。
  s2_en: >-
    Pairing does not remove every source of noise. A busier week, practice, a new machine, or baristas dropping out can
    also move the differences. To say the training caused the change, you need a design that rules those out.
  s2_zh: >-
    配对不会消掉所有杂音。比较忙的一周、做熟了、换了新机器，或者有咖啡师中途退出，都会推动差值。要说是培训造成的变化，就需要能排除这些因素的设计。
  s2_zh_hk: >-
    配對唔會消晒所有雜音。比較忙嘅一個星期、做熟咗、換咗新機，或者有咖啡師中途走咗，都會推動差值。要講係培訓造成嘅變化，就需要排除到呢啲因素嘅設計。
  s3_en: >-
    The pairs should be independent of each other. With a small sample, check the differences for heavy skew or outliers.
    The checks are on the differences, not on the before and after times separately.
  s3_zh: >-
    不同配对之间要相互独立。样本小的时候，要看看差值有没有严重偏斜或异常值。要检查的是差值，不是分别检查训前和训后的时间。
  s3_zh_hk: >-
    唔同配對之間要互相獨立。樣本細嗰陣，要睇吓差值有冇嚴重偏斜或者異常值。要檢查嘅係差值，唔係分開檢查訓前同訓後嘅時間。
- id: ledger
  visual: steps
  layout: rows
  seconds: 100
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: 'Shop A: 15 baristas'
  title_zh: A店：15 位咖啡师
  title_zh_hk: A店：15 位咖啡師
  step1_en: 'H0: μD = 0 vs H1: μD ≠ 0'
  step1_zh: 'H0: μD = 0 对 H1: μD ≠ 0'
  step1_zh_hk: 'H0: μD = 0 對 H1: μD ≠ 0'
  step2_en: 'mean D = −4.20; sD = 3.873'
  step2_zh: '平均差值 −4.20；sD = 3.873'
  step2_zh_hk: '平均差值 −4.20；sD = 3.873'
  step3_en: 'SE = 3.873 / √15 ≈ 1.000 s'
  step3_zh: 'SE = 3.873 / √15 ≈ 1.000 秒'
  step3_zh_hk: 'SE = 3.873 / √15 ≈ 1.000 秒'
  step4_en: 't ≈ −4.20; df = 14'
  step4_zh: 't ≈ −4.20；df = 14'
  step4_zh_hk: 't ≈ −4.20；df = 14'
  step5_en: 'p ≈ 0.0009; reject H0'
  step5_zh: 'p ≈ 0.0009；拒绝 H0'
  step5_zh_hk: 'p ≈ 0.0009；拒絕 H0'
  s1_en: >-
    Let us work it through. The null hypothesis says the true mean difference is zero; the alternative says it is not.
  s1_zh: >-
    我们来算一遍。原假设说总体平均差值是 0，备择假设说不是 0。
  s1_zh_hk: >-
    我哋計一次。原假設話總體平均差值係 0，備擇假設話唔係 0。
  s2_en: >-
    Fifteen baristas, after minus before. The mean difference is minus 4.20 seconds, and the differences have a standard
    deviation of 3.873 seconds.
  s2_zh: >-
    15 位咖啡师，训后减训前。平均差值是负 4.20 秒，差值的标准差是 3.873 秒。
  s2_zh_hk: >-
    15 位咖啡師，訓後減訓前。平均差值係負 4.20 秒，差值嘅標準差係 3.873 秒。
  s3_en: >-
    The standard error is 3.873 over root 15. Root 15 is about 3.873, so the standard error is about 1.000 second.
  s3_zh: >-
    标准误是 3.873 除以根号 15。根号 15 大约就是 3.873，所以标准误大约 1.000 秒。
  s3_zh_hk: >-
    標準誤係 3.873 除根號 15。根號 15 大約就係 3.873，所以標準誤大約 1.000 秒。
  s4_en: >-
    So t is minus 4.20 divided by 1, about minus 4.20, with 15 minus 1, that is 14, degrees of freedom.
  s4_zh: >-
    所以 t 就是负 4.20 除以 1，大约负 4.20，自由度是 15 减 1，也就是 14。
  s4_zh_hk: >-
    所以 t 就係負 4.20 除 1，大約負 4.20，自由度係 15 減 1，即係 14。
  s5_en: >-
    With 14 degrees of freedom, the two-sided 5 percent critical value is 2.145, and 4.20 is well past it. The p-value
    is about 0.0009. So we reject H0. On average, these baristas were faster after training, but this alone does not
    prove the training caused it.
  s5_zh: >-
    自由度 14 时，5% 双尾临界值是 2.145，4.20 远远越过了它；p 值大约 0.0009。所以拒绝 H0。平均来说，这批咖啡师训后变快了，但单凭这一点，还不能证明是培训造成的。
  s5_zh_hk: >-
    自由度 14 嗰陣，5% 雙尾臨界值係 2.145，4.20 遠遠越過咗佢；p 值大約 0.0009。所以拒絕 H0。平均嚟講，呢批咖啡師訓後快咗，但淨係憑呢點，仲未證明到係培訓造成。
- id: takeaway
  visual: takeaway
  seconds: 56
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Same units? Test the differences
  title_zh: 同一批单元，就检验差值
  title_zh_hk: 同一批單元，就檢驗差值
  q1_en: When does pairing help, and when not?
  q1_zh: 配对什么时候有用，什么时候没用？
  q1_zh_hk: 配對幾時有用，幾時冇用？
  q2_en: What to check before crediting training?
  q2_zh: 归功于培训之前，要查什么？
  q2_zh_hk: 歸功於培訓之前，要查乜嘢？
  s1_en: >-
    Pairing helps when the match is real and the before and after times move together. Mismatched pairs ruin the design,
    and a weak link gives little gain.
  s1_zh: >-
    匹配是真的、前后时间又一起变动时，配对就有用。配错了，设计就毁了；关联弱的话，好处也不大。
  s1_zh_hk: >-
    匹配係真嘅、前後時間又一齊郁嗰陣，配對就有用。配錯咗，設計就冇咗用；關聯弱嘅話，好處都唔大。
  s2_en: >-
    Before crediting the training, check for other changes at the same time, practice effects, consistent timing, and
    missing pairs. A comparison group, ideally randomized, helps most. Report the mean difference with its uncertainty.
  s2_zh: >-
    把功劳算给培训之前，要查有没有同期的其他变化、做熟了的效应、计时是否一致、有没有缺失的配对。最有用的是一个对照组，最好是随机分配的。报告平均差值时要带上它的不确定性。
  s2_zh_hk: >-
    將功勞計俾培訓之前，要查有冇同期嘅其他變化、做熟咗嘅效應、計時係咪一致、有冇缺失嘅配對。最有用係一個對照組，最好係隨機分配。報告平均差值嗰陣要連埋佢嘅不確定性。
  s3_en: >-
    So, how do we see the change clearly? Give each barista one difference and test those. Here t is about minus 4.20
    and p about 0.0009: evidence of an average speed-up, not proof of why, and no verdict on any one barista.
  s3_zh: >-
    所以，怎样把变化看清楚？每位咖啡师算一个差值，再检验这些差值。这里 t 大约负 4.20，p 大约 0.0009：这是平均变快的证据，不是原因的证明，也不是对哪位咖啡师的评判。
  s3_zh_hk: >-
    所以，點樣睇清變化？每位咖啡師計一個差值，再檢驗呢啲差值。呢度 t 大約負 4.20，p 大約 0.0009：呢個係平均快咗嘅證據，唔係原因嘅證明，亦唔係對邊位咖啡師嘅評判。
