id: STAT-M05-T11-PAIRD
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Paired-Difference t-Test: Testing Change within Matched Units'
title_zh: 配对差值 t 检验：检验匹配单元内的变化
title_zh_hk: 配對差值 t 檢驗：檢驗匹配單元內嘅變化
objective_en: Convert matched before-and-after observations into one difference score per unit, formulate and execute a one-sample
  t-test on those differences, explain when pairing can improve precision and when it cannot, and interpret an assumed workflow-training
  result without making employee-level or causal claims beyond the design.
objective_zh: 把匹配的前后观测转化为每个单元一个差值，对这些差值构建并执行单样本 t 检验，解释配对何时可以提高精度、何时不能，并解释假设的流程培训结果，同时避免作出超出设计范围的员工个人或因果结论。
objective_zh_hk: 將匹配嘅前後觀測轉化成每個單元一個差值，對呢啲差值構建並執行單樣本 t 檢驗，解釋配對幾時可以提高精度、幾時唔可以，並解讀假設嘅流程培訓結果，同時避免作出超出設計範圍嘅員工個人或者因果結論。
