quiz:
- id: Q1
  type: multiple_choice
  question_en: Why can a paired design have a smaller variance of the difference than an independent design?
  question_zh: 为什么配对设计的差值方差，可能比独立设计的小？
  question_zh_hk: 點解配對設計嘅差值方差，可能比獨立設計細？
  options_en:
  - 'A: Var(X1 − X2) subtracts 2Cov(X1, X2); with a valid match and positive covariance, the variance of the difference shrinks.'
  - 'B: Pairing doubles the number of measurements, so the variance is automatically cut in half.'
  - 'C: Pairing removes every source of bias, including carryover from the first period.'
  - 'D: The covariance is added in the paired formula, so a larger covariance always means more precision.'
  options_zh:
  - 'A: Var(X1 − X2) 要减去 2Cov(X1, X2)；匹配有效、协方差为正时，差值方差就变小。'
  - 'B: 配对让测量次数翻倍，所以方差自动减半。'
  - 'C: 配对能消除所有偏差，包括第一期留下的滞后效应。'
  - 'D: 配对公式里协方差是加上去的，所以协方差越大，精度一定越高。'
  options_zh_hk:
  - 'A: Var(X1 − X2) 要減去 2Cov(X1, X2)；匹配有效、協方差係正嗰陣，差值方差就會細咗。'
  - 'B: 配對令量度次數加倍，所以方差自動減半。'
  - 'C: 配對可以消除所有偏差，包括第一期留低嘅滯後效應。'
  - 'D: 配對公式入面協方差係加上去，所以協方差越大，精度一定越高。'
  answer: A
  explanation_en: 'The gain comes from positive covariance within pairs, which is subtracted twice. B is wrong: the variance
    falls only as much as the covariance allows. C is wrong: pairing does not remove carryover or period effects. D is wrong:
    the covariance term is subtracted, not added.'
  explanation_zh: 好处来自配对内的正协方差，它在公式里被减去两倍。B 错在方差减少多少取决于协方差，不会自动减半；C 错在配对消除不了滞后效应或时期效应；D 错在协方差项是减去的，不是加上的。
  explanation_zh_hk: 好處嚟自配對內嘅正協方差，佢喺公式入面被減去兩倍。B 錯喺方差減幾多要睇協方差，唔會自動減半；C 錯喺配對消除唔到滯後效應或者時期效應；D 錯喺協方差項係減去，唔係加上。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose a chain tests new order software in 10 shops. Why might it choose 5 shops vs 5 shops in parallel instead
    of having the same shops switch systems week by week?'
  question_zh: 假设一家连锁店在 10 家门店测试新的派单软件。为什么它可能选 5 家对 5 家平行运行，而不是让同一批门店每周轮流切换系统？
  question_zh_hk: 假設一間連鎖店喺 10 間門市測試新嘅派單軟件。點解佢可能揀 5 間對 5 間平行運行，而唔係叫同一批門市每個星期輪流切換系統？
  options_en:
  - 'A: Once staff learn the new screen, switching back cannot undo that learning, so the old-system weeks are contaminated.'
  - 'B: Parallel groups always have a smaller variance of the difference than pairs.'
  - 'C: With only 10 shops, a paired t-test cannot be calculated at all.'
  - 'D: Parallel groups make the p-value land exactly on 0.05.'
  options_zh:
  - 'A: 店员一旦学会新界面，切回旧系统也忘不掉，旧系统那几周就被污染了。'
  - 'B: 平行分组的差值方差一定比配对小。'
  - 'C: 只有 10 家门店，根本算不了配对 t 检验。'
  - 'D: 平行分组能让 p 值刚好等于 0.05。'
  options_zh_hk:
  - 'A: 店員一學識新界面，切返舊系統都唔會唔記得，舊系統嗰幾個星期就被污染咗。'
  - 'B: 平行分組嘅差值方差一定比配對細。'
  - 'C: 得 10 間門市，根本計唔到配對 t 檢驗。'
  - 'D: 平行分組可以令 p 值啱啱等於 0.05。'
  answer: A
  explanation_en: 'Learning that persists is a carryover effect; it biases the paired contrast, so independent groups protect
    the comparison at some cost in precision. B is wrong: pairing is usually the more precise design. C is wrong: a small
    sample still gives a t-test, with few degrees of freedom. D is wrong: no design fixes the p-value.'
  explanation_zh: 学会了就忘不掉，这就是滞后效应，它会让配对比较有偏；独立分组牺牲一点精度，却能保护比较。B 错在通常配对才是更精确的设计；C 错在样本小也能做 t 检验，只是自由度少；D 错在没有任何设计能定死 p 值。
  explanation_zh_hk: 學識咗就唔會唔記得，呢個就係滯後效應，佢會令配對比較有偏；獨立分組犧牲少少精度，但保護到比較。B 錯喺通常配對先係更精確嘅設計；C 錯喺樣本細都做到 t 檢驗，只係自由度少；D 錯喺冇任何設計可以定死 p 值。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The software pilot
  kicker_zh: 新软件试点
  kicker_zh_hk: 新軟件試點
  title_en: 'Paired or independent design?'
  title_zh: 配对设计还是独立设计？
  title_zh_hk: 配對設計定獨立設計？
  en: >-
    Suppose a chain wants to test new order software before rolling it out. Pick the wrong test plan, and it either
    misses a real speed-up in the noise, or credits the software for something staff simply learned. One plan lets
    the same shops try both systems. The other gives different shops different systems. Which design protects the
    answer? These are made-up teaching numbers.
  zh: >-
    假设一家连锁店想先试一试新的派单软件，再决定要不要全面推广。试验方案选错了，要么真实的提速被杂音盖住，要么把店员自己学到的东西错算成软件的功劳。一种方案是让同一批门店两套系统都用一遍；另一种是让不同的门店用不同的系统。哪种设计才能把答案保护好？下面都是教学用的假设数字。
  zh_hk: >-
    假設一間連鎖店想先試吓新嘅派單軟件，再決定要唔要全面推出。試驗方案揀錯咗，一係真正嘅提速俾雜音遮住，一係將店員自己學識嘅嘢錯計成軟件嘅功勞。一種方案係叫同一批門市兩套系統都用一次；另一種係俾唔同門市用唔同系統。邊種設計先保護到個答案？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 56
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: Why pairing can shrink the noise
  title_zh: 配对为什么能减少杂音
  title_zh_hk: 配對點解可以減少雜音
  formula: 'Var(X1−X2) = VarX1 + VarX2 − 2Cov'
  formula_zh: 'Var(X1 − X2) = Var(X1) + Var(X2) − 2Cov(X1, X2)'
  formula_zh_hk: 'Var(X1 − X2) = Var(X1) + Var(X2) − 2Cov(X1, X2)'
  formula_tex: '\mathrm{Var}(X_1 - X_2) = \mathrm{Var}(X_1) + \mathrm{Var}(X_2) - 2\,\mathrm{Cov}(X_1, X_2)'
  s1_en: >-
    So how do the two plans differ? Call one shop's time on the old system X1, and on the new system X2. We care
    about the difference. Its variance, the spread of that difference, starts as the two variances added together.
  s1_zh: >-
    那两种方案差在哪里？把一家门店用旧系统的时间叫 X1，用新系统的时间叫 X2。我们关心的是两者的差。差值的方差，也就是差值有多分散，一开始是两个方差加起来。
  s1_zh_hk: >-
    噉兩種方案差喺邊？將一間門市用舊系統嘅時間叫 X1，用新系統嘅時間叫 X2。我哋關心嘅係兩者嘅差。差值嘅方差，即係差值有幾分散，一開始係兩個方差加埋。
  s2_en: >-
    Then comes the covariance, how much the two times move together. If the same shop is quick on both systems, the
    covariance is positive, and we subtract it twice. With different shops on each system, the two times are unrelated,
    so nothing is subtracted.
  s2_zh: >-
    接下来是协方差，也就是两个时间一起变动的程度。同一家门店两套系统都快，协方差就是正的，要减去它的两倍。如果两套系统由不同门店来用，两个时间互不相关，就没有东西可减。
  s2_zh_hk: >-
    跟住係協方差，即係兩個時間一齊郁嘅程度。同一間門市兩套系統都快，協方差就係正，要減去佢嘅兩倍。如果兩套系統由唔同門市用，兩個時間冇關係，就冇嘢可以減。
- id: name_designs
  visual: title_card
  seconds: 22
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Paired vs independent design
  title_zh: 自身对照设计 与 独立分组设计
  title_zh_hk: 自身對照設計 同 獨立分組設計
  en: >-
    Now the names. Same shops trying both systems is a within-subject design, or paired design. Different shops on
    each system is a between-subject design, or independent design.
  zh: >-
    现在说名字。同一批门店两套系统都用，叫自身对照设计（within-subject design），也就是配对设计。不同门店各用一套，叫独立分组设计（between-subject design），也就是独立设计。
  zh_hk: >-
    而家講名。同一批門市兩套系統都用，叫自身對照設計（within-subject design），即係配對設計。唔同門市各用一套，叫獨立分組設計（between-subject design），即係獨立設計。
- id: mechanics
  visual: two_column
  seconds: 66
  kicker_en: The trade-off
  kicker_zh: 两头权衡
  kicker_zh_hk: 兩頭權衡
  title_en: Precision vs contamination
  title_zh: 精度 对 污染
  title_zh_hk: 精度 對 污染
  left_en: 'Pairs: less noise, carryover'
  left_zh: 配对：杂音少，怕滞后效应
  left_zh_hk: 配對：雜音少，怕滯後效應
  right_en: 'Separate: clean, more shops'
  right_zh: 独立：无滞后，要更多门店
  right_zh_hk: 獨立：冇滯後，要多啲門市
  s1_en: >-
    That subtraction is the paired design's strength. Steady differences between shops cancel out. It works best when
    the effect wears off, the weeks are comparable, and a break between periods clears out the old system. Random
    order helps, but it cannot make leftover effects disappear.
  s1_zh: >-
    这一减，就是配对设计的长处：门店之间稳定的差异抵消掉了。效果会消退、各周可比、两期之间留够间隔时，它最好用。随机安排先后有帮助，但消除不了残留影响。
  s1_zh_hk: >-
    呢一減，就係配對設計嘅長處：門市之間穩定嘅差異抵消咗。效果會消退、每個星期可比、兩期之間留夠間隔嗰陣，佢最好用。隨機安排先後有幫助，但消除唔到殘留影響。
  s2_en: >-
    The danger is a carryover effect. Staff who learn the new screen cannot unlearn it when they switch back, so the
    old-system weeks are no longer clean. Habits, settings, or word of mouth can spill over the same way.
  s2_zh: >-
    危险在于滞后效应（carryover effect）。店员学会了新界面，切回旧系统时也忘不掉，旧系统那几周就不干净了。习惯、设置，甚至口碑，也会这样渗过去。
  s2_zh_hk: >-
    危險在於滯後效應（carryover effect）。店員學識咗新界面，切返舊系統都唔會唔記得，舊系統嗰幾個星期就唔再乾淨。習慣、設定，甚至口碑，都會噉樣滲過去。
  s3_en: >-
    Independent groups avoid that, because no shop ever switches. The price is more noise, so you usually need more
    shops, and random assignment to keep the groups balanced. With a small pilot, even random groups can differ by luck.
  s3_zh: >-
    独立分组就避开了这个问题，因为没有门店需要切换。代价是杂音更多，通常要更多门店，还要随机分配，让两组尽量平衡。试点规模小的话，就算随机分组，两组也可能碰巧不一样。
  s3_zh_hk: >-
    獨立分組就避開咗呢個問題，因為冇門市要切換。代價係雜音多啲，通常要多啲門市，仲要隨機分配，令兩組盡量平衡。試點規模細嘅話，就算隨機分組，兩組都可能好彩唔好彩咁唔同。
- id: ledger
  visual: steps
  layout: rows
  seconds: 96
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: How much can pairing save?
  title_zh: 配对能省下多少杂音？
  title_zh_hk: 配對可以慳幾多雜音？
  step1_en: 'SD = 6 s;  Var = 6 × 6 = 36 s²'
  step1_zh: 'SD = 6 秒；Var = 6 × 6 = 36 秒²'
  step1_zh_hk: 'SD = 6 秒；Var = 6 × 6 = 36 秒²'
  step2_en: 'Independent: 36 + 36 = 72 s²'
  step2_zh: '独立：36 + 36 = 72 秒²'
  step2_zh_hk: '獨立：36 + 36 = 72 秒²'
  step3_en: 'Cov = 0.80 × 6 × 6 = 28.8 s²'
  step3_zh: 'Cov = 0.80 × 6 × 6 = 28.8 秒²'
  step3_zh_hk: 'Cov = 0.80 × 6 × 6 = 28.8 秒²'
  step4_en: 'Paired: 72 − 57.6 = 14.4 s²'
  step4_zh: '配对：72 − 57.6 = 14.4 秒²'
  step4_zh_hk: '配對：72 − 57.6 = 14.4 秒²'
  step5_en: '(72 − 14.4) / 72 = 80% less'
  step5_zh: '(72 − 14.4) / 72 = 少 80%'
  step5_zh_hk: '(72 − 14.4) / 72 = 少 80%'
  s1_en: >-
    Let us put numbers on it. Suppose order times on each system have a standard deviation of 6 seconds. The variance
    is that number times itself, 6 times 6, which is 36 square seconds.
  s1_zh: >-
    我们代入数字。假设每套系统的出单时间，标准差都是 6 秒。方差就是这个数乘它自己，6 乘 6，等于 36 平方秒。
  s1_zh_hk: >-
    我哋代啲數字入去。假設每套系統嘅出單時間，標準差都係 6 秒。方差就係呢個數乘佢自己，6 乘 6，等於 36 平方秒。
  s2_en: >-
    With independent groups, nothing is subtracted. The variance of the difference is 36 plus 36, which is 72 square
    seconds.
  s2_zh: >-
    独立分组的话，没有东西可减。差值的方差就是 36 加 36，等于 72 平方秒。
  s2_zh_hk: >-
    獨立分組嘅話，冇嘢可以減。差值嘅方差就係 36 加 36，等於 72 平方秒。
  s3_en: >-
    Now pair the shops, and suppose the correlation between a shop's two times is 0.80. The covariance is 0.80 times
    6 times 6, which is 28.8 square seconds.
  s3_zh: >-
    现在改成配对，假设同一家门店两次时间的相关系数是 0.80。协方差就是 0.80 乘 6 乘 6，等于 28.8 平方秒。
  s3_zh_hk: >-
    而家改做配對，假設同一間門市兩次時間嘅相關係數係 0.80。協方差就係 0.80 乘 6 乘 6，等於 28.8 平方秒。
  s4_en: >-
    Subtract it twice. 2 times 28.8 is 57.6, and 72 minus 57.6 is 14.4 square seconds.
  s4_zh: >-
    把它减去两倍。2 乘 28.8 是 57.6，72 减 57.6，等于 14.4 平方秒。
  s4_zh_hk: >-
    將佢減兩倍。2 乘 28.8 係 57.6，72 減 57.6，等於 14.4 平方秒。
  s5_en: >-
    The drop is 57.6 out of 72, which is 80 percent less variance. That is a potential gain, not a verdict. If learning
    carries over after switching, the paired comparison can be biased however small its variance.
  s5_zh: >-
    少了 57.6，占 72 的 80%，方差少了八成。不过这只是潜在的好处，不是定论。如果切换之后学到的东西还留着，配对比较即使方差再小，也可能有偏。
  s5_zh_hk: >-
    少咗 57.6，佔 72 嘅 80%，方差少咗八成。不過呢個只係潛在嘅好處，唔係定論。如果切換之後學到嘅嘢仲留住，配對比較就算方差幾細，都可能有偏。
- id: takeaway
  visual: takeaway
  seconds: 58
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Protect the comparison first
  title_zh: 先保护好比较
  title_zh_hk: 先保護好比較
  q1_en: When does pairing pay off?
  q1_zh: 配对什么时候划算？
  q1_zh_hk: 配對幾時抵？
  q2_en: When are separate shops safer?
  q2_zh: 什么时候分开门店更稳妥？
  q2_zh_hk: 幾時分開門市更穩陣？
  s1_en: >-
    Pairing pays off when the match is real and a shop's two times move together. The gain depends on the actual
    covariance, so estimate it from the data instead of assuming 0.80.
  s1_zh: >-
    匹配是真的、同一家门店的两次时间又一起变动时，配对就划算。好处有多大取决于实际的协方差，要从数据里估计，不能直接假定是 0.80。
  s1_zh_hk: >-
    匹配係真嘅、同一間門市兩次時間又一齊郁嗰陣，配對就抵。好處有幾大要睇實際嘅協方差，要由數據估計，唔可以直接假定係 0.80。
  s2_en: >-
    Separate shops are safer when learning, habits, settings, or spillover would linger after a switch. Then use random
    assignment, measure every shop the same way, and fix the analysis plan in advance.
  s2_zh: >-
    切换之后，学到的东西、习惯、设置或外溢影响还会留着，那分开门店就更稳妥。这时要随机分配，每家门店用同样方法测量，并且事先定好分析方案。
  s2_zh_hk: >-
    切換之後，學到嘅嘢、習慣、設定或者外溢影響仲會留低，噉分開門市就更穩陣。呢個時候要隨機分配，每間門市用同一個方法量度，仲要預先定好分析方案。
  s3_en: >-
    So which design protects the answer? Pairing can cut the variance here from 72 to 14.4 square seconds, but only if
    the comparison stays clean. When carryover is likely, independent groups protect the answer. Precision cannot fix a
    contaminated comparison.
  s3_zh: >-
    所以，哪种设计能保护答案？这里配对能把方差从 72 降到 14.4 平方秒，但前提是比较保持干净。滞后效应很可能出现时，独立分组才能保护答案。精度再高，也补救不了被污染的比较。
  s3_zh_hk: >-
    所以，邊種設計保護到答案？呢度配對可以將方差由 72 降到 14.4 平方秒，但前提係比較保持乾淨。滯後效應好可能出現嗰陣，獨立分組先保護到答案。精度幾高，都補救唔到被污染嘅比較。
