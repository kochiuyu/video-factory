course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 338
title_en: 'Paired or Independent Design?'
title_zh: 配对还是独立：怎样选实验设计
title_zh_hk: 配對定獨立：點揀實驗設計
objective_en: Compare paired within-unit and independent parallel-group designs, explain how covariance affects the variance
  of a difference, identify carryover, period, order, and spillover risks, and choose a defensible design for an assumed store-software
  pilot without inventing verified rollout facts or costs.
objective_zh: 比较单元内配对设计与独立平行组设计，解释协方差如何影响差值方差，识别延续、时期、顺序与外溢风险，并为假设的门店软件试点选择有依据的设计，同时避免虚构已核实的推广事实或成本。
objective_zh_hk: 比較單元內配對設計同獨立平行組設計，解釋協方差點樣影響差值方差，識別延續、時期、順序同外溢風險，並為假設嘅門市軟件試點選擇有依據嘅設計，同時避免虛構已核實嘅推廣事實或者成本。
youtube:
  description_en: |
    Paired or Independent Design?

    Suppose a chain wants to test new order software before rolling it out. Pick the wrong test plan, and it either misses a real speed-up in the noise, or credits the software for something staff simply learned. One plan lets the same shops try both systems. The other gives different shops each system.

    Same shops on both systems is a within-subject, or paired, design. Different shops on each system is a between-subject, or independent, design. Pairing can cut the variance of the difference by subtracting twice the covariance, but carryover, period, and order effects can bias the comparison.

    In an assumed example each system's SD is 6 s, so Var = 36. Independent groups give 36 + 36 = 72. With correlation 0.80, Cov = 28.8, and the paired variance is 72 − 2 × 28.8 = 14.4, an 80% drop. That gain is potential, not a verdict: if learning carries over after switching, the paired comparison can be contaminated.

    Rule: when carryover is likely, independent groups protect the answer. Precision cannot fix a contaminated comparison.
  description_zh: |
    配对还是独立：怎样选实验设计

    假设一家连锁想在全面推广前测试新的点单软件。选错了检验计划，要么在噪声里错过真正的提速，要么把员工学会的东西记到软件头上。一种计划让同一批门店两套系统都用；另一种让不同门店各用一套。

    同一批门店两套都用，叫自身对照设计（within-subject design），也就是配对设计。不同门店各用一套，叫独立分组设计（between-subject design）。配对可以通过减去两倍协方差来削减差值方差，但延续、时期和顺序效应会污染比较。

    在一个假设的例子里，每套系统的标准差是 6 秒，方差 36。独立组是 36 + 36 = 72。相关 0.80 时协方差 28.8，配对方差是 72 − 2 × 28.8 = 14.4，少了 80%。这是潜在收益，不是定论：切换后如果有学习残留，配对比较就会被污染。

    规则：延续效应很可能出现时，独立组更能保护答案。精度再高，也修不好被污染的比较。
  description_zh_hk: |
    配對定獨立：點揀實驗設計

    假設一間連鎖想喺全面推廣前測試新嘅點單軟件。揀錯咗檢驗計劃，一係喺雜音入面錯過真正嘅提速，一係將員工學會嘅嘢記落軟件頭上。一種計劃等同一批門市兩套系統都用；另一種等唔同門市各用一套。

    同一批門市兩套都用，叫自身對照設計（within-subject design），即係配對設計。唔同門市各用一套，叫獨立分組設計（between-subject design）。配對可以透過減去兩倍協方差嚟削減差值方差，但延續、時期同順序效應會污染比較。

    喺一個假設嘅例子入面，每套系統嘅標準差係 6 秒，方差 36。獨立組係 36 + 36 = 72。相關 0.80 嗰陣協方差 28.8，配對方差係 72 − 2 × 28.8 = 14.4，少咗 80%。呢個係潛在收益，唔係定論：切換後如果有學習殘留，配對比較就會被污染。

    規則：延續效應好可能出現嗰陣，獨立組更能保護答案。精度再高，都整唔好被污染嘅比較。
