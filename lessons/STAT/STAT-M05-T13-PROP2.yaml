quiz:
- id: Q1
  type: multiple_choice
  question_en: 'Why does the test of H₀: p₁ = p₂ use one pooled proportion in its standard error?'
  question_zh: '检验 H₀: p₁ = p₂ 时，为什么标准误里要用一个合并比例？'
  question_zh_hk: '檢驗 H₀: p₁ = p₂ 嗰陣，點解標準誤入面要用一個合併比例？'
  options_en:
  - 'A: Under H₀ both groups share one rate, so pooling all successes and all orders estimates that shared rate.'
  - 'B: The two groups have different sizes, so pooling is just a way to average the two sample rates.'
  - 'C: Pooling is always more accurate, so the confidence interval for p₁ − p₂ should be pooled too.'
  - 'D: H₁ says the rates differ, so we pool to measure how big the gap is.'
  options_zh:
  - 'A: 在 H₀ 下两组共用一个比例，所以把全部成功次数和全部订单合起来，估计这个共同比例。'
  - 'B: 两组样本量不同，合并只是把两个样本比例取个平均。'
  - 'C: 合并总是更准，所以 p₁ − p₂ 的置信区间也应该合并。'
  - 'D: H₁ 说两个比例不同，所以要合并来量出差距有多大。'
  options_zh_hk:
  - 'A: 喺 H₀ 之下兩組共用一個比例，所以將全部成功次數同全部訂單合埋，估計呢個共同比例。'
  - 'B: 兩組樣本量唔同，合併只係將兩個樣本比例攞個平均。'
  - 'C: 合併一定準啲，所以 p₁ − p₂ 嘅置信區間都應該合併。'
  - 'D: H₁ 話兩個比例唔同，所以要合併嚟量度差距有幾大。'
  answer: A
  explanation_en: 'The test works out what the gap would look like if H₀ were true, and H₀ says one shared rate. B is wrong:
    pooling counts every success and every order, which is not the plain average of the two rates when the groups differ in
    size. C is wrong: an interval does not assume the rates are equal, so it uses the two separate rates. D is wrong: the gap
    is measured by the difference of the two sample rates, not by pooling.'
  explanation_zh: 检验要算的是：假如 H₀ 成立，差距会是什么样子，而 H₀ 说两组只有一个共同比例。B 错在合并是把所有成功次数和所有订单加起来，两组大小不同时，并不等于两个比例的简单平均；C 错在置信区间不假定两个比例相等，所以用各自的比例；D 错在差距是用两个样本比例相减来量的，不是靠合并。
  explanation_zh_hk: 檢驗要計嘅係：假如 H₀ 成立，差距會係點樣，而 H₀ 話兩組得一個共同比例。B 錯喺合併係將所有成功次數同所有訂單加埋，兩組大細唔同嗰陣，唔等於兩個比例嘅簡單平均；C 錯喺置信區間唔假定兩個比例相等，所以用各自嘅比例；D 錯喺差距係用兩個樣本比例相減嚟量，唔係靠合併。
- id: Q2
  type: multiple_choice
  question_en: 'Suppose independent groups with 160 of 400 and 105 of 350 orders adding a pastry. Which two-sided pooled Z-test
    result for H₀: p₁ = p₂ is right?'
  question_zh: '假设两组独立：400 笔订单里 160 笔加购，350 笔订单里 105 笔加购。对 H₀: p₁ = p₂ 做双侧合并 Z 检验，哪个结果对？'
  question_zh_hk: '假設兩組獨立：400 筆訂單入面 160 筆加購，350 筆訂單入面 105 筆加購。對 H₀: p₁ = p₂ 做雙側合併 Z 檢驗，邊個結果啱？'
  options_en:
  - 'A: Pooled rate ≈ 0.3533, SE ≈ 0.0350, Z ≈ 2.86, p ≈ 0.0042; reject H₀ at α = 0.05.'
  - 'B: SE = √(0.3533 × 0.6467 / 750) ≈ 0.0175, so Z ≈ 5.73; reject H₀.'
  - 'C: Z ≈ 2.86 and p ≈ 0.0042, so there is only a 0.42% chance that H₀ is true.'
  - 'D: Z ≈ 2.86, so we reject H₀, which proves the self-order screen causes more add-ons.'
  options_zh:
  - 'A: 合并比例 ≈ 0.3533，标准误 ≈ 0.0350，Z ≈ 2.86，p ≈ 0.0042；在 α = 0.05 下拒绝 H₀。'
  - 'B: 标准误 = √(0.3533 × 0.6467 / 750) ≈ 0.0175，所以 Z ≈ 5.73；拒绝 H₀。'
  - 'C: Z ≈ 2.86，p ≈ 0.0042，所以 H₀ 为真的概率只有 0.42%。'
  - 'D: Z ≈ 2.86，拒绝 H₀，这证明了自助点单屏导致加购变多。'
  options_zh_hk:
  - 'A: 合併比例 ≈ 0.3533，標準誤 ≈ 0.0350，Z ≈ 2.86，p ≈ 0.0042；喺 α = 0.05 之下拒絕 H₀。'
  - 'B: 標準誤 = √(0.3533 × 0.6467 / 750) ≈ 0.0175，所以 Z ≈ 5.73；拒絕 H₀。'
  - 'C: Z ≈ 2.86，p ≈ 0.0042，所以 H₀ 成立嘅機會得 0.42%。'
  - 'D: Z ≈ 2.86，拒絕 H₀，即係證明咗自助點單屏令加購多咗。'
  answer: A
  explanation_en: 'Pooled rate = 265 / 750 ≈ 0.3533. SE = √(0.3533 × 0.6467 × (1/400 + 1/350)) ≈ 0.0350, and Z = 0.10 / 0.0350
    ≈ 2.86, two-sided p ≈ 0.0042. B is wrong: it divides by the total 750 instead of using 1/400 + 1/350. C is wrong: the p-value
    is the chance of a gap this big if H₀ were true, not the chance H₀ is true. D is wrong: rejecting H₀ shows a difference,
    not what caused it.'
  explanation_zh: 合并比例 = 265 / 750 ≈ 0.3533。标准误 = √(0.3533 × 0.6467 × (1/400 + 1/350)) ≈ 0.0350，Z = 0.10 / 0.0350 ≈ 2.86，双侧 p ≈ 0.0042。B 错在用总数 750 去除，没有用 1/400 + 1/350；C 错在 p 值是假如 H₀ 成立、看到这么大差距的概率，不是 H₀ 为真的概率；D 错在拒绝 H₀ 只说明有差异，说明不了是什么造成的。
  explanation_zh_hk: 合併比例 = 265 / 750 ≈ 0.3533。標準誤 = √(0.3533 × 0.6467 × (1/400 + 1/350)) ≈ 0.0350，Z = 0.10 / 0.0350 ≈ 2.86，雙側 p ≈ 0.0042。B 錯喺用總數 750 去除，冇用 1/400 + 1/350；C 錯喺 p 值係假如 H₀ 成立、見到咁大差距嘅機會，唔係 H₀ 成立嘅機會；D 錯喺拒絕 H₀ 只係話有差異，講唔到係咩造成。
beats:
- id: hook
  visual: title_card
  seconds: 40
  kicker_en: The ordering test
  kicker_zh: 点单方式大比拼
  kicker_zh_hk: 點單方式大比拼
  title_en: Is a 10-point gap real?
  title_zh: 十个百分点的差距是真的吗？
  title_zh_hk: 十個百分點嘅差距係咪真㗎？
  en: >-
    Suppose Shop A takes orders two ways, a self-order screen and the counter, and wants to know where customers add a
    pastry more often. Read too much into a lucky gap, and the shop changes how it serves people for nothing. On the
    screen, 160 of 400 orders add a pastry, which is 40%. At the counter, 105 of 350 do, which is 30%. Is that 10-point
    gap more than chance? These are made-up teaching numbers.
  zh: >-
    假设 A店有两种点单方式：自助点单屏和柜台，它想知道顾客在哪边更常加购一个点心。要是把碰巧出现的差距当真，门店就可能白白改掉服务方式。点单屏这边，400 笔订单里有 160 笔加购，也就是 40%；柜台这边，350 笔里有 105 笔，也就是 30%。这十个百分点的差距，是不是比运气更大？下面都是教学用的假设数字。
  zh_hk: >-
    假設 A店有兩種點單方式：自助點單屏同櫃台，佢想知顧客喺邊度多啲加購一個點心。如果將好彩撞出嚟嘅差距當真，門市就可能白白改咗服務方式。點單屏嗰邊，400 張單入面有 160 張加購，即係 40%；櫃台嗰邊，350 張入面有 105 張，即係 30%。呢十個百分點嘅差距，係咪大過運氣？以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 46
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: One shared rate under H₀
  title_zh: H₀ 下只有一个共同比例
  title_zh_hk: H₀ 之下得一個共同比例
  formula: 'Z = (p̂₁ − p̂₂) / SE_pool'
  formula_zh: 'Z = (p̂₁ − p̂₂) / SE_pool'
  formula_zh_hk: 'Z = (p̂₁ − p̂₂) / SE_pool'
  formula_tex: '\widehat{p} = \frac{X_1 + X_2}{n_1 + n_2} \qquad Z = \frac{\widehat{p}_1 - \widehat{p}_2}{\sqrt{\widehat{p}(1 - \widehat{p})\left(\frac{1}{n_1} + \frac{1}{n_2}\right)}}'
  s1_en: >-
    Start from the null hypothesis, H zero: the two rates are the same. Each sample rate, p-hat, is add-ons over
    orders. If H zero is true there is one rate, so add all the add-ons and divide by all the orders. That is the
    pooled p-hat.
  s1_zh: >-
    先从原假设 H₀ 出发：两个比例其实一样。每组的样本比例 p-hat，就是加购笔数除以订单数。H₀ 成立的话只有一个比例，所以把加购全部加起来，再除以全部订单，这就是合并的 p-hat。
  s1_zh_hk: >-
    先由原假設 H₀ 出發：兩個比例其實一樣。每組嘅樣本比例 p-hat，就係加購張數除以訂單數。H₀ 成立嘅話得一個比例，所以將加購全部加埋，再除以全部訂單，呢個就係合併嘅 p-hat。
  s2_en: >-
    Z is the gap divided by its standard error, the usual size of a gap from chance alone. Under H zero, it uses the
    pooled rate and one over each group size. An interval for the gap uses the two separate rates instead.
  s2_zh: >-
    Z 就是差距除以标准误，标准误就是单靠运气、差距通常有多大。在 H₀ 下，它用合并比例，再配上每组样本量的倒数。给差距算区间时，就改用两组各自的比例。
  s2_zh_hk: >-
    Z 就係差距除以標準誤，標準誤即係淨靠運氣、差距通常有幾大。喺 H₀ 之下，佢用合併比例，再配上每組樣本量嘅倒數。幫差距計區間嗰陣，就改用兩組各自嘅比例。
- id: name_prop2
  visual: title_card
  seconds: 18
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Two-sample proportion test
  title_zh: 双样本比例检验 与 合并样本比例
  title_zh_hk: 雙樣本比例檢驗 同 合併樣本比例
  en: >-
    Now the names. Comparing two rates from two independent groups is a two-sample proportion test. The rate built from
    all the add-ons over all the orders is the pooled sample proportion.
  zh: >-
    现在说名字。拿两个独立组的比例来比较，叫双样本比例检验（two-sample proportion test）。把全部加购除以全部订单得到的比例，叫合并样本比例（pooled sample proportion）。
  zh_hk: >-
    而家講名。攞兩個獨立組嘅比例嚟比較，叫雙樣本比例檢驗（two-sample proportion test）。將全部加購除以全部訂單得出嘅比例，叫合併樣本比例（pooled sample proportion）。
- id: mechanics
  visual: two_column
  seconds: 62
  kicker_en: Check first
  kicker_zh: 先检查
  kicker_zh_hk: 先檢查
  title_en: Check the design and counts
  title_zh: 先查设计和计数
  title_zh_hk: 先查設計同計數
  left_en: 'Independent groups, orders'
  left_zh: 组间、订单间独立
  left_zh_hk: 組間、訂單間獨立
  right_en: 'Expected counts at least 10'
  right_zh: 期望计数至少 10
  right_zh_hk: 期望計數至少 10
  s1_en: >-
    Before we trust Z, two checks. First, the design. The groups must be independent, and so must the orders inside
    each group. Orders from the same customer or the same day can move together, and then this test understates the
    uncertainty.
  s1_zh: >-
    在相信 Z 之前，先做两项检查。第一是设计：两组要互相独立，组里的每笔订单也要独立。同一个顾客、同一天、同一块屏幕的几笔订单可能一起变动，这时这个简单检验会低估不确定性。
  s1_zh_hk: >-
    喺信 Z 之前，先做兩樣檢查。第一係設計：兩組要互相獨立，組入面每張單都要獨立。同一個顧客、同一日、同一塊屏幕嘅幾張單可能一齊郁，噉樣呢個簡單檢驗會低估不確定性。
  s2_en: >-
    Second, the counts. Under H zero, each group needs enough expected add-ons and non-add-ons: group size times the
    pooled rate, and times one minus it. A common classroom guide is at least 10 of each, a rule of thumb, not a
    guarantee.
  s2_zh: >-
    第二是计数。在 H₀ 下，每组的期望加购数和不加购数都要够多，也就是样本量乘合并比例，以及乘一减合并比例。课堂常用标准是每类至少 10 个，这是经验规则，不是保证。
  s2_zh_hk: >-
    第二係計數。喺 H₀ 之下，每組嘅期望加購數同唔加購數都要夠多，即係樣本量乘合併比例，同埋乘一減合併比例。課堂常用標準係每類至少 10 個，呢個係經驗規則，唔係保證。
  s3_en: >-
    And even a clear gap does not say the screen caused it. Who chooses each way to order, the time of day, or how the
    pastry is offered can all differ. Changing how the shop serves people needs that separate evidence too.
  s3_zh: >-
    而且，就算差距很明显，也不能说就是点单屏造成的。谁选哪种方式点单、什么时段、点心怎么推荐，都可能不一样。门店要改服务方式，还需要这些另外的证据。
  s3_zh_hk: >-
    而且，就算差距好明顯，都唔可以話就係點單屏造成。邊個揀邊種方式點單、咩時段、點心點樣推介，都可能唔同。門市要改服務方式，仲需要呢啲另外嘅證據。
