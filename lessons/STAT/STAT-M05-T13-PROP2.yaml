  step3_en: 'Smallest expected ≈ 123.7'
  step3_zh: '最小期望计数 ≈ 123.7'
  step3_zh_hk: '最細期望計數 ≈ 123.7'
  step4_en: 'Z = 0.10 / 0.0350 ≈ 2.86'
  step4_zh: 'Z = 0.10 / 0.0350 ≈ 2.86'
  step4_zh_hk: 'Z = 0.10 / 0.0350 ≈ 2.86'
  step5_en: 'p ≈ 0.0042 < 0.05 → reject H₀'
  step5_zh: 'p ≈ 0.0042 < 0.05 → 拒绝 H₀'
  step5_zh_hk: 'p ≈ 0.0042 < 0.05 → 拒絕 H₀'
  s1_en: >-
    Now the numbers. The screen has 160 add-ons out of 400 orders, which is 0.40. The counter has 105 out of 350, which
    is 0.30. The gap is 0.10.
  s1_zh: >-
    现在代入数字。点单屏 400 笔订单里有 160 笔加购，是 0.40；柜台 350 笔里有 105 笔，是 0.30。差距是 0.10。
  s1_zh_hk: >-
    而家代啲數字入去。點單屏 400 張單入面有 160 張加購，係 0.40；櫃台 350 張入面有 105 張，係 0.30。差距係 0.10。
  s2_en: >-
    Pool them. 160 plus 105 is 265 add-ons, and 400 plus 350 is 750 orders. 265 divided by 750 is about 0.3533.
  s2_zh: >-
    合并起来。160 加 105 是 265 笔加购，400 加 350 是 750 笔订单。265 除以 750，约等于 0.3533。
  s2_zh_hk: >-
    合埋佢。160 加 105 係 265 張加購，400 加 350 係 750 張單。265 除以 750，大約係 0.3533。
  s3_en: >-
    Check the counts. 400 times 0.3533 is about 141.3 expected add-ons and 258.7 without. For the counter, about 123.7
    and 226.3. All are well above 10.
  s3_zh: >-
    检查计数。400 乘 0.3533，期望加购约 141.3，不加购约 258.7；柜台那边约 123.7 和 226.3。全部远远超过 10。
  s3_zh_hk: >-
    檢查計數。400 乘 0.3533，期望加購大約 141.3，唔加購大約 258.7；櫃台嗰邊大約 123.7 同 226.3。全部遠遠超過 10。
  s4_en: >-
    The standard error uses 0.3533, one minus 0.3533, and one over 400 plus one over 350. It comes to about 0.0350. So
    Z is 0.10 divided by 0.0350, about 2.86.
  s4_zh: >-
    标准误用 0.3533、一减 0.3533，再乘四百分之一加三百五十分之一，开方后约 0.0350。所以 Z 是 0.10 除以 0.0350，约 2.86。
  s4_zh_hk: >-
    標準誤用 0.3533、一減 0.3533，再乘四百分之一加三百五十分之一，開方之後大約 0.0350。所以 Z 係 0.10 除以 0.0350，大約 2.86。
  s5_en: >-
    A two-sided p-value for Z of 2.86 is about 0.0042, below the 5% significance level. So we reject H zero. Under
    these assumptions, the rates likely differ, with the screen higher in this sample. It does not prove the screen
    caused it.
  s5_zh: >-
    Z 等于 2.86，双侧 p 值约 0.0042，低于 5% 的显著性水平，所以拒绝 H₀。在这些假设下，两个比例很可能不同，这个样本里点单屏比较高。但这证明不了是点单屏造成的。
  s5_zh_hk: >-
    Z 等於 2.86，雙側 p 值大約 0.0042，低過 5% 嘅顯著性水平，所以拒絕 H₀。喺呢啲假設之下，兩個比例好可能唔同，呢個樣本入面點單屏高啲。但呢個證明唔到係點單屏造成。
- id: takeaway
  visual: takeaway
  seconds: 58
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Pool under H₀, then check
  title_zh: H₀ 下合并，再做检查
  title_zh_hk: H₀ 之下合併，再做檢查
  q1_en: Why pool the two rates?
  q1_zh: 为什么要合并两个比例？
  q1_zh_hk: 點解要合併兩個比例？
  q2_en: What to check before acting?
  q2_zh: 行动前要检查什么？
  q2_zh_hk: 行動之前要檢查咩？
  s1_en: >-
    We pool because H zero says the two groups share one rate, so all the add-ons over all the orders estimate it. Use
    this only for the equal-rates test, not for an interval for the gap.
  s1_zh: >-
    要合并，是因为 H₀ 说两组共用一个比例，所以全部加购除以全部订单，就是对它的估计。这只用在比例相等的检验，不用在差距的区间上。
  s1_zh_hk: >-
    要合併，係因為 H₀ 話兩組共用一個比例，所以全部加購除以全部訂單，就係對佢嘅估計。呢個只係用喺比例相等嘅檢驗，唔用喺差距嘅區間度。
  s2_en: >-
    Before acting, check that the groups were comparable or randomly assigned, that orders are independent, and that
    the expected counts are large enough. Then weigh the size of the gap, its uncertainty, and the practical costs.
  s2_zh: >-
    行动前，先检查两组是否可比、最好是随机分配，订单是否独立，期望计数够不够大。然后再权衡差距有多大、不确定性多大，以及实际成本。
  s2_zh_hk: >-
    行動之前，先檢查兩組係咪可比、最好係隨機分配，訂單係咪獨立，期望計數夠唔夠大。然後再衡量差距有幾大、不確定性幾大，同埋實際成本。
  s3_en: >-
    So is the 10-point gap real? Here Z is about 2.86 and p about 0.0042, so at the 5% level we reject equal rates. The
    gap is likely more than chance. Report it with its uncertainty, and keep the question of cause separate.
  s3_zh: >-
    那么，十个百分点的差距是真的吗？这里 Z 约 2.86，p 约 0.0042，在 5% 水平下拒绝两个比例相等。这个差距很可能不只是运气。报告时要连同不确定性一起说，原因的问题另外再查。
  s3_zh_hk: >-
    噉，十個百分點嘅差距係咪真㗎？呢度 Z 大約 2.86，p 大約 0.0042，喺 5% 水平之下拒絕兩個比例相等。呢個差距好可能唔只係運氣。報告嗰陣要連埋不確定性一齊講，原因嘅問題另外再查。
