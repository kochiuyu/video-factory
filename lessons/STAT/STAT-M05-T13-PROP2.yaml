title_en: 'Comparing Two Proportions: Pooled Z-Test'
title_zh: 双样本比例 Z 检验：比较两个转化率
title_zh_hk: 雙樣本比例 Z 檢驗：比較兩個轉化率
objective_en: Formulate and execute a pooled two-sample proportion Z-test for two independent conversion rates, explain why
  the null standard error uses a pooled proportion, verify the large-count condition using expected successes and failures
  under H0, and interpret an assumed kiosk-versus-counter comparison without converting statistical significance into staffing,
  causal, or rollout conclusions.
objective_zh: 构建并执行两个独立转化率的合并双样本比例 Z 检验，解释原假设标准误为何使用合并比例，利用 H0 下的期望成功与失败次数核验大计数条件，并解释假设的点单机与柜台比较，同时避免把统计显著性转化为人员配置、因果或推广结论。
objective_zh_hk: 構建並執行兩個獨立轉化率嘅合併雙樣本比例 Z 檢驗，解釋原假設標準誤點解使用合併比例，利用 H0 之下嘅期望成功同失敗次數核驗大計數條件，並解讀假設嘅點單機同櫃台比較，同時避免將統計顯著性轉化成人員配置、因果或者推廣結論。
youtube:
  description_en: |
    Comparing Two Proportions: Pooled Z-Test

    Suppose Shop A takes orders two ways, a self-order screen and the counter, and wants to know where customers add a pastry more often. On the screen, 160 of 400 orders add a pastry (40%). At the counter, 105 of 350 add one (30%). Read too much into a lucky gap, and the shop changes service for nothing.

    A two-sample proportion test compares two independent rates. Under H0 the rates are the same, so we pool all add-ons over all orders into one pooled sample proportion, then build a pooled SE for the difference.

    In an assumed example the gap is 0.10. The pooled rate is 265 / 750 ≈ 0.3533, the smallest expected cell is about 123.7, and Z = 0.10 / 0.0350 ≈ 2.86. The two-sided p-value is about 0.0042, so at the 5% level we reject equal rates. The screen is higher in this sample.

    Rule: pooling belongs to the equal-rates test, not to a confidence interval for the gap. Report the gap with its uncertainty, and keep cause separate.
  description_zh: |
    双样本比例 Z 检验：比较两个转化率

    假设A店有两种点单方式：自助点单屏和柜台，想知道顾客更常在哪里加购糕点。点单屏上，400 单里有 160 单加购（40%）；柜台上，350 单里有 105 单加购（30%）。把运气造成的差距看得太重，店里就会白白改服务方式。

    双样本比例检验（two-sample proportion test）比较两个独立比例。原假设说两组比例相同，所以把全部加购除以全部订单，得到合并样本比例（pooled sample proportion），再用它构造差值的合并标准误。

    在一个假设的例子里，差距是 0.10。合并比例是 265 / 750 ≈ 0.3533，最小期望格大约 123.7，Z = 0.10 / 0.0350 ≈ 2.86。双侧 p 值大约 0.0042，在 5% 水平拒绝比例相等。这个样本里点单屏更高。

    规则：合并只用在比例相等的检验，不用在差距的置信区间上。报告差距时要带上不确定性，原因另说。
  description_zh_hk: |
    雙樣本比例 Z 檢驗：比較兩個轉化率

    假設A店有兩種點單方式：自助點單屏同櫃檯，想知顧客更常喺邊度加購糕點。點單屏上面，400 單入面有 160 單加購（40%）；櫃檯上面，350 單入面有 105 單加購（30%）。將運氣造成嘅差距睇得太重，間舖就會白白改服務方式。

    雙樣本比例檢驗（two-sample proportion test）比較兩個獨立比例。原假設話兩組比例相同，所以將全部加購除以全部訂單，得到合併樣本比例（pooled sample proportion），再用佢構造差值嘅合併標準誤。

    喺一個假設嘅例子入面，差距係 0.10。合併比例係 265 / 750 ≈ 0.3533，最小期望格大約 123.7，Z = 0.10 / 0.0350 ≈ 2.86。雙側 p 值大約 0.0042，喺 5% 水平拒絕比例相等。呢個樣本入面點單屏更高。

    規則：合併只係用喺比例相等嘅檢驗，唔用喺差距嘅置信區間度。報告差距嗰陣要帶上不確定性，原因另講。
