id: STAT-M05-T13-PROP2
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Two-Sample Proportion Z-Test: Comparing Independent Conversion Rates'
title_zh: 双样本比例 Z 检验：比较两个独立转化率
title_zh_hk: 雙樣本比例 Z 檢驗：比較兩個獨立轉化率
objective_en: Formulate and execute a pooled two-sample proportion Z-test for two independent conversion rates, explain why
  the null standard error uses a pooled proportion, verify the large-count condition using expected successes and failures
  under H0, and interpret an assumed kiosk-versus-counter comparison without converting statistical significance into staffing,
  causal, or rollout conclusions.
objective_zh: 构建并执行两个独立转化率的合并双样本比例 Z 检验，解释原假设标准误为何使用合并比例，利用 H0 下的期望成功与失败次数核验大计数条件，并解释假设的点单机与柜台比较，同时避免把统计显著性转化为人员配置、因果或推广结论。
objective_zh_hk: 構建並執行兩個獨立轉化率嘅合併雙樣本比例 Z 檢驗，解釋原假設標準誤點解使用合併比例，利用 H0 之下嘅期望成功同失敗次數核驗大計數條件，並解讀假設嘅點單機同櫃台比較，同時避免將統計顯著性轉化成人員配置、因果或者推廣結論。
