title_en: 'A/B Test Pitfalls: Peeking and Many Tests'
title_zh: 对照实验的陷阱：中途偷看与多重检验
title_zh_hk: 對照實驗嘅陷阱：中途偷睇同多重檢驗
objective_en: Explain why optional stopping and repeated unadjusted looks invalidate a fixed-sample significance rule, calculate
  family-wise error under independent tests, apply a Bonferroni threshold, and audit an assumed multi-variant app experiment
  without labeling a non-adjusted result as proof of success or failure.
objective_zh: 解释为什么选择性早停与未经调整的重复查看会破坏固定样本显著性规则，在独立检验条件下计算族系误差率，应用邦弗朗尼阈值，并审计假设的多版本 App 实验，同时避免把未经调整的结果视为成功或失败的证明。
objective_zh_hk: 解釋點解選擇性早停同未經調整嘅重複查看會破壞固定樣本顯著性規則，喺獨立檢驗條件之下計算族系誤差率，應用邦弗朗尼閾值，並審計假設嘅多版本 App 實驗，同時避免將未經調整嘅結果視為成功或者失敗嘅證明。
youtube:
  description_en: |
    A/B Test Pitfalls: Peeking and Many Tests

    Suppose Shop A tests ten promotional headlines in its app. The team checks the results again and again as they come in, and one headline shows a p-value of 0.035. That is below 0.05, so is it a winner? Roll out a lucky fluke, and the shop pays for a change that does nothing.

    An A/B test randomly shows version A or B and compares results. Across k tests, the family-wise error rate (FWER) is the chance of at least one false alarm. A simple Bonferroni correction divides alpha by k. Continuous peeking until a p-value dips below 0.05 also inflates the true false-alarm rate.

    In an assumed example, k = 10 and alpha = 0.05. Then 0.95^10 ≈ 0.5987, so FWER = 1 − 0.5987 ≈ 0.4013. The Bonferroni cutoff is 0.05 / 10 = 0.005. A raw p of 0.035 clears 0.05 but not 0.005, so under this rule we do not reject.

    Rule: pre-register the sample size or a sequential plan. Do not treat an unadjusted p of 0.035 across ten peeks as automatic success or failure.
  description_zh: |
    对照实验的陷阱：中途偷看与多重检验

    假设A店在 App 里测试十个促销标题。团队一边收数据一边反复查看，有一个标题的 p 值是 0.035，低于 0.05，这算赢家吗？把运气波动当成真效果推出去，店里就会为没有用的改动买单。

    对照实验，也常叫 A/B 测试（A/B test），是随机给顾客看 A 版或 B 版再比较结果。一整组 k 个检验里至少误报一次的概率，叫族系误差率（FWER）。简单的邦弗朗尼修正（Bonferroni）把 alpha 除以 k。一边看一边等到 p 低于 0.05 再停，真正的误报率也会超过名义水平。

    在一个假设的例子里，k = 10，alpha = 0.05。于是 0.95^10 ≈ 0.5987，FWER = 1 − 0.5987 ≈ 0.4013。邦弗朗尼门槛是 0.05 / 10 = 0.005。原始 p = 0.035 过得了 0.05，过不了 0.005，所以按这条规则不拒绝。

    规则：事先定好样本量，或用事先规划好的序贯设计。不要把十次偷看之下未经调整的 0.035 当成自动的成功或失败。
  description_zh_hk: |
    對照實驗嘅陷阱：中途偷睇同多重檢驗

    假設A店喺 App 入面測試十個促銷標題。團隊一邊收數據一邊反覆查看，有一個標題嘅 p 值係 0.035，低過 0.05，呢個算赢家嗎？將運氣波動當成真效果推出去，間舖就會為冇用嘅改動埋單。

    對照實驗，亦常叫 A/B 測試（A/B test），係隨機畀顧客睇 A 版或者 B 版再比較結果。成組 k 個檢驗入面至少誤報一次嘅概率，叫族系誤差率（FWER）。簡單嘅邦弗朗尼修正（Bonferroni）將 alpha 除以 k。一邊睇一邊等到 p 低過 0.05 先停，真正嘅誤報率都會超過名義水平。

    喺一個假設嘅例子入面，k = 10，alpha = 0.05。於是 0.95^10 ≈ 0.5987，FWER = 1 − 0.5987 ≈ 0.4013。邦弗朗尼門檻係 0.05 / 10 = 0.005。原始 p = 0.035 過得咗 0.05，過唔到 0.005，所以按呢條規則唔拒絕。

    規則：事先定好樣本量，或者用事先規劃好嘅序貫設計。唔好將十次偷睇之下未經調整嘅 0.035 當成自動嘅成功或者失敗。
