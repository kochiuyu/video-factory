quiz:
- id: Q1
  type: multiple_choice
  question_en: A team checks a fixed-sample A/B test every day and stops the first time p falls below 0.05. Why is that a problem?
  question_zh: 团队每天查看一次固定样本的对照实验，第一次看到 p 低于 0.05 就停止。这样做为什么有问题？
  question_zh_hk: 團隊每日睇一次固定樣本嘅對照實驗，第一次見到 p 低過 0.05 就停。噉做點解有問題？
  options_en:
  - 'A: Each look is another chance for chance noise to dip below 0.05, so the real false-positive rate ends up above 5%.'
  - 'B: It is fine as long as the final sample is large; the 5% false-positive rate still holds.'
  - 'C: Stopping early is only a problem when you stop for a loss; stopping for a win keeps the 5% rate.'
  - 'D: The p-value gets more accurate with each look, so the first p below 0.05 is the most trustworthy one.'
  options_zh:
  - 'A: 每看一次，运气造成的波动就多一次机会跌破 0.05，所以真正的假阳性率会高于 5%。'
  - 'B: 只要最后样本够大就没问题，假阳性率还是 5%。'
  - 'C: 只有因为结果差而提早停止才有问题；因为结果好而停止，5% 不受影响。'
  - 'D: 每多看一次 p 值就更准，所以第一次低于 0.05 的那个最可信。'
  options_zh_hk:
  - 'A: 每睇一次，運氣造成嘅波動就多一次機會跌穿 0.05，所以真正嘅假陽性率會高過 5%。'
  - 'B: 只要最後樣本夠大就冇問題，假陽性率仍然係 5%。'
  - 'C: 只有因為結果差而提早停先至有問題；因為結果好而停，5% 唔受影響。'
  - 'D: 每多睇一次 p 值就更準，所以第一次低過 0.05 嗰個最可信。'
  answer: A
  explanation_en: 'Stopping at the first p below 0.05 lets the data pick the stopping time, so noise gets many tries to cross
    the line. How far the rate rises depends on how often you look, so there is no single number. B is wrong: a big final sample
    does not undo the repeated tries. C is wrong: stopping on a win is exactly what inflates false positives. D is wrong: a
    p-value does not become more trustworthy because it was the first to dip below 0.05.'
  explanation_zh: 第一次低于 0.05 就停，等于让数据替你决定什么时候停，运气的波动就有很多次机会越线。假阳性率升多少，要看查看的次数，没有一个固定数字。B 错在最后样本再大，也抵消不了前面多次尝试；C 错在正是因为结果好就停，才会推高假阳性；D 错在第一次跌破 0.05 的 p 值并不因此更可信。
  explanation_zh_hk: 第一次低過 0.05 就停，等於畀數據幫你決定幾時停，運氣嘅波動就有好多次機會越線。假陽性率升幾多，要睇查看嘅次數，冇一個固定數字。B 錯喺最後樣本再大，都抵銷唔到之前多次嘗試；C 錯喺正正係因為結果好就停，先至會推高假陽性；D 錯喺第一次跌穿 0.05 嘅 p 值唔會因此更可信。
- id: Q2
  type: multiple_choice
  question_en: Suppose k = 10 independent tests where every H₀ is true, each at α = 0.05. What are the FWER and the Bonferroni
    per-test threshold for a family α of 0.05?
  question_zh: 假设有 k = 10 个独立检验，原假设全部为真，每个都用 α = 0.05。族系误差率是多少？要把全族控制在 0.05，邦弗朗尼单项阈值是多少？
  question_zh_hk: 假設有 k = 10 個獨立檢驗，原假設全部成立，每個都用 α = 0.05。族系誤差率係幾多？要將全族控制喺 0.05，邦弗朗尼單項閾值係幾多？
  options_en:
  - 'A: FWER = 1 − 0.95¹⁰ ≈ 0.4013; threshold = 0.05 / 10 = 0.005.'
  - 'B: FWER = 10 × 0.05 = 0.50; threshold = 0.05 × 10 = 0.50.'
  - 'C: FWER = 0.05, because each test is at 0.05; threshold = 0.05.'
  - 'D: FWER = 0.95¹⁰ ≈ 0.5987; threshold = 0.05 / 10 = 0.005.'
  options_zh:
  - 'A: 族系误差率 = 1 − 0.95¹⁰ ≈ 0.4013；阈值 = 0.05 / 10 = 0.005。'
  - 'B: 族系误差率 = 10 × 0.05 = 0.50；阈值 = 0.05 × 10 = 0.50。'
  - 'C: 族系误差率 = 0.05，因为每个检验都是 0.05；阈值 = 0.05。'
  - 'D: 族系误差率 = 0.95¹⁰ ≈ 0.5987；阈值 = 0.05 / 10 = 0.005。'
  options_zh_hk:
  - 'A: 族系誤差率 = 1 − 0.95¹⁰ ≈ 0.4013；閾值 = 0.05 / 10 = 0.005。'
  - 'B: 族系誤差率 = 10 × 0.05 = 0.50；閾值 = 0.05 × 10 = 0.50。'
  - 'C: 族系誤差率 = 0.05，因為每個檢驗都係 0.05；閾值 = 0.05。'
  - 'D: 族系誤差率 = 0.95¹⁰ ≈ 0.5987；閾值 = 0.05 / 10 = 0.005。'
  answer: A
  explanation_en: 'The chance of no false positive in 10 independent tests is 0.95¹⁰ ≈ 0.5987, so the chance of at least one
    is about 0.4013. Bonferroni divides the family α by k: 0.05 / 10 = 0.005. B is wrong: adding the 0.05s overstates the
    FWER, and the threshold must shrink, not grow. C is wrong: the family rate is not the per-test rate. D is wrong: 0.5987
    is the chance of no false positive, not of at least one.'
  explanation_zh: 10 个独立检验全都不出假阳性的概率是 0.95¹⁰ ≈ 0.5987，所以至少一次的概率约 0.4013。邦弗朗尼把全族 α 除以 k：0.05 / 10 = 0.005。B 错在把 0.05 直接相加会高估族系误差率，而且阈值应该变小而不是变大；C 错在全族的误差率不等于单个检验的；D 错在 0.5987 是一次都不出错的概率，不是至少一次的概率。
  explanation_zh_hk: 10 個獨立檢驗全部唔出假陽性嘅機會係 0.95¹⁰ ≈ 0.5987，所以至少一次嘅機會大約 0.4013。邦弗朗尼將全族 α 除以 k：0.05 / 10 = 0.005。B 錯喺將 0.05 直接加埋會高估族系誤差率，而且閾值應該變細而唔係變大；C 錯喺全族嘅誤差率唔等於單個檢驗嘅；D 錯喺 0.5987 係一次都唔出錯嘅機會，唔係至少一次嘅機會。
beats:
- id: hook
  visual: title_card
  seconds: 39
  kicker_en: The app test
  kicker_zh: App 文案大比拼
  kicker_zh_hk: App 文案大比拼
  title_en: Is p = 0.035 a real winner?
  title_zh: p = 0.035 真的是赢家吗？
  title_zh_hk: p = 0.035 真係贏家咩？
  en: >-
    Suppose Shop A tests ten promotional headlines in its app. The team checks the results again and again as they
    come in, and one headline shows a p-value of 0.035. That is below 0.05, so is it a winner? Roll out a lucky fluke,
    and the shop pays for a change that does nothing. Two things can fool us here: testing many headlines at once, and
    stopping when the numbers look good. These are made-up teaching numbers.
  zh: >-
    假设 A店在自己的 App 里测试十款促销文案。团队一边收数据一边反复查看结果，其中一款文案的 p 值是 0.035。它低于 0.05，那它就是赢家吗？要是把碰巧出现的结果当真推广出去，门店就白白为没有效果的改动买单。这里有两件事会骗到我们：同时测试很多款文案，以及看到数字好看就停下来。下面都是教学用的假设数字。
  zh_hk: >-
    假設 A店喺自己個 App 入面測試十款促銷文案。團隊一路收數據一路反覆睇結果，其中一款文案嘅 p 值係 0.035。佢低過 0.05，噉佢係咪贏家？如果將好彩撞出嚟嘅結果當真推出，門市就白白為冇效嘅改動埋單。呢度有兩樣嘢會呃到我哋：同時測試好多款文案，同埋見到數字好睇就停。以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 38
  kicker_en: What it is
  kicker_zh: 核心概念
  kicker_zh_hk: 核心概念
  title_en: More tests, more false alarms
  title_zh: 检验越多，被骗的机会越多
  title_zh_hk: 檢驗越多，俾人呃嘅機會越多
  formula: 'FWER = 1 − (1 − α)^k'
  formula_zh: '族系误差率 = 1 − (1 − α)^k'
  formula_zh_hk: '族系誤差率 = 1 − (1 − α)^k'
  formula_tex: '\mathrm{FWER} = 1 - (1 - \alpha)^{k} \qquad \alpha_{\mathrm{each}} = \frac{\alpha}{k}'
  s1_en: >-
    At the 5% significance level, each test has a 5% chance of a false alarm when H zero is true. With k independent
    tests, no false alarm has chance 0.95 to the power k. At least one is one minus that: the family-wise error rate.
  s1_zh: >-
    每个检验用 5% 的显著性水平，在 H₀ 成立时就有 5% 的机会误报。做 k 个独立检验，一次都不误报的概率是 0.95 的 k 次方，所以至少误报一次的概率，就是一减去它。这就是族系误差率（FWER）。
  s1_zh_hk: >-
    每個檢驗用 5% 嘅顯著性水平，喺 H₀ 成立嗰陣就有 5% 機會誤報。做 k 個獨立檢驗，一次都唔誤報嘅機會係 0.95 嘅 k 次方，所以至少誤報一次嘅機會，就係一減佢。呢個就係族系誤差率（FWER）。
  s2_en: >-
    A simple fix is the Bonferroni correction: divide 5% by the number of tests and use that smaller cutoff for each.
    Then any false alarm stays at or below 5%, even for related tests.
  s2_zh: >-
    简单的补救是邦弗朗尼修正（Bonferroni correction）：把 5% 除以检验个数，每个检验都用这个更小的门槛。这样整组出现误报的概率不超过 5%，检验有关联也适用。
  s2_zh_hk: >-
    簡單嘅補救係邦弗朗尼修正（Bonferroni correction）：將 5% 除以檢驗個數，每個檢驗都用呢個細啲嘅門檻。噉成組出現誤報嘅機會唔超過 5%，檢驗有關連都適用。
- id: name_abtest
  visual: title_card
  seconds: 25
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: FWER and Bonferroni
  title_zh: 族系误差率 与 邦弗朗尼修正
  title_zh_hk: 族系誤差率 同 邦弗朗尼修正
  en: >-
    Now the names. Randomly showing customers version A or version B and comparing results is an A/B test. The chance of
    at least one false alarm across a whole group of tests is the family-wise error rate. Dividing the significance
    level by the number of tests is the Bonferroni correction.
  zh: >-
    现在说名字。随机给顾客看 A 版或 B 版，再比较结果，叫对照实验，也常叫 A/B 测试（A/B test）。一整组检验里至少误报一次的概率，叫族系误差率。把显著性水平除以检验个数，叫邦弗朗尼修正。
  zh_hk: >-
    而家講名。隨機俾顧客睇 A 版或者 B 版，再比較結果，叫對照實驗，亦常叫 A/B 測試（A/B test）。成組檢驗入面至少誤報一次嘅機會，叫族系誤差率。將顯著性水平除以檢驗個數，叫邦弗朗尼修正。
- id: mechanics
  visual: two_column
  seconds: 58
  kicker_en: Plan first
  kicker_zh: 先定计划
  kicker_zh_hk: 先定計劃
  title_en: Plan tests and looks first
  title_zh: 事先定好检验和查看次数
  title_zh_hk: 事先定好檢驗同查看次數
  left_en: 'Many tests: list, adjust'
  left_zh: 多个检验：先数清，再调整
  left_zh_hk: 多個檢驗：先數清，再調整
  right_en: 'Peeking: fix n and looks'
  right_zh: 偷看：先定样本量
  right_zh_hk: 偷睇：先定樣本量
  s1_en: >-
    First, many tests. Before launch, list every version and outcome you will test, so the family is clear. Then adjust,
    for example with Bonferroni. Other planned methods can have more power, but the family must be set in advance.
  s1_zh: >-
    第一是多个检验。上线前，把要测的每个版本和每个结果都列出来，这样整组检验就清楚了。然后做调整，比如用邦弗朗尼。其他事先定好的方法功效可能更高，但检验组一定要事先定好。
  s1_zh_hk: >-
    第一係多個檢驗。上線之前，將要測嘅每個版本同每個結果都列晒出嚟，噉成組檢驗就清楚。然後做調整，例如用邦弗朗尼。其他事先定好嘅方法功效可能高啲，但檢驗組一定要事先定好。
  s2_en: >-
    Second, peeking. A fixed-sample p-value assumes the sample size was set before seeing data. Stopping when p first
    dips below 0.05 gives chance many tries, so false alarms rise above 5%.
  s2_zh: >-
    第二是中途偷看。固定样本的 p 值，前提是看数据前就定好样本量。第一次跌破 0.05 就停，等于给运气很多次机会，误报率就会超过 5%。
  s2_zh_hk: >-
    第二係中途偷睇。固定樣本嘅 p 值，前提係睇數據之前就定好樣本量。第一次跌穿 0.05 就停，等於俾運氣好多次機會，誤報率就會超過 5%。
  s3_en: >-
    Looking early is fine only with a sequential design planned in advance. And report every comparison you ran, not just the best one. An adjustment does not replace random assignment, good
    measurement, or a big enough sample.
  s3_zh: >-
    想提早看，只能用事先规划好的序贯设计。另外，要报告做过的每一个比较，不能只报最好看的那个。调整也替代不了随机分配、可靠的测量和足够大的样本。
  s3_zh_hk: >-
    想提早睇，只可以用事先規劃好嘅序貫設計。另外，要報告做過嘅每一個比較，唔可以淨係報最好睇嗰個。調整亦都代替唔到隨機分配、可靠嘅量度同足夠大嘅樣本。
- id: ledger
  visual: steps
  layout: rows
  seconds: 62
  kicker_en: A worked example
  kicker_zh: 算一次看看
  kicker_zh_hk: 計一次睇吓
  title_en: Ten headlines, one raw p = 0.035
  title_zh: 十款文案，原始 p = 0.035
  title_zh_hk: 十款文案，原始 p = 0.035
  step1_en: 'k = 10, α = 0.05, p = 0.035'
  step1_zh: 'k = 10，α = 0.05，原始 p = 0.035'
  step1_zh_hk: 'k = 10，α = 0.05，原始 p = 0.035'
  step2_en: '0.95¹⁰ ≈ 0.5987'
  step2_zh: '0.95¹⁰ ≈ 0.5987'
  step2_zh_hk: '0.95¹⁰ ≈ 0.5987'
  step3_en: 'FWER = 1 − 0.5987 ≈ 0.4013'
  step3_zh: '族系误差率 = 1 − 0.5987 ≈ 0.4013'
  step3_zh_hk: '族系誤差率 = 1 − 0.5987 ≈ 0.4013'
  step4_en: 'Bonferroni: 0.05 / 10 = 0.005'
  step4_zh: '邦弗朗尼：0.05 / 10 = 0.005'
  step4_zh_hk: '邦弗朗尼：0.05 / 10 = 0.005'
  step5_en: '0.035 > 0.005 → not rejected'
  step5_zh: '0.035 > 0.005 → 不拒绝 H₀'
  step5_zh_hk: '0.035 > 0.005 → 不拒絕 H₀'
  s1_en: >-
    Now the numbers. Assume ten independent headline tests where every H zero is true, each at 0.05. One headline has a
    raw p-value of 0.035.
  s1_zh: >-
    现在代入数字。假设十个独立的文案检验，原假设全部为真，每个都用 0.05。其中一款文案的原始 p 值是 0.035。
  s1_zh_hk: >-
    而家代啲數字入去。假設十個獨立嘅文案檢驗，原假設全部成立，每個都用 0.05。其中一款文案嘅原始 p 值係 0.035。
  s2_en: >-
    The chance that none of the ten gives a false alarm is 0.95 to the tenth power, about 0.5987.
  s2_zh: >-
    十个检验一次都不误报的概率，是 0.95 的十次方，约 0.5987。
  s2_zh_hk: >-
    十個檢驗一次都唔誤報嘅機會，係 0.95 嘅十次方，大約 0.5987。
  s3_en: >-
    So the chance of at least one false alarm is one minus 0.5987, about 0.4013. That is roughly 40%, not 5%.
  s3_zh: >-
    所以至少误报一次的概率是一减 0.5987，约 0.4013，差不多 40%，而不是 5%。
  s3_zh_hk: >-
    所以至少誤報一次嘅機會係一減 0.5987，大約 0.4013，差唔多 40%，唔係 5%。
  s4_en: >-
    To keep the family at 5%, Bonferroni uses 0.05 divided by 10, which is 0.005, as the cutoff for each headline.
  s4_zh: >-
    要把整组控制在 5%，邦弗朗尼用 0.05 除以 10，也就是 0.005，作为每款文案的门槛。
  s4_zh_hk: >-
    要將成組控制喺 5%，邦弗朗尼用 0.05 除以 10，即係 0.005，做每款文案嘅門檻。
  s5_en: >-
    0.035 is below 0.05 but above 0.005, so under this rule we do not reject H zero. That does not prove the headline
    has no effect. The evidence is just not strong enough here, and the repeated peeking is a second problem on top.
  s5_zh: >-
    0.035 低于 0.05，但高于 0.005，所以在这个规则下不拒绝 H₀。这并不证明这款文案没有效果，只是这里的证据还不够强；而反复偷看又是另一个额外的问题。
  s5_zh_hk: >-
    0.035 低過 0.05，但高過 0.005，所以喺呢個規則之下不拒絕 H₀。呢個唔證明呢款文案冇效果，只係呢度嘅證據未夠強；而反覆偷睇又係另一個額外嘅問題。
- id: takeaway
  visual: takeaway
  seconds: 55
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Plan the tests, then judge
  title_zh: 先定好检验，再下判断
  title_zh_hk: 先定好檢驗，再落判斷
  q1_en: Why not stop at the first p below 0.05?
  q1_zh: 为什么不能一低于 0.05 就停？
  q1_zh_hk: 點解唔可以一低過 0.05 就停？
  q2_en: What does failing Bonferroni mean?
  q2_zh: 邦弗朗尼修正后不显著，代表什么？
  q2_zh_hk: 邦弗朗尼修正之後唔顯著，代表咩？
  s1_en: >-
    Stopping at the first p below 0.05 lets chance noise choose when you stop, so the real false-alarm rate is above
    5%. Fix the sample size in advance, or use a planned sequential design.
  s1_zh: >-
    一低于 0.05 就停，等于让运气的波动替你决定什么时候停，真正的误报率就会超过 5%。要么事先定好样本量，要么用事先规划好的序贯设计。
  s1_zh_hk: >-
    一低過 0.05 就停，等於俾運氣嘅波動幫你決定幾時停，真正嘅誤報率就會超過 5%。一係事先定好樣本量，一係用事先規劃好嘅序貫設計。
  s2_en: >-
    Not significant after Bonferroni means the evidence is not strong enough for the family. It is not proof of no
    effect. Report the effect size and its uncertainty, every comparison, and how often you looked.
  s2_zh: >-
    邦弗朗尼修正后不显著，表示证据还不够强，不足以在整组层面下结论，但不证明没有效果。报告时要写出效应量和它的不确定性、每一个比较，以及看过几次数据。
  s2_zh_hk: >-
    邦弗朗尼修正之後唔顯著，表示證據未夠強，唔足以喺成組層面落結論，但唔證明冇效果。報告嗰陣要寫出效應量同佢嘅不確定性、每一個比較，同埋睇過幾多次數據。
  s3_en: >-
    So is p = 0.035 a real winner? With ten tests the family-wise error rate is about 0.4013, and the Bonferroni cutoff
    is 0.005. 0.035 does not pass. Do not roll it out automatically or throw it away; report it honestly and decide by
    the plan.
  s3_zh: >-
    那么，p = 0.035 真的是赢家吗？十个检验下族系误差率约 0.4013，邦弗朗尼门槛是 0.005，0.035 过不了。不要自动推广，也不要直接丢掉；如实报告，按事先定好的计划来决定。
  s3_zh_hk: >-
    噉，p = 0.035 真係贏家咩？十個檢驗之下族系誤差率大約 0.4013，邦弗朗尼門檻係 0.005，0.035 過唔到。唔好自動推出，亦唔好直接掉低；如實報告，跟事先定好嘅計劃嚟決定。
