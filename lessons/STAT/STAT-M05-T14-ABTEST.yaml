id: STAT-M05-T14-ABTEST
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Commercial A/B Testing Pitfalls: Peeking, Multiplicity, and False Positives'
title_zh: 商业 A/B 测试陷阱：数据窥探、多重检验与假阳性
title_zh_hk: 商業 A/B 測試陷阱：數據窺探、多重檢驗同假陽性
objective_en: Explain why optional stopping and repeated unadjusted looks invalidate a fixed-sample significance rule, calculate
  family-wise error under independent tests, apply a Bonferroni threshold, and audit an assumed multi-variant app experiment
  without labeling a non-adjusted result as proof of success or failure.
objective_zh: 解释为什么选择性早停与未经调整的重复查看会破坏固定样本显著性规则，在独立检验条件下计算族系错误率，应用邦弗朗尼阈值，并审计假设的多版本 App 实验，同时避免把未经调整的结果视为成功或失败的证明。
objective_zh_hk: 解釋點解選擇性早停同未經調整嘅重複查看會破壞固定樣本顯著性規則，喺獨立檢驗條件之下計算族系錯誤率，應用邦弗朗尼閾值，並審計假設嘅多版本 App 實驗，同時避免將未經調整嘅結果視為成功或者失敗嘅證明。
