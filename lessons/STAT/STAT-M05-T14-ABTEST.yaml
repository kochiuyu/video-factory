  zh_hk: 連續窺探/頻繁偷睇數據問題
  lock: true
- en: family-wise error rate (FWER)
  zh: 族系误差率/全族显著性水平
  zh_hk: 族系誤差率/全族顯著性水平
  lock: true
- en: Bonferroni correction
  zh: 邦弗朗尼修正
  zh_hk: 邦弗朗尼修正
  lock: true
