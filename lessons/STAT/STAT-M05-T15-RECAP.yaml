title_en: The Testing Decision Matrix
title_zh: 假设检验决策矩阵
title_zh_hk: 假設檢驗決策矩陣
objective_en: Select an appropriate mean or proportion test from the parameter, number of samples, dependence structure, and
  variance information; connect two-sided tests with matching confidence intervals; and apply a statistical due-diligence
  checklist that separates evidence, practical importance, causality, and operational action.
objective_zh: 根据参数类型、样本数量、依赖结构与方差信息选择适当的均值或比例检验，把双侧检验与匹配置信区间联系起来，并应用统计尽调清单，区分统计证据、实际重要性、因果解释与经营行动。
objective_zh_hk: 根據參數類型、樣本數量、依賴結構同方差資訊選擇適當嘅均值或者比例檢驗，將雙側檢驗同匹配置信區間連繫起嚟，並應用統計盡調清單，區分統計證據、實際重要性、因果解讀同營運行動。
youtube:
  description_en: |
    The Testing Decision Matrix

    Suppose Shop A holds four teaching summaries: one mean versus a benchmark, two independent store means, the same customers before and after a change, and two conversion rates. Pick the wrong test and you either cry wolf or miss a real shift. A p-value alone cannot tell you which tool to use.

    Choosing a test from the parameter and the design is the testing decision taxonomy. One mean: Z when sigma is known, student t when it is estimated. Two means: paired when the same units appear twice, Welch when independent groups may have unequal variances. Two rates: a pooled Z under H0 of equal proportions, with family-wise control when many tests run together. A matching two-sided confidence interval and a two-sided test tell the same story: that is the duality of intervals and tests.

    Before choosing, write down the estimand, the contrast, the sample size, whether units are paired or independent, whether sigma is known, whether the outcome is quantitative or binary, and whether the plan is one-tailed, multiple, or sequential. Then match the method to that plan.

    Rule: report the estimate, SE, CI, p-value, and the plan. Statistical significance is evidence, not an automatic operating command.
  description_zh: |
    假设检验决策矩阵

    假设A店手里有四类教学摘要：一个均值对基准、两家独立门店均值、同一批顾客改动前后，以及两个转化率。选错检验，要么误报，要么漏掉真实变化。单看一个 p 值，选不出该用哪把工具。

    按参数和设计选检验，叫假设检验决策树（testing decision taxonomy）。一个均值：sigma 已知用 Z，用样本估计就用学生 t。两个均值：同一批单元出现两次用配对，独立组且方差可能不齐用韦尔奇。两个比例：在比例相等的原假设下用合并 Z；很多检验一起跑时还要控制族系误差。匹配的双侧置信区间和双侧检验讲同一件事，这就是区间与检验的对偶性。

    选之前先写清：参数、对比、样本量、单元是配对还是独立、sigma 是否已知、结果是定量还是二元，以及计划是单尾、多重还是序贯。然后再选与之匹配的方法。

    规则：报告估计值、标准误、置信区间、p 值和计划。统计显著性是证据，不是自动的运营命令。
  description_zh_hk: |
    假設檢驗決策矩陣

    假設A店手裏面有四類教學摘要：一個均值對基準、兩間獨立門市均值、同一批顧客改動前後，以及兩個轉化率。揀錯檢驗，一係誤報，一係漏咗真實變化。單睇一個 p 值，揀唔出應該用邊把工具。

    按參數同設計揀檢驗，叫假設檢驗決策樹（testing decision taxonomy）。一個均值：sigma 已知用 Z，用樣本估計就用學生 t。兩個均值：同一批單元出現兩次用配對，獨立組而且方差可能唔齊用韋爾奇。兩個比例：喺比例相等嘅原假設之下用合併 Z；好多檢驗一齊跑嗰陣仲要控制族系誤差。匹配嘅雙側置信區間同雙側檢驗講同一件事，呢個就係區間同檢驗嘅對偶性。

    揀之前先寫清：參數、對比、樣本量、單元係配對定係獨立、sigma 係咪已知、結果係定量定係二元，以及計劃係單尾、多重定係序貫。然後再揀同佢匹配嘅方法。

    規則：報告估計值、標準誤、置信區間、p 值同計劃。統計顯著性係證據，唔係自動嘅營運命令。
