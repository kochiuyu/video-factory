quiz:
- id: Q1
  type: multiple_choice
  question_en: Which test is appropriate when the exact same 30 customers provide satisfaction scores before and after a store
    change?
  question_zh: 同一批 30 名顾客在门店改动前后都打了满意度分。该用哪种检验？
  question_zh_hk: 同一批 30 名顧客喺門市改動前後都打咗滿意度分。應該用邊種檢驗？
  options_en:
  - 'A: A paired-difference t-test on 30 within-customer differences, with df = 29, if the difference-score conditions are
    appropriate.'
  - 'B: A two-sample pooled Z-test for proportions with p̂_pool = 0.50.'
  - 'C: A one-sample Z-test that pretends the store population variance is known and infinite.'
  - 'D: An independent Welch t-test that treats before and after as two unrelated groups with equal variances.'
  options_zh:
  - 'A: 对 30 个顾客内差值做配对差值 t 检验，自由度 df = 29（差值条件合适时）。'
  - 'B: 双样本合并比例 Z 检验，并设定合并比例 p̂_pool = 0.50。'
  - 'C: 单样本 Z 检验，并假装门店总体方差已知且无穷大。'
  - 'D: 独立双样本韦尔奇 t 检验，把前后当成两组无关样本，并假定方差相等。'
  options_zh_hk:
  - 'A: 對 30 個顧客內差值做配對差值 t 檢驗，自由度 df = 29（差值條件合適嗰陣）。'
  - 'B: 雙樣本合併比例 Z 檢驗，並設定合併比例 p̂_pool = 0.50。'
  - 'C: 單樣本 Z 檢驗，並當門市總體方差已知而且無窮大。'
  - 'D: 獨立雙樣本韋爾奇 t 檢驗，將前後當成兩組無關樣本，並假定方差相等。'
  answer: A
  explanation_en: The same customers are measured twice, so the design is paired. Keep that dependence by analyzing the 30
    differences (df = n − 1 = 29). Pairing can improve precision, but it does not remove every source of bias. B is for two
    independent proportions. C invents a known σ. D throws away the pairing and adds an equal-variance claim the design does
    not need.
  explanation_zh: 同一批人前后各测一次，设计是配对的。应保留这份依赖，改成分析 30 个差值（自由度 df = n − 1 = 29）。配对可以提高精度，但不能消除所有偏误。B 是给两个独立比例用的；C 凭空假定已知的 σ；D 丢掉了配对，还多加了不必要的方差相等假设。
  explanation_zh_hk: 同一批人前後各測一次，設計係配對嘅。應該保留呢份依賴，改成分析 30 個差值（自由度 df = n − 1 = 29）。配對可以提高精度，但唔可以消除所有偏誤。B 係畀兩個獨立比例用嘅；C 憑空假定已知嘅 σ；D 掉低咗配對，仲多加咗唔必要嘅方差相等假設。
- id: Q2
  type: multiple_choice
  question_en: 'A matching two-sided 95% confidence interval for μ₁ − μ₂ is [1.20 s, 4.80 s]. What does the corresponding α
    = 0.05 test of H₀: μ₁ − μ₂ = 0 conclude?'
  question_zh: '匹配的双侧 95% 置信区间是 μ₁ − μ₂ ∈ [1.20 秒, 4.80 秒]。对应 α = 0.05、H₀: μ₁ − μ₂ = 0 的双侧检验会怎样？'
  question_zh_hk: '匹配嘅雙側 95% 置信區間係 μ₁ − μ₂ ∈ [1.20 秒, 4.80 秒]。對應 α = 0.05、H₀: μ₁ − μ₂ = 0 嘅雙側檢驗會點？'
  options_en:
  - 'A: Reject H₀, because zero lies outside the matching 95% confidence interval.'
  - 'B: Fail to reject H₀, because both bounds of the interval are positive.'
  - 'C: The test is inconclusive, because confidence intervals and hypothesis tests use incompatible mathematics.'
  - 'D: Treat the means as equal, because a 1.20-second gap is practically invisible to customers.'
  options_zh:
  - 'A: 拒绝 H₀，因为 0 落在匹配的 95% 置信区间之外。'
  - 'B: 不拒绝 H₀，因为区间上下界都是正数。'
  - 'C: 无法下结论，因为区间估计与假设检验在数学上互不兼容。'
  - 'D: 把两个均值当成相等，因为 1.20 秒的差距顾客几乎感觉不到。'
  options_zh_hk:
  - 'A: 拒絕 H₀，因為 0 落喺匹配嘅 95% 置信區間之外。'
  - 'B: 不拒絕 H₀，因為區間上下界都係正數。'
  - 'C: 冇辦法落結論，因為區間估計同假設檢驗喺數學上互唔兼容。'
  - 'D: 將兩個均值當成相等，因為 1.20 秒嘅差距顧客幾乎感覺唔到。'
  answer: A
  explanation_en: >-
    For matching two-sided procedures, the 95% confidence interval holds exactly the null values not rejected
    at α = 0.05. Zero is outside [1.20, 4.80], so reject H₀ of μ₁ − μ₂ = 0. B confuses "both bounds positive" with "fail to reject."
    C is false: matching intervals and tests tell the same story. D mixes practical importance with the statistical decision.
  explanation_zh: >-
    对匹配的双侧方法，95% 置信区间正好装下所有在 α = 0.05 下不会被拒绝的原假设取值。0 不在 [1.20, 4.80] 里，所以拒绝 H₀（μ₁ − μ₂ = 0）。B 把“上下界都是正的”误当成“不拒绝”；C 错在匹配的区间与检验讲的是同一件事；D 把实际重要性和统计裁决混在一起。
  explanation_zh_hk: >-
    對匹配嘅雙側方法，95% 置信區間啱啱裝晒所有喺 α = 0.05 下唔會被拒絕嘅原假設取值。0 唔喺 [1.20, 4.80] 入面，所以拒絕 H₀（μ₁ − μ₂ = 0）。B 將「上下界都係正」誤當成「不拒絕」；C 錯喺匹配嘅區間同檢驗講嘅係同一件事；D 將實際重要性同統計裁決撈埋一齊。
beats:
- id: hook
  visual: title_card
  seconds: 42
  kicker_en: Wrong tool, real cost
  kicker_zh: 选错工具就赔钱
  kicker_zh_hk: 揀錯工具就蝕錢
  title_en: Which test matches the design?
  title_zh: 哪种检验匹配这项设计？
  title_zh_hk: 邊種檢驗匹配呢項設計？
  en: >-
    Suppose Shop A holds four teaching summaries: one mean versus a benchmark, two independent store means, the same
    customers before and after a change, and two conversion rates. Pick the wrong test and you either cry wolf or miss a
    real shift. A p-value alone cannot tell you which method fits. Start from the parameter, the sampling units, whether
    they are paired, what you know about σ, the direction, and the analysis plan. These are made-up teaching numbers.
  zh: >-
    假设 A店手里有四份教学用摘要：一个均值对基准、两个独立门店均值、同一批顾客改动前后的分数，还有两个转化率。检验选错了，要么误报，要么漏掉真变化。单看 p 值分不清该用哪条路径。要从参数、抽样单位、是否配对、σ 知道多少、方向，以及分析方案出发。下面都是教学用的假设数字。
  zh_hk: >-
    假設 A店手持有四份教學用摘要：一個均值對基準、兩個獨立門市均值、同一批顧客改動前後嘅分數，仲有兩個轉化率。檢驗揀錯咗，一係誤報，一係漏咗真變化。單睇 p 值分唔清應該用邊條路徑。要由參數、抽樣單位、係咪配對、σ 知幾多、方向，同埋分析方案出發。以下都係教學用嘅假設數字。
- id: define
  visual: definition_card
  seconds: 44
  kicker_en: The taxonomy
  kicker_zh: 决策树
  kicker_zh_hk: 決策樹
  title_en: Match the estimand and design
  title_zh: 按估计目标与设计选检验
  title_zh_hk: 按估計目標同設計揀檢驗
  formula: 'Z/t · paired/Welch · pooled Z'
  formula_zh: 'Z/t · 配对/韦尔奇 · 合并 Z'
  formula_zh_hk: 'Z/t · 配對/韋爾奇 · 合併 Z'
  formula_tex: 'Z/t \qquad \mathrm{paired}/Welch \qquad \mathrm{pooled}\ Z'
  s1_en: >-
    For one population mean, compare the sample mean with a benchmark. Use a one-sample Z-test only when σ is genuinely
    known. When σ is estimated from the sample, use a one-sample t-test under the usual conditions.
  s1_zh: >-
    检验一个总体均值时，把样本均值和基准比。只有总体标准差 σ 确实已知，才用单样本 Z 检验；σ 要靠样本估计时，就在条件合适的情况下用单样本 t 检验。
  s1_zh_hk: >-
    檢驗一個總體均值嗰陣，將樣本均值同基準比。只有總體標準差 σ 確實已知，先用單樣本 Z 檢驗；σ 要靠樣本估計嗰陣，就喺條件合適嘅情況下用單樣本 t 檢驗。
  s2_en: >-
    For two means, keep the design: paired units become differences; independent groups use Welch’s t without forcing equal
    variances. For two independent rates under H₀: p₁ = p₂, use the pooled Z-test when independence and counts look credible.
  s2_zh: >-
    两个均值要保留设计：配对单元先做成差值；独立组用韦尔奇 t 检验，不强加方差相等。两个独立比例在 H₀: p₁ = p₂ 下，独立性与计数条件可信时，用合并样本比例的 Z 检验。
  s2_zh_hk: >-
    兩個均值要保留設計：配對單元先做成差值；獨立組用韋爾奇 t 檢驗，唔強加方差相等。兩個獨立比例喺 H₀: p₁ = p₂ 之下，獨立性同計數條件可信嗰陣，用合併樣本比例嘅 Z 檢驗。
- id: name_matrix
  visual: title_card
  seconds: 28
  kicker_en: The names
  kicker_zh: 名字
  kicker_zh_hk: 名
  title_en: Taxonomy and duality
  title_zh: 决策树 与 对偶性
  title_zh_hk: 決策樹 同 對偶性
  en: >-
    Now the names. Choosing a test from the parameter and the design is the testing decision taxonomy. The fact that a
    matching two-sided confidence interval and a two-sided test tell the same story is the duality of intervals and tests.
  zh: >-
    现在说名字。按参数和设计选检验，叫假设检验决策树，也就是分类法。匹配的双侧置信区间和双侧检验讲同一件事，叫区间与检验的对偶性。
  zh_hk: >-
    而家講名。按參數同設計揀檢驗，叫假設檢驗決策樹，亦即分類法。匹配嘅雙側置信區間同雙側檢驗講同一件事，叫區間與檢驗嘅對偶性。
- id: mechanics
  visual: two_column
  seconds: 52
  kicker_en: The duality bridge
  kicker_zh: 对偶桥
  kicker_zh_hk: 對偶橋
  title_en: Interval and test, same story
  title_zh: 区间与检验，同一结论
  title_zh_hk: 區間同檢驗，同一結論
  left_en: 'Interval: is 0 inside?'
  left_zh: 区间：0 在里面吗？
  left_zh_hk: 區間：0 喺入面未？
  right_en: 'Test: is p ≤ α?'
  right_zh: 检验：p 是否 ≤ α？
  right_zh_hk: 檢驗：p 係咪 ≤ α？
  s1_en: >-
    When a two-sided test and a confidence interval share the same model, standard error, critical distribution, and α,
    you reject the null value exactly when it sits outside the matching interval.
  s1_zh: >-
    当双侧检验和置信区间用同一模型、同一标准误、同一临界分布和同一 α 时，原假设取值落在匹配区间之外，检验就拒绝它；落在里面，就不拒绝。
  s1_zh_hk: >-
    當雙側檢驗同置信區間用同一模型、同一標準誤、同一臨界分佈同同一 α 嗰陣，原假設取值落喺匹配區間之外，檢驗就拒絕佢；落喺入面，就不拒絕。
  s2_en: >-
    The interval still gives more than a yes-or-no call: it shows direction, size, and precision. Rejecting H₀ does not
    prove practical importance, and failing to reject does not prove the effect is exactly zero.
  s2_zh: >-
    区间比单纯的是或否更有用：它还显示方向、大小和精度。拒绝 H₀ 不等于实际重要；不拒绝也不等于效应正好是零。
  s2_zh_hk: >-
    區間比單純嘅係定唔係更有用：佢仲顯示方向、大小同精度。拒絕 H₀ 唔等於實際重要；不拒絕亦唔等於效應啱啱係零。
  s3_en: >-
    Duality breaks if the interval and the test use different standard errors, adjustments, directions, or models. Multiple
    looks, one-sided rules, and sequential plans need matching intervals built under the same rules.
  s3_zh: >-
    如果区间和检验用了不同的标准误、调整、方向或模型，对偶就会断。多次查看、单尾规则和序贯计划，都要按同一套规则建匹配的区间。
  s3_zh_hk: >-
    如果區間同檢驗用咗唔同嘅標準誤、調整、方向或者模型，對偶就會斷。多次查看、單尾規則同序貫計劃，都要跟同一套規則起匹配嘅區間。
- id: ledger
  visual: steps
  layout: rows
  seconds: 68
  kicker_en: Audit checklist
  kicker_zh: 审计清单
  kicker_zh_hk: 審計清單
  title_en: Four cases, no overclaim
  title_zh: 四个案例，不夸大结论
  title_zh_hk: 四個案例，唔誇大結論
  step1_en: '1 mean: known σ → Z; else t'
  step1_zh: '一均值：σ 已知 → Z；否则 t'
  step1_zh_hk: '一均值：σ 已知 → Z；否則 t'
  step2_en: '2 means: paired vs Welch'
  step2_zh: '两均值：配对 或 韦尔奇'
  step2_zh_hk: '兩均值：配對 或 韋爾奇'
  step3_en: '2 rates: pooled Z + family'
  step3_zh: '两比例：合并 Z + 检验族'
  step3_zh_hk: '兩比例：合併 Z + 檢驗族'
  step4_en: 'Report SE, CI, p, plan'
  step4_zh: '报告标准误、区间、p、计划'
  step4_zh_hk: '報告標準誤、區間、p、計劃'
  step5_en: 'Evidence ≠ automatic action'
  step5_zh: '统计证据 ≠ 自动行动'
  step5_zh_hk: '統計證據 ≠ 自動行動'
  s1_en: >-
    Four teaching cases: one packaging mean, two independent store means, matched before-and-after scores, and two conversion
    rates. These are method drills, not verified ledgers or capital requests.
  s1_zh: >-
    四个教学案例：一个包装均值、两个独立门店均值、匹配的前后评分，还有两个转化率。这些是选方法的练习，不是已核实的经营账本，也不是资本申请。
  s1_zh_hk: >-
    四個教學案例：一個包裝均值、兩個獨立門市均值、匹配嘅前後評分，仲有兩個轉化率。呢啲係揀方法嘅練習，唔係已核實嘅營運帳本，亦唔係資本申請。
  s2_en: >-
    For one mean, check whether σ is known before choosing Z or t. For two means, ask whether units are paired; if not, prefer
    Welch over an unsupported equal-variance claim.
  s2_zh: >-
    一个均值：先核实 σ 是已知还是估计，再选 Z 或 t。两个均值：先问单元是不是配对；如果不是，优先用韦尔奇，不要硬套方差相等。
  s2_zh_hk: >-
    一個均值：先核實 σ 係已知定係估計，再揀 Z 或者 t。兩個均值：先問單元係唔係配對；如果唔係，優先用韋爾奇，唔好硬套方差相等。
  s3_en: >-
    For two rates, check independence and counts, then use the pooled Z under an equality null. If many outcomes or interim
    looks were examined, name the full family and apply the planned adjustment.
  s3_zh: >-
    两个比例：核实独立性和计数条件，相等原假设下用合并 Z。如果看过多个结果或中期时点，就要写清整族检验，并做事先定好的调整。
  s3_zh_hk: >-
    兩個比例：核實獨立性同計數條件，相等原假設之下用合併 Z。如果睇過多個結果或者中期時點，就要寫清成族檢驗，並做事先定好嘅調整。
  s4_en: >-
    In every case, report the estimand, estimate, standard error, confidence interval, test statistic, p-value, assumptions,
    missingness, and the original plan.
  s4_zh: >-
    每个案例都要报告：估计目标、估计值、标准误、置信区间、检验统计量、p 值、假设、缺失情况，以及原先的分析计划。
  s4_zh_hk: >-
    每個案例都要報告：估計目標、估計值、標準誤、置信區間、檢驗統計量、p 值、假設、缺失情況，同埋原先嘅分析計劃。
  s5_en: >-
    Keep the statistical result narrower than the operating call. A shifted mean or rate does not diagnose a mechanism, prove
    causality, price a return, or authorize action against a person. Those need extra verified evidence and decision criteria.
  s5_zh: >-
    统计结果要比经营决策更谨慎。均值或比例有偏移，不能诊断机制、证明因果、算出财务回报，也不能授权针对个人采取行动。那些还要额外的核实证据和决策标准。
  s5_zh_hk: >-
    統計結果要比營運決策更加審慎。均值或者比例有偏移，唔可以診斷機制、證明因果、計出財務回報，亦唔可以授權針對個人採取行動。嗰啲仲要額外嘅核實證據同決策標準。
- id: takeaway
  visual: takeaway
  seconds: 58
  kicker_en: Decision rule
  kicker_zh: 决策规则
  kicker_zh_hk: 決策規則
  title_en: Right method, careful read
  title_zh: 方法要对，解释要慎
  title_zh_hk: 方法要啱，解釋要慎
  q1_en: What picks the right branch?
  q1_zh: 什么决定正确分支？
  q1_zh_hk: 乜嘢決定正確分支？
  q2_en: What must precede action?
  q2_zh: 行动前还要核实什么？
  q2_zh_hk: 行動前仲要核實咩？
  s1_en: >-
    Name the parameter, the contrast, the number of samples, paired or independent units, whether σ is known, quantitative
    or binary outcome, and whether the plan is one-sided, multiple, or sequential. Then pick a method whose assumptions match.
  s1_zh: >-
    先说清参数、对比、样本个数、单元是配对还是独立、σ 是否已知、结果是定量还是二元，以及计划是单尾、多重还是序贯。然后再选假设与之匹配的方法。
  s1_zh_hk: >-
    先講清參數、對比、樣本個數、單元係配對定係獨立、σ 係咪已知、結果係定量定係二元，以及計劃係單尾、多重定係序貫。然後再揀假設同佢匹配嘅方法。
  s2_en: >-
    Before recommending action, audit provenance, assignment, independence, measurement, exclusions, missingness, model
    conditions, effect size, interval precision, multiplicity, monitoring, practical thresholds, costs, and causal identification.
  s2_zh: >-
    提出行动建议前，还要审计数据来源、分配方式、独立性、测量、排除与缺失、模型条件、效应量、区间精度、多重性、监测、实际阈值、成本，以及因果识别。
  s2_zh_hk: >-
    提出行動建議之前，仲要審計數據來源、分配方式、獨立性、量度、排除同缺失、模型條件、效應量、區間精度、多重性、監測、實際閾值、成本，以及因果識別。
  s3_en: >-
    So which test matches the design? Frame the estimand, keep the design, quantify uncertainty, apply the planned rule, and
    read the result only as far as the evidence goes. Statistical significance is evidence, not an automatic operating command.
  s3_zh: >-
    那么，哪种检验匹配这项设计？先框定估计目标，保留设计，量化不确定，按事先计划裁决，并只在证据支持的范围内解释。统计显著是证据，不是自动经营指令。
  s3_zh_hk: >-
    噉，邊種檢驗匹配呢項設計？先框定估計目標，保留設計，量化不確定，跟事先計劃裁決，並淨係喺證據支持嘅範圍內解釋。統計顯著係證據，唔係自動營運指令。
