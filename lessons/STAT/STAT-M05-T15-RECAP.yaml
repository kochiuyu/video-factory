id: STAT-M05-T15-RECAP
course: STAT-M05
course_en: Hypothesis Testing & Store Experiments
course_zh: 假设检验与门店运营实验
course_zh_hk: 假設檢驗與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Executive Testing Matrix: Choosing, Interpreting, and Auditing a Test'
title_zh: 执行决策检验矩阵：选择、解释与审计统计检验
title_zh_hk: 執行決策檢驗矩陣：選擇、解讀同審計統計檢驗
objective_en: Select an appropriate mean or proportion test from the parameter, number of samples, dependence structure, and
  variance information; connect two-sided tests with matching confidence intervals; and apply a statistical due-diligence
  checklist that separates evidence, practical importance, causality, and operational action.
objective_zh: 根据参数类型、样本数量、依赖结构与方差信息选择适当的均值或比例检验，把双侧检验与匹配置信区间联系起来，并应用统计尽调清单，区分统计证据、实际重要性、因果解释与经营行动。
objective_zh_hk: 根據參數類型、樣本數量、依賴結構同方差資訊選擇適當嘅均值或者比例檢驗，將雙側檢驗同匹配置信區間連繫起嚟，並應用統計盡調清單，區分統計證據、實際重要性、因果解讀同營運行動。
