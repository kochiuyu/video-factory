id: STAT-M06-T01-SCATT
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Scatter Plots and Empirical Association: Seeing the Data Before Modeling'
title_zh: 散点图与经验关联：建模前先看数据
title_zh_hk: 散點圖同經驗關聯：建模之前先睇數據
objective_en: Construct and interpret a bivariate scatter plot, identify direction, form, strength, clusters, and influential
  observations, calculate the sample centroid, and distinguish empirical association from prediction or causation.
objective_zh: 构建并解读双变量散点图，识别方向、形态、强度、组群与强影响观测，计算样本质心，并区分经验关联、预测与因果关系。
objective_zh_hk: 構建並解讀雙變量散點圖，識別方向、形態、強度、群組同強影響觀測，計算樣本質心，並區分經驗關聯、預測同因果關係。
