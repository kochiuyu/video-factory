id: STAT-M06-T02-COVAR
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Sample Covariance: Measuring the Direction of Joint Variation'
title_zh: 样本协方差：衡量联合变动方向
title_zh_hk: 樣本協方差：量度聯合變動方向
objective_en: Calculate sample covariance from centered cross-products, interpret its sign as the direction of linear co-movement,
  explain why its magnitude depends on measurement units, and distinguish association from causal or operational conclusions.
objective_zh: 利用中心化离均差乘积计算样本协方差，把其符号解释为线性共动方向，说明其绝对大小为何依赖测量单位，并区分统计关联、因果与经营结论。
objective_zh_hk: 利用中心化離均差乘積計算樣本協方差，將佢嘅符號解讀做線性共動方向，說明佢嘅絕對大小點解依賴量度單位，並區分統計關聯、因果同營運結論。
