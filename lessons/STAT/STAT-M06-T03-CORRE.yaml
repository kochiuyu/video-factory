id: STAT-M06-T03-CORRE
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Pearson Correlation: Standardizing Linear Association'
title_zh: 皮尔逊相关系数：标准化线性关联
title_zh_hk: 皮爾遜相關系數：標準化線性關聯
objective_en: Calculate Pearson’s sample correlation by standardizing covariance, interpret its sign and magnitude within
  minus one and plus one, verify scale invariance, identify sensitivity to nonlinearity and influential observations, and
  distinguish empirical linear association from prediction or causation.
objective_zh: 通过标准化协方差计算皮尔逊样本相关系数，解释其在负一与正一之间的符号和大小，验证尺度不变性，识别非线性与强影响观测的敏感性，并区分经验线性关联、预测与因果关系。
objective_zh_hk: 透過標準化協方差計算皮爾遜樣本相關系數，解讀佢喺負一同正一之間嘅符號同大小，驗證尺度不變性，識別非線性同強影響觀測嘅敏感性，並區分經驗線性關聯、預測同因果關係。
