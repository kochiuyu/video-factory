id: STAT-M06-T04-OLSCR
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Ordinary Least Squares Criterion: Choosing the Line with Minimum Squared Error'
title_zh: 普通最小二乘准则：选择误差平方和最小的直线
title_zh_hk: 普通最小二乘準則：選擇誤差平方和最細嘅直線
objective_en: Define fitted values and residuals, formulate the Ordinary Least Squares objective, explain why squared residuals
  prevent cancellation and weight large misses more heavily, compare candidate lines by SSE, and state the zero-sum residual
  property only for an OLS model that includes an intercept.
objective_zh: 定义拟合值与残差，构建普通最小二乘目标函数，解释残差平方为何能防止正负抵消并对大偏差赋予更高权重，利用 SSE 比较候选直线，并将残差和为零的性质限定于包含截距的 OLS 模型。
objective_zh_hk: 定義擬合值同殘差，構建普通最小二乘目標函數，解釋殘差平方點解可以防止正負抵消並對大偏差賦予更高權重，利用 SSE 比較候選直線，並將殘差和為零嘅性質限定於包含截距嘅 OLS 模型。
