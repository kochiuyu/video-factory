id: STAT-M06-T05-SLOPE
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'OLS Slope and Intercept: Derivation, Units, and Interpretation'
title_zh: OLS 斜率与截距：推导、单位与解释
title_zh_hk: OLS 斜率同截距：推導、單位同解讀
objective_en: Calculate the simple-regression OLS slope and intercept from centered sums, interpret the slope as a sample
  linear association in outcome units per predictor unit, explain why the fitted line passes through the sample centroid,
  and limit intercept and causal interpretations when zero or intervention claims lie outside the design.
objective_zh: 利用中心化离差和计算简单回归的 OLS 斜率与截距，把斜率解释为每单位预测变量对应的结果变量样本线性关联，说明拟合线为何经过样本质心，并在零值或干预主张超出设计时限制截距与因果解释。
objective_zh_hk: 利用中心化離差和計算簡單回歸嘅 OLS 斜率同截距，將斜率解讀做每單位預測變量對應嘅結果變量樣本線性關聯，說明擬合線點解經過樣本質心，並喺零值或者干預主張超出設計嗰陣限制截距同因果解讀。
