id: STAT-M06-T06-SSDEC
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Sum of Squares Decomposition: Total, Explained, and Residual Variation'
title_zh: 平方和分解：总变异、解释变异与残差变异
title_zh_hk: 平方和分解：總變異、解釋變異同殘差變異
objective_en: Decompose outcome variation around the sample mean into regression and residual sums of squares, derive the
  identity from fitted deviations and residuals, explain why the cross-product vanishes for OLS with an intercept, calculate
  a numerical decomposition, and avoid interpreting explained variation as causal attribution.
objective_zh: 把结果变量围绕样本均值的变异分解为回归平方和与残差平方和，从拟合偏差和残差推导该恒等式，解释为何含截距 OLS 的交叉乘积项为零，完成数值分解，并避免把解释变异视为因果归因。
objective_zh_hk: 將結果變量圍繞樣本平均數嘅變異分解做回歸平方和同殘差平方和，由擬合偏差同殘差推導呢個恆等式，解釋點解含截距 OLS 嘅交叉乘積項係零，完成數值分解，並避免將解釋變異視為因果歸因。
