id: STAT-M06-T07-RSQRD
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Coefficient of Determination: Interpreting R-Squared without Overclaiming'
title_zh: 判定系数：正确解释 R 平方并避免过度结论
title_zh_hk: 判定系數：正確解讀 R 平方並避免過度結論
objective_en: Calculate R-squared from explained and residual sums of squares, interpret it as the in-sample proportion of
  outcome variation accounted for by an intercept-including model, verify that R-squared equals Pearson correlation squared
  in simple OLS regression, and audit high-fit claims for causality, overfitting, influential observations, and out-of-sample
  performance.
objective_zh: 根据解释平方和与残差平方和计算 R 平方，把它解释为含截距模型在样本内所核算的结果变异比例，验证简单 OLS 回归中 R 平方等于皮尔逊相关系数的平方，并从因果、过拟合、强影响观测与样本外表现角度审计高拟合主张。
objective_zh_hk: 根據解釋平方和同殘差平方和計算 R 平方，將佢解讀做含截距模型喺樣本內所核算嘅結果變異比例，驗證簡單 OLS 回歸入面 R 平方等於皮爾遜相關系數嘅平方，並由因果、過度擬合、強影響觀測同樣本外表現角度審計高擬合主張。
