id: STAT-M06-T08-STDER
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Residual Standard Error: Measuring Typical Regression Error in Outcome Units'
title_zh: 残差标准误：以结果单位衡量典型回归误差
title_zh_hk: 殘差標準誤：以結果單位量度典型回歸誤差
objective_en: Calculate the residual standard error in simple linear regression, explain the n minus 2 residual degrees of
  freedom, interpret the result in outcome units, distinguish residual spread from slope uncertainty and prediction intervals,
  and avoid converting a model-fit statistic into an automatic inventory or service-level rule.
objective_zh: 计算简单线性回归的残差标准误，解释 n - 2 残差自由度，以结果变量单位解读该指标，区分残差离散、斜率不确定性与预测区间，并避免把模型拟合统计量直接转化为自动库存或服务水平规则。
objective_zh_hk: 計算簡單線性回歸嘅殘差標準誤，解釋 n - 2 殘差自由度，以結果變量單位解讀呢個指標，區分殘差離散、斜率不確定性同預測區間，並避免將模型擬合統計量直接轉化成自動庫存或者服務水平規則。
