id: STAT-M06-T09-SLPSE
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Standard Error of the OLS Slope: Quantifying Sampling Precision'
title_zh: OLS 斜率标准误：量化抽样精度
title_zh_hk: OLS 斜率標準誤：量化抽樣精度
objective_en: Calculate the estimated standard error of the simple-regression OLS slope, explain how residual spread and predictor
  dispersion affect precision, interpret its units correctly, distinguish a standard error from a confidence interval or causal
  effect, and evaluate design choices without encouraging biased or unsafe sampling.
objective_zh: 计算简单回归 OLS 斜率的估计标准误，解释残差离散与预测变量离散度如何影响精度，正确解读其单位，区分标准误、置信区间与因果效应，并在不鼓励有偏或不安全抽样的前提下评估设计选择。
objective_zh_hk: 計算簡單回歸 OLS 斜率嘅估計標準誤，解釋殘差離散同預測變量離散度點樣影響精度，正確解讀佢嘅單位，區分標準誤、置信區間同因果效應，並喺唔鼓勵有偏或者唔安全抽樣嘅前提之下評估設計選擇。
