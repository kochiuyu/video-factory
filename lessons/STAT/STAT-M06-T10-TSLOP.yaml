id: STAT-M06-T10-TSLOP
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The t-Test for a Regression Slope: Evidence, Magnitude, and Decision Limits'
title_zh: 回归斜率 t 检验：证据、幅度与决策边界
title_zh_hk: 回歸斜率 t 檢驗：證據、幅度同決策界線
objective_en: Formulate and conduct a Student t-test for a simple-regression slope, calculate the test statistic and residual
  degrees of freedom, interpret rejection and failure to reject correctly, connect a two-sided test with a matching confidence
  interval, and separate statistical evidence from causality, economic importance, and payment or rollout decisions.
objective_zh: 构建并执行简单回归斜率的学生氏 t 检验，计算检验统计量与残差自由度，正确解释拒绝与不拒绝结论，把双侧检验与匹配置信区间联系起来，并区分统计证据、因果关系、经济重要性以及付款或推广决策。
objective_zh_hk: 構建並執行簡單回歸斜率嘅學生氏 t 檢驗，計算檢驗統計量同殘差自由度，正確解讀拒絕同唔拒絕結論，將雙側檢驗同匹配置信區間連繫起嚟，並區分統計證據、因果關係、經濟重要性以及付款或者推廣決策。
