id: STAT-M06-T11-CVIPI
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Confidence and Prediction Intervals: Mean Response versus Individual Outcome'
title_zh: 置信区间与预测区间：均值响应与个体结果
title_zh_hk: 置信區間同預測區間：平均響應同個別結果
objective_en: Construct and distinguish a confidence interval for the conditional mean response and a prediction interval
  for one future outcome, explain the additional individual-error term in the prediction standard error, calculate both intervals
  at the sample mean, and limit operational decisions to the population, design, model assumptions, and forecast horizon supported
  by the analysis.
objective_zh: 构建并区分条件均值响应的置信区间与单个未来结果的预测区间，解释预测标准误中额外的个体误差项，在样本均值处计算两类区间，并把经营决策限制在分析所支持的总体、设计、模型假设与预测时域内。
objective_zh_hk: 構建並區分條件平均響應嘅置信區間同單個未來結果嘅預測區間，解釋預測標準誤入面額外嘅個別誤差項，喺樣本平均數嗰度計算兩類區間，並將營運決策限制喺分析所支持嘅總體、設計、模型假設同預測時域之內。
