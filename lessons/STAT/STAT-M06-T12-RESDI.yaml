id: STAT-M06-T12-RESDI
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Residual Diagnostics: Linearity, Constant Variance, and Model Risk'
title_zh: 残差诊断：线性、恒定方差与模型风险
title_zh_hk: 殘差診斷：線性、恆定方差同模型風險
objective_en: Construct and interpret residual-versus-fitted plots, distinguish random constant-width scatter from fanning
  and curvature, explain how heteroskedasticity affects conventional OLS inference without overstating its effect on coefficients,
  and select proportionate diagnostic responses before operational use.
objective_zh: 构建并解读残差对拟合值图，区分随机恒宽散点、漏斗形扩散与曲线形态，解释异方差如何影响传统 OLS 推断而不夸大其对系数的影响，并在经营使用前选择适度的诊断应对措施。
objective_zh_hk: 構建並解讀殘差對擬合值圖，區分隨機恆闊散點、漏斗形擴散同曲線形態，解釋異方差點樣影響傳統 OLS 推斷而唔誇大佢對系數嘅影響，並喺營運使用之前選擇適度嘅診斷應對措施。
