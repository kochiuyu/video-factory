id: STAT-M06-T13-LOGLG
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Log-Log Demand Models: Estimating and Applying Price Elasticity'
title_zh: 双对数需求模型：估计与应用价格弹性
title_zh_hk: 雙對數需求模型：估計同應用價格彈性
objective_en: Formulate a log-log demand model, interpret its slope as constant price elasticity under the stated specification,
  distinguish local percentage approximations from exact finite-change calculations, assess revenue implications with appropriate
  qualifications, and audit positivity, confounding, functional form, and uncertainty before pricing decisions.
objective_zh: 构建双对数需求模型，在既定设定下把斜率解释为恒定价格弹性，区分局部百分比近似与有限变动的精确计算，在适当限定下评估收入含义，并在定价决策前审计正值要求、混杂、函数形式与不确定性。
objective_zh_hk: 構建雙對數需求模型，喺既定設定之下將斜率解讀做恆定價格彈性，區分局部百分比近似同有限變動嘅精確計算，喺適當限定之下評估收入含義，並喺定價決策之前審計正值要求、混雜、函數形式同不確定性。
