id: STAT-M06-T14-OVBIA
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Omitted Variable Bias: Confounding, Direction, and Causal Limits'
title_zh: 遗漏变量偏差：混杂、偏差方向与因果边界
title_zh_hk: 遺漏變量偏差：混雜、偏差方向同因果界線
objective_en: State the conditions for omitted variable bias, derive its direction and magnitude in simple regression, calculate
  an assumed bias term consistently, distinguish association from causal effect, and specify a defensible confounder-audit
  workflow before operational decisions.
objective_zh: 说明遗漏变量偏差的形成条件，推导简单回归中偏差的方向与大小，一致地计算假设偏差项，区分统计关联与因果效应，并在经营决策前制定可辩护的混杂审计流程。
objective_zh_hk: 說明遺漏變量偏差嘅形成條件，推導簡單回歸入面偏差嘅方向同大小，一致噉計算假設偏差項，區分統計關聯同因果效應，並喺營運決策之前制定可辯護嘅混雜審計流程。
