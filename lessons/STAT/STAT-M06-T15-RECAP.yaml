id: STAT-M06-T15-RECAP
course: STAT-M06
course_en: Linear Regression & Econometric Modeling
course_zh: 线性回归与计量经济建模
course_zh_hk: 線性回歸與計量經濟建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Regression Decision Review: Fit, Uncertainty, Diagnostics, and Validation'
title_zh: 回归决策复核：拟合、不确定性、诊断与验证
title_zh_hk: 回歸決策覆核：擬合、不確定性、診斷同驗證
objective_en: Integrate coefficient interpretation, in-sample fit, residual error, slope uncertainty, diagnostics, causal
  limits, and out-of-sample validation into a proportionate model-review framework, calculate and compare RMSE consistently,
  and separate statistical evidence from capital authorization.
objective_zh: 把系数解释、样本内拟合、残差误差、斜率不确定性、诊断、因果边界与样本外验证整合为适度的模型复核框架，一致地计算并比较 RMSE，并区分统计证据与资本授权。
objective_zh_hk: 將系數解讀、樣本內擬合、殘差誤差、斜率不確定性、診斷、因果界線同樣本外驗證整合做適度嘅模型覆核框架，一致噉計算並比較 RMSE，並區分統計證據同資本授權。
glossary:
- en: Out-of-Sample Validation
  zh: 样本外验证
  zh_hk: 樣本外驗證
  lock: true
- en: Root Mean Squared Error
  zh: 均方根误差
  zh_hk: 均方根誤差
  lock: true
