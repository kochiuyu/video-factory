title_en: 'The Two-Variable Model: Solving Omitted Variable Bias'
title_zh: 双变量模型：化解遗漏变量偏差
title_zh_hk: 雙變量模型：化解遺漏變量偏差
objective_en: Formulate the two-variable multiple regression equation, explain how conditioning on foot traffic resolves omitted variable bias on lease rent, and interpret partial regression slopes.
objective_zh: 构建双自变量多元回归方程，阐明控制客流量如何化解商铺租金的遗漏变量偏差，并合理解读偏回归斜率。
objective_zh_hk: 構建雙自變量多元回歸方程，闡明控制客流量點樣化解舖租嘅遺漏變量偏差，並合理解讀偏回歸斜率。
