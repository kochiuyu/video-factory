objective_en: Apply the Frisch-Waugh-Lovell partialling out logic to isolate the pure marginal effect of an operational input by purging shared confounding variation.
objective_zh: 应用弗里施-沃-洛弗尔偏回归净化逻辑，剔除共享混淆变异，以分离运营要素的纯粹边际效应。
objective_zh_hk: 應用弗里施-沃-洛弗爾偏回歸淨化邏輯，剔除共享混淆變異，以分離營運要素嘅純粹邊際效應。
