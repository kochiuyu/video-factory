title_en: Adjusted R-Squared & Model Complexity
title_zh: 调整后 R方 与模型复杂度
title_zh_hk: 調整後 R方 與模型複雜度
objective_en: Explain why raw R-squared mechanically inflates when adding predictors, calculate adjusted R-squared, and use its complexity penalty to audit models against over-fitting.
objective_zh: 阐明自变量增加时原始 R方 机械递增的原理，计算调整后 R方，并利用其复杂度惩罚机制防范模型过度拟合。
objective_zh_hk: 闡明加入自變量嗰陣原始 R方 機械式遞增嘅原理，計算調整後 R方，並利用其複雜度扣減機制防範模型過度擬合。
