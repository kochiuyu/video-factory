title_en: Multicollinearity & Variance Inflation Factors
title_zh: 多重共线性与方差膨胀因子
title_zh_hk: 多重共線性與方差膨脹因子
objective_en: Diagnose multicollinearity in multiple regression, calculate the Variance Inflation Factor (VIF), and identify how collinear operational inputs inflate parameter standard errors without degrading overall prediction.
objective_zh: 诊断多元回归中的多重共线性，计算方差膨胀因子（VIF），并辨识高度相关的营运输入如何在不损害整体预测精度的前提下人为膨胀参数标准误。
objective_zh_hk: 診斷多元回歸入面嘅多重共線性，計算方差膨脹因子（VIF），並指出高度相關嘅營運輸入點樣喺唔影響整體預測嘅前提下，夾硬放大參數標準誤。
