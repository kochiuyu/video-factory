title_en: Indicator Dummies & Binary Group Premiums
title_zh: 虚拟变量与二元群体溢价
title_zh_hk: 虛擬變量與二元群體溢價
objective_en: Incorporate binary indicator dummy variables into multiple regression, interpret the dummy coefficient as a parallel intercept shift, and quantify district pricing premiums.
objective_zh: 在多元回归中纳入二元指示虚拟变量，将虚拟变量系数解读为平行的截距平移，并量化商圈溢价。
objective_zh_hk: 喺多元回歸入面納入二元指示虛擬變量，將虛擬變量系數解讀為平行嘅截距平移，並量化商圈溢價。
