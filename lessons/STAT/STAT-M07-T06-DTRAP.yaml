title_en: The Dummy Variable Trap & Base Categories
title_zh: 虚拟变量陷阱与基准参照组
title_zh_hk: 虛擬變量陷阱與基準參照組
objective_en: Identify the dummy variable trap, demonstrate how perfect collinearity causes singular matrix inversion failure, and apply the n minus one rule to select reference categories.
objective_zh: 识别虚拟变量陷阱，阐明完全多重共线性如何引发奇异矩阵求逆崩溃，并运用 n 减 1 准则合理设定基准参照组。
objective_zh_hk: 識別虛擬變量陷阱，闡明完全多重共線性點樣引致奇異矩陣求逆崩潰，並運用 n 減 1 準則合理設定基準參照組。
