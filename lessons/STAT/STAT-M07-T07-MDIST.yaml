objective_en: Estimate a multiple regression model with multi-category district dummy controls, establish an operational base store, and interpret differential district intercepts relative to the benchmark.
objective_zh: 构建包含多区域虚拟变量控制的多元回归模型，确立营运基准门店，并解读各区域相对于基准的差异截距。
objective_zh_hk: 構建包含多區域虛擬變量控制嘅多元回歸模型，確立營運基準門市，並解讀各區域相對於基準嘅差異截距。
