objective_en: Formulate continuous interaction terms, calculate non-constant marginal effects, and evaluate statistical complementarity between staffing levels and customer foot traffic.
objective_zh: 构建连续变量交互项模型，计算变动边际效应，并评估员工排班与客流量之间的统计互补协同效应。
objective_zh_hk: 構建連續變量交互項模型，計算變動邊際效應，並評估員工排班與客流量之間嘅統計互補協同效應。
