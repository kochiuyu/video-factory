title_en: 'Slope Interactions: Converting Commuters on Rainy Days'
title_zh: 斜率交互项：雨天过路客流的转化倾角
title_zh_hk: 斜率交互項：雨天過路客流嘅轉化傾角
objective_en: Estimate dummy-by-continuous interaction models, interpret the interaction coefficient as a slope rotation, and evaluate how external weather shocks alter marginal foot traffic conversion rates.
objective_zh: 构建虚拟变量与连续变量交互项模型，将交互系数解读为斜率旋转角度，并评估外部天气冲击如何改变街头客流的边际转化率。
objective_zh_hk: 構建虛擬變量與連續變量交互項模型，將交互系數解讀為斜率旋轉角度，並評估外部天氣衝擊點樣改變街頭客流嘅邊際轉化率。
