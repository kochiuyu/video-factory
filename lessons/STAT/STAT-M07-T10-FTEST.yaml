objective_en: Conduct a joint F-test using restricted and unrestricted regression models to evaluate whether a multi-variable operational package has a statistically significant overall effect.
objective_zh: 利用受约束与无约束回归模型执行联合 F 检验，评估多变量运营升级组合包是否具有统计上显著的整体提升效应。
objective_zh_hk: 利用受約束與無約束回歸模型執行聯合 F 檢驗，評估多變量營運升級組合包係咪具備統計上顯著嘅整體提升效應。
