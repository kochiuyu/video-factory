objective_en: Calculate leverage values and Cook's Distance, audit how extreme facilities pull multiple regression estimates, and apply sample stratification to isolate high-leverage assets.
objective_zh: 计算杠杆值与库克距离，审查极端门店如何扭曲多元回归参数，并运用样本分层策略隔离高杠杆特殊资产。
objective_zh_hk: 計算槓桿值同庫克距離，審查極端分店點樣扭曲多元回歸參數，並運用樣本分層策略隔離高槓桿特殊資產。
