title_en: 'The 2x2 DiD Grid: Isolating Automated Tamper Upgrades'
title_zh: 2x2 双重差分矩阵：剥离自动填压机升级效应
title_zh_hk: 2x2 雙重差分矩陣：剝離自動填壓機升級效應
objective_en: Construct the four-cell Difference-in-Differences (DiD) grid, subtract the contemporaneous change observed in an untreated control store, and interpret the resulting estimate under the parallel-trends assumption.
objective_zh: 构建四格双重差分（DiD）矩阵，扣除未受干预对照门店的同期变化，并在平行趋势假设下解读所得估计值。
objective_zh_hk: 構建四格雙重差分（DiD）矩陣，扣除未受干預對照門市嘅同期變化，並喺平行趨勢假設之下解讀所得估計值。
