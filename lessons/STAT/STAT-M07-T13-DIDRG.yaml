id: STAT-M07-T13-DIDRG
course: STAT-M07
course_en: Applied Multiple Regression & Store Experiments
course_zh: 多元回归与门店运营实验
course_zh_hk: 多元回歸與門市營運實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Regression DiD: The Interaction Treatment Effect'
title_zh: 回归型双重差分：交互项中的处理效应
title_zh_hk: 回歸型雙重差分：交互項入面嘅處理效應
objective_en: Estimate Difference-in-Differences with multiple regression, show that the Treat-by-Post interaction coefficient equals the 2x2 DiD contrast in the canonical model, and interpret its standard error and t-statistic under appropriate identification and inference assumptions.
objective_zh: 使用多元回归估计双重差分，说明在标准模型中处理组与后时期交互项系数等于 2x2 DiD 对比，并在适当的识别与推断假设下解读其标准误和 t 统计量。
objective_zh_hk: 使用多元回歸估計雙重差分，說明喺標準模型入面處理組同後時期交互項系數等於 2x2 DiD 對比，並喺適當嘅識別同推斷假設之下解讀標準誤同 t 統計量。
