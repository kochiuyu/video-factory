title_en: Parallel Trends & Placebo Audits
title_zh: 平行趋势假定与安慰剂检验
title_zh_hk: 平行趨勢假定與安慰劑檢驗
objective_en: Evaluate the Parallel Trends Assumption in Difference-in-Differences, use pre-intervention plots and placebo tests as diagnostic evidence, and identify differential local trends that threaten the design.
objective_zh: 评估双重差分法中的平行趋势假定，使用干预前趋势图和安慰剂检验作为诊断证据，并识别威胁研究设计的局部差异趋势。
objective_zh_hk: 評估雙重差分法入面嘅平行趨勢假定，使用干預前趨勢圖同安慰劑檢驗作為診斷證據，並識別威脅研究設計嘅局部差異趨勢。
