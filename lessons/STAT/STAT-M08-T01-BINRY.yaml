title_en: 'The Binary Decision Problem: Beyond Continuous Outcomes'
title_zh: 二元决策问题：超越连续变量预测
title_zh_hk: 二元決策問題：超越連續變量預測
objective_en: Formulate the binary discrete choice problem, define conditional expectation as an event probability, and contrast continuous sales forecasting against discrete human decision modeling.
objective_zh: 构建二元离散选择问题，将条件期望定义为事件发生概率，并对比连续销售额预测与离散人类决策建模的核心差异。
objective_zh_hk: 構建二元離散選擇問題，將條件期望定義為事件發生概率，並對比連續銷售額預測與離散人類決策建模嘅核心差異。
