id: STAT-M08-T02-LPMFL
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Linear Probability Model: Why OLS Breaks on Probabilities'
title_zh: 线性概率模型：为何 OLS 预测概率必然失效
title_zh_hk: 線性概率模型：點解 OLS 預測概率必然崩潰
objective_en: Analyze the Linear Probability Model (LPM), calculate out-of-range fitted values, explain its conditional heteroskedasticity, and identify when robust inference or a bounded-response model is more appropriate.
objective_zh: 分析线性概率模型（LPM），计算越界拟合值，解释其条件异方差性，并判断何时应采用稳健推断或有界响应模型。
objective_zh_hk: 分析線性概率模型（LPM），計算越界擬合值，解釋條件異方差性，並判斷幾時應該採用穩健推斷或者有界響應模型。
