title_en: 'Odds & Log-Odds: Mapping Probabilities to the Real Line'
title_zh: 几率与对数几率：将概率映射至实数轴
title_zh_hk: 勝算與對數勝算：將概率映射至實數軸
objective_en: Convert probabilities into odds, apply the natural logarithm to construct log-odds (logits), and explain how this transformation maps bounded [0, 1] probabilities onto the unbounded real number line.
objective_zh: 将概率转化为几率，运用自然对数构建对数几率（Logit），并阐明该变换如何将受限在 [0, 1] 内的概率无约束映射至整条实数轴。
objective_zh_hk: 將概率轉化為勝算，運用自然對數構建對數勝算（Logit），並闡明呢個變換點樣將受限喺 [0, 1] 內嘅概率無約束映射至成條實數軸。
