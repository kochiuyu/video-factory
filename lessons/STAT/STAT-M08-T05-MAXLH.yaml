title_en: 'Maximum Likelihood Intuition: Finding the Best-Fitting S-Curve'
title_zh: 极大似然估计的直觉：搜寻最优 S 曲线
title_zh_hk: 極大似然估計嘅直覺：搜尋最優 S 曲線
objective_en: Explain the conceptual mechanics of Maximum Likelihood Estimation (MLE), construct the Bernoulli likelihood and log-likelihood functions, and contrast likelihood maximization against least-squares minimization.
objective_zh: 阐明极大似然估计（MLE）的底层直觉机制，构建伯努利似然与对数似然函数，并对比似然最大化与最小二乘最小化的核心差异。
objective_zh_hk: 闡明極大似然估計（MLE）嘅底層直覺機制，構建伯努利似然同對數似然函數，並對比似然最大化與最小二乘最小化嘅核心差異。
