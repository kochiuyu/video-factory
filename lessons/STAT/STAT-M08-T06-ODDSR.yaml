course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Interpreting Odds Ratios: Multiplicative Risk in Retail'
title_zh: 解读几率比：零售业务中的乘数效应
title_zh_hk: 解讀勝算比：零售業務入面嘅乘數效應
objective_en: Exponentiate logistic regression coefficients to obtain odds ratios, translate odds ratios into percentage changes in odds, and distinguish odds changes from probability changes.
objective_zh: 对逻辑回归系数取指数以获得几率比，将几率比转化为几率百分比变化，并区分几率变化与概率变化。
objective_zh_hk: 對邏輯回歸系數取指數以得到勝算比，將勝算比轉化做勝算百分比變化，並區分勝算變化同概率變化。
