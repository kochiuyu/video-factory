id: STAT-M08-T07-MARGE
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Marginal Effects at the Mean: Translating Logits to Real Probabilities'
title_zh: 均值处的边际效应：将 Logit 还原为真实概率变化
title_zh_hk: 均值處嘅邊際效應：將 Logit 還原做真實概率變動
objective_en: Apply the logistic chain rule to calculate a continuous predictor’s marginal effect at a specified profile, distinguish MEM from AME, and use the divide-by-four result as a bound on the marginal effect magnitude.
objective_zh: 应用逻辑回归链式法则，在指定画像处计算连续自变量的边际效应，区分均值处边际效应（MEM）与平均边际效应（AME），并将除以四结果用作边际效应绝对值的上界。
objective_zh_hk: 應用邏輯回歸鏈式法則，喺指定背景計算連續自變量嘅邊際效應，區分均值處邊際效應（MEM）同平均邊際效應（AME），並將除以四結果用作邊際效應絕對值嘅上界。
