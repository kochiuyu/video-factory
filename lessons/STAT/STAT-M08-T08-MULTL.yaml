id: STAT-M08-T08-MULTL
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Multi-Predictor Logit: Controlling Confounders in Choice'
title_zh: 多元逻辑回归：在离散抉择中控制混淆变量
title_zh_hk: 多元邏輯回歸：喺離散抉擇中控制混淆變量
objective_en: Formulate a multiple logistic regression, interpret adjusted odds ratios conditional on included predictors, and explain how omitted-variable confounding can change coefficient estimates without claiming that statistical adjustment alone proves causality.
objective_zh: 构建多元逻辑回归，在已纳入自变量条件下解读调整后几率比，并解释遗漏变量混淆如何改变系数估计，同时避免把统计调整视为因果证明。
objective_zh_hk: 構建多元邏輯回歸，喺已納入自變量條件之下解讀調整後勝算比，並解釋遺漏變量混淆點樣改變系數估計，同時避免將統計調整當作因果證明。
