id: STAT-M08-T09-CONFZ
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Confusion Matrix: Precision, Recall, and Classification Trade-offs'
title_zh: 混淆矩阵：查准率、召回率与分类权衡
title_zh_hk: 混淆矩陣：查準率、召回率與分類權衡
objective_en: Construct a 2x2 confusion matrix at a stated decision threshold, calculate accuracy, precision, recall, and specificity, and evaluate false-positive and false-negative trade-offs under class imbalance.
objective_zh: 在明确决策阈值下构建 2x2 混淆矩阵，计算准确率、查准率、召回率与特异度，并在类别不平衡下评估假阳性与假阴性的取舍。
objective_zh_hk: 喺明確決策門檻之下構建 2x2 混淆矩陣，計算準確率、查準率、召回率同特異度，並喺類別不平衡之下評估假陽性同假陰性嘅取捨。
glossary:
- en: Confusion Matrix
  zh: 混淆矩阵
  zh_hk: 混淆矩陣
  lock: true
- en: Precision (Positive Predictive Value)
  zh: 查准率（阳性预测值）
  zh_hk: 查準率（陽性預測值）
  lock: true
- en: Recall (Sensitivity)
  zh: 召回率（灵敏度）
  zh_hk: 召回率（靈敏度）
  lock: true
