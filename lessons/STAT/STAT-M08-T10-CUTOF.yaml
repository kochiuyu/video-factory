id: STAT-M08-T10-CUTOF
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Optimizing the Probability Cutoff: Asymmetric Business Costs'
title_zh: 优化概率决策门槛：非对称商业成本考量
title_zh_hk: 優化概率決策門檻：非對稱商業成本考量
objective_en: Derive a cost-sensitive classification threshold under stated assumptions, explain how threshold changes affect false positives and false negatives, and validate the selected rule using expected loss and deployment-representative data.
objective_zh: 在明确假设下推导成本敏感的分类阈值，解释阈值变化如何影响假阳性与假阴性，并使用期望损失和具有部署代表性的数据验证所选规则。
objective_zh_hk: 喺明確假設之下推導成本敏感嘅分類門檻，解釋門檻變化點樣影響假陽性同假陰性，並使用期望損失同具有部署代表性嘅數據驗證所選規則。
