objective_en: Calculate McFadden’s Pseudo R-squared, conduct a likelihood-ratio test for nested logistic models, and distinguish model improvement and joint statistical evidence from predictive performance or causal validity.
objective_zh: 计算麦克法登伪 R平方，对嵌套逻辑模型进行似然比检验，并区分模型改善与联合统计证据、预测表现及因果有效性。
objective_zh_hk: 計算麥克法登偽 R平方，對嵌套邏輯模型進行似然比檢驗，並區分模型改善同聯合統計證據、預測表現及因果有效性。
