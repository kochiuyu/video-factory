id: STAT-M08-T13-CHURN
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Customer Churn Scoring: Auditing Metro Coffee Club Attrition'
title_zh: 客户流失评分：审计会员俱乐部流失暗流
title_zh_hk: 客戶流失評分：審計會員俱樂部流失暗湧
objective_en: Define a churn outcome and prediction time, use RFM-style predictors to generate customer-level risk probabilities, and design an auditable scoring and retention workflow with validation, capacity, and privacy controls.
objective_zh: 定义流失结果与预测时点，使用 RFM 类自变量生成顾客层面的风险概率，并在验证、处理能力与隐私控制下设计可审计的评分及挽留流程。
objective_zh_hk: 定義流失結果同預測時點，使用 RFM 類自變量生成顧客層面嘅風險概率，並喺驗證、處理能力同私隱控制之下設計可審計嘅評分同挽留流程。
