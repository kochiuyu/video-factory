id: STAT-M08-T14-UPLFT
course: STAT-M08
course_en: Logistic Regression & Customer Choice Modeling
course_zh: 逻辑回归与客户选择建模
course_zh_hk: 邏輯回歸與客戶選擇建模
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Targeted Voucher Intervention: Estimating Uplift from Push Campaigns'
title_zh: 定向优惠券干预：估算推送营销的真实增量
title_zh_hk: 定向優惠券干預：估算推送營銷嘅真實增量
objective_en: Define conditional promotional uplift as a treatment-effect contrast, explain why individual response types are latent, estimate average uplift from a randomized holdout, and design targeting decisions using uncertainty, cost, and validation.
objective_zh: 将条件促销净增量定义为处理效应对比，解释个体响应类型为何不可直接观测，利用随机保留对照组估计平均净增量，并结合不确定性、成本与验证设计定向决策。
objective_zh_hk: 將條件促銷淨增量定義做處理效應對比，解釋個體響應類型點解唔可以直接觀測，利用隨機保留對照組估計平均淨增量，並結合不確定性、成本同驗證設計定向決策。
