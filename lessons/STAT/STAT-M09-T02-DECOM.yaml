id: STAT-M09-T02-DECOM
course: STAT-M09
course_en: Business Time Series & Demand Forecasting
course_zh: 商业时间序列与需求预测
course_zh_hk: 商業時間序列與需求預測
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Classical Time-Series Decomposition: Trend, Seasonality, and Shocks'
title_zh: 经典时间序列分解：长期趋势、季节性与随机冲击
title_zh_hk: 經典時間序列分解：長期趨勢、季節性與隨機衝擊
objective_en: Decompose a retail time series into trend, seasonal, and irregular components; distinguish additive from multiplicative forms; and interpret adjusted results without making causal claims.
objective_zh: 将零售时间序列分解为趋势、季节性与不规则成分，区分加法和乘法形式，并在不作因果断言的前提下解释调整结果。
objective_zh_hk: 將零售時間序列分解成趨勢、季節性同不規則成分，區分加法同乘法形式，並喺唔作因果斷言嘅前提下解讀調整結果。
glossary:
  - en: Time-Series Decomposition
    zh: 时间序列分解
    zh_hk: 時間序列分解
    lock: true
  - en: Secular Trend
    zh: 长期趋势
    zh_hk: 長期趨勢
    lock: true
  - en: Seasonal Index
    zh: 季节性指数（周期因子）
    zh_hk: 季節性指數（週期因子）
    lock: true
  - en: Irregular Shock
    zh: 不规则冲击（随机扰动）
    zh_hk: 不規則衝擊（隨機擾動）
