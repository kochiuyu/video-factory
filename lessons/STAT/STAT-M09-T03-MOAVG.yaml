id: STAT-M09-T03-MOAVG
course: STAT-M09
course_en: Business Time Series & Demand Forecasting
course_zh: 商业时间序列与需求预测
course_zh_hk: 商業時間序列與需求預測
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Moving Averages: Filtering Noise from Daily Roastery Demand'
title_zh: 移动平均法：过滤烘焙工坊的每日需求噪声
title_zh_hk: 移動平均法：過濾烘焙工坊嘅每日需求雜音
objective_en: Construct trailing and centered moving averages, explain the smoothing-responsiveness trade-off, and use smoothed demand as one input to capacity planning without treating it as a complete operating policy.
objective_zh: 构建滞后式与中心移动平均，解释平滑性与响应速度之间的权衡，并把平滑需求作为产能规划的一项输入，而不是完整的运营政策。
objective_zh_hk: 構建滯後式同中心移動平均，解釋平滑度同反應速度之間嘅權衡，並將平滑需求當成產能規劃嘅其中一項輸入，而唔係完整營運政策。
