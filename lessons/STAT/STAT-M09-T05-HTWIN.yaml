id: STAT-M09-T05-HTWIN
course: STAT-M09
course_en: Business Time Series & Demand Forecasting
course_zh: 商业时间序列与需求预测
course_zh_hk: 商業時間序列與需求預測
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Holt-Winters Forecasting: Level, Trend, and Day-of-Week Seasonality'
title_zh: 霍尔特-温特斯预测：水平、趋势与星期季节性
title_zh_hk: 霍爾特-溫特斯預測：水平、趨勢同星期季節性
objective_en: Explain multiplicative Holt-Winters forecasting, interpret its level, trend, and seasonal components, and calculate a one-step retail forecast while recognizing model-selection and operational limitations.
objective_zh: 解释乘法霍尔特-温特斯预测，理解水平、趋势与季节成分，并计算零售一步预测，同时识别模型选择与运营限制。
objective_zh_hk: 解釋乘法霍爾特-溫特斯預測，理解水平、趨勢同季節成分，並計算零售一步預測，同時識別模型選擇同營運限制。
glossary:
  - en: Holt-Winters Triple Exponential Smoothing
    zh: 霍尔特-温特斯三重指数平滑
    zh_hk: 霍爾特-溫特斯三重指數平滑
    lock: true
  - en: Level Equation (Alpha)
