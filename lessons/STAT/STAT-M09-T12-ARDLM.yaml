id: STAT-M09-T12-ARDLM
course: STAT-M09
course_en: Business Time Series & Demand Forecasting
course_zh: 商业时间序列与需求预测
course_zh_hk: 商業時間序列與需求預測
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Autoregressive Distributed Lag Models: Internal Persistence and External Drivers'
title_zh: 自回归分布滞后模型：内部持续性与外部驱动因素
title_zh_hk: 自回歸分布滯後模型：內部持續性同外部驅動因素
objective_en: Formulate an ARDL model, distinguish short-run coefficients from the long-run multiplier, calculate an ARDL(1,0) example, and verify dynamic stability and identification before interpreting persistent effects.
objective_zh: 构建 ARDL 模型，区分短期系数与长期乘数，计算 ARDL(1,0) 示例，并在解释持续效应前验证动态稳定性与识别条件。
objective_zh_hk: 構建 ARDL 模型，區分短期係數同長期乘數，計算 ARDL(1,0) 例子，並喺解讀持續效應之前驗證動態穩定性同識別條件。
