id: STAT-M09-T14-OUTOF
course: STAT-M09
course_en: Business Time Series & Demand Forecasting
course_zh: 商业时间序列与需求预测
course_zh_hk: 商業時間序列與需求預測
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Out-of-Sample Rolling Horizons: Testing Forecasts in Time Order'
title_zh: 样本外滚动预测期：按时间顺序检验预测
title_zh_hk: 樣本外滾動預測期：按時間順序檢驗預測
objective_en: Distinguish in-sample fit from out-of-sample forecast performance, conduct rolling-origin evaluation without look-ahead leakage, and connect multi-step demand errors to inventory exposure without treating a forecast metric as an inventory policy.
objective_zh: 区分样本内拟合与样本外预测表现，在没有未来信息泄露的情况下进行滚动原点评估，并把多步需求误差与库存暴露联系起来，而不把预测指标直接当作库存政策。
objective_zh_hk: 區分樣本內擬合同樣本外預測表現，喺冇未來信息洩漏嘅情況下進行滾動原點評估，並將多步需求誤差同庫存暴露聯繫起嚟，而唔係將預測指標直接當成庫存政策。
glossary:
  - en: Out-of-Sample Backtesting
    zh: 样本外回测
    zh_hk: 樣本外回測
    lock: true
  - en: Rolling-Origin Horizon
    zh: 滚动原点预测期
    zh_hk: 滾動原點預測期
    lock: true
  - en: Look-Ahead Data Leakage
    zh: 未来信息泄露（先知偏差）
    zh_hk: 未來信息洩漏（先知偏差）
    lock: true
  - en: Inventory Runout Risk
    zh: 库存见底断货风险
    zh_hk: 庫存見底斷貨風險
    lock: true
quiz:
  - id: Q1
    type: multiple_choice
    question_en: Why is a high in-sample R-squared insufficient evidence of forecast quality?
    question_zh: 为什么较高的样本内 R平方 不足以证明预测质量？
    question_zh_hk: 點解較高嘅樣本內 R平方 唔足以證明預測質素？
    options_en:
      - 'A: It measures fit on observed data and may not generalize to unseen periods'
      - 'B: Any R-squared above 0.90 proves overfitting'
      - 'C: R-squared cannot be calculated for time-series data'
      - 'D: It automatically includes future observations'
    options_zh:
      - A：它衡量已观测数据上的拟合，未必能推广到未见时期
      - B：任何高于 0.90 的 R平方 都证明过拟合
      - C：时间序列数据无法计算 R平方
      - D：它会自动纳入未来观测
    options_zh_hk:
      - A：佢衡量已觀測數據上嘅擬合，未必可以推廣到未見時期
      - B：任何高過 0.90 嘅 R平方 都證明過度擬合
      - C：時間序列數據無法計算 R平方
      - D：佢會自動納入未來觀測
    answer: A
    explanation_en: In-sample fit summarizes performance on data already used or observed. Forecast validity requires evaluation at later origins on observations unavailable when each forecast was produced.
    explanation_zh: 样本内拟合汇总已用于建模或已经观测的数据表现。预测有效性还需在较后原点上，利用每次预测产生时尚不可见的观测进行评估。
    explanation_zh_hk: 樣本內擬合匯總已經用過或者觀測到嘅數據表現。預測有效性仲要喺較後原點，用每次產生預測嗰陣未見到嘅觀測去評估。
  - id: Q2
    type: multiple_choice
    question_en: Which action creates Look-Ahead Data Leakage at forecast origin t?
    question_zh: 在预测原点 t，哪项操作会造成未来信息泄露（先知偏差）？
    question_zh_hk: 喺預測原點 t，邊項操作會造成未來信息洩漏（先知偏差）？
    options_en:
      - 'A: Scaling the training data with a mean calculated from the full series, including later test observations'
      - 'B: Using observations available on or before t'
      - 'C: Producing forecasts for several future horizons'
      - 'D: Reporting errors in kilograms'
    options_zh:
      - A：使用包含较后测试观测的全序列均值来标准化训练数据
      - B：使用在 t 时点或之前已经可得的观测
      - C：为多个未来预测期产生预测
      - D：以公斤报告误差
    options_zh_hk:
      - A：使用包含較後測試觀測嘅全序列平均數去標準化訓練數據
      - B：使用喺 t 時點或之前已經可得嘅觀測
      - C：為多個未來預測期產生預測
      - D：用公斤報告誤差
    answer: A
    explanation_en: Leakage occurs when fitting, preprocessing, tuning, or feature construction at origin t uses information that would only become available after t.
    explanation_zh: 如果在原点 t 的拟合、预处理、调参或特征构建使用了 t 之后才会出现的信息，就构成信息泄露。
    explanation_zh_hk: 如果喺原點 t 嘅擬合、預處理、調參或者特徵構建，用咗 t 之後先會出現嘅信息，就構成信息洩漏。
beats:
  - id: hook
    visual: title_card
    seconds: 30
    kicker_en: Forecast Validation Puzzle
    kicker_zh: 预测验证难题
    kicker_zh_hk: 預測驗證難題
    title_en: Can a Model Fit History Well but Forecast Poorly?
    title_zh: 模型可以很好地拟合历史，却预测很差吗？
    title_zh_hk: 模型可以好好噉擬合歷史，但預測得好差嗎？
    en: >-
      Suppose a demand model fits historical roasting data extremely well. That result describes data the model has already seen; it does not show how the model behaves on a later ordering date. A credible evaluation recreates the information set available at each forecast origin, predicts forward, and scores only observations that were still unknown. The practical question is whether forecast errors remain acceptable at the horizon relevant to replenishment.
    zh: >-
      假设一个需求模型非常贴合历史烘焙数据。这个结果描述的是模型已经看过的数据，不能说明它在较后的订货日期表现如何。可信的评估要重建每个预测原点当时可得的信息集，向前预测，并只对当时仍未知的观测评分。实际问题是，在与补货相关的预测期上，误差是否仍可接受。
    zh_hk: >-
      假設一個需求模型非常貼合歷史烘焙數據。呢個結果描述嘅係模型已經睇過嘅數據，唔可以說明佢喺較後訂貨日期表現點樣。可信嘅評估要重建每個預測原點當時可得嘅信息集，向前預測，並只對當時仍然未知嘅觀測評分。實際問題係，喺同補貨相關嘅預測期上，誤差係咪仍然可以接受。
  - id: define
    visual: definition_card
    seconds: 34
    formula: 'Fit through origin t; forecast t + 1 through t + h; score after outcomes arrive; roll forward'
    formula_zh: 截至原点 t 拟合；预测 t + 1 至 t + h；结果出现后评分；再滚动前移
    formula_zh_hk: 截至原點 t 擬合；預測 t + 1 至 t + h；結果出現後評分；再滾動前移
    formula_tex: '\mathcal{T}_t=\{1,\ldots,t\},\quad \hat{Y}_{t+1|t},\ldots,\hat{Y}_{t+h|t}'
    s1_en: Out-of-Sample Backtesting evaluates forecasts on observations excluded from fitting at that origin. A Rolling-Origin Horizon repeats the exercise at successive dates, using either an expanding training window or a deliberately specified sliding window.
    s1_zh: 样本外回测在每个原点上，使用未参与该次拟合的观测评估预测。滚动原点预测期会在连续日期重复这一过程，可采用扩展训练窗口，也可采用事先明确的滑动窗口。
    s1_zh_hk: 樣本外回測喺每個原點，用冇參與嗰次擬合嘅觀測評估預測。滾動原點預測期會喺連續日期重複呢個過程，可以採用擴展訓練窗口，亦可以採用事先講清楚嘅滑動窗口。
    s2_en: Look-Ahead Data Leakage occurs whenever fitting or preprocessing at origin t uses later information. Scaling, imputation, feature selection, hyperparameter tuning, and event coding must therefore be performed using only information available by that origin.
    s2_zh: 只要原点 t 的拟合或预处理使用了较后信息，就会发生未来信息泄露（先知偏差）。因此，标准化、缺失值处理、特征选择、超参数调整与事件编码都只能使用截至该原点可得的信息。
    s2_zh_hk: 只要原點 t 嘅擬合或者預處理用咗較後信息，就會發生未來信息洩漏（先知偏差）。所以，標準化、缺失值處理、特徵選擇、超參數調整同事件編碼，都只可以使用截至嗰個原點可得嘅信息。
  - id: mechanics
    visual: two_column
    seconds: 36
    left_en: One-Step vs Multi-Step
    left_zh: 一步与多步评估
    left_zh_hk: 一步同多步評估
    right_en: Demand Error vs Inventory Risk
    right_zh: 需求误差与库存风险
    right_zh_hk: 需求誤差同庫存風險
    s1_en: Forecast accuracy often changes with horizon, so report errors separately for one step ahead, two steps ahead, and later horizons. Averaging all horizons together can hide where a model deteriorates.
    s1_zh: 预测准确度通常会随预测期变化，因此应分别报告一步、两步及更远预测期的误差。把所有预测期混合平均，可能掩盖模型从哪里开始恶化。
    s1_zh_hk: 預測準確度通常會隨預測期改變，所以要分開報告一步、兩步同更遠預測期嘅誤差。將所有預測期混埋平均，可能掩蓋模型由邊度開始變差。
    s2_en: Multi-step errors do not automatically compound mathematically. Inventory exposure arises when forecast errors accumulate through the stock-balance equation across the replenishment lead time, together with receipts, starting stock, and operating rules.
    s2_zh: 多步误差不会自动在数学上复合放大。只有当预测误差通过补货提前期内的库存平衡方程累积，并与到货量、期初库存及运营规则共同作用时，才形成库存暴露。
    s2_zh_hk: 多步誤差唔會自動喺數學上複合放大。只有當預測誤差透過補貨提前期內嘅庫存平衡方程累積，並同到貨量、期初庫存同營運規則一齊作用，先會形成庫存暴露。
    s3_en: Inventory Runout Risk cannot be inferred from forecast error alone. It also depends on starting inventory, safety stock, scheduled receipts, lead-time uncertainty, service targets, perishability, and the costs of shortage and excess.
    s3_zh: 库存见底断货风险不能仅由预测误差推出。它还取决于期初库存、安全库存、计划到货、提前期不确定性、服务目标、易腐性，以及缺货与过量成本。
    s3_zh_hk: 庫存見底斷貨風險唔可以單靠預測誤差推斷。佢仲取決於期初庫存、安全庫存、計劃到貨、提前期不確定性、服務目標、易腐性，以及缺貨同過量成本。
  - id: example
    visual: example
    seconds: 36
    setup_en: 'Assume observations through Day 300 and forecast horizon h = 14'
    setup_zh: 假设已有截至第 300 天的观测，预测期 h = 14
    setup_zh_hk: 假設已有截至第 300 日嘅觀測，預測期 h = 14
    result_en: 'First origin: train through 300, forecast Days 301–314'
    result_zh: 首个原点：训练至第 300 天，预测第 301–314 天
    result_zh_hk: 首個原點：訓練至第 300 日，預測第 301–314 日
    s1_en: For illustration, assume data are available through Day 300 and procurement requires a fourteen-day horizon. At origin 300, fit every transformation and model component using only Days 1 through 300, then issue forecasts for Days 301 through 314.
    s1_zh: 为便于说明，假设数据已更新至第 300 天，而采购需要十四天预测期。在原点 300，所有变换与模型成分都只能使用第 1 至 300 天的数据拟合，再产生第 301 至 314 天的预测。
    s1_zh_hk: 為咗方便說明，假設數據已更新到第 300 日，而採購需要十四日預測期。喺原點 300，所有變換同模型成分都只可以使用第 1 至 300 日嘅數據擬合，再產生第 301 至 314 日嘅預測。
    s2_en: After Day 301 becomes observable, move the origin to 301, update the model according to the predetermined protocol, and forecast Days 302 through 315. Repeat only while a complete evaluation horizon is available.
    s2_zh: 第 301 天变为可观测后，把原点移至 301，按照预先确定的规则更新模型，再预测第 302 至 315 天。只有在完整评估预测期可得时才继续重复。
    s2_zh_hk: 第 301 日變成可觀測之後，將原點移到 301，按照預先定好嘅規則更新模型，再預測第 302 至 315 日。只有完整評估預測期可得嗰陣，先繼續重複。
    s3_en: Score each horizon separately and retain the signed errors for inventory simulation. Do not choose safety stock from one cumulative error alone; simulate the stock balance under candidate policies and relevant uncertainty.
    s3_zh: 应分别评价每个预测期，并保留带方向的误差用于库存模拟。不要依据一个累计误差直接决定安全库存；应在候选政策与相关不确定性下模拟库存平衡。
    s3_zh_hk: 要分開評價每個預測期，並保留有方向嘅誤差用嚟做庫存模擬。唔好根據一個累計誤差直接決定安全庫存；要喺候選政策同相關不確定性之下模擬庫存平衡。
  - id: takeaway
    visual: takeaway
    seconds: 32
    q1_en: What Does Rolling Backtesting Reveal?
    q1_zh: 滚动回测揭示什么？
    q1_zh_hk: 滾動回測揭示乜嘢？
    q2_en: Decision Rule
    q2_zh: 决策规则
    q2_zh_hk: 決策規則
    s1_en: Rolling backtesting reveals how a forecasting procedure performs when repeatedly restricted to information available at each historical origin. It evaluates the entire procedure, including preprocessing and tuning, not just one fitted equation.
    s1_zh: 滚动回测揭示预测程序在每个历史原点都只能使用当时可得信息时的表现。它评估的是包括预处理与调参在内的完整程序，而不只是某一个拟合方程。
    s1_zh_hk: 滾動回測揭示預測程序喺每個歷史原點都只可以使用當時可得信息嗰陣嘅表現。佢評估嘅係包括預處理同調參在內嘅完整程序，而唔只係某一條擬合方程。
    s2_en: Match the backtest horizon, update frequency, and information availability to the intended operating decision. Compare models on identical origins and horizons, inspect signed errors, and report uncertainty.
    s2_zh: 应使回测预测期、更新频率与信息可得性符合实际运营决策。在相同原点与预测期上比较模型，检查带方向误差，并报告不确定性。
    s2_zh_hk: 要令回測預測期、更新頻率同信息可得性符合實際營運決策。喺相同原點同預測期上比較模型，檢查有方向嘅誤差，並報告不確定性。
    s3_en: Use backtest results as evidence for forecast selection, then evaluate inventory policies with stock-balance inputs and costs. High in-sample fit alone neither validates a forecast nor determines procurement.
    s3_zh: 应把回测结果作为选择预测方法的证据，再结合库存平衡输入与成本评估库存政策。较高的样本内拟合本身既不能验证预测，也不能决定采购。
    s3_zh_hk: 應該將回測結果當成選擇預測方法嘅證據，再結合庫存平衡輸入同成本評估庫存政策。較高嘅樣本內擬合本身既唔可以驗證預測，亦唔可以決定採購。
