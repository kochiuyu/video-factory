id: STAT-M10-T01-COUNT
course: STAT-M10
course_en: Applied A/B Testing & Digital Experimentation
course_zh: 商业应用 A/B 测试与数字化实验
course_zh_hk: 商業應用 A/B 測試與數碼化實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'The Counterfactual Ideal: Why Randomization Defeats Observational Bias'
title_zh: 反事实理想：为何随机化能彻底瓦解观测偏差
title_zh_hk: 反事實理想：點解隨機化可以徹底擊破觀測偏差
objective_en: Formulate the Potential Outcomes Framework, mathematically decompose observational comparisons into Average Treatment Effect and Selection Bias, and prove why randomized assignment eliminates confounding.
objective_zh: 构建潜在结果分析框架，在数学上将观测差值严格分解为平均处理效应与选择偏差，并证明随机分组为何能彻底根除混杂因素。
objective_zh_hk: 構建潛在結果分析架構，喺數學上將觀測差值嚴格分解做平均處理效應同選擇偏差，並證明隨機分組點樣徹底消除混淆變量。
