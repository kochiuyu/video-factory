id: STAT-M10-T10-FACTR
course: STAT-M10
course_en: Applied A/B Testing & Digital Experimentation
course_zh: 商业应用 A/B 测试与数字化实验
course_zh_hk: 商業應用 A/B 測試與數碼化實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: '2x2 Factorial Designs: Main Effects and Interactions'
title_zh: 2x2 全析因实验：主效应与交互效应
title_zh_hk: 2x2 全析因實驗：主效應同交互效應
objective_en: Construct a 2x2 factorial design, interpret treatment-coded main and interaction coefficients, compute cell contrasts, and plan power separately for main effects and interactions.
objective_zh: 构建 2x2 全析因实验，解释处理编码下的主效应与交互系数，计算单元格对比，并分别为主效应与交互效应规划功效。
objective_zh_hk: 構建 2x2 全析因實驗，解釋處理編碼之下嘅主效應同交互系數，計算單元格對比，並分別為主效應同交互效應規劃功效。
