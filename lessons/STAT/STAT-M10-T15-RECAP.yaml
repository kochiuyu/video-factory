id: STAT-M10-T15-RECAP
course: STAT-M10
course_en: Applied A/B Testing & Digital Experimentation
course_zh: 商业应用 A/B 测试与数字化实验
course_zh_hk: 商業應用 A/B 測試與數碼化實驗
audience: first-year business students
audience_en: first-year business students
audience_zh: 商学院一年级学生
audience_zh_hk: 商學院一年級學生
duration_target_s: 168
title_en: 'Executive Experimentation Playbook: Synthesis and Platform Governance'
title_zh: 数字化实验管理手册：综合复盘与平台治理
title_zh_hk: 數碼化實驗管理手冊：綜合複盤同平台治理
objective_en: Synthesize the course into a five-gate experimentation governance scorecard that evaluates design validity, execution integrity, statistical readiness, decision quality, and operational safety before rollout or investment.
objective_zh: 将课程内容综合为五阶实验治理计分卡，在推广或投资前评估设计有效性、执行完整性、统计准备度、决策质量与运营安全。
objective_zh_hk: 將課程內容綜合成五階實驗治理計分卡，喺推廣或者投資之前評估設計有效性、執行完整性、統計準備度、決策質素同營運安全。
