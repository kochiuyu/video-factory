  image: art/h02-practice.png
  title_en: |
    To stay awake for long practice
    In Tang and Song monasteries, tea was a way to stay awake through long, shared sits.
  title_zh: |
    为了在长坐里保持清醒
    在唐宋禅寺里，茶是给大家一起长时间修行用的。
  title_zh_hk: |
    為了在長坐裏保持清醒
    在唐宋禪寺裏，茶是給大家一起長時間修行用的。
  en: In Tang and Song monasteries, tea was a way to stay awake for long, shared practice.
  zh: 在唐宋的禅寺里，茶是为了让大家在长时间的共修里保持清醒。
  zh_hk: 喺唐宋嘅禪寺裏面，茶係為咗等大家喺長時間一齊修行嘅時候，保持清醒。
