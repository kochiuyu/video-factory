id: TEA-S-H05-CHEAP-BAG-9x16
format: "9:16"
clock: own
title_en: A cheap bag's past
title_zh: 便宜茶包的过去
title_zh_hk: 便宜茶包的過去
duration_target_s: 60
beats:
- id: hook
  visual: title_card
  seconds: 8
  title_en: |
    Why is a supermarket tea bag so cheap?
    The price is easy to overlook.
  title_zh: |
    超市里的茶包，为什么这么便宜？
    这个价钱，很容易让人看漏。
  title_zh_hk: |
    超市裏的茶包，為什麼這麼便宜？
    這個價錢，很容易讓人看漏。
  en: Why is a supermarket tea bag so cheap? The price is easy to overlook.
  zh: 超市里的茶包，为什么这么便宜？这个价钱，很容易让人看漏。
  zh_hk: 超市裏嘅茶包，點解會咁便宜？呢個價錢，好容易就畀人睇漏。
- id: past
  visual: still_image
  seconds: 8
  image: art/h05-past.png
  title_en: |
    That cheapness has a past
    The question is who controlled the leaf, and what that control cost.
  title_zh: |
    这份便宜，背后有一段过去
    要问的是：谁掌握了这片叶子，以及这份掌控让人付了什么代价。
  title_zh_hk: |
    這份便宜，背後有一段過去
    要問的是：誰掌握了這片葉子，以及這份掌控讓人付了什麼代價。
  en: That cheapness has a geopolitical past. This lesson asks who controlled the leaf, and what that control cost.
  zh: 这份便宜，背后是一段地缘政治。要问的是：谁掌握了这片叶子，以及这份掌控，到底让人付了什么代价。
  zh_hk: 呢份便宜，背後係一段地緣政治。要問嘅係：邊個掌握咗呢片葉子，以及呢份掌握，到底叫人付咗乜代價。
- id: exchange
  visual: still_image
  seconds: 8
  image: art/h05-exchange.png
  title_en: |
    Silver east, opium west
    Then war, and then colonial plantations. Canton was not an open marketplace.
  title_zh: |
    白银向东，鸦片西来
    然后是战争，再然后是殖民地的种植园。那时的广州，并不是一个随便进出的市场。
  title_zh_hk: |
    白銀向東，鴉片西來
    然後是戰爭，再然後是殖民地的種植園。那時的廣州，並不是一個隨便進出的市場。
  en: The path is silver east, opium west, then war, and then colonial plantations. Canton funneled the trade through licensed merchants; that channel was not an open marketplace.
  zh: 大致的路是：白银向东，鸦片西来，然后是战争，再然后是殖民地的种植园。广州的贸易由特许的行商经手，并不是一个随便进出的市场。
  zh_hk: 大致嘅路係：白銀向東，鴉片西來，然後係戰爭，再然後係殖民地嘅種植園。廣州嘅貿易由特許行商經手，並唔係一個隨便進出嘅市場。
- id: takeaway
  visual: title_card
  seconds: 8
  title_en: |
    A cheap bag, an expensive past
    That does not mean tea alone caused those wars.
  title_zh: |
    便宜的茶包，昂贵的过去
    但不能说，单凭茶叶就引发了那些战争。
  title_zh_hk: |
    便宜的茶包，昂貴的過去
    但不能說，單憑茶葉就引發了那些戰爭。
  en: A cheap supermarket bag has an expensive past. That does not mean tea alone caused those wars.
  zh: 超市里便宜的茶包，背后是一段昂贵的过去。但不能说，单凭茶叶就引发了那些战争。
  zh_hk: 超市裏便宜嘅茶包，背後係一段昂貴嘅過去。但不能夠話，單憑茶葉就引發咗嗰啲戰爭。
