id: TEA-S-T01-SIX-FAMILIES-9x16
format: "9:16"
title_en: One plant, six families
title_zh: 同一种茶树，六类加工路线
title_zh_hk: 同一種茶樹，六類加工路線
duration_target_s: 60
beats:
- id: hook
  visual: still_image
  seconds: 12
  image: art/plant.png
  title_en: |
    One plant, six families
    Green tea and black tea usually come from the same plant. The difference is how the leaves are processed.
  title_zh: |
    同一种茶树，六类加工路线
    绿茶和红茶，多半来自同一种茶树。差别在采收之后怎么做，不在是不是另一种植物。
  title_zh_hk: |
    同一種茶樹，六類加工路線
    綠茶和紅茶，多半來自同一種茶樹。差別在採收之後怎麼做，不在是不是另一種植物。
  en: Green tea and black tea usually come from the same plant. The difference is how the leaves are processed.
  zh: 绿茶和红茶，多半来自同一种茶树。差别在采收之后怎么做，不在是不是另一种植物。
  zh_hk: 綠茶和紅茶，多半來自同一種茶樹。差別在採收之後怎麼做，不在是不是另一種植物。
- id: green
  visual: still_image
  seconds: 7
  image: art/green.png
  title_en: |
    Green tea
    Heat the leaf early so it does not brown.
  title_zh: |
    绿茶
    早点把叶子加热，不让它变褐。
  title_zh_hk: |
    綠茶
    早點把葉子加熱，不讓它變褐。
  en: Heat the leaf early so it does not brown.
  zh: 早点把叶子加热，不让它变褐。
  zh_hk: 早點把葉子加熱，不讓它變褐。
- id: yellow
  visual: still_image
  seconds: 7
  image: art/yellow.png
  title_en: |
    Yellow tea
    Heated early, then kept warm and damp until it turns yellow.
  title_zh: |
    黄茶
    先加热，再温热闷黄，叶子才会变黄。
  title_zh_hk: |
    黃茶
    先加熱，再溫熱悶黃，葉子才會變黃。
  en: Heated early, then kept warm and damp until it turns yellow.
  zh: 先加热，再温热闷黄，叶子才会变黄。
  zh_hk: 先加熱，再溫熱悶黃，葉子才會變黃。
- id: white
  visual: still_image
  seconds: 7
  image: art/white.png
  title_en: |
    White tea
    Wither, then dry. Not heated early like green tea.
  title_zh: |
    白茶
    让叶子萎凋，再干燥。不是绿茶那种先加热的做法。
  title_zh_hk: |
    白茶
    讓葉子萎凋，再乾燥。不是綠茶那種先加熱的做法。
  en: Wither, then dry. Not heated early like green tea.
  zh: 让叶子萎凋，再干燥。不是绿茶那种先加热的做法。
  zh_hk: 讓葉子萎凋，再乾燥。不是綠茶那種先加熱的做法。
- id: oolong
  visual: still_image
  seconds: 7
  image: art/oolong.png
  title_en: |
    Oolong
    Bruised and only partly browned. How far that goes can vary.
  title_zh: |
    乌龙茶
    把叶子做青，只让它部分变褐。程度会因做法而不同。
  title_zh_hk: |
    烏龍茶
    把葉子做青，只讓它部分變褐。程度會因做法而不同。
  en: Bruised and only partly browned. How far that goes can vary.
  zh: 把叶子做青，只让它部分变褐。程度会因做法而不同。
  zh_hk: 把葉子做青，只讓它部分變褐。程度會因做法而不同。
- id: black
  visual: still_image
  seconds: 7
  image: art/black.png
  title_en: |
    Black tea
    Rolled or cut so the leaves can brown much more.
  title_zh: |
    红茶
    揉捻或切碎以后，让叶子充分变褐。
  title_zh_hk: |
    紅茶
    揉捻或切碎以後，讓葉子充分變褐。
  en: Rolled or cut so the leaves can brown much more.
  zh: 揉捻或切碎以后，让叶子充分变褐。
  zh_hk: 揉捻或切碎以後，讓葉子充分變褐。
- id: dark
  visual: still_image
  seconds: 7
  image: art/dark.png
  title_en: |
    Dark tea
    Fermented and aged. Ripe Pu-erh is one example.
  title_zh: |
    黑茶
    这一支会发酵、会陈化。熟普洱是清楚的例子。
  title_zh_hk: |
    黑茶
    這一支會發酵、會陳化。熟普洱是清楚的例子。
  en: Fermented and aged. Ripe Pu-erh is one example.
  zh: 这一支会发酵、会陈化。熟普洱是清楚的例子。
  zh_hk: 這一支會發酵、會陳化。熟普洱是清楚的例子。
- id: close
  visual: title_card
  seconds: 6
  title_en: |
    Six families
    Not six steps on one scale.
  title_zh: |
    六类并列的路线
    不是一条从绿到黑的刻度。
  title_zh_hk: |
    六類並列的路線
    不是一條從綠到黑的刻度。
  en: Not six steps on one scale.
  zh: 不是一条从绿到黑的刻度。
  zh_hk: 不是一條從綠到黑的刻度。
