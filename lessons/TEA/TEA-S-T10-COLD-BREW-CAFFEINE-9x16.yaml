  en: Cold brewing still extracts caffeine. Cold slows extraction. It does not remove caffeine.
  zh: 冷泡还是会泡出咖啡因。冷水只是让抽出变慢。它不会把咖啡因去掉。
  zh_hk: 冷泡都仲會泡出咖啡因。凍水只係令抽出慢咗。佢唔會將咖啡因去掉。
- id: takeaway
  visual: still_image
  seconds: 8
  image: art/t10-takeaway.png
  title_en: |
