  en: Cold does not make tea caffeine-free. Cold is a method, not decaffeination.
  zh: 冷水不会让茶变成无咖啡因。冷说的是泡法，不是去咖啡因。
  zh_hk: 凍水唔會令茶變成無咖啡因。凍講嘅係泡法，唔係去咖啡因。
