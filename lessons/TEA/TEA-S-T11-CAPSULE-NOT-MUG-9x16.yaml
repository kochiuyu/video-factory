  en: Does a study capsule match your mug?
  zh: 研究里的胶囊，是你这杯茶吗？
  zh_hk: 研究入面嘅膠囊，係咪你嗰杯茶？
- id: capsule
  visual: still_image
  seconds: 8
  image: art/t11-capsule.png
  title_en: |
    200 mg L-theanine
    Not your mug.
  title_zh: |
    200毫克
    茶氨酸，不是这杯茶。
  title_zh_hk: |
    200毫克
    茶氨酸，不是這杯茶。
  en: A capsule of L-theanine. The dose was 200 mg. That capsule is not your mug. Often much stronger than one mug.
  zh: 那是一颗茶氨酸胶囊。剂量是200毫克。那颗胶囊不是你这杯茶。往往比平常一杯浓很多。
  zh_hk: 嗰粒係茶氨酸膠囊。劑量係200毫克。嗰粒膠囊唔係你嗰杯茶。往往比平常一杯濃好多。
- id: takeaway
  visual: still_image
  seconds: 8
  image: art/t11-takeaway.png
  title_en: |
    Your mug varies
    Leaf, water, and time.
  title_zh: |
    你这杯会变
    叶子、水，还有时间。
  title_zh_hk: |
    你這杯會變
    葉子、水，還有時間。
  en: A study capsule is not your mug. The amount in a mug changes with the leaf, the water, and the time. This is not a drinking recommendation.
  zh: 研究用的胶囊不是你这杯茶。一杯茶的量会变，要看叶子、水和时间。这不是饮用建议。
  zh_hk: 研究用嘅膠囊唔係你嗰杯茶。一杯茶嘅量會變，要睇葉子、水和時間。呢個唔係飲用建議。
