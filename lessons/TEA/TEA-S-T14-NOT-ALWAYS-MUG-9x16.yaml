  en: Powdered tea was whisked in a bowl. That was the Song period. That is not today's grocery matcha.
  zh: 宋朝的末茶，是在碗里点茶、把粉末搅开。那不是今天货架上的抹茶。
  zh_hk: 宋朝嘅末茶，係喺碗入面點茶，將粉末攪開。嗰個唔係今日貨架上嘅抹茶。
