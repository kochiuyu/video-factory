  en: Early tea was often a bitter soup. Later, cake tea was roasted, ground, and boiled.
  zh: 更早的茶，常常是一碗苦汤。后来的饼茶要烤、磨，再煮。
  zh_hk: 更早嘅茶，好多時係一碗苦湯。後來嘅餅茶要烤、磨，再煮。
