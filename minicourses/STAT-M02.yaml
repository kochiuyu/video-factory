id: STAT-M02
kind: minicourse
course: statistics
course_en: Business Probability Foundations
course_zh: 商务概率基础
course_zh_hk: 商務概率基礎
title_en: Probability for a coffee chain
title_zh: 咖啡连锁的商务概率
title_zh_hk: 咖啡連鎖嘅商務概率
objective_en: 'Fifteen standalone shorts on one coffee-chain ledger: sample space, combining events, trees, Bayes, and expected value with variance. Build each short on its own. This collection does not join them into one video.'
objective_zh: 围绕同一份咖啡连锁台账的十五节独立短课：样本空间、事件组合、概率树、贝叶斯，以及期望值与方差。每节单独制作。本集合不把它们拼成一条视频。
objective_zh_hk: 圍繞同一份咖啡連鎖台賬嘅十五節獨立短課：樣本空間、事件組合、概率樹、貝葉斯，以及期望值與方差。每節單獨製作。本集合唔會將佢哋拼成一條片。
syllabus: docs/courses/STAT-M02.md
duration_note: Each short is about 150–170 seconds. The collection is not a 5–10 minute module.
