title_en: Applications
title_zh: 谁付钱
title_zh_hk: 邊個畀錢
objective_en: Ask who pays on this corridor. A parcel pays for road delay; an AED pays for medical minutes; inspection pays to keep a person off the structure.
objective_zh: 问这条线上谁付钱。包裹付的是路上的延误；AED 付的是医疗钟上的分钟；巡检付的是不让人爬上去。
objective_zh_hk: 問呢條線上邊個畀錢。包裹付嘅係路上嘅延誤；AED 付嘅係醫療鐘上嘅分鐘；巡檢付嘅係唔讓人爬上去。
